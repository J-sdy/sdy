  {q:&quot;The 1919 Act created a Bicameral Legislature at the Centre. What were the two Houses?&quot;,o:[&quot;Lok Sabha and Rajya Sabha&quot;,&quot;Legislative Assembly (lower) and Council of State (upper)&quot;,&quot;Federal Assembly and Council of Princes&quot;,&quot;House of Commons and House of Lords&quot;],c:1,e:&quot;The &lt;strong&gt;Montagu-Chelmsford Reforms 1919 created a Bicameral Legislature at the Centre&lt;/strong&gt;: (1) &lt;strong&gt;Legislative Assembly&lt;/strong&gt; (lower house); (2) &lt;strong&gt;Council of State&lt;/strong&gt; (upper house). This was the precursor to the modern Parliament of India.&quot;},
  {q:&quot;The 1919 Act provided for a Statutory Commission after 10 years to review progress. This eventually became:&quot;,o:[&quot;Cabinet Mission (1946)&quot;,&quot;Hunter Commission&quot;,&quot;Simon Commission (1927–28)&quot;,&quot;Cripps Mission (1942)&quot;],c:2,e:&quot;The &lt;strong&gt;1919 Act&#x27;s provision for a Statutory Commission after 10 years&lt;/strong&gt; materialised as the &lt;strong&gt;Simon Commission (1927–28)&lt;/strong&gt;. Significantly, it had NO Indian members — this caused widespread protests and the slogan &#x27;Simon Go Back.&#x27; It eventually reported in 1930.&quot;},
  {q:&quot;The Government of India Act 1935 is remembered by the mnemonic F-P-D. What do these letters stand for?&quot;,o:[&quot;Finance, Province, District&quot;,&quot;Federation + Provincial Autonomy + Dyarchy at Centre&quot;,&quot;Federal Court, Provinces, Dyarchy&quot;,&quot;Federation, Parliament, Democracy&quot;],c:1,e:&quot;&lt;strong&gt;F-P-D = Federation + Provincial Autonomy + Dyarchy at Centre&lt;/strong&gt;. The GOI Act 1935: (F) Proposed an &lt;strong&gt;All India Federation&lt;/strong&gt; (never implemented); (P) Granted &lt;strong&gt;Provincial Autonomy&lt;/strong&gt; — provinces became separate legal entities; (D) Introduced &lt;strong&gt;Dyarchy at the Centre&lt;/strong&gt; (defence and external affairs reserved for GG).&quot;},
  {q:&quot;Under the GOI Act 1935, provinces received their authority directly from:&quot;,o:[&quot;The Governor-General of India&quot;,&quot;The Secretary of State&quot;,&quot;The British Crown (directly — not via GG)&quot;,&quot;The Parliament of Britain&quot;],c:2,e:&quot;Under the &lt;strong&gt;GOI Act 1935, provinces derived their authority directly from the British Crown&lt;/strong&gt; — not through the GG. This was a major shift making provinces &lt;strong&gt;separate legal entities&lt;/strong&gt; for the first time. Provinces now had their own executive (Governor + Council of Ministers).&quot;},
  {q:&quot;The GOI Act 1935 separated Burma from India. What other major judicial institution was created by this Act?&quot;,o:[&quot;Supreme Court of India&quot;,&quot;Federal Court of India&quot;,&quot;Privy Council of India&quot;,&quot;High Court of India&quot;],c:1,e:&quot;The &lt;strong&gt;GOI Act 1935 established the Federal Court of India&lt;/strong&gt; (separate from the Privy Council in London). The Federal Court was established in 1937 and served as the highest court in India until it was replaced by the Supreme Court of India after independence (1950).&quot;},
  {q:&quot;The Shimla Deputation of 1906, which led to the Minto-Morley Reforms, demanded which specific provision?&quot;,o:[&quot;Women&#x27;s suffrage&quot;,&quot;Provincial Autonomy&quot;,&quot;Separate electorates for Muslims&quot;,&quot;Abolition of EIC&quot;],c:2,e:&quot;The &lt;strong&gt;Shimla Deputation (1906)&lt;/strong&gt; — a Muslim delegation led by the Aga Khan that met Viceroy Lord Minto — specifically demanded &lt;strong&gt;separate electorates for Muslims&lt;/strong&gt;. Their demand was accepted and implemented in the &lt;strong&gt;Minto-Morley Reforms 1909&lt;/strong&gt;. This Deputation also preceded the founding of the Muslim League in 1906.&quot;},
  {q:&quot;Under the GOI Act 1935, bicameral legislatures were established in 6 provinces. Which set is CORRECT?&quot;,o:[&quot;Bengal, Madras, Bombay, UP, Punjab, Assam&quot;,&quot;Bengal, Madras, Bombay, UP, Bihar, Assam&quot;,&quot;Madras, Bombay, UP, CP, Bihar, Assam&quot;,&quot;Punjab, Bengal, NW Provinces, UP, Bihar, Assam&quot;],c:1,e:&quot;Bicameral legislatures were established in &lt;strong&gt;6 provinces&lt;/strong&gt; under the GOI Act 1935: &lt;strong&gt;Bengal, Madras, Bombay, UP, Bihar, and Assam&lt;/strong&gt;. These were the larger, more populous provinces. The remaining provinces had unicameral legislatures.&quot;},
],

gg_bengal:[
  {q:&quot;Warren Hastings (1773–1785) was the first Governor-General of Bengal. His Ring Fence Policy used which state as a crucial buffer for Bengal&#x27;s security?&quot;,o:[&quot;Mysore&quot;,&quot;Hyderabad&quot;,&quot;Awadh&quot;,&quot;Marathas&quot;],c:2,e:&quot;Warren Hastings&#x27; &lt;strong&gt;Ring Fence Policy&lt;/strong&gt; used &lt;strong&gt;Awadh&lt;/strong&gt; as the crucial buffer state for Bengal&#x27;s security. The policy aimed to protect Bengal (the core) by maintaining buffer states around it. Wars with Mysore and the Marathas were fought to maintain this protective ring.&quot;},
  {q:&quot;Warren Hastings established the Supreme Court at Calcutta in 1774. Which Act enabled this?&quot;,o:[&quot;Pitt&#x27;s India Act 1784&quot;,&quot;Act of Settlement 1781&quot;,&quot;Regulating Act 1773&quot;,&quot;Charter Act 1793&quot;],c:2,e:&quot;The &lt;strong&gt;Regulating Act 1773 enabled the establishment of the Supreme Court at Calcutta&lt;/strong&gt;, which was set up in &lt;strong&gt;1774&lt;/strong&gt;. However, the Court&#x27;s jurisdiction frequently clashed with the GG&#x27;s Council, which was later resolved by the Act of Settlement 1781.&quot;},
  {q:&quot;The Act of Settlement 1781 exempted Warren Hastings and the GG&#x27;s Council from which court&#x27;s jurisdiction in revenue matters?&quot;,o:[&quot;High Court of Calcutta&quot;,&quot;Supreme Court of Calcutta&quot;,&quot;Privy Council in London&quot;,&quot;Court of Directors&quot;],c:1,e:&quot;The &lt;strong&gt;Act of Settlement 1781 exempted the GG and Council from the Supreme Court of Calcutta&#x27;s jurisdiction&lt;/strong&gt;, particularly in revenue matters. This was the first effort in India to separate Executive and Judiciary functions and resolved the power conflict between the two bodies.&quot;},
  {q:&quot;Lord Cornwallis (1786–1793) introduced the Cornwallis Code in 1793. What did it do?&quot;,o:[&quot;Created the Permanent Settlement&quot;,&quot;Introduced the Ryotwari System&quot;,&quot;Separated executive, revenue, and judicial powers (previously all held by District Collector)&quot;,&quot;Abolished the zamindari system&quot;],c:2,e:&quot;The &lt;strong&gt;Cornwallis Code (1793)&lt;/strong&gt; separated the three powers that had been combined in the District Collector: &lt;strong&gt;executive, revenue, and judicial&lt;/strong&gt;. This was a crucial administrative reform. Separate officers were created for each function.&quot;},
  {q:&quot;The Permanent Settlement (1793) under Lord Cornwallis is also known as the Zamindari System. What fraction of revenue did zamindars pay to the government?&quot;,o:[&quot;1/10th (10%)&quot;,&quot;1/11th (they kept)&quot;,&quot;10/11th to govt, kept 1/11th&quot;,&quot;50% each&quot;],c:2,e:&quot;Under the &lt;strong&gt;Permanent Settlement (1793)&lt;/strong&gt;, zamindars paid &lt;strong&gt;10/11th of the revenue to the government&lt;/strong&gt; and kept only &lt;strong&gt;1/11th&lt;/strong&gt; for themselves. The &#x27;Sunset Law&#x27; stated that failure to pay on time would result in the zamindari being auctioned.&quot;},
  {q:&quot;The &#x27;Sunset Law&#x27; under the Permanent Settlement meant:&quot;,o:[&quot;Land revenue was highest in summer&quot;,&quot;No revenue was collected at sunset&quot;,&quot;If zamindars missed the payment deadline, their zamindari was auctioned&quot;,&quot;Revenue was collected only once a year at sunset&quot;],c:2,e:&quot;The &lt;strong&gt;Sunset Law&lt;/strong&gt; under the Permanent Settlement meant: if the zamindar failed to pay revenue by the deadline (sunset), their &lt;strong&gt;zamindari would be immediately auctioned&lt;/strong&gt; to recover the revenue. This was a harsh but effective revenue collection mechanism.&quot;},
  {q:&quot;The Permanent Settlement covered approximately what percentage of British India?&quot;,o:[&quot;5%&quot;,&quot;10%&quot;,&quot;~19% — Bengal, Bihar, and Orissa&quot;,&quot;~51% — most of India&quot;],c:2,e:&quot;The &lt;strong&gt;Permanent Settlement covered approximately 19% of British India&lt;/strong&gt; — primarily Bengal, Bihar, and Orissa. The remaining areas were covered by the Ryotwari System (~51%) and the Mahalwari System.&quot;},
  {q:&quot;Sir John Shore (1793–1798) is known for which policy of non-interference?&quot;,o:[&quot;Ring Fence Policy&quot;,&quot;Subsidiary Alliance&quot;,&quot;Policy of Non-Intervention — avoiding internal affairs of Indian states&quot;,&quot;Policy of Paramountcy&quot;],c:2,e:&quot;&lt;strong&gt;Sir John Shore (1793–1798)&lt;/strong&gt; pursued the &lt;strong&gt;Policy of Non-Intervention&lt;/strong&gt; — refusing to interfere in the internal affairs of Indian states. He avoided expansionist wars and maintained peace. However, this passive policy meant British assistance was not guaranteed even to allies, weakening British influence until Wellesley reversed it.&quot;},
  {q:&quot;Lord Wellesley (1798–1805) introduced the Subsidiary Alliance System in 1798. Which state was the FIRST to sign it?&quot;,o:[&quot;Mysore&quot;,&quot;Awadh&quot;,&quot;Hyderabad (1798)&quot;,&quot;Marathas&quot;],c:2,e:&quot;&lt;strong&gt;Hyderabad (1798)&lt;/strong&gt; was the &lt;strong&gt;first state to sign the Subsidiary Alliance&lt;/strong&gt; under Lord Wellesley. It was then extended to Mysore, Awadh, and the Marathas. The Alliance required Indian rulers to station British troops at their own expense and surrender control of foreign policy.&quot;},
  {q:&quot;Lord Wellesley established the Fort William College in 1800. What was its purpose?&quot;,o:[&quot;Train Indian soldiers&quot;,&quot;Train British civil servants posted to India — teach Indian languages and culture&quot;,&quot;Promote Indian education&quot;,&quot;Research on Indian agriculture&quot;],c:1,e:&quot;&lt;strong&gt;Fort William College (1800)&lt;/strong&gt; was established by Lord Wellesley to train &lt;strong&gt;British civil servants posted to India in Indian languages, history, and culture&lt;/strong&gt;. It was essentially a training school for the British Indian administration, though it was later opposed by the Court of Directors as too expensive.&quot;},
  {q:&quot;Lord Minto I (1807–1813) signed the Treaty of Amritsar in 1809. With whom?&quot;,o:[&quot;The Marathas&quot;,&quot;Nawab of Awadh&quot;,&quot;Maharaja Ranjit Singh of the Sikh Empire&quot;,&quot;Tipu Sultan&quot;],c:2,e:&quot;Lord Minto I signed the &lt;strong&gt;Treaty of Amritsar (1809) with Maharaja Ranjit Singh&lt;/strong&gt; of the Sikh Empire. This treaty fixed the &lt;strong&gt;Sutlej River as the boundary&lt;/strong&gt; between British India and Ranjit Singh&#x27;s Sikh Empire, maintaining peace between the two powers.&quot;},
  {q:&quot;Lord Hastings (1813–1823) introduced the Policy of Paramountcy. This meant:&quot;,o:[&quot;British rule was limited to Bengal&quot;,&quot;British authority was supreme — above all Indian states; right to annex mismanaged kingdoms&quot;,&quot;British treated Indian states as equals&quot;,&quot;British would not interfere in Indian affairs&quot;],c:1,e:&quot;The &lt;strong&gt;Policy of Paramountcy (Lord Hastings, 1813–1823)&lt;/strong&gt;: British authority was declared &lt;strong&gt;SUPREME&lt;/strong&gt; above all Indian states. Key features: (1) &lt;strong&gt;Right to annex&lt;/strong&gt; mismanaged or defiant kingdoms; (2) &lt;strong&gt;End of equality&lt;/strong&gt; — British no longer treated Marathas/Sikhs as equals; (3) Absolute Authority.&quot;},
  {q:&quot;Lord Amherst (1823–1828) is associated with the First Anglo-Burmese War (1824–26). What was its outcome?&quot;,o:[&quot;British expelled from Burma&quot;,&quot;Treaty of Yandabo (1826) — Burma ceded Assam, Manipur, Arakan, Tenasserim&quot;,&quot;Burma captured Bengal&quot;,&quot;British and Burma signed a trade agreement only&quot;],c:1,e:&quot;The &lt;strong&gt;First Anglo-Burmese War (1824–26)&lt;/strong&gt; under Lord Amherst ended with the &lt;strong&gt;Treaty of Yandabo (1826)&lt;/strong&gt;. Burma ceded &lt;strong&gt;Assam, Manipur, Arakan, and Tenasserim&lt;/strong&gt; to British India. Burma also paid a heavy indemnity.&quot;},
],

gg_india:[
  {q:&quot;Lord William Bentinck (1828–1835) abolished which cruel social practice in 1829?&quot;,o:[&quot;Child marriage&quot;,&quot;Sati (the practice of widows self-immolating on their husband&#x27;s funeral pyre)&quot;,&quot;Human sacrifice&quot;,&quot;Untouchability&quot;],c:1,e:&quot;&lt;strong&gt;Lord William Bentinck abolished Sati in 1829&lt;/strong&gt; through Regulation XVII. This was achieved with the active support of social reformers like &lt;strong&gt;Raja Ram Mohan Roy&lt;/strong&gt;. It was a landmark social reform — the first time British law directly interfered with a Hindu religious practice to protect women.&quot;},
  {q:&quot;Bentinck also suppressed the Thuggee (Thagi). Who led this campaign?&quot;,o:[&quot;Lord Cornwallis&quot;,&quot;Sir Charles Napier&quot;,&quot;William Sleeman&quot;,&quot;Warren Hastings&quot;],c:2,e:&quot;The suppression of &lt;strong&gt;Thuggee (Thagi)&lt;/strong&gt; — the hereditary cult of highway robbers — was led by &lt;strong&gt;Colonel William Sleeman&lt;/strong&gt; under Bentinck&#x27;s orders. The Thuggees ritually strangled travellers as a religious offering. Sleeman&#x27;s systematic campaign effectively eliminated this practice.&quot;},
  {q:&quot;Macaulay&#x27;s Minute on Education (1835) under Bentinck advocated which medium of instruction?&quot;,o:[&quot;Sanskrit for higher education&quot;,&quot;Arabic for higher education&quot;,&quot;English replacing Sanskrit and Arabic as medium of higher education&quot;,&quot;Hindi as the national medium&quot;],c:2,e:&quot;&lt;strong&gt;Macaulay&#x27;s Minute (1835)&lt;/strong&gt; advocated &lt;strong&gt;English replacing Sanskrit and Arabic as the medium of higher education&lt;/strong&gt;. Macaulay&#x27;s goal was to produce Indians &lt;strong&gt;&#x27;Indian in blood but English in taste&#x27;&lt;/strong&gt; — essentially colonial clerks. He also endorsed the controversial &lt;strong&gt;Downward Filtration Theory&lt;/strong&gt; — educate only the elite, knowledge would filter down.&quot;},
  {q:&quot;Sir Charles Metcalfe (1835–1836) is called the &#x27;Liberator of the Indian Press&#x27; because:&quot;,o:[&quot;He established the first newspaper in India&quot;,&quot;He abolished restrictive licensing regulations of 1823 — press could now operate with only a declaration of location&quot;,&quot;He gave Indians free press rights&quot;,&quot;He established freedom of speech as a fundamental right&quot;],c:1,e:&quot;&lt;strong&gt;Sir Charles Metcalfe&lt;/strong&gt; abolished the restrictive &lt;strong&gt;Licensing Regulations of 1823&lt;/strong&gt;, which required prior government approval to publish. Under the new Metcalfe Act (Press Act 1835), publications only needed to declare their location. Crucially, he treated &lt;strong&gt;vernacular and English press equally&lt;/strong&gt;.&quot;},
  {q:&quot;Lord Auckland (1836–1842) launched the First Anglo-Afghan War (1838–42). This war ended as:&quot;,o:[&quot;British victory — Afghanistan annexed&quot;,&quot;Stalemate — status quo maintained&quot;,&quot;Disaster — British garrison virtually annihilated in 1842 retreat from Kabul; no territorial gains&quot;,&quot;French helped British win Afghanistan&quot;],c:2,e:&quot;The &lt;strong&gt;First Anglo-Afghan War (1838–42)&lt;/strong&gt; under Lord Auckland was a complete &lt;strong&gt;British disaster&lt;/strong&gt;. The British installed Shah Shuja as puppet ruler, but Afghans rejected him. The &lt;strong&gt;1842 retreat from Kabul resulted in the virtual annihilation of the British garrison&lt;/strong&gt;. Shah Shuja was assassinated and no territorial gains were made.&quot;},
  {q:&quot;Lord Ellenborough (1842–1844) annexed Sindh in 1843 through which commander?&quot;,o:[&quot;Robert Clive&quot;,&quot;Sir Eyre Coote&quot;,&quot;Charles Napier (Battle of Miani and Dabo)&quot;,&quot;Arthur Wellesley&quot;],c:2,e:&quot;&lt;strong&gt;Lord Ellenborough oversaw the annexation of Sindh in 1843&lt;/strong&gt;. The annexation was accomplished by &lt;strong&gt;Charles Napier&lt;/strong&gt; through the Battles of Miani and Dabo. Napier famously announced the conquest with the Latin pun &lt;strong&gt;&#x27;Peccavi&#x27; (I have sinned = Sind)&lt;/strong&gt;.&quot;},
  {q:&quot;Lord Hardinge I (1844–1848) fought the First Anglo-Sikh War (1845–46). The key treaty that followed was:&quot;,o:[&quot;Treaty of Amritsar&quot;,&quot;Treaty of Lahore (1846) — Kashmir sold to Gulab Singh for ₹75 lakh&quot;,&quot;Treaty of Yandabo&quot;,&quot;Treaty of Sagauli&quot;],c:1,e:&quot;The &lt;strong&gt;Treaty of Lahore (1846)&lt;/strong&gt; followed the First Anglo-Sikh War. The Sikhs ceded the Jalandhar Doab. Since they could not pay the full war indemnity of ₹1.5 crore, &lt;strong&gt;Kashmir was sold to Gulab Singh (Dogra chief) for ₹75 lakh&lt;/strong&gt;. Hardinge I also prohibited female infanticide.&quot;},
  {q:&quot;Lord Dalhousie (1848–1856) used the Doctrine of Lapse. Under this doctrine, adopted sons could inherit property but NOT:&quot;,o:[&quot;Zamindari rights&quot;,&quot;The throne — kingdom was annexed by British&quot;,&quot;Military titles&quot;,&quot;Revenue rights&quot;],c:1,e:&quot;The &lt;strong&gt;Doctrine of Lapse&lt;/strong&gt;: if a ruler died without a natural male heir, the kingdom &#x27;lapsed&#x27; to British India. &lt;strong&gt;Adopted sons could inherit property but NOT the throne&lt;/strong&gt;. British approval was required for adoption and was rarely granted. States annexed: Satara (1848), Jhansi (1853), Nagpur (1854), and others.&quot;},
  {q:&quot;Lord Dalhousie introduced railways in India in 1853. The first railway ran between:&quot;,o:[&quot;Calcutta to Delhi&quot;,&quot;Madras to Bangalore&quot;,&quot;Bombay to Thane (April 1853)&quot;,&quot;Bombay to Calcutta&quot;],c:2,e:&quot;&lt;strong&gt;The first railway in India ran from Bombay (Bori Bunder) to Thane on 16 April 1853&lt;/strong&gt;, covering 34 km. Lord Dalhousie was a strong advocate of railways for both commercial and military reasons. He also introduced the electric telegraph in India.&quot;},
  {q:&quot;Wood&#x27;s Despatch (1854) under Dalhousie is called the &#x27;Magna Carta of Indian Education&#x27; because:&quot;,o:[&quot;It established the IITs&quot;,&quot;It was the first declaration that the British government had a duty to educate Indian masses — rejected Downward Filtration — established hierarchical education&quot;,&quot;It made English compulsory for all Indians&quot;,&quot;It abolished Sanskrit education&quot;],c:1,e:&quot;&lt;strong&gt;Wood&#x27;s Despatch (1854)&lt;/strong&gt; is the &#x27;Magna Carta of Indian Education&#x27; because it was the &lt;strong&gt;first declaration of British government&#x27;s duty to educate the Indian masses&lt;/strong&gt;. It: (1) Rejected Macaulay&#x27;s Downward Filtration Theory; (2) Established a hierarchical education structure (vernacular primary → Anglo-vernacular high school → English university); (3) Led to Education Departments in provinces; (4) Directly caused the establishment of Calcutta, Bombay, and Madras Universities in 1857.&quot;},
  {q:&quot;Lord Canning (1856–1858) was the last GG of India and also the first Viceroy. What three universities were established during his tenure?&quot;,o:[&quot;Delhi, Allahabad, Patna&quot;,&quot;Calcutta, Bombay, and Madras (all established 1857)&quot;,&quot;Calcutta, Delhi, Lahore&quot;,&quot;Bombay, Madras, Benaras&quot;],c:1,e:&quot;The universities of &lt;strong&gt;Calcutta, Bombay, and Madras — all established in 1857&lt;/strong&gt; — were under Lord Canning&#x27;s tenure. These were the first universities in India, established as a direct result of Wood&#x27;s Despatch (1854). The Revolt of 1857 also happened in Canning&#x27;s time.&quot;},
],

viceroys:[
  {q:&quot;Lord Canning (1858–62) introduced the Portfolio System in 1861. What is the significance of this system?&quot;,o:[&quot;It created the ICS&quot;,&quot;Each executive council member was assigned specific departments — foundation of India&#x27;s Cabinet system&quot;,&quot;It introduced elections for the first time&quot;,&quot;It created High Courts&quot;],c:1,e:&quot;The &lt;strong&gt;Portfolio System (1861)&lt;/strong&gt; introduced by Lord Canning assigned each executive council member specific government departments (portfolios). This was the &lt;strong&gt;foundation of the Cabinet system in India&lt;/strong&gt; — it created ministerial responsibility for specific policy areas and made governance more systematic.&quot;},
  {q:&quot;Lord Lawrence (1864–69) established High Courts in India in 1865. Which three cities got High Courts?&quot;,o:[&quot;Delhi, Bombay, Madras&quot;,&quot;Calcutta, Bombay, Madras (1865)&quot;,&quot;Calcutta, Delhi, Lahore&quot;,&quot;Allahabad, Bombay, Madras&quot;],c:1,e:&quot;&lt;strong&gt;Lord Lawrence established High Courts at Calcutta, Bombay, and Madras in 1865&lt;/strong&gt;. These replaced the earlier Supreme Courts and Sadar Courts, creating a unified high court system. Lord Lawrence also pursued the &lt;strong&gt;Policy of Masterly Inactivity&lt;/strong&gt; toward Afghanistan.&quot;},
  {q:&quot;Lord Mayo (1869–72) organised the first Census of India. In which year?&quot;,o:[&quot;1869&quot;,&quot;1871&quot;,&quot;1872&quot;,&quot;1881&quot;],c:1,e:&quot;&lt;strong&gt;Lord Mayo organised the first Census of India in 1871&lt;/strong&gt;. He also introduced &lt;strong&gt;Financial Decentralisation&lt;/strong&gt; (delegating financial powers to provinces) and established a Statistical Survey of India. Lord Mayo was assassinated in 1872 — the only Viceroy to be assassinated while in office.&quot;},
  {q:&quot;Lord Lytton&#x27;s Royal Titles Act (1876) gave Queen Victoria the title:&quot;,o:[&quot;Queen of Britain and India&quot;,&quot;Empress of the British Empire&quot;,&quot;Kaisar-i-Hind (Empress of India)&quot;,&quot;Queen-Empress of Asia&quot;],c:2,e:&quot;The &lt;strong&gt;Royal Titles Act 1876&lt;/strong&gt; gave Queen Victoria the title &lt;strong&gt;Kaisar-i-Hind (Empress of India)&lt;/strong&gt;. Lord Lytton organised a grand Durbar in Delhi on 1 January 1877 to celebrate this proclamation. This was a symbolic assertion of British imperial sovereignty over India.&quot;},
  {q:&quot;Lord Lytton&#x27;s Vernacular Press Act 1878 is called the &#x27;Gagging Act.&#x27; Which newspapers could AVOID its restrictions?&quot;,o:[&quot;Tamil and Telugu newspapers&quot;,&quot;Newspapers over 50 years old&quot;,&quot;English-language newspapers (completely exempt)&quot;,&quot;Newspapers with fewer than 1000 copies&quot;],c:2,e:&quot;The &lt;strong&gt;Vernacular Press Act 1878&lt;/strong&gt; targeted only &lt;strong&gt;Indian-language newspapers&lt;/strong&gt;. The &lt;strong&gt;English press was completely exempt&lt;/strong&gt; — a blatant discriminatory double standard. Magistrates could demand security bonds from vernacular publishers; violation meant confiscation of the printing press. There was &lt;strong&gt;NO right of appeal&lt;/strong&gt; in court.&quot;},
  {q:&quot;Lord Lytton&#x27;s Arms Act 1878 required Indians to have licenses for weapons. Who was exempted?&quot;,o:[&quot;All government servants&quot;,&quot;Urban residents only&quot;,&quot;Europeans and Anglo-Indians were completely exempted&quot;,&quot;Police officials only&quot;],c:2,e:&quot;The &lt;strong&gt;Arms Act 1878&lt;/strong&gt; required Indians to hold licenses for weapons under criminal penalty. However, &lt;strong&gt;Europeans and Anglo-Indians were completely exempted&lt;/strong&gt; from this licensing requirement. This blatant racial discrimination was one of the factors fuelling nationalist sentiment.&quot;},
  {q:&quot;Lord Ripon (1880–84) repealed which oppressive Act of Lord Lytton?&quot;,o:[&quot;Arms Act 1878&quot;,&quot;Vernacular Press Act 1878 (repealed 1882)&quot;,&quot;Royal Titles Act 1876&quot;,&quot;The Press Act 1910&quot;],c:1,e:&quot;&lt;strong&gt;Lord Ripon repealed the Vernacular Press Act in 1882&lt;/strong&gt; — one of his first major acts as Viceroy. He also introduced the &lt;strong&gt;First Factory Act (1881)&lt;/strong&gt;, the &lt;strong&gt;Local Self-Government Resolution (1882)&lt;/strong&gt;, and commissioned the &lt;strong&gt;Hunter Commission (1882)&lt;/strong&gt; on education.&quot;},
  {q:&quot;The First Factory Act 1881 under Lord Ripon had specific rules for child workers. Children below what age were prohibited from working in factories?&quot;,o:[&quot;5 years&quot;,&quot;6 years&quot;,&quot;7 years&quot;,&quot;10 years&quot;],c:2,e:&quot;The &lt;strong&gt;First Factory Act 1881&lt;/strong&gt; prohibited employment of children &lt;strong&gt;below 7 years&lt;/strong&gt; in factories. For children aged &lt;strong&gt;7–12 years&lt;/strong&gt;, the maximum working time was &lt;strong&gt;9 hours per day&lt;/strong&gt;. The Act also mandated compulsory weekly holidays and fencing of dangerous machinery.&quot;},
  {q:&quot;Lord Ripon&#x27;s Local Self-Government Resolution (1882) is significant because:&quot;,o:[&quot;It gave complete independence to provinces&quot;,&quot;It was the first formal step toward training Indians in self-governance — District Boards and Municipalities with majority non-official Indian members&quot;,&quot;It established the Indian National Congress&quot;,&quot;It gave Indians voting rights in parliamentary elections&quot;],c:1,e:&quot;Lord Ripon&#x27;s &lt;strong&gt;Local Self-Government Resolution (1882)&lt;/strong&gt; created &lt;strong&gt;District Boards and Municipalities&lt;/strong&gt; with a majority of &lt;strong&gt;non-official (Indian) members, elected where possible&lt;/strong&gt;. It was the &lt;strong&gt;first formal step toward training Indians in self-governance&lt;/strong&gt;. Lord Ripon&#x27;s goal was to use local administration as a tool for &#x27;political and popular education.&#x27;&quot;},
  {q:&quot;The Indian National Congress was formed in 1885 during which Viceroy&#x27;s tenure?&quot;,o:[&quot;Lord Ripon&quot;,&quot;Lord Curzon&quot;,&quot;Lord Dufferin (1884–88)&quot;,&quot;Lord Lansdowne&quot;],c:2,e:&quot;The &lt;strong&gt;Indian National Congress (INC) was founded in 1885&lt;/strong&gt; during the tenure of &lt;strong&gt;Lord Dufferin (1884–88)&lt;/strong&gt;. A.O. Hume, a retired ICS officer, was the key organiser. The INC&#x27;s first session was held in Bombay (Pune originally planned) in December 1885.&quot;},
  {q:&quot;Lord Curzon (1899–1905) partitioned Bengal in 1905. What was his stated reason?&quot;,o:[&quot;To punish Bengal for the Swadeshi Movement&quot;,&quot;Administrative convenience — Bengal was too large to administer&quot;,&quot;To separate Hindus and Muslims&quot;,&quot;To create a buffer state against Burma&quot;],c:1,e:&quot;Lord Curzon&#x27;s stated reason for the &lt;strong&gt;Partition of Bengal 1905&lt;/strong&gt; was &lt;strong&gt;administrative convenience&lt;/strong&gt; — Bengal was indeed very large. However, nationalists believed the real motive was &lt;strong&gt;divide and rule&lt;/strong&gt; — separating the predominantly Muslim east from the Hindu-majority west to weaken the growing nationalist movement. The partition was annulled in 1911 by Lord Hardinge II.&quot;},
  {q:&quot;Lord Hardinge II (1910–16) made two landmark decisions in 1911. What were they?&quot;,o:[&quot;Created Pakistan and India&quot;,&quot;Annulment of Bengal Partition (1911) + Transfer of Capital from Calcutta to Delhi (1911)&quot;,&quot;Established the INC and Congress League Pact&quot;,&quot;Founded New Delhi and Mumbai&quot;],c:1,e:&quot;Lord Hardinge II made two landmark decisions in &lt;strong&gt;1911&lt;/strong&gt;: (1) &lt;strong&gt;Annulment of Partition of Bengal&lt;/strong&gt; (reversing Curzon&#x27;s 1905 partition, reuniting Bengal); (2) &lt;strong&gt;Transfer of the Capital from Calcutta to Delhi&lt;/strong&gt; (announced at the Delhi Durbar of 1911, formally completed in 1912).&quot;},
  {q:&quot;Lord Chelmsford&#x27;s tenure (1916–21) saw which two major acts of repression?&quot;,o:[&quot;Vernacular Press Act and Arms Act&quot;,&quot;Rowlatt Act (1919) and Jallianwala Bagh Massacre (1919)&quot;,&quot;Simon Commission and Communal Award&quot;,&quot;Non-Cooperation and Civil Disobedience&quot;],c:1,e:&quot;Lord Chelmsford&#x27;s tenure saw: (1) &lt;strong&gt;Rowlatt Act (1919)&lt;/strong&gt; — allowed detention without trial, emergency powers against political activities; (2) &lt;strong&gt;Jallianwala Bagh Massacre (13 April 1919)&lt;/strong&gt; — General Dyer ordered firing on peaceful protesters in Amritsar. These acts of repression radicalised Indian nationalism and brought Gandhi to the forefront.&quot;},
  {q:&quot;Lord Reading (1921–26) had to deal with which incident that led Gandhi to call off the Non-Cooperation Movement?&quot;,o:[&quot;Jallianwala Bagh Massacre&quot;,&quot;Simon Commission&quot;,&quot;Chauri Chaura Incident (February 1922) — mob burned a police station, killing 22 policemen&quot;,&quot;Lahore Conspiracy Case&quot;],c:2,e:&quot;The &lt;strong&gt;Chauri Chaura Incident (February 1922)&lt;/strong&gt; — a violent mob burned a police station, killing 22 policemen in UP — led Gandhi to unilaterally call off the &lt;strong&gt;Non-Cooperation Movement&lt;/strong&gt;. Gandhi felt the movement had turned violent and was not ready for mass civil disobedience. Lord Reading also repealed the Press Act 1910 and the Swaraj Party was formed by Motilal Nehru and CR Das.&quot;},
  {q:&quot;Lord Irwin (1926–31) signed the Gandhi-Irwin Pact (1931). What did Gandhi agree to do in return for British concessions?&quot;,o:[&quot;Accept Dominion Status&quot;,&quot;Suspend the Civil Disobedience Movement and attend the Second Round Table Conference&quot;,&quot;Accept Separate Electorates&quot;,&quot;Dissolve the INC&quot;],c:1,e:&quot;Under the &lt;strong&gt;Gandhi-Irwin Pact (1931)&lt;/strong&gt;, Gandhi agreed to: (1) &lt;strong&gt;Suspend the Civil Disobedience Movement&lt;/strong&gt;; (2) &lt;strong&gt;Attend the Second Round Table Conference in London&lt;/strong&gt;. In return, the British agreed to release political prisoners and allow salt manufacture along the coast. The Simon Commission (1928) was also part of Lord Irwin&#x27;s troubled tenure.&quot;},
  {q:&quot;Lord Willingdon (1931–36) presided over which controversial communal decision in 1932?&quot;,o:[&quot;Partition of Bengal&quot;,&quot;Formation of Muslim League&quot;,&quot;Communal Award — giving separate electorates to Dalits (opposed by Gandhi via Poona Pact)&quot;,&quot;Creation of Pakistan demand&quot;],c:2,e:&quot;The &lt;strong&gt;Communal Award (1932)&lt;/strong&gt; — announced by British PM Ramsay MacDonald during Lord Willingdon&#x27;s tenure — gave &lt;strong&gt;separate electorates to Depressed Classes (Dalits)&lt;/strong&gt;. Gandhi went on a fast-unto-death opposing it. This led to the &lt;strong&gt;Poona Pact (1932)&lt;/strong&gt; between Gandhi and Ambedkar — retaining reserved seats but NOT separate electorates.&quot;},
  {q:&quot;Lord Linlithgow (1936–44) presided over which major movement of 1942?&quot;,o:[&quot;Non-Cooperation Movement&quot;,&quot;Civil Disobedience Movement&quot;,&quot;Quit India Movement (August 1942)&quot;,&quot;Khilafat Movement&quot;],c:2,e:&quot;&lt;strong&gt;Lord Linlithgow&lt;/strong&gt; was the Viceroy when Gandhi launched the &lt;strong&gt;Quit India Movement (August 1942)&lt;/strong&gt; with the slogan &#x27;Do or Die.&#x27; The British responded with mass arrests of Congress leaders. Linlithgow also dealt with the August Offer (1940) and Cripps Mission (1942).&quot;},
  {q:&quot;Lord Mountbatten (1947–48) was both the Last Viceroy and the First Governor-General of Free India. The June 3rd Plan (1947) provided for:&quot;,o:[&quot;Complete freedom with no partition&quot;,&quot;Partition of India into India and Pakistan based on communal composition&quot;,&quot;Dominion Status for India only&quot;,&quot;Transfer of power to the INC directly&quot;],c:1,e:&quot;The &lt;strong&gt;June 3rd Plan (Mountbatten Plan, 1947)&lt;/strong&gt; provided for the &lt;strong&gt;partition of India into two dominions — India and Pakistan&lt;/strong&gt; based on communal composition of districts. Punjab and Bengal were to be partitioned. This was implemented through the &lt;strong&gt;Indian Independence Act (July 1947)&lt;/strong&gt;, effective from 15 August 1947.&quot;},
],

revenue:[
  {q:&quot;The mnemonic PRM helps remember the three revenue systems. What does PRM stand for?&quot;,o:[&quot;Permanent, Ryot, Madhya Pradesh&quot;,&quot;Permanent (Zamindari) + Ryotwari + Mahalwari&quot;,&quot;Peasant, Rent, Mahal&quot;,&quot;Punjab, Revenue, Mysore&quot;],c:1,e:&quot;&lt;strong&gt;PRM = Permanent (Zamindari) · Ryotwari · Mahalwari&lt;/strong&gt;. These are the three land revenue systems introduced in British India. Area coverage: &lt;strong&gt;P (Permanent) = ~19%&lt;/strong&gt;, &lt;strong&gt;R (Ryotwari) = ~51%&lt;/strong&gt;, &lt;strong&gt;M (Mahalwari) = rest&lt;/strong&gt; (NW Provinces, Punjab).&quot;},
  {q:&quot;The Permanent Settlement (Zamindari System) was introduced in 1793 by Lord Cornwallis. In which areas was it applied?&quot;,o:[&quot;Madras, Bombay, Assam&quot;,&quot;NW Provinces, Punjab&quot;,&quot;Bengal, Bihar, and Orissa (~19% of British India)&quot;,&quot;All of British India&quot;],c:2,e:&quot;The &lt;strong&gt;Permanent Settlement (1793)&lt;/strong&gt; was applied in &lt;strong&gt;Bengal, Bihar, and Orissa&lt;/strong&gt; — covering approximately &lt;strong&gt;19% of British India&lt;/strong&gt;. It was introduced first by John Shore (1789) in Bengal and then made permanent by Cornwallis in 1793 as the Zamindari System.&quot;},
  {q:&quot;The Ryotwari System was introduced in Madras by Thomas Munro in 1820. What is the distinctive feature of this system?&quot;,o:[&quot;Village community pays revenue collectively&quot;,&quot;Zamindars act as intermediaries&quot;,&quot;Ryot (individual cultivator) pays revenue directly to government — NO intermediaries&quot;,&quot;British officers collect from each household&quot;],c:2,e:&quot;The &lt;strong&gt;Ryotwari System&#x27;s distinctive feature&lt;/strong&gt;: the &lt;strong&gt;individual ryot (cultivator) pays revenue directly to the government without any intermediary&lt;/strong&gt;. The ryot is recognised as the owner of the land. Revenue is assessed based on land productivity and is periodically revised (unlike the permanent system).&quot;},
  {q:&quot;The Mahalwari System was introduced in NW Provinces by Holt Mackenzie in 1822. The revenue unit in this system is:&quot;,o:[&quot;Individual farmer (ryot)&quot;,&quot;Zamindar&quot;,&quot;The Mahal (entire village/estate) — joint liability of village community&quot;,&quot;Provincial government&quot;],c:2,e:&quot;In the &lt;strong&gt;Mahalwari System&lt;/strong&gt;, the revenue unit is the &lt;strong&gt;Mahal (entire village or estate)&lt;/strong&gt;. The &lt;strong&gt;village community as a whole was jointly responsible&lt;/strong&gt; for revenue payment. Revenue was collected through a &lt;strong&gt;lambardar&lt;/strong&gt; (village headman). Revenue was periodically revised based on net produce.&quot;},
  {q:&quot;In the Ryotwari System, which intermediary is ABSENT?&quot;,o:[&quot;Government revenue officer&quot;,&quot;Zamindar/landlord class — direct state-ryot relationship&quot;,&quot;Village headman&quot;,&quot;Regional tax collector&quot;],c:1,e:&quot;The &lt;strong&gt;Ryotwari System has NO zamindars or landlord intermediaries&lt;/strong&gt; — it creates a &lt;strong&gt;direct state-ryot relationship&lt;/strong&gt;. This was its major advantage over the Permanent Settlement. However, the high and fluctuating revenue demands often led to ryot indebtedness.&quot;},
  {q:&quot;In the Permanent Settlement, what documents did zamindars give to tenants?&quot;,o:[&quot;Qabuliats&quot;,&quot;Pattas (rent agreements)&quot;,&quot;Hukamanamas&quot;,&quot;Farmans&quot;],c:1,e:&quot;In the Permanent Settlement, &lt;strong&gt;zamindars issued Pattas&lt;/strong&gt; (written rent agreements) to tenants. In return, tenants gave &lt;strong&gt;Qabuliats&lt;/strong&gt; (acknowledgement of liability). This created a formal landlord-tenant relationship in Bengal, Bihar, and Orissa.&quot;},
  {q:&quot;The Permanent Settlement had a major drawback of &#x27;Absentee Landlordism.&#x27; This meant:&quot;,o:[&quot;Landlords paid rent to absentee British officials&quot;,&quot;Zamindars moved to cities, leaving their lands managed by middlemen — leading to feudalism and peasant exploitation&quot;,&quot;Tenants abandoned their farms&quot;,&quot;British officials took land without compensation&quot;],c:1,e:&quot;&lt;strong&gt;Absentee Landlordism&lt;/strong&gt; under the Permanent Settlement: &lt;strong&gt;zamindars moved to cities&lt;/strong&gt;, leaving their estates managed by &lt;strong&gt;middlemen (naib, gomashta)&lt;/strong&gt;. This created multiple layers of exploitative intermediaries, feudalism, and severe oppression of peasants. Agricultural stagnation resulted as zamindars had no incentive to improve land.&quot;},
  {q:&quot;The Mahalwari System&#x27;s revenue demand was initially fixed at approximately what percentage of net produce?&quot;,o:[&quot;10–15%&quot;,&quot;25–30%&quot;,&quot;~66% (initially), later revised to ~50%&quot;,&quot;80%&quot;],c:2,e:&quot;The &lt;strong&gt;Mahalwari System&#x27;s initial revenue demand was approximately 66% of net produce&lt;/strong&gt;, which was revised to approximately &lt;strong&gt;50%&lt;/strong&gt; later. This high demand often led to: &lt;strong&gt;high burden on farmers&lt;/strong&gt;, potential record manipulation by revenue officials, and forced indebtedness.&quot;},
  {q:&quot;The Ryotwari System covers the LARGEST area of British India. Approximately what percentage?&quot;,o:[&quot;19%&quot;,&quot;30%&quot;,&quot;~51% — Madras, Bombay, Assam&quot;,&quot;75%&quot;],c:2,e:&quot;The &lt;strong&gt;Ryotwari System covers approximately 51% of British India&lt;/strong&gt; — making it the most extensive revenue system. It was applied in &lt;strong&gt;Madras, Bombay, and Assam&lt;/strong&gt;. Although it had no intermediaries, the frequent reassessments created uncertainty and the high revenue demands led to peasant indebtedness.&quot;},
  {q:&quot;The Mahalwari System is different from both other systems in that revenue collection was through:&quot;,o:[&quot;The zamindar&quot;,&quot;Individual ryots directly&quot;,&quot;The lambardar (village headman) with joint village liability&quot;,&quot;British revenue officers directly&quot;],c:2,e:&quot;In the &lt;strong&gt;Mahalwari System&lt;/strong&gt;, revenue was collected through the &lt;strong&gt;lambardar (village headman)&lt;/strong&gt;, with the &lt;strong&gt;entire mahal (village) jointly liable&lt;/strong&gt; for payment. This was different from: Permanent Settlement (zamindar), Ryotwari (individual ryot directly to state).&quot;},
],

policies:[
  {q:&quot;Warren Hastings&#x27; Ring Fence Policy was fundamentally DEFENSIVE in nature. Which state served as the key buffer?&quot;,o:[&quot;Mysore&quot;,&quot;Maratha Confederacy&quot;,&quot;Awadh — buffer between Bengal and the Marathas/outside threats&quot;,&quot;Hyderabad&quot;],c:2,e:&quot;The &lt;strong&gt;Ring Fence Policy&#x27;s key buffer state was Awadh&lt;/strong&gt;. Awadh acted as a protective shield between Bengal (the British core) and potential threats from the Marathas and others from the west. Wars with Mysore and the Marathas were fought to maintain this defensive ring.&quot;},
  {q:&quot;Sir John Shore&#x27;s Policy of Non-Intervention was replaced by Lord Wellesley&#x27;s Subsidiary Alliance because:&quot;,o:[&quot;Shore&#x27;s policy was too expensive&quot;,&quot;Shore&#x27;s policy was too aggressive&quot;,&quot;Shore&#x27;s passive approach meant British assistance was not guaranteed even to allies — weakness was exposed&quot;,&quot;Shore wanted to expand into Afghanistan&quot;],c:2,e:&quot;&lt;strong&gt;Sir John Shore&#x27;s Policy of Non-Intervention&lt;/strong&gt; was replaced because its &lt;strong&gt;passive approach exposed British weakness&lt;/strong&gt;. British assistance was not guaranteed even to allies, making alliances meaningless. External threats required a more assertive policy. Lord Wellesley replaced it with the aggressive &lt;strong&gt;Subsidiary Alliance&lt;/strong&gt;.&quot;},
  {q:&quot;Under the Subsidiary Alliance, an Indian ruler who could not afford to pay for the British troops stationed in their territory had to:&quot;,o:[&quot;Be exempted from payment&quot;,&quot;Request more time from Parliament&quot;,&quot;Cede territory to the British instead of payment&quot;,&quot;Provide soldiers to fight for British&quot;],c:2,e:&quot;The Subsidiary Alliance&#x27;s economic trap: if an Indian ruler &lt;strong&gt;could not pay for the British troops&lt;/strong&gt;, they had to &lt;strong&gt;cede equivalent territory to the British&lt;/strong&gt;. This progressively transferred land from Indian rulers to the British. The British also took over the ruler&#x27;s foreign policy completely.&quot;},
  {q:&quot;Lord Hastings&#x27; Policy of Paramountcy ended the concept of British treating Indian states as:&quot;,o:[&quot;Enemies&quot;,&quot;Dependents&quot;,&quot;Political equals — British were now unambiguously supreme&quot;,&quot;Colonies&quot;],c:2,e:&quot;The &lt;strong&gt;Policy of Paramountcy (Lord Hastings)&lt;/strong&gt; ended the concept of British treating Indian states as &lt;strong&gt;political equals&lt;/strong&gt;. British authority was declared supreme above ALL Indian states. The British could now annex &#x27;mismanaged&#x27; states — this was a significant escalation from even the Subsidiary Alliance.&quot;},
  {q:&quot;The Doctrine of Lapse was used by Dalhousie and was withdrawn by Lord Canning after 1858. What caused its withdrawal?&quot;,o:[&quot;It was too expensive to administer&quot;,&quot;It directly led to the Revolt of 1857 by making Indian rulers insecure about their successors&quot;,&quot;Parliament passed a law against it&quot;,&quot;Supreme Court ruled it illegal&quot;],c:1,e:&quot;The &lt;strong&gt;Doctrine of Lapse was withdrawn by Lord Canning after 1858&lt;/strong&gt; because it had &lt;strong&gt;directly contributed to the Revolt of 1857&lt;/strong&gt;. Indian rulers felt deeply insecure — if they died without a natural heir, their kingdoms would be annexed. Rani Lakshmibai of Jhansi is a prominent example of a ruler who fought because of this doctrine.&quot;},
  {q:&quot;Macaulay&#x27;s Minute (1835) introduced the &#x27;Downward Filtration Theory.&#x27; This theory stated:&quot;,o:[&quot;Education should flow from rural areas upward to cities&quot;,&quot;Educate only the upper class Indians in English — knowledge would &#x27;filter down&#x27; to the masses naturally&quot;,&quot;All government spending on education should go to lower classes&quot;,&quot;Colonial education should replace Indian culture completely&quot;],c:1,e:&quot;The &lt;strong&gt;Downward Filtration Theory&lt;/strong&gt;: &lt;strong&gt;educate only the upper-class Indians in English&lt;/strong&gt;; the knowledge and culture would naturally &#x27;filter down&#x27; to the masses through these educated elites. This theory was later rejected by Wood&#x27;s Despatch (1854) which advocated mass education.&quot;},
  {q:&quot;Wood&#x27;s Despatch (1854) rejected Macaulay&#x27;s Downward Filtration Theory and proposed a hierarchical education structure. What was the correct sequence?&quot;,o:[&quot;English → Anglo-Vernacular → Vernacular&quot;,&quot;Vernacular (primary) → Anglo-Vernacular (high school) → English (university)&quot;,&quot;University → College → Primary School&quot;,&quot;Religious → Secular → Technical&quot;],c:1,e:&quot;&lt;strong&gt;Wood&#x27;s Despatch (1854)&lt;/strong&gt; proposed: &lt;strong&gt;Vernacular language (primary) → Anglo-Vernacular medium (high school) → English medium (university)&lt;/strong&gt;. This was a bottom-up approach — starting with mass primary education in local languages. It was the opposite of Macaulay&#x27;s top-down elite English education.&quot;},
  {q:&quot;The Hunter Commission (1882) under Lord Ripon reviewed Wood&#x27;s Despatch (1854). Its recommendation on secondary education was:&quot;,o:[&quot;Abolish all secondary schools&quot;,&quot;One track only — literary education&quot;,&quot;Two tracks: Literary (university prep) and Vocational (technical/commercial)&quot;,&quot;Make English compulsory for all secondary students&quot;],c:2,e:&quot;The &lt;strong&gt;Hunter Commission (1882)&lt;/strong&gt; recommended &lt;strong&gt;two tracks for secondary education&lt;/strong&gt;: (1) &lt;strong&gt;Literary track&lt;/strong&gt; — preparing students for university; (2) &lt;strong&gt;Vocational track&lt;/strong&gt; — focusing on technical and commercial skills. It also recommended state responsibility for primary education in vernacular languages and transferring primary schools to District and Municipal Boards.&quot;},
  {q:&quot;Lord Lawrence&#x27;s Masterly Inactivity (1864–69) toward Afghanistan meant:&quot;,o:[&quot;Actively invading Afghanistan&quot;,&quot;Passive approach — non-interference in Afghan civil wars; keeping Afghanistan as neutral buffer against Russia&quot;,&quot;Annexing Afghan territories border by border&quot;,&quot;Signing Subsidiary Alliance with Afghanistan&quot;],c:1,e:&quot;&lt;strong&gt;Masterly Inactivity (Lord Lawrence)&lt;/strong&gt; was a &lt;strong&gt;passive/defensive strategy toward Afghanistan&lt;/strong&gt;: (1) &lt;strong&gt;Non-interference&lt;/strong&gt; in Afghan civil wars; (2) &lt;strong&gt;Afghanistan as neutral buffer&lt;/strong&gt; against Russian expansion; (3) Recognising whoever was in power (as long as they didn&#x27;t ally with Russia). It was later replaced by Lord Lytton&#x27;s aggressive Forward Policy.&quot;},
  {q:&quot;Lord Lytton&#x27;s Forward Policy led to which war?&quot;,o:[&quot;First Anglo-Afghan War (1838–42)&quot;,&quot;Third Anglo-Mysore War&quot;,&quot;Second Anglo-Afghan War (1878–80)&quot;,&quot;First Anglo-Burmese War&quot;],c:2,e:&quot;Lord Lytton&#x27;s &lt;strong&gt;Forward Policy&lt;/strong&gt; — proactively pushing British influence into Afghanistan to counter Russian expansion — led to the &lt;strong&gt;Second Anglo-Afghan War (1878–80)&lt;/strong&gt;. Unlike the defensive Masterly Inactivity, Lytton wanted direct control over Afghan foreign policy. The war ended with the Treaty of Gandamak (1879).&quot;},
  {q:&quot;The Lord Curzon&#x27;s Indian Universities Act (1904) was controversial because:&quot;,o:[&quot;It made higher education free&quot;,&quot;It established IITs&quot;,&quot;It gave the government veto power over university senate regulations and imposed tougher conditions on private colleges — seen as restricting Indian intellectual freedom&quot;,&quot;It abolished Sanskrit education&quot;],c:2,e:&quot;Lord Curzon&#x27;s &lt;strong&gt;Indian Universities Act (1904)&lt;/strong&gt; was controversial: (1) Government could &lt;strong&gt;veto university senate regulations&lt;/strong&gt;; (2) Private colleges faced &lt;strong&gt;tougher affiliation conditions and regular inspections&lt;/strong&gt;; (3) Senate fellows were reduced and tenure limited to 5 years. Critics saw this as the government stifling Indian intellectual and nationalist activity in universities.&quot;},
  {q:&quot;The Vernacular Press Act 1878 had NO right of appeal in court. In which year was it repealed and by whom?&quot;,o:[&quot;1879 by Lord Lytton himself&quot;,&quot;1882 by Lord Ripon&quot;,&quot;1890 by Lord Lansdowne&quot;,&quot;1905 by Lord Curzon&quot;],c:1,e:&quot;The &lt;strong&gt;Vernacular Press Act 1878 was repealed in 1882 by Lord Ripon&lt;/strong&gt;. This was one of Ripon&#x27;s early popular acts. The VPA had been deeply resented for its discriminatory application (Indian-language press targeted while English press was exempt) and the denial of court appeal rights.&quot;},
],

mixed:[
  {q:&quot;Identify the CORRECT matching of Charter/Act and its key provision:&quot;,o:[&quot;Regulating Act 1773 — GG overrule Council&quot;,&quot;Pitt&#x27;s India Act 1784 — First Parliamentary Control&quot;,&quot;Charter Act 1833 — First GG of India + Government of India name&quot;,&quot;Charter Act 1853 — Trade Monopoly abolished&quot;],c:2,e:&quot;&lt;strong&gt;Charter Act 1833 — First GG of India (Lord William Bentinck) + Government of India name&lt;/strong&gt; ✓. Other corrections: Regulating Act 1773 = First Parliamentary Control (not GG overrule Council — that was 1793). Pitt&#x27;s India Act 1784 = Double Government (not first parliamentary control). Charter Act 1853 = First separation of Legislative and Executive (not trade monopoly — that was 1813).&quot;},
  {q:&quot;Arrange these acts in chronological order: Minto-Morley Reforms, Montagu-Chelmsford Reforms, GOI Act 1935, Indian Councils Act 1861&quot;,o:[&quot;1861 → 1909 → 1919 → 1935&quot;,&quot;1909 → 1861 → 1919 → 1935&quot;,&quot;1861 → 1919 → 1909 → 1935&quot;,&quot;1935 → 1919 → 1909 → 1861&quot;],c:0,e:&quot;Correct chronological order: &lt;strong&gt;Indian Councils Act 1861 → Minto-Morley Reforms 1909 → Montagu-Chelmsford Reforms 1919 → GOI Act 1935&lt;/strong&gt;. Key progress: 1861 (portfolio system, decentralisation) → 1909 (first separate electorates) → 1919 (dyarchy, direct elections) → 1935 (provincial autonomy, federal court).&quot;},
  {q:&quot;Which Governor-General/Viceroy is associated with the MOST landmark &#x27;firsts&#x27;?&quot;,o:[&quot;Warren Hastings — First GG of Bengal&quot;,&quot;Lord William Bentinck — First GG of India + many reforms&quot;,&quot;Lord Canning — Last GG of India, First Viceroy, Portfolio System, 3 Universities&quot;,&quot;Lord Dalhousie — Railways, Telegraph, Open ICS&quot;],c:2,e:&quot;&lt;strong&gt;Lord Canning&lt;/strong&gt; holds the most &#x27;firsts&#x27;: &lt;strong&gt;Last GG of India + First Viceroy of India&lt;/strong&gt;, introduced the &lt;strong&gt;Portfolio System&lt;/strong&gt; (foundation of Cabinet system), oversaw establishment of &lt;strong&gt;3 Universities (1857)&lt;/strong&gt;, oversaw the &lt;strong&gt;Revolt of 1857&lt;/strong&gt;, and withdrew the Doctrine of Lapse. His tenure (1856–62) spans both the pre- and post-1857 periods.&quot;},
  {q:&quot;Which revenue system had NO intermediaries between state and farmer?&quot;,o:[&quot;Permanent Settlement (Zamindari)&quot;,&quot;Mahalwari System&quot;,&quot;Ryotwari System — direct state-ryot relationship&quot;,&quot;None — all systems had intermediaries&quot;],c:2,e:&quot;The &lt;strong&gt;Ryotwari System&lt;/strong&gt; is the only system with &lt;strong&gt;NO intermediaries&lt;/strong&gt; between the state and the farmer. The ryot directly paid revenue to government officers. In contrast: Permanent Settlement had zamindars; Mahalwari had the village community and lambardar.&quot;},
  {q:&quot;The &#x27;Double Government&#x27; introduced by Pitt&#x27;s India Act 1784 consisted of:&quot;,o:[&quot;Central + Provincial governments&quot;,&quot;Court of Directors (commercial) + Board of Control (political-military-revenue)&quot;,&quot;Parliament + EIC dual authority&quot;,&quot;Legislative + Executive councils&quot;],c:1,e:&quot;&lt;strong&gt;Double Government (Pitt&#x27;s India Act 1784)&lt;/strong&gt;: (1) &lt;strong&gt;Court of Directors&lt;/strong&gt; — handled commercial aspects; (2) &lt;strong&gt;Board of Control&lt;/strong&gt; (6 members) — handled civil, military, and revenue matters. This dual system replaced the earlier sole authority of the Court of Directors and brought EIC firmly under Parliament&#x27;s supervision.&quot;},
  {q:&quot;Identify which pair is INCORRECTLY matched:&quot;,o:[&quot;Lord Ripon — Local Self-Govt Resolution (1882)&quot;,&quot;Lord Lawrence — Masterly Inactivity Policy&quot;,&quot;Lord Lytton — Vernacular Press Act (1878)&quot;,&quot;Lord Dufferin — Partition of Bengal (1905)&quot;],c:3,e:&quot;&lt;strong&gt;Lord Dufferin — Partition of Bengal (1905) is INCORRECT&lt;/strong&gt;. The Partition of Bengal was done by &lt;strong&gt;Lord Curzon (1899–1905)&lt;/strong&gt;, not Lord Dufferin (1884–88). Lord Dufferin is associated with the &lt;strong&gt;formation of the Indian National Congress (1885)&lt;/strong&gt;. All other pairs are correct.&quot;},
  {q:&quot;Wood&#x27;s Despatch (1854) is called the &#x27;Magna Carta of Indian Education.&#x27; The three universities it led to in 1857 were in:&quot;,o:[&quot;Delhi, Allahabad, Patna&quot;,&quot;Lahore, Calcutta, Bombay&quot;,&quot;Calcutta, Bombay, Madras&quot;,&quot;Bombay, Pune, Madras&quot;],c:2,e:&quot;Wood&#x27;s Despatch (1854) led to the establishment of universities at &lt;strong&gt;Calcutta, Bombay, and Madras — all in 1857&lt;/strong&gt;. These were the first three universities in India. They were established as examining bodies modelled on the University of London. Wood&#x27;s Despatch was issued by Charles Wood (Secretary of State) and represented the first comprehensive education policy for India.&quot;},
  {q:&quot;The correct progression of British policies toward Indian states was:&quot;,o:[&quot;Paramountcy → Ring Fence → Non-Intervention → Subsidiary Alliance → Doctrine of Lapse&quot;,&quot;Ring Fence (W. Hastings) → Non-Intervention (J. Shore) → Subsidiary Alliance (Wellesley) → Paramountcy (L. Hastings) → Doctrine of Lapse (Dalhousie)&quot;,&quot;Doctrine of Lapse → Paramountcy → Subsidiary Alliance → Non-Intervention → Ring Fence&quot;,&quot;Subsidiary Alliance → Ring Fence → Paramountcy → Non-Intervention → Doctrine of Lapse&quot;],c:1,e:&quot;The correct chronological progression: &lt;strong&gt;Ring Fence (Warren Hastings, 1773–85) → Non-Intervention (Sir John Shore, 1793–98) → Subsidiary Alliance (Lord Wellesley, 1798–1805) → Paramountcy (Lord Hastings, 1813–23) → Doctrine of Lapse (Lord Dalhousie, 1848–56)&lt;/strong&gt;. This sequence shows the escalating British assertion of dominance over Indian states.&quot;},
  {q:&quot;The Cornwallis Code (1793) separated which three functions that had previously been held by a single District Collector?&quot;,o:[&quot;Trade, Revenue, Military&quot;,&quot;Executive, Revenue, and Judicial functions&quot;,&quot;Legislative, Judicial, Executive&quot;,&quot;Administrative, Police, Military&quot;],c:1,e:&quot;The &lt;strong&gt;Cornwallis Code (1793) separated Executive, Revenue, and Judicial functions&lt;/strong&gt; of governance that had previously been concentrated in the single District Collector. This was a landmark administrative reform. Separate officers were created for each function — the Collector (revenue), Magistrate (executive), and judges (judicial).&quot;},
  {q:&quot;Which act first introduced the concept of provincial autonomy, making provinces separate legal entities deriving authority directly from the Crown?&quot;,o:[&quot;Government of India Act 1935&quot;,&quot;Montagu-Chelmsford Reforms 1919&quot;,&quot;Indian Councils Act 1861&quot;,&quot;Charter Act 1853&quot;],c:0,e:&quot;The &lt;strong&gt;Government of India Act 1935 introduced Provincial Autonomy&lt;/strong&gt; for the first time — provinces became &lt;strong&gt;separate legal entities deriving authority directly from the British Crown&lt;/strong&gt; (not via the GG). Provinces had their own executive (Governor + Council of Ministers). Before 1935, provinces operated as extensions of the central government.&quot;},
  {q:&quot;Which Viceroy is associated with the most progressive social legislation: Factory Act, Local Self-Government, and repealing the Vernacular Press Act?&quot;,o:[&quot;Lord Lawrence&quot;,&quot;Lord Curzon&quot;,&quot;Lord Ripon (1880–84)&quot;,&quot;Lord Hardinge II&quot;],c:2,e:&quot;&lt;strong&gt;Lord Ripon (1880–84)&lt;/strong&gt; introduced the most progressive legislation: (1) &lt;strong&gt;First Factory Act (1881)&lt;/strong&gt; — child labour protections; (2) &lt;strong&gt;Local Self-Government Resolution (1882)&lt;/strong&gt; — training Indians in governance; (3) &lt;strong&gt;Repeal of Vernacular Press Act (1882)&lt;/strong&gt;; (4) &lt;strong&gt;Hunter Commission (1882)&lt;/strong&gt; on education. Florence Nightingale called him &#x27;the friend of India.&#x27;&quot;},
]
};

// ── Engine ──────────────────────────────────────────────────────────────
const ans={},cor={};
Object.keys(Q).forEach(k=&gt;{ans[k]={};cor[k]=0;});
let cur=&#x27;charter&#x27;;

function build(k){
  const sec=document.getElementById(&#x27;sec-&#x27;+k);
  sec.querySelectorAll(&#x27;.card&#x27;).forEach(e=&gt;e.remove());
  const L=[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;,&#x27;D&#x27;];
  Q[k].forEach((item,i)=&gt;{
    const done=ans[k][i]!==undefined;
    const d=document.createElement(&#x27;div&#x27;);
    d.className=&#x27;card&#x27;;d.id=`q-${k}-${i}`;
    const os=item.o.map((o,j)=&gt;{
      let cl=&#x27;opt&#x27;;
      if(done){cl+=&#x27; done&#x27;;if(j===item.c)cl+=&#x27; correct&#x27;;else if(j===ans[k][i])cl+=&#x27; wrong&#x27;;}
      return `&lt;div class=&quot;${cl}&quot; onclick=&quot;pick(&#x27;${k}&#x27;,${i},${j})&quot;&gt;&lt;span class=&quot;ltr&quot;&gt;${L[j]}&lt;/span&gt;&lt;span class=&quot;ot&quot;&gt;${o}&lt;/span&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    d.innerHTML=`&lt;div class=&quot;qno&quot;&gt;Q ${i+1} / ${Q[k].length}&lt;/div&gt;&lt;div class=&quot;qtxt&quot;&gt;${item.q}&lt;/div&gt;&lt;div class=&quot;opts&quot;&gt;${os}&lt;/div&gt;&lt;div class=&quot;ex${done?&#x27; on&#x27;:&#x27;&#x27;}&quot;&gt;💡 &lt;strong&gt;Explanation:&lt;/strong&gt; ${item.e}&lt;/div&gt;`;
    sec.appendChild(d);
  });
}

function pick(k,qi,ch){
  if(ans[k][qi]!==undefined)return;
  ans[k][qi]=ch;
  const item=Q[k][qi];
  const card=document.getElementById(`q-${k}-${qi}`);
  card.querySelectorAll(&#x27;.opt&#x27;).forEach((o,j)=&gt;{
    o.classList.add(&#x27;done&#x27;);
    if(j===item.c)o.classList.add(&#x27;correct&#x27;);
    else if(j===ch)o.classList.add(&#x27;wrong&#x27;);
  });
  if(ch===item.c)cor[k]++;
  card.querySelector(&#x27;.ex&#x27;).classList.add(&#x27;on&#x27;);
  upd(k);
}

function upd(k){
  const total=Q[k].length,done=Object.keys(ans[k]).length;
  document.getElementById(&#x27;lbl&#x27;).textContent=`${done} of ${total} answered`;
  document.getElementById(&#x27;bar&#x27;).style.width=total?(done/total*100)+&#x27;%&#x27;:&#x27;0%&#x27;;
  document.getElementById(&#x27;sc&#x27;).textContent=`Score: ${cor[k]}/${done||&#x27;—&#x27;}`;
}

function go(k,btn){
  cur=k;
  document.querySelectorAll(&#x27;.sec&#x27;).forEach(s=&gt;s.classList.remove(&#x27;on&#x27;));
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.classList.remove(&#x27;on&#x27;));
  document.getElementById(&#x27;sec-&#x27;+k).classList.add(&#x27;on&#x27;);
  btn.classList.add(&#x27;on&#x27;);
  upd(k);
  window.scrollTo({top:0,behavior:&#x27;smooth&#x27;});
}

window.addEventListener(&#x27;DOMContentLoaded&#x27;,()=&gt;{
  Object.keys(Q).forEach(k=&gt;build(k));
  upd(&#x27;charter&#x27;);
});

const topBtn=document.getElementById(&#x27;top&#x27;);
window.addEventListener(&#x27;scroll&#x27;,()=&gt;topBtn.classList.toggle(&#x27;on&#x27;,window.scrollY&gt;280));

  tr:hover td { background: #f5f0ea; }
  /* KEY BOLD */
  .k { font-weight: 700; color: var(--primary); }
  .kd { font-weight: 700; color: var(--blue); }
  .kg { font-weight: 700; color: var(--green); }
  .kr { font-weight: 700; color: var(--red); }
  /* TIMELINE */
  .timeline { border-left: 3px solid var(--accent2); padding-left: 16px; margin: 10px 0; }
  .timeline-item { position: relative; padding: 6px 0 6px 10px; font-size: 0.88rem; }
  .timeline-item::before {
    content: &quot;&quot;; position: absolute; left: -20px; top: 12px;
    width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--accent2);
  }
  .timeline-item .yr { font-weight: 700; color: var(--accent); min-width: 90px; display: inline-block; }
  /* MNEMONIC */
  .mnemonic {
    background: linear-gradient(135deg, #fff9e6, #fff3d0);
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 10px 0;
    font-size: 0.88rem;
  }
  .mnemonic strong { color: var(--gold); font-size: 1rem; }
  /* SUMMARY BOX */
  .summary-box {
    background: linear-gradient(135deg, #fff8f0, #fff3e8);
    border: 2px solid var(--accent);
    border-radius: 12px;
    padding: 14px 18px;
    margin-top: 18px;
  }
  .summary-box h3 { color: var(--accent); border: none; }

  /* FLOWCHART */
  .flow { display: flex; flex-wrap: wrap; gap: 0; align-items: center; margin: 10px 0; }
  .flow-step {
    background: var(--highlight-orange);
    border: 1.5px solid var(--accent2);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--primary);
    text-align: center;
    white-space: nowrap;
  }
  .flow-arrow { font-size: 1.2rem; color: var(--accent); padding: 0 4px; }
  /* DIVIDER */
  hr { border: none; border-top: 1.5px dashed var(--border); margin: 14px 0; }
  /* SMALL LABEL */
  .lbl { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  /* GRID 2 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  /* ICON ROW */
  .icon-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .icon-chip {
    background: var(--highlight-blue);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--blue);
    border: 1px solid #c0d8f0;
  }
  /* Important note strip */
  .strip {
    background: linear-gradient(90deg, #fdecea, #fff);
    border-left: 4px solid var(--red);
    border-radius: 0 8px 8px 0;
    padding: 7px 12px;
    margin: 7px 0;
    font-size: 0.87rem;
  }
  .strip-green {
    background: linear-gradient(90deg, #e8f5ef, #fff);
    border-left: 4px solid var(--green);
  }
  .strip-blue {
    background: linear-gradient(90deg, #e8f0fa, #fff);
    border-left: 4px solid var(--blue);
  }

  /* SCROLL TO TOP */
  #scrollTop {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    font-size: 1.4rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(192,87,43,0.45);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, background 0.2s, transform 0.2s;
  }
  #scrollTop:hover { background: var(--primary); transform: scale(1.1); }
  #scrollTop.visible { opacity: 1; pointer-events: auto; }
&lt;/style&gt;
