&lt;!-- ===================== TAB 1: 1857 REVOLT ===================== --&gt;
&lt;div id=&quot;t1&quot; class=&quot;tab-content active&quot;&gt;

  &lt;div class=&quot;card red&quot;&gt;
    &lt;h2&gt;⚔️ Revolt of 1857&lt;/h2&gt;
    &lt;ul class=&quot;plain&quot;&gt;
      &lt;li&gt;✅ First large-scale uprising against British rule in India&lt;/li&gt;
      &lt;li&gt;📖 &lt;span class=&quot;k&quot;&gt;V.D. Savarkar&lt;/span&gt; → called it &lt;span class=&quot;kr&quot;&gt;&quot;First War of Independence&quot;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;📖 &lt;span class=&quot;k&quot;&gt;R.C. Majumdar&lt;/span&gt; → argued it was &lt;span class=&quot;kr&quot;&gt;neither first, national, nor true war&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;💥 Causes&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;hl-red&quot;&gt;&lt;b&gt;💰 Economic&lt;/b&gt;&lt;br&gt;Exploitative land revenue – &lt;span class=&quot;k&quot;&gt;Ryotwari, Mahalwari&lt;/span&gt; → agrarian distress&lt;/div&gt;
      &lt;div class=&quot;hl-orange&quot;&gt;&lt;b&gt;🛐 Religious&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;k&quot;&gt;Religious Disabilities Act&lt;/span&gt;, missionaries → resentment&lt;/div&gt;
      &lt;div class=&quot;hl-blue&quot;&gt;&lt;b&gt;🪖 Military&lt;/b&gt;&lt;br&gt;Poor pay, limited promotion for Indian sepoys&lt;/div&gt;
      &lt;div class=&quot;hl-green&quot;&gt;&lt;b&gt;🏴 Political&lt;/b&gt;&lt;br&gt;British &quot;invincibility&quot; weakened after &lt;span class=&quot;k&quot;&gt;Anglo-Sikh, Anglo-Afghan, Crimean&lt;/span&gt; wars&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card blue&quot;&gt;
    &lt;h2&gt;📅 Timeline of Events&lt;/h2&gt;
    &lt;div class=&quot;timeline&quot;&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;Feb 1857&lt;/span&gt; &lt;span class=&quot;k&quot;&gt;19th Native Infantry&lt;/span&gt; (Berhampur) refused Enfield rifle cartridges 🔫&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;29 Mar 1857&lt;/span&gt; &lt;span class=&quot;k&quot;&gt;Mangal Pandey&lt;/span&gt; (34th Bengal NI) attacked British officers at &lt;span class=&quot;k&quot;&gt;Barrackpore&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;8 Apr 1857&lt;/span&gt; Mangal Pandey &lt;span class=&quot;kr&quot;&gt;executed&lt;/span&gt; ⚠️&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;10 May 1857&lt;/span&gt; ✅ Revolt officially &lt;span class=&quot;k&quot;&gt;broke out at Meerut&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;12 May 1857&lt;/span&gt; Rebels reach &lt;span class=&quot;k&quot;&gt;Delhi&lt;/span&gt;; &lt;span class=&quot;k&quot;&gt;Bahadur Shah II&lt;/span&gt; proclaimed Emperor&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;20 Sep 1857&lt;/span&gt; Delhi recaptured; &lt;span class=&quot;k&quot;&gt;Bahadur Shah Zafar&lt;/span&gt; exiled to Rangoon → &lt;span class=&quot;kr&quot;&gt;end of Mughal dynasty&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;17 Jun 1858&lt;/span&gt; &lt;span class=&quot;k&quot;&gt;Rani Lakshmibai&lt;/span&gt; martyred in battle&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;20 Jun 1858&lt;/span&gt; &lt;span class=&quot;k&quot;&gt;Gwalior&lt;/span&gt; captured → Revolt &lt;span class=&quot;kr&quot;&gt;fully suppressed&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;
      💡 &lt;strong&gt;Memory Trick for 1857:&lt;/strong&gt; &lt;em&gt;&quot;Berhampur Feb, Pandey Mar, Meerut May, Delhi Sep&quot;&lt;/em&gt;&lt;br&gt;
      🔑 &lt;b&gt;3 M&#x27;s&lt;/b&gt;: &lt;b&gt;M&lt;/b&gt;angal Pandey → &lt;b&gt;M&lt;/b&gt;eerut → &lt;b&gt;M&lt;/b&gt;ughal dynasty ended
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card green&quot;&gt;
    &lt;h2&gt;🗺️ Important Centres of Revolt&lt;/h2&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Region&lt;/th&gt;&lt;th&gt;Indian Leaders&lt;/th&gt;&lt;th&gt;British Suppressor&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;&lt;b&gt;Delhi&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Bahadur Shah Zafar, Gen. Bakht Khan&lt;/td&gt;&lt;td&gt;John Nicholson&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;&lt;b&gt;Kanpur&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Nana Saheb, Tantia Tope, Azimullah Khan&lt;/td&gt;&lt;td&gt;Colin Campbell&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;&lt;b&gt;Lucknow/Awadh&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Begum Hazrat Mahal, Birjis Qadr, Maulvi Ahmadullah Shah&lt;/td&gt;&lt;td&gt;Colin Campbell&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;&lt;b&gt;Jhansi &amp; Central India&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Rani Lakshmibai, Tantia Tope&lt;/td&gt;&lt;td&gt;Hugh Rose&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;5&lt;/td&gt;&lt;td&gt;&lt;b&gt;Bareilly (Rohilkhand)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Khan Bahadur Khan&lt;/td&gt;&lt;td&gt;Colin Campbell&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;&lt;b&gt;Bihar, Patna&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Kunwar Singh, Peer Ali Khan&lt;/td&gt;&lt;td&gt;William Taylor&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;&lt;b&gt;Faizabad &amp; Awadh&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Maulvi Ahmadullah Shah&lt;/td&gt;&lt;td&gt;Colin Campbell&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8&lt;/td&gt;&lt;td&gt;&lt;b&gt;Meerut-Baghpat&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Shah Mal&lt;/td&gt;&lt;td&gt;Archdale Wilson&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;&lt;b&gt;Singhbhum (Chotanagpur)&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Gonoa&lt;/td&gt;&lt;td&gt;British local forces&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;strong&gt;Colin Campbell&lt;/strong&gt; suppressed: Kanpur, Lucknow, Bareilly, Faizabad – &lt;em&gt;C for &quot;C&quot;entral North&quot;&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card gold&quot;&gt;
    &lt;h2&gt;📉 Aftermath&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;Delhi captured &lt;span class=&quot;k&quot;&gt;20 Sep 1857&lt;/span&gt;; Bahadur Shah Zafar → exiled to &lt;span class=&quot;k&quot;&gt;Rangoon&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;k&quot;&gt;Nana Saheb&lt;/span&gt; fled to Nepal (1859)&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;k&quot;&gt;Tantia Tope&lt;/span&gt; captured &amp; executed (1859)&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;k&quot;&gt;Rani Lakshmibai&lt;/span&gt; died in battle (June 1858)&lt;/li&gt;
      &lt;li&gt;Revolt fully suppressed &lt;span class=&quot;k&quot;&gt;20 June 1858&lt;/span&gt; at Gwalior&lt;/li&gt;
      &lt;li&gt;Major admin changes via &lt;span class=&quot;k&quot;&gt;1858 Act&lt;/span&gt; ✅&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card accent&quot;&gt;
    &lt;h2&gt;❌ Reasons for Failure&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Limited spread&lt;/span&gt; – mainly confined to North India; no all-India participation&lt;/li&gt;
      &lt;li&gt;⚠️ Many &lt;span class=&quot;k&quot;&gt;rulers, zamindars, educated Indians&lt;/span&gt; sided with British&lt;/li&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Poor organization&lt;/span&gt; &amp; leadership vs. British&#x27;s superior weapons &amp; communication&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;summary-box&quot;&gt;
    &lt;h3&gt;📋 Quick Summary – 1857&lt;/h3&gt;
    &lt;ul class=&quot;plain&quot;&gt;
      &lt;li&gt;✅ Start: &lt;b&gt;10 May 1857, Meerut&lt;/b&gt; | End: &lt;b&gt;20 Jun 1858, Gwalior&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Trigger: &lt;b&gt;Enfield cartridge&lt;/b&gt; issue (cow + pig fat)&lt;/li&gt;
      &lt;li&gt;✅ First martyr: &lt;b&gt;Mangal Pandey&lt;/b&gt; (8 Apr 1857)&lt;/li&gt;
      &lt;li&gt;✅ Result: &lt;b&gt;End of Mughal dynasty&lt;/b&gt;, Crown rule via 1858 Act&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ===================== TAB 2: SWADESHI ===================== --&gt;
&lt;div id=&quot;t2&quot; class=&quot;tab-content&quot;&gt;

  &lt;div class=&quot;card blue&quot;&gt;
    &lt;h2&gt;🏭 Swadeshi Movement&lt;/h2&gt;
    &lt;div class=&quot;hl-orange&quot;&gt;
      &lt;b&gt;Background Trigger:&lt;/b&gt; Lord Curzon&#x27;s order (&lt;span class=&quot;k&quot;&gt;20 July 1905&lt;/span&gt;) → &lt;span class=&quot;k&quot;&gt;Partition of Bengal&lt;/span&gt; into East Bengal &amp; Bengal (official reason: administrative difficulty)
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;📅 Key Sessions&lt;/h2&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Session&lt;/th&gt;&lt;th&gt;Year&lt;/th&gt;&lt;th&gt;President&lt;/th&gt;&lt;th&gt;Key Outcome&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Benaras&lt;/b&gt;&lt;/td&gt;&lt;td&gt;1905&lt;/td&gt;&lt;td&gt;Gokhale&lt;/td&gt;&lt;td&gt;Extremists vs Moderates differences emerge&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Calcutta&lt;/b&gt;&lt;/td&gt;&lt;td&gt;1906&lt;/td&gt;&lt;td&gt;Dadabhai Naoroji&lt;/td&gt;&lt;td&gt;Swaraj declared as INC goal (1st time) ✅&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Surat&lt;/b&gt;&lt;/td&gt;&lt;td&gt;1907&lt;/td&gt;&lt;td&gt;Rash Behari Ghose&lt;/td&gt;&lt;td&gt;Congress Split → Moderates vs Extremists ⚠️&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;BSC&lt;/b&gt; → &lt;b&gt;B&lt;/b&gt;enaras (1905) → &lt;b&gt;S&lt;/b&gt;waraj in Calcutta (1906) → &lt;b&gt;S&lt;/b&gt;plit at Surat (1907)&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card green&quot;&gt;
    &lt;h2&gt;✊ New Forms of Struggle&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;hl-red&quot;&gt;&lt;b&gt;🚫 Boycott Movement&lt;/b&gt;&lt;br&gt;Foreign goods (cloth, salt, sugar) burned publicly&lt;br&gt;💡 First suggested in &lt;span class=&quot;k&quot;&gt;Sanjibani&lt;/span&gt; by &lt;span class=&quot;k&quot;&gt;Krishna Kumar Mitra&lt;/span&gt; (13 Jul 1905)&lt;/div&gt;
      &lt;div class=&quot;hl-blue&quot;&gt;&lt;b&gt;📣 Mass Mobilization&lt;/b&gt;&lt;br&gt;Public meetings, processions, &lt;span class=&quot;k&quot;&gt;Samitis&lt;/span&gt;&lt;br&gt;💡 &lt;span class=&quot;k&quot;&gt;Swadesh Bandhab Samiti&lt;/span&gt; by &lt;span class=&quot;k&quot;&gt;Ashwini Kumar Dutta&lt;/span&gt; (Barisal)&lt;/div&gt;
      &lt;div class=&quot;hl-orange&quot;&gt;&lt;b&gt;🎭 Cultural Methods&lt;/b&gt;&lt;br&gt;Tilak&#x27;s &lt;span class=&quot;k&quot;&gt;Ganapati &amp; Shivaji Festivals&lt;/span&gt;, folk theatre&lt;br&gt;Tagore: &lt;span class=&quot;k&quot;&gt;Amar Sonar Bangla&lt;/span&gt;, Raksha Bandhan as unity symbol&lt;/div&gt;
      &lt;div class=&quot;hl-green&quot;&gt;&lt;b&gt;🔧 Self-Reliance (Atma Shakti)&lt;/b&gt;&lt;br&gt;&lt;span class=&quot;k&quot;&gt;Bengal Chemicals Factory&lt;/span&gt; – Acharya P.C. Ray&lt;br&gt;&lt;span class=&quot;k&quot;&gt;Swadeshi Steam Navigation Co.&lt;/span&gt; – V.O. Chidambaram Pillai&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card gold&quot;&gt;
    &lt;h2&gt;🏫 Programs &amp; Participation&lt;/h2&gt;
    &lt;h3&gt;National Education Movement&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;Bengal National College&lt;/span&gt; – First Principal: &lt;span class=&quot;k&quot;&gt;Aurobindo Ghosh&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;National Council of Education&lt;/span&gt; (15 Aug 1906) – vernacular education&lt;/li&gt;
      &lt;li&gt;✅ Bengal Institute of Technology; students sent to &lt;span class=&quot;k&quot;&gt;Japan&lt;/span&gt; for technical training&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h3&gt;Government Reaction&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Carlyle Circular&lt;/span&gt; (Oct 1905) – curb student participation → led to &lt;span class=&quot;k&quot;&gt;Anti-Circular Society&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h3&gt;Group Responses&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 &lt;b&gt;Workers&lt;/b&gt;: Limited; 1905 press strike → &lt;span class=&quot;k&quot;&gt;Printers&#x27; Union, Calcutta&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 &lt;b&gt;Peasants&lt;/b&gt;: Minimal; some support via &lt;span class=&quot;k&quot;&gt;Vandemataram Movement&lt;/span&gt; (1906) – South India&lt;/li&gt;
      &lt;li&gt;🔹 &lt;b&gt;Muslims&lt;/b&gt;: Low participation → &lt;span class=&quot;k&quot;&gt;All India Muslim League&lt;/span&gt; formed (1906, Dacca, under &lt;span class=&quot;k&quot;&gt;Nawab Salimullah&lt;/span&gt;)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card red&quot;&gt;
    &lt;h2&gt;💥 Surat Split (1907)&lt;/h2&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Point&lt;/th&gt;&lt;th&gt;Extremists&lt;/th&gt;&lt;th&gt;Moderates&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Session venue&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Wanted Nagpur&lt;/td&gt;&lt;td&gt;Shifted to Surat&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;President choice&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Tilak / Lajpat Rai&lt;/td&gt;&lt;td&gt;Rashbehari Ghosh ✅&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Movement scope&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Continue Swadeshi, Boycott, Education&lt;/td&gt;&lt;td&gt;Drop these resolutions&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Methods&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Mass passive resistance&lt;/td&gt;&lt;td&gt;Constitutional only&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;strip&quot;&gt;⚠️ Result → &lt;b&gt;Congress Split 1907&lt;/b&gt;&lt;/div&gt;
    &lt;h3&gt;Repression After Surat Split (1907–1911)&lt;/h3&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Seditious Meetings Act&lt;/span&gt; (1907)&lt;/li&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Indian Newspapers Act&lt;/span&gt; (1908)&lt;/li&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Criminal Law Amendment Act&lt;/span&gt; (1908)&lt;/li&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Indian Press Act&lt;/span&gt; (1910)&lt;/li&gt;
      &lt;li&gt;🔹 1908: &lt;span class=&quot;k&quot;&gt;Tilak&lt;/span&gt; sentenced to 6 years – &lt;span class=&quot;k&quot;&gt;Mandalay Jail&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 1910: &lt;span class=&quot;k&quot;&gt;Aurobindo&lt;/span&gt; withdrew to Pondicherry; &lt;span class=&quot;k&quot;&gt;B.C. Pal&lt;/span&gt; retired&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card purple&quot;&gt;
    &lt;h2&gt;🏛️ Annulment of Bengal Partition (1911–12)&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;12 Dec 1911&lt;/span&gt; (Delhi Durbar) – &lt;span class=&quot;k&quot;&gt;George V&lt;/span&gt; announced annulment&lt;/li&gt;
      &lt;li&gt;🔹 Eastern Bengal &amp; Assam abolished; Bengal reunited&lt;/li&gt;
      &lt;li&gt;🔹 Assam separated again; Capital shifted &lt;span class=&quot;k&quot;&gt;Calcutta → Delhi&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;22 Mar 1912&lt;/span&gt;: Bihar &amp; Orissa created (effective 1 Apr 1912)&lt;/li&gt;
      &lt;li&gt;⚠️ Appeased Bengalis but caused discontent among &lt;span class=&quot;k&quot;&gt;Muslims of Eastern Bengal&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;1911&lt;/b&gt; → &lt;em&gt;&quot;One-Nine-One-One = Partition Gone!&quot;&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;🏛️ Important Establishments&lt;/h2&gt;
    &lt;div class=&quot;icon-row&quot;&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;📰 Sanjibani – K.K. Mitra&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🤝 Swadesh Bandhab Samiti – A.K. Dutta&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🎉 Ganapati Festival – Tilak&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🎶 Amar Sonar Bangla – Tagore&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🏭 Bengal Chemicals – P.C. Ray&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🚢 Steam Navigation – V.O. Pillai&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🎓 NCoE – 15 Aug 1906&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🏫 Bengal Natl. College – Aurobindo&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;summary-box&quot;&gt;
    &lt;h3&gt;📋 Quick Summary – Swadeshi&lt;/h3&gt;
    &lt;ul class=&quot;plain&quot;&gt;
      &lt;li&gt;✅ Trigger: &lt;b&gt;Bengal Partition, 20 Jul 1905&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Swaraj declared first time: &lt;b&gt;Calcutta Session 1906&lt;/b&gt; (Dadabhai Naoroji)&lt;/li&gt;
      &lt;li&gt;✅ Congress split: &lt;b&gt;Surat 1907&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Partition annulled: &lt;b&gt;12 Dec 1911&lt;/b&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ===================== TAB 3: HOME RULE ===================== --&gt;
&lt;div id=&quot;t3&quot; class=&quot;tab-content&quot;&gt;

  &lt;div class=&quot;card blue&quot;&gt;
    &lt;h2&gt;🏠 Home Rule Movement (1916–1918)&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ India&#x27;s response to &lt;span class=&quot;k&quot;&gt;World War I&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ Demanded &lt;span class=&quot;k&quot;&gt;self-government&lt;/span&gt; – shift towards assertive politics&lt;/li&gt;
      &lt;li&gt;💡 Inspired by &lt;span class=&quot;k&quot;&gt;Irish Home Rule Movement&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ Two leagues formed on Irish lines&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;❓ Why HRLM? (Causes)&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Moderates disillusioned with &lt;span class=&quot;k&quot;&gt;Morley-Minto Reforms (1909)&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Wartime hardships – high taxes, rising prices&lt;/li&gt;
      &lt;li&gt;🔹 WWI weakened &lt;span class=&quot;k&quot;&gt;myth of white superiority&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;Tilak&#x27;s return (1914)&lt;/span&gt; + Annie Besant&#x27;s activism gave momentum&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card green&quot;&gt;
    &lt;h2&gt;🎯 Objective &amp; Methods&lt;/h2&gt;
    &lt;div class=&quot;hl-green&quot;&gt;&lt;b&gt;Objective:&lt;/b&gt; Popularise &lt;span class=&quot;k&quot;&gt;Home Rule (self-government)&lt;/span&gt; among masses&lt;/div&gt;
    &lt;h4&gt;Methods&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Meetings, lectures, conferences&lt;/li&gt;
      &lt;li&gt;🔹 Newspapers, pamphlets, posters, songs&lt;/li&gt;
      &lt;li&gt;🔹 Libraries, reading rooms, student groups&lt;/li&gt;
      &lt;li&gt;🔹 Fund collection, social work, local bodies&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card gold&quot;&gt;
    &lt;h2&gt;⚖️ Two Leagues – Comparison&lt;/h2&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Feature&lt;/th&gt;&lt;th&gt;🔥 Tilak&#x27;s League&lt;/th&gt;&lt;th&gt;🌸 Annie Besant&#x27;s League&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Founded&lt;/b&gt;&lt;/td&gt;&lt;td&gt;April 1916, Belgaum&lt;/td&gt;&lt;td&gt;September 1916, Madras/Adyar&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Area&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Maharashtra (excl. Bombay), Karnataka, CP &amp; Berar&lt;/td&gt;&lt;td&gt;Rest of India (incl. Bombay)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;HQ&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Pune&lt;/td&gt;&lt;td&gt;Adyar (Madras)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Key Associates&lt;/b&gt;&lt;/td&gt;&lt;td&gt;G.S. Khaparde, Joseph Baptista&lt;/td&gt;&lt;td&gt;George Arundale, B.W. Wadia, C.P. Ramaswamy Aiyar&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Newspapers&lt;/b&gt;&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;New India, Commonweal&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Membership&lt;/b&gt;&lt;/td&gt;&lt;td&gt;~32,000 by 1917&lt;/td&gt;&lt;td&gt;~200 branches&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;T&lt;/b&gt;ilak = &lt;b&gt;T&lt;/b&gt;erritories of Maharashtra | &lt;b&gt;B&lt;/b&gt;esant = &lt;b&gt;B&lt;/b&gt;road coverage (rest of India)&lt;br&gt;
    🔑 Tilak&#x27;s slogan: &lt;em&gt;&quot;Swaraj is my birthright and I shall have it!&quot;&lt;/em&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card red&quot;&gt;
    &lt;h2&gt;📌 Important Facts&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Tilak faced &lt;span class=&quot;k&quot;&gt;sedition case (1916)&lt;/span&gt;, acquitted; defended by &lt;span class=&quot;k&quot;&gt;M.A. Jinnah&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Young India group (pre-Gandhi) started by &lt;span class=&quot;k&quot;&gt;Jamnadas Dwarkadas, Shankarlal Banker, Indulal Yagnik&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Leaders who joined Besant&#x27;s League: &lt;span class=&quot;k&quot;&gt;Motilal &amp; Jawaharlal Nehru, C.R. Das, Jinnah, Lajpat Rai&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Annie Besant became &lt;span class=&quot;k&quot;&gt;INC President in 1917&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;summary-box&quot;&gt;
    &lt;h3&gt;📋 Quick Summary – Home Rule&lt;/h3&gt;
    &lt;ul class=&quot;plain&quot;&gt;
      &lt;li&gt;✅ Period: &lt;b&gt;1916–1918&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Tilak&#x27;s League: &lt;b&gt;Apr 1916, Belgaum&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Besant&#x27;s League: &lt;b&gt;Sep 1916, Madras/Adyar&lt;/b&gt;&lt;/li&gt;
      &lt;li&gt;✅ Goal: &lt;b&gt;Self-government (Home Rule)&lt;/b&gt; within British Empire&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- ===================== TAB 4: GANDHI&#x27;S MOVEMENTS ===================== --&gt;
&lt;div id=&quot;t4&quot; class=&quot;tab-content&quot;&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;🕊️ Gandhi Returns to India&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ Returned to India in &lt;span class=&quot;k&quot;&gt;1915&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Developed &lt;span class=&quot;k&quot;&gt;Satyagraha&lt;/span&gt; (truth + non-violent resistance) – from South Africa experience&lt;/li&gt;
      &lt;li&gt;🔹 Early satyagrahas: &lt;span class=&quot;k&quot;&gt;Champaran (1917), Ahmedabad (1918), Kheda (1918)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;CAK&lt;/b&gt; → &lt;b&gt;C&lt;/b&gt;hamparan → &lt;b&gt;A&lt;/b&gt;hmedabad → &lt;b&gt;K&lt;/b&gt;heda (1917, 1918, 1918)&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card green&quot;&gt;
    &lt;h2&gt;🌿 Champaran Satyagraha (1917)&lt;/h2&gt;
    &lt;div class=&quot;badge badge-red&quot;&gt;1st Civil Disobedience Movement&lt;/div&gt;
    &lt;h4&gt;Issue&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Tinkathia System&lt;/span&gt; – 3/20 land forced for indigo cultivation&lt;/li&gt;
      &lt;li&gt;⚠️ Planters extracted high rents, illegal dues, fixed low prices&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Gandhi&#x27;s Action&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Invited by &lt;span class=&quot;k&quot;&gt;Rajkumar Shukla&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Defied orders to leave → conducted inquiry → joined &lt;span class=&quot;k&quot;&gt;Champaran Agrarian Committee&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Outcome&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;Tinkathia system abolished&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ ~25% refund to peasants&lt;/li&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;Champaran Agrarian Act (1917)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;hl-green&quot;&gt;&lt;b&gt;Key Associates:&lt;/b&gt; Rajendra Prasad, J.B. Kripalani, Mahadeo Desai, Mazharul Haq&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card blue&quot;&gt;
    &lt;h2&gt;🏭 Ahmedabad Mill Strike (1918)&lt;/h2&gt;
    &lt;div class=&quot;badge badge-blue&quot;&gt;1st Hunger Strike by Gandhi&lt;/div&gt;
    &lt;h4&gt;Issue&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ Dispute over &lt;span class=&quot;k&quot;&gt;withdrawal of plague bonus&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;⚠️ Workers demanded &lt;span class=&quot;k&quot;&gt;50% wage hike&lt;/span&gt;; owners offered only &lt;span class=&quot;k&quot;&gt;25%&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Gandhi&#x27;s Action&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Invited by &lt;span class=&quot;k&quot;&gt;Anusuya Sarabhai&lt;/span&gt; (Ambalal Sarabhai&#x27;s sister)&lt;/li&gt;
      &lt;li&gt;🔹 Advised workers to demand &lt;span class=&quot;k&quot;&gt;35% hike&lt;/span&gt;; remained non-violent&lt;/li&gt;
      &lt;li&gt;🔹 Undertook his &lt;span class=&quot;k&quot;&gt;first fast&lt;/span&gt; to strengthen workers&#x27; resolve&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Outcome&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ Dispute referred to tribunal → workers granted &lt;span class=&quot;k&quot;&gt;35% wage increase&lt;/span&gt; ✅&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card gold&quot;&gt;
    &lt;h2&gt;🌾 Kheda Satyagraha (1918)&lt;/h2&gt;
    &lt;div class=&quot;badge badge-gold&quot;&gt;1st Non-Cooperation&lt;/div&gt;
    &lt;h4&gt;Issue&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Crop failure (drought 1918)&lt;/span&gt;; revenue code allowed remission if yield &amp;lt; 1/4, but govt still collected tax&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Gandhi&#x27;s Action&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Under &lt;span class=&quot;k&quot;&gt;Gujarat Sabha&lt;/span&gt;; led &lt;span class=&quot;k&quot;&gt;no-tax campaign&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;Sardar Patel&lt;/span&gt; + Indulal Yagnik organised peasants&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Outcome&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ Partial concessions – tax only from those able to pay&lt;/li&gt;
      &lt;li&gt;✅ Strengthened Gandhi&#x27;s &lt;span class=&quot;k&quot;&gt;rural base&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card red&quot;&gt;
    &lt;h2&gt;⚖️ Rowlatt Satyagraha (1919)&lt;/h2&gt;
    &lt;div class=&quot;badge badge-red&quot;&gt;1st All-India Satyagraha&lt;/div&gt;
    &lt;h4&gt;Rowlatt Act Provisions&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;⚠️ Continuation of wartime restrictions&lt;/li&gt;
      &lt;li&gt;⚠️ &lt;span class=&quot;k&quot;&gt;Detention without trial&lt;/span&gt; (up to 2 years)&lt;/li&gt;
      &lt;li&gt;⚠️ Arrest/search without warrant&lt;/li&gt;
      &lt;li&gt;⚠️ Trial by special courts (3 HC judges, no appeal)&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Gandhi&#x27;s Response&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ Formed &lt;span class=&quot;k&quot;&gt;Satyagraha Sabha&lt;/span&gt; (24 Feb 1919, Bombay)&lt;/li&gt;
      &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;Hartal on 6 April 1919&lt;/span&gt; – first All-India Satyagraha&lt;/li&gt;
      &lt;li&gt;✅ Began from &lt;span class=&quot;k&quot;&gt;Surat, Gujarat&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Jallianwala Bagh Massacre (13 Apr 1919) 🩸&lt;/h4&gt;
    &lt;div class=&quot;hl-red&quot;&gt;
      &lt;ul class=&quot;plain&quot;&gt;
        &lt;li&gt;🔹 After arrest of &lt;span class=&quot;k&quot;&gt;Dr. Saifuddin Kitchlew &amp; Dr. Satyapal&lt;/span&gt; (9–10 Apr)&lt;/li&gt;
        &lt;li&gt;🔹 Peaceful crowd gathered on &lt;span class=&quot;k&quot;&gt;Baisakhi&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;General Dyer&lt;/span&gt; ordered firing without warning → hundreds killed&lt;/li&gt;
        &lt;li&gt;🔹 Punjab Governor: &lt;span class=&quot;k&quot;&gt;Michael O&#x27;Dwyer&lt;/span&gt; (later assassinated by &lt;span class=&quot;k&quot;&gt;Udham Singh, 1940, London&lt;/span&gt;)&lt;/li&gt;
        &lt;li&gt;✅ Gandhi called it a &lt;span class=&quot;k&quot;&gt;&quot;Himalayan Blunder&quot;&lt;/span&gt; &amp; called off movement&lt;/li&gt;
        &lt;li&gt;✅ Returned title &lt;span class=&quot;k&quot;&gt;&quot;Kaiser-i-hind&quot;&lt;/span&gt;&lt;/li&gt;
        &lt;li&gt;✅ &lt;span class=&quot;k&quot;&gt;Rabindranath Tagore&lt;/span&gt; renounced his knighthood (30 May 1919)&lt;/li&gt;
        &lt;li&gt;✅ Investigation committee: &lt;span class=&quot;k&quot;&gt;Muddiman Committee&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;📊 Early Gandhian Movements – Quick Table&lt;/h2&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Movement&lt;/th&gt;&lt;th&gt;Year&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Key Issue&lt;/th&gt;&lt;th&gt;Key Person&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Champaran&lt;/b&gt;&lt;/td&gt;&lt;td&gt;1917&lt;/td&gt;&lt;td&gt;1st Civil Disobedience&lt;/td&gt;&lt;td&gt;Tinkathia System&lt;/td&gt;&lt;td&gt;Rajkumar Shukla (invited Gandhi)&lt;/td&gt;&lt;/tr&gt;

    &lt;ul&gt;

      &lt;li&gt;✅ Remission of &lt;span class=&quot;k&quot;&gt;fines not yet collected&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ Return of confiscated &lt;span class=&quot;k&quot;&gt;lands not yet sold&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ Allow &lt;span class=&quot;k&quot;&gt;peaceful picketing&lt;/span&gt; of liquor shops and foreign cloth&lt;/li&gt;
      &lt;li&gt;✅ Right to make &lt;span class=&quot;k&quot;&gt;salt&lt;/span&gt; for personal use in coastal villages&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Terms – What Congress Agreed:&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;Suspend CDM&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Participate in &lt;span class=&quot;k&quot;&gt;Second Round Table Conference&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Discontinue all civil disobedience activities&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;strip&quot;&gt;&lt;span class=&quot;kr&quot;&gt;⚠️ Bhagat Singh, Sukhdev, Rajguru were hanged (23 Mar 1931) despite Gandhi&#x27;s request for commutation – this angered many nationalists&lt;/span&gt;&lt;/div&gt;

      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;Communal Award (Aug 1932)&lt;/span&gt; → Gandhi&#x27;s fast in Yeravda Jail → &lt;span class=&quot;k&quot;&gt;Poona Pact (Sep 1932)&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 CDM officially &lt;span class=&quot;kr&quot;&gt;withdrawn on 7 April 1934&lt;/span&gt;&lt;/li&gt;

      &lt;b&gt;Founded:&lt;/b&gt; 1928 | Earlier known as &lt;span class=&quot;k&quot;&gt;HRSA (Hindustan Republican Socialist Association)&lt;/span&gt; founded by &lt;span class=&quot;k&quot;&gt;Sachin Sanyal (1924)&lt;/span&gt;

      &lt;span class=&quot;icon-chip&quot;&gt;Chandrashekhar Azad&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;Sukhdev&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;Rajguru&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;Batukeshwar Dutt&lt;/span&gt;

      &lt;span class=&quot;icon-chip&quot;&gt;Sachindra Nath Sanyal&lt;/span&gt;
    &lt;/div&gt;
    &lt;h4&gt;Ideology&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 Combined &lt;span class=&quot;k&quot;&gt;nationalism + socialism&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Believed in &lt;span class=&quot;k&quot;&gt;armed revolution&lt;/span&gt; against British imperialism&lt;/li&gt;

    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card purple&quot;&gt;
    &lt;h2&gt;⭐ Bhagat Singh – Key Facts&lt;/h2&gt;
    &lt;div class=&quot;grid2&quot;&gt;
      &lt;div class=&quot;hl-orange&quot;&gt;
        &lt;b&gt;Born:&lt;/b&gt; 28 Sep 1907, Lyallpur (Punjab)&lt;br&gt;
        &lt;b&gt;Organisation:&lt;/b&gt; HSRA&lt;br&gt;
        &lt;b&gt;Naujawan Bharat Sabha&lt;/b&gt; (Youth organisation) – co-founded
      &lt;/div&gt;
      &lt;div class=&quot;hl-red&quot;&gt;
        &lt;b&gt;Hanged:&lt;/b&gt; &lt;span class=&quot;k&quot;&gt;23 March 1931&lt;/span&gt;&lt;br&gt;Along with &lt;span class=&quot;k&quot;&gt;Sukhdev &amp; Rajguru&lt;/span&gt;&lt;br&gt;
        Lahore Central Jail
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;h4&gt;Major Actions&lt;/h4&gt;
    &lt;div class=&quot;timeline&quot;&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1928&lt;/span&gt; Killed &lt;span class=&quot;k&quot;&gt;J.P. Saunders (DSP, Lahore)&lt;/span&gt; with Rajguru &amp; Azad → avenge &lt;span class=&quot;k&quot;&gt;Lala Lajpat Rai&#x27;s death&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;8 Apr 1929&lt;/span&gt; Threw &lt;span class=&quot;k&quot;&gt;non-lethal bombs&lt;/span&gt; in Central Legislative Assembly with &lt;span class=&quot;k&quot;&gt;Batukeshwar Dutt&lt;/span&gt; → shouted &lt;span class=&quot;k&quot;&gt;&quot;Inquilab Zindabad!&quot;&lt;/span&gt; → courted arrest&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1929–31&lt;/span&gt; Lahore Conspiracy Case → &lt;span class=&quot;k&quot;&gt;64-day hunger strike&lt;/span&gt; in jail demanding political prisoner status&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;23 Mar 1931&lt;/span&gt; Hanged with Sukhdev &amp; Rajguru 🕊️&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;&quot;BSR&quot;&lt;/b&gt; = &lt;b&gt;B&lt;/b&gt;hagat Singh + &lt;b&gt;S&lt;/b&gt;ukhdev + &lt;b&gt;R&lt;/b&gt;ajguru → hanged together 23 Mar 1931&lt;/div&gt;
    &lt;div class=&quot;hl-blue&quot;&gt;
      💬 Famous quote: &lt;em&gt;&quot;They may kill me, but they cannot kill my ideas.&quot;&lt;/em&gt;&lt;br&gt;
      🔑 Slogan: &lt;span class=&quot;k&quot;&gt;&quot;Inquilab Zindabad!&quot;&lt;/span&gt; (Long Live the Revolution) – popularised by Bhagat Singh
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;🌍 Ghadar Movement (1913)&lt;/h2&gt;
    &lt;ul&gt;
      &lt;li&gt;✅ Founded in &lt;span class=&quot;k&quot;&gt;San Francisco (1913)&lt;/span&gt; by &lt;span class=&quot;k&quot;&gt;Lala Har Dayal&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;✅ HQ: &lt;span class=&quot;k&quot;&gt;Yugantar Ashram, San Francisco&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Newspaper: &lt;span class=&quot;k&quot;&gt;Ghadar&lt;/span&gt; (published in Urdu, Punjabi, Hindi)&lt;/li&gt;
      &lt;li&gt;🔹 Members: Mainly &lt;span class=&quot;k&quot;&gt;Punjabi emigrants&lt;/span&gt; in USA &amp; Canada&lt;/li&gt;
      &lt;li&gt;🔹 Aimed to overthrow British rule through &lt;span class=&quot;k&quot;&gt;armed uprising&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 &lt;span class=&quot;k&quot;&gt;1915 uprising&lt;/span&gt; planned but &lt;span class=&quot;k&quot;&gt;failed&lt;/span&gt; – British got prior information&lt;/li&gt;
      &lt;li&gt;🔹 Key member: &lt;span class=&quot;k&quot;&gt;Kartar Singh Sarabha&lt;/span&gt; – executed (1915); inspired Bhagat Singh&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;Ghadar&lt;/b&gt; = Revolution/Mutiny in Urdu | &lt;b&gt;Lala Har Dayal&lt;/b&gt; started it in USA | &lt;b&gt;1913&lt;/b&gt; founded&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card accent&quot;&gt;
    &lt;h2&gt;✈️ INA (Indian National Army)&lt;/h2&gt;
    &lt;div class=&quot;hl-orange&quot;&gt;
      &lt;b&gt;Founded:&lt;/b&gt; 1942 | &lt;b&gt;Formally reorganised by:&lt;/b&gt; &lt;span class=&quot;k&quot;&gt;Subhas Chandra Bose&lt;/span&gt;&lt;br&gt;
      &lt;b&gt;Motto:&lt;/b&gt; &lt;em&gt;&quot;Ittehad, Itmad aur Qurbani&quot;&lt;/em&gt; (Unity, Faith, Sacrifice)
    &lt;/div&gt;
    &lt;h4&gt;Background&lt;/h4&gt;
    &lt;ul&gt;
      &lt;li&gt;🔹 First INA formed by &lt;span class=&quot;k&quot;&gt;Mohan Singh (1942)&lt;/span&gt; with Japanese support after fall of Singapore&lt;/li&gt;
      &lt;li&gt;🔹 Reorganised by &lt;span class=&quot;k&quot;&gt;Subhas Chandra Bose&lt;/span&gt; in 1943 – called &lt;span class=&quot;k&quot;&gt;&quot;Netaji&quot;&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;🔹 Received support from &lt;span class=&quot;k&quot;&gt;Rash Behari Bose&lt;/span&gt; (already in Japan)&lt;/li&gt;
    &lt;/ul&gt;
    &lt;h4&gt;Structure &amp; Units&lt;/h4&gt;
    &lt;div class=&quot;icon-row&quot;&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🌸 Rani Jhansi Regiment (women)&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;⚔️ Azad Hind Fauj&lt;/span&gt;
      &lt;span class=&quot;icon-chip&quot;&gt;🏛️ Azad Hind Government (1943)&lt;/span&gt;
    &lt;/div&gt;
    &lt;h4&gt;Key Events&lt;/h4&gt;
    &lt;div class=&quot;timeline&quot;&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1943&lt;/span&gt; Subhas Chandra Bose became Supreme Commander; &lt;span class=&quot;k&quot;&gt;Azad Hind Government&lt;/span&gt; proclaimed in Singapore&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1944&lt;/span&gt; INA captured &lt;span class=&quot;k&quot;&gt;Kohima &amp; Imphal&lt;/span&gt; alongside Japanese forces&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1945&lt;/span&gt; Japanese defeat → INA collapsed; Bose died in a plane crash (&lt;span class=&quot;k&quot;&gt;18 Aug 1945&lt;/span&gt;)&lt;/div&gt;
      &lt;div class=&quot;timeline-item&quot;&gt;&lt;span class=&quot;yr&quot;&gt;1945–46&lt;/span&gt; &lt;span class=&quot;k&quot;&gt;INA Trials&lt;/span&gt; (Red Fort) → public outrage → RIN Mutiny triggered&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hl-red&quot;&gt;⚠️ INA Trials: Three officers tried – &lt;span class=&quot;k&quot;&gt;Shah Nawaz Khan, P.K. Sahgal, G.S. Dhillon&lt;/span&gt; (one Hindu, one Muslim, one Sikh – symbolised unity). Defended by &lt;span class=&quot;k&quot;&gt;Bhulabhai Desai&lt;/span&gt;. Public sympathy was massive.&lt;/div&gt;
    &lt;div class=&quot;mnemonic&quot;&gt;💡 &lt;b&gt;Subhas Chandra Bose&#x27;s journey:&lt;/b&gt; INC President (1938, 1939) → resigned → formed &lt;span class=&quot;k&quot;&gt;Forward Bloc (1939)&lt;/span&gt; → escaped India → INA&lt;/div&gt;
  &lt;/div&gt;

&lt;div class=&quot;q-card&quot; data-topic=&quot;t1&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 1&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Who described the Revolt of 1857 as the &quot;First War of Independence&quot;?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; R.C. Majumdar&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; V.D. Savarkar&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Jawaharlal Nehru&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Bal Gangadhar Tilak&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) V.D. Savarkar&lt;/div&gt;Savarkar wrote &lt;b&gt;The Indian War of Independence 1857&lt;/b&gt;. R.C. Majumdar called it &quot;neither first, national, nor a war.&quot; This is a top SSC trap.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t1&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 2&lt;/span&gt;&lt;span class=&quot;q-type type-year&quot;&gt;Year-Based&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;On which date did the Revolt of 1857 officially break out at Meerut?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 29 March 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 8 April 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 10 May 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 12 May 1857&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) 10 May 1857&lt;/div&gt;29 March = Mangal Pandey mutiny at Barrackpore; 8 April = his execution; &lt;b&gt;10 May = revolt at Meerut&lt;/b&gt;; 12 May = rebels reach Delhi.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t1&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 3&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Mangal Pandey belonged to which regiment?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 19th Native Infantry&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 3rd Bengal Cavalry&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 34th Bengal Native Infantry&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 7th Bengal Light Cavalry&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) 34th Bengal Native Infantry&lt;/div&gt;19th NI was at Berhampur (earlier refusal). Mangal Pandey was from the &lt;b&gt;34th Bengal NI at Barrackpore&lt;/b&gt;. Classic SSC trap: confusing Berhampur (19th NI) with Barrackpore (34th NI).&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t1&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 4&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Mangal Pandey was executed on:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 29 March 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 10 May 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 8 April 1857&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 12 May 1857&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) 8 April 1857&lt;/div&gt;Mangal Pandey attacked officers on 29 March and was executed on &lt;b&gt;8 April 1857&lt;/b&gt;. The revolt at Meerut followed on 10 May.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t1&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 5&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The Enfield cartridges that triggered the 1857 Revolt were alleged to be greased with:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Cow fat only&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Pig fat only&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Cow fat AND pig fat (offensive to Hindus and Muslims)&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Ghee and vegetable oil&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Cow fat AND pig fat&lt;/div&gt;The rumour offended both Hindu and Muslim soldiers simultaneously — cows are sacred to Hindus; pigs are forbidden to Muslims. Soldiers had to bite the cartridge tip.&lt;/div&gt;

&lt;div id=&quot;t6-progress&quot; class=&quot;topic-progress&quot;&gt;&lt;span id=&quot;t6-pcount&quot;&gt;0 / 20 revealed&lt;/span&gt;&lt;div class=&quot;progress-bar-wrap&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;t6-pbar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Sevagram, Wardha&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) Sabarmati Ashram, Ahmedabad&lt;/div&gt;Gandhi left Sabarmati Ashram with 78 satyagrahis on &lt;b&gt;12 March 1930&lt;/b&gt; and reached Dandi on &lt;b&gt;6 April 1930&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 2&lt;/span&gt;&lt;span class=&quot;q-type type-year&quot;&gt;Year-Based&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Gandhi broke the salt law at Dandi on:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 12 March 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 6 April 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 4 May 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 21 May 1930&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) 6 April 1930&lt;/div&gt;Mnemonic: &lt;b&gt;12-6-78-240&lt;/b&gt;: 12 Mar=start; 6 Apr=salt broken; 78=followers; 240=miles. 4-5 May = Gandhi arrested at Karadi; 21 May = Dharasana raid by Sarojini Naidu.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 3&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;How many satyagrahis accompanied Gandhi on the Dandi March?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 36&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 108&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 78&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 240&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) 78&lt;/div&gt;78 satyagrahis accompanied Gandhi. 240 is the distance in miles — not the number of followers. 240 miles is another frequently tested fact.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 4&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Who led the Dharasana Salt Works raid after Abbas Tyabji was arrested en route?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Kasturba Gandhi&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Kamala Nehru&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Sarojini Naidu&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Vijaya Lakshmi Pandit&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Sarojini Naidu&lt;/div&gt;Abbas Tyabji was originally chosen but arrested; &lt;b&gt;Sarojini Naidu&lt;/b&gt; (with Imam Saheb) then led the raid on 21 May 1930 — met with brutal lathi-charges.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 5&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The Simon Commission (1927) was chaired by:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Lord Reading&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Sir John Simon&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Lord Irwin&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Stafford Cripps&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) Sir John Simon&lt;/div&gt;Simon Commission appointed November 1927, arrived India 3 February 1928. 7 all-white British members, NO Indian representation — triggered &quot;Simon Go Back&quot; protests.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 6&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Which groups COOPERATED with the Simon Commission? (Choose the correct set)&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; INC and Hindu Mahasabha&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Congress, Muslim League, Liberal Federation&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; B.R. Ambedkar&#x27;s Depressed Classes, Justice Party, Unionist Party&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; All parties cooperated&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C)&lt;/div&gt;Cooperators: Ambedkar (Depressed Classes), Justice Party (Madras), Unionist Party (Punjab). Boycotters: INC, Hindu Mahasabha, Liberal Federation, Jinnah&#x27;s ML faction.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 7&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The Lahore Session (1929) that declared Poorna Swaraj was presided over by:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Gandhi&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Motilal Nehru&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Jawaharlal Nehru&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Subhas Chandra Bose&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Jawaharlal Nehru&lt;/div&gt;&lt;b&gt;Jawaharlal Nehru&lt;/b&gt; presided over the historic Lahore Session (December 1929). He hoisted the tricolour on the banks of the Ravi on 31 December 1929.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 8&lt;/span&gt;&lt;span class=&quot;q-type type-year&quot;&gt;Year-Based&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The Lahore Session (1929) fixed which date as India&#x27;s Independence Day (Purna Swaraj Day)?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 15 August 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 26 November 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 26 January 1930&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 12 March 1930&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) 26 January 1930&lt;/div&gt;26 January 1930 = Purna Swaraj Day. This is why India&#x27;s Constitution came into force on 26 January 1950. 15 August 1947 was actual independence; 12 March 1930 was Dandi March start.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 9&lt;/span&gt;&lt;span class=&quot;q-type type-statement&quot;&gt;Statement-Based&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;&lt;span class=&quot;stmt&quot;&gt;1. Nehru Report (1928) proposed Dominion Status, NOT complete independence.&lt;/span&gt;&lt;span class=&quot;stmt&quot;&gt;2. Nehru Report proposed joint electorates (rejecting separate electorates).&lt;/span&gt;&lt;span class=&quot;stmt&quot;&gt;3. Nehru Report proposed residuary powers with provinces, not Centre.&lt;/span&gt;Which is/are INCORRECT?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 1 and 2&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Only 3&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Only 2&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; All three&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) Only 3 is incorrect&lt;/div&gt;Nehru Report proposed residuary powers with the &lt;b&gt;Centre&lt;/b&gt;, NOT provinces. Statements 1 and 2 are correct.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 10&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The &quot;Frontier Gandhi&quot; who led the Red Shirts (Khudai Khidmatgars) was:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Khan Bahadur Khan&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Khan Abdul Ghaffar Khan&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Maulvi Ahmadullah Shah&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Zafar Ali Khan&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) Khan Abdul Ghaffar Khan&lt;/div&gt;Khan Abdul Ghaffar Khan = Frontier Gandhi = Badshah Khan. Khan Bahadur Khan was an 1857 rebel leader in Bareilly — completely different person and era.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 11&lt;/span&gt;&lt;span class=&quot;q-type type-year&quot;&gt;Year-Based&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The Gandhi-Irwin Pact was signed on:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 12 March 1931&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 5 March 1931&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 23 March 1931&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 1 April 1931&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) 5 March 1931&lt;/div&gt;5 March 1931 = Gandhi-Irwin Pact signed. 23 March 1931 = Bhagat Singh, Sukhdev, Rajguru hanged. These two dates in the same month are critical SSC facts.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t6&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 12&lt;/span&gt;&lt;span class=&quot;q-type type-concept&quot;&gt;Conceptual&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Under the Gandhi-Irwin Pact, which was NOT agreed to by the British?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Release of political prisoners (except those convicted of violence)&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Release of Bhagat Singh, Sukhdev and Rajguru&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Allow peaceful picketing of liquor and cloth shops&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Right to make salt for personal use in coastal villages&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B)&lt;/div&gt;Bhagat Singh et al. were convicted of violence (Saunders murder) — outside the scope of the pact. They were hanged on 23 March 1931 despite Gandhi&#x27;s appeal. This caused massive nationalist outrage.&lt;/div&gt;
&lt;/div&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t8&quot;&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t8&quot;&gt;

&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B)&lt;/div&gt;The RIN Revolt demonstrated that British could no longer rely on Indian military loyalty — directly influencing the Cabinet Mission (1946) and hastening British decision to transfer power.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t8&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 12&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t8&quot;&gt;

&lt;/div&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t8&quot;&gt;

&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 18&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;

&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) 1938 and 1939&lt;/div&gt;Bose was INC President in 1938 and 1939. In 1939 he was re-elected against Gandhi&#x27;s wishes (defeating Pattabhi Sitaramayya). He resigned due to opposition and formed &lt;b&gt;Forward Bloc (1939)&lt;/b&gt;.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;

&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Mohan Singh&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Subhas Chandra Bose&lt;/div&gt;

  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: B) Mohan Singh&lt;/div&gt;Captain &lt;b&gt;Mohan Singh&lt;/b&gt; formed the first INA in 1942 after Singapore fell. Subhas Chandra Bose &lt;i&gt;reorganised&lt;/i&gt; it in 1943. Netaji = reorganiser, NOT original founder.&lt;/div&gt;

&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;

&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Singapore, 1943&lt;/div&gt;

&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 22&lt;/span&gt;&lt;span class=&quot;q-type type-statement&quot;&gt;Statement-Based&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t9&quot;&gt;
