  &lt;!-- 1773 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Regulating Act &lt;span class=&quot;yr&quot;&gt;1773&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Warren Hastings&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Year Trick&lt;/div&gt;7+7+3 = 17 → 17 letters in &quot;Warren Hastings&quot; roughly | Remember: &lt;strong&gt;1773 = First control&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;Rising &lt;span class=&quot;ky&quot;&gt;political &amp;amp; financial power&lt;/span&gt; of EIC → needed Parliament control&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kr&quot;&gt;Dual Govt&lt;/span&gt; in Bengal (1765–72) → corruption, mismanagement, revenue collapse&lt;/li&gt;
          &lt;li&gt;Military setbacks – defeat against &lt;span class=&quot;k&quot;&gt;Hyder Ali&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kr&quot;&gt;Financial crisis&lt;/span&gt; of Company due to wars&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;EIC retained territories under &lt;span class=&quot;kg&quot;&gt;Parliamentary regulation&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;1st step&lt;/span&gt; towards Parliamentary control via Court of Directors&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Governor of Bengal → &lt;span class=&quot;kg&quot;&gt;Governor-General of Bengal&lt;/span&gt; (&lt;span class=&quot;k&quot;&gt;Warren Hastings – 1st&lt;/span&gt;)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Bengal made supreme&lt;/span&gt; over Madras &amp;amp; Bombay (war &amp;amp; diplomacy)&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;k&quot;&gt;Executive Council – 4 members&lt;/span&gt;; majority decisions → limits GG&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Supreme Court at Calcutta (1774)&lt;/span&gt; → checks Company officials&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1781 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Act of Settlement &lt;span class=&quot;yr&quot;&gt;1781&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Warren Hastings&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;causes-sec&quot;&gt;
      &lt;div class=&quot;sub-head&quot;&gt;⚡ Cause&lt;/div&gt;
      &lt;ul class=&quot;pts&quot;&gt;&lt;li&gt;1st effort in India to &lt;span class=&quot;ky&quot;&gt;separate Executive &amp;amp; Judiciary&lt;/span&gt; functions&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;provs-sec&quot;&gt;
      &lt;div class=&quot;sub-head&quot;&gt;✅ Provision&lt;/div&gt;
      &lt;ul class=&quot;pts&quot;&gt;&lt;li class=&quot;imp&quot;&gt;GG &amp;amp; Council + &lt;span class=&quot;kg&quot;&gt;revenue matters exempted&lt;/span&gt; from Supreme Court&#x27;s jurisdiction&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1784 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Pitt&#x27;s India Act &lt;span class=&quot;yr&quot;&gt;1784&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Warren Hastings&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Trick&lt;/div&gt;Pitt = William Pitt the Younger (UK PM) → &lt;strong&gt;Pitt = Parliament Takes control&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Cause&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;&lt;li&gt;Remove shortcomings of 1773 Act; bring Company under &lt;span class=&quot;ky&quot;&gt;supreme control&lt;/span&gt; of British Parliament&lt;/li&gt;&lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;Company territories = &lt;span class=&quot;kg&quot;&gt;&quot;British possessions in India&quot;&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Double Government&lt;/span&gt;: Court of Directors (commercial) + &lt;span class=&quot;kb&quot;&gt;Board of Control&lt;/span&gt; (civil, military, revenue) – 6 members&lt;/li&gt;
          &lt;li&gt;GG&#x27;s Council &lt;span class=&quot;ky&quot;&gt;reduced to 3 members&lt;/span&gt; (incl. Commander-in-Chief)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;GG &amp;amp; Council made &lt;span class=&quot;kr&quot;&gt;subordinate to British Govt&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kg&quot;&gt;Principle of Non-Intervention&lt;/span&gt; introduced&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1793 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Charter Act &lt;span class=&quot;yr&quot;&gt;1793&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Sir John Shore&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Cause&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;&lt;li&gt;Codify laws; &lt;span class=&quot;ky&quot;&gt;transparency in governance&lt;/span&gt;; address power concentration in GG&#x27;s hands&lt;/li&gt;&lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;Company&#x27;s charter extended &lt;span class=&quot;kg&quot;&gt;20 years (till 1813)&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;GG given power to &lt;span class=&quot;ky&quot;&gt;overrule his Council&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Licensed trade&lt;/span&gt; (&quot;country trade&quot;) recognised&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1813 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Charter Act &lt;span class=&quot;yr&quot;&gt;1813&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Minto I&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;ky&quot;&gt;Industrial Revolution&lt;/span&gt; + Napoleonic Wars → Britain seeks new markets&lt;/li&gt;
          &lt;li&gt;Focus: colonization via &lt;span class=&quot;k&quot;&gt;Administration, Education, Religion&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Crown&#x27;s Sovereignty&lt;/span&gt; declared over Company territories&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Company&#x27;s &lt;span class=&quot;kr&quot;&gt;trade monopoly abolished&lt;/span&gt; (except tea &amp;amp; China)&lt;/li&gt;
          &lt;li&gt;Christian &lt;span class=&quot;kb&quot;&gt;missionaries allowed&lt;/span&gt; in India&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Educational Fund – ₹1 lakh/year&lt;/span&gt; for literature, education, sciences&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1833 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Charter Act 1833 / St. Helena Act &lt;span class=&quot;yr&quot;&gt;1833&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord William Bentinck&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Trick&lt;/div&gt;1833 = &quot;India&#x27;s first real Government&quot; → &lt;strong&gt;GG of Bengal → GG of India&lt;/strong&gt;&lt;br&gt;Remember: &lt;span class=&quot;k&quot;&gt;BMAL&lt;/span&gt; = Bentinck, Macaulay (Law Member), Acts named, Law commission&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;EIC monopoly seen harmful; demands for &lt;span class=&quot;ky&quot;&gt;free trade&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Whig (Liberal) govt in Britain → reform-oriented approach&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;GG of Bengal → &lt;span class=&quot;kg&quot;&gt;Governor-General of India&lt;/span&gt; (&lt;span class=&quot;k&quot;&gt;Lord William Bentinck – 1st&lt;/span&gt;)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Govt under GG called &lt;span class=&quot;ky&quot;&gt;&quot;Government of India&quot;&lt;/span&gt; (1st time)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;GG&#x27;s Council → &lt;span class=&quot;kb&quot;&gt;4 members&lt;/span&gt;; 4th = Law Member → &lt;span class=&quot;k&quot;&gt;Thomas Macaulay (1st)&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Laws formally called &lt;span class=&quot;ky&quot;&gt;&quot;Acts&quot;&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Company&#x27;s &lt;span class=&quot;kr&quot;&gt;commercial functions abolished&lt;/span&gt; → purely administrative&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Law Commission&lt;/span&gt; under &lt;span class=&quot;k&quot;&gt;Lord Macaulay&lt;/span&gt; to codify Indian laws&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Aimed at &lt;span class=&quot;ky&quot;&gt;abolition of slavery&lt;/span&gt; → Indian Slavery Act, 1843&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1853 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Charter Act &lt;span class=&quot;yr&quot;&gt;1853&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Dalhousie&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Cause&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;&lt;li&gt;Rise of politically conscious Indians; &lt;span class=&quot;ky&quot;&gt;Bombay Association, Madras Native Association&lt;/span&gt; demanded decentralisation&lt;/li&gt;&lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;1st time: &lt;span class=&quot;kg&quot;&gt;Legislative &amp;amp; Executive functions separated&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Executive Council = GG + 4 members (administration)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Legislative Council = GG + 4 + &lt;span class=&quot;ky&quot;&gt;6 additional members&lt;/span&gt; (incl. provincial reps from Madras, Bombay, Bengal, NW Provinces)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Open competition for civil services&lt;/span&gt; introduced&lt;/li&gt;
          &lt;li&gt;Elements of &lt;span class=&quot;kg&quot;&gt;parliamentary system&lt;/span&gt; introduced (verbal discussions, bills to committees, public proceedings)&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnem&quot;&gt;
      &lt;div class=&quot;mnem-t&quot;&gt;🧠 Charter Acts Summary Mnemonic&lt;/div&gt;
      &lt;strong&gt;Really Powerful Courts Can Make Simple Changes&lt;/strong&gt;&lt;br&gt;
      &lt;small&gt;R=Regulating(1773) · P=Pitt&#x27;s(1784) · C=Charter(1793) · C=Charter(1813) · M=More Charter(1833=St Helena) · S=Still Charter(1853) · C=Crown(1858 not charter)&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ════════════════════════════════════════════════════════ COUNCIL ACTS --&gt;
&lt;section id=&quot;council&quot; class=&quot;section&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;🏛️ Council Acts &amp; Government Acts (1858–1935)&lt;/div&gt;

  &lt;!-- 1858 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Act for Better Government of India &lt;span class=&quot;yr&quot;&gt;1858&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;Lord Canning – 1st Viceroy&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Trick&lt;/div&gt;1857 Revolt → 1858 Act. &lt;strong&gt;&quot;Revolution leads to Resolution&quot;&lt;/strong&gt; – EIC out, Crown in!&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;kr&quot;&gt;Revolt of 1857&lt;/span&gt; exposed failures of Company rule&lt;/li&gt;
          &lt;li&gt;Need to bring Indian admin under direct &lt;span class=&quot;ky&quot;&gt;British Crown control&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Abolition of EIC&lt;/span&gt; rule → transfer to &lt;span class=&quot;kg&quot;&gt;British Crown&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;India governed via &lt;span class=&quot;kb&quot;&gt;Secretary of State for India&lt;/span&gt; (in Britain)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;15-member &lt;span class=&quot;ky&quot;&gt;Council of India&lt;/span&gt; assists Secretary of State&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;GG → &lt;span class=&quot;kg&quot;&gt;Viceroy&lt;/span&gt; (Crown&#x27;s representative) → &lt;span class=&quot;k&quot;&gt;Lord Canning = 1st Viceroy&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;End of Dual Control&lt;/span&gt; – Board of Control &amp;amp; Court of Directors abolished&lt;/li&gt;
          &lt;li&gt;Indian admin under &lt;span class=&quot;kb&quot;&gt;direct British Parliament control&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Policy of &lt;span class=&quot;ky&quot;&gt;non-expansion&lt;/span&gt; – no further annexation (except exceptional necessity)&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kg&quot;&gt;Non-interference in religion&lt;/span&gt; assured&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1861 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Indian Councils Act &lt;span class=&quot;yr&quot;&gt;1861&lt;/span&gt;
      &lt;span class=&quot;lord&quot;&gt;Viceroy: Lord Canning&lt;/span&gt;
      &lt;span class=&quot;badge badge-sos&quot;&gt;SOS: Charles Wood&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Key Shift&lt;/div&gt;1833 = Centralization peak → &lt;strong&gt;1861 = Decentralization begins&lt;/strong&gt; 🔄&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Viceroy&#x27;s Executive Council → &lt;span class=&quot;ky&quot;&gt;+1 member (jurist) = 5th member&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Lord Canning introduced &lt;span class=&quot;kg&quot;&gt;Portfolio System&lt;/span&gt; → foundation of &lt;span class=&quot;k&quot;&gt;Cabinet System in India&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Central Legislative Council → &lt;span class=&quot;kb&quot;&gt;6–12 members&lt;/span&gt; (½ non-officials)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Legislative powers &lt;span class=&quot;ky&quot;&gt;restored to Bombay &amp;amp; Madras&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;New provincial councils: &lt;span class=&quot;k&quot;&gt;Bengal (1862), NW Provinces (1886), Punjab (1897), Burma (1897)&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;GG empowered to issue &lt;span class=&quot;kr&quot;&gt;ordinances during emergencies&lt;/span&gt; (without Legislative Council)&lt;/li&gt;
      &lt;li&gt;GG can &lt;span class=&quot;kb&quot;&gt;create new provinces&lt;/span&gt; for legislative purposes&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;!-- 1892 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Indian Councils Act &lt;span class=&quot;yr&quot;&gt;1892&lt;/span&gt;
      &lt;span class=&quot;lord&quot;&gt;Viceroy: Lord Lansdowne&lt;/span&gt;
      &lt;span class=&quot;badge badge-sos&quot;&gt;SOS: Lord George Hamilton&lt;/span&gt;
    &lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Central Council members → &lt;span class=&quot;ky&quot;&gt;10–16&lt;/span&gt; (½ non-officials)&lt;/li&gt;
      &lt;li&gt;Non-officials included in &lt;span class=&quot;kb&quot;&gt;Provincial Legislative Councils&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;GG empowered to introduce &lt;span class=&quot;kg&quot;&gt;limited / indirect elections&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;GG retains &lt;span class=&quot;k&quot;&gt;power to nominate&lt;/span&gt; some Indian members&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Councils can &lt;span class=&quot;ky&quot;&gt;discuss budget &amp;amp; ask questions&lt;/span&gt; (but &lt;span class=&quot;kr&quot;&gt;NO voting&lt;/span&gt;)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;!-- 1909 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Minto-Morley Reforms &lt;span class=&quot;yr&quot;&gt;1909&lt;/span&gt;
      &lt;span class=&quot;lord&quot;&gt;Viceroy: Lord Minto II&lt;/span&gt;
      &lt;span class=&quot;badge badge-sos&quot;&gt;SOS: Lord John Morley&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;Rising &lt;span class=&quot;ky&quot;&gt;nationalist unrest&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Liberal Party victory in Britain (1906)&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Shimla Deputation 1906&lt;/span&gt; – demanded separate electorates&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;S.P. Sinha&lt;/span&gt; = &lt;span class=&quot;ky&quot;&gt;1st Indian in Viceroy&#x27;s Executive Council&lt;/span&gt; (Law Member)&lt;/li&gt;
          &lt;li&gt;Legislative Councils expanded (~&lt;span class=&quot;kb&quot;&gt;60–69 members&lt;/span&gt;)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Separate electorates for Muslims&lt;/span&gt; – FIRST TIME&lt;/li&gt;
          &lt;li&gt;Members can discuss budget + &lt;span class=&quot;ky&quot;&gt;move resolutions&lt;/span&gt; (advisory only)&lt;/li&gt;
          &lt;li&gt;Indirect elections for non-official members (communal/class basis)&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1919 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Montagu-Chelmsford Reforms &lt;span class=&quot;yr&quot;&gt;1919&lt;/span&gt;
      &lt;span class=&quot;lord&quot;&gt;Viceroy: Lord Chelmsford&lt;/span&gt;
      &lt;span class=&quot;badge badge-sos&quot;&gt;SOS: Edwin Montagu&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Remember&lt;/div&gt;1919 = Dyarchy in provinces + Direct elections for 1st time | &lt;strong&gt;MON-CHEL = MONarch CHELated (limited) power to Indians&lt;/strong&gt;&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div class=&quot;causes-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;⚡ Causes&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li&gt;Montagu&#x27;s Declaration (1917) – promised &lt;span class=&quot;ky&quot;&gt;gradual self-governance&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Growing nationalist pressure + wartime Indian cooperation&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;provs-sec&quot;&gt;
        &lt;div class=&quot;sub-head&quot;&gt;✅ Provisions&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;Created &lt;span class=&quot;kg&quot;&gt;High Commissioner for India&lt;/span&gt; in London (1st: William Meyer)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;GG&#x27;s Council → &lt;span class=&quot;kb&quot;&gt;8 members (3 Indians)&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Bicameral legislature&lt;/span&gt; at Centre: Legislative Assembly + Council of State&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Dyarchy in provinces&lt;/span&gt; – subjects split into:&lt;br&gt;
            &lt;span class=&quot;chip chip-g&quot;&gt;Transferred&lt;/span&gt; (by ministers) &amp;amp; &lt;span class=&quot;chip chip-r&quot;&gt;Reserved&lt;/span&gt; (by Governor)&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Direct elections&lt;/span&gt; – 1st time (limited franchise)&lt;/li&gt;
          &lt;li&gt;Communal representation extended to &lt;span class=&quot;k&quot;&gt;Sikhs, Indian Christians, Anglo-Indians, Europeans&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Provision for &lt;span class=&quot;kb&quot;&gt;Public Service Commission&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Statutory commission after 10 years → later became &lt;span class=&quot;ky&quot;&gt;Simon Commission&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Applied to 8 provinces initially (Bengal, Madras, Bombay, UP, Punjab, Bihar, Orissa, CP)&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 1935 --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Government of India Act &lt;span class=&quot;yr&quot;&gt;1935&lt;/span&gt;
      &lt;span class=&quot;lord&quot;&gt;Viceroy: Lord Willingdon&lt;/span&gt;
      &lt;span class=&quot;badge badge-sos&quot;&gt;SOS: Sir Samuel Hoare&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mnem&quot;&gt;&lt;div class=&quot;mnem-t&quot;&gt;🧠 3 Big Features&lt;/div&gt;&lt;strong&gt;F-P-D&lt;/strong&gt; = &lt;span class=&quot;k&quot;&gt;F&lt;/span&gt;ederation + &lt;span class=&quot;k&quot;&gt;P&lt;/span&gt;rovincial Autonomy + &lt;span class=&quot;k&quot;&gt;D&lt;/span&gt;yarchy at Centre&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🏛️ National Level&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Proposed &lt;span class=&quot;ky&quot;&gt;All India Federation&lt;/span&gt; (never came into effect ❌)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Abolished the &lt;span class=&quot;kr&quot;&gt;Indian Council&lt;/span&gt; (established under 1858 Act)&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🏛️ Central Government&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Provincial dyarchy &lt;span class=&quot;kr&quot;&gt;abolished&lt;/span&gt; → &lt;span class=&quot;kb&quot;&gt;Dyarchy at Centre&lt;/span&gt; (defence &amp;amp; external affairs reserved for GG)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Bicameral Central Legislature&lt;/span&gt; = Council of States + Federal Assembly + GG&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🏛️ Provincial Government&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Provincial Autonomy&lt;/span&gt; – provinces = &lt;span class=&quot;ky&quot;&gt;separate legal entities&lt;/span&gt; for 1st time&lt;/li&gt;
      &lt;li&gt;Provinces derived authority &lt;span class=&quot;kb&quot;&gt;directly from British Crown&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Dyarchy in provinces &lt;span class=&quot;kr&quot;&gt;abolished&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Bicameral legislatures in &lt;span class=&quot;k&quot;&gt;6 provinces&lt;/span&gt;: Bengal, Madras, Bombay, UP, Bihar, Assam&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;sub-head&quot;&gt;📌 Other Provisions&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Burma separated&lt;/span&gt; from India&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Separate electorates extended to &lt;span class=&quot;kg&quot;&gt;women&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Establishment of &lt;span class=&quot;kb&quot;&gt;Federal Court&lt;/span&gt; &amp;amp; Federal Railway Authority&lt;/li&gt;
      &lt;li&gt;PSC for federal + individual provinces&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ════════════════════════════════════════════════════════ GG BENGAL --&gt;
&lt;section id=&quot;gg_bengal&quot; class=&quot;section&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;👑 Governors-General of Bengal (1773–1833)&lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Warren Hastings &lt;span class=&quot;yr&quot;&gt;1773–1785&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Regulating Act 1773 · Supreme Court at Calcutta (1774)&lt;/li&gt;
      &lt;li&gt;1st Anglo-Maratha War · 2nd Anglo-Mysore War · Pitt&#x27;s India Act 1784&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;k&quot;&gt;Ring Fence Policy&lt;/span&gt; – protect Bengal by creating &lt;span class=&quot;ky&quot;&gt;buffer states&lt;/span&gt; around it&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🛡️ Ring Fence Policy&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;&lt;span class=&quot;kg&quot;&gt;Defensive&lt;/span&gt; in nature – safeguard British possessions, not expand&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Awadh&lt;/span&gt; = crucial buffer state for Bengal&#x27;s security&lt;/li&gt;
      &lt;li&gt;Wars with &lt;span class=&quot;k&quot;&gt;Mysore &amp;amp; Marathas&lt;/span&gt; to maintain protective ring&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Later, &lt;span class=&quot;ky&quot;&gt;Wellesley&#x27;s Subsidiary Alliance&lt;/span&gt; expanded this into indirect control&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Cornwallis &lt;span class=&quot;yr&quot;&gt;1786–1793&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;3rd Anglo-Mysore War · Civil Service reforms&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;k&quot;&gt;Cornwallis Code (1793)&lt;/span&gt; – separated &lt;span class=&quot;ky&quot;&gt;executive, revenue &amp;amp; judicial&lt;/span&gt; powers (previously all with District Collector)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Permanent Settlement (1793)&lt;/span&gt; = Zamindari System&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🌾 Permanent Settlement (1793)&lt;/div&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;th&gt;Feature&lt;/th&gt;&lt;th&gt;Detail&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Also known as&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ky&quot;&gt;Zamindari System&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Area&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kb&quot;&gt;~19%&lt;/span&gt; of British India – Bengal, Bihar, Orissa&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Revenue&lt;/td&gt;&lt;td&gt;Zamindars pay &lt;span class=&quot;kr&quot;&gt;10/11th to govt&lt;/span&gt;, keep 1/11th&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Hereditary Rights&lt;/td&gt;&lt;td&gt;Zamindars = owners; can sell/transfer land&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Sunset Law&lt;/td&gt;&lt;td&gt;Late payment → &lt;span class=&quot;kr&quot;&gt;zamindari auctioned&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Landlord-Tenant&lt;/td&gt;&lt;td&gt;Zamindars issued &lt;span class=&quot;ky&quot;&gt;pattas&lt;/span&gt;; tenants gave &lt;span class=&quot;kb&quot;&gt;qabuliats&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Drawbacks&lt;/td&gt;&lt;td&gt;Absentee landlordism, peasant oppression, agricultural stagnation&lt;/td&gt;&lt;/tr&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Sir John Shore &lt;span class=&quot;yr&quot;&gt;1793–1798&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;Charter Act 1793 · Battle of Kharda (1795)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Policy of Non-Intervention&lt;/span&gt; – avoid internal affairs of Indian states&lt;/li&gt;
      &lt;li&gt;British assistance &lt;span class=&quot;kr&quot;&gt;not guaranteed&lt;/span&gt; even to allies (passive approach)&lt;/li&gt;
      &lt;li&gt;Later replaced by &lt;span class=&quot;ky&quot;&gt;Wellesley&#x27;s Subsidiary Alliance&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Wellesley &lt;span class=&quot;yr&quot;&gt;1798–1805&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;4th Anglo-Mysore War · 2nd Anglo-Maratha War · Fort William College (1800)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Subsidiary Alliance System (1798)&lt;/span&gt; – key expansion tool&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🤝 Subsidiary Alliance System (1798)&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Indian ruler must: &lt;span class=&quot;ky&quot;&gt;station British troops&lt;/span&gt; in their territory (at own cost)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Must &lt;span class=&quot;kr&quot;&gt;surrender foreign policy&lt;/span&gt; – no negotiations with other states or non-British Europeans&lt;/li&gt;
      &lt;li&gt;Accept a &lt;span class=&quot;kb&quot;&gt;British Resident&lt;/span&gt; at court&lt;/li&gt;
      &lt;li&gt;British promise: &lt;span class=&quot;kg&quot;&gt;protection against external threats&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;k&quot;&gt;Hyderabad (1798)&lt;/span&gt; = 1st to sign → then Mysore, Awadh, Marathas&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Minto I &lt;span class=&quot;yr&quot;&gt;1807–1813&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;Treaty of Amritsar (1809)&lt;/span&gt; with Ranjit Singh&lt;/li&gt;
      &lt;li&gt;Charter Act of 1813&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Hastings &lt;span class=&quot;yr&quot;&gt;1813–1823&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;3rd Anglo-Maratha War (1817–19) · Ryotwari Settlement in Madras (1820)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Policy of Paramountcy&lt;/span&gt; – British authority is &lt;span class=&quot;ky&quot;&gt;supreme&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;👑 Policy of Paramountcy&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Absolute Authority&lt;/span&gt; – Company&#x27;s power &amp;gt; any Indian state&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Right to Annex&lt;/span&gt; – can annex mismanaged/defiant kingdoms&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;End of Equality&lt;/span&gt; – British no longer treated Marathas/Sikhs as equals&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Amherst &lt;span class=&quot;yr&quot;&gt;1823–1828&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;1st Anglo-Burmese War (1824–26) · &lt;span class=&quot;ky&quot;&gt;Treaty of Yandabo (1826)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ════════════════════════════════════════════════════════ GG INDIA --&gt;
&lt;section id=&quot;gg_india&quot; class=&quot;section&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;🇮🇳 Governors-General of India (1833–1858)&lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord William Bentinck &lt;span class=&quot;yr&quot;&gt;1828–1835&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Abolition of Sati (1829)&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Charter Act of 1833 · Suppression of Thuggee&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Macaulay&#x27;s Minute on Education (1835)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;📚 Macaulay&#x27;s Minute (1835)&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;ky&quot;&gt;English&lt;/span&gt; replaced Sanskrit &amp;amp; Arabic as medium of higher education&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Downward Filtration Theory&lt;/span&gt; – educate only upper class; knowledge &quot;filters down&quot;&lt;/li&gt;
      &lt;li class=&quot;warn&quot;&gt;Goal = produce Indians &lt;span class=&quot;kr&quot;&gt;&quot;Indian in blood, but English in taste&quot;&lt;/span&gt; → colonial clerks&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Sir Charles Metcalfe &lt;span class=&quot;yr&quot;&gt;1835–1836&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Liberator of the Indian Press&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Abolished restrictive &lt;span class=&quot;ky&quot;&gt;Licensing Regulations of 1823&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Metcalfe Act (Press Act 1835) – only declaration of location needed, no license&lt;/li&gt;
      &lt;li&gt;Treated &lt;span class=&quot;kb&quot;&gt;Vernacular &amp;amp; English press equally&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Auckland &lt;span class=&quot;yr&quot;&gt;1836–1842&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;1st Anglo-Afghan War (1838–42) · Death of Maharaja Ranjit Singh (1839)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Ellenborough &lt;span class=&quot;yr&quot;&gt;1842–1844&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Annexation of &lt;span class=&quot;ky&quot;&gt;Sindh (1843)&lt;/span&gt; · War with Gwalior (1843)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Hardinge I &lt;span class=&quot;yr&quot;&gt;1844–1848&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;1st Anglo-Sikh War (1845–46) · &lt;span class=&quot;ky&quot;&gt;Treaty of Lahore&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Social reforms including &lt;span class=&quot;kg&quot;&gt;prohibition of female infanticide&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Dalhousie &lt;span class=&quot;yr&quot;&gt;1848–1856&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Doctrine of Lapse&lt;/span&gt; – Annexation of &lt;span class=&quot;k&quot;&gt;Satara, Jhansi, Nagpur&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;2nd Anglo-Sikh War · Introduction of &lt;span class=&quot;ky&quot;&gt;Railways (1853)&lt;/span&gt; + Telegraph&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Wood&#x27;s Despatch (1854)&lt;/span&gt; = &quot;Magna Carta of Indian Education&quot;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;🔴 Doctrine of Lapse&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Lapse of Sovereignty&lt;/span&gt; – ruler dies without natural male heir → kingdom annexed&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Refusal of Adoption&lt;/span&gt; – adopted sons can inherit property but &lt;span class=&quot;k&quot;&gt;NOT throne&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;British Approval required for adoption (rarely granted)&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;📚 Wood&#x27;s Despatch (1854)&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Govt Responsibility&lt;/span&gt; – British govt declared duty to educate Indian masses&lt;/li&gt;
      &lt;li&gt;Hierarchical structure: &lt;span class=&quot;ky&quot;&gt;Vernacular&lt;/span&gt; (primary) → Anglo-Vernacular (high school) → &lt;span class=&quot;kb&quot;&gt;English&lt;/span&gt; (university)&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Rejected &lt;span class=&quot;kr&quot;&gt;Downward Filtration Theory&lt;/span&gt; → practical mass education incl. women&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Led to: Depts of Education in provinces + &lt;span class=&quot;ky&quot;&gt;Universities in Calcutta, Bombay, Madras (1857)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

&lt;section id=&quot;viceroys&quot; class=&quot;section&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;⚜️ Governors-General &amp;amp; Viceroys (1858–1947)&lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Canning &lt;span class=&quot;yr&quot;&gt;1858–1862&lt;/span&gt; &lt;span class=&quot;lord&quot;&gt;1st Viceroy&lt;/span&gt;&lt;/div&gt;

  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;

      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;High Courts&lt;/span&gt; established at Calcutta, Bombay, Madras (1865)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Mayo &lt;span class=&quot;yr&quot;&gt;1869–1872&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Financial Decentralization · Statistical Survey of India · &lt;span class=&quot;ky&quot;&gt;1st Census of India (1871)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Lytton &lt;span class=&quot;yr&quot;&gt;1876–1880&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;2nd Anglo-Afghan War · &lt;span class=&quot;ky&quot;&gt;Royal Titles Act (1876)&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Vernacular Press Act (1878)&lt;/span&gt; – &quot;Gagging Act&quot;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Arms Act (1878)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub-head&quot;&gt;📰 Vernacular Press Act (1878) – &quot;Gagging Act&quot;&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;warn&quot;&gt;District Magistrates could demand &lt;span class=&quot;ky&quot;&gt;security bond&lt;/span&gt; from vernacular publishers&lt;/li&gt;
          &lt;li class=&quot;warn&quot;&gt;Violation → &lt;span class=&quot;kr&quot;&gt;confiscate printing press&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;warn&quot;&gt;Applied ONLY to &lt;span class=&quot;kb&quot;&gt;Indian-language&lt;/span&gt; papers; English press exempt&lt;/li&gt;
          &lt;li class=&quot;warn&quot;&gt;&lt;span class=&quot;kr&quot;&gt;No right of appeal&lt;/span&gt; in court&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub-head&quot;&gt;🔫 Arms Act (1878)&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;warn&quot;&gt;Criminal offense for &lt;span class=&quot;kr&quot;&gt;Indians to possess weapons&lt;/span&gt; without license&lt;/li&gt;
          &lt;li class=&quot;warn&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Europeans, Anglo-Indians&lt;/span&gt; exempted from licensing&lt;/li&gt;
          &lt;li class=&quot;warn&quot;&gt;Designed to prevent repeat of &lt;span class=&quot;ky&quot;&gt;1857 Revolt&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Ripon &lt;span class=&quot;yr&quot;&gt;1880–1884&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Local Self-Government Resolution (1882)&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;1st Factory Act (1881) · &lt;span class=&quot;kr&quot;&gt;Repeal of Vernacular Press Act&lt;/span&gt; · Hunter Commission (1882)&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub-head&quot;&gt;🏘️ Local Self-Govt Resolution (1882)&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;Created &lt;span class=&quot;ky&quot;&gt;District Boards &amp;amp; Municipalities&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;Majority of &lt;span class=&quot;kg&quot;&gt;non-official (Indian) members&lt;/span&gt;, elected where possible&lt;/li&gt;
          &lt;li&gt;Local bodies controlled: sanitation, education, roads + &lt;span class=&quot;kb&quot;&gt;local funds&lt;/span&gt;&lt;/li&gt;
          &lt;li class=&quot;imp&quot;&gt;1st step toward training Indians in &lt;span class=&quot;ky&quot;&gt;self-governance&lt;/span&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;sub-head&quot;&gt;🏭 1st Factory Act (1881)&lt;/div&gt;
        &lt;ul class=&quot;pts&quot;&gt;
          &lt;li class=&quot;imp&quot;&gt;Children &lt;span class=&quot;kr&quot;&gt;below 7&lt;/span&gt; = PROHIBITED in factories&lt;/li&gt;
          &lt;li&gt;Ages 7–12: max &lt;span class=&quot;ky&quot;&gt;9 hours/day&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;Compulsory &lt;span class=&quot;kg&quot;&gt;weekly holiday&lt;/span&gt; + 4 holidays/month for child workers&lt;/li&gt;
          &lt;li&gt;Fencing of dangerous machinery + govt inspectors&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;sub-head&quot;&gt;📚 Hunter Commission (1882)&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;Headed by &lt;span class=&quot;k&quot;&gt;Sir William Hunter&lt;/span&gt; – reviewed Wood&#x27;s Despatch progress&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;State responsibility for &lt;span class=&quot;ky&quot;&gt;Primary Education&lt;/span&gt; (in vernacular languages)&lt;/li&gt;
      &lt;li&gt;Transfer primary schools to &lt;span class=&quot;kb&quot;&gt;District &amp;amp; Municipal Boards&lt;/span&gt;&lt;/li&gt;
      &lt;li&gt;Secondary: 2 tracks – &lt;span class=&quot;kg&quot;&gt;Literary&lt;/span&gt; (university prep) &amp;amp; &lt;span class=&quot;ky&quot;&gt;Vocational&lt;/span&gt; (technical/commercial)&lt;/li&gt;
      &lt;li&gt;Govt to withdraw from higher education → support &lt;span class=&quot;kb&quot;&gt;private Indian initiatives&lt;/span&gt; via grants&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Dufferin &lt;span class=&quot;yr&quot;&gt;1884–1888&lt;/span&gt;&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Formation of &lt;span class=&quot;ky&quot;&gt;Indian National Congress (1885)&lt;/span&gt; · 3rd Anglo-Burmese War&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;

    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li&gt;Indian Councils Act 1892 · &lt;span class=&quot;kb&quot;&gt;Durand Commission (1893)&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;

      &lt;li&gt;Universities transformed: examining bodies → &lt;span class=&quot;kb&quot;&gt;teaching &amp;amp; research centres&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;warn&quot;&gt;Senate fellows reduced; tenure limited to &lt;span class=&quot;kr&quot;&gt;5 years&lt;/span&gt;&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;Lord Minto II &lt;span class=&quot;yr&quot;&gt;1905–1910&lt;/span&gt;&lt;/div&gt;

&lt;!-- ════════════════════════════════════════════════════════ REVENUE --&gt;
&lt;section id=&quot;revenue&quot; class=&quot;section&quot;&gt;
  &lt;div class=&quot;sec-head&quot;&gt;💰 Land Revenue Systems – Comparison&lt;/div&gt;

  &lt;div class=&quot;mnem&quot;&gt;
    &lt;div class=&quot;mnem-t&quot;&gt;🧠 Mnemonic – 3 Revenue Systems&lt;/div&gt;
    &lt;strong&gt;PRM&lt;/strong&gt; = &lt;span class=&quot;k&quot;&gt;P&lt;/span&gt;ermanent (Zamindari) · &lt;span class=&quot;k&quot;&gt;R&lt;/span&gt;yotwari · &lt;span class=&quot;k&quot;&gt;M&lt;/span&gt;ahalwari&lt;br&gt;
    &lt;small&gt;Areas: P=19% · R=51% · M=rest (NW Provinces, Punjab)&lt;/small&gt;
  &lt;/div&gt;

  &lt;div class=&quot;tbl-wrap&quot;&gt;
    &lt;table&gt;
      &lt;tr&gt;
        &lt;th&gt;Feature&lt;/th&gt;
        &lt;th&gt;🏠 Permanent (1793)&lt;/th&gt;
        &lt;th&gt;🌾 Ryotwari (1820)&lt;/th&gt;
        &lt;th&gt;🏘️ Mahalwari (1822)&lt;/th&gt;
      &lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Introduced by&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Lord Cornwallis&lt;/td&gt;&lt;td&gt;Thomas Munro (Reed earlier)&lt;/td&gt;&lt;td&gt;Holt Mackenzie, R.M. Bird&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Area&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kb&quot;&gt;~19%&lt;/span&gt; – Bengal, Bihar, Orissa&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kg&quot;&gt;~51%&lt;/span&gt; – Madras, Bombay, Assam&lt;/td&gt;&lt;td&gt;NW Provinces, Punjab, Central India&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Revenue Payer&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ky&quot;&gt;Zamindar&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ky&quot;&gt;Ryot (cultivator)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;ky&quot;&gt;Village community (mahal)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Ownership&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Zamindars as owners&lt;/td&gt;&lt;td&gt;Ryots as owners&lt;/td&gt;&lt;td&gt;Joint village ownership&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Intermediaries&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kr&quot;&gt;Present&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kg&quot;&gt;Absent&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Limited (lambardar)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Revenue Nature&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;kr&quot;&gt;Fixed permanently&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Flexible, revised&lt;/td&gt;&lt;td&gt;Periodically revised&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;State Share&lt;/b&gt;&lt;/td&gt;&lt;td&gt;~10/11th&lt;/td&gt;&lt;td&gt;Variable&lt;/td&gt;&lt;td&gt;~66% → ~50%&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Assessment Basis&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fixed (not linked to output)&lt;/td&gt;&lt;td&gt;Based on produce&lt;/td&gt;&lt;td&gt;Net produce (after costs)&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Collection&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Through zamindars&lt;/td&gt;&lt;td&gt;Direct from ryots&lt;/td&gt;&lt;td&gt;Through lambardar&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Key Feature&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Sunset Law, pattas&lt;/td&gt;&lt;td&gt;Direct state–ryot link&lt;/td&gt;&lt;td&gt;Mahal as unit, joint liability&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Major Issues&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Exploitation, absentee landlordism&lt;/td&gt;&lt;td&gt;High burden, indebtedness&lt;/td&gt;&lt;td&gt;High demand, record manipulation&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;

  &lt;div class=&quot;two-col&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-title&quot;&gt;🏠 Permanent Settlement (Zamindari) – Key Points&lt;/div&gt;
      &lt;ul class=&quot;pts&quot;&gt;
        &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kr&quot;&gt;Fixed Revenue Forever&lt;/span&gt; – 10/11th to state&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;ky&quot;&gt;Sunset Law&lt;/span&gt; – late payment → land auction&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Pattas&lt;/span&gt; (by zamindars) + &lt;span class=&quot;kb&quot;&gt;Qabuliats&lt;/span&gt; (by tenants)&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;Led to: &lt;span class=&quot;kr&quot;&gt;absentee landlordism + feudalism + inequality&lt;/span&gt;&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;Peasants: oppression, eviction, indebtedness&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-title&quot;&gt;🌾 Ryotwari System – Key Points&lt;/div&gt;
      &lt;ul class=&quot;pts&quot;&gt;
        &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kg&quot;&gt;Direct tax&lt;/span&gt; from ryots – no intermediaries&lt;/li&gt;
        &lt;li&gt;Ryots = owners + occupancy + transfer rights&lt;/li&gt;
        &lt;li&gt;Wasteland = &lt;span class=&quot;ky&quot;&gt;state property&lt;/span&gt;, taxed when cultivated&lt;/li&gt;
        &lt;li&gt;Revenue periodically revised&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;Led to: &lt;span class=&quot;kr&quot;&gt;landlessness + rural indebtedness&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;🏘️ Mahalwari System (1822)&lt;/div&gt;
    &lt;div class=&quot;two-col&quot;&gt;
      &lt;ul class=&quot;pts&quot;&gt;
        &lt;li&gt;&lt;span class=&quot;kb&quot;&gt;Village = Mahal&lt;/span&gt; (revenue unit)&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;ky&quot;&gt;Lambardar&lt;/span&gt; = village headman collects revenue&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;kg&quot;&gt;Joint ownership&lt;/span&gt; – community collectively responsible&lt;/li&gt;
        &lt;li&gt;State share: ~66% initially → ~50%&lt;/li&gt;
        &lt;li&gt;&lt;span class=&quot;kp&quot;&gt;Mixed character&lt;/span&gt; = Zamindari + Ryotwari → called &lt;span class=&quot;k&quot;&gt;Modified Zamindari&lt;/span&gt;&lt;/li&gt;
      &lt;/ul&gt;
      &lt;ul class=&quot;pts&quot;&gt;
        &lt;li class=&quot;warn&quot;&gt;Inaccurate records – frequent manipulation&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;High revenue demand → indebtedness, land loss&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;British-appointed lambardars weakened traditional authority&lt;/li&gt;
        &lt;li class=&quot;warn&quot;&gt;Collective responsibility → burden on peasants&lt;/li&gt;
      &lt;/ul&gt;

  &lt;!-- RING FENCE --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;🛡️ Ring Fence Policy &lt;span class=&quot;lord&quot;&gt;Warren Hastings (1773–1785)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Remember&lt;/div&gt;&lt;strong&gt;Ring = Defensive Circle&lt;/strong&gt; – Protect Bengal, NOT expand. Like a fence around a garden 🌿&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;Goal: Protect &lt;span class=&quot;ky&quot;&gt;core territories (especially Bengal)&lt;/span&gt; by creating buffer states&lt;/li&gt;
      &lt;li&gt;&lt;span class=&quot;kg&quot;&gt;Defensive in nature&lt;/span&gt; – safeguard, not expand&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;&lt;span class=&quot;kb&quot;&gt;Awadh&lt;/span&gt; = crucial buffer state for Bengal&#x27;s security&lt;/li&gt;
      &lt;li&gt;Wars with &lt;span class=&quot;k&quot;&gt;Mysore &amp;amp; Marathas&lt;/span&gt; fought to maintain protective ring&lt;/li&gt;
      &lt;li class=&quot;tip&quot;&gt;Later evolved into Wellesley&#x27;s &lt;span class=&quot;ky&quot;&gt;Subsidiary Alliance&lt;/span&gt; → indirect control&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;flow-node&quot;&gt;Bengal (Core)&lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;←protected by→&lt;/div&gt;
      &lt;div class=&quot;flow-node&quot;&gt;Buffer States (Awadh, etc.)&lt;/div&gt;
      &lt;div class=&quot;flow-arrow&quot;&gt;←keeps away→&lt;/div&gt;
      &lt;div class=&quot;flow-node&quot;&gt;External Threats (Mysore, Marathas)&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- NON-INTERVENTION --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;🕊️ Policy of Non-Intervention &lt;span class=&quot;lord&quot;&gt;Sir John Shore (1793–1798)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Remember&lt;/div&gt;&lt;strong&gt;Shore = Shore up the savings&lt;/strong&gt; – avoid wars, save money. Passive &amp;amp; cautious 🏦&lt;/div&gt;
    &lt;ul class=&quot;pts&quot;&gt;
      &lt;li class=&quot;imp&quot;&gt;British would &lt;span class=&quot;ky&quot;&gt;NOT interfere&lt;/span&gt; in internal affairs of Indian states&lt;/li&gt;
      &lt;li&gt;No expansionist wars; maintain &lt;span class=&quot;kg&quot;&gt;peace &amp;amp; reduce financial/military burden&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;warn&quot;&gt;British assistance &lt;span class=&quot;kr&quot;&gt;NOT guaranteed&lt;/span&gt; even to allies → very passive&lt;/li&gt;
      &lt;li class=&quot;warn&quot;&gt;Weakness exposed during external threats → policy &lt;span class=&quot;kr&quot;&gt;abandoned&lt;/span&gt;&lt;/li&gt;
      &lt;li class=&quot;imp&quot;&gt;Replaced by &lt;span class=&quot;ky&quot;&gt;Wellesley&#x27;s Subsidiary Alliance&lt;/span&gt; (expansion shift)&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;!-- SUBSIDIARY ALLIANCE --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;div class=&quot;card-title&quot;&gt;🤝 Subsidiary Alliance System &lt;span class=&quot;lord&quot;&gt;Lord Wellesley (1798–1805)&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;trick&quot;&gt;&lt;div class=&quot;trick-t&quot;&gt;💡 Remember – SMRA&lt;/div&gt;
      &lt;strong&gt;S&lt;/strong&gt;tation troops · &lt;strong&gt;M&lt;/strong&gt;ake no foreign deals · &lt;strong&gt;R&lt;/strong&gt;esident at court · &lt;strong&gt;A&lt;/strong&gt;lliance with British for protection
    &lt;/div&gt;
    &lt;div class=&quot;tbl-wrap&quot;&gt;

    window.scrollTo({top:0,behavior:&#x27;smooth&#x27;});
  }

    scrollBtn.classList.toggle(&#x27;show&#x27;, window.scrollY &gt; 300);
  });

&lt;style&gt;
*{box-sizing:border-box;margin:0;padding:0;}

body{font-family:&#x27;Source Sans 3&#x27;,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:15px;line-height:1.6;}

/* PROGRESS */

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}

.opt:hover:not(.done){border-color:#bbb;background:#edeae4;}
.ltr{width:23px;height:23px;border-radius:6px;background:var(--bdr);color:var(--txt2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

/* EXPLANATION */
.ex{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--amb-l);border-left:3px solid var(--amb);font-size:13.5px;color:#4a2800;line-height:1.55;display:none;}

&lt;script&gt;
const Q = {

charter:[
  {q:&quot;The Regulating Act of 1773 was the first step towards parliamentary control over the EIC. What triggered the need for this Act?&quot;,o:[&quot;EIC&#x27;s military defeat in Afghanistan&quot;,&quot;Rising political and financial power of EIC + Dual Govt corruption in Bengal + financial crisis of the Company&quot;,&quot;The French capturing Madras&quot;,&quot;Warren Hastings demanding more power&quot;],c:1,e:&quot;The Regulating Act 1773 was triggered by: &lt;strong&gt;Rising political &amp; financial power of the EIC&lt;/strong&gt; (which worried Parliament), &lt;strong&gt;corruption and mismanagement under the Dual Government in Bengal (1765–72)&lt;/strong&gt;, military setbacks (defeat against Hyder Ali), and the Company&#x27;s &lt;strong&gt;financial crisis&lt;/strong&gt; due to wars.&quot;},
  {q:&quot;The Regulating Act of 1773 made which Presidency supreme over all others in matters of war and diplomacy?&quot;,o:[&quot;Madras Presidency&quot;,&quot;Bombay Presidency&quot;,&quot;Bengal Presidency&quot;,&quot;None — all were equal&quot;],c:2,e:&quot;The &lt;strong&gt;Regulating Act 1773 made Bengal supreme&lt;/strong&gt; over Madras and Bombay in matters of war and diplomacy. This is why the post was called &lt;strong&gt;Governor-General of Bengal&lt;/strong&gt; — the Bengal GG had authority over the other two presidencies.&quot;},
  {q:&quot;The Regulating Act 1773 established the Supreme Court at Calcutta. In which year was it actually set up?&quot;,o:[&quot;1773&quot;,&quot;1774&quot;,&quot;1775&quot;,&quot;1780&quot;],c:1,e:&quot;Although the Regulating Act was passed in 1773, the &lt;strong&gt;Supreme Court at Calcutta was actually established in 1774&lt;/strong&gt;. It was set up to check the conduct of Company officials, particularly the Governor-General and his Council.&quot;},
  {q:&quot;Under the Regulating Act 1773, the Executive Council of the Governor-General of Bengal had how many members?&quot;,o:[&quot;2 members&quot;,&quot;3 members&quot;,&quot;4 members&quot;,&quot;6 members&quot;],c:2,e:&quot;The &lt;strong&gt;Executive Council under the Regulating Act 1773 had 4 members&lt;/strong&gt;. Decisions were made by majority vote, which severely limited the Governor-General&#x27;s personal power. Warren Hastings frequently clashed with his majority-controlled Council.&quot;},
  {q:&quot;The Act of Settlement 1781 was passed primarily to clarify:&quot;,o:[&quot;Land revenue collection methods&quot;,&quot;The first effort to separate Executive and Judiciary — GG and Council exempted from Supreme Court jurisdiction in revenue matters&quot;,&quot;Parliamentary control over EIC trade&quot;,&quot;The rules for appointing judges&quot;],c:1,e:&quot;The &lt;strong&gt;Act of Settlement 1781&lt;/strong&gt; was the first effort in India to separate Executive and Judiciary functions. It specifically exempted the &lt;strong&gt;GG, Council, and revenue matters from the Supreme Court&#x27;s jurisdiction&lt;/strong&gt;. This resolved the conflict between the Supreme Court and the GG&#x27;s Council.&quot;},
  {q:&quot;Pitt&#x27;s India Act 1784 introduced &#x27;Double Government.&#x27; What were the two components?&quot;,o:[&quot;Central Government + Provincial Government&quot;,&quot;Court of Directors (commercial) + Board of Control (political/military/revenue)&quot;,&quot;Parliament + EIC&quot;,&quot;Board of Trade + Board of Revenue&quot;],c:1,e:&quot;Pitt&#x27;s India Act 1784 created &lt;strong&gt;Double Government&lt;/strong&gt;: (1) &lt;strong&gt;Court of Directors&lt;/strong&gt; — handled commercial matters of the EIC; (2) &lt;strong&gt;Board of Control&lt;/strong&gt; — handled civil, military, and revenue matters (6 members including 2 Secretaries of State and the President of the Board of Trade). India was now under dual supervision.&quot;},
  {q:&quot;Pitt&#x27;s India Act 1784 formally described EIC territories in India as:&quot;,o:[&quot;&#x27;Territories of the East India Company&#x27;&quot;,&quot;&#x27;British possessions in India&#x27;&quot;,&quot;&#x27;Crown territories of Asia&#x27;&quot;,&quot;&#x27;Colonial possessions of Britain&#x27;&quot;],c:1,e:&quot;Pitt&#x27;s India Act 1784 formally designated EIC territories as &lt;strong&gt;&#x27;British possessions in India&#x27;&lt;/strong&gt; — for the first time officially acknowledging them as British possessions rather than just trading territories. It also made the GG and Council &lt;strong&gt;subordinate to the British Government&lt;/strong&gt;.&quot;},
  {q:&quot;Pitt&#x27;s India Act 1784 reduced the GG&#x27;s Council to how many members?&quot;,o:[&quot;4 members&quot;,&quot;3 members (including Commander-in-Chief)&quot;,&quot;2 members&quot;,&quot;5 members&quot;],c:1,e:&quot;Pitt&#x27;s India Act 1784 &lt;strong&gt;reduced the GG&#x27;s Council to 3 members&lt;/strong&gt;, one of whom was the Commander-in-Chief. This reduction was to make governance more efficient and reduce the chance of the GG being outvoted by his own Council.&quot;},
  {q:&quot;The Charter Act of 1793 extended the EIC&#x27;s charter for how many years?&quot;,o:[&quot;10 years (till 1803)&quot;,&quot;20 years (till 1813)&quot;,&quot;30 years (till 1823)&quot;,&quot;25 years (till 1818)&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act of 1793 extended the EIC&#x27;s charter for 20 years&lt;/strong&gt; (till 1813). This Act also gave the GG the important power to &lt;strong&gt;overrule his Council&lt;/strong&gt;, addressing the recurring problem of the GG being blocked by Council majority votes.&quot;},
  {q:&quot;Which Charter Act first declared Crown&#x27;s sovereignty over EIC territories and abolished the trade monopoly (except tea and China)?&quot;,o:[&quot;Charter Act 1793&quot;,&quot;Charter Act 1813&quot;,&quot;Charter Act 1833&quot;,&quot;Regulating Act 1773&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act 1813&lt;/strong&gt;: (1) Declared &lt;strong&gt;Crown&#x27;s Sovereignty&lt;/strong&gt; over Company territories; (2) Abolished Company&#x27;s &lt;strong&gt;trade monopoly in India&lt;/strong&gt; (except tea and China); (3) Allowed Christian missionaries; (4) Allocated &lt;strong&gt;₹1 lakh/year for education&lt;/strong&gt;. The Industrial Revolution + Napoleonic Wars drove Britain to seek new markets in India.&quot;},
  {q:&quot;The Charter Act 1813 allocated ₹1 lakh per year for education. This was specifically for:&quot;,o:[&quot;Building schools in all provinces&quot;,&quot;The revival of literature and the promotion of a knowledge of the sciences among the inhabitants of India&quot;,&quot;Training Indian civil servants&quot;,&quot;Establishing universities&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act 1813 allocated ₹1 lakh/year&lt;/strong&gt; specifically for the &lt;strong&gt;&#x27;revival of literature and the promotion of a knowledge of the sciences&#x27;&lt;/strong&gt; among the inhabitants of India. This was the first direct British commitment to Indian education, though the amount was small.&quot;},
  {q:&quot;The Charter Act 1833 (also known as the St. Helena Act) transformed the title from:&quot;,o:[&quot;Governor of Bengal to Governor-General of Bengal&quot;,&quot;Governor-General of Bengal to Governor-General of India&quot;,&quot;Governor-General of India to Viceroy&quot;,&quot;President of Bengal to Governor-General&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act 1833 transformed &#x27;Governor-General of Bengal&#x27; to &#x27;Governor-General of India&#x27;&lt;/strong&gt;. &lt;strong&gt;Lord William Bentinck became the 1st Governor-General of India&lt;/strong&gt;. The government under the GG was now officially called the &#x27;Government of India&#x27; — the first time this name was used.&quot;},
  {q:&quot;The Charter Act 1833 added a 4th (Law) Member to the GG&#x27;s Council. Who was the first to hold this position?&quot;,o:[&quot;Lord Macaulay&quot;,&quot;Warren Hastings&quot;,&quot;Lord Cornwallis&quot;,&quot;Sir Charles Metcalfe&quot;],c:0,e:&quot;&lt;strong&gt;Thomas Babington Macaulay&lt;/strong&gt; was the first Law Member of the GG&#x27;s Council under the Charter Act 1833. He later wrote the famous &lt;strong&gt;Macaulay&#x27;s Minute on Education (1835)&lt;/strong&gt; and also led the Law Commission established under this Act to codify Indian laws.&quot;},
  {q:&quot;The Charter Act 1833 aimed at the abolition of slavery in India. This was achieved through which Act?&quot;,o:[&quot;Indian Slavery Act, 1840&quot;,&quot;Indian Slavery Act, 1843&quot;,&quot;Indian Emancipation Act, 1835&quot;,&quot;Indian Freedom Act, 1850&quot;],c:1,e:&quot;The Charter Act 1833 explicitly aimed at the &lt;strong&gt;abolition of slavery&lt;/strong&gt;. This was achieved through the &lt;strong&gt;Indian Slavery Act, 1843&lt;/strong&gt;, which formally abolished slavery throughout British India under Governor-General Lord Ellenborough.&quot;},
  {q:&quot;The Charter Act 1833 established the Law Commission under Macaulay. What was its purpose?&quot;,o:[&quot;To establish Supreme Courts in all presidencies&quot;,&quot;To codify Indian laws — create a unified legal code for India&quot;,&quot;To train Indian lawyers&quot;,&quot;To replace Sharia and Hindu law entirely&quot;],c:1,e:&quot;The &lt;strong&gt;Law Commission under Macaulay&lt;/strong&gt; was established to &lt;strong&gt;codify Indian laws&lt;/strong&gt; — creating a unified, systematic legal code for India. This eventually resulted in the Indian Penal Code (1860), Code of Criminal Procedure, and other major codes that form the basis of Indian law today.&quot;},
  {q:&quot;The Charter Act 1853 introduced open competition for which service?&quot;,o:[&quot;Indian Police Service&quot;,&quot;Indian Civil Services (ICS)&quot;,&quot;Indian Army&quot;,&quot;Indian Railways&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act 1853 introduced open competitive examination for the Indian Civil Services (ICS)&lt;/strong&gt;. This replaced the earlier system of nominations by the Court of Directors. It was a landmark reform — though the competitive exams were held in England, making them practically inaccessible to Indians.&quot;},
  {q:&quot;The Charter Act 1853 was the first to separate which two functions?&quot;,o:[&quot;Trade and administration&quot;,&quot;Legislative and Executive functions of the GG&#x27;s Council&quot;,&quot;Central and Provincial administration&quot;,&quot;Revenue and Judicial functions&quot;],c:1,e:&quot;The &lt;strong&gt;Charter Act 1853 was the first to separate Legislative and Executive functions&lt;/strong&gt;. The Executive Council remained (GG + 4 members for administration), while a larger Legislative Council was created (GG + 4 Executive Members + 6 additional members including provincial representatives from Madras, Bombay, Bengal, NW Provinces).&quot;},
  {q:&quot;The Charter Act 1853 introduced elements of a parliamentary system. Which of the following is NOT one of these?&quot;,o:[&quot;Verbal discussions on bills&quot;,&quot;Bills referred to committees&quot;,&quot;Public proceedings&quot;,&quot;Direct elections to the Legislative Council&quot;],c:3,e:&quot;The Charter Act 1853 introduced parliamentary elements — &lt;strong&gt;verbal discussions, bills referred to committees, and public proceedings&lt;/strong&gt;. However, &lt;strong&gt;direct elections were NOT introduced&lt;/strong&gt; in 1853. Direct elections came much later with the &lt;strong&gt;Montagu-Chelmsford Reforms of 1919&lt;/strong&gt;.&quot;},
  {q:&quot;The cause of the Charter Act 1853 included demands from which Indian associations for decentralisation?&quot;,o:[&quot;Indian National Congress and Muslim League&quot;,&quot;Bombay Association and Madras Native Association&quot;,&quot;Bengal Presidency Association and Poona Sarvajanik Sabha&quot;,&quot;Brahmo Samaj and Arya Samaj&quot;],c:1,e:&quot;The Charter Act 1853 was partly driven by demands for decentralisation from the &lt;strong&gt;Bombay Association and Madras Native Association&lt;/strong&gt; — early political organisations representing the rise of a &lt;strong&gt;politically conscious Indian middle class&lt;/strong&gt;.&quot;},
],

council:[
  {q:&quot;The Act for Better Government of India 1858 was triggered primarily by:&quot;,o:[&quot;The failure of Pitt&#x27;s India Act&quot;,&quot;The Revolt of 1857 exposing failures of Company rule&quot;,&quot;The end of the Napoleonic Wars&quot;,&quot;The financial collapse of the EIC&quot;],c:1,e:&quot;The &lt;strong&gt;Act for Better Government of India 1858&lt;/strong&gt; was triggered by the &lt;strong&gt;Revolt of 1857&lt;/strong&gt;, which exposed the fundamental failures of Company administration. The British Crown decided to take direct control — abolishing the EIC and transferring power to the Crown.&quot;},
  {q:&quot;Under the 1858 Act, who was designated as &#x27;Secretary of State for India&#x27; and what was the supporting body?&quot;,o:[&quot;The Viceroy supported by 5-member Council&quot;,&quot;A minister in the British Cabinet supported by a 15-member Council of India&quot;,&quot;The President of the Board of Control&quot;,&quot;The Director of the Court of Directors&quot;],c:1,e:&quot;The &lt;strong&gt;1858 Act created the Secretary of State for India&lt;/strong&gt; — a member of the British Cabinet — supported by a &lt;strong&gt;15-member Council of India&lt;/strong&gt;. India was now governed through the Secretary of State rather than through the dual Board of Control/Court of Directors system.&quot;},
  {q:&quot;The 1858 Act abolished which two bodies that had controlled EIC governance?&quot;,o:[&quot;Supreme Court and Company Board&quot;,&quot;Board of Control and Court of Directors — ending Dual Control&quot;,&quot;Bombay and Madras Presidencies&quot;,&quot;Legislative and Executive Councils&quot;],c:1,e:&quot;The &lt;strong&gt;1858 Act abolished both the Board of Control and the Court of Directors&lt;/strong&gt;, ending the &#x27;Dual Control&#x27; system established by Pitt&#x27;s India Act 1784. All Indian administration was now directly under the British Parliament through the Secretary of State.&quot;},
  {q:&quot;Under the 1858 Act, the Governor-General&#x27;s title was changed to:&quot;,o:[&quot;President of India&quot;,&quot;Viceroy of India — representing the Crown directly&quot;,&quot;Prime Minister of India&quot;,&quot;Supreme Governor of India&quot;],c:1,e:&quot;Under the &lt;strong&gt;1858 Act, the Governor-General became &#x27;Viceroy of India&#x27;&lt;/strong&gt; — the direct representative of the British Crown. &lt;strong&gt;Lord Canning became the first Viceroy of India&lt;/strong&gt;. The Viceroy represented royal authority in India.&quot;},
  {q:&quot;The Indian Councils Act 1861 introduced the Portfolio System in India. Who actually introduced it as practice?&quot;,o:[&quot;Lord Wellesley&quot;,&quot;Lord Dalhousie&quot;,&quot;Lord Canning (who also became the first Viceroy)&quot;,&quot;Lord Cornwallis&quot;],c:2,e:&quot;Although the &lt;strong&gt;Indian Councils Act 1861 gave legislative basis&lt;/strong&gt;, it was &lt;strong&gt;Lord Canning&lt;/strong&gt; who introduced the &lt;strong&gt;Portfolio System in practice&lt;/strong&gt;. Under this system, each executive council member was assigned specific departments (portfolios), forming the foundation of the Cabinet system in India.&quot;},
  {q:&quot;The Indian Councils Act 1861 restored legislative powers to which two presidencies (that had been centralised in 1833)?&quot;,o:[&quot;Punjab and Bengal&quot;,&quot;Bombay and Madras&quot;,&quot;Calcutta and Delhi&quot;,&quot;Assam and NW Provinces&quot;],c:1,e:&quot;The Indian Councils Act 1861 &lt;strong&gt;restored legislative powers to Bombay and Madras&lt;/strong&gt; — powers that had been centralised under the Charter Act 1833. This was the beginning of decentralisation. New provincial councils were also established (Bengal 1862, NW Provinces 1886, Punjab 1897, Burma 1897).&quot;},
  {q:&quot;Under the Indian Councils Act 1861, the GG was empowered to:&quot;,o:[&quot;Conduct direct elections in provinces&quot;,&quot;Issue ordinances during emergencies without the Legislative Council&quot;,&quot;Dismiss the Secretary of State&quot;,&quot;Declare war without Parliament&#x27;s approval&quot;],c:1,e:&quot;A key provision of the &lt;strong&gt;Indian Councils Act 1861&lt;/strong&gt;: the GG was empowered to &lt;strong&gt;issue ordinances during emergencies without the Legislative Council&lt;/strong&gt;. This extraordinary executive power allowed the GG to bypass the legislative process in urgent situations.&quot;},
  {q:&quot;The Indian Councils Act 1892 introduced limited/indirect elections. What else did it allow councils to do for the first time?&quot;,o:[&quot;Pass laws independently&quot;,&quot;Discuss the budget and ask questions (but with NO voting rights)&quot;,&quot;Remove the GG&quot;,&quot;Appoint provincial governors&quot;],c:1,e:&quot;The &lt;strong&gt;Indian Councils Act 1892&lt;/strong&gt; allowed councils to &lt;strong&gt;discuss the budget and ask questions&lt;/strong&gt;. However, there was &lt;strong&gt;NO voting right&lt;/strong&gt; — members could only discuss and ask questions. This was a limited but significant step toward legislative participation.&quot;},
  {q:&quot;Under the Indian Councils Act 1892, how many members could the Central Council have?&quot;,o:[&quot;6–12 members&quot;,&quot;8–14 members&quot;,&quot;10–16 members (half non-officials)&quot;,&quot;20–30 members&quot;],c:2,e:&quot;Under the &lt;strong&gt;Indian Councils Act 1892, the Central Council could have 10–16 members&lt;/strong&gt;, with half being non-officials. The GG retained the power to nominate some Indian members. This was an increase from the 6–12 members under the 1861 Act.&quot;},
  {q:&quot;The Minto-Morley Reforms (1909) introduced separate electorates for Muslims — historically significant because:&quot;,o:[&quot;It was the first electoral reform in India&quot;,&quot;It was the FIRST TIME separate electorates were provided for Muslims — foundation of communal politics&quot;,&quot;It gave Muslims 50% reservation&quot;,&quot;It created the Muslim League&quot;],c:1,e:&quot;The &lt;strong&gt;Minto-Morley Reforms 1909 introduced SEPARATE ELECTORATES for Muslims for the FIRST TIME&lt;/strong&gt; in Indian history. This was a landmark (and controversial) measure — the Shimla Deputation of 1906 had specifically demanded this. It is considered the foundation of communal representation that eventually contributed to Partition.&quot;},
  {q:&quot;S.P. Sinha became the first Indian to be appointed to the Viceroy&#x27;s Executive Council under which reforms?&quot;,o:[&quot;Charter Act 1853&quot;,&quot;Indian Councils Act 1892&quot;,&quot;Minto-Morley Reforms 1909 (as Law Member)&quot;,&quot;Montagu-Chelmsford Reforms 1919&quot;],c:2,e:&quot;&lt;strong&gt;S.P. (Satyendra Prasanno) Sinha&lt;/strong&gt; became the &lt;strong&gt;first Indian in the Viceroy&#x27;s Executive Council&lt;/strong&gt; as &lt;strong&gt;Law Member&lt;/strong&gt; under the &lt;strong&gt;Minto-Morley Reforms 1909&lt;/strong&gt;. This was a symbolic but significant breakthrough in Indian representation at the highest levels of administration.&quot;},
  {q:&quot;The Montagu-Chelmsford Reforms 1919 introduced &#x27;Dyarchy&#x27; in the provinces. Dyarchy divided provincial subjects into:&quot;,o:[&quot;Central and Provincial subjects&quot;,&quot;Administrative and Financial subjects&quot;,&quot;Transferred (ministers) and Reserved (Governor) subjects&quot;,&quot;Legislative and Executive subjects&quot;],c:2,e:&quot;&lt;strong&gt;Dyarchy (dual government)&lt;/strong&gt; under the 1919 Act divided provincial subjects into: (1) &lt;strong&gt;Transferred subjects&lt;/strong&gt; — administered by ministers responsible to the legislature (education, health, public works, agriculture); (2) &lt;strong&gt;Reserved subjects&lt;/strong&gt; — controlled by the Governor (law &amp; order, finance, revenue, irrigation).&quot;},
  {q:&quot;The Montagu-Chelmsford Reforms 1919 introduced direct elections for the first time in India. What was the franchise like?&quot;,o:[&quot;Universal adult franchise — every adult could vote&quot;,&quot;Limited franchise — only those meeting property/tax qualifications&quot;,&quot;Only men above 25 could vote&quot;,&quot;All Indians could vote but with British supervisors&quot;],c:1,e:&quot;The 1919 Act introduced &lt;strong&gt;direct elections for the FIRST TIME&lt;/strong&gt;, but with a &lt;strong&gt;limited franchise&lt;/strong&gt; — only those meeting property or tax qualifications could vote. It was NOT universal adult franchise. Universal adult franchise came only with the Constitution of India (1950).&quot;},
