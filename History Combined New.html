&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Bipin Chandra Pal&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Aurobindo Ghosh&lt;/div&gt;Aurobindo Ghosh = first principal of Bengal National College. Ashwini Kumar Dutta founded &lt;b&gt;Swadesh Bandhab Samiti&lt;/b&gt;. Frequent confusion between these two.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 17&lt;/span&gt;&lt;span class=&quot;q-type type-chrono&quot;&gt;Chronology&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Correct order of repressive acts (1907–1919):&lt;br&gt;1. Rowlatt Act &amp;nbsp;2. Seditious Meetings Act &amp;nbsp;3. Indian Press Act &amp;nbsp;4. Indian Newspapers Act&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 2 → 4 → 3 → 1&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 4 → 2 → 3 → 1&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 2 → 3 → 4 → 1&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 1 → 2 → 3 → 4&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: A) 2 → 4 → 3 → 1&lt;/div&gt;Seditious Meetings Act (1907) → Indian Newspapers Act (1908) → Indian Press Act (1910) → Rowlatt Act (1919).&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 18&lt;/span&gt;&lt;span class=&quot;q-type type-analytical&quot;&gt;Cross-Topic&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Which statement correctly connects Jallianwala Bagh massacre with its consequence?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Directly led Gandhi to launch NCM same year (1919)&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Congress formally adopted Poorna Swaraj in 1919&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Tagore renounced knighthood; Gandhi returned Kaiser-i-Hind; NCM followed in 1920&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Directly triggered the Simon Commission boycott&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C)&lt;/div&gt;Immediate consequences: Tagore renounced knighthood (30 May 1919); Gandhi returned Kaiser-i-Hind. NCM followed in &lt;b&gt;1920&lt;/b&gt; (not same year). Poorna Swaraj only in 1929.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 19&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The three INA officers tried at Red Fort were Shah Nawaz Khan (Muslim), P.K. Sahgal (Hindu), and G.S. Dhillon (__):&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Muslim&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Hindu&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Sikh&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Christian&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Sikh&lt;/div&gt;The three represented three major communities: Muslim, Hindu, Sikh — creating a powerful symbol of national unity. Defended by Bhulabhai Desai.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 20&lt;/span&gt;&lt;span class=&quot;q-type type-odd&quot;&gt;Odd One Out&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Which of these leaders was NOT associated with the Home Rule League?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Annie Besant&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Bal Gangadhar Tilak&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Gopal Krishna Gokhale&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Jawaharlal Nehru&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Gokhale&lt;/div&gt;Gokhale died in &lt;b&gt;February 1915&lt;/b&gt;, before the HRL was founded in 1916. Besant and Tilak founded the two leagues; Nehru joined Besant&#x27;s league.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 21&lt;/span&gt;&lt;span class=&quot;q-type type-statement&quot;&gt;Statement-Based&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;&lt;span class=&quot;stmt&quot;&gt;1. Udham Singh killed Michael O&#x27;Dwyer in London in 1940.&lt;/span&gt;&lt;span class=&quot;stmt&quot;&gt;2. Kartar Singh Sarabha of Ghadar Party was executed in 1915 and inspired Bhagat Singh.&lt;/span&gt;&lt;span class=&quot;stmt&quot;&gt;3. Bhagat Singh was born on 28 September 1907 in Lyallpur.&lt;/span&gt;Which are CORRECT?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; 1 only&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; 1 and 2 only&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; 2 and 3 only&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; 1, 2 and 3&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: D) All three&lt;/div&gt;All three are correct — comprehensive facts spanning 1907–1940.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 22&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-med&quot;&gt;Medium&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;The 26 January 1930 (Purna Swaraj Day) is significant because:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; India gained independence on this date&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; It is India&#x27;s Constitution Day&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; It was fixed by Lahore Session (1929); the Constitution came into force on 26 Jan 1950 to honour this date&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; It marks the Dandi March start&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C)&lt;/div&gt;26 Jan 1930 = Purna Swaraj Day (fixed by Lahore Session 1929). India&#x27;s Constitution came into force on &lt;b&gt;26 January 1950&lt;/b&gt; — deliberately chosen to honour that date.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 23&lt;/span&gt;&lt;span class=&quot;q-type type-analytical&quot;&gt;Cross-Topic Trap&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;Which person was active in BOTH the Swadeshi Movement AND the INA?&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Aurobindo Ghosh&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Bipin Chandra Pal&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Rash Behari Bose&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; V.D. Savarkar&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Rash Behari Bose&lt;/div&gt;Rash Behari Bose was active in Swadeshi/revolutionary politics (Delhi bomb 1912) and later in Japan helped organise the INA for Subhas Bose. He bridges both periods.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 24&lt;/span&gt;&lt;span class=&quot;q-type type-direct&quot;&gt;Factual&lt;/span&gt;&lt;span class=&quot;diff diff-easy&quot;&gt;Easy&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;&quot;Inquilab Zindabad&quot; means:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Death to British Imperialism&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Freedom is our birthright&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; Long Live the Revolution&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Victory to Hindustan&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) Long Live the Revolution&lt;/div&gt;&quot;Inquilab Zindabad&quot; = Long Live the Revolution (Urdu/Hindi). Popularised by Bhagat Singh in the Central Legislative Assembly bombing case (1929).&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;q-card&quot; data-topic=&quot;t10&quot;&gt;
  &lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;q-num&quot;&gt;Q 25&lt;/span&gt;&lt;span class=&quot;q-type type-concept&quot;&gt;Grand Finale&lt;/span&gt;&lt;span class=&quot;diff diff-hard&quot;&gt;Hard&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;q-text&quot;&gt;All of these facts are correct EXCEPT one:&lt;/div&gt;
  &lt;div class=&quot;options&quot;&gt;&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;A)&lt;/span&gt; Ghadar Party founded San Francisco 1913 by Lala Har Dayal&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;B)&lt;/span&gt; Naujawan Bharat Sabha founded by Bhagat Singh in 1926&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;correct&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;C)&lt;/span&gt; HSRA originally founded as HRSA by Bhagat Singh in 1924&lt;/div&gt;
&lt;div class=&quot;opt&quot; onclick=&quot;selectOpt(this,&#x27;wrong&#x27;)&quot;&gt;&lt;span class=&quot;opt-label&quot;&gt;D)&lt;/span&gt; Bhulabhai Desai defended INA officers at Red Fort trials&lt;/div&gt;
&lt;/div&gt;
  &lt;button class=&quot;reveal-btn&quot; onclick=&quot;revealAns(this)&quot;&gt;Show Answer&lt;/button&gt;
  &lt;div class=&quot;explanation&quot;&gt;&lt;div class=&quot;ans-line&quot;&gt;✅ Correct: C) — INCORRECT&lt;/div&gt;HRSA was founded in 1924 by &lt;b&gt;Sachin Sanyal&lt;/b&gt; — NOT Bhagat Singh. Bhagat Singh reorganised it as HSRA in 1928. This is the most repeated SSC trap on revolutionary organisations.&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;button class=&quot;scroll-top&quot; id=&quot;scrollTopBtn&quot; onclick=&quot;window.scrollTo({top:0,behavior:&#x27;smooth&#x27;})&quot;&gt;&amp;#8593;&lt;/button&gt;
&lt;script&gt;
function showTab(id,btn){
  document.querySelectorAll(&#x27;.tab-content&#x27;).forEach(t=&gt;t.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.tab-btn&#x27;).forEach(b=&gt;b.classList.remove(&#x27;active&#x27;));
  document.getElementById(id).classList.add(&#x27;active&#x27;);
  btn.classList.add(&#x27;active&#x27;);
  window.scrollTo({top:0,behavior:&#x27;smooth&#x27;});
}
function selectOpt(el,result){
  const opts=el.closest(&#x27;.options&#x27;).querySelectorAll(&#x27;.opt&#x27;);
  opts.forEach(o=&gt;o.classList.remove(&#x27;correct&#x27;,&#x27;wrong&#x27;));
  el.classList.add(result===&#x27;correct&#x27;?&#x27;correct&#x27;:&#x27;wrong&#x27;);
}
const progressData={};
function revealAns(btn){
  const card=btn.closest(&#x27;.q-card&#x27;);
  const exp=card.querySelector(&#x27;.explanation&#x27;);
  const topic=card.dataset.topic;
  if(!exp.classList.contains(&#x27;show&#x27;)){
    exp.classList.add(&#x27;show&#x27;);
    btn.textContent=&#x27;Hide Answer&#x27;;
    btn.classList.add(&#x27;revealed&#x27;);
    if(!progressData[topic])progressData[topic]=new Set();
    progressData[topic].add(card);
    updateProgress(topic);
  } else {
    exp.classList.remove(&#x27;show&#x27;);
    btn.textContent=&#x27;Show Answer&#x27;;
    btn.classList.remove(&#x27;revealed&#x27;);
  }
}
function updateProgress(topic){
  const total=document.querySelectorAll(&#x27;[data-topic=&quot;&#x27;+topic+&#x27;&quot;]&#x27;).length;
  const revealed=progressData[topic]?progressData[topic].size:0;
  const pct=Math.round((revealed/total)*100);
  const pc=document.getElementById(topic+&#x27;-pcount&#x27;);
  const pb=document.getElementById(topic+&#x27;-pbar&#x27;);
  if(pc)pc.textContent=revealed+&#x27; / &#x27;+total+&#x27; revealed&#x27;;
  if(pb)pb.style.width=pct+&#x27;%&#x27;;
}
window.addEventListener(&#x27;scroll&#x27;,()=&gt;{
  const btn=document.getElementById(&#x27;scrollTopBtn&#x27;);
  if(window.scrollY&gt;400)btn.classList.add(&#x27;show&#x27;);
  else btn.classList.remove(&#x27;show&#x27;);
});
&lt;/script&gt;

{n:&quot;1. Acts 1773–1858&quot;,b:[
[&#x27;h&#x27;,&#x27;Regulating Act, 1773&#x27;],[&#x27;l&#x27;,[
&quot;✅ **First direct intervention of British Parliament** in Company affairs; to **regulate political &amp; administrative affairs**&quot;,
&quot;Governor of Bengal → **Governor-General of Bengal**; **Warren Hastings** = first&quot;,
&quot;**Council of 4**; **majority vote**, GG had **casting vote** in tie&quot;,
&quot;✅ **Supreme Court, Calcutta (1774)**: Chief Justice + 3 judges; **Sir Elijah Impey** = first CJ&quot;,
&quot;**Bombay &amp; Madras subordinate** to Bengal in **war &amp; peace**&quot;,
&quot;Company to report **civil, military, revenue** affairs to British govt&quot;,
&quot;Servants **barred from private trade** &amp; accepting **presents/bribes**&quot;,
&quot;Court of Directors: **4-year term**, **¼ retire annually**&quot;]],
[&#x27;h&#x27;,&#x27;Amending Act / Act of Settlement, 1781&#x27;],[&#x27;l&#x27;,[
&quot;Defined **Supreme Court jurisdiction** – mainly **British subjects in Calcutta**&quot;,
&quot;**Revenue matters** &amp; **GG-Council official acts** = outside its jurisdiction&quot;,
&quot;Court to respect **personal laws &amp; customs of Indians**&quot;]],
[&#x27;h&#x27;,&quot;Pitt&#x27;s India Act, 1784&quot;],[&#x27;l&#x27;,[
&quot;✅ **Dual control**; created **Board of Control** (British govt)&quot;,
&quot;**Court of Directors → Commercial** | **Board of Control → Political**&quot;,
&quot;Board: **6 members** incl. **Chancellor of Exchequer** &amp; **Secretary of State**&quot;,
&quot;GG&#x27;s Council **4 → 3 members**; **greater control** over Bombay &amp; Madras&quot;,
&quot;Presidencies must follow GG on **war &amp; diplomacy**&quot;,
&quot;Territories called **\&quot;British possessions in India\&quot;**&quot;]],
[&#x27;h&#x27;,&#x27;Charter Act, 1793&#x27;],[&#x27;l&#x27;,[
&quot;Charter renewed **20 years**; **commercial monopoly** continued&quot;,
&quot;GG&#x27;s control over Presidencies strengthened; GG could **override Council**&quot;,
&quot;**Commander-in-Chief** could be Council member&quot;,
&quot;Official salaries &amp; expenses paid from **Indian revenues**&quot;,
&quot;**Crown&#x27;s sovereignty** over Company territories reinforced&quot;]],
[&#x27;h&#x27;,&#x27;Charter Act, 1813&#x27;],[&#x27;l&#x27;,[
&quot;Renewed **20 years**&quot;,
&quot;✅ **Ended trade monopoly** except **Tea** &amp; **China trade** → private British merchants allowed&quot;,
&quot;**Christian missionaries** allowed&quot;,
&quot;**₹1 lakh/year for education** – beginning of official support&quot;,
&quot;Company kept **political &amp; admin functions**; monopoly **partially abolished**&quot;]],
[&#x27;h&#x27;,&#x27;Charter Act, 1833&#x27;],[&#x27;l&#x27;,[
&quot;Renewed **20 years**; **ended Company&#x27;s commercial activities completely** (incl. **Tea &amp; China**) → **administrative body**&quot;,
&quot;✅ GG of Bengal → **GG of India**; **Lord William Bentinck** = first&quot;,
&quot;**Centralised legislature**; power with **GG in Council**&quot;,
&quot;Added **Law Member**; **Macaulay** = first&quot;,
&quot;**Separated executive &amp; legislative** functions&quot;,
&quot;Govt of India supervises **whole British India**&quot;,
&quot;Tried **open competition for civil services** (not implemented)&quot;,
&quot;No Indian barred by **religion, birth, descent, colour**&quot;]],
[&#x27;h&#x27;,&#x27;Charter Act, 1853&#x27;],[&#x27;l&#x27;,[
&quot;**No fixed 20-year period** for renewal&quot;,
&quot;Clearer **legislative–executive separation**; **6 additional members** = separate **legislative wing**&quot;,
&quot;More representative (not elected); **local representation**: **Bengal, Bombay, Madras, NW Provinces**&quot;,
&quot;✅ **Open competition for ICS** – competitive exams; **Macaulay Committee (1854)** developed it&quot;]],
[&#x27;h&#x27;,&#x27;Government of India Act, 1858&#x27;],[&#x27;l&#x27;,[
&quot;✅ **Abolished Company rule**; India under **British Crown**&quot;,
&quot;Created **Secretary of State for India** (Cabinet member) + **Council of India (15 members)**&quot;,
&quot;**Board of Control &amp; Court of Directors abolished**&quot;,
&quot;GG also **Viceroy**; **Lord Canning** = first Viceroy&quot;,
&quot;Indian admin **responsible to British govt**&quot;]],
F([&quot;Parliament/Crown&quot;,&quot;Secretary of State&quot;,&quot;Viceroy&quot;,&quot;Indian administration&quot;]),
[&#x27;n&#x27;,&#x27;mn&#x27;,&quot;🧠 &lt;b&gt;Charter order:&lt;/b&gt; 1793 monopoly stays → 1813 partly ends → 1833 fully ends (GG of India) → 1853 open ICS. &lt;br&gt;Rule: &lt;b&gt;13 = 1 lakh + missionaries&lt;/b&gt;; &lt;b&gt;33 = Bentinck + Macaulay&lt;/b&gt;&quot;],
[&#x27;n&#x27;,&#x27;tip&#x27;,&quot;💡 Regulating 73 → Supreme Court 74 → Amending 81 → Pitt 84 (7-3, 8-1, 8-4 pattern of years)&quot;],
[&#x27;n&#x27;,&#x27;sum&#x27;,&quot;📌 &lt;b&gt;Summary:&lt;/b&gt; Parliament tightened control step by step: Regulating (1773) → dual control (1784) → trade monopoly ended (1813/1833) → ICS competition (1853) → Crown rule (1858).&quot;]]},
{n:&quot;2. Acts 1861–1947&quot;,b:[
[&#x27;h&#x27;,&#x27;Indian Councils Act, 1861&#x27;],[&#x27;l&#x27;,[
&quot;✅ **Associated Indians with legislation**; Viceroy nominates **6–12 additional members**&quot;,
&quot;**Canning** nominated **Raja of Benaras, Maharaja of Patiala, Sir Dinkar Rao**&quot;,
&quot;**Restored legislative powers** to Bombay &amp; Madras; **legislative decentralisation**&quot;,
&quot;Recognised **portfolio system**&quot;,
&quot;Viceroy&#x27;s **ordinances** in emergency – max **6 months**&quot;]],
[&#x27;h&#x27;,&#x27;Indian Councils Act, 1892&#x27;],[&#x27;l&#x27;,[
&quot;**Enlarged councils** (Centre &amp; provinces)&quot;,
&quot;**Indirect election** principle (Act used **nomination on recommendation**)&quot;,
&quot;Could **discuss budget** &amp; **ask questions** – but **no supplementary questions**, **no budget vote**&quot;]],
[&#x27;h&#x27;,&#x27;Indian Councils Act, 1909 / Morley–Minto&#x27;],[&#x27;l&#x27;,[
&quot;**John Morley** (Sec. of State) &amp; **Lord Minto II** (Viceroy)&quot;,
&quot;Bigger councils; **election more explicit**; more Indian participation&quot;,
&quot;**Satyendra Prasad Sinha** = first Indian in **Viceroy&#x27;s Executive Council**&quot;,
&quot;✅ **Separate electorates for Muslims** (first time) – became major colonial feature&quot;,
&quot;Members could **ask supplementary questions**, **move resolutions**, **discuss budget**&quot;,
&quot;⚠️ Executive still responsible to **British authorities**&quot;]],
[&#x27;h&#x27;,&#x27;Government of India Act, 1919 / Montagu–Chelmsford&#x27;],[&#x27;l&#x27;,[
&quot;✅ **Dyarchy in provinces**: **Reserved** &amp; **Transferred** subjects&quot;,
&quot;**Reserved** (Governor + councillors): law &amp; order, police, justice, land revenue, irrigation&quot;,
&quot;**Transferred** (Indian ministers, responsible to council): education, public health, agriculture, local self-govt&quot;,
&quot;Governor kept **overriding powers**&quot;,
&quot;✅ **Bicameralism at Centre**: **Council of State + Legislative Assembly**&quot;,
&quot;**Direct elections** on larger scale (franchise restricted); bigger councils&quot;,
&quot;**Separate electorates** extended to more communities&quot;,
&quot;Provided **Public Service Commission**; central &amp; provincial subjects separated (**provincial autonomy** beginning)&quot;,
&quot;**Review after 10 years** → **Simon Commission 1927**&quot;]],
[&#x27;h&#x27;,&#x27;Government of India Act, 1935&#x27;],[&#x27;l&#x27;,[
&quot;✅ **Provincial autonomy**; **dyarchy abolished** in provinces; ministers responsible to **elected legislatures**; Governors kept **discretionary powers**&quot;,
&quot;Proposed **All-India Federation** (provinces + princely states) – **never operated** (states didn&#x27;t join)&quot;,
&quot;**Dyarchy at Centre** proposed – **never implemented**&quot;,
&quot;**Three lists**: Federal, Provincial, Concurrent; **residuary powers** with **GG**&quot;,
&quot;**Bicameralism in some provinces**; electorate expanded (**no universal franchise**)&quot;,
&quot;**Federal Court** provided; set up **1937**&quot;,
&quot;**Federal, Provincial &amp; Joint PSCs**&quot;,
&quot;**Women&#x27;s representation** expanded – **reserved seats**; safeguards for **minorities**&quot;,
&quot;**Burma separated (1937)**; **Sind** from Bombay; **Orissa** from Bihar &amp; Orissa&quot;]],
[&#x27;h&#x27;,&#x27;Indian Independence Act, 1947&#x27;],[&#x27;l&#x27;,[
&quot;Passed by **British Parliament, July 1947**; **two Dominions: India &amp; Pakistan**&quot;,
&quot;Effective **15 Aug 1947**; **British suzerainty over princely states ended** – states free to choose India/Pakistan&quot;,
&quot;**Secretary of State office abolished**; British control ended; Parliament **can&#x27;t legislate** for them&quot;,
&quot;**Constituent Assemblies** = sovereign; make constitutions + act as legislatures meanwhile&quot;,
&quot;GG = **constitutional head** (on advice of govt); **Mountbatten** first GG of India&quot;,
&quot;Leaders could **amend/repeal British laws**&quot;,
&quot;**GoI Act 1935** continued as **interim framework** with adaptations&quot;]],
[&#x27;n&#x27;,&#x27;mn&#x27;,&quot;🧠 &lt;b&gt;1861→1892→1909→1919→1935:&lt;/b&gt; Nominate → Indirect → Separate electorate (Muslims) → Dyarchy → Autonomy&quot;],
[&#x27;n&#x27;,&#x27;tip&#x27;,&quot;💡 &lt;b&gt;1909 = &#x27;Muslim&#x27; electorates; 1919 = &#x27;Dyarchy&#x27; + 2 houses; 1935 = &#x27;Autonomy&#x27; + 3 lists + Federal Court&lt;/b&gt;&quot;],
[&#x27;n&#x27;,&#x27;sum&#x27;,&quot;📌 &lt;b&gt;Summary:&lt;/b&gt; Indians gradually got a role: nomination (1861) → election (1892/1909) → dyarchy (1919) → provincial autonomy (1935) → sovereignty (1947).&quot;]]},
{n:&quot;3. Education&quot;,b:[
[&#x27;h&#x27;,&#x27;Early Institutions&#x27;],[&#x27;t&#x27;,[&quot;Year&quot;,&quot;Institution&quot;,&quot;By&quot;],[[&quot;1781&quot;,&quot;Calcutta Madrasah&quot;,&quot;Warren Hastings&quot;],[&quot;1791&quot;,&quot;Sanskrit College, Benares&quot;,&quot;Jonathan Duncan&quot;],[&quot;1800&quot;,&quot;Fort William College, Calcutta&quot;,&quot;Lord Wellesley&quot;],[&quot;1817&quot;,&quot;Hindu College&quot;,&quot;Ram Mohan Roy, David Hare, Radhakanta Deb&quot;]]],
[&#x27;h&#x27;,&#x27;Charter Act 1813&#x27;],[&#x27;l&#x27;,[
&quot;**First formal step** – govt accepts responsibility for education&quot;,
&quot;**₹1 lakh/yr** for **revival of literature** &amp; **scientific knowledge**&quot;,
&quot;**Unclear**: Oriental or Western? → **Orientalist–Anglicist controversy**&quot;,
&quot;**Orientalists (Sir William Jones)**: Sanskrit, Arabic, Persian&quot;,
&quot;**Anglicists (Macaulay)**: Western literature, science, English&quot;,
&quot;Settled for **Anglicists in 1835**&quot;]],
[&#x27;h&#x27;,&quot;Macaulay&#x27;s Minute, 1835&quot;],[&#x27;l&#x27;,[
&quot;By **T.B. Macaulay**, **2 Feb 1835**; supported **Anglicists**&quot;,
&quot;**Western literature &amp; science**; **English** as medium&quot;,
&quot;Opposed spending mainly on **Oriental learning**&quot;,
&quot;**Downward Filtration Theory**: educate **small elite first**, spreads down&quot;,
&quot;**Bentinck&#x27;s Resolution, 7 March 1835** adopted Anglicist policy&quot;]],
[&#x27;h&#x27;,&quot;Wood&#x27;s Despatch, 1854 (Sir Charles Wood)&quot;],[&#x27;l&#x27;,[
&quot;✅ **\&quot;Magna Carta of English Education in India\&quot;**; **rejected Downward Filtration**&quot;,
&quot;**Systematic structure**: primary → university&quot;,
&quot;**Vernacular at primary**; **English at higher** levels&quot;,
&quot;**Universities at Calcutta, Bombay, Madras** (set up **1857**)&quot;,
&quot;**Departments of Public Instruction** in provinces&quot;,
&quot;**Grants-in-aid** system; **teacher training**; **female education**&quot;,
&quot;Expansion beyond narrow elite approach&quot;]],
[&#x27;h&#x27;,&#x27;Hunter Commission, 1882–83 (Indian Education Commission)&#x27;],[&#x27;l&#x27;,[
&quot;Appointed **1882** by **Lord Ripon**; chair **Sir W.W. Hunter**&quot;,
&quot;Examined **primary &amp; secondary** education; primary found **inadequate**&quot;,
&quot;**Local bodies** (district boards, municipalities) to run primary → **decentralisation**&quot;,
&quot;Primary through **vernacular**; **private agencies** in secondary with aid&quot;,
&quot;Different secondary streams incl. **vocational**&quot;]],
[&#x27;h&#x27;,&#x27;Indian Universities Act, 1904&#x27;],[&#x27;l&#x27;,[
&quot;Based on **Raleigh Commission (1902)** – **Sir Thomas Raleigh**&quot;,
&quot;Recommended **reorganised university admin**, **strict oversight of colleges**, **stricter affiliation**, curriculum/exam changes&quot;,
&quot;**University control of secondary schools**; **recognition of schools** required&quot;,
&quot;⚠️ **Nationalists criticised**: more **official control**, less autonomy&quot;]],
[&#x27;h&#x27;,&#x27;Sadler Commission, 1917–19 (Calcutta University Commission)&#x27;],[&#x27;l&#x27;,[
&quot;Appointed **1917**; chair **Michael Ernest Sadler**; on Calcutta Univ. but covered **wider system**&quot;,
&quot;**12-year school course** before university; **separate intermediate colleges**&quot;,
&quot;Structure: **School → Intermediate → University**; reduce burden on universities&quot;,
&quot;**Greater university autonomy**; improve teaching, research, secondary, teacher training, women&#x27;s education&quot;,
&quot;Shift to **structural &amp; academic reform**&quot;]],
[&#x27;h&#x27;,&#x27;Wardha Scheme / Basic Education (Nai Talim), 1937 – Gandhi&#x27;],[&#x27;l&#x27;,[
&quot;After **Wardha Conference 1937**&quot;,
&quot;**Free compulsory education, 7 years (age 7–14)**; **mother tongue** medium&quot;,
&quot;**Learning by doing**; **productive craft** at centre (spinning, weaving, agriculture, handicrafts)&quot;,
&quot;Subjects integrated with craft; **practical, self-reliant, rooted in Indian life**&quot;,
&quot;**Nationalist alternative** to colonial education&quot;]],
[&#x27;h&#x27;,&#x27;Sargent Plan, 1944 (Sir John Sargent)&#x27;],[&#x27;l&#x27;,[
&quot;By **Central Advisory Board of Education**; **post-war plan**&quot;,
&quot;**Free compulsory education, age 6–14**; **pre-primary** development&quot;,
&quot;Secondary reform; **academic, technical, vocational** pathways&quot;,
&quot;Improve **teacher, university, technical, professional** education; **mass education**&quot;,
&quot;⚠️ Limited by **finances, WWII, independence** → **blueprint only**&quot;]],
[&#x27;n&#x27;,&#x27;mn&#x27;,&quot;🧠 &lt;b&gt;Years:&lt;/b&gt; 81-91-1800 (Madrasah→Sanskrit→Fort William); 13 (₹1 lakh) → 35 (Macaulay) → 54 (Wood) → 57 (Univs) → 82 (Hunter) → 1904 (Raleigh) → 17 (Sadler) → 37 (Wardha) → 44 (Sargent)&quot;],
[&#x27;n&#x27;,&#x27;tip&#x27;,&quot;💡 &lt;b&gt;Wood = Magna Carta&lt;/b&gt;; &lt;b&gt;Hunter = Primary/Local bodies&lt;/b&gt;; &lt;b&gt;Sadler = 12 years/Intermediate&lt;/b&gt;; &lt;b&gt;Wardha = 7–14 &amp; craft&lt;/b&gt;; &lt;b&gt;Sargent = 6–14&lt;/b&gt;&quot;],
[&#x27;n&#x27;,&#x27;sum&#x27;,&quot;📌 &lt;b&gt;Summary:&lt;/b&gt; 1813 aid → 1835 Anglicist win → 1854 Wood blueprint → 1857 universities → later commissions fix primary (Hunter), control (1904), structure (Sadler) → nationalist Wardha and post-war Sargent.&quot;]]},
{n:&quot;4. Press Act &amp; Ilbert Bill&quot;,b:[
[&#x27;h&#x27;,&#x27;Vernacular Press Act, 1878&#x27;],[&#x27;l&#x27;,[
&quot;By **Lord Lytton (1878)** to control **Indian-language papers** critical of British&quot;,
&quot;Targeted **vernacular press**; **English papers exempt**&quot;,
&quot;Authorities could demand **security deposits** &amp; **confiscate printing property**&quot;,
&quot;✅ **Amrita Bazar Patrika** (Bengali weekly) **switched to English overnight** to escape the Act&quot;,
&quot;Showed **discriminatory nature**; strong opposition; symbol of **press restrictions**&quot;,
&quot;**Repealed by Lord Ripon, 1882**&quot;]],
[&#x27;h&#x27;,&#x27;Ilbert Bill, 1883&#x27;],[&#x27;l&#x27;,[
&quot;By **Sir Courtenay Ilbert**, **Law Member** under **Lord Ripon**&quot;,
&quot;Aim: end **racial discrimination** – **Indian district magistrates/sessions judges** could **try Europeans** in criminal cases&quot;,
&quot;Earlier: Europeans generally tried by **European judge/magistrate**&quot;,
&quot;**Strong European opposition** – planters, merchants, Anglo-Indians; campaigns &amp; meetings&quot;,
&quot;**Compromise**: Bill **modified** – accused Europeans get **jury with ≥ half European/English members**&quot;,
&quot;Exposed **racial discrimination**; Indians backed **equality before law** → strengthened **organised nationalism**&quot;]],
[&#x27;n&#x27;,&#x27;mn&#x27;,&quot;🧠 &lt;b&gt;78 Lytton → 82 Ripon repeals → 83 Ilbert (Ripon)&lt;/b&gt;. Lytton = Lock the press; Ripon = Relief&quot;],
[&#x27;n&#x27;,&#x27;sum&#x27;,&quot;📌 &lt;b&gt;Summary:&lt;/b&gt; VPA 1878 (Lytton) gagged Indian-language press, repealed 1882 by Ripon. Ilbert Bill 1883 sought equality in trials; diluted after white protest but boosted nationalism.&quot;]]},
{n:&quot;5. Land Revenue&quot;,b:[
[&#x27;h&#x27;,&#x27;Comparison Table&#x27;],[&#x27;t&#x27;,[&quot;Feature&quot;,&quot;Permanent Settlement&quot;,&quot;Ryotwari&quot;,&quot;Mahalwari&quot;],[
[&quot;Introduction &amp; period&quot;,&quot;**Cornwallis, 1793** (Permanent Settlement Regulation); from earlier Cornwallis-era Bengal settlement&quot;,&quot;Mainly **Alexander Read &amp; Thomas Munro**, early 19th c.; expanded in **Madras &amp; Bombay**&quot;,&quot;**Holt Mackenzie 1822**; revised under **Robert M. Bird 1833**&quot;],
[&quot;Main areas&quot;,&quot;**Bengal, Bihar, Odisha**, parts of **Madras** (zamindari areas)&quot;,&quot;**Madras &amp; Bombay Presidencies**; parts of **Assam** etc.&quot;,&quot;**NW Provinces**, parts of **Punjab**, **Central India**&quot;],
[&quot;Settlement with&quot;,&quot;**Zamindars** (proprietors/landholders)&quot;,&quot;**Individual ryots** directly; no intermediary&quot;,&quot;**Mahal** (village/group); **co-sharers** collectively responsible&quot;],
[&quot;Nature of revenue&quot;,&quot;**Permanently fixed**; paid even if income changed&quot;,&quot;**Not permanent**; periodically reassessed by holding quality&quot;,&quot;**Periodically revised** after surveys &amp; expected produce&quot;],
[&quot;Peasants&#x27; position&quot;,&quot;Became **tenants**; high rents, insecure&quot;,&quot;**Ryot = landholder** (subject to revenue); direct govt–cultivator link&quot;,&quot;Cultivators use land in village; **community carries collective responsibility**&quot;],
[&quot;Collection &amp; default&quot;,&quot;Zamindar collects rent, pays govt; default → **estate auctioned**&quot;,&quot;Ryot pays **directly**; default → loss of holding&quot;,&quot;**Headman/community** pays; govt recovers arrears from mahal&quot;],
[&quot;Objectives&quot;,&quot;**Stable revenue** + **loyal landed class**&quot;,&quot;**Eliminate intermediaries**; assessment per holding&quot;,&quot;Use **village structure**; village = basic admin unit&quot;],
[&quot;Effects &amp; problems&quot;,&quot;Powerful zamindars; **exploitation, high rents, absentee landlordism**; zamindars lost estates too&quot;,&quot;High assessments → **indebtedness &amp; distress** in bad harvests&quot;,&quot;**High demands, collective liability**, uncertainty from reassessment&quot;]]],
[&#x27;n&#x27;,&#x27;mn&#x27;,&quot;🧠 &lt;b&gt;P-Z-1793 (Permanent–Zamindar–Cornwallis)&lt;/b&gt;; &lt;b&gt;R-R-Munro (Ryotwari–Ryot–Munro)&lt;/b&gt;; &lt;b&gt;M-M-Mackenzie (Mahalwari–Mahal–Mackenzie)&lt;/b&gt;&quot;],
[&#x27;n&#x27;,&#x27;tip&#x27;,&quot;💡 Fixed = Permanent; Direct = Ryotwari; Village/collective = Mahalwari. Years: 1793 → 1822 → 1833&quot;],
[&#x27;n&#x27;,&#x27;sum&#x27;,&quot;📌 &lt;b&gt;Summary:&lt;/b&gt; Permanent = zamindar + fixed + Bengal/Bihar/Odisha. Ryotwari = ryot + direct + Madras/Bombay. Mahalwari = village + collective + NWP/Punjab.&quot;]]},
{n:&quot;6. Judicial &amp; Police&quot;,b:[
[&#x27;h&#x27;,&#x27;1. Warren Hastings – Judicial&#x27;],[&#x27;l&#x27;,[
&quot;✅ **1772 Judicial Plan** – greater Company control over justice&quot;,
&quot;**District Diwani Adalats**: **civil** (property, inheritance, marriage, caste); headed by **Collector**&quot;,
&quot;**District Faujdari Adalats**: **criminal**; **Indian Qazi &amp; Mufti** + Company supervision&quot;,
&quot;**Sadar Diwani Adalat**: **Calcutta**, top civil appeal; **Governor &amp; Council**&quot;,
&quot;**Sadar Nizamat Adalat**: top criminal court; first at **Murshidabad** under **Nawab** (increasingly Company-controlled)&quot;,
&quot;**Personal laws**: **Hindu law for Hindus, Islamic law for Muslims**&quot;,
&quot;**1774**: **Calcutta Supreme Court** (Regulating Act 1773) – royal court alongside Company courts&quot;]],
[&#x27;h&#x27;,&#x27;Hastings – Police&#x27;],[&#x27;l&#x27;,[
&quot;Kept **zamindars&#x27; responsibility** for law &amp; order&quot;,
&quot;Zamindars: **maintain peace, apprehend criminals**&quot;,
&quot;Company **gradually increased supervision**&quot;,
&quot;Relied on **traditional local officials**, not a professional force&quot;]],
[&#x27;h&#x27;,&#x27;2. Cornwallis – Judicial&#x27;],[&#x27;l&#x27;,[
&quot;✅ **Cornwallis Code, 1793** – systematic, hierarchical judiciary&quot;,
&quot;**Separated revenue &amp; judicial functions** of Collector&quot;,
&quot;**District Diwani Adalats** under **European judges**&quot;,
&quot;**4 Provincial Courts of Appeal**: **Calcutta, Dacca, Murshidabad, Patna**&quot;,
&quot;**Sadar Diwani Adalat**: highest civil appeal (GG &amp; Council)&quot;,
