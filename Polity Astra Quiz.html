<style>

    border: none;

    font-weight: 700;
    color: var(--accent-dark);

  .reset-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);

  }

  footer.credit {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);

    margin: 0 auto;
  }

  @media (min-width: 640px) {
    .header h1 { font-size: 1.9rem; }
    .qtext { font-size: 1rem; }
  }
</style>

[{"id": "legislative", "label": "Legislative Relations", "icon": "📜", "questions": [{"num": 1, "text": "Centre-State Relations are dealt with under which Parts of the Constitution?", "options": ["Part IX and Part IX-A", "Part XI and Part XII", "Part XII and Part XIII", "Part V and Part VI"], "correct": 1, "explanation": "Centre-State Relations are covered in Part XI (Articles 245–263, Legislative and Administrative Relations) and Part XII (Articles 268–293, Financial Relations). Part IX/IX-A deal with Panchayats/Municipalities, Part XIII deals with Trade & Commerce, and Part V/VI deal with the Union and State Governments' structure, not Centre-State relations specifically."}, {"num": 2, "text": "Which foreign model did India borrow for assigning residuary powers to the Union under Article 248?", "options": ["Australian model", "American model", "Canadian model", "British model"], "correct": 2, "explanation": "Article 248 gives residuary powers (subjects not in any of the three lists) to Parliament, following the Canadian model where the Centre holds residuary powers. The Australian model inspired Article 301 (freedom of trade), not residuary powers. The American and British models are not the source for this provision in the notes."}, {"num": 3, "text": "Under Article 249, Parliament can legislate on a State List subject in the national interest if the Rajya Sabha passes a resolution by what majority, and for how long is it valid?", "options": ["Simple majority; valid for 6 months", "2/3rd majority of members present and voting; valid for 1 year (extendable)", "2/3rd majority of total membership; valid for 2 years", "Absolute majority; valid indefinitely"], "correct": 1, "explanation": "Article 249 requires a Rajya Sabha resolution passed by a 2/3rd majority of members present and voting, and the resulting law remains valid for one year, though it can be extended. A simple/absolute majority is insufficient, and the duration is neither 6 months nor 2 years nor indefinite."}, {"num": 4, "text": "Under Article 250, Parliament's power to legislate on any State List matter during a national emergency (Art. 352) ceases when?", "options": ["Immediately when the emergency is revoked", "6 months after the emergency ceases to operate", "1 year after the emergency ceases", "It never ceases once emergency is declared"], "correct": 1, "explanation": "Article 250 allows Parliament to legislate on State List subjects during a Proclamation of Emergency under Article 352, and this power ceases six months after the emergency ends — not immediately, and not after one year. It is not a permanent power."}, {"num": 5, "text": "Under Article 252, Parliament can legislate on a State List matter if at least how many state legislatures pass resolutions requesting it, and what is a real example of this used in the notes?", "options": ["1 state; example is the RTE Act", "2 or more states; example is the Wildlife Protection Act, 1972", "All states; example is the GST Act", "3 states; example is the Anti-Defection Law"], "correct": 1, "explanation": "Article 252 lets Parliament legislate on a State List subject if two or more state legislatures pass resolutions requesting it, and other states can adopt the resulting law later — the Wildlife Protection Act, 1972 is the example given. A single state's request is insufficient, and the RTE Act, GST Act, and Anti-Defection Law are not tied to Article 252 in the notes."}, {"num": 6, "text": "Article 253 empowers Parliament to legislate on any State List subject for what purpose, without needing state consent?", "options": ["To implement international agreements/treaties", "To respond to a natural disaster", "To regulate inter-state trade only", "To create new All-India Services"], "correct": 0, "explanation": "Article 253 allows Parliament to legislate on any subject, including State List matters, to implement international agreements, treaties, or conventions, with no state interference required. Natural disaster response, inter-state trade regulation, and creation of All-India Services are separate matters not covered by Article 253 in these notes."}, {"num": 7, "text": "Under the Doctrine of Repugnancy (Article 254), if a State law on a Concurrent List subject conflicts with a Central law, which prevails, and what is the key exception?", "options": ["State law always prevails, no exceptions", "Central law prevails always, with no exceptions", "Central law prevails, except if the State law received the President's assent after being reserved for it", "Whichever law was passed first prevails"], "correct": 2, "explanation": "Under Article 254, the Central law normally prevails over a conflicting State law on the Concurrent List. The exception is that if the State law was reserved for the President's assent and received it, the State law prevails in that state — though Parliament can still override it later. State law never automatically prevails, and priority is not based on which law came first."}, {"num": 8, "text": "According to Article 245, Parliament's laws extend to the whole of India and may even apply extra-territorially, while a State Legislature's laws extend to:", "options": ["The whole of India as well", "Only that particular state", "Neighbouring states as agreed", "Union Territories only"], "correct": 1, "explanation": "Article 245 provides that Parliament may make laws for the whole of India (and even with extra-territorial operation), whereas a State Legislature's laws are confined to the territory of its own state. State laws do not automatically extend to neighbouring states or to Union Territories."}, {"num": 9, "text": "Article 246, read with the Seventh Schedule, divides legislative subjects into the Union List, State List, and Concurrent List. Which of these can only Parliament legislate on?", "options": ["State List", "Concurrent List", "Union List", "Residuary subjects only"], "correct": 2, "explanation": "Article 246 assigns the Union List (e.g., Defence, Banking, Foreign Affairs) exclusively to Parliament. The State List (e.g., Police, Agriculture, Public Health) is for states only, while the Concurrent List (e.g., Education, Forests, Marriage) can be legislated on by both. Residuary subjects are a separate category under Article 248, not part of this three-list division."}]}, {"id": "administrative", "label": "Administrative Relations", "icon": "🏛️", "questions": [{"num": 10, "text": "Administrative Relations between the Centre and States, covering executive power interactions, are dealt with in which Articles and Chapter of the Constitution?", "options": ["Articles 268–293, Part XII Chapter I", "Articles 245–255, Part XI Chapter I", "Articles 256–263, Part XI Chapter II", "Articles 301–307, Part XIII"], "correct": 2, "explanation": "Administrative Relations are covered in Articles 256–263, forming Chapter II of Part XI, and define how executive powers of the Centre and States interact to ensure state compliance with central laws. Articles 268–293 (Part XII, Chapter I) deal with Financial Relations, Articles 245–255 with Legislative Relations, and Articles 301–307 with Trade and Commerce."}, {"num": 11, "text": "Under Article 256, what obligation is placed on the States regarding Parliament's laws?", "options": ["States may choose to ignore Union directions", "States must comply with laws made by Parliament, and the Centre can issue directions to States", "States can override Union laws with local legislation", "States must seek Rajya Sabha approval before complying"], "correct": 1, "explanation": "Article 256 obliges States to ensure compliance with laws made by Parliament, and empowers the Centre to issue necessary directions to States for this purpose. States cannot ignore or override Union laws, and no Rajya Sabha approval is required for this compliance obligation."}, {"num": 12, "text": "Under Article 257, the Centre can direct States regarding which two specific matters, as listed in the notes?", "options": ["Taxation and border security", "Means of communication of national/military importance, and protection of Railways within the state", "Judicial appointments and police recruitment", "Education policy and agricultural subsidies"], "correct": 1, "explanation": "Article 257 provides that States must not impede the Union's executive power, and the Centre can specifically direct States on (1) means of communication of national or military importance and (2) protection of Railways within the state. Taxation, judicial appointments, education, and agriculture are not the specific matters named under Article 257 here."}, {"num": 13, "text": "Which article allows the President, with a State's consent, to entrust Union functions to the State government or its officers — the reverse of Article 258A?", "options": ["Article 261", "Article 258", "Article 262", "Article 263"], "correct": 1, "explanation": "Article 258 allows the President, with the State's consent, to entrust Union executive functions to the State government or its officers — a delegation of administrative power from Union to State. Article 258A is the reverse (State to Union). Articles 261, 262, and 263 deal with different matters (full faith and credit, river disputes, and the Inter-State Council respectively)."}, {"num": 14, "text": "Under Article 258A, who may entrust State functions to the Central Government, and with whose consent?", "options": ["The President, with Parliament's consent", "The Chief Minister, with the Governor's consent", "The Governor, with the Centre's consent", "The Speaker, with the President's consent"], "correct": 2, "explanation": "Article 258A allows the Governor of a State, with the Centre's consent, to entrust State functions to the Central Government — this lets states use central machinery. This is distinct from Article 258, where the President entrusts Union functions to a State with its consent. The Chief Minister and Speaker are not given this power under Article 258A."}, {"num": 15, "text": "Article 261 ensures 'full faith and credit' throughout India for what kinds of instruments?", "options": ["Only criminal court verdicts", "Public acts, records, and judicial proceedings", "Only state budgets", "Private commercial contracts"], "correct": 1, "explanation": "Article 261 guarantees full faith and credit throughout India to public acts, records, and judicial proceedings of any state, ensuring legal unity across the country. It does not specifically cover criminal verdicts, state budgets, or private commercial contracts as such."}, {"num": 16, "text": "Article 262 gives Parliament the power to legislate for adjudication of inter-state river water disputes, and uniquely allows Parliament to:", "options": ["Increase the Supreme Court's jurisdiction over such disputes", "Exclude the Supreme Court's jurisdiction over such disputes", "Delegate the matter entirely to Zonal Councils", "Require unanimous consent of all states before legislating"], "correct": 1, "explanation": "Article 262 is a unique exception because Parliament, while legislating on inter-state river water disputes (the basis of the Inter-State River Water Disputes Act, 1956), can exclude the jurisdiction of the Supreme Court over such disputes. It does not increase SC jurisdiction, delegate to Zonal Councils, or require unanimous state consent."}, {"num": 17, "text": "Article 263 empowers the President to establish an Inter-State Council to inquire into disputes and discuss matters of common interest. What is the nature of this body's role?", "options": ["Binding on all States", "Purely ceremonial with no function", "Advisory — not binding", "Judicial, equivalent to the Supreme Court"], "correct": 2, "explanation": "Article 263 establishes the Inter-State Council as an advisory body — its recommendations are not binding on the Centre or States. It is neither purely ceremonial (it actively inquires into disputes and discusses common interests) nor judicial, and it does not equate to the Supreme Court."}, {"num": 18, "text": "Using the mnemonic distinguishing Articles 258 and 258A, which is correct?", "options": ["Article 258 = State gives to Union; Article 258A = Union gives to State", "Article 258 = Union gives to State; Article 258A = State gives to Union", "Both articles describe the same direction of delegation", "Neither article deals with delegation of functions"], "correct": 1, "explanation": "The notes' mnemonic is: Article 258 = Union → State (Union gives to State), and Article 258A = State → Union (State gives to Union), with the 'A' suffix marking the 'Added direction' of state-to-Union delegation. The two articles describe opposite directions of delegation, not the same one."}]}, {"id": "financial", "label": "Financial Relations", "icon": "💰", "questions": [{"num": 19, "text": "Financial Relations between Centre and States are covered under which Articles and Part of the Constitution?", "options": ["Articles 245–255, Part XI", "Articles 268–293, Part XII Chapter I", "Articles 301–307, Part XIII", "Articles 148–151, Part V"], "correct": 1, "explanation": "Financial Relations are dealt with in Articles 268–293, forming Chapter I of Part XII, covering distribution of taxing powers, non-tax revenues, and resource-sharing mechanisms. Articles 245–255 relate to Legislative Relations, 301–307 to Trade & Commerce, and 148–151 to the CAG."}, {"num": 20, "text": "Article 265 lays down a foundational principle of taxation in India — what is it?", "options": ["Taxes can be levied by executive order alone", "No tax shall be levied or collected except by authority of law", "Only Parliament can levy any tax, states cannot", "All tax proceeds must go to the Consolidated Fund of India"], "correct": 1, "explanation": "Article 265 states that no tax shall be levied or collected except by the authority of law, ensuring accountability in taxation. It does not permit taxation by mere executive order, does not bar states from levying taxes, and does not mandate that all proceeds go only to the CFI."}, {"num": 21, "text": "Under Article 268, certain duties like stamp duties on bills of exchange and cheques are levied by the Union but collected by the States. What happens to this revenue?", "options": ["It is credited to the Consolidated Fund of India", "It does NOT form part of the Consolidated Fund of India", "It is split equally between Centre and States", "It is transferred to the GST Council"], "correct": 1, "explanation": "Under Article 268, duties like stamp duties are levied by the Union but collected by the States, and importantly this revenue does NOT form part of the Consolidated Fund of India (CFI) — it stays with the states. It is not credited to the CFI, not split via a formula, and has nothing to do with the GST Council."}, {"num": 22, "text": "Under Article 269, taxes such as those on inter-state trade of goods are levied and collected by the Union, and the net proceeds are:", "options": ["Retained entirely by the Union", "Assigned to the States", "Split evenly with local governments", "Donated to the Finance Commission"], "correct": 1, "explanation": "Article 269 covers taxes that the Union levies and collects but whose net proceeds are assigned to the States, such as taxes on inter-state trade of goods. The Union does not retain this revenue, and it has no connection to local governments or the Finance Commission directly."}, {"num": 23, "text": "Article 269A, introduced by which Constitutional Amendment, governs GST on inter-state trade, and how is IGST distributed?", "options": ["100th Amendment, 2015; distributed by the President", "101st Amendment, 2017; apportioned per GST Council recommendations", "97th Amendment, 2011; distributed by the Finance Commission", "42nd Amendment, 1976; distributed equally among states"], "correct": 1, "explanation": "Article 269A was introduced by the 101st Amendment, 2017, providing that Integrated GST (IGST) on inter-state trade is collected by the Union and apportioned between the Union and States as per the recommendations of the GST Council. The 100th, 97th, and 42nd Amendments are unrelated to this provision."}, {"num": 24, "text": "Under Article 270, which taxes form the 'Divisible Pool' shared between the Union and States?", "options": ["Only Corporate Tax", "Income Tax and Central GST", "Only Customs Duty", "Stamp duties and excise on medicinal preparations"], "correct": 1, "explanation": "Article 270 provides that Income Tax and Central GST together form the 'Divisible Pool' of taxes shared between the Centre and States. Corporate Tax and Customs Duty alone are not described as forming this pool, and stamp duties/medicinal excise are dealt with under Article 268, not 270."}, {"num": 25, "text": "Under Article 271, Parliament can levy a surcharge on taxes. Where do the surcharge proceeds go?", "options": ["Shared equally between Centre and States", "Only to the Centre, not shared with States", "Only to the states where collected", "Divided as per Finance Commission formula"], "correct": 1, "explanation": "Article 271 is explicitly flagged as an exam trap in the notes: surcharge proceeds go ONLY to the Centre and are not shared with the States at all — unlike most other divisible taxes. They are not split equally, not retained by originating states, and not governed by the Finance Commission's devolution formula."}, {"num": 26, "text": "Article 275 provides for statutory grants-in-aid to specific needy states, drawn from the Consolidated Fund of India and based on the recommendations of which body?", "options": ["The GST Council", "The Finance Commission", "The Inter-State Council", "The NITI Aayog"], "correct": 1, "explanation": "Article 275 provides statutory grants-in-aid from the CFI to specific needy states, based on the recommendations of the Finance Commission. The GST Council, Inter-State Council, and NITI Aayog are not the bodies whose recommendations govern Article 275 grants."}, {"num": 27, "text": "The GST Council, established under Article 279A, is chaired by whom, and what voting power do the States collectively hold?", "options": ["Chaired by the Prime Minister; States hold 1/3rd voting power", "Chaired by the Union Finance Minister; States hold 2/3rd voting power", "Chaired by the RBI Governor; States hold 1/2 voting power", "Chaired by the President; States hold all voting power"], "correct": 1, "explanation": "Article 279A establishes the GST Council as a constitutional body chaired by the Union Finance Minister, with the States collectively holding 2/3rd of the voting power. It is not chaired by the PM, RBI Governor, or President, and the states do not hold all the voting power."}, {"num": 28, "text": "Under Article 280, the Finance Commission is constituted by the President at what interval, and what does it primarily recommend?", "options": ["Every 3 years; recommends judicial appointments", "Every 5 years; recommends distribution of tax proceeds (vertical and horizontal devolution)", "Every 10 years; recommends GST rates", "Only once, permanently; recommends state boundaries"], "correct": 1, "explanation": "Article 280 requires the President to constitute a Finance Commission every 5 years, and it recommends the distribution of tax proceeds between the Union and States (vertical devolution) and among the States themselves (horizontal devolution). It has no role in judicial appointments, GST rates, or state boundaries, and is not a one-time permanent body."}, {"num": 29, "text": "Under Article 281, what must the President do with the Finance Commission's recommendations?", "options": ["Keep them confidential from Parliament", "Lay them, along with an action memorandum, before each House of Parliament", "Forward them directly to the GST Council for approval", "Implement them without any parliamentary review"], "correct": 1, "explanation": "Article 281 requires the President to lay the Finance Commission's recommendations, together with an explanatory action memorandum, before each House of Parliament. They are not kept confidential, are not routed through the GST Council, and are not implemented without this parliamentary placement."}, {"num": 30, "text": "Article 282 allows the Union or a State to make discretionary grants for what purpose, outside the Finance Commission's mandate?", "options": ["Only for defence-related purposes", "For any 'public purpose'", "Only for disaster relief", "Only for infrastructure projects certified by NITI Aayog"], "correct": 1, "explanation": "Article 282 allows the Union or a State to make discretionary grants for any 'public purpose', even outside the areas covered by Finance Commission recommendations. This is broader than defence, disaster relief, or NITI Aayog-certified infrastructure alone."}, {"num": 31, "text": "Regarding borrowing powers, what is the key distinction between Article 292 (Union borrowing) and Article 293 (State borrowing)?", "options": ["Both can borrow externally without limits", "The Union can borrow externally within Parliament's limits, but States can borrow only within India, and a state with outstanding Centre debt needs Centre's consent for new loans", "States can borrow externally, but the Union cannot", "Neither the Union nor States can borrow at all"], "correct": 1, "explanation": "Under Article 292, the Union may borrow on the security of the CFI, including external borrowing, within limits set by Parliament. Under Article 293, States may borrow only within India, and a State with outstanding debt to the Centre cannot raise a new loan without the Centre's consent. States cannot freely borrow externally, and both governments do have borrowing powers, just with different scopes."}, {"num": 32, "text": "Using the notes' memory trick for Articles 268 and 269, which correctly distinguishes them?", "options": ["268 = Union levies and collects, assigns to States; 269 = Union levies, States collect", "268 = Union levies, States collect; 269 = Union levies and collects, assigned to States", "Both articles describe an identical arrangement", "268 and 269 both relate only to GST"], "correct": 1, "explanation": "The correct distinction is: Article 268 = Union levies the tax but States collect it (revenue stays with states, not in CFI); Article 269 = Union both levies and collects the tax, but the net proceeds are then assigned to the States. They are not identical, and neither directly concerns GST, which is dealt with under Article 269A and 270."}]}, {"id": "interstate", "label": "Inter-State Relations", "icon": "🔗", "questions": [{"num": 33, "text": "Article 261's 'Full Faith and Credit' clause enforces one state's public acts, records, and judicial proceedings in all other states, but is limited to:", "options": ["Only criminal judgments", "Only civil judgments, NOT criminal", "Both civil and criminal judgments equally", "Only judgments of High Courts, not lower courts"], "correct": 1, "explanation": "A key exam trap in the notes: Article 261's Full Faith and Credit Clause applies to CIVIL judgments only, not criminal judgments. It is not restricted to criminal matters, does not cover both equally, and is not limited only to High Court judgments as opposed to other courts."}, {"num": 34, "text": "Article 262 allows Parliament to legislate on inter-state river water disputes and gave rise to which Act?", "options": ["The Inter-State Council Act, 1990", "The Inter-State River Water Disputes Act, 1956", "The Zonal Councils Act, 1956", "The North-Eastern Council Act, 1971"], "correct": 1, "explanation": "Article 262 is the constitutional basis for the Inter-State River Water Disputes Act, 1956, and Parliament can even exclude Supreme Court jurisdiction over such disputes under this article. There is no 'Inter-State Council Act, 1990' or 'Zonal Councils Act, 1956' in the notes — the Inter-State Council was set up administratively in 1990, and Zonal Councils arose from the States Reorganisation Act, 1956. The NE Council Act, 1971 is unrelated to river disputes."}, {"num": 35, "text": "The Inter-State Council under Article 263 is described in the Inter-State Relations notes as being headed by whom, with what nature of recommendations?", "options": ["Headed by the President; mandatory recommendations", "Headed by the PM; recommendatory, not mandatory", "Headed by the Chief Justice of India; binding recommendations", "Headed by the Union Home Minister; mandatory recommendations"], "correct": 1, "explanation": "The Inter-State Council, established under Article 263, is headed by the Prime Minister and its recommendations are recommendatory, not mandatory, on the Centre or States. It is not headed by the President, CJI, or Home Minister (the Home Minister instead heads the ISC's Standing Committee), and its role is advisory, not binding."}, {"num": 36, "text": "Article 301 guarantees that trade, commerce, and intercourse throughout India shall be free, making India a single economic unit. Which country's constitution inspired this provision?", "options": ["Canada", "United States", "Australia", "United Kingdom"], "correct": 2, "explanation": "Article 301 is based on the Australian Constitution, which similarly guarantees freedom of trade — the mnemonic given is 'Australia = Open Trade Nation.' Canada inspired India's residuary powers (Article 248), not Article 301, while the US and UK are not cited as the source for this provision."}, {"num": 37, "text": "Under Article 302, Parliament may impose restrictions on trade, commerce, or intercourse between states or within a state, but only:", "options": ["Without any justification needed", "In the public interest, e.g., during famine or scarcity of goods", "Only during a declared national emergency", "Only with unanimous consent of all state legislatures"], "correct": 1, "explanation": "Article 302 allows Parliament to impose restrictions on trade in the public interest, such as during a famine or scarcity of goods — it does not require an emergency to be in force, does not need unanimous state consent, and is not an unrestricted power exercised without justification."}, {"num": 38, "text": "Article 303 generally prohibits Parliament and State Legislatures from discriminating between states or giving preference to one state over another in trade matters, except in the case of:", "options": ["A severe shortage of goods", "A change in government at the Centre", "A request from the Inter-State Council", "An amendment to the Constitution"], "correct": 0, "explanation": "Article 303's anti-discrimination rule against giving trade preference to one state over another has an exception for situations of severe shortage of goods. A change of government, an ISC request, or a constitutional amendment are not the exception named in the notes."}, {"num": 39, "text": "Under Article 304, a State can impose a tax on goods imported from other states only if:", "options": ["No tax is levied on any goods at all", "The same tax also applies to similar goods produced locally within that state", "The Centre pre-approves the tax rate every year", "The importing state has a trade surplus"], "correct": 1, "explanation": "Article 304 permits a State to tax imported goods only if the same tax also applies to locally produced goods of the same kind, ensuring a level playing field. It doesn't require avoiding all taxation, doesn't need annual Centre pre-approval, and has nothing to do with a state's trade balance."}, {"num": 40, "text": "Article 305 protects existing laws and also allows which of the following, without violating freedom of trade?", "options": ["Creation of State/Union monopolies, e.g., in state transport or electricity", "Abolition of all Union Territories", "Repeal of the entire Seventh Schedule", "Unlimited private monopolies in any sector"], "correct": 0, "explanation": "Article 305 saves existing laws and permits the State or Union to create monopolies — such as in state transport or electricity — without this being treated as a violation of the freedom of trade guaranteed under Article 301. It does not concern Union Territories or the Seventh Schedule, and it does not authorise unlimited private monopolies."}, {"num": 41, "text": "What is the current status of Article 306, and Article 307?", "options": ["Article 306 is still in force; Article 307 has been repealed", "Article 306 has been repealed (was for Part B states, removed by 7th Amendment, 1956); Article 307 allows Parliament to appoint an authority for Articles 301–304, but no such authority has been appointed yet", "Both Articles 306 and 307 have been repealed", "Both Articles 306 and 307 remain fully operative with an authority already appointed"], "correct": 1, "explanation": "Article 306, which formerly applied to Part B states, was repealed by the 7th Amendment, 1956. Article 307 empowers Parliament to appoint an authority for the purposes of Articles 301–304, but the notes flag as a classic MCQ trap that no such authority has been appointed yet. Article 306 is not still active, and Article 307 is not repealed — it's simply unused."}]}, {"id": "bodies", "label": "ISC & Councils", "icon": "🏢", "questions": [{"num": 42, "text": "The Inter-State Council (ISC) was set up in 1990 based on the recommendations of which commission?", "options": ["Sarkaria Commission", "Punchhi Commission", "Second Administrative Reforms Commission", "Rajamannar Committee"], "correct": 0, "explanation": "The Inter-State Council was set up in 1990 based on the recommendations of the Sarkaria Commission. The Punchhi Commission, ARC-II, and Rajamannar Committee are other real bodies related to Centre-State relations, but the notes specifically credit the Sarkaria Commission for the ISC's establishment."}, {"num": 43, "text": "Who serves as the Chairman of the Inter-State Council, and who chairs its Standing Committee?", "options": ["Chairman: Union Home Minister; Standing Committee: President", "Chairman: Prime Minister; Standing Committee: Union Home Minister", "Chairman: President; Standing Committee: Prime Minister", "Chairman: Vice-President; Standing Committee: Finance Minister"], "correct": 1, "explanation": "The Inter-State Council is chaired by the Prime Minister, while its Standing Committee — which processes matters before they reach the full Council — is headed by the Union Home Minister. The President, Vice-President, and Finance Minister do not hold these ISC roles."}, {"num": 44, "text": "Which of the following is NOT among the members of the Inter-State Council as listed in the notes?", "options": ["Chief Ministers of all States", "CMs of UTs with Legislative Assemblies (Delhi, Puducherry, J&K)", "Six Union Cabinet Ministers nominated by the PM", "Speakers of all State Legislative Assemblies"], "correct": 3, "explanation": "ISC membership includes Chief Ministers of all states, CMs of UTs with Legislative Assemblies (Delhi, Puducherry, J&K), Administrators of UTs without Legislative Assemblies, and six Union Cabinet Ministers nominated by the PM. Speakers of State Legislative Assemblies are not listed as ISC members in the notes."}, {"num": 45, "text": "What is the constitutional/legal status and nature of the Inter-State Council's decisions?", "options": ["Constitutional body under Art. 263; decisions are recommendatory, cannot bind", "Statutory body; decisions are legally binding", "Constitutional body; decisions are binding on Parliament", "Extra-constitutional body with no defined powers"], "correct": 0, "explanation": "The ISC is a constitutional body established under Article 263, but its nature is recommendatory — it cannot take binding decisions on Centre or States. It is not a statutory body (unlike Zonal Councils and the NEC), and its recommendations do not bind Parliament, nor is it an extra-constitutional body with undefined powers."}, {"num": 46, "text": "What is the constitutional status of Zonal Councils, and under which Act were they established?", "options": ["Constitutional bodies, established directly by the Constitution", "Statutory bodies, established under the States Reorganisation Act, 1956", "Statutory bodies, established under the North-Eastern Council Act, 1971", "Extra-constitutional advisory panels with no legal basis"], "correct": 1, "explanation": "Zonal Councils are statutory bodies — not constitutional ones — established under the States Reorganisation Act, 1956, unlike the ISC which has a constitutional basis in Article 263. They were not created under the NEC Act, 1971 (that established the North-Eastern Council instead), and they do have a defined legal basis, unlike a purely extra-constitutional panel."}, {"num": 47, "text": "How many Zonal Councils are there, and who serves as their common Chairman?", "options": ["Five zones; common Chairman is the Prime Minister", "Four zones; common Chairman is the President", "Five zones (Northern, Central, Eastern, Western, Southern); common Chairman is the Union Home Minister", "Six zones; no common chairman, each zone elects its own"], "correct": 2, "explanation": "There are five Zonal Councils — Northern, Central, Eastern, Western, and Southern — and the Union Home Minister serves as the common Chairman for all five. It is neither four nor six zones, and the Chairman is not the PM or President."}, {"num": 48, "text": "Who serves as Vice-Chairman of a Zonal Council, and how is this position determined?", "options": ["The Union Home Minister permanently", "Chief Ministers of states in the zone, by rotation, for one year at a time", "A NITI Aayog nominee appointed for a five-year term", "The senior-most Chief Secretary in the zone"], "correct": 1, "explanation": "Each Zonal Council's Vice-Chairman position is held by the Chief Ministers of the states in that zone, by rotation, one year at a time. It is not permanently held by the Home Minister (who is the common Chairman, not Vice-Chairman), and it is not determined by NITI Aayog nominees or Chief Secretaries, who instead serve as advisors."}, {"num": 49, "text": "What roles do the Zonal Councils typically address, and who serves as an advisor to them alongside the Chief Secretary of each state in the zone?", "options": ["Roles: border disputes, linguistic minorities, inter-state transport; Advisor: one person from NITI Aayog", "Roles: national defence policy; Advisor: the Attorney General", "Roles: judicial appointments; Advisor: the Chief Justice of India", "Roles: currency and banking regulation; Advisor: the RBI Governor"], "correct": 0, "explanation": "Zonal Councils deal with matters like border disputes, linguistic minorities, and inter-state transport, with advisors including one person from NITI Aayog and the Chief Secretary of each state in the zone. They are not concerned with national defence policy, judicial appointments, or currency/banking, and their advisors are not the Attorney General, CJI, or RBI Governor."}, {"num": 50, "text": "The North-Eastern Council (NEC) was created under which Act, and how many member states does it currently have?", "options": ["States Reorganisation Act, 1956; 5 member states", "North-Eastern Council Act, 1971; 8 member states (7 original + Sikkim added in 2002)", "Constitution (99th Amendment) Act; 7 member states", "North-Eastern Council Act, 1971; 6 member states"], "correct": 1, "explanation": "The NEC is a statutory body created by the North-Eastern Council Act, 1971, and it now has 8 member states — the original 7 (Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Tripura) plus Sikkim, added in 2002. It was not created by the States Reorganisation Act or a constitutional amendment, and it has more than 5 or 6 members."}, {"num": 51, "text": "How does the North-Eastern Council's role differ from that of the Zonal Councils and the ISC?", "options": ["It acts purely as a judicial dispute-resolution body", "It acts as a Regional Planning Body, formulating unified development schemes for the NE region", "It has no defined role, unlike the ISC and Zonal Councils", "It exclusively manages defence deployments in border areas"], "correct": 1, "explanation": "The NEC's key distinguishing feature is that it acts as a Regional Planning Body, formulating unified development schemes covering security and infrastructure for the North-Eastern region — unlike the ISC and Zonal Councils, which are advisory bodies for disputes/common interests. It is not a judicial body, is not without a defined role, and does not exclusively manage defence deployments."}, {"num": 52, "text": "Who is the Chairman of the North-Eastern Council, and who serves as its Vice-Chairman?", "options": ["Chairman nominated by the President (currently the Union Home Minister); Vice-Chairman is the Minister of State (Independent Charge), DoNER Ministry", "Chairman is the Prime Minister; Vice-Chairman is the Union Home Minister", "Chairman is elected by member state CMs; Vice-Chairman is the senior-most CM", "Chairman is the Union Home Minister permanently; Vice-Chairman is the President's nominee"], "correct": 0, "explanation": "The NEC's Chairman is nominated by the President (currently the Union Home Minister holds this role), while the Vice-Chairman is the Minister of State (Independent Charge) of the DoNER Ministry. The Chairman is not the PM, is not elected by member CMs, and the Vice-Chairman is not the President's nominee — that describes the Chairman's own appointment method."}, {"num": 53, "text": "According to the notes, what is the critical exam point regarding Sikkim's council membership?", "options": ["Sikkim is a member of both the Eastern Zonal Council and the NEC", "Sikkim is NOT a member of the Eastern Zonal Council — it is exclusively part of the North-Eastern Council", "Sikkim belongs to the Northern Zonal Council only", "Sikkim has no membership in any Zonal Council or the NEC"], "correct": 1, "explanation": "A critical exam trap highlighted in the notes: Sikkim is NOT a member of the Eastern Zonal Council — it is exclusively part of the North-Eastern Council (added in 2002). It is not part of both bodies, is not in the Northern Zonal Council, and it is indeed a member of the NEC, not excluded from all councils."}, {"num": 54, "text": "Comparing the three bodies by their year of establishment, which is the correct chronological order (earliest to latest)?", "options": ["ISC (1990) → Zonal Councils (1956) → NEC (1971)", "Zonal Councils (1956) → NEC (1971) → ISC (1990)", "NEC (1971) → ISC (1990) → Zonal Councils (1956)", "Zonal Councils (1956) → ISC (1990) → NEC (1971)"], "correct": 1, "explanation": "The correct chronological order is: Zonal Councils (1956, via the States Reorganisation Act) → North-Eastern Council (1971, via the NEC Act) → Inter-State Council (1990, based on Sarkaria Commission recommendations). Any other ordering misplaces at least one of these bodies' founding years."}]}, {"id": "amendments", "label": "Constitutional Amendments", "icon": "📝", "questions": [{"num": 55, "text": "The 1st Amendment (1951) is significant for adding which Schedule, and what else did it introduce?", "options": ["Eighth Schedule; added new official languages", "Ninth Schedule; added reasonable restrictions on freedom of speech (public order, foreign relations, incitement to offence)", "Tenth Schedule; introduced anti-defection provisions", "Seventh Schedule; created the three lists"], "correct": 1, "explanation": "The 1st Amendment (1951) added the Ninth Schedule to protect land reform laws from judicial review, and also added reasonable restrictions on freedom of speech covering public order, foreign relations, and incitement to an offence. It did not add the Eighth, Tenth, or Seventh Schedules, which arose from other amendments or the original Constitution."}, {"num": 56, "text": "The 7th Amendment (1956) carried out the States Reorganisation and abolished which classification of states, replacing it with how many states and UTs?", "options": ["Abolished Part A/B/C/D classification; introduced 14 States + 6 UTs", "Abolished the Union/State List division; introduced 28 States", "Abolished Panchayati Raj classification; introduced 22 States", "Abolished Zonal Council divisions; introduced 25 States"], "correct": 0, "explanation": "The 7th Amendment (1956) abolished the Part A, B, C, D classification of states, introduced a structure of 14 States and 6 Union Territories, and provided for a common High Court for two or more states. It did not touch the Union/State List division, Panchayati Raj classification, or Zonal Councils directly."}, {"num": 57, "text": "The 10th Amendment (1961) and 12th Amendment (1962) both dealt with incorporating new Union Territories. Which pairing is correct?", "options": ["10th = Goa, Daman & Diu; 12th = Dadra and Nagar Haveli", "10th = Dadra and Nagar Haveli; 12th = Goa, Daman and Diu", "10th = Sikkim; 12th = Nagaland", "10th = Puducherry; 12th = Chandigarh"], "correct": 1, "explanation": "The 10th Amendment (1961) incorporated Dadra and Nagar Haveli as a Union Territory, while the 12th Amendment (1962) incorporated Goa, Daman and Diu as a Union Territory. Sikkim and Nagaland were dealt with by the 35th/36th and 13th Amendments respectively, not the 10th or 12th."}, {"num": 58, "text": "The 13th Amendment (1962) gave statehood to Nagaland along with special provisions under which Article, and what mnemonic links it to the 12th Amendment?", "options": ["Article 371-A; both 1962, marking Goa's liberation and Nagaland's statehood in the same year", "Article 370; both 1956, tied to States Reorganisation", "Article 371-A; both 1974, tied to Sikkim", "Article 244-A; both 1969, tied to Meghalaya"], "correct": 0, "explanation": "The 13th Amendment (1962) granted Nagaland statehood with special provisions under Article 371-A. The notes' mnemonic links it with the 12th Amendment because both occurred in 1962 — the year of Goa's liberation from Portuguese rule and Nagaland's statehood. Article 370 relates to Jammu & Kashmir, and 1974/1956/1969 and Article 244-A/Meghalaya are not correct for this pairing."}, {"num": 59, "text": "The 21st Amendment (1967) added which language as the 15th language in the Eighth Schedule?", "options": ["Konkani", "Bodo", "Sindhi", "Manipuri"], "correct": 2, "explanation": "The 21st Amendment (1967) added Sindhi as the 15th language in the Eighth Schedule. Konkani and Manipuri were added later by the 71st Amendment (1992), and Bodo was added by the 92nd Amendment (2003) — not the 21st."}, {"num": 60, "text": "The 24th Amendment (1971) affirmed Parliament's power to amend which part of the Constitution, and made what compulsory?", "options": ["Only the Preamble; made judicial review compulsory", "Any part of the Constitution, including Fundamental Rights; made the President's assent to a Constitutional Amendment Bill compulsory", "Only DPSPs; made Presidential assent optional", "Only Fundamental Duties; made Governor's assent compulsory"], "correct": 1, "explanation": "The 24th Amendment (1971) affirmed Parliament's power to amend any part of the Constitution, including Fundamental Rights, and made the President's assent to a Constitutional Amendment Bill compulsory (removing any discretion to withhold it). It did not limit this power to only the Preamble, DPSPs, or Fundamental Duties, and it did not make Presidential assent optional."}, {"num": 61, "text": "The 25th Amendment (1971) curtailed which fundamental right, and what protection did it give to certain DPSP-related laws?", "options": ["Right to equality; protected laws under Art. 46 from challenge", "Right to property; laws implementing Art. 39(b)/39(c) cannot be challenged for violating Arts. 14, 19, or 31", "Right to freedom of speech; protected laws under Art. 48 from challenge", "Right against exploitation; protected laws under Art. 43 from challenge"], "correct": 1, "explanation": "The 25th Amendment (1971) curtailed the fundamental right to property and protected laws made under DPSP Articles 39(b) and 39(c) from being challenged as violating Articles 14, 19, or 31. It did not concern the right to equality, freedom of speech, or right against exploitation directly."}, {"num": 62, "text": "The 35th Amendment (1974) and 36th Amendment (1975) both relate to Sikkim. Which correctly describes their sequence?", "options": ["35th made Sikkim a full State; 36th gave it Associate State status", "35th terminated Sikkim's protectorate status and conferred 'Associate State' status; 36th made Sikkim a full-fledged 22nd State and omitted the Tenth Schedule (associate status)", "Both amendments made Sikkim a full State simultaneously", "35th and 36th relate to Nagaland, not Sikkim"], "correct": 1, "explanation": "The 35th Amendment (1974) terminated Sikkim's protectorate status, conferring 'Associate State' status. The following year, the 36th Amendment (1975) made Sikkim a full-fledged State — the 22nd State of India — and omitted the (then-existing) Tenth Schedule that had described the associate status. The order is not reversed, they were not simultaneous, and both concern Sikkim, not Nagaland."}, {"num": 63, "text": "The 38th Amendment (1975) made which presidential/gubernatorial actions non-justiciable?", "options": ["Appointment of Governors", "Declaration of Emergency by the President, and promulgation of Ordinances by the President/Governors", "Dissolution of the Lok Sabha", "Appointment of the Attorney General"], "correct": 1, "explanation": "The 38th Amendment (1975) made the declaration of Emergency by the President, as well as the promulgation of Ordinances by the President or Governors, non-justiciable (immune from judicial review at that time). It did not concern Governor appointments, Lok Sabha dissolution, or the Attorney General's appointment."}, {"num": 64, "text": "The 42nd Amendment (1976), often called the 'Mini-Constitution', added which words to the Preamble and what major new Part?", "options": ["Added 'Democratic' and 'Republic'; added Part IX", "Added 'Socialist', 'Secular', and 'Integrity'; added Fundamental Duties as Part IV-A", "Added 'Sovereign' and 'Justice'; added Part XIV-A", "Added 'Liberty' and 'Equality'; added Part XX"], "correct": 1, "explanation": "The 42nd Amendment (1976) added 'Socialist', 'Secular', and 'Integrity' to the Preamble, added Fundamental Duties as Part IV-A, and increased the Lok Sabha/State Assembly tenure from 5 to 6 years (later reversed). It did not add 'Democratic', 'Republic', 'Sovereign', 'Justice', 'Liberty', or 'Equality' to the Preamble — those words (except Integrity/Socialist/Secular) were already present."}, {"num": 65, "text": "The 44th Amendment (1978) reversed several 42nd Amendment excesses. Which of these changes did it make?", "options": ["Increased Lok Sabha tenure to 6 years and added 'Internal Disturbance' as an emergency ground", "Restored Lok Sabha tenure to 5 years, replaced 'Internal Disturbance' with 'Armed Rebellion' for National Emergency, and deleted the Right to Property as a Fundamental Right", "Abolished the Ninth Schedule entirely", "Introduced GST and the National Judicial Appointments Commission"], "correct": 1, "explanation": "The 44th Amendment (1978) restored the Lok Sabha's tenure to 5 years, replaced 'Internal Disturbance' with 'Armed Rebellion' as a ground for National Emergency, and deleted the Right to Property as a Fundamental Right, making it a mere legal right (Art. 300A). It did not increase tenure to 6 years, did not abolish the Ninth Schedule, and GST/NJAC came from much later amendments (101st and 99th)."}, {"num": 66, "text": "The 52nd Amendment (1985) added the Tenth Schedule for which purpose?", "options": ["Reservation of seats for SC/ST", "Disqualification of MPs/MLAs on grounds of defection (Anti-Defection Law)", "Constitutional status to Panchayati Raj", "Regulation of official languages"], "correct": 1, "explanation": "The 52nd Amendment (1985) added the Tenth Schedule, providing for disqualification of MPs/MLAs on grounds of defection — the Anti-Defection Law. It is not about SC/ST reservation, Panchayati Raj status, or official languages, which are addressed by other amendments."}, {"num": 67, "text": "The 61st Amendment (1989) reduced the voting age for Lok Sabha and State Assembly elections from:", "options": ["18 years to 16 years", "21 years to 18 years", "25 years to 21 years", "21 years to 16 years"], "correct": 1, "explanation": "The 61st Amendment (1989) reduced the voting age from 21 years to 18 years for both Lok Sabha and State Assembly elections. It did not involve a reduction to or from 16 or 25 years."}, {"num": 68, "text": "The 69th Amendment (1991) gave Delhi what special status, and what did it create?", "options": ["Full statehood; a 100-member assembly", "National Capital Territory (NCT) status; a 70-member legislative assembly", "Union Territory without a legislature; no assembly", "Autonomous region status; a 50-member council"], "correct": 1, "explanation": "The 69th Amendment (1991) gave Delhi special status as the National Capital Territory (NCT) and created a 70-member legislative assembly for it. It did not grant full statehood, did not leave Delhi without any assembly, and the assembly size was not 100 or 50 members."}, {"num": 69, "text": "The 71st Amendment (1992) added three languages to the Eighth Schedule, bringing the total to 18. Which languages were added?", "options": ["Bodo, Dogri, Maithili", "Konkani, Manipuri, Nepali", "Sindhi, Santhali, Kashmiri", "Assamese, Odia, Punjabi"], "correct": 1, "explanation": "The 71st Amendment (1992) added Konkani, Manipuri, and Nepali to the Eighth Schedule, raising the total number of recognised languages to 18. Bodo, Dogri, Maithili, and Santhali were added later by the 92nd Amendment (2003), and Sindhi was added earlier by the 21st Amendment (1967)."}, {"num": 70, "text": "The 73rd and 74th Amendments (both 1992) granted constitutional status to local governance bodies. Which pairing is correct?", "options": ["73rd = Municipalities, Part IX-A, 12th Schedule; 74th = Panchayats, Part IX, 11th Schedule", "73rd = Panchayati Raj Institutions, Part IX, 11th Schedule; 74th = Municipalities, Part IX-A, 12th Schedule", "73rd = Co-operative Societies, Part IX-B; 74th = Panchayats, Part IX", "Both amendments cover Municipalities only"], "correct": 1, "explanation": "The 73rd Amendment (1992) granted constitutional status to Panchayati Raj Institutions, adding Part IX and the Eleventh Schedule. The 74th Amendment (1992) granted constitutional status to Municipalities (Urban Local Bodies), adding Part IX-A and the Twelfth Schedule. The notes' trick is '73 = Rural before 74 = Urban', so the reversed pairing and the Co-operative Societies pairing (that's the 97th Amendment) are incorrect."}, {"num": 71, "text": "The 84th Amendment (2001) extended the freeze on delimitation of Lok Sabha and State Assembly seats for how long, and for what stated purpose?", "options": ["10 years, to encourage industrial growth", "25 years (up to 2026), to encourage population limiting measures", "50 years, with no stated purpose", "5 years, to accommodate the 2001 Census"], "correct": 1, "explanation": "The 84th Amendment (2001) extended the ban on readjustment of Lok Sabha/State Assembly seats for 25 years (up to 2026), explicitly to encourage population-limiting measures among states. It was not a 10, 50, or 5-year extension, and it was not tied to industrial growth."}, {"num": 72, "text": "The 86th Amendment (2002) made elementary education a Fundamental Right under which Article, and added what to Article 51-A?", "options": ["Article 21-A; a new Fundamental Duty for education of children aged 6–14", "Article 19-A; a new DPSP for adult literacy", "Article 30-A; a new Fundamental Duty for higher education", "Article 45; abolished the Fundamental Duty on education"], "correct": 0, "explanation": "The 86th Amendment (2002) inserted Article 21-A, making elementary education a Fundamental Right, and added a new Fundamental Duty under Article 51-A requiring parents/guardians to provide education opportunities for children aged 6–14. It did not use Article 19-A or 30-A, and it did not abolish any duty — it added one."}, {"num": 73, "text": "The 87th Amendment (2003) changed the basis for delimitation of constituencies from which Census to which Census?", "options": ["From the 1991 Census to the 2001 Census", "From the 2001 Census to the 2011 Census", "From the 1981 Census to the 1991 Census", "From the 2011 Census to the 2021 Census"], "correct": 0, "explanation": "The 87th Amendment (2003) shifted the basis for delimitation of constituencies from the 1991 Census to the 2001 Census. It did not shift to the 2011 or 2021 Census, and it did not concern the 1981/1991 Census pairing."}, {"num": 74, "text": "The 89th Amendment (2003) split the combined SC & ST Commission into two separate bodies. Under which Articles were they created?", "options": ["National Commission for SCs (Art. 338) and National Commission for STs (Art. 338-A)", "National Commission for SCs (Art. 340) and National Commission for STs (Art. 341)", "National Commission for SCs (Art. 338-A) and National Commission for STs (Art. 338-B)", "A single combined commission remained under Art. 338"], "correct": 0, "explanation": "The 89th Amendment (2003) split the combined SC & ST Commission into the National Commission for Scheduled Castes (Article 338) and the National Commission for Scheduled Tribes (Article 338-A) as two separate bodies. Articles 340/341 and 338-B are not the articles used for this split (338-B relates to the NCBC, created by the 102nd Amendment)."}, {"num": 75, "text": "The 91st Amendment (2003) limited the Council of Ministers' size and strengthened the Anti-Defection Law. What were the specific changes?", "options": ["Council of Ministers limited to 15% of total Lok Sabha/State Assembly strength; no protection for a 1/3rd split under anti-defection", "Council of Ministers limited to 25% of strength; protection extended for any defection", "Council of Ministers limited to 10%; abolished the Anti-Defection Law entirely", "No limit set on Council of Ministers; strengthened judicial appointments"], "correct": 0, "explanation": "The 91st Amendment (2003) capped the Council of Ministers at 15% of the total strength of the Lok Sabha or State Assembly, and strengthened the Anti-Defection Law by removing protection for a 1/3rd split (only a 2/3rd merger remains an exception). It did not set the limit at 25% or 10%, and it did not abolish the Anti-Defection Law."}, {"num": 76, "text": "The 92nd Amendment (2003) added four languages to the Eighth Schedule, bringing the total to 22. Which languages were added?", "options": ["Sindhi, Konkani, Manipuri, Nepali", "Bodo, Dogri, Maithili, Santhali", "Assamese, Bengali, Gujarati, Kannada", "Tamil, Telugu, Malayalam, Marathi"], "correct": 1, "explanation": "The 92nd Amendment (2003) added Bodo, Dogri, Maithili, and Santhali to the Eighth Schedule, bringing the total recognised languages to 22 (mnemonic: 'BDMS — Babu Drinks Masala Soda'). Sindhi was added by the 21st Amendment and Konkani/Manipuri/Nepali by the 71st — not the 92nd."}, {"num": 77, "text": "The 97th Amendment (2011) gave constitutional status to which institutions, and what did it add to the Constitution?", "options": ["Co-operative Societies; added Art. 19(1)(c), Art. 43-B, and Part IX-B", "Panchayats; added Part IX", "Municipalities; added Part IX-A", "NCBC; added Article 338-B"], "correct": 0, "explanation": "The 97th Amendment (2011) gave constitutional status to Co-operative Societies, adding Article 19(1)(c), Article 43-B, and a new Part IX-B. Panchayats and Municipalities were covered by the 73rd and 74th Amendments respectively, and the NCBC's constitutional status came from the 102nd Amendment."}, {"num": 78, "text": "The 99th Amendment (2014) replaced the collegium system with the National Judicial Appointments Commission (NJAC). What was its fate?", "options": ["It remains in force today", "It was struck down as unconstitutional by the Supreme Court in 2015", "It was repealed by Parliament in 2018", "It was upheld and expanded in 2016"], "correct": 1, "explanation": "The 99th Amendment (2014) introduced the NJAC to replace the collegium system, but it was struck down as unconstitutional by the Supreme Court in 2015, restoring the collegium system. It was not repealed by Parliament, was not upheld, and is not currently in force."}, {"num": 79, "text": "The 100th Amendment (2015) ratified which international agreement?", "options": ["The India-Nepal Border Treaty", "The Land Boundary Agreement between India and Bangladesh, exchanging enclaves", "The India-China Line of Actual Control Agreement", "The India-Sri Lanka Maritime Boundary Agreement"], "correct": 1, "explanation": "The 100th Amendment (2015) ratified the Land Boundary Agreement between India and Bangladesh, exchanging territories (enclaves) to streamline the border. It did not involve Nepal, China, or Sri Lanka."}, {"num": 80, "text": "The 101st Amendment (2016) is famous for introducing which reform, and which two new Articles did it add?", "options": ["Right to Education; added Art. 21A and 51A", "GST ('One Nation, One Tax'); added Art. 246A and Art. 279A", "Anti-Defection Law; added the Tenth Schedule", "Women's Reservation; added Art. 334A"], "correct": 1, "explanation": "The 101st Amendment (2016) established the Goods and Services Tax (GST), popularly termed 'One Nation, One Tax', and added Article 246A (special provision for GST) and Article 279A (constitution of the GST Council). RTE (Art. 21A/51A) came from the 86th Amendment, the Anti-Defection Law from the 52nd, and Women's Reservation (Art. 334A) from the 106th."}, {"num": 81, "text": "The 102nd Amendment (2018) gave constitutional status to which body, and inserted which Article?", "options": ["National Commission for Backward Classes (NCBC); inserted Article 338B", "National Commission for STs; inserted Article 338A", "National Human Rights Commission; inserted Article 338C", "Election Commission; inserted Article 324A"], "correct": 0, "explanation": "The 102nd Amendment (2018) granted constitutional status to the National Commission for Backward Classes (NCBC), inserting Article 338B, and empowered the President to notify the list of SEBCs. The NCST (Art. 338A) came from the 89th Amendment, and the NHRC/EC options are not tied to this amendment."}, {"num": 82, "text": "The 103rd Amendment (2019) introduced 10% EWS reservation for the general category by amending which Articles?", "options": ["Articles 15 and 16", "Articles 14 and 21", "Articles 330 and 332", "Articles 338 and 338A"], "correct": 0, "explanation": "The 103rd Amendment (2019) introduced 10% reservation for Economically Weaker Sections (EWS) of the general category in government jobs and educational institutions, by amending Articles 15 and 16. It did not amend Articles 14/21 or the SC/ST commission articles (338/338A)."}, {"num": 83, "text": "The 104th Amendment (2020) extended SC/ST reservation in legislatures until when, and abolished reserved seats for which community?", "options": ["Extended until 2030; abolished reserved seats for the Anglo-Indian community", "Extended until 2025; abolished reserved seats for OBCs", "Made SC/ST reservation permanent; abolished EWS reservation", "Extended until 2035; abolished reserved seats for Sikkim"], "correct": 0, "explanation": "The 104th Amendment (2020) extended SC/ST reservation in the Lok Sabha and State Assemblies for 10 more years, until 2030, and abolished the reserved seats that previously existed for the Anglo-Indian community. It did not extend until 2025 or 2035, did not make reservation permanent, and did not touch EWS or Sikkim seats."}, {"num": 84, "text": "The 105th Amendment (2021) clarified state powers regarding which matter, reversing an SC judgment's interpretation?", "options": ["State Governments' power to identify their own SEBC lists, reversing the interpretation in the Maratha reservation judgment", "State Governments' power to appoint High Court judges", "State Governments' power to declare financial emergency", "State Governments' power to amend the Constitution unilaterally"], "correct": 0, "explanation": "The 105th Amendment (2021) clarified that State Governments retain the power to identify their own Socially and Educationally Backward Classes (SEBC) lists, reversing the Supreme Court's interpretation of the 102nd Amendment in the Maratha reservation case. It did not concern HC judge appointments, financial emergency, or unilateral constitutional amendment powers, none of which rest with states alone."}, {"num": 85, "text": "The 106th Amendment (2023), the Nari Shakti Vandan Adhiniyam, provides 33% reservation for women in which bodies, and when does it take effect?", "options": ["Lok Sabha, State Assemblies, and NCT of Delhi; only after the census and delimitation exercise", "Rajya Sabha only; effective immediately", "Panchayats only; effective from 2024", "All legislatures including local bodies; effective from the date of assent"], "correct": 0, "explanation": "The 106th Amendment (2023) provides 33% reservation for women in the Lok Sabha, State Assemblies, and the NCT of Delhi, inserting Article 334A — but the notes stress that this reservation will come into effect only after the census and delimitation exercise, not immediately. It does not cover only the Rajya Sabha or only Panchayats, and it was not made effective immediately upon assent."}, {"num": 86, "text": "The 131st Amendment Bill (2026) attempted to fast-track women's reservation. What happened to it, and what was it based on?", "options": ["It was passed unanimously and used the 2011 Census data", "It was introduced on April 16, 2026, aimed to bypass the delimitation freeze using 2011 Census data and expand the Lok Sabha, but the Lok Sabha rejected it for falling short of a two-thirds majority", "It became the 132nd Amendment after minor changes", "It was withdrawn before being introduced in Parliament"], "correct": 1, "explanation": "The 131st Amendment Bill was introduced on April 16, 2026 in a special session, aiming to bypass the delimitation freeze and operationalise 33% women's reservation using 2011 Census data, alongside proposed Lok Sabha expansion — but it was rejected by the Lok Sabha for falling short of the required two-thirds majority. It was not passed unanimously, did not become the '132nd Amendment', and was not withdrawn before introduction."}]}, {"id": "overview", "label": "Overview: Parts & Schedules", "icon": "📚", "questions": [{"num": 87, "text": "As per the notes, how many Articles, Parts, and Schedules does the Constitution of India originally have?", "options": ["395 Articles, 22 Parts, 12 Schedules", "444 Articles, 25 Parts, 10 Schedules", "395 Articles, 20 Parts, 9 Schedules", "448 Articles, 22 Parts, 12 Schedules"], "correct": 0, "explanation": "The notes state the Constitution originally has 395 Articles, 22 Parts, and 12 Schedules — though the Article count isn't fixed since many sub-articles (like 21A, the 243-series) were added later via amendments. The other combinations of numbers given do not match the notes."}, {"num": 88, "text": "What happened to Part VII of the Constitution, explaining why the Parts jump directly from Part VI to Part VIII?", "options": ["Part VII was never created", "Part VII (States in Part B) was repealed by the 7th Amendment, 1956", "Part VII merged into Part VI", "Part VII was renumbered as Part IX"], "correct": 1, "explanation": "The notes flag an exam trap: Part VII, which dealt with 'States in Part B', was repealed by the 7th Amendment, 1956, which is why there is no Part VII today and the numbering jumps from Part VI to Part VIII. It was not simply never created, merged into Part VI, or renumbered as Part IX (which instead was newly added for Panchayats)."}, {"num": 89, "text": "Parts IX, IX-A, and IX-B were added sequentially by which amendments, and in what order do they appear?", "options": ["IX by 74th (Municipalities), IX-A by 73rd (Panchayats), IX-B by 97th (Co-operatives)", "IX by 73rd (Panchayats), IX-A by 74th (Municipalities), IX-B by 97th (Co-operative Societies)", "IX by 97th, IX-A by 73rd, IX-B by 74th", "All three were added by the 73rd Amendment together"], "correct": 1, "explanation": "Part IX (Panchayats) was added by the 73rd Amendment, Part IX-A (Municipalities) by the 74th Amendment, and Part IX-B (Co-operative Societies) by the 97th Amendment — a sequential local-governance build-up matching the ascending amendment numbers. The order is not reversed, and they were not all added simultaneously by the 73rd Amendment."}, {"num": 90, "text": "Which Part of the Constitution deals with Emergency Provisions, and which deals with Union Territories?", "options": ["Emergency Provisions: Part XVIII; Union Territories: Part VIII", "Emergency Provisions: Part XV; Union Territories: Part VI", "Emergency Provisions: Part XX; Union Territories: Part IX", "Emergency Provisions: Part XVII; Union Territories: Part X"], "correct": 0, "explanation": "According to the notes' table, Emergency Provisions (Articles 352–360) are covered in Part XVIII, while Union Territories (Articles 239–242) are covered in Part VIII. Part XV covers Elections, Part XX covers Amendment of the Constitution, and Part X covers Scheduled & Tribal Areas — none of which match Emergency Provisions or Union Territories."}, {"num": 91, "text": "Which Part of the Constitution covers 'Union–State Relations' and spans which Article range?", "options": ["Part XI, Articles 245–263", "Part XII, Articles 264–300A", "Part XIII, Articles 301–307", "Part X, Articles 244–244A"], "correct": 0, "explanation": "Part XI, covering Articles 245–263, is titled 'Union–State Relations' in the notes' table. Part XII (Articles 264–300A) covers Finance, Property, Contracts, and Suits; Part XIII (301–307) covers Trade, Commerce, and Intercourse; and Part X (244–244A) covers Scheduled & Tribal Areas."}, {"num": 92, "text": "Which Schedule of the Constitution lists the allocation of seats in the Rajya Sabha, and which lists laws immune from judicial review (mainly land reform laws)?", "options": ["4th Schedule: Rajya Sabha seats; 9th Schedule: laws immune from judicial review", "1st Schedule: Rajya Sabha seats; 8th Schedule: laws immune from judicial review", "5th Schedule: Rajya Sabha seats; 6th Schedule: laws immune from judicial review", "2nd Schedule: Rajya Sabha seats; 10th Schedule: laws immune from judicial review"], "correct": 0, "explanation": "The 4th Schedule allocates seats in the Rajya Sabha, while the 9th Schedule contains laws (chiefly land reform laws) that are immune from judicial review. The 1st Schedule lists states/UTs and their territorial jurisdiction, the 8th Schedule lists official languages, the 5th/6th Schedules deal with tribal administration, the 2nd Schedule covers salaries of constitutional authorities, and the 10th Schedule contains anti-defection provisions."}, {"num": 93, "text": "According to the notes, the 5th and 6th Schedules are described as 'sister' provisions for tribal administration. What distinguishes them?", "options": ["5th covers general states' Scheduled Areas/Tribes; 6th covers Tribal Areas specifically in Assam, Meghalaya, Tripura, Mizoram", "5th covers Panchayat powers; 6th covers Municipality powers", "5th covers official languages; 6th covers Rajya Sabha seat allocation", "There is no difference — both cover identical provisions"], "correct": 0, "explanation": "The 5th Schedule provides for the administration and control of Scheduled Areas and Scheduled Tribes generally, while the 6th Schedule specifically covers Tribal Areas in Assam, Meghalaya, Tripura, and Mizoram (the North-Eastern states). The 11th/12th Schedules — not the 5th/6th — mirror Panchayat/Municipality powers, and the 8th Schedule covers languages, not the 5th/6th."}, {"num": 94, "text": "Similarly, the 11th and 12th Schedules are described as mirroring which Parts of the Constitution?", "options": ["Part IX (Panchayats) and Part IX-A (Municipalities) respectively", "Part V (Union) and Part VI (States) respectively", "Part III (Fundamental Rights) and Part IV (DPSP) respectively", "Part XI (Union-State Relations) and Part XII (Finance) respectively"], "correct": 0, "explanation": "The 11th Schedule lists the powers/responsibilities of Panchayats (mirroring Part IX), and the 12th Schedule lists the powers/responsibilities of Municipalities (mirroring Part IX-A). They do not mirror the Union/State government Parts (V/VI), Fundamental Rights/DPSP (III/IV), or Union-State Relations/Finance (XI/XII)."}, {"num": 95, "text": "Which Schedule contains the Union, State, and Concurrent Lists, and which contains the recognised official languages?", "options": ["7th Schedule: the three Lists; 8th Schedule: 22 recognised official languages", "8th Schedule: the three Lists; 7th Schedule: 22 recognised official languages", "6th Schedule: the three Lists; 9th Schedule: 22 recognised official languages", "3rd Schedule: the three Lists; 7th Schedule: 22 recognised official languages"], "correct": 0, "explanation": "The 7th Schedule contains the Union, State, and Concurrent Lists (as referenced in Article 246), while the 8th Schedule lists the 22 recognised official languages of India. The 6th and 9th Schedules cover tribal areas and land-reform-law immunity respectively, and the 3rd Schedule covers Forms of Oaths and Affirmations, not the three lists or languages."}, {"num": 96, "text": "Which Schedule prescribes the Forms of Oaths and Affirmations, and which prescribes salaries/allowances of constitutional authorities?", "options": ["3rd Schedule: Oaths/Affirmations; 2nd Schedule: salaries/allowances", "2nd Schedule: Oaths/Affirmations; 3rd Schedule: salaries/allowances", "4th Schedule: Oaths/Affirmations; 1st Schedule: salaries/allowances", "1st Schedule: Oaths/Affirmations; 4th Schedule: salaries/allowances"], "correct": 0, "explanation": "The 3rd Schedule prescribes the Forms of Oaths and Affirmations for various constitutional office-holders, while the 2nd Schedule prescribes the salaries and allowances of constitutional authorities (like the President, Governors, Speaker, and Judges). The 1st and 4th Schedules deal with states/UTs' territories and Rajya Sabha seat allocation respectively, not oaths or salaries."}, {"num": 97, "text": "Which Schedule of the Constitution is dedicated to the powers and responsibilities of Panchayats, added via the 73rd Amendment?", "options": ["11th Schedule", "12th Schedule", "9th Schedule", "10th Schedule"], "correct": 0, "explanation": "The 11th Schedule lists the powers and responsibilities of Panchayats, added consistent with the 73rd Amendment's creation of Part IX. The 12th Schedule instead covers Municipalities (74th Amendment), the 9th Schedule covers land-reform-law immunity, and the 10th Schedule covers anti-defection provisions."}, {"num": 98, "text": "Which Part of the Constitution deals with Tribunals, and which deals with the Official Language, respectively?", "options": ["Part XIV-A: Tribunals; Part XVII: Official Language", "Part XIV: Tribunals; Part XVI: Official Language", "Part XV: Tribunals; Part XVIII: Official Language", "Part XIII: Tribunals; Part XIX: Official Language"], "correct": 0, "explanation": "According to the notes' table, Part XIV-A (Articles 323A–323B) deals with Tribunals, while Part XVII (Articles 343–351) deals with the Official Language. Part XIV covers Services under Union/States, Part XVI covers Special Provisions for certain classes, Part XV covers Elections, and Part XIII covers Trade & Commerce, Part XIX covers Miscellaneous provisions — none matching this pairing."}, {"num": 99, "text": "Which Part of the Constitution governs the Amendment procedure itself, and it consists of how many Articles?", "options": ["Part XX, a single Article (368)", "Part XXI, Articles 369–392", "Part XIX, Articles 361–367", "Part XXII, Articles 393–395"], "correct": 0, "explanation": "Part XX, 'Amendment of Constitution,' consists of just a single Article — Article 368. Part XXI (Temporary/Transitional/Special Provisions) spans Articles 369–392, Part XIX (Miscellaneous) spans 361–367, and Part XXII (Short Title, Commencement, Hindi Text) spans Articles 393–395 — none of these are the Amendment Part."}]}, {"id": "union_citizenship", "label": "Union & Citizenship", "icon": "🌍", "questions": [{"num": 100, "text": "Article 1 famously describes India as an 'Indestructible Union of destructible states.' What does this mean, and which Schedule lists the States/UTs?", "options": ["States can never be altered; states/UTs listed in the 8th Schedule", "The Union itself cannot be broken up, though individual states can be reorganised/altered; states/UTs listed in the 1st Schedule", "Both the Union and states are permanently fixed; listed in the 7th Schedule", "Only UTs can be altered, not states; listed in the 2nd Schedule"], "correct": 1, "explanation": "Article 1's phrase means the Union of India as a whole is indestructible, even though individual states are 'destructible' — i.e., their boundaries/existence can be altered by Parliament (as under Article 3). States and UTs are listed in the 1st Schedule, not the 7th, 8th, or 2nd Schedule, and it is not true that states can never be altered."}, {"num": 101, "text": "Under Article 2, Parliament may admit or establish new states into the Union — this provision applies specifically to which territories?", "options": ["Only territories that were already part of India at commencement", "Territories not originally part of India", "Only Union Territories", "Only territories acquired through war"], "correct": 1, "explanation": "Article 2 empowers Parliament to admit or establish new states specifically from territories not originally part of India — distinguishing it from Article 3, which deals with reorganising existing Indian territory. It is not limited to already-included Indian territory, UTs alone, or territories acquired via war."}, {"num": 102, "text": "Under Article 3, Parliament can form new states, alter boundaries, or change names. What is the key exam trap regarding a State Legislature's opinion on such a Bill?", "options": ["The State's opinion is binding on Parliament and must be followed", "The President must refer the Bill to the State Legislature for views, but the State's opinion is NOT binding on Parliament", "No reference to the State Legislature is ever required", "Parliament requires the State's written consent before proceeding"], "correct": 1, "explanation": "Under Article 3, the President must refer a relevant Bill to the concerned State Legislature for its views, but — as a classic exam trap — the State's opinion is NOT binding on Parliament, which can proceed regardless. It is not the case that no reference is ever required, nor that the state's written consent/binding approval is needed."}, {"num": 103, "text": "Article 3 also clarifies that no reference to a State Legislature is needed in which case?", "options": ["When forming a Union Territory", "When altering an international border", "When the change affects more than two states", "When Parliament acts during an Emergency"], "correct": 0, "explanation": "The notes clarify that no reference to a State Legislature is required for changes involving Union Territories under Article 3. Altering international borders, changes affecting multiple states, and Emergency-period action are not the exception specified in the notes."}, {"num": 104, "text": "Article 4 clarifies that laws made under Articles 2 and 3 (which may amend the 1st and 4th Schedules) are:", "options": ["Treated as Constitutional Amendments requiring Article 368 procedure and special majority", "NOT treated as a Constitutional Amendment under Article 368, and passed by simple majority", "Treated the same as Money Bills", "Require a 2/3rd majority in both Houses"], "correct": 1, "explanation": "Article 4 clarifies that laws made under Articles 2 and 3, even though they may amend the 1st and 4th Schedules, are NOT treated as Constitutional Amendments under Article 368, and are passed by simple majority. They are not classified as Money Bills, and they don't require special/2/3rd majority procedures."}, {"num": 105, "text": "Under Article 5, who was considered a citizen of India at the commencement of the Constitution?", "options": ["Anyone who applied for citizenship after 1950", "A person domiciled in India who was either born in India, or whose parent was born in India, or who was resident in India for 5 years before 26 January 1950", "Only those born in India after 1947", "Anyone who owned property in India"], "correct": 1, "explanation": "Article 5 provided citizenship at commencement to persons domiciled in India who met one of these conditions: born in India, a parent born in India, or ordinarily resident in India for at least five years immediately before 26 January 1950. Mere application after 1950, being born only after 1947, or owning property are not the qualifying conditions."}, {"num": 106, "text": "Articles 6 and 7 deal with citizenship for migrants relating to Pakistan. What is the key distinction?", "options": ["Article 6 = migrants TO Pakistan; Article 7 = migrants FROM Pakistan", "Article 6 = migrants FROM Pakistan (grants citizenship if conditions met); Article 7 = migrants TO Pakistan (lost citizenship if migrated after 1 March 1947, unless returned with a resettlement permit)", "Both articles deal only with migrants FROM Pakistan", "Both articles were repealed after 1950"], "correct": 1, "explanation": "Article 6 deals with migrants FROM Pakistan, granting citizenship if residence/registration conditions are met, while Article 7 deals with migrants TO Pakistan, who lost their Indian citizenship if they migrat
