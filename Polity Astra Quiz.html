ed after 1 March 1947, unless they later returned under a resettlement permit. The pairing is not reversed, and neither article has been repealed."}, {"num": 107, "text": "Article 8 allows Persons of Indian Origin (PIOs) residing abroad to acquire Indian citizenship how?", "options": ["Automatically upon birth abroad", "By registering as Indian citizens via Indian diplomatic missions", "Only by returning permanently to India first", "Through a direct Presidential order"], "correct": 1, "explanation": "Article 8 allows persons of Indian origin residing outside India to register as Indian citizens through Indian diplomatic missions abroad. It is not automatic at birth, does not require permanent return to India first, and is not done via a direct Presidential order."}, {"num": 108, "text": "Under Article 9, what happens if an Indian citizen voluntarily acquires the citizenship of a foreign state?", "options": ["Nothing changes; dual citizenship is allowed", "They automatically lose their Indian citizenship", "They must seek Parliament's approval to retain Indian citizenship", "Only their voting rights in India are suspended"], "correct": 1, "explanation": "Article 9 provides that voluntary acquisition of foreign citizenship results in automatic loss of Indian citizenship — India does not recognise dual citizenship in this sense. It's not merely a voting-rights suspension, and no separate Parliamentary approval process is described to retain citizenship after this."}, {"num": 109, "text": "Articles 10 and 11 deal with continuance of citizenship and Parliament's regulatory power. What do they establish?", "options": ["Citizenship continues subject to laws made by Parliament (Art. 10), and Parliament can regulate acquisition and termination of citizenship (Art. 11)", "Citizenship is permanently fixed and Parliament cannot alter it", "Only the Supreme Court can regulate citizenship matters", "State legislatures regulate citizenship, not Parliament"], "correct": 0, "explanation": "Article 10 provides that citizenship continues subject to the provisions of any law made by Parliament, and Article 11 gives Parliament the power to regulate the acquisition and termination of citizenship and all matters relating to it. Citizenship is not permanently fixed beyond Parliament's power, and it is Parliament — not the Supreme Court or state legislatures — that holds this regulatory power."}]}, {"id": "fundamental_rights", "label": "Fundamental Rights", "icon": "⚖️", "questions": [{"num": 110, "text": "Part III of the Constitution, containing Fundamental Rights, is often called the 'Heart and Soul' of the Constitution — but which specific Article earns that exact title, and via which mechanism?", "options": ["Article 32, enforceable via Constitutional Remedies", "Article 14, via Equality before Law", "Article 19, via the Six Freedoms", "Article 21, via Right to Life"], "correct": 0, "explanation": "While all of Part III is important, the notes specifically label Article 32 (Constitutional Remedies) — attributed to Dr. Ambedkar — as the 'Heart and Soul' of the Constitution, because it lets citizens directly approach the Supreme Court to enforce their Fundamental Rights. Articles 14, 19, and 21 are important rights but are not the ones given this specific title in the notes."}, {"num": 111, "text": "Article 12 defines the term 'State' for the purposes of Fundamental Rights. Which of these is included in this definition?", "options": ["Only the Union and State Governments/Legislatures", "The Government/Parliament of India, State Governments/Legislatures, local authorities, and government bodies like LIC and ONGC", "Only private companies with government contracts", "Only the judiciary"], "correct": 1, "explanation": "Article 12's definition of 'State' is broad, including the Government and Parliament of India, State Governments and Legislatures, local authorities, and other government-controlled bodies such as LIC and ONGC. It is not limited to just the Union and State governments, does not include ordinary private companies with contracts, and is not limited to the judiciary."}, {"num": 112, "text": "Article 13 is described as the base of Judicial Review. Which of the following correctly matches its sub-clauses?", "options": ["13(1): old laws inconsistent with FRs become void; 13(2): the State shall not make laws reducing FRs; 13(3): defines the meaning of 'law'", "13(1): defines 'State'; 13(2): defines 'law'; 13(3): old laws become void", "13(1): the State shall not make laws reducing FRs; 13(2): old laws become void; 13(3): grants judicial review power to High Courts only", "Article 13 has only one clause with no sub-parts"], "correct": 0, "explanation": "Article 13 has three key sub-clauses: 13(1) makes pre-existing laws inconsistent with Fundamental Rights void to that extent, 13(2) bars the State from making new laws that abridge FRs, and 13(3) defines the meaning of 'law' for this purpose. The definitions are not swapped, and Article 13 is not limited to High Courts alone, nor does it have just one clause."}, {"num": 113, "text": "Article 14 guarantees equality before the law and equal protection of the laws. Who is this right available to?", "options": ["Only Indian citizens", "Any person in India, not just citizens", "Only government employees", "Only adults above 18 years"], "correct": 1, "explanation": "Article 14's protection is explicitly noted as being available to 'any person in India' — not restricted to citizens alone. It is not confined to government employees or only to adults; it is a general equality guarantee for all persons within India."}, {"num": 114, "text": "Article 15 prohibits discrimination on certain grounds under clause 15(1). Which of the following is NOT one of those listed grounds?", "options": ["Religion", "Place of birth", "Political affiliation", "Sex"], "correct": 2, "explanation": "Article 15(1) prohibits discrimination on grounds of religion, race, caste, sex, or place of birth. Political affiliation is not one of the specifically listed grounds under Article 15(1) in the notes."}, {"num": 115, "text": "Which sub-clause of Article 15 specifically provides for reservation for Economically Weaker Sections (EWS)?", "options": ["15(3)", "15(4)", "15(5)", "15(6)"], "correct": 3, "explanation": "Article 15(6) specifically provides for reservation for Economically Weaker Sections (EWS), added by the 103rd Amendment. 15(3) covers special provisions for women and children, 15(4) covers special provisions for SC/ST/OBC, and 15(5) covers reservation in educational institutions generally."}, {"num": 116, "text": "Article 16 governs equality of opportunity in public employment. Which sub-clause allows Parliament to fix residence requirements for certain jobs?", "options": ["16(2)", "16(3)", "16(4)", "16(5)"], "correct": 1, "explanation": "Article 16(3) allows Parliament to prescribe a residence requirement within a state or UT for certain classes of employment or appointment. Article 16(2) prohibits job discrimination on various grounds, 16(4) allows reservation for backward classes, and 16(5) allows religious institutions to prefer staff of the same religion."}, {"num": 117, "text": "Which sub-clauses of Article 16 deal specifically with reservation matters, according to the notes?", "options": ["16(4) backward class reservation, 16(4A) promotion reservation for SC/ST, 16(4B) carry-forward of unfilled vacancies, and 16(6) EWS reservation", "Only 16(1) and 16(2)", "Only 16(3)", "16(5) alone covers all reservation matters"], "correct": 0, "explanation": "The reservation-related sub-clauses of Article 16 are: 16(4) reservation for backward classes, 16(4A) reservation in promotion for SC/ST, 16(4B) carrying forward unfilled reserved vacancies, and 16(6) reservation for EWS. 16(1) and 16(2) deal with equal opportunity and non-discrimination generally, and 16(5) deals with religious institutions' staffing preference, not reservation broadly."}, {"num": 118, "text": "Article 17 abolishes untouchability. What is the legal consequence of practising it in any form?", "options": ["It is merely a moral wrong with no legal consequence", "It is a punishable offence", "It is punishable only if committed by a government official", "It is only a civil wrong, not criminal"], "correct": 1, "explanation": "Article 17 abolishes untouchability and explicitly makes its practice in any form a punishable offence — it is not merely a moral wrong, is not limited to government officials, and is treated as a punishable (not merely civil) matter."}, {"num": 119, "text": "Article 18 deals with abolition of titles. Under 18(1), the State cannot confer titles, except which two categories?", "options": ["Religious and business titles", "Military and academic distinctions", "Political and royal titles", "Sports and cultural titles"], "correct": 1, "explanation": "Article 18(1) bars the State from conferring titles on anyone, except military and academic distinctions. Religious, business, political, royal, sports, and cultural titles are not the stated exceptions in the notes."}, {"num": 120, "text": "Under Article 18, what must a foreigner holding an office of profit under the Indian government do before accepting any title from a foreign state?", "options": ["Nothing, no permission needed", "Obtain the President's permission (Art. 18(3))", "Obtain Parliament's approval", "Resign from the Indian office first"], "correct": 1, "explanation": "Article 18(3) requires that a foreigner holding an office of profit or trust under the Indian State must obtain the President's permission before accepting any title from a foreign state. It is not an automatic entitlement, does not require full Parliamentary approval, and does not require resignation from the Indian office."}, {"num": 121, "text": "Article 19(1) guarantees six freedoms. Which freedom, originally part of Article 19(1), was removed and is NOT among the current six?", "options": ["Freedom of speech and expression", "Freedom to practise any profession, trade, or business", "Right to property — Article 19(1)(f)", "Freedom to move freely throughout India"], "correct": 2, "explanation": "The original Article 19(1)(f), the Right to Property, was removed (linked to the deletion of Article 31 by the 44th Amendment), and is a classic exam trap — it is no longer among the current six freedoms. Freedom of speech, freedom to practise a profession/trade/business, and freedom of movement are all still among the current six freedoms."}, {"num": 122, "text": "Which restriction clause of Article 19 applies specifically to the freedom to form associations or unions [19(1)(c)]?", "options": ["19(2)", "19(3)", "19(4)", "19(5)"], "correct": 2, "explanation": "Article 19(4) provides the reasonable restrictions applicable to the freedom to form associations or unions under 19(1)(c), on grounds like sovereignty, public order, and morality. Article 19(2) restricts speech & expression, 19(3) restricts the freedom of peaceful assembly, and 19(5) restricts movement/residence freedoms."}, {"num": 123, "text": "According to the notes, the restriction under 19(5) — covering the freedoms to move freely and to reside/settle anywhere in India — can be imposed on grounds of public interest and:", "options": ["Religious sentiment", "Protection of Scheduled Tribes", "Economic policy alone", "Political stability"], "correct": 1, "explanation": "Article 19(5) permits restrictions on the freedoms to move freely (19(1)(d)) and to reside/settle anywhere in India (19(1)(e)) on grounds of public interest and for the protection of the interests of Scheduled Tribes. Religious sentiment, economic policy alone, and political stability are not the stated grounds."}, {"num": 124, "text": "Article 20 provides protection in respect of conviction for offences, through three sub-clauses. Which correctly matches them?", "options": ["20(1) No Ex-Post-Facto Law; 20(2) No Double Jeopardy; 20(3) No Self-Incrimination", "20(1) No Double Jeopardy; 20(2) No Ex-Post-Facto Law; 20(3) Right to a lawyer", "20(1) No Self-Incrimination; 20(2) No Double Jeopardy; 20(3) No Ex-Post-Facto Law", "Article 20 has only one clause covering all criminal protections"], "correct": 0, "explanation": "Article 20 has three clauses: 20(1) prohibits Ex-Post-Facto laws (punishing an act that wasn't a crime when committed), 20(2) prohibits Double Jeopardy (double punishment for the same offence), and 20(3) prohibits Self-Incrimination (forcing the accused to testify against themselves). The other orderings mismatch these protections, and Article 20 is not a single undivided clause."}, {"num": 125, "text": "According to the notes, which two Fundamental Rights can never be suspended, even during a National Emergency (after the 44th Amendment)?", "options": ["Articles 19 and 21", "Articles 20 and 21", "Articles 14 and 19", "Articles 21 and 32"], "correct": 1, "explanation": "The notes highlight that Articles 20 and 21 are the only Fundamental Rights that can never be suspended, even during an Emergency, following the 44th Amendment's protections. Article 19 CAN be suspended during specific emergencies (War/External Aggression), so pairing it with 21 or 14 with 19 is incorrect, and Article 32 itself can be affected by an Emergency suspension order under Article 359."}, {"num": 126, "text": "Article 21 guarantees the Right to Life and Personal Liberty. Beyond its literal text, how has the judiciary expanded its scope?", "options": ["It remains limited strictly to physical life only", "Judicially expanded to include rights like Privacy, Livelihood, and Clean Environment", "It only applies to citizens, not foreigners", "It has never been subject to judicial interpretation"], "correct": 1, "explanation": "Article 21 has been judicially expanded well beyond its literal wording to include rights such as Privacy, Livelihood, and a Clean Environment, among others. It is not limited strictly to physical survival, is not restricted only to citizens (as with Art 14, it uses 'person'), and has been the subject of extensive judicial interpretation, not none at all."}, {"num": 127, "text": "Article 21A, inserted by the 86th Amendment, guarantees free and compulsory education for which age group?", "options": ["3–6 years", "6–14 years", "5–18 years", "14–18 years"], "correct": 1, "explanation": "Article 21A guarantees free and compulsory education for children aged 6 to 14 years. It does not cover ages 3–6, 5–18, or 14–18 as the specified range."}, {"num": 128, "text": "Article 22 provides protections against arrest and detention. Within how many hours must an arrested person be produced before a magistrate, under 22(2)?", "options": ["12 hours", "24 hours", "48 hours", "72 hours"], "correct": 1, "explanation": "Under Article 22(2), a person arrested must be produced before a magistrate within 24 hours of arrest. The other time limits (12, 48, or 72 hours) do not match this constitutional requirement."}, {"num": 129, "text": "Under Article 22, the protections in 22(1) and 22(2) — being told the reason for arrest and produced before a magistrate — do NOT apply to which categories, per 22(3)?", "options": ["Ordinary criminal suspects", "Enemy aliens and persons under preventive detention laws", "Government employees only", "Minors under 18"], "correct": 1, "explanation": "Article 22(3) excludes enemy aliens and persons arrested/detained under preventive detention laws from the protections of being informed of arrest grounds and produced before a magistrate within 24 hours (22(1)/(2)). Ordinary criminal suspects, government employees generally, and minors are not the excluded categories named."}, {"num": 130, "text": "Under Article 22(4), preventive detention beyond how long requires approval from an Advisory Board?", "options": ["1 month", "3 months", "6 months", "1 year"], "correct": 1, "explanation": "Article 22(4) requires that preventive detention exceeding 3 months must be approved by an Advisory Board. Detention periods of 1 month, 6 months, or 1 year are not the threshold specified in the notes."}, {"num": 131, "text": "Article 23 prohibits trafficking, begar, and forced labour under 23(1). However, 23(2) allows the State to do what?", "options": ["Impose compulsory service for a public purpose, so long as it is non-discriminatory", "Permit private forced labour in exceptional cases", "Suspend this right during any state of emergency", "Allow forced labour only for foreign nationals"], "correct": 0, "explanation": "Article 23(2) permits the State to impose compulsory service for a public purpose (such as military conscription or community service), provided it is applied without discrimination. It does not permit private forced labour, is not automatically suspended during emergencies, and is not limited to targeting foreign nationals."}, {"num": 132, "text": "Article 24 prohibits employment of children below what age in factories, mines, or other hazardous work?", "options": ["12 years", "14 years", "16 years", "18 years"], "correct": 1, "explanation": "Article 24 prohibits the employment of children below 14 years of age in factories, mines, or other hazardous occupations. The threshold is not 12, 16, or 18 years."}, {"num": 133, "text": "Article 25 guarantees freedom of religion, including freedom of conscience and the right to practise, profess, and propagate religion. What power does 25(2) reserve for the State?", "options": ["To ban all religious practices", "To regulate secular activities associated with religious practice, and undertake social reform", "To choose an official state religion", "To tax religious institutions freely"], "correct": 1, "explanation": "Article 25(2) preserves the State's power to regulate or restrict secular activities associated with religious practice and to provide for social welfare and reform. It does not permit banning all religious practices, does not establish an official state religion, and is not about freely taxing religious institutions (which is separately barred by Article 27)."}, {"num": 134, "text": "Article 27 specifically prohibits what regarding religion?", "options": ["Forcing anyone to pay a tax whose proceeds are used to promote any particular religion", "Any individual from donating money to a religious institution", "State funding for the maintenance of ancient monuments", "Religious institutions from collecting voluntary donations"], "correct": 0, "explanation": "Article 27 prohibits compelling any person to pay a tax whose proceeds are specifically used to promote or maintain any particular religion or religious denomination. It does not prevent voluntary individual donations, does not bar State funding of historic monuments (a secular purpose, covered separately by Article 49), and does not prohibit institutions from collecting voluntary donations."}, {"num": 135, "text": "Article 28 restricts religious instruction. Under 28(1), religious teaching is barred in which type of institutions, with what exception under 28(2)?", "options": ["Barred in private schools; exception for madrasas", "Barred in institutions wholly maintained out of State funds; exception for institutions run under a trust/endowment requiring such instruction", "Barred in all schools without exception", "Barred only in universities, not schools"], "correct": 1, "explanation": "Article 28(1) bars religious instruction in institutions wholly maintained out of State funds, while 28(2) carves out an exception for institutions administered by the State but established under an endowment or trust that requires religious instruction to be imparted. It is not limited to private schools or only universities, and there is a specific exception, not a blanket ban on all schools."}, {"num": 136, "text": "Articles 29 and 30 protect minority interests. Which correctly describes their combined scope?", "options": ["Art 29: citizens can protect their language/script/culture and are protected from discrimination in state-institution admissions; Art 30: religious/linguistic minorities can establish and administer their own educational institutions", "Art 29 deals with religious minorities' education rights; Art 30 deals with cultural protection for all citizens", "Both articles apply only to religious minorities, not linguistic ones", "Art 29 and 30 were both removed by the 44th Amendment"], "correct": 0, "explanation": "Article 29 lets citizens (any section, not just minorities) protect their distinct language, script, or culture, and bars discrimination in admission to state-maintained institutions; Article 30 specifically allows religious or linguistic minorities to establish and administer their own educational institutions. The scopes are not reversed, Article 29 isn't limited to religious minorities alone, and neither article was removed by the 44th Amendment (that amendment removed Art 31)."}, {"num": 137, "text": "What happened to Article 31, the original Right to Property, and what replaced it?", "options": ["It remains a Fundamental Right today", "It was removed by the 44th Amendment, 1978, and is now only a legal right under Article 300A", "It was merged into Article 21", "It was replaced by Article 21A"], "correct": 1, "explanation": "Article 31 (Right to Property) was removed by the 44th Amendment, 1978, and property is now protected only as a legal right under Article 300A — not as a Fundamental Right. It was not merged into Article 21 (Right to Life) and was not replaced by Article 21A (which instead covers the Right to Education)."}, {"num": 138, "text": "Article 32, the 'Heart and Soul' of the Constitution, allows citizens to move which court directly for enforcement of Fundamental Rights?", "options": ["Any local court", "The Supreme Court", "Only the High Court of the concerned state", "The Inter-State Council"], "correct": 1, "explanation": "Article 32(1) allows citizens to move the Supreme Court directly for enforcement of their Fundamental Rights, and 32(2) empowers the SC to issue writs for this purpose. This is not achieved via a local court, is not limited to the state High Court alone (though Art 226 gives a similar HC power), and has nothing to do with the Inter-State Council."}, {"num": 139, "text": "Under Article 32(3), who can be empowered to exercise powers similar to the Supreme Court's writ jurisdiction for enforcing Fundamental Rights?", "options": ["Only the President", "Other courts, if empowered by Parliament", "Only the Governor of each state", "Only Zonal Councils"], "correct": 1, "explanation": "Article 32(3) allows Parliament to empower other courts to exercise the Supreme Court's power to enforce Fundamental Rights within their local jurisdiction, in addition to or instead of the Supreme Court. This power does not rest with the President, Governors, or Zonal Councils."}, {"num": 140, "text": "Article 33 permits Parliament to restrict the Fundamental Rights of which groups, and for what purpose?", "options": ["Ordinary citizens, to maintain public order", "Members of the Armed Forces, Police, and Intelligence agencies, to ensure proper discharge of duties and maintenance of discipline", "Members of Parliament, to prevent corruption", "Judges, to ensure judicial independence"], "correct": 1, "explanation": "Article 33 allows Parliament to restrict or abrogate the Fundamental Rights of members of the Armed Forces, Police, and Intelligence agencies, in order to ensure proper discharge of their duties and maintenance of discipline. It does not target ordinary citizens generally, Members of Parliament, or judges."}, {"num": 141, "text": "Article 34 deals with restrictions on Fundamental Rights during the operation of what?", "options": ["A financial crisis", "Martial Law — Parliament can indemnify actions taken during this period", "A general election", "A Presidential vacancy"], "correct": 1, "explanation": "Article 34 provides that Parliament may indemnify (protect from legal consequences) any person for acts done in connection with the maintenance or restoration of order in an area where Martial Law was in force. It is not connected to financial crises, general elections, or a Presidential vacancy."}, {"num": 142, "text": "Article 35 clarifies that certain Fundamental Rights-related matters can only be legislated upon by whom?", "options": ["State Legislatures", "Only Parliament", "Local municipal bodies", "The judiciary itself"], "correct": 1, "explanation": "Article 35 specifies that only Parliament — not State Legislatures — has the power to make laws on certain matters connected with the Fundamental Rights (like laws under Articles 16(3), 32(3), 33, and 34), ensuring uniformity. State Legislatures, local bodies, and the judiciary do not hold this specific legislative power."}, {"num": 143, "text": "Regarding writ jurisdiction, how does Article 226 (High Court writs) compare in scope to Article 32 (Supreme Court writs)?", "options": ["Article 226 is narrower — it covers Fundamental Rights only, same as Art 32", "Article 226 is wider — High Courts can issue writs for Fundamental Rights AND other legal rights, while Art 32 covers only FRs", "Article 32 is wider, covering all legal rights, while Article 226 covers only FRs", "Both articles have exactly identical scope"], "correct": 1, "explanation": "Per the notes' memory anchor, Article 226 is wider in scope than Article 32 — High Courts can issue writs for the enforcement of Fundamental Rights as well as other (ordinary) legal rights, whereas Article 32 itself is a Fundamental Right limited to enforcement of FRs before the Supreme Court. The scopes are not reversed, and they are not identical."}]}, {"id": "dpsp", "label": "DPSP", "icon": "🎯", "questions": [{"num": 144, "text": "Directive Principles of State Policy (DPSPs), covered under Articles 36–51, have what legal enforceability status?", "options": ["They are directly enforceable by courts, just like Fundamental Rights", "They are NOT enforceable by courts, but are fundamental in governance", "They are enforceable only by High Courts, not the Supreme Court", "They were repealed by the 42nd Amendment"], "correct": 1, "explanation": "DPSPs are explicitly non-justiciable — not enforceable by any court — but are declared fundamental in the governance of the country, meaning the State is expected to apply them while making laws. They are not enforceable even by High Courts, and they were not repealed; in fact, the 42nd Amendment strengthened related provisions like Fundamental Duties."}, {"num": 145, "text": "Article 36 defines the term 'State' for DPSP purposes in the same way as which other Article?", "options": ["Article 14", "Article 12", "Article 21", "Article 32"], "correct": 1, "explanation": "Article 36 adopts the same definition of 'State' as Article 12 (used for Fundamental Rights), ensuring consistency in how the term applies across Parts III and IV. Articles 14, 21, and 32 are substantive rights provisions, not the source of this definitional cross-reference."}, {"num": 146, "text": "Article 38 focuses on Social Order and Welfare. According to its two clauses, the State should promote welfare and also:", "options": ["Increase inequalities to reward merit", "Reduce inequalities in income, status, and opportunity", "Focus exclusively on economic growth, ignoring social justice", "Abolish all forms of private property"], "correct": 1, "explanation": "Article 38(2) directs the State to strive to minimise inequalities in income, and eliminate inequalities in status, facilities, and opportunities, alongside Article 38(1)'s broader welfare mandate. It does not call for increasing inequalities, ignoring social justice, or abolishing private property outright."}, {"num": 147, "text": "Article 39 lists several principles of state policy. Which of the following is explicitly included among them?", "options": ["Right to a jury trial", "Equal pay for equal work", "Compulsory military service for all citizens", "Free legal representation in all civil suits"], "correct": 1, "explanation": "Article 39(d) specifically calls for equal pay for equal work for both men and women. A right to jury trial, compulsory military service for all, and universal free legal representation in civil suits are not among the principles listed under Article 39 in the notes (free legal aid specifically is covered separately under Article 39A)."}, {"num": 148, "text": "Which of the following is NOT one of the principles listed under Article 39?", "options": ["Equal right to livelihood for men and women", "Wealth should not be concentrated in a few hands", "Ownership and control of resources for the common good", "Reservation for Economically Weaker Sections in education"], "correct": 3, "explanation": "Article 39 covers equal right to livelihood, ownership/control of resources for common good, prevention of wealth concentration, equal pay for equal work, protecting workers/children from abuse, and ensuring healthy child development. EWS reservation in education is instead addressed under Article 15(6), added by the 103rd Amendment — not Article 39."}, {"num": 149, "text": "Article 39A, added by the 42nd Amendment (1976), deals with what specific principle?", "options": ["Uniform Civil Code", "Equal justice and free legal aid", "Workers' participation in industry management", "Protection of monuments"], "correct": 1, "explanation": "Article 39A, inserted by the 42nd Amendment (1976), directs the State to ensure equal justice and provide free legal aid, particularly to those unable to afford it. Uniform Civil Code is Article 44, workers' participation is Article 43A, and protection of monuments is Article 49 — distinct provisions."}, {"num": 150, "text": "Which Article of the DPSP deals with the Uniform Civil Code (UCC)?", "options": ["Article 43", "Article 44", "Article 48", "Article 51"], "correct": 1, "explanation": "Article 44 directs the State to endeavour to secure a Uniform Civil Code for all citizens throughout India. Article 43 relates to a living wage for workers, Article 48 relates to agriculture and animal husbandry, and Article 51 relates to international peace and security."}, {"num": 151, "text": "Article 43A, dealing with workers' participation in industry management, and Article 43B, dealing with co-operative societies, were added by which amendments respectively?", "options": ["43A by the 97th Amendment, 43B by the 42nd Amendment", "43A by the 42nd Amendment (1976), 43B by the 97th Amendment (2011)", "Both were added by the 73rd Amendment", "Both were part of the original Constitution"], "correct": 1, "explanation": "Article 43A (workers' participation in industry management) was added by the 42nd Amendment (1976), and Article 43B (co-operative societies) was added by the 97th Amendment (2011) — the notes highlight this as sharing the same numbers (42 and 97) as Fundamental Duties (42nd A.A.) and Part IX-B (97th A.A.) respectively. The pairing is not reversed, they weren't both added by the 73rd Amendment, and they were not part of the original 1950 Constitution."}, {"num": 152, "text": "Which Article of the DPSP deals with the Separation of Judiciary from the Executive?", "options": ["Article 46", "Article 47", "Article 50", "Article 51"], "correct": 2, "explanation": "Article 50 provides for the separation of the Judiciary from the Executive in the public services of the State. Article 46 relates to promotion of SC/ST and weaker sections' interests, Article 47 relates to nutrition, public health, and prohibition, and Article 51 relates to international peace and security."}, {"num": 153, "text": "Which DPSP Article covers Environment and Forest Protection, and which covers Protection of Monuments?", "options": ["Article 48A: Environment and Forest Protection; Article 49: Protection of Monuments", "Article 48: Environment and Forest Protection; Article 50: Protection of Monuments", "Article 49: Environment and Forest Protection; Article 48A: Protection of Monuments", "Article 45: Environment and Forest Protection; Article 46: Protection of Monuments"], "correct": 0, "explanation": "Article 48A directs the State to protect and improve the environment and to safeguard forests and wildlife, while Article 49 directs protection of monuments and places of historic/artistic interest. The pairing is not reversed, and Articles 45/46 relate to early childhood care and promotion of SC/ST interests, not environment or monuments."}, {"num": 154, "text": "Article 45, dealing with Early Childhood Care and Education for children below 6 years, was modified by which amendment?", "options": ["73rd Amendment, 1992", "86th Amendment, 2002", "97th Amendment, 2011", "42nd Amendment, 1976"], "correct": 1, "explanation": "Article 45 was modified by the 86th Amendment (2002), which shifted its focus to early childhood care for children below 6 years, since compulsory education for ages 6–14 was separately guaranteed as a Fundamental Right via the new Article 21A in the same amendment. The 73rd, 97th, and 42nd Amendments dealt with different matters."}, {"num": 155, "text": "Which Article of the DPSP relates to the Organisation of Panchayats, laying groundwork later expanded by the 73rd Amendment?", "options": ["Article 40", "Article 41", "Article 42", "Article 43"], "correct": 0, "explanation": "Article 40 directs the State to take steps to organise village Panchayats and endow them with such powers as necessary to function as units of self-government — this principle was later given constitutional teeth by the 73rd Amendment's Part IX. Articles 41, 42, and 43 relate to right to work/education, humane work conditions, and living wage respectively."}, {"num": 156, "text": "Which DPSP Article covers 'Right to Work, Education, and Public Assistance', and which covers 'Just and Humane Conditions of Work'?", "options": ["Article 41: Right to Work, Education & Public Assistance; Article 42: Just & Humane Work Conditions", "Article 42: Right to Work, Education & Public Assistance; Article 41: Just & Humane Work Conditions", "Article 43: Right to Work, Education & Public Assistance; Article 44: Just & Humane Work Conditions", "Article 40: Right to Work, Education & Public Assistance; Article 41: Just & Humane Work Conditions"], "correct": 0, "explanation": "Article 41 covers the Right to Work, to Education, and to Public Assistance in certain cases (like unemployment or old age), while Article 42 covers securing just and humane conditions of work and maternity relief. The pairing is not reversed, and Articles 43/44/40 cover different subjects (living wage, UCC, and Panchayats respectively)."}]}, {"id": "fd", "label": "Fundamental Duties", "icon": "🤝", "questions": [{"num": 157, "text": "Fundamental Duties, listed under Article 51A, were added by which amendment, and how many duties currently exist?", "options": ["24th Amendment; 10 duties", "42nd Amendment; currently 11 duties", "44th Amendment; 9 duties", "86th Amendment; 11 duties from the start"], "correct": 1, "explanation": "Fundamental Duties were added by the 42nd Amendment and currently number 11 duties (the 11th was added later by the 86th Amendment). They were not added by the 24th or 44th Amendments, and the original 42nd Amendment added only 10 duties, not all 11 from the start."}, {"num": 158, "text": "Which of the following is explicitly listed as a Fundamental Duty under Article 51A?", "options": ["To pay income tax honestly", "To cherish and follow the noble ideals of the freedom struggle", "To vote in every election", "To join the armed forces if physically fit"], "correct": 1, "explanation": "One of the Fundamental Duties is to cherish and follow the noble ideals that inspired the national freedom struggle. Paying income tax honestly, mandatory voting, and mandatory armed forces enrollment are not listed as Fundamental Duties in the notes (the actual duty is to defend the country and render national service 'when called upon', not compulsory enrollment)."}, {"num": 159, "text": "Which Fundamental Duty specifically requires developing 'scientific temper, humanism, and the spirit of inquiry and reform'?", "options": ["The duty to preserve composite culture", "The duty to develop scientific temper, humanism, and the spirit of inquiry and reform", "The duty to protect the environment", "The duty to safeguard public property"], "correct": 1, "explanation": "This is a distinct, standalone Fundamental Duty — to develop the scientific temper, humanism, and the spirit of inquiry and reform. It is separate from the duties to preserve composite culture, protect the environment, and safeguard public property, each of which is independently listed."}, {"num": 160, "text": "Which Fundamental Duty is unique in being imposed not just on citizens but also on parents/guardians, and when was it added?", "options": ["The duty to defend the country, added by the 42nd Amendment", "The 11th duty — to provide education opportunities to children aged 6–14 years, added by the 86th Amendment, 2002", "The duty to protect the environment, added by the 44th Amendment", "The duty to abjure violence, added by the 73rd Amendment"], "correct": 1, "explanation": "The 11th Fundamental Duty — providing education opportunities to children aged 6–14 years — is unique because it applies to parents/guardians as well as citizens, and it was added by the 86th Amendment in 2002, the same year Article 21A was inserted. The other duties listed as alternatives were not added via the 44th or 73rd Amendments, nor is the 'defend the country' duty the one imposed on parents."}, {"num": 161, "text": "Which of the following duties requires citizens to 'safeguard public property and abjure violence'?", "options": ["One of the 11 Fundamental Duties under Article 51A", "A Directive Principle under Article 51", "A Fundamental Right under Article 19", "Not part of the Constitution at all"], "correct": 0, "explanation": "Safeguarding public property and abjuring violence is explicitly listed among the 11 Fundamental Duties under Article 51A. It is not a DPSP under Article 51 (international peace), not a Fundamental Right under Article 19, and it is very much part of the Constitution."}, {"num": 162, "text": "According to the notes' mnemonic for the 11 Fundamental Duties, what is the correct first-letter sequence?", "options": ["A-C-U-D-P-V-P-D-S-S-P", "P-S-D-C-U-A-V-P-D-S-S", "A-B-C-D-E-F-G-H-I-J-K", "S-A-A-M-R-P (this is actually the Six Freedoms mnemonic)"], "correct": 0, "explanation": "The notes give the mnemonic first-letter sequence for the 11 duties as A-C-U-D-P-V-P-D-S-S-P (Abide, Cherish, Uphold, Defend, Promote, Value, Protect, Develop, Safeguard, Strive, Provide). The alphabetical A-B-C sequence is not the actual mnemonic, and 'S-A-A-M-R-P' is instead the mnemonic for the Six Freedoms under Article 19, not the Fundamental Duties."}]}, {"id": "executive", "label": "Executive: President & Governor", "icon": "👑", "questions": [{"num": 163, "text": "Article 52 declares the President as the Head of the Union Executive. Which Article vests corresponding executive power in the Governor for a State?", "options": ["Article 153", "Article 154", "Article 163", "Article 164"], "correct": 0, "explanation": "Article 153 provides that there shall be a Governor for each State, paralleling Article 52's declaration that the President is the head of the Union executive. Article 154 vests executive power in the Governor (paralleling Art. 53 for the President), while 163/164 deal with the State Council of Ministers, not the head-of-executive declaration."}, {"num": 164, "text": "Can one person serve as Governor of more than one state simultaneously?", "options": ["No, each state must have its own distinct Governor", "Yes, one person may be Governor of two or more states", "Only during a national emergency", "Only if both states are in the same zone"], "correct": 1, "explanation": "The notes explicitly state that one person may be appointed Governor of two or more States simultaneously. This is not restricted to emergency periods only, is not tied to being in the same zone, and is not barred as a rule."}, {"num": 165, "text": "How is the President elected under Article 54, compared to how the Governor is appointed under Article 155/156?", "options": ["President is elected by an Electoral College of elected MPs and MLAs; Governor is appointed by the President, with no election", "Both are directly elected by the people", "President is appointed by the Governor; Governor is elected by the state legislature", "Both are appointed by the Prime Minister"], "correct": 0, "explanation": "The President is elected by an Electoral College consisting of elected Members of Parliament and elected Members of the State Legislative Assemblies (Article 54), whereas the Governor is simply appointed by the President, with no election involved. Neither is directly elected by the general public, and neither is appointed by the PM or by state legislatures."}, {"num": 166, "text": "Article 55 specifies the manner of the President's election using which two mechanisms?", "options": ["First-past-the-post and simple majority", "Proportional representation and the Single Transferable Vote", "Direct popular vote and absolute majority", "Nomination by outgoing President and ratification by Parliament"], "correct": 1, "explanation": "Article 55 specifies that the President is elected via proportional representation by means of the Single Transferable Vote (STV) system. It is not a first-past-the-post system, not a direct popular vote, and not a nomination-and-ratification process."}, {"num": 167, "text": "Compare the terms of office and resignation procedures: Article 56 (President) versus Article 156 (Governor).", "options": ["President's term is 5 years and can resign to the VP; Governor holds office during the pleasure of the President, with a normal term of 5 years, and can resign to the President", "Both serve indefinite terms with no resignation option", "President's term is 6 years; Governor's term is 4 years", "Governor can resign only to the Chief Minister"], "correct": 0, "explanation": "Under Article 56, the President's term is 5 years, and they can resign by addressing the resignation to the Vice-President. Under Article 156, the Governor holds office during the pleasure of the President, has a normal term of 5 years, and can resign by addressing the President. Neither has an indefinite term, the terms are not 6/4 years, and Governors resign to the President, not the Chief Minister."}, {"num": 168, "text": "Under Article 57, how many times can a person be re-elected as President?", "options": ["Never — one term only", "Once more, for a maximum of two terms", "Any number of times", "Only if a two-thirds majority in Parliament approves"], "correct": 2, "explanation": "Article 57 provides that a person who has held or is holding the office of President is eligible for re-election to that office any number of times — there is no term limit. It is not restricted to one term, is not capped at two terms, and does not require a special parliamentary approval for re-election eligibility."}, {"num": 169, "text": "Comparing eligibility under Article 58 (President) and Article 157 (Governor), what is the minimum age requirement for each?", "options": ["President: 25 years; Governor: 30 years", "President: 35 years; Governor: 35 years", "President: 40 years; Governor: 30 years", "President: 35 years; Governor: 25 years"], "correct": 1, "explanation": "Both the President (Article 58) and the Governor (Article 157) must be at least 35 years of age, along with being a citizen of India. The President additionally must be qualified for election as a member of the Lok Sabha. The other age combinations given do not match the notes."}, {"num": 170, "text": "Under Article 59, what conditions apply to the President's office regarding Parliamentary membership and profit?", "options": ["The President must remain an MP; may hold an office of profit", "The President must NOT be an MP/MLA and must hold no office of profit, though an official residence is provided", "The President can simultaneously serve as PM", "There is no restriction on the President holding other offices"], "correct": 1, "explanation": "Article 59 provides that the President must not be a member of Parliament or a State Legislature, and must not hold any other office of profit, though an official residence and allowances are provided. The President cannot remain an MP or simultaneously serve as PM, and there is a clear restriction against holding an office of profit."}, {"num": 171, "text": "Who administers the oath of office to the President (Article 60), and who administers it to the Governor (Article 159)?", "options": ["President's oath by the CJI; Governor's oath by the Chief Justice of the concerned High Court", "President's oath by the Vice-President; Governor's oath by the CJI", "Both oaths administered by the Prime Minister", "President's oath by Parliament's Speaker; Governor's oath by the CM"], "correct": 0, "explanation": "The President's oath is administered by the Chief Justice of India (CJI) under Article 60, while the Governor's oath is administered by the Chief Justice of the concerned High Court under Article 159. Neither oath is administered by the Vice-President, the Prime Minister, the Speaker, or the Chief Minister."}, {"num": 172, "text": "Regarding removal from office: how does the President's impeachment (Article 61) differ from a Governor's removal?", "options": ["Both require the same impeachment process", "The President can only be impeached for Constitution violation, needing special majority and can start in either House; the Governor can simply be removed by the President anytime, with no formal process", "The Governor is impeached by the State Legislature", "The President can be removed by the Governor"], "correct": 1, "explanation": "Under Article 61, the President can be impeached only for violation of the Constitution, requiring a special majority, and the process can be initiated in either House of Parliament. In sharp contrast, a Governor has no impeachment process at all — they can simply be removed by the President at any time. The Governor is not impeached by the State Legislature, and the President is certainly not removable by a Governor."}, {"num": 173, "text": "Under Article 62, an election to fill a vacancy in the President's office must be completed within what time frame?", "options": ["3 months", "6 months", "1 year", "2 years"], "correct": 1, "explanation": "Article 62 requires that an election to fill a vacancy caused in the President's office be completed within 6 months of the vacancy occurring. The other timeframes (3 months, 1 year, 2 years) do not match this requirement."}, {"num": 174, "text": "Under Article 64, what dual role does the Vice-President hold?", "options": ["Deputy Prime Minister", "Ex-officio Chairman of the Rajya Sabha", "Head of the Planning Commission", "Chief Election Commissioner"], "correct": 1, "explanation": "Article 64 makes the Vice-President the ex-officio Chairman of the Rajya Sabha. The VP is not designated as a Deputy PM, does not head the Planning Commission, and is not the Chief Election Commissioner."}, {"num": 175, "text": "Under Article 65, when does the Vice-President act as President?", "options": ["Never, regardless of circumstances", "During a vacancy in the President's office, or during the President's absence/inability to act", "Only if directly elected to that role separately", "Only when the Prime Minister requests it"], "correct": 1, "explanation": "Article 65 provides that the Vice-President acts as President during a vacancy in the office of President, or when the President is unable to discharge their functions due to absence, illness, or another cause. This does not require a separate election, is not activated at the PM's request, and does occur under specific defined circumstances."}, {"num": 176, "text": "How is the Vice-President elected, per Article 66, and by what voting method?", "options": ["Elected by the people directly, using first-past-the-post", "Elected by members of both Houses of Parliament, using proportional representation with STV and secret ballot", "Elected only by the Rajya Sabha", "Appointed by the President, with no election"], "correct": 1, "explanation": "Article 66 provides that the Vice-President is elected by members of both Houses of Parliament (unlike the President, whose Electoral College also includes MLAs), using proportional representation by means of the Single Transferable Vote, by secret ballot. It is not a direct public election, not limited to the Rajya Sabha alone, and not a mere Presidential appointment."}, {"num": 177, "text": "Under Article 67, what is a key difference in how the Vice-President can be removed compared to the President's impeachment process?", "options": ["The VP cannot be removed at all", "The VP is removable by a Rajya Sabha resolution agreed to by the Lok Sabha — a comparatively simpler process than Presidential impeachment", "The VP is removed only by the Supreme Court", "The VP is removed by a unanimous vote of all Governors"], "correct": 1, "explanation": "Article 67 allows removal of the Vice-President through a resolution of the Rajya Sabha, agreed to by the Lok Sabha — a relatively simpler process than the special-majority impeachment procedure for the President under Article 61. The VP is not irremovable, is not removed by the Supreme Court, and is not removed via a vote of Governors."}, {"num": 178, "text": "Under Article 68, if a vacancy arises in the Vice-President's office, how does the resulting election differ from a President's vacancy election?", "options": ["Both are handled identically", "The VP vacancy election happens 'as soon as possible', and the newly elected person serves a FULL fresh 5-year term — different from the President's rule", "The Vice-President's office, once vacant, is permanently left unfilled", "The Prime Minister automatically takes over the VP's role"], "correct": 1, "explanation": "Article 68 provides that an election to fill a Vice-President vacancy takes place as soon as possible, and — a distinctive point flagged in the notes — the newly elected Vice-President serves a full fresh 5-year term, unlike some other office continuation rules. It is not treated identically to the President's process in all respects, the office is not left permanently vacant, and the PM does not automatically assume the VP's role."}, {"num": 179, "text": "Article 71 assigns the responsibility of deciding disputes regarding the election of the President or Vice-President to whom?", "options": ["Parliament, by a joint resolution", "The Supreme Court", "The Election Commission alone, with no appeal", "The Chief Justice of the relevant High Court"], "correct": 1, "explanation": "Article 71 vests the Supreme Court with the authority to inquire into and decide all doubts and disputes arising out of or in connection with the election of a President or Vice-President. This is not decided by a Parliamentary resolution, is not left solely to the Election Commission without appeal, and is not a High Court matter."}, {"num": 180, "text": "Comparing pardoning powers, how does the President's power under Article 72 differ from the Governor's power under Article 161?", "options": ["Both have identical pardon powers over all matters", "President's power covers court-martial, Union law, and death sentences (can fully pardon a death sentence); Governor's power applies only to State law matters and CANNOT fully pardon a death sentence", "Only the Governor can pardon a death sentence", "Neither the President nor Governor has pardoning power"], "correct": 1, "explanation": "Under Article 72, the President's pardoning power extends to court-martial sentences, offences against Union law, and death sentences — and the President CAN grant a full pardon for a death sentence. Under Article 161, the Governor's power is similar but applies only to State law matters, and the Governor CANNOT fully pardon a death sentence. Their powers are not identical, it is the President (not the Governor) who can fully pardon a death sentence, and both do possess pardoning power, contrary to the last option."}, {"num": 181, "text": "Article 74 establishes the Union Council of Ministers, headed by the PM, to aid and advise the President. Is the President bound by this advice?", "options": ["Never bound, has complete discretion", "Generally bound by the advice, after reconsideration if requested", "Bound only during an Emergency", "Only bound if the advice is unanimous"], "correct": 1, "explanation": "Article 74 provides that the Council of Ministers, headed by the Prime Minister, aids and advises the President, who is generally bound by this advice (even if the President asks for reconsideration once, the reconsidered advice must be followed). The President does not have complete discretion, this binding effect is not limited only to Emergency periods, and unanimity among ministers is not a stated precondition."}, {"num": 182, "text": "How does the Governor's position under Article 163 differ from the President's under Article 74, regarding the Council of Ministers' advice?", "options": ["The Governor is bound in exactly the same way as the President, with zero discretion", "The Governor has some discretionary powers, unlike the President who is generally bound by ministerial advice", "The Governor is never bound by any advice, in any situation", "The Governor's Council of Ministers is headed by the Speaker"], "correct": 1, "explanation": "Article 163 establishes the State Council of Ministers, headed by the Chief Minister, to aid and advise the Governor — but unlike the President, the Governor retains certain discretionary powers in specific matters. The Governor is not identically bound with zero discretion, is not free of ministerial advice entirely, and the State Council of Ministers is headed by the CM, not the Speaker."}, {"num": 183, "text": "Under Article 75, if a person who is not a Member of Parliament is appointed a Minister, within what period must they become an MP?", "options": ["3 months", "6 months", "1 year", "There is no such requirement"], "correct": 1, "explanation": "Article 75 requires a non-member Minister to become a Member of Parliament within 6 months of their appointment, or else cease to be a Minister. The corresponding requirement for State Ministers under Article 164(4) is the same 6-month window. The other timeframes given do not match this rule."}, {"num": 184, "text": "Article 76 establishes the office of Attorney General, while Article 165 establishes the corresponding State office. Which correctly matches the appointing authority and role of each?", "options": ["Attorney General appointed by the Governor; Advocate General appointed by the President", "Attorney General appointed by the President, qualified to be an SC judge, is the highest legal officer of India; Advocate General appointed by the Governor, qualified to be an HC judge, is the highest legal officer of the State", "Both offices are elected positions", "Both officers are appointed by the Chief Justice of India"], "correct": 1, "explanation": "The Attorney General is appointed by the President, must be qualified to be a Supreme Court judge, and serves as India's highest legal officer (Article 76). The Advocate General is appointed by the Governor, must be qualified to be a High Court judge, and serves as the State's highest legal officer (Article 165). Neither position is an elected office, and neither is appointed by the Chief Justice of India."}, {"num": 185, "text": "Under Articles 77 and 166, in whose name is the business of the Union Government and State Government respectively conducted?", "options": ["In the Prime Minister's/Chief Minister's name", "In the President's name (Union) and the Governor's name (State)", "In the name of the ruling political party", "In the Parliament's/State Legislature's name"], "correct": 1, "explanation": "Article 77 provides that all executive action of the Union Government is expressed to be taken in the name of the President, while Article 166 provides that State Government business is conducted in the name of the Governor — even though real executive power is exercised by the Council of Ministers. It is not conducted in the PM's/CM's name directly, not in the ruling party's name, and not in Parliament's/the Legislature's name."}, {"num": 186, "text": "Under Article 78, what are the Prime Minister's duties towards the President?", "options": ["To communicate all Council of Ministers' decisions to the President and provide information the President asks for", "To act as the President's representative in Parliament with voting rights", "To approve all Presidential appointments personally", "To draft the President's public speeches"], "correct": 0, "explanation": "Article 78 requires the Prime Minister to communicate to the President all decisions of the Council of Ministers relating to the administration of the Union's affairs and proposals for legislation, and to furnish information the President requests. It does not describe the PM as a voting representative in Parliament for the President, does not require personal approval of all appointments, and does not concern drafting speeches."}, {"num": 187, "text": "Article 167 places a parallel duty on the Chief Minister towards the Governor. What must the CM do?", "options": ["Nothing — the Governor has no right to information from the CM", "Communicate the Council of Ministers' decisions to the Governor and provide information the Governor requests", "Seek the Governor's permission before every cabinet meeting", "Report only to the President, bypassing the Governor"], "correct": 1, "explanation": "Article 167 mirrors Article 78 at the State level: the Chief Minister must communicate all Council of Ministers' decisions relating to State administration and legislative proposals to the Governor, and furnish any information the Governor requests. The Governor does have a right to this information, prior permission for every cabinet meeting isn't required, and the CM reports to the Governor, not by bypassing them to report only to the President."}]}, {"id": "legislature", "label": "Legislature", "icon": "🏛️", "questions": [{"num": 188, "text": "Article 79 defines Parliament as consisting of which three components?", "options": ["President, Rajya Sabha, Lok Sabha", "Prime Minister, Rajya Sabha, Lok Sabha", "President, Lok Sabha, Supreme Court", "Rajya Sabha, Lok Sabha, and the Cabinet"], "correct": 0, "explanation": "Article 79 defines Parliament as comprising the President, the Rajya Sabha, and the Lok Sabha. It does not include the Prime Minister, Supreme Court, or Cabinet as constituent parts of Parliament itself."}, {"num": 189, "text": "What is the maximum strength of the Rajya Sabha under Article 80, and how many members are nominated by the President?", "options": ["Max 250; 12 nominated by the President", "Max 245; 10 nominated by the President", "Max 300; 15 nominated by the President", "Max 250; all elected, none nominated"], "correct": 0, "explanation": "Article 80 fixes the maximum strength of the Rajya Sabha at 250, of which 12 are nominated by the President (typically persons with expertise in art, literature, science, or social service), while the rest are elected by State Legislatures. The other numeric combinations do not match, and it is not true that all members are elected with none nominated."}, {"num": 190, "text": "Under Article 81, how is the Lok Sabha composed, and how is its maximum strength determined?", "options": ["Members are nominated by the President; strength is unlimited", "Members are directly elected by the people; maximum strength is fixed by the Constitution", "Members are indirectly elected by State Assemblies; strength varies yearly", "Members are appointed by political parties in proportion to vote share"], "correct": 1, "explanation": "Article 81 provides that Lok Sabha members are directly elected by the people, and its maximum strength is fixed by the Constitution. Members are not nominated by the President (that applies to only 12 RS seats), are not indirectly elected via State Assemblies (unlike Rajya Sabha members), and are not appointed proportionally by parties."}, {"num": 191, "text": "Article 169 gives Parliament the power to create or abolish a State Legislative Council. What is required for this?", "options": ["A simple majority resolution by the State Assembly alone, no Parliament role", "A request from the State Assembly, followed by Parliament's law passed by special majority", "Only the Governor's signature is needed", "It requires a constitutional amendment under Article 368"], "correct": 1, "explanation": "Article 169 allows Parliament to create or abolish a Legislative Council in a state upon the request of that State's Legislative Assembly, and the resulting law must be passed by a special majority. It is not achieved purely by the State Assembly acting alone, is not done by mere Governor's signature, and does not require a full Article 368 constitutional amendment."}, {"num": 192, "text": "Under Article 170, what is the minimum and maximum number of members in a State Legislative Assembly (with some exceptions)?", "options": ["Minimum 40, Maximum 250", "Minimum 60, Maximum 500", "Minimum 100, Maximum 400", "Minimum 25, Maximum 300"], "correct": 1, "explanation": "Article 170 sets the Legislative Assembly's strength between a minimum of 60 and a maximum of 500 members (with some exceptions for smaller states/UTs). The other numeric ranges given do not match this rule."}, {"num": 193, "text": "Under Article 171, what is the maximum size of a Legislative Council relative to the Assembly, and its absolute minimum?", "options": ["Maximum 1/2 of Assembly strength, minimum 60", "Maximum 1/3rd of Assembly strength, minimum 40", "Maximum equal to Assembly strength, minimum 100", "Maximum 1/4th of Assembly strength, minimum 25"], "correct": 1, "explanation": "Article 171 caps the Legislative Council's total membership at 1/3rd of the Assembly's strength, with an absolute minimum of 40 members. It is not capped at 1/2, is not equal to Assembly strength, and is not capped at 1/4th, nor is the minimum 60, 100, or 25."}, {"num": 194, "text": "Under Article 171(3), the Legislative Council's composition includes members elected by graduates and by teachers. What share does each of these groups elect?", "options": ["1/3rd each", "1/12th each", "1/6th each", "1/2 each"], "correct": 1, "explanation": "Article 171(3) provides that 1/12th of Legislative Council members are elected by graduates (with at least 3 years' standing) and another 1/12th by teachers (with at least 3 years' teaching experience). The other listed fractions (1/3rd, 1/6th, 1/2) do not correspond to the graduate/teacher constituencies."}, {"num": 195, "text": "Under Article 171(3), what proportion of Legislative Council members is nominated directly by the Governor?", "options": ["1/3rd", "1/6th", "1/2", "None — the Governor has no nomination power here"], "correct": 1, "explanation": "Article 171(3)(e) provides that 1/6th of the Legislative Council's members are nominated by the Governor (typically persons with knowledge/experience in literature, science, art, cooperative movement, or social service). It is not 1/3rd or 1/2, and the Governor does hold this nomination power."}, {"num": 196, "text": "Comparing durations: the Rajya Sabha is a permanent body with 1/3rd retiring every 2 years, while the Lok Sabha's term is 5 years (Art. 83). How does the Legislative Council under Article 172 compare?", "options": ["The Council also has a fixed 5-year term like the Assembly", "The Council is a permanent body with 1/3rd retiring every 2 years, mirroring the Rajya Sabha, while the Assembly's term is 5 years, mirroring the Lok Sabha", "The Council has no fixed term at all and never changes members", "The Council's term is 6 years, unlike the Rajya Sabha"], "correct": 1, "explanation": "Article 172 mirrors Article 83's Union structure: the Legislative Council is a permanent body with 1/3rd of its members retiring every 2 years (like the Rajya Sabha), while the Legislative Assembly has a 5-year term (like the Lok Sabha). The Council does not have a fixed 5-year term, is not static forever, and does not have a 6-year term."}, {"num": 197, "text": "Under Articles 84 and 173, what are the minimum age qualifications to be a member of the Lok Sabha versus the Rajya Sabha (and their state equivalents)?", "options": ["Lok Sabha/Assembly: 25 years; Rajya Sabha/Council: 30 years", "Lok Sabha/Assembly: 21 years; Rajya Sabha/Council: 25 years", "Lok Sabha/Assembly: 30 years; Rajya Sabha/Council: 35 years", "Both are set at 18 years"], "correct": 0, "explanation": "Under Articles 84 and 173, the minimum age to be a member of the Lok Sabha or a State Legislative Assembly is 25 years, while for the Rajya Sabha or a State Legislative Council it is 30 years. The other age combinations (21/25, 30/35, or both at 18) do not match the notes."}, {"num": 198, "text": "Under Articles 85 and 174, who summons, prorogues, and dissolves the Lok Sabha and State Assembly respectively, and what is the maximum permissible gap between two sessions?", "options": ["The Speaker for both; gap must not exceed 6 months", "The President summons/prorogues/dissolves the Lok Sabha, and the Governor does the same for the State Assembly; gap must not exceed 6 months in both cases", "The Prime Minister for the Lok Sabha, and the Chief Minister for the Assembly; gap must not exceed 1 year", "There is no maximum gap prescribed between sessions"], "correct": 1, "explanation": "Under Article 85, the President summons, prorogues, and dissolves the Lok Sabha, while under Article 174 the Governor does the same for the State Assembly — and in both cases, the gap between two sessions cannot exceed 6 months. This is not the Speaker's or the PM's/CM's function, and there is indeed a maximum gap prescribed (6 months, not 1 year or unlimited)."}, {"num": 199, "text": "Under Articles 87 and 176, when does the President/Governor deliver a 'Special Address' to the legislature?", "options": ["Every single day Parliament is in session", "At the start of the first session every year, and after general elections", "Only once, at the very first sitting of a newly formed Parliament", "Only when requested by the Prime Minister"], "correct": 1, "explanation": "Articles 87 and 176 provide that the President (for Parliament) and the Governor (for the State Legislature) deliver a Special Address at the start of the first session of each year, and also after general elections. This is not a daily occurrence, is not limited only to the very first sitting ever, and is not contingent on a PM's request."}, {"num": 200, "text": "Who presides over the Rajya Sabha as its ex-officio Chairman under Article 89, and who elects the Deputy Chairman?", "options": ["The Vice-President is ex-officio Chairman; the Rajya Sabha itself elects the Deputy Chairman", "The Speaker is ex-officio Chairman; the President elects the Deputy Chairman", "The Prime Minister is ex-officio Chairman; the Lok Sabha elects the Deputy Chairman", "The senior-most member automatically becomes Chairman; no Deputy Chairman exists"], "correct": 0, "explanation": "Article 89 makes the Vice-President the ex-officio Chairman of the Rajya Sabha, while the Rajya Sabha itself elects its own Deputy Chairman from among its members. This role is not held by the Speaker (who instead presides over the Lok Sabha) or the PM, and a Deputy Chairman position does exist."}, {"num": 201, "text": "Under Article 178, who are the presiding officers of a State Legislative Assembly?", "options": ["The Governor and Deputy Governor", "The Speaker and Deputy Speaker", "The Chief Minister and Deputy Chief Minister", "The Advocate General alone"], "correct": 1, "explanation": "Article 178 provides for a Speaker and Deputy Speaker as the presiding officers of the State Legislative Assembly, elected by the Assembly itself — paralleling the Lok Sabha's Speaker/Deputy Speaker under Article 93. There is no 'Deputy Governor' post, and the CM/Deputy CM are executive, not presiding, officers; the Advocate General has no presiding role."}, {"num": 202, "text": "Under Article 100, what constitutes a quorum to conduct proceedings in either House of Parliament?", "options": ["A majority of total membership (more than 50%)", "A minimum of 1/10th of the total strength of the House", "At least 100 members, regardless of total strength", "No quorum requirement exists"], "correct": 1, "explanation": "Article 100(3) sets the quorum requirement at a minimum of 1/10th of the total membership of the House — if this isn't met, the presiding officer must adjourn the House (100(4)). It is not a majority requirement, not a fixed number like 100 regardless of size, and a quorum requirement does exist."}, {"num": 203, "text": "Under Article 100, does the presiding officer of a House vote in the first instance, and what special power do they have in case of a tie?", "options": ["They vote first, like any other member, with no special powers", "They generally do not vote in the first instance, but have a casting vote to break a tie", "They are barred from voting under any circumstances, including ties", "They can nominate additional members to vote if there is a tie"], "correct": 1, "explanation": "Under Article 100(1), the presiding officer of a House does not vote in the first instance like a regular member, but they do have a casting vote in case of an equality of votes, to break the tie. They are not barred from voting altogether, and they cannot nominate extra members to resolve a tie."}, {"num": 204, "text": "Under Article 101, what happens if a member of Parliament remains absent from all House meetings for 60 days without permission?", "options": ["Nothing happens; there is no such penalty", "Their seat may be declared vacant", "They are automatically suspended for one further term", "They are fined but retain their seat"], "correct": 1, "explanation": "Article 101(4) provides that if a member is absent from all meetings of the House for a period of 60 days without the House's permission, the House may declare their seat vacant. This is not without consequence, does not simply result in automatic suspension for a further term, and is not merely a monetary fine while retaining the seat."}, {"num": 205, "text": "Article 101 also bars a person from simultaneously holding which combinations of legislative seats?", "options": ["Being a member of both Houses of Parliament at the same time, and being a member of both a State Legislature and Parliament at the same time", "Being an MP and a municipal councillor at the same time", "Being an MLA and a Panchayat member at the same time", "There is no such restriction anywhere in Article 101"], "correct": 0, "explanation": "Article 101(1) and (2) bar a person from being a member of both Houses of Parliament simultaneously, and from being a member of a State Legislature and Parliament at the same time. The notes do not describe a bar on being an MP and municipal councillor, or an MLA and Panchayat member, under Article 101 — and the restriction very much does exist."}, {"num": 206, "text": "Under Article 102(1), which of the following is a valid ground for disqualification of an MP?", "options": ["Holding a graduate degree", "Holding an office of profit", "Being over the age of 60", "Speaking a regional language in the House"], "correct": 1, "explanation": "Article 102(1) lists disqualification grounds including holding an office of profit, being of unsound mind, being an undischarged insolvent, not being an Indian citizen, and voluntarily acquiring foreign citizenship. Holding a degree, being over 60, and speaking a regional language are not disqualification grounds under this article."}, {"num": 207, "text": "Under Article 102(2), relating to the Tenth Schedule (Anti-Defection Law), what is the exception that allows defection without disqualification?", "options": ["Any single member switching parties freely", "A merger where 2/3rd of the members of a party leave and join another party (as per the 91st Constitutional Amendment, 2003)", "Switching parties is always allowed with no exceptions needed", "Only nominated members can switch without penalty"], "correct": 1, "explanation": "Article 102(2), tied to the Tenth Schedule, allows an exception to disqualification when at least 2/3rd of a party's members merge with another party — this threshold was set by the 91st Amendment, 2003 (which removed the earlier, more lenient 1/3rd split exception). A single member switching freely is generally disqualifiable, defection isn't unconditionally allowed, and this exception is not limited to nominated members alone."}, {"num": 208, "text": "Who decides questions on disqualification of a Member of Parliament under Article 103, and after seeking whose opinion?", "options": ["The Speaker of the Lok Sabha, after seeking the Prime Minister's opinion", "The President, after seeking the Election Commission's opinion", "The Supreme Court, without consulting anyone else", "The Vice-President, after consulting the Attorney General"], "correct": 1, "explanation": "Article 103 provides that questions on disqualification of a Member of Parliament are decided by the President, acting after obtaining the opinion of the Election Commission. This is not decided by the Speaker/PM, is not solely a Supreme Court matter without EC input, and is not a Vice-President/Attorney General process."}, {"num": 209, "text": "For State Legislatures, the equivalent disqualification decision (Article 192) is made by whom, following whose opinion?", "options": ["The Speaker of the Assembly, after consulting the CM", "The Governor, after seeking the Election Commission's opinion", "The Chief Justice of the High Court, independently", "The President directly, bypassing the Governor"], "correct": 1, "explanation": "Article 192 mirrors Article 103 at the State level: the Governor decides questions on disqualification of MLAs/MLCs, after obtaining the Election Commission's opinion. This is not a Speaker/CM decision, is not made independently by the High Court's Chief Justice, and is not made directly by the President bypassing the Governor."}, {"num": 210, "text": "Article 105 grants MPs freedom of speech in Parliament and protection from questioning proceedings in court. Regarding civil arrest, MPs are protected during:", "options": ["The session and 40 days before/after it", "Only the exact hours the House is sitting", "The entire calendar year regardless of sessions", "There is no such protection from civil arrest"], "correct": 0, "explanation": "Article 105(3) protects MPs from civil arrest during a session of the House and for 40 days before and after it. This protection is not limited to just the sitting hours, is not a year-round blanket immunity, and this protection does exist under Article 105."}, {"num": 211, "text": "According to Article 107, in which House can an Ordinary Bill NOT originate, and what happens to a bill pending in the Lok Sabha when it is dissolved?", "options": ["A Money Bill cannot originate in the Rajya Sabha; a Lok Sabha-pending bill lapses on dissolution", "An Ordinary Bill cannot originate in the Rajya Sabha at all; pending bills never lapse", "A Money Bill cannot originate in the Lok Sabha; pending Rajya Sabha bills always lapse", "Bills can never lapse under any circumstance"], "correct": 0, "explanation": "Article 107 provides that an Ordinary Bill can originate in either House, EXCEPT a Money Bill, which can only originate in the Lok Sabha (per Article 109). On dissolution of the Lok Sabha, a bill pending in the Lok Sabha lapses, whereas a bill pending in the Rajya Sabha (that hasn't yet been passed by the Lok Sabha) does NOT lapse. Ordinary Bills are not barred from the Rajya Sabha altogether, and pending bills can indeed lapse under specific circumstances."}, {"num": 212, "text": "Under Article 109, a Money Bill can be introduced only in the Lok Sabha, on whose recommendation, and within how many days must the Rajya Sabha respond?", "options": ["On the Speaker's recommendation; RS must respond within 30 days", "On the President's recommendation; RS must respond within 14 days", "On the Prime Minister's recommendation; RS must respond within 6 weeks", "No recommendation needed; RS has unlimited time to respond"], "correct": 1, "explanation": "Article 109 requires that a Money Bill be introduced in the Lok Sabha only on the President's recommendation, and the Rajya Sabha must return it with recommendations within 14 days, after which the Lok Sabha may accept or reject those suggestions. It is not the Speaker's or PM's recommendation, and the Rajya Sabha does not have unlimited time to respond."}, {"num": 213, "text": "Comparing Article 111 (President's assent to bills) and Article 200 (Governor's assent), what power does the Governor have that isn't listed for the President in the notes?", "options": ["The Governor can outright reject a bill with no options; the President cannot", "The Governor may reserve a bill for the President's consideration, in addition to assenting, withholding, or returning it — the President's listed options are only to assent, withhold, or return", "The President has no power over bills at all", "Only the Governor can amend bills before signing"], "correct": 1, "explanation": "Under Article 111, the President may assent to, withhold assent from, or return an ordinary bill for reconsideration. Under Article 200, the Governor has these same options PLUS the additional power to reserve a bill for the President's consideration. Neither the Governor nor the President can simply reject a bill without any process, the President clearly has power over bills, and neither is described as unilaterally amending bill text before signing."}, {"num": 214, "text": "Article 121 (Parliament) and Article 211 (State Legislature) both restrict discussion of what matter, except in one specific circumstance?", "options": ["Discussion of the Union Budget, except during a Financial Emergency", "The conduct of a judge in discharge of their duties, except during impeachment proceedings", "Discussion of foreign policy, except during a war", "Discussion of the President's/Governor's personal life, in all circumstances"], "correct": 1, "explanation": "Articles 121 and 211 restrict Parliament and State Legislatures from discussing the conduct of a judge (of the Supreme Court or High Court) in the discharge of their duties, except in the course of a motion for the judge's removal (impeachment). This restriction is not about the Union Budget, foreign policy, or personal-life discussions of the President/Governor."}]}, {"id": "ordinance", "label": "Ordinance-Making Power", "icon": "📜", "questions": [{"num": 215, "text": "Under Article 123, when can the President issue an Ordinance, and on whose advice?", "options": ["When Parliament is in session; on the President's own discretion", "When Parliament is not in session; only on the advice of the Council of Ministers", "Any time, regardless of Parliament's session status; on the Chief Justice's advice", "Only during a national emergency; on the Speaker's advice"], "correct": 1, "explanation": "Article 123 allows the President to issue an Ordinance only when Parliament is not in session, and only on the advice of the Council of Ministers — the President has no independent discretion here. It is not issued while Parliament is sitting, is not based on the CJI's advice, a
