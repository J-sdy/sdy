nd is not restricted only to Emergency periods."}, {"num": 216, "text": "An Ordinance issued under Article 123 has what legal force, and what is it explicitly barred from doing?", "options": ["The same force as an ordinary executive order; can amend the Constitution", "The same force as a Parliamentary law; cannot amend the Constitution", "No legal force until ratified by the Supreme Court", "Force equal to a Money Bill only"], "correct": 1, "explanation": "An Ordinance under Article 123 has the same force and effect as an Act of Parliament, but it explicitly cannot be used to amend the Constitution. It is not merely an executive order with lesser force, does not require prior Supreme Court ratification to take effect, and is not limited to the force of a Money Bill alone."}, {"num": 217, "text": "Within how many weeks of Parliament's reassembly must an Ordinance be approved, or it ceases to operate?", "options": ["2 weeks", "6 weeks", "3 months", "6 months"], "correct": 1, "explanation": "Under Article 123, an Ordinance must be approved by Parliament within 6 weeks of its reassembly, or it will cease to operate. This 6-week window is explicitly noted as being the same for both the Union (Art. 123) and State-level (Art. 213) Ordinances. The other durations (2 weeks, 3 months, 6 months) do not match this rule."}, {"num": 218, "text": "Under Article 213, what special restriction applies to a Governor's Ordinance-making power that doesn't apply to the President under Article 123?", "options": ["The Governor cannot issue any Ordinance under any circumstance", "The Governor cannot issue an Ordinance on matters needing the President's prior approval, without instructions from the President", "The Governor's Ordinances never require legislative approval", "The Governor can issue Ordinances even while the Assembly is in session"], "correct": 1, "explanation": "Article 213 restricts the Governor from issuing an Ordinance on certain matters that would have needed the President's prior approval if introduced as a Bill, unless the Governor has received instructions from the President. The Governor does have Ordinance power (just with this added restriction), Governor's Ordinances do require the same 6-week legislative approval as Union Ordinances, and Ordinances can only be issued when the Assembly is NOT in session, same as at the Union level."}]}, {"id": "judiciary", "label": "Supreme Court & High Courts", "icon": "⚖️", "questions": [{"num": 219, "text": "Under Article 124, the Supreme Court consists of the CJI and other judges, all appointed by whom?", "options": ["The Chief Justice of India alone", "The President", "The Union Law Minister", "The Rajya Sabha, by resolution"], "correct": 1, "explanation": "Article 124 provides that Supreme Court judges, including the Chief Justice of India, are appointed by the President (following the collegium process in practice). They are not appointed solely by the outgoing CJI, the Law Minister, or via a Rajya Sabha resolution."}, {"num": 220, "text": "Article 214 provides for a High Court for each State. Under Article 125/221, who decides the salaries of SC and HC judges, and when can an SC judge's salary be reduced?", "options": ["Salaries decided by the President; can be reduced anytime by executive order", "Salaries decided by Parliament; SC judges' salary cannot be reduced except during a Financial Emergency", "Salaries decided by the CJI; never reducible under any circumstance", "Salaries decided by the Finance Commission; reducible annually"], "correct": 1, "explanation": "Under Articles 125 and 221, Parliament decides the salaries of Supreme Court and High Court judges, and a Supreme Court judge's salary cannot be reduced except during a Financial Emergency (Article 360). This is not decided by simple executive order, not decided by the CJI, and not decided by the Finance Commission."}, {"num": 221, "text": "Under Article 126, who appoints an Acting Chief Justice of India when the office is vacant or the CJI is unable to act?", "options": ["The Vice-President", "The President", "The senior-most Supreme Court judge, automatically, with no appointment needed", "The Union Cabinet, by majority vote"], "correct": 1, "explanation": "Article 126 allows the President to appoint an Acting Chief Justice of India when the office of CJI is vacant or the CJI is unable to perform their duties. This appointment is not made by the Vice-President, does not happen automatically without any Presidential act, and is not a Cabinet decision."}, {"num": 222, "text": "Under Article 127, who may appoint ad-hoc judges to the Supreme Court if a quorum is lacking, and whose consent is required?", "options": ["The President alone, without consulting anyone", "The CJI, with the President's consent", "The Attorney General, with Parliament's consent", "The Chief Justice of the relevant High Court, with the CJI's consent"], "correct": 1, "explanation": "Article 127 allows the Chief Justice of India to appoint ad-hoc judges to the Supreme Court, with the President's consent, if a quorum of judges is lacking to hold or continue a sitting. This is not solely a Presidential decision without consultation, not an Attorney General/Parliament matter, and not a High Court Chief Justice appointment power."}, {"num": 223, "text": "Under Article 129, what special status does the Supreme Court hold, and what power flows from it?", "options": ["It is a 'Court of Record' with power to punish for contempt", "It is subordinate to the High Courts in matters of record", "It has no power to punish for contempt of itself", "It is merely an appellate body with no special constitutional status"], "correct": 0, "explanation": "Article 129 declares the Supreme Court to be a 'Court of Record' with the power to punish for contempt of itself — Article 215 gives High Courts the identical status and power. The SC is not subordinate to High Courts, does have contempt power, and holds a distinct constitutional status beyond being a mere appellate body."}, {"num": 224, "text": "Under Article 130, where is the seat of the Supreme Court, unless the President decides otherwise?", "options": ["Mumbai", "Delhi", "Kolkata", "Chennai"], "correct": 1, "explanation": "Article 130 fixes the seat of the Supreme Court at Delhi, unless the CJI, with the President's approval, appoints another place or places as the seat. Mumbai, Kolkata, and Chennai are not the designated seat under Article 130."}, {"num": 225, "text": "Under Article 131, the Supreme Court's Original Jurisdiction covers disputes of what nature?", "options": ["Disputes between private individuals", "Disputes between the Union and States, or among States themselves", "Disputes involving foreign nationals only", "Disputes relating to local municipal elections"], "correct": 1, "explanation": "Article 131 gives the Supreme Court Original Jurisdiction over disputes between the Union and one or more States, or between States themselves. It does not cover ordinary private individual disputes, is not restricted to foreign nationals, and does not cover local municipal election disputes."}, {"num": 226, "text": "Which Article gives the Supreme Court the power to grant Special Leave to Appeal (SLP) from the judgment or order of any court or tribunal in India, with one key exception?", "options": ["Article 132", "Article 134", "Article 136", "Article 141"], "correct": 2, "explanation": "Article 136 grants the Supreme Court the power to grant Special Leave to Appeal (SLP) from any court or tribunal in the country, except military courts/tribunals. Articles 132 and 134 deal with specific appellate jurisdiction over constitutional and criminal cases respectively, and Article 141 deals with the binding nature of SC-declared law, not SLPs."}, {"num": 227, "text": "Under Article 137, what power does the Supreme Court have regarding its own judgments?", "options": ["No power to reconsider its own past judgments", "Power to review its own judgments", "Power only to review High Court judgments, not its own", "Power to review judgments only if Parliament directs it to"], "correct": 1, "explanation": "Article 137 grants the Supreme Court the power to review its own judgments or orders, subject to rules made by the Court and any law made by Parliament. This is a genuine self-review power, not limited to reviewing High Court judgments, and does not require a specific Parliamentary directive to exercise it."}, {"num": 228, "text": "Under Article 139A, what power does the Supreme Court have relating to cases pending across different courts?", "options": ["Power to transfer cases involving the same legal question between courts", "Power to dismiss any case without a hearing", "Power to appoint judges to lower courts directly", "Power to dissolve a High Court"], "correct": 0, "explanation": "Article 139A allows the Supreme Court to order the transfer of cases involving the same or substantially the same questions of law that are pending before different High Courts (or between a High Court and the SC), for consolidated hearing. It does not permit dismissing cases without a hearing, does not allow direct appointment of lower court judges, and does not allow dissolving a High Court."}, {"num": 229, "text": "Under Article 141, the law declared by the Supreme Court is binding on which courts, and how does this compare to a High Court's judgments under the notes?", "options": ["SC law is binding on all courts in India; a High Court's judgment is binding only within that State's jurisdiction", "SC law binds only the Supreme Court itself; HC judgments bind all courts nationally", "Neither SC nor HC judgments bind any other court", "SC and HC judgments have identical binding effect across all of India"], "correct": 0, "explanation": "Article 141 makes the law declared by the Supreme Court binding on all courts within the territory of India, whereas a High Court's judgments are binding only within that State's own jurisdiction — a narrower scope. It's not true that SC law binds only itself, that neither court's rulings bind others, or that SC and HC judgments carry identical nationwide binding force."}, {"num": 230, "text": "Under Article 142, what special power does the Supreme Court have that allows it flexibility beyond strict legal procedure?", "options": ["Power to pass any order necessary for doing 'complete justice' in a case before it", "Power to amend the Constitution unilaterally", "Power to dissolve Parliament", "Power to appoint the Prime Minister"], "correct": 0, "explanation": "Article 142 empowers the Supreme Court to pass any decree or order necessary for doing 'complete justice' in any matter pending before it. It does not grant the power to unilaterally amend the Constitution, dissolve Parliament, or appoint the Prime Minister, which lie with other constitutional processes/authorities entirely."}, {"num": 231, "text": "Under Article 143, the President may seek the Supreme Court's opinion on a matter of law or fact. What is this jurisdiction called, and is the SC's opinion binding on the President?", "options": ["Advisory Jurisdiction; the opinion is generally not treated as strictly binding", "Original Jurisdiction; the opinion is always binding", "Appellate Jurisdiction; the President must always follow it", "Writ Jurisdiction; irrelevant to the President"], "correct": 0, "explanation": "Article 143 provides the Supreme Court's Advisory Jurisdiction, under which the President may seek its opinion on questions of law or fact — though this advisory opinion isn't strictly binding like an ordinary judgment. It is not termed Original, Appellate, or Writ Jurisdiction, all of which serve different purposes described elsewhere in the notes."}, {"num": 232, "text": "Comparing Article 139 and Article 226, how do the Supreme Court's and High Courts' writ powers differ in scope?", "options": ["Article 139 lets Parliament grant the SC writ powers beyond Fundamental Rights; Article 226 lets a High Court issue writs for Fundamental Rights AND other legal rights — making Art 226 wider in scope than Art 32", "Both articles cover exactly the same ground with no difference", "Article 226 is narrower than Article 32 in every respect", "Neither article deals with writ jurisdiction at all"], "correct": 0, "explanation": "Article 139 allows Parliament to confer on the Supreme Court powers to issue writs for purposes beyond just enforcement of Fundamental Rights, while Article 226 lets High Courts issue writs both for Fundamental Rights and other (ordinary) legal rights — making the High Courts' writ jurisdiction under Art 226 wider in scope than even Article 32. The two provisions are not identical, Article 226 is not narrower than Article 32, and both articles clearly relate to writ jurisdiction."}, {"num": 233, "text": "Article 225 addresses the jurisdiction of existing High Courts. What does it provide?", "options": ["It abolishes all pre-Constitution High Court jurisdiction", "The jurisdiction of existing High Courts continues as it was before the Constitution came into force", "It transfers all HC jurisdiction to the Supreme Court", "It requires re-establishing every High Court from scratch"], "correct": 1, "explanation": "Article 225 provides that the jurisdiction of existing High Courts (as it existed just before the Constitution's commencement) continues, subject to the Constitution's other provisions and any law made by the appropriate legislature. It does not abolish this jurisdiction, does not transfer it to the SC, and does not require re-establishing High Courts anew."}, {"num": 234, "text": "Under Article 230, who has the power to extend or restrict a High Court's jurisdiction to Union Territories?", "options": ["The Chief Justice of that High Court, unilaterally", "Parliament", "The Governor of the nearest state", "The President, without any legislative role"], "correct": 1, "explanation": "Article 230 gives Parliament the power to extend or restrict the jurisdiction of a High Court to a Union Territory. This is not decided unilaterally by the concerned Chief Justice, is not a nearby-state Governor's function, and is not exercised by the President without Parliament's legislative role."}, {"num": 235, "text": "Comparing Article 128 (retired SC judges) and Article 224A (retired HC judges), what do these provisions allow?", "options": ["Neither article allows use of retired judges under any circumstances", "Retired SC judges may sit and act with consent (Art 128); retired HC judges may be requested to sit and act (Art 224A)", "Only retired HC judges can be recalled to service; retired SC judges cannot", "Both articles apply exclusively to judges who resigned, not those who retired at superannuation"], "correct": 1, "explanation": "Article 128 allows retired Supreme Court judges to sit and act as SC judges with their consent (and the CJI's/President's approval as applicable), while Article 224A allows retired High Court judges to be requested to sit and act in that HC. Both provisions do exist, and they are not limited to only judges who resigned rather than those who retired normally."}, {"num": 236, "text": "What does Article 134A specifically provide regarding appeals from a High Court to the Supreme Court?", "options": ["The High Court itself may certify that a case is fit for appeal to the Supreme Court", "Only the Supreme Court can decide whether a case may be appealed, with no HC role", "It abolishes the need for any certificate before an appeal", "It applies only to civil, never criminal, matters"], "correct": 0, "explanation": "Article 134A provides that a High Court may, on its own or on request, grant a certificate that a case is fit for appeal to the Supreme Court, streamlining part of the appeal process. It does not exclude the High Court's role entirely, does not abolish the certification requirement, and is not limited only to civil (as opposed to criminal) matters."}, {"num": 237, "text": "Under Article 135, the Supreme Court exercises which historically-rooted set of powers?", "options": ["Powers previously held by the Privy Council", "Powers previously exercised by the now-defunct Federal Court", "Powers of the British House of Lords", "No historical powers — Article 135 is purely forward-looking"], "correct": 1, "explanation": "Article 135 provides that the Supreme Court exercises the jurisdiction and powers that were formerly exercisable by the Federal Court (India's pre-Constitution apex court) under any pre-existing law, until Parliament provides otherwise. It does not concern the Privy Council or the House of Lords, and it is explicitly tied to this historical continuity, not purely forward-looking."}]}, {"id": "cag", "label": "CAG", "icon": "💰", "questions": [{"num": 238, "text": "The Comptroller and Auditor General (CAG), described as the 'Guardian of Public Money', is appointed by whom under Article 148, and where does the CAG take the oath?", "options": ["Appointed by the Prime Minister; oath before the CJI", "Appointed by the President; oath before the President", "Appointed by Parliament; oath before the Speaker", "Appointed by the Finance Commission; oath before the Finance Minister"], "correct": 1, "explanation": "Under Article 148, the CAG is appointed by the President, and takes the oath of office before the President as well (Art. 148(2)). The CAG is not appointed by the PM, Parliament, or the Finance Commission, and does not take the oath before the CJI, Speaker, or Finance Minister."}, {"num": 239, "text": "Under Article 148(3), how are the CAG's salary and service conditions determined, and what fund are they charged to?", "options": ["Set by the President; charged to the state's own treasury", "Set by Parliament; charged on the Consolidated Fund of India", "Set by the CAG's own office; charged to the RBI", "Set by the Finance Commission; charged to the GST Council's fund"], "correct": 1, "explanation": "Article 148(3) provides that the CAG's salary and other service conditions are determined by Parliament, and the expenditure is charged on the Consolidated Fund of India — ensuring financial independence. These are not set by the President alone, by the CAG's own office, or by the Finance Commission/GST Council."}, {"num": 240, "text": "What does Article 148(4) say about the CAG's post-retirement career, and how does the CAG's removal process compare to other officeholders?", "options": ["The CAG may take up any government post immediately after retirement; removal is by simple parliamentary vote", "The CAG is barred from holding any further office after retirement; removal process mirrors that of a Supreme Court judge", "The CAG can be removed only by the Prime Minister, at will", "There is no restriction on post-retirement employment or removal procedure"], "correct": 1, "explanation": "Article 148(4) bars the CAG from holding any further office under the Government of India or a State after retirement, and the CAG's removal process mirrors that of a Supreme Court judge — both designed to protect independence. The CAG is not free to take further government posts, is not removable at the PM's mere will, and there are indeed clear restrictions in both respects."}, {"num": 241, "text": "Under Article 149, whose entities does the CAG audit?", "options": ["Only the Union Government, not the States", "Union Government, State Governments, and Government companies/corporations", "Only private companies with government contracts", "Only local municipal bodies"], "correct": 1, "explanation": "Article 149 empowers the CAG (with duties/powers prescribed by Parliament through law) to audit the accounts of the Union Government, State Governments, and Government companies and corporations, ensuring proper use of public funds. This is not limited to only the Union, is not focused on private companies with contracts, and is not limited to local municipal bodies."}, {"num": 242, "text": "Under Article 150, in what form are the accounts of the Union and States kept, and on whose advice?", "options": ["In a form decided by the CAG alone, without consulting anyone", "In a form prescribed by the President, on the advice of the CAG", "In a form prescribed by Parliament directly, bypassing the CAG entirely", "In a form decided independently by each State Government"], "correct": 1, "explanation": "Article 150 provides that the accounts of the Union and States are kept in a form prescribed by the President, acting on the advice of the CAG. This is not decided by the CAG unilaterally, is not a matter Parliament prescribes directly without CAG input, and is not left to each State to decide independently."}, {"num": 243, "text": "Under Article 151, where are the Union's audit reports submitted, and where are the State's audit reports submitted?", "options": ["Union reports to the Prime Minister; State reports to the Chief Minister", "Union reports to the President, then placed before Parliament; State reports to the Governor, then placed before the State Legislature", "Both Union and State reports go directly to the CAG's own office for filing", "Union reports to the Supreme Court; State reports to the High Court"], "correct": 1, "explanation": "Article 151(1) requires Union audit reports to be submitted to the President and then placed before Parliament, while 151(2) requires State audit reports to be submitted to the Governor and then placed before the State Legislature. These reports are not submitted to the PM/CM directly, are not simply filed within the CAG's own office, and are not submitted to the judiciary."}]}, {"id": "panchayat", "label": "Panchayats & Municipalities", "icon": "🏘️", "questions": [{"num": 244, "text": "Panchayats (Part IX, added by the 73rd Amendment) and Municipalities (Part IX-A, added by the 74th Amendment) are described in the notes as mirroring each other. What is the practical exam implication?", "options": ["They are unrelated and must be studied entirely separately", "The two Parts mirror each other almost article-by-article — learning one side helps predict the other", "Only Municipality provisions are tested in exams, not Panchayats", "Panchayats have no comparable Municipality provision for any article"], "correct": 1, "explanation": "The notes stress that Part IX and Part IX-A mirror each other almost article-by-article, so learning one side's logic (e.g., Panchayat provisions) helps predict the parallel Municipality provision, and vice versa. They are not unrelated, both are equally testable, and virtually every Panchayat article has a Municipality counterpart."}, {"num": 245, "text": "Article 243 (Panchayat definitions) and Article 243P (Municipality definitions) define different levels of each institution. Which correctly matches Panchayat levels described?", "options": ["Ward, Zone, District only", "Village, Intermediate, and District level Panchayats, along with the Gram Sabha", "State, Regional, and National level Panchayats", "Only a single unified Panchayat level exists"], "correct": 1, "explanation": "Article 243 defines Panchayat-related terms including Gram Sabha, Panchayat, Village, and the Intermediate and District levels of Panchayats. There is no 'Zone' level described for Panchayats, no State/Regional/National Panchayat levels, and there are multiple defined levels, not just one."}, {"num": 246, "text": "Under Article 243Q, the three-tier structure of Municipalities (as they grow) is:", "options": ["Municipal Corporation → Municipal Council → Nagar Panchayat (decreasing in size)", "Nagar Panchayat → Municipal Council → Municipal Corporation (increasing in size/urbanization)", "Village Panchayat → Intermediate Panchayat → District Panchayat", "Zonal Council → Regional Council → National Council"], "correct": 1, "explanation": "Article 243Q(1) establishes a three-tier Municipal structure moving from smaller to larger urban areas: Nagar Panchayat (transitional area) → Municipal Council (smaller urban area) → Municipal Corporation (larger urban area). The order is not reversed, and the Village/Intermediate/District terms belong to the Panchayat structure (Art. 243B), not Municipalities."}, {"num": 247, "text": "Comparing Article 243A (Gram Sabha) with the Municipality side, what does the Gram Sabha do?", "options": ["It exercises powers and functions assigned to it by the State Legislature", "It has no defined role at all", "It directly elects the Prime Minister's local representative", "It functions as a judicial body for village-level disputes"], "correct": 0, "explanation": "Article 243A provides that the Gram Sabha exercises such powers and performs such functions at the village level as the State Legislature may provide by law. It is not without a defined role, has no connection to electing a PM's representative, and is not a judicial dispute-resolution body."}, {"num": 248, "text": "Under Articles 243D and 243T, what is the minimum proportion of seats reserved for women (including chairperson posts) in Panchayats and Municipalities respectively?", "options": ["1/4th", "1/3rd", "1/2", "1/6th"], "correct": 1, "explanation": "Both Article 243D(3) for Panchayats and Article 243T(3) for Municipalities require a minimum of 1/3rd of seats (including chairperson posts) to be reserved for women. This proportion is not 1/4th, 1/2, or 1/6th."}, {"num": 249, "text": "Under Articles 243D and 243T, how are SC/ST seats reserved in Panchayats and Municipalities?", "options": ["A fixed 25% quota regardless of population", "In proportion to their population in that area", "SC/ST reservation is not provided at all", "Only ST seats are reserved, not SC seats"], "correct": 1, "explanation": "Both Article 243D(1) for Panchayats and Article 243T(1) for Municipalities provide for reservation of seats for Scheduled Castes and Scheduled Tribes in proportion to their population in the relevant area. It is not a flat 25% quota regardless of population, reservation is indeed provided, and both SC and ST seats are covered, not just ST."}, {"num": 250, "text": "Under Article 243E, what is the term of a Panchayat, and what happens if it is dissolved before completing its term?", "options": ["Term is 5 years; elections must be held before the term ends or within 6 months of dissolution, and a reconstituted Panchayat serves only the remainder of the original term", "Term is unlimited; no elections are required after dissolution", "Term is 3 years; a reconstituted Panchayat gets a fresh full 3-year term", "Term is 5 years; dissolution automatically extends the term by 1 year"], "correct": 0, "explanation": "Article 243E(1) sets a 5-year term for Panchayats, and 243E(3) requires elections either before the term ends or within 6 months of dissolution; per 243E(4), if reconstituted after dissolution, the Panchayat serves only the remainder of the original 5-year term, not a fresh term. The term is not unlimited, is not 3 years, and dissolution does not automatically extend the term."}, {"num": 251, "text": "Article 243I (State Finance Commission) is constituted by whom, and at what interval, for Panchayats — and does it also review Municipal finances (per Art. 243Y)?", "options": ["Constituted by the President every 5 years; a separate commission handles Municipalities", "Constituted by the Governor every 5 years; the same Commission also reviews Municipal finances under Article 243Y", "Constituted by the CAG every 3 years; Municipalities are excluded from its review", "Constituted by Parliament every 10 years; only for Panchayats"], "correct": 1, "explanation": "Article 243I requires the Governor to constitute a State Finance Commission every 5 years, and under Article 243Y, this same Commission also reviews the financial position of Municipalities — a single body serving both purposes. It is not constituted by the President, CAG, or Parliament, and it is not limited to Panchayats alone, excluding Municipalities."}, {"num": 252, "text": "Under Article 243K (Panchayat elections) and Article 243ZA (Municipal elections), who supervises these elections?", "options": ["The Election Commission of India (ECI)", "The State Election Commission (SEC)", "The Governor personally", "The respective Panchayat/Municipality itself, with no external supervision"], "correct": 1, "explanation": "Both Panchayat elections (Article 243K) and Municipal elections (Article 243ZA) are supervised by the State Election Commission (SEC) — a distinct body from the national Election Commission of India. This supervision is not carried out by the ECI, is not a personal function of the Governor, and is not left to the local bodies to self-supervise."}, {"num": 253, "text": "Under Articles 243O and 243ZG, what is the bar on court interference regarding Panchayat/Municipal delimitation and elections?", "options": ["Courts can freely intervene at any stage of delimitation or elections", "Delimitation validity cannot be questioned in court, and elections can only be challenged via an election petition", "Only the Supreme Court may hear such disputes, not any other court", "There is no bar on court interference — it is unrestricted"], "correct": 1, "explanation": "Articles 243O and 243ZG both bar courts from questioning the validity of delimitation matters, and require that elections be challenged only through a specific election petition mechanism, not through ordinary litigation. Courts do not have free, unrestricted intervention power here, this is not limited to Supreme Court jurisdiction alone, and there clearly is a defined bar on interference."}, {"num": 254, "text": "Which of these provisions is exclusive to Municipalities and has NO Panchayat equivalent according to the notes?", "options": ["District Planning Committee (Art. 243ZD) and Metropolitan Planning Committee (Art. 243ZE)", "Reservation of seats for women (mirrored in both Parts)", "State Finance Commission provisions (mirrored in both Parts)", "Disqualification provisions (mirrored in both Parts)"], "correct": 0, "explanation": "The District Planning Committee (Article 243ZD) and Metropolitan Planning Committee (Article 243ZE) are Municipality-only provisions with no direct Panchayat equivalent listed in the notes. Reservation of women's seats, State Finance Commission provisions, and disqualification rules are all mirrored in both Part IX (Panchayats) and Part IX-A (Municipalities)."}, {"num": 255, "text": "Under Articles 243L and 243ZB, how do Part IX (Panchayats) and Part IX-A (Municipalities) apply to Union Territories?", "options": ["They never apply to Union Territories under any circumstance", "They apply to Union Territories, with modifications as the President may specify", "They apply to UTs automatically with zero modification allowed", "Only Part IX applies to UTs; Part IX-A never applies to UTs"], "correct": 1, "explanation": "Articles 243L and 243ZB provide that Part IX and Part IX-A respectively apply to Union Territories, but with such modifications or exceptions as the President may by public notification direct/specify. It is not the case that they never apply to UTs, that no modification is possible, or that only one of the two Parts applies to UTs."}, {"num": 256, "text": "Under Articles 243M and 243ZC, are Panchayats and Municipalities applicable to Scheduled and Tribal Areas?", "options": ["Yes, without any exception", "No — Part IX is not applicable to Scheduled/Tribal Areas and certain states (Art. 243M), and Part IX-A is similarly not applicable to Scheduled/Tribal Areas (Art. 243ZC)", "Only Municipalities are excluded from Scheduled Areas, not Panchayats", "Only Panchayats are excluded from Scheduled Areas, not Municipalities"], "correct": 1, "explanation": "Article 243M explicitly excludes Scheduled Areas and Tribal Areas (and certain states) from the application of Part IX (Panchayats), and Article 243ZC provides a similar exclusion for Part IX-A (Municipalities) regarding Scheduled/Tribal Areas. It is not true that they apply without exception, and both Parts — not just one — carry this exclusion."}]}, {"id": "emergency", "label": "Emergency Provisions", "icon": "🚨", "questions": [{"num": 257, "text": "Under Article 352, the President may proclaim a National Emergency if security is threatened by which grounds?", "options": ["War, External Aggression, or Armed Rebellion", "Economic recession only", "A pandemic outbreak", "Any state's request, regardless of the reason"], "correct": 0, "explanation": "Article 352(1) allows the President to proclaim a National Emergency if the security of India (or part of it) is threatened by War, External Aggression, or Armed Rebellion. It is not triggered simply by economic recession, a pandemic, or any state's mere request without one of these specific grounds."}, {"num": 258, "text": "Which term did the 44th Amendment (1978) replace with 'Armed Rebellion' as a ground for National Emergency under Article 352?", "options": ["'Foreign Invasion'", "'Internal Disturbance'", "'Civil Unrest'", "'Political Instability'"], "correct": 1, "explanation": "The 44th Amendment, 1978 replaced the term 'Internal Disturbance' with 'Armed Rebellion' as a ground for declaring a National Emergency under Article 352 — a change meant to prevent misuse of the emergency power for minor internal issues. 'Foreign Invasion', 'Civil Unrest', and 'Political Instability' are not the terms referenced in the notes."}, {"num": 259, "text": "Under Article 352(3), what is required before the President proclaims a National Emergency?", "options": ["No advice is needed; the President can act alone", "Written advice of the Cabinet is required", "Only a verbal request from the Prime Minister is needed", "Approval of the Chief Justice of India is required first"], "correct": 1, "explanation": "Article 352(3) requires the written advice of the Cabinet before the President proclaims a National Emergency — a safeguard added to prevent misuse based on informal or unilateral advice. The President cannot act entirely alone, mere verbal PM requests are insufficient, and CJI approval is not a precondition."}, {"num": 260, "text": "Under Article 352(4), a National Emergency Proclamation must be approved by both Houses of Parliament within what time, and by what majority?", "options": ["Within 2 months, simple majority", "Within 1 month, special majority", "Within 6 months, absolute majority", "Within 1 year, no majority requirement specified"], "correct": 1, "explanation": "Article 352(4) requires that a National Emergency Proclamation be approved by both Houses of Parliament within 1 month, by a special majority. This differs from President's Rule and Financial Emergency, which require approval within 2 months by simple majority. The other timeframes/majorities given do not match Article 352."}, {"num": 261, "text": "Once approved, how long does a National Emergency Proclamation continue before requiring renewed parliamentary approval, and can it continue indefinitely?", "options": ["Continues for 6 months at a time, and can continue indefinitely with repeated 6-month approvals", "Continues automatically forever, with no renewal needed", "Continues for exactly 1 year with no possibility of extension", "It must be renewed every week"], "correct": 0, "explanation": "Under Article 352(5)/(6), a National Emergency continues for 6 months at a time after approval, and it can be extended indefinitely through repeated 6-month renewals by Parliament. It is not automatically permanent without renewal, is not capped at a strict 1 year with no extension, and does not require weekly renewal."}, {"num": 262, "text": "Under Article 352(7), how can the Lok Sabha disapprove of a continuing National Emergency?", "options": ["By a special majority resolution only", "By a simple majority resolution", "The Lok Sabha has no power to disapprove once approved", "Only the Rajya Sabha, not the Lok Sabha, can disapprove"], "correct": 1, "explanation": "Article 352(7) allows the Lok Sabha to disapprove the continuation of a National Emergency through a resolution passed by a simple majority. This is not a special-majority requirement, the Lok Sabha does retain this disapproval power, and this power specifically belongs to the Lok Sabha, not exclusively the Rajya Sabha."}, {"num": 263, "text": "During a National Emergency, when are the freedoms under Article 19 automatically suspended, according to the notes?", "options": ["Always, regardless of the ground for the Emergency", "Only during War or External Aggression, NOT during Armed Rebellion", "Only during Armed Rebellion, never during War/External Aggression", "Article 19 freedoms are never suspended under any Emergency"], "correct": 1, "explanation": "The notes specify that Article 19 freedoms are automatically suspended only when the National Emergency is declared on the grounds of War or External Aggression — not when declared due to Armed Rebellion. This is not an automatic suspension in all cases, is not reversed to apply only during Armed Rebellion, and Article 19 can indeed be suspended in specific Emergency scenarios."}, {"num": 264, "text": "Under Article 353, what are the effects of a National Emergency on Centre-State relations?", "options": ["Union executive power extends to directing States, and Parliament may legislate on State List subjects", "States gain full independence from Union directions", "Only financial powers shift to the Centre; executive/legislative powers remain unaffected", "No change occurs in Centre-State relations during a National Emergency"], "correct": 0, "explanation": "Article 353 provides that during a National Emergency, the Union's executive power extends to directing any State on how to exercise its executive power, and Parliament gains power to legislate on State List subjects. States do not gain independence during this period, the effect isn't limited only to finances, and Centre-State relations are indeed altered during a National Emergency."}, {"num": 265, "text": "Article 355 places a duty on the Union to do what regarding the States?", "options": ["Protect States against external aggression and internal disturbance, and ensure States are governed as per the Constitution", "Take over all State governments permanently", "Provide financial grants only, with no protective duty", "Dissolve any State Legislature that disagrees with the Centre"], "correct": 0, "explanation": "Article 355 imposes a duty on the Union to protect every State against external aggression and internal disturbance, and to ensure that the government of every State is carried on in accordance with the provisions of the Constitution. It does not mandate permanent Union takeover of all states, is not limited only to financial grants, and does not authorise arbitrary dissolution of disagreeing legislatures."}, {"num": 266, "text": "Under Article 356, President's Rule (State Emergency) can be imposed under what circumstance, and via what typical (but not compulsory) trigger?", "options": ["If constitutional machinery fails in a state, usually via the Governor's report, though this report isn't compulsory", "Only if requested by the concerned State's Chief Minister", "Only during a war with a neighbouring country", "Only if the State fails to pay central taxes"], "correct": 0, "explanation": "Article 356(1) allows President's Rule to be imposed if the constitutional machinery in a State has failed, usually triggered via a report from the Governor — though the notes clarify this report is not strictly compulsory for the President to act. It does not require the CM's own request, is not tied to a war, and is not about central tax non-payment."}, {"num": 267, "text": "Once President's Rule is imposed, what actions can the President take under Article 356?", "options": ["Take over the State's executive, suspend or dissolve the Assembly, and have Parliament exercise the State's legislative powers", "Only appoint a new Chief Minister, leaving everything else unchanged", "Dissolve the Lok Sabha instead of the State Assembly", "No real powers are transferred to the Centre"], "correct": 0, "explanation": "Under Article 356, once President's Rule is imposed, the President may take over the State's executive functions, may suspend or dissolve the State Assembly, and Parliament may exercise the State's legislative powers in its place. This is more extensive than simply appointing a new CM, does not involve dissolving the Lok Sabha, and clearly does transfer significant powers to the Centre."}, {"num": 268, "text": "Under Article 356(3), President's Rule must be approved by Parliament within how many months, and what is its maximum overall duration (with conditions)?", "options": ["Approved within 1 month; maximum 6 years", "Approved within 2 months; maximum 3 years (with conditions)", "Approved within 6 months; maximum 5 years", "No approval time limit; can continue indefinitely without conditions"], "correct": 1, "explanation": "Article 356(3) requires Parliamentary approval of President's Rule within 2 months, and it continues for 6 months at a time thereafter, subject to a maximum overall period of 3 years, with certain conditions for extension beyond one year. It is not a 1-month or 6-month approval window, is not capped at 6 years, and is not indefinite without conditions."}, {"num": 269, "text": "Under Article 357, once President's Rule is imposed, what may Parliament do regarding the State's legislative powers?", "options": ["Confer the State's legislative powers on the President or another specified authority", "Permanently transfer the state's territory to another state", "Abolish the state's legislature forever", "Require the state to hold immediate elections within 7 days"], "correct": 0, "explanation": "Article 357 allows Parliament to confer the power of the State Legislature on the President, or authorise the President to delegate this power to another specified authority, during President's Rule. It does not permanently transfer territory, does not permanently abolish the legislature, and does not mandate elections within a strict 7-day window."}, {"num": 270, "text": "Under Article 358, when are Article 19 freedoms automatically suspended, and can the State make laws that would otherwise violate Article 19 during this period?", "options": ["During National Emergency declared for War/External Aggression; yes, the State can make such laws during this period, but this does NOT apply during Armed Rebellion emergencies", "During President's Rule only; States cannot make any laws violating Article 19", "During Financial Emergency only; the provision doesn't apply otherwise", "Article 358 never allows suspension of Article 19 under any ground"], "correct": 0, "explanation": "Article 358(1) auto-suspends Article 19 freedoms specifically during a National Emergency declared on the grounds of War or External Aggression, and during that period, the State can make laws that would otherwise violate Article 19 — but this suspension does NOT apply if the emergency was declared due to Armed Rebellion. This is not tied to President's Rule or Financial Emergency, and Article 358 clearly does provide for suspension under the specified grounds."}, {"num": 271, "text": "Under Article 359, when the President suspends enforcement of Fundamental Rights during an Emergency, what must the suspension order specify, and which rights are exempt?", "options": ["The order must specify which rights are suspended, and Articles 20 and 21 cannot be suspended (after the 44th Amendment)", "The order can be vague, covering 'all rights' without specification", "Every Fundamental Right, including Articles 20 and 21, can be suspended", "Only Article 32 can ever be suspended, no other right"], "correct": 0, "explanation": "Article 359(1) requires the President's order to specify exactly which Fundamental Rights are suspended, and after the 44th Amendment, Articles 20 and 21 cannot be suspended under any circumstances. The order cannot be a vague blanket suspension, Articles 20/21 are explicitly protected from suspension, and multiple rights (not just Article 32) can potentially be affected by such an order (except 20/21)."}, {"num": 272, "text": "Under Article 360, a Financial Emergency can be proclaimed if what is threatened, and has it ever actually been declared?", "options": ["If the financial stability or credit of India (or part of it) is threatened; it has NEVER been declared till now", "If a single state runs a budget deficit; it has been declared multiple times", "If the RBI's foreign reserves fall below a set threshold; declared once, in 1991", "If Parliament fails to pass the annual budget; declared during COVID-19"], "correct": 0, "explanation": "Article 360(1) allows a Financial Emergency to be proclaimed if the financial stability or credit of India, or any part of its territory, is threatened — and the notes explicitly confirm this has never been declared till now. It is not triggered merely by a single state's budget deficit, is not tied to a specific RBI reserve threshold, and was not declared during the 1991 crisis or the COVID-19 pandemic."}, {"num": 273, "text": "Under Article 360, once a Financial Emergency is approved (within 2 months), what are its potential effects?", "options": ["The Union can direct States on financial matters, salaries of government employees/judges may be reduced, and State Money Bills may be reserved for the President", "Only the Prime Minister's salary can be reduced; nothing else changes", "All State governments are automatically dissolved", "It has no real financial effects, only symbolic significance"], "correct": 0, "explanation": "During a Financial Emergency, the Union can direct States on financial matters, the salaries of government employees (including judges) may be reduced, and State Money Bills may be reserved for the President's consideration. This is broader than just affecting the PM's salary alone, does not automatically dissolve all State governments, and has substantive — not merely symbolic — financial effects."}, {"num": 274, "text": "According to the notes' pattern-based mnemonic, what numerical relationship links Articles 352, 356, and 360?", "options": ["They increase by a gap of 2 each time: 352 → 354 → 356", "They increase by a gap of 4 each time: 352 (National) → 356 (State/President's Rule) → 360 (Financial)", "They are consecutive numbers: 352, 353, 354", "There is no numerical pattern among these Emergency articles"], "correct": 1, "explanation": "The notes highlight that these Emergency-related articles run in a pattern with a gap of 4 each time: 352 (National Emergency) → 356 (President's Rule/State Emergency) → 360 (Financial Emergency). They are not spaced by 2, are not consecutive numbers, and there is indeed a deliberate numerical pattern noted."}, {"num": 275, "text": "Comparing approval timeframes and required majorities across the three types of Emergency, which is correctly matched?", "options": ["National Emergency (352): 1 month, Special majority; President's Rule (356): 2 months, Simple majority; Financial Emergency (360): 2 months, Simple majority", "All three types require the same 1-month approval window and special majority", "National Emergency requires 2 months; President's Rule and Financial Emergency both require 1 month", "None of the three Emergency types have any defined approval timeframe"], "correct": 0, "explanation": "Per the notes' comparison table: National Emergency (Art. 352) needs approval within 1 month by special majority; President's Rule (Art. 356) needs approval within 2 months by simple majority; and Financial Emergency (Art. 360) also needs approval within 2 months by simple majority. The other combinations misstate these timeframes and majorities, and clear timeframes are indeed defined for all three."}]}, {"id": "summary", "label": "Quick Revision & Cheat-Sheet", "icon": "⚡", "questi <script>
(function() {
  const DATA = JSON.parse(document.getElementById('quizDataScript').textContent);
  const STORAGE_KEY = 'polity_quiz_answers_v1';
  let answers = {}; // qnum -> selectedIndex

  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) answers = JSON.parse(saved);
  } catch(e) {}

  function saveAnswers() {
    try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch(e) {}
  }

  const totalQuestions = DATA.reduce((sum, t) => sum + t.questions.length, 0);

  // Header stats
  const headerStats = document.getElementById('headerStats');
  headerStats.innerHTML = `
    <span class="badge">${DATA.length} Topics</span>
    <span class="badge">${totalQuestions} Questions</span>
  `;

  // Build tab nav
  const tabNav = document.getElementById('tabNav');
  DATA.forEach((topic, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.dataset.topicId = topic.id;
    btn.innerHTML = `${topic.icon} ${topic.label}<span class="tab-progress" id="progress-${topic.id}"></span>`;
    btn.addEventListener('click', () => showTopic(topic.id));
    tabNav.appendChild(btn);
  });

  // Build content sections
  const quizMain = document.getElementById('quizMain');
  DATA.forEach((topic, idx) => {
    const section = document.createElement('div');
    section.className = 'tab-content' + (idx === 0 ? ' active' : '');
    section.id = 'tab-' + topic.id;

    const scorePanel = document.createElement('div');
    scorePanel.className = 'score-panel';
    scorePanel.innerHTML = `
      <div>
        <div class="score-label">Topic Score</div>
        <div class="score-value" id="score-${topic.id}">0 / ${topic.questions.length}</div>
      </div>
      <button class="reset-btn" data-reset="${topic.id}">Reset Topic</button>
    `;
    section.appendChild(scorePanel);

    topic.questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'qcard';
      card.id = 'q-' + q.num;

      const letters = ['A', 'B', 'C', 'D'];
      let optsHtml = '';
      q.options.forEach((opt, i) => {
        optsHtml += `
          <button class="opt-btn" data-qnum="${q.num}" data-idx="${i}">
            <span class="opt-letter">${letters[i]}</span>
            <span class="opt-text">${opt}</span>
          </button>`;
      });

      card.innerHTML = `
        <span class="qnum">Question ${q.num}</span>
        <div class="qtext">${q.text}</div>
        <div class="options">${optsHtml}</div>
        <div class="result-tag" id="result-${q.num}"></div>
        <div class="explanation" id="exp-${q.num}">
          <span class="exp-label">Explanation</span>
          <span id="exp-text-${q.num}"></span>
        </div>
      `;
      section.appendChild(card);
    });

    quizMain.appendChild(section);
  });

  function showTopic(topicId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + topicId).classList.add('active');
    document.querySelector(`.tab-btn[data-topic-id="${topicId}"]`).classList.add('active');
    window.scrollTo({top: 0, behavior: 'auto'});
  }

  function letterFor(i) { return ['A','B','C','D'][i]; }

  function renderAnswered(q, topicId) {
    const card = document.getElementById('q-' + q.num);
    const buttons = card.querySelectorAll('.opt-btn');
    const selectedIdx = answers[q.num];
    buttons.forEach((btn, i) => {
      btn.classList.add('disabled');
      if (i === q.correct) {
        btn.classList.add('correct');
      } else if (i === selectedIdx) {
        btn.classList.add('incorrect');
      } else {
        btn.classList.add('dimmed');
      }
    });
    const resultTag = document.getElementById('result-' + q.num);
    if (selectedIdx === q.correct) {
      resultTag.textContent = '✓ Correct!';
      resultTag.className = 'result-tag show correct-tag';
    } else {
      resultTag.textContent = `✗ Incorrect — correct answer is ${letterFor(q.correct)}`;
      resultTag.className = 'result-tag show incorrect-tag';
    }
    document.getElementById('exp-text-' + q.num).textContent = q.explanation;
    document.getElementById('exp-' + q.num).classList.add('show');
  }

  function updateScore(topicId) {
    const topic = DATA.find(t => t.id === topicId);
    let correctCount = 0;
    let answeredCount = 0;
    topic.questions.forEach(q => {
      if (answers.hasOwnProperty(q.num)) {
        answeredCount++;
        if (answers[q.num] === q.correct) correctCount++;
      }
    });
    document.getElementById('score-' + topicId).textContent = `${correctCount} / ${topic.questions.length}`;
    const progressEl = document.getElementById('progress-' + topicId);
    if (progressEl) {
      progressEl.textContent = answeredCount > 0 ? `${answeredCount}/${topic.questions.length}` : '';
    }
  }

  // Click handling via event delegation
  quizMain.addEventListener('click', function(e) {
    const optBtn = e.target.closest('.opt-btn');
    if (optBtn && !optBtn.classList.contains('disabled')) {
      const qnum = parseInt(optBtn.dataset.qnum, 10);
      const idx = parseInt(optBtn.dataset.idx, 10);
      answers[qnum] = idx;
      saveAnswers();
      // find topic containing this question
      const topic = DATA.find(t => t.questions.some(q => q.num === qnum));
      const q = topic.questions.find(q => q.num === qnum);
      renderAnswered(q, topic.id);
      updateScore(topic.id);
      return;
    }
    const resetBtn = e.target.closest('[data-reset]');
    if (resetBtn) {
      const topicId = resetBtn.dataset.reset;
      const topic = DATA.find(t => t.id === topicId);
      topic.questions.forEach(q => { delete answers[q.num]; });
      saveAnswers();
      rebuildTopic(topicId);
      updateScore(topicId);
    }
  });

  function rebuildTopic(topicId) {
    const topic = DATA.find(t => t.id === topicId);
    topic.questions.forEach(q => {
      const card = document.getElementById('q-' + q.num);
      const buttons = card.querySelectorAll('.opt-btn');
      buttons.forEach(btn => {
        btn.classList.remove('disabled', 'correct', 'incorrect', 'dimmed');
      });
      document.getElementById('result-' + q.num).classList.remove('show');
      document.getElementById('exp-' + q.num).classList.remove('show');
    });
  }

  // Restore previously answered questions on load
  DATA.forEach(topic => {
    topic.questions.forEach(q => {
      if (answers.hasOwnProperty(q.num)) {
        renderAnswered(q, topic.id);
      }
    });
    updateScore(topic.id);
  });

  // Scroll to top button
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) {
      scrollBtn.classList.add('show');
    } else {
      scrollBtn.classList.remove('show');
    }
  });
  scrollBtn.addEventListener('click', function() {
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

})();
</script>
