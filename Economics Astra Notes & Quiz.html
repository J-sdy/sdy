function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

const notesHtml = b64ToUtf8(NOTES_B64);
const quizHtml = b64ToUtf8(QUIZ_B64);

document.getElementById('frame-notes').srcdoc = notesHtml;
document.getElementById('frame-quiz').srcdoc = quizHtml;
document.getElementById('loadingMsg').remove();

function showView(view){
  document.getElementById('frame-notes').classList.toggle('on', view==='notes');
  document.getElementById('frame-quiz').classList.toggle('on', view==='quiz');
  document.getElementById('btn-notes').classList.toggle('on', view==='notes');
  document.getElementById('btn-quiz').classList.toggle('on', view==='quiz');
}
