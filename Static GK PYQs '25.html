t played by either two opposing players (singles) or two opposing pairs (doubles). Badminton court’s dimensions: In singles, a badminton court is 13.41m (44ft) long and 5.18m (17ft) wide. The width extends to 6.1m (20ft) in doubles. The net is 1.55m (5ft 1in) high at the ends and 1.52m high (5ft) where it dips in the middle. The birdie, also referred to as the shuttlecock, is made up of 16 feathers, the birdie is between 62 - 70mm long and weighs between 4.74 and 5.5 g.","s":""},{"n":773,"t":"Sports","q":"A three-time Olympian, PT Usha broke the Asian Games record in four events (200 m, 400 m, 400 m hurdles and 4 × 400 m relay) in ____________.","o":["New Delhi, 1982","Beijing, 1990","Seoul, 1986","Hiroshima, 1994"],"a":2,"e":"Seoul, 1986. Pilavullakandi Thekkeraparambil Usha is a bonafide Indian track and field legend.","s":""},{"n":774,"t":"Sports","q":"Consider the following statements regarding sports terminology:\nStatement 1: Terms like Chip, Condor, Duff, and Driver are commonly used in the game of Horse Polo.\nStatement 2: A Condor in Golf refers to a score that is 4 shots under par on a single hole, which is extremely rare.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. Chip, Condor, Duff and Driver are some of the terms used in Golf. A chip is a short golf shot usually made by a player who is near, but not on, the putting surface. A condor is perhaps the rarest shot in all of golf. It refers to a golf score that is 4 shots under par on any individual hole. Duff is used to describe any very poorly struck shot. The driver is the longest of all the woods, incorporates the largest club head, and is used almost exclusively to “drive” the ball from the tee box.","s":""},{"n":775,"t":"Sports","q":"In basketball, how many points are awarded when a basket is scored from outside the 6.25-metre line ?","o":["Five points","Six points","Three points","Two points"],"a":2,"e":"Three points: Field goals - A field goal is a basket made during regular play from anywhere on the court. A field goal made within the three-point line is worth two points.","s":""},{"n":776,"t":"Sports","q":"The rifle (in the shooting sport) is single - loaded in _________-millimetre calibre (the inner diameter of a gun barrel), which is used across all events.","o":["5.6","4.8","4.5","5.1"],"a":0,"e":"5.6. Olympic shooting features three types of guns: Rifle, Pistol, and Shotgun, used at distances of 10m, 25m, or 50m. Rifles and pistols are single-loaded, with rifles using a 5.6mm calibre and pistols using 4.5mm (10m Air Pistol) or 5.6mm (25m Rapid Fire Pistol with a five-shot magazine). Shotguns are 12-gauge with an 18.5mm calibre, where gauge refers to the number of lead balls from a pound that fit the barrel.","s":""},{"n":777,"t":"Sports","q":"Consider the following statements regarding Polo in India:\nStatement 1: The Calcutta Polo Club is the home of the Ezra Cup, the world’s oldest polo tournament.\nStatement 2: The Ezra Cup was introduced in 1900 by Sir David Ezra.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. The Calcutta Polo Club, established in 1862, is the oldest polo club in the world still in existence. The Ezra Cup, introduced in 1880 by Sir David Ezra, is recognized as the world’s oldest polo trophy still contested. Hence, while Statement 1 is correct, Statement 2 is incorrect due to the wrong year.","s":""},{"n":778,"t":"Sports","q":"At which Olympics did Gagan Narang win a bronze medal?","o":["London 2012","Rio 2016","Athens 2004","Beijing 2008"],"a":0,"e":"London 2012. Gagan Narang is an Indian sports shooter and is associated with air rifle shooting. He won the bronze medal in the Men’s 10 meter air rifle event. He received the Arjuna award in 2005. Indian Shooters : Abhinav Bindra, Rajyavardhan Singh Rathore, Vijay Kumar, Manu Bhaker, Swapnil Kusale.","s":""},{"n":779,"t":"Sports","q":"At which Olympics was Kho-Kho featured in an exhibition in the main stadium?","o":["1936","1932","2008","2016"],"a":0,"e":"1936. The Olympics were held in Berlin. The Kho-Kho team consists of 12 players, but only 9 players take the field for a contest. The first-ever Asian Kho-Kho Championship was organized in Kolkata in 1996.","s":""},{"n":780,"t":"Sports","q":"Consider the following statements regarding the Men’s Asian Champions Trophy in Hockey:\nStatement 1: Pakistan won the first Men’s Asian Champions Trophy.\nStatement 2: India is the most successful team in the tournament with five titles.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. The first Men’s Asian Champions Trophy was held in 2011 at Ordos, China, and was won by India, not Pakistan. Since then, India has emerged as the most successful team, with a record five titles to its name. The tournament was held annually from 2011 to 2013, and from 2016 onwards, it has been played biennially.","s":""},{"n":781,"t":"Sports","q":"When was the 1st Asian Kabaddi Championship held?","o":["1970","1985","1980","1975"],"a":2,"e":"1980. The 1st Asian Kabaddi Championship was held in 1980 and included as a demonstration game in the 9th Asian Games in New Delhi in 1982. The 9th Championship took place in the Republic of Korea, where India secured its 8th title. Kabaddi was also included in the South Asian Federation (SAF) Games started in 1984 in Dhaka, Bangladesh.","s":""},{"n":782,"t":"Sports","q":"In which year was the International Olympic Committee formed?","o":["1896","1892","1898","1894"],"a":3,"e":"1894. International Olympic Committee (IOC) : Established - June 23,\n1894. Founders - Pierre de Coubertin and Demetrios Vikelas. Function - Organizes the Winter and Summer Olympics. Headquarters : Lausanne, Switzerland. Status : Granted 'Permanent Observer' status at the United Nations in 2009.","s":""},{"n":783,"t":"Sports","q":"Consider the following statements regarding the history of Hockey administration:\nStatement 1: The Indian Hockey Federation was established in 1925 as the governing body of field hockey in India.\nStatement 2: The International Hockey Federation was founded in London in 1928.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. The Indian Hockey Federation (IHF) was set up in 1925 with its headquarters in New Delhi to regulate and promote field hockey in India. In contrast, the International Hockey Federation (FIH) was founded earlier, in 1924 at Paris, on the initiative of Paul Léautey, not in London in 1928 as mentioned in Statement 2.","s":""},{"n":784,"t":"Sports","q":"Which Indian marathon event is considered the largest marathon in Asia?","o":["Kaveri Trail Marathon","Pinkathon","Delhi Half Marathon","Mumbai Marathon"],"a":3,"e":"Mumbai Marathon. The TATA Mumbai Marathon (TMM) is recognized as the largest marathon in Asia and the continent's biggest mass participation sporting event.","s":""},{"n":785,"t":"Sports","q":"Which of the following Table Tennis World Championship events was held in India?","o":["19 th World Championships, 1952","17 th World Championships, 1950","20 th World Championships, 1953","18 th World Championships, 1951"],"a":0,"e":"The 19th World Table Tennis Championships were held in Mumbai in 1952, and India also hosted the 1987 edition in New Delhi. The first championship took place in 1926 in London, England, while the 56th edition was held in 2024 in Busan, South Korea, and the 58th is scheduled for 2025 in Doha, Qatar.","s":""},{"n":786,"t":"Sports","q":"Match the following Sports with the Number of Players in each Team (on field):\nA. Kabaddi i. 11\nB. Cricket ii. 7\nC. Basketball iii. 9\nD. Volleyball iv. 5\nE. Kho-Kho v. 6","o":["A–ii, B–i, C–iv, D–v, E–iii","A–iii, B–ii, C–v, D–iv, E–i","A–i, B–iv, C–ii, D–iii, E–v","A–v, B–iii, C–i, D–ii, E–iv"],"a":0,"e":"A–ii, B–i, C–iv, D–v, E–iii.","s":""},{"n":787,"t":"Sports","q":"In which year did India make its Olympic debut in hockey?","o":["1936","1932","1924","1928"],"a":3,"e":"1928. India made its Olympic debut in hockey in 1928 at the Amsterdam Olympics. The Indian men's hockey team won their first Olympic gold medal in this tournament, beating the Netherlands. The team was led by captain Jaipal Singh and Dhyan Chand, who scored the most goals with 14. India's hockey team is the most successful in Olympic history, winning eight gold medals in 1928, 1932, 1936, 1948, 1952, 1956, 1964, and 1980.","s":""},{"n":788,"t":"Sports","q":"In which of the following years was the Pro Kabaddi League established in India?","o":["2015","2016","2013","2014"],"a":3,"e":"2014. The inaugural Pro Kabaddi season in 2014 saw eight teams participating in the league. By Season 5, the number of teams competing grew to 12.","s":""},{"n":789,"t":"Sports","q":"Consider the following statements regarding India’s achievements in Athletics:\nStatement 1: India’s first World Championships medal in Athletics was won by Anju Bobby George in 2003 at Paris.\nStatement 2: She secured a silver medal in Women’s Long Jump, becoming the first Indian athlete to win a global athletics medal.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. At the 2003 World Athletics Championships held in Paris, Anju Bobby George created history by winning a bronze medal in Women’s Long Jump, marking India’s first-ever medal at the event. Statement 2 is incorrect because the medal was bronze, not silver. This achievement placed Indian athletics on the global stage for the first time.","s":""},{"n":790,"t":"Sports","q":"Indian Olympic Association was established in which of the following years ?","o":["1927","1931","1933","1929"],"a":0,"e":"1927. The Indian Olympic Association is headquartered in New Delhi. The first president of the association was Sir Dorabji Tata, and the current president (as of September 2024) is PT Usha.","s":""},{"n":791,"t":"Sports","q":"Which of the following numbers best describes the number of white pieces used in chess?","o":["18","16","19","17"],"a":1,"e":"16 . There are six different types of chess pieces. Each side starts with 16 pieces : eight pawns, two bishops, two knights, two rooks, one queen, and one king. King : Moves one square in any direction. Queen : Moves any number of squares diagonally, horizontally, or vertically. Rook : Moves any number of squares horizontally or vertically. Bishop : Moves any number of squares diagonally. Knight : Moves in an 'L-shape' (two squares in one direction and then one square perpendicular). Pawn : Moves one square forward (two squares on its first move) and captures diagonally one square forward.","s":""},{"n":792,"t":"Sports","q":"Consider the following statements regarding the “Follow-On” rule in cricket:\nStatement 1: The Follow-On rule is applied in T20 and One-Day International matches.\nStatement 2: In a Test match of five days or more, if the team batting first leads by at least 200 runs, it can enforce a Follow-On.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. The Follow-On rule exists only in Test cricket, not in limited-over formats like T20 or ODIs. It allows the team batting first, if it gains a lead of 200 or more runs in a 5-day Test, to ask the opposition to bat again immediately. This strategy is usually employed to save time and push for a result rather than a draw.","s":""},{"n":793,"t":"Sports","q":"Where was the first women’s international test cricket match hosted in India in 1976?","o":["New Delhi","Bangalore","Mumbai","Kolkata"],"a":1,"e":"Bangalore. India hosted its first women's international Test cricket match against the West Indies on October 31, 1976, at M. Chinnaswamy Stadium in Bangalore. The inaugural Women's Cricket World Cup was held in England in 1973.","s":""},{"n":794,"t":"Sports","q":"Which of the following states was the overall champion in both men and women categories in the first Janjatiya Khel Mahotsav?","o":["Maharashtra","Chhattisgarh","Jharkhand","Odisha"],"a":3,"e":"Odisha. The first Janjatiya Khel Mahotsav, a grand sporting event jointly hosted by the Ministry of Culture, the Odisha Government, and KIIT University, concluded in Bhubaneswar.","s":""},{"n":795,"t":"Sports","q":"Raja Bhalindra Singh trophy is associated with which of the following national sports events?","o":["Khelo India Youth Games","Khelo India Winter Games","Khelo India University Games","National Games"],"a":3,"e":"National Games. The National Games are organized by the Indian Olympic Association (IOA). The IOA is responsible for the regulations of the games. IOA: Founded - 1927, Headquarter - New Delhi. First National Games organised in Lahore (1924). First Modern National Games - New Delhi (1985).","s":""},{"n":796,"t":"Sports","q":"Vijender Singh has represented India in Olympics for how many times?","o":["4","5","3","2"],"a":2,"e":"3. Vijender Singh, an Indian professional boxer, made history as the first Indian boxer to win an Olympic medal, earning bronze at the 2008 Beijing Olympics.","s":""},{"n":797,"t":"Sports","q":"Consider the following statements regarding India’s Olympic history:\nStatement 1: India’s first individual Olympic medal came in Wrestling, won by K.D. Jadhav at the 1952 Helsinki Olympics.\nStatement 2: Abhinav Bindra was the first Indian athlete to win an individual Olympic medal, when he won gold in Shooting at the 2008 Beijing Olympics.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. K.D. Jadhav created history by winning bronze in Wrestling at the 1952 Helsinki Olympics, becoming the first individual Olympic medalist from independent India. Abhinav Bindra’s achievement in 2008 was historic too, but it was India’s first individual Olympic gold medal, not the first overall individual medal.","s":""},{"n":798,"t":"Sports","q":"In chess, which of the following may only move forward to the unoccupied square immediately in front of it?","o":["The Bishop","The Queen","The Pawn","The Rook"],"a":2,"e":"The Pawn. Chess is a board game for two players. It is played on a square board, made up of 64 smaller squares, with eight squares in each row and column.","s":""},{"n":799,"t":"Sports","q":"Agricultural shot is a term used in which of the following sports?","o":["Lawn Tennis","Cricket","Football","Table Tennis"],"a":1,"e":"Cricket. An \"agricultural shot\" in cricket refers to a poorly played shot by a batsman. It is usually a risky shot that doesn't make the most of the chance to score runs.","s":""},{"n":800,"t":"Sports","q":"Consider the following statements regarding the Asian Games:\nStatement 1: India hosted the Asian Games in 1954 and 1986.\nStatement 2: India hosted the Asian Games in 1951 and 1982. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. India first hosted the Asian Games in 1951 at New Delhi, which were also the inaugural edition of the event. It again hosted the games in 1982, also in New Delhi, marking the second time the country was the venue. The Asian Games are conducted by the Olympic Council of Asia (OCA) every four years, and India remains one of the few countries to have hosted it twice.","s":""},{"n":801,"t":"Sports","q":"Where was the 1 st World Cup of Kabaddi organised in 2004?","o":["Mumbai","Hyderabad","Punjab","Kolkata"],"a":0,"e":"Mumbai. India won the inaugural Kabaddi World Cup by defeating Iran with a score of 55-27. India has consistently clinched the Kabaddi World Cup title, including victories in 2007 and 2016.","s":""},{"n":802,"t":"Sports","q":"Which of the following team events is included in the Target Olympic Podium Scheme?","o":["Tennis","Football","Cricket","Hockey"],"a":3,"e":"Hockey. Target Olympic Podium Scheme (TOPS): To improve India’s performance at Olympics and Paralympics, the Ministry of Youth Affairs and Sports (MYAS) started the Target Olympic Podium Scheme (TOPS) in September 2014.","s":""},{"n":803,"t":"Sports","q":"Consider the following statements regarding India’s performance in ODI Cricket World Cups:\nStatement 1: India has won the ICC Cricket World Cup twice, in 1983 and 2011.\nStatement 2: India’s first ICC Cricket World Cup victory came in 1987 under the captaincy of Kapil Dev. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. India’s first Cricket World Cup triumph came in 1983 under Kapil Dev, defeating the mighty West Indies at Lord’s. The second title came in 2011 under M.S. Dhoni, when India defeated Sri Lanka at Wankhede Stadium, Mumbai. The mention of 1987 in Statement 2 is incorrect, as that tournament was jointly hosted by India and Pakistan, but the winner was Australia.","s":""},{"n":804,"t":"Sports","q":"Who among the following is known as ‘Captain Cool’ in Indian Cricket?","o":["Virat Kohli","Mahendra Singh Dhoni","Kapil Dev","Sachin Tendulkar"],"a":1,"e":"Mahendra Singh Dhoni. He is also known as \"Thala,\" and \"MSD,\". Virat Kohli, nicknamed \"Cheeku,\" \"King Kohli,\" and \"The Run Machine,\" is renowned for his batting. Kapil Dev, known as the \"Haryana Hurricane,\" was famous for his aggressive play, while Sachin Tendulkar is affectionately called the \"God of Cricket” and \"Master Blaster”.","s":""},{"n":806,"t":"Sports","q":"The first Indian woman to hold the Under - 20 World Wrestling Championship is _________.","o":["Antim Panghal","Pranati Nayak","Swati Sanjay","Hina Khalifa"],"a":0,"e":"Antim Panghal. She is an Indian wrestler from Haryana.","s":""},{"n":807,"t":"Sports","q":"In chess which of the following may move only diagonally?","o":["The Bishop","The Knight","The Queen","The Rook"],"a":0,"e":"The Bishop moves only diagonally and stays on the same color square.","s":""},{"n":808,"t":"Sports","q":"Where was the Durand Cup Tournament started in India in 1888?","o":["Mumbai","Calcutta","Shimla","Delhi"],"a":2,"e":"Shimla. Durand Cup is named after Sir Mortimer Durand who was then, the Foreign Secretary to Govt of India. It is the oldest football tournament in India as well as in Asia. The winning team receives three trophies: the Durand Cup, the Shimla Trophy (first awarded in 1904), and the President's Cup (first presented by Dr. Rajendra Prasad in 1956).","s":""},{"n":809,"t":"Sports","q":"Jaipal Singh Munda is associated with which of the following sports?","o":["Badminton","Cricket","Kabaddi","Hockey"],"a":3,"e":"Hockey. Jaipal Singh Munda was the first captain of the Indian field hockey team to clinch gold in the 1928 Summer Olympics in Amsterdam. Other Hockey Players: Major Dhyan Chand, Rani Rampal, PR Sreejesh, Dhanraj Pillay, Gurjit Kaur, Navjot Kaur, Manpreet Singh, Krishan Bahadur Pathak, Prithipal Singh.","s":""},{"n":810,"t":"Sports","q":"Mirabai Chanu secured a silver medal at which Commonwealth Games?","o":["2010","2014","2022","2018"],"a":1,"e":"2014. Saikhom Mirabai Chanu: She is an Indian weightlifter from Imphal city, Manipur. She won the silver medal at the 2020 Tokyo Olympics in the Women's 49 kg category. She also became only the second Indian woman after PV Sindhu to win an Olympic silver medal. Awards: Major Dhyan Chand Khel Ratna (2018), Padma Shri (2018). Other weightlifters - Karnam Malleswari, Jeremy Lalrinnunga, Deepak Lather, Vikas Thakur.","s":""},{"n":811,"t":"Sports","q":"How many athletes were selected to represent India at the 1924 Paris Summer Olympics ?","o":["12","10","11","8"],"a":3,"e":"8. India's Olympic Journey: India's first participation in the Olympics was in 1900 in Paris, France, with Norman Pritchard representing the country.","s":""},{"n":812,"t":"Sports","q":"The term Blue Line is associated with which of the following games ?","o":["Football","Cricket","Table Tennis","Ice Hockey"],"a":3,"e":"Ice Hockey. It has three main lines: two blue lines, a red center line, and two goal lines. The blue lines divide the rink into three zones: (i) attacking zone\n(ii) Neutral zone, and (iii) Offending zone.","s":""},{"n":814,"t":"Sports","q":"Consider the following statements regarding the first Indian Olympic Games:\nStatement 1: The first Indian Olympic Games were held in 1924 at Lahore.\nStatement 2: The first Indian Olympic Games were organized in 1924 at Bombay under the initiative of Dadabhai Naoroji. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. The first Indian Olympic Games were organized in Lahore in 1924 by Dr. A. G. Noehren and Harry Crowe Buck with the aim of involving Indian youth in competitive sports. These games laid the foundation for India’s participation in the 1924 Paris Olympics. Statement 2 is incorrect because the event was not held in Bombay, nor was Dadabhai Naoroji associated with it.","s":""},{"n":815,"t":"Sports","q":"How many squares are there on a chessboard ?","o":["67","68","64","69"],"a":2,"e":"64. A standard chessboard consists of 8 rows and 8 columns, resulting in a total of 64 squares. This is calculated by multiplying the number of rows by the number of columns (8×8=64)","s":""},{"n":816,"t":"Sports","q":"In field hockey, ________ occurs when a player pushes the ball and raises it off the ground.","o":["bully","slap","flick","centre pass"],"a":2,"e":"flick. During a penalty corner, the attacker must use a push, scoop, or flick shot to avoid fouls. Internationally, the \"drag flick\" is the most popular lifted shot in penalty corners.","s":""},{"n":817,"t":"Sports","q":"In which year did Indian archers participate in the Olympics for the first time?","o":["1980","1973","1988","1975"],"a":2,"e":"1988. India competed in 7 events at the 1988 Summer Olympic Games held in Seoul, South Korea with a contingent of about 20 athletes participating in sports disciplines including Archery for the first time, Athletics, Boxing, Hockey, Swimming, Table Tennis and Tennis.","s":""},{"n":818,"t":"Sports","q":"What is the circumference of the International Football Association Board (IFAB) approved football ?","o":["68 - 70 cms","80 - 82 cms","78 - 80 cms","70 - 72 cms"],"a":0,"e":"68 - 70 cms. The football must meet the following criteria as per the FIFA laws : The ball shall be spherical in shape. It should be made of leather or any other suitable material approved by the governing body. Ball circumference shall be 68 to 70 cm which is equal to 27 to 28 inches. The weight of the ball shall be between 410 to 450g which is equal to 14 to 16 oz at the start of the match. Air pressure should be equal to 0.6–1.1 atmosphere (600–1,100 g/cm 2 ) at sea level.","s":""},{"n":819,"t":"Sports","q":"Consider the following statements about Indian football history:\nStatement 1: Calcutta FC, established in 1872, is regarded as the oldest football club in India.\nStatement 2: FC Kochin, founded in the early 20th century, holds the title of India’s oldest football club. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Calcutta FC, established in 1872, is the oldest football club in India. Among currently active clubs, Mohun Bagan AC (1889) holds the distinction of being the oldest still functioning. The Indian Football Association (IFA) was formed in Calcutta in 1893, while the All India Football Federation (AIFF) came into existence in 1937.","s":""},{"n":820,"t":"Sports","q":"As per Olympic rules, in the third game, badminton players change ends when a side scores _____ points.","o":["15","11","12","13"],"a":1,"e":"11. The International Olympic Committee is the guardian of the Olympic Games and the leader of the Olympic Movement. A truly global organisation. Badminton had its debut as an official event at the 1992 Summer Olympics and has been contested in eight Olympiads. Saina Nehwal became India's first female world no. 1 in April 2015 and the first Indian to win an Olympic badminton medal.","s":""},{"n":821,"t":"Sports","q":"In which year was tennis included in the Olympic games?","o":["1927","1896","1935","1948"],"a":1,"e":"1896. The first Olympic Games of the modern era took place in Athens, in the country where the original Games took place in Antiquity, in April\n1896. Leander Paes is still the only Indian to win an Olympics tennis medal, bagging a men's singles bronze at Atlanta 1996.","s":""},{"n":822,"t":"Sports","q":"Where is Birsa Munda International Hockey Stadium located ?","o":["Ranchi","Rourkela","Bhubaneswar","Jamshedpur"],"a":1,"e":"Rourkela (India’s largest hockey stadium). Birsa Munda was a tribal leader who led the Munda Rebellion against British rule and the exploitation of his people in Jharkhand. Stadiums in India named after famous Personalities: Indira Gandhi Stadium (New Delhi), Rajiv Gandhi International Cricket Stadium (Hyderabad), Narendra Modi Stadium (Ahmedabad), Lal Bahadur Shastri Stadium (Hyderabad), Arun Jaitley Stadium (New Delhi), Major Dhyan Chand Hockey Stadium (Lucknow).","s":""},{"n":823,"t":"Sports","q":"What is the colour of the sending off card in football?","o":["Yellow","Black","Red","Blue"],"a":2,"e":"Red. Yellow colour Card - A card used to warn a player in Football. In football, there are 11 players on each side. A standard football match is 90 minutes made up of two 45-minute halves. FIFA recommendations for field dimensions in professional football are 105 metres in length and 68 metres in width.","s":""},{"n":824,"t":"Sports","q":"Consider the following statements about Judo terminology:\nStatement 1: In Judo, fighting in the upright position is known as tachi-waza.\nStatement 2: In Judo, the term ne-waza refers to upright standing techniques. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. In Judo, tachi-waza means fighting in the upright/standing position, while ne-waza refers to ground techniques. Judo was developed by Kano Jigoro in 1882, evolving from the traditional Japanese martial art Ju-jitsu.","s":""},{"n":825,"t":"Sports","q":"How many countries participated in the first Asian Games held in 1951?","o":["16","11","20","24"],"a":1,"e":"11. The 1951 Asian Games, officially known as the First Asian Games, was a multi-sport event celebrated in New Delhi, India from 4 to 11 March 1951. Motto - Play the game in the spirit of the game. Opened by -Rajendra Prasad (President of India). Main venue - National Stadium (Major Dhyan Chand National Stadium). 1st Rank - Japan (Gold - 24, Silver - 21, Bronze - 15). 2nd Rank - India (Gold - 15, Silver - 16, Bronze - 20).","s":""},{"n":826,"t":"Sports","q":"In Kabaddi, a super tackle is when a raider is caught/self out/declared out with or less than how many defenders defending ?","o":["Six","Five","Three","Four"],"a":2,"e":"Three. Kabaddi is a contact team sport that originated in India and is popular in many South Asian countries. The game is played with two teams of seven players each. Other terminologies in Kabaddi : Chain Tackle - A defensive tactic where the opponents form chains by holding hands in twos or threes. Dubki - An escape technique used by raiders who face a chain tackle. Golden Raid - It happens when there is a tie between two teams at the end of extra time.","s":""},{"n":827,"t":"Sports","q":"Which of the following statements is correct with respect to the Badminton game and match length?","o":["A match consists of the best of two games of 21 points","A match consists of the best of five games of 21 points","A match consists of the best of three games of 21 points.","A match consists of the best of four games of 21 points."],"a":2,"e":"In badminton, a standard match is played as the best of three games. Each game is played to 21 points, and a player must win by at least a 2-point margin. If the score reaches 20-20, the game continues until one player or team leads by 2 points up to a maximum of 30 points. The player or team that wins two out of three games wins the match.","s":""},{"n":828,"t":"Sports","q":"In field hockey, in a penalty stroke, an attacker shoots at goal from ___ yards away in a one - on - one confrontation with the goalkeeper.","o":["10","8","7","9"],"a":2,"e":"7. Field hockey is an eleven -a - side game played on a pitch measuring 91.4 meters long by 55 meters wide (approximately 100 yards by 60 yards). Each team consists of 10 field players and one goalkeeper.","s":""},{"n":829,"t":"Sports","q":"Consider the following statements regarding the Ultimate Kho -Kho League:\n1. The first season of the league was held in 2022 in Pune, Maharashtra.\n2. The field size was reduced to 22 × 16 meters, and the attacking team was limited to seven players. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Ultimate Kho-Kho League was launched in August 2022, modernizing traditional Kho Kho with a smaller playing field, reduced attacking team, and new scoring rules such as 2 points per tag and a 30-second batch system.","s":""},{"n":830,"t":"Sports","q":"Where did the indigenous sport ‘Kalaripayattu’ originate from?","o":["Kerala","Tamil Nadu","Goa","Karnataka"],"a":0,"e":"Kerala. Kalaripayattu is a martial art based on the ancient knowledge of the human body. The Various Martial Art Forms in India: Thang Ta - Manipur, Lathi Khela - West Bengal, Gatka - Punjab, Mallakhamb - Madhya Pradesh, Silambam - Tamil Nadu, Kathi Samu - Andhra Pradesh, Sqay - Kashmir, Paikha Akhadha - Odisha, Musti Yuddha -Uttar Pradesh (Varanasi).","s":""},{"n":831,"t":"Sports","q":"Where was India’s first hockey club founded?","o":["Madras","Delhi","Calcutta","Shimla"],"a":2,"e":"Calcutta. The first hockey club formed in the then Calcutta (now Kolkata) in 1855. The Hockey Association was founded in 1886. The Indian Hockey Federation was the administrative body of field hockey in India, incorporated in 1925. The International Hockey Federation is the global governing body of field hockey founded on 7th January.","s":""},{"n":832,"t":"Sports","q":"Consider the following statements regarding the term “Banana Kick”:\n1. The term is associated with the sport of Football.\n2. It refers to a kick in which the ball curves in the air, often used during free kicks. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Banana Kick is a famous football technique where the ball bends or curves mid-air, making it difficult for the goalkeeper to predict its trajectory. The game of football lasts 90 minutes (two halves of 45 minutes with a 10–15 minute interval).","s":""},{"n":833,"t":"Sports","q":"Which country hosted the first FIFA World Cup?","o":["Brazil","France","Uruguay","Italy"],"a":2,"e":"Uruguay. The FIFA World Cup was first organized in 1930 under FIFA President Jules Rimet, with 13 invited teams. Uruguay became the first champion. The 22nd FIFA World Cup was held in 2022 in Qatar, where Argentina defeated France after a 3-3 draw and a 4-2 penalty shootout. Lionel Messi, the Argentine captain, won the Golden Ball award as the best player of the tournament.","s":""},{"n":834,"t":"Sports","q":"According to the International Football Association Board (IFAB), which colour must the football goal post be?","o":["Blue","White","Red","Black"],"a":1,"e":"White. Goal-posts and cross-bars must be made of wood, metal or other approved materials. They may be square, rectangular, round, half-round or elliptical in shape. The International Football Association Board (IFAB) is an international self-regulatory body of association football that is known for determining the Laws of the Game, the regulations for the gameplay of football.","s":""},{"n":835,"t":"Sports","q":"Consider the following statements regarding the Ranji Trophy:\n1. The Ranji Trophy is named after Ranjit Singhji, ruler of Nawanagar, who was also a celebrated Indian cricketer.\n2. It was instituted by the BCCI in 1934, a year after his death. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Ranji Trophy, India’s premier domestic first-class cricket championship, was named after Ranjitsinhji Vibhaji Jadeja (Ranji) and started by the BCCI in 1934, one year after his death.","s":""},{"n":836,"t":"Sports","q":"What is the minimum over rate per hour in a test match?","o":["17 overs per hour","13 overs per hour","15 over per hour","10 overs per hour"],"a":2,"e":"15 over per hour. In ODIs, bowling teams must complete the required 50 overs in 3.5 hours, or a minimum of 14.28 overs per hour. For T20s, the requirement is 14.11 overs per hour, according to ICC’s rules.","s":""},{"n":837,"t":"Sports","q":"What is the standard weight of hammer for women in the hammer throw event?","o":["5 kg","4 kg","8 kg","6 kg"],"a":1,"e":"4 kg. The hammer throw is one of the four throwing events in track and field, along with the discus throw, shot put, and javelin. The hammer consists of a metal ball attached to a grip by a steel wire, with the throw taking place within a 2.135-meter diameter circle. For the throw to be valid, the hammer must land within a 35-degree sector. The standard weight of hammer for men athletes is 7.26kg.","s":""},{"n":838,"t":"Sports","q":"Which of the following is NOT any position in the Basketball sport?","o":["Point guard","Shooting guard","Small forward","All rounder"],"a":3,"e":"In basketball, the five positions on the court are: Point guard -playmaker. Shooting guard - A scoring specialist who can shoot from outside. Small forward - Often considered the most versatile player, responsible for scoring, rebounding, and defense. Power forward - Typically the strongest rebounder and post player. Center - The tallest player, responsible for defending the basket and rebounding.","s":""},{"n":839,"t":"Sports","q":"Consider the following statements about the indigenous sport Gatka:\n1. Gatka is a traditional martial art associated with the Sikh warriors of Punjab.\n2. It was primarily practiced by the Nihang Sikhs as a form of self-defence and later evolved as a sport. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Gatka originated in Punjab, practiced by Nihang Sikh warriors, and is now performed both as self-defence and a sport.","s":""},{"n":840,"t":"Sports","q":"The Thomas Cup is associated with which of the following sports?","o":["Badminton male","Badminton female","Tennis female","Tennis male"],"a":0,"e":"Badminton male. Thomas Cup is a Biennial event. The first tournament was held in 1948 - 49 and won by Malaya. India’s men’s badminton team won the Thomas Cup title for the first time ever in 2022 by defeating Indonesia. Uber Cup - First held in 1956–1957 and contested at three year intervals, it has been contested every two years since 1984.","s":""},{"n":841,"t":"Sports","q":"Where and when was India’s first Senior National Archery Championship held ?","o":["Chennai, 1975","Delhi, 1973","Delhi, 1975","Chennai, 1973"],"a":1,"e":"Delhi, 1973. The Senior National Archery Championship was introduced as part of organized archery in India, largely due to the efforts of Prof. Vijay Kumar Malhotra, who played a key role in introducing and promoting the sport in the country. 1972: Archery is included as an Olympic discipline in the Munich Games. 1975: Modern archery takes root in India, with the establishment of the Archery Association of India.","s":""},{"n":842,"t":"Sports","q":"Consider the following statements about Lovlina Borgohain:\n1. She won a bronze medal in the welterweight (69 kg) category at the Tokyo 2020 Olympics.\n2. She is the first Indian boxer ever to win an Olympic medal. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Lovlina Borgohain is associated with Boxing and won bronze at Tokyo 2020, becoming the third Indian boxer to win an Olympic medal, after Vijender Singh (2008) and Mary Kom (2012).","s":""},{"n":843,"t":"Sports","q":"In cricket, ________ is called by the umpire when the bowler doesn’t deliver the ball within reach of the batter.","o":["dead ball","yorker","no ball","wide"],"a":3,"e":"Wide. Other cricket terminology: Dead Ball -When the ball is no longer in play, usually due to an interruption or an incident, such as a player leaving the field or a significant external factor. Yorker: This is a type of delivery where the ball lands very close to the batter's feet, making it difficult to hit. No ball: This is called by the umpire for several reasons, such as when the bowler's front foot lands beyond the crease (overstepping), or when the ball is delivered above waist height without pitching (a beamer).","s":""},{"n":844,"t":"Sports","q":"Consider the following statements regarding Kabaddi:\n1. When a raider touches any body part or clothing of a defender, it is called a tag.\n2. A raider scores points through a tag only if they successfully return to their own side before taking a breath. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. In Kabaddi, a tag occurs when the raider touches a defender or their clothing; the raider scores only if they return safely to their half.","s":""},{"n":845,"t":"Sports","q":"Pusarla Venkata Sindhu won silver medal in badminton in which Olympics Games ?","o":["Beijing 2008","Rio 2016","Tokyo 2020","London 2012"],"a":1,"e":"Rio 2016. The 2016 Summer Olympics were held in Brazil, in the city of Rio de Janeiro. Mascot - Vinicius. She is the only Indian woman to have won multiple medals at the Olympics - a silver medal in women's singles at Rio 2016 and a bronze at Tokyo 2020. Her awards: Padma Bhushan (2020), Padma Shri (2015), Arjuna Award (2013), and Major Dhyan Chand Khel Ratna (2016).","s":""},{"n":846,"t":"Sports","q":"What is the standard size of basketball for men ?","o":["05","08","07","06"],"a":2,"e":"07. Basketball dimensions according to category: Men: Size 7, Circumference 749-780mm, Weight 567-650g. Women: Size 6, Circumference 724 - 737 mm, Weight 510-567g. The ball shall be spherical, with black seams not exceeding 6.35mm in width and, either of a single shade of orange or a combination of orange and other colors. Famous Indian Basketball Players -Paramjeet Singh, Sarabjit Singh, Vishesh Bhriguwanshi, Trideep Rai, Suman Sharma.","s":""},{"n":847,"t":"Sports","q":"Bails are used in which of the following games/sports?","o":["Badminton","Cricket","Hockey","Football"],"a":1,"e":"Cricket. Bails are the two smaller sticks placed on top of the three stumps to form a wicket. Terminology used in the sports: Cricket - Stumps, Wicket, On-Drive, Maiden Over, Googly. Badminton - Smash, Shuttlecock, Drive, Let. Hockey - Flick, 16 yard hit, Advancing. Football - Dribble, Attacker, Bicycle kick.","s":""},{"n":848,"t":"Sports","q":"What is the duration of single round in free style wrestling ?","o":["3 min","2.5 min","3.5 min","2 min"],"a":0,"e":"3 min. A typical freestyle wrestling bout, much like Greco-Roman, is divided into two periods of three minutes each with a 30-second break in between. For official Under-15, cadets, and veteran competitions, the periods are curtailed to two minutes each.","s":""},{"n":849,"t":"Sports","q":"India is home to the second oldest cricket club in the world. Where is it situated?","o":["Mumbai","Kolkata","Hyderabad","Chennai"],"a":1,"e":"Kolkata. The world's first Cricket club - Hambledon, England (1760). Marylebone Cricket Club (MCC) -1787. First Cricket club in India - Calcutta international cricket match - US vs Canada in 1844. India played their first International cricket match - Against England in 1932.","s":""},{"n":850,"t":"Sports","q":"In which year did the Indian football team go on its first known official international tour ?","o":["1947","1950","1914","1924"],"a":3,"e":"1924. An Indian team, comprising both Indian and British players, visited Sri Lanka (Ceylon at the time) for what was the Indian football team’s first-ever official foreign tour. Legendary footballer Gostha Pal, regarded as the first captain of the Indian football team, led the squad during the trip.","s":""},{"n":851,"t":"Sports","q":"Consider the following statements regarding the Buddh International Circuit:\n1. It is located in Greater Noida, Delhi NCR.\n2. It was designed by Hermann Tilke and inaugurated in 2011. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Buddh International Circuit is a 5.14 km motor racing track in Greater Noida, designed by Hermann Tilke and inaugurated in 2011; it hosted the Formula One Indian Grand Prix.","s":""},{"n":852,"t":"Sports","q":"Since 1994, Winter Olympics traditionally take place _______ after the Summer Olympics","o":["3 months","2 years","4 years","6 months"],"a":1,"e":"2 years. The Winter Olympic Games is a major international multi-sport event held once every four years for sports practiced on snow and ice. The first Winter Olympic Games, the 1924 Winter Olympics, were held in Chamonix, France. From 1924 to 1992, the Summer and Winter Games were each held in the same year, every four years. The four-year period between the ancient and modern Olympic Games is called an Olympiad.","s":""},{"n":853,"t":"Sports","q":"Which of the following is NOT compulsory equipment for a football referee?","o":["White flag","Whistle(s)","Watch(es)","Red and yellow cards"],"a":0,"e":"White flag. A Red Card is used by the officials to remove a player from the match. A yellow card in football shows to a player who breaks a rule. Modern football originated in Britain in the 19th century. Some famous footballers include: Lionel Messi, Cristiano Ronaldo, Diego Maradona, Zinedine Zidane, Pele, Johan Cruyff, Franz Beckenbauer.","s":""},{"n":854,"t":"Sports","q":"The number of white pawns in chess is _______.","o":["14","12","8","10"],"a":2,"e":"8. The pawns begin the game on the second and seventh rank: White's pawns start on the second rank, while Black's pawns are located on the seventh rank. Each player begins a game with eight pawns, one on each square of their second rank. The white pawns start on a2 through h2; the black pawns start on a7 through h7.","s":""},{"n":855,"t":"Sports","q":"In which year was the All India Football Federation (AIFF) formed?","o":["1947","1937","1957","1967"],"a":1,"e":"1937. Before AIFF, football was governed by the Indian Football Association (IFA), established in Kolkata in 1893. AIFF joined FIFA (Federation Internationale de Football Association) in 1948 and is responsible for managing football in India, with its headquarters located in New Delhi. FIFA, the global governing body for football, was founded in Paris (France) in 1904.","s":""},{"n":856,"t":"Sports","q":"Consider the following statements regarding the Board of Control for Cricket in India (BCCI):\n1. It was formed in 1928.\n2. R. E. Grant Govan was its first President. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The BCCI was established in December 1928, with its headquarters at Wankhede Stadium, Mumbai, and R. E. Grant Govan served as its first President.","s":""},{"n":857,"t":"Sports","q":"In a test match, the captain of the fielding side may demand a new ball after _____.","o":["85 overs","70 overs","80 overs","75 overs"],"a":2,"e":"80 overs. Test cricket is the traditional form of the game, which has been played since 1877 and now settled in a five-day format which comprises two innings each. It is considered the pinnacle form because it tests teams over a longer period of time. Test cricket consists of three sessions of two hours each, the break between sessions being 40 minutes for lunch and 20 minutes. The International Cricket Council (ICC) governs Test cricket.","s":""},{"n":858,"t":"Sports","q":"Consider the following statements regarding football as per IFAB rules:\n1. The maximum length of a goal line in football is 90 metres.\n2. The International Football Association Board (IFAB) was established in 1886.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. According to IFAB rules, the maximum length of a goal line is 90 metres. The International Football Association Board (IFAB), the governing body responsible for the Laws of the Game, was established in 1886.","s":""},{"n":859,"t":"Sports","q":"What is the duration of International hockey match?","o":["55 min","50 min","60 min","70 min"],"a":2,"e":"60 min. The total duration of a field hockey match is 60 minutes (four quarters of 15 minutes each). Before 2019, matches were played for 70 minutes, with a five-minute halftime break after 35 minutes. Common rules of Hockey: Hockey Stick Weight: Must not exceed 737 grams. Hockey Ground Dimensions: 91.4 meters long and 55 meters wide.","s":""},{"n":860,"t":"Sports","q":"What is the minimum number of football players required in a team for a match to start?","o":["10","11","7","8"],"a":2,"e":"7. Game and number of players: Cricket (11), Hockey (11), Basketball (5), Volleyball (6), Tennis (1 or 2 players), Kabaddi (7), Water Polo (7), Kho - Kho (9), Rugby (15).","s":""},{"n":861,"t":"Sports","q":"Where is the largest football stadium in India located?","o":["New Delhi","Kolkata","Goa","Bengaluru"],"a":1,"e":"Kolkata. The largest football stadium in India is the Vivekananda Yuba Bharati Krirangan, also known as Salt Lake Stadium. Opened - 25 January\n1984. Other Stadiums: Birsa Munda Football Stadium (Ranchi), DY Patil Stadium (Navi Mumbai), Guru Nanak Stadium (Ludhiana), Lal Bahadur Shastri (Kohima).","s":""},{"n":862,"t":"Sports","q":"What are the standard measurements of a cricket pitch?","o":["20 yards by 10 ft","22 yards by 12 ft","20 yards by 12 ft","22 yards by 10 ft"],"a":3,"e":"22 yards by 10 ft. In the game of cricket, the cricket pitch consists of the central strip of the cricket field between the wickets. Dimensions of Cricket Wicket - Height of 28” (71.12 cm) and width of 9” (22.86 cm). Bat - Length should be not more than 38 inches (96.5 cm) and the width not more than 4.25 inches (10.8 cm) and made up of Wood only. Ball - Weight between 5.5 ounces and 5.75 ounces, and shall measure between 22.4 cm and 22.9 cm in circumference.","s":""},{"n":863,"t":"Sports","q":"Consider the following statements regarding warning cards in Kabaddi:\n1. Green card in Kabaddi is given as an initial warning.\n2. Yellow card in Kabaddi leads to a 2-minute suspension along with one technical point to the opponent team.\n3. Black cards are used as a warning card in Kabaddi.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. In Kabaddi, green card indicates an initial warning, yellow card leads to 2-minute suspension plus one technical point, and red card causes suspension from the match. Black card is not used in Kabaddi; it is used in badminton for disqualification.","s":""},{"n":864,"t":"Sports","q":"In badminton, 0 points is called __","o":["out","love","in","play"],"a":1,"e":"love: It means one player is at zero point. The word Love comes from the French word l'oeuf – which means egg which is the shape of zero. Badminton Terminology: Shuttlecock, Fail, Smash, Deuce, Black Card.","s":""},{"n":865,"t":"Sports","q":"In Fencing, a defensive blade movement that blocks the opponent’s offensive action is called ____________.","o":["reprise","saber","redoublement","parry"],"a":3,"e":"Parry. Fencing is a combat sport featuring sword fighting with three disciplines: foil, epee, and sabre. Each uses a different blade and has its own rules. Key terms include Allez, Attack, Beat, Counter-parry, Riposte, and Touche. Notable Indian fencers are C.A. Bhavani Yashkeerat Kaur Hayer.","s":""},{"n":866,"t":"Sports","q":"Consider the following statements regarding Equestrian sports:\n1. A knockdown occurs when a horse or rider lowers an element of a jump that establishes the height of an obstacle.\n2. A knockdown usually results in 4 penalty points.\n3. Accumulating penalty points can significantly affect a rider’s overall score and ranking.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. In Equestrian sports, a knockdown refers to lowering an element of a jump, which generally carries a penalty of 4 points, and repeated knockdowns affect the rider’s final score and ranking.","s":""},{"n":867,"t":"Sports","q":"In which of the following games is the term 'Dribbling' used ?","o":["Basketball","Cricket","Baseball","Volleyball"],"a":0,"e":"Basketball. Dribbling is the act of continuously bouncing the ball on the floor with one hand at a time. It's the only legal way for a player to maintain possession while walking or running. Other Key terms of Basketball: Assist, Block, Blocking, Boxing out, Center, Charging, Crossover, Defense, Dribbling, Dunk, Field goal, Forward, Free throw, Guard, Key, Offense, Pass, Rebound, Shot, Three-point-line, Traveling, and Turnover.","s":""},{"n":868,"t":"Sports","q":"The term 'Libero' is used in _____ .","o":["snooker","basketball","volleyball","badminton"],"a":2,"e":"volleyball. In volleyball, the libero is a specialized defensive player responsible for receiving serves, digging attacks, and improving ball control. They wear a different-colored jersey and are not allowed to serve, block, or attack the ball above the net. Other Terminologies -Cut Shot, Dig, Dink, Double Hit, Penetration, Sidearm, Booster, Spikers.","s":""},{"n":869,"t":"Sports","q":"Consider the following statements regarding cricket rules and dimensions:\n1. The height of the stump from the ground is 28 inches.\n2. The minimum length of a cricket bat is 38 inches and its width is 4.25 inches.\n3. The cricket ball must weigh between 155.9 and 163 grams, with a circumference of about 8.81 to 9 inches.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. In cricket, the stump height is fixed at 28 inches, while the bat and ball dimensions are standardized under the Laws of Cricket for uniformity in the game.","s":""},{"n":870,"t":"Sports","q":"In basketball, _________ is when a referee throws the ball up at the centre circle to determine which team gets possession.","o":["a hook ball","a dunk ball","a jump ball","a high ball"],"a":2,"e":"a jump ball. Basketball is played between two teams consist of twelve (12) members each. But only five players from each team may be on the court at one time. Shooting with either one hand or both hands is done in the following ways - Jump shot, Dunk shot, Free throw, Layup, Three-point shot, Hook shot. A hook shot is where the player swings the ball up and over their head in a sweeping motion with one hand. A dunk shot is where a player jumps and pushes the ball through the basket while it's still in their hand.","s":""},{"n":871,"t":"Sports","q":"Consider the following statements regarding the Olympic Games:\n1. Women first participated in the Modern Olympics in 1900.\n2. The first Olympic Games were held in Athens in 1896.\n3. The Olympic flag was designed in 1913 by Baron Pierre de Coubertin.\n4. India first took part in the Olympics in 1900 through Norman Pritchard, who was also the first Asian to win an Olympic medal.\nWhich of the above statement(s) is/are correct?","o":["1, 2 and 3 only","2, 3 and 4 only","1, 3 and 4 only","1, 2, 3 and 4"],"a":3,"e":"1, 2, 3 and 4. Women first entered the Olympics in 1900 (Paris), the inaugural Games were in Athens (1896), Coubertin designed the Olympic flag in 1913, and Norman Pritchard represented India in 1900, winning two silver medals.","s":""},{"n":872,"t":"Sports","q":"Who among the following was the founding president of the Indian Olympic Association?","o":["Dorabji Tata","AG. Noehren","Jamsetji Tata","Dadabhai Naoroji"],"a":0,"e":"Dorabji Tata. The Indian Olympic Association (IOA) is the governing body for the Olympic Movement and the Commonwealth Games in India. It was established in 1927, with Sir Dorabji Tata serving as the Founding President and Dr. A.G. Noehren as the Secretary General. Its headquarters are located in New Delhi, India.","s":""},{"n":873,"t":"Sports","q":"In which year was the Department of Sports transformed into the Department of Youth Affairs and Sports?","o":["1983","1982","1985","1984"],"a":2,"e":"1985. The Ministry of Youth Affairs & Sports was initially set up as the Department of Sports in 1982 at the time of organization of the IX Asian Games in New Delhi . Its name was changed to the Department of Youth affairs & sports during celebration of the International Youth Year, 1985. It became a Ministry on 27th May, 2000. Subsequently, the Ministry has been bifurcated in Deptt. of Youth Affairs and Deptt. of Sports under two separate secretaries w.e.f. 30th April, 2008.","s":""},{"n":874,"t":"Sports","q":"The number of players in baseball is:","o":["8","6","9","7"],"a":2,"e":"9. Number of players in game: Cricket (11), Curling (4), Football (11), Futsal (5), Hockey (11), Ice Hockey (6), Basketball (5), Rugby Football (15), Polo (4), Water Polo (7), Volleyball (6), Beach Volleyball (2), Kabaddi (7), Lacrosse (12), Handball (7), Kho Kho (9).","s":""},{"n":875,"t":"Sports","q":"Consider the following statements regarding sports policy in India:\n1. A resolution on the National Sports Policy was first laid in both Houses of Parliament in 1984.\n2. The National Sports Policy was formulated with the objective of raising the standard of sports in the country.\n3. National Sports Day in India is observed on 29th August to honor the birth anniversary of Major Dhyan Chand.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. The first resolution on National Sports Policy came in 1984, aiming to improve sports standards, and National Sports Day is celebrated on 29th August in memory of Major Dhyan Chand.","s":""},{"n":876,"t":"Sports","q":"What is the colour of the antenna used on the volleyball net?","o":["Red and white","Yellow and black","Black and white","Green and white"],"a":0,"e":"Red and white. Antennas are used to help players and referees determine if a ball is in or out of bounds. Court Dimensions: Court = 18 x 9m; Diagonal = 20.12m; Attack line = 3m from centre. Ball: circumference is 65–67 cm and its weight is 260–280 grams. Net top is set at the height of 2.43 m for men and 2.24 m. for women. Height is measured at the centre of the court. There are two teams comprising 6 players each on the court. Volleyball was invented by William G. Morgan in the year 1895.","s":""},{"n":877,"t":"Sports","q":"What is the size of a standard table tennis ball?","o":["41 mm","39 mm","40 mm","42 mm"],"a":2,"e":"40 mm. Table Tennis Equipment: Ball: The ball is spherical, orange or white in colour made of celluloid or similar plastic material with a diameter of 40 mm, weight 2.7g. Racket: Size about 15 cm across and 25cm long including the handle. Scoreboard: The board used for scoring is called Table Tennis Scoreboard. The net is suspended by a cord attached at each end to an upright post 15.25 cm high. The colour of net assembly should be of dark green, dark blue or black and have a white top not more than 15 mm wide.","s":""},{"n":878,"t":"Sports","q":"Consider the following statements regarding the Asian Games:\n1. The Asian Games is also popularly known as Asiad.\n2. The first Asian Games were held in New Delhi in March 1951.\n3. The 19th Asian Games were hosted by Hangzhou, China, in 2023.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. The Asian Games, also called Asiad, began in 1951 at New Delhi and its latest edition (19th) was held in Hangzhou, China, in 2023.","s":""},{"n":879,"t":"Sports","q":"Which of the following is NOT an Indian tournament?","o":["UEFA Champions League","Durand Cup","Santosh Trophy","Subroto Cup"],"a":0,"e":"UEFA Champions League. It is an annual club football competition organized by the Union of European Football Associations (UEFA) and contested by top-division European clubs. It was founded in 1955. Some prominent football trophies in India include the Durand Cup, Santosh Trophy, Federation Cup, I-League Trophy, Indian Super League (ISL) Trophy, IFA Shield, Rovers Cup, Sait Nagjee Trophy, Subroto Cup, and Bordoloi Trophy.","s":""},{"n":880,"t":"Sports","q":"The All India MCC Murugappa Gold Cup Tournament in Chennai is held for which sport?","o":["Basketball","Handball","Hockey","Football"],"a":2,"e":"Hockey. Murugappa Gold Cup Hockey Tournament 2024 : Winner -Railways Sports Promotion Board (RSPB); Runner up - Maharashtra. Prominent Indian Hockey Players : Jarmanpreet Singh, Sanjay Rana, Raj Kumar Pal, Abhishek and Sukhjeet Singh.","s":""},{"n":881,"t":"Sports","q":"Gloves are NOT used in which of the following sports?","o":["Basketball","Hockey","Cricket","Football"],"a":0,"e":"Basketball requires a good grip on the ball and quick hand movements, which are best achieved with bare hands. Gloves would hinder these movements and reduce control over the ball. Games where gloves are generally not required include volleyball, tennis and rugby.","s":""},{"n":882,"t":"Sports","q":"What is the weight of the shot put for the men's category?","o":["16 pounds","12 pounds","14 pounds","10 pounds"],"a":0,"e":"16 pounds (7.26 kg) . The shot put is a track and field event where athletes throw a heavy metal ball, known as a shot, as far as possible. The shot is typically made of brass, iron, or steel with a smooth surface for a better grip. For junior male athletes, the standard shot put weight is 6 kilograms (13.2 pounds), while for senior female athletes, it is 4 kilograms (8.8 pounds), and for junior female athletes, it is 3 kilograms (6.6 pounds). The diameter of the shot ranges from 110-130 mm for men and 95-110 mm for women.","s":""},{"n":883,"t":"Sports","q":"Consider the following statements regarding Badminton:\n1. The shuttlecock is used in the sport of Badminton.\n2. The standard doubles court measures 13.40 m × 6.10 m.\n3. The International Badminton Federation (IBF) was established in 1934.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. Shuttlecock is the main equipment in Badminton, the court dimensions are 13.40 × 6.10 m for doubles, and IBF was formed in 1934 to standardize rules internationally.","s":""},{"n":884,"t":"Sports","q":"What is it called in basketball when a shot goes through the basket without touching the rim or backboard?","o":["Screen","Dime","Swish","Technical foul"],"a":2,"e":"Swish. Other terminologies : A screen is a blocking maneuver by an offensive player that creates space for a teammate to receive a pass or take a shot; it is also known as a pick. A \"dime\" refers to a precisely delivered pass that allows a teammate to easily score. A technical foul is called on a player, coach, or team for unsportsmanlike conduct, typically without any physical contact with an opponent.","s":""},{"n":885,"t":"Sports","q":"Consider the following statements regarding the Sir Garfield Sobers Trophy:\n1. It is presented annually by the International Cricket Council (ICC).\n2. It is awarded to the ICC Men’s Cricketer of the Year.\n3. The first recipient of the trophy was Rahul Dravid in 2004.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. The Sir Garfield Sobers Trophy, named after the West Indies legend, was instituted in 2004 and first awarded to Rahul Dravid. It continues to be the highest individual honor in cricket, with Pat Cummins being the 2023 recipient.","s":""},{"n":886,"t":"Sports","q":"Dr. B. C. Roy Trophy is an Indian football tournament for :","o":["under-14 players","under-21 players","under-19 players","under-17 players"],"a":2,"e":"under-19 players. The Junior National Football Championship, also known as BC Roy Trophy, is an Indian football tournament held for players under-15 years of age representing the states of India. It was formerly held for the U-19 age group before being converted into an U-15 tournament from","s":""},{"n":887,"t":"Sports","q":"The first South Asian Games were hosted by _____.","o":["Kathmandu","Dhaka","Colombo","Calcutta (Kolkata)"],"a":0,"e":"Kathmandu. The South Asian Games are held with the motto \"Peace, Prosperity, Progress.\" The next edition of the South Asian Games will take place in 2025 in Lahore, Pakistan. These games aim to promote unity and cooperation among South Asian nations through sports.","s":""},{"n":888,"t":"Sports","q":"With which sport is the Burdwan Trophy associated?","o":["Powerlifting","Weightlifting","Boxing","Wrestling"],"a":1,"e":"Weightlifting. Sports and Trophies : Badminton - Agarwal Cup, Amrit Diwan Cup, Asia Cup. Basketball -Basalat Jha Trophy, B. C. Gupta Trophy, Federation Cup. Boxing - Aspy Adjahia Trophy, Federation Cup, Val iBaker Trophy.","s":""},{"n":889,"t":"Sports","q":"With which game is the CK Nayudu Trophy associated?","o":["Cricket","Football","Handball","Basketball"],"a":0,"e":"Cricket. The CK Nayudu Trophy is a domestic first-class cricket tournament in India, named after the famous Indian cricketer CK Nayudu. Sports and trophy/tournament : Cricket -Ranji trophy, Deodhar Trophy, Duleep Trophy, G. D. Birla Trophy, Irani Trophy, Sahara Cup, Vijay Merchant Trophy, Rani Jhansi Trophy. Football - Durand Cup, Santosh Trophy (National Football), Sir Ashutosh Mukherjee Trophy, Subrata Mukherjee Cup (National school football). Basketball - Bangalore Cup, Todd Memorial Trophy, Williams Cup.","s":""},{"n":890,"t":"Sports","q":"How many circles does a target have in archery?","o":["12","8","10","15"],"a":2,"e":"10. Archery: It is the sport, practice, or skill of using a bow to shoot arrows. Terminology: Bodkin point, Bow, Arm guard, Bow Hand, Full Draw, Release, Crossbow, Overdraw.","s":""},{"n":891,"t":"Sports","q":"Due to World War I and II the Olympic Games were NOT held in which years ?","o":["1916, 1936, 1940","1916, 1940, 1944","1924, 1940, 1944","1920, 1944, 1948"],"a":1,"e":"1916, 1940, 1944. The first modern Olympic Games were held in Athens (Greece) in 1896. Summer Olympics and their venues: 2024 - Paris (France), 2028 - Los Angeles (U.S.A). Winter Olympics and their venues: 2026 -Milan – Cortina d'Ampezzo (Italy). Baron Pierre de Coubertin founded the International Olympic Committee (IOC) in 1894.","s":""},{"n":892,"t":"Sports","q":"‘ Let Ball’, 'Stroke Ball' and 'No Let' are part of which game ?","o":["Squash","Rugby","Handball","Polo"],"a":0,"e":"Squash. Terminologies : Foot fault, Not up, Out, Fault, Down, Hand Out, Rally, Striker, Half Court Line, Outline, Quarter Court, Board, Hand.","s":""},{"n":893,"t":"Sports","q":"In table tennis, the period during which a ball is in play is called __________.","o":["let","point","obstruction","rally"],"a":3,"e":"Rally starts when the server serves the ball and ends when the point is awarded to one of the players. Let-Service ball hitting the net or a distraction that causes the point played over. Point - A unit of scoring in table tennis. Dead - A ball without any spin.","s":""},{"n":894,"t":"Sports","q":"Consider the following statements regarding the movement of chess pieces:\n1. The King can move only one square in any direction.\n2. The Rook moves any number of squares horizontally or vertically.\n3. The Queen can move any number of squares in any direction – horizontally, vertically, or diagonally.\nWhich of the above statement(s) is/are correct ?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. In chess, each piece has a unique movement rule. The King is restricted to one square in any direction, the Rook moves straight along ranks and files, and the Queen combines the power of Rook and Bishop by moving in all directions.","s":""},{"n":895,"t":"Sports","q":"In which year was the Men's cricket world cup started?","o":["1985","1970","1975","1980"],"a":2,"e":"1975. World Cup - The first World Cup was organised in England in\n1975. It was won by the West Indies (final was played between Australia and West Indies). India won the world cup two times - First win came in 1983 (Defeated West Indies in the final) and the second win came in 2011 (Defeated Sri Lanka).","s":""},{"n":896,"t":"Sports","q":"What is the most often described as gymnastics and dance on horseback?","o":["Jousting","Barrel racing","Equestrian vaulting","Steeplechase"],"a":2,"e":"Equestrian vaulting. It was demonstrated as an art at the 1920 Antwerp Olympics. Jousting - Medieval tournament that saw knights compete against each other on horseback. Barrel racing - An event in which a horse and rider attempt to run a cloverleaf pattern around preset barrels in the fastest time.","s":""},{"n":897,"t":"Sports","q":"The Athletics Federation of India was formed in ________.","o":["1946","1950","1936","1948"],"a":0,"e":"1946. The Athletics Federation of India (AFI) is the apex body for running and managing athletics in India. Headquarters - New Delhi. AFI has decided to name August 7 as ‘Javelin Throw Day’ in India to honor Neeraj Chopra’s first historic Olympic gold (2020). International Association of Athletics Federation (IAAF): Founded -1912. Founded at - Stockholm, Sweden. Headquarters - Monaco.","s":""},{"n":898,"t":"Sports","q":"______ hosted the 2nd Olympic Games in _______.","o":["France, 1900","Japan, 1900","USA, 1900","England, 1900"],"a":0,"e":"France, 1900. First Olympic games were held in Athens (1896). India first participated at the Olympic Games in 1900. The Summer and Winter Olympic Games are still held every four years. The five rings represent the union of the five inhabited continents – Africa, the Americas, Asia, Europe and Oceania.","s":""},{"n":899,"t":"Sports","q":"Rangaswami Cup is associated with which game ?","o":["Volleyball","Basketball","Hockey","Football"],"a":2,"e":"Hockey. Important cups and trophies associated with various games: Hockey - Agha Khan Cup, Beighton Cup. Cricket - Asia Cup, C. K. Naidu Trophy, Deodhar Trophy, Duleep Trophy, Irani Trophy, Ranji Trophy, ICC Champions Trophy, ICC World Cup. Football -Bandodkar Trophy, Durand Cup, Federation Cup, FIFA World Cup, Merdeka Cup. Volleyball - Indira Pradhan trophy, Centennial Cup, and Shivanthi Gold Cup. Basketball - Todd Memorial Trophy, Williams Jones Cup.","s":""},{"n":901,"t":"Sports","q":"What is the distance between the football goal posts ?","o":["8.34 m","7.10 m","7.32 m","6.32 m"],"a":2,"e":"7.32 m. Dimensions - length of 115 yards and width of 75 yards. A Football match contains two equal halves of 45 minutes. Each team has 11 players. A football weighs between 410 to 450 grams. Terms related to football -Penalty Kick, Kick, Goal, Head, Side Back, Pass, Baseline, Rebound, Comer Bick, Right Out, Hattrick, Move, Left Out, Off Side, Stopper, Defender, etc.","s":""},{"n":902,"t":"Sports","q":"Which of the following is NOT an Equestrian discipline?","o":["Dressage","Vaulting","Sprint","Show jumping"],"a":2,"e":"Sprint. Equestrian is the broad umbrella term for sport involving riding on horseback. There are numerous equestrian disciplines ranging from horse racing and vaulting (gymnastics on horseback) to polo and rodeo. There are three disciplines in the Olympic Games: Dressage, Eventing, and jumping (also known as show jumping).","s":""},{"n":903,"t":"Sports","q":"The First Commonwealth Games were organized in which of the following years ?","o":["1926","1930","1920","1922"],"a":1,"e":"1930. Commonwealth Games (British Empire Games) - 1st Event (1930) - Host city - Hamilton, Canada. Nations - 11. XXII Event (In 2022) - Host city - Birmingham, England. Moto - Games for Everyone. Nations - 72. Rank - 1st- Australia (67 Gold), 2nd -England (58 Gold), 4th - India (22 Gold).","s":""},{"n":904,"t":"Sports","q":"During a game of hockey, following an offense, if a player is shown a yellow card then he will be sent off the pitch for _______.","o":["5 minutes","3 minutes","4 minutes","6 minutes"],"a":0,"e":"5 minutes. Other used penalty cards : Red card - A player being permanently suspended from the game. Green card - An official warning when a minor offense has occurred. White card -It is used in bandy to indicate a five-minute timed penalty given to a player. Blue card - It is used in bandy to indicate a ten-minute timed penalty given to a player. Black card - It is used in the sport of badminton to indicate disqualification.","s":""},{"n":905,"t":"Sports","q":"Syed Modi India International is organized in which sporting event?","o":["Volleyball","Badminton","Chess","Kabaddi"],"a":1,"e":"Badminton. Syed Modi International - This tournament was introduced to the badminton circuit as a BWF Grand Prix event in 2009, Since then the tournament is being annually held in Lucknow (Babu Banarasi Das Indoor Stadium). Famous Badminton Trophy : Uber Cup (Women), Tunku Abdul -Rahman Cup, Thomas Cup, BWF World Championship, Narang Cup.","s":""},{"n":906,"t":"Sports","q":"Consider the following statements about the Arjuna Award:\n1. Sahanand Mahadev Shetty was the first Kabaddi player to receive the Arjuna Award in 1972.\n2. The Arjuna Award was first instituted in 1961, when twenty sportspersons were awarded.\n3. G.S. Randhawa (Athletics), Nandu M. Natekar (Basketball), and Saleem Durrani (Cricket) were among the first recipients in 1961.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. Sahanand Mahadev Shetty was the first Kabaddi player to be honoured with the Arjuna Award in 1972. The award began in 1961, with 20 recipients across different sports including Athletics, Basketball, Cricket, Football, Hockey, Table Tennis, Tennis, Wrestling, etc.","s":""},{"n":907,"t":"Sports","q":"Which of the following sports does NOT have its apex national governing body headquartered in New Delhi ?","o":["Badminton Association of India","Volleyball Federation of India","Athletes Federation of India","Hockey India"],"a":1,"e":"Volleyball Federation of India: It was founded in 1951 and its Headquarter is located in Chennai, Tamil Nadu. Volleyball is played by two teams of six players on a court divided by a net. Volleyball-court is 18m long and 9m wide. Terms related to Volleyball - Spike, Block, Serve, Dig, Set, Attack, Rotation, Ace, Side out, Net violation, Kill, etc.","s":""},{"n":908,"t":"Sports","q":"In football, a kick is awarded to the opposition player when a player has committed a foul. What is the kick called?","o":["Bicycle kick","Goal kick","Wide kick","Free kick"],"a":3,"e":"Free kick. Football related fact : dimensions 105 meters x 68 meters; game lasts for 90 minutes with two halves of 45 minutes; Players - 11. Football Terms - Attacker, Back Heel, Back Pass, Bicycle Kick, Center Spot, Corner Flag, Corner Kick, Foul, Free Kick.","s":""},{"n":909,"t":"Sports","q":"The term 'inning' is related to which of the following sports ?","o":["Basketball","Hockey","Volleyball","kho kho"],"a":3,"e":"kho kho. Terminology: Kho, Chaser, Runner, Cross lane, Central Lane, Pole, Square. Total Players - 12 .","s":""},{"n":910,"t":"Sports","q":"In the game of ice hockey, during normal play how many players are there in each team on the ice at any one time to compete ?","o":["5","10","12","6"],"a":3,"e":"6. Ice hockey - Canadian national sport. The first recognised team, the McGill University Hockey Club, was formed in 1880. Sport and number of players (in one Team) : Baseball - 9, Basketball -12 players (with five players on the court at any given time), Hockey -11, Kabaddi - 7, Kho Kho - 12 (but during a contest, only 9 players from each side take the field), Polo - 4, Volleyball - 6.","s":""},{"n":911,"t":"Sports","q":"The shape of a basketball court is a _________","o":["circle","rectangle","square","triangle"],"a":1,"e":"rectangle. Shape of other Sports court: Boxing - Square/Circle, Cricket - Circular, Hockey - Rectangular, Volleyball courts - Rectangular, Tennis courts - Rectangular, Badminton Courts -Rectangular.","s":""},{"n":912,"t":"Sports","q":"In test match cricket, how many minimum overs can a team play in a day ?","o":["60","80","70","90"],"a":3,"e":"90. Test cricket: Longest form of cricket. Test matches are played for five days which comprises two innings by each team.","s":""},{"n":913,"t":"Sports","q":"Cricket became an international game with the formation of the Imperial Cricket Conference (ICC) in the year____.","o":["1947","1951","1921","1909"],"a":3,"e":"1909. Imperial Cricket Conference (ICC) - The governing body of world cricket. It was renamed as International Cricket Council (ICC) in\n1989. Headquarters - Dubai.","s":""},{"n":914,"t":"Sports","q":"In a basketball game, how many players from one team play on the court at any given time?","o":["7","5","4","6"],"a":1,"e":"5. A traditional basketball team has 12 players, with five basketball players on the court at any given time. Name of positions of five players: Point guard, Shooting guard, Small forward, Power forward and Center.","s":""},{"n":915,"t":"Sports","q":"The first Indian who won a medal in World Athletics Championship is_______.","o":["Neeraj Chopra","Annu Rani","Anju Bobby George","Murali Sreeshankar"],"a":2,"e":"Anju Bobby George - She won a bronze medal in long jump at the 2003 World Championships in Athletics in Paris.","s":""},{"n":916,"t":"Sports","q":"In Ball Badminton, players change the ends in each game when a side first scores all of the following, EXCEPT:","o":["18","11","27","9"],"a":1,"e":"11. Ball badminton : A sport native to India. It is a racket sport game, played with a yellow ball made of wool, on a court of fixed dimensions (12 by 24 m) divided by a net. It originated in Tanjore, in Tamil Nadu. It is a team sport, played by five players a side.","s":""},{"n":917,"t":"Sports","q":"What is the standard weight of a hockey ball?","o":["161 gm - 156 gm","163 gm - 156 gm","160 gm - 156 gm","162 gm - 156 gm"],"a":1,"e":"163 gm - 156 gm. Hockey’s Related Dimensions : Pitch boundary -The pitch on which field hockey is played is 91.4m long and 55m wide. Goal post -Each goal post is 2.14m high and 0.05m wide. Terminology - Cross, Dangerous Play, Defense, Drive, Flick, Penalty Stroke, Tackle, Undercutting.","s":""},{"n":918,"t":"Sports","q":"Consider the following statements about Ball Badminton:\n1. The standard ball used is of lemon yellow color, made of wool, weighing between 22 to 23 grams, and 5 to 5.5 cm in diameter.\n2. The racket used in Ball Badminton weighs 200–250 grams and has a length of 63–70 cm.\n3. The net is 1 metre wide, 13.5 metres long, made of fine cord with 2 cm square mesh, and marked with red tape at the top with a tri-colour design (red tape, white and blue body).\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. In Ball Badminton, a lemon yellow woolen ball of 22–23 g and 5–5.5 cm diameter is used, with rackets weighing 200–250 g and 63–70 cm length. The net is 1 m × 13.5 m with a red-taped tri-colour design and 2 cm mesh.","s":""},{"n":919,"t":"Sports","q":"What is the weight of the ball in handball for men ?","o":["425 to 475 gm","325 to 375 gm","525 to 575 gm","225 to 275 gm"],"a":0,"e":"425 to 475 gm. The handball court - measures 40m long and 20m wide. The ball (resin handballs) circumference ranges from 58 to 60 cm for men and 54 to 56 cm, and the weight (325 to 375 gm) for women. The handball goal - 2m (6.56ft) high and 3m (9.84ft) wide. A handball team consists of 7 players.","s":""},{"n":920,"t":"Sports","q":"Narendra Modi Cricket Stadium is one of the premier stadiums in India located at _ _____.","o":["Ahmedabad","New Delhi","Baroda","Surat"],"a":0,"e":"Ahmedabad. Narendra Modi Cricket Stadium (Motera) - Built on the banks of the Sabarmati River. Other cricket stadiums in India: Eden Gardens -Kolkata, Wankhede Stadium -Mumbai (Maharashtra), HPCA International Cricket Stadium -Dharamshala (Himachal Pradesh), Ekana Cricket Stadium - Lucknow (Uttar Pradesh) and Arun Jaitley cricket stadium - New Delhi.","s":""},{"n":921,"t":"Sports","q":"Vinesh Phogat became the first Indian woman wrestler to win how many medals at World Championships ?","o":["6","5","2","3"],"a":2,"e":"2. Vinesh Phogat became the first Indian woman wrestler to win gold in both Commonwealth and Asian Games. Her Awards: Major Dhyan Chand Khel Ratna (2020), Arjuna Award (2016). Some Indian Wrestlers - Sakshi Malik, Ravi Kumar Dahiya, Yogeshwar Dutt,","s":""},{"n":922,"t":"Sports","q":"Consider the following statements about cricket statistics:\n1. Batting average is the total number of runs scored divided by the number of times a batter has been dismissed.\n2. Strike rate is the average number of runs a batter scores per 100 balls faced.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Batting average shows consistency, while strike rate indicates scoring speed in cricket.","s":""},{"n":923,"t":"Sports","q":"In Fencing, a contest between the two fencers is known as:","o":["bout","remise","parry","riposte"],"a":0,"e":"Bout. The three disciplines of modern fencing are the foil, the epee, and the saber. The 3 moves in fencing are called : Lunge - The basic attacking move; Parry - A defensive action where the fencer blocks the opponent's lunge; Riposte - A counterattack by the fencer who has blocked the opponent with a parry. Remise - It is performed when one fencer's attack has failed, either because their opponent has parried or they missed.","s":""},{"n":924,"t":"Sports","q":"Who became the first Indian javelin ace to win the gold at the Zurich Diamond League?","o":["Sahil Silwal","Shivpal Yadav","Neeraj Chopra","Rohit Yadav"],"a":2,"e":"Neeraj Chopra (in Zurich diamond league 2022) . Gold medals : Olympics Games 2020 - (Tokyo Japan), World Championships 2023 - (Budapest, Hungary), Commonwealth Games 2018 -(Gold Coast, Australia), Asian Games 2018 - (Jakarta, Indonesia). Awards : Padma Shri (2022), Major Dhyan Chand Khel Ratna Award (2021), Arjuna Awards (2018).","s":""},{"n":925,"t":"Sports","q":"What is the width of the court for double matches in Lawn Tennis?","o":["38 feet","36 feet","34 feet","32 feet"],"a":1,"e":"36 feet. Lawn Tennis Terms -Ace, Advantage, Deuce, Backspin, Deep, Double Bagel, Groundstroke, Approach Shot. Double Matchcourt Size - Length (78 feet). Single match Court Size -Length (78 Feet), Width (27 feet).","s":""},{"n":926,"t":"Sports","q":"What is the distance between the goal line and the penalty spot in football?","o":["11 yards","12 yards","10 yards","9 yards"],"a":1,"e":"12 yards.","s":""},{"n":927,"t":"Sports","q":"The term ‘tackle point’ is associated with ________.","o":["Football","Baseball","Hockey","Kabaddi"],"a":3,"e":"Kabaddi. Terminology in Sports : Kabaddi - All-out, Ankle hold, Bonus line, Frog Jump, Lona etc.","s":""},{"n":928,"t":"Sport
