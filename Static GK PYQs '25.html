, and Chethiyagiri Vihara Festival.","s":""},{"n":614,"t":"Songs","q":"The music of traditional _________consists of thumri and other lyrical song forms.","o":["Kathakali","Sattriya","Kathak","Kuchipudi"],"a":2,"e":"Kathak. The word \"Kathak\" is derived from \"Katha,\" meaning story. Kathak has three main schools or gharanas - Lucknow, Jaipur, and Banaras-each with its unique emphasis. The Lucknow Gharana focuses on expressiveness and grace, the Jaipur Gharana is known for its strong footwork, and the Banaras Gharana combines elements of both.","s":""},{"n":615,"t":"Songs","q":"Consider the following statements about Ohira folk music:\n1. Ohira is a folk music of Jharkhand, often sung during popular festivals and dedicated to animals.\n2. Ohira is a traditional folk song of Kerala, performed during temple festivals.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Kerala has other folk traditions like Thiruvathira, Kolkali, Oppana, but not Ohira.","s":""},{"n":616,"t":"Songs","q":"Which folk music is a mix of Indian and western music and is popular in Goa?","o":["Mando","Pai songs","Pawada","Maand"],"a":0,"e":"Mando. It is a beautiful dance performance and represents the meeting point of Indian and western traditions. Other fairs and festivals of Goa include: Fatorpa Zatra, Shigmo Festival, Shirgao Jatra, Sao Joao Festival, Sangodd, Chikalkalo, and Tripurari Poornima. Marwar Festival (originally known as the Maand Festival) is celebrated in memory of the heroes of Rajasthan.","s":""},{"n":617,"t":"Songs","q":"Who has written the patriotic song ‘Sandese Aate Hai’?","o":["Irshad Kamil","Javed Akhtar","Gulzar","Sameer Anjan"],"a":1,"e":"Javed Akhtar. His other songs - Kandho Se Milte Hain Kandhe (Lakshya); Ye Jo Des Hai Tera (Swadesh). His awards: Padma Bhushan (2007), Padma Shri (1999). Some patriotic songs and writers: Sare Jahan Se Acha Hindustan Hamara- Muhammad Iqbal, Aye Mere Watan Ke Logo - Kavi Pradeep, Aye Watan Watan Mere Abaad Rahe Tu - Gulzar, I Love My India -Anand Bakshi, Teri mitti - Manoj Muntashir.","s":""},{"n":618,"t":"Songs","q":"Consider the following statements about Indian Classical Music:\n1. Dhrupad is a traditional vocal form of Hindustani Classical Music, not Carnatic Music.\n2. Varnam, Pallavi and Charana are important components of Hindustani Classical Music.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Varnam, Pallavi, Charana are associated with Carnatic Music, not","s":""},{"n":619,"t":"Songs","q":"'Pankhida' songs are sung by peasants of _____ while working on the fields.","o":["Bihar","Uttar Pradesh","Rajasthan","Odisha"],"a":2,"e":"Rajasthan. 'Pankhida' songs are an integral part of Rajasthani folk culture and are typically sung during agricultural activities like sowing, harvesting, and threshing. The peasants sing and speak while playing algoza and manjira. Indian folk music - Bhavageethe (Karnataka and Maharashtra), Bhangra and Giddha (Punjab), Lavani (Maharashtra), Alha (Madhya Pradesh) and Panihari, Pankhida and Maand (Rajasthan).","s":""},{"n":620,"t":"Songs","q":"___________ is a musical composition that expresses devotion through madhura bhakti.","o":["Tillana","Gita","Padam","Kriti"],"a":2,"e":"Padam. A musical composition can refer to an original piece, its structure, or the process of creating it. Tillana is a rhythmic Carnatic piece performed at the end of concerts, focusing on rhythm and tempo. Gita is a hymn, often from texts like the Bhagavad Gita. Kriti, another Carnatic composition, expresses various emotions, not limited to devotion.","s":""},{"n":621,"t":"Songs","q":"Which statement about Classical Carnatic Music is correct?","o":["The compositions are either in Telugu, Kannada, Tamil or Sanskrit.","The compositions are either in Marathi, Odia, Konkani or Bengali.","The compositions are either in Telugu, Malayalam, Hindi or Sanskrit.","The compositions are either in Malayalam, Marathi, Tamil or Bengali."],"a":0,"e":"Carnatic music in the South Indian languages, is a system of music commonly associated with South India, including the modern Indian states of Andhra Pradesh, Karnataka, Kerala, Tamil Nadu and portions of east and south Telangana and southern Odisha. Some Carnatic Singers: Dr. Nithyashree Mahadevan, Sudha Raghunathan, K J Yesudas, P Unni Krishnan, M Balamuralikrishna, Semmangudi Srinivasa Iyer, Bombay Jayashri, Aruna Sairam.","s":""},{"n":622,"t":"Songs","q":"Consider the following statements about Indian Classical Music:\n1. Svarajati is a style of Carnatic Music, consisting of three sections – Pallavi, Anupallavi and Charanam, usually devotional or heroic in theme.\n2. Dhrupad, Khayal, Tappa, Chaturang and Dhamar are important traditional styles of Carnatic Music.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 -Incorrect: Dhrupad, Khayal, Tappa, Chaturang, Dhamar are styles of Hindustani Music, not Carnatic.","s":""},{"n":623,"t":"Songs","q":"Which of the following is called the cyclic arrangement of time units in Hindustani Classical music?","o":["Tala","Raga","Jati","Alap"],"a":0,"e":"Tala. Jati is the classification of a Raag based on the number of notes employed in its Aaroh and Avroh. The Raga is a melodic scale composed of basic seven notes. The exposition preceding the composed verses is called alap. The major vocal forms associated with Hindustani classical music are the khayal, dhrupad, dhammar, Tarana and thumri.","s":""},{"n":624,"t":"Songs","q":"Consider the following statements about Carnatic Music:\n1. Padam in Carnatic music is a lyrical composition, usually in the form of a love poem, often expressing devotion or deep emotions.\n2. Padam in Carnatic music is primarily a patriotic poem sung to praise the motherland.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. A type of lyrical composition that often deals with themes of love, devotion, or emotions. It is known for its expressive and emotive qualities. Some key terminologies: raga, tala, krithi, varnam, pallavi, anupallavi, charanam, alapana, javali, tillana, swaram.","s":""},{"n":625,"t":"Songs","q":"Which statement about Syama Sastri is correct?","o":["His famous composition is Pancharatna Kritis.","His signature name was Guruguha.","A crater on planet mercury is named after him.","He is one among the trinity of Carnatic Music."],"a":3,"e":"The Trinity of Carnatic Music are also known as the three Jewels of Carnatic Music. They are credited with creating a new era in Carnatic music history by bringing about a noticeable change in the existing tradition. Tyagaraja: A Telugu composer known for his Pancharatna Kritis. Muthuswami Dikshitar: A Sanskrit and Manipravalam composer. Syama Sastri: A Telugu and Sanskrit composer.","s":""},{"n":626,"t":"Songs","q":"How many basic talams are there in Indian Classical Carnatic music?","o":["7","11","37","21"],"a":0,"e":"7 talas in Carnatic music: Dhruva, Matya, Jampa, Ata, Triputa, Rupaka, Eka. Carnatic Music: Composed of a system of Ragam (Raga) and Thalam (Tala), it has a rich history and tradition. It developed in states of Tamil Nadu, Kerala, Andhra Pradesh and Karnataka.","s":""},{"n":627,"t":"Songs","q":"Consider the following statements about folk traditions of Bihar and Uttar Pradesh:\n1. Sohar is a traditional folk song sung in Bihar and Uttar Pradesh on the occasion of a child’s birth.\n2. Kohbar refers to a wall-painting tradition in Bihar, Jharkhand, and Eastern Uttar Pradesh, usually painted in the bridal chamber for marriage rituals.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":628,"t":"Songs","q":"What is Miyan ki Todi in Hindustani music ?","o":["Kirtan","Tanam","Chhand","Raag"],"a":3,"e":"Raag. Miyan ki Todi, often simply referred to as Todi or Darbari Todi is a Hindustani classical raga which gave its name to the Todi thaat, one of the ten types of classical music according to the musicologist Bhatkhande. Ragas from the Todi raganga (class of ragas) include Bilaskhani Todi, Gujari Todi (also called Gurjari Todi), Desi Todi, Hussaini Todi, Asavari Todi and Bahaduri Todi.","s":""},{"n":629,"t":"Songs","q":"Consider the following statements about Indian folk music:\n1. Maand is a folk music tradition of Gujarat, mainly performed during Navaratri with sticks (dandiyas).\n2. Lavani is a folk music and dance form of Rajasthan, developed in the royal courts of Jaipur.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Statement 1 – Incorrect: Maand belongs to Rajasthan, not Gujarat. It developed in the royal courts and is compared to Thumri and Ghazal. Statement 2 – Incorrect: Lavani is from Maharashtra, not Rajasthan. It is known for its powerful rhythm and expressive dance style.","s":""},{"n":630,"t":"Songs","q":"In which Gharana do singers perform the Khandhar Vani and Gauhar Vani?","o":["Dagari Gharana","Bettiah Gharana","Talwandi Gharana","Darbhanga Gharana"],"a":3,"e":"Darbhanga Gharana. It originated in Darbhanga, Bihar in the 17th-century. It is a gharana of the Hindustani classical music dhrupad thought to have been started by Radhakrishna and Kartaram. Gauhar vani developed the raga or unadorned melodic figures. The Dagarvani emphasized melodic curves and graces. The Khandar vani specialised in quick ornamentation of the notes.","s":""},{"n":631,"t":"Songs","q":"To which Hindustani music Gharana are the Gundecha brothers related?","o":["Patiala Gharana","Agra Gharana","Dagari Gharana","Indore Gharana"],"a":2,"e":"Dagari Gharana. Umakant and Ramakant Gundecha are together known as the Gundecha Brothers . They received the Sangeet natak academy award in 2017. Hindustani Music Gharanas and founders: Gwalior (Nanthan Khan); Agra (Hajisujan Khan); Rangeela (Faiyyaz Khan); Jaipur Atrauli (Alladiya Khan); Kirana (Abdul Wahid Khan).","s":""},{"n":632,"t":"Songs","q":"Consider the following statements about Hindustani Music:\n1. In Hindustani Classical Music, different Ragas are allotted to specific hours of the day and also associated with different seasons.\n2. Varnam is the form used for time-allocation of ragas in Hindustani Music.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Varnam belongs to Carnatic music, not Hindustani, and has nothing to do with raga time-allocation.","s":""},{"n":633,"t":"Songs","q":"Consider the following statements about patriotic songs and slogans in India:\n1. The patriotic song “Sare Jahan Se Achha Hindustan Hamara” was written by Muhammad Iqbal (Allama Iqbal) and first published in the weekly journal Ittehad on 16 August 1904.\n2. The slogan “Inquilab Zindabad” was popularized by Bhagat Singh, one of the most iconic revolutionaries of India’s freedom struggle.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":634,"t":"Songs","q":"'The forty minutes raga’ is an album composed by _________ .","o":["Bhimsen Joshi","Hariprasad Chaurasia","Ali Akbar Khan","Amjad Ali Khan"],"a":2,"e":"Ali Akbar Khan (Sarod player). He was an Indian Hindustani classical musician of the Maihar gharana. His other Album name : Garden of Dreams, In Concert 1972, The 80 Minute Raga, Shree Rag. His awards : Padma Vibhushan (1989), Padma Bhushan (1967). Other Indian sarod players : Amjad Ali Khan, Amaan Ali Khan, Satyaki Banerjee.","s":""},{"n":635,"t":"Songs","q":"Who is the author of the poetry 'Chand Pukhraj Ka'?","o":["Anand Bakshi","Gulzar","Gurmel Singh","Shailendra"],"a":1,"e":"Gulzar. His awards : Dadasaheb Phalke Award in 2013; Padma Bhushan in 2004; Sahitya Akademi Award for Urdu in 2002. His other Poems - Triveni, Raat Pashmine Ki, Suspected Poems. Anand Bakshi -Nagme, Kisse, Baatein, Yaadein. Gurmel Singh - Economic Liberalisation and Indian Agriculture. Shailendra - Na Bairi Na Koi Begana.","s":""},{"n":636,"t":"Songs","q":"Who was the singer of the famous song 'Mere Desh Ki Dharti Sona Ugle' from the film 'Upkar' (1967) ?","o":["KJ Yesudas","Suresh Wadkar","Manna Dey","Mahendra Kapoor"],"a":3,"e":"Mahendra Kapoor (Indian playback singer) received Padma Shri (1972). Famous Patriotic songs: \"Hai preet jahan ki reet sada, main geet wahan ke gata hoon\" (Mahendra Kapoor), “Des rangila\" (Mahalakshmi Iyer), \"Maa tujhe salam\" (AR Rahman), \"Kar chale hum fida jaan-o-tan saathiyon” (Mohammed Rafi), \"Aye mere pyare watan, aye mere bichchde chaman, tujhpe dil qurban\" (Manna Dey).","s":""},{"n":637,"t":"Songs","q":"Consider the following statements about Rabindra Sangeet:\n1. Rabindra Sangeet refers to the songs written and composed by Rabindranath Tagore, blending Indian classical music with folk traditions of Bengal.\n2. Popular folk music traditions of West Bengal include Bhatiali (sung by fishermen/boatmen) and Baul songs (by wandering minstrels).\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":638,"t":"Songs","q":"Who is credited with creating the popular Raga Miya Ki Malhar?","o":["Tansen","Amir Khusrau","Meera Bai","Zakir Hussain"],"a":0,"e":"Tansen. Compositions -Darbari Kanhra (night raga), Mian Ki Todi (morning raga), Mian ki Sarang (mid-day raga). Miya ki Malhar (seasonal raga).","s":""},{"n":639,"t":"Songs","q":"Carnatic music is confined to____.","o":["Karnataka, Maharashtra, Gujarat and Rajasthan","Uttar Pradesh, Bihar, West Bengal and Haryana","Gujarat, Maharashtra, Rajasthan and Haryana","Karnataka, Andhra Pradesh, Tamil Nadu and Kerala"],"a":3,"e":"Carnatic Music : It is accompanied by instruments such as the flute, veena, nadaswaram, mridangam and ghatam. Purandaradasa is considered to be the father of Carnatic music.","s":""},{"n":640,"t":"Songs","q":"Consider the following statements about folk songs of India:\n1. Bihu songs are the most distinctive type of folk songs of Assam, celebrating fertility, agriculture, and the life-sustaining character of the Brahmaputra.\n2. Bhuta songs belong to Assam and are sung to celebrate the harvest season.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Bhuta songs belong to Kerala, not Assam, and are based on rituals to drive away evil spirits.","s":""},{"n":641,"t":"Songs","q":"Consider the following statements about Qawwali music:\n1. Qawwali originated from Persia and was brought to India, where it flourished as a form of devotional Sufi music.\n2. Amir Khusrau is popularly acknowledged as the father of Qawwali, while Nusrat Fateh Ali Khan is known as “Shahenshah-e-Qawwali.”\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":642,"t":"Songs","q":"Which of the following pairs of Thumri Singing-characteristics is correct ? I. Poorab - fairly slow and staid II. Punjab - more mercurial","o":["Only I","Both I and II","Only II","Neither I nor II"],"a":1,"e":"Both (I) and (II). The thumri is another North Indian vocal form and is based on the romantic-devotional literature inspired by the bhakti movement. The text is usually derived from the Radha-Krishna theme and is of primary importance.","s":""},{"n":643,"t":"Songs","q":"______ is a vocal form of music from the state of Punjab.","o":["Qawwali","Ghazal","Tappa","Bhajan"],"a":2,"e":"Tappa . The ghazal is a form of amatory poem or ode, originating in Arabic poetry. Bhajan refers to any devotional song with a religious theme or spiritual ideas, specifically among Indian religions, in any language.","s":""},{"n":644,"t":"Songs","q":"Lalita is a form of folk music from ______.","o":["Madhya Pradesh","Rajasthan","Maharashtra","Gujarat"],"a":2,"e":"Maharashtra. Famous folk music of Maharashtra are Bhajan, Bharud, Gondhal, Kirtan, Lalita, Abhangas and Tumbadi singing.","s":""},{"n":645,"t":"Songs","q":"Which of the following is a folk song genre popular in parts of West Bengal, Assam and Bangladesh?","o":["Chalo","Roppi","Bhawaiya","Rekham Pada"],"a":2,"e":"Bhawaiya . Chalo (folk song of Haryana). Baul (Bengal), Lavani (Maharashtra), Bhavgeet (Karnataka), Nattupura Pattu (Tamil Nadu), Zeliang (Nagaland), Maand (Rajasthan), Kajari (Uttar Pradesh, Bihar), Baryi (Arunachal Pradesh).","s":""},{"n":646,"t":"Songs","q":"Owi, a typical folk song which is made up of couplets describing women’s maternal and marital homes and is sung by village womenfolk while performing routine chores throughout the day, belongs to which state?","o":["Mizoram","Goa","Assam","Maharashtra"],"a":3,"e":"Maharashtra.","s":""},{"n":647,"t":"Songs","q":"Which of the following is a form of devotional poetry sung in praise of God Vithoba?","o":["Shabad","Abhang","Tevaram","Bhatiali"],"a":1,"e":"Abhangs are sung during the pilgrimage to the temples of Pandharpur, by the devotees. Tevaram - The Ancient Tamil Shaivite Devotional Hymns of Tamil Sangam Period. Shabads are devotional songs of the Sikhs sung in gurdwaras or religious occasions.","s":""},{"n":648,"t":"Songs","q":"Consider the following statements about Bhalari folk song:\n1. Bhalari is a folk song of Maharashtra, sung by farmers while working in their fields.\n2. Bhalari belongs to Rajasthan and is sung during royal ceremonies.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Rajasthan’s popular folk forms include Maand, Panihari, Ghoomar, not Bhalari.","s":""},{"n":649,"t":"Songs","q":"Consider the following statements about Padavali Kirtan:\n1. Padavali Kirtan refers to songs composed in Bengal between the 15th–17th centuries in praise of Lord Vishnu, especially Krishna.\n2. The term Padavali literally means “gathering of songs.”\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":650,"t":"Songs","q":"Consider the following statements about Shadava Raga:\n1. A Shadava Raga has six notes in its scale.\n2. There are more than 80 ragas in Indian classical music, with Shadava being one of the important types.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":651,"t":"Painting/ Dress/ Tribes","q":"Which architectural style is best described by the following features: ribbed vaults, pointed arches, flying buttresses, and stained-glass windows ?","o":["Mughal","Deccan","Indo-Islamic","Gothic"],"a":3,"e":"Gothic. The Gothic style of architecture originated in Europe and is characterized by ribbed vaults, pointed arches, flying buttresses, and stained-glass windows. European colonists, especially the British, introduced the Gothic style in India during the colonial period. This style merged with Indian elements, resulting in the Indo-Gothic (Victorian) style. Indo-Gothic (Victorian) Style Features: Large and elaborate constructions with thinner walls than Indo-Islamic. Pointed arches instead of curved ones. Spacious windows and cruciform (cross-shaped) church plans. Use of modern materials like steel, iron, and poured concrete. Examples: Victoria Memorial (Kolkata), Gateway of India (Mumbai), Chhatrapati Shivaji Terminus (Mumbai).","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":652,"t":"Painting/ Dress/ Tribes","q":"Which of the following correctly pairs a monument with its architectural style?","o":["Khajuraho Temples - French","Qutub Minar - Indo-Islamic","India Gate - Rajput","Lotus Temple - Mughal"],"a":1,"e":"Qutub Minar - Indo-Islamic. The Khajuraho Temples belong to the Nagara style of Hindu temple architecture, not French. The Qutub Minar in Delhi, built by Qutb-ud-din Aibak and completed by Iltutmish, is an outstanding example of Indo-Islamic architecture combining Islamic motifs with Indian craftsmanship. The India Gate in New Delhi was designed by Sir Edwin Lutyens and reflects the Indo-European/Colonial style, not Rajput. The Lotus Temple, built in 1986, belongs to the modern expressionist style of the Bahá’í faith, not Mughal.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":653,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about Elelakkaradi dance:\n1. Elelakkaradi is a folk dance of Kerala performed by the Irular tribe, which depicts the fight of villagers against wild bears attacking their hamlets.\n2. Elelakkaradi is a devotional dance of the Kurumba tribe, performed in temples to worship Lord Shiva.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: It is not a temple-based devotional dance of the Kurumba tribe; rather it is a tribal performance of Irulars.","s":""},{"n":654,"t":"Painting/ Dress/ Tribes","q":"Which country do the ‘Veddas’ traditional forest dwellers who foraged, hunted and lived in close-knit groups in caves in the dense jungles?","o":["Sri Lanka","Nepal","Myanmar","Bhutan"],"a":0,"e":"Sri Lanka. Some tribes from different countries : Nepal - Tamang, Newar, Tharu, Rai, Limbu, and Bhutia. Myanmar - Burmese, Rakhine, Kachin, Danu, Lisu. Bhutan - Monpa, Brokpa, Bumthangpa, Tibetans. Pakistan -Pashtuns, Sindhis, Muhajirs.","s":""},{"n":655,"t":"Painting/ Dress/ Tribes","q":"In which state is the Raika tribe found?","o":["Kerala","Manipur","West Bengal","Rajasthan"],"a":3,"e":"Rajasthan. The Raika tribe is renowned for herding animals, particularly camels, sheep, and goats. Other tribes of Rajasthan: Minas, Damor, Dhanka, Garasia, Kathodi etc.","s":""},{"n":656,"t":"Painting/ Dress/ Tribes","q":"Which of the following tribes does NOT live in India?","o":["Maasai","Tharu","Gond","Santhal"],"a":0,"e":"Maasai. The Maasai are a semi-nomadic ethnic group living in southern Kenya and northern Tanzania, near the shores of Lake Victoria and other African Great Lakes.\" Region wise Tribes of India : Western region - Bhil, Gond, and Koli; South region - Toda, Kurumba, and Irula; Eastern region -Munda, Santhal, and Oraon; Central region - Baiga, Muria, Gonds.","s":""},{"n":657,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about harvest festivals in India:\n1. Gaan-Ngai is a post-harvest festival celebrated by the Zeliangrong tribe of Manipur, Nagaland, and Assam, usually in December or January.\n2. Maghi is a harvest/winter festival celebrated in Punjab, observed in January, marked by fairs, rituals, and community feasting.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":658,"t":"Painting/ Dress/ Tribes","q":"With the arrival of spring, _______ villages dance to the melodious singing of 'Bagurumba'.","o":["Bodo","Khasi","Garo","Karbi"],"a":0,"e":"Bodo. Other tribes and their dances : Khasi - Nongkrem dance. Garo -Wangala dance. Karbi - Domahi Kikang dance.","s":""},{"n":659,"t":"Painting/ Dress/ Tribes","q":"Santhal community is an ethnic group of ________ India.","o":["eastern","northern","southern","western"],"a":0,"e":"Eastern. Santhal community is primarily found in the states of Jharkhand, West Bengal, Odisha, and Bihar. Tribes in five distinct regions are : Himalayan region (Gaddi, the Jaunsari, the Naga, etc.), Middle India (Munda, the Santhal), Western India (Bhil, the Grasia), South Indian Region (Toda, the Chenchu) and the Islands Region (with tribes like the Onge in Bay of Bengal). Highest Scheduled Tribes Populated state -Madhya Pradesh.","s":""},{"n":660,"t":"Painting/ Dress/ Tribes","q":"Match the following regions of India with their tribes: Region of India Tribes\nA. North-Eastern 1. Toda, Kurumba, Region Irula\nB. Western Region 2. Bhil, Gond, Koli\nC. South Region 3. Garo, Khasi, Jaintia\nD. Eastern Region 4. Munda, Santhal, Oraon","o":["A–3, B–2, C–1, D–4","A–2, B–3, C–4, D–1","A–4, B–1, C–2, D–3","A–1, B–4, C–3, D–2"],"a":0,"e":"A–3, B–2, C–1, D–4.","s":""},{"n":661,"t":"Painting/ Dress/ Tribes","q":"Which of the following is NOT a major tribe of South India?","o":["Dang","Toda","Badaga","Irula"],"a":0,"e":"Dang (Gujarat) . Major tribes:-Tamil Nadu - Irulas, Badagas, Todas, Kotas, Kurumbas; Andhra Pradesh Arunachal Pradesh - Apatanis, abor, Dafla, Galong, Momba, Tagin; Assam -Bodo, Chakma, Dimasa, Hajong, Garos, Khasis. Major facts: The Gond and Bhil comprise the largest tribal group of India. The smallest tribal community is the Andamanese.","s":""},{"n":662,"t":"Painting/ Dress/ Tribes","q":"Which of the following tribes belongs to the Indo - European Linguistic family ?","o":["Garo","Gondi","Korwa","Bhil"],"a":3,"e":"Bhil. They are considered as one of the oldest tribes in India. They were mainly found in parts of Rajasthan, Gujarat, Malwa, Madhya Pradesh and Bihar. Pahari Korwa is mainly concentrated in Jashpur, Sarguja and Raigarh districts of Chhattisgarh. They are a branch of the Kolarian tribe and speak Mundari language.","s":""},{"n":663,"t":"Painting/ Dress/ Tribes","q":"Match the following folk paintings with their respective states: Folk Painting State\nA. Warli Painting 1. Odisha\nB. Madhubani 2. Madhya Pradesh Painting\nC. Pattachitra Art 3. Bihar\nD. Gond Paintin 4. Maharashtra","o":["A–4, B–3, C–1, D–2","A–3, B–2, C–4, D–1","A–1, B–4, C–2, D–3","A–2, B–1, C–3, D–4"],"a":0,"e":"A–4, B–3, C–1, D–2.","s":""},{"n":664,"t":"Painting/ Dress/ Tribes","q":"Thangka painting style depicts _________ deity.","o":["Islamic","Buddhist","Jewish","Hindu"],"a":1,"e":"Buddhist. Thangka Painting is a Tibetan Buddhist Painting painted on cotton and silk cloths. Kalighat Painting -Calcutta.","s":""},{"n":665,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about Indian folk paintings:\n1. Bhiti Chitra (fresco painting) is a popular art form of Haryana, with examples found in Mata Mansa Devi Temple, Kalayat Kapil Muni Temple, and havelis at Bhiwani.\n2. Paitkar painting is a traditional scroll painting of Jharkhand, also seen in bordering regions of West Bengal and Odisha, and is regarded as one of the oldest tribal paintings of India.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":666,"t":"Painting/ Dress/ Tribes","q":"To which of the following states do 'Kajali Paintings', in which no brush is used, traditionally belong ?","o":["Jharkhand","Tamil Nadu","Kerala","Rajasthan"],"a":3,"e":"Rajasthan. Kajali paintings are made from black kajal and stone colors, and require extensive hard work and expert hands.","s":""},{"n":667,"t":"Painting/ Dress/ Tribes","q":"Which one of the following is a ritual folk art traditional to the state of Kerala?","o":["Margomkali","Manjari","Phad","Pithora"],"a":0,"e":"Margomkali is a ritual folk art of the Syrian Christians of Kottayam and Thrissur districts.","s":""},{"n":668,"t":"Painting/ Dress/ Tribes","q":"Which goats' underfur is woven into fine shawls called Pashmina shawls?","o":["Kashmiri goat","Jamnapari goat","Alpine goat","Boer goat"],"a":0,"e":"Kashmiri goat. The Changthangi goat of Ladakh which produces the finest fibre or cashmere also called pashmina wool. The best quality pashmina shawls are found in Kashmir.","s":""},{"n":669,"t":"Painting/ Dress/ Tribes","q":"‘Jadopatiya’ is a form of ______ popular in the state of Jharkhand.","o":["music","dance","painting","sculpture"],"a":2,"e":"Painting . These paintings are generally practiced by the Santhals in which the artisans make scrolls called Jado or Jadopatia and are drawn with natural inks and colors.","s":""},{"n":670,"t":"Painting/ Dress/ Tribes","q":"'Eravalla, Kadar, Muduvar' are languages spoken by the tribes primarily in the state of ______.","o":["Tamil Nadu","Kerala","Karnataka","Maharashtra"],"a":0,"e":"Tamil Nadu - is also home to tribal languages such as Irula, Kurumba, Badaga, Yerukala, Sholaga, Kanikaran, Malsar, Malapandaram, Wayanad Chetti, Muthuvan, Toda, and Kota.","s":""},{"n":671,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about tribes of India:\n1. Jarawa and Onge tribes are indigenous tribes of the Andaman and Nicobar Islands.\n2. The Shompen and Sentinelese are also among the tribes of the Andaman and Nicobar Islands.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":672,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about traditional tribal culture:\n1. Bauche is a bridegroom’s sword traditionally worn during tribal wedding ceremonies in Arunachal Pradesh.\n2. Traditional attire of Assam is Mekhela Chador, while Risa and Rikutu belong to the cultural dress of Tripura.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Traditional dresses : Mekhela Chador (Assam), Pheran (Jammu and Kashmir), Mundum Neriyathum (Kerala), Ghagra Choli (Haryana), Chaniyo Choli (Gujarat), Nauwari Saddi or Lugda (Maharashtra), Nauvari (Goa), Jiasen or Dhara (Meghalaya), Risa and Rikutu- (Tripura).","s":""},{"n":673,"t":"Painting/ Dress/ Tribes","q":"Which of the following pairs is INCORRECT with reference to paintings in India?","o":["Saura Paintings – Odisha","Bagh Paintings – Madhya Pradesh","Phad Paintings – Rajasthan","Guler Paintings – Karnataka"],"a":3,"e":"Guler State is famous as the birthplace of Kangra painting in the first half of the 18th century when a family of Kashmiri painters trained in Mughal painting sought shelter at the court of Raja Dalip Singh. It is famous in Himachal Pradesh.","s":""},{"n":674,"t":"Painting/ Dress/ Tribes","q":"Languages like Nyishi, Apatani and Bokar are widely spoken in ______.","o":["Mizoram","Arunachal Pradesh","Nagaland","Assam"],"a":1,"e":"Arunachal Pradesh. Nyishi, Apatani and Bokar fall under the Tani dialect which is a type of Tibeto-Burman Language and is widely spoken in Arunachal Pradesh.","s":""},{"n":675,"t":"Painting/ Dress/ Tribes","q":"______ is one of the important crafts of Uttar Pradesh which entails delicate traditional hand embroidery on fabrics like chiffon, muslin, organza, organdie and silk.","o":["Knitting","Crochet","Chikankari","Needle lace"],"a":2,"e":"Chikankari . Chikan in literal sense means embroidery. This art form is known to be introduced by Mughals.","s":""},{"n":676,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about world famous personalities:\n1. Pablo Picasso, Claude Monet, Salvador Dali, and Vincent Van Gogh are renowned for their artwork and painting styles, each representing unique art movements.\n2. Claude Monet is considered the founder of Impressionist painting, while Pablo Picasso is associated with Cubism.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":677,"t":"Painting/ Dress/ Tribes","q":"Chenchus schedule tribe belongs to which state of India?","o":["West Bengal","Kerala","Nagaland","Telangana"],"a":3,"e":"Telangana. Chenchus are Adivasi, a designated Scheduled Tribe in the Indian states of Andhra Pradesh, Telangana, Karnataka and Odisha.","s":""},{"n":678,"t":"Painting/ Dress/ Tribes","q":"Prolific Indian Painter Maqbool Fida Hussain predominantly used which of these animals to depict a lively and free spirit in his paintings?","o":["Tigers","Cows","Elephants","Horses"],"a":3,"e":"Horses . Maqbool Fida Hussain was awarded Padma Shri in 1966, Padma Bhushan in 1973 and Padma Vibhushan in 1991. His Paintings :- Mother Teresa, Madhuri Dixit, Hindu Deities, Battle of Ganga and Jamuna, Krishna, Bharat Mata.","s":""},{"n":679,"t":"Painting/ Dress/ Tribes","q":"The process of coating grooves or engravings in ornaments with coloured enamels is called________.","o":["Phulkari","Zardozi","Meenakari","Chikankari"],"a":2,"e":"Meenakari designing basically refers to the process of coating grooves or engravings in ornaments with colored enamels.","s":""},{"n":680,"t":"Painting/ Dress/ Tribes","q":"Consider the following statements about Sanskrit plays:\n1. Mricchakatika (The Little Clay Cart), a social drama with realistic touches, was written by Sudraka.\n2. Sudraka is also credited with two other works – Vinavasavadatta and a bhana (one-act monologue) called Padmaprabhritaka.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":681,"t":"First in India/World","q":"Who became Indian Navy's first woman fighter pilot streamer on 3 July 2025?","o":["Bina Kumari","Vidya Singh","Neha Sharma","Aastha Poonia"],"a":3,"e":"Aastha Poonia. She trained to operate MiG-29K jets from aircraft carriers, making her the first woman in a combat fighter role in the Indian Navy. Lieutenant Shivangi (2019) became the first woman pilot in the Indian Navy, flying Dornier maritime reconnaissance aircraft, marking the entry of women into naval aviation, though in a non-combat role.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":682,"t":"First in India/World","q":"Which year was the first World Happiness Report published ?","o":["2012","2016","2010","2005"],"a":0,"e":"2012. The Wellbeing Research Centre at the University of Oxford in partnership with Gallup, the UN Sustainable Development Solutions Network (UNSDSN) has published the World Happiness Report (WHR) 2025 on World Happiness Day (20th March). Happiest Countries: Finland (8th consecutive year), followed by Denmark, Iceland, and Sweden. India’s Ranking: 118th (2025), 126th in 2024. South Asian Nations Ranking: Nepal (92nd), Pakistan (109th), Myanmar (126th), Sri Lanka (133th), Bangladesh (134th). Bottom Countries: Afghanistan (147th) (4th consecutive year).","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":683,"t":"First in India/World","q":"Anna Chandy, the first Indian woman to serve as a judge at a high court was appointed in which High Court?","o":["West Bengal","Kerala","Tamil Nadu","Andhra Pradesh"],"a":1,"e":"Kerala. She was the first female judge in India, the first woman to become a judge of a High Court. She became the founder and editor of the journal (Shreemati) in which she supported women's rights. Justice Leila Seth was the first woman to be Chief Justice of a High Court. Fathima Beevi is the first female judge of the Supreme Court of India.","s":""},{"n":684,"t":"First in India/World","q":"Ranjana Prakash Desai who became the first woman chairperson of the Press Council of India originally worked in which of the following organs of the government?","o":["Legislature","Judiciary","Vigilance","Executive"],"a":1,"e":"Judiciary. Ranjana Prakash Desai was a retired Judge of the Supreme Court of India and the head of the Delimitation Commission of India. Press Council of India (PCI): It is a statutory body created by the Press Council Act of 1978. It acts as an apex body for regulation of the press in the country.","s":""},{"n":685,"t":"First in India/World","q":"Which of the following is the first Indian woman Grandmaster in Chess ?","o":["Harika Dronavalli","S Vijayalakshmi","Tania Sachdev","R Vaishali"],"a":1,"e":"S Vijayalakshmi. She is an Indian chess player holding the FIDE titles of International Master (IM) and Woman Grandmaster (WGM). Notable Indian female chess players include Koneru Humpy, Vaishali Rameshbabu, Harika Dronavalli, Eesha Karavade, Divya Deshmukh, and Mary Ann Gomes.","s":""},{"n":686,"t":"First in India/World","q":"Consider the following statements regarding Indian Badminton players:\n1. Saina Nehwal is the only Indian woman who has been ranked world's No.1 for badminton.\n2. PV Sindhu has also achieved the world No.1 ranking in Badminton. Which of the statement(s) given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect as PV Sindhu has not been ranked world No.1; she has reached a career-high ranking of World No. 2.","s":""},{"n":687,"t":"First in India/World","q":"Consider the following statements regarding Indian women wrestlers:\n1. Geeta Phogat was the first Indian woman wrestler to win Gold at the Commonwealth Games.\n2. She achieved this feat in the 2014 Commonwealth Games. Which of the statement(s) given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect as she achieved this feat at the 2010 Commonwealth Games, not in 2014.","s":""},{"n":688,"t":"First in India/World","q":"Who was the first Indian woman wrestler to win a medal at the Olympics ?","o":["Babita Phogat","Sakshi Malik","Alka Tomar","Geeta Phogat"],"a":1,"e":"Sakshi Malik. She won the bronze medal in the 58 kg category at the 2016 Rio Olympics. In 2010, Geeta Phogat became the first female Indian wrestler to win gold at the Commonwealth Games.","s":""},{"n":689,"t":"First in India/World","q":"Who was the first Indian wrestler to win Gold at the World Championships in 2010?","o":["Geeta Phogat","Sushil Kumar","Alka Tomar","Bajrang Punia"],"a":1,"e":"Sushil Kumar. He made history in the 2010 World Wrestling Championships by winning the top spot in the men's freestyle 66kg category in Moscow, Russia. He also won a silver medal at the London Olympics in 2012.","s":""},{"n":690,"t":"First in India/World","q":"India's first indigenous Aircraft Carrier, _____, conducted its maiden sea travel in August 2021 marking a significant step towards making military equipment in India.","o":["INS Vayudooth","INS Swades","INS Kranti","INS Vikrant"],"a":3,"e":"INS Vikrant. It was designed and built by Cochin Shipyard Limited (CSL) Kochi, Kerala and launched into water in 2013.","s":""},{"n":691,"t":"First in India/World","q":"Which of the following airports is being built as India's first 'carbon-neutral airport'?","o":["Kangra airport","Leh airport","Jammu airport","Srinagar airport"],"a":1,"e":"Leh airport. Carbon neutrality means that the amount of carbon released into the atmosphere is equal to the amount of carbon that is absorbed by carbon sinks. Indira Gandhi International Airport (IGIA) in Delhi is the first airport in India to achieve net zero carbon emission status. The Airports Authority of India (AAI) is a statutory body constituted under the Airports Authority of India Act, 1994. Founded - 1 April\n1995. Headquarters - Rajiv Gandhi Bhawan (New Delhi).","s":""},{"n":692,"t":"First in India/World","q":"Consider the following statements about Indian wrestling history:\n1. Udey Chand was the first Indian wrestler to win a medal at the World Wrestling Championships, securing a bronze in the men’s freestyle 67 kg category at Yokohama, Japan in 1961.\n2. KD Jadhav won India’s first individual Olympic medal in wrestling at the 1964 Tokyo Olympics.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 -Incorrect: KD Jadhav won his bronze medal in wrestling at the 1952 Helsinki Olympics, not at the 1964 Tokyo Olympics.","s":""},{"n":693,"t":"First in India/World","q":"Who was the chief guest at the first Republic Day celebration of India in 1950?","o":["Gamal Abdel Nasser","Kwame Nkrumah","Josip Broz Tito","Sukarno"],"a":3,"e":"Sukarno (Indonesian President). Republic Day is a national holiday in India commemorating the adoption of the Constitution of India, and the country's transition to a republic which came into effect on 26 January\n1950. Between 1950 and 1954, Republic Day parades were held at Irwin Stadium (now National Stadium), Kingsway, Red Fort and Ramlila Maidan. King Tribhuvan Bir Bikram Shah of Nepal - Second Chief Guest of the Republic Day Parade in 1951.","s":""},{"n":694,"t":"First in India/World","q":"The first train steamed off from Mumbai to ______.","o":["Pune","Malad","Thane","Nagpur"],"a":2,"e":"Thane. The first passenger train in India departed from Mumbai to Thane on April 16, 1853, covering a distance of 34 kilometers. It was operated by three locomotives named Sahib, Sultan, and Sindh, under the Great Indian Peninsula (GIP) Railway company. The concept of laying a railway line between Mumbai and Thane, extending to Kalyan and Bhor Ghat, was proposed by George Clark in 1843. Lord Dalhousie is recognized as the father of Indian Railways, while John Mathai was the first railway minister of India.","s":""},{"n":695,"t":"First in India/World","q":"In which of the following cities has India's first underwater train project been launched ?","o":["Patna","Kolkata","Allahabad","Haridwar"],"a":1,"e":"Kolkata. Underwater train project: It is part of the Kolkata Metro's East-West Corridor. The underwater section of the tunnel passes under the Hooghly River.","s":""},{"n":696,"t":"First in India/World","q":"Who was the first defence minister of India?","o":["Kailash Nath Katju","Baldev Singh","YB Chavan","Swaran Singh"],"a":1,"e":"Sardar Baldev Singh. First Cabinet of Free India 1947:- Jawaharlal Nehru (Prime Minister: External Affairs & Commonwealth Relations, Scientific Research), Sardar Vallabhbhai Patel (Home Minister, Information And Broadcasting, States), Dr. Rajendra Prasad (Food And Agriculture), Maulana Abul Kalam Azad (Education), Dr. John Mathai (Railways And Transport), R.K Shanmugham Chetty (Finance), Dr. B R Ambedkar (Law), Jagjivan Ram (Labour), C.H. Bhabha (Commerce), Raj Kumari Amrit Kaur (Health), Rafi Ahmed Kidwai (Communication), Dr. Shyam Prasad Mukherji (Industries And Supplies), V.N Gadgil (Works, Mines & Power).","s":""},{"n":697,"t":"First in India/World","q":"Who among the following was the first president of the IOC ?","o":["Demetrius Vikelas","Lord Killanin","Pierre, Baron de Coubertin","Avery Brundage"],"a":0,"e":"Demetrius Vikelas. The International Olympic Committee (IOC): Founded: 23 June 1894, Headquarters: Lausanne (Switzerland). The first Olympic games were held on 6 April 1896 in Athens. India first participated in the Olympics in 1900 in Paris. Pierre de Coubertin (second president IOC).","s":""},{"n":698,"t":"First in India/World","q":"When was the first World Weightlifting Championship organized by the World Weightlifting Federation in London, UK?","o":["March 1991","March 1891","March 2000","March 1895"],"a":1,"e":"March 1891 - Only Men’s competition. The first World Weightlifting Championships for women took place in the United States in 1987. International Weightlifting Federation (IWF) founded in\n1905. Indian Weightlifting Federation formed in 1935.","s":""},{"n":699,"t":"First in India/World","q":"Consider the following statements about broadcasting in India:\n1. The first radio show in India was broadcast by the Radio Club of Bombay in June 1923.\n2. The Indian Broadcasting Company (IBC) was established on 23 July 1927.\n3. All India Radio (AIR) was founded in 1923 and later renamed as Akashvani in 1936.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Statement 3 – Incorrect: All India Radio (AIR) was founded in 1936, not in 1923. It was renamed Akashvani in 1957, not at the time of its founding.","s":""},{"n":700,"t":"First in India/World","q":"Which of the following airports is India's first to be completely powered by solar energy?","o":["KempeGowda International Airport (KIA), Bangalore","Indira Gandhi International Airport (IGIA), Delhi","Cochin International Airport Limited (CIAL), Kerala","Chhatrapati Shivaji Maharaj International Airport (CSMIA), Mumbai"],"a":2,"e":"Cochin International Airport (CIAL), Kerala. Other Indian Airports : Indira Gandhi International Airport (Delhi), Chhatrapati Shivaji Maharaj International Airport (Mumbai), Kempegowda International Airport (Bengaluru), Rajiv Gandhi International Airport (Hyderabad). World's busiest airport (in passenger terms) - Atlanta's Hartsfield-Jackson international airport.","s":""},{"n":701,"t":"First in India/World","q":"Which of the following is India's first all-women-managed railway station?","o":["Chennai Egmore Railway Station, Chennai","Gandhinagar Railway Station, Jaipur","Trivandrum Central Railway Station, Thiruvananthapuram","Matunga Railway Station, Mumbai"],"a":1,"e":"Gandhinagar Railway Station, Jaipur. Matunga Railway Station, Mumbai is also managed by all women crew in the sub-urban category. Surekha Yadav became the country's first female train driver in 1988, also Asia's first female locomotive pilot.","s":""},{"n":702,"t":"First in India/World","q":"Who was appointed as the first woman Vice-Chancellor of Jawaharlal Nehru University (JNU), New Delhi ?","o":["Geeta Bhat","Jayati Ghosh","Utsa Patnaik","Santishree Pandit"],"a":1,"e":"1960. The first Paralympic Games - Rome (Italy). First winter Paralympics Games - Sweden (1976).","s":""},{"n":704,"t":"First in India/World","q":"Who was behind publishing the first newspaper in India?","o":["Deen Bandhu Mitra","James Augustus Hickey","Hem Chandrakar","Harishchandra Mukherjee"],"a":1,"e":"James Augustus Hickey -Bengal Gazette was published in Calcutta in 1780. It was a weekly English newspaper started by an Irishman. Udant Martand (The Rising Sun) - The first Hindi-language weekly newspaper published on May 30, 1826 from Calcutta by Pt. Jugal Kishore Shukla.","s":""},{"n":705,"t":"First in India/World","q":"Who among the following was the first Chief Election Commissioner of India?","o":["Dr. Nagendra Singh","SP Sen Verma","Sukumar Sen","KVK Sundaram"],"a":2,"e":"Sukumar Sen. Dr. Nagendra Singh - The First Indian to be the President of the International Court of Justice from the year 1985 to 1988. KVK Sundaram - Second Chief Election Commissioner of India.","s":""},{"n":706,"t":"First in India/World","q":"The first Women's Cricket World Cup was hosted by which of the following countries ?","o":["Australia","West Indies","England","New Zealand"],"a":2,"e":"England. Women Cricket World Cup: 1973 (first edition) - England (Winner), 2022 - NewZealand (Host), Australia (Winner), ICC Women's T20 World Cup 2024 (Bangladesh), ICC Women's T20 World Cup 2026 (England), ICC Women's Cricket World Cup 2025 (India), ICC Women's T20 Champions Trophy 2027 (Sri Lanka).","s":""},{"n":707,"t":"First in India/World","q":"When did India win the first World Cup title in Hockey?","o":["1975","1978","1971","1982"],"a":0,"e":"1975. India defeated Pakistan under the Captaincy of Ajit Pal Singh in 3rd edition of Hockey World Cup. Hosted by - (Malaysia). India has won 8 Gold medals in Olympics hockey six of them in a row (from 1928-1956) and added two more at Tokyo (1964) and Moscow (1980).","s":""},{"n":708,"t":"First in India/World","q":"Which was the first petrochemical company in India?","o":["Indian Petrochemicals Corporation Limited","Gas Authority of India Limited","Haldia Petrochemicals Limited","National Organic Chemical Industry Limited"],"a":3,"e":"National Organic Chemical Industry Limited : It was established in\n1961. Other companies and their founding years: Gas Authority of India Limited (GAIL) - 1984. Haldia Petrochemicals Limited - 1985. Dr V. Krishnamurthy is known as the 'Father of Public Sector Undertakings' in India.","s":""},{"n":709,"t":"First in India/World","q":"Which state had the first female Governor in independent India?","o":["West Bengal","Rajasthan","Uttar Pradesh","Gujarat"],"a":2,"e":"Uttar Pradesh (Sarojini Naidu). First female in India : President -Pratibha Patil; Prime minister - Indira Gandhi; Chief minister - Sucheta Kriplani (UP); Defense minister - Nirmala Sitharaman.","s":""},{"n":710,"t":"First in India/World","q":"Who among the following became the first Indian to be invited to perform at the prestigious Lincoln Centre Hall in the United States of America?","o":["M.S.Subbulakshmi","Zakir Hussain","Ravi Shankar","Bismillah Khan"],"a":3,"e":"Bismillah Khan:- He played the shehnai on 15 August 1947 at the Red Fort. He was the first Indian to greet the nation with his musical instrument.","s":""},{"n":711,"t":"First in India/World","q":"Who among the following served as the first Chief Justice of India ?","o":["Hiralal Jekisundas Kania","Bijan Kumar Mukherjea","Mehr Chand Mahajan","M Patanjali Sastri"],"a":0,"e":"Hiralal Jekisundas Kania. The Supreme Court (Article 124) was established at Calcutta as a court of record through the Regulating Act of\n1773. Now, It comprises the Chief Justice and not more than 33 other judges.","s":""},{"n":712,"t":"First in India/World","q":"Which among the following is India's first Human spaceflight programme?","o":["Shukrayaan","Gaganyaan","Mangalyaan","Chandrayaan - 1"],"a":1,"e":"Gaganyaan - It envisages demonstration of human spaceflight capability. It will be launched at the end of 2023 or in 2024. Mars Orbiter Mission (MOM, Mangalyaan): Launch vehicle -PSLV-C25, Date - 5 November 2013. Chandrayaan-1 (India's first moon mission): Launched on - 22 October\n2008. Place - SDSC SHAR (Sriharikota). Chandrayaan-2: Launched on - 22 July\n2019. Launch vehicle - GSLV Mk III-M1. Chandrayaan - 3 : Launched on - 14 July\n2023. Launch vehicle - LVM3 M4.","s":""},{"n":713,"t":"First in India/World","q":"Which is the first garden - tomb in the Indian subcontinent?","o":["Taj Mahal","Qutb Shahi Tombs","Humayun's Tomb","Aurangzeb's Tomb"],"a":2,"e":"Humayun's Tomb (Maqbara-i Humayun). It is situated in Delhi. It was designed by Mirak Mirza Ghiyas and his son Sayyid Muhammed. In 1993, it was declared a UNESCO World Heritage Site.","s":""},{"n":714,"t":"First in India/World","q":"Who was the first Indian actress to receive the Padma Shri Award?","o":["Nargis Dutt","Asha Parekh","Madhubala","Devika Rani"],"a":0,"e":"Nargis Dutt: She was an Indian actress and politician who worked in Hindi cinema. Padma Shri (1958). First recipient of Padma Shri - K. Shankar Pillai - 1954 (Literature & Education), Balbir Singh - 1957 (sports), Asha Devi Aryanayakam - 1954 (Public Affairs), Bir Bhan Bhatia - 1954 (Medicine).","s":""},{"n":715,"t":"First in India/World","q":"Which state government has introduced India's first elephant death audit framework?","o":["Orissa","Andhra Pradesh","Tamil Nadu","Maharashtra"],"a":2,"e":"Tamil Nadu. India's first elephant death audit framework : Introduced in - 2022. The framework aims to improve transparency and accountability in the management of elephant deaths in the state.","s":""},{"n":716,"t":"First in India/World","q":"India participated in the Olympic Games for the first time in ______.","o":["1908","1900","1922","1904"],"a":1,"e":"1900. Athlete Norman Pritchard represented India at the Paris Olympics.","s":""},{"n":717,"t":"First in India/World","q":"Who was the first Indian Army officer to be promoted to the rank of field marshal ?","o":["Vikram Batra","Karam Singh","Sam Manekshaw","KM Cariappa"],"a":2,"e":"Sam Manekshaw: Chief of the Army Staff of the Indian Army during the Indo-Pakistani War of 1971. Field Marshal is a five–star General officer rank and the highest attainable rank in the Indian Army. KM Cariappa: First Indian Commander -in-Chief of the Indian Army. Vikram Batra: Martyr of Kargil war, Param Vir Chakra (1999).","s":""},{"n":718,"t":"First in India/World","q":"Who was the first woman of Indian origin to go to space?","o":["Nagin Cox","Yogita Shah","Kalpana Chawla","Sirisha Bandla"],"a":2,"e":"Kalpana Chawla","s":""},{"n":719,"t":"First in India/World","q":"Who was the first Indian woman to be appointed Chief Justice of a state High Court?","o":["Leila Seth","Anna Chandy","M. Fathima Beevi","Kiran Mazumdar-Shaw"],"a":0,"e":"Leila Seth . In 1991, she became the first female judge to be appointed as a Chief Justice of a state high court, Himachal Pradesh High court. Anna Chandy was India’s first female judge and the first woman in the country to become a High court judge. M Fathima Beevi was the first woman judge to the Supreme Court as well as the first Muslim woman judge there. Kiran Mazumdar-Shaw is the founder of Biocon Ltd.","s":""},{"n":720,"t":"First in India/World","q":"Who was the first Indian to get the Oscar for lifetime achievements in cinema in 1992 ?","o":["Tarun Majumdar","K Viswanath","Satyajit Ray","T Rama Rao"],"a":2,"e":"Satyajit Ray was the first Indian who received such an award from the Academy of Motion Pictures, Arts and Science. Awards - Dadasaheb Phalke Award (1984), Bharat Ratna (1992). Padma Shri (1958), Padma Bhushan (1965), JLCCA Ramon Magsaysay Award (1967), Padma Vibhushan (1976) etc.","s":""},{"n":721,"t":"First in India/World","q":"Flight Lieutenant_________ had created history in May 2019 by becoming the first woman to qualify for combat missions on a fighter jet.","o":["Priya Jhingan","Harita Kaur Deol","Bhawana Kanth","Shanti Tigga"],"a":2,"e":"Bhawana Kanth . Priya Jinghan: The First Lady Cadet to join the Indian Army Officer. Harita Kaur Deol:The first Indian woman to fly solo in an Avro HS-748 aircraft. Shanti Tigga: She was the first female jawan in the Indian Army.","s":""},{"n":722,"t":"First in India/World","q":"Indian Army’s 1st women combat aviator is ___________ .","o":["Punita Arora","Divya Ajit Kumar","Abhilasha Barak","Priya Semwal"],"a":2,"e":"Abhilasha Barak. The Army Aviation Corps is a form of the Army that was formed in November 1986. Punita Arora was the first woman Lieutenant General of the Indian Army. She held the ranks of Lieutenant General in the Indian Army and Surgeon Vice Admiral in the Navy. Divya Ajit Kumar is the first woman to be conferred by the Army with the Sword of Honour.","s":""},{"n":723,"t":"First in India/World","q":"Which of the following has become the first state in the country to get the L-root server?","o":["Karnataka","Maharashtra","Rajasthan","Andhra Pradesh"],"a":2,"e":"Rajasthan {( At the Bhamashah State Data Centre in association with the Internet Corporation for Assigned Names and Numbers (ICANN)}. There are at present three Domain Name System (DNS) root servers : J-root servers and Two L-root servers.","s":""},{"n":724,"t":"First in India/World","q":"Who among the following has become IAF’s first woman fighter pilot from J&K?","o":["Garima Lahiri","Apurva Lahiri","Arundhati Ramsingh","Mawya Sudan"],"a":3,"e":"Mawya Sudan. First female combat pilots commissioned in the IAF in 2016: Avani Chaturvedi (became first woman fighter pilot of India), Bhawana Kanth, and Mohana Singh. In 2015, the Government of India opened up the combat roles to women in the Indian Air Force (IAF) on an experimental basis for five years. First woman pilot of India (Sarla Thakral).","s":""},{"n":725,"t":"First in India/World","q":"The first regional rural bank set up in India was __________.","o":["Grameen Bank","Aarohan Bank","Prathama Grameen Bank","Vikas Bank"],"a":2,"e":"Prathama Grameen Bank was set up on October 2, 1975. Owner-Government of India (50%), Nationalised Banks (35%), State Governments (15%).","s":""},{"n":726,"t":"First in India/World","q":"The first playback song in Hindi Movies was recorded by music directors RC Boral and Pankaj Mullick in which year?","o":["1939","1941","1943","1935"],"a":3,"e":"1935, for the Nitin Bose -directed film, Dhoop Chhaon, by music directors RC Boral and Pankaj Mullick (Main khush hona chahun, sung by Suprava Sarkar, Parul Ghosh and Uma Shashi Devi).","s":""},{"n":727,"t":"First in India/World","q":"Who among the following was the first Indian Governor of Reserve Bank of India?","o":["CD Deshmukh","HVR Lengar","PC Bhattacharya","LK Jha"],"a":0,"e":"CD Deshmukh . RBI was established on 1 April 1935. The headquarter of RBI is in Mumbai. The Reserve Bank of India was set up on the basis of the recommendations of the ‘Hilton Young Commission’.","s":""},{"n":728,"t":"First in India/World","q":"Where was the first jute mill set up at Kolkata in 1859?","o":["Sreerampur","Mesra","Howrah","Rishra"],"a":3,"e":"Rishra . The mill was set up on the riverbank of Hooghly in Kolkata. The jute spinning machinery was brought by George Acland from Dundee.","s":""},{"n":729,"t":"First in India/World","q":"Who among the following is the first Indian to get an Oscar Award?","o":["Bhanu Athaiya","Satyajit Ray","AR Rahman","Resul Pookutty"],"a":0,"e":"Bhanu Athaiya . She was a costume designer in more than 100 movies and won an Oscar award in 1983 for the movie ‘Gandhi’.","s":""},{"n":730,"t":"First in India/World","q":"In which Olympic games did India win the gold medal in men's hockey, for the first time post-independence?","o":["London","Sydney","Barcelona","Athens"],"a":0,"e":"London . The Indian field hockey team defeated the British team to win the country's first gold medal at the 1948 Summer Olympics.","s":""},{"n":731,"t":"First in India/World","q":"Which of the following was the first language conferred with the status of Classical Language in India?","o":["Kannada","Sanskrit","Tamil","Malayalam"],"a":2,"e":"Tamil . Six languages in India namely Tamil, Telugu, Sanskrit, Kannada, Malayalam and Odia have been given the status of classical language.","s":""},{"n":732,"t":"First in India/World","q":"Who among the following was the first Finance Minister of independent India?","o":["RK Shanmukham Chetty","TT Krishnamachari","Syama Prasad Mukherjee","Jagjivan Ram"],"a":0,"e":"RK Shanmukham Chetty was the first Finance Minister of independent India when the country's first budget was tabled in Parliament on 26 November 1947.","s":""},{"n":733,"t":"First in India/World","q":"Who among the following was the first-ever Indian to receive the Bharat Ratna award?","o":["Mokshagundam Visvesvaraya","Chandrasekhara Venkata Raman","Pandurang Vaman Kane","Purushottam Das Tandon"],"a":1,"e":"Chandrasekhara Venkata Raman. Bharat Ratna was introduced on 2nd January 1954. The First 3 persons to receive Bharat Ratna (1954) - C Rajagopalachari, S Radhakrishnan & CV Raman.","s":""},{"n":734,"t":"First in India/World","q":"Which country launched the first artificial satellite Sputnik 1?","o":["USSR","France","USA","Germany"],"a":0,"e":"USSR . It was launched into an elliptical low Earth orbit by the USSR on 4 October 1957 as part of the Soviet space program. Launch site: Baikonur Rocket: Sputnik 8K71PS.","s":""},{"n":735,"t":"First in India/World","q":"Who among the following has been the first sportsperson to receive the Padma Shri award from the Government of India?","o":["Balbir Dosanjh","Milkha Singh","Manpreet Singh","Dhanraj Pillay"],"a":0,"e":"Balbir Singh Dosanjh. Padma Shri (1957). He wrote two books: his autobiography The Golden Hat Trick (1977) and The Golden Yardstick: In Quest of Hockey Excellence (2008).","s":""},{"n":736,"t":"First in India/World","q":"Who among the following was the first woman commando trainer in India?","o":["Avani Chaturvedi","Damyanti Beshra","Dr. Seema Rao","Rani Rampal"],"a":2,"e":"Dr. Seema Rao . India's first female jawan in the Indian army is Shanti Tigga. The first woman officer in the Indian Air Force, Vijayalakshmi Ramanan. Punita Arora was the first woman in the Indian Armed Forces to be promoted to a three-star rank.","s":""},{"n":737,"t":"First in India/World","q":"What was the name of the first artificial satellite launched by India in 1975?","o":["Panini","Sushruta","Aryabhatta","Charaka"],"a":2,"e":"Aryabhatta . Rohini was India's first satellite launched from an Indian - made launch vehicle.","s":""},{"n":738,"t":"First in India/World","q":"Who among the following was the first Indian to win a seat in the House of Commons?","o":["MN Roy","Dadabhai Naoroji","WC Bonnerjee","Hasrat Mohani"],"a":1,"e":"Dadabhai Naoroji . The House of Commons is the lower house (democratically elected house) of the Parliament of the United Kingdom.","s":""},{"n":739,"t":"First in India/World","q":"Who among the following is the first-ever woman fighter pilot to have taken part at a Republic Day Parade?","o":["Anny Divya","Bhawna Kanth","Mohana Singh Jitarwal","Avani Chaturvedi"],"a":1,"e":"Bhawna Kanth. She was declared as the first combat pilot along with two of her cohorts Mohana Singh and Avani Chaturvedi.","s":""},{"n":740,"t":"First in India/World","q":"Who was the first Director -General of Archaeological Survey of India?","o":["Lord Curzon","Alexander Cunningham","Mortimer Wheeler","John Marshall"],"a":1,"e":"Alexander Cunningham . ASI is an Indian government agency responsible for archaeological research and the conservation and preservation of cultural monuments in the country.","s":""},{"n":741,"t":"First in India/World","q":"In which of the following countries was the first hockey association formed?","o":["Spain","The UK","The US","India"],"a":1,"e":"The UK (1876). India has recently won a bronze medal in the 2020 Tokyo Olympics in Men’s Hockey Title.","s":""},{"n":742,"t":"First in India/World","q":"In which of the following years was the first rocket launched in India?","o":["1948","1973","1963","1977"],"a":2,"e":"1963 . The launchpad for the first rocket ‘RH200’ was Thumba Balasore and took off from Thumba near Thiruvananthapuram.","s":""},{"n":743,"t":"First in India/World","q":"Who among the following became the first Lokpal of India?","o":["Dilip B Bhosale","Pradip Kumar Mohanty","Pinaki Chandra Ghose","Ajay Kumar Tripathi"],"a":2,"e":"Pinaki Chandra Ghose. The Lokpal has jurisdiction over the central government to inquire into allegations of corruption against its public functionaries and for matters connected to corruption.","s":""},{"n":744,"t":"First in India/World","q":"In which year did India host the Commonwealth Games?","o":["2018","2010","2006","2014"],"a":1,"e":"In 2010, India hosted the Commonwealth Games. The event was first held in 1930, and with the exception of 1942 and 1946, has taken place every four years since then.","s":""},{"n":745,"t":"First in India/World","q":"What is the name of the first crude oil pipeline constructed in India?","o":["Naharkatia-Nunmati-Barauni Pipeline","Kandla-Bhatinda Pipeline","Hajira-Bijapur-Jagdishpur (HBJ) Gas Pipeline","Mumbai High-Kayoli Pipeline"],"a":0,"e":"Naharkatia - Nunmati -Barauni Pipeline . The pipeline between Naharkatia and Nunmati became operational in 1962 and between Nunmati and Barauni in 1964.","s":""},{"n":746,"t":"First in India/World","q":"What is the name of the first research station in Antarctica built by the Government of India?","o":["Vaishali","Maitri","Bharati","Dakshin Gangotri"],"a":3,"e":"Dakshin Gangotri was the first scientific base station of India situated in the Antarctic established in 1983.","s":""},{"n":747,"t":"First in India/World","q":"The first Backward Classes Commission of India was headed by ___.","o":["Gopal Krishna Gokhale","Kaka Kalelkar","Lokmanya Tilak","Nanaji Deshmukh"],"a":1,"e":"Kaka Kalelkar. The first Backward Classes Commission of India was set up by a Presidential Order in 1953 under the chairmanship of Kaka Kalelkar.","s":""},{"n":748,"t":"First in India/World","q":"Name the first female amputee to climb Mount Everest.","o":["Arunima Sinha","Poorna Malavath","Anshu Jamsenpa","Premlata Agarwal"],"a":0,"e":"Arunima Sinha is the world's first female amputee to climb Mount Everest in 2013. She is also the first female amputee to climb Mount Vinson, the highest peak of Antarctica.","s":""},{"n":749,"t":"First in India/World","q":"Who is the first General of the Indian Army, whose retirement day is celebrated as the 'Armed Forces Veterans Day' every year?","o":["General Maharaj Rajendra Sinhji","General S.M. Srinagesh","General K.S. Thimayya","General K.M. Cariappa"],"a":3,"e":"General K.M. Cariappa. Armed Forces Veterans Day is observed each year on 14th January as a mark of respect and recognition of the services rendered by Field Marshal KM Cariappa, the first Indian Commander -in-Chief of the Indian Armed Forces who retired on 14 Jan 1953 .","s":""},{"n":750,"t":"Sports","q":"Which city is home to the cricket ground, Wankhede Stadium ?","o":["Chennai","Mumbai","Kolkata","Delhi"],"a":1,"e":"Mumbai. The Wankhede Stadium is located in Mumbai, Maharashtra, and is one of India’s most iconic cricket grounds, famous for hosting the 2011 ICC World Cup Final.\nList of Famous Cricket Stadiums (City-wise): Wankhede Stadium – Mumbai | Eden Gardens – Kolkata | M. A. Chidambaram Stadium – Chennai | Arun Jaitley Stadium – Delhi | M. Chinnaswamy Stadium – Bengaluru | Narendra Modi Stadium – Ahmedabad | Rajiv Gandhi International Stadium – Hyderabad | PCA (IS Bindra) Stadium – Mohali | .","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":751,"t":"Sports","q":"The term \"deuce\" is associated with which sport ?","o":["Football","Basketball","Tennis","Hockey"],"a":2,"e":"Tennis. The term \"deuce\" is associated with tennis. It occurs when the score is 40–40, meaning both players are tied. To win from deuce, a player must secure two consecutive points – first \"advantage\" and then \"game point\". Other important Tennis terms: Ace – A serve that lands in the service box and is untouched by the opponent. Advantage (Ad-In/Ad-Out) – The point played after deuce. Break Point – A situation where the receiver can win the game by winning the next point. Love – Refers to a score of zero (e.g., \"15–love\"). Rally – A sequence of back-and-forth shots between players. Tie-breaker – A game played when the set score reaches 6–6, used to decide the set. Grand Slam – Winning all four major tournaments (Australian Open, French Open, Wimbledon, US Open) in a calendar year.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":752,"t":"Sports","q":"The Nehru Cup, a prominent international football tournament in India, was last held in which year ?","o":["2007","2012","2015","2018"],"a":1,"e":"2012. The Nehru Cup, started in 1982 by the AIFF in honor of Jawaharlal Nehru, was an international football tournament mostly held in New Delhi. India emerged as the most successful team, winning it five times. The last edition was held in 2012, where India defeated Cameroon in the final.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":753,"t":"Sports","q":"What does the term \"checkmate\" refer to in chess?","o":["End of game","Invalid move","A draw","A win"],"a":0,"e":"End of game – In chess, checkmate is a position where the king is under direct attack (check) and has no legal move to escape. This situation immediately ends the game, with the player delivering the checkmate declared the winner. Other terms: Check – king under attack; Stalemate – draw with no legal moves; Capture – removing an opponent’s piece; Blunder – a major mistake.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":754,"t":"Sports","q":"What is the radius of the centre circle in a football field?","o":["5.5 m","10.5 m","11 m","9.15 m"],"a":3,"e":"9.15 m. According to the Laws of the Game (FIFA regulations), the centre circle in a football field has a fixed radius of 9.15 metres (10 yards). This ensures that during a kick-off, all players from the opposing team remain at least this distance away from the ball until it is in play. The circle is drawn around the centre mark, and its dimension is standardized worldwide to maintain uniformity in football fields.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":755,"t":"Sports","q":"Given below are the statements in assertion and reason. Choose the correct options:\nAssertion (A): AFI has incorporated WADA's 2014 anti-doping rules into its constitution.\nReason(R): Any updates to WADA rules are automatically binding on all athletes and affiliated units in AFI.","o":["A is true, but R is false.","Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is false, but R is true."],"a":1,"e":"The Athletics Federation of India (AFI) must follow the World Anti-Doping Code for athletes to compete internationally. Thus, Assertion (A) is true as AFI incorporates WADA’s rules for compliance. Reason (R) is also true since WADA’s code is binding on all signatories. Hence, the binding nature of WADA’s rules correctly explains AFI’s action.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":756,"t":"Sports","q":"In which country, the first Commonwealth Games held ?","o":["France","Africa","India","Canada"],"a":3,"e":"First held in 1930 at Hamilton, Canada (then called British Empire Games). Organized every 4 years (except during WWII: 1942 & 1946 canceled). Renamed several times: British Empire Games (1930–1950), British Empire & Commonwealth Games (1954–1966), British Commonwealth Games (1970– 1974), Commonwealth Games (since 1978). Open to countries of the Commonwealth of Nations (56 members, but not all participate). India first participated in 1934 (London Games). India hosted once: 2010 in New Delhi.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":757,"t":"Sports","q":"The 3-point line in basketball is drawn at what distance from the basket in international competitions ?","o":["6.25 meters","7.25 meters","5.75 meters","6.75 meters"],"a":3,"e":"6.75 meters. 3-Point Line in Basketball: The distance of the three-point arc depends on the governing body: FIBA (International competitions): 6.75 meters (22 ft 1.75 in) NBA (USA): 23 ft 9 in (7.24 meters) at the arc, 22 ft (6.7 m) at corners.NCAA (USA college): 22 ft 1.75 in (same as FIBA for men). So, for international competitions (FIBA) → 6.75 meters.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":758,"t":"Sports","q":"What is the radius of the striking or shooting circle in hockey?","o":["16.78 meters","13.2 meters","14.63 meters","6.475 meters"],"a":2,"e":"14.63 meters. A field hockey pitch is rectangular and divided into four quarters by the center line, with goals placed inside semicircular shooting circles and penalty areas at both ends. The striking circle has a radius of 16 yards (14.63 m) from the goalposts, with a broken semicircle 5 yards (4.57 m) outside it. The penalty spot lies 7 yards (6.475 m) from the goal line. During a penalty corner, the defender stands at 5 yards (4.975 m) and the attacker at 11 yards (9.975 m) from the striking circle edge.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":759,"t":"Sports","q":"What does the term \"Duckworth -Lewis Method\" relate to in cricket?","o":["Fielding restrictions","Player ranking system","Bowling speed calculation","Calculating revised target in rain -affected matches"],"a":3,"e":"The Duckworth-Lewis-Stern (DLS) Method is a mathematical formula used in limited-overs cricket (ODIs and T20s) to set a fair target for the team batting second when play is interrupted, usually by rain. It works on the principle that a team’s scoring resources depend on two factors – overs remaining and wickets in hand. If overs are lost, the DLS method recalculates the target based on the resources available to the chasing team compared to those of the team batting first.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":760,"t":"Sports","q":"Which Indian woman was the pioneer in winning a silver medal at the Olympic Games?","o":["Saina Nehwal","Karnam Malleswari","Mary Kom","P.V. Sindhu"],"a":3,"e":"P.V. Sindhu won a silver medal in badminton during the 2016 Rio Olympics. Other notable Indian women Olympians include Saina Nehwal, who won a bronze in badminton at the 2012 London Olympics; Karnam Malleswari, who became the first Indian woman to win an Olympic medal (bronze in weightlifting) at the 2000 Sydney Olympics; and Mary Kom, who secured a bronze in boxing at the 2012 London Olympics.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":761,"t":"Sports","q":"What is the standard width of a hockey field?","o":["50 meters","54.5 meters","55 meters","57 meters"],"a":2,"e":"55 meters. According to the rules set by the International Hockey Federation (FIH), a standard field hockey pitch is a rectangle that measures 91.4 meters (100 yards) long and 55 meters (60 yards) wide. All major international competitions, including the Olympics, use these dimensions. The field is marked with several key lines, including a centerline, two 23-meter lines, and a striking circle (or 'D') at each end from which goals must be scored.","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":762,"t":"Sports","q":"In Kho-Kho, how many players are in a team, and how many are on the field during a game?","o":["9 players in a team, 9 on the field.","12 players in a team, 9 on the field.","12 players in a team, 12 on the field.","9 players in a team, 12 on the field."],"a":1,"e":"12 players in a team, 9 on the field. A standard Kho-Kho team consists of 12 players in total. Out of these, 9 players take the field at a time (to chase or defend), while 3 remain substitutes. The game is played between two teams, with each team alternating between chasing and defending turns.","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":763,"t":"Sports","q":"Which Indian sporting award is given for outstanding performance in sports coaching?","o":["Major Dhyan Chand Khel Ratna Award","Dronacharya Award","Rashtriya Khel Protsahan Puruskar","Arjuna Award"],"a":1,"e":"Dronacharya Award. The Dronacharya Award, instituted in 1985, is given by the Government of India for outstanding coaches in sports and games. Named after Guru Dronacharya (legendary teacher from the Mahabharata), it honors those who have consistently produced medal winners at international events. Other Awards for context: Major Dhyan Chand Khel Ratna Award → Highest sporting honor, for most outstanding performance in sports (players). Arjuna Award → For consistent excellence in sports performance (players).Rashtriya Khel Protsahan Puruskar → For organizations contributing to sports development.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":764,"t":"Sports","q":"How many players from one team are allowed on the basketball court during play?","o":["4","6","7","5"],"a":3,"e":"5. In basketball, each team is allowed to have 5 players on the court at a time. Positions generally include: 2 guards, 2 forwards, and 1 center. A team can have more players as substitutes, but only 5 can play simultaneously. If a team has fewer than 5 eligible players due to fouls or injuries, the game can still continue, but normally 5 per side is the rule.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":765,"t":"Sports","q":"The first known rules of Kabaddi were framed in which Indian state?","o":["Tamil Nadu","Uttar Pradesh","Punjab","Maharashtra"],"a":3,"e":"Maharashtra. Kabaddi is a traditional Indian sport with roots going back thousands of years, played in various forms across different regions. The first known formal rules of Kabaddi were codified in Maharashtra in 1921 to standardize the game. Later, in 1923, the first All-India Kabaddi Championship was held at Baroda under these standardized rules. The sport has since gained global recognition, featuring in the Asian Games (since 1990) and the Pro Kabaddi League.","s":"SSC Stenographer 8/08/2025 (Shift 3)"},{"n":766,"t":"Sports","q":"Consider the following two statements, labeled Assertion (A) and\nReason (R). Evaluate them and choose the appropriate answer from the given options.\nAssertion (A): The standard distance between the penalty spot and the goal line on a football field is 11 meters.\nReason (R): This distance allows the goalkeeper a fair reaction time while challenging the accuracy and confidence of the penalty taker.","o":["A is false, but R is true.","A is true, but R is false.","Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A."],"a":2,"e":"Assertion (A): True . According to the Laws of the Game (FIFA), the penalty spot is fixed at 11 meters (12 yards) from the goal line.\nReason (R): True .The choice of 11 meters balances the game: Close enough for the kicker to have a strong scoring chance. Far enough to give the goalkeeper a fair reaction time, making it a contest of skill, confidence, and accuracy. Thus, both the assertion and reason are correct, and R explains A.","s":"SSC Stenographer 8/08/2025 (Shift 3)"},{"n":767,"t":"Sports","q":"Consider the following statements regarding the Wimbledon tournament:\nStatement 1: The first Wimbledon Championship was held in 1877 at the Worple Road site, Wimbledon.\nStatement 2: Wimbledon is the only Grand Slam tournament still played on grass courts.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The first Wimbledon Championship took place in July 1877 at the All England Lawn Tennis and Croquet Club’s Worple Road site in Wimbledon, London, with only Gentlemen’s Singles being played. Later, in 1922, it shifted to the Church Road site. Wimbledon remains unique among the four Grand Slams as it is the only one still played on natural grass courts. The Australian Open (first held 1905) and US Open (1881) are played on hard courts, while the French Open (1891) is played on clay courts.","s":""},{"n":768,"t":"Sports","q":"What is the name of a cycling track?","o":["Velodrome","Aerodrome","Velosuper","Astroturf"],"a":0,"e":"Velodrome. It is a specially designed track used for competitive cycling events. It is typically an oval-shaped track with banked sides to allow cyclists to achieve high speeds safely. An aerodrome is a location or facility for the takeoff and landing of aircraft. Astroturf is a brand name for a type of artificial turf used in sports fields.","s":""},{"n":769,"t":"Sports","q":"Consider the following statements regarding India’s Olympic achievements :\nStatement 1 : India’s first individual Olympic gold medal was won in Shooting by Abhinav Bindra at the 2008 Beijing Olympics.\nStatement 2 : K. D. Jadhav won India’s first individual Olympic medal, a bronze in wrestling, at the 1952 Helsinki Olympics.\nWhich of the above statements is/are correct ?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Bindra’s victory marked a historic moment as India had earlier won only team golds in hockey. Norman Pritchard, although winning two silver medals in athletics at the 1900 Paris Olympics, represented colonial India under British rule. Jadhav’s achievement in 1952 was especially significant as it made him the first independent Indian athlete to win an individual Olympic medal.","s":""},{"n":770,"t":"Sports","q":"What is the length of the men's kabaddi court?","o":["11 m","15 m","17 m","13 m"],"a":3,"e":"13 m. The Kabaddi court measures 13 × 10 meters for men and 12 × 8 meters for women. It is basically a combative sport, with seven players on each side; played for a period of 40 minutes with a 5 minutes break (20-5-20)","s":""},{"n":771,"t":"Sports","q":"Consider the following statements regarding the high jump event:\nStatement 1: A high jumper is allowed three chances to clear a particular height.\nStatement 2: The horizontal bar used in high jump is always fixed at 4 metres height.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Athletes are permitted three attempts to cross a given height, after which failure results in elimination. The bar, however, is not fixed at 4 metres; instead, it is adjustable and progressively raised during competition. Its length is about 4 metres, but the height varies depending on the stage of the contest.","s":""},{"n":772,"t":"Sports","q":"In badminton, how high above the ground is the net positioned at the centre?","o":["4 feet","5 feet","6 feet","5.5 feet"],"a":1,"e":"5 feet. Badminton is a racquet spor
