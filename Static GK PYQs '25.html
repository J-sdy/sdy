uthors","q":"The book Godaan was authored by ______________ in 1936.","o":["Mahatma Gandhi","Munshi Premchand","Jawaharlal Nehru","Mulk Raj Anand"],"a":1,"e":"Munshi Premchand. His other books : ‘Kaphan’, ‘Namak ka daroga’, ‘Nirmala’, ‘Gaban’, ‘Do Bailon Ki Katha’, ‘Poos Ki Raat’, ‘Shatranj ke Khiladi’, ‘Sevasadan’. Mahatma Gandhi -‘The Story of My Experiments with Truth’, ‘Hind Swaraj’. Jawaharlal Nehru - ‘The Discovery of India’, ‘Glimpses of World History’, ‘India and the World’. Mulk Raj Anand - ‘Untouchable’, ‘Coolie’, ‘Across the Black Waters’.","s":""},{"n":1109,"t":"Books And Authors","q":"‘Along The Red River : A Memoir’ is a book about the life of _____.","o":["Nirupama Borgohain","Pushpalata Das","Mitra Phukan","Sabita Goswami"],"a":3,"e":"Sabita Goswami. Author and Books : Nirupama Borgohain -‘Abhiyatri’. Pushpalata Das - ‘Rajarama Sukla rashtriyaatma varcasva evam krtitva’. Mitra Phukan - ‘Chumki Posts a Letter’, ‘The Biratpur Adventure’, ‘The Collector's Wife’.","s":""},{"n":1110,"t":"Books And Authors","q":"Who among the following wrote the book ‘Chanakya’s Chant’?","o":["Novoneel Chakraborty","Samit Basu","Amish Tripathi","Ashwin Sanghi"],"a":3,"e":"Ashwin Sanghi. His other books: ‘The Rozabal Line’, ‘The Krishna Key’, ‘The Sialkot Saga’. Novoneel Chakraborty - ‘Stranger Trilogy’, ‘Forever is True’, ‘Half Torn Hearts’. Samit Basu -‘The Simoqin Prophecies’, ‘The City Inside’, ‘Chosen Spirits’. Amish Tripathi -‘The Immortals of Meluha’, ‘The Secret of the Nagas’, ‘The Shiva Trilogy’.","s":""},{"n":1111,"t":"Books And Authors","q":"Match the following authors with their books: Authors Books\nA. Chetan Bhagat 1. ‘’The White Tiger’’\nB. Vikram Seth 2. ’’The Emperor of All Maladies’’\nC. Aravind Adiga 3. ‘’A Suitable Boy’’\nD. Siddhartha 4. ‘’Making India Mukherjee Awesome’’","o":["A–4, B–3, C–1, D–2","A–1, B–2, C–3, D–4","A–3, B–4, C–2, D–1","A–2, B–1, C–4, D–3"],"a":0,"e":"A–4, B–3, C–1, D–2. Chetan Bhagat - Making India Awesome; Vikram Seth - A Suitable Boy; Aravind Adiga - The White Tiger; Siddhartha Mukherjee - The Emperor of All Maladies.","s":""},{"n":1112,"t":"Books And Authors","q":"Which of the following novels was written by George Orwell?","o":["Brave New World","Fahrenheit 451","Animal Farm","Pride and Prejudice"],"a":2,"e":"Animal Farm. George Orwell's other notable works : “Burmese Days (1934)”, “Coming Up for Air (1939)”, “Down and Out in Paris and London (1933)”. ‘Brave New World” is written by Aldous Huxley (1932), “Fahrenheit 451” is written by Ray Bradbury (1953), “Pride and Prejudice” is written by Jane Austen (1813).","s":""},{"n":1113,"t":"Books And Authors","q":"“ Why I Am An Atheist” is the autobiography of which Indian freedom fighter ?","o":["Bhagat Singh","Subhash Chandra Bose","Lala Lajpat Rai","Sarojini Naidu"],"a":0,"e":"Bhagat Singh. ‘The Golden Threshold’ by Sarojini Naidu, ‘India Divided’ by Rajendra Prasad, ‘England's Debt to India’ by Lala Lajpat Rai.","s":""},{"n":1114,"t":"Books And Authors","q":"Who authored the autobiography 'The Race of My Life'?","o":["Mohinder Singh Gill","PT Usha","Milkha Singh","Dutee Chand"],"a":2,"e":"Milkha Singh , also known as the Flying Sikh, was awarded the Padma Shri in 1959. Other notable autobiographies by sports persons: PT Usha (Golden girl), Sachin Tendulkar (Playing It My Way), Yuvraj Singh (The test of my life), Saina Nehwal (Playing To Win), Muhammad Ali (The Greatest: My Own Story), Sania Mirza (Ace against Odds), Mary Kom (Unbreakable).","s":""},{"n":1115,"t":"Books And Authors","q":"Who is the author of the book 'A Life Misspent'?","o":["Dushyant Kumar","Harivansh Rai Bachchan","Suryakant Tripathi Nirala","Maithili Sharan Gupta"],"a":2,"e":"Suryakant Tripathi Nirala : Other notable Hindi poets and their works: Suryakant Tripathi Nirala: \"Saroj Smriti\", \"Parimal\", \"Anaamika. Maithili Sharan Gupta: \"Bharat-Bharati\", \"Jayadrath Vadh\". Harivansh Rai Bachchan: \"Madhukalash\", \"Milan Yamini\". Dushyant Kumar: \"Saaye Mein Dhoop\", \"Ek Kanth Vishpayi\".","s":""},{"n":1116,"t":"Books And Authors","q":"Which author wrote the autobiography 'Baluta' ?","o":["Daya Pawar","Nirmal Verma","Chitra Mudgal","Teji Grover"],"a":0,"e":"Daya Pawar was an Indian Marathi language author and poet known for his contributions to Dalit literature. Other Authors and works : Nirmal Verma - Parinde, Jalti Jhari, London ki raat. Chitra Mudgal - Ek Jamin Apni, Gilli gaddu, Bayan. Teji Grover - Sapne Mein Prem Ki Saat, Neela, Maine Ek Line Banai.","s":""},{"n":1117,"t":"Books And Authors","q":"‘An Unsuitable Boy' is the autobiography of which Indian personality ?","o":["Salman Khan","AR Rahman","Karan Johar","Virat Kohli"],"a":2,"e":"Karan Johar. Autobiographies by Bollywood actors: Naseeruddin Shah - “And Then One Day: A Memoir”, Dev Anand - “Romancing With Life”, Satyajit Ray - “Jakhan Choto Chilam”.","s":""},{"n":1118,"t":"Books And Authors","q":"What is the title of the autobiography written by the renowned American professional boxer, Mike Tyson?","o":["The Greatest: My Own Story","Undisputed Truth: My Autobiography","Undisputed Life: My Story","Undeniable Story: My Life"],"a":1,"e":"Undisputed Truth: My Autobiography. His other important books include ‘Undisputed Truth’, ‘Iron Ambition: My Life With Cus D'amato’, ‘CenterStage: Twelve of My Most Fascinating Interviews’ etc.","s":""},{"n":1119,"t":"Books And Authors","q":"Who among the following wrote the book ‘Straight from the Heart’ ?","o":["Sachin Tendulkar","Mary Kom","Kapil Dev","Milkha Singh"],"a":2,"e":"Kapil Dev . His Awards: Padma Bhushan (1991), Padma Shri (1982), Arjuna Award (1979-80). Indian player and their Autobiographies: Sachin Tendulkar - ‘Playing It My Way’, Mary Kom - ‘Unbreakable’, Yuvraj Singh -‘The Test of My Life’, Milkha Singh - ‘The Race of My Life’, Saina Nehwal - ‘Playing to Win’. Sania Mirza - ‘Ace against Odds’.","s":""},{"n":1120,"t":"Books And Authors","q":"Who among the following wrote the book ‘Long Walk to Freedom’?","o":["Winston Churchill","Barack Obama","Nelson Mandela","Mother Teresa"],"a":2,"e":"Nelson Mandela. He was South Africa's first democratically elected President. Other books and their authors : Winston Churchill - “A History of the English-Speaking Peoples”. Barack Obama - “Dreams from My Father”, “The Audacity of Hope”, “Of Thee I Sing”, “A Promised Land”.","s":""},{"n":1121,"t":"Books And Authors","q":"Whom among the following cricketers has co-written the book named '281 and beyond'?","o":["Rahul Dravid","Ajay Jadeja","Saurav Ganguly","VVS Laxman"],"a":3,"e":"VVS Laxman ( Vangipurapu Venkata Sai Laxman) is a former Indian international cricketer. Rahul Dravid -“The Nice Guy Who Finished First”; Kapil Dev - “Straight from the Heart”; Sunil Gavaskar - “Sunny Days”; Sourav Ganguly - “A Century is Not Enough”; Suresh Raina - “Believe”.","s":""},{"n":1122,"t":"Books And Authors","q":"‘My Country, My Life’ is an autobiographical text of which of the following Indian politicians?","o":["Narendra Modi","Atal Bihari Vajpayee","Lal Krishna Advani","Sharad Pawar"],"a":2,"e":"Lal Krishna Advani. He is a politician who served as the Deputy Prime Minister of India from 2002 to\n2004. His Awards: Padma Vibhushan (2015), Bharat Ratna (2024). Autobiographies of Indian politicians: ‘Wings Of Fire’ (A.P.J. Abdul Kalam), ‘An Autobiography: Toward Freedom’ (Jawaharlal Nehru), ‘India Wins Freedom’ (Maulana Abul Kalam Azad), ‘Atmakatha’ (Rajendra Prasad), ‘A Grain of Sand in the Hourglass of Time’ (Arjuna Singh).","s":""},{"n":1123,"t":"Books And Authors","q":"Who among the following sportspersons is credited with the autobiography ‘Undisputed Truth’?","o":["Kevin Pietersen","Muhammad Ali","Matthew Hayden","Mike Tyson"],"a":3,"e":"Mike Tyson. Autobiographies of sportspersons: Cricket Delightful (Mushtaq Ali), Sunny Days (Sunil Gavaskar), Playing with Fire (Nasser Hussain), Straight from the Heart (Kapil Dev), Out of My Comfort Zone (Steve Waugh), Portrait of a Rebel (Kevin Pietersen).","s":""},{"n":1124,"t":"Books And Authors","q":"Who among the following is the author of the book ‘The Complete Adventures of Feluda’?","o":["Mrinal Sen","Ritwik Ghatak","Goutam Ghosh","Satyajit Ray"],"a":3,"e":"Satyajit Ray received the Bharat Ratna in 1992, the Padma Vibhushan in 1976, the Padma Bhushan in 1965, and the Oscar Award for lifetime achievements in cinema in 1992. His notable books include Jakhan Choto Chilam (autobiography), Badshahi Angti, Sonar Kella, and Gangtokey Gondogol. Other Author: Mrinal Sen - Always Being Born.","s":""},{"n":1125,"t":"Books And Authors","q":"‘Total Recall: My Unbelievably True Life Story’ was authored by whom among the following personalities in addition to Peter Petre ?","o":["Andre Agassi","Pete Sampras","Malcom X","Arnold Schwarzenegger"],"a":3,"e":"Arnold Schwarzenegger. He served as the 38th governor of California from 2003 to 2011. He is also a celebrated author, with notable works including: Be Useful: Seven Tools for Life, The New Encyclopedia of Modern Bodybuilding, Arnold: The Education of a Bodybuilder.","s":""},{"n":1126,"t":"Books And Authors","q":"Which of the following is the autobiography of Abul Kalam Azad, the first Education Minister of free India?","o":["The Test of My Life","The Road Ahead","Unbreakable","India Wins Freedom"],"a":3,"e":"India Wins Freedom. Maulana Abul Kalam Azad was posthumously awarded the Bharat Ratna in 1992 for his contributions to education in India. His other books: ‘Ghubar-e-Khatir’, and ‘Basic Concepts of the Quran’.","s":""},{"n":1127,"t":"Books And Authors","q":"‘Letters from a Father to his Daughter’ was authored by whom among the following freedom fighters ?","o":["Jawaharlal Nehru","Subhas Chandra Bose","Mahatma Gandhi","Lal Bahadur Shastri"],"a":0,"e":"Jawaharlal Nehru. Other Books by him : “The Discovery of India”, “An Autobiography”, “Glimpses of World History”. Other Authors and Books : Subhas Chandra Bose - “Azad Hind”, “The Indian Struggle”, “Dreams of a Youth”. Mahatma Gandhi - “The Story of My Experiments”, “Hind Swaraj”, “Satyagraha in South Africa”. Chandrika Prasad Srivastava - “Lal Bahadur Shastri - A Life of Truth in Politics”.","s":""},{"n":1128,"t":"Books And Authors","q":"Who among the following is the author of the novel 'Ret Samadhi' ?","o":["Rita Kumari","Geetanjali Shree","Shashi Tharoor","Jhumpa Lahiri"],"a":1,"e":"Geetanjali Shree. Her book 'Tomb of Sand (Ret Samadhi)' has become the first Hindi novel to be awarded the prestigious 2022 International Booker Prize. The book was translated in english by Daisy Rockwell. Hamara Shahar Us Baras, Khali Jagah and Pratinidhi Kahaniyan are other books by her. Other Authors and Books : Shashi Tharoor - The Great Indian Novel, A Wonderland of Words. Jhumpa Lahiri -The Namesake, The Lowland.","s":""},{"n":1129,"t":"Books And Authors","q":"Which of the following novels is written by the Indian author Kiran Desai?","o":["The Inheritance of Loss","The Circle of Reason","The Golden House","A Suitable Boy"],"a":0,"e":"The Inheritance of Loss. Other books by Kiran Desai: ’Hullabaloo in the Guava Orchard’, ‘Consumer Identity and Fashion’, ‘Emblems of Transformation’. Amitav Ghosh - ‘The Circle of Reason’.","s":""},{"n":1130,"t":"Books And Authors","q":"The novel ‘Raavan - Enemy of Aryavarta’ is written by whom among the following writers?","o":["Kiran Desai","Amish Tripathi","Ruskin Bond","Amitav Ghosh"],"a":1,"e":"Amish Tripathi. He is an Indian author and diplomat, best known for “The Shiva Trilogy” and “Ram Chandra” Series. His Other Books: “The Immortals of Meluha”; “The Secret of the Nagas”, \"The Oath of the Vayuputras”; “Scion of Ikshvaku”; “Sita: Warrior of Mithila”.","s":""},{"n":1131,"t":"Books And Authors","q":"The novel 'The White Tiger' was written by:","o":["Aravind Adiga","Indu Sundaresan","Amitav Ghosh","Vikram Chandra"],"a":0,"e":"Aravind Adiga received the Man Booker Prize in 2008 for his novel ‘The White Tiger’. His other novels include ‘Last Man in Tower’ and ‘Selection Day  And Authors","q":"Who is the author of the book ‘The Soul of a Butterfly: Reflections on Life’s Journey’ ?","o":["Muhammad Ali","Jake LaMotta","Roberto Duran","Eugene J Bullard"],"a":0,"e":"Muhammad Ali. His Other Book - “The Greatest: My Own Story”.","s":""},{"n":1152,"t":"Books And Authors","q":"Who among the following is one of the co-authors of the book, 'Cracking The Code : My Journey in Bollywood' ?","o":["Harshvardhan Kapoor","Nawazuddin Siddique","Ayushmann Khurrana","Rajkumar Rao"],"a":2,"e":"Ayushmann Khurrana . Other Indian Actors and their books : Anupam Kher - “Aap khud hi best hai” , Emraan Hashmi : “The Kiss of Life”, Nawajuddin Siddiqui - “An Ordinary Life: A memoir”, Karan Johar - “An Unsuitable Boy”, Sonu Sood - “I Am No Messiah”.","s":""},{"n":1153,"t":"Books And Authors","q":"Who among the following is the author of the book, ‘Unfinished; A Memoir’ ?","o":["Alia Bhatt","Priyanka Chopra","Deepika Padukone","Kareena Kapoor"],"a":1,"e":"Priyanka Chopra : She was awarded Padma Shri in 2016. She won Miss World pageant in the year 2000.","s":""},{"n":1154,"t":"Books And Authors","q":"‘ The Fall of a Sparrow' is an autobiography of ____________.","o":["Salim Ali","Raj Kapoor","Kapil Dev","Atal Bihari Vajpayee"],"a":0,"e":"Salim Ali (Birdman of India). Other books by him - “The books of Indian birds”, “Indian hill birds”, “A pictorial guide to the birds of the Indian subcontinent”. Atal Bihari Vajpayee -“Dynamics of an open society”, “Twenty one poems”.","s":""},{"n":1155,"t":"Books And Authors","q":"Whose autobiography is titled \"Waiting for a Visa\"?","o":["Dr. Ram Manohar Lohia","Dr. Rajendra Prasad","Dr. Bhimrao Ambedkar","Dr. Kamal Ranadive"],"a":2,"e":"Dr. Bhimrao Ambedkar. His Other Books: “The Problem of the Rupee”, “The Annihilation of Caste”, “Buddha Or Karl Marx”.","s":""},{"n":1156,"t":"Books And Authors","q":"Who among the following is the author of the Hindi novel 'Raag Darbari' ?","o":["Shrilal Shukla","Rahul Sankrityayan","Premchand","K ad composed famous travelogs like 'Mera Pakistani Safarnama' and 'Rusii Safarnama. The Act of Life (Writer - Jyoti Sabharwal) is a 2006 autobiography by Indian theater and film actor Amrish Puri. I Am Not an Island: An Experiment in Autobiography -(Author - Khwaja Ahmad Abbas). Mai Ek Harfan Maula is the autobiography of A.K. Hangal.","s":""},{"n":1167,"t":"Books And Authors","q":"Which of the following autobiographies was written by the Indian female poet Kamala Das, who was nominated for Nobel Prize for literature in 1984?","o":["My Story","A Life Less Ordinary","A Life Apart","Smritichitre: The Memoire of a Spirited Wife"],"a":0,"e":"My Story. “ A Life Less Ordinary” (Baby Halder). “A Life Apart” (Neel Mukherjee). “Smriti Chitre: The Memoirs of a Spirited Wife” (Lakshmibai Tilak). “How I Became a Hindu” (Sita Ram Goel).","s":""},{"n":1168,"t":"Books And Authors","q":"'Vikramarjuna - Vijaya' composed by Pampa was written in which of the following languages?","o":["Sanskrit","Tamil","Telugu","Kannada"],"a":3,"e":"Kannada. Other ancient books and their writers - Panini-(Ashtadhyayi), Patanjali (Mahabhasya), Shudraka (Mricchakatika), Kalhana (Rajatarangini).","s":""},{"n":1169,"t":"Books And Authors","q":"‘A Life of the Genius: The Man Who Knew Infinity' is a biography of Indian mathematician ______ .","o":["Acharya Pingala","Aryabhata","Srinivasa Ramanujan","Neena Gupta"],"a":2,"e":"Srinivasa Ramanujan:- He is also called 'mathematician of mathematicians' and 'magician of numbers' for his amazing work on number theory. National Mathematics Day (celebrated on 22 December to commemorate the birth anniversary of Srinivasa Ramanujan).","s":""},{"n":1170,"t":"Books And Authors","q":"' India's Struggle for Independence' is one of the notable books written by ____ .","o":["Sekhar Bandyopadhyay","R.K. Narayana","R.C. Majumdar","Bipan Chandra"],"a":3,"e":"Bipan Chandra. Awards - Padma Bhushan (2010), Most Popular Books - “History of Modern India”, “India since Independence“, nd Me - An Empowering Philosophy That Can Enrich Your Life’ (2002).","s":""},{"n":1189,"t":"Books And Authors","q":"Which of the following books was written by Swami Vivekananda?","o":["Ancient India","River of Smoke","The East and the West","No secrets"],"a":2,"e":"The East and the West -This book is a comparative study of eastern and Western cultures. Books written by Swami Vivekananda - ‘Raja Yoga’, ‘Jnana Yoga’, ‘Karma Yoga and Bhakti Yoga’, ‘Pathways to Joy: The Master’, ‘Meditation and Its Methods’, ‘Vedanta: Voice of Freedom’, ‘My India: The India Eternal’, ‘Chicago Addresses’, ‘My Idea of Education’, ‘Pearls of Wisdom’, ‘Religion of Love’. ‘Ancient India’ - RC Majumdar, ‘River of Smoke’ -Amitav Ghosh, ‘No Secrets’ - Anuj Dhar.","s":""},{"n":1190,"t":"Books And Authors","q":"Who wrote the famous novel \"Durgeshnandini\" ?","o":["Rabindranath Tagore","Ishwar Chandra Vidyasagar","Bankim Chandra Chatterjee","Sarat Chandra Chattopadhyay"],"a":2,"e":"Bankim Chandra Chatterjee's first Bengali novel Durgeshnandini revolutionized Bengali prose writing. His other books: “Anandamath” (National Song ‘Vande Matram’ is a part of it), “Kapalkundala” , “Mrinalini” , “Vishabriksha” (The Poison Tree), “Indira” , “Chandrasekhar”, “Devi Chaudhurani”. Rabindranath Tagore (wrote the National Anthem) - “Gitanjali”, “The Postmaster”, “Gora”, “Kabuliwala”. Ishwar Chandra Vidyasagar - “Betaal Panchavinsati”, “Banglar Itihas”. Sarat Chandra Chattopadhyay - “Parineeta”, “Choritrohin”, “Devdas”, “Pather Dabi\", “Srikanta”, “Datta”.","s":""},{"n":1191,"t":"Books And Authors","q":"The book titled ‘The Ministry of Utmost Happiness’ has been written by _______.","o":["Jia Pingwa","Dan Brown","Arundhati Roy","Sunita Narain"],"a":2,"e":"Arundhati Roy. More books by her:- “The God of Small Things”, “The End of Imagination”, “The Cost of Living” , “The Algebra of Infinite Justice” , “Walking with the Comrades” , “Kashmir: The Case for Freedom”. “Capitalism: A Ghost Story” .","s":""},{"n":1192," nds”, “Turning Points”.","s":""},{"n":1252,"t":"Books And Authors","q":"Which of the following is a book by former Prime Minister of India, Indira Gandhi ?","o":["Discovery of India","Wings of Fire","My Experiments with Truth","My Truth"],"a":3,"e":"My Truth. Her other books -“Freedom’s Daughter”, \"Remembered Moments\".","s":""},{"n":1253,"t":"Books And Authors","q":"Who among the following is the author of the book ‘The Testaments’ ?","o":["Jokha Alharthi","Andrew Sean Greer","Anna Burns","Margaret Atwood"],"a":3,"e":"Margaret Atwood . ‘The Testaments’ is a sequel to ‘The Handmaid Tales’. The Testaments was joint winner of the 2019 Booker Prize, alongside Bernardine Evaristo's novel “Girl, Woman, Other”.","s":""},{"n":1254,"t":"Books And Authors","q":"'Boy : Tales of Childhood' is an autobiographical book by ______.","o":["Mark Twain","Ruskin Bond","Roald Dahl","Lewis Carroll"],"a":2,"e":"Roald Dahl. Lewis Carroll : ‘Alice's Adventures in Wonderland’ (1865) and ‘Through the Looking-Glass’, and ‘What Alice Found There’ (1872).","s":""},{"n":1255,"t":"Books And Authors","q":"Who is the author of the book 'The Tales of Beedle The Bard' ?","o":["Lewis Carroll","EB White","Roald Dahl","JK Rowling"],"a":3,"e":"JK Rowling. Other novels: “ Harry Potter and the Philosopher's Stone”, “The Ink Black Heart’’, “Troubled Blood”.","s":""},{"n":1256,"t":"Books And Authors","q":"Who among the following is the author of the book titled 'Speaking Truth to Power: My Alternative View' ?","o":["Subramanian Swamy","Mani Shankar Aiyar","P Chidambaram","Arun Shourie"],"a":2,"e":"P Chidambaram . Other books: “ Fearless in Opposition”, “Standing Guard”, Undaunted - “Saving the Idea of India”.","s":""},{"n":1257,"t":"Books And Authors","q":"Who among the following is the author of the Hindi poetry book ‘Chheelate Hue Apne Ko' ?","o":["Nand Kishore Acharya","Javed Akhtar","Rahat Indori","Gulzar"],"a":0,"e":"Nand Kishore Acharya. Other famous books by him- ‘Sanskriti ka Vyakarna’, ‘Sabhyata ka Vikalp’, ‘Gulam Badshah’, etc. He was awarded Sahitya Akademi Award 2019 in Hindi literature.","s":""},{"n":1258,"t":"Books And Authors","q":"Who among the following is the author of ‘Being Gandhi’?","o":["Ashis Ray","Paro Anand","Nirupama Yadav","V Pattabhi Ram"],"a":1,"e":"Paro Anand. She won the Sahitya Akademi Bal Sahitya Puraskar in 2017 for her anthology Wild Child and Other Stories (now published as \"Like Smoke: 20 Teens 20 Stories'').","s":""},{"n":1259,"t":"Books And Authors","q":"‘ Bhavartha Dipika’ and ‘Amritanubhava’ are the sacred books of the people of ______.","o":["Haryana","Gujarat","Maharashtra","Rajasthan"],"a":2,"e":"Maharashtra . The author of the book ‘Bhavartha Dipika’ and ‘Amritanubhava’ is Sant Dyaneshwar.","s":""},{"n":1260,"t":"Books And Authors","q":"The first printed edition of the Ramcharitmanas by Tulsidas was published from ______ in 1810.","o":["Delhi","Calcutta/Kolkata","Madras/Chennai","Bombay/Mumbai"],"a":1,"e":"Calcutta (Kolkata).","s":""},{"n":1261,"t":"Books And Authors","q":"Willy Wonka is a fictional character from the children's story book '______'.","o":["Alice's Adventures in Wonderland","Charlie and the Chocolate Factory","Matilda","Charlotte's Web"],"a":1,"e":"Charlie and the Chocolate Factory written by Roald Dahl. Charlotte's Web (E. B White), Matilda (Roald Dahl).","s":""},{"n":1262,"t":"Books And Authors","q":"Who among the following is the author of the book ‘The Anarchy: The Relentless Rise of the East India Company’?","o":["Shoshana Zuboff","Sumit Sarkar","Shashi Tharoor","William Dalrymple"],"a":3,"e":"William Dalrymple . More famous books by him are- ‘Kohinoor: The Story of the World’s Most Infamous Diamond’, ‘Return of a King’, ‘The Last Mughal’, ‘Nine Lives’, ‘White Mughals’, ‘From the Holy Mountain’.","s":""},{"n":1263,"t":"Books And Authors","q":"Who wrote the book 'The Quest for Equity in Development'?","o":["Amartya Sen","Montek Singh Ahluwalia","Raghuram Rajan","Manmohan Singh"],"a":3,"e":"Manmohan Singh. ‘ Changing India’ was written by him.","s":""},{"n":1264,"t":"Books And Authors","q":"Who among the following wrote ‘The Light of Asia: The Poem that Defined the Buddha’ that will narrate the phenomenal poem ‘The Light of Asia’?","o":["Shashi Tharoor","Salman Rushdie","Chetan Bhagat","Jairam Ramesh"],"a":3,"e":"Jairam Ramesh . The Light of Asia is a biblio-biography of Edwin Arnold’s palpably fresh grasp of a complex philosophy and a worthy contribution to modern Buddhist studies.","s":""},{"n":1265,"t":"Books And Authors","q":"Who is the author of the book ‘Hit Refresh' ?","o":["Kazi Nazrul Islam","Jagmohan Bhanver","Aishwarya Rai","Satya Nadella"],"a":3,"e":"Satya Nadella. “Hit Refresh: The Quest to Rediscover Microsoft's Soul and Imagine a Better Future for Everyone” is a nonfiction book by Satya Nadella and co-authors Jill Tracie Nichols and Greg Shaw, with a foreword by Bill Gates, published in 2017.","s":""},{"n":1266,"t":"Books And Authors","q":"Who is the author of the book 'My Master' ?","o":["Swami Vivekananda","Raja Ram Mohan Roy","Sri Aurobindo","Rabindranath Tagore"],"a":0,"e":"Swami Vivekananda. Other books - ‘Meditation and Its Methods’, ‘Jnana Yoga’, ‘Work and Its Secret’, ‘Thoughts of Power’.","s":""},{"n":1267,"t":"Books And Authors","q":"Who among the following is the author of ‘The Brahma Sutra – The Philosophy of Spiritual life’?","o":["Sarvepalli Radhakrishnan","Indira Gandhi","Sarojini Naidu","Rajendra Prasad"],"a":0,"e":"Sarvepalli Radhakrishnan . Other books - ‘ The Hindu view of life’, ‘The Pursuit of Truth’.","s":""},{"n":1268,"t":"Books And Authors","q":"Who among the following had authored ‘Buddha Gaya: The Hermitage of Sakya Muni’ in 1878 ?","o":["Alexander Cunningham","Rajendralala Mitra","HH Cole","John Marshall"],"a":1,"e":"Rajendralala Mitra. More books by him are ‘The Chandogya Upanishad’, ‘Antiquities Of Orissa’, ‘The Sanskrit Buddhist literature of Nepal’ etc. HH Cole - appointed as the Curator of Ancient Monuments in 1880.","s":""},{"n":1269,"t":"Books And Authors","q":"Which Nobel laureate wrote the book ‘India: A Million Mutinies Now’ and Role in History'?","o":["Vidiadhar Surajprasad Naipaul","Olga Tokarczuk","Peter Handke","Patrick Modiano"],"a":0,"e":"Vidiadhar Surajprasad Naipaul . Other novels - ‘A House for Mr Biswas’, ‘A Bend in the River’, ‘Miguel Street’, ‘In a Free State’.","s":""},{"n":1270,"t":"Books And Authors","q":"Who is the author of the book 'Hazaar Chaurasi Ki Maa'?","o":["Krishna Sobti","Rita Kothari","Sugathakumari","Mahasweta Devi"],"a":3,"e":"Mahasweta Devi- ‘Imaginary Maps’, ‘Hazaar Chaurasi ki Maa,’ ‘Breast Stories’, ‘Chotti Munda and His Arrow’, ‘Five Plays’, etc.","s":""},{"n":1271,"t":"Famous Personality","q":"What makes Dr. Avesh Kumar Tyagi's contributions in Atomic Energy distinct from conventional research output, as per his Vigyan Shri citation ?","o":["Strategic innovation in both materials and process R&D","Discovery of a new radioactive element","Advances in isotopic separation only","Development of radiation therapy devices"],"a":0,"e":"According to the official Vigyan Shri citation, Dr. Tyagi, a Distinguished Scientist at BARC’s Chemistry Group, has made groundbreaking contributions to the advancement of both processes and materials critical to the Indian Atomic Energy Program","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":1272,"t":"Famous Personality","q":"Who among the following was a poet who won the Nobel Prize for literature in 1913 ?","o":["Aurobindo Ghose","Rudyard Kipling","bankim Chandra Chattopadhyay","Rabindranath Tagore"],"a":3,"e":"Rabindranath Tagore. He was also referred to as ‘Gurudev’, ‘Kabiguru’, and ‘Biswakabi’. He got Nobel Prize for his work Gitanjali. He was a Bengali poet, novelist, and painter, who was highly influential in introducing Indian culture to the west. He was the first non-European to receive the Nobel Prize.","s":""},{"n":1273,"t":"Famous Personality","q":"Which Indian political leader was called as Lok Nayak?","o":["Ram Manohar Lohia","Jai Prakash Narayan","Bal Gangadhar Tilak","Subhash Chandra Bose"],"a":1,"e":"Jai Prakash Narayan. He received the Ramon Magsaysay Award (1965) and Bharat Ratna (1998, posthumously). Famous Personalities & their Nicknames: Bihar Kesri - Sri Krishna Sinha, Bihar Vibhuti - Dr. Anurag Narayan Singh, Iron Man of India - Vallabhai Patel, Biswa Kavi - Rabindranath Tagore, Netaji - Subhash Chandra Bose. Lokmanya Tilak - Bal Gangadhar Tilak.","s":""},{"n":1274,"t":"Famous Personality","q":"Which of the following is an autobiography of a Bengali illiterate woman who secretly acquired literacy skills to read sacred texts in an age when girls and women were denied education and deemed fit only for household chores ?","o":["Jina Amucha by Baby Kamble","Amar Jiban by Rassundari Devi","Smritichitre by Lakshmibai Tilak","Ente Katha by Kamala Das"],"a":1,"e":"Amar Jiban by Rassundari Devi. She was the first Indian woman to write an autobiography and the first Bengali to write an autobiography. Authors and Books: Baby Kamble - ‘’The Prisons We Broke’’. Lakshmibai Tilak -‘’Smritichitre’’. Kamala Suraiyya - ‘’The Old Playhouse And Other Poems’’, ‘’Padmavati the Harlot and Other Stories’’.","s":""},{"n":1275,"t":"Famous Personality","q":"Who became the first Vice-Chancellor of Jawaharlal Nehru University in 1969 ?","o":["BD Nagchaudhuri","G Parthasarathi","Y Nayudamma","KR Narayanan"],"a":1,"e":"G Parthasarathi. Jawaharlal Nehru University (JNU): A public major research university located in New Delhi, India. It was established in 1969 and named after Jawaharlal Nehru, India's first Prime Minister. Other Central Universities : Aligarh Muslim University (1875), Assam University, Banaras Hindu University (1916), Central University of Gujarat (2009).","s":""},{"n":1276,"t":"Famous Personality","q":"Who was the first woman graduate of Calcutta University ?","o":["Sarojini Naidu","Annie Besant","Kadambini Ganguly","Rajkumari Amritkaur"],"a":2,"e":"Kadambini Ganguly and Chandramukhi Basu were the first BA graduates in the British empire in India. She was the South Asia's first female surgeon. Rajkumari Amritkaur - The first Health Minister of India (1947).","s":""},{"n":1277,"t":"Famous Personality","q":"Who among the following advocated the ideology of \"oru jati, oru matam, oru daivam manushyanu\" (one caste, one religion, one god for humankind)?","o":["Birsa Munda","Narayana Guru","Swami Shraddhanand","Keshub Chunder Sen"],"a":1,"e":"Narayana Guru. He belongs to Ezhava caste and was considered ‘avarna’. He built a temple dedicated to Lord Shiva at Aruvippuram which was against the caste based restrictions of the time. He established the Sree Narayana Dharma Paripalana Yogam (SNDP), a charitable society. His Books: “Advaitha Deepika”, “Asrama”and “Thevarappathinkangal”. He became the proponent of Advaita Vedanta (Principle of non-duality) put forward by Adi Shankara.","s":""},{"n":1278,"t":"Famous Personality","q":"Which of the following persons has been awarded the Nobel Peace Prize ?","o":["C. V. Raman","Kailash Satyarthi","Amartya Sen","Rabindranath Tagore"],"a":1,"e":"Kailash Satyarthi was awarded the Nobel Peace Prize in 2014 \"for the struggle against the suppression of children and young people and the right of all children to education\". He founded the Bachpan Bachao Andolan (Save the Childhood Movement) in 1980.","s":""},{"n":1279,"t":"Famous Personality","q":"In 2019, a minor planet between Mars and Jupiter was named after whom among the following Indian musicians by the International Astronomical Union (IAU) ?","o":["Pt Hari Prasad Chaurasia","Pt Ravi Shankar","Ustad Zakir Hussain","Pt Jasraj"],"a":3,"e":"Pt Jasraj. The International Astronomical Union (IAU) has named minor planet 2006 VP32 (number -300128), discovered on November 11, 2006, as 'Pandit Jasraj'. He became the first Indian musician to get honored with this unique recognition.","s":""},{"n":1280,"t":"Famous Personality","q":"Which of the following architects designed the Gateway of India?","o":["Herbert Baker","George Wittet","Henry Irwin","Lauri Baker"],"a":1,"e":"George Wittet. Gateway of India (1924). The foundation stone was placed in 1911 in Bombay. The monument was erected to commemorate the landing of King George V and Queen Mary at Apollo Bunder in India. Other Architects and their works: Henry Irwin - Ambas Vilas Palace (Mysore). Lauri Baker - The Indian Coffee House, Central for Development Studies (Kerala). He was known as the “Brick Master of Kerala” and “Gandhi of Architecture”.","s":""},{"n":1281,"t":"Famous Personality","q":"To which state of India did Fathima Beevi, the first woman Supreme Court Judge of India, belong ?","o":["Kerala","Andhra Pradesh","Tamil Nadu","Karnataka"],"a":0,"e":"Kerala. Padma Bhushan (2024). First female judge of India -Justice Anna Chandy.","s":""},{"n":1282,"t":"Famous Personality","q":"Giorgia Meloni recently became the first Woman Prime Minister of which country ?","o":["Austria","Italy","Spain","Ukraine"],"a":1,"e":"Italy. First Female Prime Minister of Some Countries: Austria -Brigitte Bierlein. Spain - María Teresa Fernández de la Vega. Ukraine -Tymoshenko. India - Indira Gandhi. Bangladesh - Sheikh Hasina Wazed. Pakistan - Benazier Bhutto.","s":""},{"n":1283,"t":"Famous Personality","q":"Fatima Sheikh was widely regarded as _______.","o":["India's First Female Muslim Entrepreneur","India's First Female Doctor","India's First Female Muslim Teacher","India's First Female Engineer"],"a":2,"e":"India's First Female Muslim Teacher. She was honoured with a doodle on her 191st birth anniversary by Google On 9 January 2022. India's First Female Engineer - Ayyalasomayajula Lalitha. First Indian female doctor of western medicine - Anandi Gopal Joshi.","s":""},{"n":1284,"t":"Famous Personality","q":"Shiv Dayal Saheb, a banker from Agra founded the Radha Soami Satsang in _________.","o":["1842","1880","1861","1875"],"a":2,"e":"1861. Shiva Dayal Saheb founded the sect ‘Radha Soami Satsang’ on Basant Panchami. The sole purpose of this satsang is to experience the divinity of God who resides in all of us.","s":""},{"n":1285,"t":"Famous Personality","q":"Satyajit Ray was honoured with Bharat Ratna in 1992. He was a famous ________ .","o":["Physicist","Filmmaker","Cricketer","Lawyer"],"a":1,"e":"Filmmaker. Other Awards of Satyajit Ray: Padam Shri (1958), Padam Bhushan (1965), Dada Saheb Phalke award (1985), Ramon Magsaysay Award (1967) and Bharat Ratna (1992).","s":""},{"n":1286,"t":"Famous Personality","q":"Who is famously known as Bihar Kesari ?","o":["Rajendra Prasad","Shri Krishna Sinha","Karpuri Thakur","Lala Lajpat Rai"],"a":1,"e":"Shri Krishna Sinha was also known as Bihar Kesari and Shri Babu. He served as the first Chief Minister of Bihar from 1946 to 1961. Nicknames of other personalities -Rajendra Prasad (Desh Ratna, Ajatshatru), Karpuri Thakur (Jana Nayak), Spacing 7 -Lala Lajpat Rai (Punjab Kesari).","s":""},{"n":1287,"t":"Famous Personality","q":"Who is famously known as the father of the Indian nuclear programme?","o":["Homi J. Bhabha","Vikram Sarabhai","C.V.Raman","Venkatraman Radhakrishnan"],"a":0,"e":"Homi J. Bhabha. Bhabha Atomic Research Centre (Mumbai -1954), Tata Institute of Fundamental Research (Mumbai - 1945), ISRO (Bangalore - 1969), DRDO (New Delhi -1958). Vikram Sarabhai - Father of Indian Space Programme. APJ Abdul Kalam -Missile Man of India.","s":""},{"n":1288,"t":"Famous Personality","q":"Who among the following was the architect of the Integrated Guided Missile Development Program (IGMDP) in India?","o":["Har Gobind Khorana","Vikram Sarabhai","A. P. J. Abdul Kalam","Homi J. Bhabha"],"a":2,"e":"A. P. J. Abdul Kalam. IGMDP was an Indian Ministry of Defence programme to research and develop a comprehensive range of missiles. The project started in 1982 -1983 (completed in 2008) under the leadership of Dr APJ Abdul Kalam (missile man of India). Prithvi, Agni, Trishul, Akash, Nag missiles have been developed under this.","s":""},{"n":1289,"t":"Famous Personality","q":"Who among the following is famously called the Iron Lady of India?","o":["Mary Kom","Deepika Padukone","Lata Mangeshkar","Indira Gandhi"],"a":3,"e":"Indira Gandhi . She was the third prime minister of India from 1966 to 1977 and from 1980 until her assassination in 1984. She was India's first and, to date, only female prime minister of India. Awards - Bharat Ratna (1971), and Bangladesh Freedom Honour (2011). Mary Kom - The first Indian woman boxer to win an olympic medal and a gold at Asian Games.","s":""},{"n":1290,"t":"Famous Personality","q":"Who among the following was famously known as the \"The parrot of India\"?","o":["Amir Khusro","Lata Mangeshkar","Pandit Ravishankar","Kalidas"],"a":0,"e":"Amir Khusro: He was a poet in Delhi Sultanate. He is sometimes referred to as the \"voice of India\" or \"Parrot of India\" (Tuti-e-Hind), and has been called the \"Father of Urdu literature”. He was a mystic and a spiritual disciple of Nizamuddin Auliya of Delhi.","s":""},{"n":1291,"t":"Famous Personality","q":"Which Indian cricketer is also known as Little Master ?","o":["Umesh Yadav","Virat Kohli","Sunil Gavasker","Kapil Dev"],"a":2,"e":"Sunil Gavasker. Haryana Hurricane - Kapil Dev, Captain Cool -Mahendra Singh Dhoni, The Wall - Rahul Dravid, Jumbo - Anil Kumble, Turbanator -Harbhajan Singh, Master Blaster - Sachin Tendulkar, Hit - Man - Rohit Sharma, Nawab of Nazafgarh - Virendra Sehwag.","s":""},{"n":1292,"t":"Famous Personality","q":"Who among the following is referred to as ‘Prince of Bhangra’, due to his Bhangra music?","o":["Diljit Dosanjh","Sukhbir Singh","Arijit Singh","Shaan"],"a":1,"e":"Sukhbir Singh. He was nominated and won the 1996 Channel V Awards in three categories: Best Debut Album, Best Male Vocalist and Best Music Video (for \"Punjabi Munde\") for his first album ‘New Style ’.","s":""},{"n":1293,"t":"Famous Personality","q":"The Open Hand Monument in Chandigarh was designed by ______.","o":["Matthew Nowicki","Maxwell Fry","Le Corbusier","Albert Mayer"],"a":2,"e":"Le Corbusier. Chandigarh city was designed by Le Corbusier . Matthew Nowicki was chief architect of the new Indian city of Chandigarh. Albert Mayer known for plan of Chandigarh.","s":""},{"n":1294,"t":"Famous Personality","q":"Who among the following was the prime minister of India in 1978 ?","o":["Gulzari Lal Nanda","Charan Singh","Lal Bahadur Shastri","Morarji Desai"],"a":3,"e":"Morarji Desai . He was leading the government formed by the Janata Party. He is the oldest person to hold the office of prime minister, at the age of 81, in the history of Indian politics.","s":""},{"n":1295,"t":"Famous Personality","q":"How is Dhanpat Rai Srivastava better known?","o":["Agyeya","Dinkar","Nirala","Premchand"],"a":3,"e":"Premchand was an Indian writer known for his modern Hindustani literature.","s":""},{"n":1296,"t":"Famous Personality","q":"With which of the following literary magazines was poet and writer Amrita Pritam associated?","o":["Shabad","Nagmani","Awaaz","Preetlari"],"a":1,"e":"Nagmani. Amrita Pritam was an Indian novelist, essayist and poet, who wrote in Punjabi and Hindi. She edited Nagmani, a monthly literary magazine in Punjabi for several years.","s":""},{"n":1297,"t":"Famous Personality","q":"Mario de Miranda was a ______ from the state of Goa.","o":["designer","vocalist","cartoonist","poet"],"a":2,"e":"Cartoonist. Mario de Miranda : Awards - Padma Shri (1988), Padma Bhushan (2002), Padma Vibhushan (2012).","s":""},{"n":1298,"t":"Famous Personality","q":"Lal Bahadur Shastri was born on ______.","o":["2 October 1869","12 October 1904","12 October 1869","2 October 1904"],"a":3,"e":"2 October 1904. He was born in Mughalsarai, UP. He served as the second Prime Minister of India. The Iconic slogan “Jai Jawan Jai Kisaan ” was given by him.","s":""},{"n":1299,"t":"Famous Personality","q":"Veteran freedom fighter, social reformer and feminist Savithribai Phule hailed from which of the following states of India?","o":["Maharashtra","Odisha","Rajasthan","Gujarat"],"a":0,"e":"Maharashtra. She was the first female teacher of India.","s":""},{"n":1300,"t":"Important Days","q":"Who among the following is related to the Parakram Diwas?","o":["Subhash Bose","Azad","Mahatma Gandhi","Bhagat Singh"],"a":0,"e":"Subhash Bose. Parakram Diwas is celebrated on 23rd January every year to honor the birth anniversary of Netaji Subhash Chandra Bose. The Government of India declared this day in 2021 to recognize his unparalleled role in India's freedom struggle, leadership of the Azad Hind Fauj (INA), and his inspiring call for total independence. The day highlights his courage, patriotism, and vision for a strong and self-reliant India.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1301,"t":"Important Days","q":"On which of the following dates does India celebrate its Constitution Day?","o":["26 th January","26 th November","15 th August","2 nd October"],"a":1,"e":"26th November. The Constitution of India was adopted on 26 November 1949, that is why Constitution Day is celebrated on 26 November. 15th August : Independence Day (commemorating India’s independence from British rule in 1947). 2nd October : Gandhi Jayanti (the birthday of Mahatma Gandhi, celebrated as a national holiday and also observed as International Day of Non-Violence). 26th January : Republic Day (the Constitution of India came into force on 26 January 1950).","s":""},{"n":1302,"t":"Important Days","q":"The birth anniversary of Mahatma Gandhi is celebrated as the national festival of India. In which of the following years was Gandhi ji born ?","o":["1885","1869","1890","1877"],"a":1,"e":"1869. 2nd October is also observed globally as the International Day of Non-Violence in recognition of his contributions to peace and non-violent movements. India's three national festivals are: Republic Day (January 26) -Marks the adoption of the Indian Constitution in 1950. Independence Day (August 15) - Commemorates India's independence from British rule in 1947. Gandhi Jayanti (October 2) - Celebrates the birth anniversary of Mahatma Gandhi.","s":""},{"n":1303,"t":"Important Days","q":"In India, Teachers’ Day is celebrated annually on September 5 to mark the birthday of:","o":["APJ Abdul Kalam","Sardar Vallabhbhai Patel","Sarvepalli Radhakrishnan","Subash Chandra Bose"],"a":2,"e":"Sarvepalli Radhakrishnan. He served as India's first Vice-President from 1952 to 1962. He was awarded the Bharat Ratna in 1954. APJ Abdul Kalam : He was an Indian aerospace scientist and the 11th President of India. His birthday on October 15 is celebrated as World Students' Day to honor his dedication to education. Sardar Vallabhbhai Patel : His birthday (October 31) is celebrated as National Unity Day or Rashtriya Ekta Diwas in India. Subhas Chandra Bose : His birthday (January 23) is celebrated as Parakram Diwas in India.","s":""},{"n":1304,"t":"Important Days","q":"In November 2021, the government declared November 15 as ‘Janjatiya Gaurav Divas’. It happens to be the birth anniversary of which of the following freedom fighters?","o":["Birsa Munda","Kanhu Murmu","Arjun Munda","Veer Narayan Singh"],"a":0,"e":"Birsa Munda. Janjatiya Gaurav Divas celebrations begin with President Murmu paying tribute to Bhagwan Birsa Munda in Khunti district, Jharkhand. Birsa Munda (1875-1900) was born into a Munda family, a tribal group residing in Chotanagpur. He led the Munda Rebellion, a significant tribal uprising in the region south of Ranchi, between 1899 and 1900.","s":""},{"n":1305,"t":"Important Days","q":"National Sports Day is celebrated on the birthday of _______.","o":["Kapil Dev","Roop Singh","Major Dhyan Chand","MS Dhoni"],"a":2,"e":"Major Dhyan Chand. National Sports Day is celebrated on August 29th to honor the legendary hockey player Major Dhyan Chand, who is regarded as one of the greatest field hockey players. Other Personalities and Days Celebrated: Mahatma Gandhi: Gandhi Jayanti (2 nd October), Jawaharlal Nehru: Children's Day (14 th November), Sardar Vallabhbhai Patel: National Unity Day (31 st October), APJ Abdul Kalam: World Students' Day (15 th October).","s":""},{"n":1306,"t":"Important Days","q":"When is National Javelin Day celebrated in India ?","o":["12 th January","7 th August","6 th August","29 th August"],"a":1,"e":"7th August. National Javelin Day is celebrated in India on August 7th to commemorate Neeraj Chopra's gold medal in the men's javelin throw event at the 2021 Tokyo Olympics. The Athletics Federation of India (AFI) established the day to celebrate Chopra's achievement and promote the sport of javelin throwing in India. Other Important Days: 12th January: National Youth Day (Swami Vivekananda's birthday), 29th August: National Sports Day (birth anniversary of Major Dhyan Chand).","s":""},{"n":1307,"t":"Important Days","q":"The National Youth Day or the ‘Yuwa Diwas’ is celebrated on which day in India ?","o":["26 January","12 January","14 April","26 November"],"a":1,"e":"12 January. The day is observed to commemorate the birth anniversary of Swami Vivekananda. Important Dates and Days : 31st October - National Unity Day (Celebrates the birth of Sardar Vallabhbhai Patel), 5th September - Teachers' Day (Celebrates the birth of Dr. Sarvepalli Radhakrishnan), 14th November - Children's Day (Celebrates the birth of Jawaharlal Nehru), 30th January - Martyrs' Day (Observed to commemorate the death of Mahatma Gandhi).","s":""},{"n":1308,"t":"Important Days","q":"International Yoga Day is celebrated on ________.","o":["20 June","23 June","22 June","21 June"],"a":3,"e":"21 June. The International Day of Yoga has been celebrated across the world annually since 2015, following its inception in the United Nations General Assembly in 2014. Important days and Dates :- 9th Jan - Pravasi Bhartiya Diwas, 12th Jan - National Youth Day, 2nd Feb - World Wetlands Day, 28th Feb - National Science Day, 8th Mar -International Women’s Day, 7th Apr -World Health Day, 31st May - World Anti-Tobacco Day, 5th June - World Environment Day, 16th Sep - World Ozone Day, 4th Dec - Indian Navy Day.","s":""},{"n":1309,"t":"Important Days","q":"Independence Day is celebrated every year in Pakistan on _________.","o":["30 January","14 August","31 December","23 March"],"a":1,"e":"14 August. India - 15 August 1947. Independence Day of other Countries: Bangladesh - 26 March 1971, Sri Lanka - 4 February 1948, Nepal - 21 December 1923, China - 1 October 1949, Myanmar - 4 January 1948, America - 4 July 1776, Canada - 1 July 1867.","s":""},{"n":1310,"t":"Important Days","q":"When was the International Day of the Girl Child 2021 celebrated?","o":["14 October","12 October","13 October","11 October"],"a":3,"e":"11 October. International Girl Child Day - First time celebrated in\n2012. It is celebrated by the United Nations General Assembly. Other important Days: 5 October - World Teachers' Day, 2 October - Gandhi Jayanti, 23 March - Sahid Diwas, 22 April - Earth Day, 5 June - Environment Day.","s":""},{"n":1311,"t":"Important Days","q":"According to the Indian calendar, Vasanta Season falls in which months?","o":["Chaitra-Vaisakha","Jyaistha-Asadha","Margashirsa-Pausa","Sravana-Bhadra"],"a":0,"e":"Chaitra-Vaisakha. Seasons according to the Hindu Calendar: Grishma ritu - Jyeshtha and Aashaadha, Varsha ritu - Shravana and Bhadrapada, Sharad ritu - Ashwin and Kartik, Shishir or Shita ritu - Magha and Phalguna. Hindu months in chronological order: Chaitra, Vaishakh, Jyeshtha, Aashada, Shraavana, Bhadra, Ashwin, Kartik, Margashirsha, Pausha, Magha, Phalgun.","s":""},{"n":1312,"t":"Important Days","q":"According to the Indian calendar, Hemanta season falls in which months?","o":["Sravana - Bhadra","Chaitra - Vaisakha","Jyaistha - Asadha","Margashirsa - Pausa"],"a":3,"e":"Margashirsa - Pausa. Other Seasons according to the Hindu Calendar: Basant ritu - Chaitra and Vaisakha, Grishma ritu - Jyeshtha and Aashaadha, Varsha ritu - Shravana and Bhadrapada, Sharad ritu - Ashwin and Kartik.","s":""},{"n":1313,"t":"Important Days","q":"In which month of the Islamic calendar is 'Ramadan', a holy time when Muslims around the world fast and focus their attention on giving to charity (known as Zakat), observed?","o":["Ninth","Second","Seventh","Sixth"],"a":0,"e":"Ninth. Ramadan begins and ends with the appearance of the crescent moon. Islamic months- (1) Muharram, (2) Safar, (3) Rabi al-Awwal, (4) Rabi al-Thani, (5) Jumada al-Awwal, (6) Jumada al-Thani, (7) Rajab, (8) Shaban, (9) Ramadan, (10) Shawwal, (11) Dhu al-Qadah, (12) Dhu al-Hijjah (month of Hajj). Other festivals of muslims: Muharram, Eid al-Adha, Eid al-Fitr, Mawlid an-Nabi and Eid ul-Azha.","s":""},{"n":1314,"t":"Important Days","q":"When was the International Day for Elder Persons 2021 celebrated?","o":["1 October","3 October","4 October","2 October"],"a":0,"e":"1 October. Important Days in October : 2 October - International day of non-violence, 9 October - World Post Day, 10 October - World Mental Health Day, 16 October - World Food Day, 17 October - International Day for the Eradication of Poverty, 24 October -World Polio Day.","s":""},{"n":1315,"t":"Important Days","q":"The first day of the Tamil calendar on 14 April is celebrated as ____","o":["Mahamaham","Onam","Pongal","Puthandu"],"a":3,"e":"Puthandu. Mahamaham is a Hindu festival celebrated every 12 years during the Tamil month of Masi.","s":""},{"n":1316,"t":"Important Days","q":"Easter is celebrated on which of the following days of the week?","o":["Wednesday","Monday","Sunday","Tuesday"],"a":2,"e":"Sunday. Easter Sunday :- It is a religious Christian holiday that is observed globally to celebrate the resurrection of Jesus Christ.","s":""},{"n":1317,"t":"Important Days","q":"On which day of the Hindu calendar is the festival of Holi celebrated ?","o":["Chaitra Poornima","Chaitra Saptami","Falgun Poornima","Falgun Amavasya"],"a":2,"e":"Falgun Poornima. The festival is celebrated for two days: First Day - Holika Dahan or Chhoti Holi. Second Day - Rangwali Holi, Dhulandi or Phagwah.","s":""},{"n":1318,"t":"Important Days","q":"Ganesh Chaturthi is observed in _______ month of Hindu calendar.","o":["Kartika","Ashadha","Bhadrapada","Vaishakh"],"a":2,"e":"Bhadrapada . Festival according to Hindu Calendar: Chaitra -Ugadi, Gudi Padwa, Ram Navami. Jyeshtha - Ganga Dussehra. Ashada -Jagannath Rath Yatra, Guru Purnima. Shravana - Raksha Bandhan. Bhadrapada - Janmashtami, Hartalika Teej. Kartik -Karwa Chauth, Dhanteras, Diwali, Bhai Dooj, Chhath Puja. Phalguna - Holi. Other festivals of Maharashtra - Gudhi Padwa, Narali Pournima, Bhau Beej, Ellora Festival, Pola, Banganga Festival.","s":""},{"n":1319,"t":"Important Days","q":"In India, National Voters' Day is celebrated on ____________","o":["26 March","24 February","27 December","25 January"],"a":3,"e":"25 January. Other important days - 1 January - Global Family Day. 9 January - Pravasi Bharatiya Divas. 12 January - National youth day. 15 January - Thal Sena Divas (Army Day). 25 January - Indian Tourism Day. 21 February - International Mother Language Day. 24 February - Central Excise Day. 1 March - World Civil Defence Day.","s":""},{"n":1320,"t":"Important Days","q":"How many Indian states celebrate their formation on November 1 st ?","o":["Eight","Seven","Five","Six"],"a":1,"e":"Seven. States formed on 1st November : Andhra Pradesh (1956), Karnataka (1956), Kerala (1956), Madhya Pradesh (1956), Haryana (1966), Punjab (1966), Chhattisgarh (2002). Two Union Territories also formed on this day : Puducherry (1954) and Lakshadweep (1956).","s":""},{"n":1321,"t":"Important Days","q":"Engineer's Day in India is celebrated in the memory of _______.","o":["Kalpana Chawla","Dr. M. Visvesvaraya","Satish Dhawan","A.P.J Abdul Kalam"],"a":1,"e":"Dr. M. Visvesvaraya. He was Chief Engineer of Mysore State (1909) and the 19th Dewan of Mysore (1912 to 1918). Books : “Reconstructing India” and “Planned Economy of India”. Engineer's Day (15 September) in India is celebrated for their contribution. Awards - Order of the Indian Empire (1911); Bharat Ratna (1955).","s":""},{"n":1322,"t":"Important Days","q":"Every year, Halloween is celebrated on __________ .","o":["24 November","25 December 𝑠𝑡 𝑠𝑡","1 October","31 October"],"a":3,"e":"31st October. A holiday widely observed particularly in the United States and Canada. 24 th November: Thanksgiving Day (in the United States). 25 th December: Christmas Day. 18 th December - International Migrants Day. 1 December - World AIDS day.","s":""},{"n":1323,"t":"Important Days","q":"Which is the first month in the Islamic lunar calendar (Islamic lunar calendar)?","o":["Shawwal","travel","Ramzan","Muharram"],"a":3,"e":"Muharram has a 10-day period when Muslims mourn the martyrdom of Hazrat Imam Hussain, son of Hazrat Ali and Grandson of Prophet Muhammad.","s":""},{"n":1324,"t":"Important Days","q":"International Tiger Day is observed on_","o":["July 5th","July 30th","July 29th","July 4th"],"a":2,"e":"July 29th - Celebrate with the aim of conserving tigers and saving their endangered species.","s":""},{"n":1325,"t":"Important Days","q":"In India, National Statistics Day is celebrated on","o":["22nd June","15th June","28th June","29th June"],"a":3,"e":"29th June (Celebrated as the birth anniversary of Prof. P. C. Mahalanobis who worked in the field of Statistics and planning commission). 1 June - World Milk Day, 5 June - World Environment Day, 7 June - World Food Safety Day, 20 June - World Refugee Day , 23 June - International Olympic Day and United Nations Public Service Day. 15 June - World Wind Day.","s":""},{"n":1326,"t":"Important Days","q":"International Women's Day celebrated on?","o":["12th march","8th march","8th july","12th july"],"a":1,"e":"8th march. 12th March-National Girl Scout Day and National Napping Day. 26th August - Women’s Equality Day.","s":""},{"n":1327,"t":"Important Days","q":"World Environment Day is held every year on ________.","o":["5th June","1st January","29th August","1st July"],"a":0,"e":"5th June . 1st January -Global Family Day. 1st July - National Doctors' Day in India in memory of Dr. Bidhan Chandra Roy.","s":""},{"n":1328,"t":"Important Days","q":"International Day for the preservation of the Ozone layer is observed on.","o":["September 13","September 10","September 16","September 18"],"a":2,"e":"September 16 . The ozone layer (found in the stratosphere) is a thin part of Earth's atmosphere that absorbs almost all of the sun's harmful ultraviolet light. 18 September - World Bamboo Day, 21 September - International Day of Peace (UN), 26 September - World Environmental Health Day, 10 September - World Suicide Prevention Day (WSPD).","s":""},{"n":1329,"t":"Important Days","q":"In which month, Hiroshima Day is observed across the world?","o":["October","August","January","July"],"a":1,"e":"August. Hiroshima Day is observed on 6 August (Little Boy) to commemorate the atomic bombing of Hiroshima Japan in the year 1945 and 9 August (Fat Man) of Nagasaki, at the end of World War II (1939 - 1945). World War I - 1914 to 1918. The atomic bomb is based on the principle of nuclear fission.","s":""},{"n":1330,"t":"Important Days","q":"\"World Refugee Day\" is observed every year on______.","o":["20th june","22th june","18th june","17th june"],"a":0,"e":"20th June . World Refugee Day 2023 Theme: “Whoever, Whatever, Whenever.” First time: 2001. It is designated as an International Day by the UN (United Nations). It celebrates the strength and courage of people who have been forced to flee their home country to escape conflict or persecution.","s":""},{"n":1331,"t":"Important Days","q":"Swami Vivekananda’s death anniversary is observed on _______ .","o":["July 1","July 4","August 1","August 4"],"a":1,"e":"July 4 . Swami Vivekananda was born on 12 January 1863. January 12 is observed as National Youth Day. Vivekananda Title - Maharaja Ajit singh of Khetri. Established - RamaKrishna Mission in 1897. He Introduced Indian philosophies of Vedanta and Yoga.","s":""},{"n":1332,"t":"Important Days","q":"When did the Constitution of WHO come into force - a date which we now celebrate World Health Day every year ?","o":["5 April 1948","7 April 1948","6 April 1948","8 April 1948"],"a":1,"e":"7 April 1948. WHO (World Health Organisation): responsible for international public health. Its decision -making body is the World Health Assembly (WHA). Headquarter - Geneva, Switzerland.","s":""},{"n":1333,"t":"Important Days","q":"In honor of an Indian musician, the US state of Massachusetts proclaimed 20 April as__________ in 1984.","o":["Sakhawat Hussain Day","Sharan Rani Backliwal Day","Amjad Ali Khan Day","Allauddin Khan Day"],"a":2,"e":"Amjad Ali Khan Day ( sarod player) - 21st Rajiv Gandhi National Sadbhavna Award, Padma Shri (1975), Padma Bhushan (1991), Padma Vibhushan (2001), Sangeet Natak Akademi Award (1989), Fukuoka Asian Culture Prize in 2004.","s":""},{"n":1334,"t":"Important Days","q":"Which of the following environment events is observed by switching off all lights at homes, business establishments, landmarks and so on for an hour ?","o":["World Environment Day","Earth Hour Day","Earth Charter Day","Earth Day"],"a":1,"e":"Earth Hour Day . It is observed on 26 March every year. Earth Day is an annual event on April 22 to demonstrate support for environmental protection. Theme- Invest In our Planet.","s":""},{"n":1335,"t":"Important Days","q":"Which day has been declared by the World Health Organization as Hand Hygiene Day?","o":["5th May","18th August","21st July","14th June"],"a":0,"e":"5th May . National Ice Cream Pie Day is observed annually on August 18th. 14th June- World Blood Donor Day.","s":""},{"n":1336,"t":"Important Days","q":"Which of the following decades was proclaimed by the General Assembly of the United Nations as the International Decade for action on ‘Water for life’?","o":["1994 - 2004","1972 - 1982","1983 - 1993","2005 - 2015"],"a":3,"e":"2005 - 2015. The decade of 1994-2004:- Decade of the world’s Indigenous People. The decade of 1983-1993 : Second Decade to Combat Racism and Racial Discrimination. 2021-2030:- United Nation Decade on Ecosystem Restoration. 2014 - 2024:-United Nations Decade of sustainable Energy for all.","s":""},{"n":1337,"t":"Important Days","q":"When is National Consumer Day observed in India?","o":["26th December","24th December","24th November","26th November"],"a":1,"e":"24th December. On this day the Consumer Protection Act, 1986 had received the assent of the president. World Consumer Rights Day - 15 March.","s":""},{"n":1338,"t":"Important Days","q":"When is National Handloom Day celebrated?","o":["23rd August","18th November","15th September","7th August"],"a":3,"e":"7th August (Celebrated Since 2015). National Handloom Day is celebrated to mark the beginning of Swadeshi Andolan on August 7, 1905. Aim - To encourage indigenous industries including handloom weavers.","s":""},{"n":1339,"t":"Important Days","q":"When is World Nature Conservation Day observed?","o":["12th July","5th August","28th July","30th May"],"a":2,"e":"July 28. Objective - Raise awareness about the importance of protecting our natural resources and the environment. World Environment Day (5th June). International Day for Biological Diversity (22nd May).","s":""},{"n":1340,"t":"Important Days","q":"When is the Hindi Diwas observed annually ?","o":["14 March","6 April","14 September","2 October"],"a":2,"e":"14 September (Celebrated Since 1953). On 14 September 1949, the Constituent Assembly accepted Hindi in the Devanagari script as the official language of India. World Hindi Day -January 10.","s":""},{"n":1341,"t":"Important Days","q":"When is Martyr’s Day observed in India every year?","o":["12 March","19 September","25 October","30 January"],"a":3,"e":"30th January . The date was chosen as it marks the assassination of Mohandas Karamchand Gandhi in 1948, by Nathuram Godse.","s":""},{"n":1342,"t":"Important Days","q":"Which day in May 2020 was observed as 'International Tea Day' ?","o":["21 May","1 May","15 May","23 May"],"a":0,"e":"21 May.","s":""},{"n":1343,"t":"Important Days","q":"On which of the following days is World Computer Literacy Day observed?","o":["5 June","2 December","13 May","30 September"],"a":1,"e":"December 2 . June 5: World Environment Day. 30 September: International Translation Day.","s":""},{"n":1344,"t":"Important Days","q":"World Thyroid Day is observed on ______.","o":["30th April","17th June","25th May","23rd March"],"a":2,"e":"25th May. 17th June - World Day to Combat Desertification and Drought. 23rd March- World Meteorological Day.","s":""},{"n":1345,"t":"Important Days","q":"On which date International Day of Biological Diversity is celebrated?","o":["22nd June","20th May","17th May","22nd May"],"a":3,"e":"22nd May. Proclaimed by the United Nations in December 2000 to commemorate adoption of the final draft of Convention on Biological Diversity on 22 May 1992 by the Nairobi Final Act of the Conference.","s":""},{"n":1346,"t":"Important Days","q":"The birth anniversary of _____ is celebrated as 'International Nurses Day' every year.","o":["Clara Barton","Alice Walker","Florence Nightingale","Mother Teresa"],"a":2,"e":"Florence Nightingale (the foundational philosopher of modern nursing) . International Nurses Day (12th May) is celebrated to commemorate her birth in 1820. The event was established in 1974 by the International Council of Nurses (ICN).","s":""},{"n":1347,"t":"States G.K.","q":"Sama Chakeva is a folk dance based on the mythological story of the siblings Sama and Chakeva, in which the brother goes to an extreme extent to save his sister. With which State of India is this folk dance associated?","o":["Assam","Haryana","Bihar","Punjab"],"a":2,"e":"Bihar. Sama Chakwa festival is celebrated in the Mithila Region (Bihar and some parts of Nepal).","s":""},{"n":1348,"t":"States G.K.","q":"Which of the following states/UTs has the first 100% fully digital literate Panchayat in India?","o":["Kerala","Puducherry","Maharashtra","Delhi"],"a":0,"e":"Kerala . Pullampara grama panchayat in Thiruvananthapuram has become the first digitally literate panchayat in Kerala. The Digi Pullampara","s":""},{"n":1349,"t":"States G.K.","q":"Which of the following is the official language of Tripura?","o":["Mizo","Kokborok","Khasi","Garo"],"a":1,"e":"Kokborok is a Tibeto -Burman language spoken by the Tripuri people of the Indian state of Tripura and neighboring areas of Bangladesh. The official languages of Tripura are Bengali, English and Kokborok. Tripura : Capital -Agartala. State Animal - Phayre's langur. State bird - Green imperial pigeon. State tree - Agar. State flower - Nageshwar.","s":""},{"n":1350,"t":"States G.K.","q":"Which state hosts the Nehru trophy boat race?","o":["Kerala","Goa","Karnataka","Tamil Nadu"],"a":0,"e":"Kerala . The Nehru Trophy Boat Race is an annual event held in the Punnamada Lake in Alappuzha district of Kerala. The race was first held in 1952 to commemorate a visit by India's first Prime Minister, Jawaharlal Nehru, to the state.","s":""},{"n":1351,"t":"States G.K.","q":"Lal Thanhawla holds the record for the longest-serving Chief Minister of ________, occupying the position for five terms.","o":["Meghalaya","Manipur","Mizoram","Sikkim"],"a":2,"e":"Mizoram : Formation - 20 February 1987; 1st Governor - Hiteswar Saikia; First Chief Minister - C. Chhunga.","s":""},{"n":1352,"t":"States G.K.","q":"Baiga is a folk music of Baiga Tribe from which of the following states?","o":["Assam","Bihar","Uttarakhand","Madhya Pradesh"],"a":3,"e":"Madhya Pradesh. Other Baiga tribe dances include Faag, Saila, Karma, and Bilma.","s":""},{"n":1353,"t":"States G.K.","q":"Which of the following states is famous for celebrating the festival of Vijaya Dashami, which marks the end of Durga puja?","o":["West Bengal","Rajasthan","Telengna","Chhattisgarh"],"a":0,"e":"West Bengal. Vijayadashami (also known as Dussehra) is a major Hindu festival celebrated every year at the end of Durga Puja and Navratri. It is observed on the tenth day of the month of Ashvin.","s":""},{"n":1354,"t":"States G.K.","q":"In which of the following states is the Sanchi Stupa UNESCO world heritage site located?","o":["Madhya Pradesh","Rajasthan","Bihar","Punjab"],"a":0,"e":"Madhya Pradesh. The Sanchi Stupa was declared a world heritage site by UNESCO in 1989. Sanchi is a Buddhist complex, famous for its Great Stupa, on a hilltop at Sanchi Town in Raisen District of Madhya Pradesh. It was originally commissioned by the Mauryan emperor Ashoka. UNESCO World Heritage Sites in India: Ajanta Caves (1983), Group of Monuments at Mahabalipuram (1984), Mahabodhi Temple Complex at Bodh Gaya (2002).","s":""},{"n":1355,"t":"States G.K.","q":"‘Lai-Phi’ and ‘Chin-Phi’ are the cultural costumes of which state?","o":["Nagaland","Uttarakhand","Manipur","Sikkim"],"a":2,"e":"Manipur. Manipur Traditional Costumes: For Women - Innaphi, Phanek, Mayek Naibi, Kanap Phanek. For Men - Dhoti with a jacket, white turban, Khamen Chatpa, Ningthoupee dress.","s":""},{"n":1356,"t":"States G.K.","q":"Match the states in column A with their official languages in column B.\nColumn A Column B (States) (Official Languages)\n1. Andhra Pradesh a. Malayalam\n2. Kerala b. Telugu\n3. Karnataka c. Konkani\n4. Goa d. Kannada","o":["1-b, 2-a, 3-c, 4-d","1-b, 2-a, 3-d, 4-c","1-a, 2-b, 3-d, 4-c","1-a, 2-b, 3-c, 4-d"],"a":1,"e":"1-b, 2-a, 3-d, 4-c. States and their official languages: Punjab -Punjabi, Rajasthan - Hindi, Uttar Pradesh - Hindi, Bihar - Hindi, Odisha - Odia, Assam - Assamese, West Bengal -Bengali, Maharashtra - Marathi, Tamil Nadu - Tamil, Gujarat - Gujarati. India has two official languages: Hindi and English.","s":""},{"n":1357,"t":"States G.K.","q":"Guntapalle Chaitya Buddhist cave is situated in which of the following states?","o":["Andhra Pradesh","Bihar","Maharashtra","Himachal Pradesh"],"a":0,"e":"Andhra Pradesh. The Guntapalle Chaitya Buddhist cave is a rock-cut temple complex, featuring both chaityas and viharas. Indian States and Caves: Andhra Pradesh - Belum Caves, Borra Caves, Guttikonda Bilam. Maharashtra - Ajanta and Ellora caves, Aurangabad Caves, Bhaja Caves, Pitalkhora Caves, Ghorawadi Caves, Kanheri Caves. Bihar - Barabar Caves, Nagarjuna Caves.","s":""},{"n":1358,"t":"States G.K.","q":"Amaravati stupa is situated in which of the following states?","o":["Tamil Nadu","Odisha","Andhra Pradesh","Madhya Pradesh"],"a":2,"e":"Andhra Pradesh. Amaravati Stupa is situated in the Guntur district of Andhra Pradesh. It was built by the Satavahana dynasty. Life and teaching of Buddha are carved out in the stupa. It was discovered by Colin Mackenzie in 1797.","s":""},{"n":1359,"t":"States G.K.","q":"Pakyong airport is located in ________.","o":["Sikkim","Assam","Nagaland","Arunachal Pradesh"],"a":0,"e":"Sikkim. Pakyong Airport is one of the five highest airports in India. Airports in India: Lokpriya Gopinath Bordoloi International Airport (Assam), Pasighat Airport (Arunachal Pradesh), Dimapur Airport (Nagaland), Netaji Subhas Chandra Bose International Airport (Kolkata), Rajiv Gandhi International Airport (Hyderabad), Veer Savarkar International Airport (Port Blair), Dr. Babasaheb Ambedkar International Airport (Nagpur).","s":""},{"n":1360,"t":"States G.K.","q":"In which of the following states are Aus, Boro and Aman paddy crops grown in a year?","o":["Odisha","Uttarakhand","Haryana","Punjab"],"a":0,"e":"Odisha. Aman, Aus and Boro are rice varieties. Rice is usually sown thrice in a year. Aman: This variety is sown in the rainy season (July-August) and harvested in winter. Aus: Rice sown in summer along with the pre-monsoonal showers and harvested in autumn. Boro: Rice sown in winter and harvested in summer. This is also called spring rice.","s":""},{"n":1361,"t":"States G.K.","q":"Bharhut Stupa is located in which of the following states ?","o":["Punjab","Madhya Pradesh","Uttar Pradesh","Bihar"],"a":1,"e":"Madhya Pradesh. Bharhut is famous for the ruins of a Buddhist stupa (shrine) discovered there by Major General Alexander Cunningham in 1873.","s":""},{"n":1362,"t":"States G.K.","q":"In which state of India is Kaziranga National Park located ?","o":["Assam","Gujarat","Karnataka","West Bengal"],"a":0,"e":"Assam. Kaziranga National Park - A UNESCO world heritage site of India and known for one horned Rhinoceros. National Parks in India : Jim Corbett National Park - Uttarakhand, Ranthambore National Park - Rajasthan, Blackbuck National Park, Gir National Park - Gujarat. Kanha National Park -Madhya Pradesh, Bhitarkanika National Park - Odisha.","s":""},{"n":1363,"t":"States G.K.","q":"According to the Ministry of Commerce and Industry (2018-19), which state of India is the largest producer of Rubber?","o":["Maharashtra","Gujarat","Kerala","Uttar Pradesh"],"a":2,"e":"Kerala (490460 tonnes). Top Natural Rubber producing Indian States: Kerala, Tamil Nadu, Tripura, Assam, Meghalaya, Nagaland, Manipur, Mizoram.","s":""},{"n":1364,"t":"States G.K.","q":"In which state is Vijay Stambh situated?","o":["Rajasthan","Punjab","Uttar Pradesh","Gujarat"],"a":0,"e":"Rajasthan. Vijay Stambh (Tower of Victory) was built by Maharana Kumbha between 1440 AD and 1448 AD to commemorate his victory over the combined armies of Gujarat and Malwa led by Mahmud Khilji. It is situated inside Chittor Fort in Chittorgarh. This tower is dedicated to Hindu God Vishnu.","s":""},{"n":1365,"t":"States G.K.","q":"In which city is the Rajghat memorial situated?","o":["Ahmedabad","Surat","Delhi","Agra"],"a":2,"e":"Delhi. Famous Memorials in Delhi : Shanti Van (Jawaharlal Nehru), Vijay Ghat (Lal Bahadur Shastri), Shakti Sthal (Indira Gandhi), Sadaiv Atal (Atal Bihari Vajpayee), Vir Bhumi (Rajiv Gandhi), Samta Sthal (Babu Jagjivan Ram), Sangharsh Sthal (Chaudhary Devi Lal).","s":""},{"n":1366,"t":"States G.K.","q":"Where is the Vivekanand Rock Memorial situated?","o":["Port Blair","Vishakhapatnam","Kanyakumari","Chennai"],"a":2,"e":"Kanyakumari (Tamil Nadu). Vivekananda Rock Memorial - Its construction was completed in 1970. Swami Vivekananda visited Kanyakumari in 1892. He was a disciple of Ramakrishna Paramahamsa and the founder of Ramakrishna Mission. The memorial consists of two main structures, the Vivekananda Mandapam and the Shripada Mandapam.","s":""},{"n":1367,"t":"States G.K.","q":"Rann Utsav is celebrated in which of the following states?","o":["Goa","Punjab","Gujarat","Haryana"],"a":2,"e":"Gujarat. Rann Utsav - It was conceptualised as a three-day festival, which progressively evolved into a 100-day celebration at Dhordo, a village near Rann of Kutch.","s":""},{"n":1368,"t":"States G.K.","q":"Which of the following states has the honour of being India's first carbon-free state?","o":["Arunachal Pradesh","Himachal Pradesh","Madhya Pradesh","Kerala"],"a":1,"e":"Himachal Pradesh ( India's first and the world's second carbon-free state). A state is carbon-free if all of its electricity is from clean energy sources like wind, solar, and nuclear. First carbon neutral district - Majuli (Assam). First carbon free panchayat - Pali Village (Jammu and Kashmir). Bhutan is the first carbon negative country in the world.","s":""},{"n":1369,"t":"States G.K.","q":"Which Indian state is renowned for the traditional canal irrigation method known as 'Kulh'?","o":["Himachal Pradesh","Odisha","Andhra Pradesh","Uttar Pradesh"],"a":0,"e":"Himachal Pradesh. Kuhls are shallow surface channels diverting water from naturally flowing streams or springs, to cultivated fields, and mainly used for flood irrigation. Water Harvesting Structures found in other states : Kerala and Karnataka (Kattas, Surangams), Maharashtra (Bandharas and Tals), Tamil Nadu (Eris), Uttar Pradesh and Madhya Pradesh (Bundhis).","s":""},{"n":1370,"t":"States G.K.","q":"Which Indian state was the first to make it mandatory for all homes to have rooftop rainwater harvesting structures?","o":["Sikkim","Tamil Nadu","Odisha","Haryana"],"a":1,"e":"Tamil Nadu. Rooftop rainwater harvesting is a technique used for the conservation of water. The rainwater that has fallen on the roof of houses or buildings is collected in storage or underground tanks through the help of pipes in this technique. This helps in recharging the groundwater levels. Rainwater harvesting is already a common practice in Mizoram.","s":""},{"n":1371,"t":"States G.K.","q":"Lotia is a regional music form of which state ?","o":["Odisha","Rajasthan","Assam","Bihar"],"a":1,"e":"Rajasthan. Lotia - It is sung by the peasants while working in the fields on the occasion of Lotia festival in the Chaitra month according to the Hindu calendar.","s":""},{"n":1372,"t":"States G.K.","q":"In which state is the Maski inscription located at present?","o":["Tamil Nadu","Andhra Pradesh","Madhya Pradesh","Karnataka"],"a":3,"e":"Karnataka. Maski inscription : Ashoka's minor rock edict. It is situated on the banks of the Muski River, a tributary of the Tungabhadra River. The inscription is written in the Brahmi script. The edict was the first of Emperor Ashoka to include the name Ashoka and not by his usual title ‘Devanampiya Piyadasi’. Discovered by -C. Beadon in 1915.","s":""},{"n":1373,"t":"States G.K.","q":"The Ravan Phadi cave in is an example of the early Chalukya style architecture which is known for its distinct sculptural style.","o":["Tamil Nadu","Kerala","Andhra Pradesh","Karnataka"],"a":3,"e":"Karnataka. Ravana Phadi Cave Temple is one of the jewels in the Aihole monuments. Other Historic Caves: Maharashtra - Ajanta Caves, Ellora Caves, Elephanta Caves. Kerala - Edakkal caves, Maniyoor caves, Ezhuthupara cave. Andhra Pradesh - Erravaram Caves, Belum Caves, Akkanna Madanna Caves.","s":""},{"n":1374,"t":"States G.K.","q":"The famous Dhamek Stupa is located in which of the following states?","o":["Andhra Pradesh","Uttar Pradesh","Madhya Pradesh","Himachal Pradesh"],"a":1,"e":"Uttar Pradesh. Dhamek Stupa - It is located at Sarnath, in Varanasi. It was built in 249 B.C. by Ashoka the Great. It was made to commemorate the event of Lord Buddha giving the first sermon to his first five disciples. Other stupas: Swayambhunath Stupa - Kathmandu (Nepal), Bharhut Stupa - Satna District (Madhya Pradesh), Kesariya Stupa - East Champaran District (Bihar), Sanchi Stupa - Raisen District (Madhya Pradesh), Chaukhandi Stupa -Varanasi (Uttar Pradesh).","s":""},{"n":1375,"t":"States G.K.","q":"Which among the following Buddhist Universities is located in Bihar, India?","o":["Vallabhi University","Somapuri University","Nalanda University","Nabadwip University"],"a":2,"e":"Nalanda University (The world’s first residential University) - Built by Kumaragupta (Gupta dynasty). Prominent rulers - Harshavardhana of Kannauj, Pala Rulers, and many scholars patronized Nalanda.","s":""},{"n":1376,"t":"States G.K.","q":"The head office of National Bank for Agricultural and Rural Development is located in ________.","o":["Pune","Mumbai","Chennai","Kolkata"],"a":1,"e":"Mumbai. NABARD (National Bank for Agricultural and Rural Development) is administered by the Government of India. It was instituted on the recommendations of B.Sivaraman Committee on 12 July 1982 by implementing the National Bank for Agriculture and Rural Development Act 1981.","s":""},{"n":1377,"t":"States G.K.","q":"Bagh Caves, which has 9 Buddhist caves, was developed around the 6th Century AD situated on the Bagh river in_________.","o":["Uttar Pradesh","Madhya Pradesh","Maharashtra","Gujarat"],"a":1,"e":"Madhya Pradesh. Bagh Caves - These are a group of nine Buddhist caves, first discovered in 1818, located on the bank of the Baghani River in Dhar district, Madhya Pradesh. Other caves: Madhya Pradesh - Udayagiri Caves (Vidisha), Pandav Caves (Pachmarhi), Dharmrajeshwar Caves (Mandsaur), Bhimbetka Caves (Bhojpur Raisen), Lohani Caves (Mandu) etc.","s":""},{"n":1378,"t":"States G.K.","q":"Which Indian state is home to the Buddhist cave temples known as Barabar Caves?","o":["Bihar","West Bengal","Sikkim","Uttar Pradesh"],"a":0,"e":"Bihar. The Barabar Hill Caves are the oldest surviving rock-cut caves in India. These are supposed to have been constructed by emperor Ashoka for the use of Ajivaka ascetics. These caves are situated in the twin hills of Barabar (four caves) and Nagarjuni (three caves). Most caves at Barabar consist of two chambers, carved entirely out of granite.","s":""},{"n":1379,"t":"States G.K.","q":"The rock - cave temple of _______ is the largest monolithic structure in the world.","o":["Udaygiri","Ajanta","Ellora","Badami"],"a":2,"e":"Ellora. The caves are dedicated to Hinduism, Buddhism, and Jainism. The Kailasa Temple (Ellora): It is a UNESCO World Heritage Site and is located in the Aurangabad district of Maharashtra, India. It is dedicated to Lord Shiva and is the largest and most impressive cave in the Ellora complex. It is a monolithic structure (carved out of a single rock).","s":""},{"n":1380,"t":"States G.K.","q":"The Elephanta Caves are located in which state?","o":["Gujarat","Rajasthan","Maharashtra","Karnataka"],"a":2,"e":"Maharashtra. Elephanta Caves: Declared a UNESCO World Heritage Site in 1987.","s":""},{"n":1381,"t":"States G.K.","q":"Which city in India is associated with the tea industry?","o":["Panipat, Haryana","Ahmedabad, Gujarat","Darjeeling, West Bengal","Madurai, Tamil Nadu"],"a":2,"e":"Darjeeling, West Bengal. Darjeeling Tea was the first product to get the Geographical Indication (GI) tag in India, in October 2004. Kangra Tea from Himachal Pradesh also has GI tag status. GI tag is regulated by the Geographical Indications of Goods (Registration and Protection) Act of 1999.","s":""},{"n":1382,"t":"States G.K.","q":"The Ganesh-rath is one of the finest monolithic temples located in ______.","o":["Somnath","Mahabalipuram","Varanasi","Nagpur"],"a":1,"e":"Mahabalipuram. The Ganesh - rath - It is one of ten rathas (\"chariots\") carved out of pink granite within the group of monuments of the Pallava Period at Mahabalipuram, a UNESCO-inscribed World Heritage Site since 1984.","s":""},{"n":1383,"t":"States G.K.","q":"Which state became the first to implement \"New Education Policy\" at pre - primary level?","o":["Tamil Nadu","Haryana","Kerala","Uttarakhand"],"a":3,"e":"Uttarakhand. National Education Policy (NEP) 2020 was announced by the Ministry of Education. It was based on the recommendation of the ‘Kasturiranjan committee’. Aim -Transform the Indian education system to meet the needs of the 21st Century. Karnataka became the first state to adopt NEP in higher education.","s":""},{"n":1384,"t":"States G.K.","q":"The famous Pandav Leni Caves is located in which of the following states?","o":["Odisha","Maharashtra","Kerala","Bihar"],"a":1,"e":"Maharashtra. Pandavleni Caves - These are built on the Tri Rashmi hill about 3004 feet above sea level. These caves are a group of old Buddhist caves (250 B.C. - 600 A.D.).","s":""},{"n":1385,"t":"States G.K.","q":"Dhuska is the most popular food item of state of __________ .","o":["Punjab","Jharkhand","Kerala","Andhra Pradesh"],"a":1,"e":"Jharkhand. Other Foods of Jharkhand - Handia, Litti Chokha, Mirchi Ka Salan, Mitha Khaja, Rugra. Punjab: Sarso ka saag and Makki di Roti, Lassi, Gobhi - Shalgam- Gajar Pickle, Pinni. Kerala: Erissery, Sadya, Appam With Ishtu, Idli Sambar, Nadan Kozhi Varuthathu. Andhra Pradesh: Pulihora, Gutti vankaya kura, Chepa Pulusu, Gongura Pickle Ambadi, Pesarattu, Gutti Vankaya Koora, Punugulu, Bobbatlu, Medu Vada, Uppindi.","s":""},{"n":1386,"t":"States G.K.","q":"Kye Gompa, the largest centre of Buddhist learning in the Western Himalayas, is situated in the state/union territory of___________.","o":["Uttarakhand","Himachal Pradesh","Punjab","Jammu & Kashmir"],"a":1,"e":"Himachal Pradesh. Famous Buddhist monasteries: Hemis Monastery - Ladakh, Tabo Monastery - Himachal Pradesh, Tsuglagkhang Monastery -Himachal Pradesh, Thiksey Monastery -Leh, Ladakh, Tawang Monastery -Arunachal Pradesh, Bylakuppe Monastery (Namdroling) - Karnataka, Ghoom Monastery - West Bengal, Lingdum Monastery - Sikkim.","s":""},{"n":1387,"t":"States G.K.","q":"Aga Khan Palace is located in _______ city of Maharashtra.","o":["Pune","Aurangabad","Ahmednagar","Mumbai"],"a":0,"e":"Pune. This Palace was built in 1892 by Sultan Muhammed Shah Aga Khan III in the district of Pune (Maharashtra).","s":""},{"n":1388,"t":"States G.K.","q":"Which Indian city is also known as Queen of Deccan?","o":["Ahmedabad","Pune","Amritsar","Puducherry"],"a":1,"e":"Pune. Some Indian Cities and Sobriquets : City of Taj - Agra (Uttar Pradesh), Boston/Manchester of India -Ahmedabad (Gujarat), Sangam City -Allahabad (Uttar Pradesh), Land of Black Diamond - Asansol (West Bengal), City of Peace - Bardhaman (West Bengal), Temple City of India - Bhubaneswar (Odisha), The Venice of the East -Alappuzha (Kerala), Garden City of India -Bengaluru (Karnataka), Detroit of Asia -Chennai (Tamil Nadu), Manchester of South India - Coimbatore (Tamil Nadu), Scotland of India - Coorg (Karnataka), School Capital of India - Dehradun (Uttarakhand), Queen of the Hills -Darjeeling (West Bengal).","s":""},{"n":1389,"t":"States G.K.","q":"Which among the following is an Indian martial art from Manipur ?","o":["Muay Thai","Kalaripayattu","Tháng Tại","Gatka"],"a":2,"e":"Thang-Tai (sword and spear) - It is dedicated to fighting skill and worship. The Meitei creation of Thang-ga goes back to antiquity.","s":""},{"n":1390,"t":"States G.K.","q":"India's First open Rock Museum is located in which city ?","o":["Varanasi","Chennai","Mysuru","Hyderabad"],"a":3,"e":"Hyderabad . Other Famous monuments : Char- Minar, Makka Masjid both built by Quli Qutub Shah.","s":""},{"n":1391,"t":"States G.K.","q":"Nasik is also known as _____ capital of India.","o":["Wine","Gold","Orange","Cotton"],"a":0,"e":"Wine. Nashik (\"Wine Capital of India\") holds almost half of the wineries in India. Wine is composed of ethanol (12%).
