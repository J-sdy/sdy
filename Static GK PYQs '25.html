<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Static GK Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F2F4F7;--card:#fff;--ink:#1B2733;--muted:#5A6775;--line:#DFE4EA;--accent:#27487D;--accent-soft:#E8EDF6;
--ok:#1F7A4F;--ok-bg:#EAF5EF;--ok-line:#9CCDB2;--bad:#A8403F;--bad-bg:#FBEDED;--bad-line:#E2B3B2;
--hl:#FFF3BF;--hl-bar:#D49A06;--hl-ink:#3B3110;
--sans:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--serif:'Source Serif 4',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0)}
header{padding:calc(22px + env(safe-area-inset-top,0)) 18px 14px;max-width:820px;margin:0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.95rem}
.tabbar{position:sticky;top:0;z-index:20;background:rgba(242,244,247,.97);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.tabwrap{max-width:820px;margin:0 auto;position:relative}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;min-width:76px;padding:7px 14px 8px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;transition:background .15s,border-color .15s}
.tab .n{font-weight:700;font-size:1.05rem;color:var(--accent)}
.tab .l{font-size:.8rem;color:var(--muted);white-space:nowrap;margin-top:2px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent)}
.tab[aria-selected=true] .n,.tab[aria-selected=true] .l{color:#fff}
.tab:focus-visible,.opt:focus-visible,.btn:focus-visible,#top:focus-visible{outline:3px solid #7F9BD1;outline-offset:2px}
.arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer;z-index:2;font-size:1rem;line-height:1}
.arrow.l{left:2px}.arrow.r{right:2px}
@media (hover:hover) and (min-width:700px){.arrow{display:block}}
main{max-width:820px;margin:0 auto;padding:14px 14px 90px}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:4px 4px 14px;color:var(--muted);font-size:.9rem}
.stats b{color:var(--ink);font-weight:600}
.stats .sp{flex:1}
.btn{font:inherit;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--accent);padding:8px 14px;border-radius:10px;cursor:pointer;min-height:40px}
.btn:hover{background:var(--accent-soft)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px 16px;margin-bottom:16px}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--muted);font-size:.85rem;font-weight:500}
.src{margin-left:auto;font-size:.78rem;font-weight:400;text-align:right}
.stem{font-family:var(--serif);font-size:1.15rem;line-height:1.65;margin:0 0 14px;white-space:pre-line;overflow-wrap:anywhere}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:50px;padding:11px 13px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem;display:grid;place-items:center}
.opt .t{padding-top:2px;overflow-wrap:anywhere}
.opt:not(:disabled):hover{border-color:var(--accent);background:#F7F9FC}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.res{margin-top:14px;display:none}
.card.done .res{display:block}
.verdict{font-weight:600;font-size:.95rem;margin-bottom:8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.rv{color:var(--muted)}
.exp{background:var(--hl);border-left:4px solid var(--hl-bar);border-radius:4px 10px 10px 4px;padding:12px 14px;color:var(--hl-ink);font-family:var(--serif);font-size:1.05rem;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.exp .ans{font-family:var(--sans);font-weight:700;color:#2B2208;background:rgba(212,154,6,.22);padding:1px 6px;border-radius:5px;font-size:.95rem}
.show{margin-top:12px}.card.done .show{display:none}
.more{display:block;margin:6px auto 0;padding:12px 26px;font-size:1rem}
#top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0));width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(20,35,60,.28);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:30}
#top.on{opacity:1;pointer-events:auto;transform:none}
@media (min-width:640px){h1{font-size:2rem}.card{padding:22px 24px}.stem{font-size:1.22rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
const DATA=[{"n":1,"t":"Dance","q":"Which of the following is recognized as a classical dance of India ?","o":["Bharatnatyam","Garba","Lavani","Bhangra"],"a":0,"e":"Bharatnatyam of Tamil Nadu is one of the eight classical dances officially recognized in India. The other classical dances are Kathak (Uttar Pradesh), Kathakali (Kerala), Mohiniyattam (Kerala), Kuchipudi (Andhra Pradesh), Odissi (Odisha), Manipuri (Manipur), and Sattriya (Assam). In contrast, Garba of Gujarat, Lavani of Maharashtra, and Bhangra of Punjab are folk dances, not classical ones.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":2,"t":"Dance","q":"Kathak is a classical dance form that developed in which region of India?","o":["Southern India","Northern India","Eastern India","Western India"],"a":1,"e":"Northern India. It is found in three distinct forms, called \"gharana\", named after the cities where the Kathak dance tradition evolved – Jaipur, Banares, and Lucknow. Its famous exponents: Pandit Birju Maharaj, Sitara Devi (\"Empress of Dance\"), Shambhu Maharaj, Lachhu Maharaj, Rohini Bhate, Kumudini Lakhia, and Roshan Kumari, etc.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":3,"t":"Dance","q":"Which classical dance form originated in Andhra Pradesh and incorporates both singing and dancing?","o":["Manipuri","Kathakali","Mohiniyattam","Kuchipudi"],"a":3,"e":"Kuchipudi. It uniquely blends dance, acting, and singing, making it a dance-drama tradition. Historically performed by male Brahmin dancers in temples and village squares, Kuchipudi involves performers who not only dance but also deliver dialogues and sometimes sing, bringing a theatrical element to the performance. Over time, women also became prominent exponents. It is distinct from Manipuri (Manipur), Kathakali (Kerala), and Mohiniyattam (Kerala).","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":4,"t":"Dance","q":"Which classical dance form is associated with the state of Kerala ?","o":["Kathak","Kuchipudi","Kathakali","Sattriya"],"a":2,"e":"Kathakali. Classical Dances of India (with State Association): Bharatanatyam – Tamil Nadu , Kathak – Uttar Pradesh (North India, esp. Lucknow, Jaipur, Banaras gharanas), Kathakali – Kerala, Kuchipudi – Andhra Pradesh, Manipuri – Manipur, Mohiniyattam – Kerala, Odissi – Odisha, Sattriya – Assam.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":5,"t":"Dance","q":"Which dance form is traditionally associated with the culture of Punjab?","o":["Kuchipudi","Yakshagana","Bhangra","Mohiniyattam"],"a":2,"e":"Bhangra is a vibrant and energetic folk dance and music form that originates from the Punjab region. Traditionally, it was performed by farmers to celebrate the harvest season, particularly the festival of Vaisakhi. Other festivals of Punjab: Basant Panchami, Hola Mohalla, and Gurpurabs. Kuchipudi: This is one of the eight major Indian classical dances, originating from a village named Kuchipudi in the state of Andhra Pradesh. Yakshagana: This is a traditional theatre form, combining dance, music, dialogue, and costume, which is native to the coastal districts of Karnataka. Mohiniyattam: This is a graceful, classical dance form, performed by women, that originated in the state of Kerala.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":6,"t":"Dance","q":"Bihu is a folk music and dance form associated with which Indian state?","o":["Kerala","Gujarat","Assam","Punjab"],"a":2,"e":"Assam. Bihu is the most celebrated cultural festival of Assam, and it includes a vibrant folk dance and music tradition. There are three Bihu festivals—Rongali (Bohag), Bhogali (Magh), and Kongali (Kati)—each associated with different phases of the agricultural cycle. The music and dance of Bihu, especially during Rongali Bihu, reflect joy, fertility, and community celebration, deeply rooted in Assamese agrarian life.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":7,"t":"Dance","q":"Bihu, the festival of Assam, is celebrated to mark:","o":["The winter solstice","The new harvest","The victory of good over evil","The end of the monsoon"],"a":1,"e":"The new harvest. Bihu is celebrated in Assam to mark the harvesting season, specifically Rongali Bihu, which takes place in April and welcomes the Assamese New Year and the spring harvest. It's a time of agricultural significance when farmers celebrate their produce with song, dance, and community feasts. It's rooted in agrarian tradition, celebrating prosperity and fertility.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":8,"t":"Dance","q":"Which classical dance form uses storytelling through hand gestures (mudras) and facial expressions (abhinaya)?","o":["Bihu","Koli","Garba","Bharatnatyam"],"a":3,"e":"Bharatnatyam. Bharatnatyam, originating from Tamil Nadu, is a classical Indian dance known for its expressive storytelling. Dancers use mudras (hand gestures) and abhinaya (facial expressions) to depict mythological tales, emotions, and devotional themes. It combines rhythm, music, and intricate footwork, making it a holistic performance art that conveys stories from epics like the Ramayana and Mahabharata. Other dances like Bihu, Koli, and Garba are folk dances focused more on community celebration than detailed narrative expression.","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":9,"t":"Dance","q":"Odissi classical dance originated in which Indian state?","o":["Gujarat","Odisha","Bihar","Assam"],"a":1,"e":"Odisha. Odissi is one of India’s eight classical dance forms, originating from the temples of Odisha. The dance is deeply devotional in nature and often dedicated to Lord Jagannath. Its name is derived from the state itself, and its graceful poses and movements are prominently depicted in the sculptures of temples like the Konark Sun Temple and the Jagannath Temple, Puri. Classical Dances of India : Bharatanatyam (Tamil Nadu), Kathakali (Kerala), Mohiniyattam (Kerala), Kuchipudi (Andhra Pradesh), Odissi (Odisha), Manipuri (Manipur), Kathak (Uttar Pradesh), Sattriya (Assam).","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":10,"t":"Dance","q":"Identify the dance style recognized for its spiritual devotion and connection to the Vaishnavite movement.","o":["Bharatnatyam","Kathak","Odissi","Sattriya"],"a":3,"e":"Sattriya. Sattriya is a classical dance form of Assam, created by the saint-scholar Srimanta Sankardev in the 15th–16th century. It was developed in Sattras (Vaishnavite monasteries) to propagate the teachings of the Neo-Vaishnavite movement. The dance is highly devotional, performed as an offering to Lord Krishna (Vishnu), combining storytelling, music, and bhakti (devotion).","s":"SSC Stenographer 8/08/2025 (Shift 3)"},{"n":11,"t":"Dance","q":"Which of the below statements is/are correct?\nStatement 1: The folk dance Kamala is performed by the fisherfolk of the Mithila region in Bihar.\nStatement 2: Bihar’s folk dances include Karma, Kajri, Jhumar, Garba, Ghoomar, and Bihu.","o":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"a":0,"e":"Only Statement 1. Statement 2 is incorrect because Garba (Gujarat), Ghoomar (Rajasthan), and Bihu (Assam) are not folk dances of Bihar. Bihar’s actual folk dances include Karma, Kajri, Jhumar, Jharni, Jat Jatin, Jhumeri, Sohar Khelwana, Natua, Nachini, Jhijiya, Dhamar Jogira, and Krishi Nritya.","s":""},{"n":12,"t":"Dance","q":"Which of the below statements is/are correct?\nStatement 1: Chad Laho is a dance-festival celebrated by the Jaintia tribe of Meghalaya as a thanksgiving to God after the harvesting season.\nStatement 2: Other notable dance festivals of Meghalaya include Ka Shad Suk Mynsiem (Garos), Beh-dien-khlam (Khasis), Wangala (Jaintias), and Chad Sukra (Khasis).","o":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"a":0,"e":"Only Statement 1. Statement 2 is incorrect because the tribe associations given are wrong: Ka Shad Suk Mynsiem belongs to the Khasis (not Garos), Beh-dien-khlam belongs to the Jaintias (not Khasis), Wangala is of the Garos (not Jaintias), and Chad Sukra belongs to the Jaintias (not Khasis).","s":""},{"n":13,"t":"Dance","q":"In which Goan folk dance do performers ride decorated wooden horses to display martial skills, commemorating the Maratha victory over the Portuguese?","o":["Dhangar dance","Fugdi","Ghodemodni","Talgadi"],"a":2,"e":"Ghodemodni (Horse Dance), Thane, Sattari, and surrounding villages of Goa. Dancers, dressed as warriors, mount decorated wooden horses and enact scenes of martial prowess to celebrate the Maratha triumph over the Portuguese. Other prominent Goan folk dances include Fugdi, Dhalo, Talgadi, Tonyamel, Bhandap, Zagor, Corredinho (of Portuguese origin), Dhangar dance, and Veerbhadra.","s":""},{"n":14,"t":"Dance","q":"Which of the following war dances is performed in Ngada festival and is performed by the tribes of Nagaland?","o":["Jawara","Dalkhai","Rengma","Garadi"],"a":2,"e":"Rengma. Other popular dances of Nagaland include Modse, Aaluyattu. Jawara (Madhya Pradesh), Dalkhai (Odisha), Garadi (Puducherry).","s":""},{"n":15,"t":"Dance","q":"Which of the following statements about the classical dance form Kathakali is/are true?\n1. Kathakali originated in 17th-century Travancore (Kerala) and is based on Sage Bharata's Natya Shastra.\n2. In Kathakali, actors’ faces are painted to indicate the type of character they play - Pacha (noble gods), Katti (anti-heroes), Thadi (bearded roles), Kari (evil), and Minukku (virtuous women/sages).\n3. The main accompanying instruments in Kathakali include Tabla, Shehnai, Sitar, and Harmonium, and its songs are called Attakkatha.","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2, and 3"],"a":0,"e":"1 and 2 only. While the songs (verses) performed in Kathakali are indeed called Aattakatha or Attakkatha, the listed main accompanying instruments are incorrect. The primary instruments in Kathakali typically include the Chenda (cylindrical drum), Maddalam (barrel-shaped drum), Idakka (hourglass-shaped drum), Chengila (gong), and Ilathalam (cymbals)","s":""},{"n":16,"t":"Dance","q":"_________ dance is embedded in the stories from the epics Mahabharata, Ramayana and Puranas.","o":["Kathakali","Kuchipudi","Sattriya","Odissi"],"a":0,"e":"Kathakali literally means \"story play.\" It is a classical dance form from Kerala, known for its heavy and elaborate makeup, intricate costumes, and dramatic expressions.","s":""},{"n":17,"t":"Dance","q":"Which tribal dance, performed by women in colorful attire, is popular in the Visakhapatnam district?","o":["Bagurumba","Dhimsa","Jhumur","Bardo Chham"],"a":1,"e":"Dhimsa. Dances of Andhra Pradesh: Buttabommalu, Dappu Dance, Kolatam, Lambada, Veeranatyam, Koya Nrityam. Bagurumba is a folk dance of Assam's Bodo tribe. Bardo Chham is from Arunachal Pradesh, while Jhumur is performed by Assam's tea tribes.","s":""},{"n":18,"t":"Dance","q":"Which of the below statements is/are correct?\nStatement 1: Manipuri is the classical dance form of Manipur, with compositions in the Meitei language.\nStatement 2: Manipuri dance combines Pre-Vaishnavite and Vaishnavite traditions and includes forms like Sankirtana, Rasalila, and the Pung (drum) dance.","o":["Only Statement 1","Only Statement 2","Both Statement 1 and Statement 2","Neither Statement 1 nor Statement 2"],"a":2,"e":"Both Statement 1 and\nStatement 2. Classical & Ritual Dances of Manipur : Ras Lila (Rasalila), Sankirtana, Pung Cholom (Drum Dance), Maharas. Folk & Martial Dances of Manipur: Thang Ta, Khamba Thoibi Dance, Lai Haraoba, Leima Jagoi, Luivat Pheizak, Kabui Naga Dance.","s":""},{"n":19,"t":"Dance","q":"Which of the following dances is performed in Goa during the festival Ganesh Chaturthi?","o":["Tarangmel","Dhalo","Fugdi","Dhangar"],"a":2,"e":"Fugdi. It is performed by women during festivals. Goa's folk dances include Tarangmel, performed during Dussehra and Holi, and Dhalo, performed by women during the Pausha moon festival by communities like Kunbis and Gaudis. The Dhangar community performs the Dhangar dance during their annual fair and Navratri.","s":""},{"n":20,"t":"Dance","q":"Identify the classical dance: Originates in Kerala, performed solo by women, narrates mythological stories through graceful movements, and is accompanied by songs in Manipravalam.","o":["Kathak","Mohiniattam","Sattriya","Kuchipudi"],"a":1,"e":"Mohiniattam – Known as the dance of the enchantress, Mohiniattam blends elegance with expressiveness, and its songs are in Manipravalam, a mix of Sanskrit and Malayalam.","s":""},{"n":21,"t":"Dance","q":"Mohiniyattam is associated with which of the following traditional dance styles?","o":["Samapadam","Tribhanga","Chowk","Lasya style"],"a":3,"e":"Lasya style. Mohiniyattam : A graceful classical dance from Kerala, focusing on expressions and storytelling in the Lasya style. Samapadam : A steady, rhythmic movement in Bharatanatyam. Tribhanga : A pose in Odissi dance with three bends (head, waist, and knees). Chowk : A position imitating a square - a very masculine stance with the weight of the body equally balanced.","s":""},{"n":22,"t":"Dance","q":"Match the following dances with their respective states: Dance Form State\n1. Khuallam A. Kerala\n2. Cheraw B. Mizoram\n3. Mohiniattam C. Punjab\n4. Bhangra D. Assam","o":["1-B, 2-B, 3-A, 4-C","1-D, 2-A, 3-C, 4-B","1-C, 2-B, 3-D, 4-A","1-B, 2-D, 3-A, 4-C"],"a":0,"e":"1-B, 2-B, 3-A, 4-C . Folk Dances of India :Mizoram: Khuallam, Cheraw, Chheihlam, Sarlamkai, Tlanglam. Kerala: Mohiniattam, Kathakali, Thiruvathira. Punjab: Bhangra, Giddha, Luddi. Assam: Bihu, Sattriya, Bagurumba.","s":""},{"n":23,"t":"Dance","q":"Tera Tali folk dance is primarily associated with which of the following states?","o":["Rajasthan","Assam","Madhya Pradesh","Haryana"],"a":0,"e":"Rajasthan. Terah Tali Dance : This dance is performed in praise of the folk God Ramdevji, primarily by the Kamar tribe. Rajasthani folk dances : Chari, Ghoomar, Kalbelia, Kathputli dance and Gair folk dance.","s":""},{"n":24,"t":"Dance","q":"Assertion (A): Matki Dance is mainly performed in the Malwa region of Madhya Pradesh.\nReason (R): It is performed using a small pitcher balanced on the head.","o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"a":1,"e":"Kerala. Padayani literally means “row of warriors” is a dance. It is regarded as a remnant of the Dravidian forms of worship that existed before the advent of Brahmanism. The percussion instruments used are padayani thappu, chenda, para and kumbham. Other dances of Kerala : Mudiyettu, Thiruvathirakali, Kolkali, Oppana, Kummattikali, Chavittu Natakam.","s":""},{"n":26,"t":"Dance","q":"Consider the following statements about Hojagiri dance:\nStatement 1: Hojagiri dance is predominantly performed in Kerala.\nStatement 2: Hojagiri dance is performed during the Hojagiri Festival (Laxmi Puja) on the full moon night after Durga Puja, a few days after Dussehra. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. Hojagiri is a folk dance of Tripura (not Kerala), mainly performed by the Reang (Bru) community. Folk Dances of Tripura : Lebang Boomani, Garia, Bizhu, Wangala, Mamita.","s":""},{"n":27,"t":"Dance","q":"In which of the following states is the Chu-Faat dance performed?","o":["Haryana","Uttarakhand","West Bengal","Sikkim"],"a":3,"e":"Sikkim. Chu-Faat, meaning \"Snowy Range\" (Chu) and \"Worship\" (Faat), is a folk dance of Sikkim performed in honor of Mount Khangchendzonga. Other folk dances of Sikkim - Sikmari, Singhi Chaam or the Snow Lion Dance, Yak Chaam, Khukuri Naach.","s":""},{"n":28,"t":"Dance","q":"‘Kuki dance’ is a folk dance of India that is predominantly performed in _____.","o":["Nagaland","Karnataka","Uttar Pradesh","Rajasthan"],"a":0,"e":"Nagaland. Kuki dance is performed by the Kuki tribe in India. Major folk dances : Nagaland - Modse, Agurshikukula, Butterfly Dance, Aaluyattu, War Dance and Zeliang Dance.","s":""},{"n":29,"t":"Dance","q":"Consider the following statements about Yakshagana dance:\n1. Yakshagana is a traditional folk dance of Karnataka.\n2. Other well-known folk dances of Karnataka include Bihu, Garba, Ghoomar, and Lavani. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 1 is correct. Statement 2 is wrong because Bihu (Assam), Garba (Gujarat), Ghoomar (Rajasthan), and Lavani (Maharashtra) are not folk dances of Karnataka. Karnataka’s folk forms include Dollu Kunitha, Hulivesha, Kamsale, Puja Kunitha, Suggi Kunitha, Veeragase, and Karaga.","s":""},{"n":30,"t":"Dance","q":"Langvir Nritya is a folk dance from the state of ________","o":["Gujarat","Uttar Pradesh","Uttarakhand","Haryana"],"a":2,"e":"Uttarakhand. Langvir Nritya is a dance form practiced by only men. The dancers use a long bamboo pole. Folk dances of Uttarakhand: Jhora, Chholia, Barada Nati, Pandav Nritya, Chancheri, Chhapeli, Thali, Rasu Nritya, Jaguars.","s":""},{"n":31,"t":"Dance","q":"Consider the following statements about Sattriya dance:\n1. Sattriya originated in the Sattra (monasteries) of Assam as part of the neo-Vaishnavite movement started by Srimanta Sankardev in the 15th century.\n2. Srimanta Sankardev promoted “ek sharan naam dharma” – the devotional chanting of one God’s name.\n3. In 2001, the Sangeet Natak Akademi recognized Sattriya as a classical dance form. Which of the statements given above is/are correct?","o":["Only 1 and 2","Only 2 and 3","Only 1 and 3","1, 2 and 3"],"a":0,"e":"Only 1 and 2. Statement 3 is incorrect because the Sangeet Natak Akademi recognized Sattriya as a classical dance form in 2000, not 2001.","s":""},{"n":32,"t":"Dance","q":"Match the following Chhau dance styles with their respective states: Chhau Dance Style State\n1. Purulia Chhau A. Odisha\n2. Seraikella Chhau B.West Bengal\n3. Mayurbhanj Chhau C. Jharkhand","o":["1-B, 2-C, 3-A","1-C, 2-A, 3-B","1-A, 2-B, 3-C","1-B, 2-A, 3-C"],"a":0,"e":"1-B, 2-C, 3-A. Chhau dance has martial and folk traditions. The Cultural Ministry of India has included Chhau in the list of classical dances making a total of 9 classical dance forms.","s":""},{"n":33,"t":"Dance","q":"Gugga is the famous ritualistic dance of ________, which is performed in the procession taken out in memory of Gugga Pir.","o":["Uttar Pradesh","Jammu & Kashmir","Haryana","Puducherry"],"a":2,"e":"Haryana. Gugga dance - It is a religious dance (in the month of Bhadon) performed by men. Dancers carry instruments such as Thali, Chimta, Deru. Folk dances of Haryana - Phalgun dance, Loor dance, Daph dance, Khoria dance, Saang dance, Dhamal dance, Jhumar dance.","s":""},{"n":34,"t":"Dance","q":"Consider the following statements about Chang dance:\n1. Chang dance, also known as Dhamal or Dhuff, is a popular folk dance of Rajasthan.\n2. It is performed during the Hindu festival of Holi to celebrate the triumph of good over evil, and is popularly referred to as the Holi dance. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Folk dances of Rajasthan (only names): Ghoomar, Kalbeliya, Bhavai, Chari Dance,Terah Taali, Kachhi Ghodi, Gair, Kathputli Dance, Fire Dance.","s":""},{"n":35,"t":"Dance","q":"Match the following folk dances with their respective states: Folk Dance State\n1. Giddha A. Manipur\n2. Bihu B. Assam\n3. Bhangra C. Punjab\n4. Lavani D. Maharashtra","o":["1-C, 2-B, 3-A, 4-D","1-C, 2-B, 3-C, 4-D","1-B, 2-C, 3-A, 4-D","1-C, 2-D, 3-B, 4-A"],"a":1,"e":"1-C, 2-B, 3-C, 4-D.","s":""},{"n":36,"t":"Dance","q":"Which classical dance was introduced by the great Vaishnava saint and reformer of Assam?","o":["Kathak","Kuchipudi","Sattriya","Odissi"],"a":2,"e":"Sattriya. The Sattriya dance form was introduced in the 15th century A.D by Mahapurusha Sankaradeva. It became popular as a part of the Vaishnava Bhakti Movement in Sattra (Hindu monasteries).","s":""},{"n":37,"t":"Dance","q":"Jagoi and Cholom are two divisions in the Indian classical dance form of ________.","o":["Kathak","Bharatanatyam","Manipuri","Kathakali"],"a":2,"e":"Manipuri. Jagoi refers to the gentle and graceful movements, often depicting devotion and love. Cholom refers to the fast-paced and energetic movements, often depicting heroic and martial themes. Other dances and their division: Kathakali (Kerala) - Satvika, rajasika and tamasika. Bharatanatyam (Tamil Nadu) - Nritta, Nritya and Natya.","s":""},{"n":38,"t":"Dance","q":"The Chau dancers of ___________ organise a festival named Chau-Jhumur Utsav, where an open stage is designed for the performance by Chau groups.","o":["Jharkhand","West Bengal","Madhya Pradesh","Chhattisgarh"],"a":1,"e":"West Bengal. Chhau is performed in three styles across eastern India: Purulia Chhau -West Bengal. Seraikela Chhau -Jharkhand. Mayurbhanj Chhau - Odisha.","s":""},{"n":39,"t":"Dance","q":"Consider the following statements about Rauf dance:\nA. Rauf is a folk dance performed mainly by women during weddings and festive occasions.\nB. Rauf is traditionally associated with the state of Himachal Pradesh. Which of the statements given above is/are correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":0,"e":"Only A.\nStatement B is incorrect because Rauf is actually associated with the Union Territory of Jammu and Kashmir, not Himachal Pradesh. Folk dances of Jammu & Kashmir : Rouf, Bhand Pather, Hafiza Dance, Kud Dance, Dumaal, Bachha Nagma, Wuegi-Nachun Jagarana.","s":""},{"n":40,"t":"Dance","q":"Consider the following statements about Bhavai dance:\nStatement 1: Bhavai is a folk dance form of Rajasthan performed by both men and women of communities like Kalbelia, Jat, Meena, Bhil, and Kumhar.\nStatement 2: In this dance, performers often balance swords on their heads while dancing. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Bhavai is a traditional folk dance of Rajasthan performed by various tribal communities. Statement 2 is incorrect because performers balance multiple brass pitchers or earthen pots, not swords, on their heads while dancing.","s":""},{"n":41,"t":"Dance","q":"What is known to be ‘ekaharya’, where one dancer takes on many roles in a single performance ?","o":["Bharatanatyam","Kathak","Kuchipudi","Kathakali"],"a":0,"e":"Bharatanatyam: Features - The dance involves transitional movements of the leg, hip and arm. Expressive eye movements and hand gestures are used to convey emotions. It encompasses Bhav, Rag, Ras and Taal. The person who conducts the dance recitation is the Nattuvanar.","s":""},{"n":42,"t":"Dance","q":"Which of the following dances is listed in the UNESCO List of Intangible Cultural Heritage of India since 2010 ?","o":["Garba","Kalbelia","Ghumar","Matki"],"a":1,"e":"Kalbelia : It has other names like 'Sapera Dance' or 'Snake Charmer Dance'. This dance is particularly performed by a Rajasthani tribe called 'Kalbelia'.","s":""},{"n":43,"t":"Dance","q":"The Bhotia dance form is a folk-dance from which of the following Indian states?","o":["Odisha","Goa","Tamil Nadu","Uttarakhand"],"a":3,"e":"Uttarakhand. The Bhotia dance performed by the Bhotia tribe of Uttarakhand. Other folk dances: Uttarakhand - Jhora, Chholia, Langvir Nritya, Barada Nati, Pandav Nritya, Chancheri, Chhapeli.","s":""},{"n":44,"t":"Dance","q":"With reference to Saila dance consider the following statements and select the correct option. a) A group comprising of male performers. b) The dance is performed with bamboo sticks. c) It is performed after the cutting of crops.","o":["a, b, c","Both b and c","Both a and c","Both a and b"],"a":0,"e":"a, b, c. Saila dance (Chattisgarh): This dance is performed only by boys after the harvest season in the Hindu month of Aghan (November -December). Other folk dances of Chattisgarh: Sua, Pandavani, Karma, Panthi, Jhirliti.","s":""},{"n":45,"t":"Dance","q":"Which of the following dances is","o":["Paika","Gotipua","Kathakali","Dalkhai"],"a":2,"e":"Kathakali, a \"story play\" from Kerala, features vibrant costumes and makeup of male dancers. Paika Dance welcomes esteemed guests or accompanies religious processions. Gotipua, from Odisha, praises Lord Krishna and Jagannath, while Dalkhai is a popular folk dance of western Odisha.","s":""},{"n":46,"t":"Dance","q":"What are the two main parts corresponding to Lasya and Tandava elements in Manipuri dance?","o":["Bhangi and Stri","Varnam and Paran","Vira and Toda","Jagoi and Cholom"],"a":3,"e":"Jagoi and Cholom. Manipuri is an ancient classical dance form from Manipur. It has two main styles : Jagoi, which is gentle, and Cholom, which is vigorous, reflecting the lasya and tandava elements described in Sanskrit literature.","s":""},{"n":47,"t":"Dance","q":"How many types of makeup (vesham) are used for the performers of Kathakali dance?","o":["9","7","5","11"],"a":2,"e":"5. The five major Veshams in Kathakali (Kerala), are Kathi (Knife), Pacha (Green), Thaadi (Beard), Minukku (Radiant), and Kari (Black). The Pacha Veshams represent noble and divine characters. Kathi represents characters that are arrogant and evil, although they possess a vein of gallantry.","s":""},{"n":48,"t":"Dance","q":"Indian Classical Dance is an umbrella under which various performing arts whose theory and practice can be traced to the Sanskrit text, Natya-Shastra, the foundational treatise by:","o":["Panini","Bhasa","Patanjali","Bharata Muni"],"a":3,"e":"Bharata Muni. He was an ancient Indian dramatist and musicologist. Natya-Shastra is also known as the fifth veda. Author and book: Panini - Ashtadhyayi (Sanskrit treatise on grammar). Bhasa -Svapnavasavadutta (The dream of Vasavadatta). Patanjali - Mahabhasaya (Sanskrit grammar).","s":""},{"n":49,"t":"Dance","q":"Which of the following classical dance forms is usually concluded with Tarangam ?","o":["Kuchipudi","Odissi","Sattriya","Kathakali"],"a":0,"e":"Kuchipudi (Andhra Pradesh). In this, the dancer usually stands on a shakatavadanam paada, and moves the plate rhythmically with great dexterity. The instruments used in Kuchipudi involve veena, flute, tambura, cymbals, and mridangam.","s":""},{"n":50,"t":"Dance","q":"Select the correct alternative on the basis of the statements given about ‘Rasa’.\nStatement I : It is the aesthetic experience that one derives while enjoying an artistic presentation.\nStatement II : It deals with the creation of human sentiments in the spectator or the aesthete.","o":["Only Statement I is true.","Both Statement I and Statement II are true","Only Statement II is true.","Neither Statement I nor Statement II is true."],"a":1,"e":"Both Statement I and\nStatement II are true. Rasa relates to human senses and evokes emotions in the mind through Natya (drama). However, the concept extends beyond Natya to encompass dance, music, cinema, and literature. Rasa signifies aesthetic pleasure or the joy experienced during a skillful performance, enhanced by exquisite poetry, music, and action.","s":""},{"n":51,"t":"Dance","q":"Alarippu, Jatiswaram, Shabdam, Varnam and Tillana are regular patterns of which of the following classical dance forms of India?","o":["Sattriya","Bharatanatyam","Manipuri","Kathak"],"a":1,"e":"Bharatanatyam, a classical dance form originating from Tamil Nadu, follows a structured pattern - Alarippu: Invocation, introducing the dancer and setting the tone. Jatiswaram: Pure dance, showcasing rhythmic patterns. Shabdam: Combination of music and dance, with emphasis on expression. Varnam: Central piece, highlighting the dancer's skill and technique. Tillana: Concluding piece, characterized by rapid movements.","s":""},{"n":52,"t":"Dance","q":"Consider the following statements about Lai Haraoba festival:\nStatement 1: Lai Haraoba is considered the earliest form of Manipuri classical dance of Manipur.\nStatement 2: Lai Haraoba is associated with the Bodo tribe and includes dances depicting harvest rituals. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because it is associated with the Meitei tribe, not the Bodo tribe. Manipuri (Manipur) classical dance is associated with rituals and traditional festivals; there are legendary references to the dances of Shiva and Parvati. The male dancers play the Pung and Kartal while dancing. It is an important festival of the Meitai tribe.","s":""},{"n":53,"t":"Dance","q":"Consider the following statements about Odissi dance:\nStatement 1: Archaeological evidence of Odissi dance dating back to the 2nd century BC has been found in the caves of Udayagiri and Khandagiri.\nStatement 2: The main postures in Odissi are Samabhanga and Natya Mandala. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because the two main body postures in this dance form include the Chowk and Tribhanga. Tribhanga (the body is deflected at the neck, torso and the knees) and Chowk (a position imitating a square).","s":""},{"n":54,"t":"Dance","q":"From which of the following epics did the Garadi folk dance of Puducherry originate ?","o":["Ramayana","Panchatantra","Mahabharata","Hitopadesha"],"a":0,"e":"Ramayana. Garadi dance is mainly performed at the time of the car festival of Lord Vishnu. Indian States and folk Dances: Kerala - Chavittukali, Kolkali or Kolkkali (also popular in Lakshadweep Islands), Kummattikkali. Goa -Dashavatara, Dekhni, Dhalo, Dhangar, Fugdi, Ghodemodni. Karnataka - Dollu Kunitha, Bayalata, Kamsale, Veeragase. Maharashtra - Dhangari Gaja, Lavani, Povada, and Koli dance.","s":""},{"n":55,"t":"Dance","q":"Consider the following statements about Cheraw dance:\n1. Cheraw, also known as the Bamboo dance, is a traditional folk dance of Mizoram.\n2. Other traditional dances of Mizoram include Bihu, Bagurumba, and Bhortal Nritya. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because Bihu, Bagurumba, and Bhortal Nritya belong to Assam, not Mizoram. Other dances of Mizoram include Khuallam, Sarlamkai, Chheihlam, and Mizo.","s":""},{"n":56,"t":"Dance","q":"Bharatanatyam of Tamil Nadu has grown out of the art of dancers dedicated to temples, and was earlier known:","o":["Sadir","Jagoi","Cholom","Gat"],"a":0,"e":"Sadir (or Dasi Attam). The dance of Bharatanatyam belongs to the Carnatic system of southern India. Jagoi and Cholom are the two main divisions in Manipur’s dance. The term gat refers to a stylized way of walking that is used to express scenes from daily life. It is also a type of rhythmic footwork that is usually performed at the end of a rendition.","s":""},{"n":57,"t":"Dance","q":"Select the INCORRECT combination of folk dance and its respective state.","o":["Dhangari Gaja - Maharashtra","Dandiya Raas- Gujarat","Dollu Kunitha - Karnataka","Paika - Kerala"],"a":3,"e":"Paika - Kerala. The Paika Nritya is performed by the Munda tribe in the Mayurbhanj region of Jharkhand, where it stands out as a folk dance rooted in martial arts. This dance plays a significant role in weddings, Dussehra, and various other festivities. Other Dances of Jharkhand: Hunta, Barao, Karam, Lahasuya, Groha Naach, Seraikella Chhau.","s":""},{"n":58,"t":"Dance","q":"In which of the following dance forms is Mati-Akhora used as the basic exercise pattern that facilitates various dance poses?","o":["Sattriya","Manipuri","Kuchipudi","Kathakali"],"a":0,"e":"Sattriya is a classical dance of Assam. Mati-Akhora is a basic exercise pattern that facilitates various dance poses. Poses include body bending, body movements, foot movements, jumps, hand, head and neck movements and eye movements.","s":""},{"n":59,"t":"Dance","q":"Jaita is the main dance form of which state?","o":["Karnataka","Rajasthan","Madhya Pradesh","Uttar Pradesh"],"a":1,"e":"Only 2. Bharatanatyam was banned by the British colonial government in 1910, not 1927. Bharatanatyam (Tamil Nadu): It traces its origins back to the Natyashastra, an ancient treatise on theatre written by the mythic priest Bharata. Features :- It encompasses Bhav, Rag, Ras and Taal. It consists of six portions: Alarippu (Invocation), Jathiswaram (Nritta part), Shabdam (Short compositions with word), Varnam (a story, that includes both Nritta and Nritya), Padam (Religious prayer, Bhajan, Keerthanam) and Tillana (Origin in the Tarana of Hindustani Music).","s":""},{"n":61,"t":"Dance","q":"What is a one act play of Sattriya called?","o":["Ekam Nat","Vishesham Nat","Anant Nat","Ankiya Nat"],"a":3,"e":"Ankiya Nat: It is a form of Sattriya that involves musical drama or play. It was initially written in Brajavali, an Assamese-Maithili hybrid language. It's also known as 'Bhaona,' and it tells stories about Lord Krishna.","s":""},{"n":62,"t":"Dance","q":"Match the following folk dances with their respective states: Folk Dance State\n1. Bhutia A. Odisha\n2. Bihu B. Assam\n3. Garba C. Gujarat\n4. Lavani D. Maharashtra","o":["1-A, 2-B, 3-C, 4-D","1-D, 2-A, 3-B, 4-C","1-C, 2-B, 3-D, 4-A","1-D, 2-C, 3-A, 4-B"],"a":0,"e":"1-A, 2-B, 3-C, 4-D.","s":""},{"n":63,"t":"Dance","q":"Which of the following dances is based on Rasleela themes of Radha and Krishna?","o":["Mohiniyattam","Kathak","Sattriya dance","Manipuri dance"],"a":3,"e":"Manipuri dance. The themes used in Manipuri dance forms: Mostly influenced by Hindu Vaishnavism themes. It also includes themes related to Shaivism and Shaktism and regional deities. Tandav Manipuri depicts themes of Shiv, Shakti or Krishna as warrior.","s":""},{"n":64,"t":"Dance","q":"In 2010, considering its outstanding value and vulnerability, UNESCO recognised 'Mudiyettu', an age -old ritual-drama of______ as an 'intangible cultural heritage of humanity'.","o":["Kerala","Telangana","Karnataka","Tamil Nadu"],"a":0,"e":"Kerala. Mudiyettu - A ritual dance drama based on the mythological tale of a battle between the Goddess Kali and the demon Darika.","s":""},{"n":65,"t":"Dance","q":"Consider the following statements about Thullal dance:\nStatement 1: Thullal dance originated in Kerala and has three versions — Seethankan Thullal, Parayan Thullal, and Ottan Thullal.\nStatement 2: Other folk dances of Kerala include Choliya, Pandav Nritya, and Jhora Dance. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because Choliya, Pandav Nritya, and Jhora are folk dances of Uttarakhand, not Kerala. Folk dances of Kerala include Theyyam, Thiruvathirakali, and Kolkali.","s":""},{"n":66,"t":"Dance","q":"Maimata is a popular folk dance of which of the following states ?","o":["Punjab","Tripura","Haryana","Uttarakhand"],"a":1,"e":"Tripura. Maimata dance is a traditional dance associated with the Kaloi community of Tripura and is performed during the harvest festival. Other folk dances of Tripura: Garia, Lebang Boomani, Hozagiri, Bizu, Hai-Hak, Cheraw, Jhum.","s":""},{"n":67,"t":"Dance","q":"With which of the following dance forms is Thumri music associated?","o":["Kathak","Kathakali","Bharatanatyam","Sattriya"],"a":0,"e":"Kathak: It is a classical dance form of Uttar Pradesh. Thumri: It is a common genre of semi-classical Indian music originating in the eastern part of Uttar Pradesh. Kathakali (Kerala): It is a combination of 5 forms of fine art which are Literature (Sahithyam), Music (Sangeetham), Painting (Chithram), Acting (Natyam) and Dance (Nritham).","s":""},{"n":69,"t":"Dance","q":"Consider the following statements about Kathakali dance:\nStatement 1: Kathakali, a classical dance of Kerala, was preceded by a practice session called sevakali and usually performed in the precincts of a temple.\nStatement 2: The roots of Kathakali lie in ancient Yakshagana of Karnataka and Bihu of Assam. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect because Kathakali’s roots are in Kutiyattam (classical Sanskrit dance -drama) and Krishnattam (dance -drama depicting the stories of Lord Krishna), not Yakshagana or Bihu.","s":""},{"n":70,"t":"Dance","q":"Which of the abhinayas deals with the use of costumes, jewellery, facial make - up etc?","o":["Vachika Abhinaya","Aharya Abhinaya","Sattvika Abhinaya","Angika Abhinaya"],"a":1,"e":"Aharya Abhinaya involves dancers wearing costumes like dhoti, choli, and davani, paired with traditional jewelry such as \"tal saman\" and sun-moon diadems. Vachika Abhinaya focuses on speech through poems and dramas, while Saatwikam Abhinaya emphasizes the expression of sattvika emotions by skilled performers. Aangika Abhinaya uses body movements as the primary means of expression.","s":""},{"n":71,"t":"Dance","q":"The cultural heritage of Siddhis from _______ dates back to almost 300 years and their Siddhi Dhamal dance is an exquisite art form.","o":["Uttar Pradesh","Gujarat","Madhya Pradesh","Rajasthan"],"a":1,"e":"Gujarat. Siddhis - They are descendants of East African people who came to India as slaves during the 14th and 17th century AD. Dhamal is one such dance form that reflects the Siddis’ passion for hunting. In the old days, also known as Mashira Nritya, this dance was performed by Siddis after returning from a successful hunting expedition.","s":""},{"n":72,"t":"Dance","q":"Consider the following statements about Natwari Nritya:\n1. Natwari Nritya is associated with Kathak, a classical dance form known for its intricate footwork, graceful spins, Nazakat, and Padhant.\n2. Natwari Nritya is also known as the dance of Lord Shiva. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Natwari Nritya is another name for the dance of Krishna in the Kathak tradition, which emphasizes storytelling, rhythm, and expressive gestures. Statement 2 is incorrect because it refers to the dance of Krishna, not Lord Shiva.","s":""},{"n":73,"t":"Dance","q":"Dandari (Dancing) troupes perform ________ during the festival of Diwali for a fortnight with participation from Kolam and Raj Gond tribes.","o":["Chhau","Baiga Pardhoni","Ghusadi","Rout Nacha"],"a":2,"e":"Ghusadi (in the Adilabad district of Telangana). Baiga Pardhoni (Madhya Pradesh) dance is performed by the Baiga tribals. Raut Nacha (Chhattisgarh) is mainly performed by Yaduvanshis.","s":""},{"n":74,"t":"Dance","q":"Gaur Maria, a dance form from _________ state, is a famous art form of joy and invocation. It is a group dance and both men and women participate enthusiastically in this dance.","o":["Maharashtra","Rajasthan","Gujarat","Chhattisgarh"],"a":3,"e":"Chhattisgarh. Gaur Maria Dance: It is performed on the occasion of marriage by the Gaur Madiya of Abujhmad plateau of Bastar in Chhattisgarh and is called Gaur after the bison. Other dances of Chattisgarh: Pandavani, Raut Nacha, Panthi and Soowa.","s":""},{"n":75,"t":"Dance","q":"Lebang Boomani dance is the harvest dance of _________ .","o":["Mizoram","Tripura","Assam","Meghalaya"],"a":1,"e":"Tripura. Folk dance of Tripura and its related Community : Hozagiri dance - Reang community. Garia, Jhum, Maimita, Masak Sumani and Lebang Boomani - Tripuri community. Mamita' is a popular dance of the Kaloi community of Tripura.","s":""},{"n":76,"t":"Dance","q":"Consider the following statements about Mahari and Gotipua dances:\n1. Both Mahari Dance and Gotipua Dance originate from Odisha.\n2. Gotipua Dance is performed by young girls dressed as men to praise Lord Jagannath and Krishna. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because Gotipua is performed by young boys dressed as women, not young girls dressed as men, to praise Lord Jagannath and Krishna.","s":""},{"n":77,"t":"Dance","q":"The Songi Mukhawate dance of ________ celebrates the victory of truth over falsehood. The name of the dance is derived from the two lion masks worn by two dancers who represent Narasimha, an aspect of Lord Vishnu.","o":["Madhya Pradesh","Jharkhand","Maharashtra","Gujarat"],"a":2,"e":"Maharashtra. It is customarily performed as an integral part of the worship of Devi (mother goddess) on the full moon night of the lunar month of Chaitra (March/April).","s":""},{"n":78,"t":"Dance","q":"Rikham pada dance belongs to which of the following states ?","o":["Meghalaya","Assam","Mizoram","Arunachal Pradesh"],"a":3,"e":"Arunachal Pradesh. Rikham Pada Dance : Performed by the women of the Nishi tribe only to express their love for their husbands and to offer their reverence to the gods. Other dances of Arunachal Pradesh : Bhuiya dance, Chalo dance, Wancho dance, Pasi Kongki, Ponung dance and Popir dance.","s":""},{"n":79,"t":"Dance","q":"Which form of Indian dance is said to be 'soft and suitable for female presentation' ?","o":["Nritta","Taandava","Laasya","Nritya"],"a":2,"e":"Laasya. The Indian classical dances have two basic aspects: Tandava (movement and rhythm) and Lasya (grace, bhava and rasa). The nine rasas are - Shringaara, Haasya, Karuna, Rudra, Veera, Bhayaanaka, Bheebhatsya, Adbhutha and Shaantha.","s":""},{"n":80,"t":"Dance","q":"The Rathwas, who dwell in the state of ___perform the Rathwa dance on the occasion of Holi (festival of colours).","o":["Andhra Pradesh","Telangana","Maharashtra","Gujarat"],"a":3,"e":"Gujarat. Rathwas - Tribe of Gujarat dwell in Rath-Vistar, the hilly area of the southeastern part of the state. for five days as part of Holi celebrations and the dancers observe a fast during this period. The male dancers are called gherriyas while the female dancers are called gheranis.","s":""},{"n":81,"t":"Dance","q":"In the performance of _______ dance, on one side raasa dances are performed by women, whereas on the opposite side instrumentalist play the pung choloms (drums) and the karataala (cymbals).","o":["Kathakali","Yakshagana","Odissi","Manipuri"],"a":3,"e":"Manipuri. There are two prominent manners or Choloms in Manipuri dance: Pung Cholom (roar of the drums) borrows elements from the Manipuri martial arts Thang Ta, Sarit Sarak and Maibi Jagoi dance. Kartal Cholom - This is a group dance, where dancers form a circle. Women dance in groups, called Mandilla Cholom.","s":""},{"n":82,"t":"Dance","q":"The Lambadi dance is a folk dance form of the _______ tribe and originated in Andhra Pradesh.","o":["Sugali","Banjara","Nakkala","Dabba Yerukula"],"a":1,"e":"Banjara - A nomadic tribe of India. The community was denotified in the 1950s but was listed under the Habitual Offenders Act, 1952. Other names of Banjara : Lambani in Karnataka and Gwar or Gwaraiya in Rajasthan. Language of Banjara : ‘Gorboli’ ‘Gor mati Boli’ or ‘Brinjari’, an independent dialect. The dialect falls in the category of Indo-Aryan Language. Another Tribal dance of Andhra Pradesh - ‘Dhimsa’ (Performed by the Porja tribes).","s":""},{"n":83,"t":"Dance","q":"The Balti dance of _____ is distinct as it has its own costume, music and songs in the Balti language. The dance is only performed on rare occasions, such as feasts or celebrations.","o":["Uttarakhand","Ladakh","Kashmir","Himachal Pradesh"],"a":1,"e":"Ladakh. Other dances : Kathok Chenmo, Kompa Tsum-Tsag, Koshan, Shondol (Royal dance of Ladakh), Takshon or Shon. Uttarakhand: Bhotiya, Pandav Nritya, Chholiya, Jhumela, Jagar. Kashmir: Kud, Dumhal, Rouf, Bhand Pather, Bachha Nagma.","s":""},{"n":84,"t":"Dance","q":"Consider the following statements about Mundari dance:\n1. Mundari dance is associated with the Santhal tribe of West Bengal and is performed mainly during marriage ceremonies.\n2. Mundari dance is a classical temple dance of Odisha that follows the Natya Shastra tradition and incorporates postures like Chowk and Tribhanga. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Both statements are incorrect - Mundari dance is a folk dance of the Munda tribe in Jharkhand, performed during the harvest season with instruments like Madal, Nagara, and Bansi. It is neither associated with the Santhal tribe nor a classical temple dance of Odisha, and it does not follow the Natya Shastra tradition.","s":""},{"n":85,"t":"Dance","q":"Which of the following dance forms is performed by the Adi tribe of Arunachal Pradesh?","o":["Tapu","Karma","Sangphao","Kaksar"],"a":0,"e":"Tapu. Indian folk and tribal dances : Arunachal Pradesh - Buiya, Chalo, Wancho, Pasi Kongki Ponung, Popir, Bardo Chham, etc. Assam - Bihu, Bichhua, Bagurumba, Khel Gopal, Tabal Chongli, Jhumura Hobjanai etc. Nagaland - Chong, Nuralim, Temangnetin, Rangma, Zeliang, etc. Mizoram - Cheraw Dance (Bamboo dance), Khuallam, Chailam, Zangtalam, Khanatm, etc. Manipur - Thang Ta, Lai Haraoba, Pung Cholom, Nupa Dance, etc. Tripura -Hojagiri. Meghalaya - Laho, Shad Suk Mynsiem, Nongkrem.","s":""},{"n":86,"t":"Dance","q":"Chali, Jhumura and Nadu Bhangi are associated with which Indian classical dance form?","o":["Kathakali","Sattriya","Manipuri","Kuchipudi"],"a":1,"e":"Sattriya (Assam): Gayan -Bhayanar Nach, Kharmanar Nach are also associated with Sattriya dance. There were two dance forms prevalent in Assam before the neo-Vaishnava movement i.e Ojapali and Devadasi with many classical elements. Two varieties of Ojapali dances are still prevalent in Assam i.e. Sukananni or Maroi Goa Ojah and Vyah Goa Ojah. Sukananti Ojapali is of Shakti cult and Vyah Goa Oja paali is of Vaishnava cult .","s":""},{"n":87,"t":"Dance","q":"Which of the following is a traditional dance form of Sri Lanka?","o":["Bihu","Kathak","Kandyan dance","Bharatanatyam"],"a":2,"e":"Kandyan Dance (Developed during the Kandyan kings' reign) - It is an ancient dance style narrating stories from the Indian epic Ramayana. Other dances of Sri Lanka: PahathaRata Netum, Sabaragamuwa.","s":""},{"n":88,"t":"Dance","q":"The traditional singing of 'Nat' is associated with _________Dance.","o":["Kathak","Manipuri","Odissi","Chhau"],"a":1,"e":"Manipuri. Nat is the Manipuri classical style of singing, Pung or the Manipuri classical drum is the musical instrument used. Manipuri Dance Styles -Raas, Nata-Sankirtan, Pung Cholam (Dancers play the pung or drum while dancing), Dhola Cholam, Kartal Cholam, Thang ta (martial art form).","s":""},{"n":89,"t":"Dance","q":"Match the following tribal/folk dances with their respective states: Dance Form State\n1. Karma A. Goa\n2. Raut Nacha B. Kerala\n3. Kathakali C. Karnataka\n4. Yakshagana D. Chhattisgarh","o":["1-A, 2-B, 3-C, 4-D","1-D, 2-D, 3-B, 4-C","1-D, 2-C, 3-A, 4-B","1-B, 2-D, 3-C, 4-A"],"a":1,"e":"1-D, 2-D, 3-B, 4-C.","s":""},{"n":90,"t":"Dance","q":"Laho is the dance form of which state?","o":["Manipur","Sikkim","Meghalaya","Kerala"],"a":2,"e":"Meghalaya. Laho Dance : Performed during the Behdienkhlam festival by the Jaintia tribe. Other dances of Meghalaya : Nоngkrem, Shad Suk Mynsiem, Wangala and Dоrsegata.","s":""},{"n":91,"t":"Dance","q":"The folk dance of Chavittu Kali is associated with which of the following Indian states?","o":["Andhra Pradesh","Uttar Pradesh","Kerala","Gujarat"],"a":2,"e":"Kerala. Other folk dances : Ottam Thulal, Kaikottikali, Tappatikali, Kali Auttam. Andhra Pradesh - Ottam Thedal, Kummi, Siddhi, Bhamakalpam, Veeranatyam, Dappu, Tappeta Gullu, Lambadi, Dhimsa, Kolattam, Butta Bommalu.","s":""},{"n":92,"t":"Dance","q":"Tevitichiyattam, Nangai Natakam and Dasiyattam are the forms of which of the following classical dances?","o":["Odissi dance","Kathakali dance","Sattriya dance","Mohiniyattam dance"],"a":3,"e":"Mohiniyattam dance (Classical dance form of Kerala in South India) .","s":""},{"n":93,"t":"Dance","q":"Sarhul is a famous tribal festival of dance in which state ?","o":["Assam","Sikkim","Jharkhand","Chhattisgarh"],"a":2,"e":"Jharkhand. Sarhul - The festival of the Oraon tribe. It is the festival of the New Year and celebrated in the Hindu month of Chaitra, three days after the appearance of the new moon. It is also a celebration of the beginning of spring.","s":""},{"n":94,"t":"Dance","q":"Ghurehi is the folk dance of which of the following Indian states?","o":["West Bengal","Himachal Pradesh","Karnataka","Jharkhand"],"a":1,"e":"Himachal Pradesh. Ghurehi Dance - Performed by Ladies of Chamba Region, during the annual fairs. It is a devotional dance form, dedicated to Lord Shiva and performed during Shivratri festival.","s":""},{"n":95,"t":"Dance","q":"Consider the following statements about Kamsale dance:\n1. Kamsale, also known as Beesu Kamsale, is a devotional folk art of Karnataka performed in honor of Lord Mahadeshwara.\n2. The dance is performed exclusively by women during temple festivals in the coastal districts of Karnataka. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect because it is not performed exclusively by women nor is it limited to coastal districts; it is a male group dance popular in Mysore, Nanjangud, Kollegala, and Bangalore regions.","s":""},{"n":96,"t":"Dance","q":"Consider the following statements about Kathak dance:\n1. Kathak is primarily associated with the erstwhile princely state of Avadh and flourished under the patronage of Mughal rulers.\n2. Famous exponents of Kathak include Pandit Birju Maharaj, Shovna Narayan, and Uday Shankar. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect because Uday Shankar was a pioneer of modern Indian dance, not a Kathak exponent. Other Kathak maestros include Shambhu Maharaj and Lachhu Maharaj.","s":""},{"n":97,"t":"Dance","q":"The Pakhawaj syllables are primarily used to conclude which of the following Indian classical dances?","o":["Manipuri","Kathak","Odissi","Kathakali"],"a":2,"e":"Odissi. The \"Mangalacharan,\" a concluding prayer or benediction, is often recited using Pakhawaj bols, creating a powerful and symbolic ending.","s":""},{"n":98,"t":"Dance","q":"Bharatanatyam expresses South Indian religious themes and spiritual ideas of ______.","o":["Sufism","Shaivism","Buddhism","Jainism"],"a":1,"e":"Shaivism - A Hindu tradition (which worships Shiva) that most accepts ascetic life and emphasises yoga. The followers of Shaivism are called Shaivas or Shaivites. Bharatnatyam (Tamil Nadu) : It traces its origins back to the Natyashastra, an ancient treatise on theatre written by the mythic priest Bharata.","s":""},{"n":99,"t":"Dance","q":"Daskathia of ________ is the tribal dance performed by two males depicting the historic and Puranic events.","o":["Uttar Pradesh","Gujarat","Goa","Odisha"],"a":3,"e":"Odisha. Daskathia (Folk theatre form, associated with the worship of Lord Shiva). Some Folk theatre form:- Bhavai (Rajasthan), Garodas (Gujarat), Jatra (Odisha), Kariyila (Himachal Pradesh), Maach (Madhya Pradesh), Swang (Haryana), Ojapali (Assam), Powada (Maharashtra), Tamasha (Maharashtra), Bhand Pather (Jammu and Kashmir), Bhaona (Assam), Dashavatar (Konkan area), Naqal (Punjab).","s":""},{"n":100,"t":"Dance","q":"Match the following folk dances with their respective states / communities: Folk Dance State/Community\n1. Jhika Dashain A. Maharashtra\n2. Kolkali B. Rajasthan\n3. Ghoomar C. Kerala\n4. Koli D. Jharkhand","o":["1-D, 2-C, 3-B, 4-A","1-B, 2-D, 3-C, 4-A","1-D, 2-A, 3-C, 4-B","1-A, 2-C, 3-D, 4-B"],"a":0,"e":"1-D, 2-C, 3-B, 4-A. Jhika Dashain - A tribal dance of the Santhal community in Jharkhand, performed a few days before Dussehra. Kolkali - A martial folk dance of Kerala performed in a circle using sticks. Ghoomar - A traditional women’s folk dance of Rajasthan involving graceful spins. Koli -A lively folk dance of Maharashtra performed by the Koli fishing community.","s":""},{"n":101,"t":"Dance","q":"Identify the correct code for the statements given below about Changai dance:\n1. Changai dance is performed by the Konyak tribe of Nagaland.\n2. It is associated with the Hornbill Festival held in December.","o":["Both 1 and 2 are correct","1 is correct, but 2 is incorrect","1 is incorrect, but 2 is correct","Both 1 and 2 are incorrect"],"a":3,"e":"Both 1 and 2 are incorrect. Changai dance is performed by the Chang tribe of Nagaland during the Naknyulum festival (a three-day celebration), not by the Konyak tribe or during the Hornbill Festival. The Hornbill Festival is held every year from 1 to 10 December at Kisama Heritage Village, near Kohima in Nagaland. It was started in 2000 and is organized by the Government of Nagaland to celebrate and showcase the rich cultural heritage of the state’s tribes.","s":""},{"n":102,"t":"Dance","q":"Thabal Chongba is a folk dance of which Indian state ?","o":["Goa","Mizoram","Manipur","West Bengal"],"a":2,"e":"Manipur. Folk dances : Manipur - Rasa lila, Gaura Lila, Pung Cholom. Goa - Ghode Modni, Dhangar Dance, Goff Talgadi, Shigmo and Mussel khel.","s":""},{"n":103,"t":"Dance","q":"The Raigarh Gharana is associated with which of the following dance forms?","o":["Odissi","Kathakali","Kathak","Manipuri"],"a":2,"e":"Kathak: Raigarh Gharana -Developed under the patronage of Raja Chakradhar Singh.","s":""},{"n":104,"t":"Dance","q":"Consider the following statements about Kathakali:\n1. ‘Kalasam’ is a dance sequence in Kathakali, a classical dance form of Kerala.\n2. Major instruments used in Kathakali music include Pakhawaj, Sitar, and Tabla. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1.\nStatement 2 is incorrect because the main instruments used in Kathakali are Chenda, Maddalam, Chengila, and Elathalam, not Pakhawaj, Sitar, or Tabla.","s":""},{"n":105,"t":"Dance","q":"Consider the following statements about Vazhuvoor style:\n1. Vazhuvoor is one of the styles of Kuchipudi, a classical dance form from Andhra Pradesh.\n2. Other famous styles of Bharatanatyam include Cheraw and Kalbelia. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Vazhuvoor is actually a style of Bharatanatyam from Tamil Nadu, not Kuchipudi. Also, Cheraw (Mizoram) and Kalbelia (Rajasthan) are folk dances, not styles of Bharatanatyam. Other Bharatanatyam styles include Melattur and Pandanallur.","s":""},{"n":106,"t":"Dance","q":"Kathak is found in three distinct forms, called 'gharanas', named after the cities where the Kathak dance tradition evolved. Name those three cities.","o":["Jaipur, Benaras, Lucknow","Prayagraj, Thiruvananthapuram, Surat","Ayodhya, Prayagraj, Jaipur","Banaras, Ayodhya, Lucknow"],"a":0,"e":"Jaipur, Benaras, Lucknow. Lucknow Gharana (Founded by Ishwari Prasad). Jaipur Gharana (founded by Bhanu Ji Maharaj). Banaras Gharana (Founded by Janakiprasad).","s":""},{"n":107,"t":"Dance","q":"The 'Joenpa Legso' is a welcome dance of___________.","o":["Afghanistan","Bhutan","Sri Lanka","Bangladesh"],"a":1,"e":"Bhutan. Other Dances of Bhutan - Drametse NgaCham Dance, Pa Cham Dance, Zhungdra Dance, Boedra Dance. Dance forms of other countries : Afghanistan - Atan, Ishala and Natsa. Sri Lanka - Kandyan dance.","s":""},{"n":108,"t":"Dance","q":"The \"Nalacharitham\" play is associated with which Indian dance form?","o":["Kathak","Kathakali","Sattriya","Odissi"],"a":1,"e":"Kathakali (Kerala) . The story Nalacharitham is written by \"Unnai Warrier\". It is the romantic story of unlimited love between Nala and Damayanthi. There are 24 Basic Mudras (hand gestures) and a total of 470 different symbols used in this dance.","s":""},{"n":110,"t":"Dance","q":"Consider the following statements about Garba dance:\n1. Garba is a traditional folk dance of Rajasthan mainly performed during the festival of Teej.\n2. Other folk dances performed during Navratri include Dandiya in Gujarat and Rajasthan. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. Statement 1 is incorrect because Garba is from Gujarat and is performed during Navratri, not Teej.","s":""},{"n":111,"t":"Dance","q":"Which of the following classical dance forms begins with a drum playing performance called 'Kelikottu'?","o":["Bharatanatyam","Odissi","Kuchipudi","Kathakali"],"a":3,"e":"Kathakali (Kerala, classical dance) . The instruments used are -Chenda (Cylindrical drum), Madhalam (a long cylindrical drum), Chengila, Ilathalam ( Resembles miniature pair of cymbals), Idakka (drum) and Sankhu (conch). Kathakali music follows the traditional Sopana sangeet of Kerala.","s":""},{"n":112,"t":"Dance","q":"Karagam Folk Dance is associated with which state ?","o":["Tamil Nadu","Rajasthan","Assam","Haryana"],"a":0,"e":"Tamil Nadu. Karagam dance It is a folk dance with musical accompaniment, performed balancing a pot on the head. Dances of Tamil Nadu -Bharatanatyam, Kolattam, Karakattam, Kazhai Kothu, Devaraattam, Mayil Attam, Kummi, Oyilattam, Karagam.","s":""},{"n":113,"t":"Dance","q":"Match the following dance forms/rituals with their respective states: Dance Form / Ritua State\n1. Bhoota Kola A. Kerala\n2. Kuchipudi B. Andhra Pradesh\n3. Theyyam C. Tamil Nadu\n4. Karagattam D. Karnataka","o":["1-D, 2-B, 3-A, 4-C","1-B, 2-D, 3-C, 4-A","1-D, 2-A, 3-B, 4-C","1-A, 2-B, 3-D, 4-C"],"a":0,"e":"1-D, 2-B, 3-A, 4-C.","s":""},{"n":114,"t":"Dance","q":"Suggi is a famous folk dance form of _________ state of India","o":["Karnataka","Chhattisgarh","Punjab","Sikkim"],"a":0,"e":"Karnataka. Suggi - A dance performed at the time of harvesting by the Halakki Vokkaliga tribe.","s":""},{"n":115,"t":"Dance","q":"Nati is a folk dance of which of the following states ?","o":["Himachal Pradesh","Madhya Pradesh","Arunachal Pradesh","Andhra Pradesh"],"a":0,"e":"Himachal Pradesh. Nati - It was listed in the Guinness Book of World Records as the largest folk dance in the world. It is known as Tandi in upper districts of Garhwal.","s":""},{"n":116,"t":"Dance","q":"Jhijhiya is a famous folk dance of Bihar and is performed in the mythological town of Mithila. This dance is performed by women only. The whole Navaratri \"nine nights' festival is celebrated to worship the three forms of Lord ___________ .","o":["Kali, Lakshmi, Durga","Sita, Durga, Laxmi","Lakshmi, Parvati, Saraswati.","Sita, Kali, Parvati"],"a":2,"e":"Lakshmi, Parvati, Saraswati . Jhijhiya is a cultural folk dance of Mithila regions of Bihar and Madhesh province of Nepal. It is performed in the Hindu month of Ashwin (September/October). It has its own types of songs either in Maithili or Bhojpuri language.","s":""},{"n":117,"t":"Dance","q":"Kathakali took shape in Southern India in the seventeenth century under the patronage of the______.","o":["Prince of Tamil Nadu","Prince of Bengal","Prince of Karnataka","Prince of Punjab"],"a":2,"e":"Prince of Karnataka . Kathakali (Kerala) - A classical Indian dance that originated in Kerala. Most of the stories for the play are taken from Hindu epics like “Bhagavata Purana”, “Mahabharata” and “Ramayana’”. The term Kathakali is derived from Katha (conversation or traditional story) and Kali (performance).","s":""},{"n":118,"t":"Dance","q":"Sangphao tribal dance is performed in which of the following states?","o":["Gujarat","Rajasthan","West Bengal","Nagaland"],"a":3,"e":"Nagaland (Naga tribe). Popular folk dances: Nagaland - Modse, Agurshikukula, Butterfly Dance, Aaluyattu, Sadal Kekai, Changai Dance, Kuki Dance, Leshalaptu, Khamba Lim.","s":""},{"n":119,"t":"Dance","q":"Which among the following is a dance performed by the devotees during the ceremonial worship of Murugan the Hindu God of war ?","o":["Mayilattam","Yaksha","Kavadi attam","Kummi"],"a":2,"e":"Kavadi attam (Burden Dance) - part of Thaipusam festival and is celebrated in Tamil Nadu. Yakshagana (song of the yaksha) - celebrated in Karnataka. It has originated as a product of the Vaishnava bhakti movement. Kummi - celebrated in Tamil Nadu and Kerala. Mayilattam - performed in the Hindu temples of Tamil Nadu in reverence to Lord Subrahmanya.","s":""},{"n":120,"t":"Dance","q":"_______ poses are depicted on the gopurams of the Chidambaram temple (Tamil Nadu).","o":["Bharatnatyam","Kathak","Kathakali","Mohiniyattam"],"a":0,"e":"Bharatnatyam. It is a classical dance of Tamil Nadu. Chidambaram temple (Tamil Nadu) : Dedicated to the Nataraja form of lord Shiva. It was Built in the Dravidian style of temple architecture in the 10th century during Chola's rule.","s":""},{"n":121,"t":"Dance","q":"Consider the following statements about Brita dance:\n1. Brita dance is one of the well-known folk dances of West Bengal, performed to thank the local deity after recovering from an illness, often smallpox.\n2. Brita dance is a harvest festival dance performed in Punjab’s rural areas. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect because Brita is not a harvest dance of Punjab; it is specific to West Bengal.","s":""},{"n":122,"t":"Dance","q":"The Zo - Mal - Lok folk dance is associated with which community?","o":["Chaimal community","Jamatia community","Lushai community","Lepcha community"],"a":3,"e":"Lepcha community. Zo Mal Lok dance (Sikkim) - It portrays the sowing, reaping and harvesting of paddy. Dances performed by the Lepcha community - Chu Faat, Damsang-Lyang, Kinchum-Chu-Bomsa. Jamatias are fond of their traditional folk culture like Drama, Garia festival and other common dances of Kok - Borok speaking tribes. Lushai community (Tripura) - Cheraw Dance or Bamboo dance.","s":""},{"n":123,"t":"Dance","q":"___________ dance is introverted and restrained compared to most other dances of India - the artist never establishes eye contact with the audience.","o":["Kathakali","Manipuri","Kuchipudi","Bharatnatyam"],"a":1,"e":"Manipuri. The dance in Manipur is associated with rituals and traditional festivals, there are legendary references to the dances of Shiva and Parvati and other gods and goddesses who created the universe.","s":""},{"n":124,"t":"Dance","q":"Which of the following dance forms is associated with the state of Arunachal Pradesh ?","o":["Panwariya","Dhaman","Buiya","Garba"],"a":2,"e":"Buiya performed by the Digaru Mishmi tribe. This dance is performed in multiple festivals like Tazampu, Duiya, and Tanuya. Other dances of Arunachal Pradesh include Chalo dance (Nocte tribe), Oriah Dance (Wancho tribe), Pasi Kongki (Adi Tribe), Ponung Dance (Adi Tribe), Popir Dance (Galo tribe), Bardo Chham (Sherdukpens community), etc.","s":""},{"n":125,"t":"Dance","q":"Consider the following statements about Mohiniyattam:\n1. Mohiniyattam is a classical dance form of Kerala depicting the incarnation of Lord Vishnu as Mohini.\n2. The dance is mentioned in the ancient text Vyavahar Mala, written in 1709 by Mazhamagalam Narayanan Namputiri.\n3. Mohiniyattam incorporates the two major postures of Tribhang and Chowk.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only . Statement 3 is incorrect because Tribhang and Chowk are characteristic postures of Odissi, not Mohiniyattam.","s":""},{"n":126,"t":"Dance","q":"‘Nupa’ dance is associated with which Indian state?","o":["Karnataka","Manipur","Jharkhand","Tamil Nadu"],"a":1,"e":"Manipur . Nupa Pala (Kartal Cholom or Cymbal Dance) is a ramification of the Manipuri style of dance and music.","s":""},{"n":127,"t":"Dance","q":"The women of which tribe perform the traditional folk dance called Chakri?","o":["Kaul","Kanjar","Gond","Bharia"],"a":1,"e":"Kanjar. It is performed exclusively by womenfolk in marriages and festivals. Kanjar tribe inhabited some parts of the Kota and Baran districts of Rajasthan. Gond tribe -Karma, Goncho Dance. Bharia tribe -Bharam, Setam, Saila, and Ahirai dance.","s":""},{"n":128,"t":"Dance","q":"Ghoomar dance form was developed by which of the following tribes to worship Goddess Saraswati?","o":["Gujjar","Sahariya","Gond","Bhil"],"a":3,"e":"Bhil. It is the largest tribal group in India as per 2011 Census. Bhil tribes are found in the states of Maharashtra, Chhattisgarh, Gujarat, Rajasthan, Madhya Pradesh, Tripura. Gond Tribe (Karma dance). Sahariya tribe (Lehngi dance). Gujjar Tribe (Chari dance).","s":""},{"n":129,"t":"Dance","q":"Which of the following is the main percussion instrument used in the performance of Mohiniyattam dance ?","o":["Sitar","Edakka","Dhumsa","Nagada"],"a":1,"e":"Edakka. The musical instruments used in Mohiniyattam:-Mridangam or Madhalam (barrel drum), Idakka (hourglass drum), flute, Veena, and Kuzhitalam (cymbals). Nagadas are used in Punjabi and Rajasthani folk music. Dhumsa used in 'Seraikella Chhau' dance of Orissa and 'Purulia Chhau' dance of West Bengal.","s":""},{"n":130,"t":"Dance","q":"Which folk dance represents a mock fight between Goddess Durga and Mahishasura?","o":["Bhangra","Raslila","Kalbelia","Dandiya Raas"],"a":3,"e":"Dandiya Raas is a folk dance of Gujarat which is performed during the Navratri festival. Other folk dances of Gujarat are Garba, Gheriya, Dangi Nritya, Matukadi, Siddi Dhamal, Tippani and Hudo.","s":""},{"n":131,"t":"Dance","q":"The Verdigao Dance, performed during religious festivals with Portuguese cultural influence, is associated with which of the following Union Territories of India?","o":["Dadra and Nagar Haveli","Daman and Diu","Puducherry","Andaman and Nicobar Islands"],"a":1,"e":"Daman and Diu. Other folk dances of this Union Territory include Mando, Vira Dance, Portuguese Dance, and various tribal dances.","s":""},{"n":132,"t":"Dance","q":"Statement 1: Jhumur is one of the most famous folk dances of Assam, performed by the ‘Kulis’ working in tea gardens.\nStatement 2: It is performed during the autumn season as part of cultural celebrations in the region.","o":["Both Statement 1 and Statement 2 are correct, and Statement 2 is the correct explanation of Statement 1.","Both Statement 1 and Statement 2 are correct, but Statement 2 is not the correct explanation of Statement 1.","Statement 1 is correct, but Statement 2 is incorrect.","Statement 1 is incorrect, but Statement 2 is correct."],"a":0,"e":"Folk Dances of Assam: Bihu, Bagurumba, Jhumur, Ali Ai Ligang, Bhortal Nritya, Deodhani, Apsara Dance, Nagar Naam, Chorea/Baideu, Ojapali.","s":""},{"n":133,"t":"Dance","q":"Which of the following dance forms depicts the anguish of women whose partners are gone from home ?","o":["Matki","Biraha","Alkap","Paika"],"a":1,"e":"Biraha is an Ahir ethnic Bhojpuri folk genre from Uttar Pradesh, Bihar, and Jharkhand.","s":""},{"n":134,"t":"Dance","q":"Gatka, a traditional fighting style of the Nihang Sikh warriors, used both for self- defence as well as a sport, has originated from which of the following states of India ?","o":["Gujarat","Rajasthan","Bihar","Punjab"],"a":3,"e":"Punjab. Famous Martial Arts in India: Kalaripayattu (Oldest Martial Art in India; Kerala), Silambam (Tamil Nadu), Thang-ta, and Sarit Sarak (Manipur), Thoda (Himachal Pradesh), Lathi (Punjab and Bengal), Inbuan Wrestling (Mizoram), Musti Yuddha (Varanasi), and Pari -Khanda (Bihar).","s":""},{"n":135,"t":"Dance","q":"‘Elelakkaradi’ is a tribal dance form of which Indian state?","o":["Goa","Kerala","Rajasthan","Jharkhand"],"a":1,"e":"Kerala. Tribal Dances of India: Santhali Dance (West Bengal, Jharkhand & Odisha), Bamboo Dance (Mizoram), Kalbelia Dance (Rajasthan), Bhagoria Dance (Madhya Pradesh), Chhau Dance (West Bengal, Jharkhand & Odisha), Dhimsa Dance (Andhra Pradesh), Shad Suk Mynsiem (Meghalaya).","s":""},{"n":136,"t":"Dance","q":"Sangrai is a folk dance of which state of India?","o":["Bihar","Tripura","Karnataka","Goa"],"a":1,"e":"Tripura. Sangrai dance is performed by the Mog tribal community on the occasion of Sangrai festival during the month of Chaitra (in April) of the Bengali calendar year.","s":""},{"n":137,"t":"Dance","q":"Statement 1: Gambhira is a traditional masked dance form of West Bengal.\nStatement 2: It is performed during Chaitra Sankranti, and its masks are made from neem and fig wood by the Sutradhar community.","o":["Both Statement 1 and Statement 2 are correct, and Statement 2 is the correct explanation of Statement 1.","Both Statement 1 and Statement 2 are correct, but Statement 2 is not the correct explanation of Statement 1.","Statement 1 is correct, but Statement 2 is incorrect.","Statement 1 is incorrect, but Statement 2 is correct."],"a":0,"e":"Folk Dances of West Bengal: Chhau, Gambhira, Alkap, Jhumur, Tusu, Raibeshe, Domni, Bratachari, Baul, Kirtan, Natua, Santhal dance, Gajan.","s":""},{"n":138,"t":"Dance","q":"‘Ummatt-aat’ is a folk dance form performed in ______.","o":["Kasauli","Coorg","Itanagar","Gangtok"],"a":1,"e":"Coorg. There are many other traditional dance forms of Karnataka which include Dollu Kunitha, Suggi Kunitha, Kamsale, Gorava Kunitha, Somana Kunitha, Bolak-aat, Komb-aat, Bhootha Aradhane, Yaksha Gana, Naga Mandala, Veeragase.","s":""},{"n":140,"t":"Dance","q":"______ is a mask dance popular in South Malabar.","o":["Dhangar","Kummattikali","Parichakali","Zemmado"],"a":1,"e":"Kummattikali. Dhangar - The Dhangar dance is performed by the shepherd community of Goa during Navratri. Parichakali (Lakshadweep). Other famous folk dances of south India are - Padayani or Paddeni (Kerala), Kummi and Kolattam (Tamil Nadu), Kargam and Puli Vesham (Tamil Nadu).","s":""},{"n":141,"t":"Dance","q":"Assertion (A): Chari Dance is a traditional folk dance of Rajasthan performed by women.\nReason (R): It is performed balancing a pot or chari with lighted diyas on the head.","o":["Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"a":0,"e":"Folk Dances of Rajasthan : Ghoomar, Kalbelia, Bhavai, Chari, Terah Taal, Gair, Kathputli, Kachhi Ghodi, Fire Dance, Maand, Dandi Gair, Pabuji Ki Phad, Drum Dance, Chang Dance.","s":""},{"n":142,"t":"Dance","q":"The ‘Veeragase’ dance, performed during the Dussehra festival holds a special place in the folk dances of the state of ______","o":["Karnataka","Assam","Odisha","Sikkim"],"a":0,"e":"Karnataka. It is primarily performed during the Hindu months of Shravana and Karthika.","s":""},{"n":143,"t":"Dance","q":"Consider the following statements about the dance form ‘Ratvai’:\n1. It is performed during the monsoon season to the beats of large drums.\n2. It is associated with the Mewati tribe,\n3. `mainly in Bihar and Rajasthan.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . Ratvai is a monsoon dance linked to the Mewati tribe, popular in Haryana and Rajasthan, symbolizing joy and community celebration.","s":""},{"n":144,"t":"Dance","q":"'Chad Sukra', a popular traditional dance - festival of Meghalaya, is celebrated as a ______.","o":["community marriage festival","thanksgiving festival","birth festival","sowing festival"],"a":3,"e":"Sowing festival. Folk Dance of Meghalaya: Behdienkhlam, Nоngkrem, Shad Suk Mynsiem, Wangala, Dоrsegata, Lahоо.","s":""},{"n":145,"t":"Dance","q":"In which of the following states is the ‘Mathuri’ folk dance practised?","o":["Telangana","Haryana","Uttarakhand","Uttar Pradesh"],"a":0,"e":"Telangana. The most popular folk dances of Telangana are Perini Sivatandavam, Dappu Dance, Lambadi, Oggu Katha, Chindu Bhagavatam, Gussadi Dance, Tholu Bommalata. Da
