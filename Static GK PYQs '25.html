dapa"],"a":1,"e":"Garbhagriha - Inner chamber of the temple where the main deity was placed. It is also known as Sanctum Sanctorium. Other parts of Hindu Temple : Mandapa - Incorporates space for a large number of worshippers, Shikhar - Mountain-like spire, Vahan -Vehicle of the temple’s main deity, Amalak and Kalash - Crowning elements.","s":""},{"n":1707,"t":"Religious Places","q":"The Virupaksha Temple is situated at _______.","o":["Surat","Sanchi","Hampi","Jaipur"],"a":2,"e":"Hampi. Virupaksha Temple (Pampapathi Temple) was built by Lakhan Dandesha in Dravidian style on the south bank of the river Tungabhadra at Hampi (Capital of Vijayanagara). Dedicated to Lord Siva. It is designated as a UNESCO World Heritage site (1986). Other Monuments at Hampi - Vittala Temple, Ganigatti Jain temple, Krishna Temple and Lotus Mahal.","s":""},{"n":1708,"t":"Religious Places","q":"Which among the following is NOT a component of Lion Capital at Sarnath, India?","o":["Carved cow representing South direction","Figures of 4 lions","Dharma Chakras","Lotus base bell"],"a":0,"e":"Carved cow representing South direction. The top of the column—the capital—has three parts. First, a base of a lotus flower (ubiquitous symbol of Buddhism). Then, a drum on which four animals are carved represents the four cardinal directions: a horse (west), an ox (east), an elephant (south), and a lion (north). Four lions stand at top of the drum, each facing in the four cardinal directions.","s":""},{"n":1709,"t":"Religious Places","q":"In the Kandariya Mahadeva Temple, _______ was the place of ritual worship, where only the king, his family members and the priests used to gather.","o":["sanctum sanctorum","Mahamandap","antraal","Amalak"],"a":0,"e":"sanctum sanctorum . Garbha griha (Temple's innermost part where the Murti of the deity is kept). Temple Other Part - Mahamaṇḍapa (greater hall). Antarala (small antechamber or foyer between garbhagriha and mandapa). Amalaka (notched stone disk, usually with ridges on the rim, that sits on the top temple's shikhara. Kandariya Mahadeva temple (Nagara Style of Architecture) (Madhya Pradesh) was constructed by king Dhaṇgadeva (Chandela dynasty) in 999 CE.","s":""},{"n":1710,"t":"Religious Places","q":"In which state of India is the Sri Brahmapureeswarar temple situated?","o":["Andhra Pradesh","Tamil Nadu","Rajasthan","Manipur"],"a":1,"e":"Tamil Nadu . Other famous temples of Tamil Nadu: Meenakshi Temple, Rameshwaram Temple, Kumari Amman Temple, Nagannathaswamy Temple, Brihadeeswarar Temple, Kapaleeshwarar Temple, Nataraja Temple, Arunachaleswarar Temple, Ekambareswarar, Mahabalipuram Shore, etc.","s":""},{"n":1711,"t":"Religious Places","q":"Kardang Monastery which is a Buddhist Pilgrimage is situated in which state of India?","o":["Jharkhand","Goa","Himachal Pradesh","Kerala"],"a":2,"e":"Himachal Pradesh . It is situated on the left bank of River Bhaga. It was renovated in 1912 CE by Lama Norbu Rinpoche.","s":""},{"n":1712,"t":"Religious Places","q":"What is the stone-like disc seen at the top of the temple in Odisha and nearby district's Temple architecture called?","o":["Kalasha","Antarala","Amalaka","Jagati"],"a":2,"e":"‘ Amalaka ’ is one of the important elements of Temple Shikhara (Tower) in Nagara Shaili usually found in Uttara Bharatha. A mandir ‘kalash’ is a metal or stone spire used to top the domes of Hindu temples. In Hindu temple architecture, the ‘jagati' is the raised surface of the platform or terrace upon which some Buddhist or Hindu temples are built.","s":""},{"n":1713,"t":"Religious Places","q":"A 7 meter high sculpture known as 'Sadashiva', representing three aspects of Lord Shiva is found at ______ Caves.","o":["Khandagiri","Udayagiri","Bhimbetka","Elephanta"],"a":3,"e":"Elephanta Caves. The sculpture represents three aspects of Shiva: identified as the Creator, the Preserver, and the Destroyer, respectively, along with Aghora or Bhairava (left half), Taptapurusha or Mahadeva (central full face), and Vamadeva or Uma (right half).","s":""},{"n":1714,"t":"Religious Places","q":"Who established the International Society for Krishna Consciousness (ISKCON)?","o":["Bhaktivedanta Swami Prabhupada","Sri Chaitanya","Srila Bhaktisiddhanta Sarasvati","Sri Ramakrishna"],"a":0,"e":"Bhaktivedanta Swami Prabhupada . ISKCON was founded in 1966 in New York City by A. C. Bhaktivedanta Swami Prabhupada. Its core beliefs are based on Hindu scriptures, particularly the Bhagavad Gita and the Bhagavata Purana, and the Gaudiya Vaishnava tradition.","s":""},{"n":1715,"t":"Religious Places","q":"Phodong Monastery is located in ______.","o":["Ladakh","Bihar","Madhya Pradesh","Sikkim"],"a":3,"e":"Sikkim. Phodong Monastery (or Phodang) is a Buddhist monastery . Hemis Monastery is situated 45 Kms away from Leh in Ladakh.","s":""},{"n":1716,"t":"Religious Places","q":"Shaikh Muinuddin Sijzi (Moinuddin Chishti) dargah is situated in which of the following cities?","o":["Jalandhar","Ajmer","Panipat","Patna"],"a":1,"e":"Ajmer . Dargah Sharif of Ajmer Sharif is a Sufi tomb (dargah) of the revered Sufi saint, Moinuddin Chishti, located at Ajmer, Rajasthan. The shrine has Chishti's grave (Maqbara).","s":""},{"n":1717,"t":"Religious Places","q":"In which of the following states is Sabarimala Sree Dharma Sastha Temple located?","o":["Karnataka","Telangana","Andhra Pradesh","Kerala"],"a":3,"e":"Kerala . The temple is dedicated to Lord Ayyappa Swamy. Kerala's renowned Sabarimala Temple is to be renamed Sabarimala Sree Ayyappa Swamy Temple.","s":""},{"n":1718,"t":"Religious Places","q":"Kadam Rasul Mosque, whose construction is characterized by the use of bricks and black marble, is situated at ______.","o":["Purnea","Alwar","Mandu","Gaur"],"a":3,"e":"Gaur, Malda (West Bengal). Kadam Rasool Mosque was built by Sultan Nasseruddin Nusrat Shah in the year 1530-31 .","s":""},{"n":1719,"t":"Religious Places","q":"In which of the following places is the Govardhan Math located?","o":["Badrinath","Dwarka","Sringeri","Puri"],"a":3,"e":"Puri (Orissa). Govardhan Math or Govardhan Peetham is one amongst the four cardinal peethams established by the 8th century philosopher-saint Adi Shankara to preserve and propagate Sanatana Dharma .","s":""},{"n":1720,"t":"Religious Places","q":"Which of the following temples has Panchayatana Style of architecture?","o":["Sun Temple","Kashi Vishwanath temple","Brihadeeswara Temple","Dashavatara Temple"],"a":3,"e":"Dashavatara Temple. Panchayatana is an architectural style where the main shrine is built on a rectangular plinth with four smaller subsidiary shrines at the four corners, making it a total of five shrines.","s":""},{"n":1721,"t":"Religious Places","q":"Where is Bishnupur, which is famous for terracotta temples, located?","o":["Rajasthan","Gujarat","West Bengal","Assam"],"a":2,"e":"West Bengal. Terracotta temples are known for their Hindu temples made from local terracotta, such as the pyramid-shaped Rasmancha, established around 1600.","s":""},{"n":1722,"t":"Religious Places","q":"Which of the following cities is home to one of the famous Swaminarayan Akshardham temples in India?","o":["New Delhi","Madurai","Vadodara","Mysore"],"a":0,"e":"New Delhi . Swaminarayan Akshardham is the wo r ld's largest comprehensive Hindu temple. It measures 356 ft (109 m) in length, 141 ft high and 356 ft in width. It was inaugurated on 6 November 2005.","s":""},{"n":1723,"t":"Religious Places","q":"Kartarpur Sahib corridor connects Dera Baba Nanak Shrine in Gurdaspur, India to Kartarpur Gurudwara in Pakistan, which is located near the banks of the river _____.","o":["Ravi","Jhelum","Sutlej","Chenab"],"a":0,"e":"Ravi. Kartarpur Corridor was first proposed in early 1999 by Atal Bihari Vajpayee and Nawaz Sharif, the Prime Ministers of India and Pakistan respectively at that time.","s":""},{"n":1724,"t":"Religious Places","q":"Birthplace of Guru Nanak, known as Nankana Sahib today, was earlier called.","o":["Roda","Umarkot","Rai Bhoi di Talwandi","Luni"],"a":2,"e":"Rai Bhoi di Talvandi. Guru Nanak was the founder of the Sikh religion and was born on 15th April 1469 in Pakistan.","s":""},{"n":1725,"t":"Religious Places","q":"The Biraja Temple, the Rajarani Temple and the Samaleswari Temple are all located in ?","o":["Odisha","Tamil Nadu","Assam","Kerala"],"a":0,"e":"Odisha.","s":""},{"n":1726,"t":"Religious Places","q":"‘Dharmaraja (Yudhishthir) Ratha’, ‘Bhima Ratha’, ‘Arjuna Ratha’ and ‘Nakula Sahadeva Ratha’ are four of the Panch Rathas at Mahabalipuram. What is the name of the fifth Ratha?","o":["Draupadi Ratha","Bhishma Ratha","Krishna Ratha","KarnaRatha"],"a":0,"e":"Draupadi Ratha.","s":""},{"n":1727,"t":"Religious Places","q":"Which tales are related with the painting and sculptures of the Ajanta caves?","o":["Hitopadesha Tales","Panchatantra Tales","Pentamerone Tales","Jataka Tales"],"a":3,"e":"Jataka tales. These are Buddhist legends describing the previous births of the Buddha. These fables embed ancient morals and cultural lores that are also found in the fables and legends of Hindu and Jain texts.","s":""},{"n":1728,"t":"Awards","q":"The \"Golden Boot\" is awarded in which sport?","o":["Cricket","Baseball","Hockey","Football"],"a":3,"e":"Football. The Golden Boot (also known as the Golden Shoe) is a prestigious award in football (soccer), given to the top goal scorer in major tournaments such as the FIFA World Cup, UEFA European Championship, and domestic leagues. This award highlights striking excellence and celebrates the player with the most impactful scoring performance in the tournament.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1729,"t":"Awards","q":"Who was the first Indian to receive the Nobel Prize in Literature for Geetanjali?","o":["Salman Rushdie","Rabindranath Tagore","Arundhati Roy","R. K. Narayan"],"a":1,"e":"Rabindranath Tagore. In 1913, Rabindranath Tagore became the first Indian and non-European Nobel laureate in Literature, honored for Geetanjali (Song Offerings), which he translated into English himself. The work earned him worldwide acclaim, while his other noted creations include Kabuliwala, Purabi, Gora, and The Home and the World. Salman Rushdie, a British-American writer of Indian origin, won the Booker Prize for Midnight’s Children. Arundhati Roy received the Booker Prize for her debut novel The God of Small Things. R. K. Narayan, one of India’s pioneering English novelists, is best remembered for his stories set in the fictional town of Malgudi.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":1730,"t":"Awards","q":"In which year did Toni Morrison become the first African-American woman to win the Nobel Prize in Literature?","o":["1991","1995","1993","1987"],"a":2,"e":"1993. Toni Morrison was honored for her powerful and poetic narratives that explored the African-American experience, particularly the lives of Black women in the United States. Her works, such as Beloved, Song of Solomon, and The Bluest Eye, are celebrated for their depth, emotional intensity, and cultural significance.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":1731,"t":"Awards","q":"Which of the following authors did NOT receive the Nobel Prize in Literature?","o":["Orhan Pamuk","Haruki Murakami","Alice Munro","Kazuo Ishiguro"],"a":1,"e":"Haruki Murakami - Famous Japanese novelist (Kafka on the Shore, 1Q84), but has not received the Nobel Prize (though frequently mentioned as a contender). Orhan Pamuk – Nobel Prize in Literature, 2006 (Turkey). Alice Munro – Nobel Prize in Literature, 2013 (Canada). Kazuo Ishiguro – Nobel Prize in Literature, 2017 (UK, Japanese-born).","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":1732,"t":"Awards","q":"Identify the correct statement with reference to the Padma awards.","o":["The Padma award can be used as a suffix or prefix to the awardees’ name","The total number of Padma awards to be given in a year should not more than 150.","The Padma Awards are given annually.","The names of the awardees are never published in the Gazette of India."],"a":2,"e":"Padma Awards, which were instituted in the year 1954, are announced every year on the occasion of Republic Day. The award is given in 3 categories, namely, Padma Vibhushan for exceptional and distinguished service; Padma Bhushan for distinguished service of a high order; and Padma Shri for distinguished service. The total number of awards to be given in a year (excluding posthumous awards and to NRI/foreigners/OCIs) should not be more than 120. The award does not amount to a title and cannot be used as a suffix or prefix to the awardees’ name.","s":""},{"n":1733,"t":"Awards","q":"Which television channel presents the IMMIES Awards every year with an aim to reward the best talent in the Indian music industry?","o":["B4U Music","MTV","Channel V","9XM"],"a":1,"e":"MTV. The MTV Immies are held every year with an aim to award the best talents in the Indian music industry. The Mirchi Music Awards, or IMMIES, are presented annually by Radio Mirchi to honor the best in Hindi film music. The first ceremony took place on March 28, 2009, at Taj Lands End, Mumbai, hosted by Shaan and Tulip Joshi.","s":""},{"n":1734,"t":"Awards","q":"Norman Ernest Borlaug was awarded the _____ in 1970 for his contributions to the green revolution.","o":["Nobel Prize in Physics","Nobel Peace Prize","Nobel Prize in Chemistry","Nobel Prize in Physiology"],"a":1,"e":"Nobel Peace Prize. Norman Borlaug was a renowned American agronomist and humanitarian, often referred to as the Father of the Green Revolution. Norman E Borlaug Award : recognizes exceptional scientists under 40 and someone who works in the field of food and nutrition security and hunger eradication. It is given in the honor of Norman Borlaug.","s":""},{"n":1735,"t":"Awards","q":"In which year was the first Arjuna Award given to a woman hockey player?","o":["1963","1964","1962","1961"],"a":3,"e":"1961 . Arjuna Award: Awarded for consistent good performance in sports over 4 years. The winners of the Arjuna Award receive a statuette of Arjuna, a certificate and a cash prize 15 lakhs. First woman hockey player awarded - Anne Lumsden. Football Olympian PK Banerjee was the first footballer to win the prestigious accolade.","s":""},{"n":1736,"t":"Awards","q":"In which year was MS Dhoni awarded Padma Shri Award?","o":["2009","2010","2007","2012"],"a":0,"e":"2009. The Padma Shri, is the fourth-highest civilian award of the Republic of India, after the Bharat Ratna, the Padma Vibhushan and the Padma Bhushan. Established - 1954. Mahendra Singh Dhoni: Awards - Padma bhushan (2018), Rajiv Gandhi Khel Ratna Award (2007).","s":""},{"n":1737,"t":"Awards","q":"Which of the following awards is presented for lifetime achievement in sports and games? It was instituted to honour those sportspersons who have contributed to sports by their performance and continue to contribute to the promotion of sports even after their retirement from an active sporting career.","o":["Major Dhyan Chand Khel Ratna","Arjuna Award","Dhyanchand Award","Dronacharya Award"],"a":2,"e":"Dhyan Chand Award. It is awarded annually by the Ministry of Youth Affairs and Sports. Instituted in\n2002. The first recipients - Shahuraj Birajdar (Boxing), Ashok Diwan (Hockey), and Aparna Ghosh (Basketball). Major Dhyan Chand Khel Ratna (previous name - Rajiv Gandhi Khel Ratna Award): Instituted in 1991-1992.","s":""},{"n":1738,"t":"Awards","q":"Most major sports awards are accompanied by a cash reward. Which of the following is the only national sports award that does NOT include a cash reward?","o":["Major Dhyan Chand Khel Ratna","Rashtriya Khel Protsahan Puruskar","Maulana Abul Kalam Azad Trophy","Dronacharya Award"],"a":1,"e":"Rashtriya Khel Protsahan Puruskar. An honour given by the Ministry of Youth Affairs and Sports. The award was launched in 2009. Awards and their cash prize: Major Dhyan Chand Khel Ratna - 25 lakh; Dronacharya Award Regular -10 lakh; Dronacharya Award Lifetime - 15 lakh; Arjuna Award - 15 lakh.","s":""},{"n":1739,"t":"Awards","q":"In which year was the Rajiv Gandhi Khel Ratna award renamed as Major Dhyan Chand Khel Ratna award, which is the highest sporting honour in the nation?","o":["1991","2019","2021","2014"],"a":2,"e":"2021. Major Dhyan Chand Khel Ratna Award : It is awarded annually by the “Ministry of Youth Affairs and Sports”. The award comprises a medallion, a certificate, and a cash prize of Rs. 25 lakh. First recipient (1991-92) -Viswanathan Anand (Chess). Rani Rampal is the first woman Hockey Player to receive the Rajiv Gandhi Khel Ratna Award in 2020. Winner (2022) - Achanta Sharath Kamal (Table Tennis).","s":""},{"n":1740,"t":"Awards","q":"The government of India recently changed the name of Rajiv Gandhi Khel Ratna Award to Dhyan Chand Khel Ratna Award, Dhyan Chand served in the Indian army as a :","o":["Major General","Major","General","Field Marshal"],"a":1,"e":"Major. The Major Dhyan Chand Khel Ratna Award is India's highest sporting honor, awarded annually by the Ministry of Youth Affairs and Sports. Dhyan Chand, a legendary hockey player, received the Padma Bhushan, India's third highest civilian award, in\n1956. His birthday, August 29, is celebrated as National Sports Day. The Khel Ratna award comes with a prize of ₹25 lakh, recognizing outstanding achievements in sports.","s":""},{"n":1741,"t":"Awards","q":"Prof M Yunus won the Nobel peace prize in which year ?","o":["2002","2006","2004","2001"],"a":1,"e":"2006. Prof M Yunus won the Nobel Peace Prize for founding the Grameen Bank and pioneering the concepts of microcredit and microfinance. The Prathama Bank of Moradabad, Uttar Pradesh, was the first Regional Rural Bank established on 2 October 1975.","s":""},{"n":1742,"t":"Awards","q":"Who among the following was awarded the Bharat Ratna for his contribution to the Green Revolution in India?","o":["Govind Ballabh Pant","PV Kane","C Subramaniam","APJ Abdul Kalam"],"a":2,"e":"C Subramaniam. He received Bharat Ratna award in 1998. The first Bharat Ratna was given to the three members in 1954: Shri Chakravarti Rajagopalachari, Dr. Sarvapalli Radhakrishnan, Dr. Chandrasekhara Venkata Raman. Other awardee: GovindBallabh Pant (1957), Pandurang Vaman Kane (1963), Dr. A.P.J. Abdul Kalam (1997).","s":""},{"n":1743,"t":"Awards","q":"The _________ is/are given for outstanding performance in sports and games over a period of the previous four years and for showing qualities of leadership, sportsmanship and a sense of discipline.","o":["Maulana Abul Kalam Azad (MAKA) Trophy","Rashtriya Khel Protsahan Puraskar","Arjuna Awards","Dronacharya Awards"],"a":2,"e":"Arjuna Awards : Instituted in 1961; Cash prize - ₹15 lakh; First awarded to football Olympian PK Banerjee; First woman awardee - Anna Lumsden (Hockey). Arjuna Awards 2023 : Aditi Gopichand Swami (archery), Mohammed Shami (cricket), Aishwary Pratap Singh Tomar (shooting), among others. MAKA (The Maulana Abul Kalam Azad) Trophy : Given to an institution or university for top performance in inter-university tournaments. Dronacharya Award : India's highest sports honor for coaches. Rashtriya Khel Protsahan Puraskar : Awarded to organizations and individuals for sports promotion and development.","s":""},{"n":1744,"t":"Awards","q":"Which Indian award was established in the year 1982, to promote and encourage scientific efforts in the field of environment and ecology ?","o":["Pitambar Pant National Environment Fellowship Award","Sanjay Gandhi Award for Environment and Ecology","B P Pal National Environment Fellowship Award for Biodiversity","Indira Gandhi Paryavaran Puraskar"],"a":1,"e":"The Sanjay Gandhi Award for Environment and Ecology is awarded annually to an individual citizen of India engaged in scientific work in the field. It includes a cash prize of ₹100,000, with the announcement made in May or June of the following year. Eligibility is open to all Indian citizens.","s":""},{"n":1745,"t":"Awards","q":"Who among the following wrote the novel ‘Kitne Pakistan’, which won the Sahitya Akademi Award ?","o":["Rajeshwar Singh","Kamleshwar","Shrilal Shukla","Amrita Pritam"],"a":1,"e":"Kamleshwar. He was awarded the 2003 Sahitya Akademi Award. Other novels: “Pati Patni Aur Woh”,, “Samagra Upanyas”.","s":""},{"n":1746,"t":"Awards","q":"Dronacharya Award was started in _______.","o":["1990","1985","1961","1980"],"a":1,"e":"1985. Dronacharya Award: The award comprises a bronze statuette of Dronacharya, a certificate, ceremonial dress, and a money prize of Rs 15 lakh (lifetime) and 10 Lakh (regular). The first recipients of the award were Bhalchandra Bhaskar Bhagwat (Wrestling), Om Prakash Bhardwaj (Boxing), and O. M. Nambiar (Athletics), who were honored in 1985.","s":""},{"n":1747,"t":"Awards","q":"When was Kapil Dev awarded with Padma Shri Award?","o":["1981","1980","1982","1983"],"a":2,"e":"1982. Kapil Dev (The Haryana Hurricane) : He was the captain of the Indian cricket team when India lifted a World Cup trophy (1983). Awards - Padma Bhushan (1991), Arjuna Award for Cricket (1979), C. K. Nayudu Lifetime Achievement Award (2013).","s":""},{"n":1748,"t":"Awards","q":"Who received the Nobel Prize in 1901 for 'recognition of the extraordinary services rendered by the discovery of the laws of chemical dynamics and osmotic pressure in solutions'?","o":["Hermann Emil Fischer","Jacobus Henricus van 't Hoff","Svante August Arrhenius","Henri Moissan"],"a":1,"e":"Jacobus Henricus van't Hoff. Nobel Prize - 1902 - Hermann Emil Fischer “in recognition of the extraordinary services he has rendered by his work on sugar and purine synthesis’”. 1903 - Svante August Arrhenius “in recognition of the extraordinary services he has rendered to the advancement of chemistry by his electrolytic theory of dissociation”. 1906 - Henri Moissan “in recognition of the great services rendered by him in his investigation and isolation of the element fluorine, and for the adoption in the service of science of the electric furnace called after him”.","s":""},{"n":1749,"t":"Awards","q":"When did Linus Carl Pauling receive the Nobel Prize in Chemistry for 'his research into the nature of the chemical bond and its applications to the elucidation of the structure of complex substances'?","o":["1954","1950","1956","1958"],"a":0,"e":"1954. Linus Carl Pauling was also awarded with the Nobel Peace Prize (1962). Some Scientists who won Nobel Prize in Chemistry :- Otto Paul Hermann Diels and Kurt Alder (1950) -“for their discovery and development of the diene synthesis”. Sir Cyril Norman Hinshelwood and Nikolay Semenov (1956) - “for their research into the mechanism of chemical reactions”. Frederick Sanger (1958)- “for his work on the structure of proteins, especially that of insulin”.","s":""},{"n":1750,"t":"Awards","q":"Who among the following is a Nobel Laureate who is also known as the father of micro finance systems?","o":["Raghuram Rajan","Sandra Rotman","Amartya Sen","Muhammad Yunus"],"a":3,"e":"Muhammad Yunus. He is a Bangladeshi social entrepreneur, banker, economist and civil society leader who was awarded the Nobel Peace Prize 2006 for founding the Grameen Bank and work to “create economic and social development from below”.","s":""},{"n":1751,"t":"Awards","q":"Who along with Arthur Compton received the Nobel Prize in 1927 for the development of the cloud chamber for the detection of charged particles?","o":["Charles Wilson","Frederick Soddy","Ernest Lawrence","Harold Urey"],"a":0,"e":"Charles Wilson. Frederick Soddy - A British chemist, won the 1921 Nobel Prize in chemistry for his research on radioactive decay and his formulation of the concept of isotopes. Ernest Lawrence - Nobel Prize in Physics in 1939 for his invention of the cyclotron. Harold Urey - Nobel Prize in Chemistry in 1934 \"for his discovery of deuterium, a heavy isotope of hydrogen\".","s":""},{"n":1752,"t":"Awards","q":"Who received a Nobel Peace Prize for dismantling apartheid in South Africa?","o":["Nelson Mandela","Rabindranath Tagore","Mahatma Gandhi","Albert John Lutuli"],"a":0,"e":"Nelson Mandela and Frederik Willem de Klerk received the Nobel Peace Prize in 1993. Mahatma Gandhi (Symbol of non violence): Nominated for Nobel Peace Prize in 1937, 1938, 1939, 1947 and 1948 but never awarded the prize. Albert John Lutuli: Awarded the 1960 Nobel Peace Prize for his role in leading the non-violent anti -apartheid movement.","s":""},{"n":1753,"t":"Awards","q":"Which citizen of the Republic of India was awarded the Nobel Peace Prize in the year 2014 ?","o":["Amartya Sen","C. V. Raman","Kailash Satyarthi","Rabindranath Tagore"],"a":2,"e":"Kailash Satyarthi. The Nobel Peace Prize 2014 was awarded jointly to Kailash Satyarthi and Malala Yousafzai \"for their struggle against the suppression of children and young people and for the right of all children to education\".","s":""},{"n":1754,"t":"Awards","q":"The first woman to win the Dronacharya Award was weightlifting coach _______ in 2000.","o":["Sunita Sharma","Renu Kohli","Purnima Mahato","Hansa Sharma"],"a":3,"e":"Hansa Sharma. The Dronacharya award contains a medallion, a certificate, and a money prize of Rs 15 lakh (lifetime) and 10 Lakh (regular). First awarded (1985) - Bhalachandra Bhaskar Bhagwat (Wrestling), Om Prakash Bhardwaj (Boxing), O. M. Nambiar (Athletics).","s":""},{"n":1755,"t":"Awards","q":"Who was conferred with the Ashok Chakra for his gallantry in 26/11 Mumbai terrorist attacks ?","o":["Mohan Chand Sharma","Hemant Karkare","R P Diengdoh","Mohit Sharma"],"a":1,"e":"Hemant Karkare was the chief of the Mumbai Anti-Terrorist Squad (ATS). He was killed in action during the 2008 Mumbai attacks. In 2009, he was posthumously given the Ashoka Chakra, India's highest peacetime gallantry decoration.","s":""},{"n":1756,"t":"Awards","q":"Which Indian music director was awarded Japan's Fukuoka prize - 2016 for his outstanding contribution in creating, preserving and showcasing. South Asian traditional fusion music?","o":["Vishal Bharadwaj","Pritam Chakraborty","AR Rahman","MM Keeravani"],"a":2,"e":"A.R. Rahman. Padma Shri (2000), Padma Bhushan (2010), two Grammy Awards (both in 2010).","s":""},{"n":1757,"t":"Awards","q":"Bessie Award is a dance award given in which country?","o":["Germany","Norway","Australia","USA"],"a":3,"e":"U.S.A. Bessie Awards (The New York Dance and Performance Awards; Established in 1983) are awarded annually to dance artists presenting their work in New York City.","s":""},{"n":1758,"t":"Awards","q":"Which Indian actress was also one of the dancers to be honoured with the 'Padma Shri' award in 1968?","o":["Hema Malini","Sridevi","Vyjayanthimala","Madhubala"],"a":2,"e":"Vyjayanthimala. Award: Padma Vibhushan (2024).","s":""},{"n":1759,"t":"Awards","q":"The South Indian film dance choreographer, K Shivashankar, won which of the following prestigious awards in 2010 for the best choreography in the Telugu film Magadheera?","o":["National Film Award","Filmfare Award","International Film Academy Award","Guild Award"],"a":0,"e":"National Film Award . The most prominent film award ceremony in India. Established in 1954. It has been administered by the Indian government's Directorate of Film Festivals since 1973.","s":""},{"n":1760,"t":"Awards","q":"Who was awarded the Nobel Prize in Physics in 1926, ‘for his work on the discontinuous structure of matter’?","o":["Charles Wilson","Murray Gell-Mann","Jean Baptiste Perrin","Owen Willans Richardson"],"a":2,"e":"Jean Baptiste Perrin. Charles Thomson Rees Wilson (1927; for his invention of the cloud chamber). Murray Gell- Mann (1969; for the classification of elementary particles and their interactions). Owen Willans Richardson (1928; for his work on the thermionic phenomenon and especially for the discovery of the law named after him).","s":""},{"n":1761,"t":"Awards","q":"In which year was the International Booker Prize established?","o":["2005","1969","1981","1918"],"a":0,"e":"2005. 2022- Geetanjali Shree (Tomb of Sand), 2021 - David Diop (At Night All Blood Is Black).","s":""},{"n":1762,"t":"Awards","q":"Who among the following was the first Dr Shanti Swarup Bhatnagar awardee?","o":["MN Saha","KS Krishnan","CV Raman","S Chandrasekhar"],"a":1,"e":"KS Krishnan . Dr Shanti Swarup Bhatnagar award: The purpose of the award is to recognise outstanding Indian work in science and technology.","s":""},{"n":1763,"t":"Awards","q":"In which discipline is the Bidhan Chandra Roy Award given","o":["Law","Architecture","sports","medicine"],"a":3,"e":"Medicine. The Bidhan Chandra Roy Award was instituted in 1962. Legal Era Awards given in the field of law. The Pritzker Prize award is given in the Architecture field.","s":""},{"n":1764,"t":"Awards","q":"The Gitanjali Literary Prize is awarded in association with which country?","o":["Germany","England","France","The US"],"a":2,"e":"France. The Gitanjali Literary prize has two aims: to contribute to the promotion of the French language in India and also to the promotion of Indian works in France.","s":""},{"n":1765,"t":"Awards","q":"The 'Amrita Devi Bishnoi National Award' is given for :","o":["environment protection","energy protection","wildlife protection","biodiversity protection"],"a":2,"e":"wildlife protection . The 'Amrita Devi Bishnoi National Award ' is in remembrance of Amrita Devi Bishnoi, who died in the 1730 Khejarli massacre while trying to protect a grove of Khejri trees in Khejarli, Rajasthan.","s":""},{"n":1766,"t":"Awards","q":"Who among the following was the first recipient of Padma Vibhushan?","o":["JRD Tata","Satyendra Nath Bose","Hargobind Khorana","John Matthai"],"a":1,"e":"Satyendra Nath Bose along with Nandalal Bose, Zakir Husain, Balasaheb Gangadhar Kher, V. K. Krishna Menon, and Jigme Dorji Wangchuck (Bhutan), who were honoured with Padma Vibhushan in 1954.","s":""},{"n":1767,"t":"Awards","q":"The Ramon Magsaysay Award was established in the year ______.","o":["1957","1982","1962","1965"],"a":0,"e":"1957 . Ramon Magsaysay Award is an annual award established to perpetuate former Philippine President Ramon Magsaysay's example of integrity in governance, courageous service to the people, and pragmatic idealism within a democratic society.","s":""},{"n":1768,"t":"Awards","q":"The ICTP Ramanujan Prize is awarded annually for excellence in _____.","o":["Chemistry","Physics","Mathematics","Biology"],"a":2,"e":"Mathematics. The prize is named after the Indian mathematician Srinivasa Ramanujan. It was founded in 2004 and was first awarded in 2005. Another Award, SASTRA Ramanujan Prize was established in 2005.","s":""},{"n":1769,"t":"Awards","q":"Which of the following organizations awards the Nobel Memorial Prize in Economic Sciences?","o":["Norwegian Nobel Committee","Karolinska Institute","The Royal Swedish Academy Sciences","Swedish Academy"],"a":2,"e":"The Royal Swedish Academy Sciences. It was first awarded in 1969 to Dutch economist Jan Tinbergen and Norwegian economist Ragnar Frisch \"for having developed and applied dynamic models for the analysis of economic processes.","s":""},{"n":1770,"t":"Awards","q":"Who is the first Indian to have won the Pulitzer Prize?","o":["Gobind Behari Lal","Sanghamitra Kalita","Jhumpa Lahiri","Geeta Anand"],"a":0,"e":"Gobind Behari Lal . He was an Indian-American journalist and independence activist. He won the Pulitzer in 1937 in the journalism category. Pulitzer Prize - First awarded -1917. Presented by - Columbia University. Awarded for - Excellence in newspaper journalism, literary achievements, musical composition.","s":""},{"n":1771,"t":"Awards","q":"The Indira Gandhi Award for National Integration is accorded by the:","o":["Indian National Congress","Ministry of Human Resource Development, Government of India","Ministry of Home Affairs, Government of India","Indira Gandhi National Open University"],"a":0,"e":"Indian National Congress. This award was given for the first time in\n1985. It is given on Indira Gandhi’s martyrdom day (31st October) and it carries an amount of 10 lakh in cash and a citation.","s":""},{"n":1772,"t":"Awards","q":"Which American President won the Nobel Peace Prize?","o":["Bill Clinton","George Washington","Barack Obama","Abraham Lincoln"],"a":2,"e":"Barack Obama. He was awarded in 2009 for his “extraordinary efforts to strengthen international diplomacy and cooperation between people.”","s":""},{"n":1773,"t":"Awards","q":"Who among the following was the first recipient of the Rajiv Gandhi Khel Ratna Award?","o":["Vijay Amritraj","PT Usha","Sachin Tendulkar","Viswanathan Anand"],"a":3,"e":"Viswanathan Anand. He is an Indian chess grandmaster and also the former world champion. Rajiv Gandhi Khel Ratna Award (Dhyanchand Khel Ratna) is given for the spectacular and most outstanding performance in the field of sports by a sportsperson over a period of four years. The award was started in the year 1991-92.","s":""},{"n":1774,"t":"Awards","q":"Name the first actor to win the Oscar Awards?","o":["Warner Baxter","Emil Jannings","Lionel Barrymore","Charlie Chaplin"],"a":1,"e":"Emil Jannings. The first Academy Awards ceremony was held in Hollywood on May 16, 1929.","s":""},{"n":1775,"t":"Important Events","q":"What is the name of India's first reusable hybrid rocket launched by a Tamil Nadu-based startup?","o":["AGNI-V","RAKSHA-1","VAYU-1","RHUMI-1"],"a":3,"e":"RHUMI-1 is the name of India's first reusable hybrid rocket, successfully launched in July 2024. The rocket was developed and launched by \"The Propellars,\" an aerospace startup based in Chennai, Tamil Nadu. The launch took place from a private launchpad near Thiruporur. The rocket is designed to test advanced technologies, including a reusable system and a hybrid propulsion engine, which uses both solid fuel and a liquid oxidizer.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1776,"t":"Important Events","q":"Where was the first meeting of the Employment Working Group of G20 conducted ?","o":["Jaipur","Jodhpur","Lucknow","Kolkata"],"a":1,"e":"Jodhpur. The first G20 Employment Working Group (EWG)This meeting was part of India's presidency of the G20, which focused on addressing employment challenges and promoting inclusive labor markets among member countries. The G20, an intergovernmental forum of 19 countries and the EU, was founded in 1999 in response to global economic crises.","s":""},{"n":1777,"t":"Important Events","q":"In which year was the first underground section (Vishwavidyalaya -Kashmere Gate) of the Golden Route opened in New Delhi?","o":["2004","2000","1998","1997"],"a":0,"e":"2004. The Red Line, the inaugural line of the Delhi Metro, was officially opened in December 2002, by the then Prime Minister of India, Atal Bihari Vajpayee.","s":""},{"n":1778,"t":"Important Events","q":"In which year did the Bhopal gas tragedy occur?","o":["1984","1982","1988","1985"],"a":0,"e":"1984. The Bhopal disaster or Bhopal gas tragedy was a chemical accident in December 1984. Over 40 tons of methyl isocyanate gas leaked from the Union Carbide India Limited (UCIL) pesticide plant in Bhopal (Madhya Pradesh). Other Major Industrial disasters in India: Chasnala Mining Disaster - In 1975, a coal mine in Jharkhand experienced the Chasnala mining accident. Jaipur Oil Depot Fire -The oil store owned by the Indian Oil Company in Rajasthan had this industrial accident in 2009.","s":""},{"n":1779,"t":"Important Events","q":"In which year did Swami Vivekananda give his speech at the Chicago Parliament of Religions?","o":["1893","1892","1891","1890"],"a":0,"e":"1893. Swami Vivekananda was born Narendra Nath Datta, on 12th January 1863 in Calcutta. He was the foremost disciple of Ramakrishna Paramahamsa and a world spokesperson for Vedanta. He founded the Ramakrishna Mission in May 1897, after his guru Ramakrishna Paramahamsa. His books are 'Jnanayoga’, ‘Bhaktiyoga’, ‘Rajayoga’, ‘To the youth of India’ etc. He established the Belur Math in Belur, Howrah district. He died in 1902 in Belur Math in West Bengal.","s":""},{"n":1780,"t":"Important Events","q":"The Beating Retreat Ceremony during Republic Day is held every year at which of the following places?","o":["Hyderabad","Jaipur","New Delhi","Bengaluru"],"a":2,"e":"New Delhi. The Beating Retreat Ceremony is held every year at the Vijay Chowk on January 29, marking the conclusion of the Republic Day celebrations. The first Beating Retreat ceremony in India was held in 1955, during the state visit of Queen Elizabeth II and Prince Philip. It was conceived by Major GA Roberts and commissioned by then-Prime Minister Jawaharlal Nehru.","s":""},{"n":1781,"t":"Important Events","q":"Who takes the salute during the Republic Day parade at New Delhi?","o":["Chief Justice","Governor","President","Prime Minister"],"a":2,"e":"President. Republic Day parade takes place every year on 26 January at Kartavya Path (Former Raj Path), New Delhi. The parade marches from the Rashtrapati Bhavan on the Kartavya Path to India Gate and from there to Red Fort. It opens with the unfurling of the national flag by the President of India. This is followed by marching from several regiments of the Army, Navy, and Air Force, along with their bands. tableaux from various states signifying their cultures are displayed. A beating retreat ceremony signifies the end of the parade.","s":""},{"n":1782,"t":"Important Events","q":"The Rajpath was decided to be a permanent venue for the Republic Day parade from which of the following year onwards?","o":["1955","1959","1958","1951"],"a":0,"e":"1955. The initial four Republic day parades were held at different places that were Irwin Amphitheatre, Kingsway, Red Fort and Ramlila Maidan respectively between 1950 to 1954. The French army was the first foreign army to participate in India’s Republic Day Parade in 2016 (67th Republic day). The chief guest of the first Republic Day Parade was the President of Indonesia Sukarno was the chief guest.","s":""},{"n":1783,"t":"Important Events","q":"Who among the following singers became the first Indian folk artist to attend the Cannes Film Festival 2022 ?","o":["Gurudas Man","Daler Mehndi","Teejan Bai","Mame Khan"],"a":3,"e":"Mame Khan - An Indian Rajasthani folk singer who is known for his Sufi and folk music performances. Cannes Film Festival (Festival de Cannes) - A film festival held annually in Cannes (France). First held - 1946. The festival came to provide a rendezvous for those interested in the art and influence of the movies.","s":""},{"n":1784,"t":"Important Events","q":"Reni Village in Garhwal was known for what environmental movement in 1970?","o":["Save Silent Valley Movement","Chipko Movement","Jungle Bachao Andolan","Appiko Movement"],"a":1,"e":"Chipko movement. Sunderlal Bahuguna gave the movement the proper direction. Save Silent Valley was a social movement (in 1973) aimed at the protection of Silent Valley, Palakkad district of Kerala, India. In the early 1980s, the Jungle Bachao Andolan (Singhbhum District, Jharkhand) and the Appiko Movement forest-based environmental movements (Uttara Kannada district of Karnataka in the Western Ghats).","s":""},{"n":1785,"t":"Important Events","q":"Which Indian finance minister was India’s delegate to the World Monetary Conference at Bretton Woods in 1944?","o":["KC Neogy","CD Deshmukh","John Mathai","RK Shanmukham Chetty"],"a":3,"e":"RK Shanmukham Chetty. He was an Indian lawyer, economist, and politician who served as independent India's first finance minister from 1947 to 1948.","s":""},{"n":1786,"t":"Important Events","q":"In which year the post of National Security Advisor created in India?","o":["2000","1998","2003","1999"],"a":1,"e":"1998. Brajesh Mishra was appointed as the first National Security Advisor of India. Ajit Kumar Doval is the current National Security Advisor of India.","s":""},{"n":1787,"t":"Important Events","q":"In which year was the first meeting of the National Integration Council held?","o":["1955","1962","1951","1965"],"a":1,"e":"1962. The National Integration Council (NIC) is a group of senior politicians and public figures in India that looks for ways to address the problems of communalism, casteism, and regionalism.","s":""},{"n":1788,"t":"Important Events","q":"In which of the following years was the National Food Security Act enacted in India?","o":["2013","2009","2012","2011"],"a":0,"e":"2013. National Food Security Act - The Act legally entitled 75% of the rural population and 50% of the urban population to receive subsidized food grains under Targeted Public Distribution System.","s":""},{"n":1789,"t":"Important Events","q":"In which year was ‘Ramlila’ inscribed on the UNESCO Representative\nList of the Intangible Cultural Heritage of Humanity ?","o":["2010","2008","2006","2012"],"a":1,"e":"2008. UNESCO Intangible Cultural Heritage India - Ramman (2009), Chhau dance, Kalbelia, Mudiyettu (2010), Buddhist chanting of Ladakh (2012), Sankirtana (2013), Traditional brass and copper craft of utensil making among the Thatheras of Jandiala Guru, Punjab (2014), Nouroz, yoga - (2016), Kumbh Mela (2017), Durga puja (2021).","s":""},{"n":1790,"t":"Important Events","q":"When was the Indian Reform Association formed?","o":["1885","1870","1860","1865"],"a":1,"e":"1870 . Kesava Chandra Sen was the founder of the Indian Reform Association. He joined the Brahmo Samaj in 1857.","s":""},{"n":1791,"t":"Important Events","q":"When was the construction of the Rashtrapati Bhavan completed?","o":["1929","1953","1949","1959"],"a":0,"e":"1929. Rashtrapati Bhavan: The official residence of the President of India. Designed by Edwin Landseer Lutyens. It took 17 years to complete it.","s":""},{"n":1792,"t":"Important Events","q":"When was the Rovers Cup started?","o":["1891","1952","1981","1931"],"a":0,"e":"1891. The Rovers Cup was a football tournament held in India. It was started by British football enthusiasts in Bombay.","s":""},{"n":1793,"t":"Important Events","q":"When was WhatsApp incorporated?","o":["2008","2007","2009","2010"],"a":2,"e":"2009. WhatsApp was founded by Brian Acton and Jan Koum .","s":""},{"n":1794,"t":"Important Events","q":"When was the Secretariat of the SAARC set up?","o":["1987","1984","1986","1985"],"a":0,"e":"1987. The SAARC Secretariat was established in Kathmandu. Its role is to coordinate and monitor the implementation of SAARC activities, service the meetings of the association and serve as the channel of communication between SAARC and other international organizations.","s":""},{"n":1795,"t":"Important Events","q":"When was the Eden Gardens Stadium, Kolkata established?","o":["1875","1854","1885","1864"],"a":3,"e":"1864. Eden Gardens Stadium is the oldest cricket stadium in India.","s":""},{"n":1796,"t":"Important Events","q":"When was Safari first released by Apple?","o":["1998","2003","2001","2002"],"a":1,"e":"2003 . A mobile version has been bundled with iOS devices since the iPhone’s introduction in 2007.","s":""},{"n":1797,"t":"Important Events","q":"In which year did UNESCO include Yoga in its Intangible Cultural Heritage list?","o":["2014","2016","2018","2015"],"a":1,"e":"2016 . UNESCO List of Intangible Cultural Heritage includes those intangible elements that help demonstrate diversity of cultural heritage and raise awareness about its importance.","s":""},{"n":1798,"t":"Important Events","q":"In which year did the Dalai Lama cross over into India and take asylum?","o":["1957","1959","1962","1952"],"a":1,"e":"1959 . Dalai Lama fought his way through the snow to reach Chutangmu, a tiny Assam Rifles outpost near Tawang, to request asylum in India.","s":""},{"n":1799,"t":"Important Events","q":"In which year was a separate Andhra state formed after the linguistic reorganization of the then Madras province?","o":["1950","1952","1956","1947"],"a":1,"e":"1952. Freedom fighter Potti Sriramulu wanted the capital of Andhra Pradesh to be built in Rayalaseema. It was due to his 58 day fast, a separate Andhra state was carved out of the erstwhile Madras Presidency with Kurnool as its capital.","s":""},{"n":1800,"t":"Important Events","q":"When was the PIN Code (Postal Index Code) introduced in India?","o":["1949","1969","1972","1963"],"a":2,"e":"1972. Postal Index Number code - Also known as Zip code or area postal code, Pin code is the post office numbering code system used by the postal service of India, India Post.","s":""},{"n":1801,"t":"Important Events","q":"When was the Human Development Report first published?","o":["1980","2000","1990","1981"],"a":2,"e":"1990. Human Development Report is an annual report published by the Human Development Report Office of the United Nations Development Programme.","s":""},{"n":1802,"t":"Important Events","q":"Telangana became the 29th state of India in which year?","o":["2015","2014","2016","2017"],"a":1,"e":"2014 . In February 2014, Andhra Pradesh Reorganisation Act, 2014 bill was passed by the Parliament of India for the formation of Telangana state comprising ten districts from north-western Andhra Pradesh.","s":""},{"n":1803,"t":"Important Events","q":"In which year was the ‘Ramnath Goenka Excellence in Journalism’ award instituted in India?","o":["2010","2006","2008","2007"],"a":1,"e":"2006 . Ramnath Goenka Excellence in Journalism’ awards are given for both print journalism as well as broadcast journalism.","s":""},{"n":1804,"t":"Important Events","q":"In which year was the Rigveda manuscript included in the UNESCO's Memory of the World Register?","o":["2005","2006","2004","2007"],"a":3,"e":"2007. The Rigveda, the oldest among the four Vedas (Rigveda, Yajurveda, Samaveda and Atharvaveda).","s":""},{"n":1805,"t":"Important Events","q":"When was the National Stock Exchange of India established?","o":["1991","1994","1993","1992"],"a":3,"e":"1992. National Stock Exchange of India Limited is the leading stock exchange of India, located in Mumbai. It was the first dematerialized electronic exchange in the country.","s":""},{"n":1806,"t":"Important Events","q":"In which year was the foundation stone for the Gateway of India laid in Bombay (now Mumbai)?","o":["1913","1915","1905","1920"],"a":0,"e":"1913 (by then governor of Bombay, Sir George Sydenham Clarke). It was built in greeting the arrival of King-Emperor George V and Queen Mary, the first British monarch to visit India.","s":""},{"n":1807,"t":"Important Events","q":"In which period was the legendary Victoria Terminus Station (currently Chhtarpati Shivaji Maharaj Terminus), Mumbai built?","o":["1878 to 1883","1843 to 1853","1933 to 1943","1911 to 1921"],"a":0,"e":"1878 to 1883. The Chhatrapati Shivaji station, formerly known as Victoria Terminus, was designed by the British architect F.W. Stevens.","s":""},{"n":1808,"t":"Important Events","q":"In which year was the Currency Building in the BBD Bagh or Dalhousie area of Kolkata constructed?","o":["1900","1833","1850","1910"],"a":1,"e":"1833. The beautiful colonial building was designed in Italian style with Venetian windows. This building was the office of the Reserve Bank of India till the year 1937.","s":""},{"n":1809,"t":"Important Events","q":"In which of the following years were two additional Commissioners appointed to the Election commission of India for the first time?","o":["1989","1991","1990","1998"],"a":0,"e":"1989. Originally the commission had only a Chief Election Commissioner. It currently consists of the Chief Election Commissioner and two Election Commissioners.","s":""},{"n":1810,"t":"Important Events","q":"Which of the following years is called the Year of the Great Divide in the demographic history of India?","o":["1951","1921","1931","1911"],"a":1,"e":"1921 is a “ year of the great divide ” in the demographic history of India when mortality started to decline leading to acceleration in the rate of population growth (the second stage).","s":""},{"n":1811,"t":"Founder","q":"In 1990, who established Nrityagram, a dance school in Bengaluru?","o":["Madhavi Mudgal","Protima Gauri Bedi","Mukti Mohan","Rekha Raju"],"a":1,"e":"Protima Gauri Bedi. She was an Indian model turned Odissi exponent. Other Odishi Exponents: Kelucharan Mohapatra, Guru Pankaj Charan Das, Sujata Mohapatra, Ratikant Mohapatra, Gangadhar Pradhan, Nandita Behera, Sanchita Bhattacharyaa, Sharmila Biswas.","s":""},{"n":1812,"t":"Founder","q":"The Lucknow Gharana of Kathak was founded by _______ , a devotee of the Bhakti movement who lived in southeast Uttar Pradesh.","o":["Ram Kumar","Bhagwan Ram","Ishwari Prasad","Shyam Kumar"],"a":2,"e":"Ishwari Prasad. Some Important gharanas and their founders: Kirana gharana - Ustad Abdul Karim Khan. Mewati gharana - Ustad Ghagge Nazir Khan and Ustad Wahid Khan. Indore gharana - Amir Khan. Jaipur-Atrauli gharana - Alladiya Khan.","s":""},{"n":1813,"t":"Founder","q":"Who among the following was the founding member of Sri Sai Nataraja Academy of Kuchipudi that offers training and higher studies in Kuchipudi?","o":["P Ramadevi","Kaushalya Reddy","Yamini Krishnamurthy","Aparna Satheesan"],"a":0,"e":"P Ramadevi. Natya Tarangini Institute of Kuchipudi Dance : Founded by Raja and Radha Reddy in New Delhi (1976).","s":""},{"n":1815,"t":"Founder","q":"Who among the following made the first compound microscope?","o":["William Gilbert","Zacharias Jansen","John Harrington","Galileo Galilei"],"a":1,"e":"Zacharias Jansen. A compound microscope has multiple lenses: The objective lens is compounded (multiplied) by the eyepiece lens to obtain a high magnification.","s":""},{"n":1816,"t":"Founder","q":"Who among the following Sikh Gurus founded the Tarn Taran Sahib ?","o":["Guru Ram Das","Guru Arjan Dev","Guru Nanak Dev","Guru Gobind Singh"],"a":1,"e":"Guru Arjan Dev. He was the fifth Sikh Guru and laid the foundation of Tarn Taran Sahib in 1596.","s":""},{"n":1817,"t":"Founder","q":"Who among the following invented the aeroplane?","o":["Auguste and Louis Lumière","Alexander Graham Bell","Orville and Wilbur Wright","Louis Pasteur and Alexander Fleming"],"a":2,"e":"Orville and Wilbur Wright (Wright brothers). Auguste and Louis Lumiere invented cinematograph and autochrome (a photography process). The first practical telephone and Graphophone was invented by Alexander Graham Bell.","s":""},{"n":1818,"t":"Founder","q":"Which of the following was invented by Walter Hunt?","o":["Ship","Safety pin","Scooter","Safety lamp"],"a":1,"e":"Safety pin. Walter Hunt also invented a sewing machine in 1833. Safety Lamp invented in 1815 by Sir Humphry Davy.","s":""},{"n":1819,"t":"Founder","q":"Who among the following founded the Bombay Stock Exchange?","o":["Ashishkumar Chauhan","Premchand Roychand","Vikramjit Sen","Roychand Deepchand"],"a":1,"e":"Premchand Roychand.","s":""},{"n":1820,"t":"Schemes","q":"Which platform is used for submitting ideas under the INSPIRE MANAK Scheme ?","o":["Science and Technology Portal","INSPIRE Portal","National Innovation Portal","Digital India Portal"],"a":1,"e":"INSPIRE Portal. The INSPIRE MANAK Scheme (Million Minds Augmenting National Aspiration and Knowledge) is implemented by the Department of Science & Technology (DST) under its flagship programme Innovation in Science Pursuit for Inspired Research (INSPIRE). It is a unique initiative to attract talented school students (Class 6–10, aged 10–15 years) towards science, research, and innovation. The scheme fosters a culture of innovation at an early age and encourages students to submit original ideas/innovations. It targets 10 lakh ideas annually from over 5 lakh middle and high schools across India. Out of these, 1 lakh best ideas are selected for the INSPIRE Award of ₹10,000 each. For submitting ideas, students must use the INSPIRE online portal, managed by DST/NIF-India.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1821,"t":"Schemes","q":"Which of the following statements are correct regarding the Unique Land Parcel Identification Number (ULPIN) system ?\n1. ULPIN assigns a unique ID to every land parcel in India.\n2. ULPIN is a 14-digit identification number.\n3. ULPIN helps track land ownership and resolve disputes.\n4. ULPIN is only for urban areas and not rural land.","o":["1, 2, and 3 only","1, 2, and 4 only","2 and 3 only","1, 3, and 4 only"],"a":0,"e":"1, 2, and 3 only. The Unique Land Parcel Identification Number (ULPIN) assigns a unique ID to every land parcel in India, just like an “Aadhaar for land.” This ensures uniformity in land records nationwide. Each land parcel is given a 14-digit alphanumeric number derived from the precise geo-coordinates (latitude & longitude) of the plot. ULPIN helps in tracking ownership history, resolving disputes, preventing duplication/fraud, and improving transparency in transactions. ULPIN is applicable to both rural and urban areas, not just urban land.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1822,"t":"Schemes","q":"Which scheme was launched to promote entrepreneurship among SC and ST communities ?","o":["Start-Up India","Atmanirbhar Bharat Abhiyan","Stand-Up India","MUDRA Yojana"],"a":2,"e":"Stand-Up India Scheme was launched in 2016 to promote entrepreneurship among Scheduled Castes (SCs), Scheduled Tribes (STs), and women entrepreneurs. Key Features: Provides bank loans between ₹10 lakh to ₹1 crore for setting up greenfield enterprises. At least one SC/ST borrower and one woman borrower per bank branch should be supported. Covers manufacturing, services, or trading sectors. Aims to encourage job creation, economic empowerment, and financial inclusion of marginalized groups. Other schemes: Start-Up India (2016) : Encourages innovation-driven start-ups. MUDRA Yojana (2015) : Provides microfinance/loans up to ₹10 lakh to small businesses. Atmanirbhar Bharat Abhiyan (2020) : Self-reliance package focusing on multiple sectors, not specifically SC/ST entrepreneurship.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1823,"t":"Schemes","q":"Which major reform was introduced in the National Education Policy (NEP), 2020?","o":["Replacement of the 10 + 2 system with a 5 + 3 + 3 + 4 structure","Elimination of private schools","Compulsory Sanskrit education","Mandatory board exams for all grades"],"a":0,"e":"National Education Policy (NEP) 2020 restructured school education into Foundational (5 years) + Preparatory (3 years) + Middle (3 years) + Secondary (4 years). This aligns education with the age group 3–18 years, covering pre-school to secondary education. The NEP 2020 is founded on the five guiding pillars of Access, Equity, Quality, Affordability and Accountability.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1824,"t":"Schemes","q":"What was the objective of the Swachh Bharat Abhiyan?","o":["Achieving universal sanitation coverage","Promoting digital payments","Providing rural housing","Creating jobs in the rural sector"],"a":0,"e":"Achieving universal sanitation coverage. Swachh Bharat Abhiyan, launched on 2nd October 2014, aimed at eliminating open defecation, ensuring universal sanitation coverage, and promoting cleanliness. It emphasized construction of toilets, solid and liquid waste management, and changing societal attitudes toward hygiene. The mission sought to create a clean environment, thereby improving public health and quality of life across both rural and urban areas in India.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1825,"t":"Schemes","q":"What is the main focus of the Beti Bachao Beti Padhao (BBBP) scheme launched in 2015?","o":["Housing for women","Financial inclusion for widows","Girl child survival & education","Promoting rural entrepreneurship"],"a":2,"e":"Girl child survival & education. The Beti Bachao Beti Padhao (BBBP) scheme was launched by the Prime Minister on 22nd January, 2015 at Panipat, Haryana to improve the declining Child Sex Ratio and promote women’s empowerment in India. Its core objectives are to prevent gender-biased sex-selective practices, ensure survival, protection, and education of the girl child. The scheme is jointly implemented by the Ministries of Women and Child Development, Health and Family Welfare, and Education. Issues like housing for women are addressed separately under Pradhan Mantri Awas Yojana. Similarly, financial support for widows and rural entrepreneurship promotion are covered by pension schemes, NRLM, and Startup India.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":1826,"t":"Schemes","q":"Which of the following correctly describes Mission Shakti ?\n1. It is an integrated women empowerment programme launched in 2022.\n2. It is run by the Ministry of Women and Child Development.\n3. The scheme includes Samarthya and Sambal sub-schemes.","o":["All 1, 2 and 3 are correct","Only 1 and 3 are correct","Only 2 and 3 are correct","Only 1 and 2 are correct"],"a":0,"e":"All 1, 2 and 3 are correct. The Government of India launched “Mission Shakti”, an umbrella scheme for women’s safety, security, and empowerment, to be implemented from 2021-22 to 2025-26. It has two sub-schemes: ‘Sambal’, focusing on women’s safety and security, and ‘Samarthya’, focusing on their empowerment.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":1827,"t":"Schemes","q":"What is the purpose of the 'Beti Bachao Beti Padhao' scheme?","o":["Saving and educating the girl child","Women's health insurance","Employment for women","Financial support for girl's marriage"],"a":0,"e":"Saving and educating the girl child. The Beti Bachao Beti Padhao (BBBP) scheme was launched by the Government of India on 22nd January 2015 in Panipat, Haryana. Its primary objective is to address the declining Child Sex Ratio (CSR) and promote the education and empowerment of the girl child. The scheme is a joint initiative of the Ministry of Women & Child Development, Ministry of Health & Family Welfare, and Ministry of Education.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":1828,"t":"Schemes","q":"Which of the following pairs is incorrectly matched?","o":["Swadesh Darshan - Ministry of Culture","PM MITRA - Ministry of Textiles","Beti Bachao Beti Padhao - Ministry of Women & Child Dev.","PM JANMAN - Ministry of Tribal Affairs"],"a":0,"e":"Swadesh Darshan Scheme → Implemented by the Ministry of Tourism, not the Ministry of Culture. PM MITRA (Mega Integrated Textile Region and Apparel Parks) → Implemented by the Ministry of Textiles. Beti Bachao Beti Padhao (BBBP) → Implemented by the Ministry of Women & Child Development (with support from Health & Family Welfare and Education). PM JANMAN (Pradhan Mantri Janjati Adivasi Nyaya Maha Abhiyan) → Implemented by the Ministry of Tribal Affairs.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":1829,"t":"Schemes","q":"Aatmanirbhar Bharat Rojgar Yojana was implemented through which organisation?","o":["India Post Payments Bank","HDFC Bank","Employees Provident Fund Organisation","Life Insurance Corporation"],"a":2,"e":"Employees Provident Fund Organisation. Aatmanirbhar Bharat Rojgar Yojana (ABRY): Launched in 2020 under the Aatmanirbhar Bharat 3.0 package, it aims to boost the economy, generate employment during the post-COVID recovery phase, and incentivize new job creation.","s":""},{"n":1830,"t":"Schemes","q":"During the Green Revolution period in India, child nutrition-focused scheme, the Integrated Child Development Scheme (ICDS) was launched in ________.","o":["1972","1977","1975","1976"],"a":2,"e":"1975. The ICDS scheme provides services to children under 6 years of age, pregnant and lactating mothers, and women aged 16–44. The program's goals are to improve the health, nutrition, and education of the target community.","s":""},{"n":1831,"t":"Schemes","q":"In Pradhan Mantri Gramin Awaas yojana, the cost of unit assistance is shared between Central and State Governments in the ratio ___________ in plain areas.","o":["60 : 40","40 : 60","90 : 10","30 : 70"],"a":0,"e":"60 : 40 . The Pradhan Mantri Awas Yojana - Gramin (PMAY-G) : Launched on November 20, 2016. It aims to provide housing with basic amenities to houseless families and those living in dilapidated or kutcha houses. Targeting 2.95 crore houses by March 2024. In the Northeastern and Himalayan States, the cost-sharing ratio is 90 : 10. This scheme restructured the Indira Awas Yojana (IAY) from 1985.","s":""},{"n":1832,"t":"Schemes","q":"Which state initiated the implementation of the Mid-day Meal scheme in elementary schools?","o":["Tamil Nadu","Madhya Pradesh","Uttar Pradesh","Karnataka"],"a":0,"e":"Tamil Nadu. Mid-day Meal Scheme : Introduced in 1956 by Tamil Nadu's Chief Minister K. Kamaraj, the scheme aimed to reduce school dropout rates and increase enrollment by providing free meals to students.","s":""},{"n":1833,"t":"Schemes","q":"In which year was the PM Ayushman Bharat Health Infrastructure Mission launched?","o":["2020","2022","2021","2023"],"a":2,"e":"2021. Prime Minister Shri Narendra Modi inaugurated the PM Ayushman Bharat Health Infrastructure Mission, which aims to be one of the largest initiatives in India focused on improving healthcare infrastructure.","s":""},{"n":1834,"t":"Schemes","q":"Consider the following statements and choose the correct statement(s) from the following:\n1. The UDAN scheme has completed five years since its implementation in 2017.\n2. It is the flagship scheme of the Ministry of Science and Technology.\n3. The Airports Authority of India is the implementing agency of this scheme.","o":["Only statement 3","Only statement 2","Only statements 2 and 3","Only statements 1 and 3"],"a":3,"e":"Only statements 1 and 3. The UDAN (Ude Desh ka Aam Nagrik) scheme is an initiative by the Indian government aimed at enhancing connectivity to remote and regional areas while making air travel more affordable. The scheme was introduced in 2016 as part of the National Civil Aviation Policy.","s":""},{"n":1835,"t":"Schemes","q":"Which of the following schemes enables students mobility across Higher Education Institutions?","o":["National Educational Technology Forum","PM Umeed scheme","Structured Assessment for Analysing Learning Levels (SAFAL)","Academic Bank of Credits"],"a":3,"e":"Academic Bank of Credits (ABC) is the initiative of the Ministry of Electronics and Information Technology (MeitY) and Ministry of Education (MoE) respectively. It was launched in July 2021.","s":""},{"n":1836,"t":"Schemes","q":"Which is the National Mission for Financial Inclusion to ensure access to financial services, namely, a basic savings and deposits accounts, remittance, credit, insurance, pension in an affordable manner?","o":["Deendayal Antyodaya Yojana","Deen Dayal Upadhyaya Grameen Kaushalya Yojana","Swarnjayanti Gram Swarozgar Yojana","Pradhan Mantri Jan Dhan Yojana"],"a":3,"e":"Pradhan Mantri Jan Dhan Yojana (PMJDY) is a National Mission for Financial Inclusion launched on August 28, 2014.","s":""},{"n":1837,"t":"Schemes","q":"In which year was the Digital India mission launched?","o":["2014","2016","2015","2017"],"a":2,"e":"2015. The Digital India programme was launched by Prime Minister Shri Narendra Modi. Aim : To transform India into a knowledge-based economy and a digitally empowered digital access, digital inclusion, digital empowerment and bridging the digital divide. Coordinated by : Ministry of Electronics and Information Technology.","s":""},{"n":1838,"t":"Schemes","q":"In which year was Smart Cities Mission launched?","o":["2015","2013","2019","2018"],"a":0,"e":"2015. It is a Centrally Sponsored Scheme to enhance the quality of life in 100 selected cities by providing efficient services, robust infrastructure, and a sustainable environment. The Central Government has decided to extend the deadline for Smart Cities Mission till 31st March 2025.","s":""},{"n":1839,"t":"Schemes","q":"In Pradhan Mantri Kisan Samman Nidhi Yojana, beneficiaries are provided with how much amount every year?","o":["₹6,000","₹4,000","₹5,000","₹3,000"],"a":0,"e":"₹6,000 - per year in three equal installments, every four months is transferred into the bank accounts of farmers’ families across the country through Direct Benefit Transfer (DBT) mode. Implemented by the Ministry of Agriculture and Farmers Welfare. Pradhan Mantri Kisan Samman Nidhi Yojana launched on 24th February, 2019.","s":""},{"n":1840,"t":"Schemes","q":"In which year was the MPLADS scheme implemented?","o":["2003","1983","1993","2013"],"a":2,"e":"1993. Objective : The Member of Parliament Local Area Development Scheme (MPLADS) aims to empower MPs to recommend developmental projects that focus on creating durable community assets in areas such as drinking water, primary education, public health, sanitation, and road infrastructure, primarily within their constituencies. Each year, MPs receive ₹5 crore in two installments of ₹2.5 crore each. Notably, the funds allocated under MPLADS are non-lapsable.","s":""},{"n":1841,"t":"Schemes","q":"Under Pradhan Mantri Fasal Bima Yojana, the maximum premium payable by the farmers will be _________ for all kharif food and oilseeds crops.","o":["4%","2%","6%","8%"],"a":1,"e":"2%. The Pradhan Mantri Fasal Bima Yojana (PMFBY), launched on 18 February 2016 by Prime Minister Narendra Modi, is an insurance service for farmers' crops. It follows the \"One Nation–One Scheme\" concept, replacing the earlier National Agriculture Insurance Scheme and Modified National Agricultural Insurance Scheme.","s":""},{"n":1842,"t":"Schemes","q":"What is the primary objective of the 'Standup India' initiative?","o":["To boost the manufacturing sector","To promote digital transactions nationwide","To facilitate bank loans for SC/ST and women entrepreneurs","To support all types of startups"],"a":2,"e":"Stand-Up India, launched on April 5, 2016, promotes entrepreneurship among women and SC/ST communities. It offers bank loans from ₹10 lakh to ₹1 crore for setting up greenfield enterprises in manufacturing, trading, or services sectors. The initiative aims to foster economic growth and create jobs by supporting marginalized groups in business ventures.","s":""},{"n":1843,"t":"Schemes","q":"Which is the joint digital skills initiative for employability through digital skills by National Career Service and Microsoft India?","o":["Digisaksham","Vidyadaan","Shiksha Vani","Swayam"],"a":0,"e":"Digisaksham. The DigiSaksham program was launched in 2021. The program was a collaboration between the Ministry of Labour and Employment (MoLE) and Microsoft India. Goal : To help job seekers become more employable by teaching them digital skills. Other Initiatives for Youth Employment : Pradhan Mantri Mudra Yojana (PMMY), National Career Service, and Pradhan Mantri Kaushal Vikas Yojana 3.0.","s":""},{"n":1844,"t":"Schemes","q":"Name the pension scheme that seeks to ensure old age protection for unorganised workers.","o":["Atal Pension Yojana","Pradhan Mantri Mudra Yojna","Pradhan Mantri Suraksha Bima Yojna","Pradhan Mantri Shram Yogi Maandhan"],"a":3,"e":"Pradhan Mantri Shram Yogi Maandhan. This scheme was launched by Prime Minister Narendra Modi in 2019 to support unorganized sector workers. It offers a monthly pension of ₹3,000 after the age of 60. Workers aged 18 to 40 years, with a monthly income of ₹15,000 or less, and who are not members of EPFO, ESIC, or NPS (government-funded), can enroll in the PM-SYM scheme.","s":""},{"n":1845,"t":"Schemes","q":"Which of the following ministries launched the PM Daksh scheme?","o":["Ministry of Education","Ministry of Electronics and Information Technology","Ministry of Social Justice and Empowerment","Ministry of Food Processing Industries"],"a":2,"e":"Ministry of Social Justice and Empowerment. The \"Pradhan Mantri Dakshta Aur Kushalta Sampann Hitgrahi\" (PM-DAKSH) scheme was launched in 2020-21, and is designed to uplift the marginalized sections of society by offering skill development programs. It targets SC (Scheduled Caste), OBC (Other Backward Classes), Economically Backward Classes, Denotified tribes, and Safai Mitras, providing upskilling, reskilling, short-term training, and entrepreneurial development courses.","s":""},{"n":1846,"t":"Schemes","q":"Under which scheme are collateral free loans of up to ₹10 Lakh extended by the Member Lending Institutions (MLIs) in India?","o":["National Strategy for Financial Inclusion","Pradhan Mantri MUDRA Yojana","Stand Up India scheme","Pradhan Mantri Jan Dhan Yojana"],"a":1,"e":"Pradhan Mantri MUDRA Yojana: Launched on April 8, 2015, by Prime Minister Narendra Modi, this flagship scheme aims to provide affordable credit to micro and small enterprises, integrating small entrepreneurs into the formal financial system. The scheme offers three loan products: Shishu (Loans up to ₹50,000), Kishore (Loans ranging from ₹50,000 to ₹500,000), Tarun (Loans from ₹500,000 to ₹1,000,000).","s":""},{"n":1847,"t":"Schemes","q":"The _______ portal is a platform provided by the Govt. of India for farmers to attain any information related to agriculture.","o":["Cropland","Farmer’s","Agricultural","Cultivation"],"a":1,"e":"Farmer’s. The Farmers' Portal is a one-stop platform where farmers can access information on seeds, fertilizers, pesticides, credit, best practices, dealer networks, input availability, beneficiary lists, and weather advisories. Other government portals include the mKisan Portal, Crop Insurance Portal, and Participatory Guarantee System (PGS) Portal of India.","s":""},{"n":1848,"t":"Schemes","q":"The Atal Innovation Mission was launched in the year ________.","o":["2021","2016","2014","2004"],"a":1,"e":"2016. The Atal Innovation Mission (AIM) objective is to create and promote an ecosystem of innovation and entrepreneurship across the country at school, university, research institution, MSME, and industry levels, with NITI Aayog as the implementing agency. Atal Tinkering Labs, a component of AIM, are state-of-the-art spaces established in schools to foster curiosity and innovation among students from grades 6 to 12.","s":""},{"n":1849,"t":"Schemes","q":"In Pradhan Mantri Gramin Awaas Yojana, the cost of unit assistance is shared between Central and State Governments the ratio __________ for the North-Eastern and the Himalayan states.","o":["90 : 10","60 : 40","45 : 55","50 : 50"],"a":0,"e":"90 : 10. Pradhan Mantri Awaas Yojana : Launched - Urban (25th June 2015) and Gramin (1st April 2016). It is a social welfare programme under the Ministry of Rural Development. Aim -Provide housing for the rural poor in India. The cost of unit assistance is to be shared between Central and State Governments in the ratio 60:40 in plain area.","s":""},{"n":1850,"t":"Schemes","q":"In which year was Ujala Yojana launched?","o":["2014","2016","2015","2017"],"a":2,"e":"2015. Unnat Jyoti by Affordable LEDs for All (UJALA) : It aims to replace 77 crore incandescent lamps with LED bulbs through phase-wise distribution across India.","s":""},{"n":1851,"t":"Schemes","q":"Which of the following schemes of the Government of India is a part of the ‘Target Group’ approach?","o":["Drought Prone Areas Programme (DPAP)","Marginal Farmers Development Agency (MFDA)","Hill Areas Development Programme (HADP)","Command Area Development & Water Management Programme (CADP)"],"a":1,"e":"Marginal Farmers Development Agency (MFDA) supports small and marginal farmers through credit, training, and technology. The Small Farmers Development Agency (SFDA) was established in 1971 by the All India Rural Credit Review Committee, which was formed in 1969. Additionally, the Marginal Farmers and Agricultural Laborers Development Agency (MAFALDA) was established in 1971-72.","s":""},{"n":1852,"t":"Schemes","q":"The National Youth Policy 2014 defines youth as population between the ages of______ and______.","o":["20; 29","15; 25","15; 29","10; 19"],"a":2,"e":"15; 29. The National Youth Policy was first formulated in 1988, revised in 2003, and again in 2014. Changes in the socio-economic and other conditions of the country require periodic reformulation to address contemporary issues and promote youth well-being. India has the highest youth population in the world.","s":""},{"n":1853,"t":"Schemes","q":"Which of the following is NOT one of the main pillars of the ‘Namami Gange Programme’, launched by the Government of India in 2014?","o":["Sewerage Treatment Infrastructure","Industrial Effluent Monitoring","River Linkage Development","River-Front Development"],"a":2,"e":"River Linkage Development. The 'Namami Gange Programme' is an integrated conservation mission approved as a flagship program by the Union Government in June 2014.","s":""},{"n":1854,"t":"Schemes","q":"When was the Swarnajayanti Gram Swarozgar Yojana (SGSY) launched by the Government of India?","o":["1999","2000","1995","1991"],"a":0,"e":"1999. The objective of the SGSY is to bring the assisted Swarozgaris above the poverty line by providing them income generating assets through bank credit and Government subsidy.","s":""},{"n":1855,"t":"Schemes","q":"How might ICT enhance the openness of e-land records?","o":["Enabling quick search and retrieval of land records","Facilitating manual record updates and amendments","Enforcing strict regulations on land transactions","Reducing the need for land surveys and assessments"],"a":0,"e":"Information and Communication Technology (ICT) facilitates the digitization and online availability of land records, making it easier for stakeholders to access information efficiently. ICT systems can provide real-time updates and tracking of land records, reducing delays and increasing the reliability of information. Digital India Land Records Modernization Programme was launched in 2008 by the Ministry of Rural Development to digitize and modernize land records and develop a centralized land record management system.","s":""},{"n":1856,"t":"Schemes","q":"By which ministry of Government of India was the Deendayal Antyodaya Yojana started?","o":["Ministry of Corporate affairs","Ministry of Rural Development","Ministry of Home affairs","Ministry of Labour and Employment"],"a":1,"e":"Ministry of Rural Development. Deen Dayal Antyodaya Yojana - National Rural Livelihoods Mission (DAY - NRLM) was launched as ‘Aajeevika - National Rural Livelihoods Mission (NRLM)' in the year 2011. It was renamed as DAY-NRLM in 2015. It aims at creating effective and efficient institutional platforms to enable the rural poor to increase their household income by means of sustainable livelihood enhancements and better access to financial services.","s":""},{"n":1857,"t":"Schemes","q":"When was the Bharat Nirman Programme launched by the Government of India?","o":["2014","2005","2010","2000"],"a":1,"e":"2005. The Bharat Nirman program was a Union Government program launched to improve rural infrastructure. The program's objectives included: Developing rural roads, Building rural housing, Improving rural telephony, Electrifying rural areas, and Providing rural water supply and irrigation.","s":""},{"n":1858,"t":"Schemes","q":"Which of the following is NOT a poverty alleviation programme in India?","o":["Rashtriya Ucchatar Shiksha Abhiyan","Swarna Jayanti Shahari Rozgar Yojana","Prime Minister Rozgar Yojana","Integrated Rural Development Program"],"a":0,"e":"Rashtriya Ucchatar Shiksha Abhiyan. It is a holistic scheme of development for higher education in India initiated in 2013 by the Ministry of Education. Swarna Jayanti Shahari Rozgar Yojana in India is a Centrally Sponsored Scheme which came into effect on 1 December 1997. The Prime Minister Rozgar Yojna (PMRY) scheme is to provide assistance to the educated unemployed persons.","s":""},{"n":1859,"t":"Schemes","q":"Who among the following launched the digital platform 'FASTER'?","o":["Finance Minister","President","Chief Justice of India","Prime Minister"],"a":2,"e":"Chief Justice of India. FASTER, which stands for 'Fast and Secured Transmission of Electronic Records', is a digital platform used by court officials. It enables instant transmission of electronic copies of court orders. This secure electronic communication channel ensures swift delivery of documents to the intended parties. Portals Launched by Government of India : “ROSHNI” - IIT Ropar, Shiksha Vani - CBSE, Diksha -Ministry of Human Resource Development, e-Sahaj - Ministry of Home Affairs.","s":""},{"n":1860,"t":"Schemes","q":"In which year was the ‘Aatmanirbhar Bharat Rojgar’ Yojana launched by the Government of India?","o":["2020","2022","2010","2015"],"a":0,"e":"2020. The 'Aatmanirbhar Bharat Rojgar' Yojana has been launched with effect from 1st October, 2020 as part of Atmanirbhar Bharat package 3.0 to incentivize employers for creation of new employment along with social security benefits and restoration of loss of employment during Covid-19 pandemic.","s":""},{"n":1861,"t":"Schemes","q":"__________ is one of the well -known schemes sponsored by the Union Government of India. It was launched in November 2015 with the aim of rescuing the country’s ailing electricity distribution companies.","o":["One Nation, One Grid","Integrated Power Development Scheme (IPDS)","Ujwal DISCOM Assurance Yojana","Deendayal Upadhyaya Gram Jyoti Yojana"],"a":2,"e":"Ujwal DISCOM Assurance Yojana. Key Features of UDAY: Financial Turnaround: Allows state governments to take over 75% of DISCOM debt and pay back lenders by selling bonds. Energy Efficiency: Promotes the use of energy-efficient LED bulbs, agricultural pumps, fans, and air conditioners. Other Scheme: One Nation, One Grid refers to the unified national power grid. Integrated Power Development Scheme (IPDS) focuses on strengthening sub-transmission and distribution infrastructure. Deendayal Upadhyaya Gram Jyoti Yojana (DDUGJY) aims to provide 24/7 electricity to rural areas.","s":""},{"n":1862,"t":"Schemes","q":"The approach driven by seven engines, which is powered by Clean Energy and 'Sabka Prayas' is related to which scheme?","o":["Pradhan Mantri Mudra Yojana","Garib Kalyan Rojgar Abhiyan","Aatmanirbhar Bharat Rojgar Yojana","PM Gati Shakti Master Plan"],"a":3,"e":"PM Gati Shakti Master Plan. Launched on October 13, 2021, the PM Gati Shakti plan is aimed at integrating and speeding up infrastructure projects across sectors. It focuses on seven key engines: roads, railways, airports, ports, mass transport, waterways, and logistics infrastructure.","s":""},{"n":1863,"t":"Schemes","q":"Match the columns.\nList I List II i. National Manufacturing Policy a. 2014 ii. Make in India initiative b. 2016 iii. Startup India scheme c. 2011 iv. Smart City Project d. 2015","o":["i - d, ii - c, iii - a, iv - b","i - c, ii - d, iii - b, iv - a","i - b, ii - a, iii - d, iv - c","i - c, ii - a, iii - b, iv - d"],"a":3,"e":"i-c, ii-a, iii-b, iv-d. National Manufacturing Policy: Objective -Enhancing the share of manufacturing in GDP to 25% within a decade and creating 100 million jobs. Make in India initiative: Objective - To promote India as the most preferred global manufacturing destination. Startup India scheme: Aim -To empower startups to grow through innovation and design. Smart City Project: Objective: To promote sustainable and inclusive cities with core infrastructure, a high quality of life, a clean environment, and smart solutions.","s":""},{"n":1864,"t":"Schemes","q":"When was the Prime Minister’s Employment Generation Programme (PMEGP) launched?","o":["2008","2009","2006","2012"],"a":0,"e":"2008. The Prime Minister's Employment Generation Programme (PMEGP) is a government scheme that aims to create employment opportunities in rural and urban areas. The scheme provides financial assistance for setting up self-employment ventures, including for artisans and unemployed youth.","s":""},{"n":1865,"t":"Schemes","q":"In which year was the Mahatma Gandhi National Rural Employment Guarantee Act passed?","o":["2004","2005","2003","2006"],"a":1,"e":"2005. The Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) was enacted in September 2005, with the primary objective of ensuring 100 days of wage employment per year for rural households. Originally proposed by P.V. Narasimha Rao in 1991, it was implemented across 625 districts in India before its nomenclature was amended fro
