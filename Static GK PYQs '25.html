Nashik is situated on the banks of river Godavari. The Godavari starts from Trimbakeshwar, Maharashtra and flows to the Bay of Bengal. It is also known for hosting the Kumbh Mela every 12 years.","s":""},{"n":1392,"t":"States G.K.","q":"Which among the following is the official sport of Maharashtra, as of 2022?","o":["Mallakhamb","Kalaripayattu","Sand sculptures","Dahi-Handi"],"a":3,"e":"Dahi - Handi. It is an entertainment and competitive event celebrated with Hindu festival Krishna Janmashtami (birth of God Krishna). Madhya Pradesh (Mallakhamb), Kerala (Kalaripayattu). Puri Beach (Odisha) -Here, Sudarsan Pattnaik showcases his sand arts. Mysore Sand Sculpture Museum - It is home to several sand models and was founded by M N Gowri.","s":""},{"n":1393,"t":"States G.K.","q":"\"Living root bridges\" is an iconic structure found in which state?","o":["Meghalaya","West Bengal","Himachal Pradesh","Assam"],"a":0,"e":"Meghalaya. Living root bridges (Jing Kieng Jri) - The aerial bridges, built by weaving and adjusting the roots of the Indian rubber tree. Other Famous root bridges - Riwai Root Bridge and Umshiang Double Decker Bridge. Properties - Elastic, easily combined, grows in rough and rocky soils. Grown by Khasi and Jaintia tribes of Meghalaya.","s":""},{"n":1394,"t":"States G.K.","q":"Surat is also known as ________ of India.","o":["Diamond city","Blue city","Pink City","City of Lakes"],"a":0,"e":"Diamond city. It is also known as “The silk city”, and “The green city”. Surat (located on the River Tapi) has been called “The gateway to Mecca”. Old name of Surat - Suryapur.","s":""},{"n":1395,"t":"States G.K.","q":"Which of the following sites do \"Not\" have nuclear power plants?","o":["Vijayawada","Naraura","Tarapur","Rawat Bhata"],"a":0,"e":"Vijayawada. Nuclear power plants in India: Kakrapar Atomic Power Station (1993, Gujarat), Kalpakkam, Madras (1984, Tamil Nadu), Narora (1991, Uttar Pradesh), Kaiga (2000 ; Karnataka), Rawatbhata (1973, Rajasthan), Tarapur (1969, Maharashtra), Kudankulam (2013, Tamil Nadu). Under Construction: Chutka (Madhya Pradesh), Gorakhpur (Haryana), Bhimpur (Madhya Pradesh), Mahi Banswara (Rajasthan), Haripur (West Bengal), etc.","s":""},{"n":1396,"t":"States G.K.","q":"India’s First AI-powered, end - to - end digital Lok Adalat was launched in ________.","o":["Uttar Pradesh","Rajasthan","Madhya Pradesh","Gujarat"],"a":1,"e":"Rajasthan. Launched by National Legal Services Authority Chairman, Uday Umesh Lalit. About Rajasthan (northwest) - Capital: Jaipur.","s":""},{"n":1397,"t":"States G.K.","q":"Which of the following is the first 'smoke-free state' in India?","o":["Rajasthan","Uttarakhand","Bihar","Himachal Pradesh"],"a":3,"e":"Himachal Pradesh. This was achieved due to the Ujjwala Scheme (2016, by centre) and Grahini Suvidha Yojana (2018, by Himachal Pradesh Government). Chandigarh is the first smoke-free city in India.","s":""},{"n":1398,"t":"States G.K.","q":"The Government of________ launched Mukhyamantri Chaa Srami Kalyan Prakalpa Scheme for tea garden workers.","o":["Kerala","Assam","Tripura","Andhra Pradesh"],"a":2,"e":"Tripura ( 5th largest tea producing State in India). Assam is the largest tea-producing state in India followed by West Bengal. Jorhat has the world famous Tocklai Experimental Centre. China (1st) and India (2nd) are the largest tea producing countries in the world.","s":""},{"n":1399,"t":"States G.K.","q":"The Kashi Yatra Scheme was introduced by the government of ……","o":["Karnataka","Uttar Pradesh","Punjab","Kerala"],"a":0,"e":"Karnataka government has launched the Kashi Yatra scheme. It offers cash assistance of Rs 5,000 to pilgrims who visit the Kashi Vishwanath Temple (Varanasi, Uttar Pradesh). The Kashi Vishwanath Temple (Jyotirlingas) is dedicated to Lord Shiva. The current structure was built by the Ahilyabai Holkar of Indore (Maratha ruler) in the year 1780.","s":""},{"n":1400,"t":"States G.K.","q":"India's first Olympic Values Education Programme (OVEP) was launched in _____.","o":["Uttar Pradesh","Punjab","Odisha","Haryana"],"a":2,"e":"Odisha. The Olympic Values Education Programme (OVEP) of the International Olympic Committee (IOC) was launched in Odisha by Chief Minister Naveen Patnaik, in collaboration with the Abhinav Bindra Foundation Trust (ABFT). IOC - Headquarters: Lausanne (Switzerland), Founded: 23 June 1894 (Paris, France).","s":""},{"n":1401,"t":"States G.K.","q":"In which district of Maharashtra is Ralegan Siddhi, a small village that has become an example for watershed development, situated?","o":["Yavatmal","Nashik","Ahmednagar","Pune"],"a":2,"e":"Ahmednagar . Extra Facts -Integrated Watershed Development Programme (IWMP) objective is to cover 55 million hectares of rain fed land by\n2027. Other Initiatives - Hariyali (Central Government), Neeru-Meeru programme (Andhra Pradesh) and Arvary Pani Sansad (Alwar, Rajasthan). Tamil Nadu has made water harvesting structures in the houses compulsory.","s":""},{"n":1402,"t":"States G.K.","q":"In which state in India is Chandratal wetland located?","o":["Jammu and Kashmir","Himachal Pradesh","Uttarakhand","Uttar Pradesh"],"a":1,"e":"Himachal Pradesh. Important Wetlands - Pong dam, Renuka Wetland (Himachal Pradesh), Tampara Lake (Odisha), Yashwant Sagar (Madhya Pradesh), Chitrangudi Bird Sanctuary (Tamil Nadu), Shallbugh Wetland (Jammu and Kashmir) Thane Creek (Maharashtra), Kanjirankulam Bird Sanctuary (Tamil Nadu) etc.","s":""},{"n":1403,"t":"States G.K.","q":"Which state of India has set up District Investment Promotion Agencies (DIPA) ?","o":["Karnataka","Haryana","Odisha","West Bengal"],"a":2,"e":"Odisha Government has set up District Investment Promotion Agencies (DIPA) to promote and facilitate investment across the State.","s":""},{"n":1404,"t":"States G.K.","q":"The Janjira Fort is situated on a small island in the Arabian sea, off the coast of______.","o":["Gujarat","Maharashtra","Kerala","Karnataka"],"a":1,"e":"Maharashtra. Janjira fort is situated on an oval-shaped rock off the Arabian Sea coast near the port town of Murud, 165 km south of Mumbai, Maharashtra. Some other forts in Maharashtra: Lohagad fort, Daulatabad fort, Raigad fort, Shaniwarwada fort pune, Sindhu Garh fort, Pratapgarh fort, Rajmachi fort, Korigad fort, Sinhagad fort etc.","s":""},{"n":1405,"t":"States G.K.","q":"Which of the following is a limestone cave in India?","o":["Undavalli Caves","Varaha Cave","Borra Caves","Bhimbetka Caves"],"a":2,"e":"Borra Caves is a limestone cave located in the Ananthagiri hills of the Araku Valley of the Alluri Sitharama Raju district in Andhra Pradesh. Undavalli Caves- Amravati, Andhra Pradesh. Varaha Cave- Mahabalipuram, Tamil Nadu. Bhimbetka Caves - Amcha khurd, Madhya Pradesh.","s":""},{"n":1406,"t":"States G.K.","q":"Agumbe, a biodiversity-rich region that receives 7640 mm of average annual rainfall in South India, is located in which state?","o":["Andhra Pradesh","Karnataka","Tamil Nadu","Kerala"],"a":1,"e":"Karnataka . Agumbe ( 'Cobra Capital' of India) is registered as a UNESCO World Heritage Site and is famous for its rich biodiversity, waterfalls (Onake Abbi, Bakarna, and Jogi Gundi fall), and red-hazy sun-set over the Arabian Sea.","s":""},{"n":1407,"t":"States G.K.","q":"In which of the following Indian states will you find the Buxa Fort?","o":["Odisha","Karnataka","West Bengal","Tamil Nadu"],"a":2,"e":"Buxa Fort is located in the Buxa Tiger Reserve, Alipurduar district, in West Bengal. Kurumbera Fort is located at Gagneswar, West Bengal. Fort William, Kolkata, West Bengal.","s":""},{"n":1408,"t":"States G.K.","q":"In which city of Gujarat will you find the Uparkot Buddhist Caves ?","o":["Bhavnagar","Vadodara","Junagadh","Anand"],"a":2,"e":"Junagadh. Some of the famous Buddhist Caves in India are Ajanta Caves, Ellora Caves, Kanheri Caves, Bhaja Caves, Junnar Caves, Karla Caves in Maharashtra, Barabar Caves in Bihar, Nagarjunakonda Caves in Andhra Pradesh, Dhauli Caves, Lalitgiri Caves, Ratnagiri Caves in Orissa.","s":""},{"n":1409,"t":"States G.K.","q":"What is located inside the premises of Akhal Takht Sahib?","o":["Golden Temple","Paonta Sahib","Patna Sahib","Gurudwara Bangla Sahib"],"a":0,"e":"Golden Temple . Shri Guru Hargobind Singh laid the foundation stone of the Akal Takht building in 1605. Paonta Sahib was founded by the Tenth Sikh guru, Guru Gobind Singh. Patna Sahib was built by Maharaja Ranjit Singh. Gurudwara Bangla Sahib is known for its association with the eighth Sikh Guru, Guru Har Krishan.","s":""},{"n":1410,"t":"States G.K.","q":"Litti Chokha is a famous cuisine of which of the following states?","o":["Maharashtra","Bihar","Gujarat","Odisha"],"a":1,"e":"Bihar . Litti Chokha basically consists of wheat and sattu. It originated centuries ago as a staple food in the court of Magadha.","s":""},{"n":1411,"t":"States G.K.","q":"In the context of the culture of Uttarakhand, 'Kafuli' is the name of a:","o":["cuisine","folk dance","festival","style of painting"],"a":0,"e":"cuisine. Kafuli is a delicacy of Uttarakhand prepared out of leafy greens such as palak (spinach) and methi (fenugreek) leaves. It is also known as Dhapdi in Garhwal.","s":""},{"n":1412,"t":"States G.K.","q":"In which of the following states of India is the buffalo breed named 'Banni' mainly reared?","o":["Kerala","West Bengal","Gujarat","Odisha"],"a":2,"e":"Gujarat . Banni buffalo is also known as \"Kutchi\" or \"Kundi\". It is a breed of buffalo found primarily in the Kutch district of Gujarat, India.","s":""},{"n":1413,"t":"States G.K.","q":"Which of the following palaces is located in Thiruvananthapuram ?","o":["Chowmahalla Palace","Amber Palace","Ujjayanta Palace","Kanakakunnu Palace"],"a":3,"e":"Kanakakunnu Palace is situated in Thiruvananthapuram near the Napier museum, India. Chowmahalla Palace is the palace of the Nizams of Hyderabad. Amber Fort is a fort located in Amber, Rajasthan. The Ujjayanta Palace is a museum and the former palace of the Kingdom of Tripura situated in Agartala.","s":""},{"n":1414,"t":"States G.K.","q":"Janapada Geete, which includes the vachanas of Basavanna, is associated with the state of ______.","o":["Odisha","Kerala","West Bengal","Karnataka"],"a":3,"e":"Karnataka . Janapada Geete, Jana means people or tribe and pada means verse/rhyme.","s":""},{"n":1415,"t":"States G.K.","q":"Pochampally Ikat sarees and dress materials, famous for their traditional geometric patterns belong to the state of ______.","o":["Telangana","Tamil Nadu","Karnataka","Kerala"],"a":0,"e":"Telangana . Traditional Sarees and States: Banarasi Saree - Uttar Pradesh, Kanjivaram Silk Saree - Tamil Nadu, Nauvari Saree - Maharashtra, Tant Saree - West Bengal.","s":""},{"n":1416,"t":"States G.K.","q":"'Muya Awandru' is a traditional food of this Indian state.","o":["Gujarat","Karnataka","Chhattisgarh","Tripura"],"a":3,"e":"Tripura . Muya awandru is a dish prepared with bamboo shoots, berma (fermented fish), parsley, and green chilies. It is a rice flour-based gravy.","s":""},{"n":1417,"t":"States G.K.","q":"In which of the following states is the Stanley Reservoir located?","o":["Tamil Nadu","Goa","Maharashtra","Andhra Pradesh"],"a":0,"e":"Tamil Nadu. Stanley Reservoir (Mettur dam) is one of the largest fishing reservoirs in South India. Its main source of water is the River Kaveri.","s":""},{"n":1418,"t":"States G.K.","q":"In which Indian state is the 'Pookode Lake' located?","o":["Punjab","Gujarat","Kerala","Tamil Nadu"],"a":2,"e":"Kerala . 10 Famous Lakes in Kerala : Ashtamudi Lake, Periyar Lake, Vembanad Lake, Pookode Lake, Vellayani Lake, Paravur Lake, Punnamada Lake, Sasthamkotta Lake, Mananchira Lake, Veeran Puzhal Lake.","s":""},{"n":1419,"t":"States G.K.","q":"In which state of India does the 'Weinia Falls' lie?","o":["Sikkim","Himachal Pradesh","Meghalaya","Goa"],"a":2,"e":"Meghalaya . Weinia Falls is also known as Kshaid Weinia. Kunchikal Falls in Shimoga District of Karnataka is the highest waterfall in India and the second biggest waterfall in Asia.","s":""},{"n":1420,"t":"States G.K.","q":"Churahi, Mandeali and Keonthali are dialects spoken in the state of:","o":["Madhya Pradesh","Arunachal Pradesh","Uttar Pradesh","Himachal Pradesh"],"a":3,"e":"Himachal Pradesh. Other Pahari dialects spoken here - Chambiali, Churahi, Mandeli, Himachali and Kuluhi.","s":""},{"n":1421,"t":"States G.K.","q":"Which of the following is the State Tree of Maharashtra ?","o":["Mango","Jammi","Banyan","Ashok"],"a":0,"e":"Mango . Scientific name -Mangifera indica . Amba (Marathi), Family: Anacardiaceae.","s":""},{"n":1422,"t":"States G.K.","q":"Which of the following is the state bird of Rajasthan?","o":["Indian Roller","Crane Crane","Asian Cuckoo","Son Chiraiya (Great Indian Bustard)"],"a":3,"e":"Son Chiraiya (Great Indian Bustard). State Animal : Chinkara and Camel. State Dance- Ghoomer, State tree-Khejri (Prosopis Cineraria), State Flower-Rohida (Tecomella Undulata).","s":""},{"n":1423,"t":"States G.K.","q":"Which state among the following is the largest producer of coffee?","o":["Karnataka","Tamil Nadu","Andhra Pradesh","Kerala"],"a":0,"e":"Karnataka. Kodagu Chikmagalur and Hassan districts are major coffee producer regions of the state.","s":""},{"n":1424,"t":"States G.K.","q":"‘Balchao’ and ‘Sorpotel' are the traditional culinary dishes of:","o":["Karnataka","Uttarakhand","Goa","Punjab"],"a":2,"e":"Goa . Famous dishes of Goa are - Goan Fish Curry, Prawn Balchao, Fish Recheado, Chicken, Xacuti, Chicken Cafreal, Shark Ambot Tik, Pork Sorpotel, Mussel, Rawa Fry, Caldeirada, Pork Vindaloo.","s":""},{"n":1425,"t":"States G.K.","q":"‘Tolu Bommalata’ (leather shadow puppet show) is a traditional art form from the state of:","o":["Karnataka","Kerala","Tamil Nadu","Andhra Pradesh"],"a":3,"e":"Andhra Pradesh. Tholu means leather in Telugu and bommalu means dolls. Traditional Art Forms of Andhra Pradesh: Kuchipudi, Kalamkari Paintings, Buta Bommalu, Lambadi Nirmal Painting, Kolattam Bhamakalapam, Veeranatyam, Burrakatha, Dhimsa.","s":""},{"n":1426,"t":"States G.K.","q":"Which of the following is a site of archaeological importance in Jammu and Kashmir?","o":["Maski","Burzahom","Brahmagiri","Watkal"],"a":1,"e":"Burzahom . Maski is a town and an archaeological site in the Raichur district of the state of Karnataka. Brahmagiri is a mountain range in the Western Ghats of south India.","s":""},{"n":1427,"t":"States G.K.","q":"Chutka Atomic Power Plant is situated in which of the following states?","o":["Haryana","Gujarat","Madhya Pradesh","Rajasthan"],"a":2,"e":"Madhya Pradesh (in Mandla district) . Presently, India has 22 nuclear power reactors. Kudankulam Nuclear Power Plant is the largest nuclear power station in India, situated in Kudankulam Tamil Nadu. Tarapur Atomic Power Station (1969) is located in Tarapur, Maharashtra is the first atomic power plant in India.","s":""},{"n":1428,"t":"States G.K.","q":"'Panche' is a traditional sarong worn by the men in the state of ______.","o":["Kerala","Karnataka","Assam","Sikkim"],"a":1,"e":"Karnataka . Panche (Dhoti ) -This unstitched cloth is wrapped around the legs and knotted around the waist.","s":""},{"n":1429,"t":"States G.K.","q":"In which present-day state will you find the Meguti temple?","o":["Tamil Nadu","Odisha","Karnataka","Kerala"],"a":2,"e":"Karnataka . Megudii Jain temple is a monument in Aihole, constructed in 634 AD in Dravidian style of architecture.","s":""},{"n":1430,"t":"States G.K.","q":"Which of the following Indian states has the famous tourist destination called Pamban Island?","o":["Kerala","Andhra Pradesh","Odisha","Tamil Nadu"],"a":3,"e":"Tamil Nadu. Pamban Island or Rameswaram Island is an island located between peninsular India and Sri Lanka, on the Adam's Bridge archipelago.","s":""},{"n":1431,"t":"States G.K.","q":"In which state is India’s least densely populated district Dibang Valley located as per Census 2011 ?","o":["Himachal Pradesh","Nagaland","Telangana","Arunachal Pradesh"],"a":3,"e":"Arunachal Pradesh. Dibang is named after the Dibang River or the Talon as the Mishmis. It has an area of 9,129 square kilometers (3,525 sq mi).","s":""},{"n":1432,"t":"States G.K.","q":"Where is the Kudremukh iron ore mine located?","o":["Andhra Pradesh","Bihar","Odisha","Karnataka"],"a":3,"e":"Karnataka (Panambur, Mangalore). Other Iron Ore mine states -Orissa, Chhattisgarh and Jharkhand.","s":""},{"n":1433,"t":"States G.K.","q":"In which of the following states/union territories is India’s highest Meteorological Centre situated?","o":["Assam","Meghalaya","Ladakh","Jammu and Kashmir"],"a":2,"e":"Ladakh . Districts in the Union Territory of Ladakh - Two (Kargil district and Leh district).","s":""},{"n":1434,"t":"States G.K.","q":"In which of the following states is the famous Chitradurga Fort located?","o":["Kerala","Karnataka","Tamil Nadu","Rajasthan"],"a":1,"e":"Karnataka (In Chitradurga District ). The fort was built in stages between the 11th and 13th centuries by the dynastic rulers of the region, including the Chalukyas and Hoysalas, later the Nayakas of Chitradurga of the Vijayanagar Empire.","s":""},{"n":1435,"t":"States G.K.","q":"In which of the following states is Sri Bhramaramba Mallikarjuna Temple located?","o":["Andhra Pradesh","Odisha","Maharashtra","Tamil Nadu"],"a":0,"e":"Andhra Pradesh. Sri Bhramaramba Mallikarjuna Temple is located in Srisailam, district Kurnool, in Andhra Pradesh. Sri Bhramaramba Mallikarjuna Temple, Srisailam Temple is a historic temple dedicated to Shiva and Parvati.","s":""},{"n":1436,"t":"States G.K.","q":"The Sufi shrine Charar-e-Sharief (or Sharif) is located near ______ city.","o":["Srinagar","Mumbai","Hyderabad","Lucknow"],"a":0,"e":"Srinagar. Charar-e-Sharief, famous for the shrine of Sufi saint -Sheikh Noor-ud-Din Noorani.","s":""},{"n":1437,"t":"States G.K.","q":"Which of the following is the state flower of Manipur?","o":["Foxtail Orchids","Shirui Lily","Pink Rhododendron","Retusa"],"a":1,"e":"Shirui Lily (Lilium mackliniae). Foxtail Orchids (Rhynchostylis retusa) or Kopou Flower is a flower of Assam. Pink Rhododendron is a flower of Himachal.","s":""},{"n":1438,"t":"States G.K.","q":"Which of the following states emerged as a separate state in 1963 ?","o":["Nagaland","Mizoram","Arunachal Pradesh","Tripura"],"a":0,"e":"Nagaland became the 16th state of India on 1 December 1963. Other states were conferred statehood on Mizoram (20 February 1987), Arunachal Pradesh (20 February 1987), Tripura (21 January 1972).","s":""},{"n":1439,"t":"States G.K.","q":"Which present day Indian state came into existence as the Mysore state in 1953?","o":["Kerala","Karnataka","Tamil Nadu","Andhra Pradesh"],"a":1,"e":"Karnataka (renamed in 1973). Karnataka is the largest state in South India and the sixth-largest (area wise) in India. Mysore was formed on 1 November 1956.","s":""},{"n":1440,"t":"States G.K.","q":"'Rahide' is a long scarf worn by the women of ______ to protect their head from the cool breeze as well as to show their traditional social affinity.","o":["Madhya Pradesh","Himachal Pradesh","Uttar Pradesh","Arunachal Pradesh"],"a":1,"e":"Himachal Pradesh. Woven in all shapes and sizes, Rahide comes in different fabrics and patterns.","s":""},{"n":1441,"t":"States G.K.","q":"Which modern-day Indian state was created on 1 April 1937 as the United Provinces by the Britishers?","o":["Andhra Pradesh","Arunachal Pradesh","Uttar Pradesh","Madhya Pradesh"],"a":2,"e":"Uttar Pradesh came into existence on 1 April 1937 as a result of the shortening of \"United Provinces of Agra and Oudh\". Arunachal Pradesh - 20 February 1987 - 55 th constitutional amendment act, 1986. Sikkim - 16 May, 1975 - 36th constitutional amendment act, 1975.","s":""},{"n":1442,"t":"States G.K.","q":"In which year did the state of Himachal Pradesh come into existence?","o":["1971","1947","1956","1965"],"a":0,"e":"25th January 1971. The State of Himachal Pradesh Act was passed by Parliament on 18th December\n1970. Thus it emerged as the eighteenth state of the Indian Union.","s":""},{"n":1443,"t":"States G.K.","q":"'Sandalwood' is the state tree of ______.","o":["Madhya Pradesh","Karnataka","Punjab","Rajasthan"],"a":1,"e":"Karnataka. Mysore city (Karnataka) is also known as ‘Sandalwood city of India’ .","s":""},{"n":1444,"t":"States G.K.","q":"Dogri language is mainly spoken in which of the following states/union territories?","o":["Uttarakhand","Jammu & Kashmir","Lakshadweep","Assam"],"a":1,"e":"Jammu and Kashmir. Dogri is spoken by approximately 2.3 million people. It is an officially recognized language in India.","s":""},{"n":1445,"t":"States G.K.","q":"‘Ramoji Film City’ is located close to which of the following cities?","o":["Pune","Hyderabad","Mumbai","Gurugram"],"a":1,"e":"Hyderabad . It is the largest integrated film city in the world and it has been certified by the Guinness World Records as the largest studio complex in the world.","s":""},{"n":1446,"t":"States G.K.","q":"Vailankanni (Velankanni) is a pilgrim centre located in the ______ district of Tamil Nadu.","o":["Theni","Salem","Nagapattinam","Madurai"],"a":2,"e":"Nagapattinam. This city is famous for the church of Mother Mary and handlooms and silk. Vailankanni (Velankanni) is also known as the Lourdes of the East.","s":""},{"n":1447,"t":"States G.K.","q":"The longest continuous wall in India, the second longest in the world, is at ______ Fort.","o":["Kumbhalgarh","Chittorgarh","Mehrangarh","Kangra"],"a":0,"e":"Kumbhalgarh (Rajasthan) . The Great Wall of China is the longest wall in the world.","s":""},{"n":1448,"t":"States G.K.","q":"Salsette Island is situated in which state of India ?","o":["Tamil Nadu","Andhra Pradesh","Maharashtra","Kerala"],"a":2,"e":"Maharashtra ( on India’s west coast). The highest point is the conical peak of Kanheri in Borivali National Park on the northern reaches of Salsette island.","s":""},{"n":1449,"t":"States G.K.","q":"Which state in India was the first to introduce the 'Mid-day Meal Scheme' for school children?","o":["Maharashtra","Gujarat","Tamil Nadu","Kerala"],"a":2,"e":"Tamil Nadu . The basic objective of this scheme is to enhance enrolment in schools. Nodal Ministry: Ministry of Education.","s":""},{"n":1450,"t":"States G.K.","q":"Which of the following is NOT a twin city of India?","o":["Ahmedabad and Gandhinagar","Hubli and Dharwad","Thrissur and Thiruvalla","Cuttack and Bhubaneswar"],"a":2,"e":"Thrissur and Thiruvalla . Famous twin cities of India: Hyderabad and Secunderabad, Vijayawada and Amaravati, Kochi and Ernakulam, Kolkata and Howrah, Jalpaiguri and Siliguri.","s":""},{"n":1451,"t":"States G.K.","q":"Which city of India is known as 'Athens of the East' ?","o":["Allahabad","Patna","Madurai","Kochi"],"a":2,"e":"Madurai (Tamil Nadu). It is located on the banks of River Vaigai.","s":""},{"n":1452,"t":"Organisation","q":"What was the role of the National Dairy Development Board (NDDB) in the Technology Mission on Oilseeds ?","o":["To promote milk production","To regulate trade policies","To develop genetically modified crops","To manage oilseed procurement and processing"],"a":3,"e":"To manage oilseed procurement and processing. The Technology Mission on Oilseeds (TMO) was launched in 1986 to reduce India’s dependence on edible oil imports and achieve self-sufficiency in oilseeds production. The National Dairy Development Board (NDDB), which had earlier spearheaded Operation Flood in the dairy sector, was entrusted with the task of managing oilseed procurement, storage, and processing under the TMO. NDDB played a key role in establishing oilseed cooperatives on the model of dairy cooperatives, ensuring that farmers received fair prices and that the supply chain was strengthened. This initiative eventually contributed to India achieving the status of an “Oilseed Revolution” in the late 1980s and early 1990s.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1453,"t":"Organisation","q":"What is the primary goal of the BIMSTEC Free Trade Area (FTA) ?","o":["To reduce trade barriers and enhance economic cooperation","To establish a common currency among BIMSTEC nations","To regulate trade policies globally","To promote cultural exchanges"],"a":0,"e":"To reduce trade barriers and enhance economic cooperation. The BIMSTEC Free Trade Area (FTA) aims to promote free trade among member countries by reducing tariffs, removing trade barriers, and improving market access. The ultimate goal is to enhance economic integration and cooperation among BIMSTEC nations (Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka, and Thailand).","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1454,"t":"Organisation","q":"Which institution was established in 1961 to promote management education in India ?","o":["Indian Institute of Technology (IIT)","University Grants Commission (UGC)","National Productivity Council (NPC)","Indian Institute of Management (IIM)"],"a":3,"e":"Indian Institute of Management (IIM). The first Indian Institute of Management (IIM Calcutta) was established in 1961 in collaboration with the MIT Sloan School of Management, USA, and the Ford Foundation. Its purpose was to promote management education, research, and training in India. Later, more IIMs were set up across the country, making them premier institutions for management studies. Today, IIMs are recognized as Institutes of National Importance and are among the top business schools globally.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1455,"t":"Organisation","q":"Which countries are members of BIMSTEC?","o":["Bangladesh, Bhutan, India, Pakistan, Nepal, Sri Lanka, Thailand","Bangladesh, Bhutan, India, Myanmar, Maldives, Sri Lanka, Thailand","Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka, Thailand","Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka"],"a":2,"e":"BIMSTEC (Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation) was established on June 6, 1997, through the Bangkok Declaration as BIST-EC (Bangladesh, India, Sri Lanka, Thailand Economic Cooperation). With Myanmar’s entry in 1997, it became BIMST-EC, and after Nepal and Bhutan joined in 2004, it was renamed BIMSTEC. Today, the member countries are Bangladesh, Bhutan, India, Myanmar, Nepal, Sri Lanka, and Thailand.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1456,"t":"Organisation","q":"Which government body was responsible for implementing the Technology Mission on Oilseeds?","o":["Ministry of Defense","Ministry of Commerce","Ministry of Education","Ministry of Agriculture"],"a":3,"e":"Ministry of Agriculture. The Technology Mission on Oilseeds (TMO) was launched in 1986 to boost India’s oilseed production and reduce dependence on edible oil imports. In 1990, pulses were brought under its purview, and the mission was renamed the Technology Mission on Oilseeds and Pulses (TMOP).","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1457,"t":"Organisation","q":"What was the role of the University Grants Commission (UGC), established in 1956?","o":["To regulate trade agreements","To promote agricultural development","To manage industrial policies","To oversee and fund higher education institutions in India"],"a":3,"e":"The University Grants Commission (UGC) was established as a statutory body by an Act of Parliament in\n1956. The National Education Policy NEP 2020 proposes replacing UGC and All India Council for Technical Education (AICTE) with a single regulator, the Higher Education Commission of India (HECI), to ensure unified and streamlined governance in higher education.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1458,"t":"Organisation","q":"Which ISRO centers participate in the International Geosphere-Biosphere programme?","o":["ISRO Headquarters, Space Applications Centre, National Remote Sensing Centre, Vikram Sarabhai Space Centre","Space Physics Laboratory, National Remote Sensing Centre, Indian Institute of Remote Sensing, Physical Research Laboratory","Physical Research Laboratory, Space Applications Centre, Indian Institute of Remote Sensing, ISRO Satellite Centre","Space Application Centre (SAC), Indian Institute of Remote Sensing, Space Applications Centre, National Remote Sensing Centre"],"a":3,"e":"The International Geosphere-Biosphere Programme (IGBP) was a major international scientific effort that operated from 1987 to 2015. After its conclusion, its work, along with that of other global change research programmes, was integrated into a new, broader international initiative called Future Earth, which continues to build on the legacy of IGBP to address global sustainability challenges.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1459,"t":"Organisation","q":"Name the organization that made the Golden Quadrilateral Project connecting major cities of India feasible?","o":["National Highways Authority of India (NHAI)","Indian Railways","Ministry of Urban Development","Border Roads Organization (BRO)"],"a":0,"e":"National Highways Authority of India (NHAI). The Golden Quadrilateral (GQ) is a highway network connecting Delhi, Mumbai, Chennai, and Kolkata, forming a quadrilateral. Its total length is about 5,846 km, making it one of the world’s largest highway projects. It was launched in 2001 by then Prime Minister Atal Bihari Vajpayee under the National Highways Development Project (NHDP) to improve connectivity and trade. The National Highways Authority of India (NHAI) was established in 1988 under the NHAI Act, 1988. It became operational in 1995, with the mandate to develop, maintain, and manage India’s national highways.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1460,"t":"Organisation","q":"Match the following Indexes with their respective Publishing Organizations:\nColumn A - Column B - Publishing Index Organization\nA. Global 1. United Nations Innovation Development Index Programme (UNDP)\nB. Global Hunger 2. World Intellectual Index Property Organization (WIPO)\nC. Global Peace 3. Concern Worldwide Index and Welthungerhilfe\nD. Human 4. Institute for Development Economics and Index (HDI) Peace (IEP)","o":["A-3, B-2, C-1, D-4","A-4, B-2, C-3, D-1","A-2, B-1, C-3, D-4","A-2, B-3, C-4, D-1"],"a":3,"e":"A-2, B-3, C-4, D-1. These indexes are important global indicators used for policy-making and international comparisons. The Global Innovation Index measures innovation capacity and performance of economies. The Global Hunger Index highlights hunger and undernutrition at global, regional, and national levels. The Global Peace Index evaluates peace based on levels of violence, conflict, and militarization. The Human Development Index (HDI) ranks countries on life expectancy, education, and income, serving as a composite measure of overall human development.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1461,"t":"Organisation","q":"Which of the following organisations in India provides facilities for acquisition of satellite data and its processing?","o":["National Remote Sensing Centre (NRSC)","Forest Research Institute (FRI)","Indian Institute of Remote Sensing (IIRS)","Wildlife Institute of India (WII)"],"a":0,"e":"National Remote Sensing Centre (NRSC) is a premier organization located in Hyderabad, under the Indian Space Research Organisation (ISRO). It is responsible for remote sensing satellite data acquisition and processing, data dissemination, aerial remote sensing and decision support for disaster management.","s":""},{"n":1462,"t":"Organisation","q":"Consider the following statements:\n1. The headquarters of the Board of Control for Cricket in India (BCCI) is located at Wankhede Stadium, Mumbai.\n2. The International Cricket Council (ICC) is headquartered in London, United Kingdom.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. BCCI, established in 1928, has its head office at Wankhede Stadium, Mumbai. ICC’s headquarters were earlier in London, but since 2005 they are in Dubai, United Arab Emirates.","s":""},{"n":1463,"t":"Organisation","q":"Consider the following statements about Govindji Nartanalaya:\n1. Govindji Nartanalaya, dedicated to Manipuri classical dance, is located in Assam.\n2. It was founded by Guru Bipin Singh, a noted Manipuri dancer and choreographer.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Govindji Nartanalaya is actually located in Manipur (not Assam). It was indeed founded by Guru Bipin Singh, who played a major role in popularizing Manipuri dance traditions.","s":""},{"n":1464,"t":"Organisation","q":"In which of the following states is the Nrityagram, an Odissi dance institution, located?","o":["Kerala","Karnataka","Tamil Nadu","Maharashtra"],"a":1,"e":"Karnataka. The Nrityagram : Established - 1990; Founder - Protima Gauri. Other dance Academy: Bhartendu Natya Academy (Lucknow), National Dance Academy (Delhi).","s":""},{"n":1465,"t":"Organisation","q":"In which of the following cities of Manipur is the Jawaharlal Nehru Manipur Dance Academy located ?","o":["Imphal","Ukhrul","Chandel","Thoubal"],"a":0,"e":"Imphal. Jawaharlal Nehru Manipur Dance Academy, a unit of the Sangeet Natak Academy in New Delhi, is dedicated to teaching Manipuri dance and music. Established in 1954. Other renowned Dance Institutes : National Institute of Kathak Dance (New Delhi), Nalanda Nritya Kala Mahavidyalaya (Mumbai), Ballet Repertoire Academy of India (Mumbai), Sri Thyagaraja College of Music and Dance (Hyderabad), and Nrityanjali Institute of Performing Arts (Mumbai).","s":""},{"n":1466,"t":"Organisation","q":"Consider the following statements about the National Sports University (NSU):\n1. National Sports University was established in 2018 and is located in Imphal, Manipur.\n2. National Sports University is under the Ministry of Education, Government of India.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The National Sports University (NSU) is located in Imphal, Manipur and was established in 2018 under the Ministry of Youth Affairs and Sports.","s":""},{"n":1467,"t":"Organisation","q":"In which year was the National Institute of Kathak Dance established?","o":["1964","1961","1954","1969"],"a":0,"e":"1964. National Institute of Kathak Dance is also known as Kathak Kendra. It is a unit of the Sangeet Natak Akademy. Other renowned Dance Institutes : Jawaharlal Nehru Manipur Dance Academy (Manipur), Nalanda Nritya Kala Mahavidyalaya (Mumbai), Ballet Repertoire Academy of India (Mumbai), Sri Thyagaraja College of Music and Dance (Hyderabad), and Nrityanjali Institute of Performing Arts (Mumbai).","s":""},{"n":1468,"t":"Organisation","q":"When was the Jawaharlal Nehru Manipur Dance Academy established?","o":["1951","1953","1954","1952"],"a":2,"e":"1954. Other renowned Dance Institutes: National Institute of Kathak Dance (1964) - New Delhi. Nalanda Nritya Kala Mahavidyalaya (1973) - Mumbai. National Ballet Academy of India (2002). Sri Thyagaraja Government College of Music & Dance (1952) - Hyderabad. Nrityanjali (1963) -Mumbai.","s":""},{"n":1469,"t":"Organisation","q":"Who established Shantiniketan and when?","o":["Mahatma Gandhi, 1910","Ravindranath Tagore, 1901","Ravindranath Tagore, 1905","Devendranath Tagore, 1915"],"a":1,"e":"Ravindranath Tagore, 1901. Shantiniketan Initially founded as an ashram by Debendranath Tagore in 1863 and later expanded by Rabindranath Tagore into a center for learning and culture, it evolved into Visva-Bharati University in 1921. In 2023, Shantiniketan was recognized as India's 41st UNESCO World Heritage Site. Other Institutes and Founders : Rishi Valley (1926, Andhra Pradesh) - J. Krishnamurti; Auroville (1968, Tamil Nadu) - Sri Aurobindo; Sabarmati Ashram (1915, Gujarat) -Mahatma Gandhi.","s":""},{"n":1470,"t":"Organisation","q":"Which of the following institutes was founded by Mrinalini Sarabhai who was a Bharatanatyam and Kathakali dancer?","o":["Sri Thyagaraja College of Music and Dance","Nrityanjali Institute of Performing Arts","Darpana Academy of Performing Arts","Nalanda Nritya Kala Mahavidyalaya"],"a":2,"e":"Darpana Academy of Performing Arts. It is a school for performing arts in Ahmedabad, Gujarat, established by Mrinalini Sarabhai and Vikram Sarabhai in 1949. Mrinalini Sarabhai’s Awards : Padma Bhushan (1992) and Padma Shri (1965).","s":""},{"n":1471,"t":"Organisation","q":"Which of the following is India’s national academy of dance ?","o":["Lalit Kala Akademi","Centre for Cultural Resources and Training","Centre for Indian Classical Dances","Sangeet Natak Akademi"],"a":3,"e":"Sangeet Natak Akademi was set up in 1953. It has three constituent units, two of these being dance-teaching institutions: the Jawaharlal Nehru Manipur Dance Academy (JNMDA) at Imphal, and Kathak Kendra in Delhi. Lalit Kala Akademi is India's national academy of fine arts established in 1954. Centre for Cultural Resources and Training, established in 1979, works in the field of linking education with culture.","s":""},{"n":1472,"t":"Organisation","q":"Sangeet Kala Acharya Award is given by which organisation every year since 1993?","o":["Madras Music Academy","Calcutta School of Music","Shankar Mahadevan Academy","Subramaniam Academy of Performing Arts"],"a":0,"e":"Madras Music Academy : It was established as an offshoot of the All India Congress Session in December 1927 and inaugurated on August 18, 1928, by Sir CP Ramaswami Aiyar at the YMCA Auditorium, Esplanade. Its mission was to set the standard for Carnatic music. In 1929, it initiated annual music conferences, leading to the December Music Festival of Madras, one of the world's largest cultural events. Sangita Kala Acharya : This award was instituted in 1993 and is given to those who have contributed by bringing several disciples to the concert platform.","s":""},{"n":1473,"t":"Organisation","q":"Sports Authority of India comes under which ministry?","o":["Ministry of Education","Ministry of Social Justice","Ministry of Health and Family Welfare","Ministry of Youth Affairs and Sports"],"a":3,"e":"Ministry of Youth Affairs and Sports. Sports Authority of India : Formed in - 1984. Headquarters -Jawaharlal Nehru Stadium, Lodhi Road, Delhi. Ministry of Education - Department of School Education & Literacy, Department of Higher Education. Ministry of Health and Family welfare -Department of Health & Family welfare, and Department of Health Research.","s":""},{"n":1474,"t":"Organisation","q":"Consider the following statements about the Non-Aligned Movement (NAM):\n1. The first official summit of NAM was held in Belgrade, Yugoslavia in 1961 and attended by 25 countries.\n2. The Non-Aligned Movement was created mainly under the leadership of developed Western countries to counter the influence of the Soviet Union.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The first official summit of the Non-Aligned Movement (NAM) was held at Belgrade, Yugoslavia, in September 1961, attended by 25 countries. NAM was not created by Western developed countries. Instead, it was initiated by developing nations that wanted to remain independent during the Cold War, refusing to align with either the US-led Western bloc or the Soviet-led Eastern bloc.","s":""},{"n":1475,"t":"Organisation","q":"Gandharva Mahavidyalaya, which was founded by Pandit Vinaya Chandra Maudgalya, is located at _____.","o":["New Delhi","Pune","Kolkata","Mumbai"],"a":0,"e":"New Delhi. Gandharva Mahavidyalaya was established in 1939. It is one of the oldest and most distinguished cultural institutions of Delhi. Its role in imparting training to entire generations of music lovers and bringing Indian classical music and dance into the cultural mainstream is well acknowledged.","s":""},{"n":1476,"t":"Organisation","q":"The G20 Summit 2023 hosted by India :\n1. Harsh Vardhan Shringla was appointed as the Chief Coordinator for the summit held in New Delhi.\n2. The African Union became a permanent member of the G20 during India’s presidency in 2023.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Harsh Vardhan Shringla, former Foreign Secretary, was the Chief Coordinator of India’s G20 Summit (2023). In 2023, under India’s presidency, the African Union (AU) was admitted as a permanent member of the G20, making it “G21” in practice.","s":""},{"n":1477,"t":"Organisation","q":"The ICAR – Sugarcane Breeding Institute is located at :","o":["Vellore","Coimbatore","Tirunelveli","Cuddalore"],"a":1,"e":"Coimbatore. The Sugarcane Breeding Institute (SBI): Established in\n1912. The Indian Council of Agricultural Research (ICAR) , an autonomous body, coordinates agricultural education and research in India and reports to the Department of Agricultural Research and Education, Ministry of Agriculture, established on July 16, 1929, in New Delhi.","s":""},{"n":1478,"t":"Organisation","q":"Which of the following organisations is associated with the development of the web version: e -GOPALA application?","o":["National Dairy Development Board (NDDB)","Indian Council of Agricultural Research","National Dairy Research Institute (NDRI)","National Institute of Agricultural Extension Management"],"a":0,"e":"National Dairy Development Board (NDDB). It is a statutory body established by an Act of the Parliament of India and recognized as an Institution of National Importance. Founded on July 16, 1965, and located in Anand, Gujarat, it operates under the Ministry of Fisheries, Animal Husbandry, and Dairying, Government of India.","s":""},{"n":1479,"t":"Organisation","q":"National Institute of Mountaineering and Adventure Sports (NIMAS) is located at _______.","o":["Nagaland","Arunachal Pradesh","Mizoram","Himachal Pradesh"],"a":1,"e":"Arunachal Pradesh. NIMAS was established in 2013 and is located in the picturesque Dirang Valley within the West Kameng district of Arunachal Pradesh. Other Mountaineering Institutes in India: Himalayan Mountaineering Institute, Darjeeling (West Bengal). National Institute of Mountaineering and Adventure Sports, Dirang (Arunachal Pradesh). Indian Institute of Skiing and Mountaineering (IISM) Gulmarg (Kashmir). Atal Bihari Vajpayee Institute of Mountaineering and Allied Sports, Manali (Himachal Pradesh).","s":""},{"n":1480,"t":"Organisation","q":"Nehru Institute of Mountaineering (NIM):\n1. It is located at Uttarkashi, Uttarakhand, and was established in 1965.\n2. The Himalayan Mountaineering Institute is located in Shimla, Himachal Pradesh, and was founded in 1954.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The Nehru Institute of Mountaineering (NIM) is in Uttarkashi, Uttarakhand, established in 1965. The Himalayan Mountaineering Institute (HMI) is actually located in Darjeeling, West Bengal, not Shimla. It was founded in 1954 by Jawaharlal Nehru to honor the Everest success of Tenzing Norgay and Edmund Hillary.","s":""},{"n":1481,"t":"Organisation","q":"Lakshmibai National Institute of Physical Education (LNIPE) is located at ______.","o":["Uttar Pradesh","Haryana","Madhya Pradesh","Punjab"],"a":2,"e":"Madhya Pradesh. LNIPE (located in Gwalior) is a higher education institute deemed-to-be-university, under the aegis of the Ministry of Youth Affairs and Sports. It is committed to excelling in physical education, coaching and sports in the country. Former names -Lakshmibai College of Physical Education. Established - 1957. Campus -Shaktinagar.","s":""},{"n":1482,"t":"Organisation","q":"Where is the ITC Sangeet Research Academy located?","o":["Kolkata","Delhi","Bengaluru","Indore"],"a":0,"e":"Kolkata. ITC Sangeet Research Academy (ITCSRA) is a Hindustani classical music academy run by the corporate house, ITC Limited. Formation - 1978. Objective - The creation of an effective training system, to rationalise traditional data with the help of modern research methods.","s":""},{"n":1483,"t":"Organisation","q":"In which year was the Marris College of Music established in India ?","o":["1922","1926","1901","1919"],"a":1,"e":"1926. Bhatkhande Music Institute University, formerly known as “Marris College of Hindustani Music” was established by Pt. Vishnu Narayan Bhatkhande. The purpose of its establishment was to liberate music from the monopoly of Gharanedar Musicians and make music education accessible to all. Location - Lucknow (Uttar Pradesh).","s":""},{"n":1484,"t":"Organisation","q":"Consider the following statements about the Indian Institute of Tourism and Travel Management (IITTM):\n1. The headquarters of IITTM is located in Gwalior, Madhya Pradesh.\n2. IITTM functions as an autonomous body under the Ministry of Tourism, Government of India.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. IITTM is a premier institute for education, training, and research in tourism and travel management. It is headquartered at Gwalior (Madhya Pradesh) and works under the Ministry of Tourism, Government of India, with centers at Bhubaneswar, Noida, Nellore, and Bodh Gaya.","s":""},{"n":1485,"t":"Organisation","q":"Lakshmibai National College of Physical Education is located at ______.","o":["Thiruvananthapuram, Kerala","Gwalior, Madhya Pradesh","Shahdara, Delhi","Patiala, Punjab"],"a":0,"e":"Thiruvananthapuram, Kerala. LakshmiBai National College of Physical Education (LNCPE): It was founded in 1985 under the auspices of the Department of Youth Affairs and Sports, Ministry of Human Resource Development, Government of India.","s":""},{"n":1486,"t":"Organisation","q":"In which year was Dattopant Thengadi National Board for Workers Education and Development established","o":["1978","1968","1948","1958"],"a":3,"e":"1958. The Dattopant Thengadi National Board for Workers Education and Development (DTNBWED) is an autonomous body under the Ministry of Labour & Employment, Government of India. Its objective is to promote education and development programs for workers in both organized and unorganized sectors. The Board has its Headquarters at New Delhi. It operates through a network of 50 Regional Directorates located at various parts of the country.","s":""},{"n":1487,"t":"Organisation","q":"Where is the Atal Bihari Vajpayee Institute of Mountaineering and Allied Sports situated?","o":["Pahalgam, Jammu and Kashmir","Darjeeling, West Bengal","Manali, Himachal Pradesh","Uttarkashi, Uttarakhand"],"a":2,"e":"Manali, Himachal Pradesh. Atal Bihari Vajpayee Institute of Mountaineering and Allied Sports (ABVIMAS) is an Indian institute, which provides specialized training in skiing, mountain rescue and mountaineering, founded in 1961.","s":""},{"n":1488,"t":"Organisation","q":"Consider the following statements:\n1. The United Nations, in 2007, passed a resolution to observe October 2 (Gandhi Jayanti) as the International Day of Non-Violence.\n2. The headquarters of the United Nations is located in Geneva, Switzerland.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The UN General Assembly in 2007 declared October 2 as the International Day of Non-Violence. The UN Headquarters is in New York, USA.","s":""},{"n":1489,"t":"Organisation","q":"Indian Industrialists reacted against colonial policies that restricted business activities and formed an organization in 1927. What was it called?","o":["Indian Industrial and Commercial Congress (IICC)","Organization of Industries of India (OII)","Federation of the Indian Chamber of Commerce and Industries (FICCI)","Confederation of Indian Industries (CII)"],"a":2,"e":"FICCI: It is the largest and oldest apex business organisation in India. Founded: 1927, Headquarters: New Delhi. IICC: Founded - 1920, Headquarters - New Delhi. CII: Founded -1895, Headquarters - New Delhi.","s":""},{"n":1490,"t":"Organisation","q":"Which of the following ministries of the Government of India has under it the Council of Scientific & Industrial Research (CSIR)?","o":["Ministry of Commerce and Industry","Ministry of Earth Sciences","Ministry of Science and Technology","Ministry of Education"],"a":2,"e":"Ministry of Science and Technology. Council of Scientific & Industrial Research (CSIR) : The largest research and development (R&D) organization in India. Established - 1942, Headquarters - New Delhi. Founder(s) -Arcot Ramasamy Mudaliar, Shanti Swaroop Bhatnagar. President: Prime Minister of India. Motto - “CSIR-The Innovation Engine of India”. Parent institution - Ministry of Science and Technology, Government of India.","s":""},{"n":1491,"t":"Organisation","q":"Consider the following statements regarding the South Asian Association for Regional Cooperation (SAARC):\n1. Myanmar is one of the member states of SAARC, which was founded in 1985 at Dhaka.\n2. SAARC currently has 8 member countries, including Afghanistan, India, and Sri Lanka.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Myanmar is not a member of SAARC. The 8 members are Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, and Sri Lanka. SAARC was established on 8 December 1985 in Dhaka, Bangladesh with 7 founding members. Afghanistan joined later in 2007, making the total 8 members.","s":""},{"n":1492,"t":"Organisation","q":"Indian council of Historical Research, an autonomous organization, was set up by the Government of India in _______.","o":["1991","1982","1972","1962"],"a":2,"e":"1972. Indian Council of Historical Research (ICHR) - It is a captive body of the Ministry of Education, Government of India established by an administrative order. Aim - To promote and give directions to historical research and to encourage and foster objective and scientific writing of history. Headquarters - New Delhi. Regional centers - Pune (Maharashtra), Bengaluru (Karnataka), and Guwahati (Assam). Founded : 27 March 1972. First chairman - Ram Sharan Sharma.","s":""},{"n":1493,"t":"Organisation","q":"Defence Research Development Organisation (DRDO), which is under the Ministry of Defence Government of India, was formed in the year _______.","o":["1948","1958","1975","1981"],"a":1,"e":"1958. Defence Research and Development Organisation (DRDO) : The Research and Development wing of the military's research and development, headquartered in Delhi. Achievements of DRDO : Agni and Prithvi series of missiles, Light combat aircraft (Tejas), Multi-barrel rocket launcher (Pinaka) Mk-I, Pilotless Target Aircraft ‘Lakshya-I.","s":""},{"n":1494,"t":"Organisation","q":"Indian Academy of Sciences, founded in 1934 by CV Raman, is situated in__________","o":["Mumbai","Hyderabad","Bangalore","New Delhi"],"a":2,"e":"Bangalore. The Indian Academy of Sciences - Registered as a society in 1934 with the aim of promoting the progress and upholding the cause of science, in both pure and applied branches. C.V. Raman, won the Nobel Prize in Physics (1930) for his work on the scattering of light. India celebrates National Science Day on 28 February of every year to commemorate the discovery of the “Raman effect”.","s":""},{"n":1495,"t":"Organisation","q":"Consider the following statements regarding India’s National Implementing Entity for the Adaptation Fund under UNFCCC:\n1. NABARD (National Bank for Agriculture and Rural Development) has been accredited as the National Implementing Entity for the Adaptation Fund in India.\n2. RBI (Reserve Bank of India) is the apex financial institution for rural development and plays the same role as NABARD under UNFCCC.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. NABARD, set up in 1982 with HQ at Mumbai, is India’s accredited National Implementing Entity (NIE) for the Adaptation Fund under UNFCCC. RBI is India’s central bank (est. 1935, HQ: Mumbai) but it does not deal with UNFCCC funds or rural development projects in the way NABARD does.","s":""},{"n":1496,"t":"Organisation","q":"One of the important institutes associated with the green revolution is the Indian Agriculture Research Institute. Where is it located?","o":["Mumbai","Ludhiana","New Delhi","Patna"],"a":2,"e":"New Delhi. The Green revolution started in the 1960s, using high yielding variety (HYV) seeds, mechanised farm tools, irrigation facilities, pesticides, and fertilisers. Agricultural Institute - National Academy of Agricultural Research Management (NAARM) - Hyderabad. Established -1976. Central Potato Research Institute (CPRI) - Shimla. Indian Institute of Horticultural Research - Bangalore, Established - 1967. Indian Agricultural Research Institute (IARI): Establishment -1 April 1905.","s":""},{"n":1497,"t":"Organisation","q":"Which of the following trade agreements aims to 'strengthen intra -SAARC economic cooperation to maximize the region's potential for trade and achieve development for their people'?","o":["APTA","SAFTA","NAFTA","LAIA"],"a":1,"e":"SAFTA (South Asian Free Trade Area) - Formed in 2004 at 12th SAARC convention held in Islamabad, Pakistan. Member countries -Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka. Headquarter - Kathmandu (Nepal). NAFTA - North American Free Trade Agreement. APTA - Asia-Pacific Trade Agreement. LAIA - Latin American Integration Association. SAARC - South Asian Association for Regional Cooperation.","s":""},{"n":1498,"t":"Organisation","q":"Where is the National Dope Testing Laboratory located?","o":["Mumbai","Bangalore","Punjab","New Delhi"],"a":3,"e":"New Delhi. National Anti-Doping Agency (NADA) was set up as a registered society under the Societies Registration Act of 1860 to regulate dope control programmes to promote education and research and create awareness about doping and its ill effects. The World Anti-Doping Agency (WADA, 1999) was set up under the International Olympic Committee and recognised by the UNESCO International Convention against Doping in Sport (2005).","s":""},{"n":1499,"t":"Organisation","q":"Forest Research Institute, Dehradun was established as Imperial Forest Research Institute. In which year was it established as \"Imperial Forest Research Institute\"?","o":["1905","1908","1907","1906"],"a":3,"e":"1906 . Forest Research Institute (FRI), DehraDun began as Forest School in 1878. Wildlife Institute of India (1982) headquarter - Dehradun. Central Tobacco Research Institute (1947) -Rajahmundry, All Indian Institute of Medical Science (1956) - New Delhi, Central Rice Research Institute (1946) -Cuttack, Central Leather Research Institute (1948) - Chennai, Central Potato Research Institute (1949) - Shimla, National Sugar Institute (1936) - Kanpur.","s":""},{"n":1500,"t":"Organisation","q":"Where is the headquarters of the Spices Board of India located?","o":["Bengaluru (Karnataka)","Kochi (Kerala)","Pune (Maharashtra)","Guntur (Andhra Pradesh)"],"a":1,"e":"Kochi (Kerala) . Spices Board is a statutory body constituted since 1987 under the Spices Board Act, 1986 by merging the erstwhile Cardamom Board and Spices Export Promotion Council under the administrative control of the Department of Commerce. Kerala is known as the spice garden of India.","s":""},{"n":1501,"t":"Organisation","q":"Consider the following statements regarding the Border Roads Organisation (BRO):\n1. The Border Roads Organisation (BRO) was founded in 1970 to develop and maintain roads in India’s border areas.\n2. Since 2015, the BRO has been functioning under the Ministry of Defence, and its Raising Day is celebrated on May 7 every year.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. BRO was founded in 1960, not 1970. In the beginning, BRO functioned under the Ministry of Road Transport and Highways, but since 2015, it has been under the administrative control of the Ministry of Defence. The BRO Raising Day is observed every year on 7th May to commemorate its foundation.","s":""},{"n":1502,"t":"Organisation","q":"Which is the governing body for Badminton in India ?","o":["Indian Badminton Agency","Indian Badminton Association","Badminton Association of India","Badminton Agency of India"],"a":2,"e":"Badminton Association of India - An association registered under the societies act. It was formed in 1934, and has been holding national-level tournaments in India since 1936. Headquarter - New Delhi. Badminton Tournaments: Thomas Cup, Uber Cup, Sudirman cup, Premier Badminton League, Yonex All England Open.","s":""},{"n":1503,"t":"Organisation","q":"Which institution launched a list of 50 iconic Indian heritage textiles?","o":["Ministry of textile","NITI Aayog","Ministry of Culture","UNESCO"],"a":3,"e":"UNESCO (United Nations Educational, Scientific and Cultural Organization). Established - 16 November 1945. Headquarters - Paris. Some important Indian Heritage Textiles: Toda embroidery and Sungadi (Tamil Nadu), Himroo weaves (Hyderabad), Bandha tie and dye weaving (Sambalpur, Odisha), Kunbi weaves (Goa).","s":""},{"n":1504,"t":"Organisation","q":"Consider the following statements :\n1. The Advanced Light Helicopter (ALH) Mk-III is an indigenously manufactured multi-role helicopter by DRDO.\n2. Hindustan Aeronautics Limited (HAL), established in 1940, has its headquarters in New Delhi.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. The Advanced Light Helicopter (ALH) Mk-III is an indigenously manufactured multi-role helicopter by Hindustan Aeronautics Limited (HAL). Hindustan Aeronautics Limited (HAL), established in 1940, has its headquarters in Bengaluru.","s":""},{"n":1505,"t":"Organisation","q":"Which political organization was banned in September 2022 by Government of India under the Unlawful Activities (Prevention) Act ?","o":["Khalistan Zindabad Force","Popular Front of India (PFI)","All Tripura Tiger Force","Jammu and Kashmir Islamic Front"],"a":1,"e":"Popular Front of India (PFI). This political party was Founded on 22 November 2006, Headquarters (New Delhi). The Ministry of Home Affairs (MHA) banned PFI for five years. All Tripura Tiger Force {founded on 11 July 1990, Headquarters (Bangladesh)}. Jammu Kashmir Liberation Front {founded in June 1976, Headquarters (Muzaffarabad, Pakistan occupied Kashmir (Pakistan)}.","s":""},{"n":1506,"t":"Organisation","q":"The headquarters of the National Institute of Oceanography of India is located at:","o":["New Delhi","Hyderabad","Kanyakumari","Goa"],"a":3,"e":"Goa. National Institute of Oceanography (NIO) of India -headquartered at Dona Paula, Goa. regional offices in Kochi, Mumbai, and Vizag. It is one of the 38 constituent laboratories of the Council of Scientific & Industrial Research (CSIR), New Delhi. NIO was founded on 1 January 1966.","s":""},{"n":1507,"t":"Organisation","q":"The Indian Institute of remote sensing was established at:","o":["Khadakwasla","Shimla","Dehradun","Kochi"],"a":2,"e":"Dehradun. Aryabhatta Research Institute of Observational Sciences (ARIES) in Nainital, Uttarakhand. National Remote Sensing Centre (NRSC) in Hyderabad. Space Applications Centre (SAC) in Ahmedabad, Gujarat. Satish Dhawan Space Centre SHAR (SHAR or SriHarikota Range) in Nellore district, Andhra Pradesh.","s":""},{"n":1508,"t":"Organisation","q":"Who has become the first woman director general of the Council of Scientific and Industrial Research?","o":["Sanjay Verma","Vinod Aggarwal","Nallathamby Kalaiselvi","Prakash Chand"],"a":2,"e":"Nallathamby Kalaiselvi. Council of Scientific and Industrial Research (CSIR): Founded: 26 September 1942, Headquarters: New Delhi.","s":""},{"n":1509,"t":"Organisation","q":"The abbreviation “CPCL” is associated with the petroleum industry in India. Expand “CPCL”:","o":["Central Petroleum Corporation Limited","Coimbatore Petroleum Corporation Limited","Chennai Petroleum Corporation Limited","Corporation of Petroleum and Chemicals Limited"],"a":2,"e":"Chennai Petroleum Corporation Limited (CPCL) is a subsidiary of Indian Oil Corporation which is under the ownership of the Ministry of Petroleum and Natural Gas of the Government of India. Headquarters: Chennai, Founded: 18 November 1965.","s":""},{"n":1510,"t":"Organisation","q":"____ is the centre for the Indian Institution of Soil Science.","o":["Porbandar","Bhopal","Visakhapatnam","Bhubaneswar"],"a":1,"e":"Bhopal. The Indian Institute of Soil Science (IISS) was established in 1988 under the umbrella of the Indian Council of Agricultural Research (ICAR) by the Ministry of Agriculture. Location: Bhopal. Indian Institute of Rice Research - Hyderabad. Indian Institute of Wheat and Barley Research - Karnal.","s":""},{"n":1511,"t":"Organisation","q":"Consider the following statements:\n1. The General Agreement on Tariffs and Trade (GATT) was established in 1948 with 23 founding countries to regulate international trade in goods.\n2. GATT was replaced by the World Trade Organization (WTO) on 1st January 1995 under the Marrakesh Agreement, with its headquarters in Geneva, Switzerland.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The General Agreement on Tariffs and Trade (GATT), signed in Geneva in 1947 and effective from 1948 to promote international trade by reducing tariffs and ensuring equal opportunities, was replaced by the World Trade Organization (WTO) on 1st January 1995 through the Marrakesh Agreement, with its headquarters in Geneva, Switzerland, and currently (2025) has 164 member countries.","s":""},{"n":1512,"t":"Organisation","q":"______ was established in 1948 with 23 countries as a global trade organization to administer all multilateral trade agreements.","o":["World Trade Organization","International Reciprocal Trade Association","General Agreement on Tariffs and Trade","World Chamber of Commerce"],"a":2,"e":"General Agreement of Tariffs and Trade . Its purpose was to liberalize trade by reducing tariffs and reducing quotas among member countries. It was replaced by the World Trade Organisation in 1995.","s":""},{"n":1513,"t":"Organisation","q":"Where is the Indian Institute of Skiing and Mountaineering situated ?","o":["Dalhousie","Gulmarg","Manali","Uttarkashi"],"a":1,"e":"Gulmarg, Jammu and Kashmir. The best mountaineering institutes in India. Nehru Institute of Mountaineering, Uttarkashi, Uttarakhand. Himalayan Mountaineering Institute, Darjeeling (West Bengal), Atal Bihari Vajpayee Institute of Mountaineering and Allied Sports, Manali (Himachal Pradesh), Jawahar Institute of Mountaineering & Winter Sports, Pahalgam (Jammu and Kashmir), National Institute of Mountaineering and Allied Sports, Dirang (Arunachal Pradesh), Sonam Gyatso Mountaineering Institute, Gangtok (Sikkim) etc.","s":""},{"n":1514,"t":"Organisation","q":"When was the Lalit Kala Akademi established?","o":["1965","1956","1951","1954"],"a":3,"e":"1954. Lalit Kala Akademi, National Academy of Art, New Delhi was set up by the Government of India as an autonomous body, on 5th August 1954 by the then Honourable Minister for Education, Maulana Abul Kalam Azad.","s":""},{"n":1515,"t":"Organisation","q":"Which organisation was created in 1988 by the World Meteorological Organization (WMO) and the United Nations Environment Program (UNEP) to assess the science related to climate change?","o":["Intergovernmental Panel on Climate Change (IPCC)","International Climate Action Network (ICAN)","Global Climate Growth Institute (GCGI)","Australian Youth Climate Coalition (AYCC)"],"a":0,"e":"Intergovernmental Panel on Climate Change (IPCC)- Headquarters: Geneva; Founder: Bert Bolin; Founded:\n1988. ICAN- Formation: 1989; Headquarters: Bonn; Founder: Michael Oppenheimer. Global Green Growth Institute- Formation: 2010; Headquarters: Seoul. AYCC- Formation : 2006; Headquarters : Melbourne.","s":""},{"n":1516,"t":"Organisation","q":"Which of the following is an Indian ‘not for profit’ organization, working on sustainable solutions to make sanitation and water accessible to all?","o":["Pratham","Helpage India","Goonj","Sulabh International"],"a":3,"e":"Sulabh International was founded by Bindeshwar Pathak (Padma Vibhushan 2024). Pratham is an innovative learning organization created to improve the quality of education in India. HelpAge India is an Indian organization focused on the concerns of elders. Goonj is channelising the unused material lying idle in urban homes, to the far-flung villages of India as an important economic resource.","s":""},{"n":1517,"t":"Organisation","q":"In which year was the National Archives of India established?","o":["1840","1830","1891","1835"],"a":2,"e":"1891. The National Archives of India is the custodian of the records of the enduring value of the Government of India. Established at Calcutta (Kolkata) as the Imperial Record Department. It is the biggest archival repository in South Asia.","s":""},{"n":1518,"t":"Organisation","q":"What is the name of the Centre for the Study of Culture and Civilization in Shimla?","o":["International Centre","Abdul Kalam Centre","Tagore Centre","Nehru Centre"],"a":2,"e":"Tagore Centre. It was established in 2013. Former President Pranab Mukherjee inaugurated it at the Indian Institute of Advanced Studies (IIAS, established - 1964) in Shimla (Himachal Pradesh).","s":""},{"n":1519,"t":"Organisation","q":"Consider the following statements regarding CITES (Convention on International Trade in Endangered Species of Wild Fauna and Flora):\n1. India became a signatory to CITES in 1975 to protect endangered plants and animals.\n2. The headquarters of CITES is located in New York, USA. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. India joined CITES in 1975, the year it came into force. The headquarters of CITES is in Geneva, Switzerland. CITES regulates international trade in endangered species to prevent their over-exploitation.","s":""},{"n":1520,"t":"Organisation","q":"Where is the headquarters of the International Hockey Federation (FIH) located?","o":["Australia","Nepal","Switzerland","Bhutan"],"a":2,"e":"Switzerland. The International Hockey Federation is the governing body for the sport of hockey. Founded: 1924 in Paris (France). The Indian Hockey Federation (IHF): Formed - 1925, Headquartered in New Delhi.","s":""},{"n":1521,"t":"Organisation","q":"In which of the following states is the headquarters of IDBI (Industrial Development Bank of India) located?","o":["Haryana","Maharashtra","Karnataka","West Bengal"],"a":1,"e":"Maharashtra (Mumbai). IDBI was constituted under the Industrial Development Bank of India Act, 1964. An industrial bank is a state-chartered, financial institution, owned by a commercial firm, that is not regulated by a federal banking agency.","s":""},{"n":1522,"t":"Organisation","q":"Consider the following statements about the Badminton World Federation (BWF):\n1. The headquarters of BWF is located in Munich, Germany..\n2. The Badminton World Federation was originally founded in 1934 as the International Badminton Federation (IBF).\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The Badminton World Federation (BWF), originally founded in 1934 as the International Badminton Federation (IBF) with 9 member nations (Canada, Denmark, England, France, Ireland, Netherlands, New Zealand, Scotland, and Wales), was renamed BWF in 2006, is headquartered in Kuala Lumpur, Malaysia, and serves as the global governing body of badminton, organizing major events like the Thomas Cup, Uber Cup, Sudirman Cup, and World Championships.","s":""},{"n":1523,"t":"Organisation","q":"Which of the following organizations releases the Global Innovation Index?","o":["WEF","INSEAD, Cornell University, WIPO","UNDP","WTO"],"a":1,"e":"The Global Innovation Index was started in 2007 by INSEAD and World Business .","s":""},{"n":1524,"t":"Organisation","q":"In which of the following countries is the headquarters of the International Table Tennis Federation situated?","o":["Japan","Thailand","England","Switzerland"],"a":3,"e":"Switzerland . The International Table Tennis Federation (ITTF) was founded in 1926 by William Henry Lawes.","s":""},{"n":1525,"t":"Organisation","q":"National Rifle Association of India was founded in:","o":["1956","1964","1951","1948"],"a":2,"e":"1951. National Rifle Association of India (NRAI) a view to promote and popularize the shooting sports in India.","s":""},{"n":1526,"t":"Organisation","q":"India joined the United Nations after ratifying the UN Charter in ______.","o":["May 1946","December 1945","October 1945","February 1946"],"a":2,"e":"October 1945. India joined the United Nations and was among the 50 countries to sign it.","s":""},{"n":1527,"t":"Organisation","q":"Consider the following statements about the Panchsheel Agreement (1954) :\n1. The Panchsheel Agreement was signed between India and Russia in 1950.\n2. One of its principles was mutual respect for each other’s territorial integrity and sovereignty.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The Panchsheel Agreement was signed on 29 April 1954 between Jawaharlal Nehru (India) and Zhou Enlai (China). It laid down Five Principles of Peaceful Coexistence (Panchsheel). Five principles : Mutual respect for each other’s territorial integrity and sovereignty; Mutual non-aggression; Mutual non-interference in each other’s internal affairs; Equality and mutual benefit; Peaceful coexistence. This agreement became the basis of India–China relations in the 1950s and later influenced the Non-Aligned Movement (NAM).","s":""},{"n":1528,"t":"World G.K.","q":"What is a major difficulty in the data collection process for the Happiness Index across different countries ?","o":["Recording trade statistics accurately","Lack of financial resources for advertising","Language barriers in economic treaties","Ensuring consistent and uniform survey methods globally"],"a":3,"e":"Ensuring consistent and uniform survey methods globally. Major difficulty in data collection : Uniformity in data collection is hard to achieve because survey methods, cultural interpretations, and responses vary across regions. Example: The meaning of \"happiness\" differs across societies, leading to differences in how people respond to survey questions. Differences in literacy, awareness, and willingness to respond truthfully further complicate data collection.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1529,"t":"World G.K.","q":"How many key variables are used in the World Happiness Report to explain happiness levels ?","o":["6","4","10","8"],"a":0,"e":"6 . The World Happiness Report released by the United Nations Sustainable Development Solutions Network (UN SDSN) explains happiness levels using 6 key variables. These are: GDP per capita - Economic prosperity of a country. Social support - Availability of help during times of trouble. Healthy life expectancy - Average lifespan with good health. Freedom to make life choices -Ability to decide one’s way of living. Generosity - Willingness to share and help others. Perceptions of corruption -Trust in government and businesses. These six factors are combined with survey responses to rank countries on happiness levels globally.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1530,"t":"World G.K.","q":"Which of the following is NOT a direct outcome of using the Happiness Index?","o":["Monitoring population growth","Creating education policies","Improving healthcare services","Enhancing social services"],"a":0,"e":"Monitoring population growth. The Happiness Index (used in global and national well-being studies) measures factors like life expectancy, health, education quality, income levels, social support, and good governance. Its outcomes help governments frame better education policies, improve healthcare systems, and strengthen social services to enhance overall well-being. However, it does not directly measure or monitor population growth, which is studied through demographic tools like the census or population surveys.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1531,"t":"World G.K.","q":"Which of the following initiatives was launched by the BRICS countries ?","o":["The North Atlantic Treaty Organization (NATO)","The New Development Bank (NDB)","The World Trade Organization (WTO)","The International Monetary Fund (IMF)"],"a":1,"e":"The New Development Bank (NDB). The New Development Bank (NDB) was established by BRICS countries (Brazil, Russia, India, China, and South Africa) in 2014 (Fortaleza Summit). Headquarters: Shanghai, China. Aim: To fund infrastructure and sustainable development projects in BRICS and other emerging economies. Major BRICS Initiatives: Contingent Reserve Arrangement (2014),","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":1532,"t":"World G.K.","q":"According to the classification of modern Indian languages, which linguistic family accounts for the largest share of the Indian population?","o":["Sino-Tibetan (Kirata)","Dravidian","Austric (Nishada)","Indo-European (Aryan)"],"a":3,"e":"Indo-European (Aryan). Indian languages are broadly classified into four major language families: Indo-European (Indo-Aryan branch in India) – Spoken by about 75–78% of Indians. Includes Hindi, Bengali, Marathi, Gujarati, Punjabi, Assamese, Oriya, Sindhi, Konkani, Kashmiri, Sanskrit, etc. Dravidian – Spoken by about 20–22% of Indians. Includes Tamil, Telugu, Kannada, Malayalam, etc. Austric (Austro-Asiatic / Nishada) – Spoken by about 1.5% of Indians.Includes Santhali, Mundari, Ho, Khasi, etc. Sino-Tibetan (Kirata) – Spoken by about 1% of Indians. Includes Bodo, Naga, Manipuri, etc. Thus, the Indo-European (Indo-Aryan) family has the largest share, covering most of North, West, and East India.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":1533,"t":"World G.K.","q":"Match the following neighbouring countries with their official languages correctly. Country name Official Languages\n1. Afghanistan a. Dzongkha\n2. Bhutan b. Burmese\n3. Pakistan c. Dari\n4. Myanmar d. Urdu","o":["1-c, 2-a, 3-b, 4-d","1-c, 2-a, 3-d, 4-b","1-c, 2-d, 3-a, 4-b","1-a, 2-c, 3-d, 4-b"],"a":1,"e":"1-c, 2-a, 3-d, 4-b. Country and Official language: Bangladesh (Bengali), Israel (Hebrew), Maldives (Dhivehi), Netherlands (Dutch), Portugal (Portuguese), Saudi Arabia (Arabic), Sri Lanka (Sinhala and Tamil).","s":""},{"n":1534,"t":"World G.K.","q":"Which country’s national game is Chinlone (Caneball)?","o":["Myanmar","China","Afghanistan","Bhutan"],"a":0,"e":"Myanmar. The Chinlone game is non-competitive, with typically six people playing together as one team. Other countries' National Game : China -Table tennis; Afghanistan - Buzkashi; Bhutan - Archery; Pakistan - Field Hockey; Bangladesh - Kabaddi; Nepal - Volleyball. India had not declared any sport or game as the national sport.","s":""},{"n":1535,"t":"World G.K.","q":"In which country do Kachin, Karen, Karenni, Chin and Mon ethnic groups belong?","o":["Nepal","Myanmar","Afghanistan","Sri Lanka"],"a":1,"e":"Myanmar. Ethnic Groups: Nepal (Chhetri, Bahun, Magar, Rana Tharu, Tamang, Newar, Gurung). Afghanistan (Pashtun, Hazaras, Turkemens, Uzbeks, Nuristanis). SriLanka (Sinhalese, Sri Lankan Moors, Sri Lanka Kaffirs).","s":""},{"n":1536,"t":"World G.K.","q":"Match India’s neighbouring countries in column A with their official languages in columnB.\nColumn A Column B (Country names) (Official Languages)\n1. Sri Lanka a. Mandarin\n2. China b. Burmese\n3. Myanmar c. Tamil\n4. Bhutan d. Dzongkha","o":["1-d, 2-a, 3-b, 4-c","1-b, 2-a, 3-c, 4-d","1-a, 2-b, 3-c, 4-d","1-c, 2-a, 3-b, 4-d"],"a":3,"e":"1-c, 2-a, 3-b, 4-d. Official languages of India's neighboring countries: Afghanistan - Dari and Pashto, Bangladesh - Bengali, Nepal - Nepali, Pakistan - Urdu, Sri Lanka - Sinhala and Tamil, Maldives - Dhivehi.","s":""},{"n":1537,"t":"World G.K.","q":"Who is known as the 'Father of Bangladesh' from the following options ?","o":["Sheikh Mujibur Rahman","Ataur Rahman Khan","Muhammad Habibur Rahman","Sheikh Hasina"],"a":0,"e":"Sheikh Mujibur Rahman (First President of Bangladesh). Bangladesh: First Prime Minister -Tajuddin Ahmad. First female prime minister - Khaleda Zia. Personalities and their nicknames - Grand Old man of India (Dadabhai Naoroji), Indian Einstein (Nagarjuna), Man of Peace (Lal Bahadur Shastri), Morning Star of India Renaissance (Raja Ram Mohan Roy), Machiavelli of India (Chanakya), Bengal Kesari (Ashutosh Mukherji).","s":""},{"n":1538,"t":"World G.K.","q":"Soparrkar and the logo of his worldwide initiative 'Dance for a Cause' are being printed on an official postage stamp issued by the _______ government.","o":["Nepal","Bangladesh","Sri Lanka","Bhutan"],"a":3,"e":"Bhutan. In 2008 Sandip Soparrkar had launched his Initiative Dance for a Cause at the World Economic forum in Davos, Switzerland. The First Stamp of Independent India was issued on 21 November 1947. It depicts the Indian Flag with the patriots' slogan, Jai Hind. The first postal stamp in India was introduced on 1 July 1852 under the Governor General Lord Dalhousie.","s":""},{"n":1539,"t":"World G.K.","q":"Which religion has the maximum number of followers in Bhutan?","o":["Hindu","Islam","Buddhism","Christian"],"a":2,"e":"Buddhism . Other religions in Bhutan: 2nd largest religion in Bhutan - Hinduism followed by Christianity.","s":""},{"n":1540,"t":"World G.K.","q":"Which of the following ethnic groups are the largest in Myanmar?","o":["Karen","Bamar","Rohingya","Shan"],"a":1,"e":"Bamar. Myanmar ethnic groups - Karen, Shan, Mon, Chin, Kachin, Rohingya, Rakhine. Other largest Ethnic Groups : Punjabis - Pakistan, Pashtuns -Afghanistan, Yamato - Japan, Inuit -Greenland, Khalkh - Mongolia, Bantu -Central, East and Southern Africa, Han -China.","s":""},{"n":1541,"t":"World G.K.","q":"Consider the following statements regarding national fruits :\n1. Jackfruit is the national fruit of Bangladesh.\n2. Mango is the national fruit of both India and Pakistan.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. National fruits and Countries: India (Mango), Nepal (Raspberry), Saudi Arabia (Dates), Serbia (Plum), Singapore (Durian), Ukraine (cherry), Vietnam (Dragon fruit), Canada -(Blueberries), Afghanistan (Pomegranate), New Zealand (Kiwifruit), Pakistan (Mango - Summer and Guava -Winter).","s":""},{"n":1542,"t":"World G.K.","q":"Which of the following cities of Nepal does NOT have a branch of 'Indian Citizens Association of Nepal'?","o":["Pokhara","Lalitpur","Bhairahawa","Damak"],"a":1,"e":"Lalitpur. An Indian Citizens' Association (ICA) of Nepal was formed on 14 September 1990.","s":""},{"n":1543,"t":"World G.K.","q":"According to the World Meteorological Organization report reviewed during 2010-2012, the highest registered shade temperature of ________ was recorded at Al Aziziyah, Libya.","o":["58°C","68°C","50°C","72°C"],"a":0,"e":"58°C. WMO (World Meteorological Organization): Formation - 23 March 1950, Headquarters - Geneva, Switzerland.","s":""},{"n":1544,"t":"World G.K.","q":"One of the major hubs of information technology is Silicon valley. which is situated in ___________ .","o":["Tokyo","London","New york","California"],"a":3,"e":"California. Silicon Valley is the biggest hub of the IT industry in the world (Presence of biggest technology companies). Silicon valley of India -Bengaluru.","s":""},{"n":1545,"t":"World G.K.","q":"Which continent of the world is referred to as a \"Contin
