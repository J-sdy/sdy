ent, Dedicated to Science\" ?","o":["Africa","Antarctica","North America","Asia"],"a":1,"e":"Antarctica (the southernmost continent) - It is the only continent with no permanent human habitation. There are 7 continents in the world : Asia, Europe, Africa, North America, South America, Antarctica and Australia. India is located in the southern part of the Asian continent.","s":""},{"n":1546,"t":"World G.K.","q":"Consider the following statements regarding jute production:\n1. India is the largest producer of jute in the world, with West Bengal as the leading state.\n2. Bangladesh is the largest producer of jute in the world, while India ranks second.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. India is the largest producer of jute globally, followed by Bangladesh. West Bengal is the leading jute-producing state in India. Bangladesh, however, is the largest exporter, not the largest producer.","s":""},{"n":1547,"t":"World G.K.","q":"Which of the following neighbours of India has the highest population density?","o":["Bangladesh","Sri Lanka","China","Pakistan"],"a":0,"e":"Bangladesh. According to the United Nations Department of Economics and Social Affairs (UN -DESA), India overtakes China as the world’s most populous country (As of April 2023).","s":""},{"n":1548,"t":"World G.K.","q":"Before being renamed, Mount Everest was simply known as ______.","o":["Peak IX","Peak XV","Peak XII","Peak VI"],"a":1,"e":"Peak XV. Mount Everest is a peak in the Himalayan mountain range. It is located between Nepal and Tibet. The mountain was named after George Everest, a former Surveyor General of India. The Tibetan name is Chomolungma, which means “Mother Goddess of the World.” The Nepali name is Sagarmatha. In 1953 Edmund Hillary and Tenzing Norgay were the first persons to climb Mount Everest.","s":""},{"n":1549,"t":"World G.K.","q":"The town of Paro is a famous tourist destination of ______.","o":["Sri Lanka","Bangladesh","Bhutan","India"],"a":2,"e":"Bhutan. Paro is a valley town in Bhutan, west of the capital, Thimphu. This town is famous for its Druk Choeding temple which was built by Ngawang Chogyel, the prince-abbots of Ralung in Tibet in 1525.","s":""},{"n":1550,"t":"World G.K.","q":"In which of the following years was ADB (Asian Development Bank) established?","o":["1978","1980","1966","1959"],"a":2,"e":"1966. Asian Development Bank (ADB) - Headquarters: Manila, Philippines.","s":""},{"n":1551,"t":"World G.K.","q":"A gold lion passenger holding a sword in its right forepaw, is the national symbol of ______.","o":["Sri Lanka","Bhutan","Myanmar","Pakistan"],"a":0,"e":"Sri Lanka. The Sinha Flag or Lion Flag consists of a golden lion holding a kastane sword in its right fore-paw in a maroon background with four gold box leaves, one in each corner.","s":""},{"n":1552,"t":"World G.K.","q":"The international agreement Montreal Protocol is related to:","o":["Wildlife","Ramsar sites","the ozone layer","World Heritage sites"],"a":2,"e":"Ozone Layer. Montreal Protocol is an international agreement made in 1987. It was designed to stop the production and import of ozone -depleting substances and reduce their concentration in the atmosphere to help protect the earth's ozone layer.","s":""},{"n":1553,"t":"World G.K.","q":"Which one of the following was the last imperial dynasty to rule China ?","o":["Ming dynasty","Qing dynasty","Yuan dynasty","Sui dynasty"],"a":1,"e":"Qing dynasty or the Qing Empire, officially the Great Qing. It was established in 1636 and ruled China from 1644 to 1912.","s":""},{"n":1554,"t":"World G.K.","q":"In which year was Bank of Bhutan Limited, the oldest bank of Bhutan, established?","o":["1956","1971","1947","1968"],"a":3,"e":"1968 . Bank of Bhutan (BoB) was established by a Royal Charter. Bhutan is a landlocked country in South Asia and its capital is Thimphu.","s":""},{"n":1555,"t":"World G.K.","q":"New Development Bank (NDB) is a multilateral development bank established in 2014. How many countries are members of NDB?","o":["25","12","9","5"],"a":3,"e":"5. The five founding members of the New Development Bank include Brazil, Russia, India, China, and South Africa. Headquarters: Shanghai, China.","s":""},{"n":1556,"t":"World G.K.","q":"In which year did Gongsa Ugyen Wangchuck become the first monarch of Bhutan?","o":["1901","1910","1905","1907"],"a":3,"e":"1907 . Ugyen Wangchuck was the first Druk Gyalpo (King of Bhutan) from 1907 to 1926.","s":""},{"n":1557,"t":"World G.K.","q":"Which one of the following is the largest valley in Asia?","o":["Alai valley","Dang valley","Chuy valley","Fergana valley"],"a":1,"e":"Dang valley . It lies between the Mahabharat Range in the north and the Churia Range in the south.","s":""},{"n":1558,"t":"World G.K.","q":"Consider the following statements regarding uranium production:\n1. Kazakhstan is the largest producer of uranium in the world.\n2. Canada and Australia, along with Kazakhstan, contribute nearly two-thirds of the world’s uranium production.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Kazakhstan is the world’s largest uranium producer. Together with Canada and Australia, it accounts for about two-thirds of global uranium production.","s":""},{"n":1559,"t":"World G.K.","q":"Tummalapalle, believed to have one of the largest uranium reserves in the world, is situated in which of the following states?","o":["Karnataka","Tamil Nadu","Telangana","Andhra Pradesh"],"a":3,"e":"Andhra Pradesh. The Tummalapalle Mine is a uranium mine in Tummalapalli village located in Kadapa of the Indian state of Andhra Pradesh.","s":""},{"n":1560,"t":"World G.K.","q":"New Delhi's Lotus Temple was designed by an architect from ______.","o":["Germany","Iran","UAE","Japan"],"a":1,"e":"Iran. The Bahai Lotus temple (1986) in New Delhi was designed by Iranian architect Fariborz Sahba in the shape of a lotus as it is common to several religions including Hinduism and Buddhism.","s":""},{"n":1561,"t":"World G.K.","q":"Which of the following is the second largest artificial lake in Asia?","o":["Chilika Lake in Odisha","Chandubi Lake in Assam","Kolleru Lake in Andhra Pradesh","Dhebar Lake in Rajasthan"],"a":3,"e":"Dhebar Lake in Rajasthan. Miyun Reservoir is the largest artificial lake in Asia.","s":""},{"n":1562,"t":"World G.K.","q":"The ______ in China is the world’s longest man-made waterway.","o":["Corinth Canal","Kiel Canal","Suzhou Canal","Grand Canal"],"a":3,"e":"Grand Canal. The waterway is the link of the Yellow river and Yangtze River.","s":""},{"n":1563,"t":"Computer","q":"Match the networking devices with the OSI layer they operate on :\nColumn A (Device) Column B (Layer) Repeater Network Layer Switch Data Link Layer Router Transport Layer Gateway Physical Layer","o":["1–D, 2–B, 3–A, 4–C","1–C, 2–D, 3–B, 4–A","1–A, 2–C, 3–D, 4–B","1–B, 2–A, 3–C, 4–D"],"a":0,"e":"1–D, 2–B, 3–A, 4–C. A repeater (Layer 1) regenerates and amplifies signals, working only with raw bits. A switch (Layer 2) forwards frames using MAC addresses, reducing collisions and improving LAN efficiency. A router (Layer 3) forwards packets using IP addresses, providing routing and path selection between networks. A gateway (Layer 4 or higher) acts as a protocol converter, enabling communication between different systems like email or VoIP.","s":""},{"n":1564,"t":"Computer","q":"Consider the following statements regarding WAN protocols:\n1. High-Level Data Link Control (HDLC) is a protocol commonly used for data encapsulation in Wide Area Networks (WANs).\n2. Ethernet is the most widely used protocol for encapsulation in WAN connections. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → Ethernet is primarily used in LANs (Local Area Networks), not for WAN encapsulation.","s":""},{"n":1565,"t":"Computer","q":"What does QR in 'QR code' stand for?","o":["Quick Response","Quick Resolution","Quantum Read","Query Response"],"a":0,"e":"Quick Response. A QR code is a type of barcode that can be read easily by a digital device and which stores information as a series of pixels in a square-shaped grid.","s":""},{"n":1566,"t":"Computer","q":"Which browser extension could be used to download an entire web page for offline use?","o":["Grammarly","Evernote","AdBlock","Web ScrapBook"],"a":3,"e":"Web ScrapBook. It captures web pages to local devices or backend servers for future retrieval, organization, annotation, and editing.","s":""},{"n":1567,"t":"Computer","q":"Which of the following is considered the first mechanical computer designed by Charles Babbage?","o":["ENIAC","Analytical Engine","Abacus","UNIVAC"],"a":1,"e":"Analytical Engine. It was proposed in 1837. It featured an Arithmetic Logic Unit (ALU), programmatic flow control (like loops and conditional branching), and used punched cards for programmability.","s":""},{"n":1568,"t":"Computer","q":"Consider the following statements regarding Windows OS keyboard shortcuts:\n1. The shortcut key F2 is commonly used to rename a file or folder.\n2. The shortcut key Alt + Enter is used to open the properties dialog box of a selected file or folder. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 . A standard PC keyboard has 12 function keys, labeled F1 through F12, in the top row of the keyboard.","s":""},{"n":1569,"t":"Computer","q":"Keyboard shortcut to Save as document in MS Word 2019 is:","o":["F10","F11","F12","F9"],"a":2,"e":"F12. Shortcut Keys in MS Word 2019: F1: Opens Help, F2: Moves text or objects (similar to Cut), F3: Inserts the AutoText entry, F4: Repeats the last action, F5: Opens the Find and Replace dialog box with the Go To tab active.","s":""},{"n":1570,"t":"Computer","q":"Consider the following statements about MS Word shortcuts:\n1. Ctrl + Z is used to undo the last action.\n2. Ctrl + Y is used to redo the last undone action.\n3. Ctrl + A is used to delete the last action. Which of the statements given above are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Statement 3 – Incorrect: Ctrl + A is used to select all text, not delete.","s":""},{"n":1571,"t":"Computer","q":"What application software is utilised for managing extensive data collections and executing queries?","o":["Antivirus software","Database management system software","Word processing software","Paint"],"a":1,"e":"Popular DBMS Software: Relational DBMS (RDBMS) - Oracle Database, MySQL, PostgreSQL, Microsoft SQL Server. NoSQL DBMS (Non-Relational Databases) - MongoDB, Cassandra, Redis. Cloud-Based DBMS -Amazon RDS, Google Cloud Firestore, Azure SQL Database.","s":""},{"n":1572,"t":"Computer","q":"In symmetric encryption, how many keys are used to encrypt and decrypt data?","o":["Three Keys","No Key","One Key","Two Keys"],"a":2,"e":"One Key. Symmetric encryption (or “private key” encryption) is called “private key” because the use of a single encryption key necessitates that the key is always kept private.","s":""},{"n":1573,"t":"Computer","q":"What is the function of the CPU after the DMA transfer starts?","o":["As long as the transfer is handled by the DMA controller, it is free to perform other tasks.","It plays a role in the entire data transfer.","It remains inactive until the DMA transfer is completed.","It actively manages each byte transferred."],"a":0,"e":"Direct Memory Access (DMA) is a technique that allows data to be transferred between memory and input/output devices without involving the processor.","s":""},{"n":1574,"t":"Computer","q":"Which of the following best describes the primary difference between broadband and dial-up Internet connections?","o":["Dial-up requires a cable connection, while broadband does not.","Broadband is only available in urban areas, while dial-up is available everywhere.","Dial-up uses a telephone line, while broadband uses various technologies for higher speeds.","Broadband is slower than dial-up."],"a":2,"e":"Dial-up: Uses a traditional telephone line to connect to the internet. This method is slow and can be interrupted by phone calls. Broadband: Uses various technologies like cable, fiber optic, or DSL to provide high-speed internet access. It offers significantly faster speeds than dial-up and is not interrupted by phone calls. Examples of Internet Service Providers (Broadband): Jio, Airtel, Vi, BSNL, Atria Convergence Technologies, Hathway, Exitel Broadband.","s":""},{"n":1575,"t":"Computer","q":"Average function is listed in the drop - down menu of which of the following tools?","o":["Move function","Insert function","Financial function","Auto Sum function"],"a":3,"e":"Auto Sum function. The Average function is typically listed in the AutoSum function drop-down menu in spreadsheet software like Microsoft Excel. The AutoSum function provides a quick way to calculate common functions like Sum, Average, Count, Max, and Min.","s":""},{"n":1576,"t":"Computer","q":"Which of the following are needed for Skype to function on a computer? (1) A web cam (2) A microphone (3) A speaker","o":["Only 1 and 2","Only 2 and 3","1, 2 and 3","Only 1 and 3"],"a":2,"e":"1, 2 and 3. Skype is a communication platform that allows users to make voice and video calls, send instant messages, and share files over the internet.","s":""},{"n":1577,"t":"Computer","q":"Consider the following statements about Microsoft Excel default settings:\n1. The default width of a column in MS-Excel is set to approximately 8 characters (8.43 units or ~64 pixels).\n2. The default row height in MS-Excel is 20 points (about 28 pixels). Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → The actual default row height is 15 points (~20 pixels), not 20 points In Microsoft Excel, the default width of a column is set to accommodate 8.43 characters, which is approximately 64 pixels. Here are some of the default settings in Microsoft Excel: Row Height: 15 points (or about 20 pixels). Font: Calibri, Font Size: 11. Cell Alignment: Horizontal Alignment- General , Vertical Alignment- Bottom. Cell Fill Color: No fill (white background). Page Margins: 1 inch (2.54 cm) on all sides. Zoom Level: 100%.","s":""},{"n":1578,"t":"Computer","q":"In MS Word, which option allows you to align text in a way that it appears vertically at the bottom of a cell or text box?","o":["Center Alignment","Justify Alignment","Bottom Alignment","Distributed Alignment"],"a":2,"e":"Bottom Alignment. This option ensures that the text is positioned at the bottom edge, leaving space above it. Center Alignment: Centers text horizontally in the cell or text box. Justify Alignment: Aligns text evenly along both the left and right margins. Distributed Alignment: Distributes text evenly across the width, with equal spacing between characters and words.","s":""},{"n":1579,"t":"Computer","q":"Symmetric encryption is also known as:","o":["public-key encryption","hybrid encryption","conventional encryption","asymmetric encryption"],"a":2,"e":"conventional encryption. Public key encryption, also known as public key cryptography. The Hybrid Encryption primitive combines the efficiency of symmetric encryption with the convenience of public key (asymmetric) cryptography. Asymmetric encryption is a security technique that uses two different keys to encrypt and decrypt data.","s":""},{"n":1580,"t":"Computer","q":"Which kind of computer security requires verifying the genuineness of the individuals or organisations that want to access a system?","o":["Authentication","Non-repudiation","Availability","Confidentiality"],"a":0,"e":"Authentication. Computer security (Cybersecurity), is the protection of computer systems and information from harm, theft, and unauthorized use.","s":""},{"n":1581,"t":"Computer","q":"In MS Word, which feature allows you to create different headers and footers for odd and even pages in a document?","o":["Different Odd & Even Pages","Page Breaks","Section Breaks","Different First Page"],"a":0,"e":"Different Odd & Even Pages. Microsoft Word is a word processor program developed by Microsoft. It was first released on October 25, 1983, under the name Multi-Tool Word for Xenix systems. Initial release - October 25, 1983.","s":""},{"n":1582,"t":"Computer","q":"On what type of data can MS Excel functions operate?","o":["External data sources only","Entire worksheets only","Range of cells or groups of cells","Individual cells only"],"a":2,"e":"Range of cells or groups of cells. MS Excel, a worksheet, also known as a spreadsheet, is a table into which you enter data and data label. Worksheet used in Excel documents is a collection of cells organized in rows and columns. It is the working surface you interact with to enter data. Each worksheet contains 1048576 rows and 16384 columns and serves as a giant table that allows you to organize information.","s":""},{"n":1583,"t":"Computer","q":"What will happen when you select the cell contents of a particular row in MS-Excel and then click the Delete button?","o":["First five cell entries will be deleted","Only first three cells will be deleted","Entire row will be deleted","Entries in all the selected cells will be deleted"],"a":3,"e":"Microsoft Excel is a spreadsheet editor developed by Microsoft for Windows, macOS, Android, iOS and iPadOS. It features calculation or computation capabilities, graphing tools, pivot tables, and a macro programming language called Visual Basic for Applications (VBA). Excel forms part of the Microsoft 365 suite of software.","s":""},{"n":1584,"t":"Computer","q":"Which of the following is the maximum file size that can be attached to an email message in Gmail?","o":["100 MB","200 MB","25 MB","50 MB"],"a":2,"e":"25 MB. Email (electronic mail) is the exchange of computer-stored messages from one user to one or more recipients via the internet.","s":""},{"n":1585,"t":"Computer","q":"Consider the following statements regarding Microsoft PowerPoint shortcut keys:\n1. The shortcut key Ctrl + M is used to insert a new slide in a presentation.\n2. The shortcut key Ctrl + D is used to duplicate the selected object or slide. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Microsoft PowerPoint is a presentation program, created by Robert Gaskins, Tom Rudkin and Dennis Austin at a software company named Forethought, Inc. Shortcut keys in Microsoft Powerpoint : Ctrl + I - Add or remove italics to selected text. Ctrl + N - Create a new slide. Ctrl + D - Duplicate the selected object or slide.","s":""},{"n":1586,"t":"Computer","q":"In MS-Word, a number printed above the base line is called ___________ .","o":["superscript","strikethrough","subscript","above BL"],"a":0,"e":"superscript. In Microsoft Word, a superscript is a number or text that is printed above the baseline, smaller than the regular text. It is often used to represent exponents, footnotes, or endnotes. Examples: 10 2̣ - 2 above 10 is called the superscript.","s":""},{"n":1587,"t":"Computer","q":"Consider the following statements about Microsoft Word page settings:\n1. The Moderate margin of a page in MS Word can be applied from the View tab.\n2. The Design tab in MS Word is used to set margins and page orientation. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Statement 1 is incorrect → The View tab is used for changing document views (Print Layout, Web Layout, Draft, etc.), not for setting margins. Statement 2 is incorrect → The Design tab controls document themes, watermarks, and colors, but not page margins or orientation.","s":""},{"n":1588,"t":"Computer","q":"In Microsoft Excel, which chart type is best suited for comparing proportions or percentages of a whole?","o":["Line Chart","Bar Chart","Scatter Chart","Pie Chart"],"a":3,"e":"Pie Chart: A circular chart divided into sectors, each representing a proportion or percentage of the whole.","s":""},{"n":1589,"t":"Computer","q":"Which of the following occupies less memory when saving an MS-Word file?","o":[".docx",".docm",".doc",".docc"],"a":0,"e":".docx file is a Microsoft Word document saved in the Open XML format. The .docx file extension is a combination of the words \"doc\" and \"xml\" and is an evolution of the older .doc format.","s":""},{"n":1590,"t":"Computer","q":"Consider the following statements about early computers and calculating devices:\n1. ENIAC, designed by John Mauchly and J. Presper Eckert in 1945–46, is regarded as the world’s first programmable general-purpose electronic digital computer.\n2. Pascaline, invented by Blaise Pascal in 1642, is considered the first programmable general-purpose computer. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → Pascaline was the world’s first mechanical calculator, not a programmable computer.","s":""},{"n":1591,"t":"Computer","q":"Which feature in MS Word allows you to see a document's layout and formatting as it will appear when printed?","o":["Screen View","Draft View","Print Preview","Reading View"],"a":2,"e":"Print Preview. Draft View: Simplified view for editing, without layout details. Reading View: Optimized for on-screen reading, not editing.","s":""},{"n":1592,"t":"Computer","q":"In a spreadsheet, page orientation is changed through _________.","o":["paper dialog box","print dialog box","page setup dialog box","format dialogue box"],"a":2,"e":"page setup dialog box. This dialog box allows you to adjust various page settings, including: Page orientation (landscape or portrait), Paper size, Margins, Headers and footers, Print area.","s":""},{"n":1593,"t":"Computer","q":"Which of the following steps is used to format a cell in an MS Excel Spreadsheet?","o":["Select cell → Right click → Format cell","View Select cell → Format","Select cell → View → Format cell","Menu → Select cell → Format"],"a":0,"e":"In Excel, cell alignment is how your text or numbers are positioned in the cell. You can align vertically, meaning towards the top, the middle or the bottom. And also align horizontally, meaning to the left, the center or to the right.","s":""},{"n":1594,"t":"Computer","q":"Which of the following is NOT an alignment option for text in a cell ?","o":["Justified","Center","Left","Right"],"a":0,"e":"Justified alignment is typically used in paragraph formatting to align text to both the left and right margins. Common shortcut keys related to line alignment in MS Word: Horizontal Alignment: Ctrl + L = Left align, Ctrl + E = Center align, Ctrl + R = Right align, Ctrl + J= Justify align (in some applications).","s":""},{"n":1595,"t":"Computer","q":"How can we add text to a slide in MS-PowerPoint ?","o":["Note box","Dialogue box","Notes page","Textbox"],"a":3,"e":"Textbox. In Microsoft PowerPoint, a Text Box is a graphical element that allows you to add text to a slide. It's a container that holds text, and you can position it anywhere on the slide.","s":""},{"n":1596,"t":"Computer","q":"Rows in MS-Excel are identified by:","o":["timings","letters","numbers","numbers with letters"],"a":2,"e":"Numbers. In MS Excel, rows are named after numbers like 1, 2, 3, 4 etc. and the columns are named with capital letters A, B, C etc.","s":""},{"n":1597,"t":"Computer","q":"In Microsoft Word, which option allows you to exclude specific sections or types of text from the spelling and grammar check?","o":["spell check","Thesaurus","Exclusion Dictionary","AutoCorrect"],"a":2,"e":"Exclusion Dictionary. MS-WORD: It is an application component of MS-Office which is used to do document, brochure, invitation and book preparation. It enables us to prepare, modify, design and edit the desired documents. It was first released in 1983, under the name Multi-Tool Word for Xenix systems.","s":""},{"n":1598,"t":"Computer","q":"Consider the following statements regarding MS Excel\n1. The SUM function in Excel is used to add the values in a specified range of cells.\n2. The COUNT function in Excel returns the total sum of all numeric values in a given range. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → COUNT does not sum values; it only counts the number of numeric entries in the range.","s":""},{"n":1599,"t":"Computer","q":"The process of merging data from a data source into a main document in a word-processing application is called:","o":["data accumulation","mail merge","data concatenation","data integration"],"a":1,"e":"Mail Merge . Data Accumulation: Refers to the process of collecting and storing data. Data Concatenation: Means linking or combining data from multiple sources into a single sequence. Data Integration: Involves combining data from multiple sources into a unified view.","s":""},{"n":1600,"t":"Computer","q":"Which view in MS PowerPoint is useful for editing or formatting a single slide at a time?","o":["Normal view","Reading view","Outline view","Slide Sorter view"],"a":0,"e":"Normal view: Allows you to edit text and images, format slide elements, add animations and transitions, and focus on a single slide without distractions.","s":""},{"n":1601,"t":"Computer","q":"Which of the following represents the Two - Factor Authentication (2FA)?","o":["The use of two different credentials to verify identity","A tool for optimising system resources","A security measure to prevent physical damage to a PC","A technique for organising files and folders on a PC"],"a":0,"e":"Two-Factor Authentication (2FA) is a security process that requires two different credentials to verify an individual's identity.","s":""},{"n":1602,"t":"Computer","q":"What enables IoT devices to gather data and exchange it over the network?","o":["Biochip transponders","Data encryption techniques","Human interaction","Actuators and sensors"],"a":3,"e":"Actuators and sensors. The Internet of Things (IoT) refers to the interconnected network of physical devices, vehicles, appliances, and other objects embedded with sensors, software, and connectivity capabilities.","s":""},{"n":1603,"t":"Computer","q":"Consider the following statements about MS Office file extensions:\n1. The default extension of a Microsoft PowerPoint 2007 and later presentation is .pptx, while earlier versions used .ppt.\n2. The extension .docx is used for saving Microsoft Word documents, not PowerPoint files. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":1604,"t":"Computer","q":"In MS Word, which option allows you to insert a new column in a table while simultaneously shifting the existing columns to the right ?","o":["Insert Table","Insert Column to the Right","Insert Columns","Insert Column to the Left"],"a":1,"e":"Insert Column to the Right. In Microsoft Word: To add a column to the left of the cell, click Insert Left in the Rows and Columns group.","s":""},{"n":1605,"t":"Computer","q":"When a new text document is created in MS-Office 2016, the default text size of the document is _____.","o":["14 points","10 points","12 points","11 points"],"a":3,"e":"11 points. 11 point size means it is approximately 0.152778 inches. 72 points size means the text size equals 1 inch. The default font style in MS Word 2016 is Calibri. The default font and size can be changed in the Word Options or by selecting a different font or size for the document.","s":""},{"n":1606,"t":"Computer","q":"Which of the following is an input device?","o":["Keyboard","Speaker","Monitor","Printer"],"a":0,"e":"Keyboard. Input devices provide data to the computer, while output devices receive data from the computer and present it to the user. Examples of Input devices : keyboards, computer mice, scanners, cameras, joysticks, and microphones, etc. Examples of Output devices : Monitor, Printers, Headphone, Computer Speaker, Projector.","s":""},{"n":1607,"t":"Computer","q":"How can you access the Step by Step Mail Merge Wizard in Microsoft Word?","o":["Clicking on the Mailings tab","Pressing Ctrl + M","Pressing F12","Clicking on the File menu"],"a":0,"e":"Ctrl + M in Microsoft Word is used to indent a paragraph, not to start the Mail Merge Wizard. F12 opens the \"Save As\" dialog box in Microsoft Word, not developer tools (which happens in web browsers).","s":""},{"n":1608,"t":"Computer","q":"Consider the following statements regarding MS Word shortcut keys:\n1. The shortcut key Ctrl + P is used to open the Print dialog box to print a document.\n2. The shortcut key Ctrl + X is used to paste the contents from the clipboard into the current location. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → Ctrl + X is used to cut the selected text or object, not paste (paste = Ctrl + V). Other important shortcut keys: Ctrl + X - Cuts selected text or files and copies them. Ctrl + V - Pastes the contents of your clipboard into the current cursor location on a PC. Ctrl + C -Copies highlighted text or images. Ctrl + N - Creates a new page. Ctrl + B - Bolds selected text. Ctrl + Z - Undoes a change made to a document. Ctrl + Y - Redoes an action.","s":""},{"n":1609,"t":"Computer","q":"To create a new MS Word document, which of the following steps is correct?","o":["File Tab → Start","File Tab → Recent","File Tab → Open","File Tab → New"],"a":3,"e":"File Tab → New. Some Microsoft Word keyboard shortcuts: Ctrl + O - Opens a document, Ctrl + W -Closes a document, Ctrl + B - Applies or removes bold formatting, Ctrl + I -Applies or removes italic formatting, Ctrl + U - Applies or removes underline formatting.","s":""},{"n":1610,"t":"Computer","q":"Application software includes a variety of programs that are designed to meet the information processing needs of ________.","o":["customers","programmers","team leaders","end users"],"a":3,"e":"End users. Application software is a term used for software created for a specific purpose. Examples of application software include: Word Processing Software, Graphics Software, Spreadsheet Software, Presentation Software, Web Browsers.","s":""},{"n":1611,"t":"Computer","q":"Where can you find the options ‘From Beginning’ and ‘From Current Slide’ to run a slide show in MS PowerPoint?","o":["Slide Show tab","Home tab","View tab","Slide Sorter tab"],"a":0,"e":"Slide Show tab. Microsoft PowerPoint is a presentation program, created by Robert Gaskins and Dennis Austin. It was released on April 20, 1987.","s":""},{"n":1612,"t":"Computer","q":"What should you click to choose the date for sorting in Gmail?","o":["The filter icon","The ‘Date within’ field","The ‘1 Day’ dropdown menu","The calendar icon"],"a":1,"e":"The ‘Date within’ field. Gmail is the email service provided by Google. Created by - Paul Buchheit. Launched - April 1, 2004.","s":""},{"n":1613,"t":"Computer","q":"Which keyboard key is used to jump the cursor to the next cell of the table in MS Word?","o":["Tab","Home","Ctrl","Shift"],"a":0,"e":"Tab. In MS Word, pressing Tab moves the cursor to the next cell in the row, while pressing Shift+Tab moves the cursor to the previous cell.","s":""},{"n":1614,"t":"Computer","q":"Consider the following statements regarding Microsoft Excel features:\n1. The Co-authoring feature in Excel allows multiple users to edit the same worksheet simultaneously in real time.\n2. The Track Changes feature in Excel is used to apply conditional formatting rules to highlight cells automatically. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → Track Changes is used to record and review edits in a workbook, not to apply conditional formatting. (Conditional Formatting is a separate feature). Microsoft Excel is a spreadsheet editor developed by Microsoft for Windows, macOS, Android, iOS and iPadOS. It features calculation or computation capabilities, graphing tools, pivot tables, and a macro programming language called Visual Basic for Applications (VBA). Excel forms part of the Microsoft 365 suite of software. Initial release date - September 30, 1985. Written in - C++ (back-end).","s":""},{"n":1615,"t":"Computer","q":"Which key can be pressed to initiate a slide show in MS PowerPoint ?","o":["Function key F2","Function key F8","Function key F4","Function key F5"],"a":3,"e":"Function key F5. Some other function keys: F2 - Selects the text box that contains an object or text, F3 -When used with Shift, toggles between lower case, sentence case, and upper case for selected text. F7- Opens the Spelling dialog box to identify and correct spelling errors. F9 - When used with Shift, shows or hides gridlines.","s":""},{"n":1616,"t":"Computer","q":"How does the CPU distinguish between each memory cell ?","o":["By its byte size","By its capacity","By its address","By its data item"],"a":2,"e":"By its address. The Central Processing Unit (CPU) is the primary component of a computer that acts as its “control center.” It has three main parts: Arithmetic logic unit (ALU), control unit (CU), and memory unit.","s":""},{"n":1617,"t":"Computer","q":"In PPT What method can be used to move among slides if your hands are already on the keyboard ?","o":["Scrolling with the mouse wheel","Using the keyboard directional keys","Clicking on the slide thumbnail in the Slides tab","Pressing the Esc key to exit the presentation"],"a":1,"e":"PowerPoint (PPT) is a presentation program that allows users to create, edit, and share multimedia presentations on their computer or mobile device.","s":""},{"n":1619,"t":"Computer","q":"In addition to using the arrow keys and mouse clicks, what other method can be used to move around a table in Microsoft Word?","o":["Pressing the ‘Ctrl’ key and clicking on the cell","Pressing the ‘Enter’ key or using the scroll wheel","Using the Tab key or double-clicking on the cell","Right-clicking on the cell and selecting ‘Move to Next Cell’"],"a":1,"e":"Some commonly used shortcuts in Microsoft Word for navigating the document: Ctrl + Left Arrow: Move the cursor one word to the left. Ctrl + Right Arrow: Move the cursor one word to the right. Ctrl + Up Arrow: Move the cursor up by one paragraph. Ctrl + Home: Move the cursor to the beginning of the document. Ctrl + End: Move the cursor to the end of the document. Ctrl + Page Up: Moves the cursor to the top of the previous page.","s":""},{"n":1620,"t":"Computer","q":"What function does the public key serve in digital signature verification?","o":["To encrypt the digital signature","To decrypt the digital signature","To ensure confidentiality during transmission","To calculate the hash value of the message or file content"],"a":1,"e":"In digital signature verification, the sender encrypts the hash of the message with their private key to create the digital signature.","s":""},{"n":1621,"t":"Computer","q":"Which of the following is an example of multi-factor authentication for PC security?","o":["Firewall protection","Fingerprint scan","Antivirus software","OS protection"],"a":1,"e":"Fingerprint scan . Multi-factor authentication (MFA) involves using two or more authentication methods to verify a user's identity.","s":""},{"n":1622,"t":"Computer","q":"In MS Word, which option allows you to quickly remove all formatting from selected text while retaining the underlying text content ?","o":["Clear Formatting","Paste Special","Format Painter","Cut"],"a":0,"e":"Clear Formatting. Paste Special: It lets us paste content with source formatting, destination formatting, or as plain text. Format Painter: It is used to copy formatting from one section of text and apply it to another. It's helpful for maintaining consistency in document formatting.","s":""},{"n":1623,"t":"Computer","q":"In Microsoft Office, how is the font size determined?","o":["Pixels","Points","Inches","Centimetres"],"a":1,"e":"Points. Microsoft Office was Initial release - October 1, 1990. It featured Word, Excel, and PowerPoint.","s":""},{"n":1624,"t":"Computer","q":"Consider the following statements about MS PowerPoint:\n1. The slide number can be added to each slide of a presentation from the Design tab.\n2. The Table Design tab in PowerPoint is mainly used to insert slide numbers and page formatting. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Statement 1 is incorrect → Slide numbers are not added from the Design tab. Statement 2 is incorrect → The Table Design tab is only for formatting tables, not for slide numbers. Correct method → Slide numbers are inserted through Insert → Header & Footer → Slide Number.","s":""},{"n":1625,"t":"Computer","q":"Consider the following statements about formulas in MS Excel:\n1. In MS Excel, every formula must begin with the equal sign (=).\n2. The double equal sign (==) is commonly used in Excel to start formulas for performing logical comparisons. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 1 is correct → All Excel formulas start with = (e.g., =SUM(A1:A10)). Statement 2 is incorrect → Excel does not use == (that is common in programming languages like C, C++, Java, Python for equality check).","s":""},{"n":1626,"t":"Computer","q":"In Microsoft Word, the Mail Merge Wizard is located under the _________ tab.","o":["Review","Home","Mailings","Insert"],"a":2,"e":"Mailings. In MS Word, Mailings tab, manage mail merges with options to select recipients, insert fields, preview, and finish merges.","s":""},{"n":1627,"t":"Computer","q":"Which of the following is the fastest way to open the Help window in Microsoft Word?","o":["Click the Help button on the ribbon","Click the Microsoft Office button and then, click Help","Type ‘help’ in the search bar and then, press Enter","Press F1"],"a":3,"e":"Press F1. Function keys in Microsoft Word: F2 - Moves selected text or object to another location. F3 -Toggles the \"AutoText\" feature on/off. F4: Repeat last action. F5 - Go to a specific page, bookmark, or section (similar to Ctrl + G). F6 - Move cursor to task pane (e.g., Navigation, Styles).","s":""},{"n":1628,"t":"Computer","q":"Which function is used to calculate the maximum value in a selected column in MS Excel?","o":["Auto max","Max","Auto high","High"],"a":1,"e":"Max.","s":""},{"n":1629,"t":"Computer","q":"What is ‘Phishing’ in the context of network security?","o":["A type of computer worm that spreads through email attachments.","An attack that floods a network with excessive traffic to disrupt its operation.","A social engineering attack that tricks users into revealing sensitive information.","A type of malware that spreads through infected USB drives."],"a":2,"e":"Four types of phishing : Spear Phishing, Whaling, Vishing, Email Phishing. More types of cyber attacks: Malware (short for “malicious software”) is a file or code, typically delivered over a network, that infects, explores, steals or conducts virtually any behavior an attacker wants. Spoofing is the act of disguising a communication from an unknown source as being from a known, trusted source.","s":""},{"n":1630,"t":"Computer","q":"Consider the following statements about email protocols:\n1. The SMTP (Simple Mail Transfer Protocol) is commonly used for sending emails between mail servers.\n2. The FTP (File Transfer Protocol) is commonly used for receiving emails from mail servers. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → FTP is for file transfers, not for receiving emails. Emails are received using POP3 or IMAP.","s":""},{"n":1631,"t":"Computer","q":"What is the purpose of the Arithmetic Logic Unit (ALU) in a Central Processing Unit (CPU)?","o":["It executes program instructions by performing calculations and logical comparisons.","It manages the data flow between the CPU fan.","It controls the speed of the CPU fan.","It connects the CPU to peripheral devices."],"a":0,"e":"Logical operations: comparisons (greater than, less than, equal to), AND, OR, NOT. The primary function of an ALU is to store and retrieve data from memory. There can be more than one ALU in a CPU.","s":""},{"n":1632,"t":"Computer","q":"Which keyboard shortcut opens File Explorer (previously known as Windows Explorer) in Windows 10?","o":["Ctrl + P","Win + E","Ctrl + C","Alt + Tab"],"a":1,"e":"Win + E. File explorer shortcuts in Windows 11: Alt + D: Select the address bar. Ctrl + E: Select the search box. Ctrl + N: Open a new window. Num Lock + asterisk (*): Display all subfolders under the selected folder. Num Lock + plus (+) : Display the contents of the selected folder. Num Lock + minus (-): Collapse the selected folder.","s":""},{"n":1633,"t":"Computer","q":"Which networking protocol is used to assign IP addresses dynamically to devices on a network?","o":["FTP (File Transfer Protocol)","HTTP (Hypertext Transfer Protocol)","SMPT (Simple Mail Transfer Protocol)","DHCP (Dynamic Host Configuration Protocol)"],"a":3,"e":"DHCP . It is a network protocol that is used to configure network devices to communicate on an IP network. An Internet Protocol (IP) address is the unique identifying number assigned to every device connected to the internet. IP (version 4) addresses are 32-bit integers that can be expressed in hexadecimal notation. An IPv6 address is 128 bits long compared with the 32 bit address of IPv4.","s":""},{"n":1634,"t":"Computer","q":"In MS-Excel 365, you can use _________ when you want to change a cell reference within a formula without changing the formula itself.","o":["INDIRECT","VLOOKUP","TRANSPOSE","MATCH"],"a":0,"e":"INDIRECT. Other functions: VLOOKUP - Looks for a value in the leftmost column of a table, and then returns a value in the same row from the column we specify. TRANSPOSE -Converts a vertical range of cells to a horizontal range, or vice versa. MATCH -Returns the relative position of an item in an array that matches a specified value in a specified order.","s":""},{"n":1635,"t":"Computer","q":"In computer memory __________ bus is used to transfer addresses between CPU and the main memory.","o":["status","control","data","address"],"a":3,"e":"address bus. A computer bus is a set of conductors that enable information to be transmitted between computer components, such as printers, modems, and monitors.","s":""},{"n":1636,"t":"Computer","q":"Which of the following parts of given URL is a 'domain name' ? http://www.india.in/tallybook/tallybook.x","o":["http:","www.india.in","tallybook","tallybook.xyz"],"a":1,"e":"www.india.in. A URL (Uniform Resource Locator) is a unique identifier used to locate a resource on the Internet. http : This is the protocol used for communication, in this case, indicating Hypertext Transfer Protocol.","s":""},{"n":1637,"t":"Computer","q":"Consider the following statements regarding firewalls:\n1. Packet filtering firewalls operate at the Network layer of the OSI model and examine incoming and outgoing packets based on IP address, port, or protocol.\n2. Application-level gateways (ALG) operate at the Transport layer, filtering traffic only on the basis of TCP/UDP ports. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → Application-level gateways (proxy firewalls) work at the Application layer, not just the Transport layer. It is a powerful security technique against intrusions from external networks. An application-level gateway (ALG) is a type of firewall that filters traffic at the application layer of the OSI (open systems interconnection) model.","s":""},{"n":1638,"t":"Computer","q":"Which of the following statements is/are correct for email ? I. A user can check the email header prior to downloading. II. A user can partially download an email.","o":["Only II","Only I","Neither I nor II","Both I and II"],"a":3,"e":"Both I and II. Different Parts of Email: Sender/from, subject line, pre-header, salutation, email body, Closing line, Signature, Call to Action (CTA), Attachments. A call to action (CTA), if defined, is an instruction to the reader that encourages them to take immediate action.","s":""},{"n":1639,"t":"Computer","q":"In File Explorer of Windows 11, to reduce the space between files, select view > _________ view.","o":["Cloud","Wide","Compact","Stretch"],"a":2,"e":"Compact. In Windows 11 under View menu (Tiles, content, details pane, preview pane, show). Under Show menu (Navigation pane, compact view, item check boxes, file name extensions, hidden items).","s":""},{"n":1640,"t":"Computer","q":"A _________ is a program that can self - replicate and propagate over the network.","o":["worm","trojan horse","boot sector virus","macro virus"],"a":0,"e":"Worm. A boot sector virus is a type of malware that infects a system's boot partition or the Master Boot Record (MBR) of a hard disk. A macro virus is a computer virus written in the same macro language used to create software programs such as Microsoft Excel or Word.","s":""},{"n":1641,"t":"Computer","q":"When the sender and receiver of an email are on the same system, we need only ______ user agents.","o":["two","three","four","six"],"a":0,"e":"two. When the sender and the receiver of an e-mail are on different systems, we need two UAs (User Agents) and a pair of MTAs (client and server). MTAs- Message transfer agents.","s":""},{"n":1642,"t":"Computer","q":"What is the primary purpose of RAM (Random Access Memory) in a computer?","o":["Storing permanent data and files","Providing long-term storage for programs","Providing temporary storage for data that the CPU is currently processing","Managing peripheral devices"],"a":2,"e":"RAM is a computer or laptop’s short-term memory. It’s where the data is stored that the computer processor needs to run applications and open files. The information stored in RAM can be checked with the help of BIOS (Basic Input / Output System). BIOS is the program a computer's microprocessor uses to start the computer system after it is powered on. RAM is volatile in nature, which means the data is lost when the device is switched off.","s":""},{"n":1643,"t":"Computer","q":"Consider the following statements about Microsoft Excel:\n1. A cell in Excel refers to the intersection of a row and a column in a worksheet.\n2. A worksheet in Excel is the same as a cell, where data is entered and stored. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → A worksheet is not the same as a cell; it is a grid of thousands of cells. Cells are the basic building blocks of a worksheet. A worksheet (also known as a spreadsheet) consists of cells in which we can enter and calculate data. The active cell is the selected cell in which data is entered when we begin typing. A range is a group of two or more cells in a worksheet.","s":""},{"n":1644,"t":"Computer","q":"Which networking device operates at Layer 2 of the OSI model and forwards data based on MAC addresses?","o":["Switch","Hub","Firewall","Router"],"a":0,"e":"Switch. A network switch connects devices in a network to each other, enabling them to talk by exchanging data packets. A hub is a device that links multiple computers and devices together. A router is a device that connects two or more packet-switched networks.","s":""},{"n":1645,"t":"Computer","q":"Which backup device provides a convenient way to create system images and complete backups, but may require a lengthy restoration process?","o":["Tape drive","Network-attached storage (NAS)","Solid-state drive (SSD)","DVD-RW disc"],"a":0,"e":"A tape drive is a device that stores computer data on magnetic tape, especially for backup and archiving purposes. DVD Rewritable (DVD RW) discs are designed to store up to 4.7GB or 120 minutes of DVD-quality video.","s":""},{"n":1646,"t":"Computer","q":"Which of the following is not an example of a web browser?","o":["Facebook","Apple Safari","Google Chrome","Opera"],"a":0,"e":"Facebook (social networking site). Examples of social networking sites: Twitter, Instagram, Linkedin, Snapchat, Google meet. A web browser is an application for accessing websites and the Internet. Examples: Mozilla Firefox, Google Chrome, Opera, Safari, Microsoft Edge, Netscape Navigator, Mosaic.","s":""},{"n":1647,"t":"Computer","q":"What is the function of the cache memory in a computer’s memory hierarchy?","o":["To provide permanent storage for data and files.","To store frequently used data for faster access by the CPU.","To control the flow of data between the CPU and memory.","To manage the allocation of memory resources to different programs."],"a":1,"e":"Cache memory is a chip -based computer component that makes retrieving data from the computer's memory more efficient. It is an extremely fast memory type that acts as a buffer between RAM and the CPU. It holds frequently requested data and instructions so that they are immediately available to the CPU when needed. It is costlier than main memory or disk memory but more economical than CPU registers.","s":""},{"n":1648,"t":"Computer","q":"What is a ‘Firewall’ in the context of network security?","o":["A software application for managing files and folders.","A type of malware that spreads through email attachments.","A security mechanism that filters and controls network traffic.","A hardware device used to boost network performance."],"a":2,"e":"A firewall is defined as the system which analyzes and filters incoming or outgoing data packets based on predefined rules.","s":""},{"n":1649,"t":"Computer","q":"In computer registers, MAR stands for ______.","o":["Main Access Register","Memory Access Register","Memory Address Register","Main Address Register"],"a":2,"e":"MAR (Memory Address Registers). It holds the address of the location to be accessed from memory. MAR and MDR (Memory Data Register) together facilitate the communication of the CPU and the main memory. Memory Data Registers: It contains data to be written into or to be read out from the addressed location. More types of registers : AC (accumulator), DR (Data registers), PC (Program counter), IR (index registers), MBR (Memory buffer registers).","s":""},{"n":1650,"t":"Computer","q":"What is a ‘Trojan’ in the context of network security?","o":["A protocol used for secure communication between devices on a network.","A program that monitors network traffic for security breaches.","A type of firewall that protects against viruses and malware.","Malicious software disguised as legitimate software to gain unauthorised access."],"a":3,"e":"A Trojan virus spreads through legitimate-looking emails and files attached to emails, which are spammed to reach the inboxes of as many people as possible.","s":""},{"n":1651,"t":"Computer","q":"In File Explorer of Window 10, the keyboard shortcut ‘Num Lock + Asterisk sign (*)’ is used to ______.","o":["display all subfolders under the selected folder","open the properties dialog box for the selected item","display the contents of the selected folder","collapse the selected folder"],"a":0,"e":"File explorer keyboard shortcuts: Num Lock + plus (+): Display the contents of the selected folder. Num Lock + minus (-) : Collapse the selected folder. Ctrl + Shift + E: Display all folders above the selected folder. Ctrl + Shift + N: Create a new folder.","s":""},{"n":1652,"t":"Computer","q":"In Windows 10, which of the following keyboard shortcuts is used to display and hide the desktop?","o":["Windows logo key + D","Windows logo key + H","Windows logo key + C","Windows logo key + G"],"a":0,"e":"Windows logo key + D. Windows logo key + G - It is used to open Xbox Game Bar when a game is open. Windows logo key + C - It is used to open chat from Microsoft Teams. Windows logo key + H - It is used to Launch voice typing.","s":""},{"n":1653,"t":"Computer","q":"Which of the following is NOT a part of an email address?","o":["Email service provider's domain","'@' symbol","Username","Photo"],"a":3,"e":"Photo . Parts of an email address are :- Username - The username is the name we choose to be identified with for e-mail purposes and that we have provided to the email host to create our email account. '@' symbol - @ (pronounced \"at the rate of\" ) is the symbol in an Email address that separates the name of the user from the user's Internet address. Mail Server - A mail server transfers and delivers email messages between two or more mail clients. Domain - A domain name forms part of the Uniform Resource Locator (URL) and is the address for a webpage. Example:- ssccglpinnacle@gmail.com.","s":""},{"n":1654,"t":"Computer","q":"Identify whether the following statements are true or false with reference to MS-Word 2010.\n(i) A template can be selected while creating a new document.\n(ii) The keyboard shortcut for going to the end of a document is Shift + End.","o":["(i) False (ii) False","(i) True (ii) True","(i) True (ii) False","(i) False (ii) True"],"a":2,"e":"(i) True (ii) False. In Microsoft Word, templates are pre -designed documents. The template could be for a business card, brochure, resume, presentation.","s":""},{"n":1655,"t":"Computer","q":"Which of the following types of hackers, also known as crackers, hack to gain unauthorised access to a system and harm its operations or steal sensitive information?","o":["White hat","Black hat","Red hat","Gray hat"],"a":1,"e":"Black Hat . A white hat (ethical hacker) is an individual who uses hacking skills to identify security vulnerabilities in hardware, software or networks. A red hat is a hacker who takes aggressive steps to stop black hat hackers. A gray hat is a computer security expert who sometimes violates ethical standards but doesn't have malicious intentions.","s":""},{"n":1656,"t":"Computer","q":"Which of the following is a mini -DIN connector used to connect a keyboard and mouse to a PC compatible computer ?","o":["Ethernet port","VGA port","PS/2 port","RS232 port"],"a":2,"e":"PS/2 port:- The PS/2 port is a 6-pin mini-DIN connector used for connecting keyboards and mice to a PC compatible computer system. It is also called a mouse port.","s":""},{"n":1657,"t":"Computer","q":"Consider the following statements about Email Protocols:\n1. SMTP is mainly used for sending emails.\n2. POP3 allows downloading emails to a single device but does not sync across multiple devices.\n3. IMAP allows receiving emails and synchronization across multiple devices. Which of the statements given above are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3.","s":""},{"n":1658,"t":"Computer","q":"What is the diameter of a Blu-ray Disc?","o":["115 mm","100 mm","110 mm","120 mm"],"a":3,"e":"120 mm. Blu-ray Disc is 120 mm in diameter and 1.2 mm thick, the same size as DVDs (digital versatile/video disks) and CDs (Compact disks). Currently, 50GB and 25GB capacity, Blu-ray Disc media is available in both the BD-RE rewritable and BD-R recordable formats.","s":""},{"n":1659,"t":"Computer","q":"The _______ unit is that part of the CPU which controls or directs the operations of the processor.","o":["control","memory","arithmetic logic","data"],"a":0,"e":"Control. A control unit handles all processor control signals. The control unit is made up of flip-flops, logic gates, digital circuits and encoder and decoder circuits that are wired in a specific and fixed way.","s":""},{"n":1660,"t":"Computer","q":"Consider the following statements about networking devices:\n1. A Repeater operates at the Physical Layer of the OSI model and regenerates weak or distorted signals.\n2. A Hub also regenerates signals like a repeater but works at the Network Layer. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect → A hub does not regenerate signals; it only broadcasts data to all connected devices. Also, it works at the Physical Layer, not at the Network Layer.","s":""},{"n":1661,"t":"Computer","q":"Which of the following shortcut keys is used to make the contents of a cell underlined in MS-Excel 365?","o":["Ctrl + 6","Ctrl + 3","Ctrl + 2","Ctrl + 4"],"a":3,"e":"Ctrl + 4 . Some other shortcut key in MS-Excel 365 : Ctrl + 0 -To hide the selected column, Ctrl + 1 -Open the Format Cells dialog box, Ctrl + 2 - Bold text or remove bold formatting, Ctrl + 3 - Italicize text or remove italic formatting, Ctrl + 5 - Apply or remove strikethrough formatting, Ctrl+6 Hides and shows hidden objects, Ctrl + 8 -Display and hide the outline symbols, Ctrl + 9 -To hide a row.","s":""},{"n":1662,"t":"Computer","q":"In a star network, how many lines are required for connecting N nodes to the host node?","o":["N + 1","N/2","(N/2) - 1","N - 1"],"a":3,"e":"N-1. Network topology -Arrangement of a network, comprising nodes and connecting lines. There are 6 types of topology, Bus Topology - Every computer is connected to a common bus (single cable), Ring Topology - Every node is connected to two other nodes, forming a loop. Tree Topology - A central root node from which all other nodes branch out, Star Topology - Each device on the network is connected to a central hub, Mesh Topology ({n(n-1)/2})- Each node is connected to every other node in the network, Hybrid Topology - It is a combination of two or more network topologies.","s":""},{"n":1663,"t":"Computer","q":"Which of the following shortcut keys is used to move the cursor one word to the left in MS-Word 365 ?","o":["Ctrl + PageUp","Ctrl + Left arrow key","Shift + Left arrow key","Shift + PageUp"],"a":1,"e":"Ctrl + Left arrow key. Ctrl + Page Up - Moves the cursor one Line Up. The Shift + left arrow and Shift + right arrow combinations - moving the cursor to the beginning and the end of a line respectively.","s":""},{"n":1664,"t":"Computer","q":"Sam wants to share his presentation with larger audience via emails. Which feature of MS PowerPoint 365 can he use for it?","o":["Save As","Print","Share","Info"],"a":2,"e":"Share . Features of Microsoft Powerpoint 365 - Designer, Smart Lookup, QuickStarter, New charts, Morphing, Real-time collab, Version History, Zoom for non-sequential presentations.","s":""},{"n":1665,"t":"Computer","q":"Natural language processing (NLP) is a branch of artificial intelligence that helps computers _____ human language. I. understand II. Interpret III. manipulate","o":["I, II and III","only I and III","only I and II","only II and III"],"a":0,"e":"I, II and III. Natural Language Processing (NLP) refers to the branch of Artificial Intelligence that gives the machines the ability to read, understand and derive meaning from human languages.","s":""},{"n":1666,"t":"Computer","q":"Which of the following is NOT an application software ?","o":["Entertainment software","Education software","Programming language translator software","Personal assistance software"],"a":2,"e":"Programming language translator software. Software is a set of instructions. Softwares are majorly classified into two categories: System Software and Application Software.","s":""},{"n":1667,"t":"Computer","q":"Sheetal wants to create financial statements for her business. Which among the following software should she use for the same ?","o":["Presentation software","System software","Multimedia software","Spreadsheet software"],"a":3,"e":"Spreadsheet software. It helps a user perform numerical functions and analyze numbers through a computerized version of an accounting worksheet. An Example - Excel.","s":""},{"n":1668,"t":"Computer","q":"IBM 360 was developed in which of the following generations of computer ?","o":["Second Generation","First Generation","Third Generation","Fourth Generation"],"a":2,"e":"Third generation. First Generation (1940 - 56): Vacuum tubes were used. Example: ENIAC (Electronic Numerical Integrator And Computer), EDVAC (Electronic Discrete Variable Automatic Computer), EDSAC (Electronic Delay Storage Automatic Calculator), UNIVAC I (Universal Automatic Computer I), IBM 701, IBM 650 etc.","s":""},{"n":1669,"t":"Full Forms","q":"What is the full form of IADP?","o":["Intensive Agricultural District Programme","India Agricultural Development Programme","Integrated Agricultural District plan","Intensive Agricultural Development Project"],"a":0,"e":"Intensive Agricultural District Programme (Launched in 1960) -Also known as a “package program”; Aim - To provide loans for seeds and fertilisers to farmers.","s":""},{"n":1670,"t":"Full Forms","q":"What does 'F' stand for in FRBM Act, 2003 of the Indian economy?","o":["Fiscal","Financial","Freedom","Functional"],"a":0,"e":"Fiscal. The FRBM Act (Fiscal Responsibility and Budget Management Act), enacted in August\n2003. Aim - To promote fiscal discipline, transparency, and accountability in the management of India's finances.","s":""},{"n":1671,"t":"Full Forms","q":"With respect to sports, NADA stands for ______.","o":["National Anti - Doping Association","National Autonomous Doping Agency","National Anti - Doping Agency","National Autonomous Doping Association"],"a":2,"e":"National Anti-Doping Agency - It is India's national organisation responsible for promoting, coordinating, and monitoring the doping control program in sports in all its forms. Established - November 2005. Headquarters - New Delhi.","s":""},{"n":1672,"t":"Full Forms","q":"With respect to social groups in India, PVTGS stands for_________ .","o":["Periodic Vulnerable Tribal Groups","Periodic Various Tribal Groups","Particularly Vulnerable Tribal Groups","Particularly Various Tribal Groups"],"a":2,"e":"Particularly Vulnerable Tribal Groups. It is a sub-classification of a Scheduled Tribe or section of a Scheduled Tribe that is considered more vulnerable than a regular Scheduled Tribe. PVTGs reside in 18 States and one union territory.","s":""},{"n":1673,"t":"Full Forms","q":"With respect to sports, WADA stands for______________ .","o":["World Anti-Doping Association","World Anti-Doping Agency","Wrestling Anti-Doping Association","World Autonomous - Doping Agency"],"a":1,"e":"World Anti-Doping Agency - It was established in 1999 as an international independent agency composed and funded equally by the sport movement and governments of the world. The First World Conference on Doping in Sport held in Lausanne (Switzerland) in 1999. Headquarter -Montreal, Canada.","s":""},{"n":1674,"t":"Full Forms","q":"What is the full form of NCRB?","o":["National Currency Records Branch","National Capital Register Bureau","National Criminal Records Bureau","National Crime Records Bureau"],"a":3,"e":"National Crime Records Bureau is an Indian government agency responsible for collecting and analyzing crime data as defined by the Indian Penal Code (IPC) and Special and Local Laws (SLL). Headquarters - New Delhi. Ministry - Ministry of Home Affairs (MHA). Established - 1986. It implementes Crime and Criminal Tracking Network System (CCTNS).","s":""},{"n":1675,"t":"Full Forms","q":"What is the full form of RPG?","o":["Report Program Generator","Random Program Generator","Report Process Generator","Random Process Generator"],"a":0,"e":"Report Program Generator. It is a high-level programming language for business applications, introduced in 1959 for the IBM 140. Some Major High Language - Python, Java, C++, JavaScript and C#.","s":""},{"n":1676,"t":"Full Forms","q":"A balanced diet should meet the RDAs for an individual. State the full form of RDA.","o":["Request Diet Allowances","Recommended Dietary Allowances","Request Dietary Allowances","Recommend Diet Allowances"],"a":1,"e":"The Recommended Dietary Allowance (RDA) is the average daily dietary intake level that is sufficient to meet the nutrient requirement of nearly all (97 to 98 percent) healthy individuals in a particular gender and life stage group.","s":""},{"n":1677,"t":"Full Forms","q":"In the context of the banking sector, what does ‘F’ stand for in IFSC?","o":["Functional","Forum","Fiscal","Financial"],"a":3,"e":"Financial. IFSC stands for Indian Financial system Code. It is an 11 digit alphanumeric code used to uniquely identify bank branches within the National Electronic Funds transfer (NEFT) network by the central bank.","s":""},{"n":1678,"t":"Full Forms","q":"What does SAARC stand for?","o":["South Asian Association of Regional Climate change","South Asian Association for Regional Cooperation","South Asian Association of Regional Cartography","South Asian Association of Regional Corporation"],"a":1,"e":"South Asian Association for Regional Cooperation - Established in Dhaka on 8 December 1985. Afghanistan became the newest member of SAARC at the 13th annual summit in\n2005. Headquarters - Kathmandu, Nepal. Eight member States : Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka.","s":""},{"n":1679,"t":"Full Forms","q":"What is the full form of ‘PM-SYM’?","o":["Pradhan Mantri Sanyukt Yojana Man-dhyan","Pradhan Mantri MukhiyaSukrasha Yojana","Pradhan Mantri Shram Yogi Maan-dhan","Pradhan Mantri Shrestha Yojana Mulyankan"],"a":2,"e":"Pradhan Mantri Shram Yogi Maan-Dhan: It is a Central Sector Scheme announced in the Interim Budget of 2019. Nodal Ministry - Ministry of Labour and Employment. Aim - To provide social security and old age protection to unorganized workers in India. A minimum monthly pension of Rs 3,000 after the beneficiary turns 60 years old.","s":""},{"n":1680,"t":"Full Forms","q":"The CPWD along with the Ministry of Road Transport and Highways works for public infrastructure. What is the full form of CPWD?","o":["Central Public Welfare Department","Central Public Welfare Design","Central Political Welfare Design","Central Public Works Department"],"a":3,"e":"The Central Public Works Department (CPWD) operates under the Ministry of Housing and Urban Affairs of India. It acts as the builder, developer, and manager of Central government properties. Over time, its operations have expanded to include roadways and bridge engineering. Established in 1854, its headquarters is located in the Central Secretariat in New Delhi.","s":""},{"n":1681,"t":"Full Forms","q":"What is the full form of RIDF ?","o":["Rural Infrastructure Development Forum","Rural Infrastructure Development Fund","Road Infrastructure Development Fund","Rural Industries Development Fund"],"a":1,"e":"Rural Infrastructure Development Fund created in 1995-96 under National Bank for Agriculture and Rural Development (NABARD) with an initial corpus of Rs.2,000 crore. There are 39 eligible activities under RIDF. Eligible activities are classified under three broad categories: Agriculture and related sector, Social sector, Rural connectivity.","s":""},{"n":1682,"t":"Religious Places","q":"Given below are the statements in Assertion and Reason. Choose the correct option :\nAssertion (A): The naming of \"Good Friday\" as a positive term is universally accepted among Christian scholars and traditions.\nReason (R): The day is termed \"Good\" to signify the positive theological meaning of Jesus's sacrificial death.","o":["Both A and R are false.","Both A and R are true, and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is false, but R is true."],"a":3,"e":"A is false, but R is true.\nAssertion (A) is false because the naming of \"Good Friday\" is not universally accepted among Christian scholars and traditions. Some traditions call it Holy Friday, Great Friday, or Black Friday. Reason (R) is true because the term “Good” is understood in many Christian traditions to signify the positive theological meaning of Jesus’s sacrificial death, which is seen as an act of redemption.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1683,"t":"Religious Places","q":"Which of the following statements is correct about Urs at Ajmer Sharif?","o":["It follows the lunar calendar and marks the saint's death.","It is celebrated annually based on the solar calendar.","It marks the birth anniversary of Khwaja Moinuddin Chishti.","It is held only once every five years during Ramzan."],"a":0,"e":"It follows the lunar calendar and marks the saint's death. Urs at Ajmer Sharif is the annual commemoration of the death anniversary of Khwaja Moinuddin Chishti, observed according to the Islamic lunar calendar. It is celebrated every year in the month of Rajab and attracts pilgrims from all over the world.","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":1684,"t":"Religious Places","q":"At which place was the magnificent temple of Saiva constructed by the great Rashtrakuta King ‘Krishna I’?","o":["Badami","Kanchi","Kannauj","Ellora"],"a":3,"e":"Ellora. The temples at Ellora Caves (Maharashtra) were built by the Rashtrakuta and Yadava dynasties. Rashtrakuta dynasty built the Hindu and Buddhist caves during their reign. The Kailasa Temple (dedicated to Lord Shiva) was built by Krishna I of the Rashtrakuta dynasty. It is the largest single-rock excavation in the world. Yadava dynasty built many of the Jain caves. The Ellora Caves are a UNESCO World Heritage Site. The caves include 12 Buddhist caves, 17 Hindu caves, and 5 Jain caves.","s":""},{"n":1685,"t":"Religious Places","q":"Match the following:\n1. Kailasa Temple → ?\n2. Jain Caves at Ellora → ?\n3. Badami Cave Temples → ? a Chalukya b Rashtrakuta c Yadava","o":["1-b, 2-c, 3-a","1-c, 2-b, 3-a","1-b, 2-a, 3-c","1-a, 2-b, 3-c"],"a":0,"e":"1-b, 2-c, 3-a. The temples at Ellora Caves (Maharashtra) were built by the Rashtrakuta and Yadava dynasties. Rashtrakuta dynasty built the Hindu and Buddhist caves during their reign. The Kailasa Temple (dedicated to Lord Shiva) was built by Krishna I of the Rashtrakuta dynasty. It is the largest single-rock excavation in the world. Yadava dynasty built many of the Jain caves. The Ellora Caves are a UNESCO World Heritage Site. The caves include 12 Buddhist caves, 17 Hindu caves, and 5 Jain caves.","s":""},{"n":1687,"t":"Religious Places","q":"The Sun Temple at Konark was built under the rule of which dynasty?","o":["Pandya Dynasty","Pallava Dynasty","Rashtrakuta Dynasty","Eastern Ganga Dynasty"],"a":3,"e":"Eastern Ganga Dynasty. Konark Sun Temple is a 13th-century CE Sun temple at Konark in Puri district, Odisha. This temple is attributed to King Narasimhadeva I of the Eastern Ganga Dynasty.Temple is a classic illustration of Great Kalinga Architecture. It is dedicated to the God Surya. The famous Chandrabhaga Mela takes place here every year in the month of February. This temple is also called \"Black Pagoda\". The temple was declared a UNESCO World Heritage Site in 1984.","s":""},{"n":1688,"t":"Religious Places","q":"Lad Khan Temple at Aihole in Karnataka is an example of which of the following styles of temple architecture?","o":["Dravida","Nagara","Vesara","Pagoda"],"a":2,"e":"Vesara style of temples is a combination of both Nagara (North India) and Dravida (South India), its superstructure is bell-shaped. Examples of Vesara Style temples in Karnataka: Mahadeva temple (Ittagi); Kasivisvesvara temple (Lakkundi); Kallesvara Temple (Kukkanur).","s":""},{"n":1689,"t":"Religious Places","q":"The Trimbakeshwar Temple, which is situated in Nashik, Maharashtra, was built by :","o":["Maharaja Ganga Singh","Maharana Pratap","Balaji Baji Rao","Shivaji"],"a":2,"e":"Balaji Baji Rao. Trimbakeshwar Temple, a renowned religious center, houses one of the twelve Jyotirlingas and is located at the foot of Brahmagiri Hill in the city of Trimbak. Other notable temples and their builders include the Brihadeeswara Temple (Raja Raja Chola I of the Chola dynasty), Konark Sun Temple (King Narasimhadeva I of the Eastern Ganga Dynasty), and the Kailasa Temple at Ellora (Krishna I of the Rashtrakuta dynasty).","s":""},{"n":1690,"t":"Religious Places","q":"Select the correct combination of the temple and the state in which it is located.","o":["Mahakaleshwar Jyotirlinga-Uttarakhand","Somnath Jyotirlinga Temple-Maharashtra","Kamakhya Temple-Assam","Jagannath Temple-West Bengal"],"a":2,"e":"Kamakhya Temple -Assam. Other temples and locations : Mahakaleshwar Jyotirlinga - Madhya Pradesh, Somnath Jyotirlinga Temple -Gujarat, Jagannath Temple - Odisha, Badrinath Temple - Uttarakhand, Golden Temple - Punjab, Meenakshi Temple -Tamil Nadu. Hoysaleswara Temple -Karnataka.","s":""},{"n":1691,"t":"Religious Places","q":"In which state is the Bhitari temple situated?","o":["Uttar Pradesh","Odisha","Jharkhand","Bihar"],"a":0,"e":"Uttar Pradesh . The Victory of Skandagupta over the Huns is mentioned in Bhitari Inscription. Other Religious Sites of Uttar Pradesh: Sarnath, Kashi Vishwanath Temple, Banke Bihari Temple, ISKCON Vrindavan, Banaras Ghats.","s":""},{"n":1692,"t":"Religious Places","q":"Where is the Mahabodhi temple situated?","o":["Varanasi","Bodh Gaya","Patna","Agra"],"a":1,"e":"Bodh Gaya (Bihar) . The Mahabodhi Temple (located on the banks of the Niranjana River) is one of the four holy sites related to the life of the Lord Buddha, and particularly to the attainment of Enlightenment. First temple was established in the 3rd century BC by Mauryan emperor Ashoka. Famous Temples in Bihar: Vishnupad Mandir and Mangala Gowri Temple (Gaya), Pawapuri Jal Mandir (Nalanda) and Mithila Shakti Peeth (Darbhanga).","s":""},{"n":1693,"t":"Religious Places","q":"Bhitargaon Brick temple is a good example of architecture of which of the following periods?","o":["Mughal period","Gupta period","Maurya period","Chola period"],"a":1,"e":"Gupta Period. Bhitargaon Temple: It is situated in Kanpur (Uttar Pradesh) and is one of the earliest surviving brick temples of India. It was built during the 5th century AD. Other Gupta period Architectures: Ajanta, Ellora, Sarnath. Temples built during Gupta Period: Dashavatara Temple (Deogarh), Bhitari Temple (Ghazipur).","s":""},{"n":1694,"t":"Religious Places","q":"The ‘Mukteshwar’ dance festival is held from 14th to 16th January at the Mukteswar temple in the state of _______.","o":["Uttarakhand","Odisha","Madhya Pradesh","Himachal Pradesh"],"a":1,"e":"Odisha. Temples in Odisha: Jagannath Temple (Puri), Sun Temple (Konark), Maa Tara Tarini Temple (Purusottampur), Lingaraj Temple (Bhubaneswar), Brahmeswara Temple (Bhubaneswar).","s":""},{"n":1695,"t":"Religious Places","q":"The most famous of all Jain festivals, Mahamastakabhisheka is performed every 12 years at the Digambara sacred complex at _______ in Karnataka.","o":["Keelakuilkudi","Jinanathapura","Shravanabelagola","Puliyarmala"],"a":2,"e":"Shravanabelagola (Hassan district of Karnataka) - Gomateshwara statue located in this place and built under the Ganga dynasty. Karuppanna Swamy Temple (Keelakuilkudi, Madurai), Shantinatha Basadi temple (Jinanathapura), Puliyarmala Jain Temple (Kalpetta Wayanad - Kerala).","s":""},{"n":1696,"t":"Religious Places","q":"The famous 'Pashupatinath Temple' is located in which country from the following?","o":["Nepal","Bhutan","Maldives","Sri Lanka"],"a":0,"e":"Nepal. Pashupatinath Temple (Dedicated to Lord Shiva): Stretches on both sides of the Bagmati River. It was conferred the status of a World Herita ge Site in 1979 by the United Nations Educational, Scientific and Cultural Organization (UNESCO).","s":""},{"n":1697,"t":"Religious Places","q":"The Sirpur Shrine is situated in which of the following states?","o":["Odisha","Uttar Pradesh","Chhattisgarh","Bihar"],"a":2,"e":"Chhattisgarh. Temples in Chhattisgarh: Maa Bamleshwari Devi Temple, Mahamaya Temple, Chandrahasini Devi temple, BhoramdeoTemple, Danteshwari Temple.","s":""},{"n":1698,"t":"Religious Places","q":"The lofty gates erected in the courtyard of the temples in south India were called ____________ .","o":["mandap","ardhmandap","vimana","gopuram"],"a":3,"e":"Gopuram - A monumental entrance tower, built in the Dravidian Style. Tallest Gopuram -Ranganathaswamy Temple (Tamil Nadu). Southern Indian temples : Shikhara -crowning element at the top of the temple. Vimana - shape of the main temple tower.","s":""},{"n":1699,"t":"Religious Places","q":"Builders of which of the following temples had constructed a 4 km long incline for placing 90 tonnes of stone on top of the tallest shikhara amongst temples of its time?","o":["The Sun Temple","Rajarajeshvara Temple","Kandhariya Mahadeva Temple","Gangadikondha Temple"],"a":1,"e":"Rajarajeshvara Temple. It was built by Rajaraja Chola I, in Thanjavur, Tamil Nadu. It is dedicated to Lord Shiva.","s":""},{"n":1700,"t":"Religious Places","q":"The Jagannath Temple in Puri depicts which Indian classical dance form?","o":["Kuchipudi","Bharatanatyam","Kathak","Odissi"],"a":3,"e":"Odissi. Lord Jagannath is worshipped as Vishnu or Narayana or Krishna and deity Balabhadra as Shesha.","s":""},{"n":1701,"t":"Religious Places","q":"In which of the following countries is the Hindu religious place 'Chandranath Hill' located?","o":["Bhutan","Nepal","Bangladesh","Sri Lanka"],"a":2,"e":"Bangladesh. Chandranath Temple :- It is located on top of the Chandranath Hill, is a famous Shakti Peeth located near Sitakunda in Bangladesh.","s":""},{"n":1702,"t":"Religious Places","q":"In North Indian temple architecture , which element denotes the superstructure or tower above the sanctum and the pillared mandapas?","o":["Kalasha","Amalaka","Shikhara","Antarala"],"a":2,"e":"Shikhara - A tower, in elevation, which is progressively inclined in a convex curve. The three most common temple architecture are: Nagara in the north (between the Himalayas and Vindhyas), and Dravidian in the south. The Vesara style of temples is an admixture of Nagara and Dravidian styles.","s":""},{"n":1703,"t":"Religious Places","q":"Which of the following temples is built in the style of the Rekha Deula or the one with a curvilinear superstructure?","o":["Kailasanathar Temple in Tamil Nadu","Sri Jagannath Temple in Odisha","Shree Padmanabhaswamy Temple in Kerala","Kandariya Mahadev Temple in Madhya Pradesh"],"a":1,"e":"Sri Jagannath Temple in Odisha. It was built by Anantavarman Chodaganga Deva In Kalinga - Style architecture. The temple was called the “White Pagoda” and is a part of Char Dham pilgrimages (Badrinath, Dwaraka, Puri, Rameswaram).","s":""},{"n":1704,"t":"Religious Places","q":"Ramappa Temple is dedicated to which God?","o":["Lord Rama","Lord Vishnu","Lord Indra","Lord Shiva"],"a":3,"e":"Lord Shiva. Ramappa Temple (Rudreshwara Temple or Ramalingeswara Temple) - Situated in Palampet in (Warangal) Telangana. It is a masterpiece of the Kakatiyan style of temple architecture. In July 2021, Ramappa Temple was declared as a UNESCO World Heritage Site. Other famous temples (Telangana) - Chilkur Balaji Temple, Sanghi Temple, Gnana Saraswathi Temple, Surendrapuri Temple, Karmanghat Hanuman Temple, Beechupally Anjaneya Swamy Temple.","s":""},{"n":1705,"t":"Religious Places","q":"Dilwara Temples at Mount Abu, Rajasthan is an example of _______ temple architecture.","o":["Buddhist","Jain","Mughal","Dravida"],"a":1,"e":"Jain. Dilwara Temple (Nagara Style of Architecture): Built by Vimal Shah and designed by Vastupala. Other Jain Architecture: Ellora Caves (Maharashtra), Hathi Gumpha.","s":""},{"n":1706,"t":"Religious Places","q":"______ was considered as the most important part of some of the earliest Hindu temples.","o":["Shikharas","Garbhagriha","Gatas","Man
