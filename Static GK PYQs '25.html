a":2,"e":"Sikkim . 'Sakewa' is an annual festival and is celebrated as a tribute to mother nature. The rituals for this particular festival are performed in an open space, which is also known as Bhoomi Puja or Chandi Puja. Other important festivals of Sikkim: Losung, Drupka Tesh, Bumchu, Saga Dawa, Dasin and Phang Lhabsol .","s":""},{"n":461,"t":"Festivals","q":"Consider the following statements regarding Hampi Utsava:\n1. Hampi Utsava, also known as Vijaya Utsava, is celebrated in Karnataka and showcases the glory of the Vijayanagara Empire.\n2. Sarhul Mahotsava, also called Vijaya Utsava, is celebrated in Karnataka to mark the New Year of the Oraon, Munda, and Ho tribes. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Sarhul is not Vijaya Utsava. It is a tribal festival celebrated in Jharkhand by the Oraon, Munda, and Ho tribes to mark the advent of spring and New Year.","s":""},{"n":462,"t":"Festivals","q":"The Indian festival of Holi comes every year in the season of:","o":["spring","autumn","summer","winter"],"a":0,"e":"Spring. Holi, also known as the Festival of Colors, is celebrated on the full moon day of the Phalguna month in the Hindu calendar. Other notable festivals and their seasons include: Diwali, celebrated in autumn (usually October or November); Makar Sankranti, observed in winter (January); Pongal, also in winter (January); and Ganesh Chaturthi, celebrated during the monsoon season (August or September).","s":""},{"n":463,"t":"Festivals","q":"Mewar festival is celebrated during the _______ festival at Udaipur.","o":["Gangaur","Teej","Dussehra","Holi"],"a":0,"e":"Gangaur - A festival devoted to Goddess Parvati. It is celebrated in March. Festivals of Rajasthan : Camel Festival (Bikaner), Kumbhalgarh Festival, Desert Festival (Jaisalmer), Kajli Teej (Bundi), Abhaneri (Dausa), Ranakpur (Pali), Matsya Festival (Alwar) and Bundi Festival (Bundi).","s":""},{"n":464,"t":"Festivals","q":"In which country is the ‘Kachin Manaw Festival’ celebrated ?","o":["Myanmar","Maldives","Sri Lanka","Nepal"],"a":0,"e":"Myanmar. In the Kachin Manaw Festival, the Kachins perform the Manaw dance - a dance that was part of the Nat (spirit worship) many years ago. Famous festivals of Myanmar : Thingyan, Ananda Pagoda Festival, Kyaukse elephant dance festival.","s":""},{"n":465,"t":"Festivals","q":"Consider the following statements regarding Parsi festivals:\n1. Khordad Sal is celebrated as the birth anniversary of Zoroaster, the founder of Zoroastrianism.\n2. Gahambars is another Parsi festival that marks the birth of Zoroaster. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Gahambars are not related to Zoroaster’s birthday. They are six seasonal festivals celebrating the six elements of creation – sky, water, earth, plants, animals, and humans.","s":""},{"n":466,"t":"Festivals","q":"Which of the following is the festival of Kerala that heralds the harvest season, lasts for 10 days, and has snake boat races etc?","o":["Vishu","Thiruvathira","Thrissur Pooram","Onam"],"a":3,"e":"Onam. Onam is the biggest festival in the Indian state of Kerala. Onam Festival falls during the Malayali month of Chingam (Aug - Sep) and marks the homecoming of legendary King Mahabali. Kumarakom boat race is the most admired boat race to take place on the Vembanad Lake in September during Onam. Other Festivals of Kerala : Thrissur Pooram Festival, Attukal Pongala Festival, Navarathri Festival, Makaravilakku Festival, Kerala Village Fair, Aluva Sivarathri Festival, Vishu Festival.","s":""},{"n":467,"t":"Festivals","q":"Consider the following statements regarding Muharram:\n1. Muharram is the first month of the Islamic Calendar and is considered a holy month.\n2. It commemorates the birth of Hazrat Imam Hussein, and a relic called Alam is taken out as a procession.\n3. The festival is known as Peerla Panduga predominantly in Kerala. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":0,"e":"1 only. Statement 2 is incorrect. Muharram commemorates the martyrdom of Hazrat Imam Hussein, not his birth. A relic called Alam is indeed taken out as a procession. Statement 3 is incorrect. The festival is known as Peerla Panduga in Telangana, not Kerala.","s":""},{"n":468,"t":"Festivals","q":"Consider the following statements regarding Bali Yatra:\n1. Bali Yatra is a traditional cultural festival of Odisha.\n2. It is a major Boita Bandana festival held at Cuttack on Kartik Purnima and lasts for 7 days or more.\n3. It is considered to be one of Asia's largest open-air music festivals. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 2 only. Statement 2 is correct. It is a significant Boita Bandana festival that takes place in Cuttack on Kartik Purnima and typically continues for 7 days or more. Bali Yatra is considered one of Asia's largest open trade fairs, not an open-air music festival.","s":""},{"n":469,"t":"Festivals","q":"Jamshedi Navroz is a festival of _________ community.","o":["Christian","Hindu","Parsi","Jain"],"a":2,"e":"Parsi. Navroz has links with the legend of King Jamshid of Iran, also called Jamshedi Navroz. It is celebrated on the first day of the first month of the Fasli calendar, which usually falls on August 18 or August 19.","s":""},{"n":470,"t":"Festivals","q":"Consider the following statements about Hindu festivals:\n1. Dussehra is celebrated in the month of Ashwin.\n2. Holi is celebrated in the month of Phalguna.\n3. Diwali is celebrated in the month of Kartik.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. Dussehra (Vijayadashami) is celebrated on the 10th day of Shukla Paksha in the Ashwin month (Sept - Oct). Holi is celebrated in the Phalguna month (Feb - March). Diwali is celebrated on Amavasya of Kartik month (Oct - Nov).","s":""},{"n":471,"t":"Festivals","q":"The Braj festival in ________ is held every year for two days in the Shukla Paksha of the Phalgun month, a few days before Holi.","o":["Haryana","Rajasthan","Madhya Pradesh","Himachal Pradesh"],"a":1,"e":"Rajasthan. Braj festival is dedicated to Lord Krishna who is believed to have spent a considerable amount of time in this region. Other festivals of the state with districts: Kajli Teej - Bundi, Abhaneri festival’ - Dausa, Marwar Festival - Jodhpur. Momasar -Bikaner, Chandrabhaga - Jhalawar, Matsya - Alwar, Kolayat - Bikaner, Kumbhalgarh fort festival - Udaipur, Ranakpur pali.","s":""},{"n":472,"t":"Festivals","q":"Pinjore heritage festival is organised by the state of ________.","o":["Uttarakhand","Sikkim","Haryana","Jharkhand"],"a":2,"e":"Haryana. The Pinjore Heritage Festival is held annually in December at the historic Yadavindra Gardens in Pinjore, Panchkula, Haryana. This event is organized to celebrate and honor the unique heritage of Pinjore and its renowned Mughal Gardens. The festival was first introduced in 2006.","s":""},{"n":473,"t":"Festivals","q":"In Gujarat, the festival Makar Sankranti is celebrated as:","o":["Dakshinayan","Uttarayan","Paschimayan","Purbayan"],"a":1,"e":"Uttarayan. Makar Sankranti denotes the entry of the sun into the zodiac sign of Makara (Capricorn) as it travels on its celestial path. As part of the official celebration of 'Uttarayan', the Gujarat government has been hosting the International Kite Festival since 1989.","s":""},{"n":474,"t":"Festivals","q":"Consider the following statements regarding festivals in Gujarat:\n1. The Kutch festival is held in Bhuj and is a carnival of music, dance, and natural beauty in White Rann.\n2. The International Kite Festival, also known as Makar Sankranti or Uttarayan, is celebrated in Ahmedabad.\n3. The Tarnetar fair is an annual celebration that takes place in the Saputara region every monsoon. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 2 only. Statement 3 is incorrect. The Tarnetar fair is based on the legend of Draupadi's swayamvara, while the Megh Malhar Parv is the annual celebration that takes place in the Saputara region every monsoon.","s":""},{"n":475,"t":"Festivals","q":"Easter is a religious festival of:","o":["Hindus","Christians","Buddhists","Sikhs"],"a":1,"e":"Christians. Easter celebrates the resurrection of Jesus Christ from the dead.It is observed on the first Sunday following the full Moon after the spring equinox. The custom of decorating eggs is practiced during Easter. The holiday concludes the “Passion of Christ,” a series of events and holidays that begins with Lent (a 40-day period of fasting, prayer and sacrifice) and ends with Holy Week, which includes Holy Thursday, Good Friday, and Easter Sunday.","s":""},{"n":476,"t":"Festivals","q":"' Tamu Lochar' is one of the traditional festivals of the_________of Sikkim. It is celebrated to mark the beginning of their new year, which falls on the 15th day of Pusa, according to the Hindu calendar Vikram Samvat and 30th December in the English calendar.","o":["Gurung community","Bhutia community","Mangar community","Lepcha community"],"a":0,"e":"Gurung community. Festivals celebrated in Sikkim: Maghe Sankranti, Sonam Lochar, Losar, Ramnawami (Chaite Dasain), Sakewa, Saga Dawa, Eid Ul Fitr, Bhanu Jayanti, Drukpa Tshechi, Tendong Lho Rum Faat, Indrajatra, Pang Lhabsol, Barahimizong, Kagyed Dance. Vikram Samvat was started in 57 B.C. when the emperor Vikramaditya defeated Sakas.","s":""},{"n":477,"t":"Festivals","q":"With reference to Chethiagiri Vihar festival consider the following statements and select the correct option.\ni) It is a Buddhist festival.\nii) It is held at Sanchi, Madhya Pradesh.\niii) Relics of SariPutta and Maha Moggallana are worshiped","o":["Both ii and iii","Both i and iii","Both i and ii","i, ii, iii"],"a":3,"e":"i, ii, iii. Other Buddhist festivals include Buddha Purnima, Hemis Festival, Losar Festival, Lumbini Festival, Parinirvana Day, Rumtek Chaam Festival and Mani Rimdu Festival.","s":""},{"n":478,"t":"Festivals","q":"Every year in the month of February, this camel festival is organised by Rajasthan Tourism Development Corporation in __________.","o":["Jaisalmer","Jodhpur","Bikaner","Barmer"],"a":2,"e":"Bikaner. Bikaner Camel Festival happens in January month which Bikaner celebrates in honor of the 'Ship of the Desert', the Camel. Festivals of Rajasthan: Desert Festival, Pushkar Fair, Jaipur Literature Festival, Nagaur Fair, Kite Festival, Mewar Festival, Urs Festival, Brij Holi, Elephant Festival, Chandrabhaga Fair, Bundi Utsav, Kumbhalgarh festival, Baneshwar festival, Kolayat Fair, etc.","s":""},{"n":479,"t":"Festivals","q":"Consider the following statements:\n1. Goga Navami, primarily celebrated in the Indian state of Rajasthan, is dedicated to the snake God, Gogaji.\n2. The Pushkar Fair, a significant festival of Rajasthan, is well-known for its grand elephant processions. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. While the Pushkar Fair is indeed a significant festival in Rajasthan, it is renowned as one of the world's largest camel fairs, known for its camel trading and races, not for grand elephant processions.","s":""},{"n":480,"t":"Festivals","q":"Which festival is celebrated after the month of Ramzan ?","o":["Eid ul Fitr","Muharram","Milad un Nabi","Jammat Ul Vida"],"a":0,"e":"Eid ul Fitr. It is a religious festival celebrated by Muslims at the end of the holy month of Ramzan. It is celebrated on the first day of Shawwal, the tenth month of the Islamic calendar. Everyone celebrates this festival together and prays to God for happiness, peace, and prosperity.","s":""},{"n":481,"t":"Festivals","q":"Kojagiri Poornima is a festival celebrated primarily in _______ on the full moon day of Ashwin month.","o":["Maharashtra","Kerala","Andhra Pradesh","Bihar"],"a":0,"e":"Maharashtra. Sharad Purnima is also known as Kojagiri or Raas Purnima. It is a harvest festival. Other festivals of Maharashtra : Gudi Padwa or Chaitra Pratipada, Pola, Narali Purnima, Ratha Saptami, Marabats and Badgyas, etc,.","s":""},{"n":482,"t":"Festivals","q":"Consider the following statements regarding Christian and Muslim festivals:\n1. Christmas is celebrated by Christians on December 25 to commemorate the birth of Jesus Christ.\n2. Good Friday is a Christian holiday commemorating the crucifixion and death of Jesus, observed as part of the Paschal Triduum.\n3. Easter celebrates the Resurrection of Jesus Christ, while Eid ul-Fitr is a Muslim festival that marks the beginning of Ramadan. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 2 only.\nStatement 3 is incorrect. While Easter celebrates the Resurrection of Jesus Christ, Eid ul-Fitr is a Muslim festival that marks the end of Ramadan, not the beginning.","s":""},{"n":483,"t":"Festivals","q":"Ugadi is celebrated primarily in which of the following states on the first day of the Chaitra month of the Hindu calendar?","o":["Odisha","Assam","Karnataka","Uttarakhand"],"a":2,"e":"Karnataka. Ugadi festival represents the beginning of the New Year. Other festivals of Karnataka -Hampi Festival, Karnataka Rajyotsava, Vairamundi Festival. Other states and their festivals : Odisha - Ratha Yatra, Raja Parba, Bali Jatra. Assam - Ambubachi Mela, Dehing Patkai, Bihu. Uttarakhand -Uttarayani, Phool Dei.","s":""},{"n":484,"t":"Festivals","q":"Consider the following statements:\n1. Bonalu is a traditional Hindu festival dedicated to Goddess Mahankali, primarily celebrated in Telangana.\n2. The name \"Bonalu\" is derived from a Sanskrit word meaning \"food\" or \"offering.\" Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. The name \"Bonalu\" is derived from the Telugu word \"Bona,\" meaning \"food\" or \"offering,\" not a Sanskrit word.","s":""},{"n":485,"t":"Festivals","q":"Consider the following statements:\n1. The festival of Eid Milad-un-Nabi is celebrated in the Islamic month of Rabi' al-Awwal.\n2. This festival commemorates the birth anniversary of Prophet Muhammad, who was born in Medina. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. While the festival commemorates the birth anniversary of Prophet Muhammad, he was born in Mecca, not Medina.","s":""},{"n":486,"t":"Festivals","q":"Consider the following statements:\n1. The festival of Ram Navami is celebrated in the Hindu month of Chaitra, typically in April.\n2. It commemorates the birth of Lord Krishna, who is considered the eighth incarnation of Lord Vishnu. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. Ram Navami commemorates the birth of Lord Rama, the seventh incarnation of Lord Vishnu, not Lord Krishna.","s":""},{"n":487,"t":"Festivals","q":"According to Hindu calendar, on which day does Holika Dahan take place?","o":["Phalgun Poornima","Chaitra Poornima","Chaitra Pratipada","Phalgun Amawasya"],"a":0,"e":"Phalgun Poornima . Holika Dahan is celebrated on the eve of Holi, the festival of colors. According to the Hindu calendar, Holi takes place on the full moon day (Poornima) of the month of Phalgun. Different names in the different regions - Rang Panchami (Maharashtra, Rajasthan and Madhya Pradesh), Lathmar Holi (Uttar Pradesh), Holla Mohalla (Punjab), Shigmo (Goa), Royal Holi (Udaipur), Kumaoni Holi and Khadi Holi (Uttarakhand), Manjal Kuli (Kerala), Dol Jatra (West Bengal), Yaosang (Manipur), Phaguwa (Bihar).","s":""},{"n":488,"t":"Festivals","q":"Consider the following statements regarding the Behdienkhlam Festival:\n1. Behdienkhlam is celebrated in the month of July after the sowing period and is associated with the Jaintia tribes of Meghalaya.\n2. The festival is popularly known as “chasing away the Demon of Cholera.”\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Other famous Festivals : Meghalaya -Wangala, Nongkrem, Shad Suk Mynsiem, Shad Sukra.","s":""},{"n":489,"t":"Festivals","q":"Match the following festivals with the tribes/states associated with them: (Festivals) (Associated Tribe)\nA. Myoko 1. Apatani Tribe\nB. Mopin 2. Galo Tribe\nC. Chalo-Loku 3. Nocte Tribe\nD. Solung 4. Adi Tribe","o":["A–1, B–2, C–3, D–4","A–2, B–1, C–4, D–3","A–3, B–4, C–2, D–1","A–4, B–3, C–1, D–2"],"a":0,"e":"A–1, B–2, C–3, D–4 . Myoko - Apatani tribe (Arunachal Pradesh) -festival for fertility and kinship. Mopin -Galo tribe (Arunachal Pradesh) -agricultural festival seeking prosperity. Chalo-Loku - Nocte tribe (Arunachal Pradesh) - post-harvest celebration. Solung - Adi tribe (Arunachal Pradesh) -agriculture and community welfare festival.","s":""},{"n":490,"t":"Festivals","q":"The Karbi tribe, which celebrates the cultural festival ‘Rongker’, belongs to the Indian state of _________.","o":["Kerala","Maharashtra","Assam","Uttarakhand"],"a":2,"e":"Assam. Rongker, winter post-harvest festival, is celebrated either on 5th January or 5th February as per the convenience of the villagers. Festival and their tribes : Kherai Puja of the Bodos; the Baikhu and Pharkantis of the Rabhas; the Ali-ai-ligang and Parag of the Mishing tribe; and the Sagra-misawa, wansawa, and laghun of the Tiwas.","s":""},{"n":491,"t":"Festivals","q":"In which of the following cities is the Agera festival celebrated ?","o":["Kolkata","Lucknow","Mumbai","Chennai"],"a":2,"e":"Mumbai. Agera is celebrated by the Christian farming community, and it takes place in October. It is a harvest festival. Other cities and their festivals : Kolkata - Durga Puja, Mumbai - Ganesh Chaturthi, Chennai - Pongal.","s":""},{"n":492,"t":"Festivals","q":"Consider the following statements regarding the Chethiyagiri Vihara festival:\n1. The Chethiyagiri Vihara festival is celebrated in the Indian state of Madhya Pradesh.\n2. The festival is held in December and attracts pilgrims to view the relics of Buddha’s two great disciples, Sariputta and Mahamogallena. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. While the festival does attract pilgrims to view the relics of Buddha’s two great disciples, Sariputta and Mahamogallena, it is celebrated in November, not December.","s":""},{"n":493,"t":"Festivals","q":"Which of the following festivals is also known as the ‘100 drums festival’?","o":["Cheiraoba","Sanken","Saga Dawa","Wangala"],"a":3,"e":"Wangala. This festival is celebrated after harvest to thank Misi Saljong, the ‘Sun God’ and Mini-ma Kiri Rokime, the ‘Goddess of Grains’. This festival is usually celebrated in the month of October or November. Festivals of Meghalaya: Shad Suk Mynsiem, Nongkrem Festival, Behdienkhlam Festival, Shad Sukra, Strawberry Festival.","s":""},{"n":494,"t":"Festivals","q":"In which of the following festivals is Kolam drawn?","o":["Karma","Bhogali Bihu","Hareli","Pongal"],"a":3,"e":"Pongal. It is a harvest festival celebrated by the Tamil community. It is primarily celebrated in Tamil Nadu, Andhra Pradesh, Karnataka and Puducherry. Other harvesting festivals: Karma (Jharkhand), Bhogali Bihu (Assam), Hareli (Chhattisgarh), Onam (Kerala), Nuakhai (Odisha), Gudi Padwa (Maharashtra).","s":""},{"n":495,"t":"Festivals","q":"Consider the following statements regarding the Moatsu Festival:\n1. The Moatsu Festival is celebrated by the Ao tribes of Nagaland during the first week of May every year.\n2. Hornbill Festival, Amongmong Festival, and Nazu Festival are also important festivals of Nagaland.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct. Other festivals celebrated in Nagaland: Nazu Festival, Amongmong Festival, and Hornbill Festival.","s":""},{"n":496,"t":"Festivals","q":"‘Gugga Naumi’ – the festival celebrated in Haryana and some parts of Punjab, Rajasthan, UP and Himachal Pradesh______is known as the festival of:","o":["camel-worshiping","cow-worshiping","snake-worshiping","owl-worshiping"],"a":2,"e":"Snake-worshiping. Gugga Naumi festival celebrated in the honour of Gugga Pir. It is observed on the 9th day of the Krishna Paksha (waning phase of moon) in Bhadon month (August and September).","s":""},{"n":497,"t":"Festivals","q":"Doul Utsav is majorly celebrated in which of the following states ?","o":["Bihar","Assam","Chhattisgarh","Maharashtra"],"a":1,"e":"Assam. Doul Utsav is also called ‘holi’ or ‘rang. Other festivals celebrated in Assam - Bihu, Baishagu, Ali-Ai- Ligang, Baikho, Rongker, Rajini Gabra, Harni Gabra, Bohaggiyo Bishu, Ambubachi Mela and Jonbill Mela. Festivals in other states: Bihar - Chhath Puja, Bihula, Sama chakeva. Chhattisgarh - Pola, Madai Festival, Hareli, Bhoramdeo Mahotsav. Maharashtra - Ganesh Utsav, Gudi Padva.","s":""},{"n":498,"t":"Festivals","q":"Bhagoria is a festival associated with which of the following festivals ?","o":["Diwali","Dusshera","Holi","Shiv Ratri"],"a":2,"e":"Holi: A Hindu festival that is celebrated in the spring season. Bhagoria is a tribal festival that is celebrated in Madhya Pradesh and Maharashtra. Tribal Festivals - Hornbill Festival (Nagaland), Tusu Parab (Jharkhand), Bastar Dussehra (Chhattisgarh), Nagoba Jatara (Telangana).","s":""},{"n":499,"t":"Festivals","q":"For how many days is the Tirupati Tirumala Brahmotsavam organised?","o":["12","9","15","5"],"a":1,"e":"9. Tirupati Tirumala Brahmotsavam - It is annually celebrated at the Venkateswara Temple in Tirupati district in Andhra Pradesh. Other Temple Festivals: Thrissur Pooram (Vadakkumnathan Temple, Kerala), Arattu festival (Sree PadmanabhaSwamy Temple, Kerala), Vaikunth Chaturdashi Mela (Kamleshwar Mahadev Temple, Uttarakhand), Buddha Purnima (Mahabodhi Temple, Bodhgaya, Bihar), Ambubachii Mela (Kamakhya Devi Temple, Assam).","s":""},{"n":500,"t":"Festivals","q":"Consider the following statements:\n1. The birth anniversary of Lord Mahavir Swami is celebrated in the month of Chaitra as per the Hindu calendar.\n2. The festival of Diwali is also celebrated in the month of Chaitra.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Statement 2: Incorrect – Diwali is not celebrated in Chaitra; it falls in the month of Kartik. Hindu calendar and their festival/jayanti: Chaitra - Ugadi, Gudi Padwa, Rama Navami, Hanuman Jayanti. Vaishakha -Parshuram jayanti, Akshaya Tritiya. Jyeshtha - Gayatri Jayanti, Ganga Dussehra. Ashadha - Guru Purnima, Jagannath Rathyatra. Shravana - Nag Panchami, Raksha Bandhan. Bhadrapada - Krishna Janmashtami, Ganesh Chaturthi, Hartalika teej. Ashwin - Durga Ashtami. Kartik - Karwa Chauth, Dhanteras, Diwali, Bhaiya Dooj, Chhath Puja.","s":""},{"n":501,"t":"Festivals","q":"What does Gudi signify in Gudi Padwa festival as per Hindu mythology?","o":["Symbol of harmony","Symbol of victory","Symbol of peace","Symbol of power"],"a":1,"e":"Symbol of victory. Gudi Padwa: It is marathi new year. Gudi is made by tying a piece of fresh cloth around a bamboo stick of about 5 feet long and Marathis place neem leaves along with sugar candy garland on it. The stick is then placed in a silver or bronze pot. In Karnataka, Telangana and Andhra Pradesh this festival is also known as Ugadi. It is celebrated in the first month of Chaitra.","s":""},{"n":502,"t":"Festivals","q":"Which of the following statements is/are correct regarding the Hornbill Festival?\nA. The Hornbill Festival is celebrated in the North-eastern state of Nagaland.\nB. The festival takes place in the month of January.\nC. The name of the festival is derived from the Indian Hornbill, a bird that is an essential character of the folk tales of the state.","o":["Both A and B","Both B and C","A, B and C","Both A and C"],"a":3,"e":"Both A and C. Hornbill Festival is celebrated from 1 to 10 December in Nagaland. It is also called festivals of festivals.","s":""},{"n":503,"t":"Festivals","q":"Which of the following statements is/are correct regarding Bathukamma Festival?\nA. This festival is celebrated in the state of Telangana.\nB. Bathukamma which means ‘Mother Goddess come and live’ is a colourful floral festival.\nC. This festival is celebrated for 9 days mostly during September or October (mostly before Dussehra).\nD. During this festival, men will sing songs and dance around the flower bunches.","o":["Only A, B and C","Only B, C and D","A, B, C and D","Only A, C and D"],"a":0,"e":"Only A, B and C.","s":""},{"n":504,"t":"Festivals","q":"Ker and Garia Puja are traditional tribal festivals of which state?","o":["Manipur","Jharkhand","Tripura","Odisha"],"a":2,"e":"Tripura. Other festivals (Tripura) : kharchi Puja, Bizu Festival, Ashokastami, Lampra Puja, Wah festival etc. Manipur (Gang-Ngai, Lui-Ngai-Ni, Yaosang, Cheiraoba, Kang). Jharkhand (Karam, Sarhul, Rohini, Sohrai, Makar). Odisha (Ratha Yatra, Raja Parba, Naukhai, Kalinga Mahotsav).","s":""},{"n":505,"t":"Festivals","q":"Match the following festivals with the states where they are predominantly celebrated:\nList I (Festivals) List II (States) P. Chapchar Kut 1. Nagaland\nQ . Hornbill 2. Mizoram R. Wangala 3. Manipur S. Yaosang 4.Meghalaya\nChoose the correct match:","o":["P-1, Q-2, R-3, S-4","P-2, Q-1, R-4, S-3","P-3, Q-4, R-1, S-2","P-4, Q-3, R-2, S-1"],"a":1,"e":"P-2, Q-1, R-4, S-3. States and their festivals : Mizoram - Anthurium, Mim Kut, Pawl Kut. Nagaland - Hornbill, Sekrenyi, Aoleang. Meghalaya - Shad Suk Mynsiem, Nongkrem, Behdienkhlam, Wangala. Manipur - Gang-Ngai, Lui-Ngai-Ni, Yaosang.","s":""},{"n":506,"t":"Festivals","q":"Chad Shukra festival is celebrated by the Jayanti tribe of ______________.","o":["Assam","Punjab","Jharkhand","Meghalaya"],"a":3,"e":"Meghalaya. Chad Shukra is a sowing festival of Jaintia communities. Other festivals of Meghalaya -Behdienkhlam (Jaintia), Wangala (Garo), Ka Shad Suk Mynsiem (Khasi), Nongkrem (Khasi).","s":""},{"n":507,"t":"Festivals","q":"______ is celebrated in Jharkhand immediately after Diwali on the new moon day in the honour of cattle.","o":["Bhagta Parab","Makar","Rohini","Sohrai"],"a":3,"e":"Sohrai - A chief festival of Santhal tribe. It is celebrated on Amavasya (new moon) in the Hindu month of Kartik (October-November). It is known for the care of domestic animals, such as cows and buffaloes. Other festivals of Jharkhand: Sarhul, Karam, Hal Punhya, Bhagat Parab, Rohini, Bandana and Java.","s":""},{"n":508,"t":"Festivals","q":"The sal tree assumes great significance in a number of tribal communities scattered across eastern India. For instance ________ festival is celebrated in honour of the tree , in Jharkhand.","o":["Karma","Tusu Parab","Sarhul","Sohrai"],"a":2,"e":"Sarhul : Celebrated by -Oraon, the Munda and the Ho tribes of Jharkhand. It marks the beginning of New Year. Celebrated - Every year in the first month of the Hindu calendar, on the third day of the moon or the fortnight of 'Chaitra'.","s":""},{"n":509,"t":"Festivals","q":"Consider the following statements:\n1. Buddha Purnima is observed on the full moon day of the Hindu month of Jyaiṣṭha (Jyaistha).\n2. It commemorates the birth, enlightenment (nirvana), and mahāparinirvāṇa (death) of Gautama Buddha.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is wrong: Buddha Purnima falls on the full moon day of Vaiśākh (Vaisakh), not Jyaiṣṭha.","s":""},{"n":510,"t":"Festivals","q":"Dree Utsav is celebrated in the state of __________.","o":["Arunachal Pradesh","Kerala","Assam","Andhra Pradesh"],"a":0,"e":"Arunachal Pradesh. States and their Festivals: Arunachal Pradesh -Boori Boot, Myoko, Pongtu, Murung, Solang, Mopin, Monpa. Kerala - Snake Boat (Vallam Kali), Theyyam, Onam, Attukal Pongala. Andhra Pradesh: Pongal, Ugadi, Rottela Panduga, Prabhala Theertham, Visakha Utsav, Tirupati Tirumala Brahmotsavam, Lumbini Festival, Rayalaseema Food and Dance Festival, etc.","s":""},{"n":511,"t":"Festivals","q":"Consider the following statements:\n1. Losoong festival is celebrated as the New Year festival of Nagaland, mainly by the Ao and Angami tribes.\n2. It is observed in the month of October to mark the end of the monsoon season.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2 is correct. Losoong is the New Year festival of Sikkim, observed by the Bhutia and Lepcha tribes. Statement 2 is wrong: It is observed in December, marking the end of the harvest season when farmers celebrate prosperity.","s":""},{"n":512,"t":"Festivals","q":"Which festival brings out the fusion rich culture of Chhattisgarh and Odisha?","o":["Rath Yatra","Bastar Goncha","Shoolini fair","Madhavpur fair"],"a":1,"e":"Bastar Goncha (referred to as chariot festival) - Performed by the Bastar tribal people. It is observed during the Rath Yatra (June or July) of Odisha. Other tribal festivals of Chhattisgarh: Bastar Dussehra, Bastar Lokotsav, Koriya Mela, Fagun Wadai, Madai Festival and Pola Festival, Gauri Gaura puja. Himachal Pradesh (Shoolini Fair - Solan). Gujarat (Madhavpur Fair - Porbandar).","s":""},{"n":513,"t":"Festivals","q":"Consider the following statements:\n1. The Sakraat festival is celebrated in Odisha with the ‘Budigali’ or ‘Kalasi’ dance.\n2. In this dance, women participate by carrying decorative pots on their heads.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":514,"t":"Festivals","q":"The Konark Dance Festival (KDF) has been held at Konark since 1986 between ______ every year.","o":["1 st and 5 th October","1 st and 5 th August","1 st and 5 th January","1 st and 5 th December"],"a":3,"e":"1st and 5th December. The Konark Dance Festival is held at an open-air auditorium in the backdrop of the Sun Temple (Black Pagoda). Dance Festival in India - Bamnia Chhau Dance Festival (West Bengal), Khajuraho Dance Festival (Madhya Pradesh), Mamallapuram Dance Festival and Natyanjali Festival (Tamil Nadu), Nishagandhi Dance Festival (Kerala), Sirpur Music and Dance Festival (Chhattisgarh).","s":""},{"n":515,"t":"Festivals","q":"Consider the following statements:\n1. Lui Ngai Ni is a harvest festival celebrated by the Naga tribes of Manipur.\n2. It is observed every year on 15th February, marking the beginning of the Naga New Year.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only is correct. Statement 2 is correct: It is celebrated on 15 February every year and marks the Naga New Year.","s":""},{"n":516,"t":"Festivals","q":"Indian festival Dussehra is a famous celebration that takes place at which of the following?","o":["Mysore Palace","Nizam Palace","Mayurbhanj Palace","Jaipur Palace"],"a":0,"e":"Mysore Palace (Karnataka). Established - 1912, Started construction in 1897. It was the residence of Wodeyars rulers who ruled Mysore for seven centuries. Nizam Palace (Kolkata) - It was constructed in 1933.","s":""},{"n":517,"t":"Festivals","q":"Match the following states with their thanksgiving festivals:\nList I (States) List II (Festivals)\nA. Mizoram 1. Pawl Kut\nB. Gujarat 2. Uttarayan\nC. Kerala 3. Onam\nD. Punjab 4. Lohri","o":["A–1, B–2, C–3, D–4","A–2, B–3, C–4, D–1","A–3, B–4, C–1, D–2","A–4, B–1, C–2, D–3"],"a":0,"e":"A–1, B–2, C–3, D–4.","s":""},{"n":518,"t":"Festivals","q":"Consider the following statements:\n1. Jallikattu is a traditional bull-taming sport held in Tamil Nadu as part of the Pongal celebrations.\n2. It is conducted during Onam (August–September).\n3. Other notable Tamil Nadu festivals include Natyanjali Dance Festival, Karthigai Deepam, and Aadi Perukku.\nWhich of the above statement(s) is/are correct?","o":["1 only","1 and 2 only","1 and 3 only","1, 2 and 3"],"a":2,"e":"1 and 3 only. Jallikattu is not linked to Onam (Kerala, Aug–Sep). It is held around Mattu Pongal in January as part of the Pongal festivities in Tamil Nadu.","s":""},{"n":519,"t":"Festivals","q":"Consider the following statements:\n1. Kajari Festival is celebrated in Chhattisgarh, mainly by farmers at the beginning of the sowing season for wheat and barley.\n2. The famous Tulip Festival is organized every year in Agra at the Indira Gandhi Memorial Tulip Garden during the onset of spring.\n3. Chaitrual (festival of pictures) and Phulaich (festival of flowers) are traditional festivals of Himachal Pradesh.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":2,"e":"1 and 3 only are correct.\nStatement 2 – Wrong: Tulip Festival is not in Agra, it is held in Srinagar (Kashmir) at the Indira Gandhi Memorial Tulip Garden.","s":""},{"n":520,"t":"Festivals","q":"Rajini Gabra and Harni Gabra is the cultural festival of which of the following Indian states?","o":["Assam","Bihar","Mizoram","West Bengal"],"a":0,"e":"Assam. Rajini Gabra and Harni Gabra is an annual festival of the Dimasa tribe. This socio-religious festival is celebrated before starting new cultivation.","s":""},{"n":521,"t":"Festivals","q":"Nag Panchami is celebrated in which month of Hindu Calendar?","o":["Shravan","Kartik","Sharad","Asadh"],"a":0,"e":"Shravan. Other festivals in Shravan month - Raksha Bandhan, Hariyali Teej, Narali Purnima. Kartik Month festival - Karwa Chauth, Rama Ekadashi, Dhanteras, Lakshmi Puja (Deewali), Bhaiya Dooj, Chhath Puja. Ashad - Jagannath Rathyatra, Guru Purnima, Yogini Ekadashi. Sharad Purnima is the harvest festival that is celebrated during the holy month of Ashwin in the Hindu lunar calendar.","s":""},{"n":522,"t":"Festivals","q":"Banganga festival takes place annually at which of the following places in Maharashtra ?","o":["Pune","Nashik","Mumbai","Nagpur"],"a":2,"e":"Mumbai. Banganga festival : A two-day music festival (tribute to Lord Rama) celebrated annually in the month of January in Malabar Hills, Mumbai.","s":""},{"n":523,"t":"Festivals","q":"Consider the following statements:\n1. The Chithirai Festival is celebrated in the state of Tamil Nadu.\n2. It is especially famous in the city of Madurai.\n3. The festival marks the marriage of Lord Sundareswarar (Shiva) and Goddess Meenakshi.\nWhich of the above statement(s) is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 are correct.","s":""},{"n":524,"t":"Festivals","q":"In which city of Assam is the Tea Festival celebrated every year?","o":["Guwahati","Silchar","Jorhat","Dibrugarh"],"a":2,"e":"Jorhat. The Tea Festival in the state of Assam is celebrated every year during the winter season between November and January. Major festivals celebrated (Assam): Bihu, Baishagu, Ali-Ai-Ligang, Baikho, Rongker, Rajini Gabra Harni Gabra, Bohaggiyo Bishu, Ambubashi Mela and Jonbill Mela.","s":""},{"n":525,"t":"Festivals","q":"Consider the following statements:\n1. The Losar Festival traces its origin to the Tibetan New Year and is celebrated in Ladakh at the end of the harvesting season.\n2. Losar is also celebrated in other parts of India such as Arunachal Pradesh, Sikkim, and Lahaul (Himachal Pradesh) by tribes following the Mahayana sect of Buddhism.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":526,"t":"Festivals","q":"The 'Kambala' festival is organised by farming communities in the state of ________.","o":["Himachal Pradesh","Rajasthan","Karnataka","Madhya Pradesh"],"a":2,"e":"Karnataka. The Kambala festival is essentially associated with the Buffalo race. The festival is dedicated to Hindu God Lord Kadri Manjunatha, who is the epitome of Lord Shiva.","s":""},{"n":527,"t":"Festivals","q":"The Sikhs celebrate Bandi Chhor Divas which coincides with which Hindu festival?","o":["Ganesh Chaturthi","Holi","Diwali","Dussehra"],"a":2,"e":"Diwali. Bandi Chhor Divas - A Sikh celebration that commemorates the day on which, the sixth Guru of Sikhs, Guru Hargobind released 52 prisoners from Gwalior Fort, who had been imprisoned by Mughal Emperor Jahangir. Emperor Jahangir had held 52 Kings at Gwalior. Other Sikh Festivals - Muktsar Mela, Parkash Utsav Dasveh Patshah, Holla Mohalla, Gurpurab.","s":""},{"n":528,"t":"Festivals","q":"Consider the following statements:\n1. The Doongri Festival is celebrated in Kullu district of Himachal Pradesh as the birthday of Hadimba Devi (wife of Bhima) and is primarily observed by the Hindu community.\n2. The Tamladu Festival is celebrated in Assam, particularly by the Digaru Mishmis tribe of the Buddhist community.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Statement 2 – Wrong: Tamladu Festival is not in Assam, it is celebrated in Arunachal Pradesh (Lohit district) by the Digaru Mishmis tribe.","s":""},{"n":529,"t":"Festivals","q":"Guruvayur Ekadashi is the cultural festival of which Indian state?","o":["Karnataka","Andhra Pradesh","Tamil Nadu","Kerala"],"a":3,"e":"Kerala. Guruvayur Ekadashi is observed in the famous Sri Guruvayur Krishna temple. It is observed in the Vrischikam month as per traditional Malayalam Calendar. Lord Guruvayur is an incarnation of Lord Vishnu.","s":""},{"n":530,"t":"Festivals","q":"Which country celebrates one of the famous festivals known as Paro Tschechu?","o":["Japan","Bhutan","Thailand","Burma"],"a":1,"e":"Bhutan. Paro Tsechu - A mask dance to celebrate the birth anniversary of Padmasambhava (Guru Rimpoche). It is a five-day festival held every year in the month of March or at the beginning of April.","s":""},{"n":531,"t":"Festivals","q":"Which of the following religious festivals is known as Peerla Panduga in Telangana?","o":["Muharram","Christmas","Eid-ul-Fitr","Navroz"],"a":0,"e":"Muharram (first month of the Islamic Lunar Calendar) . It is a sacred festival that commemorates the martyrdom of Hazrat Imam Hussein and is marked by processions. During this occasion, a relic called Alam is taken out as a procession.","s":""},{"n":532,"t":"Festivals","q":"Consider the following statements:\n1. The Makaravilakku Festival is celebrated annually in the Sabarimala Temple of Kerala.\n2. This festival is observed in the month of January, when a sacred light (Makaravilakku) is witnessed on the Ponnambalamedu hill.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":533,"t":"Festivals","q":"Identify the following statements:\n1. Huthri is a rice harvest festival of Karnataka.\n2. It is celebrated in the months of November–December.\n3. Huthri is mainly observed in the region of Coorg (Kodagu).\nWhich of the above statements is/are true?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 are correct.","s":""},{"n":534,"t":"Festivals","q":"Which among the following is an agricultural festival of Arunachal Pradesh and celebrated by the Galo tribe?","o":["Losar","Ugadi","Karma","Mopin"],"a":3,"e":"Mopin. It is a celebration of the harvesting season held in the months of April in East Siang and West Siang districts. Major tribes (Arunachal Pradesh) - Adi, Aka, Apatani, Nyishi, Tagins, Bori, and Bokar.","s":""},{"n":535,"t":"Festivals","q":"Consider the following statements:\n1. Nongkrem Festival is a famous harvest festival of Meghalaya, celebrated in November every year.\n2. It is observed at Tura in the Garo Hills during Autumn.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2: Wrong – The venue is Smit (Khasi Hills), not Tura (Garo Hills). Tura is better known for Wangala.","s":""},{"n":536,"t":"Festivals","q":"Consider the following statements:\n1. Navreh is the lunar New Year festival of Jammu and Kashmir, celebrated on the first day of Chaitra Navratri by Kashmiri Pandits.\n2. Rohini is a harvest festival of Odisha, celebrated after the paddy harvest season.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Rohini is not of Odisha, it is a sowing seeds festival of Jharkhand, celebrated with rituals like Rajsawala Ambavati and Chitgomha.","s":""},{"n":537,"t":"Festivals","q":"The Yaoshang festival of Manipur is celebrated for_______days.","o":["two","five","seven","nine"],"a":1,"e":"Five. Yaoshang festival (Manipur’s version of Holi) - Celebrated every year on the full moon of Lamta month (February-March) of the Meitei lunar calendar. The highlight of the festival is the ‘ThabalChongba’ (folk dance) . It commemorates the birthday of Chaitanya Mahaprabhu.","s":""},{"n":538,"t":"Festivals","q":"Tusu is a harvest festival celebrated in Jharkhand during the winter on the last day of________ month.","o":["Phalguna","Chaitra","Magha","Poush"],"a":3,"e":"Poush. Tusu is mostly seen in the area between Bundu, Tamar, and Raidih areas of Jharkhand.","s":""},{"n":539,"t":"Festivals","q":"Consider the following statements:\n1. Pongal is a four-day harvest festival of South India, especially Tamil Nadu, also celebrated in Sri Lanka.\n2. The festival is dedicated to Lord Ganesha and marks the beginning of the monsoon season.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Pongal is not for Lord Ganesha, it is dedicated to Surya (Sun God) and marks the end of the winter solstice, not monsoon.","s":""},{"n":540,"t":"Festivals","q":"Consider the following statements:\n1. Solung Festival is celebrated by the Adi Tribe of Arunachal Pradesh.\n2. It is observed in the first week of September as an agricultural festival.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":541,"t":"Festivals","q":"Which among the following festivals marks the birthday of a great Buddhist saint Je Tsongkhapa?","o":["Sarhul","Losar","Tusu","Galdan Namchot"],"a":3,"e":"Galdan Namchot is often celebrated in Tibet, Mongolia and Ladakh. This Festival marks the beginning of the New Year in Ladakh.","s":""},{"n":542,"t":"Festivals","q":"Consider the following statements about Chikal Kalo festival:\n1. Chikal Kalo is a monsoon mud festival celebrated in Goa at the Devaki-Krishna temple grounds of Marcel village.\n2. It is observed on the 12th day of Ashadha month, which usually falls in July.\n3. Chikal Kalo is celebrated in Punjab to commemorate the sowing of paddy.\nWhich of the above statement(s) is/are","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only are correct.","s":""},{"n":543,"t":"Festivals","q":"Consider the following statements about Ganga Dussehra:\n1. Ganga Dussehra is celebrated on the 10th day of Shukla Paksha of Jyeshtha month, marking the descent of River Ganga to Earth.\n2. It is mainly celebrated in December to mark the end of winter solstice.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. It is in May–June, not December.","s":""},{"n":544,"t":"Festivals","q":"Consider the following statements regarding festivals in Punjab:\n1. Baisakhi is a spring harvest festival celebrated predominantly in Punjab and Haryana, commemorating the formation of the Khalsa Panth by Guru Gobind Singh.\n2. Lohri is a three-day long Sikh festival that normally falls in March, dedicated to the onset of the monsoon. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. Lohri marks the passing of the winter solstice. Hola Mohalla is the three-day long Sikh festival which normally falls in March, and Teej is dedicated to the onset of the monsoon.","s":""},{"n":545,"t":"Festivals","q":"Consider the following statements regarding the Sair-E-Gul Faroshan festival:\n1. The Sair-E-Gul Faroshan festival is held in Delhi, specifically in the Mehrauli region.\n2. It is a three-day festival generally held in the month of December, marking the arrival of winter. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect. It is a three-day festival generally held in the month of September, just after the rainy season, not in December.","s":""},{"n":546,"t":"Festivals","q":"Consider the following statements regarding New Year celebrations in South India:\n1. Puthandu is celebrated as the New Year in Tamil Nadu.\n2. Ugadi is the traditional New Year for Keralites, while Onam marks the New Year for the people of Andhra Pradesh. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only.\nStatement 2 is incorrect. Ugadi is the New Year for states like Andhra Pradesh, Telangana, and Karnataka. Onam is a major harvest festival celebrated in Kerala, but Vishu is the traditional New Year for Keralites.","s":""},{"n":547,"t":"Festivals","q":"Wangala festival is celebrated by which of the following tribes?","o":["Bhil tribe","Garo tribe","Tharu tribe","Bhutia tribe"],"a":1,"e":"Garo tribe. Wangala Festival (100 drums festival) is a harvest festival held in honor of Saljong, the Sun-god of fertility. It also signifies the onset of winter. Bhil tribe - Bhagoria Festivals (Madhya Pradesh). Tharu tribe (southern Nepal and northern India) - Dashain (Vijayadashami), Tihar (Deepawali), and Jitiya. Bhutia tribe (Sikkim) - Losar festival.","s":""},{"n":548,"t":"Festivals","q":"Kagyed dance, a customary dance festival which is celebrated annually in Sikkim falls in which month?","o":["May","October","December","August"],"a":2,"e":"December. Kagyed dance (celebrated by Buddhists in the name of eight tantrik Gods and Goddesses) - a customary dance festival, celebrated annually in Sikkim falls on the 28th and 29th day of the tenth month according to the Tibetan calendar and December month according to the English calendar.","s":""},{"n":549,"t":"Festivals","q":"A Hindu festival celebrated by the Tamil community that falls in the Tamil Solar Month is called?","o":["Karaga","Bihu","Onam","Thaipusam"],"a":3,"e":"Thaipusam (This festival is dedicated to Lord Muruga, celebrated on the full moon in the Tamil month of Thai in January/February) .","s":""},{"n":550,"t":"Festivals","q":"Which of the following festivals is organised by the Government of Karnataka, usually in January, to celebrate the grandeur of temples at a UNESCO heritage site?","o":["Kambala Festival","Pattadakal Dance Festival","Karaga Festival","Hoysala Festival"],"a":1,"e":"Pattadakal Dance Festival is a three-day affair and a celebration of the temples in the small village (Pattadakal) of Karnataka.","s":""},{"n":551,"t":"Festivals","q":"Which Indian religious festival has recently been included in the representative list of intangible cultural heritage of humanity by UNESCO, an organisation of the United Nations?","o":["Durga Puja","Ramnavami","Janmashtami","Mahashtami"],"a":0,"e":"Durga Puja (Durgotsava or Sharadotsav) is a ten-day Hindu festival. The festival of Durga Puja is observed to celebrate the triumph of goddess Durga over Mahishasura. It is held in September or October in Kolkata (West Bengal). It was included in the UNESCO List of Intangible Cultural Heritage (2021, List was established in 2008).","s":""},{"n":552,"t":"Festivals","q":"Guru Purnima, a festival celebrated by Hindus, Jains and Buddhists in India falls in which month of Hindu calendar?","o":["Kartika","Vaisakha","Sravana","Ashadha"],"a":3,"e":"Ashadha . It is observed on the Full Moon day (Purnima) in the Hindu month of Ashadha (June -July). Guru Purnima (Vyaas Purnima) is celebrated in India, Nepal, and Bhutan by Hindus, Jains, and Buddhists.","s":""},{"n":553,"t":"Festivals","q":"Consider the following statements:\n1. Thiruvathira is a cultural festival of Kerala, celebrated in honour of Goddess Parvati’s devotion to Lord Shiva.\n2. Sekrenyi Festival is celebrated in Nagaland by the Angami tribe during the month of February.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":554,"t":"Festivals","q":"‘Laru Kaj’ is a festival primarily celebrated by the Gonds of __________.","o":["Madhya Pradesh","Goa","Sikkim","Rajasthan"],"a":0,"e":"Madhya Pradesh. Other festivals - Meghnad parv (Gond tribe), Ratona (Baiga tribe), Bhagoriya (bhil tribe), etc.","s":""},{"n":555,"t":"Festivals","q":"Sammakka-Sarakka Jatara is celebrated in which of the following states of India?","o":["Odisha","Tamil Nadu","Telangana","Chhattisgarh"],"a":2,"e":"Telangana. Festivals of Telangana - Bathukamma, Bonalu, Medaram Jatara.","s":""},{"n":556,"t":"Festivals","q":"Consider the following statements:\n1. The Festival of Salhesh is celebrated in the state of Bihar, along with other festivals like Chhath Puja, Sama-Chakeva, and Madhushravani.\n2. The Float Festival is celebrated in Tamil Nadu, at the Meenakshi Amman Temple in Madurai, dedicated to Goddess Meenakshi (reincarnation of Parvati).\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":557,"t":"Festivals","q":"Gochi festival is an Indian festival majorly celebrated in ________.","o":["Chhattisgarh","Goa","Himachal Pradesh","Karnataka"],"a":2,"e":"Himachal Pradesh. Festivals & Fairs of Himachal Pradesh :- Halda Festival, Kullu Dussehra Fair, Ice Skating Carnival, Losar Festival, International Himalayan Festival, Doongri Fair, Sazo Festival, Phulaich Festival, Sair Festival, Nuala Festival, Khepa Festival, Minjar Fair, Renuka Fair, Markand Fair, Rali Puja Festival, Deotsidh Fair.","s":""},{"n":558,"t":"Festivals","q":"‘Maru Mahotsav’ also known as desert festival is celebrated in ______.","o":["Jaipur","Leh","Jaisalmer","Srinagar"],"a":2,"e":"Maru Mahotsav (Jaisalmer desert festival) is held in the Hindu month of Magh (February), three days prior to the full moon. The festival is celebrated amidst the beautiful dunes of the Thar Desert in the Sam dunes.","s":""},{"n":559,"t":"Festivals","q":"Tribes of the Nicobar Islands pay their respects to the departed soul of the head of the family during the ______.","o":["Ossuary Feast","Jagaddhatri Puja","Ganjan Festival","Kalpataru Utsav"],"a":0,"e":"Ossuary Feast . Goddess Jagadhatri Puja is worshiped in the West Bengal region. Gajan is a Hindu festival, associated with such deities as Shiva-Parvati. Kalpataru Utsav is an annual religious festival observed by monks of the Ramakrishna Math.","s":""},{"n":560,"t":"Festivals","q":"Consider the following statements:\n1. Fatorpa Zatra is celebrated in the state of Goa, at the temple of Shantadurga Kuncolienkarin in Quepem taluka.\n2. Other famous temple fairs of India include Puri Rath Yatra (Odisha), Thrissur Pooram (Kerala), and Chithirai Thiruvizha (Tamil Nadu).\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":561,"t":"Festivals","q":"The Kodava community of Coorg worships weapons during the ______ festival.","o":["Madai","Kailpodh","Thaipusam","Bhagoriya"],"a":1,"e":"Kailpodh . It is celebrated in September. Kail means weapon or armor and Pold means festival. Puttari is the harvest festival of Kodava community.","s":""},{"n":562,"t":"Festivals","q":"Consider the following statements:\n1. Cheiraoba is celebrated as the Manipuri New Year festival, marking the onset of a new year according to the lunar calendar.\n2. Kut Festival is also known as the Manipuri New Year and is mainly celebrated by the Meitei community.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Kut is not Manipuri New Year, it is a harvest festival of the Kuki–Chin–Mizo tribes, not the Meitei community.","s":""},{"n":563,"t":"Festivals","q":"Consider the following statements:\n1. Dhanu Yatra of Odisha’s Bargarh district is the world’s largest open-air theatrical performance, dedicated to Lord Krishna.\n2. Kaveri Sankramana is celebrated in the month of October at Rameswaram, Tamil Nadu.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Kaveri Sankramana is not in Tamil Nadu; it is celebrated at Talakaveri, Kodagu district,","s":""},{"n":564,"t":"Festivals","q":"Consider the following statements:\n1. Sundareswara Festival is celebrated in Kerala.\n2. It is dedicated to Lord Vishnu at the Sri Sundareswara Temple.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. The temple is dedicated to Lord Shiva, not Lord Vishnu.","s":""},{"n":565,"t":"Festivals","q":"Consider the following statements:\n1. Drukpa Tsechi is a festival of Sikkim that celebrates Lord Buddha’s first sermon (teaching of the Four Noble Truths) at Sarnath.\n2. The festival is dedicated to Lord Krishna, marking the beginning of the Dwapara Yuga.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct.","s":""},{"n":566,"t":"Festivals","q":"In which of the following months is the ‘Valvil Ori Vizha’ festival of Tamil Nadu celebrated?","o":["June","January","May","August"],"a":3,"e":"August. It is celebrated in a grand manner in the Kolli Hills of Tamil Nadu.","s":""},{"n":567,"t":"Festivals","q":"______ festival in the Bastar region is celebrated along with the worship of the local goddess, Kesharpal Kesharpalin Devi.","o":["Madai","Khatarua","Harela","Phool Dei"],"a":0,"e":"Madai. Festivals of Uttarakhand :- Bhitauli, Harela, Phool Dei, Batsavitri, Ganga Dussehra or Dasar, Dikar Puja, Olgia or Ghee Sankranti, Khatarua, Ghuian Ekadashi, Chhipla Jaat, Kandali, Janopunya, Kumaon Holi (including Khari Holi and Baithaki Holi).","s":""},{"n":568,"t":"Festivals","q":"Teeyan is a festival celebrated in Punjab, which celebrates the onset of ______.","o":["winter","monsoon","summer","spring"],"a":1,"e":"Monsoon . A cultural festival observed by and for women, Teeyan or Punjabi. Teeyan begins on the third day of Saawan Maas and ends on Saawan Purnima, spanning a total of thirteen days.","s":""},{"n":569,"t":"Festivals","q":"In which festival of Maharashtra and Chhattisgarh, are the bullocks and other cattles used for agriculture worshipped?","o":["Ganga Dussehra","Pola festival","Vata Poornima","Jiviti Puja"],"a":1,"e":"Pola is a thanksgiving festival celebrated by farmers in Maharashtra, to acknowledge the importance of bulls and oxen, who are a crucial part of agriculture and farming activities. It falls on the day of the Pithori Amavasya (the new moon day) in the month of Shravana (usually in August).","s":""},{"n":570,"t":"Festivals","q":"Which of the following festivals is called the month of merits and is celebrated between May and June?","o":["Saga Dawa","Bhanu Jaati","Losar","Losoong"],"a":0,"e":"Saga Dawa. It is the most significant and sacred for the followers of Mahayana Buddhism who, on this auspicious occasion, commemorate Lord Buddha’s birth, his attainment of enlightenment and salvation from this corporeal world. It is celebrated in Sikkim.","s":""},{"n":571,"t":"Festivals","q":"Arthunkal Feast and Vettukad Festival are church festivals from the state of ______.","o":["Nagaland","Goa","Sikkim","Kerala"],"a":3,"e":"Kerala . Other Church festivals of Kerala : Bharananganam, Edappally Perunal, Edathua, Kadamattom, Kallooppara Perunal, Koratty, Malayattur, Manjinikkara , Maramon Convention, Niranam, Rakkuli Thirunal, St. Dominic Syrian, Thumpoly, Vettukad.","s":""},{"n":572,"t":"Festivals","q":"In which of the following festivals the meaning is 'merry making of the gods'?","o":["Diwali","Pongal","Lai Haroba","Makar Sankranti"],"a":2,"e":"Lai Haraoba is the ritual ceremonial festival of Manipur which is believed to be the act of re-enactment of the creation of the universe by the gods and goddesses at the sacred site Haraothel of Koubru Hill.","s":""},{"n":573,"t":"Fairs","q":"Consider the following statements:\n1. The Bhavnath Mahadev Fair is held every year at the Bhavnath Mahadev Temple, located at the foot of Mount Girnar in Junagadh, Gujarat.\n2. This fair is organized during the festival of Mahashivratri and continues for five days, attracting devotees and tourists from across India.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct. Other fairs celebrated in Gujarat: Chitra-Vichitra Fair, Dangs Durbar Fair, Shamlaji Fair, and Tarnetar Fair (Trinetrashwar Mahadev Fair).","s":""},{"n":574,"t":"Fairs","q":"Consider the following statements:\n1. The Bhadaravi Poonam Mela is organized every year in the Nilkanth Mahadev temple premises in Babra, Gujarat.\n2. The Ambaji Bhadarvi Poonam Fair is mainly celebrated in Rajasthan, attracting lakhs of devotees every year.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. Ambaji Bhadarvi Poonam Fair is not in Rajasthan, it is in Ambaji, Banaskantha district, Gujarat.","s":""},{"n":575,"t":"Fairs","q":"Madhavpur Fair in Gujarat is a _______ day long event to celebrate Lord Krishna's marriage with Rukmani.","o":["four","two","five","three"],"a":2,"e":"five. Fair and Festivals of Gujarat: Rann Utsav, International Kite Festival, Tarnetar fair, Megh Malhar Parv Saputara, Vibrant Navratri Festival, Dang Darbar Fair, Kavant Fair.","s":""},{"n":576,"t":"Fairs","q":"In which of the following states is the groundnut fair, ’Kadalekayi Parishe’ celebrated on the last Monday of the Karthika month of the Hindu calendar?","o":["Kerala","Tamil Nadu","Madhya Pradesh","Karnataka"],"a":3,"e":"Karnataka. Kadalekayi Parishe is an annual groundnut fair held in Basavanagudi, Bangalore, at the Bull Temple, usually in November or December. Dedicated to Lord Ganesha, it marks the harvest season for groundnuts. The fair features prayers, cultural events, and local markets where farmers sell their fresh produce. It is a centuries-old tradition celebrating Karnataka's agricultural heritage.","s":""},{"n":577,"t":"Fairs","q":"’Poush Mela’ is a unique festival celebrated in which of the following Indian states?","o":["Uttar Pradesh","Himachal Pradesh","West Bengal","Madhya Pradesh"],"a":2,"e":"West Bengal. Poush Mela is an annual fair and festival that takes place in Santiniketan, in Birbhum District, marking the harvest season. Other Fair of West Bengal - Kenduli Mela, Bhim Mela, Rash Mela, Ganga Sagar Mela, Jalpesh Mela, Kolkata Book Fair.","s":""},{"n":578,"t":"Fairs","q":"Consider the following statements:\n1. Gangaur Festival, Pushkar Fair, Nagaur Fair, and Urs Fair are some of the most popular festivals and fairs celebrated in the state of Rajasthan.\n2. Other important fairs of Rajasthan include the Camel Festival, Mahaveerji Fair, Baneshwar Fair, Kolayat Fair, Marwar Festival, and Onam Festival.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only is correct. All listed fairs are of Rajasthan except Onam, which belongs to Kerala, not Rajasthan.","s":""},{"n":579,"t":"Fairs","q":"Consider the following statements:\n1. The Sardhana Christian Fair is held every year in Madhya Pradesh, on the first Sunday of December, in honour of Mother Mary.\n2. Other important fairs of Uttar Pradesh include the Onam Festival, Thrissur Pooram, and Hornbill Festival.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2 is correct.\nStatement 1 - Wrong: Sardhana Christian Fair is not in Madhya Pradesh, it is in Uttar Pradesh (Sardhana town, Meerut district) and is celebrated on the first Sunday of November, not December.\nStatement 2 - Wrong: Onam (Kerala), Thrissur Pooram (Kerala), and Hornbill Festival (Nagaland) are not fairs of Uttar Pradesh. Correct fairs are Kumbh Mela, Nauchandi, Dewa Sharif, Shakumbhari, Bateshwar Cattle Fair, etc.","s":""},{"n":580,"t":"Fairs","q":"Consider the following statements:\n1. The Ambubachi Mela is an annual four-day Hindu fair held at the Kamakhya Temple in Guwahati, Assam.\n2. It symbolizes the fertility cult of Goddess Kamakhya and is one of the most important religious gatherings of Assam.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct.","s":""},{"n":581,"t":"Fairs","q":"Bahu Mela in_______is the major festival held at the Kali Temple in the Bahu Fort twice a year.","o":["Punjab","Leh","Jammu","Haryana"],"a":2,"e":"Jammu. Bahu Mela, one of the largest Hindu festivals in Jammu, is a vibrant celebration held at Bahu Fort. Major festivals in Jammu and Kashmir include the Tulip Festival, Shikara Festival, Saffron Festival and Gurez Festival.","s":""},{"n":582,"t":"Fairs","q":"The Dang Darbar Fair is held every year in which Indian state?","o":["Madhya Pradesh","Rajasthan","Maharashtra","Gujarat"],"a":3,"e":"Gujarat. Dangs Darbar is a fair held during the Holi festival in Ahwa district in Gujarat. Traditionally, tribal people perform dance and music, celebrating it as a festival. Notable festivals in Gujarat include Navratri, Rann Utsav, International Kite Festival (Uttarayan), Modhera Dance Festival, Makar Sankranti, Janmashtami, and Diwali.","s":""},{"n":583,"t":"Fairs","q":"Identify the cultural festival on the basis of given clues: i. This festival brings together craftsmen like potters, embroiderers, weavers, wood carvers, metal workers, stone smiths and painters from all over India on one platform in Haryana. ii. This crafts mela is held in February every year and provides a glimpse of the state’s cultural heritage and recent achievements.","o":["Shamlaji Fair","Surajkund Mela","Kapil Muni Fair","Chitra Vichitra Fair"],"a":1,"e":"Surajkund Mela ( Faridabad). This is one of the most celebrated international Craftsmela and is organised by the Haryana Tourism Department. Shamlaji fair (Gujarat). The Kapil Muni Fair is the largest fair of Bikaner (Rajasthan). The Chitra Vichitra Fair (Gujarat).","s":""},{"n":584,"t":"Fairs","q":"Shri Jagannathji Mela is held at ______.","o":["Cuttack","Sambalpur","Jaipur","Alwar"],"a":3,"e":"Alwar (Rajasthan). The Shri Jagannathji Mela starts with a procession of Lord Jagannath passing through the city. Other Fairs of Rajasthan: Karni Mata Mela (Bikaner); Beneshwar Mela (Dungarpur) and Pushkar Fair (Ajmer).","s":""},{"n":585,"t":"Fairs","q":"Consider the following statements about famous fairs of Rajasthan:\n1. The world’s largest camel fair is held every year at Pushkar during Kartik Purnima.\n2. The Bikaner camel festival is celebrated in the month of November.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: The Bikaner Camel Festival is not held in November but in January.","s":""},{"n":586,"t":"Fairs","q":"Kumbh Mela and Sangam are famous in which state?","o":["Meghalaya","Uttar Pradesh","Manipur","Sikkim"],"a":1,"e":"Uttar Pradesh. This fair starts on the day of Makar Sankranti. This fair is held every 12 years, with the location of the observance rotating among four pilgrimage sites on the four sacred rivers: Ganga at Haridwar, Triveni Sangam at Prayagraj, the Godavari at Nashik, and Shipra at Ujjain. Ardha (half) Kumbh Mela is held at only two places, Haridwar and Allahabad, every sixth year and a Maha Kumbh is held after every 144 years. It is the 13th intangible cultural heritage from India to be listed on UNESCO's list.","s":""},{"n":587,"t":"Fairs","q":"Consider the following statements about the Simhastha fair:\n1. The Simhastha fair is held in Ujjain once every 12 years on the banks of the Kshipra river.\n2. The Simhastha fair is organized on the banks of the Ganga river in Varanasi.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 -Incorrect: The fair is not held on the Ganga in Varanasi; that is the location of a different Kumbh Mela.","s":""},{"n":588,"t":"Fairs","q":"With reference to Sonepur Cattle fair, consider the following statements and select the correct option. a. It is associated with the Hariharnath temple. b. It begins on Purnima (full moon night) and Kartik month. c. It is celebrated in the state of Madhya Pradesh.","o":["Both a and b","Both a and c","Both b and c","a, b, c"],"a":0,"e":"Both a and b. Sonepur Cattle Fair is one of Asia's largest cattle fairs, organized at the confluence of two rivers, the Ganga and Gandak in Bihar. Nagaji Fair is celebrated in the tribal area of Madhya Pradesh.","s":""},{"n":589,"t":"Fairs","q":"Sheorinarayan fair is held in which of the following states?","o":["West Bengal","Jharkhand","Chhattisgarh","Madhya Pradesh"],"a":2,"e":"Chhattisgarh. The fair is held every year in the month of February during the Magh Purnima. The Sherorinarayan Temple which is devoted to Lord Rama is the main venue of this Fair.","s":""},{"n":590,"t":"Fairs","q":"Consider the following statements about fairs of India:\n1. The Ganga Sagar Mela is held annually in West Bengal on Sagar Island at the confluence of the Ganga (Hooghly) and the Bay of Bengal.\n2. The Poush Mela is an important cultural fair of West Bengal, organised every year in Santiniketan.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":591,"t":"Fairs","q":"The Champaran Mela is celebrated every year in which city of Chhattisgarh?","o":["Bilaspur","Raipur","Raigarh","Korna"],"a":1,"e":"Raipur. The Annual Fair of Champaran is held with great festivities in the month of Magh every year.","s":""},{"n":593,"t":"Fairs","q":"Match the following fairs with their correct locations: Fairs / Festivals Location / State\nA. Nagaur Cattle Fair 1. Punjab\nB. Tarnetar Fair 2. Rajasthan\nC. Minjar Fair 3. Gujarat\nD. Hola Mohalla 4. Himachal Pradesh","o":["A–2, B–3, C–4, D–1","A–3, B–2, C–1, D–4","A–4, B–1, C–2, D–3","A–1, B–4, C–3, D–2"],"a":0,"e":"A–2, B–3, C–4, D–1. Nagaur Cattle Fair - Rajasthan (one of India’s largest cattle fairs). Tarnetar Fair -Gujarat (celebrated with folk dance & music, linked to Draupadi’s swayamvar). Minjar Fair - Himachal Pradesh (Chamba, held in July–August, dedicated to River Ravi). Hola Mohalla - Punjab (Anandpur Sahib, Sikh festival with martial arts & religious display).","s":""},{"n":594,"t":"Songs","q":"Match the following folk forms:\nColumn A Column B (Folk Form)\nA. Sohar 1. Echoed love songs sung by girls and boys on hilltops\nB. Chhakri 2. Sung during birth celebrations, shows cultural fusion\nC. Laman 3. All-night women's songs in rainy season, danced in semicircle\nD. Kajri 4. Kashmiri group song with rabab, sarangi, tumbaknari","o":["A-1, B-3, C-4, D-2","A-4, B-2, C-3, D-1","A-3, B-1, C-2, D-4","A-2, B-4, C-1, D-3"],"a":3,"e":"A-2, B-4, C-1, D-3. The folk form Sohar is sung during childbirth celebrations, especially in Bihar and Eastern Uttar Pradesh, symbolizing blessings for the newborn. Chhakri is a Kashmiri group folk song performed with instruments like rabab, sarangi, and tumbaknari. Laman is a love song tradition of Himachal Pradesh, often sung responsively by boys and girls on hilltops. Kajri, popular in Uttar Pradesh and Bihar, is sung by women during the monsoon season, usually in semicircle","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":595,"t":"Songs","q":"In which state is the folk music tradition of \"Zikir\" popular?","o":["Assam","Gujarat","Odisha","Rajasthan"],"a":0,"e":"Assam. Zikir is a popular folk music tradition of Assam, introduced by the Sufi saint Azan Fakir in the 17th century. Other states with their popular folk music: Bihu from Assam, Lavani from Maharashtra, Garba from Gujarat, Pandavani from Chhattisgarh, Rasiya Geet from Uttar Pradesh, Chhakri from Kashmir, Baul and Bhatiali boat songs from West Bengal, and Bhangra from Punjab.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":596,"t":"Songs","q":"Consider the following statements regarding Grammy Awards:\n1. A.R. Rahman, Gulzar and Tanvi Shah won the 52nd Annual Grammy Award for the best motion picture song “Jai Ho”.\n2. The first Indian woman to win a Grammy Award was Alka Yagnik.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: It was Tanvi Shah, not Alka Yagnik, who became the first Indian woman to win a Grammy Award.","s":""},{"n":597,"t":"Songs","q":"Consider the following statements about Bhatiali folk music:\n1. Bhatiali is a traditional folk music of West Bengal, mainly sung by fishermen along rivers, marked by soulful and melancholic tunes.\n2. Bhatiali is the traditional folk music of Kerala, usually sung during Kathakali performances.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1 . Kerala’s folk music includes Kathakali music, Mappila Pattu, Sopanam, etc., but not Bhatiali. Other folk music of West Bengal: Baul, Bhawaia, Kirtan, Gambhira, Shyama Sangeet, Lalon Geeti. Other States and their folk music: Kerala - Kathakali Music, Mappila Pattu, Ottamthullal Songs, Sopanam, Kolkali. Andhra Pradesh -Madiga Dappu, Mala Jamidika. Odisha -Avanti, Panchali, Odramagadhi.","s":""},{"n":598,"t":"Songs","q":"Consider the following statements about Pandavani folk music:\n1. Pandavani is a folk music tradition from Chhattisgarh that narrates stories from the Mahabharata, often with Bhima portrayed as the hero.\n2. Pandavani originated in Goa and is closely linked with the folk tradition of Mando.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Pandavani is a folk music tradition from Chhattisgarh. It narrates the story of the five Pandava brothers (protagonists of the epic Mahabharata). This age-old musical form was kept alive by performers like Teejan Bai, Jhaduram Devangan, Ritu Verma, Usha Barle and Shantibai Chelak. Folk songs of Chhattisgarh : Fag, Karma songs, Danda songs, Sawnahi, Kau-Mau, Sua songs, Chau-Mau Dewar songs, Cher-Chera songs, Sohar song, Khuduwa, Dhankul songs, Bhojali songs, Dandi Pouha, Loriya, Goura songs, Fugdi etc.","s":""},{"n":599,"t":"Songs","q":"Who is known as the ‘Father of Carnatic Music’?","o":["Vidyaranya","Purandara Dasa","Thirunal Rama Varma","Vishwanath Iyer"],"a":1,"e":"Purandara Dasa. Tamil Nadu is famous for Carnatic music, based on ragas (melodies) and talas (rhythms). Purandara Dasa has contributed significantly to its codification and giving it a clear format for its teaching and performance. The devotional songs composed by Shyama Shastri, Tyagaraja and Muthuswami Dikshitar are very popular. These songs are accompanied by instruments like the mridangam, veena, nadaswaram, and flute. In recognition of its musical heritage, Chennai was included in the UNESCO Creative Cities Network in 2017.","s":""},{"n":600,"t":"Songs","q":"Folk songs in _________ are called Raganis.","o":["Haryana","Uttar Pradesh","Bihar","Madhya Pradesh"],"a":0,"e":"Haryana. Raganis are performed by multiple singers and dancers and are sung in the local dialect. State and their Folk songs : Haryana -Gharwa Gayan, Jhoolana, Patka, and Rasia. Uttar Pradesh - khayal, ghazals, Swang, Naqal. Bihar - Sohar, Bidesia, Chhath Geet, Kajri. Madhya Pradesh -Nirguni Bhajans, Fag songs, Pandavani.","s":""},{"n":601,"t":"Songs","q":"Match List-I (Name of the composition) with List-II (Writer).\nList-I (Name of the List-II (Writer) Composition)\n1. Vande Mataram A. Pradeep\n2. Jana Gana Mana B. Bankim Chandra Chattopadhyay\n3. Ae Mere Watan C. Rabindranath Ke Logon Tagore","o":["1-C, 2-A, 3-B","1-B, 2-C, 3-A","1-C, 2-B, 3-A","1-A, 2-B, 3-C"],"a":1,"e":"1-B, 2-C, 3-A. \"Aye Mere Watan Ke Logo\" is a patriotic song written in Hindi by Kavi Pradeep, composed by C. Ramchandra, and sung by singer Lata Mangeshkar. Jana Gana Mana is the national anthem of the Republic of India. It was originally composed as \"Bharoto Bhagyo Bidhata\" in Bengali by polymath Rabindranath Tagore on 11 December 1911. \"Vande Mataram\" is a Bengali poem by Bankim Chandra Chatterjee.","s":""},{"n":602,"t":"Songs","q":"Consider the following statements about folk music of North-East India:\n1. Nyioga is a traditional song of Arunachal Pradesh, sung at the conclusion of marriage ceremonies when the bride’s family departs.\n2. Nyioga is one of the famous folk music traditions of Nagaland, representing its marriage customs.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Nyioga is not from Nagaland. Nagaland’s folk music includes Heliamleu, Hereileu, Neuleu, etc.","s":""},{"n":603,"t":"Songs","q":"The famous folk music ‘Hekialeu’ has its origin in which state?","o":["Assam","Goa","Nagaland","Tami Nadu"],"a":2,"e":"Nagaland. The Hekialeu song is known as the war song of Nagaland. This is because the aged people of Nagaland narrate their achievements in past battles through this form of music. Folk music in India : Baul (West Bengal), Mando (Goa), Sohar (Uttar Pradesh and Bihar), Chhakri (Jammu and Kashmir), and Powada (Maharashtra).","s":""},{"n":604,"t":"Songs","q":"Consider the following statements about Khubakeshei folk song:\n1. Khubakeshei is a traditional folk song from Manipur, sung with clapping and often accompanied by instruments like the Pena or Khartal.\n2. Other popular folk songs of Manipur include Pena Khongba, Khulang Eshei, and Lai Haraoba Eshei.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":605,"t":"Songs","q":"Which of the following musical forms in Carnatic Classical is the simplest composition of raga?","o":["Kirtnam","Varnam","Gitam","Pada"],"a":2,"e":"Gitam. The main traditional forms of improvisation in Carnatic music consist of the following: Alapana, Niraval, Pallavi, Ragam, Swarakalpana, Tanam, Tani, Avartanam. Varnam - A type of composition in Carnatic music that captures the essence of a raga, or scale, in a short piece of music. Padas are scholarly compositions in Telegu and Tamil.","s":""},{"n":606,"t":"Songs","q":"Who among the following wrote the popular Telugu patriotic song ‘Desamunu preminchumanna, manchi annadi penchumanna’ meaning ‘Love the nation, grow the goodness’?","o":["Gurajada Apparao","Sri Krishnadevaraya","Bammera Potana","Goparaju Ramachandra Rao"],"a":0,"e":"Gurajada Apparao. Gurajada Venkata Apparao was an Indian playwright, dramatist, poet, and writer known for his works in Telugu theatre. Rao wrote the play Kanyasulkam in 1892, which is considered as the greatest play in the Telugu language. He holds the titles Kavisekhara and Abyudaya Kavitha Pithamahudu. In 1910, Rao scripted the widely known Telugu patriotic song \"Desamunu Preminchumanna\".","s":""},{"n":607,"t":"Songs","q":"Consider the following statements about Wanawun folk music:\n1. Wanawun is a folk music of Jammu & Kashmir, sung during wedding ceremonies, usually performed by women with instruments like the Tarang and Tumbaknari.\n2. Wanawun is a folk song of Rajasthan, sung by women when fetching water.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: Rajasthan’s folk song related to water-fetching women is Panihari, not Wanawun.","s":""},{"n":608,"t":"Songs","q":"Under which Gharana do the composition of the blend of Khayal and Dhrupad-Dhamar styles come?","o":["Indore Gharana","Patiala Gharana","Agra Gharana","Gwalior Gharana"],"a":2,"e":"Agra Gharana was founded by Haji Sujan Khan. Agra was an important part of Braj Bhumi, the land of Shri Krishna, and home to Bhakti and Sufi saints like Surdas and Raskhan. The Gwalior Gharana, considered the oldest Khayal Gharana in Indian classical music, was founded by Nathan Khan, and Tansen was one of its earliest and most famous vocalists.","s":""},{"n":609,"t":"Songs","q":"Match the following forms of Carnatic music with their correct descriptions: Forms of Description Carnatic Music\nA. Varnam 1. Devotional or heroic composition\nB. Kriti 2. Simple musical composition, usually for beginners\nC. Swarajathi 3. Evolved devotional form, central to Carnatic repertoire\nD. Gitam 4. Unique form used for practice and concert opening","o":["A–4, B–3, C–1, D–2","A–1, B–2, C–3, D–4","A–2, B–4, C–1, D–3","A–3, B–1, C–2, D–4"],"a":0,"e":"A–4, B–3, C–1, D–2.","s":""},{"n":610,"t":"Songs","q":"In Hindustani classical music, according to Vishnu Narayana Bhatkhande, how many thaats are the origins of ragas?","o":["72","52","10","20"],"a":2,"e":"10. These 10 thaats are: Bilawal, Khamaj, Kafi, Asavari, Bhairav, Bhairavi, Todi, Purvi, Marwa, Yaman. Each thaat has a specific arrangement of whole and half steps, and ragas are derived from these thaats by using different combinations of notes, ornamentations, and emotional expressions.","s":""},{"n":611,"t":"Songs","q":"Which of the following songs did AR Rahman record with Michael Jackson?","o":["You are my destiny","The Oracle","Infinity Love","Ekam Satyam"],"a":3,"e":"Ekam Satyam. A.R. Rahman collaborated with Michael Jackson on the song \"Ekam Satyam\" (also known as \"The One Truth\"), which was recorded in\n1999. Michael Jackson (\"King of Pop\") was an American singer, songwriter, dancer, and record producer.","s":""},{"n":612,"t":"Songs","q":"Match the following patriotic songs with their singers/composers: Patriotic Song Singer / Composer\nA. Maa Tujhe 1. Mohammed Rafi Salaam\nB. Aye Mere Watan 2. Lata Mangeshkar Ke Logo\nC. Yeh Desh Hai 3. A.R. Rahman Veer Jawanon Ka\nD. Bharat Ka 4. Mahendra Kapoor Rahnewala Hoon","o":["A–3, B–2, C–1, D–4","A–2, B–3, C–4, D–1","A–4, B–1, C–2, D–3","A–1, B–4, C–3, D–2"],"a":0,"e":"A–3, B–2, C–1, D–4.","s":""},{"n":613,"t":"Songs","q":"In which of the following states are the Pai songs accompanied by the Saria dance sung during the rain festivals?","o":["Tripura","Uttar Pradesh","Madhya Pradesh","Sikkim"],"a":2,"e":"Madhya Pradesh. Pai song is sung to pray for a good monsoon and a good harvest. The Saira dance is performed by members of the peasant community to seek the blessings of Lord Indra (rain god) for a good harvest. Other festivals of Madhya Pradesh: Lokrang Festival, Akhil Bharatiya Kalidas Samaroh, Lokranjan or Khajuraho Festival, Bhagoria Haat Festival, Nagaji Fair
