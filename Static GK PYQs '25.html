s","q":"How many Gold medals India won in the Olympics between 1928 and 1980?","o":["7","5","6","8"],"a":3,"e":"8. India has won 10 gold medals at the Olympics. The men’s hockey team itself accounts for eight of them. After Abhinav Bindra (men’s 10m air rifle shooting - Beijing 2008), Neeraj Chopra (men’s javelin throw - Tokyo 2020) is the second individual Olympic champion. India first participated in the Olympics in 1900 in Paris. The first Indian contingent at the Olympics was in 1920.","s":""},{"n":929,"t":"Sports","q":"Consider the following statements regarding sports:\n1. Korfball is the only sport specifically designed to be played by men and women together in the same team.\n2. In korfball, each team consists of 8 players (4 men and 4 women) and the objective is to throw the ball through a basket 3.5 meters high.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Korfball uniquely promotes mixed-gender participation with equal roles for men and women.","s":""},{"n":930,"t":"Sports","q":"What is the minimum lane width in Swimming in metres?","o":["2.10","2.11","2.12","2.13"],"a":3,"e":"2.13. Size of swimming pool (Olympics) : 50 m long, 25 m wide and minimum 2 m depth, divided into 10 lanes. Types of Swimming - Freestyle, Backstroke, Breaststroke, Butterfly, Medley, Marathon swimming (in open water environments as the rivers, lakes, sea). Famous Olympic Swimmers -Michael Phelps, Sajan Prakash, Krisztina Egerszegi, Virdhawal Khade, Shivani Kataria.","s":""},{"n":931,"t":"Sports","q":"The 'Glide Technique' is used in which track and field event ?","o":["Pole Vault","4 x 100 m Relay","Shot Put","Long Jump"],"a":2,"e":"Shot Put. Sports Terminology : Wrestling -Freestyle, Bridge out, Breakdown. Weight Lifting - Snatch, Jerk.","s":""},{"n":932,"t":"Sports","q":"Who was the first American male athlete to win the Marathon gold medal in the Olympic Games?","o":["Abebe Bikila","Thomas Hicks","Frank Shorter","John Hayes"],"a":1,"e":"Thomas Hicks. Top Marathon Runners : Kelvin Kiptum, Eliud Kipchoge, Kenenisa Bekele, Sisay Lemma, Birhanu Legese, Mosinet Geremew, Dennis Kimetto, Evans Chebet, Gabriel Geay, Lawrence Cherono.","s":""},{"n":933,"t":"Sports","q":"In which year did India make its One - Day International (ODI) debut?","o":["1971","1974","1975","1972"],"a":1,"e":"1974. India played its first men's ODI against England at Leeds under the captaincy of Ajit Wadekar. First Ever ODI Match was played between -Australia and England in 1971 at the Melbourne cricket ground (MCG).","s":""},{"n":934,"t":"Sports","q":"The term 'Dressage' is associated with:","o":["equestrian","polo","rugby","water polo"],"a":0,"e":"Equestrian (horse riding). Indian Equestrians : Fouaad Mirza, Imtiaaz Anees, Indrajit Lamba, Darya Singh, Jitendarjit Singh Ahluwalia. Terminology related to Sports : Equestrian - Amble, Bascule, Buck, Eventing, Forging, Gait and Gallop. Polo -Neck Shot, Bump, Chukka, Bowl-in. Rugby - Drop Goal, Ankle tap, Advantage line, Ball back, Blitz defence. Water Polo -Dead Time, Double post, Dry Pass.","s":""},{"n":935,"t":"Sports","q":"Which of the following is NOT the first day event in the decathlon?","o":["Discus throw","Shot put","100 metre dash","400 metre dash"],"a":0,"e":"Discus throw. Men’s decathlon : Day 1 - 100 metres running, Long jump, Shot put, High jump, 400 metres running. Day 2 - 110 metres hurdles, Discus throw, Pole vault, Javelin throw, 1500 metres running. Women’s decathlon : Day 1 - 100 metres running, Discus throw, Pole vault, Javelin throw, 400 metres running. Day 2 - 100 metres hurdles, Long jump, Short put, High jump, 1500 metres running.","s":""},{"n":936,"t":"Sports","q":"What is the distance between the hurdles in 100 m women's hurdles in metres ?","o":["7.50","9.00","8.00","8.50"],"a":3,"e":"8.50 m. In sprint hurdle races for women, the first hurdle is 13 m (42 ft 8 in) from the starting line. In the long hurdle events, whether for men or women, the first hurdle is 45 m (147 ft 8 in) from the starting line and the distance between hurdles is 35 m (114 ft 10 in).","s":""},{"n":937,"t":"Sports","q":"What are the events in powerlifting ?","o":["Squats, bench press and deadlift","Squats, lat pull down and curl","Curls, bench press and squat","Curls, over arm lift and deadlift"],"a":0,"e":"Squats, bench press and deadlift. Other events related to Sports : Swimming - Freestyle, Butterfly, Backstroke. Athletics - Relay, Hurdles, Shot Put, High Jump. Cycling - Sprint, Time trial, Track race, Point race. Shooting - Rapidfire Pistol, Standard rifle, Free pistol, Air rifle, Range, Bull’s eye.Weight Lifting - Jerk, Snatch.","s":""},{"n":938,"t":"Sports","q":"Consider the following statements regarding Indian women’s football:\n1. Manisha Kalyan is the first Indian female footballer to play in UEFA Women’s Champions League.\n2. She has also won the AIFF Women’s Emerging Footballer of the Year (2020–21) and the AIFF Women’s Player of the Year (2022–23) awards.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Manisha Kalyan achieved the milestone of playing in the UEFA Women’s Champions League and has been honored with top AIFF awards.","s":""},{"n":939,"t":"Sports","q":"Which country came out with the first 'official' compilation of volleyball rules and was published by the YMCA?","o":["Germany","The US","The UK","Australia"],"a":1,"e":"The US. William G. Morgan -A YMCA physical education director, created the game of volleyball in 1895, and he also wrote down the original rules for the sport.","s":""},{"n":940,"t":"Sports","q":"Which of the following countries has hosted the three Asian Games?","o":["South Korea","Philippines","Japan","India"],"a":0,"e":"South Korea (1986, 2002 and 2014) . Asian Games: Organized by the Olympic Council of Asia (OCA) after every 4 years. Headquarters - Kuwait. New Delhi, India, hosted the first Asian Games in 1951 and the second time in\n1982. 20th Asian Games (2026) will be held in Nagoya (Japan).","s":""},{"n":941,"t":"Sports","q":"In the Olympic flag, the total number of rings are _________.","o":["3","5","7","4"],"a":1,"e":"5. The Olympic rings were designed by Pierre de Coubertin in 1913 with the coloured blue, yellow, black, green, and red on a white field.","s":""},{"n":942,"t":"Sports","q":"How many points are there in the 4th set in volleyball?","o":["15","16","25","8"],"a":2,"e":"25. Volleyball : Number of players in each team - 6, Court - 18 meters long and 9 meters wide. The net is 2.43 meters high for men's games and 2.24 meters high for women's games. Other games : Tennis - The first point is “15”. The second is “30. The third point is “40”. Badminton : The best of 3 games of 21 points. Terminologies (Volleyball) -block, decoy, dig, dump, pancake, tandem, Stuff etc.","s":""},{"n":943,"t":"Sports","q":"Maximum how many overs can a bowler bowl in ODI cricket matches?","o":["11","9","10","8"],"a":2,"e":"10. The minimum number of bowlers in a 50 over ODI match has to be\n5. The maximum number of overs per bowler in T20 Cricket is 4. The first ODI was played on 5 January 1971 between Australia and England at the Melbourne Cricket Ground.","s":""},{"n":944,"t":"Sports","q":"Sports Authority of India, the apex body for sports promotion, was set up in the year ________.","o":["1990","1961","1984","1982"],"a":2,"e":"1984. Sports Authority of India (SAI): Headquarters - New Delhi. Associated Ministry - Ministry of Youth Affairs and Sports. Sports Organization and Headquarters : Indian Olympic Association (New Delhi) - 1927, All India Football Federation (New Delhi) - 1937.","s":""},{"n":945,"t":"Sports","q":"Consider the following statements about the Dahi Handi event:\n1. The state of Maharashtra has officially recognized Dahi Handi as a sport.\n2. The festival is celebrated during Krishna Janmashtami and is also\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Dahi Handi, celebrated on Krishna Janmashtami, is officially recognized as a sport in Maharashtra.","s":""},{"n":946,"t":"Sports","q":"In which of the following states is the National Sports University located?","o":["Manipur","Punjab","Madhya Pradesh","Assam"],"a":0,"e":"Manipur. National Sports University : Inaugurated on 16 March 2018, by Narendra Modi in Imphal. Sports universities : Lakshmibai National Institute Of Physical Education (Gwalior), Sri Sri Aniruddha Deva Sports University (Dibrugarh, Assam), Guru Gobind Singh Sports College (Lucknow).","s":""},{"n":947,"t":"Sports","q":"In which year was the 1st winter edition of the Olympic Games organised?","o":["1926","1920","1922","1924"],"a":3,"e":"1924 (Chamonix, France). American Charles Jewtraw became the first Gold medalist in the 1st Winter Olympic Games.","s":""},{"n":948,"t":"Sports","q":"The maximum distance covered in a marathon is___________.","o":["40 km","42.5 km","42.195 km","41.5 km"],"a":2,"e":"42.195 km. This distance was standardised at 26 miles 385 yards (42.195km) in 1921. The first women’s Olympic marathon took place at the 1984 Los Angeles Games. Half-Marathon : 13.1 miles (approximately 21.0975 kilometres). India’s Marathon players -Nitendra Singh Rawat, Ram Singh Yadav, Srinu Bugatha, Rashpal Singh.","s":""},{"n":949,"t":"Sports","q":"Khelo India Winter Games started in which year?","o":["2022","2020","2019","2018"],"a":1,"e":"2020. The first Khelo India Winter Games were held in two legs at two different venues : Leh (Ladakh), Gulmarg (Jammu and Kashmir).","s":""},{"n":950,"t":"Sports","q":"A football match lasts two equal periods of_________.","o":["40 minutes","50 minutes","20 minutes","45 minutes"],"a":3,"e":"45 minutes. A football team consists of 11 players on the field, including 1 goalkeeper and 10 outfield players. Football Terminology : Back heel, cross, far post, futsal, Header, Inswinger. Games and their duration : Hockey (two periods of 35 minutes), Basketball (48 minutes or 12 minutes each quarter), Kabaddi (two halves of 20 minutes).","s":""},{"n":951,"t":"Sports","q":"FTX Crypto Cup is associated with which of the following sports events?","o":["Snooker","Chess","Billiards","Golf"],"a":1,"e":"Chess. Sports with other Cups/Trophies: Snooker - World Snooker Championship, Scottish Open, World Grand Prix. Billiards - Arthur Walker Trophy. Polo - Ezar Cup, President Cup. Tennis - Ambre Solaire Cup, ATP President's Cup, Watson's Water Trophy, Wightman Cup. Football - African Nations Cup, McDowell Cup, Merdeka Cup.","s":""},{"n":952,"t":"Sports","q":"The term 'Straight drive' is related to which of the following sports?","o":["Hockey","Cricket","Football","Badminton"],"a":1,"e":"Cricket. Other terminologies :Cricket - Beamer, Belter, Chinaman, Chucker, Dolly, Doosra, Duck, Googly, Maiden, Mankad, Nurdle, Paddle etc.","s":""},{"n":953,"t":"Sports","q":"How many substitute players are there in a Beach Volleyball team?","o":["3","0","2","1"],"a":1,"e":"0 . Beach Volleyball - Team -Two players. Terms related - Ace, Block, Attack, Chicken wing, Forearm pass, etc.","s":""},{"n":954,"t":"Sports","q":"The Nehru trophy boat race was organized by which of the following states ?","o":["Karnataka","Tamil Nadu","West Bengal","Kerala"],"a":3,"e":"Kerala. Nehru boat race - It is named after Pandit Jawaharlal Nehru. Conducted on the Punnamada lake, near Alappuzha on the second Saturday of August every year. Traditional Sports of Indian states : Seval Sandai or Cockfighting - Karnataka, Tamil Nadu and Andhra Pradesh. Maramadi Bull Surfing -Kerala. Kambala, Hori habba - Karnataka. Jallikattu, Pallanguzhi - Tamil Nadu. Bullock cart race - Maharashtra. Camel racing - Rajasthan. Dhopkhel - Assam.","s":""},{"n":955,"t":"Sports","q":"Consider the following statements:\n1. Dibyendu Barua became India’s second Chess Grandmaster after Viswanathan Anand.\n2. The title of Grandmaster is awarded by FIDE, which was established in Switzerland.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Dibyendu Barua was India’s 2nd GM after Anand, and the title is conferred by FIDE (1924, Lausanne).","s":""},{"n":956,"t":"Sports","q":"In which of the following sports, apart from volleyball, do players make use of the Screen technique?","o":["Basketball","Cricket","Baseball","Handball"],"a":0,"e":"Basketball. Techniques -Screen ( blocking opponent player by standing beside ), Shooting (To score), Dribbling (Move the ball in court), defence, Rebounding (controlling missed shots), passing . International Basketball Federation (Headquarters - Mies, Switzerland) - Governs the sport of basketball worldwide. Famous players -Wilt Chamberlain, Michael Jordan, LeBron James.","s":""},{"n":957,"t":"Sports","q":"In hockey, _________ is awarded if the ball goes over the back line after last being touched by a defender.","o":["long corner","off side","free hit","penalty comer"],"a":0,"e":"Long corner. Free hit -Awarded to a team if the opposing team commits a foul outside the circle. Penalty corner - Awarded to the opposition team when a player commits a foul within the striking circle. Players in Hockey - 11 (10 field players and 1 goalkeeper).","s":""},{"n":958,"t":"Sports","q":"Deepika Pallikal is associated with _____.","o":["squash","billiards","chess","cricket"],"a":0,"e":"Squash. She is the first Indian to break into the top 10 in the Professional Squash Association Women's rankings. The World Squash Federation (WSF) - The global governing body for the sport of squash; Headquarters - Hastings (UK); Establishment - 1967.","s":""},{"n":959,"t":"Sports","q":"The number of flights in a 110 m hurdle race is______.","o":["8","9","10","11"],"a":2,"e":"10. It is a track event in athletics. It is for both men and women. Dimensions : Standard heights of the hurdle : Distance (110 m/100 m) - Men's under 20 Men (0.991 m). Distance (400 m) - Men's (0.914 m), under 20 Women (0.762 m), under 20 Men (0.914 m). There are 10 hurdles in the 400 m hurdle race. There are 28 hurdle jumps and 7 water jumps in 3000 m steeplechase event.","s":""},{"n":960,"t":"Sports","q":"Which of the following players is associated with billiards ?","o":["Sourabh Chaudhari","Manika Batra","Sankalp Gupta","Pankaj Advani"],"a":3,"e":"Pankaj Advani. Awards and achievements : Arjuna Award (2004), Major Dhyan Chand Khel Ratna (2005-06), Padma Shri (2009), Padma Bhushan (2018), Rajyotsava Prashasti (2007). Sourabh Chaudhari (shooter) -Gold medal (Asian Games 2018), Sankalp Gupta (Chess) - India's 71st Grandmaster.","s":""},{"n":961,"t":"Sports","q":"Consider the following statements:\n1. The Duckworth–Lewis formula was first applied in international cricket on 1 January 1999.\n2. It was actually first used on 1 January 1997 to calculate revised targets in limited-overs matches.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The D/L method was first introduced on 1 January 1997.","s":""},{"n":962,"t":"Sports","q":"In which of the following sports is the technique clean and jerk used?","o":["Wrestling","Hammer throw","Bodybuilding","Weightlifting"],"a":3,"e":"Weightlifting. Clean and jerk is a two-part weightlifting movement : lifting the barbell to the shoulders (clean) and then lifting it overhead (jerk). The snatch - Weightlifter picks up the barbell and lifts it above his head in one singular motion.","s":""},{"n":963,"t":"Sports","q":"In hockey, if the umpire indicates the direction with one arm raised horizontally, it Means___________ .","o":["Goal scored","Bully","Timing","Free hit"],"a":3,"e":"Free hit. Umpires Signal in Hockey : Time Start - Turn Towards the other umpire with one arm straight up in the air. Time Stopped - Turn towards the other umpire and cross fully extended arms at the wrists above the head. Hit for behind the back-line (16-yard hit) - Extend both arms horizontally sideways. Penalty Stroke - One arm points to the penalty spot, the other points straight in the air. Obstruction - Hold crossed forearms in front of the chest. Kicks - Slightly raise a leg and touch it near the foot or ankle with the hand.","s":""},{"n":964,"t":"Sports","q":"Which of the following weightlifting styles is used in powerlifting?","o":["Straight lift","Deadlift","Clean and jerk","Power lift"],"a":1,"e":"Deadlift. Powerlifting - It is a sport consisting of three lifts : Squat, bench press, and deadlift. Goal of the sport is to lift as much weight as possible. Wrestling styles - Greco Roman Wrestling, FreeStyle Wrestling, Folk Style Wrestling and Sumo Wrestling. Female weightlifters : Mirabai Chanu, Karnam Malleswari, Kunjarani Devi.","s":""},{"n":965,"t":"Sports","q":"Pommel Horse, Roman Rings, Vaulting Table are few term which are related to _________","o":["Gymnastic","Swimming","Riding","Polo"],"a":0,"e":"Gymnastics - B-score, Back-to-back tumbling, Balance, Base, Bib, Busnari . Football - Bending the Ball, Direct Free Kick, Dribble. Swimming -Butterfly, Breaststroke. Polo - Chukker, Foul, Knock-in. Riding - Dressage, Bridle, Reins.","s":""},{"n":966,"t":"Sports","q":"In Table Tennis, the length of upper surface of the table is______","o":["264 cm","780 cm","274 cm","270 cm"],"a":2,"e":"274 cm. Dimensions of table in table-tennis - 2.74 meters long, 1.525 m wide, and 0.76 m high. Table tennis (ping-pong /whiff-whaff) is the national sport of China. Table tennis was first played as an Olympic sport at the 1988 Summer Olympics in Seoul. The name table tennis was adopted in 1921–22. Table tennis was founded by David Foster. Players - Sharath Kamal Achanta, Ma Long, Manika Batra, Liu Guoliang.","s":""},{"n":967,"t":"Sports","q":"Which is the oldest tennis tournament in the world?","o":["French Open","US Open","Wimbledon","Australian Open"],"a":2,"e":"Wimbledon - The tournament dates back to 1877. Wimbledon is the oldest and most prestigious grass court Grand Slam tennis tournament, believed to be the oldest active tennis tournament globally, and is held from late June to early July each year. US Open - This tournament was started in 1881 AD, French Open (Roland Garros tournament) - This tournament was started in 1891, Australian Open - This tournament was started in 1905 AD.","s":""},{"n":968,"t":"Sports","q":"Consider the following statements:\n1. The Corbillon Cup is awarded in women’s team events of the World Table Tennis Championships.\n2. The Corbillon Cup is associated with international golf tournaments like the Ryder Cup.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The Corbillon Cup is linked to women’s table tennis team events.","s":""},{"n":969,"t":"Sports","q":"Who won India's first badminton medal in the Olympics games?","o":["P.V.Sindhu","Prakash Padukone","Saina Nehwal","Pullela Gopichand"],"a":2,"e":"Saina Nehwal. She became the first Indian female to win a 4-star tournament in 2006. Medal Record -Bronze (Olympics, 2012), Gold (2010 and 2018 Commonwealth). Awards - Arjuna Award (2009), Padma Shri (2010), Major Dhyan Chand Khel Ratna (2009–2010), Padma Bhushan (2016).","s":""},{"n":970,"t":"Sports","q":"The First Field Handball World Championships were played in Germany in______.","o":["1958","1928","1938","1948"],"a":2,"e":"1938. First Field Handball World Championships was played on the 5th and 6th February 1938, hosted by Germany, under the International Amateur Handball Federation (IAHF). Only 4 teams participated : Germany, Austria, Sweden and Denmark. Germany won this championship.","s":""},{"n":971,"t":"Sports","q":"In cricket, hitting the ball to the boundary along the ground is _____ runs.","o":["2","1","4","6"],"a":2,"e":"4. If the ball crosses the boundary line without touching the ground, 6 runs are scored. Five penalty runs are awarded to the batting team if The ball strikes a fielder's helmet when it is on the field but not being worn. Types of out in cricket - Caught, Bowled, Leg Before Wicket (LBW), Stumped, Run-out, Obstructing the field, Hit Wicket, Timed","s":""},{"n":972,"t":"Sports","q":"Who among the following is the first Indian to win the under 10 World Chess Championship in Menorca, Spain in the year 1996?","o":["Koneru Humpy","Vishwanathan Anand","Vidit Santosh Gujrathi","P Harikrishna"],"a":3,"e":"P Harikrishna. He became the youngest grandmaster from India after attaining the title in 2001, a record now held by Gukesh D. He was Commonwealth Champion in 2001, World Junior Champion in 2004, and Asian Individual Champion in 2011.","s":""},{"n":973,"t":"Sports","q":"The National Anti-Doping Bill, 2021 targets _________ sector of India","o":["Sport","Agriculture","Finance","Military"],"a":0,"e":"Sport. The National Anti -Doping Bill, 2021 - The Bill prohibits athletes, athlete support personnel, and other persons from engaging in doping in sport. National Anti-Doping Agency (India) - Formation - 24 November 2005, Purpose - Anti-doping in sports, Headquarters - New Delhi, Official language - English, Hindi. Chairman -Minister of Sports (India).","s":""},{"n":974,"t":"Sports","q":"The thickness of a wrestling mat should be between _______ centimetres.","o":["7 and 9","5 and 7","9 and 11","3 and 5"],"a":1,"e":"5 and 7. Wrestling - At the Olympics there are two variations of wrestling : Freestyle and Greco-Roman.","s":""},{"n":975,"t":"Sports","q":"The Super Bowl, an annual championship game of Football, is held in _______ country.","o":["Canada","Peru","United States of America","Mexico"],"a":2,"e":"United States of America. The Super Bowl (Big Game) - One of the biggest annual sporting events, It is the final championship game of the National Football League (NFL).","s":""},{"n":977,"t":"Sports","q":"Judo has its origin in the ancient _______ art of Ju-jitsu.","o":["Malaysian","Korean","Chinese","Japanese"],"a":3,"e":"Japanese. Kano Jigoro invented Judo in 1882. Judo was developed as a martial art for self -defense and personal development. It emphasizes throws, joint locks, and pins to subdue opponents. The terms Kumi-Kata, Shintai, Ukemi are associated with judo. National games : Japan -Sumo Wrestling; South Korea -Taekwondo; Malaysia - Sepak Takraw (Kick volleyball); China - Table Tennis (Ping Pong).","s":""},{"n":978,"t":"Sports","q":"In which country did the game of cricket start?","o":["New Zealand","South Africa","India","England"],"a":3,"e":"England. The world's first Cricket club - Hambledon, England. Marylebone Cricket Club (MCC) - 1787. First Cricket club in India - Calcutta Cricket club (1792). First ever international cricket match - US vs Canada in 1844. India played their first International cricket match - Against England in 1932.","s":""},{"n":979,"t":"Sports","q":"Olympic Games 1952 were held in which of the following places?","o":["London","Helsinki","New York","Berlin"],"a":1,"e":"Helsinki. Summer Olympics 1 st Olympics (Athens, Greece, in 1896), 2 nd Olympics (Paris, France, in 1900), 32 th Olympics (Tokyo Olympic 2020, Japan), 33 th Olympics (Paris, France, in 2024). Headquarter of the International Olympics committee (IOC) - Lausanne, Switzerland.","s":""},{"n":980,"t":"Sports","q":"Davis Cup is related with which of the following sports ?","o":["Table Tennis","Cricket","Basketball","Tennis"],"a":3,"e":"Tennis (Men) . Other Cups related to Tennis : Wimbledon Trophy, Wightman Cup (Women).","s":""},{"n":982,"t":"Sports","q":"The term 'Back-stick' is used in which of the following games/sports ?","o":["Basketball","Badminton","Hockey","Volleyball"],"a":2,"e":"Hockey . Back stick is a penalty for hitting the ball on the rounded back side of the Stick. Other terminologies used in the game of hockey : Bully, Circle, Charging, Channel, Clear, Chip, Crumbs, The “D”, Drag flick, Flagrant foul, Flick, Flat-stick tackle, Foot, Green Card, Hacking, Hooking, Indian Dribble, Jink, Leading pass, Yellow Card, Tomahawk, Tackle, Sweep hit, Swatting, Scoop, Red Card, Pitch, etc.","s":""},{"n":983,"t":"Sports","q":"In AIBA Boxing Junior Boys and Girls Competitions, the bouts must consist of each round of _______ minutes.","o":["5 min","3 min","1 min","2 min"],"a":3,"e":"2 min. A standard ring is between 16 and 24 feet (4.9 and 7.3 m) to a side between the ropes with another 2 feet (0.61 m) outside.","s":""},{"n":984,"t":"Sports","q":"What is the average circumference of the standard cricket ball in international cricket ?","o":["7.89 inches - 8.45 inches","10.46 inches - 10.90 inches","9.45 inches - 10.20 inches","8.81 inches - 9 inches"],"a":3,"e":"8.81 inches - 9 inches . Cricket pitch is 22 yd (20.12 m) long (1 chain) and 10 ft (3.05 m) wide.","s":""},{"n":985,"t":"Sports","q":"In Table Tennis, how many lets are allowed in a row on a serve?","o":["Three","Unlimited","Two","One"],"a":1,"e":"Unlimited. There's no limit on the number of times one can replay when it has hit the net.","s":""},{"n":986,"t":"Sports","q":"Consider the following statements:\n1. In handball, a player must pass, shoot, or dribble within 3 seconds after stopping dribbling.\n2. In handball, holding the ball for more than 10 seconds without passing or shooting is allowed.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. In handball, a player cannot hold the ball for more than 3 seconds without dribbling, passing, or shooting, otherwise it results in loss of possession.","s":""},{"n":987,"t":"Sports","q":"The length of a Beach Volleyball court is:-","o":["12 m","16 m","20 m","15 m"],"a":1,"e":"16 m long & 8 m wide . Two teams of two or more players. An Olympic sport since the 1996 Summer Olympics (Atlanta). Beach Volleyball is the modified form of the game Volleyball. Volleyball - court is 18m long and 9m wide. Two teams of six players. An Olympic sport since the 1964 Summer Olympics (Tokyo). Federation Internationale de Volleyball (FIVB) is the international governing body for both of the games.","s":""},{"n":988,"t":"Sports","q":"Consider the following statements:\n1. Pivoting is a fundamental skill associated with the game of basketball.\n2. In volleyball, pivoting refers to the rotation of six players during service.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Pivoting is a basketball technique where one foot remains fixed (pivot foot) while the player moves the other to change direction without dribbling.","s":""},{"n":989,"t":"Sports","q":"In all AIBA Boxing competitions, the rest time between each round is ________minutes.","o":["1","2","3","5"],"a":0,"e":"1. AIBA Boxing competitions - comprising three rounds of three minutes in men, and four rounds of two minutes in women .","s":""},{"n":990,"t":"Sports","q":"In Tennis which of the following scores is a complete set?","o":["5 - 3","6 - 4","6 - 6","6 - 5"],"a":1,"e":"6 - 4. A tennis match is composed of points, games, and sets. Tennis is played in points : Four points win a game, six games win a set, and two or three sets win a match. A set consists of a number of games (a minimum of six). A set is won by the first side to win six games with a margin of at least two or 7-5).","s":""},{"n":991,"t":"Sports","q":"The age range for the Youth Boxer category is:","o":["15 – 16 years","19 – 20 years","17 – 18 years","13 – 18 years"],"a":2,"e":"17 – 18 years . IBA Youth World Boxing Championships (began in 1979 & held biennially since 1990).","s":""},{"n":992,"t":"Sports","q":"In football, when the ball strikes the frame of the goal or the referee and remains within the goal and touch lines, it is:","o":["foul","still in play","a misconduct","out of play"],"a":1,"e":"still in play. Other terms related to Football : Back of the net, Ball-to-hand, Bicycle kick, Box-to-box player, Chip shot, Clean sheet, Hoof, Dummy run etc.","s":""},{"n":993,"t":"Sports","q":"In which of the following Olympic games did India NOT win Gold?","o":["1948","1928","1932","1960"],"a":3,"e":"1960. India has won 35 medals at the Olympics since the 1900 edition. Gold medal winners from India : Jaipal Singh (1928 - Amsterdam), Lal Bokhari (1932 - Los Angeles), Dhyan Chand (1936 - Berlin), Kishan Lal (1948 -London), K.D. Singh (1952 - Helsinki), Balbir Singh Sr (1956 - Melbourne), Charanjit Singh (1964 - Tokyo), Vasudevan Bhaskaran (1980 - Moscow), Abhinav Bindra (2008-Beijing), and Neeraj Chopra (2021-Tokyo).","s":""},{"n":994,"t":"Sports","q":"Which of the following strokes in swimming does NOT start with a dive into the pool from outside?","o":["Butterfly","Backstroke","Breaststroke","Freestyle"],"a":1,"e":"Backstroke : The backstroke is unique because it’s the only stroke done on the back. It’s the third-fastest competitive swimming stroke – faster than the breaststroke but slower than the butterfly. Butterfly : Start by putting both of your arms straight in front of you at the 12 o’clock position, palms slightly tilted outward at about a shoulder’s width apart.","s":""},{"n":995,"t":"Sports","q":"In hockey, what is the meaning of the signal if the umpire points both arms horizontally towards the goal?","o":["Free hit","Penalty corner","Penalty stroke","Goal scored"],"a":1,"e":"Penalty Corner . Umpire signals in Hockey : Free hit (Indicate the and open hand at face level), Penalty stroke (One arm points to the penalty spot, the other points straight in the air), Goal scored (point both arms horizontally towards the center of the field).","s":""},{"n":996,"t":"Sports","q":"Which of the following sports was initially known as Poona?","o":["Badminton","Baseball","Volleyball","Kho-Kho"],"a":0,"e":"The modern version of Badminton has its origins in the city of Pune in India and was initially called 'Poona', which was played by British army officers stationed in India in the 1860s. In 1873 the duke of Beaufort introduced the sport at his country estate, Badminton House, from which the game derives its name.","s":""},{"n":997,"t":"Sports","q":"The Basketball centre line is part of the:","o":["front court","back court","restricted area","middle court"],"a":1,"e":"Back court . The centre line is marked parallel to the end lines from the midpoint of the side lines. It extends 0.15 m beyond each sideline. The backcourt is the half of the court that the team with the ball advances the ball from into the frontcourt. In a basketball game, the frontcourt is the side of the court on which the team with possession of the ball is attempting to score, and is also known as that team's offensive end of the court.","s":""},{"n":998,"t":"Sports","q":"Consider the following statements:\n1. In boxing, the area of bout where the competition is held is called a ring.\n2. In judo, the bout takes place inside a circular boxing ring.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. In boxing, the competition area is known as a \"ring\", despite being square-shaped; whereas Judo bouts are held on a mat called tatami.","s":""},{"n":999,"t":"Sports","q":"Asiad is regulated by_________.","o":["International Olympic Council","Commonwealth Games Federation","Indian Olympic Council","Olympic Council of Asia"],"a":3,"e":"Olympic Council of Asia (OCA). Asiad (Asian Games) - Held every four years. First held in 1951 in New Delhi. Indian Olympic Association -governing body for the Olympic Movement and the Commonwealth Games in India. Commonwealth Games Federation - international organisation responsible for the direction and control of the Commonwealth Games. International Olympic Council -responsible for Olympic games.","s":""},{"n":1000,"t":"Sports","q":"What is the distance of the penalty mark from the midpoint of the goal post in football?","o":["10 m","15 m","11 m","13 m"],"a":2,"e":"11m. Some Facts - All free kicks and corners are direct and opposition must be 3 metres away. Dribble is keeping control of the ball while running.","s":""},{"n":1001,"t":"Sports","q":"The first edition of the Commonwealth Youth Games was organised in which of the following years?","o":["2008","2012","2000","2016"],"a":2,"e":"2000. The first edition of the Commonwealth Youth Games was held in Edinburgh (Scotland) from 10 to 14 August 2000. 2 nd edition (December 2004) - Bendigo (Australia). 7 th edition (2023) - Trinidad and Tobago.","s":""},{"n":1002,"t":"Sports","q":"In Tennis, what is the score when the receiver wins the next point after deuce?","o":["Advantage out","30-40","Advantage in","40-30"],"a":0,"e":"‘Advantage out’ when the receiver wins the next point after the deuce. Deuce : If a player and his opponent reach 40. The first point scored after the deuce is known as an Advantage.","s":""},{"n":1003,"t":"Sports","q":"In cricket, if the umpire raises an index finger above the head it means_________","o":["dead ball","wide ball","no ball","batsman is out"],"a":3,"e":"Batsman is out . Terminologies : Not out (waving the arms in a sweeping motion out in front of the chest), No ball (One arm fully extended horizontally), Free hit (One hand held above their head and making a circular motion), Wide Ball (Both arms extended horizontally), Six runs (Both arms held high above their head), dead ball (crossing and uncrossing his arms in front of his body) etc.","s":""},{"n":1004,"t":"Sports","q":"In Triple Jump, white flag","o":["trail is valid","trail is failure","trail with wind support","allow to trial"],"a":0,"e":"trail is valid (a fair jump). The Triple jump (the hop, skip and jump) is a track and field event. The triple jump was a part of the inaugural modern Olympics in 1896 in Athens. The first modern Olympic champion was James Connolly (Triple jumper). Red Flag - a foul jump.","s":""},{"n":1005,"t":"Sports","q":"Yellow card in badminton indicates:","o":["fault for misconduct","suspension for misconduct","warning for misconduct","disqualified for misconduct"],"a":2,"e":"Warning for misconduct. Red Card - Fault for misconduct, Black Card - Disqualified for misconduct. The first badminton competition (All England Open Badminton Championships), for gentlemen's doubles, ladies' doubles, and mixed doubles, was in 1899.","s":""},{"n":1006,"t":"Sports","q":"Which of the following countries hosted the inaugural FIVB Volleyball Men's World Cup?","o":["1965, Poland","1977, Japan","1969, East Germany","1981, Japan"],"a":0,"e":"1965, Poland. The 1965 FIVB Men's World Cup was held from 13 to 19 September. Eleven nations were involved in the first edition of the competition also known as the \"Tournament of the Continents\". The International Volleyball Federation (FIVB) 2023 World Cup (Host - Brazil, China and Japan).","s":""},{"n":1007,"t":"Sports","q":"Consider the following statements:\n1. The maiden Athletics World Cup was organised in London in 2018.\n2. Only one edition of this event was held, with eight teams participating. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The first and only Athletics World Cup took place in London in 2018 with eight participating nations, after which the event was discontinued.","s":""},{"n":1008,"t":"Sports","q":"Which was the first city in the world to have hosted both the summer and winter editions of the Olympic Games?","o":["Tokyo","Sydney","New York","Beijing"],"a":3,"e":"Beijing. The United States has hosted the most (eight) Olympic Games, followed by France (five) and Japan (four) editions.","s":""},{"n":1009,"t":"Sports","q":"In which of the following places was the first edition of the World Para Table Tennis Championships held in 1990 ?","o":["Assen, Netherlands","Granada, Spain","Beijing, China","Lasko, Slovenia"],"a":0,"e":"Assen, Netherlands. 2nd edition (France, 1998). 2022 - Spain. 2023 - Durban, South Africa. Bhavina Patel -2022 - Birmingham Commonwealth Games, Gold, Tokyo 2020 paralympic -Silver, Arjuna Award (2021).","s":""},{"n":1010,"t":"Sports","q":"Consider the following statements about false starts in running events:\n1. In case of the first false start, the athlete(s) are allowed to restart the race.\n2. Any subsequent false start by the same athlete(s) leads to disqualification. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The first false start in a race is excused with a restart, but further false starts by the same athlete(s) result in disqualification.","s":""},{"n":1011,"t":"Sports","q":"In which of the following countries was the 1979 Asian Wrestling Championships organised by the Asian Associated Wrestling Committee (AAWC) for the first time?","o":["Lahore, Pakistan","Oarai, Japan","Jalandhar, India","Tehran, Iran"],"a":2,"e":"Jalandhar, India.","s":""},{"n":1012,"t":"Sports","q":"A FIBA sanctioned game of basketball typically consists of ______.","o":["4 quarters of 15 minutes each","2 halves of 30 minutes each","4 quarters of 10 minutes each","2 halves of 25 minutes each"],"a":2,"e":"FIBA (Federation Internationale de Basket-ball) : Playing time (4 quarters of 10 minutes each, 5 minutes over-time). FIBA : Founded (18 June 1932), Headquarters (Mies, Switzerland). National Basketball Association (playing time - 4 quarters of 12 minutes each, 5 minutes over-time), Association (2 quarters of 20 minutes each, 5 minutes over-time).","s":""},{"n":1013,"t":"Sports","q":"The first ICC Women's Cricket World Cup was held in the year_____","o":["1982","1978","1988","1973"],"a":3,"e":"1973 . India hosted the women's world cup (1997). The first Men’s Cricket World Cup was held in England in 1975. India has never won the Women's Cricket World Cup.","s":""},{"n":1014,"t":"Sports","q":"‘ Trump’ is a sports term used in __________.","o":["Cycling","Bridge","Cricket","Snooker"],"a":1,"e":"Bridge ( Contract bridge) is a trick-taking card game using a standard 52-card deck. Other Terminologies -Chicane (a hand with no trumps), Deadwood (unmatched cards remaining in the hand), Deck (may refer either to the pack), Flush (Cards of the same suit), Kibitzer (Onlooker at a card game), Prial (a set of 3 cards of the same rank) etc.","s":""},{"n":1015,"t":"Sports","q":"In which of the following grounds did Yuvraj Singh hit 6 sixes in an over of a T20 International match?","o":["Wanderers Stadium","Kingsmead Stadium","Mabhida Stadium","Newlands Cricket Ground"],"a":1,"e":"Yuvraj Singh hit 6 sixes in Stuart Broad's over in the 21st match of the first T20 world cup between India and England at Kingsmead Cricket Ground in Durban, South Africa.","s":""},{"n":1016,"t":"Sports","q":"In basketball, a free-throw is worth how many points?","o":["1","2","3","4"],"a":0,"e":"1 point. A traditional basketball team has 12 players, with five basketball players on the court at any given time.","s":""},{"n":1017,"t":"Sports","q":"Consider the following statements:\n1. Koneru Humpy is the first Indian Grandmaster to become the Women’s Chess World Rapid Champion.\n2. She achieved this title by excelling in rapid-format international chess competitions. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Koneru Humpy made history as India’s first female Grandmaster to win the Women’s Chess World Rapid Championship, highlighting her skill in fast-paced chess formats.","s":""},{"n":1018,"t":"Sports","q":"What is the height of the goal -post according to FIFA?","o":["6 ft","8 ft","10 ft","12 ft"],"a":1,"e":"8 ft. The standard soccer/football goal dimensions are 24ft (7.32 metres) wide and 8 ft (2.44 metres) high. Both goalposts and the crossbar have the same width and depth of 12cm.","s":""},{"n":1019,"t":"Sports","q":"In basketball, what can be the maximum number of points that can be scored in a shot?","o":["1","3","4","2"],"a":2,"e":"4 points. Some terms related to basketball include Slam dunk, Full-court press, Alley-oop, Jump shot, Playmaker, Point guard, Hoopster, Sixth man, etc.","s":""},{"n":1020,"t":"Sports","q":"What is the distance between the stumps and the popping crease at the same end of a Cricket pitch?","o":["1.50m","1.34m","1.62m","1.22m"],"a":3,"e":"1.22m. The dimensions of a turf pitch are 20.12m long (from stump to stump) plus a minimum of 1.22m behind the stumps to accommodate the return crease and bowler approach area. The width of a turf pitch is 3.05m.","s":""},{"n":1021,"t":"Sports","q":"Who among the following Indian players is also known as 'Dhing Express'?","o":["Dutee Chand","Neeraj Chopra","Hima Das","PT Usha"],"a":2,"e":"Hima Das , is an Indian sprinter from the state of Assam. She holds the current Indian national record in 400 metres with a timing of 50.79 s that she clocked at the 2018 Asian Games in Jakarta, Indonesia.","s":""},{"n":1022,"t":"Sports","q":"How many number of players are permitted to be substituted in a game of field hockey?","o":["No limit","3","10","5"],"a":0,"e":"no limit . All five skaters and the goalie can be substituted at any time during a hockey game.","s":""},{"n":1023,"t":"Sports","q":"The equipment bolt is used in which sport ?","o":["Swimming","Mountaineering","Cycling","Motor sports"],"a":1,"e":"Mountaineering. More equipment used in Mountaineering are Climbing pack, Rope(s) (dry preferred), Helmet, Harness (with adjustable leg loops), Crampons, Ice axe (with leash), Belay/rappel device, Pulley.","s":""},{"n":1024,"t":"Sports","q":"Consider the following statements about adventure sports:\n1. Paragliding is classified as an adventure sport.\n2. Adventure sports can be air-based, like paragliding and skydiving, or land-based, like trekking and rock climbing. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Paragliding is an air-based adventure sport, and adventure sports include both air-based and land-based activities requiring physical skill and risk-taking.","s":""},{"n":1025,"t":"Sports","q":"In which sport does the score depend on putting the ball in a hole?","o":["Hockey","Baseball","Squash","Golf"],"a":3,"e":"Golf is a club-and-ball sport in which players use various clubs to hit balls into a series of holes on a course in as few strokes as possible. Trophies associated with Golf are FedEx Cup, Walker cup, Ryder Cup, Augusta Masters, British open, Canada cup.","s":""},{"n":1026,"t":"Sports","q":"In which track and field event is the baton used?","o":["Hammer throw","Relay race","High jump","Steeplechase"],"a":1,"e":"A relay race is an event where a team of four athletes runs equal predetermined distances in a sprint race, each passing a rod-like object called the 'baton' to the next person to continue the race. The last runner in a relay is called the 'anchor'.","s":""},{"n":1027,"t":"Sports","q":"In running events who counts the laps ?","o":["Lap counter","Lap scorer","Time keeper","Lap recorder"],"a":1,"e":"Lap scorer counts the lap in the running events. Running events include : Sprints (100m, 200m, 400m), Middle distance (800m, 1500m), Long distance (3000m Steeplechase, 5000m, 10,000m), Hurdles (110/100m, 400m), Relays (4 x100m, 4 x 400m).","s":""},{"n":1028,"t":"Sports","q":"What is the other name of trap shooting?","o":["Clay - pigeon shooting","Crawl shooting","Wood - pigeon shooting","Pigeon shooting"],"a":0,"e":"Clay-pigeon shooting is the other name of trap shooting. The other disciplines are skeet shooting and sporting clays.","s":""},{"n":1029,"t":"Sports","q":"Which kind of sport is bungee jumping?","o":["Adventure sport","Recreational sport","Para sport","Special sport"],"a":0,"e":"Adventure sports - Skiing, Dirt biking, Scuba diving, Zorbing, etc. Recreational sport - swimming, cycling, football, yoga, etc. Para sport - Archery, Badminton, Equestrian, Goalball, etc. Special sports are not usually related to competitions, ex- Run for Cause Marathon competitions.","s":""},{"n":1030,"t":"Sports","q":"Consider the following statements about the term “Lona”:\n1. In Kabaddi, a team earns a “Lona” when it knocks out all the players of the opposing team.\n2. Other common Kabaddi terms include Cant, Raid, Successful raid, Struggle, and To put out an anti. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. In Kabaddi, a “Lona” signifies the elimination of all opponents, and terms like Cant, Raid, and Struggle are standard game terminologies.","s":""},{"n":1031,"t":"Sports","q":"The World Badminton Championship event 2026 will be organised by__________.","o":["Australia","India","China","Indonesia"],"a":1,"e":"India . World Badminton Championships, is a tournament sanctioned by Badminton World Federation (BWF), founded in 1977. 2021 : Host City- Huelva (Spain); Winner-Japan, 2022 : Tokyo (Japan), 2023 : Copenhagen (Denmark), 2025 : Paris (France), 2026 : India.","s":""},{"n":1032,"t":"Sports","q":"Which gymnastic event takes place on a large floor mat?","o":["Uneven parallel bar","Floor exercise","Vaulting table","Balance beam Question"],"a":1,"e":"A floor exercise is a gymnastics event in which movements are performed on the floor in an area of 12 metres (40 feet) square. Uneven parallel Bar is an Olympic gymnastics event performed only by women. Vaulting is a gymnastics exercise in which the athlete leaps over a form that was originally intended to mimic a horse. The balance beam is one of the events that comprise a total artistic gymnastics program.","s":""},{"n":1033,"t":"Sports","q":"Where is the JRD Tata Sports Complex located ?","o":["Visakhapatnam","Ranchi","Rourkela","Jamshedpur"],"a":3,"e":"Jamshedpur, Jharkhand. It is used mostly for association football matches and athletics competitions. Cricket stadium in Jamshedpur is Keenan Stadium.","s":""},{"n":1034,"t":"Sports","q":"What is the width of the tennis court for Doubles?","o":["13.57 m","9 m","12 m","10.97 m"],"a":3,"e":"10.97 m . A competitive tennis court is rectangular in shape, measuring 23.77 m long. The width, however, differs for doubles (10.97 m) and singles (8.23 m). There are four main types of surface for tennis courts: Grass, clay, hard and artificial grass.","s":""},{"n":1035,"t":"Sports","q":"In which year was the Indian Football Association established?","o":["1853","1873","1883","1893"],"a":3,"e":"1893. The Indian Football Association (IFA) : Headquarters -Kolkata. Calcutta FC was the first club to be established in 1872. The All India Football Federation (AIFF) was formed in 1937.","s":""},{"n":1036,"t":"Sports","q":"Which of the following equipment is used in throwing events ?","o":["Iron rod","Indian club","Shot","Iron ring"],"a":2,"e":"Shot. The four standard throwing events - Shot put, discus, hammer, and javelin.","s":""},{"n":1037,"t":"Sports","q":"______ is the first woman hockey player to receive the Rajiv Gandhi Khel Ratna Award.","o":["Rani Rampal","Vandana Katariya","Nikki Pradhan","Sharmila Devi"],"a":0,"e":"Rani Rampal. The new name of Rajiv Gandhi Khel Ratna Award is Major Dhyan Chand Khel Ratna Award.","s":""},{"n":1038,"t":"Sports","q":"Los Angeles Clippers and Portland Trail Blazers are ______ teams.","o":["Women’s Tennis","Men’s Basketball","Women’s Hockey","Men’s Volleyball"],"a":1,"e":"Men’s Basketball. It is a game played between two teams of five players each on a rectangular court. Basketball is the national game of Serbia, Lithuania and Estonia.","s":""},{"n":1039,"t":"Sports","q":"Consider the following statements about activities for motor development of students:\n1. Activities like playing cricket, joining a dance class, and attending Yoga sessions help in motor development.\n2. Helping the visually challenged does not directly contribute to motor development. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Activities involving movement, balance, and coordination promote motor development, whereas helping the visually challenged focuses on social and emotional skills rather than physical motor skills.","s":""},{"n":1040,"t":"Sports","q":"The European Champions Cup or Heineken Cup is associated with Which sport?","o":["Rugby","Cricket","Football","Hockey"],"a":0,"e":"Rugby. It is the top-tier competition for clubs whose countries' national teams compete in the Six Nations Championship.","s":""},{"n":1041,"t":"Sports","q":"Which of the following is NOT an Olympic event?","o":["Rhythmic gymnastics","Artistic gymnastics","Acrobatic gymnastics","Trampoline gymnastics"],"a":2,"e":"Acrobatic gymnastics . Acro is not yet an Olympic sport. However, acro is included in the World Games, the European Games, and has its own Acrobatic World Championships held in even-numbered years.","s":""},{"n":1042,"t":"Sports","q":"Who among the following was India's first world champion in any sport after independence ?","o":["Milkha Singh","Lila Ram","Ramanathan Krishnan","Wilson Jones"],"a":3,"e":"Wilson Jones . He won both the national billiards and snooker titles in 1952 and 1954. In London, he played his first World Billiards Championship in 1951.","s":""},{"n":1043,"t":"Sports","q":"The La Liga Trophy is associated with which sport ?","o":["Tennis","Football","Weightlifting","Cricket"],"a":1,"e":"Football . Football trophies -The FIFA World Cup, The UEFA Champions League, UEFA European Championship, Copa America, The English Premier League , etc.","s":""},{"n":1044,"t":"Sports","q":"The gymnast Dipa Karmakar belongs to the state of ______.","o":["Maharashtra","Haryana","Manipur","Tripura"],"a":3,"e":"Tripura . Dipa Karmakar is an Indian artistic gymnast. She won a bronze medal at the 2014 Commonwealth Games in Glasgow.","s":""},{"n":1045,"t":"Sports","q":"Produnova is related to which of the following sports?","o":["cycling","Gymnastics","Diving","Solitary swimming"],"a":1,"e":"Gymnastics . Produnova is related to women's artistic Gymnastics vault consisting of a front handspring onto the vaulting horse and two front somersaults in a tucked position off it. Dipa Karmakar is one of five women gymnasts in the world to have successfully executed the highly-difficult Produnova vault. Dipa Karmakar finished in fourth place at the Rio 2016 Olympics.","s":""},{"n":1046,"t":"Sports","q":"Which state in India houses The National Institute of Water Sports?","o":["Maharashtra","Goa","Karnataka","Assam"],"a":1,"e":"Goa. The National Institute of Water Sports was established in July 1990.","s":""},{"n":1047,"t":"Sports","q":"Which Indian cricketer has featured in the most number of international cricket matches ?","o":["Mohammad Azharuddin","Sachin Tendulkar","Sourav Ganguly","Mahendra Singh Dhoni"],"a":1,"e":"Sachin Tendulkar played 664 international cricket matches in total, scoring 34,357 runs. He is the youngest to receive Bharat Ratna Award in 2014.","s":""},{"n":1048,"t":"Sports","q":"Which soccer player holds the distinction of having the most wins of the FIFA World Cup by any player?","o":["Pele","Diego Maradona","Zinedine Zidane","George Best"],"a":0,"e":"Pele (Brazil) is known as ‘The Black Pearl’, ‘The King of Football’. Brazil won FIFA five times. Its headquarters is in Zurich, Switzerland.","s":""},{"n":1049,"t":"Sports","q":"Consider the following statements:\n1. Mihir Sen was the first Indian swimmer to cross the English Channel in 1958.\n2. Arati Saha was the first Asian woman to swim across the English Channel. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Mihir Sen became the first Indian to swim across the English Channel in 1958, and Arati Saha was the first Asian woman to achieve this feat, highlighting India’s early achievements in long-distance swimming.","s":""},{"n":1050,"t":"Sports","q":"Who is known as the ‘Wizard of Hockey’ ?","o":["Balbir Singh","Dhanraj Pillay","Mohammed Shahid","Major Dhyan Chand"],"a":3,"e":"Major Dhyan Chand .","s":""},{"n":1051,"t":"Sports","q":"With which of the following sports is the Ruia Gold Cup associated ?","o":["Water polo","Bridge","Badminton","Swimming"],"a":1,"e":"Bridge . Other trophies associated with Bridge include Basalat Jha Trophy, Holkar Trophy and Singhania Trophy.","s":""},{"n":1052,"t":"Sports","q":"In cricket, which of the following fielding positions is behind the batsman?","o":["Mid-wicket","First slip","Mid off","Cover"],"a":1,"e":"A slip fielder is placed behind the batsman on the off side of the field. A first slip is alongside the wicketkeeper, with second slip, third slip etc following in the same direction. First slip is normally about a foot or so behind the wicketkeeper.","s":""},{"n":1053,"t":"Sports","q":"With which of the following sports is the term ‘Chinaman’ associated","o":["Cricket","Table tennis","Polo","Swimming"],"a":0,"e":"Cricket. Chinaman bowling is a left-arm unorthodox spin, where the bowler spins the ball into a right-handed batsman.","s":""},{"n":1054,"t":"Sports","q":"Consider the following statements about the term ‘16-yard hit’:\n1. It is a rule associated with the game of field hockey.\n2. It is awarded to the defending team when the opposition commits a foul inside the striking circle or hits the ball over the backline. is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. In field hockey, a 16-yard hit is awarded to the defence under these situations, making it a key restarting rule.","s":""},{"n":1055,"t":"Sports","q":"In which of the following sports is the shakehand grip used?","o":["Badminton","Squash","Cricket","Table tennis"],"a":3,"e":"Table tennis. It is the typical European type grip where the head of the racket faces up, and your hand looks like it's ready to shake a person's hand. ‘Penhold grip’, ‘Common grip’ and ‘Forehand’ grip are some of the other grips used in Table tennis.","s":""},{"n":1056,"t":"Sports","q":"Birdie, eagle and albatross are all terms used in ______.","o":["golf","polo","baseball","football"],"a":0,"e":"Golf. Some Terms used in Golf - par, bogey, double bogey, triple bogey, ace, handicap, etc. terms used in Baseball- strikeout, base, walk, home run hit, bat, batter, etc.","s":""},{"n":1057,"t":"Sports","q":"With which sport are Vijay Amritraj and Anand Amritraj associated?","o":["Table tennis","Cricket","Lawn tennis","Football"],"a":2,"e":"Lawn tennis.","s":""},{"n":1058,"t":"Sports","q":"Which of the following animals is made to race in the traditional sport called 'Kambala' in Karnataka?","o":["Horse","Dog","Buffalo","Goat"],"a":2,"e":"Kambala is an annual buffalo race held in the southwestern Indian state of Karnataka.","s":""},{"n":1059,"t":"Sports","q":"In which of the following cities is the headquarters of the All India Chess Federation situated?","o":["New Delhi","Bengaluru","Hyderabad","Mumbai"],"a":0,"e":"New Delhi. AICF is the central administrative body for the game of chess in India, founded in 1951 which is affiliated with Fédération Internationale des Échecs (FIDE), the world body for chess. The organisation is also in charge of managing women's chess in India.","s":""},{"n":1061,"t":"Sports","q":"______ was the first Test cricket captain of an independent Indian team.","o":["Vijay Hazare","Hemu Adhikari","Bishan Singh Bedi","Lala Amarnath"],"a":3,"e":"Lala Amarnath Bharadwaj, known as the father figure of Indian Cricket, captained India in the first Test series and won against Pakistan in 1952. He was the first batsman to score a century for India in Test cricket.","s":""},{"n":1062,"t":"Sports","q":"Consider the following statements about Indian tennis history:\n1. In 1999, Leander Paes and Mahesh Bhupathi became the first Indian pair to reach the finals of all four Grand Slams in the Open era.\n2. They won the French Open and Wimbledon that year as top seeds, creating history for Indian tennis. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Paes and Bhupathi created history in 1999 by reaching all four Grand Slam finals and winning Wimbledon and the French Open, becoming the first Indians to achieve this feat.","s":""},{"n":1063,"t":"Sports","q":"At the 1992 Summer Olympics, ______ became the first woman to carry the flag of India at the opening ceremony of any Olympics.","o":["Karnam Malleswari","Shiny Abraham Wilson","PT Usha","Nilima Ghose"],"a":1,"e":"Shiny Abraham Wilson. She is an Asian Games gold medal winner and the first Indian woman to reach the semi-finals of an Olympic event.","s":""},{"n":1064,"t":"Sports","q":"Who among the following was a World War II veteran, also associated with cricket?","o":["Brad Friedel","Alan Burgess","Ivan Cordoba","Erik Karlsson"],"a":1,"e":"Alan Burgess , New Zealand first-class cricketer, and World War II veteran. He was a tank driver in World War II. In June 2020, Burgess became the world’s oldest living first-class cricketer.","s":""},{"n":1065,"t":"Sports","q":"Consider the following\n1. She was the first female athlete to represent Pakistan at the Olympics.\n2. She participated in the 1996 Summer Olympics held in Atlanta, United States. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Shabana Akhtar made history as Pakistan's first woman Olympian when she competed in the women’s long jump at the 1996 Atlanta Olympics.","s":""},{"n":1066,"t":"Sports","q":"Who among the following won a bronze medal at the World Athletics Championship in Paris in 2003?","o":["Krishna Poonia","Seema Punia","PT Usha","Anju Bobby George"],"a":3,"e":"Anju Bobby George is a retired Indian athlete. She made history when she won the bronze medal in the long jump at the 2003 World Championships in Athletics in Paris and became the first Indian athlete ever to win a medal in a World Championships in Athletics jumping 6.70 m.","s":""},{"n":1067,"t":"Sports","q":"Where were the first Winter Paralympics Games held ?","o":["Italy","Korea","Russia","Sweden"],"a":3,"e":"In 1976, the first Winter Games in Paralympics history were held in Sweden.","s":""},{"n":1068,"t":"Sports","q":"Who had proposed the motto of Olympics?","o":["Didon","Pierre de Coubertin","Hirohito","Moon Jae-in"],"a":1,"e":"Pierre de Coubertin. The Olympic motto is made up of three Latin words: CITIUS, ALTIUS, FORTIUS -COMMUNITER (FASTER, HIGHER, STRONGER - TOGETHER).","s":""},{"n":1069,"t":"Sports","q":"‘Tenpins’ refers to the game of ______.","o":["baseball","basketball","billiards","bowling"],"a":3,"e":"bowling .","s":""},{"n":1070,"t":"Sports","q":"To which of the following Indian states does Mardani Khel, one of the famous martial art forms in India belong?","o":["Maharashtra","Uttar Pradesh","Rajasthan","Madhya Pradesh"],"a":0,"e":"Maharashtra . It is particularly known for its use of the uniquely Indian patta (sword) and vita (corded lance).","s":""},{"n":1071,"t":"Books And Authors","q":"What is the name of the writer of Tomb of Sand, the first Hindi book to be awarded the International Booker Prize ?","o":["Geetanjali Shree","Arundhati Roy","Kiran Desai","Jhumpa Lahiri"],"a":0,"e":"Geetanjali Shree. “Tomb of Sand”, originally written in Hindi as “Ret Samadhi”, is authored by Geetanjali Shree. In May 2022, it became the first Hindi novel (and the first book originally written in any Indian language) to win the International Booker Prize. The novel was translated into English by Daisy Rockwell, who also shared the award. In 2025, the Kannada short story collection \"Heart Lamp\" by author Banu Mushtaq and translator Deepa Bhasthi won the prestigious International Booker Prize.","s":"SSC Stenographer 6/08/2025 (Shift 1)"},{"n":1072,"t":"Books And Authors","q":"Which Indian-American author wrote The Namesake, later adapted into a film?","o":["Kiran Desai","Jhumpa Lahiri","Arundhati Roy","Chetan Bhagat"],"a":1,"e":"Jhumpa Lahiri. She won the prestigious Pulitzer Prize for Fiction in 2000 for her debut collection of short stories, \"Interpreter of Maladies\" (1999). Her books: Unaccustomed Earth (2008), and The Lowland (2013). Other Authors: Kiran Desai - Hullabaloo in the Guava Orchard , The Inheritance of Loss (2006). Arundhati Roy - The God of Small Things (1997), The Algebra of Infinite Justice (2002) and Fiction (2020). Chetan Bhagat - Five Point Someone, One Night @ the Call Center, 2 States, Revolution 2020, Half Girlfriend, and The Girl in Room 105.","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":1073,"t":"Books And Authors","q":"Match the Following\nColumn A - Column B -Literary Work Type\nA. Naukar Ki Kameez i. Poetry collection\nB. Lagbhag Jai Hind ii. Novel\nC. Peed Par Kamra iii. Short story collection\nD. Woh Aadmi Chala iv. Poem Gaya","o":["A-iii, B-ii, C-i, D-iv","A-ii, B-i, C-iii, D-iv","A-i, B-ii, C-iv, D-iii","A-ii, B-iii, C-i, D-iv"],"a":1,"e":"A-ii, B-i, C-iii, D-iv. Naukar Ki Kameez by Vinod Kumar Shukla is a novel depicting the life of a clerk. Lagbhag Jai Hind is a poetry collection Peed Par Kamra is a short story collection portraying human emotions and societal issues. Woh Aadmi Chala Gaya is a poem that reflects personal loss and emotional depth.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":1074,"t":"Books And Authors","q":"What was the first published poetry collection by Vinod Kumar Shukla?","o":["Lagbhag Jai Hind","Kavita se Lambi Kavita","Aakash Dharti Ko Khatakta Hai","Woh Aadmi Chala Gaya"],"a":0,"e":"Lagbhag Jai Hind. Vinod Kumar Shukla is a renowned modern Hindi writer known for his unique style close to magic realism. His famous novels include ‘’Naukar ki Kameez’’ (adapted into a film by Mani Kaul) and ‘’Deewar Mein Ek Khirkee Rahati Thi’’ (Sahitya Akademi Award, 1999; later staged as a play). In 2023, he became the first Indian to win the PEN/Nabokov Award for International Literature. In 2024, he received the Jnanpith Award, becoming the first writer from Chhattisgarh to do so. Shukla remains a celebrated figure in contemporary Hindi literature.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":1075,"t":"Books And Authors","q":"Who is the author of \"The God of Small Things\" ?","o":["Chimamanda Ngozi Adichie","Neil Gaiman","Arundhati Roy","Mo Yan"],"a":2,"e":"Arundhati Roy. The God of Small Things is a celebrated debut novel by Arundhati Roy, published in 1997. It won the Booker Prize for Fiction the same year, making her the first Indian woman to receive this honor. The novel is set in Kerala and explores themes of caste, family, love, and social discrimination. Roy’s unique narrative style and profound storytelling established her as one of the most influential contemporary Indian writers.","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":1076,"t":"Books And Authors","q":"Who among the following is the author of the book 'The House of Blue Mangoes'?","o":["David Davidar","Durjoy Data","Arvind Adiga","Sekhar Bandyopadhyay"],"a":0,"e":"David Davidar. His Other Books: “The solitude of emperors”, “Ithaca”, and “Nila amera kuṭhi”.","s":""},{"n":1077,"t":"Books And Authors","q":"Who among the following is the author of the book ‘The Glassblower’s Breath’ ?","o":["Bharati Mukherjee","Sunetra Gupta","Chitra Banerjee Divakaruni","Shobha De"],"a":1,"e":"Sunetra Gupta. Her Other Books: “Memories of Rain”, and “A Sin of Color”. Authors and their books: Shobha De - “Starry Nights”, “Speedpost”. Bharati Mukherjee - “Desirable Daughters”, “Miss New India”. Chitra Banerjee Divakaruni -“The Palace of Illusions”, “The Last Queen”.","s":""},{"n":1078,"t":"Books And Authors","q":"Consider the following statements about authors and their books:\n1. The Thousand Faces of Night is authored by Githa Hariharan.\n2. The Other Side of Silence is authored by Urvashi Butalia.\n3. Fault Lines is authored by Meena Alexander.\n4. Things to Leave Behind is authored by Namita Gokhale.\nWhich of the above statements is/are correct ?","o":["1 only","1 and 2 only","1, 2 and 3 only","1, 2, 3 and 4"],"a":3,"e":"1, 2, 3 and 4.","s":""},{"n":1079,"t":"Books And Authors","q":"The historical fiction ‘The Glory of Patan’ by KM Munshi was originally written in which Indian language?","o":["Malayalam","Bengali","Tamil","Gujarati"],"a":3,"e":"Gujarati. Kanhaiyalal Maneklal Munshi, popularly known by his pen name Ghanshyam Vyas, was an Indian independence movement activist, politician, writer from Gujarat state. Books by him: ‘’Krishnavatara II The Wrath Of An Emperor’’, ‘’Atta Ke Svapna’’, ‘’Gaurava K Pratka’’, ‘’Lopamudra’’, ‘‘Pratiodha’’, ‘’Akhand Hindustan’’, ‘’Gujarat and Its Literature’’, ‘’The Book of Satyabhama’’, ‘’The Ruin That Britain Wrought’’, ‘’Kakani Raashi Ane Chiye Tej Thik’’.","s":""},{"n":1080,"t":"Books And Authors","q":"Consider the following statements:\n1. Streepurushtulna (1882, Marathi) was authored by Tarabai Shinde.\n2. Amar Jibon (1876) was authored by Sarojini Naidu.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Streepurushtulna was written by Tarabai Shinde, while Amar Jibon was authored by Rashsundari Devi, not Sarojini Naidu.","s":""},{"n":1081,"t":"Books And Authors","q":"Which of the following fictional towns is mentioned in the English novel ‘In Custody’ written by Anita Desai?","o":["Kanthapura","Mirpore","Malgudi","Lilliput"],"a":1,"e":"Mirpore. In Custody (1984) is a novel set in Delhi by Anita Desai. Her other novels include “Journey to Ithaca”, “Clear Light of Day”, “Fasting, Feasting”, “The Zigzag Way”, and “The Peacock Garden”. Malgudi is a fictional town located in south India in the novels and short stories of R.K. Narayan. Lilliput fictional island nations that appear in the novel Gulliver's Travels by Jonathan Swift.","s":""},{"n":1082,"t":"Books And Authors","q":"Consider the following statements:\n1. The Catcher in the Rye was authored by J.D. Salinger.\n2. The Old Man and the Sea was authored by Mark Twain.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. J.D. Salinger wrote The Catcher in the Rye (1951), while The Old Man and the Sea was authored by Ernest Hemingway, not Mark Twain.","s":""},{"n":1083,"t":"Books And Authors","q":"Epic Poem, Savitri, described by its author as ‘A Legend and a Symbol’, was written by _____.","o":["Bal Gangadhar Tilak","Aurobindo Ghosh","Mahatma Phule","Baba Saheb Ambedkar"],"a":1,"e":"Aurobindo Ghosh. Savitri poem was based on the legend of Savitri and Satyavan in the Mahabharata. His other books include “The Life Divine”, “The Human Cycle”, “The Secret of the Veda” and “The Synthesis of Yoga”.","s":""},{"n":1084,"t":"Books And Authors","q":"Consider the following statements regarding autobiographies of dancers:\n1. Once a Dancer is the autobiography of Allegra Kent.\n2. A Passion for Dance: My Autobiography is written by Yamini Krishnamurthy.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct. Allegra Kent, an American ballet dancer, wrote Once a Dancer, while Yamini Krishnamurthy, an eminent Bharatanatyam and Kuchipudi dancer, authored A Passion for Dance: My Autobiography.","s":""},{"n":1085,"t":"Books And Authors","q":"The famous novel ‘The house of blue mangoes’ is written by:","o":["Romila Thapar","Shashi Tharoor","David Davidar","Anees Salim"],"a":2,"e":"David Davidar is an Indian novelist his other books include “The solitude of emperors” and “Ithaca”. Romila Thapar - “Somanatha”, “The Past Before Us”. Shashi Tharoor - “The Paradoxical Prime Minister”, “Riot: A Love Story”. Anees Salim - “The Blind Lady’s Descendants”, “Fly, Hasina, Fly” and “Vanity Bagh”.","s":""},{"n":1086,"t":"Books And Authors","q":"Consider the following statements regarding sports autobiographies:\n1. Running for My Life: One Lost Boy’s Journey from the Killing Fields of Sudan to the Olympic Games is the autobiography of Lopez Lomong.\n2. Faster than Lightning: My Autobiography was written by Usain Bolt.\n3. A Shot at History is the autobiography of Abhinav Bindra.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 are correct. Lopez Lomong, an American middle-distance runner, wrote Running for My Life. Usain Bolt authored Faster than Lightning, and shooter Abhinav Bindra wrote A Shot at History.","s":""},{"n":1087,"t":"Books And Authors","q":"Yashodhara Dalmia is the author of which famous book?","o":["Paintings in the Kangra Valley","Ajanta","The Painted World of the Warlis","Indian Art"],"a":2,"e":"The Painted World of the Warlis. Her Other Books include “Amrita Sher-Gil: A Life”, “Sayed Haider Raza”. Other Authors: Vijay Sharma - “Painting in the Kangra Valley”. Walter M. Spink -“Ajanta, A Brief History and Guide”, “The axis of Eros”.","s":""},{"n":1088,"t":"Books And Authors","q":"Consider the following pairs of books and their authors:\n1. The Forgotten Forms of Hindustani Music – Rabindra Bharali\n2. Indie 101 – Ritnika Nayan\n3. Music to My Ears – Celine L. A. Simpson\n4. The Music Room – Namita Devidayal How many of the above pairs are correctly matched?","o":["Only one","Two","Three","All four"],"a":3,"e":"Dr. Rabindra Bharali authored The Forgotten Forms of Hindustani Music, while the other listed books are written by Ritnika Nayan, Celine L. A. Simpson, and Namita Devidayal respectively.","s":""},{"n":1089,"t":"Books And Authors","q":"Consider the following statements:\n1. The autobiography \"Lone Fox Dancing\" was written by Ruskin Bond.\n2. Ruskin Bond is also the author of famous works like The Room on the Roof and The Blue Umbrella. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Lone Fox Dancing is Ruskin Bond’s autobiography, and he is a celebrated Indian author known for works such as The Room on the Roof and The Blue Umbrella.","s":""},{"n":1090,"t":"Books And Authors","q":"Who among the following authors wrote ‘Kamayani’, ‘Dhruvswamini’, ‘Kankal’, ‘Titli’, ‘Skandagupta’, ‘Lahar’ and ‘Mamta’?","o":["Jaishankar Prasad","Suryakant Tripathi Nirala","Bhisham Sahni","Krishna Sobti"],"a":0,"e":"Jaishankar Prasad. Prasad was his pen name. He was also known as Chhayavadi kavi. Other Author and Books: Jaishankar Prasad - Iravati, Kānan kusum, Chandragupta. Suryakant Tripathi Nirala - Ram Ki Shakti Pooja, Kukurmutta, Parimal. Bhisham Sahni - Tamas, Kahaniyan, Madhavi. Krishna Sobti -Zindaginama - Zinda Rukh, Badalom ke ghere.","s":""},{"n":1091,"t":"Books And Authors","q":"In 1973, the first female high court judge of India Anna Chandy published her autobiography _______ in Malayalam.","o":["The Test of My Life","Playing it My Way","Atmakatha","The Race of My Life"],"a":2,"e":"Atmakatha. Anna Chandy was the first woman judge in India and the Commonwealth, appointed as a munsif in 1937. She later became the first female High Court judge in India in\n1959. Other Autobiographies: Yuvraj Singh - ‘’The Test of My Life’’, Sachin Tendulkar - ‘’Playing it My Way’’, Milkha Singh - ‘’The Race of My Life’’.","s":""},{"n":1092,"t":"Books And Authors","q":"Who has written the book Sangeet Bal Prakash?","o":["Pandit Narayan Rao","Vishnu Digambar Paluskar","Vishnu Narayan Bhatkhande","Bhimsen Joshi"],"a":1,"e":"Vishnu Digambar Paluskar founded the Gandharva Mahavidyalaya in Lahore in 1901. His notable works include Baalbodh (Children's Knowledge) in five volumes, Raag Pravesh (Entry into Raagas) in nineteen volumes, and Mahilaa Sangeet (Ladies' Music). Paluskar also innovated musical performances through enterprises like Tablaa Tarang (Tabla Vibrations) and Kaashtha Tarang (Wood Vibrations).","s":""},{"n":1093,"t":"Books And Authors","q":"Consider the following statements:\n1. The book \"From Plassey to Partition and After: A History of Modern India\" is authored by Sekhar Bandyopadhyay.\n2. He has also written \"Caste and Partition in Bengal: The Story of Dalit Refugees, 1946–1961\". Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Sekhar Bandyopadhyay is the author of From Plassey to Partition and After, and his other notable work is Caste and Partition in Bengal.","s":""},{"n":1094,"t":"Books And Authors","q":"Which famous book was written by ‘Haripala’?","o":["Gita Govinda","Sangeet Darpan","Sangeet Ratnakara","Sangeeta Sudhakara"],"a":3,"e":"Sangeeta Sudhakara. The term ‘Carnatic’ and ‘Hindustani’ to classify musical styles first appeared in it. The Gita Govinda is a work composed by the 12th-century Hindu poet, Jayadeva. Sangeet Darpan is a musical treatise on Indian classical music written by Damodar Pandit. The Sangita-Ratnakara (Ocean of Music and Dance) is one of the most important musicological texts from India.","s":""},{"n":1095,"t":"Books And Authors","q":"Consider the following statements:\n1. Sangraha Choodamani, which explains the present system of Carnatic music, was written by Govindacharya.\n2. Matanga authored Brihaddesi, while Bharata is traditionally credited with the Natya Shastra. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Govindacharya wrote Sangraha Choodamani, a key text on Carnatic music, while Matanga and Bharata contributed to Brihaddesi and Natya Shastra respectively.","s":""},{"n":1096,"t":"Books And Authors","q":"Who among the following is the author of the book 'The Guide'?","o":["Rohinton Mistry","RK Narayan","Vikram Chandra","Shashi Tharoor"],"a":1,"e":"RK Narayan. His other books: ‘Malgudi Days’, ‘Swami and Friends’, ‘The Vendor of Sweets’, ‘A Tiger for Malgudi’, ‘The English Teacher’, ‘The Dark Room’ and ‘Mahatma Ka Intezaar’. Author and their notable works: Shashi Tharoor - ‘Why I Am a Hindu’, ‘The Paradoxical Prime Minister’, and ‘Pride Prejudice & Punditry’. Vikram Chandra -‘Sacred Games’, ‘The Srinagar Conspiracy’. Rohinton Mistry - ‘A Fine Balance’, ‘The Scream’.","s":""},{"n":1097,"t":"Books And Authors","q":"Consider the following statements:\n1. Truth, Love and a Little Malice is the autobiography of Khushwant Singh.\n2. He is also the author of books like Train to Pakistan and A History of the Sikhs. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Books by Him: ‘’Train to Pakistan’’, ‘’Sex, Scotch & Scholarship’’, ‘’Land of Five Rivers’’, ‘’A History of the Sikhs’’, ‘’I Shall Not Hear the Nightingale’’.","s":""},{"n":1098,"t":"Books And Authors","q":"Whose autobiography is titled ‘A Life Apart’?","o":["Prabha Khaitan","Bindu Bhatt","Vinita Agarwal","Mannu Bhandari"],"a":0,"e":"Prabha Khaitan. She was an Indian novelist, poet, entrepreneur and feminist. Bindu Bhatt is a Gujarati language novelist, storywriter, critic and translator. Her books : ‘Chhinnmasta’, ‘Anya Se Ananya’, ‘Peeli Aandhi’, etc. Autobiography of Mannu Bhandari - ‘Ek Kahaani Yeh Bhi’.","s":""},{"n":1099,"t":"Books And Authors","q":"‘ Anup Rag Vilas' is a book written by which of the following musicians?","o":["Pandit Kumar Gandharva","Pandit Jasraj","Pandit Birju Maharaj","Pandit Dinkar Kaikini"],"a":0,"e":"Pandit Kumar Gandharva. He was conferred the title ‘Kumar Gandharva’ by the Shankaracharya. His Awards: Padma Bhushan (1977) and Padma Vibhushan (1990). Other books and authors: Pandit Jasraj - ‘Rasraj’. Pandit Birju Maharaj - ‘The Master Through My Eyes’, ‘Rasgunjan’. Pandit Dinkar Kaikini - ‘Living Music’.","s":""},{"n":1100,"t":"Books And Authors","q":"Whose memoir is titled 'Once Upon a Life : Burnt Curry and Bloody Rags'?","o":["Temsula Ao","Janice Pariat","Easterine Kire","Patricia Mukim"],"a":0,"e":"Temsula Ao. Her Books : ‘Laburnum for My Head : Stories’, ‘The Tombstone in my Garden’. Authors and book: Janice Pariat - ‘Boats on Land’, ‘Everything the Light Touches’. Easterine Kire - ‘When the River Sleeps’, ‘Spirit Nights’. Patricia Mukim - ‘Waiting for an Equal World: Gender in India's Northeast'.","s":""},{"n":1101,"t":"Books And Authors","q":"‘Unladylike’ is a memoir by ____.","o":["Aditi Mittal","Supriya Joshi","Aishwarya Mohanraj","Radhika Vaz"],"a":3,"e":"Radhika Vaz. Hilarious Comedy Novels by Indian Writers: ‘The Unproposed Guy’ - Bhavik Sarkhedi and Suhana Bhambhani, ‘Mrs Funnybones’ -Twinkle Khanna, ‘The Great Indian Novel’ - Shashi Tharoor, ‘English, August’ -Upamanyu Chatterjee, ‘Anything for You, Ma’am’ - Tushar Raheja, ‘Tongue - in -Cheek’ - Khyrunnisa A, ‘Dissected’ -Naveen Kakkar, ‘Hostelitis’ - Srinivas Addepalli, ‘The Backbenchers Series’ -Sidharth Oberoi, ‘Page 6 and Beyond’ -Hureen Saghar Gandhi, ‘The Great Indian Democracy’ - Manivannan K, ‘The White Tiger’ - Aravind Adiga, ‘The Rozabal Line’ - Ashwin Sanghi, ‘Delhi Belly’ - Arijit Sen.","s":""},{"n":1102,"t":"Books And Authors","q":"Consider the following statements:\n1. The Palace of Illusions was authored by Chitra Banerjee Divakaruni.\n2. R.K. Narayan wrote Malgudi Days, while Rohinton Mistry authored A Fine Balance. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Chitra Banerjee Divakaruni is the author of The Palace of Illusions, whereas Malgudi Days is by R.K. Narayan and A Fine Balance by Rohinton Mistry.","s":""},{"n":1103,"t":"Books And Authors","q":"Who among the following wrote the novel ‘Grimus’?","o":["Amitav Ghosh","Salman Rushdie","Arvind Adiga","Vikram Seth"],"a":1,"e":"Salman Rushdie is an Indian-born British-American novelist. Books by Him: ‘’Satanic Verses’’, ‘’Midnight's Children’’, ‘’Victory City’’, ‘’The Enchantress of Florence: A Novel’’’, ‘’The Golden House’’.","s":""},{"n":1104,"t":"Books And Authors","q":"A Flight of Pigeons is a famous book written by _________________.","o":["Salman Rushdie","Vikram Seth","Khushwant Singh","Ruskin Bond"],"a":3,"e":"Ruskin Bond. His Other books: ‘The Great Train Journey’, ‘The Room on the Roof’, ‘The Blue Umbrella’, ‘Delhi Is Not Far’. Other writer and book: Khushwant Singh - ‘The train to Pakistan’, ‘The end of India’, ‘The Company of Women’.","s":""},{"n":1105,"t":"Books And Authors","q":"Who among the following is the author of the book ‘The Oath of the Vayuputras’?","o":["Indrapramit Das","Amish Tripathi","Vikram Chandra","Ravi Subramanian"],"a":1,"e":"Amish Tripathi. His other books: The ‘Immortals of Meluha’, ‘The Secret of the Nagas’, ‘The Shiva Trilogy’. Indrapramit Das - ‘The Devourers’, ‘Infinity war’. Vikram Chandra - ‘Sacred Games’, ‘Red Earth’ and ‘Pouring Rain’, ‘The Srinagar Conspiracy’. Ravi Subramanian - ‘Bankerupt’, ‘the Name of God’, ‘God is a Gamer’.","s":""},{"n":1106,"t":"Books And Authors","q":"Which of the following books is written by Rabindranath Tagore ?","o":["Non - Violent Resistance","The Essential Writings","The Way to God","Nationalism"],"a":3,"e":"Nationalism. His other books: “Gitanjali”, “Gora”, “The Postmaster”. “Non-Violent Resistance” or (Satyagraha) written by Mahatma Gandhi. “The Way to God” written by Dwight L. Moody.","s":""},{"n":1107,"t":"Books And Authors","q":"Consider the following statements:\n1. Those Pricey Thakur Girls was authored by Anuja Chauhan.\n2. She has also written books like The Zoya Factor and Battle for Bittora. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Anuja Chauhan is the author of Those Pricey Thakur Girls, and some of her other popular works include The Zoya Factor and Battle for Bittora.","s":""},{"n":1108,"t":"Books And A
