nces of Uttarakhand- Choliya, Jhumelo, Pandavart / Pandava Leela, Langvir, Chanchari, Chhapeli, Tandi, Chaunfula, Jhoda, Thadiya.","s":""},{"n":146,"t":"Dance","q":"‘ Ranapa’, a folk dance form of Odisha, consists of enacting chapters from the life of Lord ______.","o":["Indra","Ram","Krishna","Hanuman"],"a":2,"e":"Krishna. Ranapa is performed on the stilt and accompanies by drum music, along with songs related to Lord Krishna childhood stories.","s":""},{"n":147,"t":"Dance","q":"Match the following folk dances with their states: Dance Form State\n1. Alkap A. Gujarat\n2. Bhavai B. West Bengal\n3. Tippani C. Rajasthan\n4. Hudo D. Gujarat","o":["1-B, 2-C, 3-A, 4-D","1-A, 2-B, 3-C, 4-D","1-B, 2-A, 3-D, 4-C","1-C, 2-B, 3-A, 4-D"],"a":0,"e":"1-B, 2-C, 3-A, 4-D. Alkap -Folk dance of West Bengal (especially performed in Rajbanshi and Santhal communities, often during harvest festivals). Bhavai - Folk theatre/dance of Rajasthan, performed by balancing multiple pots on the head. Tippani - Folk dance of Gujarat, performed by women with long wooden sticks during Navratri and festive occasions. Hudo - Tribal dance of Gujarat, performed mainly by the Bharwad community.","s":""},{"n":148,"t":"Dance","q":"‘ Bolak-aat’ is a ______ from the state of Karnataka.","o":["music form","painting form","dance form","sculpting form"],"a":2,"e":"Dance form . This dance form is performed by Kodava men in the back of an oil lamp in an open field. The men hold chiavari (yak fur) in one hand and the Kodava short sword (odi-kathi) in the other while performing this dance.","s":""},{"n":149,"t":"Dance","q":"Hallisaka is a group dance native to ______.","o":["Rajasthan","Goa","Maharashtra","Gujarat"],"a":3,"e":"Gujarat . It is a type of group dance in which a young man stands in the middle of damsels who form a circular ring by joining hands. The time (tala) is kept by clapping and is accompanied by singing.","s":""},{"n":150,"t":"Dance","q":"Kadsa is a dance style performed by women in Jharkhand, carrying a ____.","o":["Kalasha","Kamandal","Kumbha","Kapala"],"a":0,"e":"Kalasha (Earthen pot). This is a female dominated dance. Normally in this dance style, women perform carrying a ‘Kalash’ on their shoulders or heads.","s":""},{"n":151,"t":"Dance","q":"Which Ladakhi folk dance, once performed exclusively for the King of Ladakh during special occasions, is popularly called the \"Royal Dance of Ladakh\"?","o":["Yak Dance","Jabro Dance","Shondol Dance","Koshan Dance"],"a":2,"e":"Shondol Dance. Shondol Dance – Royal Dance of Ladakh, once performed before the King during festivals. Dancers wear elaborate headgear, colorful costumes, and ornaments. Yak Dance - Depicts the Yak, performed in Ladakh & Arunachal Pradesh. Jabro Dance - Tibetan/Ladakhi group dance for New Year. Koshan Dance - Lesser-known Ladakhi folk dance.","s":""},{"n":152,"t":"Arts Personality","q":"Sattriya, one of the classical dances of India, was introduced by which saint?","o":["Sankardev","Chaitanya Mahaprabhu","Kabir","Tulsidas"],"a":0,"e":"Sankardev. Sattriya is one of the classical dance forms of India, and it was introduced by Saint Sankardev in the 15th–16th century in the state of Assam. Sankardev was a revered saint, scholar, and cultural reformer who played a crucial role in the Bhakti movement in Assam. He developed Sattriya as a medium to propagate the teachings of Vaishnavism through dance and drama. Originally performed in monasteries known as \"Satras\" by male monks, the dance later evolved into a major classical art form recognized across India.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":153,"t":"Arts Personality","q":"Consider the following statements about Raga Mala:\n1. Raga Mala is the autobiography of sitar maestro Ravi Shankar.\n2. Lata Mangeshkar’s biography is titled My Music, My Life. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. My Music, My Life is also written by Ravi Shankar; Lata Mangeshkar’s biography is Lata: A Life in Music by Yatindra Mishra.","s":""},{"n":154,"t":"Arts Personality","q":"Who among the following musicians plays Carnatic music and also known as 'God of Ghatam'?","o":["RV Raghvan","Ram Narayan","TH Vinayakram","Asad Ali Khan"],"a":2,"e":"TH Vinayakram (popularly known as Vikku Vinayakram) is a renowned Indian percussionist and a master of playing the ghatam (a traditional South Indian clay pot instrument). His Awards: Padma Shri (2002), Padma Bhushan (2014), Sangeet Natak Akademi Award (1988), Grammy Award (1991).","s":""},{"n":155,"t":"Arts Personality","q":"Consider the following statements about Kamala Lakshmi Narayanan:\nStatement 1: She is a leading exponent of Bharatanatyam in the Kathak tradition.\nStatement 2: She performed for Queen Elizabeth II during the coronation festivities in 1953. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. Statement 1 is incorrect because she is a leading exponent of Bharatanatyam in the Vazhuvoor tradition . Awards: Kalaimamani (1967), Padma Bhushan (1970). In 2010 she received a National Heritage Fellowship from the National Endowment for the Arts for her contributions to the arts.","s":""},{"n":156,"t":"Arts Personality","q":"Who is revered as ‘Karnataka Sangeeta Pitamaha’ ?","o":["Jagannatha Dasa","Purandara Dasa","Gopala Dasa","Vijaya Dasa"],"a":1,"e":"Purandara Dasa composed thousands of devotional songs, known as 'Devaranamas', in praise of Lord Vishnu. The original name of Purandara Das was Srinivasa Nayaka. Vyasatirtharu was the guru of Purandara Dasa.","s":""},{"n":157,"t":"Arts Personality","q":"Consider the following statements about R. Muthukannammal:\nStatement 1: She is a veteran Sadir dancer from Tamil Nadu.\nStatement 2: Sadir is the precursor to Bharatanatyam and originated from Dasiattam. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. She is a seventh - generation Sadir dancer; Sadir is an ancient form from which Bharatanatyam evolved.","s":""},{"n":158,"t":"Arts Personality","q":"Consider the following statements about Vempati Chinna Satyam:\n1. He founded the Kuchipudi Art Academy in Madras in 1963.\n2. He established the Kalakshetra Foundation in Chennai. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect because Kalakshetra was founded by Rukmini Devi Arundale. Other Art/Dance academies in India: Darpana Academy of Performing Arts (1949), Ahmedabad - Mrinalini Sarabhai and Vikram Sarabhai. Kalakshetra Foundation (1936), Chennai - Rukmini Devi Arundale (Bharatanatyam). Bhatkhande Sanskriti Vishwavidyalaya (1926), Lucknow, Uttar Pradesh - Vishnu Narayan Bhatkhande.","s":""},{"n":159,"t":"Arts Personality","q":"Which of the following awards and recognitions was NOT received by Vempati Chinna Satyam?","o":["Kalidas Samman","Honorary doctorate","Sangeet Natak Akadami Award","Padma Shri"],"a":3,"e":"Padma Shri. Vempati Chinna was a Kuchipudi dancer and a guru. He was taught by Vedantam Lakshmi Narayana Sastry.","s":""},{"n":160,"t":"Arts Personality","q":"Consider the following statements about Lata Mangeshkar:\nStatement 1: She was awarded the Bharat Ratna in 2004.\nStatement 2: She received the Dadasaheb Phalke Award in 1989. Which of the statements given above is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"Only 2. Lata Mangeshkar was an Indian playback singer born in Indore. She received the Bharat Ratna in 2001, Padma Bhushan in 1969, the Padma Vibhushan in 1999, the Dadasaheb Phalke Award in 1989, and the 'Officier de la Legion d'Honneur,' France's highest civilian award, in 2009. She is also renowned for singing the famous song 'Aye mere watan ke logo’.","s":""},{"n":161,"t":"Arts Personality","q":"Mohan Veena player, Pandit Vishwa Mohan Bhatt won the _________ Award in the year 1994.","o":["Sangita Kalanidhi","Oscar","Grammy","Sangeet Natak Akademi"],"a":2,"e":"Grammy. His music album with Ry Cooder, A Meeting by the River, won him a Grammy Award. He also received the Sangeet Natak Akademi Award in 1998, the Padma Shri in 2002, and the Padma Bhushan in 2017. Famous Mohan Veena players: Pandit Joydeep Mukherjee, Poly Varghese.","s":""},{"n":162,"t":"Arts Personality","q":"In the year 1952, who among the following lent his voice for the film ‘Amar Bhupali’, which was being produced in two languages simultaneously and he sang in both Bengali and Marathi ?","o":["Kishore Kumar","Hemanta Mukherjee","Debabrata Biswas","Manna Dey"],"a":3,"e":"Manna Dey was a renowned Indian playback singer, music director, and musician. He had a classical music background, being part of the Bhendibazaar Gharana. He received Padma Shri in 1971, Padma Bhushan in 2005 and Dadasaheb Phalke award in 2007.","s":""},{"n":163,"t":"Arts Personality","q":"Consider the following statements:\n1. Ustad Zakir Hussain is a tabla player.\n2. He received the Padma Bhushan in 2010.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Ustad Zakir Hussain (Tabla player). His Awards : Padma Vibhushan (2023); Padma bhusan (2002); Padma Shri (1988); Sangeet Natak Akademi (1991).","s":""},{"n":164,"t":"Arts Personality","q":"Gangu Bai Hangal and Prabha Atre were exponents of the____ Gharana.","o":["Rampur","Jaipur","Kirana","Mewati"],"a":2,"e":"Kirana. Gangu Bai Hangal was an Indian singer of the khayal genre of Hindustani classical music from Karnataka. She received the Padma Shri in 1962, the Padma Bhushan in 1971, and the Padma Vibhushan in 2002.","s":""},{"n":165,"t":"Arts Personality","q":"Chittani Ramachandra Hegde was associated with which of the following dances?","o":["Chhau dance","Chappeli dance","Yakshagana dance","Huttari dance"],"a":2,"e":"Yakshagana dance. It is a traditional folk dance form popular in Coastal Karnataka districts. Chittani Ramachandra Hegde was awarded the Padma Shri award in 2012. Some exponents of Yakshagana : Kuriya Vithala Shastry, Soorikumeru Govinda Bhat, Narayana Hasyagar.","s":""},{"n":166,"t":"Arts Personality","q":"Consider the following statements about Pandit Hariprasad Chaurasia:\n1. He is an Indian flutist in the Hindustani classical tradition belonging to the Maihar gharana.\n2. He was awarded the Padma Vibhushan in the year 2000.\n3. He has also received the Padma Shri in 1992.\n4. Other prominent Indian flute players include Devendra Murdeshwar, Raghunath Seth, Nityanand Haldipur, Ronu Majumdar, Pt. Rajendra Prasanna, and Chetan Joshi.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 4 only","1, 2, and 3 only","2 and 4 only"],"a":1,"e":"2 and 4 only. He belongs to the Senia gharana, not Maihar gharana. He received the Padma Bhushan in 1992, not Padma Shri.","s":""},{"n":167,"t":"Arts Personality","q":"Which state government honoured Vani Jairam with the MS Subbulakshmi Award for 2019 ?","o":["Maharashtra","Karnataka","Odisha","Tamil Nadu"],"a":3,"e":"Tamil Nadu. Vani Jairam was an Indian playback singer, fondly referred to as the \"Meera of Modern India.\" She received the Padma Bhushan award in\n2023. M.S. Subbulakshmi Award is a tribute to the legendary Carnatic singer, M.S. Subbulakshmi. She was the first musician ever to be awarded the Bharat Ratna in 1998.","s":""},{"n":168,"t":"Arts Personality","q":"Ranjana Gauhar was awarded the Padma Shri Award (2003) for her contribution to which of the following Indian dance forms ?","o":["Kuchipudi","Sattriya","Odissi","Manipuri"],"a":2,"e":"Odissi. Ranjana Gauhar also received the Sangeet Natak Akademi Award in 2007. Other renowned Odissi dancers include Kelucharan Mohapatra, Mayadhar Raut, Sanjukta Panigrahi, Ratikant Mohapatra, Deba Prasad Das, Kumkum Mohanty, Pankaj Charan Das, and Aruna Mohanty.","s":""},{"n":169,"t":"Arts Personality","q":"Consider the following statements about Chintaman Raghunath Vyas:\n1. He was an Indian classical singer, renowned for his khyal style.\n2. He was awarded the Padma Shri in 1992 and the Sangeet Natak Akademi Award in 1987.\n3. He founded the Gunidas Sangeet Sammelan in 1977 in tribute to his guru Gunidas.\nWhich of the above statements is/are correct?","o":["1 and 2 only","1 and 3 only","2 and 3 only","All of the above"],"a":1,"e":"1 and 3 only. Statement 2: Incorrect – He was awarded the Padma Bhushan in 1992, not Padma Shri.","s":""},{"n":170,"t":"Arts Personality","q":"Sangeet Natak Akademy Awardee Sulochana Chavan was a famous ________ singer.","o":["Giddha","Jhumair","Ghumar","Lavani"],"a":3,"e":"Lavani. Sulochana Chavan : Her Awards - Padma Shri (in 2022), Lata Mangeshkar Award (in 2010), Sangeet Natak Akademi Award (in 2012). Other Lavani Singers : Bela Shende, Asha Bhosle, Usha Mangeshkar, Vaishali Samant.","s":""},{"n":171,"t":"Arts Personality","q":"Match the following Indian classical dancers with their respective dance forms:\n1. Yamini Reddy A. Kathak\n2. Kelucharan Mohapatra B. Odissi\n3. Rohini Bhate C. Kuchipudi\n4. Sharodi Saikia D. Sattriya","o":["1–C, 2–B, 3–A, 4–D","1–B, 2–A, 3–D, 4–C","1–D, 2–C, 3–B, 4–A","1–A, 2–B, 3–C, 4–D"],"a":0,"e":"1–C, 2–B, 3–A, 4–D.","s":""},{"n":172,"t":"Arts Personality","q":"Consider the following statements about Bhupen Hazarika:\n1. He was awarded the Padma Shri in 1992.\n2. He was awarded the Bharat Ratna in 2012.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. He received the Padma Shri in 1977, not 1992. He was awarded the Bharat Ratna in 2019, not 2012.","s":""},{"n":173,"t":"Arts Personality","q":"Who among the following is a Sarod player popularly known as 'Sarod Samrat' ?","o":["Pandit Kishan Maharaj","Pandit Ravi Shankar","Ustad Amjad Ali Khan Bangash","Pandit Shivkumar Sharma"],"a":2,"e":"Ustad Amjad Ali Khan Bangash: Awards - Padma Shri (1975), Padma Bhushan (1991), Padma Vibhushan (2001). Amjad Ali Khan, along with his sons played ‘Raga for Peace’ in the year 2014 at the ‘Nobel Peace Prize Concert’. Other Sarod Players: Allauddin Khan, Hafiz Ali Khan, Ali Akbar Khan, Radhika Mohan Maitra, Sharan Rani Backliwal, Zarin Sharma, Buddhadev Das Gupta, Rajeev Taranath, Aashish Khan, Tejendra Majumdar etc.","s":""},{"n":174,"t":"Arts Personality","q":"The Maharashtra Bhushan was conferred upon ________in the year 2002.","o":["Pandit Ravi Shankar","Pandit Bhimsen Joshi","Pandit Jasraj","Pandit Hari Prasad Chaurasia"],"a":1,"e":"Pandit Bhimsen Joshi. He belongs to the Kirana gharana tradition of Hindustani Classical Music. Awards -Bharat Ratna (2009), Padma Vibhushan (1999), Padma Bhushan (1985), Padma Shri (1972), Sangeet Natak Akademi Award for Hindustani vocal music (1975), Aditya Vikram Birla Kalashikhar Puraskar (2000).","s":""},{"n":175,"t":"Arts Personality","q":"The renowned ghazal singer Girija Devi was born in ________.","o":["Karnataka","Bihar","Uttar Pradesh","Punjab"],"a":2,"e":"Uttar Pradesh. Girija Devi was a Thumri singer of the Senia and Banaras gharanas. She was dubbed as the 'Queen of Thumri' for her contribution in the genre. Awards : Padma Shri (1972), Padma Bhushan (1989), Padma Vibhushan (2016), Sangeet Natak Akademi Award (1977), Sangeet Natak Akademi Fellowship (2010).","s":""},{"n":176,"t":"Arts Personality","q":"Pandit Omkar Nath Thakur was a student of ____________.","o":["Ustad Abdul Karim Khan","Pandit Vishnu Digambar Paluskar","Pandit Gopal Shankar Mishra","Pandit Vishnu Narayan Bhatkhande"],"a":1,"e":"Pandit Vishnu Digambar Paluskar. He was a Hindustani musician, known for singing the original version of the bhajan \"Raghupati Raghava Raja Ram\" and founded the Gandharva Mahavidyalaya in 1901. Pandit Omkarnath Thakur, a noted music teacher, musicologist, and Hindustani classical singer, was associated with the Gwalior Gharana, the oldest Khayal Gayaki style.","s":""},{"n":177,"t":"Arts Personality","q":"Who among the following classical dancers is NOT related to Odissi?","o":["Geetanjali Lal","Mayadhar Raut","Kiran Segal","Kumkum Mohanty"],"a":0,"e":"Geetanjali Lal. She is an Indian Kathak dancer and choreographer. Notable Odissi dancers include Kelucharan Mohapatra, Deba Prasad Das, Madhavi Mudgal, Sonal Mansingh, Pankaj Charan Das, Aruna Mohanty, and Ileana Citaristi.","s":""},{"n":178,"t":"Arts Personality","q":"Consider the following statements about Pandit Ravi Shankar:\n1. He was the founder of the National Orchestra of India and a world-renowned sitar player.\n2. He was awarded the Bharat Ratna in 1989.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. He received the Bharat Ratna in 1999, not 1989. Padma Vibhushan (1981), Padma Bhushan (1967) and Grammy Award (1968) for Best Chamber Music Performance for his work \"West Meets East\".","s":""},{"n":179,"t":"Arts Personality","q":"Who among the following was the youngest recipient of the Sangeetha Kalanidhi awarded by the Music Academy in 1947?","o":["Semmangudi Radhakrishna Srinivasa Iyer","Ariyakudi Ramanuja Iyengar","Mallikarjun Bheemarayappa Mansur","Bhimsen Joshi"],"a":0,"e":"Semmangudi Radhakrishna Srinivasa Iyer (Vocalist) : Awards -National Eminence Award (2002), Kalidas Samman (1980). Ariyakudi Ramanuja Iyengar : Awards - Sangeetha Kalanidhi award (1938), Padma Bhushan (1958).","s":""},{"n":180,"t":"Arts Personality","q":"Ali Akbar Khan was associated with which of the following gharanas?","o":["Maihar gharana","Agra gharana","Gwalior gharana","Kirana gharana"],"a":0,"e":"Maihar gharana. Ali Akbar Khan (Sarod) : Awards - Padma Bhushan (1967), Padma Vibhushan (1989). Exponents of Maihar gharana : Allauddin Khan, Pandit Nikhil Ranjan Banerjee, Nityanand Haldipur. Agra gharana : Founders - Haji Sujan Khan; Ustad Gagghe Khuda Bakhsh. Gwalior Gharana : Founders - Ustad Hassu Khan, Ustad Haddu Khan and Ustad Nathu Khan. Kirana Gharana : Founders - Abdul Karim Khan and Abdul Wahid Khan.","s":""},{"n":181,"t":"Arts Personality","q":"Consider the following statements about Pandit Shivkumar Sharma:\n1. He received the Sangeet Natak Akademi Award in 1986 for his excellence in the performing arts.\n2. The santoor, which he popularized, is a string instrument made of teak wood.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The santoor is made of walnut wood, not teak wood.","s":""},{"n":182,"t":"Arts Personality","q":"Classical Sarod player Amjad Ali Khan was awarded ________ in 2001 by the Government of India.","o":["Bharat Ratna","Padma Shri","Padma Vibhushan","Padma Bhushan"],"a":2,"e":"Padma Vibhushan. Ustad Amjad Ali Khan (Sarod Samrat): He is an Indian classical sarod player, best known for his clear and fast ekhara taans. He was born in Gwalior. Awards: Padma Shri (1975), Padma Bhushan (1991), Sangeet Natak Akademi Award (1989), Sangeet Natak Akademi Fellowship (2011).","s":""},{"n":183,"t":"Arts Personality","q":"Some of the talas invented by ________ include Trimukhi, Panchamukhi, Saptamukhi and Navamukhi.","o":["M Balamuralikrishna","Hariprasad Chaurasia","Yashraj","Bhimsen Joshi"],"a":0,"e":"M Balamuralikrishna was a renowned Indian vocalist, composer, and innovator in Carnatic music. His Awards: Padma Shri (1971), Padma Vibhushan (1991), Sangeet Natak Akademi Award (1975), Mahatma Gandhi Silver Medal from UNESCO (1995).","s":""},{"n":184,"t":"Arts Personality","q":"Consider the following statements about Kelucharan Mohapatra:\n1. He was the first dancer from Odisha to be awarded the Padma Vibhushan in 2000.\n2. He received the Padma Bhushan in 1984.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. He was awarded the Padma Bhushan in 1988, not 1984. Awards - Sangeet Natak Akademi Award (1966), Padma Shri (1974), Sangeet Natak Akademi Fellowship (1991), Padma Vibhushan (2000).","s":""},{"n":185,"t":"Arts Personality","q":"Harmonium player, Tulsidas Borkar, was awarded with the __ in 2016.","o":["Padma Shri","Padma Bhushan","Bharat Ratna","Padma Vibhushan"],"a":0,"e":"Padma Shri. Tulsidas Borkar received the Sangeet Natak Akademi Award in 2005. Other prominent harmonium players include Appa Jalgaonkar, Ustad Rafiuddin Ahmed, Ustad Nizamuddin, Shankar Mahadevan, and Bhishmadev Bedi.","s":""},{"n":186,"t":"Arts Personality","q":"Which of the following Rajiv Gandhi National Sadbhavana Awards was conferred on Ustad Amjad Ali Khan?","o":["20 th","19 th","21 st","18 th"],"a":2,"e":"21st. This award is presented every year to those who have devoted their life in understanding and promoting social harmony. It constitutes a citation and cash Prize of Rs. 10 Lakh.","s":""},{"n":187,"t":"Arts Personality","q":"Consider the following statements about Ishwari Prasad and Kathak Gharanas:\n1. Ishwari Prasad is credited with introducing the Lucknow Gharana of Kathak.\n2. The Jaipur Gharana of Kathak was founded by Raja Chakradhar Singh.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Kathak Gharana and Founder: Jaipur Gharana - Bhanuji; Benaras Gharana - Janaki Prasad; Raigarh Gharana - Raja Chakradhar Singh.","s":""},{"n":188,"t":"Arts Personality","q":"Which famous santoor player was honoured with the Ustad Hafiz Ali Khan Award in 1998?","o":["Tarun Bhattacharya","Shivkumar Sharma","Satish Vyas","Abhay Sopori"],"a":1,"e":"Shivkumar Sharma was an Indian classical musician and santoor player. His Other Awards: Padma Vibhushan (2001), Padma Shri (1991).","s":""},{"n":189,"t":"Arts Personality","q":"Which of the following playback singers is the recipient of the Karnataka Ratna Award 2005?","o":["Sistla Janaki","Ravindra Jain","Pandit Jasraj","Bhimsen Joshi"],"a":3,"e":"Bhimsen Joshi. He belongs to the Kirana gharana tradition of Hindustani Classical Music. Awards -Bharat Ratna (2008), Padma Bhushan (1985), Padma Vibhushan (1999).","s":""},{"n":190,"t":"Arts Personality","q":"Consider the following statements about Arjun Singh Dhurve:\n1. He was conferred the Tulsi Samman in 1993–94 for the Baiga dance form of Madhya Pradesh.\n2. He was awarded the Padma Shri in 2012.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. He was awarded the Padma Shri in 2022, not 2012.","s":""},{"n":191,"t":"Arts Personality","q":"Which playback singer was honoured with the Nightingale of Asia Award in 1987?","o":["Pulapaka Susheela","Asha Bhosle","Mubarak Begum","Kavita Krishnamurthy"],"a":1,"e":"Asha Bhosle. Her latest Awards :Yash Chopra Memorial Award (2018), Lata Dinanath Mangeshkar Award (2023), Banga Bibhushan Award (Highest West Bengal Civilian Award) (2018). Maharashtra Bhushan Award (2021).","s":""},{"n":192,"t":"Arts Personality","q":"_______ was an Indian dancer and choreographer best known for creating a fusion style of dance adapting European theatrical techniques to Indian classical and folk - dance forms.","o":["Smita Nagdev","Ravi Shankar","Shovana Narayan","Uday Shankar"],"a":3,"e":"Uday Shankar. He is known as the Father of Modern Dance in India. Awards - Padma Vibhushan (1971), Sangeet Natak Akademi Fellowship (1962).","s":""},{"n":193,"t":"Arts Personality","q":"Match the following musicians with their respective musical lineages (Gharanas): 1.Chhannulal Mishra A. Kirana Gharana\n2. Abdul Karim Khan B. Founder of Kirana Gharana\n3. Agra Gharana C. Khayal gayaki + Dhrupad-Dhamar style","o":["1–A, 2–B, 3–C","1–B, 2–A, 3–C","1–C, 2–B, 3–A","1–A, 2–C, 3–B"],"a":0,"e":"1–A, 2–B, 3–C.","s":""},{"n":194,"t":"Arts Personality","q":"Consider the following statements about Sanjukta Panigrahi:\n1. She was a legendary Kuchipudi dancer who received the Padma Shri in 1985.\n2. She was awarded the Sangeet Natak Akademi Award in 1980.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. She was an Odissi dancer and received the Padma Shri in 1975, not 1985. She received the Sangeet Natak Akademi Award in 1976, not 1980.","s":""},{"n":195,"t":"Arts Personality","q":"Match the following Bharatanatyam dancers with their awards:\n1. Chitra A. Padma Shri (1992) Visweswaran\n2. Rukmini Devi B. Padma Bhushan Arundale (1956)\n3. Padma C. Padma Bhushan Subrahmanyam (2003)\n4. Yamini D. Padma Vibhushan Krishnamurthy (2016)","o":["1–C, 2–B, 3–A, 4–D","1–B, 2–A, 3–C, 4–D","1–A, 2–B, 3–C, 4–D","1–C, 2–A, 3–B, 4–D"],"a":2,"e":"1–A, 2–B, 3–C, 4–D","s":""},{"n":196,"t":"Arts Personality","q":"Who among the following Indian musicians is known for his contribution to the field of Hindustani music for the classification of Ragas into ten Thatas?","o":["Pandit Vishnu Narayan Bhatkhande","Abdul Karim Khan","Pandit Vishnu Digambar Paluskar","Allauddin Khan"],"a":0,"e":"Pandit Vishnu Narayan Bhatkhande. He was a prominent musician who wrote the first modern treatise on Hindustani classical music. In 1916, he reorganized the Baroda state music school. He set up Marris College of Music in Lucknow in 1926, which is now known as Bhatkhande Music Institute. He published books Swar Malika and Shri Mallakshaya Sangeetam (pen name Chatur Pandit).","s":""},{"n":197,"t":"Arts Personality","q":"Thiyam Suryamukhi Devi who received the Sangeet Natak Akademi Awards 2003, is known for her contribution to the:","o":["Manipuri dance","Odissi dance","Gotipua dance","Kathak dance"],"a":0,"e":"Manipuri dance. Thiyam Suryamukhi Devi - She created her own solo composition such as Basanta Barnar Sakhi Ukti. Other Manipuri Exponents : Guru Bipin Singh, Maisnam Amubi Singh, Rajkumar Singhajit Singh, Sougaijam Thanil Singh, Thingbaijam Babu Singh, Darshana Jhaveri, etc.","s":""},{"n":198,"t":"Arts Personality","q":"Consider the following statements about Birju Maharaj:\n1. He belongs to the Kalka–Bindadin Gharana of Kathak.\n2. He received the Padma Bhushan in 1986.\n3. He founded an institution named Natya Kala Mandir for training in dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","1 and 2 only","1 and 3 only"],"a":0,"e":"1 only. He received the Padma Vibhushan in 1986. He founded Kalashram.","s":""},{"n":199,"t":"Arts Personality","q":"Who among the following is a Padma Shri Awardee for her contribution to Manipuri Dance?","o":["Aditi Rao Hydari","Darshana Jhaveri","Mrinalini Sarabhai","Shovana Narayan"],"a":1,"e":"Darshana Jhaveri , the youngest of the four Jhaveri sisters, is a disciple of Guru Bipin Singh. Awards -Sangeet Natak Akademi Award (1996), Padma Shri (2002), Kalidas Samman Award (2018).","s":""},{"n":200,"t":"Arts Personality","q":"Who among the following is a distinguished and experienced scion of the famous Kavungal family associated with 'Kathakali' for six generations?","o":["Padma Subramanyam","Ammannur Madhava Chakyar","Chathunni Panicker","Meenakshi Sundaram Pillai"],"a":2,"e":"Chathunni Panicker: Awards - Padma Shri (2006), Sangeet Natak Akademi Award (1973). Other exponents of Kathakali - Kanak Rele, Kottakkal Sivaraman, Guru Kunchu Kurup.","s":""},{"n":201,"t":"Arts Personality","q":"Siyaram Tewari belongs to which of the following music Gharanas ?","o":["Dagari","Kirana","Darbhanga","Bettiah"],"a":2,"e":"Darbhanga. Siyaram Tiwari was an esteemed Indian classical singer and a prominent exponent of the Dhrupad genre in Hindustani classical music. Award : Padma Shri (1971). Notable singers from this gharana include Ram Chatur Mallick, Pandit Vidur Mallick, Padmashri Pandit Ram Kumar Mallick, and Pt. Prem Kumar Mallik.","s":""},{"n":202,"t":"Arts Personality","q":"Who among the following is NOT an Odissi dancer ?","o":["Anita Ratnam","Kumkum Mohanty","Sonal Mansingh","Protima Bedi"],"a":0,"e":"Anita Ratnam , a classically trained Bharatanatyam dancer, has also received formal training in Kathakali, Mohiniattam, tai chi, and Kalarippayattu. She combined these diverse influences to create her unique dance style, which she calls \"Neo Bharatam.\"","s":""},{"n":203,"t":"Arts Personality","q":"Consider the following statements about Pandit Acchan Maharaj:\n1. He was a Kathak legend of the Lucknow Gharana.\n2. He was the father of Pandit Birju Maharaj.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Exponents of Lucknow Gharana - Pandit Birju Maharaj, Shambhu Maharaj, Lachhu Maharaj (Pandit Bajinath Prasad), Pandit Ishwari Prasad, Kalika Prasad, Manjari Chaturvedi.","s":""},{"n":204,"t":"Arts Personality","q":"Sitara Devi, a doyen of _________ Dance, was hailed as the Queen of Kathak by Rabindranath Tagore.","o":["Odissi","Sattriya","Kathak","Manipuri"],"a":2,"e":"Kathak. Sitara Devi (Dhanalakshmi): She was an Indian dancer of the classical Kathak style of dancing, a singer, and an actress. She was born at Cuttack, Odisha. Rabindranath Tagore described her as Nritya Samragni meaning the empress of dance. Awards - Sangeet Natak Akademi Award (1969), the Padma Shri (1973).","s":""},{"n":205,"t":"Arts Personality","q":"Consider the following statements about Mallika Sarabhai:\n1. She is a famous Kuchipudi dancer and recipient of the Sangeet Natak Akademi Award (2000).\n2. She was awarded the Padma Shri in 2010.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. She received the Padma Bhushan in 2010, not Padma Shri.","s":""},{"n":206,"t":"Arts Personality","q":"Who among the following belongs to Patiala Gharana?","o":["Ali Baksh Khan","Nathu Khan","Abdul Wahid Khan","Chhaju Khan"],"a":0,"e":"Ali Baksh Khan : He was an Indian classical singer. Although the Patiala gharana was originally founded by Mian Kallu, Ali Baksh Khan and Fateh Ali Khan were instrumental in its development and prominence. Other exponents of Patiala Gharana : Bade Ghulam Ali Khan, Munawar Ali Khan, Raza Ali Khan, Ajoy Chakraborty, Dilshad Khan, Parveen Sultana, Begum Akhtar, Naina Devi, Nirmala Devi and Lakshmi Shankar.","s":""},{"n":207,"t":"Arts Personality","q":"Shovana Narayan has been honoured with the Padma Shri for her contribution to which Indian dance form?","o":["Odissi","Kathak","Kathakali","Kuchipudi"],"a":1,"e":"Kathak. Shovana Narayan received the Padma Shri in 1992 and sangeet natak akademi award in 1999.","s":""},{"n":208,"t":"Arts Personality","q":"Consider the following statements about Abdul Karim Khan:\n1. He was the pioneer and founder of the Kirana Gharana of Hindustani music.\n2. He founded the Arya Sangeet Vidyalaya in Poona in 1913.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. He introduced Hindustani Khayal singing and Indian classical music in Kirana gharana. Due to frequent visits to Mysore Palace, he was conferred the title Sangeet Ratna.","s":""},{"n":209,"t":"Arts Personality","q":"Indian musician, composer and singer Shubha Mudgal was awarded with the _______ in 2000.","o":["Padma Shri","Padma Bhushan","Padma Vibhushan","Sangeet Natak Akademi"],"a":0,"e":"Padma Shri. Shubha Mudgal is known for her works in Hindustani classical music. Awards : Rajiv Gandhi National Sadbhavana Award (2016), Best Non-Feature Film Music Direction (1995) for Amrit Beej.","s":""},{"n":210,"t":"Arts Personality","q":"Sangeet Majumdar was felicitated by Casa De La, Spain for her contribution to which of the following Indian Classical Dances?","o":["Mohiniyattam","Kathak","Bharatanatyam","Kuchipudi"],"a":1,"e":"Kathak. Famous dancers : Kathak (Uttar Pradesh) - Birju Maharaj, Gopi Krishna, Sitara Devi, Uma Sharma, Deepa Kartha. Mohiniyattam (Kerala) -Jayaprabha Menon, Samitha Rajan, Pallavi Krishnan.","s":""},{"n":211,"t":"Arts Personality","q":"Consider the following statements about Yamini Krishnamurthy:\n1. She was bestowed with the title of Asthana Narthaki (Resident Dancer) by the Tirumala Tirupati Devasthanam temple.\n2. She was an exponent of both Bharatanatyam and Kuchipudi dance forms.\n3. She received the Padma Bhushan in 2001.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. She received the Padma Bhushan in 2016, not 2001 (Padma Vibhushan in 2001).","s":""},{"n":212,"t":"Arts Personality","q":"Who among the following personalities was awarded the Sangeet Natak Akademi Award (for her contribution to Manipuri Dance)?","o":["Urmila Nagar","Kalavati Devi","Mallika Sarabhai","Nirmala Ramachandran"],"a":1,"e":"Kalavati Devi. She received the Sangeet Natak Akademi Award in\n2003. Other Manipuri dancers: Nirmala Mehta, Guru Bipin Singh, Charu Mathur, Savita Mehta, Bimbavati Devi. Other Sangeet Natak Akademi Awardee and year : Urmila Nagar (Kathak) - 2003, Mallika Sarabhai (Bharatanatyam and Kuchipudi) - 1999-2000. Nirmala Ramachandran (Bharatnattayam) - 2004.","s":""},{"n":213,"t":"Arts Personality","q":"Consider the following statements about Ustad Bismillah Khan and Lata Mangeshkar:\n1. Ustad Bismillah Khan was a Hindustani classical shehnai player who received the Bharat Ratna in 2001.\n2. Lata Mangeshkar was awarded the Padma Vibhushan in 1999.\n3. The “Ustad Bismillah Khan Yuva Puraskar” was instituted by the Sangeet Natak Akademi in 2001.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. The Ustad Bismillah Khan Yuva Puraskar was instituted in 2006, not 2001.","s":""},{"n":214,"t":"Arts Personality","q":"Begum Akhtar a famous singer from India is known for which of the following genres?","o":["Ghazal music","Sufi music","Folk music","Carnatic music"],"a":0,"e":"Ghazal music. Awards of Begum Akhtar (Mallika-e-Ghazal): Sangeet Natak Akademi Award (1972), Padma Bhushan (1975), Padma Shri (1968). Famous Indian ghazal singers: Jagjit Singh, Hariharan, Bhupinder Singh. Sufi singers - Ali Azmat, Ali Baba Khan. Carnatic singers - Charulatha Chandrasekhar, Soorya Narayanan, Vishwas Hari.","s":""},{"n":215,"t":"Arts Personality","q":"Natya Sangeet is a form of musical play in classical music still prevalent in Maharashtra. Bal Gandharava is an exponent of this musical form. What is actual name of Balgandharva?","o":["Vishnu Narayan Bhatkhande","Narayan Shripad Rajhans","Mallikarjun Mansur","Vishnu Digambar Paluskar"],"a":1,"e":"Narayan Shripad Rajhans. He was a renowned Marathi singer and stage actor, famous for portraying female characters in Marathi plays at a time when women were not permitted to act on stage. Natya Sangeet is a form of drama that combines prose and poetry through songs to convey the story, akin to musicals. The term \"Dramatic Music\" refers to Natya Sangeet, one of the two popular forms of vocal arts in Maharashtra and neighboring states, the other being Bhavageet.","s":""},{"n":216,"t":"Arts Personality","q":"Consider the following statements about the Jaipur–Atrauli Gharana:\n1. Jaipur–Atrauli Gharana was founded by Alladiya Khan.\n2. It is renowned for its unique style of khayal singing, distinctive vocal aesthetics, and rich raga repertoire.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Gharana of Hindustani classical music and its Founders : Gwalior Gharana (Nanthan Khan), Agra Gharana (Hajisujan Khan), Rangeela Gharana (Faiyyaz Khan), Kirana Gharana (Abdul Wahid Khan).","s":""},{"n":217,"t":"Arts Personality","q":"Ricky Kej, a globally acclaimed musician from India, won the 57th Grammy Award for which of the following albums ?","o":["Winds of Samsara","Mystic Mountains","Mountain Dreams","Divine Tides"],"a":0,"e":"Winds of Samsara. It reflects the concept of rebirth and the cyclicality of life, a key belief in Indian religions. Ricky Kej won his third Grammy in 2023 for \"Divine Tides\" in the Best Immersive Audio Album category. He won his second Grammy Award for \"Ballad of Maya\" in 2019.","s":""},{"n":218,"t":"Arts Personality","q":"Consider the following statements about M.S. Subbulakshmi:\n1. She was the first musician to be awarded the Bharat Ratna in 1999.\n2. She was an acclaimed Carnatic singer from Madurai, Tamil Nadu, and received the Padma Vibhushan in 1975.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. She was an acclaimed Indian Carnatic singer hailing from Madurai, Tamil Nadu. Her notable awards include the Bharat Ratna (1998), Padma Vibhushan (1975), Padma Bhushan (1954), Ramon Magsaysay Award (1974), and Kalidas Samman (1988).","s":""},{"n":219,"t":"Arts Personality","q":"Who among the following was awarded the Pandit Bhimsen Joshi Lifetime Achievement Award, 2014 ?","o":["Pandit Ravi Shankar","Saraswati Abdul Rane","Pandit Kumar Gandharv","Prabha Atre"],"a":3,"e":"Prabha Atre (vocalist). Her Awards : Padma Shri (1990), Padma Bhushan (2002), Padma Vibhushan (2022), Sangeet Natak Akademi Award (1991) for her contribution to Hindustani vocal music.","s":""},{"n":220,"t":"Arts Personality","q":"Consider the following statements about Radhe Shyam Barle:\n1. He is a Panthi folk dancer from the Satnami community of Chhattisgarh who received the Padma Shri in 2021.\n2. Panthi folk dance is associated with the state of Bihar.\n3. The songs of Panthi dance convey the teachings of saints like Kabir, Ravidas, and Dadu.\nWhich of the above statements is/are correct?","o":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 3 only. Panthi folk dance belongs to Chhattisgarh, not Bihar.","s":""},{"n":221,"t":"Arts Personality","q":"Akham Lakshmi Devi was honoured with Sangeet Natak Akademi Award for the year 2018 for her contribution to ______dance.","o":["Sattriya","Mohiniyattam","Manipuri","Odissi"],"a":2,"e":"Manipuri. Akham Lakshmi Devi received the Manipur State Kala Akademi Award in 2010 and the Nritya Bhusan in 2014.","s":""},{"n":222,"t":"Arts Personality","q":"Rani Karnaa was awarded the Sangeet Natak Akademi (1996) for her contribution to_____.","o":["Odissi","Kathak","Kathakali","Kuchipudi"],"a":1,"e":"Kathak. Rani Karnaa also received the Padma Shri Award in 2014. She was trained by Pandit Narayan Prasad and Sunder Prasad of the Jaipur gharana and Pandit Shambhu Maharaj and Birju Maharaj of Lucknow gharanas.","s":""},{"n":223,"t":"Arts Personality","q":"Who was one of the 20 th century's foremost exponents of the Bharatanatyam style of classical dance?","o":["Nirmala Mehta","T Balasaraswati","Bijayini Satpathy","Kumudini Lakhia"],"a":1,"e":"T Balasaraswati. Awards : Sangeet Natak Academy Award (1955), Padma Vibhushan (1977), Sangita Kalanidhi (1973).","s":""},{"n":224,"t":"Arts Personality","q":"Consider the following statements about Pandit Ravi Shankar:\n1. He collaborated with the famous English rock band “The Beatles” and popularised the sitar globally.\n2. He received the Bharat Ratna in 1989.\n3. He was the founder of the Lucknow Gharana of Kathak.\nWhich of the above statements is/are correct?","o":["1 only","1 and 2 only","2 and 3 only","1 and 3 only"],"a":0,"e":"1 only. He received the Bharat Ratna in 1999, not 1989. He received the Padma Bhushan in 2002, not in 2010.","s":""},{"n":225,"t":"Arts Personality","q":"‘The Unforgettables’ was the collection of semi-classical music of which Ghazal singer?","o":["Mehdi Hassan","Jagjit Singh","Mallika Pukhraj","Talat Mahmood"],"a":1,"e":"Jagjit singh: Popularly known as the ‘King of Ghazal’. Ghazal is one of the styles of singing in Hindustani music. Tradition of singing ghazals was established by Hazrat Amir Khusrau.","s":""},{"n":226,"t":"Arts Personality","q":"Consider the following statements about Dr. Teejan Bai:\n1. She is globally recognised for her contribution to Pandavani, a traditional performing art form of Chhattisgarh.\n2. She was awarded the Padma Vibhushan in 2015.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. She received Padma Vibhushan in 2019. Padma Bhushan (2003), Padma Shri (1988), and M. S. Subbulakshmi Centenary Award (2016).","s":""},{"n":227,"t":"Arts Personality","q":"Who among the following founded the Kalakshetra Foundation in Chennai that is an important center for the study and performance of fine arts?","o":["Alarmel Valli","Mrinalini Sarabhai","Yamini Krishnamurthy","Rukmini Devi Arundale"],"a":3,"e":"Rukmini Devi Arundale founded the Kalakshetra Foundation in Chennai in 1936. The foundation was declared as an institution of national importance by an Act of Parliament in\n1993. It is an important centre for the study and performance of fine arts, especially Bharatanatyam dance and Carnatic music.","s":""},{"n":228,"t":"Arts Personality","q":"In 2015, the eminent danseuse and ____________ exponent, Padma Subrahmanyam was selected for Kerala's prestigious choreography award 'Nishagandhi Puraskaram' instituted by the state tourism department.","o":["Kuchipudi","Bharatanatyam","Sattriya","Kathakali"],"a":1,"e":"Bharatanatyam. Her Awards: Padma Vibhushan (2024), Padma Bhushan (2003), Padma Shri (1981), Sangeet Natak Akademi Award (1983).","s":""},{"n":229,"t":"Arts Personality","q":"Gopika Varma has won the Sangeet Natak Akademi Award in 2019 in which of the following dance forms ?","o":["Bharatanatyam","Mohiniyattam","Kathak","Kuchipudi"],"a":1,"e":"Mohiniyattam - Gopika Varma was the first Mohiniyattam dancer to receive the ‘Kalaimamani’.","s":""},{"n":230,"t":"Arts Personality","q":"Haripriya Namboodiri is an exponent of which Indian classical dance form ?","o":["Kuchipudi","Odissi","Bharatanatyam","Kathakali"],"a":3,"e":"Kathakali. She was winner of Stree Ratnam and Devdasi National Award. Other Dancers: Kavungal Chathunni Panicker, Kalamandalam Gopi, Kottakkal Sivaraman, Kalanilayam Balakrishnan, Kottakal Sivaraman, Rita Ganguly.","s":""},{"n":231,"t":"Arts Personality","q":"The Wadali Brothers are__singers.","o":["Bhatiali","Lavani","Sufi","Pandavani"],"a":2,"e":"Sufi. Wadali Brothers: Puranchand Wadali and Pyarelal Wadali. They are famous for various styles of singing including Kaafian, ghazal and bhajan. Awards: Sangeet Natak Akademi Award (1991), Padma shri (2005).","s":""},{"n":232,"t":"Arts Personality","q":"Consider the following statements about Guru Bipin Singh:\n1. He founded the Govindji Nartanalaya dance school for women in Imphal\n2. He is popularly known as the Father of Kathak Dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. He is known as the Father of Manipuri Dance. Manipuri dancers - Darshana Jhaveri, Guru Amubi, Rajkumar Singhajit Singh, Yumlembam Gambhini Devi, Nirmala Mehta, Charu Mathur.","s":""},{"n":233,"t":"Arts Personality","q":"Ammanur Madhava Chakkiar was awarded the Padma Shri for his contribution to which of the following dance forms ?","o":["Kutiyattam","Yakshagana","Kuchipudi","Kathakali"],"a":0,"e":"Kutiyattam (Kerala) - Its stylized and codified theatrical language, neta abhinaya (eye expression) and hasta abhinaya (the language of gestures) are prominent. Ammanur Madhava Chakkiar: Award - Sangeet Natak Akademi Award (1979), Padma Shri (1982), Padam Bhushan (2003) etc.","s":""},{"n":234,"t":"Arts Personality","q":"Consider the following statements about Aluna Kabuini:\n1. She is associated with the Manipuri dance form and is known as a Ras exponent.\n2. She received the Manipur State Kala Academy Award in 2001 for her contribution to Tribal Kabui dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":235,"t":"Arts Personality","q":"Consider the following statements about Pandit Jasraj:\n1. He belonged to the Patiala Gharana of Hindustani classical music.\n2. He was awarded the Padma Vibhushan in 2015.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. He belonged to the Mewati Gharana. He received the Padma Vibhushan in 2000.","s":""},{"n":236,"t":"Arts Personality","q":"Who among the following was the director of Kathak Kendra and also opened his own dance school named ‘Kalashram'?","o":["Pandit Lachhu Maharaj","Pandit Shambhu Maharaj","Pandit Birju Maharaj","Pandit Acchan Maharaj"],"a":2,"e":"Pandit Birju Maharaj. He belongs to the Kalka-Bindadin Gharana of Lucknow. Awards : Padma Vibhushan (1986), Sangeet Natak Akademi Award (1964), Kalidas Samman (1987). National Institute of Kathak Dance (also Kathak Kendra) - Founded in 1964. Headquartered at New Delhi.","s":""},{"n":237,"t":"Arts Personality","q":"Consider the following statements about Pandit Shambhu Maharaj:\n1. He was a renowned guru of the Jaipur Gharana of Kathak.\n2. He was awarded the Padma Shri in 1968.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. He belonged to the Lucknow Gharana. He received the Padma Shri in 1958. Famous Dancers from Lucknow Gharana: Birju Maharaj, Maharaj Bindadin, Kalika Prashad. Jaipur Gharana: Sunder Prasad, Durga Lal. Banaras Gharana: Rudra Shankar Mishra, Sneha Bajaj, Kamalini Asthana and Nalini Asthana.","s":""},{"n":238,"t":"Arts Personality","q":"Consider the following statements about R.D. Burman:\n1. He was popularly known as The Mozart of Madras.\n2. He was an Indian classical sitar player.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. He was popularly known as Panchamda. He was a music director, composer, and singer.","s":""},{"n":239,"t":"Arts Personality","q":"Which Indian musical legend is credited with composing Talas such as Trimukhi, Panchamukhi, Saptamukhi and Navamukhi ?","o":["M Balamuralikrishna","Bade Ghulam Ali Khan","KJ Yesudas","Pandit Jasraj"],"a":0,"e":"M Balamuralikrishna was an Indian Carnatic vocalist. His Awards: Sangeet Natak Akademi Award (1975), Padma Vibhushan (1991), Padma Shri (1971), Mahatma Gandhi Silver Medal (1995) - UNESCO. Famous Carnatic vocalist: Dandapani Desikar, T. Brinda, B.S. Raja Iyengar, Maharajapuram Vishwanatha Iyer, Semmangudi R. Srinivasa Iyer.","s":""},{"n":240,"t":"Arts Personality","q":"Pandit Janki Prasad was associated with which of the following Gharanas of Kathak?","o":["Banaras","Raigarh","Jaipur","Lucknow"],"a":0,"e":"Banaras. Gharanas of Kathak: Lucknow Gharana (Founded by Ishwari Prasad) - Wajid Ali Shah, Lachhu Maharaj, Shambhu Maharaj. Jaipur Gharana (founded by Bhanu Ji Maharaj) -Sunder Prasad, Puru Dadheech, Mangala Bhatt. Banaras Gharana (Founded by Janakiprasad) - Sitara Devi, Jitendra Maharaj, Kamalini Asthana and Nalini Asthana. Raigarh Gharana (Founder -Raja Chakradhar Singh): Exponents -Kartik Ram, Pt. Kalyan Das Mahant, Shree Firtu Maharaj and Pt. Barman Lal.","s":""},{"n":241,"t":"Arts Personality","q":"Consider the following statements about Amjad Ali Khan:\n1. He is a renowned sarod player in whose honour the state of Massachusetts (USA) declared April 20th, 1984 as a day in his name.\n2. He has been awarded the Padma Shri (1975), Padma Bhushan (1991), and Padma Vibhushan (2001).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":242,"t":"Arts Personality","q":"Which of the following playback singers of India received the Padma Shri in 2009 and Padma Bhushan in 2016 ?","o":["Sonu Nigam","Abhijit Bhattacharya","Kumar Sanu Bhattacharjee","Udit Narayan Jha"],"a":3,"e":"Udit Narayan Jha. Other Playback Singers and their Awards: Sonu Nigam (Padma Shri, 2022). Kumar Sanu Bhattacharjee: Padma Shri (2009).","s":""},{"n":243,"t":"Arts Personality","q":"Consider the following statements about Gulabo Sapera:\n1. She is known as the Queen of Kalbelia dance and received the Padma Shri in 2016.\n2. Kalbelia dance was included in UNESCO’s List of Intangible Cultural Heritage in 2015.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Kalbelia dance was added to UNESCO’s list in 2010.","s":""},{"n":244,"t":"Arts Personality","q":"Who among the following is the Indian classical dancer who masters both Bharatanatyam and Odissi dancing style?","o":["Shovana Narayan","Guru Bipin Singh","Padma Subrahmanayam","Sonal Mansingh"],"a":3,"e":"Sonal Mansingh received Padma Bhushan (1992), Padma Vibhushan (2003).","s":""},{"n":245,"t":"Arts Personality","q":"Deba Prasad Das, Pankaj Charan Das and Gangadhar Pradhan are associated with which of the following dance forms ?","o":["Odissi","Bharatanatyam","Manipuri","Kathak"],"a":0,"e":"Odissi - Classical dance forms of Odisha. Its dance theoretical base traces back to ‘Natya Shastra’ of Bharatamuni.","s":""},{"n":246,"t":"Arts Personality","q":"Bhanu Ji is associated with which of the following Gharanas of Kathak?","o":["Lucknow","Raigarh","Banaras","Jaipur"],"a":3,"e":"Jaipur Gharana of Kathak was conceived by Bhanu Ji Maharaj. Exponents of Jaipur gharana: Chunnilal Prasad, Kundan Lal Gangani, Sunder Prasad, Mangala Bhat.","s":""},{"n":247,"t":"Arts Personality","q":"Consider the following statements about Rukmini Devi Arundale:\n1. She was the first female classical dancer in Indian history to be nominated as a Member of the Rajya Sabha.\n2. She founded the Kalakshetra Foundation in Madras.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. She was awarded with Padma Bhushan in 1956, Kalidas Samman (1984), Sangeet Natak Akademi Award (1957) and Prani Mitra Award in 1968.","s":""},{"n":248,"t":"Arts Personality","q":"Which of the following music directors is known as 'Mozart of Madras'?","o":["AR Rahman","Madan Mohan","RD Burman","Himesh Reshammiya"],"a":0,"e":"AR Rahman was born in 1967 in Madras (Tamil Nadu). His Awards: Padma Bhushan (2010), Padma Shri (2000); Two Oscar Awards (2009), BAFTA Awards (2009), Golden Globe (2009) and Two Grammy Awards (2010).","s":""},{"n":249,"t":"Arts Personality","q":"The four Nattuvanars namely Ponaiyah, Vadivelu, Sivanandam and Chinnaiya, who are renowned as Tanjaore Bandhu shaped up the modern day _________.","o":["Bharatanatyam","Kuchipudi","Kodiattam","Kathakali"],"a":0,"e":"Bharatanatyam. The term ‘Nattuvanar’ means dance teacher.","s":""},{"n":250,"t":"Arts Personality","q":"The efforts of Malayalam poet Vallathol Narayana Menon and dancer and guru Kalyanikutty Amma brought back and gave a new life to the dance form ________ .","o":["Bharatanatyam","Kuchipudi","Mohiniyattam","Kathakali"],"a":2,"e":"Mohiniyattam . Dance and their Exponents : Mohiniyattam (Kerala) -Sunanda Nair, Jayaprabha Menon, Pallavi Krishnan. Bharatanatyam (Tamil Nadu) -Mrinalini Sarabhai, Rukmini Devi Arundale, Padma Subrahmanyam, Yamini Krishnamurthy.","s":""},{"n":251,"t":"Arts Personality","q":"Consider the following statements about the song \"Aye Mere Watan Ke Logon\" and C. Ramchandra:\n1. The music director of \"Aye Mere Watan Ke Logon\" was C. Ramchandra.\n2. The song was sung by Mohammed Rafi.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. It was sung by Lata Mangeshkar.","s":""},{"n":252,"t":"Arts Personality","q":"Match the following musical genres with their famous singers: 1.Talat Aziz A. Hindustani Classical 2.M. S. Subbulakshmi B. Carnatic Classical 3.Tansen C. Folk 4.Sharda Sinha D. Ghazal","o":["1–D, 2–B, 3–A, 4–C","1–B, 2–D, 3–C, 4–A","1–A, 2–C, 3–B, 4–D","1–D, 2–C, 3–B, 4–A"],"a":0,"e":"1–D, 2–B, 3–A, 4–C","s":""},{"n":253,"t":"Arts Personality","q":"Who among the following personalities won the Sangeet Natak Akademi Award 2021 for contribution to Manipuri Dance?","o":["Bhuvan Kumar","Thokchom Ibemubi Devi","Sruti Bandopadhyay","Kumkum Dhar"],"a":1,"e":"Thokchom Ibemubi Devi. The Manipuri Dance, also referred to as the Manipuri Raas Leela, is anchored in the Vaishnava faith of the Meiteis. The four Jhaveri sisters (Nayana, Ranjana, Suverna and Darshana) are classical Manipuri dancers. Bhuvan Kumar (Chhau Dancer)","s":""},{"n":254,"t":"Arts Personality","q":"Asghari Bai is primarily remembered for her contribution to which of the following genres of music?","o":["Folk","Carnatic","Dhrupad","Ghazal"],"a":2,"e":"Dhrupad. Awards of Asghari Bai - Padma Shri (1990), Sangeet Natak Akademi (1986). Other Dhrupad Artists: Ramakant Gundecha, Umakant Gundecha, Zia Fariddudin Dagar, Pelva Naik, Pandit Ram Kumar Mallick, Mukund Dev Sahoo, Uday Bhawalkar.","s":""},{"n":255,"t":"Arts Personality","q":"Who among the following personalities is associated with synthesising classical and modern Indian dance through a theatre group called Ranga Sri Little Ballet Troupe ?","o":["Guru Bipin Singh","Pandit Birju Maharaj","Shanti Bardhan","Remo Fernandes"],"a":2,"e":"Shanti Bardhan - A junior colleague of Uday Shankar, produced some of the most imaginative dance -dramas of the 20th century. He produced Ramayana, in which the actors moved and danced like puppets.","s":""},{"n":256,"t":"Arts Personality","q":"Who among the following personalities coined the term 'Odissi' for Odisha's classical dance?","o":["Kabichandra Kalicharan Patnaik","Kelucharan Mohapatra","Raja Rammohan Roy","Rabindranath Tagore"],"a":0,"e":"Kabichandra Kalicharan Patnaik . His Contribution was in the field of Odissi music, Odissi dance and Odia theatre. Some of his major published works: Kalanka Bhanjana, Milana Madhuri, Daridrya Bhanjana.","s":""},{"n":257,"t":"Arts Personality","q":"Consider the following statements about Kaushalya Reddy:\n1. She is a professional Kuchipudi dancer.\n2. She is a recipient of the Padma Vibhushan for her contribution to Indian classical dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. There is no record of her receiving the Padma Vibhushan. Famous Kuchipudi Dancers: Bhavana Reddy, Yamini Reddy, Vempati Chinna Satyam, Manju Bhargavi.","s":""},{"n":258,"t":"Arts Personality","q":"Mrinalini Sarabhai, founder of the Darpana Academy of Performing Arts, received which of the following awards in 1992?","o":["Padma Shri","Padma Bhushan","Padma Vibhushan","Sangeet Natak Akademi Fellowship"],"a":1,"e":"Padma Bhushan. Awards of Mrinalini Sarabhai - Padma Shri (1965), Padma Bhushan (1992), Sangeet Natak Akademi Award (1970), Dhirubhai Thakar Savyasachi Saraswat Award (2014), Sangeet Natak Akademi Fellowship (1994). She was the founder of Darpana Academy of Performing Arts (1949).","s":""},{"n":259,"t":"Arts Personality","q":"Consider the following statements about Guru Bipin Singh:\n1. He was renowned for promoting the Kuchipudi classical dance form.\n2. He received the Sangeet Natak Akademi Award in 1966.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Awards of Guru Bipin Singh (Manipuri Dancer) - Sangeet Natak Akademi Award (1966), Kalidas Samman (1989), Title of Hanjaba by the Maharaja of Manipur.","s":""},{"n":260,"t":"Arts Personality","q":"Match the following classical dancers with their dance forms:\n1. Urmila A. Bharatanatyam Satyanarayanan 2.Guru Bipin Singh B. Manipuri\n3. Kaushalya Reddy C. Kuchipudi\n4. Sanjukta Panigrahi D. Odissi","o":["1–A, 2–B, 3–C, 4–D","1–B, 2–A, 3–D, 4–C","1–C, 2–D, 3–B, 4–A","1–A, 2–C, 3–B, 4–D"],"a":0,"e":"1–A, 2–B, 3–C, 4–D","s":""},{"n":261,"t":"Arts Personality","q":"Satyaram Reang received the Padma Shri for promoting the Hojagiri dance form. He belongs to which of the following states?","o":["Sikkim","Manipur","Assam","Tripura"],"a":3,"e":"Tripura . His Awards - Padma Shri (2021), Sangeet Natak Akademi Award (1986), Hojagiri dance (Reang community).","s":""},{"n":262,"t":"Arts Personality","q":"Who among the following Indian classical tabla players was called 'Abbaji'? He collaborated with American jazz drummer Buddy Rich to create a music album in 1968 ?","o":["Taufiq Qureshi","Zakir Hussain","Fazal Qureshi","Alla Rakha"],"a":3,"e":"Alla Rakha . He belongs to Punjab Gharana. Awards: Padma Shri (1977) and Sangeet Natak Academy Award (1982).","s":""},{"n":263,"t":"Arts Personality","q":"Consider the following statements about Pandit Kumar Gandharva:\n1. His original name was Shivaputra Siddaramaiah Komkali.\n2. He was a renowned Hindustani classical vocalist.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":264,"t":"Arts Personality","q":"Consider the following statements:\n1. Pandit Kishan Maharaj belonged to the Benaras Gharana.\n2. He was a tabla player.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Awards: Padma Shri (1973) and Padma Vibhushan (2002).","s":""},{"n":265,"t":"Arts Personality","q":"Ramkrishna Talukdar received the Sangeet Natak Akademi Award in 2018 for his contribution to the Sattriya dance form. To which state does this dance form belong?","o":["West Bengal","Assam","Meghalaya","Jharkhand"],"a":1,"e":"Assam. Ramkrishna Talukdar : Awards - Asom Gaurav, Sangeet Jyoti Award, Nritya Ratna, Kala Gaurav. It was given the status of a classical dance in 2000 by the Sangeet Natak Akademi.","s":""},{"n":266,"t":"Arts Personality","q":"Consider the following statements:\n1. Janaki Prasad was the founder of the Benaras Gharana of Kathak.\n2. Ishwari Prasad was the founder of the Lucknow Gharana of Kathak.\nWhich of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Notable dancers from this gharana include Sitara Devi, Kamalini Asthana, and Nalini Asthana. Ishwari Prasad founded the Lucknow Gharana of Kathak; notable dancer – Pandit Birju Maharaj. Shambhu Maharaj was a celebrated guru of the Lucknow Gharana.","s":""},{"n":267,"t":"Arts Personality","q":"Which danseuse among the following was called to perform for Queen Elizabeth-ll's coronation festivities in 1953 ?","o":["Mrinalini Sarabhai","Sitara Devi","Rukmini Devi Arundale","Kamala Lakshmi Narayanan"],"a":3,"e":"Kamala Lakshmi Narayanan (Bharatanatyam). Awards - Padma Bhushan (1970), Lifetime Achievement Award (2004), Natya Padmam (2007), Platinum Jubilee Award (2002).","s":""},{"n":268,"t":"Arts Personality","q":"Consider the following statements about Vasundhara Doraswamy:\n1. She was awarded the Sangeet Natak Akademi Award (Akademi Puraskar) for the year 2019 for her contribution to Bharatanatyam.\n2. She is the only Bharatanatyam artiste from India to have performed at the ‘World Peace’ conference in Paris under the aegis of UNESCO.\n3. She has been honoured with the Shantala Natya Sri Award, the highest State Award for Dance by the Karnataka Government, and the Rajyotsava Award.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 – All the statements are correct.","s":""},{"n":269,"t":"Arts Personality","q":"Which dancer was the first person from Odisha to get Padma Vibhushan in 2000 ?","o":["Guru Shyama Charan Pati","Guru Bipin Singh","Guru Mayadhar Rout","Guru Kelucharan Mohapatra"],"a":3,"e":"Guru Kelucharan Mohapatra. Awards - Padma Bhushan (1988), Sangeet Natak Akademi Award (1966), Kalidas Samman (1987) .","s":""},{"n":270,"t":"Arts Personality","q":"Jyoti Prasad Agarwala was a music composer popularly called 'Rupkonwar' in the state of _________ .","o":["Madhya Pradesh","Rajasthan","Gujarat","Assam"],"a":3,"e":"Assam. Jyoti Prasad Agarwal - First filmmaker of Assam . He made the first Assamese Movie - ‘Joymoti’ (1935). His Famous Play - ‘Sonit - Konwari’, ‘Rupalim’, ‘Karengar Ligiri’, ‘Lobhita’ and 'Joymoti’. His death anniversary (17 January) is observed as ‘Silpi Divas’ in Assam.","s":""},{"n":271,"t":"Arts Personality","q":"Consider the following statements about Yamini Krishnamurthy:\n1. She opened the Yamini School of Dance in Chennai in the year 1990.\n2. She has received major awards including Padma Shri, Padma Bhushan, Padma Vibhushan, Sangeet Natak Akademi, \"Natya Shastra\" award, and authored the autobiography \"A Passion For Dance\".\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The Yamini School of Dance was opened in Delhi, not Chennai. - Awards - Padma Shri (1968), Sangeet Natak Akademi (1997), Padma Bhushan (2001), Padma Vibhushan (2016), \"Natya Shastra\" award (2014). Autobiography -\"A Passion For Dance\".","s":""},{"n":272,"t":"Arts Personality","q":"Who among the following personalities has received both Grammy and Oscar awards?","o":["Javed Akhtar","Jagjit Singh","Gulzar","Amitabh Bhattacharya"],"a":2,"e":"Gulzar (Sampooran Singh Kalra) is a famous lyricist of Hindi films. Awards - National Film Award (1991, 1988). Filmfare Award (2021, 2019, 2013). Academy Award (2009). Padma Bhushan (2004). Jawed Akhtar : Poet and lyricist and screenwriter of Hindi films. Award : Padma Shri (1999), Padma Bhushan (2007).","s":""},{"n":273,"t":"Arts Personality","q":"Ratikant Mohapatra, an awardee of 'Sangeet Natak Akademi Award', is known for which of the following classical dances of India?","o":["Odissi","Manipuri","Kathak","Kathakali"],"a":0,"e":"Odissi (2016). Other Awards : Bhumiputra Samman (2016), Nritya Choodamani (2014). Sangeet Natak Akademi Award (Odissi) - Pankaj Charan Das (1970), Deba Prasad Das (1970), Mayadhar Raut (1985), Sonal Mansingh (1987), Kumkum Mohanty (1994), Gangadhar Pradhan (1997), Gita Mahalik (2009), Aruna Mohanty (2010), Sujata Mohapatra (2017), Surupa Sen (2018), Sutapa Talukdar (2019), Rabindra Atibudhi (2020).","s":""},{"n":274,"t":"Arts Personality","q":"Consider the following statements about Kamalini Asthana and Nalini Asthana:\n1. They were conferred with the Padma Shri in 2022.\n2. They are renowned exponents of the Benaras Gharana style of Kathak.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":275,"t":"Arts Personality","q":"Match the following dancers with their dance forms: Dancer Dance Form\nA. Surupa Sen 1. Kathak\nB. Shovana Narayan 2.Bharatanatyam\nC. Alarmel Valli 3. Odissi\nD. Sitara Devi 4. Kathakali","o":["A–3, B–5, C–2, D–5","A–3, B–1, C–2, D–5","A–1, B–3, C–5, D–2","A–3, B–5, C–2, D–1"],"a":0,"e":"A–3, B–1, C–2, D–1. Surupa Sen, a noted Odissi dancer, has won the Sangeet Natak Akademi Award (2018) and Raza Foundation Award (2006). Shovana Narayan is a renowned Kathak dancer and scholar. Alarmel Valli, from Tamil Nadu, is an eminent Bharatanatyam artist known for her graceful style. Sitara Devi, the “Empress of Kathak,” was a legendary performer.","s":""},{"n":276,"t":"Arts Personality","q":"Who was the recipient of Ustad Bismillah Khan Yuva Puraskar 2017 for Kathak ?","o":["Jitendra Maharaj","Rajendra Gangani","Geetanjali Lal","Vidha Lal"],"a":3,"e":"Vidha Lal. She is a disciple of Kathak dancer Geetanjali Lal of Jaipur Gharana. Awards: ‘Sri Krishna gana sabha endowment award (2010) and Guinness world record for the most number of spins (103) in one minute (2011).","s":""},{"n":277,"t":"Arts Personality","q":"Papanasam Sivan was related to the following music?","o":["Carnatic","Punjabi","Khyal","Dhrupad"],"a":0,"e":"Carnatic. Papanasam Sivan Awards: Padma Bhushan (1972), Sangeet Natak Academy Fellow (1962), President Award (1962).","s":""},{"n":278,"t":"Arts Personality","q":"Consider the following statements about Zakir Hussain:\n1. He won a Grammy Award for the album ‘Global Drum Project’.\n2. He is the son of Ustad Alla Rakha and a recipient of Padma Shri, Padma Bhushan, and Padma Vibhushan.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Awards -Padma Shri (1988), Padma Bhushan (2002), Padma vibhushan (2023) National Heritage Fellowship (1999), Sangeet Natak Akademi Award (1990), Kalidas Samman (2006), Guru Gangadhar Pradhan Lifetime Achievement Award (In 2012 at Konark Dance & Music Festival), Grammy Award (1992 and 2009).","s":""},{"n":279,"t":"Arts Personality","q":"Ilyas Khan was born in Lucknow to a family of musicians. He was famous for playing","o":["Tabla","Sitar","Veena","Mridangam"],"a":1,"e":"Sitar. Ilyas Khan (1924-1989) - He was a disciple of Abdul Ghani Khan (a dhrupad singer from Kalpi). His father belonged to the Shahjahanpur gharana of sarod players while his mother came from the Lucknow gharana of sarod players.","s":""},{"n":280,"t":"Arts Personality","q":"Match the following musicians with the instruments they are best known for: Musician Instrument\nA. Ustad Shafaat 1. Violin Ahmed Khan\nB. Zakir Hussain 2. Rudra Veena\nC. Kishan Maharaj 3. Tabla\nD. Alla Rakha 4. Harmonium","o":["A–3, B–2, C–1, D–4","A–3, B–3, C–3, D–3","A–1, B–2, C–3, D–4","A–3, B–3, C–3, D–3"],"a":3,"e":"A–3, B–3, C–3, D–3. Ustad Shafaat Ahmed Khan - Tabla -Delhi Gharana, Padma Shri (2003). Zakir Hussain - Tabla - Grammy winner, son of Ustad Alla Rakha. Kishan Maharaj - Tabla - Banaras Gharana maestro. Alla Rakha - Tabla (3) - Legendary accompanist of Pandit Ravi Shankar.","s":""},{"n":281,"t":"Arts Personality","q":"Who among the following was awarded the Bharat Ratna in 2001 and has been credited with taking the shehnai from the marriage mandap to the concert hall ?","o":["Ravi Shankar","Ali Akbar Khan","Hariprasad Chaurasia","Bismillah Khan"],"a":3,"e":"Bismillah Khan (Ustad). Awards: Sangeet Natak Akademi Award (1956), Sangeet Natak Akademi Fellowship (1994), Swathi Sangeetha Puraskaram (1998) by Government of Kerala, T Choudayya National Award (1995) by Government of Karnataka, Tahar Mausique from the Republic of Iran (1992), Tansen Award by Govt. of Madhya Pradesh.","s":""},{"n":282,"t":"Arts Personality","q":"Match the following musicians with their instruments: Musician Instrument\nA. Ustad Shafaat Ahmed Khan 1. Sarod\nB. Ustad Allauddin Khan 2. Tabla\nC. Shivkumar Sharma 3. Santoor\nD. Vilayat Khan 4. Sitar","o":["A–2, B–1, C–3, D–4","A–1, B–2, C–3, D–4","A–2, B–3, C–4, D–1","A–4, B–1, C–2, D–3"],"a":0,"e":"A–2, B–1, C–3, D–4. Ustad Shafaat Ahmed Khan (Tabla) – Delhi Gharana, Padma Shri (2003). Ustad Allauddin Khan (Sarod) - Padma Bhushan (1958), Padma Vibhushan (1971), Sangeet Natak Akademi (1954). Shivkumar Sharma - Legendary santoor maestro. Vilayat Khan - Renowned sitar virtuoso .","s":""},{"n":283,"t":"Arts Personality","q":"Consider the following statements about Saswati Sen :\n1. She received the Padma Shri Award for 2004–2005.\n2. She is a senior disciple of Guru Kelucharan Mohapatra and is renowned for the dance form Odissi.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. She received the Sangeet Natak Akademi Award, not the Padma Shri, for 2004–2005. She is a senior disciple of Pandit Birju Maharaj and is known for Kathak, not Odissi.","s":""},{"n":284,"t":"Arts Personality","q":"Saroja Vaidyanathan received Kalidas Samman for classical dance in________.","o":["2009 - 10","2020 - 21","2001 - 02","2002 - 03"],"a":0,"e":"2009 - 10. Saroja Vaidyanathan (Bharatanatyam). Her awards: Padma Bhushan (2013), Padma Shri (2002). Bharat Kala Sunder (2006). Book by her :- “The Science of Bharatanatyam”. The first recipients (1980) of the Kalidas Samman -Semmangudi Srinivasa Iyer (Classical music) and Mallikarjun Mansur (Classical Music).","s":""},{"n":285,"t":"Arts Personality","q":"Lata Mangeshkar recorded her first playback song for a _________ film.","o":["Bengali","Punjabi","Marathi","Tamil"],"a":2,"e":"Marathi. Lata Mangeshkar -She recorded her first song “Naachu Ya Gade, Khelu Saari Mani Haus Bhaari” in 1942 at age of 13 for Marathi film Kiti Hasaal and recorded her last song ‘Saugandh Mujhe Is Mitti Ki’ in 2019.","s":""},{"n":286,"t":"Arts Personality","q":"Consider the following statements about Ustad Alla Rakha:\n1. He left home at the age of 12 to learn under the great master Mian Qadir Baksh.\n2. He became a renowned player of the Tabla in Hindustani classical music and was honoured with the Padma Shri (1977) and Sangeet Natak Akademi Award (1982).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":287,"t":"Arts Personality","q":"Who popularised the ‘Pandanallur Style’ in Bharatanatyam and received Padma Bhusan in 2004?","o":["Kumari Kamala","Madhuri Dixit","Mallika Sarabhai","Alarmel Valli"],"a":3,"e":"Alarmel Valli. She was the second youngest dancer to be conferred the Padma Shri (in 1991) from the Government of India, after Vyjayanthimala .","s":""},{"n":288,"t":"Arts Personality","q":"Match the following artists with their specialisation: Artist Specialisation\nA. Zarin Sharma 1. Carnatic Vocalist\nB. Vidushi Sharan 2. Sarod Rani\nC. Bombay Jayashri 3. Folk Singer Ramnath\nD. Mame Khan 4. Jazz Singer","o":["A–2, B–2, C–1, D–3","A–3, B–2, C–1, D–4","A–2, B–3, C–1, D–5","A–4, B–2, C–3, D–1"],"a":0,"e":"A–2, B–2, C–1, D–3. Zarin Sharma, sarod maestro of the Agra Gharana, won the Sangeet Natak Akademi Award (1988). Vidushi Sharan Rani, India’s first woman sarod player, received the Padma Bhushan (2000). Bombay Jayashri Ramnath, Carnatic vocalist, was honoured with the Padma Shri (2021). Mame Khan is a celebrated Rajasthani folk artist.","s":""},{"n":289,"t":"Arts Personality","q":"Consider the following statements about Alarmel Valli:\n1. She is noted as the first Indian classical dancer to perform at the Salzburg Festival in 2015.\n2. She is a Pandanallur-style Bharatanatyam exponent and recipient of the Padma Bhushan, Chevalier of Arts and Letters, and Sangeet Natak Akademi Award.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":290,"t":"Arts Personality","q":"Match the following personalities with their field: Personality Field\nA. Jayanthi Kumaresh 1. Kathakali\nB. Milena Salvini 2. Manipur\nC. Nahid Siddiqui 3. Veena\nD. Elam Endira Devi 4. Kathak","o":["A–3, B–1, C–4, D–2","A–2, B–3, C–1, D–4","A–4, B–1, C–3, D–2","A–3, B–4, C–2, D–1"],"a":0,"e":"A–3, B–1, C–4, D–2. Jayanthi Kumaresh, leading Saraswati veena exponent, won the Sangeet Shikhar Samman (2019). Milena Salvini, Italian-born Kathakali dancer, received the Padma Shri (2019). Nahid Siddiqui, Kathak artist and disciple of Maharaj Kathak & Birju Maharaj, won the Milapfest Lifetime Achievement Award (2017). Elam Endira Devi, Manipuri dancer and actress in Matamgi Manipur (1972), received the Padma Shri (2014).","s":""},{"n":291,"t":"Arts Personality","q":"Indore gharana is one of the vocal gharanas of Indian classical music. It was founded by _______.","o":["Ustad Amir Khan","Doreswamy V. Iyengar","Dr. Lakshminarayana Subramaniam","Ustad Bundu Khan"],"a":0,"e":"Ustad Amir Khan. Other disciples of Indore gharana - Pandit Amarnath, Shankar Lal Mishra, Kankana Banerjee, Purvi Mukherjee. Other gharana and its founder - Gwalior Khayal style (Ustad Nathan Pir Baksh), Agra (Hajisujan Khan), Rangeela (Faiyyaz Khan), Jaipur (Alladiya Khan).","s":""},{"n":292,"t":"Arts Personality","q":"Who among the following is a sitar maestro of global acclaim?","o":["Bismillah Khan","Girija Devi","Shahid Parvez Khan","Vishwa Mohan Bhatt"],"a":2,"e":"Shahid Parvez Khan. Awards - Kalajyothi Lifetime Achievement Award (2020), Sangeet Natak Akademi Award (2006), Padma Shri Award (2012).","s":""},{"n":293,"t":"Arts Personality","q":"Which former Miss India, also the recipient of the Sangeet Natak Akademi Award, popularised Indian classical dance in the west?","o":["Leela Naidu","Lona Pinto","Indrani Rahman","Peace Kanwal"],"a":2,"e":"Indrani Rahman . She was the first South Asian to compete in the Miss Universe pageant (1952). Indrani was a successful classical dancer in Bharatanatyam, Kuchipudi, Kathakali and Odissi. In 1961, she became the first dancer to be a part of the Asia Society tour. Awards - Femina Miss India (1952), Padma Shri (1969), Sangeet Natak Akademi Award (1981).","s":""},{"n":294,"t":"Arts Personality","q":"Match the following personalities with their specialisation: Personality Specialisation\nA. M.S. Gopalakrishnan 1. Hindustani Vocal Music\nB. Budhaditya Mukherjee 2. Sattriya\nC. Shri Mani Prasad 3. Violin\nD. Shri Jatin Goswami 4. Sitar","o":["A–3, B–4, C–1, D–2","A–4, B–3, C–1, D–2","A–3, B–1, C–4, D–2","A–1, B–4, C–3, D–2"],"a":0,"e":"A–3, B–4, C–1, D–2. M.S. Gopalakrishnan, violin maestro of both Carnatic and Hindustani styles, received the Padma Bhushan (2012). Budhaditya Mukherjee, sitarist, was the first musician to perform at the House of Commons, London. Shri Mani Prasad, Kirana Gharana vocalist, won the Sangeet Natak Akademi Award (2019). Shri Jatin Goswami, Sattriya dance exponent from Assam, was honoured with the Padma Shri (2008).","s":""},{"n":295,"t":"Arts Personality","q":"Consider the following statements about Deepika Reddy:\n1. She is associated with the classical dance form Kuchipudi of Andhra Pradesh.\n2. She has trained under eminent gurus such as Smt. Vijaya Prasad and Dr. Vempati Chinna Satyam.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":296,"t":"Arts Personality","q":"Consider the following statements about Saint Kabir Das:\n1. He was a 15th-century mystic poet and saint of the Bhakti Movement, born in Amritsar (Punjab).\n2. His compositions include Bijak, Kabir Parachai, Sakhi Granth, and Kabir Granthawali, and his verses are also found in the Sikh scripture Guru Granth Sahib.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Kabir Das was born in Kashi (Uttar Pradesh), not Amritsar.","s":""},{"n":297,"t":"Arts Personality","q":"Who among the following was the guru of Pandit Ravi Shankar ?","o":["Bismillah Khan","Amjad Ali Khan","Ali Akbar Khan","Allaudin Khan"],"a":3,"e":"Allauddin Khan (Sarod player) was the guru of Pandit Ravi Shankar. He was awarded the Padma Bhushan (1958) and the Padma Vibhushan (1971), Sangeet Natak Akademi award and Sangeet Natak Akademi Fellowship (1954).","s":""},{"n":298,"t":"Arts Personality","q":"In which state is the Maihar court where Baba Allauddin Khan was a musician?","o":["Tripura","Uttar Pradesh","Madhya Pradesh","Chhattisgarh"],"a":2,"e":"Madhya Pradesh. Baba Allauddin Khan (Sarod player) laid the foundation of Maihar Gharana and became the court musician for the Maharaja of Maihar.","s":""},{"n":299,"t":"Arts Personality","q":"Consider the following statements about Dr. Kanak Rele:\n1. She is a pioneering dance educationist and a prominent Bharatanatyam exponent.\n2. She founded the Nalanda Dance Research Centre in 1967 and the Nalanda Nritya Kala Mahavidyalaya in Mumbai .\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. She is a Mohiniyattam exponent .","s":""},{"n":300,"t":"Arts Personality","q":"Who among the following Indian classical musicians has an auditorium named after it in Tehran, Iran?","o":["Ustad Bismillah Khan","Ustad Sultan Khan","Ustad Zakir Hussain","Ustad Vilayat Khan"],"a":0,"e":"Ustad Bismillah Khan (shehnai) - Become the third classical musician of India after M. S. Subbalakshmi and Ravi Shankar to be awarded the Bharat Ratna (2001).","s":""},{"n":301,"t":"Arts Personality","q":"Who among the following was the first recipient of the State annual award Nishagandhi Puraskaram from the Government of Kerala in 2013?","o":["Madhavi Mudgal","Shobana C Pillai","Uday Shankar","Mrinalini Sarabhai"],"a":3,"e":"Mrinalini Sarabhai was the founder and director of Darpana Academy of Performing Arts in Ahmedabad.","s":""},{"n":302,"t":"Arts Personality","q":"Match the following musicians with their Gharanas: Musician Gharana\nA. Kishori Amonkar 1. Patiala\nB. Bhimsen Joshi 2. Kirana\nC. Bade Ghulam Ali 3. Jaipur–Atrauli Khan\nD. Kumar Gandharva 4. Gwalior","o":["A–3, B–2, C–1, D–4","A–2, B–3, C–4, D–1","A–3, B–4, C–2, D–1","A–1, B–2, C–3, D–4"],"a":0,"e":"A–3, B–2, C–1, D–4. Kishori Amonkar, Jaipur–Atrauli Gharana vocalist, received the Padma Bhushan (1987) and Padma Vibhushan (2002). Bhimsen Joshi, Kirana Gharana maestro, was a renowned Hindustani vocalist. Bade Ghulam Ali Khan, Patiala Gharana legend, was famous for khyal and thumri. Kumar Gandharva, Gwalior Gharana singer, was known for his innovative approach to Hindustani music.","s":""},{"n":303,"t":"Arts Personality","q":"Consider the following statements:\n1. Prerana Shrimali is a senior Kathak dancer of the Jaipur Gharana and recipient of the Rashtriya Ekta Award in 2001.\n2. Guru Nileshwar Mukherjee is an exponent of the Odissi classical dance form.\n3. Sisters Lalita and Nandini are renowned violin players and recipients of honours like Kalaimamani and the title Haratha Violin Vadya Thilakangal.\nWhich of the above statements is/are correct?","o":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 3 only. Guru Nileshwar Mukherjee is associated with Manipuri.","s":""},{"n":304,"t":"Arts Personality","q":"Consider the following statements:\n1. Prerana Deshpande, a Kathak dancer, received the National Devdasi Award in 2016.\n2. R. Muthukannammal, a Kathak exponent, was honoured with the Padma Shri in 2022.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . R. Muthukannammal is a Sadir dancer, not Kathak.","s":""},{"n":305,"t":"Arts Personality","q":"Consider the following statements about Rukmini Devi Arundale:\n1. She was awarded the Prani Mitra Award in 1968.\n2. She was a Bharatanatyam exponent and recipient of the Padma Bhushan (1956) and the Sangeet Natak Akademi Award (1957).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 – Both statements are factually correct.","s":""},{"n":306,"t":"Arts Personality","q":"Match the following dancers with their classical dance forms: Dancer Dance Form\nA. Smitha Rajan 1. Bharatanatyam\nB. Jayaprabha Menon 2. Mohiniyattam\nC. Prateeksha Kashi 3. Kuchipudi\nD. Radha Dutta 4. Mohiniyattam","o":["A–2, B–2, C–3, D–4","A–2, B–4, C–3, D–2","A–4, B–2, C–1, D–3","A–3, B–2, C–4, D–1"],"a":1,"e":"A–2, B–4, C–3, D–2. Smitha Rajan, noted Mohiniyattam exponent. Jayaprabha Menon, Mohiniyattam artist known for traditional and innovative performances. Prateeksha Kashi, Kuchipudi dancer with multiple national awards. Radha Dutta, Mohiniyattam performer and teacher.","s":""},{"n":307,"t":"Arts Personality","q":"Consider the following statements:\n1. Surekha Punekar is a Lavani dancer from the Indian state of Maharashtra.\n2. Bharatnatyam dancer Priyadarshini Govind was awarded the Kalaimamani in 1998, the title ‘Nritya Kalanidhi’ by The Music Academy (2019).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":308,"t":"Arts Personality","q":"Match the following artists with their respective art forms or instruments: Artist Art Form / Instrument\nA. Kumkum Mohanty 1. Santoor\nB. Sharmila Biswas 2. Sarangi\nC. Ustad Sultan Khan 3. Odissi\nD. Shivkumar Sharma 4. Kat
