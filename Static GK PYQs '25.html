m NREGA to MGNREGA on 2nd October 2009 .","s":""},{"n":1866,"t":"Schemes","q":"The ___________ project has been organised by the Central government for the villagers, to conserve water for drinking, irrigation, fisheries and afforestation.","o":["Haryali","Chipko andolan","Neeru-Meeru","Arvary Pani Sansad"],"a":0,"e":"Haryali : Launched in 2003. Chipko movement (1973) was a nonviolent protest to prevent felling of trees in Himalayas that began in Chamoli (Uttarakhand) under the leadership of Sundarlal Bahuguna, Gaura Devi, etc. The Neeru-Meeru (Water and You) programme was launched in Andhra Pradesh in 2000. Arvary Pani Sansad (in Alwar, Rajasthan) program was launched in 1999.","s":""},{"n":1867,"t":"Schemes","q":"Which Ministry of the Government of India launched South Asia Distribution Utility Network (SADUN) which aims to modernise distribution of utilities in South Asia?","o":["Information and Broadcasting ministry","Power ministry","Railways ministry","Civil Aviation ministry"],"a":1,"e":"Power Ministry. SADUN is a joint initiative of the Ministry of Power, United States Agency for International Development (USAID) and Power Finance Corp. This initiative aims to promote knowledge sharing among distribution companies (discoms) in the region.","s":""},{"n":1868,"t":"Schemes","q":"In which year was the 'Prime Minister Street Vendor's AtmaNirbhar Nidhi' (PM SVANidhi) scheme launched by the Government of India with the objective of providing an affordable working capital loan to street vendors to resume their livelihoods ?","o":["2022","2020","2021","2019"],"a":1,"e":"2020. Prime Minister Street Vendor’s AtmaNirbhar Nidhi (PM-SVANidhi) fully funded by the Ministry of Housing and Urban Affairs. The scheme facilitates a working capital collateral-free loan of ₹10,000, with subsequent loans of ₹20,000 and ₹50,000 with a 7% interest subsidy.","s":""},{"n":1869,"t":"Schemes","q":"The 'National Food for Work Programme' was launched in the year 2004 by the Government of India in _____ most backward districts of India.","o":["100","200","150","250"],"a":2,"e":"150. The National Food for Work Programme (NFWP), launched on November 14, 2004, by the Ministry of Rural Development, aimed to provide supplementary wage employment in 150 of India's most backward districts.","s":""},{"n":1870,"t":"Schemes","q":"Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS) Scheme is a scheme of which Ministry of the Government of India?","o":["Ministry of Tourism","Ministry of Tribal Affairs","Ministry of Minority Affairs","Ministry of Culture"],"a":2,"e":"Ministry of Minority Affairs. Pradhan Mantri Kaushal Ko Kaam Karyakram (PMKKK) renamed as Pradhan Mantri Virasat Ka Samvardhan (PM VIKAS) Scheme. This integrated scheme converges five erstwhile schemes of the Ministry viz. Seekho aur Kamao, USTTAD, Hamari Dharohar, Nai Roshni and Nai Manzil.","s":""},{"n":1871,"t":"Schemes","q":"In October 2020, which of the following Ministries launched the Ayushman Sahakar Scheme, to assist cooperatives in the creation of healthcare infrastructure?","o":["Ministry of Commerce and Industry","Ministry of Health and Family Welfare","Ministry of Agriculture and Farmers Welfare","Ministry of Corporate Affairs"],"a":2,"e":"Ministry of Agriculture and Farmers Welfare. The scheme is implemented by the National Cooperative Development Corporation (NCDC). Other related schemes include Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB-PMJAY), launched by the Ministry of Health and Family Welfare in September 2018, and the National Rural Health Mission (NRHM), initiated by the same ministry in 2005.","s":""},{"n":1872,"t":"Schemes","q":"Which of the following is NOT a poverty alleviation programme in India?","o":["Rural Housing - Indira Awaas Yojana (IAY)","Namami Gange","Rural Employment Generation Programme (REGP)","Sampoorna Grameen Rozgar Yojana (SGRY)"],"a":1,"e":"Namami Gange. India has implemented several poverty alleviation programs aimed at reducing poverty and improving living standards. Poverty alleviation programme in India: Mahatma Gandhi National Rural Employment Guarantee Act (2005), Pradhan Mantri Awas Yojana (2015), National Rural Livelihood Mission (2011), Public Distribution System (PDS), Pradhan Mantri Garib Kalyan Yojana (2016).","s":""},{"n":1873,"t":"Schemes","q":"What is the duration of Pradhan Mantri Matsya Sampada Yojana?","o":["7 years","8 years","6 years","5 years"],"a":3,"e":"5 years. The Pradhan Mantri Matsya Sampada Yojana (PMMSY) was launched in 2020, by the Department of Fisheries, Ministry of Fisheries, Animal Husbandry, and Dairying.","s":""},{"n":1874,"t":"Schemes","q":"Which of the following government schemes was launched to provide financial assistance to start-ups for proof of concept, prototype development, product trials, market entry and commercialisation on 19 April 2021?","o":["Start-up India Seed Fund Scheme (SISFS)","Pradhan Mantri Rozgar Yojana (PMRY)","Procurement and Marketing Support (PMS) Scheme","Pradhan Mantri MUDRA Yojana (PMMY)"],"a":0,"e":"Start-up India Seed Fund Scheme (SISFS) aims to provide seed funding to startups at the initial stages. Pradhan Mantri Rozgar Yojana (1993) focuses on self-employment opportunities for unemployed youth. Procurement and Marketing Support (PMS) Scheme provides marketing assistance to micro and small enterprises. Pradhan Mantri MUDRA Yojana (2015) provides loans to micro-enterprises.","s":""},{"n":1875,"t":"Schemes","q":"Which ministry started the Pradhan Mantri Rojgar Protsahan Yojana?","o":["Ministry of Labour and Employment","Ministry of Home Affairs","Ministry of Corporate Affairs","Ministry of Rural Development"],"a":0,"e":"Ministry of Labour and Employment. Pradhan Mantri Rojgar Protsahan Yojana (PMRPY) was launched on 9th August, 2016 with the objective to incentivise employers for creation of employment. Under the scheme, Government of India is paying Employer’s full contribution i.e. 12% towards Employees' Provident Funds (EPF) and Employees' Pension Scheme (EPS) both.","s":""},{"n":1876,"t":"Schemes","q":"The Swadesh Darshan Scheme (SDS) which was launched in 2014-15 by the Ministry of Tourism, Government of India, has been revamped as ___ in 2023.","o":["Swadesh Darshan 3.0 (SD3.0)","Swadesh Darshan 4.0 (SD4.0)","Swadesh Darshan 2.0 (SD2.0)","Swadesh Darshan 1.0 (SD1.0)"],"a":2,"e":"Swadesh Darshan 2.0 (SD2.0). It seeks to attain “Aatmanirbhar Bharat” with the mantra of ‘vocal for local’.","s":""},{"n":1877,"t":"Schemes","q":"Which age group of the population are covered under the Deen Dayal Upadhyaya Grameen Kaushalya Yojana (DDU-GKY) scheme of the Government of India ?","o":["25 to 60 years","30 to 60 years","15 to 35 years","14 to 40 years"],"a":2,"e":"15 to 35 years. Deen Dayal Upadhyaya Grameen Kaushalyaya Yojana (Launch - 2014) : It is a demand-driven placement linked skill training initiative working under the National Rural Livelihood Mission (NRLM). Scheme was announced by the Ministry of Rural Development on Antyodaya Divas.","s":""},{"n":1878,"t":"Schemes","q":"In which year was the Training of Rural Youth for Self Employment (TRYSEM) scheme launched by the Government of India?","o":["1991","2000","1979","1965"],"a":2,"e":"1979. Objectives of TRYSEM : To provide rural youth (18-35 years) from families below the poverty line with training and technical skills to enable them to take up self-employment in agriculture, industry, services and business activities.","s":""},{"n":1879,"t":"Schemes","q":"The Swarna Jayanti Shahari Rojgar Yojana (SJSRY) was launched in the year ____ by the Government of India.","o":["1990","1997","2010","2004"],"a":1,"e":"1997. SJSRY : The Swarna Jayanti Shahari Rozgar Yojana (SJSRY) shall seek to provide gainful employment to the urban unemployed. Ministry -Ministry of Housing and Urban Affairs.","s":""},{"n":1880,"t":"Schemes","q":"The Pradhan Mantri Garib Kalyan Rojgar Abhiyaan (PMGKRA) was launched in the year 2020 by which Ministry of Government of India?","o":["Ministry of Ports, Shipping and Waterways","Ministry of Social Justice and Empowerment","Ministry of Micro, Small and Medium Enterprises","Ministry of Rural Development"],"a":3,"e":"Ministry of Rural Development. It was for a period of 125 days with a resource envelope of Rs.50,000 crore, to boost employment and livelihood opportunities for returnee migrant workers and similarly affected workers in the rural area, in the wake of COVID-19 pandemic. It will run for 125 days in 116 districts across six states -Bihar, Uttar Pradesh, Madhya Pradesh, Jharkhand, Odisha and Rajasthan.","s":""},{"n":1881,"t":"Schemes","q":"In which year was the Pradhan Mantri Rojgar Protsahan Yojana (PMRPY) launched?","o":["2018","2015","2016","2022"],"a":2,"e":"2016. PMRPY : a scheme to incentivise employers registered with the Employees' Provident Fund Organisation (EPFO) for job creation. Administered by - The Employees' Provident Fund Organisation (EPFO). Nodal Ministry -Ministry of Labour and Employment.","s":""},{"n":1882,"t":"Schemes","q":"Which of the following options best describes the purpose of Pradhan Mantri Shram Yogi Mann-Dhan (PM-SYM) scheme, 2019 ?","o":["Provide healthcare services to pregnant women","Provide education loans to financially weak students","Provide pension to unorganized sector workers","Provide financial assistance to small and marginal farmers"],"a":2,"e":"Pradhan Mantri Shram Yogi Maan Dhan (PM-SYM) scheme - The scheme provides a monthly pension of Rs. 3000/- to subscribers after they attain the age of 60 years. The scheme is for the age group of 18-40 years.","s":""},{"n":1883,"t":"Schemes","q":"Which of the following government schemes provides subsidised food grains to poor households in India?","o":["Pradhan Mantri Kaushal Vikas Yojana","Pradhan Mantri Garib Kalyan Anna Yojana","Pradhan Mantri Jan Arogya Yojana","Atal Pension Yojana"],"a":1,"e":"Pradhan Mantri Garib Kalyan Anna Yojana (2020). The scheme aims to provide 5 kg of grains (wheat or rice) for free to each individual who is covered under National Food Security Act, 2013.","s":""},{"n":1884,"t":"Schemes","q":"Which of the following initiatives of the Government of India is aimed at developing and rejuvenating 75 water bodies in each district of the country as a part of the celebration of Azadi ka Amrit Mahotsav?","o":["Mission Amrit Clean Water","Mission Amrit Water","Mission Amrit Sarovar","Mission Amrit District"],"a":2,"e":"Mission Amrit Sarovar. With a view to conserve water for the future this Mission launched on 24th April, 2022.","s":""},{"n":1885,"t":"Schemes","q":"Which of the following is the largest pan-India scheme to strengthen health care infrastructure across the country with focus on primary, secondary and tertiary care services?","o":["LaQshya","AB-PMJAY","PM-ABHIM","PM-MI"],"a":2,"e":"PM-ABHIM (Prime Minister Ayushman Bharat Health Infrastructure Mission): Ministry ( Ministry of Health and Family Welfare), launched (October 2021).","s":""},{"n":1886,"t":"Schemes","q":"The 'Right to Work' plan, under the National Rural Employment Guarantee Act, 2005, was implemented in how many districts in the first phase?","o":["150","200","100","120"],"a":1,"e":"200. National Rural Employment Guarantee Act, 2005 (NREGA) : It is under the Ministry of Rural development. In (2009), the NREGA scheme was renamed as the Mahatma Gandhi National Rural Employment Guarantee Act (MGNREGA) scheme. Aim - to ensure that if any adult member of a rural household is willing to do unskilled manual work, that household gets at least 100 days of jobs in a financial year.","s":""},{"n":1887,"t":"Schemes","q":"What is the priority zone of the AMRUT (Atal Mission for Rejuvenation and Urban Transformation) mission, which was launched by the Government of India in 2015 ?","o":["Water supply followed by sewerage","Electricity and power generation","Primary education for all","Health care of urban dwellers"],"a":0,"e":"Water supply followed by sewerage. AMRUT : Launched on 25th June 2015 and selected 500 cities and towns to focus on development of basic infrastructure. National Heritage City Development And Augmentation Yojana (HRIDAY) started on 21 January 2015.","s":""},{"n":1888,"t":"Schemes","q":"What is the name of the flagship program that was launched in 2005 to address the lack of infrastructure in urban India ?","o":["National Urban Livelihoods Mission","Integrated Development of Small & Medium Towns","Atal Mission for Rejuvenation and Urban Transformation","Jawaharlal Nehru National Urban Renewal Mission"],"a":3,"e":"Jawaharlal Nehru National Urban Renewal Mission (JNNURM) - A massive city-modernization scheme launched by the Government of India under the Ministry of Urban Development. Launched - December\n2005. Closed - 2014.","s":""},{"n":1889,"t":"Schemes","q":"When was the National Urban Health Mission approved by the Government of India ?","o":["2014","2015","2012","2013"],"a":3,"e":"2013. The National Urban Health Mission (NUHM): Launched by the Ministry of Health and Family Welfare.","s":""},{"n":1890,"t":"Schemes","q":"In which year was the 'Pradhan Mantri Kaushal Vikas Yojana' launched?","o":["2019","2015","2014","2020"],"a":1,"e":"2015. Pradhan Mantri Kaushal Vikas Yojana : promotes skill development in the country by providing free short-duration skill training and incentivizes this by providing monetary rewards to youth for skill certification. Ministry - Skill Development and Entrepreneurship.","s":""},{"n":1891,"t":"Schemes","q":"The 'Jal Kranti Abhiyan' was launched by which government during the financial year 2015 - 2016 ?","o":["Government of Punjab","Government of Haryana","Government of India","Government of Uttar Pradesh"],"a":2,"e":"Government of India. The Abhiyan was inaugurated by the Union Minister of Water Resources, River Development and Ganga Rejuvenation in Rajasthan in June 2015. Objective: Strengthening grass-root involvement of all stakeholders including Panchayati Raj institutions and local bodies for Participatory Irrigation Management.","s":""},{"n":1892,"t":"Schemes","q":"' Swachh Bharat Mission' is associated with which public figure?","o":["Mahatma Gandhi","Jawaharlal Nehru","Vallabhbhai Patel","Lal Bahadur Shastri"],"a":0,"e":"Mahatma Gandhi. Swachh Bharat Mission (SBM) is a country-wide campaign initiated by the Government of India at Rajpath (New Delhi) on October 2, 2014 to eliminate open defecation and improve solid waste management .","s":""},{"n":1893,"t":"Schemes","q":"How many engines drive 'PM Gati Shakti', a project launched by the central government with an aim to revolutionise infrastructure in India?","o":["Two","Seven","Nine","Four"],"a":1,"e":"Seven. Gati Shakti scheme (2021) or National Master Plan for multi-modal connectivity plan comes under the Ministry of Commerce.","s":""},{"n":1894,"t":"Schemes","q":"What is the aim of the Annapurna Yojana of the Government of India?","o":["To provide food grains to children","To provide food grains to women","To provide food to all","To provide food grains to senior citizens"],"a":3,"e":"Annapurna Yojana -Launched by the Ministry of Rural Development. It is a part of the National Social Assistance Programme (1995). Objective - It provides Food Security to Senior Citizens above 60 years of age and to those eligible old-aged persons who remained uncovered under Indira Gandhi NOAPS (National Old Age Pension Scheme). Eligible beneficiaries will receive 10 kg (Every month) of grains free of charge.","s":""},{"n":1895,"t":"Schemes","q":"Karmayogi Bharat owns and operates the digital assets and platforms for the online training of _________ .","o":["civil servants","defense personnel","social activists","academicians"],"a":0,"e":"Civil servants. Karmayogi Bharat : A Special Purpose Vehicle (set up under section 8 of Companies Act, 2013 as a 100% government-owned entity) which shall own, manage, maintain and improve the digital platform, IGOT (Integrated Govt. Online training) to implement Mission Karmayogi (2020) - the National Programme for Civil Services Capacity Building.","s":""},{"n":1896,"t":"Schemes","q":"The National Rural Employment Programme was merged with ____ in 1989.","o":["Indira Awas Yojana","Rural Landless Employment Guarantee Programme","Employment Assurance Scheme","Jawahar Rozgar Yojana"],"a":3,"e":"Jawahar Rozgar Yojana - It was launched in April 1989 by merging National Rural Employment Program (NREP) and Rural Landless Employment Guarantee Programme (RLEGP). It was replaced by Jawahar Gram Samridhi Yojna on 1 April 1999 and on 25 September 2001, merged with Sampoorna Grameen Rozgar Yojana. Indira Awaas Yojana (IAY) - 1985-86 (Now replaced by Pradhan Mantri Gramin Awas Yojana).","s":""},{"n":1897,"t":"Schemes","q":"Pradhan Mantri Gramodaya Yojana was launched in ___________.","o":["2000","2010","2005","1998"],"a":0,"e":"2000. Pradhan Mantri Gramodaya Yojana - It was started to improve the lives of the rural poor population. Other important government scheme: National Social Assistance Programme (Launched on 15th August, 1995). Pradhan Mantri Gram Sadak Yojana (Launched on 25th December, 2000). Saansad Adarsh Gram Yojana (October 2014). Pradhan Mantri Ujjwala Yojana (launched in 2016).","s":""},{"n":1898,"t":"Schemes","q":"PM Street Vendor’s AtmaNirbhar Nidhi (PM SVANidhi) Scheme was launched by which ministry?","o":["Ministry of Consumer Affairs","Ministry of Finance","Ministry of Commerce","Ministry of Housing and Urban Affairs"],"a":3,"e":"Ministry of Housing and Urban Affairs. The PM Street Vendor’s Atma Nirbhar Nidhi (PM SVANidhi) -launched on June 01, 2020. Aim -Providing affordable Working Capital loans to street vendors to resume their livelihoods that have been adversely affected due to Covid-19 lockdown.","s":""},{"n":1899,"t":"Schemes","q":"Pradhan Mantri Awas Yojana-Urban was launched by which Union Ministry?","o":["Ministry of Finance","Ministry of Housing and Urban Affairs","Ministry of Human Resource Development","Ministry of Rural Development"],"a":1,"e":"Ministry of Housing and Urban Affairs . It was launched on 25th June 2015. Pradhan Mantri Awas Yojana - Gramin (PMAY-G) - It was launched in June 2015 with the aim to provide ‘Housing for All’ by 2022 in rural areas.","s":""},{"n":1900,"t":"Schemes","q":"The Union Government's \"PAHAL Scheme\" is related to _______ .","o":["Girl Scholarship","Medical Subsidy","LPG Subsidy","Bathroom Construction"],"a":2,"e":"LPG Subsidy. PAHAL (Pratyaksh Hanstantrit Labh) entered into Guinness Book of World Records (largest Direct Benefit Transfer of LPG), was launched on 01 June 2013 by the Ministry of Petroleum & Natural Gas.","s":""},{"n":1901,"t":"Schemes","q":"The National Literacy Mission (NLM) was set up in _____ .","o":["1971","1982","1988","1998"],"a":2,"e":"1988. The National Literacy Mission - It aimed to educate people in the age group of 15 - 35. The major aim of the programme is on the promotion of literacy among women, scheduled castes and tribes and backward classes.","s":""},{"n":1902,"t":"Schemes","q":"“PM POSHAN” Scheme is implemented by which ministry?","o":["Ministry of Women & Child Development","Ministry of Agriculture & Farmers Welfare","Ministry of Education","Ministry of Social Justice"],"a":2,"e":"Ministry of Education . In 2021, the Union Cabinet approved the PM-POSHAN (Pradhan Mantri Poshan Shakti Nirman) for providing one hot cooked meal in Government and Government-aided schools. The scheme replaced the Mid-day Meal Scheme. The Mid Day Meal Scheme was started in India on 15th August 1995.","s":""},{"n":1903,"t":"Schemes","q":"Which road plan in India was the first attempt for the Road Development Programme between 1943-1963 ?","o":["Poona Road Plan","Nagpur Road Plan","Bombay Road Plan","Lucknow Road Plan"],"a":1,"e":"Nagpur Road plan (1943 -1963). Bombay road plan (1961- 1981, Lucknow road plan (1981 – 2001).","s":""},{"n":1904,"t":"Schemes","q":"In which of the following years was the Fit India Movement launched by the Ministry of Youth Affairs and Sports, GoI?","o":["2018","2001","2020","2019"],"a":3,"e":"2019. Fit India Movement was launched on the occasion of National Sports Day to make fitness an integral part of the daily lives of the people of India.","s":""},{"n":1905,"t":"Schemes","q":"Smart cities and Academia Towards Action and Research (SAAR) scheme was launched by the ______.","o":["Ministry of Commerce and Industry","Ministry of Culture","Ministry of Housing and Urban Affairs","Ministry of External Affairs"],"a":2,"e":"The Ministry of Housing and Urban Affairs (MoHUA) launched the SAAR program under the Smart Cities Mission.","s":""},{"n":1906,"t":"Schemes","q":"In which year was Soil Health Card launched in India to enable the farmers to apply appropriate recommended dosages of nutrients for crop production and improving soil health and its fertility?","o":["2017","2019","2013","2015"],"a":3,"e":"2015 (Ministry of Agriculture and Farmers’ Welfare). Soil Health Card (SHC) is a printed report which contains nutrient status of soil with respect to 12 nutrients: pH, Electrical Conductivity (EC), Organic Carbon (OC), Nitrogen (N), Phosphorus (P), Potassium (K), Sulphur (S), Zinc (Zn), Boron (B), Iron (Fe), Manganese (Mn) and Copper (Cu) of farm holdings.","s":""},{"n":1907,"t":"Schemes","q":"When was the Ayushman Bharat Digital Mission launched?","o":["27 September 2021","2 October 2021","27 January 2020","17 February 2021"],"a":0,"e":"27 September 2021. Ayushman Bharat Digital Mission aims to provide digital health IDs for all Indian citizens to help hospitals, insurance firms, and citizens access health records electronically when required.","s":""},{"n":1908,"t":"Schemes","q":"‘Surakshit Hum Surakshit Tum Abhiyan’ was launched by which of the following institutions?","o":["NITI Aayog and bill and Melinda Gates Foundation","Ministry of Women and Child Development and Piramal Foundation","Ministry of Women and Child Development and Bill and Melinda Gates Foundation","NITI Aayog and Piramal Foundation"],"a":3,"e":"NITI Aayog and Piramal Foundation. NITI stands for “National Institution for Transforming India” (2015). Its initiatives include \"15-year road map\", \"7-year vision, strategy, and action plan\", AMRUT, Digital India, Atal Innovation Mission.","s":""},{"n":1909,"t":"Schemes","q":"In which year was the Immunization Programme introduced in India as ‘Expanded Programme of Immunization’ (EPI) by the Ministry of Health and Family Welfare?","o":["1982","1974","1978","1980"],"a":2,"e":"1978. The Expanded Programme on Immunization (EPI) was started in India in 1978 with the objective to reduce morbidity and mortality from tetanus, poliomyelitis, diphtheria, pertussis, and childhood tuberculosis by providing immunization services to all eligible children and pregnant women by 1990.","s":""},{"n":1910,"t":"Schemes","q":"Realizing the importance of maintaining the cleanliness of the water bodies, the Government of India passed the Water (Prevention and Control of Pollution) Act, ________, to safeguard our water resources.","o":["1974","1973","1971","1969"],"a":0,"e":"1974.","s":""},{"n":1911,"t":"Schemes","q":"In which year was the ‘Pradhan Mantri Annadata Aay Sanrakshan Abhiyan’ (PM AASHA) launched by the Government of India?","o":["2016","2015","2018","2017"],"a":2,"e":"2018. The ‘Pradhan Mantri Annadata Aay Sanrakshan Abhiyan’ (PM AASHA) was launched by the Government of India. Pradhan Mantri Annadata Aay SanraksHan Abhiyan (PM-AASHA) is an umbrella scheme aimed at ensuring remunerative prices to the farmers for their produce.","s":""},{"n":1912,"t":"Schemes","q":"‘ Mission Antyodaya’ is a mission mode project envisaged by the:","o":["Ministry of Urban Development","Ministry of Rural Development","Ministry of Health Development","Ministry of Transport Development"],"a":1,"e":"Ministry of Rural Development. Mission Antyodaya is a convergence and accountability framework aiming to bring optimum use and management of resources. It was adopted in the Union Budget 2017-18.","s":""},{"n":1913,"t":"Schemes","q":"In which year was the ‘Target Olympic Podium Scheme’ (‘TOPS’) formulated by the Ministry of Youth Affairs and Sports?","o":["2015","2014","2013","2016"],"a":1,"e":"2014 . TOPS facilitates selected athletes with support staff and training personnel, sports psychologists, physiotherapists etc including direct financial support of 50,000 rupees per month.","s":""},{"n":1914,"t":"Schemes","q":"In which year was National Mission for Clean Ganga (NMCG) registered as a society under the Societies Registration Act 1860?","o":["2018","2014","2011","2009"],"a":2,"e":"2011. National Mission for Clean Ganga (NMCG) is the implementation wing of the National Ganga River Basin Authority (NGRBA).","s":""},{"n":1915,"t":"Miscellaneous","q":"How often is the World Happiness Report released?","o":["Quarterly","Annually","Triennially","Biennially"],"a":1,"e":"Annually. The World Happiness Report (WHR) 2025, released on 20th March (World Happiness Day) by the University of Oxford’s Wellbeing Research Centre in partnership with Gallup and the UN Sustainable Development Solutions Network (UNSDSN), ranked Finland as the happiest country for the 8th year, followed by Denmark, Iceland, and Sweden. India ranked 118th in 2025, improving from 126th in 2024.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":1916,"t":"Miscellaneous","q":"When focusing on a tree while on an anti-clockwise merry-go-round, from which side does it appear and exit?","o":["Right to Left","Always visible","Never visible","Left to Right"],"a":0,"e":"Right to Left. When sitting on a merry-go-round moving anti-clockwise, the external stationary object (like a tree) will appear to move in the opposite direction of rotation. Since the merry-go-round is rotating anti-clockwise, the tree will appear to move from right to left in the observer’s field of vision.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":1917,"t":"Miscellaneous","q":"The Vesara style of temple two styles?","o":["Gandhara and French","Nagara and Gothic","Dravidian and Nagara","Mughal and Dravidian"],"a":2,"e":"Dravidian and Nagara. The Vesara style is a hybrid architectural form that evolved during the early medieval period in southern India, especially under the rule of the Chalukyas of Badami. It blends features from both the Nagara style (prevalent in North India) and the Dravidian style (dominant in South India). While Nagara temples typically have beehive-shaped shikharas (towers), and Dravidian temples have pyramidal vimanas and elaborate gateways (gopurams), the Vesara style incorporates elements of both—creating a unique synthesis. This architectural style is especially visible in temples like the Durga Temple at Aihole, the Lad Khan Temple, and the Virupaksha Temple at Pattadakal.","s":"SSC Stenographer 7/08/2025 (Shift 3)"},{"n":1918,"t":"Miscellaneous","q":"Chand Minar at Daulatabad is a 210-feet-high tapering tower divided into _____ storeys.","o":["four","six","three","five"],"a":0,"e":"four. Chand Minar (2nd largest minaret in India) was built in 1435 by Ala-ud-din Bahmani to commemorate the victory over the Daulatabad Fort. It has 24 chambers, spread over four floors and a small mosque.","s":""},{"n":1919,"t":"Miscellaneous","q":"Theravada is known as the official religion of which of the following neighbouring countries of India?","o":["Afghanistan","Bangladesh","Pakistan","Sri Lanka"],"a":3,"e":"Sri Lanka. Theravāda is one of the major branches of Buddhism, and it is considered the oldest and most traditional form. It is predominantly practiced in Southeast Asian countries such as Sri Lanka, Thailand, Myanmar (Burma), Laos, and Cambodia. Official religion of India’s Neighbouring Countries: Pakistan (Islam), Bangladesh (Islam), Bhutan (Mahayana Buddhism), Afghanistan (Islam).","s":""},{"n":1920,"t":"Miscellaneous","q":"The Kamakshi Saunsthan temple of Goa is crowned with the ________ two-storied tower and with a golden Kalash perched on its Shikhar.","o":["pentagonal","circular","hexagonal","octagonal"],"a":3,"e":"octagonal. The Kamakshi Saunsthan temple, built in the late 16th century, is located in the village of Shiroda, Goa. The temple complex, known as 'Sthal' or 'Thal', is accessed through a grand Mahadwar (temple gate) and includes key features like Sabha Mandap (entrance hall), Deepasthambh (lamp tower), a holy water tank, and a square-shaped chowk for Prasad rituals.","s":""},{"n":1921,"t":"Miscellaneous","q":"Consider the following statements related to the Online Dispute Resolution (ODR) handbook.\n1. It will be launched by the Ministry of Science and Technology.\n2. ODR is the resolution for cases outside courts using digital technology and techniques of Alternative Dispute Resolution (ADR), such as negotiation, mediation and arbitration.\n3. The development of ICT and increased use of internet has played a major role for ODR. Which of the given statements is/are correct?","o":["Only 1 and 3","Only 2 and 3","Only 1","Only 2"],"a":1,"e":"Only 2 and 3. Online Dispute Resolution handbook is launched by NITI Ayog. It is developed by Agami and Omidyar India, in association with NITI Aayog and with the support of ICICI Bank, Ashoka Innovators for the Public, Trilegal, Dalberg, Dvara and NIPFP.","s":""},{"n":1922,"t":"Miscellaneous","q":"How is the structure of health infrastructure and health care system in India?","o":["Three-tier system","Five-tier system","Two-tier system","Four-tier system"],"a":0,"e":"Three-tier system. The healthcare system in India is a three-tier structure, with Sub Health Centres, Primary Health Centres, and Community Health Centres, both in urban and rural areas, serving as the pillars of the primary health care system.","s":""},{"n":1923,"t":"Miscellaneous","q":"Which language is known as ‘Italian of the East’ ?","o":["Telugu","Malayalam","Marathi","Kannada"],"a":0,"e":"Telugu. Telugu Language Day is celebrated every year on August\n29. In 2008, Telugu was granted the status of a classical language. Nicolo di Conti, who visited the Vijayanagara Empire, found that the words in the Telugu language end with vowels, just like those in Italian, and hence referred to it as \"The Italian of the East”.","s":""},{"n":1924,"t":"Miscellaneous","q":"To enhance the interoperability between the Indian and Russian Armies, a joint training exercise called _________ commenced at Prudboy Ranges, Volgograd in the year 2021.","o":["INDRA 2021","SURYA KIRAN 2021","VARUNA 2021","SHAKTI 2021"],"a":0,"e":"INDRA 2021. 12th Edition of Indo-Russia Joint Military Exercise INDRA 2021 : Objective - Conduct counter-terror operations under UN mandate. Participation - 250 personnel from India and Russia. Indian Army Contingent - Mechanised Infantry Battalion. The 13th edition of the Indra naval exercise was hosted by India in the Bay of Bengal in November 2023.","s":""},{"n":1925,"t":"Miscellaneous","q":"What kind of technology is most frequently used to manage and digitise e-land records?","o":["Virtual Reality (VR)","Blockchain","Augmented Reality (AR)","Geographic Information System (GIS)"],"a":3,"e":"Geographic Information System (GIS) allows for the effective mapping, analysis, and management of land data by integrating spatial and attribute information. It provides tools for creating detailed maps, analyzing land use patterns, and managing land records efficiently. Blockchain technology can enhance security and transparency, and VR and AR have potential applications.","s":""},{"n":1926,"t":"Miscellaneous","q":"On 12 September 2002, ISRO launched the Kalpana-1 satellite using the Polar Satellite Launch Vehicle. What is the application of this satellite?","o":["Earth observation","Planetary observation","Climate & environment communication","Disaster management system"],"a":2,"e":"Climate & environment communication. Kalpana-1 satellite was originally known as MetSat-1. Launched by vehicle PSLV - C4. On February 5, 2003 it was renamed to Kalpana-1 by the Indian Prime Minister Atal Bihari Vajpayee in memory of Kalpana Chawla (NASA astronaut who perished in the Space Shuttle Columbia disaster).","s":""},{"n":1927,"t":"Miscellaneous","q":"In whose ashram did the Beatles compose rock music in 1968 influenced by classical music?","o":["Osho Rajnish Ashram","Maharshi Aurobindo Ashram","Pandit Ravishankar Ashram","Maharshi Mahesh Yogi Ashram"],"a":3,"e":"Maharshi Mahesh Yogi Ashram. In February 1968, the English rock band the Beatles traveled to Rishikesh (Uttarakhand) to take part in a Transcendental Meditation (TM) training course at Maharshi Mahesh Yogi's Ashram. Maharshi Mahesh Yogi is the founder of the Transcendental Meditation technique.","s":""},{"n":1928,"t":"Miscellaneous","q":"The institute established by Kaka Hathrasi in 1932 is:","o":["Sangeet Karyalaya","Music Art Centre","Music Art Kendra","Swar Sangam Kendra"],"a":0,"e":"Sangeet Karyalaya: Located - Hathras (Uttar Pradesh). The institute was founded with the aim of promoting Indian classical music and preserving the cultural heritage of India. Kaka Hathrasi published the monthly magazine \"SANGEET\" in 1935.","s":""},{"n":1929,"t":"Miscellaneous","q":"Marathi language is in the_______language family","o":["Indo Aryan","Austric","Sino-India","Austro"],"a":0,"e":"Indo Aryan. Marathi is a language spoken in the Indian state of Maharashtra and belongs to the Indo-Aryan branch of the Indo-European language family. It is closely related to languages such as Hindi, Gujarati, and Punjabi. Austric: These are the languages spoken by the Munda or Kol group and spoken in central, eastern, and northeastern India.","s":""},{"n":1930,"t":"Miscellaneous","q":"With which of the following communities is the word 'Langar' (community kitchen) mainly associated?","o":["Sikhism","Hinduism","Jainism","Buddhism"],"a":0,"e":"Sikhism. The concept of “Langar” is an integral part of Sikh culture, symbolizing equality, service, and community bonding. It is commonly served at Gurdwaras (Sikh temples) and was introduced by Guru Nanak (1469-1539). Similar tradition of Annadanam (food donation) exist in Hinduism.","s":""},{"n":1931,"t":"Miscellaneous","q":"Which of the following is NOT one of the classical languages of India?","o":["Odiya","Malayalam","Kannada","Magahi"],"a":3,"e":"Magahi (Magadhi) is an Indo-Aryan language spoken in Bihar, Jharkhand and West Bengal states of eastern India, and in the Terai of Nepal. All the Classical Languages are listed in the Eighth Schedule of the Constitution. Six languages that enjoy the ‘Classical’ status in India: Tamil (declared in 2004), Sanskrit (2005), Kannada (2008), Telugu (2008), Malayalam (2013), and Odia (2014).","s":""},{"n":1932,"t":"Miscellaneous","q":"Oil India Limited (OIL) is under the administrative structure of:","o":["Ministry of Commerce and Industry","Ministry of Power","Ministry of New and Renewable Energy","Ministry of Petroleum and Natural . Gas"],"a":3,"e":"Ministry of Petroleum and Natural Gas. Oil India Limited (OIL) is a Maharatna company. Headquarter -Noida. Established - 1959. For a company to be categorized as a Maharatna status, It should be listed on an Indian stock exchange and have an average annual turnover of over ₹25,000 crore during the previous three years. India now has 14 Maharatna, 24 Navratna and 62 Miniratna CPSEs.","s":""},{"n":1933,"t":"Miscellaneous","q":"In which year was the National Human Rights Commission established in India?","o":["2003","1995","1993","2005"],"a":2,"e":"1993. The National Human Rights Commission (NHRC) was established on October 12, 1993. Its statute is contained in the Protection of Human Rights Act, 1993, and is in conformity with the Paris Principles, adopted for promoting and protecting human rights. Section 2 (d) of the Protection of Human Rights Act, 1993 defines human rights as rights relating to life, liberty, equality and dignity of the individual, guaranteed by the Constitution.","s":""},{"n":1934,"t":"Miscellaneous","q":"Annamacharya composed Sankirtans in praise of which God?","o":["Lord Shiva","Lord Venkateshwara","Lord Rama","Lord Krishna"],"a":1,"e":"Lord Venkateshwara. Annamacharya was a Telugu musician, composer, and a Hindu saint. The Sri Venkateswara Swami Temple is a Hindu temple situated in the hills of Tirumala at Tirupati in Andhra Pradesh.","s":""},{"n":1935,"t":"Miscellaneous","q":"Which is the only surviving specimen of the ancient Sanskrit theatre recognised by UNESCO as a Masterpiece of the Oral and Intangible Heritage of Humanity?","o":["Bhavai","Kutiyattam","Kathakali","Yakshagana"],"a":1,"e":"Kutiyattam. It blends Sanskrit classicism with Kerala's local traditions, featuring expressive eye movements (neta abhinaya) and gestures (hasta abhinaya). Traditionally, it is performed in Kuttampalams, theaters found in Hindu temples.","s":""},{"n":1936,"t":"Miscellaneous","q":"The UIDAI is under the jurisdiction of which of the following ministries?","o":["Ministry of Electronics and Information Technology","Ministry of Home Affairs","Ministry of Education","Ministry of Finance"],"a":0,"e":"Ministry of Electronics and Information Technology. Aadhaar card is a 12-digit unique identification number issued by the Unique Identification Authority of India (UIDAI) to every individual resident of India. It serves as proof of identity, which is linked to the individual's biometric and demographic information. The Aadhaar programme was launched in 2009 by the UIDAI with the goal of providing a unique and verifiable identity for every resident of India.","s":""},{"n":1937,"t":"Miscellaneous","q":"Which of the following statements is/are correct? I. Radio broadcasting started in India in 1923 by the Radio Club of Bombay. II. All India Radio came into being in 1936. III. In 1976, TV was delinked from All India Radio (AIR) and got a separate identity as Door darshan (DD).","o":["I, II and III are correct","Both I and II are correct.","Both II and III are correct.","Only III is correct."],"a":0,"e":"I, II and III are correct. Radio broadcasting was changed to All India Radio (AIR) in 1936 and to Akashwani in 1957. AIR (Akashvani) is India's national public radio broadcaster. It was owned by the Ministry of Information and Broadcasting. AIR originated programming in 23 languages and 179 dialects.","s":""},{"n":1938,"t":"Miscellaneous","q":"Who was the Indian Buddhist monk who is credited with the development of many ancient martial art forms in the 5 th century?","o":["Bodhidharma","Paramartha","Atisa","Bodhiruchi"],"a":0,"e":"Bodhidharma. He was a semi-legendary Buddhist monk who lived during the 5th or 6th century CE. In Indian philosophy, he is commonly considered the founder of Chan Buddhism in China. It was later known as Zen in Japan. Bodhidharma is also credited with founding the famous Shaolin school of Chinese martial arts. He is known as a Tripitaka Dharma Master.","s":""},{"n":1939,"t":"Miscellaneous","q":"In which of the following regions of India is the Mundari language spoken?","o":["Chota-Nagpur plateau","Baghelkhand","Thar desert","Malwa plateau"],"a":0,"e":"Chota-Nagpur plateau. This plateau covers parts of Jharkhand, Chhattisgarh, Odisha, and West Bengal. Mundari is a Munda language, belonging to the Austroasiatic language family. Chhota Nagpur plateau is called the “Heart of industrial India” because it is rich in minerals and power fuels. The highest mountain peak of Chota Nagpur Plateau is Parasnath.","s":""},{"n":1940,"t":"Miscellaneous","q":"Which is an advanced weather satellite of India configured with improved imaging system and atmospheric sounder ?","o":["GSAT-7A","INSAT -3D","RS-D1","SROSS-2"],"a":1,"e":"INSAT - 3D: Launched -2013; Launch Vehicle - Ariane-5 VA-214. Important Satellites: SARAL (2013): Climate & Environment, Earth Observation. RISAT-1 (2012): Earth Observation. RISAT-2 (2009): Earth Observation. Bhaskara-I (1979): Earth Observation, Experimental. GSAT-7A (2018): Communication. Rohini Satellite RS-D1 (1981): Earth Observation.","s":""},{"n":1941,"t":"Miscellaneous","q":"Rajasthani architecture is also known as:","o":["Indo-Saracenic","Maru-Gurjara","Greco-Roman","Sharqi"],"a":1,"e":"Maru-Gurjara architecture. This style of architecture evolved in the region of Rajasthan and Gujarat, blending regional traditions with elements of Hindu, Jain, and Mughal architecture. The term \"Maru\" refers to the desert region (Marwar) of Rajasthan, and \"Gurjara\" refers to the region of Gujarat, highlighting the cultural influence from both areas.","s":""},{"n":1942,"t":"Miscellaneous","q":"Sashastra Seema Bal is the lead intelligence unit for the_________and Bhutan borders and the coordinating agency for national security activities.","o":["Nepal","Myanmar","Pakistan","Bangladesh"],"a":0,"e":"Nepal. Sashastra Seema Bal (SSB) was established as the Special Service Bureau in May 1963. Headquarter - New Delhi. Motto - Service, Security and Brotherhood. The Border Security Force (BSF) is responsible for the Bangladesh and Pakistan borders, while the Indo-Tibetan Border Police (ITBP) oversees the border with China.","s":""},{"n":1943,"t":"Miscellaneous","q":"Which geostationary weather satellite launched by the European Space Agency in 1977 that provides weather imaging of Earth at both visible light and infrared wavelengths?","o":["Himawari","Meteosat","QuikSCAT","Landsat"],"a":1,"e":"Meteosat - The first European geostationary weather satellite, launched in November 1977 by the European Space Agency (ESA). Himawari is a Japanese weather satellite series. QuikSCAT was a NASA satellite that measured ocean winds. Landsat is a series of Earth observation satellites focused on land use, geology, and natural resources, not specifically weather imaging.","s":""},{"n":1944,"t":"Miscellaneous","q":"________ is a mode of communication in itself, and it also regulates the use of other means of communication.","o":["Television","Phone","Satellite","Radio"],"a":2,"e":"Satellite. On the basis of configuration and purposes, satellite systems in India can be grouped into two: Indian National Satellite System (INSAT, established in 1983) and Indian Remote Sensing Satellite System (IRS, established in 1988). A communication satellite is an artificial satellite that amplifies and relays radio signals between a transmitter and receiver on Earth. Notable communication satellites: GSAT-31; GSAT-7A; GSAT-11; EDUSAT.","s":""},{"n":1945,"t":"Miscellaneous","q":"Who among the following designed the India Gate ?","o":["Lord Wavell","Lord Dalhousie","Edwin Lutyens","John Nash"],"a":2,"e":"Edwin Lutyens. India Gate was constructed in 1931. The India Gate is a war memorial located astride the Kartavya path (formerly Raj path) on the eastern edge of the ‘ceremonial axis’ of New Delhi.","s":""},{"n":1946,"t":"Miscellaneous","q":"The Rajgir Zoo is located in which of the following states?","o":["Tamil Nadu","Madhya Pradesh","Gujarat","Bihar"],"a":3,"e":"Bihar. Zoos in India : Sri Chamarajendra Zoological Gardens (Karnataka), Nandankanan Zoological Park (Odisha), Rajiv Gandhi Zoological Park (Maharashtra).","s":""},{"n":1947,"t":"Miscellaneous","q":"What was the style of architecture used in Laxmi Vilas Palace of Vadodara, Gujarat ?","o":["Indo-Islamic","Hindu Temple","Indo-Saracenic","Mughal"],"a":2,"e":"Indo-Saracenic . Laxmi Vilas Palace of Vadodara was built by Maharaja Sayajirao Gaekwad III in 1890 .","s":""},{"n":1948,"t":"Miscellaneous","q":"Rani - Ki - Vav (the Queen's stepwell) is situated on the banks of which river ?","o":["Ganga","Yamuna","Krishna","Saraswati"],"a":3,"e":"Saraswati. Rani-ki-Vav (UNESCO World Heritage Site) - Its construction is attributed to Udayamati (the spouse of the 11th-century Chaulukya king Bhima - 1) in Patan (Gujarat). It is on the new 100 rupee note (coloured Lavender).","s":""},{"n":1949,"t":"Miscellaneous","q":"The famous Sheesh Mahal in Punjab was built by which of the following rulers?","o":["Maharaja Sawai Pratap Singh","Rana Kumbha","Maharaja Narinder Singh","Raja Man Singh - I"],"a":2,"e":"Maharaja Narinder Singh. Sheesh Mahal - It is located in Patiala (Punjab).","s":""},{"n":1950,"t":"Miscellaneous","q":"How many UNESCO Natural World Heritage sites are there in India?","o":["Seven","Four","Six","Five"],"a":0,"e":"Seven. UNESCO (United Nations Educational, Scientific and Cultural Organization) World Heritage Convention which was established in 1972.","s":""},{"n":1951,"t":"Miscellaneous","q":"Lomas Rishi cave is situated in which of the following Hills?","o":["Vindhyas Hills","Barabar Hills","Aravali Hills","Satpura Hills"],"a":1,"e":"Barabar Hills (Bihar). It was constructed by emperor Ashoka for the use of Ajivaka. Buddhist, Hindu and Jain sculptures are also found there. It includes four caves - Lomas Rishi Caves, Sudama caves, Vishwakarma Caves, and Karan Chaupar caves. The Barabar Hill Caves are the oldest surviving rock-cut caves in India.","s":""},{"n":1952,"t":"Miscellaneous","q":"Rabindranath Tagore started Shantiniketan institute in ___________.","o":["1905","1901","1903","1899"],"a":1,"e":"1901. Santiniketan literally means “abode of peace” in Bengali.","s":""},{"n":1953,"t":"Miscellaneous","q":"Which of the following is NOT a family in classification of Modern Indian Languages ?","o":["Indo - European","Sino - Tibetan","Indo - African","Dravidian"],"a":2,"e":"Indo-african. People of India speak a large number of languages which are broadly divided into the following four families: Indo-European Family (Arya), Dravidian Family (Dravida), Austric Family (Nishada), and Sino Tibetan Family (Kirata).","s":""},{"n":1954,"t":"Miscellaneous","q":"Who hosted the first meeting of India-Central Asia Summit?","o":["India","Kyrgyzstan","Kazakhstan","Tajikistan"],"a":0,"e":"India. Prime Minister Shri Narendra Modi hosted the first meeting of the India-Central Asia Summit on 27 January 2022.","s":""},{"n":1955,"t":"Miscellaneous","q":"India’s short-range Ballistic Missile, Prithvi Il was successfully test fired from _____.","o":["Rutland Island, Andaman","Sriharikota, Andhra Pradesh","Machilipatnam, Andhra Pradesh","Chandipur, Odisha"],"a":3,"e":"Chandipur, Odisha. Submarine Launched Ballistic Missiles -Ashwin, Sagarika, K-4 and K-5. Surface -to-surface Missiles - Prithvi I, Prithvi II, Agni (I - V), Dhanush, Prahar and Shaurya (Medium-Range Ballistic Missile).","s":""},{"n":1956,"t":"Miscellaneous","q":"The world's highest motorable road passes through_________pass in India, as of 2022.","o":["Khunjerab","Rohtang","Dihang","Umling La"],"a":3,"e":"Umling La. It connects Chisumle and Demchok village. The Border Roads Organization (BRO) has constructed the road at an altitude of 19,300 feet. Highest motorable roads in India - Dungri La (Uttarakhand,18,406 ft), Marsimik La (Jammu & Kashmir, 18,314 ft), Donkia La (Sikkim,18,045 ft), Photi La, (Jammu & Kashmir - 18,124 ft), Khardung La (Jammu & Kashmir - 17,583 ft) etc.","s":""},{"n":1957,"t":"Miscellaneous","q":"Market Based Economic Dispatch (MBED) Mechanism is related with which of the following ministry?","o":["Ministry of Power","Ministry of Corporate Affairs","Ministry of Finance","Ministry of Micro, Small and Medium Enterprises"],"a":0,"e":"The Ministry of Power . The Electricity Act, 2003 - An Act to consolidate the laws relating to generation, transmission, distribution, trading and use of electricity.","s":""},{"n":1958,"t":"Miscellaneous","q":"Intermediate Range Ballistic Missile Agni-4 has been successfully test fired in _________.","o":["Pokhran Firing Range, Rajasthan","Neil Island, Andaman and Nicobar Islands","Sriharikota, Andhra Pradesh","APJ Abdul Kalam Island, Odisha"],"a":3,"e":"APJ Abdul Kalam Island, Odisha. The Agni-IV (range 4000 Km) is a two-stage surface-to-surface missile. It has been developed by DRDO (Defence Research and Development Organisation).","s":""},{"n":1959,"t":"Miscellaneous","q":"Which among the following is a surface-to-surface missile of India?","o":["Javelin","AIM-120 AMRAAM","Spike","Agni V"],"a":3,"e":"Agni V { (range around 5000 km - 5500 km), developed by Defence Research and Development Organisation} is a ballistic missile developed under the Integrated Guided Missile Development Programme (IGMDP). On October 27, 2021, (test fired on) the country celebrated 75th infantry day. The missiles developed under IGMDP (established in 1983) are Prithvi, Agni, Trishul, Akash, Nag.","s":""},{"n":1960,"t":"Miscellaneous","q":"The S-400 Triumf (Russian for Triumph) Missile System is _____ missile defence system designed in Russia.","o":["air - to - underwater","surface - to - air","surface - to - surface","air - to - air"],"a":1,"e":"surface - to - air. This System is an anti-aircraft missile defence system developed by Russia's Almaz Central Design Bureau.","s":""},{"n":1961,"t":"Miscellaneous","q":"“Statue of Equality” has been inaugurated in Hyderabad in the memory of ________ .","o":["Saint Ramanujacharya","Swami Vivekananda","Swami Dayananda","Shri Ravi Das"],"a":0,"e":"Saint Ramanujacharya. Statue of Equality: Height - 216 feet. Material - Panchaloha. Statue of Unity -Tallest statue in world - 182 meters -Located in Kevadia, Narmada District, Gujarat. Swami Vivekanand Statue - 33 ft tall - Ranchi Jharkhand.","s":""},{"n":1962,"t":"Miscellaneous","q":"Chandigarh International Airport has been renamed as__________","o":["Manmohan Singh International Airport","Shaheed Bhagat Singh International Airport","Guru Gobind Singh International Airport","Rajguru International Airport"],"a":1,"e":"Shaheed Bhagat Singh International Airport (Chandigarh , Punjab) . Guru Gobind Singh Airport (Maharashtra). Amritsar International Airport renamed as Sri Guru Ram Das Jee International Airport (Amritsar, Punjab). Netaji Subhash Chandra Bose International Airport (Kolkata). Bharat Ratna Babasaheb Dr. B.R. Ambedkar International Airport (Nagpur, Maharashtra).","s":""},{"n":1963,"t":"Miscellaneous","q":"When was the None of the Above (NOTA) ballot option first implemented in India?","o":["2015","2004","2013","2010"],"a":2,"e":"2013. \"None of the above\" (NOTA): It does not hold any electoral value, it allows the voter to indicate disapproval of all of the candidates, it does not provide for a ‘right to reject’.","s":""},{"n":1964,"t":"Miscellaneous","q":"When was 'Vayudoot' airline setup in India?","o":["1981","1991","1971","1969"],"a":0,"e":"1981. The airline was headquartered at New Delhi's Safdarjung Airport. It ceased operations on 1 April\n1997. Air India (J.R.D Tata , 1932,). Kingfisher airlines (Vijay Mallya, 2003, Ceased operations: 20 October 2012).","s":""},{"n":1965,"t":"Miscellaneous","q":"The railway system connecting St - Petersburg to Vladivostok is _______.","o":["The Altai Railway","The Amur Railways","Trans - Baikal Railway","Trans - Siberian Railways"],"a":3,"e":"The Trans-Siberian Railway is the longest railway system connecting St. Petersburg in Western Russia to Vladivostok on the Pacific coast. India's longest distance train (Vivek Express -Dibrugarh to Kanyakumari-4189 km).","s":""},{"n":1966,"t":"Miscellaneous","q":"At present, the Grand Trunk Road extends from___________ in India.","o":["Kashmir to Kanyakumari","Amritsar to Kolkata","Chennai to Kolkata","Agra to Kolkata"],"a":1,"e":"Amritsar to Kolkata . Grand Trunk Road was built by Sher Shah Suri in the 16th century. National Highway 1 is known as Sher Shah Suri Marg.","s":""},{"n":1967,"t":"Miscellaneous","q":"Which city is called the ‘Manchester of India’?","o":["Ludhiana","Visakhapatnam","Hyderabad","Ahmedabad"],"a":3,"e":"Ahmedabad - Boston of East' . Visakhapatnam - City of Destiny,. Jaipur - Pink City. Surat - Silk City of India, Diamond City of India. Akola - Cotton City of India. Coorg (Karnataka) - Scotland of India.","s":""},{"n":1968,"t":"Miscellaneous","q":"The National Archives of India came up in the ______.","o":["1930s","1910s","1920s","1900s"],"a":2,"e":"1920s. The Imperial Record Department (Now- The National Archives of India) was set up on 11 March 1891 in Calcutta (Kolkata). In 1926 the Department was shifted into its new building in New Delhi. It is the biggest archival repository in South Asia.","s":""},{"n":1969,"t":"Miscellaneous","q":"Which of the following statements is/are true about the communication development in India?\nA. TV services began in India before Independence.\nB. TV was delinked from All India Radio.\nC. Doordarshan got a separate identity in 1976.","o":["Only C","Both A and B","Both A and C","Both B and C"],"a":3,"e":"Both B and C. Television started in India on September 15, 1959. Doordarshan (1959), Headquarters-New Delhi. All India Radio (AIR), officially known since 1957 as Akashvani is the national public radio broadcaster of India and is a division of Prasar Bharati. It was established in 1936.","s":""},{"n":1970,"t":"Miscellaneous","q":"Air transport was launched in India in the year 1911 between which two places?","o":["Allahabad and Naini","Allahabad and Jaipur","Allahabad and Kanpur","Allahabad and Delhi"],"a":0,"e":"Allahabad and Naini (short distance of 10km). Indian National Airways (1933, between Karachi and Lahore). Airports Authority of India {Founded (1 April 1995), Headquarters (New Delhi), Longest air route in India {Srinagar ( J&K ) to Port Blair ( Andaman and Nicobar )}.","s":""},{"n":1971,"t":"Miscellaneous","q":"What was the former name of the Yamuna Expressway Project constructed in Uttar Pradesh, India?","o":["Purvanchal Expressway","Taj Expressway","Noida-Agra Expressway","Kennedy Expressway"],"a":1,"e":"Taj Expressway . It is presently India's 3rd longest expressway since February 2017.","s":""},{"n":1972,"t":"Miscellaneous","q":"Which of the following is the first six-lane expressway in India?","o":["Grand Trunk Road","Ahmedabad–Vadodara National Expressway","Mumbai–Pune Expressway","Yamuna Expressway"],"a":2,"e":"Mumbai Pune Expressway . Purvanchal Expressway (Lucknow-Ghazipur).Yamuna Expressway (Noida to Agra).","s":""},{"n":1973,"t":"Miscellaneous","q":"The Barabati Fort is situated in the city of.","o":["Guwahati","Cuttack","Madurai","Raipur"],"a":1,"e":"Cuttack. More Forts in Odisha: Chudanga Gada Fort (Bhubaneswar), Raibania Fort (Baleswar district), Sisupalgarh Fort (Bhubaneswar), Asurgarh Fort (Kalahandi district), Potagarh Fort. Gulbarga Fort -Karnataka.","s":""},{"n":1974,"t":"Miscellaneous","q":"The aviation sector was inaugurated in India in the year _____ with the establishment of Tata Airlines.","o":["1925","1932","1929","1935"],"a":1,"e":"1932 . The airline, founded by J.R.D Tata, started as an airmail carrier within India after winning a contract with Imperial Airways. The airline flew its inaugural flight in October 1932, flying from Karachi to Mumbai.","s":""},{"n":1975,"t":"Miscellaneous","q":"Who among the following founded the ‘Shillong Chamber Choir’ ?","o":["Neil Nongkynrih","Madhup Mudgal","Debashish Chaudhuri","António Fortunato de Figueiredo"],"a":0,"e":"Neil Nongkinrih . The Shillong Chamber Choir, established in 2001, is a multi-genre choir, which won the reality TV show India's Got Talent in 2010.","s":""},{"n":1976,"t":"Miscellaneous","q":"In which year was the ‘Lotteries Regulation Act’ passed?","o":["1998","1993","1999","1991"],"a":0,"e":"1998. The Lotteries Regulation Act, 1998 is an important piece of legislation that lays down thorough guidelines for the central government to conduct lotteries in India.","s":""},{"n":1977,"t":"Miscellaneous","q":"Which of the following is an indigenous dairy breed of cattle?","o":["Red Sindhi","Chippiparai","Kanni","Kombai"],"a":0,"e":"Red Sindhi is a reputed heat tolerant milch cattle breed originating from Sindh province of Pakistan. The Chippiparai is a breed of sighthound from Tamil Nadu in southern India. The Kanni is a rare indigenous South Indian sighthound breed of dog. The Kombai or Polygar dog is a breed of sighthound native to Tamil Nadu.","s":""},{"n":1978,"t":"Miscellaneous","q":"______ is one of the languages in which the denomination is printed on the reverse of a contemporary Indian currency note.","o":["Burmese","Sinhala","Nepali","Dzongkha"],"a":2,"e":"Nepali . Sinhala, is an Indo -Aryan language primarily spoken by the Sinhalese people of Sri Lanka.","s":""},{"n":1979,"t":"Miscellaneous","q":"Who among the following was a saint from Maharashtra?","o":["Dadu Dayal","Chokhamela","Bhakhan","Sundar Das"],"a":1,"e":"Chokhamela . Dadu Dayal was a poet - saint from Gujarat.","s":""},{"n":1980,"t":"Miscellaneous","q":"For which of the following productions is the Ramagundam power plant famous ?","o":["hydroelectricity","nuclear energy","thermal energy","Bio-gas"],"a":2,"e":"Thermal energy. Ramagundam power plant - It is part of the National Thermal Power Corporation, a 2600 MW power station located in Ramagundam, Telangana.","s":""},{"n":1981,"t":"Miscellaneous","q":"Which of the following is the name of the spacecraft developed by SpaceX for NASA’s manned mission to the International Space Station?","o":["Crew Centaurus","Crew Dragon","Crew Shark","Crew Aries"],"a":1,"e":"Crew Dragon is the name of the spacecraft developed by SpaceX for NASA’s manned mission to the International Space Station. NASA headquarters is in Washington DC.","s":""},{"n":1982,"t":"Miscellaneous","q":"Which is the national heritage animal of India?","o":["Lion","Horse","Tiger","Elephant"],"a":3,"e":"Elephant ( 2010). Project Elephant (PE) was launched by the Government of India in the year 1992.","s":""},{"n":1983,"t":"Miscellaneous","q":"Unique Transaction Reference number is a ______ character code used to uniquely identify a transaction in the RTGS system.","o":["17","34","22","45"],"a":2,"e":"22. Unique Transaction Reference number used to uniquely identify a transaction in the RTGS system. It is used to identify a specific bank transaction in India. All banks in India use UTR numbers for all types of money transfers.","s":""},{"n":1984,"t":"Miscellaneous","q":"Who among the following was the founder of Homeopathy?","o":["Samuel Hahnemann","FG Hopkins","Robert Koch","Selman Waksman"],"a":0,"e":"Samuel Hahnemann espoused the law of cure known as \"Similia Similibus Curentur\", or \"Like Cures Like\".","s":""},{"n":1985,"t":"Miscellaneous","q":"SIMBEX is a military exercise conducted between the defense forces of which of the following nations?","o":["India and Thailand","India and Singapore","India and the US","India and Sri Lanka"],"a":1,"e":"India and Singapore. India and Thailand (Maitree, CORPAT), India and the US (Vajra Prahar, Yudh Abhyas), India and Sri Lanka (Mitra Shakti).","s":""},{"n":1986,"t":"Miscellaneous","q":"Who among the following is the founder of the field of psychoanalysis?","o":["Carl Jung","Kai T Erikson","Jean Piaget","Sigmund Freud"],"a":3,"e":"Sigmund Freud. Carl Jung -Founded analytical psychology. Kai T Erikson - specializing in the social consequences of catastrophic events. Jean Piaget - Worked on child development.","s":""},{"n":1987,"t":"Miscellaneous","q":"Which of the following is the largest sea bird with the longest wingspan?","o":["Frigatebird","Booby","Wandering Albatross","Auk"],"a":2,"e":"Wandering Albatross . The maximum dimensions in this species are a length of 1.44 m (4.7 ft) and a wingspan of 3.65 m (12.0 ft).","s":""},{"n":1988,"t":"Miscellaneous","q":"‘Oolong’ is a variant of ______.","o":["jute","tea","rubber","coffee"],"a":1,"e":"Tea. Oolong - It is a traditional semi-oxidized Chinese tea. It is made from the leaves of the Camellia Sinensis plant. The same plant is used to make Green tea and Black tea.","s":""},{"n":1989,"t":"Miscellaneous","q":"Hakki, Pikki and Siddi are _________ from Karnataka.","o":["language","Theater form","Music type","dance form"],"a":0,"e":"Language. These languages are critically endangered in Karnataka. Hakki, Pikki and Siddi is a mix of Konkani, Kannada and Hindi. Kannada is the official language of Karnataka.","s":""},{"n":1990,"t":"Miscellaneous","q":"In which year was the Marine Products Export Development Authority (MPEDA) established in India?","o":["1948","1974","1947","1972"],"a":3,"e":"1972. The Marine Products Export Development Authority (MPEDA) is a statutory body that was established under the Ministry of Commerce and Industry for the promotion of the export of marine products from India.","s":""},{"n":1991,"t":"Miscellaneous","q":"Since 2000, Euro norms are followed in India under the name ______ Stage Emission Standards for four wheeled vehicles.","o":["Bharat","Jagat","India","Hindustan"],"a":0,"e":"Bharat . Vehicle emission norms were introduced in India in 1991 for petrol and in 1992 for diesel vehicles.","s":""},{"n":1992,"t":"Miscellaneous","q":"When was the Editors Guild of India founded?","o":["1982","1978","1956","1989"],"a":1,"e":"1978. It was established with the twin objectives of protecting press freedom and raising the standards of editorial leadership of newspapers and magazines.","s":""},{"n":1993,"t":"Miscellaneous","q":"Where was the first factory of the Indian Iron and Steel Company (IISCO) set up?","o":["Durgapur","Jabalpur","Jamshedpur","Hirapur"],"a":3,"e":"Hirapur. IISCO Steel Plant of Steel Authority of India Limited is an integrated steel plant located at Hirapur (later to be called Burnpur) in the Asansol subdivision of Paschim Bardhaman district, West Bengal.","s":""},{"n":1994,"t":"Miscellaneous","q":"Where is the Rumi Darwaza located?","o":["Lucknow","Gwalior","Agra","Bhopal"],"a":0,"e":"Lucknow . It is an imposing gateway that was built by Nawab Asaf-Ud-Daula in 1784.","s":""},{"n":1995,"t":"Miscellaneous","q":"In the context of forest conservation, Navadanya Movement was founded in 1987 by ______.","o":["Medha Patkar","Vandana Shiva","Baba Amte","Pandurang Hegde"],"a":1,"e":"Vandana Shiva. Navdanya is an Indian-based non-governmental organization that promotes biodiversity conservation, biodiversity, organic farming, the rights of farmers, and the process of seed saving.","s":""},{"n":1996,"t":"Miscellaneous","q":"How many windows are there on the outside walls of Hawa Mahal of Jaipur?","o":["965","964","953","973"],"a":2,"e":"953. Hawa Mahal of Jaipur was designed by Lal Chand Ustad.","s":""},{"n":1997,"t":"Miscellaneous","q":"In which color are the railway lines and telephone lines shown in the topographic map?","o":["Blue","Yellow","Black","Red"],"a":2,"e":"Black - Railroads, boundaries, telephone lines. Brown -Topographic contours . Blue - Lakes, streams, irrigation ditches and other hydrographic features Red - Land grids and important roads.","s":""},{"n":1998,"t":"Miscellaneous","q":"Which of the following was previously known as 'the Lady Willingdon Park'.","o":["Buddha Jayanti Park","Mughal Gardens","Deer Park","Lodhi Garden"],"a":3,"e":"Lodhi Garden. Lady Willingdon Park was inaugurated in April 1936.","s":""},{"n":1999,"t":"Miscellaneous","q":"Which ISO certification pertains to Environmental Management Systems?","o":["9001","22000","14001","27001"],"a":2,"e":"14001. ISO 22000 - It is an international standard for food safety established by the International Organization for Standardization.","s":""},{"n":2000,"t":"Miscellaneous","q":"Who designed the logo for Lokpal in India?","o":["Deepak Punia","Prashant Mishra","Kamareddy","B.P.Raju"],"a":1,"e":"Prashant Mishra. The logo of Lokpal: LOK - people and PAL -caretaker, i.e. \"caretaker of people”.","s":""}];
const PAGE=20,KEY='static_gk_quiz_v1',L='ABCD';
const topics=[],by={};
DATA.forEach(q=>{if(!by[q.t]){by[q.t]=[];topics.push(q.t)}by[q.t].push(q)});
let ans={};try{ans=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
let cur=topics[0],shown=0;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
$('sub').textContent=DATA.length.toLocaleString()+' questions across '+topics.length+' topics';
const tabs=$('tabs');
topics.forEach(t=>{const b=el('button','tab');b.setAttribute('role','tab');b.dataset.t=t;
 b.append(el('span','n',by[t].length),el('span','l',t));b.onclick=()=>select(t,true);tabs.append(b)});
$('al').onclick=()=>tabs.scrollBy({left:-260,behavior:'smooth'});
$('ar').onclick=()=>tabs.scrollBy({left:260,behavior:'smooth'});
function select(t,scroll){cur=t;shown=0;
 [...tabs.children].forEach(b=>{const on=b.dataset.t===t;b.setAttribute('aria-selected',on);if(on)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
 $('list').innerHTML='';more();stats();
 if(scroll){const h=document.querySelector('.tabbar').offsetHeight;window.scrollTo({top:Math.max(0,$('stats').getBoundingClientRect().top+scrollY-h-8),behavior:'smooth'})}}
function stats(){const s=$('stats'),arr=by[cur];let a=0,c=0;
 arr.forEach(q=>{const v=ans[q.n];if(v!==undefined){a++;if(v===q.a)c++}});
 s.innerHTML='';
 const row=el('div');row.style.cssText='display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;width:100%';
 const m=(l,v)=>{const sp=el('span');sp.append(l+' ',Object.assign(el('b'),{textContent:v}));return sp};
 const att=arr.filter(q=>typeof ans[q.n]==='number').length;
 row.append(m('Answered',a+' of '+arr.length),m('Correct',c),m('Accuracy',att?Math.round(100*c/att)+'%':'0%'));
 const sp=el('span','sp');const r=el('button','btn','Reset topic');
 r.onclick=()=>{if(confirm('Clear your answers for '+cur+'?')){arr.forEach(q=>delete ans[q.n]);save();select(cur,false)}};
 row.append(sp,r);const bar=el('div','bar');const i=el('i');i.style.width=(100*a/arr.length)+'%';bar.append(i);
 s.append(row,bar)}
function card(q,idx,total){
 const c=el('article','card');
 const h=el('div','qh');h.append(el('span',null,'Question '+idx+' of '+total));if(q.s)h.append(el('span','src',q.s));
 const stem=el('p','stem',q.q);const o=el('div','opts');
 const res=el('div','res');
 const btns=q.o.map((t,i)=>{const b=el('button','opt');b.append(el('span','k',L[i]),el('span','t',t));b.onclick=()=>pick(i);o.append(b);return b});
 const show=el('button','btn show','Show answer');show.onclick=()=>{ans[q.n]='r';save();paint();stats()};
 function paint(){const v=ans[q.n];if(v===undefined)return;
  c.classList.add('done');res.innerHTML='';
  btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('ok','bad','dim');
   if(i===q.a)b.classList.add('ok');else if(i===v)b.classList.add('bad');else b.classList.add('dim')});
  const vd=el('div','verdict '+(v===q.a?'ok':v==='r'?'rv':'bad'),v===q.a?'Correct':v==='r'?'Answer revealed':'Incorrect');
  const ex=el('div','exp');ex.append(Object.assign(el('span','ans'),{textContent:'Answer: '+L[q.a]+'. '+q.o[q.a]}));
  if(q.e){ex.append(document.createTextNode('\n'+q.e))}
  res.append(vd,ex)}
 function pick(i){if(ans[q.n]!==undefined)return;ans[q.n]=i;save();paint();stats()}
 c.append(h,stem,o,show,res);paint();return c}
function more(){const arr=by[cur],end=Math.min(arr.length,shown+PAGE),f=document.createDocumentFragment();
 for(let i=shown;i<end;i++)f.append(card(arr[i],i+1,arr.length));
 $('list').append(f);shown=end;const b=$('more');
 b.hidden=shown>=arr.length;b.textContent='Load '+Math.min(PAGE,arr.length-shown)+' more ('+(arr.length-shown)+' remaining)'}
$('more').onclick=more;
const topBtn=$('top');addEventListener('scroll',()=>topBtn.classList.toggle('on',scrollY>500),{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
select(cur,false);
</script>
