hak","o":["A–3, B–3, C–2, D–1","A–4, B–3, C–2, D–1","A–3, B–1, C–4, D–2","A–2, B–3, C–1, D–4"],"a":0,"e":"A–3, B–3, C–2, D–1.","s":""},{"n":309,"t":"Arts Personality","q":"Consider the following statements about Padmaja Reddy:\n1. She is Telangana’s first Padma Bhushan award winner.\n2. She is known for developing the Kuchipudi dance form Mohiniyam and received the Sangeet Natak Akademi Award in 2000.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. She is Telangana’s first Sangeet Natak Akademi Award winner, not Padma Bhushan awardee. She developed Kakatiyam, not Mohiniyam, and received the Sangeet Natak Akademi Award in 2015, not 2000.","s":""},{"n":310,"t":"Arts Personality","q":"Consider the following statements:\n1. Bade Fateh Ali Khan and Ali Baksh Jarnail Khan were the founders of the Patiala Gharana.\n2. Malika Pukhraj, Gauhar Jan, and Ghulam Ali are all associated with the Patiala Gharana.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":311,"t":"Arts Personality","q":"Consider the following statements:\n1. L. Subramaniam is a violin virtuoso globally famous for Hindustani music, and has received honours including the Padma Shri (1988) and Padma Bhushan (2001).\n2. Appa Jalgaonkar, a renowned harmonium player, was awarded the Sangeet Natak Akademi Award in 2000.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. L. Subramaniam is globally known for Carnatic music, not Hindustani music.","s":""},{"n":312,"t":"Arts Personality","q":"Consider the following statements about Hari Prasad Chaurasia:\n1. He is associated with the Senia Gharana, founded by Bilas Khan and Naubat Khan.\n2. His official biography “Breath of Gold” (2019) was authored by Amitav Ghosh.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . Breath of Gold was authored by Sathya Saran, not Amitav Ghosh","s":""},{"n":313,"t":"Arts Personality","q":"Which extraordinary scholar and artist of the 17th century AD composed Bhaamaakalaapam, a dance drama based on Kuchipudi?","o":["Sachindra Yogi","Shivendra Yogi","Siddhendra Yogi","Sidharth Yogi"],"a":2,"e":"Siddhendra Yogi. Bhama Kalapam (story of Satyabhama, wife of the god Krishna). Most popular classical dance-dramas, Kathakali (sage Bharata).","s":""},{"n":314,"t":"Arts Personality","q":"Mallika Sarabhai was honoured by the________government with Chevalier des Palmes Academiques 2005.","o":["French","Canadian","Swiss","Belgian"],"a":0,"e":"French. Mallika Sarabhai (Bharatanatyam and Kuchipudi dancer ) -Padma Bhushan (2010). Book - In Free Fall: My Experiments With Living. Founder of Darpana dance Academy.","s":""},{"n":315,"t":"Arts Personality","q":"The Sabri brothers, Aziz Warsi and Nusrat Fateh Ali Khan are associated with which singing style?","o":["Qawwali","Shabad","Bhatiali","Bhajan"],"a":0,"e":"Qawwali. Nusrat Fateh Ali Khan (President of Pakistan Award for Pride of Performance by the Government of Pakistan). Indian folk music -Bhavageethe (Karnataka and Maharashtra), Bhangra and Giddha (Punjab), Lavani (Maharashtra). Alha (Madhya Pradesh) and Panihari, Pankhida and Maand (Rajasthan).","s":""},{"n":316,"t":"Arts Personality","q":"Consider the following statements about Laxmipriya Mohapatra:\n1. She was associated with the Indian classical dance form Kuchipudi.\n2. She was the first woman to perform both Gotipua and Odissi on stage.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. She was associated with Odissi.","s":""},{"n":317,"t":"Arts Personality","q":"Consider the following statements about Ileana Citaristi:\n1. She is the first classical dancer of foreign origin to receive the Padma Shri (2006) for her contribution to Kathak.\n2. She is trained in both Odissi and Chhau dance forms and has also received the Leonide Massine for the Art of Dance Award (Italy, 1992).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Awards: 43rd National Film Awards (1996), Padma Shri (2006), Leonide Massine for the Art of Dance (Italy, 1992), Sanskriti Siromani (2006), Lalithakala award (2007), Pandit Jasraj Award (2009), Prananath Patnaik Award (2005).","s":""},{"n":318,"t":"Arts Personality","q":"Who was hailed as the ‘Tansen of the 20th century’?","o":["Ustad Abdul Karim Khan","Ustad Faiyaz Khan","Ustad Amir Khan","Ustad Bade Ghulam Ali Khan"],"a":3,"e":"Ustad Bade Ghulam Ali Khan (Patiala gharana). Awards - Sangeet Natak Akademi Award (1962), Sangeet Natak Akademi fellow (1967), Padma Bhushan Award (1962). Ustad Abdul Karim Khan (founder of the Kairana gharana of classical music). Ustad Faiyaz Khan (exponent of the Agra gharana). Ustad Amir Khan (founder of the Indore gharana of Classical Music).","s":""},{"n":319,"t":"Arts Personality","q":"Who among the following dancers was awarded the Queen Victoria Silver Medal of the Royal Society for the Prevention of Cruelty to Animals, London in 1958 ?","o":["Sitara Devi","Sonal Mansingh","Sanjukta Panigrahi","Rukmini Devi Arundale"],"a":3,"e":"Rukmini Devi Arundale (Bharatanatyam). Awards: Padma Bhushan (1956), Sangeet Natak Akademi Award (1957), Prani Mitra Award (1968).","s":""},{"n":320,"t":"Arts Personality","q":"Consider the following statements about Meenakshi Pillai:\n1. She achieved fame for the Vazhuvoor school of Bharatanatyam.\n2. Other prominent styles of Bharatanatyam include Vazhuvoor (propagated by Vazhuvoor B. Ramiah Pillai and his ancestors) and Melattur (propagated by Guru Mangudi Dorairaj).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only . She achieved fame for the Pandanallur school, not Vazhuvoor.","s":""},{"n":321,"t":"Arts Personality","q":"Match the following artists with their respective classical dance forms or instruments: Artist Dance Form / Instrument\nA. Tankeswar 1. Bharatanatyam Hazarika Borbayan\nB. Madhavi Mudgal 2. Saxophone\nC. Kadri Gopalnat 3. Odissi\nD. Radha Sridhar 4. Sattriya","o":["A–4, B–3, C–2, D–1","A–3, B–4, C–2, D–1","A–4, B–1, C–3, D–2","A–2, B–3, C–4, D–1"],"a":0,"e":"A–4, B–3, C–2, D–1.","s":""},{"n":322,"t":"Arts Personality","q":"Consider the following statements about Dr. N. Rajam:\n1. She is renowned for her mastery over the violin.\n2. She is one of India’s most prominent violinists, alongside artists such as Abhijith P. S. Nair, B. Sasikumar, and Kala Ramnath.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":324,"t":"Arts Personality","q":"Match the following Personalities with their Field of Art/Contribution:\nList – I List – II (Personalities / (Association / Field) Artists)\nA. Pandit Rajendra 1. Santoor & music of Gangani films Silsila, Chandni\nB. Pandit Shivkumar 2. Jaipur Gharana Sharma exponent of Kathak\nC. Minati Mishra 3. Odissi dance & Padma Shri awardee (2012)\nD. Chitti Babu 4. Veena maestro from South India\nE. Yog Sunder Desai 5. Founder of Indian Revival Group, born in Gujarat","o":["A-2, B-1, C-3, D-4, E-5","A-3, B-2, C-4, D-5, E-1","A-4, B-5, C-2, D-3, E-1","A-1, B-3, C-5, D-2, E-4"],"a":0,"e":"A-2, B-1, C-3, D-4, E-5","s":""},{"n":325,"t":"Arts Personality","q":"________ along with his wife, herself a dancer, and their son built Srjan in 1993.","o":["Pankaj Charan Das","Kelucharan Mohapatra","Raghunath Dutta","Deba Prasad Das"],"a":1,"e":"Kelucharan Mohapatra . He is an exponent of Odissi Dance. he choreographed a number of dance -dramas in Odissi style, including \"Panchapuspa\", \"Krushna Gatha\", \"Geeta Govinda\", \"Urbashi\", \"Krushna Leela\", \"Sakhigopal\", \"Konark\" and \"Sri Kshetra\".","s":""},{"n":326,"t":"Arts Personality","q":"The Nooran Sisters are renowned for which of the following genres of Indian Music?","o":["Qawwali","Sufi","Ghazals","HindustaniClassical"],"a":1,"e":"Sufi. The Nooran Sisters (Jyoti Nooran and Sultana Nooran) are a Sufi singing duo from Jalandhar, India. They perform Sham Chaurasia gharana classical music.","s":""},{"n":327,"t":"Arts Personality","q":"Which of the following Hindustani vocalists from Allahabad, along with her famed contemporary Gauhar Jaan, had the privilege of performing for Emperor George V at the Delhi Darbar in 1911 ?","o":["Shobha Abhyankar","Annupamaa","Allah Jilai Bai","Janki Bai"],"a":3,"e":"Janki Bai. She was popularly known as “Chhappan chhuri” or the 'woman with 56 stab wounds'. Shobha Abhyankar (Pune) - Mewati Gharana. Annupamaa (Chennai)- Carnatic Music, Allah Jilai Bai (Rajasthan) - Folk Music.","s":""},{"n":328,"t":"Arts Personality","q":"Consider the following statements about Gopal Prasad Dubey:\n1. He is a renowned exponent of Chhau dance.\n2. He received the Padma Shri award in 2012 for his contribution to Indian classical dance.\n3. He was honoured with the Sangeet Natak Akademi Award in 2005.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. He never received the Sangeet Natak Akademi Award (this is wrong information; instead he received Suvarna Shankhu (2010) and Natya Shri title (2010).","s":""},{"n":329,"t":"Arts Personality","q":"Consider the following statements about Indians at the Oscars:\n1. A.R. Rahman is the first Indian musician to win the Oscar for Best Original Score (Slumdog Millionaire, 2009).\n2. Resul Pookutty won the Oscar for Best Sound Mixing for Slumdog Millionaire (2009).\n3. Bhanu Athaiya won the Oscar for Best Actress for the movie Gandhi (1983).\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Bhanu Athaiya won an Oscar for Best Costume Design, not Best Actress, for Gandhi (1983).","s":""},{"n":330,"t":"Arts Personality","q":"Match the following Personalities with their Field/Award:\nList – I List – II (Personalities) (Dance/Contribution)\nA. Shamshad Begum 1. Bharatanatyam\nB. Meenakshi 2. Manipuri Srinivasan\nC. Jayaprabha 3. Mohiniyattam Menon\nD. Guru Amubi Singh 4. Playback Singer","o":["A-4, B-1, C-3, D-2","A-1, B-2, C-4, D-3","A-2, B-3, C-1, D-4","A-3, B-4, C-2, D-1"],"a":0,"e":"A-4, B-1, C-3, D-2.","s":""},{"n":331,"t":"Arts Personality","q":"Due to the service done by the poet ___________, the Kathakali dance form received a new impetus and today, many innovations are also being made to suit the needs of a changing society.","o":["Purandara Dasa","Vallathol Narayana Menon","Satchidanandan","Gopal Bhatta"],"a":1,"e":"Vallathol Narayana Menon was a poet in the Malayalam Language. His famous poem is \"Ente Gurunathan\" (\"My Great Teacher\"). He was one of the triumvirate poets of modern Malayalam, along with Kumaran Asan and Ulloor S. Parameswara Iyer.","s":""},{"n":332,"t":"Arts Personality","q":"Consider the following statements about Bhupen Hazarika:\n1. He was honoured with the Bharat Ratna in 2019 for his contribution to Indian music and culture.\n2. He won the National Award for Best Music Director for the Hindi movie Mother India.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. He won the Best Music Director National Award for Rudaali (1993), not for Mother India.","s":""},{"n":333,"t":"Arts Personality","q":"Consider the following statements:\n1. Ashish Sankrityayan is an exponent of Dhrupad music in Hindustani classical tradition.\n2. Wajid Ali Shah, the last Nawab of Oudh, patronised the Jaipur Gharana of Kathak in the 19th century.\nWhich of the above statements is/are true?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Wajid Ali Shah patronised the Lucknow Gharana.","s":""},{"n":334,"t":"Arts Personality","q":"Consider the following statements:\n1. Shobana Chandrakumar, a recipient of the Padma Shri (2006), is a renowned exponent of Bharatanatyam.\n2. The first recipient of the National Award for Best Music Direction was Naushad Ali for his composition in the film Baiju Bawra (1952).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 – Incorrect: The first recipient of the National Award for Best Music Direction was K. V. Mahadevan in 1967 for the Tamil film Kandan Karunai, not Naushad for Baiju Bawra (1952).","s":""},{"n":335,"t":"Arts Personality","q":"In which of the following years did Pandit Bhimsen Gururaj Joshi give his first ever live performance?","o":["1937","1945","1941","1950"],"a":2,"e":"1941. Pandit Bhimsen Gururaj Joshi was one of the greatest Indian vocalists from Karnataka and belongs to the Kirana gharana tradition of the Hindustani classical tradition. He gave his first live performance in 1941 at the age of 19.","s":""},{"n":336,"t":"Arts Personality","q":"Who among the following Khayal singers of the 19th century was given the title of ‘Tanras” by Bahadur Shah Jaffar, the last Mughal Emperor of India?","o":["Bade Ustad Ghulam Ali Khan","Meer Qutub Baksh","Ustad Amir Khan","Sadarang"],"a":1,"e":"Meer Qutub Baksh. He was also a member of the Qawwal Bachchon Ka Delhi Gharana. His tomb in Hyderabad is near Khamas Shah Dargah. Ustad Bade Ghulam Ali Khan (vocalist, from Patiala Gharana), Ustad Amir Khan (founder of the Indore gharana) and Sadarang (Khayal Gharana).","s":""},{"n":337,"t":"Arts Personality","q":"Who among the following Indian Playback Singers holds the Guinness world record for singing the highest number of songs in one day?","o":["Alka Yagnik","Kumar Sanu","Kavita Krishnamurthy","Udit Narayan"],"a":1,"e":"Kumar Sanu holds the Guinness world record for singing the highest number of 28 songs in one day in 1993. Honours- Maharashtra Ratna Awards (2014), Mahanayak Samman Lifetime Achievement: as Bengali Playback Singer (2014), Dr. Babasaheb Ambedkar Nobel Award (2017), Bishesh Sangeet Mahasanman (2019).","s":""},{"n":338,"t":"Arts Personality","q":"Consider the following statements about Guru Mayadhar Raut:\n1. He played a pioneering role in reviving and redefining the Odissi dance in the 1950s.\n2. He was honoured with the Sangeet Natak Akademi Tagore Ratna (2011) and the Sahitya Kala Parishad Award (1984).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 .","s":""},{"n":339,"t":"Arts Personality","q":"Who among the following Hindustani classical vocalists was awarded the Padma Bhushan by the Government of India and the title of ‘Rajya Gayika’ by the Government of Maharashtra in 1969?","o":["Gangubai Hangel","Sundari Dasi","Kesarbai Kerkar","Nagarathnamma"],"a":2,"e":"Kesarbai Kerkar was an Indian classical vocalist of the Jaipur-Atrauli gharana. She was awarded the Sangeet Natak Akademi Award in 1953, followed by Padma Bhushan, in 1969. The Maharashtra Government awarded her the title Maharashtra Rajya Gayika. Gangubai Hangal (Khyal, Kirana Gharana, Karnataka). Nagarathnamma (Carnatic Singer, Bangalore).","s":""},{"n":340,"t":"Arts Personality","q":"Who among the following Indian Carnatic musicians received the Padma Vibhushan award in 1991 and established the Academy of Performing Arts and Research in Switzerland ?","o":["Kishan Maharaj","Dr. Mangalampalli Balamuralikrishna","Ghulam Mustafa Khan","Chhannulal Mishra"],"a":1,"e":"Dr. Mangalampalli Balamurali Krishna (Andhra Pradesh) was an Indian Carnatic vocalist, he also played the kanjira, mridangam, viola, and violin. He was conferred with many prestigious awards Padma Shri (1971), Padma Bhushan, Padma Vibhushan (1991), Chevalier of the Ordre des Arts et des Lettres (2005), National Film Awards (1976, 1987), and the Sangeet Natak Akademi Award (1975).","s":""},{"n":341,"t":"Arts Personality","q":"Consider the following statements:\n1. Land of Gold is a Grammy-nominated album by Anoushka Shankar, a British–Indian American sitar player.\n2. Rajna Swaminathan is a renowned sitarist from the Bishnupur Gharana.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . Rajna Swaminathan is a mridangam artist, not a sitarist.","s":""},{"n":342,"t":"Arts Personality","q":"Match the following Kathak dancers with their recognised Gharanas:\nList – I List – II (Dancers) (Kathak Gharanas)\nA. Vidyagauri Adkar 1. Jaipur Gharana\nB. Birju Maharaj 2. Lucknow Gharana\nC. Sitara Devi 3. Banaras Gharana\nD. Puru Dadheech 4. Jaipur Gharana","o":["A-1, B-2, C-3, D-4","A-2, B-3, C-1, D-4","A-3, B-1, C-2, D-4","A-4, B-2, C-3, D-1"],"a":0,"e":"A-1, B-2, C-3, D-4.","s":""},{"n":343,"t":"Arts Personality","q":"Guru Shyama Charan Pati, was conferred the Padma Shri for his contributions to mainly which of the following dance forms?","o":["Kathi nacha","Santali dance","Chhau nritya","Jhumair"],"a":2,"e":"Chhau nritya, a martial dance form of India. He was awarded the Padma Shri, in 2006, for his contributions to Indian dance.","s":""},{"n":344,"t":"Arts Personality","q":"The important singers of _________Gharana are Faiyyaz Khan, Latafat Hussein Khan and Dinkar Kakini.","o":["Patiala","Mewati","Agra","Benaras"],"a":2,"e":"Agra Gharana is a tradition of Hindustani classical vocal music descended from the Nauhar Bani ( during the reign of Emperor Alauddin Khilji of Delhi). Some prominent exponents are Faiyaz Khan “Prempiya\", Vilayat Hussain Khan \"Pran Piya\", Khadim Hussain Khan \"Sajan Piya\", Sharafat Hussain Khan \"Prem Rang\", Shrikrishna Narayan Ratanjankar \"Sujan\", Babanrao Haldankar \"Raspiya'', Zohrabai, etc.","s":""},{"n":345,"t":"Arts Personality","q":"In India, the tradition of singing ghazal was established by _________.","o":["Hazrat Ali","Hazrat Amir Khusrau","Hazrat Nizamuddin","Hazrat Shahenshahwali"],"a":1,"e":"Hazrat Amir Khusrau. He is called the father of qawwali. He is known as the Parrot of India. Famous Books written by him are Tughlaqnama, Nuh -sipihr and Khaizan-ul-futuh.","s":""},{"n":346,"t":"Arts Personality","q":"Who among the following wrote two books on the history and dance structure of Mohiniyattam?","o":["Kalamandalam Radhika","Kalamandalam Kalyanikutty Amma","Kalamandalam Hymavathi","Thankamani"],"a":1,"e":"Kalamandalam Kalyanikutty Amma . She got several titles and awards which are \"Kavayithri' title given by Vallathol (1940), Sangeet Natak Akademi fellowship (1974), Kerala Sangeet Natak Akademi fellowship (1974), 'Keerthi Shanku' title given by Kerala Kalamandalam (1980), 'Nrittapraveena' title by Kerala Fine Arts Society (1984), Kerala Sahitya Academy award (1985).","s":""},{"n":347,"t":"Arts Personality","q":"Malka Jaan of Agra Gharana was the court musician at the durbar of which of the following Nawabs of Calcutta?","o":["Shuza-ud-Daula","Wajid Ali Shah","Asaf-ud-Daula","Mohammad Ali Shah"],"a":1,"e":"Wajid Ali Shah. Malka Jaan of Agra was one of Gauhar Jaan's contemporaries. Shuja-ud-Daulah was the Subedar and Nawab of Oudh. Asaf -ud-Daula was the Nawab wazir of Oudh ratified by Shah Alam II.","s":""},{"n":348,"t":"Arts Personality","q":"Kalamandalam Kshemavathy Pavithran was conferred the Padma Shri award for her contribution to which of the following dance forms?","o":["Kuchipudi","Bharatanatyam","Kathak","Mohiniyattam"],"a":3,"e":"Mohinyattam. Awards of Kalamandalam Kshemavathy Pavithran: Padma Shri (2011), Sangeet Natak Akademi Award (1998), Kerala Sangeetha Nataka Akademi Award (1975) (for Bharatanatyam) and the Kerala Sangeetha Nataka Akademi Fellowship (2015).","s":""},{"n":349,"t":"Arts Personality","q":"Match the following personalities with their respective art forms: Personality Art Form\nA. Allah Jilai Bai 1. Kathakali\nB. Rama Vaidyanathan 2. Odissi\nC. Sujata Mohapatra 3. Folk Songs\nD. Keezhpadam 4. Bharatanatyam Kumaran Nair","o":["A–3, B–4, C–2, D–1","A–2, B–3, C–4, D–1","A–3, B–2, C–4, D–1","A–4, B–3, C–2, D–1"],"a":0,"e":"A–3, B–4, C–2, D–1. Allah Jilai Bai, famed for folk songs like Maand and Thumri, won the Padma Shri in 1982. Rama Vaidyanathan, Bharatanatyam dancer, received the Devadasi National Award (2013) and Sangeet Natak Akademi Award (2017). Sujata Mohapatra, Odissi dancer, got the Sangeet Natak Akademi Award (2017). Keezhpadam Kumaran Nair, Kathakali artist, won the Padma Shri (2004) and Sangeet Natak Akademi Award (1988).","s":""},{"n":350,"t":"Arts Personality","q":"Consider the following statements about Makar Dhwaja Darogha:\n1. He was awarded the Padma Shri in 2011.\n2. He is known for his expertise in the classical dance form of Chhau.\nWhich of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":351,"t":"Arts Personality","q":"Consider the following statements about Guru M.K. Saroja:\n1. She was a renowned exponent of the Kathakali dance form.\n2. She was awarded the Padma Shri in 2011 for her contribution to Indian classical dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. She was a renowned exponent of the Bharatnatayam dance form.","s":""},{"n":352,"t":"Arts Personality","q":"Famous playback singer Kishore Kumar was born in 1929 in _________.","o":["Bhopal","Calcutta","Delhi","Khandwa"],"a":3,"e":"Khandwa (Madhya Pradesh). He was awarded: Filmfare Award for Best Male Playback Singer (8 times), Bengal Film Journalists' Association – Best Male Playback Award (4 times), and Lata Mangeshkar Award. In 1997, Madhya Pradesh Government initiated an award called the \"Kishore Kumar Award\".","s":""},{"n":353,"t":"Arts Personality","q":"Which dancer was awarded in 1968 with a gold medal by the Mexican Government for her choreography for the Ballet Folklorico of Mexico?","o":["Sonal Mansingh","Shovana Narayan","Mrinalini Sarabhai","Rukmani Arundale"],"a":2,"e":"Mrinalini Sarabhai (Kerala) was an expert dancer in Bharatanatyam, and Kathakali. Awards - Padma Shri (1965) and Padma Bhushan (1992). Her autobiography - ‘The voice of the Heart-an autobiography’.","s":""},{"n":354,"t":"Arts Personality","q":"Consider the following statements about Mallikarjun Mansur:\n1. He was an Indian classical singer from Karnataka who was an excellent vocalist in the Khayal style.\n2. He belonged to the Patiala Gharana of music.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect because he actually belonged to the Jaipur–Atrauli Gharana, not Patiala.","s":""},{"n":355,"t":"Arts Personality","q":"Guru Debaprasad Das Awardee Durga Charan Ranbir is a teacher and performer of which of the following classical dance forms?","o":["Kathak","Kathakali","Manipuri","Odissi"],"a":3,"e":"Odissi. He was awarded the Guru Kelucharan Mahapatra award 2019, Central Sangeet Natak Akademi Award (2005), Orissa Sangeet Natak Academy Award, Veda Vyas Award, etc.","s":""},{"n":356,"t":"Arts Personality","q":"Consider the following statements about Pandit Gopal Mishra:\n1. He was the founder of the Banaras Gharana of khayal singing.\n2. He was a renowned sarangi player.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 .","s":""},{"n":357,"t":"Arts Awards","q":"Consider the following statements about MG Music Awards:\n1. It is organised every year by the Musicians Guild Nagaland.\n2. Its first edition in 2021 was held online because of COVID-19.\nWhich of the above statements are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The second edition was held offline at the RCEMPA Hall in Jotsoma, Nagaland in 2022.","s":""},{"n":358,"t":"Arts Awards","q":"The Nandi Award for Best Male Playback Singer was instituted by which state in the year 1977?","o":["Gujarat","Andhra Pradesh","Tripura","Maharashtra"],"a":1,"e":"Andhra Pradesh. S. P. Balasubrahmanyam holds the successful record of winning the most Nandi Awards in this category. The Nandi Awards recognize excellence in Telugu cinema, theatre, television, and lifetime achievements in Indian cinema. They are presented annually by the Government of Andhra Pradesh and were first awarded in 1964.","s":""},{"n":359,"t":"Arts Awards","q":"Harivarasanam award is given in the field of music by which of the following state governments ?","o":["Kerala","Karnataka","Maharashtra","Himachal Pradesh"],"a":0,"e":"Kerala. The Harivarasanam Award is a music honor created by Kerala's government and the Travancore Devaswom Board. It recognizes artists who use music to promote the values of Sabarimala, such as unity and equality. The award, which includes ₹1 lakh, a citation, and a plaque, is announced yearly before Sabarimala's Makaravilakku festival.","s":""},{"n":360,"t":"Arts Awards","q":"Consider the following statements:\n1. The Tansen Samman was started by the Government of Madhya Pradesh in 1980 for exponents of Hindustani classical music.\n2. The Kumar Gandharva Samman was started by the Government of Assam in 1992 to honour outstanding musical talent.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Kumar Gandharva Samman was started by Madhya Pradesh, not Assam.","s":""},{"n":361,"t":"Arts Awards","q":"Match the Following (State Arts & Culture Awards).\nList – I (Awards) List – II (States)\nA. Kalaimamani 1. Karnataka\nB. Tulsi Samman 2. Tamil Nadu\nC. Jakanachari 3. Madhya Pradesh Award\nD. Kalidas Samman 4. Bihar","o":["A-2, B-3, C-1, D-3","A-2, B-1, C-4, D-3","A-3, B-4, C-1, D-2","A-4, B-3, C-2, D-1"],"a":0,"e":"A-2, B-3, C-1, D-3","s":""},{"n":362,"t":"Arts Awards","q":"Which of the following statements is / are true for the recipients of the Sangeet Natak Akademi Awards?\n1. Sonal Mansingh was elected as Fellow of Sangeet Natak Akademi in the year 2018.\n2. Jatin Goswami was elected as Fellow of Sangeet Natak Akademi in the year 2018.\n3. 3.Radha Sridhar received the Sangeet Natak Akademi Award in the year 2018 for her contribution to Kathak.","o":["Both 1 and 2","Only 3","Both 2 and 3","Both 1 and 3"],"a":0,"e":"Both 1 and 2. Radha Sridhar received the Sangeet Natak Akademi Award for the year 2018 for her contribution to Bharatanatyam. Sangeet Natak Akademi Awards also known as the Akademi Puraskar Instituted in 1952, it recognizes excellence and sustained contribution to the performing arts. The honour of Akademi Fellow carries a purse money of Rs. 3,00,000 while the Akademi Award carries a purse money of Rs 1,00,000 besides a Tamrapatra and Angavastram.","s":""},{"n":363,"t":"Arts Awards","q":"Which state gives the annual award Guru Kelucharan Mohapatra ?","o":["Karnataka","Odisha","Tamil Nadu","Manipur"],"a":1,"e":"Odisha . Kelucharan Mohapatra (Odissi dancer) - First person to receive the Padma Vibhushan (2000) from Odisha. Arts awards - Kalidas Samman (Madhya Pradesh), Jakanachari Award (Karnataka), Kala Ratna Award (Andhra Pradesh), Tulsi Samman (Madhya Pradesh), Kalaimamani Award (Tamil Nadu), Rashtriya Kumar Gandharva Samman (Madhya Pradesh), Varnashilpi Venkatappa Award (Karnataka), Poompuhar State Award (Tamil Nadu).","s":""},{"n":364,"t":"Arts Awards","q":"Consider the following statements about Guru Gangadhar Pradhan:\n1. Guru Gangadhar Pradhan was an eminent Odissi dance exponent who founded the Orissa Dance Academy and Konark Natya Mandap.\n2. The Guru Gangadhar Pradhan Award is given in the field of Dance.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":365,"t":"Arts Awards","q":"Which of the following performance categories belongs to Guru Kelucharan Mohapatra and Guru Kelucharan Mohapatra Yuva Prativa Summan ?","o":["Manipuri dance and music","Odissi dance and music","Maharashtra dance and music","Karnataka dance and music"],"a":1,"e":"Odissi dance and music. Guru Kelucharan Mohapatra Award was instituted in the year 1995 by Shri Ratikant Mohapatra to confer recognition on individuals for their contribution to the fields of Dance, Music, Cinema and Theatre. Award amount - 1,00,000 rupees.","s":""},{"n":366,"t":"Arts Awards","q":"The National Award for Classical Dance is called.","o":["Ethnic dance honor","Indian Award","Abhinandan Saroja Award","classical respect"],"a":2,"e":"Abhinandan Saroja Award. It is presented by the National Institute of Classical Dance to the dancers and choreographers for their contribution towards preserving the rich traditional classical dance form of India. 2021 Award Winner - Aparna Satheesan who is an exponent of Bharatanatyam and Kuchipudi dance.","s":""},{"n":367,"t":"Arts Awards","q":"Instituted in 1984, the National -level Lata Mangeshkar Award is given to promote excellence in the area of light music annually by the ________ government's culture department.","o":["Madhya Pradesh","Rajasthan","Karnataka","Goa"],"a":0,"e":"Madhya Pradesh. Lata Mangeshkar (her honorific titles such as the \"Queen of Melody\", \"Voice of the Millennium\") was an Indian playback singer and music composer. Naushad, Kishore Kumar, and Asha Bhosle are among the earlier recipients of the Lata Mangeshkar Award.","s":""},{"n":368,"t":"Arts Awards","q":"Consider the following statements about Guru Gopinath National Award 2021:\n1. The Guru Gopinath National Award (Desiya Natya Puraskaram) is the highest dance award conferred by the Government of Kerala.\n2. In 2021, the award was honoured to Alarmel Valli, a Bharatanatyam dancer.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 – Incorrect: In 2021, the award was actually given to Kumudini Lakhia, a renowned Kathak dancer and choreographer, not to Alarmel Valli.","s":""},{"n":369,"t":"Arts Awards","q":"Devdas Smriti Panthi Dance Award is related to which state?","o":["Rajasthan","Bihar","Jharkhand","Chhattisgarh"],"a":3,"e":"Chhattisgarh. Awards of Chhattisgarh - Guru Ghasidas Samman, chakradhar Samman, Devdas Banjare Memorial Award, Kishore Sahu Samman. Awards of Madhya Pradesh - Kalidas Samman, Kabir Samman, Tansen Samman, Kishore Kumar Samman, Lata Mangeshkar Award, Maithilisharan Gupta Award, Devi Ahilyabai Award, Iqbal Samman. Awards of Uttar Pradesh -Vishwa Bharti Award, Maharshi Valmiki Award, Maharishi Vyas Award, Maharshi Nara Award, Ved Pandit Award.","s":""},{"n":370,"t":"Arts Awards","q":"When was the Sri Shanmukhananda National Eminence Award set up ?","o":["2001","2002","2000","2003"],"a":1,"e":"2002 . Awardee 2002- Shri Semmangudi Srinivasaiyer (Carnatic Vocal), 2018- Zakir Hussain (Tabla), 2019- Dr. Umayalpuram Sivaraman (Mrudangam) and Kalyanapuram Shri. R. Aravamudachariar (Harikatha). 2020-Pandit Arvind Parikh (Hindustani Sitar).","s":""},{"n":371,"t":"Arts Awards","q":"Which of the following fields is not offered by Kalidas Samman?","o":["Classical music","Classical dance","Puppetry","Plastic arts"],"a":2,"e":"Puppetry is an animated visual art form. Kalidas Samman (2020)-Aruna Sairam Indian Music (Carnatic Music). This award is presented annually by the Government of Madhya Pradesh .","s":""},{"n":372,"t":"Arts Awards","q":"Who among the following Bharatanatyam exponents received the ‘Chevalier of Arts and Letters award from the Government of France in 2004?","o":["Mallika Sarabhai","Sonal Mansingh","Mrinalini Sarabhai","Alarmel Valli"],"a":3,"e":"Alarmel Valli. She is an exponent of the Pandanallur style (Bharatnatyam).","s":""},{"n":373,"t":"Arts Awards","q":"Consider the following statements about the Bharat Muni Samman:\n1. The Bharat Muni Samman is given by the Nalanda Dance Research Centre, Mumbai.\n2. The Nalanda Dance Research Centre was established in 1976 by Kanak Rele, an exponent of Mohiniyattam.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . The Nalanda Dance Research Centre centre was established in 1966.","s":""},{"n":374,"t":"Musical Instruments","q":"Which of the following is a prominent form of Hindustani classical vocal music?","o":["Kathak","Dhrupad","Bharatnatyam","Kuchipudi"],"a":1,"e":"Dhrupad is the oldest and most prominent form of Hindustani classical vocal music, known for its spiritual depth, slow elaboration (alap), and emphasis on purity of raga. It differs from dance forms like Kathak, Bharatnatyam, and Kuchipudi, which belong to the field of performing arts rather than vocal music. Dhrupad is performed with a tanpura and pakhawaj, reflecting devotional themes and discipline in singing.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":375,"t":"Musical Instruments","q":"Evaluate the following about Carnatic instruments and choose the correct option:\nStatement 1: The Mridangam is a melodic percussion instrument used to outline the raga.\nStatement 2: Nadaswaram is a double-reed instrument traditionally played in temples and weddings.","o":["Only 1","Only 2","Both 1 and 2 are correct","Neither 1 nor 2 is correct"],"a":1,"e":"Mridangam is a percussion instrument, but it is not melodic; it provides rhythmic accompaniment (tala), not the raga (melody). Raga is outlined by melodic instruments like veena, violin, flute, or by vocals. Nadaswaram is a double-reed wind instrument, one of the loudest non-brass instruments, widely used in South Indian temples, weddings, and festivals.","s":"SSC Stenographer 7/08/2025 (Shift 1)"},{"n":376,"t":"Musical Instruments","q":"Consider the following statements regarding the structure of Carnatic music compositions and choose correct option:\nStatement 1: Varnam is typically performed at the end of a Carnatic concert to summarize key ragas.\nStatement 2: Alapana involves improvisational elaboration of a raga without rhythm (tala).","o":["Both 1 and 2 are correct","Neither 1 nor 2 is correct","Only 2","Only 1"],"a":2,"e":"Only 2. In Carnatic music, Alapana is an improvisational exploration of a raga without rhythmic accompaniment, allowing the artist to elaborate the mood and structure of the raga freely. Varnam, on the other hand, is usually performed at the beginning of a concert as a warm-up and to establish the raga and tala, not at the end .","s":"SSC Stenographer 8/08/2025 (Shift 1)"},{"n":377,"t":"Musical Instruments","q":"Consider the following statements and choose correct option :\nStatement 1: Kriti is a highly structured musical composition in Carnatic tradition.\nStatement 2: Tillana often concludes a Carnatic recital and emphasizes rhythmic syllables.","o":["Both 1 and 2 are correct","Only 1","Only 2","Neither 1 nor 2 is correct"],"a":0,"e":"Both 1 and 2 are correct. A Kriti is the central piece of a concert, known for its structured format, which includes the pallavi, anupallavi, and charanam. Conversely, the Tillana is a lively, rhythmic piece characterized by the use of phonetic syllables, and it is typically performed to bring the concert to a vibrant conclusion.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":378,"t":"Musical Instruments","q":"Which instrument is commonly used in Carnatic classical music?","o":["Dhol","Mridangam","Santoor","Shehnai"],"a":1,"e":"Mridangam. It is the primary percussion instrument in Carnatic classical music, used to accompany vocalists and instrumentalists. Some notable mridangam exponents: Palghat Mani Iyer, Umayalpuram K. Sivaraman, T.K. Murthy, Karaikudi Mani, and Guruvayur Dorai. Dhol is mainly used in folk/Bhangra music, Santoor in Hindustani classical, and Shehnai in North Indian traditions and auspicious occasions.","s":"SSC Stenographer 8/08/2025 (Shift 3)"},{"n":379,"t":"Musical Instruments","q":"Consider the following statements about Ustad Vilayat Ali Khan:\n1. Ustad Vilayat Ali Khan was a maestro of the Sitar.\n2. He belonged to the famous Etawah (Imdadkhani) gharana of Hindustani classical music.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Indian Sitarist Pandit Ravi Shankar, Ustad Vilayat Khan, Pandit Nikhil Banerjee, Ustad Imrat Khan, Anoushka Shankar, Shujaat Khan, Shahid Parvez Khan, Manju Mehta.","s":""},{"n":380,"t":"Musical Instruments","q":"Who among the following is the world renowned exponent of the bamboo flute ?","o":["MS Subbulakshmi","Ravi Shankar","Hariprasad Chaurasia","Bismillah Khan"],"a":2,"e":"Hariprasad Chaurasia. He served as the artistic director of the World Music Department at the Rotterdam Music Conservatory in the Netherlands. His Awards : Sangeet Natak Academy award (1984), Padma Bhushan (1992), Padma Vibhushan (2000). Flute -Pannalal Ghosh, T.R. Mahalingam, N. Ramani.","s":""},{"n":381,"t":"Musical Instruments","q":"Consider the following statements about Buddhadev Dasgupta:\n1. Buddhadev Dasgupta was a renowned exponent of the Sarangi, a bowed string instrument of Hindustani music.\n2. He was honoured with the Padma Bhushan (2012) and the Sangeet Natak Akademi Award (1993).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only . Buddhadev Dasgupta was not a Sarangi exponent; he was a maestro of the Sarod. Notable exponents of the Sarod : Ustad Amjad Ali Khan, Bahadur Khan, and Allaudin Khan.","s":""},{"n":382,"t":"Musical Instruments","q":"Ustad Zia Mohiuddin Dagar was a _____ player of profound depth, favouring sparse and slow realisations of ragas.","o":["Sitar","Violin","Flute","Rudra veena"],"a":3,"e":"Rudra veena. Zia Mohiuddin Dagar received the Sangeet Natak Akademi Award in 1981. Other Maestro: Rudra veena - Ustad Ali Zaki Hader, Asad Ali Khan, Mohammed Khan Faridi. Sitar -Ustad Vilayat Khan, Pt Ravi Shankar, Nikhil Banerjee.","s":""},{"n":383,"t":"Musical Instruments","q":"Match the Following (Musicians & Instruments)\nList – I List – II (Musicians) (Instruments)\nA. Ustad Sabri Khan 1. Surbahar\nB. Annapurna Devi 2.Mridangam\nC. Arvind Parikh 3.Sarangi\nD. D. Umayalpuram 4. Sitar K. Sivaraman","o":["A-3, B-1, C-4, D-2","A-2, B-3, C-1, D-4","A-4, B-2, C-3, D-1","A-1, B-4, C-2, D-3"],"a":0,"e":"A-3, B-1, C-4, D-2. Other Surbahar Exponents - Ustad Imrat Khan, Buddhaditya Mukherjee, Pushparaj Koshti, Kushal Das. Other renowned sitar players include Ravi Shankar, Vilayat Khan, Annapurna Devi, Imrat Khan, Anoushka Shankar, Rishabh Seen, Anupama Bhagwat, and Niladri Kumar. Notable mridangam players include Palghat Mani Iyer, Karaikudi R. Mani, and Yella Venkateswara Rao.","s":""},{"n":384,"t":"Musical Instruments","q":"Which of the following is NOT a stringed instrument ?","o":["Mandolin","Guitar","Flute","Violin"],"a":2,"e":"Flute is a wind instrument where sound is produced by vibration of the air column inside it. Instruments without strings include the tabla, drums, and harmonium. Instruments with strings include the guitar, cello, banjo, ukulele, and harp.","s":""},{"n":385,"t":"Musical Instruments","q":"Bharat Muni, in his Natya Shastra, categorises musical instruments into four different parts. What is the categorisation of musical instruments by Bharat Muni based on?","o":["Different sounds of the musical instruments","The shape of the musical instruments","Different materials used in the musical instruments","The uses of the musical instruments in different occasions, such as wedding, festivals and public gathering"],"a":0,"e":"Different sounds of the musical instruments. Musical Instruments were categorised into four groups in Bharat Muni's Natya Shastra (written between 200 BC and 200 AD): Avanaddha Vadya (membranophones or percussion instruments), Ghan Vadya (idiophones or solid instruments), Sushir Vadya (aerophones or wind instruments), and Tat Vadya (chordophones or stringed instruments).","s":""},{"n":386,"t":"Musical Instruments","q":"Which of the following is a string instrument commonly featured in the folk music of Gujarat?","o":["bungal","turi","pava","jantar"],"a":3,"e":"jantar. Other folk instruments include wind instruments like Turi, Bungal, Pava and string instruments like Ravan Hattho and Ektaro percussion instruments like Manjira and Zanz pot drum are omnipresent in the folk sounds of Gujarat.","s":""},{"n":387,"t":"Musical Instruments","q":"Select the musical instrument which is NOT played by way of percussion or NOT played by way of striking any object ?","o":["Pakhawaj","Drum","Tabla","Shehnai"],"a":3,"e":"Shehnai. It is a wind instrument made of wood and metal. Other wind musical Instruments: Flute, oboe, clarinet, bassoon, and saxophone. Pakhawaj, drum, and tabla are all percussion instruments that are played by striking the surface of the instrument with hands or sticks to produce sound.","s":""},{"n":388,"t":"Musical Instruments","q":"Consider the following statements about the Santoor:\n1. The ancient Sanskrit name of the Santoor is Shat-tantri Veena, meaning a Veena with hundred strings.\n2. The Santoor was popularised in Indian classical music mainly by Ustad Bismillah Khan.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The Santoor was popularised by Pandit Shiv Kumar Sharma, not Ustad Bismillah Khan (who was a Shehnai maestro).","s":""},{"n":389,"t":"Musical Instruments","q":"Which of the following statements is INCORRECT about the Music of India?","o":["Tala is a cyclic arrangement of time units.","The sruti is a unit of measure or small difference between the various consecutive pitches within a grama or a scale.","A raga is believed to have started as a tribal or folk tune.","The musical instrument Kamaicha is majorly used by the ‘Manganiar’ Community of Manipur as a popular accompaniment to their songs"],"a":3,"e":"Kamaicha is a stringed instrument. It is made of steel, parchment, gut, metal, shisham, and horsehair. This is a community instrument found in Rajasthan. Majorly used by the ‘Manganiar’ Community of West Rajasthan as a popular accompaniment to their songs. Some Music Instruments of Rajasthan: Sarangi, Ravanhathha, Ektara, Moochang, Pungi, Satara, Algoza, Murla, Nad Shehnai.","s":""},{"n":390,"t":"Musical Instruments","q":"Consider the following statements about Ustad Asad Ali Khan:\n1. Ustad Asad Ali Khan was one of the last great masters of the Rudra Veena, a plucked string instrument.\n2. He was honoured with the Padma Bhushan in 2008 for his contribution to Indian classical music.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":391,"t":"Musical Instruments","q":"Bhajan Sopori, a Padma Shri awardee, is a _________ player.","o":["sitar","santoor","tabla","violin"],"a":1,"e":"santoor. Pt Bhajan Sopari belongs to the Sufiana Gharana of Indian classical music. He was famous as ‘Saint of the Santoor’ and the ‘King of Strings’. Awards - Sangeet Natak Akademi Award (1993), Padma Shri (2004).","s":""},{"n":392,"t":"Musical Instruments","q":"Brij Bhushan Kabra was considered an expert in which of the following instruments in the field of Indian classical music?","o":["Santoor","Violin","Veena","Guitar"],"a":3,"e":"Guitar. Brij Bhushan Kabra received the Sangeet Natak Akademi award in 2005. Other famous players: Guitar - Susmit Sen, Amyt Datta, Kapil Srivastava.","s":""},{"n":393,"t":"Musical Instruments","q":"Bundu Khan was a _________ player of Delhi gharana.","o":["santoor","flute","sarod","sarangi"],"a":3,"e":"sarangi. Bundu Khan was trained by his grandfather Saungi Khan. Some sarangi players from the Delhi gharana: Shahnawaz Khan, Nabeel Khan, Sabri Khan, Abdul Latif Khan.","s":""},{"n":394,"t":"Musical Instruments","q":"Match the Following (Musicians & Instruments)\nList – I List – II (Musicians) (Instruments)\nA. Anantha R. 1. Violin Krishnan\nB. Vishnu Govind 2. Pakhawaj Jog\nC. Mohan Shyam 3. Tabla Sharma\nD. Aban Mistry 4. Mridangam","o":["A-4, B-1, C-2, D-3","A-1, B-2, C-3, D-4","A-2, B-3, C-4, D-1","A-3, B-4, C-1, D-2"],"a":0,"e":"A-4, B-1, C-2, D-3. Mridangam - KV Prasad, SV Rajarao, Umalayapuram Sivaraman, Palghat Mani Iyer. Violin - M.S. Gopalakrishnan, N.R. Muralidharan, M. Chandrasekharan, Lalgudi Jayaraman. Pakhawaj: Shankarrao Ghorpadkar; Dr. Anil Chaudhury. Tabla: Zakir Hussain, Allah Rakha, Pt. Kishan Maharaj.","s":""},{"n":395,"t":"Musical Instruments","q":"Padma Shri Awardee Gosaveedu Shaik Hassan is known for playing:","o":["Nadaswaram","Ghatam","Violin","Veena"],"a":0,"e":"Nadaswaram is a double reed wind instrument from South India. Gosaveedu Shaik Hassan received Padma Shri Award in 2022. Musical Instruments and Exponents: Nadaswaram - Umapathy Kandasamy, Karukurichi Arunachalam, Namagiripettai Krishnan. Ghatam - T. H. Vinayakram, Giridhar Udupa. Violin - Gajananrao Joshi, Sangeeta Shankar, N. Rajam. Veena - Jayanthi Kumaresh, Sundaram Balchander, Veenai Dhanammal.","s":""},{"n":396,"t":"Musical Instruments","q":"Who among the following musicians played Carnatic music with Ghatam?","o":["Ramnad Raghavan","TH Vinayakram","Ali Akbar Khan","KV Prasad"],"a":1,"e":"TH Vinayakram. He is also known as Vikku Vinayakram, is an Indian percussionist revered as the \"God of Ghatam.\" The ghatam is a clay pot used in various musical repertoires, particularly in South India.","s":""},{"n":397,"t":"Musical Instruments","q":"Consider the following statements about Uppalapu Shrinivas:\n1. Uppalapu Shrinivas was a famous Veena player in Indian classical music.\n2. He was honoured with the Padma Shri in 1998 and the Sangeet Natak Akademi Award in 2009.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. U. Shrinivas was not a Veena player; he was a legendary Mandolin maestro.","s":""},{"n":398,"t":"Musical Instruments","q":"Pandit Ram Narayan, who was awarded the Pandit Bhimsen Joshi Lifetime Achievement Award for 2015–2016, is a _______ player.","o":["sarod","flute","sarangi","violin"],"a":2,"e":"sarangi. Ram Narayan awards - Padma Shri (1976), Padma Bhushan (1991) and Padma Vibhushan (2005). Other famous Sarangi Players: Shakoor Khan, Ramesh Mishra, Sultan Khan.","s":""},{"n":399,"t":"Musical Instruments","q":"Match the Following (Musicians & Instruments)\nList – I List – II (Musicians) (Instruments)\nA. Prabhat Sarma 1. Tabla\nB. Talvin Singh 2. Nadaswaram\nC. Neeruswamy Pillai & 3. Flute Rajaratanam Pillai\nD. Pandit Vishwa 4. Mohan Veena Mohan Bhatt","o":["A-3, B-1, C-2, D-4","A-1, B-2, C-3, D-4","A-4, B-3, C-1, D-2","A-2, B-4, C-1, D-3"],"a":0,"e":"A-3, B-1, C-2, D-4.","s":""},{"n":400,"t":"Musical Instruments","q":"Ustad Akbar Ali Khan is remembered for his contribution to which of the following musical instruments?","o":["Tabla","Santoor","Sitar","Sarod"],"a":3,"e":"Sarod. Akbar Ali Khan (Maihar gharana). Awards- Padma Bhushan (1967), Padma Vibhushan (1989). Famous Players (Sarod): Amjad Ali Khan, Buddhadev Das Gupta, Tejendra Majumdar, Allauddin Khan.","s":""},{"n":401,"t":"Musical Instruments","q":"RK Bijapure played which of the following musical instruments?","o":["Harmonium","Tabla","Ravanahatha","Sitar"],"a":0,"e":"Harmonium. R K Bijapure (1985 - \"Karnataka Kala Tilak\" by Sangeet Nritya Academy). Harmonium -Purushottam Walawalkar, Appa Jalgaonkar. Ravanahatha - Dinesh Subasinghe.","s":""},{"n":402,"t":"Musical Instruments","q":"Consider the following statements about Dr. A.P.J. Abdul Kalam:\n1. Former President of India, Dr. A.P.J. Abdul Kalam, was known for playing the Veena, a stringed instrument.\n2. He is also remembered as the Missile Man of India and served as the 11th President of India.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Exponents of Veena : Rajhesh Vaidhya, Jayanthi Kumaresh, Veena E. Gayathri, Emani Sankara Sastry.","s":""},{"n":403,"t":"Musical Instruments","q":"Consider the following statements about famous Indian musicians:\n1. Ramnad V. Raghavan was a renowned exponent of the Mridangam, a percussion instrument used in Carnatic music.\n2. Totaram Sharma is associated with the Pakhawaj and was honoured with the Sangeet Natak Akademi Award in 2011.\n3. Sivamani is a famous Violinist who received the Padma Shri in 2019.\nWhich of the above statements are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Sivamani is not a Violinist, he is a world-famous Drummer (Awards: Kalaimamani 2009, Padma Shri 2019).","s":""},{"n":404,"t":"Musical Instruments","q":"Select the correct sequence of the musical instruments according to the given sequence of their associated personalities : Ustad Allah Rakha, Totaram Sharma, TH Vinayakam.","o":["Tabla, Ghatam, Pakhawaj","Ghatam, Pakhawaj, Tabla","Tabla, Pakhawaj, Ghatam","Pakhawaj, Tabla, Ghatam"],"a":2,"e":"Tabla, Pakhawaj, Ghatam. Tabla is the most famous percussion instrument of North India. Pakhawaj is an ancient drum, it is the preferred percussion instrument of the ancient singing style called Dhrupad. A Ghatam is a large, narrow-mouthed earthenware pot used as a percussion instrument.","s":""},{"n":405,"t":"Musical Instruments","q":"Tansen, who was included in the Navaratnas of Akbar, was an expert in playing which of the following musical instruments?","o":["Nagada","Veena","Sarangi","Rabab"],"a":3,"e":"Rabab (String instrument) . Tansen (Ramtanu Pandey) - A Hindustani classical musician also known as Sangeeth Samrat or Mian (Learned One) . Tansen Samaroh is celebrated every year in the month of December in Gwalior district.","s":""},{"n":406,"t":"Musical Instruments","q":"Consider the following statements about Indian musicians:\n1. Faiyaz Khan, titled Aftab-e-Mausiqi by the Maharaja of Mysore in 1908, was a renowned maestro of the Tabla.\n2. Pandit Ayodhya Prasad is associated with Sitar, a string instrument of Hindustani classical music.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Pandit Ayodhya Prasad is associated with Percussion instruments (not Sitar).","s":""},{"n":407,"t":"Musical Instruments","q":"Which of the following music instruments are solid instruments?","o":["Tata Vadya","Ghana Vadya","Avanaddha Vadya","Sushira Vadya"],"a":1,"e":"Ghana Vadya. Solid instruments are usually played with a striker or hammer. These instruments are not capable of producing definite pitches that are required for creating a melody. That is why their use is limited in classical music. Tata Vadya - These are Stringed instruments. Avanaddha Vadya -These are percussion instruments. Sushira Vadya - These are wind instruments. The Shehnai is a popular wind instrument in India.","s":""},{"n":408,"t":"Musical Instruments","q":"The shehnai is a reed instrument with how many holes along the tubes?","o":["Five","Seven","Eleven","Six"],"a":1,"e":"Seven. Shehnai - It is a reed instrument in which there are seven holes along the tube which are used for playing the melody by opening and closing them with the fingers. It is known as Mangal Vadya. It is considered to have come to India from West Asia. In the early fifties of this century, Ustad Bismillah Khan is credited for popularising this instrument. Pt. Anant Lal and Pt. Daya Shankar is also a noted Shehnai player.","s":""},{"n":409,"t":"Musical Instruments","q":"What is Tat Vadya ?","o":["Percussion instruments","Stringed instruments","Solid instruments","Wind instruments"],"a":1,"e":"Stringed instruments. Tata Vadya - Sound produced by vibration of a string or chord. Example - Veena, Sitar, Sarangi etc. The Percussion Instruments - Congo, Bongo, Djembe, Darbukas, Hand Drums and Tongue Drums. Idiophones or Ghana Vadya are solid instruments that do not need any further tuning. Examples - Piccolo, Manjira, Jaltarang, Jhanj and Chimta. Wind instruments - woodwinds, such as the flute, clarinet, oboe, and bassoon, also include brass instruments like horn and trumpet.","s":""},{"n":410,"t":"Musical Instruments","q":"Consider the following statements about Indian musical instruments:\n1. The Flute belongs to the category of Sushira Vadya (Wind instruments).\n2. Avanaddha Vadya are instruments in which sound is produced by plucking strings, such as the Sitar and Veena.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Avanaddha Vadya = Percussion instruments with animal skin (Tabla, Mridangam, Dhol), while Tata Vadya = string instruments (Sitar, Veena).","s":""},{"n":411,"t":"Musical Instruments","q":"Consider the following statements about Indian musicians:\n1. Bickram Ghosh, recipient of the Global Indian Music Award (2012), is a well-known Tabla player.\n2. Rajeev Taranath, a disciple of Ustad Alla Rakha, is a renowned Sarod player.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Rajeev Taranath is indeed a Sarod exponent, but he was the disciple of Ali Akbar Khan, not Ustad Alla Rakha.","s":""},{"n":412,"t":"Musical Instruments","q":"Pandit Ananda Gopal Bandopadhyay was a _________ player of the Banaras gharana.","o":["sarangi","sarod","sitar","tabla"],"a":3,"e":"Tabla . In 1965, he won the first prize in The All India Radio music competition, and was awarded the President's Gold Medal. In 2012, he was awarded the Sangeet Ratna Award by the Salt Lake Music Association.","s":""},{"n":413,"t":"Musical Instruments","q":"Who among the following is India’s only publicly well-known woman shehnai player?","o":["Gauhar Jaan","Binodini Dasi","Bageshwari Qamar","Rasoolan Bai"],"a":2,"e":"Bageshwari Qamar . Gauhar Jaan was an Indian singer (thumri, Dadra, kajri, and Tarana) and dancer from Kolkata. Binodini Dasi was an Indian Bengali actress and thespian. Rasoolan Hussain was a leading Indian Hindustani classical music vocalist, belonging to the Benaras Gharana.","s":""},{"n":414,"t":"Musical Instruments","q":"Match the Following (Musicians & Instruments)\nList – I List – II (Musicians) (Instruments)\nA. Pandit Nikhil 1. Surbahar Jyoti Ghosh\nB. Ustad Imrat Khan 2. Violin\nC. Lalgudi Gopala 3. Tabla Iyer Jayaraman\nD. Pandit Swapan 4. Tabla Chaudhuri","o":["A-3, B-1, C-2, D-4","A-1, B-2, C-3, D-4","A-4, B-3, C-1, D-2","A-2, B-4, C-1, D-3"],"a":0,"e":"A-3, B-1, C-2, D-4.","s":""},{"n":415,"t":"Musical Instruments","q":"Which of the following musical instruments did Dwaram Venkataswamy Naidu play?","o":["Violin","Mandolin","Veena","Nadaswaram"],"a":0,"e":"Violin . His Awards - Padma Shri (1957), Sangeeta Kalanidhi (1941), Kalaprapoorna (1950), Sangeet Natak Akademi Award (1953), Raja - Lakshmi Award (1992).","s":""},{"n":416,"t":"Musical Instruments","q":"Which of the following is not a percussion instrument?","o":["Ghatam","Tabla","mridangam","sarod"],"a":3,"e":"Sarod. The percussion family of musical instruments consists of membranophones and idiophones. Examples- Ghatam, Tabla, Mridangam, timpani, xylophone, cymbals, snare drum, bass drum, tambourine, maracas, gongs, chimes, celesta, and piano. Sarod , stringed musical instrument of the lute family.","s":""},{"n":417,"t":"Musical Instruments","q":"Consider the following statements:\n1. The Shehnai, a woodwind instrument popularised by Ustad Bismillah Khan, is also known as a Mangal Vadya.\n2. The distinct Dhrupad style is mainly associated with the Ajrada Gharana of Hindustani classical music.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Dhrupad style is associated with the Bishnupur Gharana, not Ajrada Gharana.","s":""},{"n":418,"t":"Musical Instruments","q":"Which of the following instruments is normally played in a vertical position and with an arched bow?","o":["Sitar","Sarangi","Shehnai","Veena"],"a":1,"e":"Sarangi . The Sarangi is a fretless, bowed string instrument used in Hindustani classical music and folk traditions of north India.","s":""},{"n":419,"t":"Musical Instruments","q":"'Ponu Yoksi', a sword like instrument used during ceremonial dances performed by the priests, belongs to:","o":["Himachal Pradesh","Madhya Pradesh","Uttar Pradesh","Arunachal Pradesh"],"a":3,"e":"Arunachal Pradesh. Some popular instruments (Arunachal Pradesh) include drums, cymbals, Ujuk Tapu, Ame Bali, Emul, Pui, Kiring, Guga etc.","s":""},{"n":420,"t":"Musical Instruments","q":"Consider the following statements about traditional Indian musical instruments:\n1. The Chinkara is a stringed instrument popular in Madhya Pradesh, used by the Pradhan community of M.P. and the Meo community of Rajasthan.\n2. The Pena, also called Tingtelia, is a traditional wind instrument popular in the state of Manipur.\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Pena → not a wind instrument, it is a mono-string instrument (lute category) of Manipur.","s":""},{"n":421,"t":"Musical Instruments","q":"The musical instrument 'Kartal' from the state of Rajasthan comes under the category of ______.","o":["electrophones","membranophones","chordophones","idiophones"],"a":3,"e":"Idiophone is a percussion instrument. It is classified as an idiophone because the entire instrument vibrates to produce a sound on its own.","s":""},{"n":422,"t":"Musical Instruments","q":"The ______ is a single string musical instrument made using bamboo and a gourd, mostly used by traditional folk singers in Maharashtra.","o":["Edakka","Ekkalam","Esraj","Ektara"],"a":3,"e":"Ektara is a drone flute consisting of a gourd resonator covered with skin, through which a bamboo neck is inserted. Ektara means “one string”.","s":""},{"n":423,"t":"Musical Instruments","q":"Consider the following statements about traditional Indian musical instruments:\n1. The Khuang is a traditional percussion instrument of Mizoram, made of a hollow tree trunk and covered with animal skin.\n2. The Bobbili Veena/Saraswathi Veena used in Carnatic classical music is carved from a single piece of Jackfruit wood.\nWhich of the above statements are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2.","s":""},{"n":424,"t":"Festivals","q":"In which year did UNESCO recognize Durga Puja as an Intangible Cultural Heritage?","o":["2023","2015","2019","2021"],"a":3,"e":"2021. Several Indian festivals are recognized by UNESCO as Intangible Cultural Heritage of Humanity, including the Kumbh Mela (inscribed in 2017), the Durga Puja in Kolkata (inscribed in 2021), and the Garba of Gujarat (inscribed in 2023). Other examples include Yoga (2016), Sankirtana of Manipur (2013), Buddhist Chanting of Ladakh (2012), and the Ramlila (2008).","s":"SSC Stenographer 6/08/2025 (Shift 2)"},{"n":425,"t":"Festivals","q":"Ganesh Chaturthi, celebrated widely in Maharashtra, is associated with:","o":["The descent of Ganga","The marriage of Shiva and Parvati","The birth of Lord Ganesha","The return of Krishna to Mathura"],"a":2,"e":"The birth of Lord Ganesha. Ganesh Chaturthi is a major Hindu festival, especially popular in Maharashtra, that celebrates the birth of Lord Ganesha, the son of Lord Shiva and Goddess Parvati. It is observed in the Hindu month of Bhadrapada (August– September) and lasts for 10 days. The festival symbolizes prosperity, wisdom, and removal of obstacles. It was also popularized as a public celebration by Bal Gangadhar Tilak during the freedom movement to unite people against British rule.","s":"SSC Stenographer 6/08/2025 (Shift 3)"},{"n":426,"t":"Festivals","q":"Which of the following is true about the Gudi Padwa festival?\n1. It marks the beginning of the Hindu New Year based on the lunisolar calendar.\n2. The term Gudi refers to a sacred scripture recited on this day.\n3. Traditionally, celebrations begin with the consumption of sweets for good luck.","o":["1, 2 and 3 all are correct","2 and 3 only","1 and 3 only","Only 1"],"a":3,"e":"Gudi Padwa is celebrated on the first day of the Chaitra month, which marks the beginning of the New Year according to the traditional lunisolar Hindu calendar. It is primarily celebrated by people in Maharashtra and the Konkan region as their New Year's Day. It refers to a specific emblem or victory flag that is a central part of the festival. This \"Gudi\" is created by tying a bright, colorful cloth (often green or yellow silk) to the top of a long bamboo stick, along with neem leaves, mango leaves, and a garland of flowers. An inverted silver or copper pot (kalash) is placed on top. This Gudi is hoisted outside homes and symbolizes victory, prosperity, and the warding off of evil.","s":"SSC Stenographer 7/08/2025 (Shift 2)"},{"n":427,"t":"Festivals","q":"Read the following statements carefully and choose the correct option:\nAssertion (A): The Santhal festival of Erok Sim marks the end of the agricultural season.\nReason (R): The Magh Sim festival expresses gratitude for the harvest and prepares for a new cycle.","o":["A is incorrect, but R is correct.","Both A and R are correct, and R correctly explains A.","Both A and R are correct, but R does not explain A.","A is correct, but R is incorrect."],"a":0,"e":"The Erok Sim festival of the Santal tribe marks the beginning of the sowing season. Celebrated in May and June, it is an agricultural festival where prayers and offerings are made to deities for abundant rainfall and a successful harvest.","s":"SSC Stenographer 8/08/2025 (Shift 2)"},{"n":428,"t":"Festivals","q":"Which of the following festivals is celebrated by the tribal communities of Nagaland and showcases traditional dance and music?","o":["Ugadi","Hornbill Festival","Teej","Onam"],"a":1,"e":"Hornbill Festival. The Hornbill Festival, often called the \"Festival of Festivals\", is celebrated every year in Nagaland (since 2000). It is held in the first week of December at the Naga Heritage Village, Kisama. Ugadi – New Year festival of Andhra Pradesh, Telangana, Karnataka. Teej – Women’s festival celebrated in Rajasthan, Bihar, Uttar Pradesh, and Nepal. Onam – Harvest festival of Kerala.","s":"SSC Stenographer 8/08/2025 (Shift 3)"},{"n":429,"t":"Festivals","q":"Assertion (A): Cheti Chand marks the beginning of the Sindhi New Year.\nReason (R): It is celebrated on the first day of the Sindhi month of Chet (Chaitra).","o":["Both A and R are true, and R is the correct explanation of A","Both A and R are true, but R is not the correct explanation of A","A is true, R is false","A is false, R is true"],"a":0,"e":"Cheti Chand is the most significant festival of the Sindhi community, celebrated as the Sindhi New Year. It coincides with the first day of the Sindhi month of Chet (Chaitra), usually falling in March or April. The festival also commemorates the birth of Jhulelal, the Ishta Dev (community deity) of Sindhis. Hence, both statements are correct, and the reason properly explains the assertion.","s":""},{"n":430,"t":"Festivals","q":"Consider the following statements:\n1. Kharchi Puja of Tripura is also called the Festival of 14 Gods.\n2. It is celebrated in the month of December every year.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Kharchi Puja occurs during the month of ‘Ashad (July-August)’ on the ‘Shukla Ashtami’ day. Other Festivals of Tripura: Pilak, Garia Puja, Bijhu, Owa.","s":""},{"n":431,"t":"Festivals","q":"Where is the Kala Ghoda Arts Festival organised every year?","o":["Mumbai","New Delhi","Chennai","Bengaluru"],"a":0,"e":"Mumbai. The Kala Ghoda Arts Festival, initiated in 1999, is a nine-day annual celebration of arts organized by the Kala Ghoda Association. Other festivals in Mumbai: Dahi Handi Festival, Ganesh Chaturthi/Ganeshotsav, Banganga Festival, Elephanta Festival.","s":""},{"n":432,"t":"Festivals","q":"Consider the following statements:\n1. Losoong is celebrated mainly by the Lepcha tribe of Sikkim.\n2. It marks the celebration of wheat harvest in Sikkim.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":3,"e":"Neither 1 nor 2. Losoong is celebrated mainly by the Bhutia tribe, not the Lepchas. (Lepchas celebrate festivals like Tendong Lho Rum Faat.) Losoong marks the harvest of paddy, not wheat.","s":""},{"n":433,"t":"Festivals","q":"‘ Dashain’ and ‘Tihar’ are popular festivals of which neighbouring country of India?","o":["Sri Lanka","Nepal","Pakistan","Bangladesh"],"a":1,"e":"Nepal. Dashain Festival, also known as Vijaya Dashami, is celebrated by Hindus. Tihar, also known as Deepawali or Yamapanchak. Festivals of Nepal: Biska Jatra, Gai Jatra, Indra Jatra, Maghe Sankranti, Pahan Charhe, Chhechu. Sri Lanka - Kandy Esala Perahera, Poson Poya, Vel Festival. Bangladesh - Shakrain, Pahela Baishakh. Pakistan - Shandur Polo Festival, Mela Chiraghan, Urs of Data Ganj Bakhsh.","s":""},{"n":434,"t":"Festivals","q":"In which of the following states is Aoleang Monyü celebrated, which is an ancient spring festival celebrated by all Konyaks in the month of April?","o":["Bihar","Telangana","Odisha","Nagaland"],"a":3,"e":"Nagaland. Aoleang is observed to mark the end of the old year and to welcome the new-year beginning with spring. This festival is celebrated annually as part of the Mini Hornbill Tribal Festival. Festivals of Nagaland: Hornbill, Sekrenyi, Moatsu Mong, Suhkruhnye, Bushu, Yemshe, Metumniu, Metemneo, Ngada, Tokhu Emong.","s":""},{"n":435,"t":"Festivals","q":"Consider the following statements regarding Vangpui Kut of Mizoram:\n1. Vangpui Kut is celebrated for 2 days at Dungtlang village in Champai District since 1984.\n2. Vangpui Kut is a thanksgiving ceremony observed on a full moon night after the harvest.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The thanksgiving ceremony observed on a full moon night after harvest refers to Khuado Kut, not Vangpui Kut.","s":""},{"n":436,"t":"Festivals","q":"‘Attolu Eidu' is the cultural festival of which of the following union territories?","o":["Jammu and Kashmir","Dadra and Nagar Haveli","Andaman and Nicobar Islands","Lakshadweep"],"a":3,"e":"Lakshadweep. Attolu Eidu festival was conducted across Lakshadweep Island, at locations such as Minicoy, Kalpeni, Amini, Kiltanam and Kavaratt.","s":""},{"n":437,"t":"Festivals","q":"Which of the following folk dances is conducted during the Bwisagu Festival?","o":["Bhortal","Jhumur","Bagurumba","Bihu dance"],"a":2,"e":"Bagurumba. Bwisagu is the springtime festival of the Bodo community that marks the beginning of the New Year in the month of Baisakh (mid-April). The Bagurumba dance or 'Butterfly Dance,' is performed by Bodo women. The Bagurumba dance is a celebration of life, nature, and the vibrant culture of the Bodo tribe. Bhortal Nritya (Assam) - Performed by Barpeta tribe , Jhumur dance (Assam) - Performed by the Kulis (tea tribe).","s":""},{"n":438,"t":"Festivals","q":"Consider the following statements regarding Lathmar Holi:\n1. Lathmar Holi is celebrated in Barsana and Nandgaon, associated with Radha and Krishna.\n2. This festival is primarily celebrated in the state of Uttar Pradesh.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Famous festivals of Uttar Pradesh - Gaurav Mahotsav, Ramotsav, Taj Mahotsav, Ayodhya Deepotsav, Ganga Mahotsav.","s":""},{"n":439,"t":"Festivals","q":"Consider the following statements about ‘Nuakhai’ festival:\n1. ‘Nuakhai’ is an annual harvest festival that marks the arrival of the new rice season.\n2. It is regarded as the state festival of Bihar.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Nuakhai is the state festival of Odisha.","s":""},{"n":440,"t":"Festivals","q":"Which of the following festivals is celebrated as the birth anniversary of Guru Nanak Dev?","o":["Hola Mohalla","Baisakhi","Gurpurab","Chappar Mela"],"a":2,"e":"Gurpurab. Guru Nanak Jayanti, also known as Gurpurab, celebrates the birth anniversary of the first Sikh Guru, Guru Nanak Dev. This festival occurs on Kartik Poornima, the fifteenth lunar day of the month of Kartik, typically in November on the Gregorian calendar. Hola Mohalla, or Hola, is a three-day Sikh festival that usually takes place in March. Vaisakhi, celebrated on April 13 or sometimes April 14, marks the first day of the month of Vaisakh. Chhapar Mela, a popular Punjabi fair, occurs annually in September in the village of Chhapar in the Ludhiana district of Punjab.","s":""},{"n":441,"t":"Festivals","q":"Harela is a festival of greenery, peace, prosperity, and environmental conservation, primarily celebrated in which of the following states ?","o":["Madhya Pradesh","Haryana","Assam","Uttarakhand"],"a":3,"e":"Uttarakhand. Harela, meaning \"Day of Green,\" marks the new harvest brought by the rainy season and is celebrated annually during the Shravan month in the Kumaon region. Important Indian Festivals - Uttarakhand : Phool Dei, Olgia/Ghee Sankranti, Bat Savitri, Ganga Dussehra/Dasar, Nanda Devi Rajjaat. Assam : Ambubachi festival, Bihu, Majuli festival. Madhya Pradesh : Khajuraho festival, Lokrang Festival, Bhagoria Haat Festival.","s":""},{"n":442,"t":"Festivals","q":"Consider the following statements regarding the ‘Sangken’ festival:\n1. Sangken is a water festival celebrated in Arunachal Pradesh by the Khampti and Singpho tribes.\n2. It is celebrated by the Theravada Buddhist community and is similar to the Songkran festival of Thailand.","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Sangken (festival of water) is an annual three-day long festival. The Khampti and Singpho tribes of the Lohit district in Arunachal Pradesh celebrate it. Buddhist festivals include Buddha Purnima, Hemis Festival, Losar Festival, Lumbini Festival, Parinirvana Day, Rumtek Chaam Festival and Mani Rimdu Festival.","s":""},{"n":443,"t":"Festivals","q":"Shab-e-Barat is celebrated by which religious group?","o":["Muslim","Buddhist","Jain","Parsi"],"a":0,"e":"Muslim. Shab-e-Barat, also known as Mid-Sha'ban, is observed on the 15th night of Sha'ban in the Islamic calendar. Festivals celebrated by : Muslim - Eid-al-Fitr, Eid-al-Adha etc; Buddhist - Buddha Purnima, Vesak etc; Jain - Mahavir Jayanti, Paryushana etc; Parsi - Navroz, Jamshedi Navroz etc.","s":""},{"n":444,"t":"Festivals","q":"Consider the following statements regarding Indian festivals:\n1. Hemis Festival is celebrated in Ladakh and is associated with Buddhist traditions.\n2. Thrissur Pooram is a famous temple festival of Tamil Nadu, celebrated in the Tamil month of Aadi (July -August).\nWhich of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Thrissur Pooram is not of Tamil Nadu; it is a temple festival of Kerala, celebrated in the Malayalam month of Medam (April–May).","s":""},{"n":445,"t":"Festivals","q":"The festival of ‘Rath Yatra’ of Puri in Odisha is dedicated to which deity?","o":["Lord Jagannath","Lord Ganesha","Lord Shiva","Lord Hanuman"],"a":0,"e":"Lord Jagannath. Rath Yatra Festival : Celebrated on the second day of the bright fortnight in the month of Ashadha, this festival features a public procession with three large chariots carrying the deities Jagannath, Balabhadra, Subhadra.","s":""},{"n":446,"t":"Festivals","q":"Paryushana festival is celebrated by the people of which of the following communities?","o":["Jain","Muslim","Hindu","Sikh"],"a":0,"e":"Jain. This 8-10 days festival inspires Jains worldwide to remember the roots and philosophies of Jainism. Celebrating paryushan also brings a social purpose as well. Other Religious festivals : Jain - Mahavir Jayanti, Rohini Vrat, Samvatsari, Meru Trayodashi etc. Muslim - Eid ul Fitr, Eid ul Adha, Ramadan, Muharram etc. Sikh - Hola Mohalla, Vaisakhi, Maghi etc. Hindu -Holi, Diwali, Rakshabndahn etc.","s":""},{"n":447,"t":"Festivals","q":"Match the following festivals with their respective states: Festivals States\nA. Thaipusam Festival 1.Madhya Pradesh\nB. Jaisalmer Desert 2. Tamil Nadu Festival\nC. Bihu Festival 3. Rajasthan\nD. Khajuraho Dance 4. Assam Festival","o":["A-2, B-3, C-4, D-1","A-3, B-4, C-1, D-2","A-4, B-2, C-3, D-1","A-1, B-2, C-4, D-3"],"a":0,"e":"A-2, B-3, C-4, D-1.","s":""},{"n":448,"t":"Festivals","q":"Kajari Mahotsav is primarily celebrated in which of the following districts of Uttar Pradesh?","o":["Mirzapur","Gorakhpur","Kushi Nagar","Jhansi"],"a":0,"e":"Mirzapur. The festival is celebrated in honor of King Kantit Naresh's daughter, Kajali, renowned for her melodious love songs. Other major festivals in Uttar Pradesh include Ganga Mahotsav in Varanasi and Taj Mahotsav in Agra.","s":""},{"n":449,"t":"Festivals","q":"Consider the following statements about the Chariot Festival (Rath Yatra):\n1. The Chariot Festival is dedicated to Lord Jagannath, his brother Balabhadra, and his sister Subhadra.\n2. The Jagannath Temple, where this festival is celebrated, is located in Madhya Pradesh. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The Jagannath Temple is in Puri, Odisha.","s":""},{"n":450,"t":"Festivals","q":"In which of the following states is Me - dam - me - phi festival primarily celebrated?","o":["Bihar","Assam","Nagaland","Odisha"],"a":1,"e":"Assam. Me-Dam-Me-Phi is a community festival celebrated by the Ahom people in memory of their dearly departed. ‘Me’ means offering, ‘Dam’ means ancestors and ‘Phi’ means god. The major festivals celebrated in Assam are Bihu, Baishagu, Ali-Ai-Ligang, Baikho, Rongker, Bohaggiyo Bishu, and Ambubashi Mela.","s":""},{"n":451,"t":"Festivals","q":"Consider the following statements about the festival ‘Atla Taddi’:\n1. Atla Taddi is a festival widely celebrated in Goa, where women pray to Goddess Gauri for marital blessings.\n2. The festival is celebrated on the third night after the full moon in the month of Aswiyuja (September–October). Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Atla Taddi is not from Goa, it is widely celebrated in Andhra Pradesh. Other festivals of Andhra Pradesh: Ugadi, Ratha Saptami, Tirupati Ganga Jatara, Pyditthallamma utsavam, Rottela Panduga (Rotiyaan ki Eid), Visakha Utsav, Lumbini festival.","s":""},{"n":452,"t":"Festivals","q":"Kati Bihu is celebrated in which of the following months in Assam?","o":["March","October","January","November"],"a":1,"e":"October. Kati Bihu is one of the three Bihu festivals celebrated in Assam. Kati means to cut and this day marks the time of relocation of rice saplings. It is also known as Kongali Bihu. There are another two Bihu festivals celebrated in Assam - Bhogali (Magh Bihu) is observed in January and Rongali (Bohag Bihu) is observed in April. Other festivals of Assam: Baishagu, Ali-Ai-Ligang, Baikho, Rongker, Bohaggiyo Bishu, Ambubashi Mela and Jonbill Mela.","s":""},{"n":453,"t":"Festivals","q":"Match the following festivals with their respective states: Festivals States\nA. Baishagu 1. Odisha\nB. Chhath 2. Assam\nC. Raja Parba 3. Bihar\nD. Me-Dam-Me-Phi 4. Arunachal Pradesh","o":["A-2, B-3, C-1, D-4","A-3, B-2, C-1, D-4","A-4, B-3, C-2, D-1","A-1, B-4, C-3, D-2"],"a":0,"e":"A-2, B-3, C-1, D-4.","s":""},{"n":454,"t":"Festivals","q":"By what name is the festival of Makar Sankranti celebrated in Assam?","o":["Pedda Padunga","Thai Pongal","Pongal","Magh Bihu"],"a":3,"e":"Magh Bihu. Makar Sankranti is celebrated in January and marks the transition of the sun into the zodiac sign Capricorn (Makar). This event symbolizes the end of winter and the beginning of longer days, as the sun starts moving northward (known as Uttarayana). The festival is celebrated under various names in different parts of India -Makar Sankranti: Kerala, Odisha, Karnataka, Maharashtra, Goa, and West Bengal. Maghi Saaji: Himachal Pradesh. Sakrat: Haryana and Rajasthan. Thai Pongal: Tamil Nadu (celebrated as a harvest festival). Ghughuti: Uttarakhand. Dahi Chura: Bihar (the traditional dish eaten during this festival). Khichdi Parv: Uttar Pradesh (where khichdi is prepared as part of the celebrations). Uttarayan: Gujarat (popular for the kite-flying tradition).","s":""},{"n":455,"t":"Festivals","q":"Which of the following festivals observed in Assam is majorly celebrated by Vaishnavites?","o":["Bihu","Doljatra","Ambuchi Mela","Rongker"],"a":1,"e":"Doljatra (Dol Purnima) is a Hindu festival that celebrates the love between Radha and Krishna, observed on the full moon day of the Falgun month. Bihu consists of three festivals - Rongali, Kongali, and Bhogali - celebrated by all Assamese people, regardless of religion. Ambubachi Mela is held at the Kamakhya Temple in Guwahati, dedicated to Goddess Kamakhya, a Shakti deity.","s":""},{"n":456,"t":"Festivals","q":"Consider the following statements regarding Makar Sankranti:\n1. Makar Sankranti is dedicated to Lord Surya (Sun God).\n2. It signifies the entry of the Sun into the zodiac sign of Makara (Capricorn).\n3. The festival is related to Lord Ganesha and celebrated as Ganesh Chaturthi.\nWhich of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. The festival dedicated to Lord Ganesha is Ganesh Chaturthi, not Makar Sankranti.","s":""},{"n":457,"t":"Festivals","q":"Consider the following statements regarding the Bihu festival:\n1. Bihu is the main festival of Assam, celebrated three times a year.\n2. Rongali Bihu, celebrated in October, marks the Assamese New Year. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Rongali Bihu is celebrated in April, not October. It marks the Assamese New Year and the beginning of the sowing season. October Bihu is Kangali Bihu, which is solemn in nature. Bhogali Bihu (January) marks the harvest's end.","s":""},{"n":458,"t":"Festivals","q":"Match the following festivals with their associated states/religions: Festivals States/Religion\nA. Hola Mohalla 1. Madhya Pradesh\nB. Lokranjan 2. Andhra Pradesh Festival\nC. Rottela Panduga 3. Sikhism (Roti Festival)","o":["A–3, B–1, C–2","A–1, B–2, C–3","A–2, B–3, C–1","A–3, B–2, C–1"],"a":0,"e":"A–3, B–1, C–2. Hola Mohalla → Sikhism – celebrated mainly at Anandpur Sahib, Punjab; initiated by Guru Gobind Singh in 1699. Lokranjan Festival → Madhya Pradesh – tribal/folk festival organized at Khajuraho by Adivasi Lok Kala Academy. Rottela Panduga (Roti Festival) → Andhra Pradesh – observed in Nellore at Bara Shaheed Dargah during Muharram.","s":""},{"n":459,"t":"Festivals","q":"Consider the following statements regarding the Vishu festival:\n1. Vishu is celebrated as the New Year festival mainly in Kerala and Tamil Nadu.\n2. Vishu is observed on the first day of the month of Vaisakh according to the Hindu lunar calendar. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Vishu is not observed in Vaisakh month (North Indian calendar), but in the Malayalam month of Medam, which generally falls in mid-April. New year festivals : Ugadi (Andhra Pradesh, Karnataka, Telangana), Gudi Padwa (Maharashtra), Baisakhi (Punjab, Haryana), Pohela Boishakh (West Bengal, Tripura), Puthandu (Tamil Nadu), Bohag Bihu (Assam), Cheti Chand (Sindhi community), Losoong (Sikkim), Navreh (Kashmir), Chaitra Sukladi (North India).","s":""},{"n":460,"t":"Festivals","q":"Sakewa is a religious festival celebrated by the Kirat Khambu Rai community of","o":["Arunachal Pradesh","Goa","Sikkim","Himachal Pradesh"],"
