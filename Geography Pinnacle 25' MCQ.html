<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinnacle Geography — 925 Question Atlas Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --paper: #ece3ce;
    --paper-dark: #ddd0af;
    --ink: #24301f;
    --ink-soft: #4a5240;
    --forest: #29402c;
    --forest-deep: #17251a;
    --clay: #b5502e;
    --clay-dark: #8f3c22;
    --water: #2e5a68;
    --water-light: #4c7f8c;
    --gold: #a9822f;
    --correct: #2f6b3f;
    --correct-bg: #dcead9;
    --wrong: #a3352b;
    --wrong-bg: #f3dcd7;
    --line: rgba(36,48,31,0.18);
    --shadow: 0 10px 30px rgba(23,37,26,0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 18% 12%, rgba(41,64,44,0.05) 0, transparent 45%),
      radial-gradient(circle at 82% 82%, rgba(46,90,104,0.06) 0, transparent 50%),
      repeating-linear-gradient(0deg, rgba(36,48,31,0.028) 0px, rgba(36,48,31,0.028) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(36,48,31,0.02) 0px, rgba(36,48,31,0.02) 1px, transparent 1px, transparent 26px);
    background-attachment: fixed;
  }

  .topbar{
    position: sticky; top:0; z-index: 50;
    background: linear-gradient(180deg, var(--forest-deep), var(--forest) 92%);
    color: #ece3ce;
    border-bottom: 3px double var(--gold);
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .topbar-inner{
    max-width: 1080px; margin:0 auto;
    padding: 14px 20px;
    display:flex; align-items:center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand .compass{
    display:inline-block; width:30px; height:30px;
    border: 2px solid #e7cf8e; border-radius: 50%;
    position: relative; flex-shrink:0;
  }
  .brand .compass::before, .brand .compass::after{
    content:""; position:absolute; background:#e7cf8e;
  }
  .brand .compass::before{ width:2px; height:14px; top:2px; left:13px; transform: rotate(20deg); }
  .brand .compass::after{ width:8px; height:2px; top:14px; left:11px; background:var(--clay); }
  .brand h1{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700; font-size: 1.28rem; letter-spacing: 0.01em;
    margin:0; color:#f4ead0;
  }
  .brand small{
    display:block; font-family:'JetBrains Mono', monospace; font-size:0.66rem;
    color:#c9b98a; letter-spacing:0.08em; text-transform:uppercase; margin-top:2px;
  }
  .stat-strip{
    display:flex; gap:18px; font-family:'JetBrains Mono', monospace; font-size:0.78rem;
    color:#e7dcbf;
  }
  .stat-strip div span{ display:block; color:#f4ead0; font-size:1rem; font-weight:600; }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 26px 20px 70px; }

  .controls{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
    background: #f4edd9; border:1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .controls label{
    font-family:'JetBrains Mono', monospace; font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft); display:block; margin-bottom: 4px;
  }
  select, input[type="number"], input[type="text"]{
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 0.95rem; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #fffdf6; color: var(--ink);
  }
  select:focus, input:focus{ outline: 2px solid var(--water-light); outline-offset:1px; }
  .field{ display:flex; flex-direction:column; }
  .grow{ flex: 1 1 220px; }
  .jump-form{ display:flex; gap:8px; align-items:flex-end; }
  .jump-form input{ width: 90px; }

  button{
    font-family:'JetBrains Mono', monospace; font-size:0.76rem; letter-spacing:0.04em;
    text-transform: uppercase; cursor:pointer; border-radius: 6px; border: 1px solid transparent;
    padding: 9px 14px; transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-primary{ background: var(--forest); color:#f4ead0; }
  .btn-primary:hover{ background: var(--forest-deep); }
  .btn-ghost{ background: transparent; border:1px solid var(--ink-soft); color: var(--ink-soft); }
  .btn-ghost:hover{ background: rgba(36,48,31,0.06); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .card{
    position: relative;
    background: #fffdf6;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 30px 34px 26px;
    overflow: hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0; pointer-events:none;
    border: 10px solid transparent;
    border-image: linear-gradient(135deg, var(--gold), transparent 30%, transparent 70%, var(--water)) 1;
    opacity: 0.35;
  }

  .meta-row{
    display:flex; justify-content: space-between; align-items:center;
    margin-bottom: 14px; flex-wrap:wrap; gap:8px;
  }
  .qnum{
    font-family:'JetBrains Mono', monospace; font-weight:600; color: var(--clay-dark);
    font-size:0.85rem; letter-spacing:0.03em;
  }
  .topic-pill{
    font-family:'JetBrains Mono', monospace; font-size:0.66rem; text-transform:uppercase;
    letter-spacing:0.06em; background: var(--water); color:#eef5f2;
    padding: 4px 10px; border-radius: 999px;
  }
  .source-tag{
    font-family:'JetBrains Mono', monospace; font-size:0.66rem; color: var(--ink-soft);
  }

  .question-text{
    font-family:'Fraunces', Georgia, serif; font-weight:600;
    font-size: 1.32rem; line-height:1.45; color: var(--ink); margin: 6px 0 22px;
  }

  .options{ display:flex; flex-direction:column; gap:11px; margin-bottom: 6px; }
  .option{
    display:flex; gap:12px; align-items:flex-start;
    text-align:left; width:100%;
    background: #f8f3e4; border:1.5px solid var(--line); border-radius: 9px;
    padding: 12px 14px; font-size:1.01rem; line-height:1.4; color: var(--ink);
    cursor:pointer; transition: border-color .12s, background .12s, transform .05s;
  }
  .option:hover:not(.locked){ border-color: var(--water-light); background:#f2ede0; }
  .option .letter{
    font-family:'JetBrains Mono', monospace; font-weight:700; color: var(--water);
    background:#e4ecec; border-radius:5px; padding:2px 8px; flex-shrink:0; font-size:0.85rem;
  }
  .option.selected{ border-color: var(--water); box-shadow: 0 0 0 2px rgba(46,90,104,0.15) inset; }
  .option.correct{ background: var(--correct-bg); border-color: var(--correct); }
  .option.correct .letter{ background: var(--correct); color:#fff; }
  .option.wrong{ background: var(--wrong-bg); border-color: var(--wrong); }
  .option.wrong .letter{ background: var(--wrong); color:#fff; }
  .option.locked{ cursor: default; }
  .option.dim{ opacity:0.55; }

  .explain{
    margin-top: 18px; padding: 16px 18px;
    background: #f1ecdb; border-left: 4px solid var(--gold);
    border-radius: 0 8px 8px 0; display:none;
    font-size: 0.97rem; line-height:1.6; color: var(--ink-soft);
  }
  .explain.show{ display:block; animation: reveal .25s ease; }
  .explain b{ color: var(--forest); font-family:'Fraunces', serif; }
  @keyframes reveal{ from{opacity:0; transform: translateY(-4px);} to{opacity:1; transform:none;} }

  .result-flag{
    font-family:'JetBrains Mono', monospace; font-size:0.78rem; text-transform:uppercase;
    letter-spacing:0.05em; margin-top:14px; display:none; font-weight:600;
  }
  .result-flag.show{ display:block; }
  .result-flag.ok{ color: var(--correct); }
  .result-flag.bad{ color: var(--wrong); }

  .nav-row{
    display:flex; justify-content: space-between; align-items:center;
    margin-top: 24px; gap:10px; flex-wrap:wrap;
  }
  .nav-left, .nav-right{ display:flex; gap:8px; }

  .progress-bar{
    height: 6px; background: var(--paper-dark); border-radius: 4px; overflow:hidden;
    margin-bottom: 18px; border:1px solid var(--line);
  }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--water), var(--forest)); width:0%; transition: width .2s; }

  footer{
    text-align:center; padding: 30px 20px 50px; color: var(--ink-soft);
    font-family:'JetBrains Mono', monospace; font-size:0.72rem; letter-spacing:0.04em;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--ink-soft);
    font-family:'Fraunces', serif; font-size:1.1rem;
  }

  @media (max-width: 600px){
    .card{ padding:22px 18px; }
    .question-text{ font-size:1.12rem; }
    .stat-strip{ display:none; }
    .topbar-inner{ padding: 12px 14px; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="compass" aria-hidden="true"></span>
      <div>
        <h1>Pinnacle Geography Atlas Quiz</h1>
        <small>925 questions · SSC Stenographer 2025 compilation</small>
      </div>
    </div>
    <div class="stat-strip">
      <div>Attempted<span id="statAttempted">0</span></div>
      <div>Correct<span id="statCorrect">0</span></div>
      <div>Accuracy<span id="statAccuracy">—</span></div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="controls">
    <div class="field grow">
      <label for="topicSelect">Topic</label>
      <select id="topicSelect"></select>
    </div>
    <div class="field">
      <label for="jumpInput">Jump to question #</label>
      <div class="jump-form">
        <input type="number" id="jumpInput" min="1" max="925" placeholder="1–925">
        <button class="btn-ghost" id="jumpBtn">Go</button>
      </div>
    </div>
    <div class="field">
      <label for="shuffleBtn">&nbsp;</label>
      <button class="btn-ghost" id="shuffleBtn">Shuffle order</button>
    </div>
    <div class="field">
      <label for="resetBtn">&nbsp;</label>
      <button class="btn-ghost" id="resetBtn">Reset score</button>
    </div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="quizCard">
    <div class="meta-row">
      <span class="qnum" id="qNumLabel">Q. — / 925</span>
      <span class="topic-pill" id="qTopicLabel">Topic</span>
    </div>
    <div class="source-tag" id="qSourceLabel"></div>
    <div class="question-text" id="qText">Loading questions…</div>
    <div class="options" id="qOptions"></div>
    <div class="result-flag" id="resultFlag"></div>
    <div class="explain" id="qExplain"></div>

    <div class="nav-row">
      <div class="nav-left">
        <button class="btn-ghost" id="prevBtn">← Previous</button>
        <button class="btn-ghost" id="revealBtn">Reveal answer</button>
      </div>
      <div class="nav-right">
        <button class="btn-primary" id="nextBtn">Next →</button>
      </div>
    </div>
  </div>

  <footer>Compiled from Pinnacle SSC Stenographer Geography practice set · for personal study use</footer>
</div>

<script id="quiz-data" type="application/json">
[{"id": 1, "topic": "Solar System & Universe", "question": "What are the streams of charged particles ejected by the Sun into space called ?", "options": {"a": "Sunspots", "b": "Solar wind", "c": "Solar flares", "d": "Coronal loops"}, "answer": "b", "explanation": "Solar wind. It is a constant stream of charged particles (mostly protons and electrons) that are released from the Sun's upper atmosphere, known as the corona. The solar wind blows in all directions. It continues moving at that speed for about 10 billion kilometers (six billion miles). Sunspots are dark surface spots, Solar flares are sudden bursts of energy, and Coronal loops are arcs of hot plasma shaped by magnetic fields.", "source": "SSC Stenographer 6/08/2025 (Shift 2)"}, {"id": 2, "topic": "Solar System & Universe", "question": "Which of the following systems can be affected by a solar storm? 1. GPS signal accuracy 2. Power transmission systems 3. Submarine communication cables 4. Pipeline infrastructure", "options": {"a": "2 and 3 only", "b": "1 and 2 only", "c": "3 and 4 only", "d": "1, 2, 3, and 4 all of these"}, "answer": "d", "explanation": "1, 2, 3, and 4 all of these. Solar storms release high-energy charged particles and electromagnetic radiation that disturb Earth’s magnetosphere. This can disrupt GPS accuracy, power grids, submarine cables, and pipelines by inducing currents and affecting signal transmission. Hence, all four listed systems are vulnerable.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 3, "topic": "Solar System & Universe", "question": "Consider the following statements: 1. A solar eclipse- The Moon casts shadow on Earth when it comes between the Sun and Earth. 2. A lunar eclipse- During the new moon phase, the Moon passes through the Earth's shadow. Which of the statements given above is/are correct ?", "options": {"a": "Both 1 and 2", "b": "1 only", "c": "2 only", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "1 only. Statement 2: Incorrect. A lunar eclipse occurs at the full moon phase, not new moon. It happens when the Earth comes between the Sun and Moon, and Earth’s shadow falls on the Moon.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 4, "topic": "Solar System & Universe", "question": "Which of the following is the correct sequence in the life cycle of a star like the Sun?", "options": {"a": "Protostar → White Dwarf → Red Giant → Main Sequence", "b": "Nebula → Red Giant → Main Sequence → White Dwarf", "c": "Main Sequence → Red Giant → White Dwarf", "d": "Red Giant → Protostar → White Dwarf"}, "answer": "c", "explanation": "Main Sequence → Red Giant → White Dwarf. The life cycle of a medium-sized star (like our Sun) follows a specific sequence: 1. Nebula / Protostar stage – Stars are born in large clouds of gas and dust (nebula). The contracting gas forms protostar. 2.Main Sequence – The star spends most of its life in this stable phase, where hydrogen fusion occurs in the core (the Sun is currently in this stage). 3. Red Giant – After hydrogen in the core is exhausted, the star expands aBnd cools to become a Red Giant. 4. White Dwarf – Finally, after shedding its outer layers (planetary nebula), the star’s remaining m dense core becomes White Dwarf.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 5, "topic": "Solar System & Universe", "question": "How does the Faint Young Sun paradox cheallenge our understanding of early Earth's climate? SSC S tenographer 8/08/2025 (Shift 1)", "options": {"a": "It implies there was no liquid water on early Earth. F", "b": "It proves the Moon once had an atmosphere.", "c": "It suggests that early solar output was too weak to prevent global freezing.", "d": "It shows Earth was too hot due to excessive solar radiation."}, "answer": "c", "explanation": "The Faint Young Sun paradox arises because about 4 billion years ago, the Sun’s luminosity was only around 70% of its current strength, which should have left Earth frozen. However, geological evidence shows that liquid water existed, supporting life’s early evolution. This paradox challenges climate science by suggesting that greenhouse gases or other warming mechanisms must have compensated for the weaker Sun, preventing global freezing and maintaining habitable conditions on early Earth.", "source": null}, {"id": 6, "topic": "Solar System & Universe", "question": "Which type of galaxy has no regular shape and is rich in gas and dust?", "options": {"a": "Elliptical Galaxy", "b": "Lenticular Galaxies", "c": "Irregular Galaxy", "d": "Spiral Galaxy"}, "answer": "c", "explanation": "Irregular Galaxy. Irregular galaxies are those that lack a distinct shape (unlike elliptical or spiral galaxies). They are often rich in gas and dust, making them sites of active star formation. Examples include the Large Magellanic Cloud (LMC) and Small Magellanic Cloud (SMC) near the Milky Way. Elliptical Galaxy – Oval-shaped, contains older stars, and has little gas or dust. Lenticular Galaxies – A hybrid form between elliptical and spiral galaxies; disk-shaped but lacking significant spiral arms. Spiral Galaxy – Flat, rotating disk a with spiral arms, contains gas, dust, and young stars (e.g., Milky Way). a", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 7, "topic": "Solar System & Universe", "question": "Which planet has the longest day in the solar system? h", "options": {"a": "Venus", "b": "Mars", "c": "Jupiter", "d": "Earth"}, "answer": "a", "explanation": "Venus. A day on a planet is measured by its rotation period (time taken to complete one rotation on its axis). Venus rotates very slowly and in the opposite direction (retrograde rotation). One day on Venus (sidereal day) = 243 Earth days → the longest day in the solar system. Venus - Rotation period = 243 Earth days.Mars - Similar to Earth; 24 hours 37 minutes. Jupiter - Fastest rotation; ~9 hours 56 minutes (shortest day).Earth - 24 hours.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 8, "topic": "Solar System & Universe", "question": "Consider the following statements about the Geoid: 1. The term Geoid refers to the axis of the Earth. 2. The Earth is slightly flattened at the poles and bulges at the equator due to the outward force caused by its rotation. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. Geoid refers to the shape of the Earth, not its axis.", "source": null}, {"id": 9, "topic": "Solar System & Universe", "question": "Who gave the expanding universe hypothesis?", "options": {"a": "Galileo Galilei", "b": "Edwin Hubble", "c": "James Clerk Maxwell", "d": "CV Raman"}, "answer": "b", "explanation": "Edwin Hubble. The most popular argument regarding the origin of the universe is the Big Bang Theory. It is also called the expanding universe hypothesis. Edwin Hubble, in 1920, provided evidence that the universe is expanding. As time passes, galaxies move further and further apart. Galileo Galilei is known for his contributions to astronomy, particularly with the use of the telescope.", "source": null}, {"id": 10, "topic": "Solar System & Universe", "question": "Which of the below statements is/are correct? Statement 1: Callisto, Europa, and Ganymede are natural satellites of Jupiter. Statement 2: Triton is the largest moon of Neptune.", "options": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "c", "explanation": "Both Statement 1 and 2. Jupiter, the most massive planet of the solar system and the fifth in distance from the Sun. Revolution - 11 years and 11 months, Rotation - 9 hours 56 minutes.", "source": null}, {"id": 11, "topic": "Solar System & Universe", "question": "Which is, by far, the closest dwarf planet orbiting at only 2.8 times Earth’s distance from the sun ?", "options": {"a": "Ceres", "b": "Makemake", "c": "Eris", "d": "Pluto"}, "answer": "a", "explanation": "Ceres is the largest object in the asteroid belt between Mars and Jupiter, and it is the only dwarf planet located in the inner solar system. It was the first member of the asteroid belt to be discovered when Giuseppe Piazzi spotted it in 1801.", "source": null}, {"id": 12, "topic": "Solar System & Universe", "question": "Consider the following statements about a nebula: 1. A nebula is a cloud of dust and gas inside a galaxy, consisting mainly of hydrogen, helium, and other ionized gases. 2. Originally, the term nebula was used to describe only galaxies within the Milky Way. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. The term nebula was originally used for any diffuse astronomical object, including galaxies outside the Milky Way.", "source": null}, {"id": 13, "topic": "Solar System & Universe", "question": "A distinctive cross - shaped constellation best seen in the northern hemisphere during the summer and fall months around September is:", "options": {"a": "Cygnus", "b": "Ursa Major", "c": "Pegasus", "d": "Cassiopeia"}, "answer": "a", "explanation": "Cygnus. It is a northern constellation on the plane of the Milky Way, deriving its name from the Latinized Greek word for swan.", "source": null}, {"id": 14, "topic": "Solar System & Universe", "question": "Consider the following statements regarding planetary atmospheres: 1. Venus has thick white and yellowish clouds of sulphuric acid in its atmosphere. 2. Mars’ atmosphere is mainly composed of methane, with traces of sulfur dioxide. 3. Uranus is the coldest planet in the Solar System. 4. Venus is often referred to as the “morning star.” Which of the above statements is/are incorrect?", "options": {"a": "Only 2", "b": "Only 1 and 2", "c": "Only 2 and 3", "d": "Only 3 and 4"}, "answer": "a", "explanation": "Only 2. Mars, fourth planet in the solar system in order of distanche from the Sun and seventh in size and mass. It is a periodically consBpicuous reddish object in the night sky. Mars' atmosphere is 95.32% carbon dioxide, with methane and sulfur dioxide.", "source": null}, {"id": 15, "topic": "Solar System & Universe", "question": "The colour of the surface of Mars is red because of the presence of large amounts of chemical compounds in it. What is thee name of that compound ?", "options": {"a": "Magnesium oxide", "b": "Tin oxide", "c": "Iron oxide", "d": "Nitrogen oxide Srol.15."}, "answer": "c", "explanation": "Iron oxide. Mars appears reddish due to the presence of ferric iron in the form of red hematite (Fe O). The 2 3 surface pressure of Mars is 610 Pascals, and its gravity is about one - third of Earth's. A Martian day lasts 24 hours and 37 minutes. Mars has two moons: Phobos and Deimos.", "source": null}, {"id": 16, "topic": "Solar System & Universe", "question": "Which dwarf planet orbits the sun in 310 years at a distance between 38.5 to 53 AU ?", "options": {"a": "Eris", "b": "Ceres", "c": "Makemake", "d": "Pluto"}, "answer": "c", "explanation": "Makemake. It is the third-largest and second-brightest known dwarf planet. It was discovered in 2005. Pluto was discovered in 1930. It was initially classified as the ninth planet of the Solar System but was reclassified as a dwarf planet in 2006. Pluto has a natural satellite named 'Charon'.", "source": null}, {"id": 17, "topic": "Solar System & Universe", "question": "Which of the following is the second nearest star to Earth?", "options": {"a": "Proxima Centauri", "b": "Polaris", "c": "Sirius", "d": "Delta Velorum"}, "answer": "a", "explanation": "Proxima Centauri. It is the closest star to the sun, at a distance of 4.24 light - years. A light - year is the distance light travels in one year, which is about 9.461 x 10 12 kilometers. Polaris (North Star) is located nearly directly above Earth's North Pole along its rotational axis. Sirius (Dog Star) is the brightest star in Earth's night sky. Delta Velorum is a triple star system in the southern constellation of Vela.", "source": null}, {"id": 18, "topic": "Solar System & Universe", "question": "Which of the following statements most accurately describes the planet Saturn?", "options": {"a": "It is a gas giant made up mostly of hydrogen and helium and the density is less than that of water", "b": "Its surface is reddish in colour.", "c": "It was the seventh planet discovered in the Solar System.", "d": "Its cloud-like outer regions consist of methane in the gaseous form and ammonia in crystalline form."}, "answer": "a", "explanation": "Saturn's density (0.70 gm/cm 3) is less than that of water, making it the least dense planet in the solar system. If there were a body of water large enough, Saturn would theoretically float. The presence of methane and ammonia is more characteristic of Uranus and Neptune.", "source": null}, {"id": 19, "topic": "Solar System & Universe", "question": "Which of the following rocky planets is the fastest planet in our solar system – traveling through space at about 29 miles (47 kilometers) per second?", "options": {"a": "Earth", "b": "Mercury", "c": "Venus", "d": "Mars"}, "answer": "b", "explanation": "Mercury. It is the nearest to the sun. It takes only about 88 days to complete one round along its orbit. Venus: It is considered as ‘Earth’s - twin’ because its size and shape are very much similar to that of the earth. Venus is also known as Lucifer. Earth is the fifth largest planet (in size). It is slightly flattened at the poles and its shape is described as a Geoid. Mars - The fourth planet from the Sun and it is a dusty, cold, desert world with a very thin atmosphere.", "source": null}, {"id": 20, "topic": "Solar System & Universe", "question": "Which of the following is one of the largest spiral galaxies?", "options": {"a": "NGC 6872", "b": "Milky Way", "c": "Cygnus A", "d": "Maffei 1"}, "answer": "a", "explanation": "NGC 6872, which is one of the largest spiral galaxies, spanning 522,000 light-years across, approximately five times the size of the Milky Way. It is located 212 million light-years from Earth in the southern constellation Pavo.", "source": null}, {"id": 21, "topic": "Solar System & Universe", "question": "Match the following planets with their approximate day length (rotation period): List I List II (Planet) (Day Length in Hours) A. Mercury i. 25 B. Venus ii. 1,408 C. Mars iii. 5,832 D. Neptune iv. 16", "options": {"a": "A–ii, B–iii, C–i, D–iv", "b": "A–iii, B–ii, C–i, D–iv", "c": "A–ii, B–iv, C–i, D–iii", "d": "A–iv, B–iii, C–ii, D–i"}, "answer": "a", "explanation": "A–ii, B–iii, C–i, D–iv. Planet and Day Length in hours: Mercury (1,408), Venus (5,832), Earth (24), Mars (25), Jupiter (10), Saturn (11), Uranus (17). Mercury is nearest to the sun. takes only about 88 days to complete one round along its orbit.", "source": null}, {"id": 22, "topic": "Solar System & Universe", "question": "Who was the first to develop mathematical predictive heliocentric model of the solar system ?", "options": {"a": "Nicolaus Copernicus", "b": "Galileo Galilei", "c": "Pierre-Simon Laplace", "d": "Immanuel Kant"}, "answer": "a", "explanation": "Nicolaus Copernicus. Although Aryabhatta (5th century A.D.) hinted astronomical ideas, Copernicus (1473 1543) developed the first mathematical heliocentric model, where planets revolved around a fixed Sun. Galileo supported this model, and Johannes Kepler later refined it by introducing elliptical orbits, now known as Kepler's laws.", "source": null}, {"id": 23, "topic": "Solar System & Universe", "question": "Who calculated the approximate location of the planet Neptune by studying gravity- induced distur bances the motion of Uranus?", "options": {"a": "John Couch Adams", "b": "Percival Lowell", "c": "Johann Gottfried Galle", "d": "Urbain-Jean-Joseph Le Verrier"}, "answer": "d", "explanation": "Urbain - Jean - Joseph Le Verrier. He was a French astronomer and mathematician. Neptune is the eighth and most distant planet in our solar system, and it is the second coldest planet. It was discovered in 1846. It is the windiest planet in our solar system. One day on Neptune takes about 16 hours.", "source": null}, {"id": 24, "topic": "Solar System & Universe", "question": "Which of the below statements is/are correct? Statement 1: Apogee is the point in the orbit of an object around the Earth where it is farthest from the Earth’s center. Statement 2: Perigee refers to the point where the Moon’s orbit is closest to the Earth.", "options": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "c", "explanation": "Both Statement 1 and 2. Perihelion: The Earth closest to the Sun on 3rd January. Aphelion: The Earth farthest from the Sun on 4th July.", "source": null}, {"id": 25, "topic": "Solar System & Universe", "question": "Which of the below statements is/are incorrect? Statement 1: The Big Dipper is an asterism formed by the seven brightest stars in the constellation Orion. Statement 2: Ursa Major is the largest constellation in the entire sky.", "options": {"a": "Only Statement 1 It", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "c", "explanation": "Both Statement 1 and 2. Statement 1 is incorrect because the Big Dipper belongs to the constellation Ursa Major, not Orion. Statement 2 is also incorrect because Ursa Major (Great Bear) is the third - largest constellation in the sky and the largest constellation in the Northern Hemisphere. e at", "source": null}, {"id": 26, "topic": "Solar System & Universe", "question": "A constellamtion of the northern sky - easily recognised by a group of five bright stars forming a slightly irregular ‘W’ is called:", "options": {"a": "Cassiopeia", "b": "Orion", "c": "Ursa Major", "d": "Cygnus"}, "answer": "a", "explanation": "Cassiopeia. It is a prominent constellation in the northern sky. It is F visible during winter in the early part of the night. It looks like a distorted letter W in or M.", "source": null}, {"id": 27, "topic": "Solar System & Universe", "question": "Assertion (A): Saturn is the second largest planet in our Solar System and has the most prominent ring system. Reason (R): Saturn is larger than Jupiter and has Titan, the largest moon in the Solar System.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "c", "explanation": "A is true, but R is false. Our Solar System has eight planets which orbit the sun. In order of distance from the sun they are: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. Largest to smallest: Jupiter, Saturn, Uranus, Neptune, Earth, Venus, Mars, Mercury. Saturn moon Titan is the second largest moon after Ganymede (Jupiter’s moon).", "source": null}, {"id": 28, "topic": "Solar System & Universe", "question": "_________ oblong orbit overlaps the orbit of Neptune.", "options": {"a": "Jupiter’s", "b": "Pluto’s", "c": "Venus’", "d": "Mars’"}, "answer": "b", "explanation": "Pluto’s. Neptune is the outermost Jovian planet in the solar system. Until 2006 Pluto was the farthest planet from the Sun. In 2006, The International Astronomical Union (IAU) downgraded the status of Pluto to that of a dwarf planet. The Jovian planets are Jupiter, Saturn, Uranus, and Neptune, which are also known as the gas giants.", "source": null}, {"id": 29, "topic": "Solar System & Universe", "question": "Which of the following statements about planet Saturn is true?", "options": {"a": "Saturn is the fourth planet from the Sun and the largest planet in our solar system.", "b": "Satellites like Enceladus and Titan of Saturn are home to internal oceans, could possibly support life.", "c": "Saturn's environment is conducive to life.", "d": "Saturn is a massive ball made up mostly nitrogen."}, "answer": "b", "explanation": "Saturn is the second largest planet, composed of hydrogen and helium. It has 146 moons. Titan - It is the largest moon of Saturn and the second largest moon in our solar system. Enceladus - It is the second nearest of the major regular moons of Saturn and the brightest of all its moons. It was discovered in 1789 by the English astronomer William Herschel. It is found that Titan has methane in its atmosphere and Enceladus has a liquid ocean with erupting plumes of gas and water.", "source": null}, {"id": 30, "topic": "Solar System & Universe", "question": "Which star is also known as the ‘Pole Star’ ?", "options": {"a": "The East star", "b": "The South star", "c": "The West star", "d": "The North star"}, "answer": "d", "explanation": "The North star. Polaris, also known as the North Star, is located almost directly above Earth's north pole along our planet's rotational axis. The imaginary line that runs through the Earth from the North Pole to the South Pole is called the Earth's axis of rotation. The Earth rotates around this axis, similar to how a top spins around its spindle.", "source": null}, {"id": 31, "topic": "Solar System & Universe", "question": "In 1905, who concluded with Thomas Chamberlain that the planets of the Solar System originated from an encounter between the Sun and another star?", "options": {"a": "James Hutton", "b": "Inge Lehmann", "c": "Charles Lyell", "d": "Forest Moulton"}, "answer": "d", "explanation": "Forest Moulton. He was an American astronomer and mathematician known for his contributions to celestial mechanics. He co-developed the Chamberlin-Moulton planetesimal hypothesis, which proposed a model for the formation of the solar system. According to this hypothesis, planets formed from smaller bodies called planetesimals through the process of accretion.", "source": null}, {"id": 32, "topic": "Solar System & Universe", "question": "Perihelion is when Earth is ______.", "options": {"a": "under the sun", "b": "farthest from the sun", "c": "nearest to the sun", "d": "above the sun"}, "answer": "c", "explanation": "nearest to the sun. On 3rd January, the earth is the nearest to the sun (147 million km). Aphelion is the point of the Earth’s orbit that is farthest away from the Sun.", "source": null}, {"id": 33, "topic": "Solar System & Universe", "question": "Which is the most widely accepted model to explain the formation and evaluation of the solar system?", "options": {"a": "Cloud hypothesis", "b": "Gas hypothesis", "c": "Nebular hypothesis", "d": "Solar hypothesis"}, "answer": "c", "explanation": "Nebular hypothesis - The planets were formed out of a cloud of material associated with a youthful sun, which was slowly rotating. The theory was developed by Immanuel Kant. But Mathematician Laplace revised it in 1796. Other Hypothesis: Big Bang Theory - Propounded by George Lamaitre related to the origin of the universe.", "source": null}, {"id": 34, "topic": "Solar System & Universe", "question": "Which trend is found about the distance between the galaxies?", "options": {"a": "Unpredictable", "b": "Decreasing", "c": "Constant", "d": "Increasing"}, "answer": "d", "explanation": "Increasing. In 1929, Edwin Hubble announced that almost all galaxies appeared to be moving away from us. He found that the universe was expanding - with all of the galaxies moving away from each other. This phenomenon was observed as a redshift of a galaxy's spectrum.", "source": null}, {"id": 35, "topic": "Solar System & Universe", "question": "Consider the following statements regarding terrestrial planets: 1. Terrestrial planets are primarily composed of rocks and metals. 2. Mercury, Venus, Earth, and Mars are classified as terrestrial planets. 3. Terrestrial planets can be further categorised into silicate, iron, coreless, and carbon (diamond) planets. 4. The atmosphere of all terrestrial planets is primarily made up of hydrogen and helium. Which of the above statements is/are correct?", "options": {"a": "Only 1, 2 and 3", "b": "Only 1 and 2", "c": "Only 2, 3 and 4", "d": "All of the above"}, "answer": "a", "explanation": "Only 1, 2 and 3. In our solar system, planets are broadly classified into two categories: terrestrial and Jovian. Terrestrial planets (Mercury, Venus, Earth, and Mars) are small, rocky, and relatively close to the Sun. Jovian planets (Jupiter, Saturn, Uranus, and Neptune) are gas giants, much larger and further from the Sun.", "source": null}, {"id": 36, "topic": "Solar System & Universe", "question": "Which scientist thought of the concept of the steady state of the universe?", "options": {"a": "Harold Jeffrey", "b": "Edwin Hubble", "c": "Fred Hoyle", "d": "Pierre - Laplace"}, "answer": "c", "explanation": "Fred Hoyle. Steady - State Theory: It is a theoretical model in whichh the Universe is constantly expanding but with a fixed average density. ThBe theory was put forward by three scientists Sir Hermann Bondi, Thomas e Gold, and Sir Fred Hoyle in 1948.", "source": null}, {"id": 37, "topic": "Solar System & Universe", "question": "Which of the below statements is/are incorrect? Statement 1: Comets are cosmic snowballs oef frozen gases, rock, and dust that orbit the Sun. Statement 2: Meteorites are stars that fall from space and burn completely b efore reaching the Earth’s surface. F", "options": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "b", "explanation": "Only Statement 2. Meteorites When a meteoroid survives its trip through the atmosphere and hits the ground, it’s called a meteorite. Meteorites typically range between the size of pebble and a fist.", "source": null}, {"id": 38, "topic": "Solar System & Universe", "question": "What is the radius of the earth?", "options": {"a": "7456 km", "b": "6371 km", "c": "5619 km", "d": "4728 km"}, "answer": "b", "explanation": "6371 km. Earth Distance from the Sun (150 million km), Surface area: 510.1 million km², Land area: 149 million km², Gravity: 9.8 m/s².", "source": null}, {"id": 39, "topic": "Solar System & Universe", "question": "Each orbit of the International Space Station (ISS) takes _____minutes.", "options": {"a": "80 - 82", "b": "85 - 87", "c": "90 - 93", "d": "83 -"}, "answer": "c", "explanation": "90-93. In 24 hours, the space station makes 16 orbits of Earth, traveling through 16 sunrises and sunsets.", "source": null}, {"id": 40, "topic": "Solar System & Universe", "question": "Match the following planets with their approximate rotation period (one spin on its axis): List I (Planet) List II (Rotation Period) A. Earth i. 17 hours 14 min B. Jupiter ii. 1 day (23 hours 56 min) C. Saturn iii. 9 hours 56 min D. Uranus iv. 10 hours 40 min", "options": {"a": "A–ii, B–iii, C–iv, D–i", "b": "A–iv, B–ii, C–i, D–iii", "c": "A–ii, B–iv, C–iii, D–i", "d": "A–i, B–iii, C–iv, D–ii"}, "answer": "a", "explanation": "A–ii, B–iii, C–iv, D–i.", "source": null}, {"id": 41, "topic": "Solar System & Universe", "question": "In early 1610, who discovered with his newly invented telescope that Jupiter has four mioons?", "options": {"a": "Simion Marius", "b": "Tycho Brahe a", "c": "Galileo Galilei", "d": "Johannes Kepler"}, "answer": "c", "explanation": "Galileo Galilei. He was an Italian astronomer and scientist. He described the rings of Saturn, the phases of Venus, sunsets, and the bumpy lunar surface. The four moons he discovered were: Io, Europa, Ganymede, and Callisto.", "source": null}, {"id": 42, "topic": "Solar System & Universe", "question": "Who was the first to accurately describe the rings of Saturn as a disc around the planet in 1655?", "options": {"a": "Hideki Yukawa", "b": "Galileo Galilei", "c": "Christiaan Huygens", "d": "Giovanni Cassini"}, "answer": "c", "explanation": "Christiaan Huygens. His other inventions include the pendulum clock, centrifugal governor, and magic lantern.", "source": null}, {"id": 43, "topic": "Solar System & Universe", "question": "The moon completes _________ rotation on its axis as it completes one - revolution around the Earth.", "options": {"a": "3", "b": "2", "c": "1", "d": "4"}, "answer": "c", "explanation": "1. The Moon is Earth's only natural satellite circling the planet at an a average distance of 384,400 kilometers. The Moon's presence helps stabilize our planet and moderate our climate. The radius of the Moon is 1.74 × 10 6 m. Huygens is the Moon's tallest mountain.", "source": null}, {"id": 44, "topic": "Solar System & Universe", "question": "Which of the following statements regarding the moon is correct? I. The size of the illuminated part of the moon visible from the Earth increases each day after the new moon day. II. After the full moon day, the sunlit part of the moon visible from the Earth 86 decreases in size every day.", "options": {"a": "Both I and II", "b": "Only I", "c": "Neither I nor II", "d": "Only II"}, "answer": "a", "explanation": "Both I and II. When there are two full moons within a month, the second full moon is called a Blue Moon, When a full moon occurs at its perigee (the moon is closest to the earth) it is called a Supermoon.", "source": null}, {"id": 45, "topic": "Solar System & Universe", "question": "The ______ radiation belts are giant swaths of magnetically trapped highly energetic charged particles that surround Earth.", "options": {"a": "Van Allen", "b": "Aurora", "c": "Kuiper", "d": "Chinook"}, "answer": "a", "explanation": "Van Allen. An aurora is natural phenomenon which is characterized by a display of natural-coloured (green, red, yellow or white) light in the sky.", "source": null}, {"id": 46, "topic": "Solar System & Universe", "question": "In which of the following periods is the meteor shower named Quadrantids generally visible from Earth?", "options": {"a": "August/September", "b": "October/November", "c": "May/June", "d": "December/January"}, "answer": "d", "explanation": "December / January. Quadrantids are best viewed in the Northern Hemisphere during the night and predawn hours. They are also known for their bright fireball meteors. The Quadrantids can produce over 100 meteors per hour in a moonless sky.", "source": null}, {"id": 47, "topic": "Solar System & Universe", "question": "Consider the following statements regarding solar eclipses: 1. A solar eclipse occurs when the Moon passes between the Earth and the Sun. 2. Types of solar eclipse include Total,F Hybrid, Annular, and Partial. 3. In an annular solar eclipse, the Moon appears smaller than the Sun and does not completely cover it. 4. A penumbral eclipse is a type of solar eclipse. Which of the above statements is/are correct?", "options": {"a": "Only 1, 2 and 3", "b": "Only 1 and 3", "c": "Only 2 and 4", "d": "All of the above"}, "answer": "a", "explanation": "Only 1, 2 and 3. Penumbral (Lunar eclipse). A solar eclipse occurs when the Moon passes between the Earth and the Sun. Types of solar eclipse: Total (Completely blocking the face of the Sun), Hybrid (the Moon is farther away from Earth, it appears smaller than the Sun and does not completely cover the Sun) and Annular (when Sun is at or near its farthest point from Earth).", "source": null}, {"id": 48, "topic": "Solar System & Universe", "question": "In which of the following months may the meteor shower named Lyrids be seen from Earth?", "options": {"a": "April", "b": "February", "c": "June", "d": "August"}, "answer": "a", "explanation": "April. The radiant point for the Lyrid meteor shower is near the constellation Lyra, which has the bright star Vega in the east. Longitudes and Latitudes", "source": null}, {"id": 49, "topic": "Longitudes and Latitudes", "question": "At what latitude does the easterly jet stream blow over peninsular India during the summer months?", "options": {"a": "24°N", "b": "30°N", "c": "14°N", "d": "28°N"}, "answer": "c", "explanation": "14°N. The Jet Stream is a geostrophic wind blowing horizontally through the upper layers of the troposphere, generally from west to east. The tropical easterly jet stream, located between 8 and 35 degrees north latitude, is connected to the southwest monsoon in India.", "source": null}, {"id": 50, "topic": "Longitudes and Latitudes", "question": "In which month is the InterTropical Convergence Zone (ITCZ) located around 20°N-25°N latitude (over the Gangetic plain) ?", "options": {"a": "May", "b": "August", "c": "June", "d": "July"}, "answer": "d", "explanation": "July. The Inter Tropical Convergence Zone (ITCZ) is a low pressure zone lmocated at the equator where trade winds converge, and so, it is a zone where air tends to ascend. The Inter-Tropical Convergence Zone located around 20°N-25°N latitudes (over the Gangeetic plain) in July month is sometimes called the monsoon trough.", "source": null}, {"id": 51, "topic": "Longitudes and Latitudes", "question": "Which of the below statements is/are incorrect? Statement 1: Longitude directly determines the temperature of ocean waters. Statement 2: Ocean currents influence ocean water temperature by transporting warm and cold water masses.", "options": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "a", "explanation": "Only Statement 1. Statement 1 is incorrect because longitude does not directly affect ocean water temperature. Factors determining ocean water temperature: Latitude - Affects the amount of solar radiation received. Unequal distribution of land and water Affects heat absorption and distribution. Ocean currents - Transport heat and cold water masses globally.", "source": null}, {"id": 52, "topic": "Longitudes and Latitudes", "question": "Which of the following statements is INCORRECT regarding the Coriolis force?", "options": {"a": "It deflects the wind to the right in the north and left in the south.", "b": "It is directly proportional to the angle of altitude", "c": "Deflection is less when the wind is high", "d": "It is absent at the equator."}, "answer": "c", "explanation": "Deflection is less when the wind is high. Coriolis force: An apparent force caused by the earth’s rotation. The Coriolis force acts perpendicular to the pressure gradient force (pressure gradient force is perpendicular to an isobar). It is maximum at the poles and is absent at the equator. The Coriolis force also affects ocean currents.", "source": null}, {"id": 53, "topic": "Longitudes and Latitudes", "question": "Which of the below statements is/are correct? Statemenit 1: The Torrid Zone lies betweein the Tropic of Cancer (23.5° N) a and the Tropic of Capricorn (23.5° S). Statement 2: The Frigid Zones are located between the Tropics and the Arctic/Antarctic Circles.", "options": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and 2", "d": "None of the above"}, "answer": "a", "explanation": "Only Statement 1. The zones located between the Tropics and the Arctic/Antarctic Circles are the Temperate Zones. The Frigid Zones are the coldest regions, located between the Arctic Circle (66.5° N) and the North Pole, and between the Antarctic Circle (66.5° S) and the South Pole. The Torrid Zone experiences high temperatures year-round due to direct sunlight.", "source": null}, {"id": 54, "topic": "Longitudes and Latitudes", "question": "Which is the Standard Meridian of India?", "options": {"a": "81°30ʹ E", "b": "82°30ʹ E", "c": "83°30ʹ E", "d": "84°40ʹ E"}, "answer": "b", "explanation": "82°30ʹ E. The Standard Meridian of India, which passes through Mirzapur in Uttar Pradesh, also crosses the following states: Madhya Pradesh, Chhattisgarh, Odisha, and Andhra Pradesh.", "source": null}, {"id": 55, "topic": "Longitudes and Latitudes", "question": "Which of the following sets of statements are correct about Inter Tropical Convergence Zone (ITCZ) ? A. The ITCZ is a broad trough of low pressure in equatorial latitudes. - B. This is where the northeast and the southeast trade winds converge. C. The ITCZ is the equatorial trough normally positioned about 5°N of the equator and remains there throughout the year. D. The ITCZ moves over to the plane of Ganga in Summer.", "options": {"a": "Only A and C", "b": "A, B and C", "c": "Only B and C", "d": "A, B and D"}, "answer": "d", "explanation": "A, B and D. Intertropical Convergence Zone (ITCZ) - The region that circles the Earth, near the equator, where the trade winds of the Northern and Southern Hemispheres come together. Seasonal shifts in the location of the ITCZ drastically affects rainfall many equatorial nations, resulting in the wet and dry seasons of the tropics rather than the cold and warm seasons of higher latitudes.", "source": null}, {"id": 56, "topic": "Longitudes and Latitudes", "question": "During October-November, the apparent movement of the sun towards the _____.", "options": {"a": "North", "b": "North-East", "c": "North-West", "d": "South"}, "answer": "d", "explanation": "South. The position of the rising sun keeps on moving towards the south in the period from 21st June to 22nd December. This period is called Dakshinayan. From 22nd December to 21st June, the sun keeps on moving towards the north. This period is called Uttarayan.", "source": null}, {"id": 57, "topic": "Longitudes and Latitudes", "question": "Match the following waterbodies with the locations they separate: List I (Channel) List II (Separates) A. 8° Channel i. Andaman Islands and Nicobar Islands B. 9° Channel ii. Minicoy and Maldives C. 10° Channel iii. Minicoy & Lakshadweep main group D. 11° Channel iv. Amindivi Islands & Cannanore Islands", "options": {"a": "A–ii, B–iii, C–i, D–iv", "b": "A–iii, B–ii, C–iv, D–i", "c": "A–iv, B–ii, C–i, D–iii", "d": "A–ii, B–iv, C–iii, D–i"}, "answer": "a", "explanation": "A–ii, B–iii, C–i, D–iv.", "source": null}, {"id": 58, "topic": "Longitudes and Latitudes", "question": "The southern part of India lies the _________ belt.", "options": {"a": "rain", "b": "temperate", "c": "polar", "d": "warm"}, "answer": "d", "explanation": "Warm. The Tropic of Cancer passes through the middle of India. The southern parts being closer to the Equator, experience high temperatures throughout the year. The northern parts on the other hand lie in the warm temperate zone.", "source": null}, {"id": 59, "topic": "Longitudes and Latitudes", "question": "Which of the following states India is NOT crossed by the Tropic Cancer (23°30′ N)?", "options": {"a": "Gujarat", "b": "Rajasthan", "c": "Chhattisgarh", "d": "Kerala"}, "answer": "d", "explanation": "Kerala. The Tropic of Cancer (23°30′ N) passes through eight states India - Gujarat (Jasdan), Rajasthan (Kalinjarh), Madhya Pradesh (Shajapur), Chhattisgarh (Sonhat), Jharkhand (Lohardaga), West Bengal (Krishnanagar), Tripura (Udaipur) and Mizoram (Champhai).", "source": null}, {"id": 60, "topic": "Longitudes and Latitudes", "question": "On which of the following two dates does the equinox fall ? in", "options": {"a": "21 June and 23 September", "b": "21 March and 21 June", "c": "21 March and 23 September", "d": "23 September and 22 December"}, "answer": "c", "explanation": "21 March and 23 September Equinox is the situation when the equator is receives the vertical rays of the Sun and day and night are equal. Spring equinox 21st March, Autumn equinox - 23 September. 21st June (winter solstice Southern Hemisphere, Summer solstice in Northern hemisphere) - The rays of the sun fall directly on the Tropic of Cancer. 22 December (Summer solstice Southern hemisphere, winter solstice Northern Hemisphere) - The rays of the sun fall directly on the Tropic of Capricorn.", "source": null}, {"id": 61, "topic": "Longitudes and Latitudes", "question": "From the north most to south most point of India, whmat is the extent of India?", "options": {"a": "4109 km", "b": "2914 km", "c": "3214 km", "d": "3785 km"}, "answer": "c", "explanation": "3214 km. Extent of India: East to west (2,933 km), land frontier (15,200 km), coastline (7,516.6 km). The wresternmost point (Ghuar Moti in Kutch). The easternmost point (Kibithu Arunachal Pradesh). Indira Col (northernmost point). Indira Point (Great Nicobar Island, Andaman sea) is the Southernmost point of India while Kanyakumari is the southernmost point of the Indian Mainland.", "source": null}, {"id": 62, "topic": "Longitudes and Latitudes", "question": "What is the zone between the arctic in circle and north pole called?", "options": {"a": "Torrid zone", "b": "Frigid zone", "c": "North temperate zone", "d": "South temperate zone"}, "answer": "b", "explanation": "Frigid zone. The North Frigid Zone, between the North Pole at 90° and the Arctic Circle at 66°33′48.7\" N, covers 4.12% of Earth's surface.", "source": null}, {"id": 63, "topic": "Longitudes and Latitudes", "question": "Consider the following statements: of 1. Isochrones are lines joining points of located at equal travel time from common centre. 2. Isohalines are lines connecting points of equal temperature in the ocean. Which of the statements given above in is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Isohaline - A line drawn on a map to indicate connecting points of equal salinity in the ocean. Isonomal - A line on a chart connecting points of equal abundance values of a plant species sampled in different sections of an area. Isobronts - A line drawn through geographical points at which a given phase of thunderstorm activity occurred simultaneously..", "source": null}, {"id": 64, "topic": "Longitudes and Latitudes", "question": "1° latitude is equal to approximately ______ km.", "options": {"a": "111", "b": "145", "c": "133", "d": "122 -"}, "answer": "a", "explanation": "111 km. This distance decreases marginally as one travels to in i poles and increases marginally as one goes towards the equator. Continents and Oceans ihn in", "source": null}, {"id": 65, "topic": "Continents and Oceans", "question": "What is the primary reason for the asymmetrical distribution of continents and oceans across the Earth's surface?", "options": {"a": "Seafloor spreading and plate tectonics", "b": "Earth's elliptical orbit", "c": "Magnetic anomalies in the core", "d": "Variations in solar radiation"}, "answer": "a", "explanation": "The Earth's continents are fragments of a once-unified supercontinent (Pangaea) that have been in continuously drifting, colliding, and rearranging due to the movement of tectonic plates. This dynamic process, driven by seafloor spreading at mid-ocean ridges and subduction at trenches, has resulted in the current, uneven arrangement of landmasses and ocean basins, such as the land-heavy Northern Hemisphere and the ocean-dominated Southern Hemisphere.", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 66, "topic": "Continents and Oceans", "question": "Consider the following statements: 1. The Arabian Sea, located in the North Indian Ocean, covers an area of about 3.86 million square kilometres. 2. The Arabian Sea has higher salinity due to high evaporation and low influx of fresh water. Which of the statements given above is/are correct?", "options": {"a": "1 only", "b": "2 only a", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The North Indian Ocean is a region of the Indian Ocean that includes the Bay of Bengal and the Arabian Sea. The Red Sea is located between Africa and Asia. The Java Sea is located in Indonesia, between the islands of Java and Borneo. The Andaman Sea is located in the northeastern part of the Indian Ocean.", "source": null}, {"id": 67, "topic": "Continents and Oceans", "question": "Which of the following is the largest crustal plate on Earth with an area of over 103,000,000 km 2 ?", "options": {"a": "South American plate", "b": "African plate", "c": "Eurasian plate", "d": "Pacific plate"}, "answer": "d", "explanation": "Pacific plate: It is the largest oceanic plate. Plate Tectonics theory given by McKenzie, Parker and Morgan in 1967. It proposes that the earth’s lithosphere is divided into seven major and some minor plates. Major plates: Antarctica and the surrounding oceanic plate; North American (with western Atlantic floor separated from the South American plate along the Caribbean islands) plate; South American (with western Atlantic floor separated from the North American plate along the Caribbean islands) plate; Pacific plate; India-Australia-New Zealand plate; Africa with the eastern Atlantic floor plate; Eurasia and the adjacent oceanic plate.", "source": null}, {"id": 68, "topic": "Continents and Oceans", "question": "Consider the following statements: 1. The Peninsular Plateau of India was earlier a part of the continent Africa. 2. The Peninsular Plateau of India was earlier a part of the continent North America. Which of the statements given above is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. The peninsular plateau of India was a part of the supercontinent Gondwana, which included Africa, South America, Australia, and Antarctica. After breaking up from Gondwana, the Indian subcontinent drifted northwards and collided with Eurasia which formed the Himalayas.", "source": null}, {"id": 69, "topic": "Continents and Oceans", "question": "In the context of water bodies, Neap Tides occur:", "options": {"a": "when the earth, moon and sun line up in a straight line", "b": "when the sun and moon are on the opposite sides", "c": "when there is so much interference by continents", "d": "when the sun and moon are at right angles to each other"}, "answer": "d", "explanation": "During neap tide, gravitational and centrifugal forces are divided. The high tides of a neap tide are lower than the average high tide and the low tides of a Neap tide are higher than the average low tide. Spring tides - When the sun, the moon and the earth are in a straight line, the height of the tide will be higher. These are called spring tides, and they occur twice a month.", "source": null}, {"id": 70, "topic": "Continents and Oceans", "question": "Which of the following is a landlocked Salt Lake in South-West Asia between Israel and Jordan?", "options": {"a": "Don Juan Pond", "b": "Aral Sea", "c": "Caspian Sea", "d": "Dead Sea"}, "answer": "d", "explanation": "Dead Sea. Its salinity of 340 grams per litre of water. The Dead Sea seawater has a density of 1.240 kg/L, which makes swimming in its waters similar to floating. The Caspian Sea is the world's largest saltwater lake by volume. The Aral Sea is located between Kazakhstan to the north and Uzbekistan to the south.", "source": null}, {"id": 71, "topic": "Continents and Oceans", "question": "Which ocean is encircling the continent of Antarctica and extends northward to 60 degrees south la titude?", "options": {"a": "Atlantic Ocean", "b": "Indian Ocean", "c": "Pacific Ocean", "d": "Soeuthern Ocean"}, "answer": "d", "explanation": "Southmern Ocean. It is the newest of the world's five oceans, officially designated as a separate ocean by the International Hydrographic Organization (IHO) in 2000. The Atlantic Ocean is between the Americas and Europe/Africa. The Indian Ocean is bretween Africa, Asia, and Australia. The Pacific Ocean is between Asia and the Americas.", "source": null}, {"id": 72, "topic": "Continents and Oceans", "question": "The name of the strait between the Pacific and Arctic oceans, separating the Chukchi Peninsula of the Russian Far East from the Seward Peninsula of Alaska, is the:", "options": {"a": "Davis Strait", "b": "Florida Strait", "c": "Bering Strait", "d": "Messina Strait"}, "answer": "c", "explanation": "Bering Strait. Davis Strait: It is located between Greenland and Baffin Island in Canada. It connects Baffin Bay with the Labrador Sea and is part of the Northwest Passage in the Arctic. Florida Strait: It is a channel of water located between the Gulf of Mexico and the Atlantic Ocean, separating the Florida Keys and Cuba. Strait of Messina: It is a narrow passage between the eastern coast of Sicily and the western coast of Calabria in southern Italy. It connects the Tyrrhenian Sea with the Ionian Sea.", "source": null}, {"id": 73, "topic": "Continents and Oceans", "question": "In 1596, who suggested in his work 'Thesaurus Geographicus' that the continents of the earth were not always located in their present positions ?", "options": {"a": "Louis Agassiz", "b": "Georges Cuvier", "c": "Abraham Ortelius", "d": "Dan Peter McKenzie"}, "answer": "c", "explanation": "Abraham Ortelius was a Dutch mapmaker who proposed in his work Thesaurus Geographicus that the continents were once joined together. This idea laid the groundwork for the continental drift theory, later fully developed by Alfred Wegener in 1912. Wegener suggested that all continents formed a single landmass called Pangaea (\"all earth\"), surrounded by a vast ocean known as Panthalassa (\"all water\").", "source": null}, {"id": 74, "topic": "Continents and Oceans", "question": "Whiich of the following is NOT a part ofi the ocean floor? a", "options": {"a": "The continental shelf", "b": "The continental slope", "c": "The deep sea shelf", "d": "The deep sea plain"}, "answer": "c", "explanation": "The deep sea shelf. A continental shelf is the submerged edge of a continent beneath the ocean. The continental slope extends seaward from the shelf to the upper edge of a continental rise or the point where the slope begins to flatten. An abyssal plain, or deep sea plain, is a flat region on the ocean floor, typically found at depths between 3,000 and 6,000 meters. Oceanic deeps are the deepest parts of the ocean, covered with fine-grained sediments such as clay and silt. Examples of oceanic landforms: Abyssal plains, Submarine canyons, Deep ocean trenches, Guyots, Seamounts, Mid-ocean ridges, Abyssal plains, etc.", "source": null}, {"id": 75, "topic": "Continents and Oceans", "question": "The thermocline layer is the ______ layer of the ocean.", "options": {"a": "second", "b": "third", "c": "fourth", "d": "first"}, "answer": "a", "explanation": "Second. Scientists have divided the ocean into five main layers. Epipelagic Zone - The surface layer from the surface to 200 meters. Mesopelagic Zone - The twilight zone or the midwater zone. Bathypelagic Zone - The midnight zone or the dark zone. Abyssopelagic Zone - The water temperature is near freezing, and there is no light at all. Hadalpelagic Zone - The deepest point in the ocean is located in the Mariana Trench.", "source": null}, {"id": 76, "topic": "Continents and Oceans", "question": "In 1962, who published 'The History of Ocean Basins', which outlined the theory of how tectonic plates could move, later called 'sea floor spreading' ?", "options": {"a": "Alfred Wegener", "b": "Louis Bauer", "c": "Harry Hammond Hess", "d": "George Edward Backus"}, "answer": "c", "explanation": "Harry Hammond Hess, an American geologist and naval officer. He discovered that the oceans were shallower in the middle and identified the presence of Mid Ocean Ridges, raised above the surrounding generally flat sea floor (abyssal plain) by as much as 1.5 km. Seafloor spreading is a geologic process in which tectonic plates—large slabs of Earth's lithosphere—split apart from each other.", "source": null}, {"id": 77, "topic": "Continents and Oceans", "question": "Which of the following is the correct match between column-A and column-B ? Column - A Column - B (Elements in earth (Total% in earth crust) crust) i. Oxygen a. 8% ii. Silicon b. 28% iii. Aluminium c. 47% iv. Iron d. 5%", "options": {"a": "i-a, ii-b, iii-c, iv-d", "b": "i-c, ii-a, iii-b, iv-d", "c": "i-c, ii-b, iii-a, iv-d", "d": "i-b, ii-a, iii-c, iv-d"}, "answer": "c", "explanation": "i-c, ii-b, iii-a, iv-d. Abundances of other Element in the Earth’s Crust: Calcium (Ca) - 3.63%, Sodium (Na) 2.83%, Potassium (K) - 2.59%, Magnesium (Mg) - 2.09% and others 1.41%. Earth has three layers: crust (upper layer), mantle (middle layer), and core (lower layer).", "source": null}, {"id": 78, "topic": "Continents and Oceans", "question": "Continental Shelf which is the shallowest part of the ocean has an average gradient of:", "options": {"a": "1° or even less", "b": "2° or ev en less", "c": "8° or even less", "d": "5° or even less"}, "answer": "a", "explanation": "1° or even less. The Continental Shelf is the extended margin of each continent occupied by relatively shallow seas and gulfs. About Continental Shelf: The shelf typically ends at a very steep slope, called the shelf break. Their width varies globally, with an average of about 80 km, but can be narrower or even absent in some regions, such as the coasts of Chile and the west coast of Sumatra.", "source": null}, {"id": 79, "topic": "Continents and Oceans", "question": "Living organisms have been on Earth for how much percent of Earth's history?", "options": {"a": "60%", "b": "40%", "c": "80%", "d": "20%"}, "answer": "c", "explanation": "80%. Taking Earth's age as nearly 4.6 Billion Years (BY), instead of 13.7 BY from the Big Bang, unicellular life appeared nearly 3.8 BY ago. This percentage is 3.8/4.6 X 100 = 82.6%, nearly.", "source": null}, {"id": 80, "topic": "Continents and Oceans", "question": "Choose the correct statement(s) related to ‘continentality’. A. The sea exerts a moderating influence on climate. B. As the distance from the sea increases, the people experience extreme weather conditions. C. As one goes from the surface of the earth to higher altitudes, the atmosphere becomes less dense and temperature decreases.", "options": {"a": "B and C", "b": "Only C", "c": "A and C", "d": "A and B"}, "answer": "d", "explanation": "A and B. Continentality (i.e. very hot during summers and very cold during winters) found in inland areas. Continental climates are common between 40° and 70° north latitude and experience large temperature differences between day and night.", "source": null}, {"id": 81, "topic": "Continents and Oceans", "question": "Consider the following statements about oceanic trenches: 1. The Mariana Trench in theB Pacific Ocean is the deepest point on Earth, with a depth of about 11e,022 metres. 2. The Java Trench, located in the Indian Ocean, is dmeeper than the Tonga Trench in the Southwestern Pacific - Ocean. Which of e the statements given above - is/are correct?", "options": {"a": "1 oenly", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. Java Trench (also F known as the Sunda Trench): Located in the northeastern Indian Ocean, its maximum depth is approximately 7,725 metres. Tonga Trench: Located in the Pacific Ocean near the Tonga Islands, its deepest point (Horizon Deep) is approximately 10,882 metres. Other Trenches: Puerto Rico Trench (8,400 m) Atlantic Ocean; South Sandwich Trench (7,432 m) - Southern Ocean.", "source": null}, {"id": 82, "topic": "Continents and Oceans", "question": "What does El Niño refer to ?", "options": {"a": "Hot water current", "b": "Pressure water current", "c": "High air pressure", "d": "Low air pressur"}, "answer": "a", "explanation": "Hot water current. The term El Nino (Little Boy in Spanish) - Warming of the ocean surface, or above-average sea surface temperatures, in the central and eastern tropical Pacific Ocean on the coast of Peru. El nino leads to weakening of trade winds in a region. La Nina (Little Girl in Spanish) - The periodic cooling of ocean surface temperatures in the central and east-central equatorial Pacific.", "source": null}, {"id": 83, "topic": "Continents and Oceans", "question": "Which of the following oceans is surrounded by the continent of North America and South America to the east?", "options": {"a": "Pacific Ocean", "b": "Atlantic Ocean", "c": "Indian Ocean", "d": "Arctic Ocean"}, "answer": "a", "explanation": "Pacific Ocean (world’s largest and deepest ocean): It represents 45 percent of the global ocean surface. The International Date Line (established in 1884) passes through the mid-Pacific Ocean. The Atlantic Ocean is surrounded by the continents of North and South America to the west, and Europe and Africa to the east. The Indian Ocean is bordered by Asia to the north, Africa to the west, and Australia to the east.", "source": null}, {"id": 84, "topic": "Continents and Oceans", "question": "Consider the following statements: 1. Due to the attraction of the Sun and the Moon, ocean water generally experiences two high tides and two low tides in a day. 2. Diurnal tides occur when there are two high tides and two low tides each day. Which of the statements given above is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. When the Earth, Sun, and Moon line up, their gravitational power combines to make exceptionally high tides where the bulges occur, called spring tides, as well as very low tides where the water has been displaced. When the Sun is at a right angle to the Moon, moderate tides, called neap tides. There are generally three types of tides: Diurnal - One high and low tide each day, Semi-diurnal - Two high and low tides each day, and Mixed - Two high and low tides each day of different heights. -", "source": null}, {"id": 85, "topic": "Continents and Oceans", "question": "Which of the following oceans extends into the Mediterranean Sea ?", "options": {"a": "Indian Ocean", "b": "Pacific Ocean", "c": "Atlantic Ocean", "d": "Arctic Ocean"}, "answer": "c", "explanation": "Atlantic Ocean is the 2nd largest ocean in the world. The Mediterranean is an intercontinental sea spread between Europe, North Africa, and Western Asia and connected to the Atlantic Ocean through the strait of Gibraltar.", "source": null}, {"id": 86, "topic": "Continents and Oceans", "question": "The mohororvicic (Moho) discontinuity separates ?", "options": {"a": "Earth's lithosphere and asthenosphere", "b": "Earth's atmosphere and hydrosphere", "c": "Earth's crust and the inner core", "d": "Earth's crust and the mantle"}, "answer": "d", "explanation": "Earth's crust and the mantle. Moho discontinuity - It occurs at an average depth of about 8 kilometers beneath the ocean basins and 32 kilometers beneath continental surfaces.", "source": null}, {"id": 87, "topic": "Continents and Oceans", "question": "Which is the correct sequence of oceans according to size (from largest to smallest) ?", "options": {"a": "Pacific Ocean > Antarctic Ocean > Indian Ocean > Atlantic Ocean", "b": "Pacific Ocean > Indian Ocean > Antarctic Ocean > Atlantic Ocean", "c": "Pacific Ocean > Atlantic Ocean > Indian Ocean > Antarctic Ocean", "d": "Pacific Ocean > Indian Ocean > Atlantic Ocean > Antarctic Ocean"}, "answer": "c", "explanation": "Pacific Ocean, the world's largest, was named by Ferdinand Magellan. The International Date Line passes through it.", "source": null}, {"id": 88, "topic": "Continents and Oceans", "question": "The percentage of earth's water found in the oceans is _________.", "options": {"a": "94 percent", "b": "97.2 percent", "c": "90.2 percent", "d": "92.2 percent"}, "answer": "b", "explanation": "97.2 percent. Water covers 71 percent of Earth's surface. Distribution of Earth’s water: Oceans (97.2%), Glaciers (2.1%), Groundwater (0.61 percent); Freshwater lakes (0.009 percent), Inland seas (0.008 percent), Soil Moisture (0.005 percent), Atmosphere (0.001 percent), Rivers (0.0001 percent). 2.7% of earth’s water is fresh.", "source": null}, {"id": 89, "topic": "Continents and Oceans", "question": "How thick is the lithosphere?", "options": {"a": "25 to 45 km", "b": "10 to 25 km", "c": "10 to 200 km", "d": "5 to 10 km"}, "answer": "c", "explanation": "10 to 200 km. The lithosphere is the outermost and mechanical layer of the Earth that consists of the entire crust and the top-most portion of the mantle. Mechanically, the earth’s layers can be divided into lithosphere, asthenosphere (80-200 km), mesospheric mantle, outer core, and inner core.", "source": null}, {"id": 90, "topic": "Continents and Oceans", "question": "The crust is the Earth's outermost layer that is less than ______ percent of Earth by mass, with oceanic crust and continental crust often consisting of more felsic rocks.", "options": {"a": "5", "b": "1", "c": "2", "d": "10"}, "answer": "b", "explanation": "1. The average density of oceanic crust is 3.0 g/cm 3, while continental crust has an average of 2.7 g/cm 3. The mass of the continental crust is 2.195. The continental crust (about 30 km) is composed of lighter (felsic) sodium potassium aluminum silicate rocks, like granite. The oceanic crust (about 5 km) is composed of dense (mafic) iron magnesium silicate igneous rocks, like basalt.", "source": null}, {"id": 91, "topic": "Continents and Oceans", "question": "Consider the following statements: 1. The movement of Earth's plates is classified into three main types of tectonic boundaries. 2. Convergent, divergent, and transform are the three primary types of plate movements. Which of the statements given above is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The movement of the plates creates three types of tectonic boundaries: convergent, where plates move into one another; divergent, where plates move apart; and transform, where plates move sideways in relation to each other.", "source": null}, {"id": 92, "topic": "Continents and Oceans", "question": "Movement of fault lines can cause:", "options": {"a": "a flood", "b": "sudden rain", "c": "an earthquake", "d": "a storm"}, "answer": "c", "explanation": "An earthquake. e It is a sudden shaking or trembling of the earth which lasts for a very m short time. Earthquakes tend to occur at the boundaries of earth’s plates. These boundaries are known as fault zonees. Over 80 percent of earthquakes occur around the edges of the Peacific Ocean, an area known as the 'Ring of Fire'. Instrument used for mreasuring Earthquake: Seismograph.", "source": null}, {"id": 93, "topic": "Continents and Oceans", "question": "What is the average salinity of the Indian ocean?", "options": {"a": "350 o/oo", "b": "35 o/oo", "c": "3.5 o/oo", "d": "3 o/oo"}, "answer": "b", "explanation": "35 o/oo (35 parts per thousand). Salinity is the amount of salt present in 1000 grams of water. A salinity of 24.7% has been regarded as the upper limit to fix ‘brackish water’.", "source": null}, {"id": 94, "topic": "Continents and Oceans", "question": "Tsunami is NOT caused by:", "options": {"a": "Hurricanes", "b": "volcanic eruptions", "c": "undersea landslides", "d": "Earthquakes"}, "answer": "a", "explanation": "Hurricanes. Tsunamis are giant waves caused by earthquakes or volcanic eruptions under the sea.", "source": null}, {"id": 95, "topic": "Continents and Oceans", "question": "Which of the following is a warm current?", "options": {"a": "Labrador current", "b": "Falkland current", "c": "Canary current", "d": "Gulf stream"}, "answer": "d", "explanation": "Gulf stream current in the North Atlantic and the Kuroshio Current in the North Pacific are warm currents. Warm Currents - Alaskan Current, Tsushima Current, Brazilian Current etc. Cold Current - Labrador Current, Canary Current, Benguela Current, Falkland Current, South Indian Ocean Current, Okhotsk Current, Humboldt or Peruvian Current etc.", "source": null}, {"id": 96, "topic": "Continents and Oceans", "question": "Consider the following statements regarding oceanic landforms: 1. An Atoll is a group of islands found in tropical oceans, consisting of coral reefs and a central depression. 2. A guyot is a shallow body of water separated from the ocean by a barrier reef. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. Guyot is an undersea mountain. Lagoons are shallow bodies of water that are separated from the ocean by a barrier reef. Seamounts are underwater mountains that rise above the ocean floor but do not reach the surface.", "source": null}, {"id": 97, "topic": "Continents and Oceans", "question": "Ocean acidification is the ongoing decrease in the pH of the Earth’s oceans, caused by the uptake of ______ from the atmosphere.", "options": {"a": "Methane", "b": "carbon dioxide", "c": "nitrogen", "d": "argon"}, "answer": "b", "explanation": "Carbon dioxide. Ocean acidification is the worldwide reduction in the pH of seawater as a consequence of the absorption of large amounts of carbon dioxide by the oceans. It results in the alteration of marine food chains and food supply to humans.", "source": null}, {"id": 98, "topic": "Continents and Oceans", "question": "Consider the following statements regarding the lowest known point on Earth: 1. Challenger Deep is located in the western Pacific Ocean. 2. The Great Barrier Reef is the world’s largest coral reef located in Australia. 3. Factorian Deep is the deepest point in the Pacific Ocean. Which of the statements given above is incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "1 and 3"}, "answer": "c", "explanation": "3 only. The lowest known point on earth is called Challenger Deep, which is present in the Pacific Ocean. Factorian Deep is the new deepest point in Antarctica's Southern Ocean. The Great Blue Hole is a giant marine sinkhole off the coast of Belize.", "source": null}, {"id": 99, "topic": "Continents and Oceans", "question": "In coastal areas, during the night, wind blows from land to sea because:", "options": {"a": "low pressure is created on land", "b": "land cools slower than water", "c": "water cools slower than land", "d": "high pressure is created at sea"}, "answer": "c", "explanation": "water cools slower than land. The wind blowing from land towards the sea is the Land breeze. The wind blowing from the sea towards the land is a sea breeze. Both are induced by differences that occur between the heating or cooling of the water surface and the adjacent land surface.", "source": null}, {"id": 100, "topic": "Continents and Oceans", "question": "The process of seepage of water into the ground is called ____.", "options": {"a": "Infiltration", "b": "depletion", "c": "Storage", "d": "replenishment"}, "answer": "a", "explanation": "Infiltration occurs when surface water enters the soil.", "source": null}, {"id": 101, "topic": "Continents and Oceans", "question": "Which water body covers an area of 1,55,58,000 𝑘𝑚 and makes up only 4.3% of the global ocean?", "options": {"a": "Atlantic Ocean", "b": "Arctic Ocean", "c": "Southern Ocean", "d": "Indian Ocean"}, "answer": "b", "explanation": "Arctic Ocean is the smallest and shallowest of the world's five major oceans.", "source": null}, {"id": 102, "topic": "Continents and Oceans", "question": "Consider the following statements about the Sargasso Sea: 1. The Sargasso Sea is the only sea in the world that does not have a land boundary. 2. It is located in the Pacific Ocean and is named after the presence of brown Sargassum seaweed. Which of the statements given above is incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. The Sargasso Sea is the only sea in the world without a land boundary. It is bounded entirely by ocean currents (North Atlantic Gyre: Gulf Stream, North Atlantic Current, Canary Current, North Equatorial Current). Statement 2 is incorrect - Sargasso Sea lies in the Atlantic Ocean. It is named so because of the presence of brown Sargassum seaweed.", "source": null}, {"id": 103, "topic": "Continents and Oceans", "question": "Match the following Seismic Zones of India with their characteristics: List I List II (Seismic Zone) (Characteristic) A. Zone II 1.Least seismically active region 2.
