ng the Black Sea to the Sea of Marmara.", "source": null}, {"id": 842, "topic": "World Geography and Map", "question": "Which of the following is the largest inhabited riverine island in the world?", "options": {"a": "Peacock", "b": "Majuli", "c": "Bhavani", "d": "Lakshadweep"}, "answer": "b", "explanation": "Majuli is a famous island in the River Brahmaputra, flowing in the state of Assam. It is the biggest district island in the country and is quite close to Jorhat. The island is formed by the Brahmaputra River in the south and the Kherkutia Xuti, an anabranch of the Brahmaputra, joined by the Subansiri River in the north.", "source": null}, {"id": 843, "topic": "World Geography and Map", "question": "A long, winding ridge of stratified sand and gravel is known as:", "options": {"a": "Moraine", "b": "esker", "c": "Aquifer", "d": "Erratic"}, "answer": "b", "explanation": "Esker. An esker is formed by meltwater flowing beneath a retreating glacier or ice sheet during the last Ice Age. This debris was deposited through tunnels and channels under the ice, leaving behind a hill or mound once the ice melted. Eskers are commonly found in regions that were once glaciated, such as Canada, Northern Europe, and parts of the United States.", "source": null}, {"id": 844, "topic": "World Geography and Map", "question": "How much percentage of Earth's water make up the oceans?", "options": {"a": "57%", "b": "7%", "c": "37%", "d": "97%"}, "answer": "d", "explanation": "97%. Water covers 71 percent of Earth's surface. Distribution of Earth’s water: Oceans (97.2%), Glaciers (2.1%), Groundwater (0.61 percent); Freshwater lakes (0.009 percent), Inland seas (0.008 percent), Soil Moisture (0.005 percent), Atmosphere (0.001 percent), Rivers (0.0001 percent).", "source": null}, {"id": 845, "topic": "World Geography and Map", "question": "Which of the following are some regions in the world, known for their thriving citrus fruit production?", "options": {"a": "Africa", "b": "Equatorial regions", "c": "Caribbean", "d": "Mediterranean regions"}, "answer": "d", "explanation": "Mediterranean regions These are known as ‘Orchards of the world’. Plants grow in Mediterranean regions - Citrus fruits like lemons, orange and grapefruit, Rosemary, Olive. Mediterranean woodlands are found in the Mediterranean Sea region, Central Chile, the Southwest United States, Australia, and Africa.", "source": null}, {"id": 846, "topic": "World Geography and Map", "question": "Copacabana beach is situated in __________.", "options": {"a": "Australia", "b": "Brazil", "c": "Peru", "d": "Mexico"}, "answer": "b", "explanation": "Brazil. Copacabana beach: It is located in the South Zone of the city of Rio de Janeiro. Some famous Beaches in the world: Praia do Cassino (“Cassino beach”) is the longest beach in the world, located in Brazil. Monolithi beach, Greece (longest beach of Europe), Marina beach, Chennai (longest beach in Asia). Beaches in India - Puri Beach (Odisha), Rushikonda Beach (Andhra Pradesh), Eden Beach (Puducherry), Radhanagar beach (Andaman and Nicobar), Minicoy Thundi beach (Lakshadweep).", "source": null}, {"id": 847, "topic": "World Geography and Map", "question": "Mid-latitude deserts (BWK) are found between 35° and _________N and which are poleward of subtropical high- pressure areas.", "options": {"a": "70°", "b": "60°", "c": "79°", "d": "40°"}, "answer": "b", "explanation": "60°. Mid-latitude deserts An excessively dry region with an arid climate. Location - Found in the interior parts of the continents. Examples Argentina's Patagonian Desert (Argentina), Gobi Desert (China and Mongolia), Turkestan (Kazakhstan), Ladakh (Jammu and Kashmir). Crops Cacti, Prickly Shrubs, Long-rooted wiry grasses.", "source": null}, {"id": 848, "topic": "World Geography and Map", "question": "According to the World Bank, what was the density of the population Sri Lanka in 2020?", "options": {"a": "554 Persons per sq. km.", "b": "300 Persons per sq. km.", "c": "354 Persons per sq. km.", "d": "364 Persons per sq. km."}, "answer": "c", "explanation": "354 Persons per sq. km. Other Countries' population density (Food and Agricmulture Organization and World Bank population estimates 2020) in square Km:- India (470), China (150), Myanmar (82), Nepal (205), Bangladesh (1286), New Zealand (19).", "source": null}, {"id": 849, "topic": "World Geography and Map", "question": "Which of the following combinations of \"animal\" and \"area they found\" is INCORRECT ? F", "options": {"a": "Kangaroo - Australia -", "b": "Orangutan - Caribbean islands", "c": "Ostrich - Savanna and desert regions,", "d": "Lemurs - Madagascar"}, "answer": "b", "explanation": "Orangutans - Caribbean islands. Scientific name (Pongo), Family (Hominidae). These are large, orange-haired apes that are native to the rainforests of Borneo and Sumatra. Kangaroos: Scientific name (Macropodidae), Phylum (Chordata). Ostriches: Phylum (Chordata), found savanna and desert regions. Lemurs: Scientific name (Lemuroidea), Phylum (Chordata), found in Madagascar.", "source": null}, {"id": 850, "topic": "World Geography and Map", "question": "As of 2025, which country has the largest proven coal reserves in the world?", "options": {"a": "India", "b": "China", "c": "USA", "d": "Russia"}, "answer": "c", "explanation": "The United States America (Largest Coal Reserves) Largest coal producer (1st China, 2nd India). Jharia Coal Field (Jharkhand) produces the highest coal in India. Central Institute of Mining and Fuel Research (2007) - Dhanbad. Largest Producer: Bauxite (Australia), Gold (China), Diamond (Russia), Silver S, (Mexico), Chromium (South Africa), Copper (Chile), Uranium (Kazakhstan), Thorium (India).", "source": null}, {"id": 851, "topic": "World Geography and Map", "question": "\"Eskimos\" are associated with - which geographical region?", "options": {"a": "Arid Region", "b": "Polar Region -", "c": "Savanna Grassland", "d": "Tropical Rainforest Region"}, "answer": "b", "explanation": "Polar Region (the area - around the Earth’s North Pole or the South Pole). Igloo (small hut-like house made of snow where Eskimos live). Arid regions aire dry and have little rainfall. Exampile - Central and western Asia, of a North and South America, central and northwest Australia.", "source": null}, {"id": 852, "topic": "World Geography and Map", "question": "Consider the following statements regarding seas separating continents: I. The Black Sea separates Africa from the Arabian Peninsula. II. The Caspian Sea separates Africa from the Arabian Peninsula. in Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. The Red Sea separates Africa from the Arabian Peninsula.", "source": null}, {"id": 853, "topic": "World Geography and Map", "question": "Which is the highest plateau in the world ?", "options": {"a": "East African Plateau", "b": "Deccan plateau", "c": "Western plateau", "d": "Tibet plateau"}, "answer": "d", "explanation": "Tibet plateau (Roof of the world) is the largest and highest plateau in the world. It is a vast elevated plateau located at the intersection of Central, in South and East Asia.", "source": null}, {"id": 854, "topic": "World Geography and Map", "question": "In ‘Andes Mountain’ of South America animals which are used for transportation is ______.", "options": {"a": "Bullocks", "b": "Camels", "c": "Donkeys", "d": "Llamas"}, "answer": "d", "explanation": "Llamas {Scientific name: Lama glama, Trophic level: Herbivorous}. of Longest Mountain Ranges: Andes (South. America, longest continental mountain}, Rockies (North America), Great Dividing Range (Australia), Transantarctic Mountains (Antarctica), Atlas Mountains (Africa) etc.", "source": null}, {"id": 855, "topic": "World Geography and Map", "question": "Death Valley is a desert valley the ________ that is the hottest and driest place with a world record highest air temperature of 134°F.", "options": {"a": "Mojave Desert of California", "b": "Atacama Desert of Chile", "c": "Lut Desert of Iran", "d": "Sahara Desert of Africa"}, "answer": "a", "explanation": "Mojave Desert of California. Death Valley is a desert valley in the northern Mojave Desert, bordering the Great Basin Desert. Rivers: Furnace Creek; Amargosa River.", "source": null}, {"id": 856, "topic": "World Geography and Map", "question": "Which country has the most time zones in the world?", "options": {"a": "France", "b": "United States of America", "c": "Russia", "d": "United Kingdom"}, "answer": "a", "explanation": "France (12). Russia has 11 time zones, the United Kingdom has time zone and India has only one-time zone.", "source": null}, {"id": 857, "topic": "World Geography and Map", "question": "A major portion of 'Sufed Koh' mountain range lies in ______.", "options": {"a": "Pakistan", "b": "China", "c": "India", "d": "Myanmar"}, "answer": "a", "explanation": "Pakistan. Safed Koh is mountain range on the Pakistan -Afghanistan border. It parallels the Kabul River. A spur of the range is crossed by the Khyber Pass.", "source": null}, {"id": 858, "topic": "World Geography and Map", "question": "A mass of snow and ice that moves slowly under the influence of gravity along a confined course awayF from its place of accumulation is called ______.", "options": {"a": "lagoon", "b": "glacier", "c": "block mountain", "d": "plateau"}, "answer": "b", "explanation": "Glacier is a slowly moving mass or river of ice formed by the accumulation and compaction of snow on mountains or near the poles. plateau is a flat area of land that elevated above sea level. Miscellaneous", "source": null}, {"id": 859, "topic": "Miscellaneous", "question": "If a person view the Earth from above the North Pole, he will observe that the Earth rotates in:", "options": {"a": "Anti-clockwise", "b": "No rotation", "c": "Random spin", "d": "Clockwise"}, "answer": "a", "explanation": "Anti-clockwise. The Earth rotates west to east. If viewed from above the North Pole, this rotation appears anti-clockwise. If viewed from above the South Pole, it appears clockwise. in", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 860, "topic": "Miscellaneous", "question": "Consider the following statements about Udayagiri and Khandagiri caves: 1. These caves are near Bhubaneswar and were meant for Jain monks. 2. All caves are shaped like flowers and are carved from independent boulders. 3. Each cave has multiple shrines dedicated to different Buddhist deities. Which of the above is/are correct ?", "options": {"a": "Only 1", "b": "All 1, 2, and 3 are correct", "c": "1 and 2 Only", "d": "2 and 3 Only"}, "answer": "a", "explanation": "Only 1. Statement 2 is incorrect:The caves are rock-cut into hill 1 faces, not from independent boulders. They are not shaped like flowers; insteadh, they are simple cells with some ornate carvings (e.g., Rani Gumpha). StBatement 3 is Incorrect.: These caves are Jain, not Buddhist.They are dedicated to Jain monks and Tirthankaras, not Buddhist deities.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 861, "topic": "Miscellaneous", "question": "Match the columns: Column A Column B (Description (Land-Uese Shuffled) Category) A. Miscellaneous 1. Land left fallow for Tree Crops & more than 1 year Groves but less than 5 years B. Culturable 2. Privately owned land a Wasteland under orchards and fruit trees C. Current Fallow 3. Land left uncultivated for over 5 years D. Fallow other 4. Land left fallow for than Current one or less than one Fallow year is", "options": {"a": "A-2, B-3, C-4, D-1", "b": "A-3, B-2, C-1, D-4", "c": "A-1, B-4, C-2, D-3", "d": "A-4, B-1, C-3, D-2"}, "answer": "a", "explanation": "A-2, B-3, C-4, D-1.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 862, "topic": "Miscellaneous", "question": "What evidence supports the Big Bang theory of universe origin?", "options": {"a": "Sunspot cycles", "b": "Redshift of galaxies", "c": "Solar wind", "d": "Volcanic eruptions on Earth"}, "answer": "b", "explanation": "The redshift of galaxies is major piece of observational evidence supporting the Big Bang Theory. Redshift refers to the phenomenon where light from distant galaxies shifts toward the red end of the spectrum, indicating that they are moving away from us. This supports the idea that the universe is expanding, and if it's expanding now, it must have originated from a singular point — as proposed in the Big Bang Theory.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 863, "topic": "Miscellaneous", "question": "What is the main objective of ISRO's SCATSAT-1 satellite?", "options": {"a": "Monitoring earthquake zones", "b": "Measuring atmospheric ozone depletion", "c": "weather forecasting and cyclone prediction", "d": "Mapping forest cover across India"}, "answer": "c", "explanation": "Weather forecasting and cyclonie prediction. SCATSAT-1 a (Scatterometer Satellite-1) was launched by ISRO in September 2016. Its main purpose is to provide continuous weather forecasting, cyclone detection, and tracking services. The satellite carries a scatterometer to measure ocean surface winds, which are crucial for predicting monsoons and cyclones. It was developed as a continuity mission for the Oceansat-2 scatterometer, which had ceased to operate. -", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 864, "topic": "Miscellaneous", "question": "Match the port/corridor with its strategic benefit to India Column A Column B (Strategic (Port/Corridor) Benefit to India) A. Chabahar Port 1. Links India with Europe via Middle East B. IMEC 2. New age of transportation between the two countries India to Southeast Asia via Mizoram-Myanmar link C. Sittwe Port 3. Access to Central Asia bypassing Pakistan", "options": {"a": "A → 3, B → 1, C → 2", "b": "A → 2, B → 3, C → 1", "c": "A → 3, B → 2, C→ 1", "d": "A → 1, B → 2, C → 3"}, "answer": "a", "explanation": "A → 3, B → 1, C → 2. Chabahar Port (Iran): Located on the Gulf of Oman, it is strategically important for India as it provides a trade route to Afghanistan and Central Asia, bypassing Pakistan. India-Middle East-Europe Economic Corridor (IMEC): A planned a corridor to enhance connectivity and economic integration between Asia, the Persian Gulf, and Europe, boosting trade and development. Sittwe Port (Myanmar): A deep-water port in Rakhine State, built with Indian assistance and operationalized by India Ports Global (IPGL). It is India’s second overseas port after Chabahar, forming a key part of the Kaladan Multi-Modal Transit Transport Project (KMMTTP), which connects India’s northeast to the Bay of Bengal, reducing dependence on the Siliguri Corridor and promoting regional trade.", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 865, "topic": "Miscellaneous", "question": "A section of an active fault that has produced earthquakes in the past but is now quiet and is believed that the fault segment is capable of producing earthquake on some other basis is known as:", "options": {"a": "Hypocenter", "b": "Seismic Gap", "c": "Epicenter", "d": "Seismic Wave"}, "answer": "b", "explanation": "Seismic Gap - A section of an active fault which has the potential to produce significant earthquakes. Hypocenter: The point of origin of an earthquake beneath the Earth's surface where the fault rupture begins, representing the actual location where seismic energy is first released. Epicenter: The point on the Earth's surface directly above the hypocenter, marking the geographical location where an earthquake's shaking is typically most intense and first felt. Seismic Wave: The energy waves generated and propagated through the Earth's crust during an earthquake, which can be classified into different types like P-waves, S-waves, and surface waves that cause ground motion.", "source": null}, {"id": 866, "topic": "Miscellaneous", "question": "The earthquakes that are generated due to the explosion of chemical or nuclear devices are known as:", "options": {"a": "Collapse earthquakes", "b": "Explosion earthquakes", "c": "Tectonic earthquakes", "d": "Reservoir-induced earthquakes"}, "answer": "b", "explanation": "Explosion earthquakes. Types of Earthquakes: In regions with heavy mining activity, the collapse of underground mine roofs can cause minor tremors, known as collapse earthquakes. The most common type is tectonic earthquakes, which result from the movement of rocks along a fault plane. A subcategory of tectonic earthquakes, known as volcanic earthquakes, occur in areas with active volcanoes. Additionally, reservoir-induced earthquakes are triggered in regions where large reservoirs are present.", "source": null}, {"id": 867, "topic": "Miscellaneous", "question": "Consider the following statements: I. Project Tiger was launched in 1973 at Corbett Tiger Reserve. II. The Wildlife Protection Act was passed in 1975. Which of the above statement(s) is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. On April 1, 1973, Project Tiger was officially launched at the Corbett Tiger Reserve, initially including nine tiger reserves. International Tiger Day is celebrated annually on July 29. The Wildlife Protection Act was passed in 1972. Projects in India related to animals:Project Hangul (1970), Project Crocodile (1975), Project Elephant (1992), Project Rhino (2005), Project Gangetic Dolphin (2009), Project Snow Leopard (2009), Project Great Indian Bustard (2012).", "source": null}, {"id": 868, "topic": "Miscellaneous", "question": "Which of the following can bhe represented as a functional unit of nature?", "options": {"a": "Vehicles", "b": "Ecosystem", "c": "Humans", "d": "Plants"}, "answer": "b", "explanation": "Ecosystem. This is because an ecosystem emncompasses all living organisms (plants, animals, and microorganisms) interacting with each other aned with the non-living components (like air, water, and soil) withine their environment. These interactions allow for energy flow, nrutrient cycling, and the maintenance of life-supporting processes, which are critical functions of nature.", "source": null}, {"id": 869, "topic": "Miscellaneous", "question": "Which of the following is a man-made ecosystem?", "options": {"a": "Aquarium", "b": "Dessert", "c": "Forest", "d": "Grassland"}, "answer": "a", "explanation": "Aquarium. It is a facility or park where a collection of aquatic animals and plants is maintained for study, conservation, and public display. A man-made ecosystem, also known as an artificial or anthropogenic ecosystem, refers to a human-created environment where biotic and abiotic components interact to sustain life. Examples of man-made ecosystems include tree plantations, urban landscapes, crop fields, managed ponds, zoos, and gardens.", "source": null}, {"id": 870, "topic": "Miscellaneous", "question": "Which of the following are the two basic categories of an ecosystem?", "options": {"a": "Forest and Aquatic", "b": "Terrestrial and Aquatic", "c": "Lakes and Ponds", "d": "Forest and Rivers"}, "answer": "b", "explanation": "Terrestrial and Aquatic. An ecosystem is a chain of interactions between organisms and their environment. The term \"ecosystem\" was first coined by English botanist A.G. Tansley in 1935. A terrestrial ecosystem refers to a land-based community of organisms and the interactions between biotic and abiotic components in a specific area. An aquatic ecosystem involves interacting organisms that rely on each other and their water environment for nutrients and shelter.", "source": null}, {"id": 871, "topic": "Miscellaneous", "question": "Which branch of ecology deals with the characteristics of the ancient environment and their relationship with ancient plants and animals?", "options": {"a": "Demeciology", "b": "Ichthyology -", "c": "Palieoecology", "d": "Mycology"}, "answer": "c", "explanation": "Paleoecology studies past ecosystems and their changes over time using fossils and geological data. Other branches: Demecology (ecology of populations), Ichthyology (study of fishes), and Mycology (study of fungi).", "source": null}, {"id": 872, "topic": "Miscellaneous", "question": "Which of the following is the best definition of ecological efficiency?", "options": {"a": "The amount of energy utilised at different trophic levels in a food chain", "b": "The amount of energy stored at different trophic levels in a food chain", "c": "The ratio between the mass and the energy flow at different trophic levels in a food chain", "d": "The ratio between energy flows at different points in a food chain"}, "answer": "d", "explanation": "Ecological efficiency describes the efficiency with which energy is transferred from one trophic level to the next. The number of trophic levels in the grazing food chain is restricted as the transfer of energy follows 10 percent law - only 10 percent of the energy is transferred to each trophic level from the lower trophic level.", "source": null}, {"id": 873, "topic": "Miscellaneous", "question": "The record obtained by the measurement of earthquake is called a:", "options": {"a": "seismograph", "b": "seismogram", "c": "seismology", "d": "seismic wave"}, "answer": "b", "explanation": "seismogram. Earthquakes are classified into three zones based on depth: shallow (0-70 km), intermediate (70-300 km), and deep (300-700 km). The vibrations produced during an earthquake are known as seismic waves.", "source": null}, {"id": 874, "topic": "Miscellaneous", "question": "The Environment (Protection) Act, 1986 empowers the _________ to establish authorities charged with the mandate of preventing environmental pollution in all its forms.", "options": {"a": "State Government", "b": "Central Government", "c": "Supreme Court", "d": "local municipalities"}, "answer": "b", "explanation": "Central Government. The Environment (Protection) Act, 1986 was enacted to safeguard and enhance the environment. The Central Government has the authority to: protect and improve the environment, set emission and discharge standards, regulate industrial locations, manage hazardous wastes, and protect public health and welfare. Some key environmental acts include the Biological Diversity Act (2002), Wild Life (Protection) Act (1972), Forest Conservation Act (1980), Indian Forest Act (1927), and Energy Conservation Act (2001).", "source": null}, {"id": 875, "topic": "Miscellaneous", "question": "Who introduced the concept virtual water?", "options": {"a": "MS Swaminathan", "b": "Glubler Triplets", "c": "John Anthony Allan", "d": "Norman Borlaug"}, "answer": "c", "explanation": "John Anthony Allan. Virtual water is the freshwater used to produce goods or services, which is then traded internationally as part of those products.", "source": null}, {"id": 876, "topic": "Miscellaneous", "question": "In which of the following regions of India is the Mundari language spoken?", "options": {"a": "Chota-Nagpur plateau", "b": "Baghelkhand", "c": "Thar desert", "d": "Malwa plateau"}, "answer": "a", "explanation": "Chota-Nagpur plateau. This plateau covers parts of Jharkhand, Chhattisgarh, Odisha, and West Bengal. Mundari is a Munda language, belonging to the Austroasiatic language family. Chhota Nagpur plateau is called the “Heart of industrial India” because it rich in minerals and power fuels. The highest mountain peak of Chota Nagpur Plateau is Parasnath.", "source": null}, {"id": 877, "topic": "Miscellaneous", "question": "Which Greek term was first used by Ernst Haeckel in 1866 to refer to ‘the relation of animals to both the organic as well as the inorganic environment’?", "options": {"a": "Ethnologie", "b": "Ecophagie", "c": "Oekologie", "d": "Oologie"}, "answer": "c", "explanation": "Oekologie. Ernst Haeckel, German biologist and philosopher, made significant contributions to evolutionary biology. He coined terms like \"ecology,\" \"phylogeny,\" and \"Protista\" and is known for his recapitulation theory, stating that an organism's development mirrors its species' evolutionary history.", "source": null}, {"id": 878, "topic": "Miscellaneous", "question": "Which of the following is the characteristics of epilimnion?", "options": {"a": "Middle layer of a pond", "b": "Bottom layer of a river", "c": "Bottom layer of a lake", "d": "Top-most layer in a thermally stratified lake"}, "answer": "d", "explanation": "Thermal stratification occurs when the water in a lake forms distinct layers through heating from the sun. It led to the separation of the lake into three layers. Epilimnion: The upper layer of warmer water. Metalimnion: The middle layer with a zone of gradual decrease in temperature. Hypolimnion: The bottom layer of colder water.", "source": null}, {"id": 879, "topic": "Miscellaneous", "question": "The depositional pattern of CaCO and other materials that extend upwards from the floor of a limestone of cavern is known as:", "options": {"a": "Stalactite", "b": "Dripstone", "c": "Stalagmite", "d": "Hatectite"}, "answer": "c", "explanation": "Stalagmite. It rises up from the floor of the caves. Stalactite - It is an icicle-shaped formation that hangs from the ceiling of a cmave and is produced by the precipitation of minerals from water dripping through the cave ceiling. The stalagmites and stalactites eventually fuse to give rise to columns and pillars of different diameters.", "source": null}, {"id": 880, "topic": "Miscellaneous", "question": "Epilimnetic, metalimnetic, and hypolimnetic water strata are example F of:", "options": {"a": "different layers of underground water", "b": "typical thermal stratification of a lake", "c": "typical layers of hard rock", "d": "various ecological phases"}, "answer": "b", "explanation": "typical thermal stratification of a lake. These layers are referred to as Epilimnion (warm surface waters) is Top-most layer in a thermally stratified lake and Hypolimnion (cold bottom waters) which are separated by the metalimnion, or thermocline layer, stratum of rapidly changing temperature.", "source": null}, {"id": 881, "topic": "Miscellaneous", "question": "In which of the following schedules of the Wildlife (Protection) Act, 1972 is the most common wild cat in India 'Felis chaus' listed?", "options": {"a": "Schedule I", "b": "Schedule III a", "c": "Schedule IV", "d": "Schedule II"}, "answer": "d", "explanation": "Schedule II. Under this schedule, the species receives protection, and poaching or capturing it without proper authorization is prohibited. The Wild Life (Protection) Act, 1972 is an Indian law enacted to protect plant and animal species.", "source": null}, {"id": 882, "topic": "Miscellaneous", "question": "What is a population (or subspecies or race) that is adapted to local environmental conditions called?", "options": {"a": "Niche", "b": "Ecotype", "c": "Prototype", "d": "Biome"}, "answer": "b", "explanation": "Ecotype is a genetically distinct group within a species adapted to specific environmental conditions. An ecological niche describes how a species interacts within an ecosystem. A biome refers to a community of plants and animals naturally occurring in a region with shared characteristics.", "source": null}, {"id": 883, "topic": "Miscellaneous", "question": "Identify whether the given statements about an earthquake are correct or incorrect. Statement 1: When the stress on the edge overcomes the friction, there is an earthquake that releases energy in waves that travel through Earth's crust and causes the shaking that we feel. Statement 2: An earthquake cannot be identified as a foreshock until after a larger earthquake in the same area occurs.", "options": {"a": "Only Statement 1 is correct", "b": "Both Statements 1 and 2 are correct", "c": "Only Statement 2 is correct", "d": "Both Statements 1 and 2 are incorrect"}, "answer": "b", "explanation": "Both Statements 1 and 2 are correct. When lithospheric plates move, the Earth's surface vibrates, causing earthquakes. The point inside the crust where movement begins is called the focus, while the point directly above it on the surface is the epicenter. Vibrations spread outward from the epicenter, with the strongest impact near this point, decreasing as they move away.", "source": null}, {"id": 884, "topic": "Miscellaneous", "question": "Of the total water content - available globally, how much percentage of water is received from freshwater resources?", "options": {"a": "0.5%", "b": "4.5%", "c": "3.5%", "d": "2.5%"}, "answer": "d", "explanation": "2.5%. Although 71% of the Earth's surface is covered by water, only 2.5% of it is freshwater. Out of total water resources on earth Ocean comprises 97.25%, Ice caps- 2.05%, Groundwater- 0.68%, Lakes- 0.1%, Soil moisture- 0.005%, Atmosphere- 0.001%, Streams and river- 0.0001%, Biosphere- 0.00004%. India accounts for about 2.45% of the world's surface area, 4% of the world's water resources, and approximately 16% of the global population.", "source": null}, {"id": 885, "topic": "Miscellaneous", "question": "The highly viscous, mechanically-weak and ductile region Earth's upper mantle is called:", "options": {"a": "lithosphere", "b": "asthenosphere", "c": "mesosphere", "d": "exosphere"}, "answer": "b", "explanation": "Asthenosphere. Lithosphere: The rigid outer layer of Earth, consisting of the crust and the uppermost part the mantle. It is divided into tectonic plates. Mesosphere: The mesosphere the third highest layer of atmosphere and occupies the region above the stratosphere and below the thermosphere. Exosphere: The outermost layer of Earth's atmosphere, where air is extremely thin, and particles can escape into space.", "source": null}, {"id": 886, "topic": "Miscellaneous", "question": "Consider the following statements: I. Hydrology is the study of distribution and movement of water on and below the Earth’s surface. II. Ecology is the study inter-relationship between living organisms and their environment. Which of the above statement(s) is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Different Branches and Their Studies: Bryology The Study of Bryophytes. Biology - The study of living things and their vital processes. Floriculture - The Study flowers and flowering plants.", "source": null}, {"id": 887, "topic": "Miscellaneous", "question": "Which of the following is NOT considered a method of conservation natural resources?", "options": {"a": "Extraction", "b": "Afforestation", "c": "Recycling", "d": "Terrace farming"}, "answer": "a", "explanation": "Extraction refers to the process of removing natural resources from the Earth, such as mining, drilling for oil, or harvesting timber. Conservation is the proper management of a natural resource to prevent its exploitation, destruction or degradation. Method conservation of Natural Resources Reforestation, Rainwater Harvesting, Treatment of Industrial Effluents, In-Situ conservation of Biodiversity, Ex-Situ conservation of Biodiversity, Sustainable development, Crop rotation, Contour ploughing, etc.", "source": null}, {"id": 888, "topic": "Miscellaneous", "question": "The Vienna Convention is related to ____________.", "options": {"a": "protection of wild life", "b": "protection of ozone layer", "c": "Disposing of harmful electronic waste", "d": "sustainable agriculture"}, "answer": "b", "explanation": "protection of ozone layer. of The Vienna Convention multilateral environmental agreement was signed 1985, came into effect in 1988, and achieved universal ratification by 2009. The primary goal of the Vienna Convention is to safeguard human health and the environment from the harmful of effects caused by ozone layer depletion. is", "source": null}, {"id": 889, "topic": "Miscellaneous", "question": "Select the correct statement.", "options": {"a": "The pyramid of energy is always upright.", "b": "The pyramid of biomass is always inverted.", "c": "The pyramid of mass is always upright.", "d": "The pyramid of number is always upright."}, "answer": "a", "explanation": "The pyramid of energy always upright, and can never inverted. According to the 10% law proposed by Raymond Lindeman of energy flow, only 10% of energy transferred from one trophic level another and 90% of the energy remains at the former trophic level for it s needs like respiration and digestion processes. The direction of energy flow in ecosystem is always unidirectional.", "source": null}, {"id": 890, "topic": "Miscellaneous", "question": "Select the correct statement about climax community.", "options": {"a": "It is an ecological community in which populations of plants or animals, which are very unstable and exist for very few time.", "b": "It is a very first community of the ecosystem.", "c": "It consists of only plant population that makes a new ecological system.", "d": "It is an ecological community in which populations of plants or animals remain stable and exist in balance with each other and their environment."}, "answer": "d", "explanation": "A climax community is the “endpoint” of succession within the context of a particular climate and geography. The climax community of remains stable as long as the: environment remains unchanged.", "source": null}, {"id": 891, "topic": "Miscellaneous", "question": "Which concept was proposed Hutchinson in 1957 to express the relationship of an individual or population to all aspects of its environment?", "options": {"a": "Ecological stratification", "b": "Ecological pyramid", "c": "Ecological succession", "d": "Ecological niche"}, "answer": "d", "explanation": "Ecological niche - A term the position of a species within ecosystem. It refers to the Interrelationship of a species with all the biotic and abiotic factors affecting it. in", "source": null}, {"id": 892, "topic": "Miscellaneous", "question": "Which of the following companies had constructed Asia’s first cross - country pipeline as a mode of transport for liquids and gasses over long distances ?", "options": {"a": "Oil and Natural Gas Corporation", "b": "Indian Oil Corporation", "c": "Bharat Petroleum", "d": "Oil India Limited"}, "answer": "d", "explanation": "Oil India Limited. Naharkatia (Assam)-Barauni (Bihar) Pipeline (First cross-country pipeline). The Pipeline between Naharkatia and Nunmati became operative in 1962 and that between Nunmati and Barauni in 1964.", "source": null}, {"id": 893, "topic": "Miscellaneous", "question": "The term physical geology was is coined by __________. be i", "options": {"a": "William Hopkins", "b": "Georgius Agricola", "c": "Louis Agassiz", "d": "Aziz Ab'Saber of a is"}, "answer": "a", "explanation": "William Hopkins. Fathers of tho Various Fields - Economics (Adam Smith), Telephone (Alexander Graham Bell), Modern Chemistry (Antoine Lavoisier), Classification/ Taxonomy an (Carl Linnaeus), Evolution (Charles Darwin), Geography (Eratosthenes).", "source": null}, {"id": 894, "topic": "Miscellaneous", "question": "Who was the first ecologist to describe the specific shape of eco-trophic interactions, which he called the pyramid of numbers, in the 1920s ?", "options": {"a": "Ernst Haeckel", "b": "Howard Thomas Odum", "c": "Edward O Wilson", "d": "Charles Elton"}, "answer": "d", "explanation": "Charles Elton. He introduced the concept of food web, food chain and ecological niche in the classic textbook “Animal Ecology” in 1927. Ernest Haeckel - He coined the term ‘Ecology’ in 1866. Edward O Wilson - Proponent of Sociobiology.", "source": null}, {"id": 895, "topic": "Miscellaneous", "question": "The Karewa formations are found in the __________.", "options": {"a": "North Easter Hills", "b": "Kashmir Himalayas", "c": "Uttaranchal Himalayas by", "d": "Terai Region"}, "answer": "b", "explanation": "Kashmir Himalayas. The Karewa term means “elevated table land”. Firstly, this term was used by Godwin Austin in 1859. “Vudr” is the local name for it in Kashmiri language. Karewa formations are useful for the cultivation of Zafran (Saffron), almond, walnut, for apple, and orchards in Kashmir valley. an", "source": null}, {"id": 896, "topic": "Miscellaneous", "question": "Siachen in Himalayas is:", "options": {"a": "a glacier", "b": "a dam", "c": "a national park", "d": "a lake"}, "answer": "a", "explanation": "A glacier. The Siachen Glacier is located in the Eastern Karakoram range in the Himalayas. It the world's highest battlefield. Nubra river originates from Siachen Glacier. It situated to the North of Nubra Valley.", "source": null}, {"id": 897, "topic": "Miscellaneous", "question": "____________ is characterized by abundant dissolved oxygen, sunlight, nutrients, generally high wave energies and water motion, and, in the intertidal subzone, alternating submergence and exposure.", "options": {"a": "The Lentic Zone", "b": "The Limnetic Zone", "c": "The Littoral Zone", "d": "The Benthic Zone"}, "answer": "c", "explanation": "The Littoral Zone - It is an area close to the shore and submerged in water to some degree. Lentic Zone Ecosystem entails a body of standing water, ranging from ditches, seeps, ponds, seasonal pools, basin marshes and lakes. Benthic Zone - The lowest ecological zone in a water body. Limnetic zone - The top layer of lake water distant from the coast, and extends only as deep as sunlight can penetrate (200 m).", "source": null}, {"id": 898, "topic": "Miscellaneous", "question": "Which ecologist showed in long-term experiment on outdoor plots that biodiversity is of central importance to the productivity, stability, resistance the invasion of ecosystems and fertility of their soils?", "options": {"a": "Karl Mobius", "b": "David Tilman", "c": "Herbert Spencer", "d": "Edward Osborne Wilson"}, "answer": "b", "explanation": "David Tilman. Edward Wilson - Father of biodiversity. Karl Möbius - First to develop the concept ecological community, biocenosis, living community.", "source": null}, {"id": 899, "topic": "Miscellaneous", "question": "Which hypothesis was proposed by Paul Ehrlich to suggest the importance of species richness in the maintenance of ecosystems ?", "options": {"a": "Portfolio hypothesis", "b": "Redundancy hypothesis", "c": "Predation hypothesis", "d": "Rivet popper hypothesis"}, "answer": "d", "explanation": "Rivet popper hypothesis. The hypothesis suggests the importance of species richness in the maintenance of the ecosystem. Redundancy hypothesis - It predicts that the species redundancy in a plant community enhances community stability. Predation hypothesis - It predicts that group-living animals are adapted to make alarm calls that distract or confuse predators.", "source": null}, {"id": 900, "topic": "Miscellaneous", "question": "Which states are involved in the is joint venture of the Chambal Project?", "options": {"a": "Rajasthan and Haryana is", "b": "Rajasthan and Uttar Pradesh", "c": "Uttar Pradesh and Madhya Pradesh", "d": "Rajasthan and Madhya Pradesh"}, "answer": "d", "explanation": "Rajasthan and Madhya Pradesh. Chambal Project: Initiated in 1954. Aim - Harnessing the Chambal River for irrigation, Power generation and for prevention and control of soil erosion in the valley.", "source": null}, {"id": 901, "topic": "Miscellaneous", "question": "In the context of ecology, the given equation shows the relationship between the size of an area and the number of species present in it. Accordingly, by which letter is the - regression coefficient denoted? log S = log C + Z log A", "options": {"a": "S", "b": "A", "c": "Z", "d": "C"}, "answer": "c", "explanation": "Z. The species-area relationship is often evaluBated in conservation science in order to predict extinction rates in the case of habitat loss and habitat fragmentation. The equation: log S =m log C + Z log A, where a = species richness, A = area, C Y-intercept.", "source": null}, {"id": 902, "topic": "Miscellaneous", "question": "In e the 1930s, which of the to following theories was propounded by Arthur Holmes about the mantle ?", "options": {"a": "Theory of Faunal Succession", "b": "Slab Pull Theory F", "c": "Convectional Current Theory", "d": "Theory of Faulting"}, "answer": "c", "explanation": "Convectional current Theory. O. The Convectional currents are generated due to radioactive elements causing of thermal differences in the mantle or portion. Arthur Holmes - The first earth scientist to grasp the mechanical and thermal implications of mantle convection, which led eventually to the acceptance of plate tectonics.", "source": null}, {"id": 903, "topic": "Miscellaneous", "question": "Name a unit designed for wet and dry bulb thermometers to protect temperature sensors from being affected by direct or reflected sunlight.", "options": {"a": "Stevenson screen", "b": "Skywarn screen", "c": "Clarinet screen", "d": "Cardinal screen"}, "answer": "a", "explanation": "Stevenson screen - It is also known as a cotton region shelter, an instrument shelter, a thermometer shelter, a thermoscreen, or thermometer screen. Skywarn screen - is a national network of volunteer severe weather spotters. It was established to obtain critical weather information by the National Weather Service.", "source": null}, {"id": 904, "topic": "Miscellaneous", "question": "Which state is also known as the 'Molasses basin', which is made up of soft unconsolidated deposits?", "options": {"a": "Mizoram", "b": "Manipur", "c": "Nagaland", "d": "Meghalaya"}, "answer": "a", "explanation": "Mizoram (The Land of rolling - mountains). Manipur is known as ‘The Jewel of land’ in India. Nagaland - The falcon capital of the world. Meghalaya - The Abode of Clouds.", "source": null}, {"id": 905, "topic": "Miscellaneous", "question": "In which year was an approach and program named Joint Forest Management (JFM) launched in the context of National Forest Policy?", "options": {"a": "1965", "b": "1988", "c": "1996", "d": "1947"}, "answer": "b", "explanation": "1988. Joint Forest Management is about involving local communities in the management and restoration of degraded forests.", "source": null}, {"id": 906, "topic": "Miscellaneous", "question": "Consider the following statements: I. Arthur G. Tansley is regarded as the \"Father of Modern Ecology\". II. Eugene P. Odum coined the term \"Ecosystem\" in 1935. = Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. Eugene Odum is well known for Contribution in ecology. Eugene Pleasants Odum (Father of modern ecology). Alexander von Humbolt - Father of ecology. Arthur G. Tansley - First to coin the term ecosystem in 1935. Vladimir Vernadsky - Founded the biosphere concept.", "source": null}, {"id": 907, "topic": "Miscellaneous", "question": "Which of the following is the scientific discipline concerned with the description and classification of the Earth's topographic features?", "options": {"a": "Geomorphology", "b": "Acarology", "c": "Ethology", "d": "Meteorology"}, "answer": "a", "explanation": "Geomorphology is a term that studies change in the earth’s surface due to these exogenic and endogenic forces, where exogenic forces are the external forces originating within the earth’s atmosphere and endogenic forces are internal forces generated from within the earth. Acarology - Study of mites and ticks. It also involves the study a of the Acarina order - it means study of It arachnids like spiders, scorpions,etc.", "source": null}, {"id": 908, "topic": "Miscellaneous", "question": "_______ species are those species of plants and animals which are found exclusively in a particular area.", "options": {"a": "Endemic", "b": "Endangered", "c": "Threatened", "d": "Critically Endangered"}, "answer": "a", "explanation": "Endemic. Example Endemic Species - Kangaroos originally endemic to Australia and found nowhere else in the world. Endemic Species India - Asiatic Lion (Gir Forest), Kashmir Stag (Kashmir Valley), Purple Frog (Western Ghats), Sangai Deer (Loktak Lake), Nilgiri Tahr (Nilgiri Hills).", "source": null}, {"id": 909, "topic": "Miscellaneous", "question": "In countries like Japan, _________ birth rates make the population pyramid _______ at the base.", "options": {"a": "Low, Broad", "b": "High, Broad", "c": "Low, Narrow", "d": "High, Narrow"}, "answer": "c", "explanation": "Low, Narrow. A population pyramid is a way to visualize age and sex of a specific population. Decreased Death rates allow numbers of people reach old age. A country in which birth and death rates are high, the pyramid broad at the base and rapidly narrows towards the top (Kenya).", "source": null}, {"id": 910, "topic": "Miscellaneous", "question": "Which is the second largest family in modern Indian languages?", "options": {"a": "Sino-Tibetan (Kirata)", "b": "Indo-European (Aryan)", "c": "Austric (Nishada)", "d": "Dravidian (Dravida)"}, "answer": "d", "explanation": "Dravidian (Dravida). Major Dravidian Languages - Tamil, Telugu, Kannada and Malayalam. They are mainly spoken in southern India, central India, north-east Sri Lanka.", "source": null}, {"id": 911, "topic": "Miscellaneous", "question": "The point on the surface, nearest to the focus of the earthquake, is called _______.", "options": {"a": "hypocentre", "b": "epicenter", "c": "centripiece", "d": "semi centre"}, "answer": "b", "explanation": "Epicenter. Hypocenter - point beneath the Earth's surface where the vibrations of an earthquake originate. Richter scale is the most common standard of measurement for earthquakes. The Richter Magnitude - is a measure of the amount of energy released during an earthquake and expressed by the Richter scale.", "source": null}, {"id": 912, "topic": "Miscellaneous", "question": "Identify the southernmost range of the Himalaya from the following.", "options": {"a": "Shiwaliks Range", "b": "Trans Himalaya Range", "c": "Lesser Himalaya Range", "d": "Greater Himalaya Range"}, "answer": "a", "explanation": "Siwaliks Range. Himalayan Ranges: Himadri (Greater Himalayas Inner Himalayas), Himachal (Lesser Himalayas), Shiwaliks (Outer Himalayas). Divisions (West to east): Punjab Himalayas (between rivers Indus and Sutlej), Kumaon Himalayas (Between Sutlej and Kali rivers), Nepal Himalayas of (between rivers Kali and Teesta), Assam Himalayas (between rivers Tista and Dihang), Purvanchal (beyond the Dihang of river).", "source": null}, {"id": 913, "topic": "Miscellaneous", "question": "The western Ghats and the Eastern Ghats meet at which of the following places in southern India?", "options": {"a": "Satpura Hills", "b": "Nallamala Hills", "c": "Nilgiri Hills", "d": "Mahendragiri Hills"}, "answer": "c", "explanation": "Nilgiri Hills: Highest Peak Doda Betta. Located at the tri-junction the states of Karnataka, Kerala and Tamil Nadu. Named after the Neelakurinji flowers (purplish-blue flowers) found Shola forests. Satpura Hills - The range to begins in eastern Gujarat and runs east through Maharashtra and Madhya is Pradesh before ending in Chhattisgarhh. Nallamala Hills - Andhra Pradesh, eastern ghats. Mahendragiri Hills located in the district of Gajapati, Odisha (eastern ghats).", "source": null}, {"id": 914, "topic": "Miscellaneous", "question": "Which of the following earthquake waves are longitumdinal waves?", "options": {"a": "L waves", "b": "P waves", "c": "N waves", "d": "S Waves"}, "answer": "b", "explanation": "P waves. They vibrate paralleel to the direction of the wave. This exerts pressure on the material in the drirection of the propagation. Earthquake waves (Seismic waves) are vibrations the earth that transmit energy.", "source": null}, {"id": 915, "topic": "Miscellaneous", "question": "___________ species are the species which are not found after searches of known or likely areas where they may occur.", "options": {"a": "Extinct", "b": "Endangered", "c": "Normal", "d": "Vulnerable"} enosphere. in", "source": null}, {"id": 919, "topic": "Miscellaneous", "question": "The national census does NOT recognise ________ groups within India.", "options": {"a": "tribal", "b": "ethnic", "c": "religious", "d": "scheduled caste"}, "answer": "b", "explanation": "Ethnic. Census is the process of collecting, analyzing, and sharing demographic, economic, and social data of all people in a country or specific region at a given time. is", "source": null}, {"id": 920, "topic": "Miscellaneous", "question": "Which of the following mountains is formed as a result of the compression of tectonic plates, leading to the formation of large fold-like structures on the Earth's crust?", "options": {"a": "Ural mountain in Russia", "b": "Vosges mountain in Europe", "c": "Mt.Kilimanjaro in Africa", "d": "Harz mountains in Germany"}, "answer": "a", "explanation": "Ural mountain in Russia. Fold Mountains - Himalayan Mountains A in Asia, the Alps in Europe, the Andes in South America, the Rockies in North America.", "source": null}, {"id": 921, "topic": "Miscellaneous", "question": "Which of the following mountains were formed when molten rock from the depths of the earth rose from the crust and piled up on its own?", "options": {"a": "Mount Kilimanjaro in Africa", "b": "Rockies in North America", "c": "Ural mountain in Russia", "d": "Alps in Europe"}, "answer": "a", "explanation": "Mount Kilimanjaro in Africa (Tanzania). Top mountains in Africa: Mount Kenya, Mount Stanley, Mount Speke, Mount Baker, Mount Emin.", "source": null}, {"id": 922, "topic": "Miscellaneous", "question": "'Anaconda', one of the world's largest snakes, is found in _______.", "options": {"a": "Tropical evergreen forest", "b": "Monsoon forest", "c": "Temperate evergreen forest", "d": "Temperate grasslands"}, "answer": "a", "explanation": "Tropical Evergreen Forests (Amazon forest). They are categorized under the genus Eunectes (great swimmers) and family (Boidae). They thrive very well in hot, humid places wi <script>
(function(){
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const TOPICS = Array.from(new Set(DATA.map(d => d.topic)));

  let order = DATA.map((_, i) => i); // indices into DATA, current working order (filtered)
  let filtered = order.slice();
  let pos = 0; // position within `filtered`
  let currentTopic = 'All topics';

  const state = {}; // id -> {selected, correct, revealed}

  const topicSelect = document.getElementById('topicSelect');
  const qNumLabel = document.getElementById('qNumLabel');
  const qTopicLabel = document.getElementById('qTopicLabel');
  const qSourceLabel = document.getElementById('qSourceLabel');
  const qText = document.getElementById('qText');
  const qOptions = document.getElementById('qOptions');
  const explainBox = document.getElementById('qExplain');
  const resultFlag = document.getElementById('resultFlag');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const revealBtn = document.getElementById('revealBtn');
  const jumpInput = document.getElementById('jumpInput');
  const jumpBtn = document.getElementById('jumpBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressFill = document.getElementById('progressFill');
  const statAttempted = document.getElementById('statAttempted');
  const statCorrect = document.getElementById('statCorrect');
  const statAccuracy = document.getElementById('statAccuracy');

  function buildTopicOptions(){
    topicSelect.innerHTML = '';
    const optAll = document.createElement('option');
    optAll.value = 'All topics';
    optAll.textContent = `All topics (${DATA.length})`;
    topicSelect.appendChild(optAll);
    TOPICS.forEach(t => {
      const count = DATA.filter(d => d.topic === t).length;
      const opt = document.createElement('option');
      opt.value = t;
      opt.textContent = `${t} (${count})`;
      topicSelect.appendChild(opt);
    });
  }

  function applyFilter(){
    if(currentTopic === 'All topics'){
      filtered = DATA.map((_, i) => i);
    } else {
      filtered = DATA.map((_, i) => i).filter(i => DATA[i].topic === currentTopic);
    }
    pos = 0;
    render();
  }

  function updateStats(){
    const attempted = Object.keys(state).length;
    const correct = Object.values(state).filter(s => s.correct).length;
    statAttempted.textContent = attempted;
    statCorrect.textContent = correct;
    statAccuracy.textContent = attempted ? Math.round(100 * correct / attempted) + '%' : '—';
  }

  function render(){
    if(filtered.length === 0){
      qText.textContent = 'No questions in this topic.';
      qOptions.innerHTML = '';
      explainBox.classList.remove('show');
      resultFlag.classList.remove('show');
      return;
    }
    const idx = filtered[pos];
    const q = DATA[idx];
    qNumLabel.textContent = `Q. ${q.id} / 925  ·  (${pos+1} of ${filtered.length} in view)`;
    qTopicLabel.textContent = q.topic;
    qSourceLabel.textContent = q.source ? q.source : '';
    qText.textContent = q.question;

    qOptions.innerHTML = '';
    const st = state[q.id] || { selected: null, correct: null, revealed: false };
    ['a','b','c','d'].forEach(letter => {
      const div = document.createElement('button');
      div.className = 'option';
      div.type = 'button';
      div.setAttribute('data-letter', letter);
      const span1 = document.createElement('span');
      span1.className = 'letter';
      span1.textContent = letter.toUpperCase();
      const span2 = document.createElement('span');
      span2.textContent = q.options[letter];
      div.appendChild(span1);
      div.appendChild(span2);

      if(st.selected){
        div.classList.add('locked');
        if(letter === q.answer){
          div.classList.add('correct');
        } else if(letter === st.selected){
          div.classList.add('wrong');
        } else {
          div.classList.add('dim');
        }
      }

      div.addEventListener('click', () => selectOption(q, letter));
      qOptions.appendChild(div);
    });

    if(st.selected || st.revealed){
      explainBox.innerHTML = '<b>Explanation. </b>' + escapeHtml(q.explanation);
      explainBox.classList.add('show');
    } else {
      explainBox.classList.remove('show');
    }

    if(st.selected){
      resultFlag.classList.add('show');
      if(st.correct){
        resultFlag.textContent = '✓ Correct';
        resultFlag.className = 'result-flag show ok';
      } else {
        resultFlag.textContent = `✗ Incorrect — correct answer is ${q.answer.toUpperCase()}`;
        resultFlag.className = 'result-flag show bad';
      }
    } else {
      resultFlag.classList.remove('show');
    }

    prevBtn.disabled = pos === 0;
    nextBtn.textContent = (pos === filtered.length - 1) ? 'Restart from #1 →' : 'Next →';
    progressFill.style.width = (100 * (pos+1) / filtered.length) + '%';
    updateStats();
  }

  function selectOption(q, letter){
    if(state[q.id] && state[q.id].selected) return; // already answered, locked
    state[q.id] = {
      selected: letter,
      correct: letter === q.answer,
      revealed: true
    };
    render();
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  topicSelect.addEventListener('change', () => {
    currentTopic = topicSelect.value;
    applyFilter();
  });

  prevBtn.addEventListener('click', () => {
    if(pos > 0){ pos--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  });

  nextBtn.addEventListener('click', () => {
    if(pos < filtered.length - 1){ pos++; }
    else { pos = 0; }
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  revealBtn.addEventListener('click', () => {
    const idx = filtered[pos];
    const q = DATA[idx];
    if(!state[q.id]){
      state[q.id] = { selected: null, correct: null, revealed: true };
    } else {
      state[q.id].revealed = true;
    }
    render();
  });

  jumpBtn.addEventListener('click', () => {
    const n = parseInt(jumpInput.value, 10);
    if(!n || n < 1 || n > 925) return;
    const dataIdx = n - 1;
    const topic = DATA[dataIdx].topic;
    if(currentTopic !== 'All topics' && currentTopic !== topic){
      currentTopic = 'All topics';
      topicSelect.value = 'All topics';
      filtered = DATA.map((_, i) => i);
    }
    const p = filtered.indexOf(dataIdx);
    if(p >= 0){ pos = p; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  });

  jumpInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') jumpBtn.click(); });

  shuffleBtn.addEventListener('click', () => {
    for(let i = filtered.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
    }
    pos = 0;
    render();
  });

  resetBtn.addEventListener('click', () => {
    if(!confirm('Clear all answers and score for this session?')) return;
    Object.keys(state).forEach(k => delete state[k]);
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight') nextBtn.click();
    if(e.key === 'ArrowLeft') prevBtn.click();
    if(['1','2','3','4'].includes(e.key)){
      const letters = ['a','b','c','d'];
      const idx = filtered[pos];
      selectOption(DATA[idx], letters[parseInt(e.key,10)-1]);
    }
  });

  buildTopicOptions();
  applyFilter();
})();
</script>
