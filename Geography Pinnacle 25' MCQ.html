 Moderate seismic B. Zone III activity 3. High seismic C. Zone IV activity 4. Most seismically D. Zone V active region", "options": {"a": "A-1, B-2, C-3, D-4", "b": "A-2, B-1, C-4, D-3", "c": "A-4, B-3, C-1, D-2", "d": "A-3, B-4, C-2, D-1"}, "answer": "a", "explanation": "A-1, B-2, C-3, D-4. The Bureau of Indian Standards has classified regions in India into 4 seismic zones on the basis of historical seismic activity. These are zones II, III, IV and V. The magnitude scale used to measure earthquakes ranges from 1 to 12.", "source": null}, {"id": 104, "topic": "Continents and Oceans", "question": "The _____ is responsible for Earth's magnetic field.", "options": {"a": "inner core", "b": "mantle", "c": "outer core", "d": "crust"}, "answer": "c", "explanation": "outer core. On Earth, flowing liquid metal in the outer core of the planet generates electric currents. Thhe rotation of Earth on its axis causes these electric currents to form a magn etic field which extends around the planet.", "source": null}, {"id": 105, "topic": "Continents and Oceans", "question": "Consider thee following statements regarding Gondwanaland: 1. Gondwanalanmd included present-day South America, Africa, Madagascar, India, Australia, and Antarctica. 2. North Aemerica was also a part of Gondwanaland. Whiche of the above statements is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. Gondwana was a large landmass, sometimes referred to as a supercontinent. The remnants of Gondwana make up around two-thirds of today's continental area, including South America, Africa, Antarctica, Australia, Zealandia, Arabia, and the Indian subcontinent. Neighbouring Countries of India", "source": null}, {"id": 106, "topic": "Neighbouring Countries of India", "question": "Which of the following is in geographical proximity to Sri Lanka?", "options": {"a": "Only Karaikal", "b": "Karaikal and Yanam", "c": "Only Mahe", "d": "Only Yanam"}, "answer": "a", "explanation": "Only Karaikal. Karaikal is a town in the Union Territory of Puducherry. Sri Lanka, formerly known as Ceylon, is an island nation in South Asia. Located in the Indian Ocean, southwest of the Bay of Bengal, it is separated from the Indian peninsula by the Gulf of Mannar and the Palk Strait. Sri Lanka shares a maritime border with the Maldives to the southwest and India to the northwest.", "source": null}, {"id": 107, "topic": "Neighbouring Countries of India", "question": "Which of the following pairs do NOT share any borders?", "options": {"a": "Bhutan and Arunachal Pradesh", "b": "Bhutan and Meghalaya", "c": "Bhutan and West Bengal", "d": "Bhutan and Assam"}, "answer": "b", "explanation": "Bhutan and Meghalaya. The Indian states of West Bengal (183 km), Arunachal Pradesh (217 km), Sikkim (32 km), and Assam (267 km) share their boundaries with Bhutan. The Kingdom of Bhutan and the Republic of India are separated by a 699 km long, regional border.", "source": null}, {"id": 108, "topic": "Neighbouring Countries of India", "question": "Which of the following countries has the highest Hindu population after India?", "options": {"a": "Bhutan", "b": "Sri Lanka", "c": "Myanmar", "d": "Nepal"}, "answer": "d", "explanation": "Nepal. After India, the next nine countries with the largest Hindu populations are, in decreasing order: Nepal, Bangladesh, Indonesia, Pakistan, Sri Lanka, the United States, Malaysia, the United Arab Emirates and the United Kingdom.", "source": null}, {"id": 109, "topic": "Neighbouring Countries of India", "question": "Assertion (A): New Moore Island, also known as South Talpatti, is geographically closest to Bangladesh. Reason (R): It is located in the Bay of Bengal near the maritime boundary between India and Bangladesh.", "options": {"a": "Both A and R are correct, and R is the correct explanation of A", "b": "Both A and R are correct, but R is not the correct explanation of A", "c": "A is correct, but R is incorrect", "d": "A is incorrect, but R is correct"}, "answer": "a", "explanation": "Both A and R are correct, and R is the correct explanation of A.", "source": null}, {"id": 110, "topic": "Neighbouring Countries of India", "question": "Consider the following statements: 1. The Maldives are located to the south of Lakshadweep Islands of India. 2. The capital of Maldives is Male. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The Maldives are a group of coral atolls that were formed from the crowns of an ancient volcanic mountain range.", "source": null}, {"id": 111, "topic": "Neighbouring Countries of India", "question": "Consider the following statements regarding boundary lines of India: 1. The McMahon Line is the boundary between India and China. 2. The Radcliffe Line forms the boundary between India and Pakistan. 3. The Durand Line separates Pakistan and Afghanistan. Which of the statements given above is/are correct?", "options": {"a": "1 only", "b": "1 and 2 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "answer": "d", "explanation": "1, 2 and 3. Pakistan shares border with India, defined by the Radcliffe Line (International Border) and the Line of Control. India has 15,106.7 Km of land border and a coastline of 7,516.6 Km including island territories. India shares the longest border with Bangladesh about 4,096.7 km and Shortest with Afghanistan about 106 km. The Durand line separates Pakistan and Afghanistan.", "source": null}, {"id": 112, "topic": "Neighbouring Countries of India", "question": "Which trek in Bhutan is considered to be the crown jewel of Bhutanese trekking?", "options": {"a": "Jumolhari Trek", "b": "Dagala Thousand Lakes Trek", "c": "Snowman Trek", "d": "Laya Gasa Trek"}, "answer": "c", "explanation": "Snowman Trek. It is a 27 day track. Other Treks in Bhutan - Jumolhari Trek, Dagala Thousand Lakes trek, Laya Gasa Trek, Druk Path Trek, Tsaluna Trek, etc. Treks in India - Kalindi Khal Trek, Stok Kangri Trek, Auden's Col Trek, Chadar Trek, etc.", "source": null}, {"id": 113, "topic": "Neighbouring Countries of India", "question": "Consider the following statements regarding the Sino–Indian border (LAC): 1. The Line of Actual Control (LAC) is divided into three sectors – Western, Central, and Eastern. 2. The Eastern sector of the LAC lies across Himachal Pradesh and Uttarakhand states. Which of the above statements is incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. The Indian Military has divided the LAC (Line of Actual Control) into 3 sectors - Western sector across Ladakh and the Chinese-held Aksai Chin, The central sector across Himachal Pradesh and Uttarakhand states, and the eastern sector across Sikkim and Arunachal Pradesh states.", "source": null}, {"id": 114, "topic": "Neighbouring Countries of India", "question": "Match the following mountain passes with the countries/borders they are associated with: Pass Country / Border A. Khyber Pass 1. India–China border B. Pangsau Pass 2. India–Myanmar border C. Karakoram Pass 3. Pakistan and Afghanistan border D. Zojila Pass 4. India (Ladakh –Srinagar link)", "options": {"a": "A–3, B–2, C–1, D–4", "b": "A–2, B–3, C–1, D–4", "c": "A–3, B–4, C–2, D–1", "d": "A–1, B–2, C–3, D–4"}, "answer": "a", "explanation": "A–3, B–2, C–1, D–4.", "source": null}, {"id": 115, "topic": "Neighbouring Countries of India", "question": "Consider the following statements: 1. The Sunderban forest is part of the world's largest delta and contains the largest mangrove forests. 2. The Sunderban forest is shared between India and Bangladesh. Which of the statements given above is/are correct? h", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "NeitheBr 1 nor"}, "answer": "c", "explanation": "Both 1 and 2. Sunderban forest is the only mangrov e habitat in the world for Panthera tigris species. Indian Drainage System", "source": null}, {"id": 116, "topic": "Indian Drainage System", "question": "Wh ich of the following rivers forms a delta along the Eastern Coastal Plains ?", "options": {"a": "Narmada", "b": "Tapi F", "c": "Mahi", "d": "Godavari"}, "answer": "d", "explanation": "Godavari. The Godavari River, also called the Dakshina Ganga or Ganga of the South, forms a large delta along the Eastern Coastal Plains before draining into the Bay of Bengal. It is the second longest river in India after the Ganga. Major delta-forming rivers on the east coast: Mahanadi, Godavari, Krishna, and Kaveri. On the other hand, west-flowing rivers like Narmada, Tapi, and Mahi do not form deltas; they form estuaries because of their short course and fast flow into the Arabian Sea.", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 117, "topic": "Indian Drainage System", "question": "Which of these rivers does not originate in the Peninsular Plateau of India ?", "options": {"a": "Godavari", "b": "Ganga", "c": "Krishna", "d": "Cauvery"}, "answer": "b", "explanation": "Ganga. The Ganga River does not originate in the Peninsular Plateau. Instead, it originates from the Gangotri Glacier in the Himalayas at Gaumukh in Uttarakhand. Origins of the other rivers: Godavari — Trimbakeshwar near Nasik, Maharashtra (Western Ghats). Krishna — Mahabaleshwar near Jor village, Maharashtra (Western Ghats). Cauvery (Kaveri) — Talakaveri in the Brahmagiri Hills, Karnataka (Western Ghats).", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 118, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the Ghaghara River system: 1. The Ghaghara originates from the Mapchachungo glacier in the Himalayas. 2. It forms a deep gorge at Shishapani before entering the plains. 3. It merges with the Ganga at Allahabad after receiving the Sarda River. Which of the above statements is/are correct?", "options": {"a": "Only 1 and 3", "b": "Only 1 and 2", "c": "Only 2 and 3", "d": "1, 2 and 3 are correct"}, "answer": "b", "explanation": "Only 1 and 2. The Ghaghara River originates from the Mapchachungo glacier in the Tibetan Himalayas. It carves a deep gorge at Shishapani before entering the plains of Nepal. Statement 3 is incorrect because the Ghaghara joins the Ganga river near Chhapra in Bihar, not at Allahabad.", "source": "SSC Stenographer 6/08/2025 (Shift 2)"}, {"id": 119, "topic": "Indian Drainage System", "question": "The Alaknanda River originates from which of the following?", "options": {"a": "Satopanth Glacier", "b": "Zemu Glacier", "c": "Milam Glacier", "d": "Gangotri Glacier"}, "answer": "a", "explanation": "Satopanth Glacier. The Alaknanda River, a major tributary of the Ganga, originates from the Satopanth Glacier near Badrinath in Uttarakhand, at an elevation of about 3,650 metres. It flows through important confluences (prayags) such as Vishnuprayag, Nandprayag, Karnaprayag, Rudraprayag, and Devprayag, where it finally meets the Bhagirathi River to form the Ganga. In contrast, the Gangotri Glacier is the source of the Bhagirathi River, the Zemu Glacier feeds the Teesta in Sikkim, and the Milam Glacier gives rise to the Goriganga in Uttarakhand.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 120, "topic": "Indian Drainage System", "question": "Read the given below statements carefully and choose the correct option: Assertion (A): The Chambal River is known for its badland topography called the Chambal ravines. Reason (R): The Chambal flows through a deep gorge and eroded terrain before joining the Yamuna.", "options": {"a": "Both A and R are true, but R is not the correct explanation of A.", "b": "Both A and R are true, and R is the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "b", "explanation": "The Chambal basin is famous for deep ravines formed due to intensive gully erosion, a classic example of badland topography. The Chambal indeed flows through a rugged, eroded landscape, cutting gorges and ravines before meeting the Yamuna in Etawah district (U.P.).The badland topography (ravines) is formed because of severe erosion by the river and its tributaries in the soft alluvial soils of the Chambal basin. Hence, the reason correctly explains the assertion. Chambal and its tributaries (Kalisindh, Banas, Sindh) intensify erosion. These ravines stretch across Madhya Pradesh, Rajasthan, and Uttar Pradesh.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 121, "topic": "Indian Drainage System", "question": "Which of the following is an erosional landform created primarily by river action?", "options": {"a": "Moraine", "b": "Delta", "c": "Gorge", "d": "Levee"}, "answer": "c", "explanation": "Gorge. A gorge is a deep, narrow valley with steep sides, formed when a river cuts vertically into its bed through the process of erosion, especially in the upper course where the river has a steep gradient. It is a classic erosional landform created by river action Moraine – Depositional landform created by glaciers, consisting of rock d ebris. Delta – Depositional feature formed at the river’s mouth due to deposition of sediments. Levee – A natural or artificial embankment formed alongside a river, also depositional in nature.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 122, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the evolution of India's major drainage systems: 1. The ancient Indo-Brahma river is believed to have split into three major drainage systems over time. 2. The Ganga and its Himalayan tributaries represent the central drainage system. 3. The western drainage system consists of the Brahmaputra and its tributaries. Which of the above statements is/are correct?", "options": {"a": "Only 2 and 3", "b": "All 1, 2 and 3 are correct", "c": "Only 1 and 3", "d": "Only 1 and 2"}, "answer": "d", "explanation": "Only 1 and 2. The Indo-Brahma River system is believed to be an ancient unified river that later broke into three drainage systems: the Indus (western), the Ganga (central), and the Brahmaputra (eastern). The Ganga and its Himalayan tributaries like Yamuna, Ghaghara, Gandak, and Kosi form the central drainage system. However, the Brahmaputra and its tributaries constitute the eastern drainage system, not the western one.", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 123, "topic": "Indian Drainage System", "question": "Which river is the main source of water for the Hirakud Dam?", "options": {"a": "Godavari River", "b": "Krishna River", "c": "Mahanadi River", "d": "Narmada River"}, "answer": "c", "explanation": "Mahanadi River. The Hirakud Dam, located near Sambalpur in Odisha, is built across the Mahanadi River. It is one of the world’s longest earthen dam s (25.8 km) and serves multiple purposes—irrigation, hydroelectrBic power generation, and flood control in the Mahanadi delta. e", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 124, "topic": "Indian Drainage System", "question": "The Jog Falls in Karnataka is formed from whic h river?", "options": {"a": "Godavari", "b": "Kaveri", "c": "Sharavathi", "d": "Krishna"}, "answer": "c", "explanation": "Sharavathi. Jog Falls, also called Gerosoppa Falls or J oga Falls, is one of the highest plunge. waterfalls in India (about 253 meters). It is located in Shivamogga district, Karnataka. It is a major hydroelectric power source as well, with the Sharavathi Hydroelectric Project built nearby. Godavari – Flows mainly through Maharashtra, Telangana, Andhra Pradesh. Kaveri – Famous for Shivanasamudra and Hogenakkal Falls, not Jog Falls.Krishna – Flows through Maharashtra, Karnataka, Telangana, Andhra Pradesh; associated with Almatti and Srisailam dams.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 125, "topic": "Indian Drainage System", "question": "Trishulganga is a stream of the river:", "options": {"a": "Ghaghara", "b": "Beas", "c": "Godavari", "d": "Gandak"}, "answer": "d", "explanation": "Gandak. It comprises two streams, namely Kaligandak and Trishulganga. It rises in the Nepal Himalayas between the Dhaulagiri and Mount Everest and drains the central part of Nepal. It enters the Ganga plain in Champaran district of Bihar and joins the Ganga at Sonpur near Patna.", "source": null}, {"id": 126, "topic": "Indian Drainage System", "question": "Select the odd one from the following saltwater lakes on the basis of their formation?", "options": {"a": "Pulicat lake", "b": "Kolleru lake", "c": "Chilika lake", "d": "Sambhar lake"}, "answer": "d", "explanation": "Sambhar lake: The largest inland saltwater lake in India situated in Rajasthan. Pulicat lake (Andhra Pradesh and Tamil Nadu), Kolleru lake (Andhra Pradesh), and Chilika lake (Odisha) - are all coastal saltwater lakes, formed by the seawater entering the lake through creeks or rivers.", "source": null}, {"id": 127, "topic": "Indian Drainage System", "question": "The Zaskar and the Nubra are tributaries of which river?", "options": {"a": "Mahanadi", "b": "Ganga", "c": "Indus", "d": "Kaveri"}, "answer": "c", "explanation": "Indus (Sindhu) originates a from a glacier near Bokhar Chu in the Tibetan region at an altitude of 4,164 m in the Kailash Mountain range. Tributaries - Chenab River, Jhelum River, Ravi River, Satluj River, Beas River, Shyok River, Gilgit River, Hunza River, Swat River, Kunnar River, Kurram River, Gomal River, and Kabul River.", "source": null}, {"id": 128, "topic": "Indian Drainage System", "question": "Which of the following rivers flows north of the Tropic of Cancer in India?", "options": {"a": "Mahanadi", "b": "Tapi", "c": "Penganga", "d": "Yamuna"}, "answer": "d", "explanation": "Yamuna. Originates - Yamunotri Glacier, Flows through the Himalayan foothills before entering the Indo-Gangetic Plain. Tributaries - Tons, Hindon, Chambal, Sind, Betwa, and Ken. The Yamuna River joins the Ganges River near Prayagraj (Allahabad). The Mahi River is the only river in India that crosses the Tropic of Cancer twice. Originates in the Vindhya Mountains in Madhya Pradesh, flows through Madhya Pradesh, Rajasthan, and Gujarat, and drains into the Arabian Sea.", "source": null}, {"id": 129, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the origin of major Indian rivers: 1. The spout emerging from the mouth of a cow statue in the Mahadev Temple at Mahabaleshwar is considered the source of the Krishna River. 2. The Godavari River originates from Trimbakeshwar in the Nashik district of Maharashtra. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. Krishna is the second largest east flowing Peninsular river which rises near Mahabaleshwar in Sahyadri. Origin of rivers: Kaveri - originates at Talakaveri, which is located on the Brahmagiri range in the Kodagu (Coorg) district of Karnataka. Narmada - rises from Maikala range near Amarkantak in Madhya Pradesh.", "source": null}, {"id": 130, "topic": "Indian Drainage System", "question": "What is the salt measurement in hypersaline lagoons?", "options": {"a": "30 to 35", "b": "Less than 5", "c": "Less than 100", "d": "More than 100"}, "answer": "d", "explanation": "More than 100. Hypersaline lagoons are extreme environments with salt concentrations significantly higher than typical seawater. While normal ocean salinity is around 35 parts per thousand (3.5%), hypersaline lagoons can have salt concentrations exceeding 100 parts per thousand (10%). These environments are typically found in arid regions with high evaporation rates and limited water input, such as the Dead Sea.", "source": null}, {"id": 131, "topic": "Indian Drainage System", "question": "In which state of India is kund or Tanka used for water harvesting ?", "options": {"a": "Rajasthan", "b": "Andhra Pradesh", "c": "Uttar Pradesh", "d": "Punjab"}, "answer": "a", "explanation": "Rajasthan. This region faces extreme arid conditions and low rainfall, so local communities have developed innovative systems to conserve and store water. Water harvesting structures in other States: Kere (large tanks) inF Karnataka, Cheruvu in Andhra Pradesh, Bandharas and Tals in Maharashtra, Surangam in Kerala, Eris (tanks) in Tamil Nadu, Bhundis in Madhya Pradesh and Uttar Pradesh.", "source": null}, {"id": 132, "topic": "Indian Drainage System", "question": "Consider the following statements regarding continental shelves: 1. The Siberian shelf in the Arctic Ocean is the largest continental shelf in the world. 2. A continental shelf is the edge of a continent that lies under the ocean. Which of the statements given above is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. A continental shelf is the edge of a continent that lies under the ocean. Continents are the seven main divisions of land on Earth. A continental shelf extends from the coastline of a continent to a drop-off point called the shelf break. Example of a Continental Shelf Landform: Siberian Shelf, Arctic Ocean.", "source": null}, {"id": 133, "topic": "Indian Drainage System", "question": "Which of the following is the transboundary river between India and Pakistan?", "options": {"a": "Indus", "b": "Ravi", "c": "Beas", "d": "Jhelum"}, "answer": "b", "explanation": "Ravi. This river flows through north-western India and eastern Pakistan. It, along with the Beas and Sutlej rivers, was allocated to India under the Indus Water Treaty. Indus River: This river originates in western Tibet, passes through Kashmir, and flows into Pakistan before falling into the Arabian Sea. It, along with the Chenab and Jhelum rivers, was allocated to Pakistan under the Indus Water Treaty of 1960.", "source": null}, {"id": 134, "topic": "Indian Drainage System", "question": "In which state of India was the Neeru-Meeru programme introduced for construction of water harvesting structures?", "options": {"a": "Andhra Pradesh", "b": "Rajasthan", "c": "Uttar Pradesh", "d": "Punjab"}, "answer": "a", "explanation": "Andhra Pradesh. The Neeru-Meeru (Water and You) program was launched by the Water Conservation Mission (WCM), m on May 1, 2000. It was a Water conservation and poverty alleviation initiative.", "source": null}, {"id": 135, "topic": "Indian Drainage System", "question": "Ideentify a water-harvesting system found in Jaisalmer.", "options": {"a": "Guls", "b": "Johads", "c": "Khadins", "d": "Kuls Srol.135."}, "answer": "c", "explanation": "Khadins. ‘Rooftop rainwater harvesting’ was commonly practised to store drinking water, particularly in Rajasthan. In arid and semi-arid regions, agricultural fields were converted into rain fed storage structures that allowed the water to stand and moisten the soil like the ‘khadins’ in Jaisalmer and ‘Johads’ in other parts of Rajasthan. In hill and mountainous regions, people built diversion channels like the ‘guls’ or ‘kuls’ of the Western Himalayas for agriculture.", "source": null}, {"id": 136, "topic": "Indian Drainage System", "question": "Which of the following rivers marks the eastern-most boundary of the Himalayas ?", "options": {"a": "Kali", "b": "Teesta", "c": "Satluj", "d": "Brahmaputra"}, "answer": "d", "explanation": "Brahmaputra River flows through the northeastern part of India, originating from the Angsi Glacier in Tibet and passing through Arunachal Pradesh before entering Assam. The Teesta River rises in the Pauhunri Mountain of the eastern Himalayas and flows through the Indian states of Sikkim and West Bengal. The Satluj River originates in Raksas Tal near Mansarovar in Tibet. The Kali River flows through the Uttara Kannada district of Karnataka.", "source": null}, {"id": 137, "topic": "Indian Drainage System", "question": "Which of the following peninsular rivers falls into the Arabian Sea?", "options": {"a": "Mahanadi river", "b": "Krishna river", "c": "Sabarmati river", "d": "Godavari river"}, "answer": "c", "explanation": "Sabarmati river. It is one of the major west-flowing rivers in India. It originates from Aravalli hills. Mahanadi river: Origin - Sihawa (South of Amarkantak) near Raipur (Chhattisgarh). It flows through Chhattisgarh and Odisha and drains into the Bay of Bengal.", "source": null}, {"id": 138, "topic": "Indian Drainage System", "question": "Consider the following statements: 1. The Yamuna, Gandak, and Kosi are important tributaries of the river Ganga. 2. The Lohit River is not a tributary of the Ganga; rather, it is a tributary of the Brahmaputra. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The river Ganga emerges from Gangotri Glacier and ends at Bay of Bengal. Ganges is the longest river of India. It is 2,525 km long. Its tributaries include Yamuna, Gandak, Ramganga, Son, Ghaghra, Gomti, Kosi, Tamsa, Punpun, and Mahananda. Brahmaputra river originates under the name of Siang or Dihang, from the Chemayungdung glacier of the Kailash range near the Mansarovar lake. It enters India west of Sadiya town in Arunachal Pradesh. Tributaries: Dibang, Lohit, Siang, Burhi Dihing, Tista, and Dhansari.", "source": null}, {"id": 139, "topic": "Indian Drainage System", "question": "Which of the following are west flowing rivers?", "options": {"a": "Godavari and Mahanadi", "b": "Krishna and Kaveri", "c": "Ganga and Yamuna", "d": "Mahi and Sabarmati"}, "answer": "d", "explanation": "Mahi and Sabarmati. Mahi River originates from Vindhyachal Hills, Madhya Pradesh and meets in Bay of Khambhat. Major West-flowing rivers - Indus, Narmada, and Tapi. Major East-flowing rivers: Ganga, Brahmaaputra, Mahanadi, Krishna, and Godavari. Major peninsular rivers - Mahanadi, Godavari, Krishna, Kaveri, Narmada, and Tapti.", "source": null}, {"id": 140, "topic": "Indian Drainage System", "question": "Which of the following rivers is an east flowing river?", "options": {"a": "Mahi river", "b": "Narmada river", "c": "Godavari river", "d": "Tapi river"}, "answer": "c", "explanation": "Godavari river. It rises in the Nasik district of Maharashtra and discharges its water into the Bay of Bengal. It is 1,465 km long with a catchment area spreading over 3.13 lakh square kilometers. The Penganga, the Indravati, the Pranhita, and the Manjra are its principal tributaries. The Mahi (Origin, Northern slope of Vindhyas), Narmada (Origin, Amarkantak), and Tapi (Origin, Betul) rivers flow westward, draining into the Arabian Sea.", "source": null}, {"id": 141, "topic": "Indian Drainage System", "question": "Consider the following statements: 1. The confluence of the Bhagirathi and Alaknanda rivers is at Devaprayag. 2. The Mandakini river meets the Alaknanda at Karnaprayag. Which of the statements given above is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. The Five Prayags are sacred river confluences in Uttarakhand. At Devaprayag, the Bhagirathi and Alaknanda rivers meet. At Rudraprayag, the Mandakini and Alaknanda rivers converge. At Nandaprayag, the Nandakini joins the Alaknanda. At Karnaprayag, the Pindar meets the Alaknanda, and at Vishnuprayag, the Dhauliganga merges with the Alaknanda.", "source": null}, {"id": 142, "topic": "Indian Drainage System", "question": "Which state of India has the maximum number of large dams?", "options": {"a": "Maharashtra", "b": "Madhya Pradesh", "c": "Odisha", "d": "Rajasthan"}, "answer": "a", "explanation": "Maharashtra leads in large dams, followed by Madhya Pradesh and Gujarat. Major dams in Maharashtra include Jayakwadi, Koyna, and Radhanagari. India's first dam, Kallanai, was built over 2,000 years ago. Notable post-independence dams include Hirakud (1957), Gandhisagar (1960), Bhakra-Nangal (1963), and Nagarjuna Sagar (1967).", "source": null}, {"id": 143, "topic": "Indian Drainage System", "question": "In which group of states does the Luni River flow?", "options": {"a": "Bihar and West Bengal", "b": "Andhra Pradesh and Telangana", "c": "Rajasthan and Gujarat", "d": "Maharashtra and Karnataka"}, "answer": "c", "explanation": "Rajasthan and Gujarat. The Luni River begins near Pushkar valley in two branches called the Saraswati and the Sabarmati. These two branches merge at Govindgarh, and from there, the river flows out of the Aravalli as the Luni. It continues westward until Telwara, then turns southwest to join the Rann of Kutch (Gujarat).", "source": null}, {"id": 144, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the land of Sapta Sindhu mentioned in Vedic literature: 1. The Aryans lived in the land known as Sapta Sindhu, meaning the land of seven rivers. 2. The seven rivers included Indus, Sutlej (Sutudri), Ravi (Parusni), Chenab (Asikni), Jhelum (Vitasta), Beas (Vipas), and Saraswati. 3. The Shipra River, flowing through Ujjain in Madhya Pradesh, was also one of the rivers of Sapta Sindhu. Which of the above statements is/are incorrect?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "3 only", "d": "1, 2 and 3"}, "answer": "c", "explanation": "3 only. The Shipra (Kshipra), a 195 km tributary of the Chambal River in Madhya Pradesh, flows across the Malwa Plateau, passing through Ujjain, Ratlam, and Mandsaur before joining the Chambal. The Sapta Sindheu, mentioned in Vedic literature, refers to the \"Land of Seven Rivers\" in Punjab, home to early Aryan settlements.", "source": null}, {"id": 145, "topic": "Indian Drainage System", "question": "Wh ich of the following rivers originates from the Himalayas?", "options": {"a": "Goedavari", "b": "Tapi", "c": "Narmada", "d": "Ganga"}, "answer": "d", "explanation": "Ganga. Origin: Gangotri F glacier near Gaumukh (3,900 m) in the Uttarkashi district of Uttarakhand. Here, it is known as the Bhagirathi. It cuts through the Central and the Lesser Himalayas in narrow gorges. At Devprayag, the Bhagirathi meets the Alaknanda; hereafter, it is known as the Ganga (length 2,525 km). Other river origin: Godavari - Brahmagiri hills; Tapi - Satpura range; Narmada - Maikal ranges.", "source": null}, {"id": 146, "topic": "Indian Drainage System", "question": "Subansiri, Jia Bharali, Dhansiri and Puthimari are the major tributaries of which river?", "options": {"a": "Godavari", "b": "Mahanadi", "c": "Brahmaputra", "d": "Bhagirathi"}, "answer": "c", "explanation": "Brahmaputra. The principal tributaries of the rivers are as follows: Godavari: Pravara, Purna, Manjra, Penganga, Wardha, Wainganga, Pranhita (the combined flow of Wainganga, Penganga, and Wardha), Indravati, Maner, and Sabri. Mahanadi: Seonath, Hasdeo, Mand, and Ib join Mahanadi from the left, while Ong, Tel, and Jonk join from the right. Bhagirathi: Bhilangna River, Kedar Ganga, Jadh Ganga, etc.", "source": null}, {"id": 147, "topic": "Indian Drainage System", "question": "On which river in India was the Somasila Dam built?", "options": {"a": "Krishna river", "b": "Tapti river", "c": "Pennar river", "d": "Sabarmati river"}, "answer": "c", "explanation": "Pennar river. It originates in the Nandi Hills, Karnataka, and flows through Karnataka and Andhra Pradesh before emptying into the Bay of Bengal. The Somasila dam is situated in the Nellore district (Andhra Pradesh). Famous dams and the rivers they are built on: Koyna Dam (Koyna River), Idukki Dam (Periyar River).", "source": null}, {"id": 148, "topic": "Indian Drainage System", "question": "The largest inland salt lake ‘Sambhar’ is located in the ______of India.", "options": {"a": "north - east", "b": "north - west", "c": "south - west", "d": "south - east"}, "answer": "b", "explanation": "north - west. Sambhar Salt Lake (located in Rajasthan) spans 230 square kilometers. It is a significant depression in the Aravalli Range and is commonly referred to as the salt lake of Rajasthan. The lake receives water from six rivers: Mantha, Rupangarh, Khari, Khandela, Medtha and Samod.", "source": null}, {"id": 149, "topic": "Indian Drainage System", "question": "Which of the following rivers is called ‘Singi Khamban’ in Tibet?", "options": {"a": "Indus", "b": "Brahmaputra", "c": "Kosi", "d": "Sutlej"}, "answer": "a", "explanation": "Indus. It enters Pakistan near Chilas in the Dardistan region. Brahmaputra: Originates from the Chemayungdung glacier in the Kailash range and is known as Tsangpo in Tibet. Sutlej: Originates near Mansarovar in Tibet, where it is called Langchen Khambab. River Kosi: Originates near Mount Everest and is known as the sorrow of Bihar due to frequent flooding.", "source": null}, {"id": 150, "topic": "Indian Drainage System", "question": "Match the pair correctly: National Stretch Waterways a) NW-1 1. Kakinada - Puducherry b) NW-2 2. Kottapuram- Kallam c) NW-3 3. Allahabad - Haldia d) NW-5 4. Sadiya- Dhubri 5. Talcher - Dhamra", "options": {"a": "a-1, b-2, c-4, d-5", "b": "a-3, b-4, c-2, d-5", "c": "a-4, b-3, c-5, d- 1", "d": "a-2, b-5, c-3, d-1"}, "answer": "b", "explanation": "a-3, b-4, c-2, d-5. NW-1 is the longest waterway in India, stretching 1,620 kilometers from Haldia to Allahabad. NW-69 is the smallest (5 km) waterway in India. It is part of the Manimuthar River in Tamil Nadu.", "source": null}, {"id": 151, "topic": "Indian Drainage System", "question": "Consider the following statements regarding Chilika Lake: 1. Chilika Lake is located to the south of the Narmada delta. 2. It is Asia’s largest brackish water lagoon and India’s first Ramsar wetland site (1981). Which of the above statements is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. Chilika Lake is located to the south of the Mahanadi delta. Chilika Lake, Asia’s largest and the world’s second-largest lagoon, spans Puri, Khurda, and Ganjam districts in Odisha. Nalabana Island, a bird sanctuary, lies in the middle of Chilika Lake, while Satapada, where the lake meets the Bay of Bengal, is home to Irrawaddy dolphins.", "source": null}, {"id": 152, "topic": "Indian Drainage System", "question": "Delhi ridge is the water divide between which of the following rivers?", "options": {"a": "Ganges and Sind", "b": "Indus and Mahi", "c": "Ganges and Indus", "d": "Ganges and Yamuna"}, "answer": "c", "explanation": "Ganges and Indus. The uplift of the Potwar Plateau during the Pleistocene upheaval in the western Himalayas rises the Delhi ridge. The major water dividers of India: Vindya range: Divided the Ganga drainage basin and Narmada river valley. Satpuda range: Divided Narmada river and tapi river valley.", "source": null}, {"id": 153, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the canal systems and Doabs of Punjab: 1. The Bist Doab Canal Sys tem lies between the Sutlej and Beas rivers. 2. The Makhu Canal System, built in 1950, draws water from the Sutlej river. 3. Doab Bari lies between the Beas and Chenab rivers. Which of the statements given above is incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "1 and 3 only"}, "answer": "c", "explanation": "3 only. Punjab's Doab systems include: Doab Chaj (Chenab and Jhelum), Doab Rachna (Ravi and Chenab), Doab Bari (Beas and Ravi, also called Majha), and Suj Doab (Satluj and Yamuna, part of the Malwa region).", "source": null}, {"id": 154, "topic": "Indian Drainage System", "question": "Which of the following pairs of Indian rivers is west flowing?", "options": {"a": "Krishna and Kaveri", "b": "Mahanadi and Krishna", "c": "Narmada and Tapi", "d": "Mahanadi and Godavar"}, "answer": "c", "explanation": "Narmada and Tapi. Narmada River (Rewa River), the longest west-flowing river, originates from the Maikal ranges and flows through Gujarat, Madhya Pradesh, and Maharashtra. The Tapi River, the second-largest west flowing river, originates from Betul district in Madhya Pradesh and flows parallel to the Narmada. Other important west-flowing rivers include Periyar, Bharathappuzha, Netravati, Sharavathi, and Mandovi.", "source": null}, {"id": 155, "topic": "Indian Drainage System", "question": "Match the following dams with the rivers on which they are built. a. Hirakud Dam (i) Chambal river b. Nagarjuna Sagar Dam (ii) Narmada River c. Sardar Sarovar Dam (iii) Krishna River d. Tehri Dam (iv) Mahanadi river e. Rana Pratap Sagar (v) Bhagirathi river dam", "options": {"a": "a-iv, b-iii, c-ii, d-v, e-i", "b": "a-i, b-iii, c-ii, d-v, e-iv", "c": "a-iv, b-iii, c-ii, d-i, e-v", "d": "a-iii, b-iv, c-ii, d-v, e-i"}, "answer": "a", "explanation": "a-iv, b-iii, c-ii,e d-v, e-i. The Hirakud Dam, one of the longest in the world, is located m near Sambalpur District, Odisha. The Nagarjuna Sagar Dam, a masonry dam, spans the border between Andhra Pr adesh and Telangana. The Sardar Sarovar Dam, a concrete gravity dam, e is situated near Kevadiya in Gujarat's Narmada District. The Tehri Dram, a multi-purpose rock and earth-fill embankment dam, is in New Tehri, Uttarakhand. The Rana Pratap Sagar Dam, a gravity masonry dam, stands 53.8 meters high in Rawatbhata, Rajasthan.", "source": null}, {"id": 156, "topic": "Indian Drainage System", "question": "Which of the following rivers is joined by river Chambal from the south?", "options": {"a": "Kosi", "b": "Yamuna", "c": "Teesta", "d": "Ganga"}, "answer": "b", "explanation": "Yamuna. It rises from the Yamunotri Glacier in the Himalayas. It flows parallel to the Ganga and as a right the bank tributary meets the Ganga at Allahabad. Its biggest tributary is Chambal River on the right. Other important tributaries include the Hindon, Sarda, and Giri rivers on the right and Betwa and Sindh on the left.", "source": null}, {"id": 157, "topic": "Indian Drainage System", "question": "Choose the coasts that are running along the Arabian sea. A. Northern Circars, B Malabar, C. Konkan, D. Coromandel", "options": {"a": "Only A and C", "b": "A, B and C", "c": "B, C and D", "d": "Only B and C"}, "answer": "d", "explanation": "Only B and C. The western coast, between the Western Ghats and the Arabian Sea, is a narrow plain with three sections: Konkan (Mumbai to Goa) in the north, Kannad Plain in the center, and Malabar Coast in the south. On the Bay of Bengal side, the plains are wide and level, called the Northern Circar in the north and the Coromandel Coast in the south.", "source": null}, {"id": 158, "topic": "Indian Drainage System", "question": "Which river flows into the Wular lake in the north and then into Baramulla?", "options": {"a": "Beas", "b": "Sutlej", "c": "Jhelum", "d": "Ravi"}, "answer": "c", "explanation": "Jhelum River originates from a spring at Verinag in the southeastern part of the Kashmir Valley. It first flows northward into Wular Lake, located in the northwestern part of the valley. After leaving Wiular Lake, it changes direction, flowingi southwards. At Baramulla, the a river enters a gorge in the hills, carving a steep-sided narrow passage through the Pir Panjal Range below Baramulla. Eventually, it merges with the Chenab River at Trimmu.", "source": null}, {"id": 159, "topic": "Indian Drainage System", "question": "Which river originates from ‘Rakshastal north-western tip’ near Mansarovar ?", "options": {"a": "Sutlej River", "b": "Narmada River", "c": "Ravi River", "d": "Tapti River"}, "answer": "a", "explanation": "Sutlej River enters India through the Shipki La Pass in the Kinnaur district of Himachal Pradesh. It is an east bank tributary of the Indus River, meeting the Indus at Mithankot in Pakistan. Also known as Shatadru in ancient times, the Satluj is the only Indus tributary originating from Tibet. The Bhakra-Nangal Dam is built across the Satluj, and the Indira Gandhi Canal also draws water from it.", "source": null}, {"id": 160, "topic": "Indian Drainage System", "question": "Consider the following statements regarding drainage patterns in India: 1. Radial drainage pattern is formed when rivers discharge their waters into a central depression or lake, as in Loktak Lake (Manipur). 2. Centripetal drainage pattern is formed when rivers originate from a hill and flow in all directions, as in the case of Narmada. Which of the above statements are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The drainage system formed when rivers discharge their waters from all directions in a lake or depression, as in the case of Loktak Lake in Manipur, is called Centripetal. Radial drainage pattern: When the rivers originate from a hill and flow in all directions. Example - Narmada.", "source": null}, {"id": 161, "topic": "Indian Drainage System", "question": "In which of the following districts is Baira Siul Dam located ?", "options": {"a": "Bilaspur", "b": "Chamba", "c": "Kinnaur", "d": "Mandi"}, "answer": "b", "explanation": "Chamba. The Baira Siul hydroelectric plant is an operational hydroelectric power facility located in Chaurah, Himachal Pradesh. It is a type of Earthen / Gravity & Masonry dam. Length: 160m and Height: 53m. River: Baira + Bhaled + Siul / Ravi. Other dam of Himachal Pradesh and district: Pandoh Dam and Bassi Dam (Mandi), Kol Dam and Bhakra dam (Bilaspur), Karchham-Wangtoo Dam (Kinnaur), Chamera Dam (Chamba), Parbati Dam (mandi).", "source": null}, {"id": 162, "topic": "Indian Drainage System", "question": "Choose the correct statement about the peninsular rivers. A. The Narmada rises in the Malwa plateau. B. The Godavari rises from the slopes of the Western Ghats near Nashik. C. The Mahanadi rises in the highlands of Chhattisgarh. D. The Krishna rises from a spring near Mahabaleshwar.", "options": {"a": "Only A, B and C", "b": "Only A, C and D", "c": "A, B, C and D", "d": "Only B, C and D"}, "answer": "d", "explanation": "Only B, C and D. The Narmada River rises from the Amarkantak Plateau in Anuppur district in Madhya Pradesh. The PeninsularF drainage system: It is older than the Himalayan river. These rivers are characterised by fixed course, absence of meanders and non-perennial flow of water. Most of the major rivers (except Narmada and Tapi which flow east to west) flow from west to east. The Chambal, the Sind, the Betwa, the Ken, the Son, originating in the northern part of the Peninsula belong to the Ganga river system.", "source": null}, {"id": 163, "topic": "Indian Drainage System", "question": "Consider the following statements regarding India’s water treaties with its neighbours: 1. The Farakka Treaty (1996), signed with Bangladesh, relates to the sharing of Ganga waters. 2. The Mahakali Treaty (1996) was signed between India and Pakistan. Which of the above statements is incorrect?", "options": {"a": "1 only `", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. Farakka water -sharing treaty - It was signed by then PM H. D. Deve Gowda (India) and PM Sheikh Hasina Wajed (Bangladesh). India’s treaty with its Neighbours: Nepal Treaty Mahakali treaty (1996), and Pakistan Indus Waters Treaty (1960).", "source": null}, {"id": 164, "topic": "Indian Drainage System", "question": "Which of the following statements is NOT correct about River Ganga ?", "options": {"a": "River Ganga flows from the Himalayas all the way to the Bay of Bengal.", "b": "River Ganga in India is more than 2500 km long and is the most populated river basin in the world.", "c": "River Ganga and its river basin support lots of wonderful wildlife, particularly river dolphins, otters, freshwater turtles, and gharials.", "d": "The water level of River Ganga never depends on monsoon and climatic condition of the Himalaya."}, "answer": "d", "explanation": "The Ganga river depends on the rains brought by the southwesterly monsoon winds from July to October as well as on the flow from melting Himalayan snow. The Wildlife Institute of India conducted a survey e revealing that 49% of the Ganga River has high biodiversity. m", "source": null}, {"id": 165, "topic": "Indian Drainage System", "question": "In which district of Uttarakhand does the Ramganga river originate from the Doodhatoli ranges?", "options": {"a": "Alemora", "b": "Champawat", "c": "Chamoli", "d": "Pauri Garhwal"}, "answer": "d", "explanation": "Pauri Garhwal. The Ramganga is a smaller river that begins near Gairsain in the Garhwal mountains. It changes direction to the southwest after crossing the Shiwalik and enters the plains of Uttar Pradesh near Najibabad. It eventually joins the Ganga near Kannauj.", "source": null}, {"id": 166, "topic": "Indian Drainage System", "question": "Trishulganga is a stream of the river:", "options": {"a": "Godavari", "b": "Ghaghara", "c": "Beas", "d": "Gandak"}, "answer": "d", "explanation": "Gandak. It comprises two streams, namely Kaligandak and Trishulganga. It rises in the Nepal Himalayas between the Dhaulagiri and Mount Everest.", "source": null}, {"id": 167, "topic": "Indian Drainage System", "question": "The drainage basin of the Godavari river is present in which of the following states of India ?", "options": {"a": "Maharashtra, Andhra Pradesh, Kerala, Karnataka, and Tamil Nadu", "b": "Chhattisgarh, Maharashtra, Andhra Pradesh, Madhya Pradesh, Karnataka, and Odisha", "c": "Chhattisgarh, Andhra Pradesh, Kerala, Kamataka, and Tamil Nadu -", "d": "Chhattisgarh, Maharashtra, - Karnataka, Tamil Nadu, and Odisha"}, "answer": "b", "explanation": "Godavari River (Dakshin Ganga) - Second longest river in India after the Ganges River. Origin - Trimbakeshwar near Nashik in Maharashtra. It has the largest Peninsular River system and falls into the Bay of Bengal.", "source": null}, {"id": 168, "topic": "Indian Drainage System", "question": "Identify the dam that is located in South India.", "options": {"a": "Gandhi Sagar dam", "b": "Tilaiya dam", "c": "Mettur dam", "d": "Rihand dam"}, "answer": "c", "explanation": "Mettur dam: Built on Kaveri river and l ocated at Mettur, Salem District (Tamil Nadu). Gandhi Sagar dam - Built on Chambal River and located in the Mandsaur district (Madhya Pradesh). Tilaiya dam - Constructed by Damodar Valley Corporation across Barakar River, in Koderma district (Jharkhand).", "source": null}, {"id": 169, "topic": "Indian Drainage System", "question": "Which east-flowing river basin covers the states of Jharkhand, Chhattisgarh and Orissa and has a drainage area of 39,033 sq km ?", "options": {"a": "Sarada", "b": "Baitarani", "c": "Brahmani", "d": "Nagavali"}, "answer": "c", "explanation": "Brahmani river (second largest river in Odisha): It is formed by the confluence of the Shankh and Koel rivers, both join at Veda Vyasa near Rourkela (Odisha). Baitarani: It originates from Gonasika hills and drains into the Bay of Bengal. Nagavali (Langulya): It rises in the Eastern Ghats. Sarada: Originated from Kalapani in the Himalayas and flows along Nepal's western border with India and joins Ghaghra River.", "source": null}, {"id": 170, "topic": "Indian Drainage System", "question": "Which ports belong to the western coast of India ?", "options": {"a": "Kandla port, Mormugao port, Kochi port", "b": "Kandla port, Mormugao port, Chennai port", "c": "Kandla port, Mormugao port, Kolkata port", "d": "Kandla port, Haldia port, Kochi port"}, "answer": "a", "explanation": "Ports in India: West Coast - Mumbai, Jawaharlal Nehru (Maharashtra), New Mangalore (Karnataka). East Coast - V. O. Chidambaranar formerly Tuticorin, Ennore, Chennai Port (Tamil Nadu), Paradip (Orissa), Kolkata, Haldia (West Bengal), Port Blair, Haddo (Andaman and Nicobar Islands).", "source": null}, {"id": 171, "topic": "Indian Drainage System", "question": "Dihang and Lohit are rivers in which of the following regions?", "options": {"a": "Jammu and Kashmir", "b": "Sikkim and Manipur", "c": "Arunachal Pradesh and Assam", "d": "Punjab and Himachal"}, "answer": "c", "explanation": "Arunachal Pradesh and Assam. Dihang River - The Brahmaputra rises in Tibet, where it is known as Tsangpo and crosses over into India in Arunachal Pradesh under the name of Dihang. Lohit River - It originates in eastern Tibet, in the Zayal Chu range and surges through Arunachal Pradesh for 200 km, before emptying into the Brahmaputra river in the plains of Assam.", "source": null}, {"id": 172, "topic": "Indian Drainage System", "question": "Consider the following statements regarding major ports of India: 1. Kandla Port (Deendayal Port), located in the Gulf of Kutch (Gujarat), was developed in the 1950s after Independence to ease pressure on the Mumbai Port. 2. Visakhapatnam Port was developed after Independence to replace Karachi Port, which went to Pakistan during partition. Which of the above statements is incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. Visakhapatnam Port, also known as Vizag Port, is a major Indian port located on the east coast, in Andhra Pradesh. It's a natural harbor andF one of India's 12 major ports, serving as a key gateway for cargo an d trade, particularly for the eastern coast of India.", "source": null}, {"id": 173, "topic": "Indian Drainage System", "question": "Which river basin originates from the Western Ghats range of Karnataka state and has many tributaries such as the Noyyal, Kabini, Arkavathi and Amaravati?", "options": {"a": "Sabarmati", "b": "Brahmani", "c": "Kaveri", "d": "Periyar"}, "answer": "c", "explanation": "Kaveri river basin falls in 3 States (Tamil Nadu, Karnataka, Kerala) and a Union Territory (Puducherry). It originates in the foothills of Western Ghats at Talakaveri. Tributaries - Shimsha, Hemavati, Bhavani, Lokapavani.", "source": null}, {"id": 174, "topic": "Indian Drainage System", "question": "The Jog Falls, one of the highest waterfalls in India is the cataract of which river?", "options": {"a": "Narmada", "b": "Tungabhadra", "c": "Sharavati", "d": "Cauvery"}, "answer": "c", "explanation": "Sharavati - It originates at a place called Ambutheertha in the Thirthahalli taluk (Karnataka). Tungabhadra River is formed by the confluence of the Tunga River and the Bhadra River, The two rivers originate in Mudigere Taluk of Chikmagalur District (Karnataka).", "source": null}, {"id": 175, "topic": "Indian Drainage System", "question": "With a stretch of about 724 km, which river is one of the most important rivers of peninsular India ?", "options": {"a": "Tapi", "b": "Beas", "c": "Palar", "d": "Bhavani"}, "answer": "a", "explanation": "Tapi River - It flows through the states of Madhya Pradesh, Maharashtra, and Gujarat. The river originates in the Satpura Mountains in Madhya Pradesh and flows westwards before emptying into the Arabian Sea.", "source": null}, {"id": 176, "topic": "Indian Drainage System", "question": "Which river originates from the southern part of Devarayanadurga hill in Tumkur district, and flows for about 221 km before joining Kaveri?", "options": {"a": "Shimsha river", "b": "Girna river", "c": "Ghataprabha river", "d": "Waghur river"}, "answer": "a", "explanation": "Shimsha River (a tribButary of the river Kaveri). Shimsha has a waterfall at Shimshapura in Malavalli Taluk (Mandya district, Karnataka). Devarayanadurga is a small hill station located in the Indian state of Karnataka. Girna River - It originates near Kem Peak in western ghats of Maharashtra and is a tributary of Tapti river. Ghataprabha River - Right bank tributary of the Krishna River. Waghur River - It originates near Ajanta in trhe Aurangabad district of Maharashtra.", "source": null}, {"id": 177, "topic": "Indian Drainage System", "question": "Which of the following lakes is the longest in India?", "options": {"a": "Vembanad lake", "b": "Kanjia lake", "c": "Ansupa lake", "d": "Wular lake"}, "answer": "a", "explanation": "Vembanad lake (Kerala): Length 83.72 km and Width 14.48 km. It is connected to the Arabian Sea. The lake is known for its backwaters (a network of canals and waterways). Kanjia Lake - Odisha. Ansupa Lake - Odisha.", "source": null}, {"id": 178, "topic": "Indian Drainage System", "question": "Which river from the following flows through a rift valley?", "options": {"a": "Tapi", "b": "Brahmaputra", "c": "Sabarmati", "d": "Ganga"}, "answer": "a", "explanation": "Tapi. Rift valley: It is a lowland region that forms where Earth’s tectonic plates move apart. Famous rift valleys: Great Rift Valley (East Africa), East Rift Valley or Hualien - Taitung (Taiwan), Baikal Rift Valley (Southern Siberia).", "source": null}, {"id": 179, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the Beas River: 1. The Beas River, a tributary of the Indus, originates near the Rohtang Pass at an altitude of about 4,000 meters. 2. Its ancient name was Vipasha. Which of the above statement(s) is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. Tributaries of the Beas river: Parbati, Banganga, Tirthan, Suketi, Sainj, Gaj, Chakki and Uhaul.", "source": null}, {"id": 180, "topic": "Indian Drainage System", "question": "Which is the biggest tributary of the upper Brahmaputra that originates in the Tibetan Himalayas and winds its way into India through Arunachal Pradesh ?", "options": {"a": "Subansir", "b": "Yerla", "c": "Musi", "d": "Aner"}, "answer": "a", "explanation": "Subansiri. Tributaries of Brahmaputra River: Ronganadi, Dikrong, Buroi, Borgong, Jiabharali, Dhansiri (North), Puthimari, Manas, Beki, Sonkosh are the main tributaries on the North while the Noadehing, Buridehing, Desang, Dikhow, Bhogdoi, Dhansiri (South), Kopilli, Kulsi, Krishnai, Dhdhnoi, Jinjiran are the main tributaries on the South.", "source": null}, {"id": 181, "topic": "Indian Drainage System", "question": "Which of the following rivers originates near Sihawa in Raipur district of Chhattisgarh, flows through Odisha, and eventually empties into the Bay of Bengal ?", "options": {"a": "Mahanadi", "b": "Krishna", "c": "Godavari", "d": "Cauvery"}, "answer": "a", "explanation": "Mahanadi - The largest river of Odisha state. Krishna River originates near Mahabaleshwar in the Satara district of Maharashtra. It flows through Maharashtra, Karnataka, Telangana, and Andhra Pradesh before emptying into the Bay of Bengal.", "source": null}, {"id": 182, "topic": "Indian Drainage System", "question": "Assertion (A): Rajasthan is not a part of the Tapi River Basin. Reason (R): The Tapi River originates in the Satpura range (Betul district, Madhya Pradesh) and flows westward through Madhya Pradesh, Maharashtra, and Gujarat before draining into the Arabian Sea.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "a", "explanation": "Both A and R are true, and R is the correct explanation of A. Tapti River - A river in central India that flows westwards before draining into the Arabian Sea. Origin - In Satpura range in the Gawilgarh hills of the northern part of the Deccan Plateau (In Betul district, Madhya Pradesh). The Tapi river is known as the 'Gateway of International trade' as it conducts much international trade.", "source": null}, {"id": 183, "topic": "Indian Drainage System", "question": "Which of the following is not a freshwater lake in India?", "options": {"a": "Pulicat", "b": "Loktak", "c": "Bhimtal", "d": "Nainital"}, "answer": "a", "explanation": "Pulicat Lake (Andhra Pradesh) is the second largest brackish water lagoon in India, (after Chilika Lake, Odisha).", "source": null}, {"id": 184, "topic": "Indian Drainage System", "question": "Which state ranks first with a total length of 31.2 thousand km of rivers and canals, which is about 17% of the total length of rivers and canals in the country?", "options": {"a": "Kerala", "b": "West Bengal", "c": "Uttar Pradesh", "d": "Madhya Pradesh"}, "answer": "c", "explanation": "Uttar Pradesh - Fourth largest state according to area and 1st state in population. Longest canal in India - Indira Gandhi Canal, Longest river - Ganga River (2525 km), Origin Gangotri. Longest canal of Uttar Pradesh - Sharda Canal.", "source": null}, {"id": 185, "topic": "Indian Drainage System", "question": "Tila, Seti and Beri are the tributaries of:", "options": {"a": "Tamsa", "b": "Ghaghara", "c": "Mahi", "d": "Sabarmati"}, "answer": "b", "explanation": "Ghaghara. It originates in the glaciers of Mapchachungo and a major left - bank tributary of the Ganges River.F Its Tributaries: The left bank tributaries Bheri, Sarju, Kuwana, Rapti, Chhoti Gandak and the right bank tributaries Seti, Dahawar, Sarda, Budhi Ganga.", "source": null}, {"id": 186, "topic": "Indian Drainage System", "question": "What is the name of the branch of river Godavari that joins the Bay of Bengal flowing through the Yanam enclave of the union territory of Puducherry?", "options": {"a": "Kapila", "b": "Indravati", "c": "Gautami", "d": "Bhavani"}, "answer": "c", "explanation": "Gautami. The Godavari basin extends over states of Maharashtra, Andhra Pradesh, Chhattisgarh and Odisha in addition to smaller parts in Madhya Pradesh, Karnataka and Union territory of Puducherry. Projects Polavaram Irrigation Project, Kaleshwaram, Sadarmat Anicut, Inchampalli, Sriram Sagar.", "source": null}, {"id": 187, "topic": "Indian Drainage System", "question": "Consider the following statements regarding types of waterfalls: 1. A cataract is a waterfall with an enormous volume of water. 2. In a cascade waterfall, water descends vertically, losing all contact with the bedrock. 3. In a horsetail waterfall, water descends in distinctly separate flows. 4. In a punchbowl waterfall, water maintains continuous contact with the bedrock. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "3 and 4 only", "c": "1, 2 and 3 only", "d": "1, 2, 3 and 4"}, "answer": "a", "explanation": "1 only. Types of Waterfalls: Horsetail - Descending water maintains some contact with bedrock. Plunge Water descends vertically, losing contact with the bedrock surface. Block - Water descends from a relatively wide stream or river. Multi-step - A series of waterfalls one after another of roughly the same size each with its own sunken plunghe pool. Segmented - Distinctly separate flows of water form as it dBescends. Cascade - Water descends a series of rock steps. Punchbowl - Water descends - in a constricted form and then spreads out in a wider poo l.", "source": null}, {"id": 188, "topic": "Indian Drainage System", "question": "Which of the following rivers does NOT flow in Kerala State?", "options": {"a": "Bharatheapuzha", "b": "Periyar", "c": "Pamba", "d": "Penner"}, "answer": "d", "explanation": "Penner - It rises in Nandi Hrills in Chikballapur District of Karnataka and falls into the Bay of Bengal. Bharathapuzha (Ponnani) river is Kerala's - second longest West Flowing River, draining into the Arabian Sea. -", "source": null}, {"id": 189, "topic": "Indian Drainage System", "question": "A long, winding ridge of stratified sand and gravel is known as:", "options": {"a": "whorl", "b": "esker", "c": "lop", "d": "arch"}, "answer": "b", "explanation": "Esker. These are ridges made of sands and gravels, deposited by glacial meltwater flowing through tunnels within and underneath glaciers, or through meltwater channels on top of glaciers. Other depositional landforms: Drumlins are smooth oval shaped ridge -like features composed mainly of glacial till with some masses of gravel and sand. -", "source": null}, {"id": 190, "topic": "Indian Drainage System", "question": "Consider the following statements regarding dams in India: 1. Almatti Dam of Karnataka is built over the Krishna River. 2. Mullaperiyar Dam of Kerala is built over the Kaveri River. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Other dams on Krishna river - Achakdani (Maharashtra), Achler (Maharashtra). Mullaperiyar is on the Periyar River. River (Dams): Kaveri {Alalur (Karnataka), Amaravathi, (Tamil Nadu)}.", "source": null}, {"id": 191, "topic": "Indian Drainage System", "question": "Which of the following statements is correct regarding large dams? I. They have social problems because they displace a large number of peasants and tribals without adequate compensation or rehabilitation. - II. They have Environmental problems becausie they contribute enormously to i deforestation and the loss of a biological diversity.", "options": {"a": "Only l", "b": "Both l and Il", "c": "Only ll", "d": "Neither I nor Il"}, "answer": "b", "explanation": "Both I and II. Advantages of Dams - Irrigation, tourist attraction, flood control, hydro power generation, etc. Disadvantages of dams - High construction cost, unbalanced sedimentation, deforestation, ecological imbalance, endangered aquatic life etc.", "source": null}, {"id": 192, "topic": "Indian Drainage System", "question": "Consider the following statements regarding Indian rivers: 1. The Banas River originates from the Khamnor Hills of the Aravalli Range in Rajasthan and is a tributary of the Chambal River. 2. The Tapi River originates from the Satpura Range in Rajasthan. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Tapi originates from Satpura ranges in Madhya Pradesh. The Banas river originates from the Khamnor hills of the Aravali range. It is a tributary of the Chambal River. It is also known as “Van ki Asha”. Length of Banas: 512 km. Tributaries: Kothari, Dai, Dheel, Menali etc.", "source": null}, {"id": 193, "topic": "Indian Drainage System", "question": "Jabalpur is located on the banks of which of the following rivers?", "options": {"a": "Ganga", "b": "Godavari", "c": "Chambal", "d": "Narmada"}, "answer": "d", "explanation": "Narmada (Reva River, 1312 km): India’s 5th longest and largest west-flowing river, running through a rift valley between the Vindhya and Satpura ranges.", "source": null}, {"id": 194, "topic": "Indian Drainage System", "question": "Which of the following is not an important river of Malwa plateau?", "options": {"a": "Chambal river", "b": "Mahanadi river", "c": "Ken river", "d": "Betwa river"}, "answer": "b", "explanation": "Mahanadi. Rivers of Malwa plateau - Mahi River, Ken river, Shipra River, Chambal River, Betwa River.", "source": null}, {"id": 195, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the Ganga– Brahmaputra basin: 1. The region of the Ganga– Brahmaputra basin lies between 10°N to 30°N latitudes. 2. The Brahmaputra originates from Mount Kailash peak in Nepal. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor"}, "answer": "b", "explanation": "Only 2. The Brahmaputra originates in the north of the Himalayas near Mansarovar Lake in the Purang district of Tibet (Known as Yarlung Tsangpo in Tibet), (other names Siang/Dihang River) India, and Bangladesh (Jamuna River). The Delta formed by Ganga Brahmaputra Sunderban Delta (largest delta in the world).", "source": null}, {"id": 196, "topic": "Indian Drainage System", "question": "Kadana Dam of Gujarat is built over which of the following rivers?", "options": {"a": "Mahi", "b": "Manjira", "c": "Tapti", "d": "Sabarmati"}, "answer": "a", "explanation": "Mahi River. Indian Rivers and Dams: Sabarmati River - Dharoi Dam (Gujarat). Tapti River - Hatnur Dam (Maharashtra), Ukai Dam (Gujarat), GirnaF Dam (Maharashtra), Dahigam Weir (Maharashtra). Krishna River - Nagarjuna sagar Dam (Telangana). Manjira River Singur Dam and Nizam Sagar dam (Telangana). Banas River - Bisalpur Dam (Rajasthan).", "source": null}, {"id": 197, "topic": "Indian Drainage System", "question": "Which of the following rivers forms the Dhuandhar falls?", "options": {"a": "Tapi", "b": "Narmada", "c": "Godavari", "d": "Mahanadi"}, "answer": "b", "explanation": "Narmada. The Dhuandhar Falls is located in the Jabalpur district Madhya Pradesh.", "source": null}, {"id": 198, "topic": "Indian Drainage System", "question": "Which among the following lakes connects the twin cities of Hyderabad and Secunderabad?", "options": {"a": "Kanwar", "b": "Salim Ali", "c": "Hussain Sagar", "d": "Periyan"}, "answer": "c", "explanation": "Hussain Sagar: A heart shaped lake in Hyderabad, Telangana, built by Ibrahim Quli Qutb Shah; Fed by the River Musi. Salim Ali lake Aurangabad, Kanwar lake - Bihar, Periyar lake - Kerala.", "source": null}, {"id": 199, "topic": "Indian Drainage System", "question": "In which state of India is Tawa dam located?", "options": {"a": "Uttar Pradesh", "b": "Haryana", "c": "Rajasthan", "d": "Madhya Pradesh"}, "answer": "d", "explanation": "Madhya Pradesh - Indra Sagar dam, largest in state (Narmada river), Gandhisagar Dam (Chambal River), Bargi Dam (Narmada River). Uttar Pradesh - Rihand dam also known Govind Ballabh Pant Sagar. Haryana Kaushalya Dam (Yamuna River), Anangpur Dam (Hakra River). Gujarat Sardar Sarovar Dam (Narmada River). Rajasthan - Rana Pratap Sagar (Chambal river).", "source": null}, {"id": 200, "topic": "Indian Drainage System", "question": "Consider the following arrangements of rivers from North South in India: 1. Indus → Chenab → Ravi → Beas Satluj: 2. Satluj → Ravi → Indus → Chenab Beas 3. Indus → Ravi → Beas → Chenab is Satluj 4. Satluj → Indus → Chenab → Ravi Beas Which of the above arrangements correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Only 3", "d": "Only"}, "answer": "a", "explanation": "Only 1. Indus (Sindhu) river Sourcee (Lake Manasarovar), Satluj (Lake Rakshastal in Tibet), Ravi (Multhan tehsil orf Kangra district of Himachal Pradesh), Chenab (Baralacha Pass in Himachal Pradesh) etc.", "source": null}, {"id": 201, "topic": "Indian Drainage System", "question": "Which state in India is the source - of river Ghaggar?", "options": {"a": "Uttar Pradesh", "b": "Uttarakhand", "c": "Haryana", "d": "Himachal Pradesh"}, "answer": "d", "explanation": "Himachal Pradesh (Shivalik hills). It flows through Punjab, Haryana and then into Rajasthan. It flows only during the monsoon season. It is known as Hakra river in Pakistan. The main tributaries of the Ghaggar are the of Kaushalya river, Markanda, Sarsuti, Tangri and Chautang.", "source": null}, {"id": 202, "topic": "Indian Drainage System", "question": "India and Sri Lanka are joined by a group of islets forming ______.", "options": {"a": "Mahatma Gandhi Setu", "b": "Sisseri River Bridge", "c": "Bhupen Hazarika Bridge", "d": "Adam’s Bridge -"}, "answer": "d", "explanation": "Adam's Bridge (Rama Setu), is a chain of limestone shoals, between - Pamban Island (Rameswaram Island), Tamil Nadu, India, and Mannar Island, Sri Lanka. Mahatma Gandhi Setu (Bihar), Sisseri River Bridge (Arunachal Pradesh), Bhupen Hazarika bridge (Connects Assam and Arunachal Pradesh).", "source": null}, {"id": 203, "topic": "Indian Drainage System", "question": "Pushkar lake is situated in which district of Rajasthan?", "options": {"a": "Jaipur", "b": "Ajmer", "c": "Bikaner", "d": "Alwar"}, "answer": "b", "explanation": "Ajmer. Freshwater Lakes in Rajasthan: Ajmer - Ana Sagar Lake, Lake as Foy Sagar; Alwar - Siliserh Lake; - Banswara - Anand Sagar Lake and Dailab Lake; Bundi - Jait Sagar Lake, Kanak - Sagar Lake, and Nawar Sagar Lake; Dungarpur - Gaib Sagar Lake; Jaisalmer - Gadsisar Lake; Jodhpur - Balsamand Lake, Kailana Lake; Kota - Kishore Sagar Lake; Rajsamand - Rajsamand Lake; Udaipur - i Doodh Talai, Fateh Sagar Lake, to Jaisamiand Lake, Udai Sagar Lake, and a Pichola Lake. →", "source": null}, {"id": 204, "topic": "Indian Drainage System", "question": "What is the meaning of the term Moraine? →", "options": {"a": "Melting of accumulated snow", "b": "Material transported and deposited → by glacier", "c": "Valley with vertical sides and wide → floor", "d": "The higher level tributary is"}, "answer": "b", "explanation": "A moraine is material left behind by a moving glacier. This material is usually soil and rock. Moraines are - divided into four main categories: lateral moraines, medial moraines, supraglacial moraines, and terminal moraines.", "source": null}, {"id": 205, "topic": "Indian Drainage System", "question": "Which of the following ports is known as ‘Diamond Harbour’?", "options": {"a": "Port Blair", "b": "Kochi", "c": "Kolkata", "d": "Mangalore"}, "answer": "c", "explanation": "Kolkata Port (Haldia seaport) is the only riverine Major Port situated on the Hugli river in West Bengal. Cochin Port or Kochi port lies on two islands in the Vembanadu Lake; Willingdon Island and Vallarpadam and is important for the export of spices and salt.", "source": null}, {"id": 206, "topic": "Indian Drainage System", "question": "Consider the following statements about lakes of India: Statement I: Wular Lake in Jammu & Kashmir, one of Asia’s largest freshwater lakes, is of tectonic origin and is fed by the Jhelum River. Statement II: Dal Lake in Jammu & Kashmir is also of tectonic origin. Which of the above statements is/are correct?", "options": {"a": "Only II", "b": "Both I and II", "c": "Only I", "d": "Neither I nor II"}, "answer": "c", "explanation": "Only I. Wular Lake, located in Jammu and Kashmir, is South Asia’s largest freshwater lake. Formed by tectonic activity, it is fed by the Jhelum River and Madhumati stream. In 1990, it was designated a Ramsar Wetland of International Importance. Dal Lake, located in Srinagar, Jammu and Kashmir’s summer capital, is an urban lake and the union territory’s second largest. It is popularly known as the \"Lake of Flowers,\" \"Jewel in the Crown of Kashmir,\" or \"Srinagar’s Jewel.\"", "source": null}, {"id": 207, "topic": "Indian Drainage System", "question": "Tsomgo Lake is a glacial lake located in which of the following states?", "options": {"a": "Meghalaya", "b": "Punjab", "c": "Sikkim", "d": "Gujarat"}, "answer": "c", "explanation": "Sikkim. Tsongmo Lake (Changu Lake) remains frozen during the winter season. It is revered as a holy lake by the people of Sikkim.", "source": null}, {"id": 208, "topic": "Indian Drainage System", "question": "The Ganga plain extends between two rivers?", "options": {"a": "Yamuna and Teesta", "b": "Ghaggar and Teesta", "c": "Ghaggar and Bhagirathi", "d": "Ganga and Teesta"}, "answer": "b", "explanation": "Ghaggar and Teesta. Six Physiographic Divisions of India - 1. The Himalayan Mountains 2. The Northern Plains 3. The Peninsular Plateau 4. The Indian Desert 5. The Coastal Plains 6. The Islands. The Western part of the Northern Plain is referred to as the Punjab Plains. Brahmaputra plain lies in the state of Assam.", "source": null}, {"id": 209, "topic": "Indian Drainage System", "question": "Which river basin covers an areaF of 65,145 𝑘𝑚, of which about 80% lies in Maharashtra?", "options": {"a": "Krishna", "b": "Narmada", "c": "Godavari", "d": "Tapi"}, "answer": "d", "explanation": "Tapi Basin is situated in the northern part of the Deccan Plateau. Nearly 80% of the basin lies in the State of Maharashtra.", "source": null}, {"id": 210, "topic": "Indian Drainage System", "question": "Which state does the Brahmaputra river enter when it takes a U turn at Namcha Barwa?", "options": {"a": "Mizoram", "b": "Assam", "c": "Nagaland", "d": "Arunachal Pradesh"}, "answer": "d", "explanation": "Arunachal Pradesh. The catchment area of the Brahmaputra (Tsangpo) river falls in four countries (Tibet, Bhutan, India, and Bangladesh).", "source": null}, {"id": 211, "topic": "Indian Drainage System", "question": "Which river basin covers an area of 8,60,000 𝑘𝑚 and is spread across 11 Indian states?", "options": {"a": "Mahanadi basin", "b": "Ganga basin", "c": "Indus basin", "d": "Brahmaputra basin"}, "answer": "b", "explanation": "Ganga Basin - 11 States. Uttar Pradesh, Uttarakhand, Madhya Pradesh, Chhattisgarh, Bihar, Jharkhand, Rajasthan, West Bengal, Haryana, Himachal Pradesh and Delhi. Indus Basin - Himachal Pradesh, Punjab, Haryana, Rajasthan and Jammu & Kashmir. Brahmaputra Basin - Arunachal Pradesh, Assam, West Bengal, Meghalaya, Nagaland, Sikkim.", "source": null}, {"id": 212, "topic": "Indian Drainage System", "question": "Which river rises near Mhow in the Malwa plateau of Madhya Pradesh?", "options": {"a": "Chambal", "b": "Mahi", "c": "Varuna", "d": "Betwa"}, "answer": "a", "explanation": "Chambal. Varuna River (Tributary of Ganga River originates in Phulpur in the Prayagraj district). Betwa River (originates from Hoshangabad, Vindhya Range, Madhya Pradesh.", "source": null}, {"id": 213, "topic": "Indian Drainage System", "question": "In ancient times, which river was also known as 'Pooni' in Tamil which ihs the fourth largest river flowing in the southeast direction through the sBtates of Karnataka and Tamil Nadu ?", "options": {"a": "Kaveri River", "b": "Satluj River", "c": "Ravi River", "d": "Tapi River"}, "answer": "a", "explanation": "Kaveri River. It is a sacred river in southern India. It rises on Brahmagiri Hill of the Western Ghats in southwesteern Karnataka state and drains into the Bay of Bengal through Pond icherry.", "source": null}, {"id": 214, "topic": "Indian Drainage System", "question": "The Hundru Fall lies along the course of which of the following rivers?", "options": {"a": "Damodar", "b": "Sone", "c": "Mahanadi", "d": "Subarnarekha"}, "answer": "d", "explanation": "Subarnarekha. It is located in Ranchi District. Rajrappa waterfalls occur at the confluence of River Bhairavi and river Damodar.", "source": null}, {"id": 215, "topic": "Indian Drainage System", "question": "River Ken is one of the major rivers of the Bundelkhand region of central India and flows through two states, Madhya Pradesh and ______.", "options": {"a": "Gujarat", "b": "Maharashtra", "c": "Rajasthan", "d": "Uttar Pradesh"}, "answer": "d", "explanation": "Uttar Pradesh. River Ken It is a tributary of the Yamuna. The important tributaries of Ken - Alona, Bearma, Sonar, Mirhasan, Shyamari, Banne, Kutri, Urmil, Kail and Chandrawal.", "source": null}, {"id": 216, "topic": "Indian Drainage System", "question": "Which of the following rivers form Kunchikal waterfall in Karnataka?", "options": {"a": "Mandavi", "b": "Varahi", "c": "Urmodi", "d": "Kabini"}, "answer": "b", "explanation": "Varahi. Kunchikal Falls is located in Nidagodu village near Masthikatte in Shimoga district of state Karnataka. It cascades down rocky boulders and the total height of fall is 455 meters.", "source": null}, {"id": 217, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the Indus River: Statement I: The Indus was called Vitasta by the Iranians and Greeks about 2500 years ago. Statement II: The term Vipasa is the Sanskrit origin of the word \"Hindos\". Which of the statements given above is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. The river Indus was called Hindos by the Iranians and the Gireeks about 2500 years ago. The wiord is derived from the Sanskrit a word \"Sindhu'', which means \"river\".", "source": null}, {"id": 218, "topic": "Indian Drainage System", "question": "On which of the following rivers is Pakistan constructing a dam named Diamer Basha' dam?", "options": {"a": "Indus", "b": "Jhelum", "c": "Sutlej", "d": "Chenab"}, "answer": "a", "explanation": "Indus. It is located between Kohistan district in Khyber Pakhtunkhwa and Diamer district in Gilgit Baltistan, Pakistan administered Kashmir.", "source": null}, {"id": 219, "topic": "Indian Drainage System", "question": "Which of the following waterfalls is in the state of Goa?", "options": {"a": "Dudhsagar", "b": "Duduma", "c": "Gokak", "d": "Shivasamudram"}, "answer": "a", "explanation": "Dudhsagar Falls is a four-tiered waterfall on the Mandovi River. Duduma Falls lies on the border of Koraput (Odisha) and Visakhapatnam (Andhra Pradesh). Gokak Falls is on the Ghataprabha River in Belagavi, Karnataka. Shivasamudram Falls is located in Chamarajanagar and Mandya districts, Karnataka.", "source": null}, {"id": 220, "topic": "Indian Drainage System", "question": "Which of the following is the largest west flowing river in Rajasthan?", "options": {"a": "Luni", "b": "Chambal", "c": "Banganga", "d": "Banas"}, "answer": "a", "explanation": "Luni River originates in the Pushkar valley, Aravalli Range, flows through the Thar Desert, and ends in the Rann of Kutch, Gujarat.", "source": null}, {"id": 221, "topic": "Indian Drainage System", "question": "Which of the following states has the largest catchment area of Godavari Basin?", "options": {"a": "Karnataka", "b": "Maharashtra", "c": "Madhya Pradesh", "d": "Telangana"}, "answer": "b", "explanation": "Maharashtra. Banganga, Kadva, Shivana, Purna, Kadam, Pranahita, Indravati, Taliperu, Sabari, Nasardi, Pravara, Sindphana, Manjira, Manair, Kinnerasani are tributaries of Godavari river.", "source": null}, {"id": 222, "topic": "Indian Drainage System", "question": "Consider the following statements regarding the Muhuri River: Statement I: The Muhuri River is a transnational river between India and Bangladesh. Statement II: The Muhuri River originates in Tripura and later merges with the Feni River before draining into the Bay of Bengal. Which of the statements given above is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II.", "source": null}, {"id": 223, "topic": "Indian Drainage System", "question": "In which Indian state is the 'Bhushi Lake' located?", "options": {"a": "Punjab", "b": "Rajasthan", "c": "Gujarat", "d": "Maharashtra"}, "answer": "d", "explanation": "Maharashtra. Popular Lakes in Maharashtra - Upvan Lake, Vihar Lake, Powai Lake, Rankala Lake, Panshet Lake, Ganesh Lake, Venna Lake, Lonar Lake.", "source": null}, {"id": 224, "topic": "Indian Drainage System", "question": "Which Indian state is the source of the rivers Brahmani, Kharkai and Subarnarekha?", "options": {"a": "Madhya Pradesh", "b": "Bihar", "c": "Jharkhand", "d": "Uttar Pradesh"}, "answer": "c", "explanation": "Jharkhand. Other rivers in Jharkhand - Sone, Barakar, Damodar, Ajay, South Koel, Shankh, and North Koel river.", "source": null}, {"id": 225, "topic": "Indian Drainage System", "question": "Gurdwara Patalpuri Sahib is located on the bank of river ______.", "options": {"a": "Yamuna", "b": "Ganga", "c": "Sutlej", "d": "Beas"}, "answer": "c", "explanation": "Sutlej. Gurdwara Patalpuri Sahib located in Rupnagar district of Punjab. Guru Hargobind Ji in 1644 as well as Guru Har Rai Ji in 1661 were cremated here.", "source": null}, {"id": 226, "topic": "Indian Drainage System", "question": "Which of the following is a tributary of the river Brahmaputra that flows through Bhutan?", "options": {"a": "Wang Chhu River", "b": "Sittaung River", "c": "Ayeyarwady River", "d": "Chindwin River"}, "answer": "a", "explanation": "Wang Chhu River. Bhutan has four major rivers, named Drangme Chhu, Mo Chhu, Wang Chhu and Torsa Chhu. The Brahmaputra is one of the largest rivers of the Indian Subcontinent.", "source": null}, {"id": 227, "topic": "Indian Drainage System", "question": "In which of the following states is Anchar Lake located?", "options": {"a": "Jammu
