for every 6 km. Therefore, the river develops large meanders. Ambala is located on the water divide between the Indus and the Ganga river systems.", "source": null}, {"id": 593, "topic": "Physiographic Division of India", "question": "Which of the following factors are responsible for railways having not developed much in the north-eastern parts of India? 1. Highly dissected topography 2. Dense forests 3. Low population density 4. Heavy rainfall and frequent flooding", "options": {"a": "1, 2 and 3", "b": "Only 3 and 4", "c": "Only 2 and 3", "d": "1, 2 and 4"}, "answer": "d", "explanation": "1,2 and 4. The northeastern part of India is marked by the presence of big rivers, dissected relief, dense forests, frequent floods, landslides, international frontiers, etc. The first railway proposals for India were made in Madras in 1832. As a result, the country got its first train in the form of the Red Hill Railway which was built with the sole purpose of transporting granite for road-building in 1837.", "source": null}, {"id": 594, "topic": "Physiographic Division of India", "question": "Which of the following is a mountain pass in the Pir Panjal range at a maximum altitude of 2832 meters that connects the Kashmir Valley in the Union Territory of Jammu and Kashmir with the Outer Himalayas and the plains in the south?", "options": {"a": "Mana Pass", "b": "Banihal Pass", "c": "Bara-Lacha Pass", "d": "ZojiLa Pass"}, "answer": "b", "explanation": "Banihal pass (Jammu and Kashmir) is situated in the Pir - Panjal Range. It connects Banihal with Qazigund.i Mana Pass (Uttarakhand) is locatedi in the Greater Himalayas and a connects Tibet with Uttarakhand. Bara lacha pass - Connects Himachal Pradesh's Lahaul area with Ladakh. Zojila Pass connects Leh and Srinagar.", "source": null}, {"id": 595, "topic": "Physiographic Division of India", "question": "With reference to the major regions of the northern plains, Bhabar is:", "options": {"a": "the older alluvium along the river beds forming terraces higher than the floodplain", "b": "a narrow belt of about 8 to 16 km that runs in the west-east direction along the foot of the Himalayas from the river Indus to Teesta", "c": "composed of newer alluvium and forms flood plains along the river banks", "d": "a broad long zone of northern India and southern Nepal running parallel to the lower ranges of the Himalayas"}, "answer": "b", "explanation": "Bhabar is a narrow belt lying parallel to the slopes of the Shiwaliks in Uttarakhand. It is narrow in the east and wide in the western and northwestern hilly regions. It comprises gravel and un-assorted sediment deposits. Crop cultivation is not possible in this tract, only giant trees with deep roots grow.", "source": null}, {"id": 596, "topic": "Physiographic Division of India", "question": "In which of the following regions of India is the natural habitat of White-bellied Heron largely distributed?", "options": {"a": "North-east", "b": "Northern plains", "c": "Deccan plateau", "d": "Western coast"}, "answer": "a", "explanation": "North-east India, the easternmost region of the country, comprises eight states: Arunachal Pradesh, Assam, Manipur, Meghalaya, Mizoram, Nagaland, Tripura, and Sikkim.", "source": null}, {"id": 597, "topic": "Physiographic Division of India", "question": "Deserts, rain,forests, coral reefs, and mangroves are features of ________ diversity.", "options": {"a": "genetic", "b": "cultural", "c": "species", "d": "ecological"}, "answer": "d", "explanation": "Ecological diversity includes species diversity, genetic diversity, and ecosystem diversity. They are collectively considered biodiversity. It is the sum all kinds of animals and plants living this earth along with their habitat.", "source": null}, {"id": 598, "topic": "Physiographic Division of India", "question": "Consider the following statements: 1. Tawang is a tourism hotspot Arunachal Pradesh. 2. Kalimpong district belongs to Sikkim. 3. Alipurduar and Jalpaiguri are districts of West Bengal. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Only 3", "d": "2 and 3"}, "answer": "b", "explanation": "Only 2. Kalimpong is in West Bengal.", "source": null}, {"id": 599, "topic": "Physiographic Division of India", "question": "The archaeological site Atranjikhera is located in _______.", "options": {"a": "Himachal Pradesh", "b": "Uttarakhand", "c": "Uttar Pradesh", "d": "Maharashtra"}, "answer": "c", "explanation": "Uttar Pradesh. This site was first identified by Sir Alexander Cunningham in 1862 but excavated by C Gaur in 1962.", "source": null}, {"id": 600, "topic": "Physiographic Division of India", "question": "In the state of ______, the general direction of the Himalayas is from southwest to northeast.", "options": {"a": "Manipur", "b": "Nagaland", "c": "Mizoram", "d": "Arunachal Pradesh"}, "answer": "d", "explanation": "Arunachal Pradesh. Himalayas in the Darjeeling and Sikkim regions lie in an east-west direction.", "source": null}, {"id": 601, "topic": "Physiographic Division of India", "question": "Which of the following mountain is situated in the state of Uttarakhand?", "options": {"a": "Nathu La Pass", "b": "Baralacha La Pass", "c": "Bomdi La Pass", "d": "Mangsha Dhura Pass"}, "answer": "d", "explanation": "Mangsha Dhura Pass. Other passes in Uttarakhand: Kalindi Pass, Lipulekh Pass, Mana Pass, Auden's Col, Muling La, Nama Pass, Niti Pass, Traill's Pass.", "source": null}, {"id": 602, "topic": "Physiographic Division of India", "question": "Which among the following states does NOT share its border with Odisha?", "options": {"a": "Chhattisgarh", "b": "Jharkhand", "c": "Bihar", "d": "West Bengal"}, "answer": "c", "explanation": "Bihar. Odisha is surrounded by 4 states: Andhra Pradesh from the south, Chhattisgarh from the west and Jharkhand and West Bengal from the north.", "source": null}, {"id": 603, "topic": "Physiographic Division of India", "question": "River Sutlej enters India through which pass?", "options": {"a": "Shipki la", "b": "Lipulekh", "c": "Zoji la", "d": "Nathula of"}, "answer": "a", "explanation": "Shipki La - From here, Satluj on traverses through many Himalayan valleys before it merges with Chenab in Pakistan before landing into Indus. in", "source": null}, {"id": 604, "topic": "Physiographic Division of India", "question": "Which among the following is western coast island?", "options": {"a": "Pamban", "b": "Elephanta", "c": "Parikud", "d": "Sriharikota"}, "answer": "b", "explanation": "Elephanta island is located in Mumbai Harbour of the Arabian Sea. Pamban (between peninsular India and Sri Lanka), Parikud (Odisha), and Sriharikota (Andhra Pradesh). Transportation of", "source": null}, {"id": 605, "topic": "Transportation", "question": "Name the Indian port that is the largest exporter of iron ore ? B", "options": {"a": "Paradip Port e", "b": "Chennai Port", "c": "Visakhapatnamm Port R", "d": "Marmagao Port"}, "answer": "d", "explanation": "Marmagao Port, Goa, is one of the oldest major ports on the west coast of India. It is the largest exporter of iron ore in the country, handling s ubstantial portion of India’s iron ore exports due to its proximity to Goa’s iron F ore mining belt. Other ports: Paradip Port (Odisha): Major port for coal, iron ore, and crude oil but not the largest in iron ore exports. Chennai Port (Tamil Nadu): Handles containers, cars, and general cargo, not primarily iron ore. Visakhapatnam Port (Andhra Pradesh): Handles iron ore and coal, but Marmagao surpasses it in ore exports.", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 606, "topic": "Transportation", "question": "Which of the below statements is/are correct? Statement 1: India supports connectivity through the North-South Transport Corridor. Statement 2: The corridor strengthens India's trade with the Pacific Islands.", "options": {"a": "Only Statement 2 is correct", "b": "Only Statement 1 is correct", "c": "Both 1 and 2 are correct", "d": "Neither 1 nor 2 is correct"}, "answer": "b", "explanation": "India supports connectivity through the International North-South Transport Corridor (INSTC), which is a multi-modal network of ship, rail, and road routes aimed at connecting India with Central Asia, Russia, and Europe via Iran. This strategic corridor is designed to reduce transit time and cost in moving goods between India and Eurasia. However, Statement 2 is incorrect because the corridor has no direct relevance to India’s trade with the Pacific Islands, which are geographically distant and lie in a completely different direction. a", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 607, "topic": "Transportation", "question": "What is the primary mission behind India's involvement in the International North-South Transport Corridor (INSTC)?", "options": {"a": "To promote clean maritime security", "b": "To bypass China's CPEC route via Taiwan", "c": "To improve connectivity with Eurasia via multimodal routes a", "d": "To facilitate transit trade through the Arctic"}, "answer": "c", "explanation": "The INSTC (International North-South Transport Corridor) is a multi-modal (ship–rail–road) transport network covering about 7,200 km. It connects India → Iran → Russia → Central Asia → Europe. Main goals: Provide India with a shorter, cheaper trade route to Eurasia compared to the Suez Canal route. Strengthen India’s presence in Central Asia and Russia while bypassing Pakistan. Enhance trade and energy connectivity with Eurasia through integrated logistics.", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 608, "topic": "Transportation", "question": "What is the length of the Indian Railways network, according to the Railway Yearbook 2019-20 ?", "options": {"a": "67,956 km", "b": "1,604 km", "c": "63,950 km", "d": "2,402 km"}, "answer": "a", "explanation": "67,956 km. The length of the Indian Railways network, according to the Railway Yearbook 2019-20: Broad gauge - The distance between the rails is 1.676 meters, with a total length of 63,950 km. Metre gauge - The distance between the rails is 1 meter, with a total length of 2,402 km. Narrow gauge - The distance between the rails is either 0.762 meters or 0.610 meters, with a total length of 1,604 km.", "source": null}, {"id": 609, "topic": "Transportation", "question": "According to the Indian Railways (2019-2020), which state has the largest railway track in India?", "options": {"a": "Punjab", "b": "Haryana", "c": "Madhya Pradesh", "d": "Uttar Pradesh"}, "answer": "d", "explanation": "Uttar Pradesh. The longest railway track in India is the Dibrugarh-Kanyakumari Vivek Express (approx 4200 km), running from Dibrugarh in Assam to Kanyakumari in Tamil Nadu. The shortest railway line is the 3-kilometer route between Nagpur and Ajni in Maharashtra. The five states with the largest route kilometers are Uttar Pradesh, Rajasthan, Maharashtra, Gujarat, and Andhra Pradesh.", "source": null}, {"id": 610, "topic": "Transportation", "question": "In which of the following states is the development of rail transport less, due to its geographical conditions?", "options": {"a": "Sikkim", "b": "Haryana", "c": "Bihar", "d": "Uttar Pradesh"}, "answer": "a", "explanation": "Sikkim is predominantly mountainous, characterized by steep slopes and rugged terrain, which complicates the construction of rail infrastructure.", "source": null}, {"id": 611, "topic": "Transportation", "question": "Through which routes is the majority of India’s international trade carried out?", "options": {"a": "Railway and air", "b": "Sea and air", "c": "Only Railway", "d": "Sea and railway"}, "answer": "b", "explanation": "Sea and air. India has a coastline of approximately 7,516.6 km, making maritime transport essential for international trade. According to the Ministry of Shipping, about 95% of India's trade by volume and 70% by value is conducted via sea routes. A smaller portion of trade occurs through land routes to neighboring countries, including Nepal, Bhutan, Bangladesh, and Pakistan.", "source": null}, {"id": 612, "topic": "Transportation", "question": "According to the Ministry of Road Transport and Highways’ annual report (2020-2021), which position does India have in terms of road networks in the world?", "options": {"a": "First", "b": "Second", "c": "Fourth", "d": "Third"}, "answer": "b", "explanation": "Second. India has the second largest road network in the world after the USA. India’s road network stands at over 63,71,847 km. This comprises National Highways, Expressways, State Highways, Major District Roads, other District Roads and Village Roads (Ministry of Road Transport & Highways Annual Report FY 2021-22).", "source": null}, {"id": 613, "topic": "Transportation", "question": "As of Financial year 2019, which of the following states has the highest road density in India?", "options": {"a": "Haryana", "b": "Tamil Nadu", "c": "Kerala", "d": "Punjab"}, "answer": "c", "explanation": "Kerala. As of the financial year 2019, Kerala had the highest road density among states, with 6.7 thousand kilometers of roads per one thousand square kilometers. Among union territories, Chandigarh had the highest road density in India, with over 22.6 thousand kilometers per one thousand square kilometers. Road density refers to the total length of all roads in a country, including highways, national roads, and city or rural roads, compared to the country's land area.", "source": null}, {"id": 614, "topic": "Transportation", "question": "Consider the following statements: I. The delta channels of Mahanadi and Brahmani rivers along with the East Coast Canal are connected by National Waterway-5. II. National Waterway-3 connects Prayagraj in Uttar Pradesh to Haldia in West Bengal through the Ganga-Bhagirathi-Hooghly system. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II h"}, "answer": "a", "explanation": "Only I. NW 5 connects the states of Odisha and West Bengal, stretching 623 km in total, with 91 km in West Bengal and 532 kme in Odisha. National Waterway-1 (NW-1) spans the Ganga-Bhagirathmi-Hooghly river system from Prayagraj, Uttar Pradesh, to Haldia, West Bengal. National Waterway-3, also known as tehe West Coast Canal, is a 168 km route in Kerala from Kollam to Kottaepuram.", "source": null}, {"id": 615, "topic": "Transportation", "question": "About what percentage of passenger traffic is carried by roads in India?", "options": {"a": "77%", "b": "87%", "c": "57%", "d": "67%"}, "answer": "b", "explanation": "87%. The Road Transport Sector handles about 60% of freight traffic in India. For passenger traffic, roads account for 87%, railways for 12%, and both air and waterways contribute approximately 0.5% each, as per the Ministry of Road Transport and Highways.", "source": null}, {"id": 616, "topic": "Transportation", "question": "Which of the following is an example of an eastern coast port?", "options": {"a": "Mumbai Port", "b": "Chennai Port", "c": "Mormugao Port", "d": "New Mangalore Port"}, "answer": "b", "explanation": "Chennai Port started its commercial operations in 1881. The major ports on the eastern coast Tuticorin - Tamil Nadu, Ennore - Tamil Nadu, Chennai - Tamil Nadu, Haldia and Kolkata - West Bengal, Paradip - Odisha, Visakhapatnam - Andhra Pradesh, Port Blair - Andaman and Nicobar Islands.", "source": null}, {"id": 617, "topic": "Transportation", "question": "Which of the following ports was developed as a Satellite port to relieve the pressure at the Mumbai port?", "options": {"a": "New Mangalore Port", "b": "Marmagao Port", "c": "Deendayal Port Authority", "d": "Jawaharlal Nehru Port"}, "answer": "d", "explanation": "Jawaharlal Nehru Port (Nhava Sheva), established on 26 May 1989, is India's second-largest container port, following Mundra Port. New Mangalore Port, in Karnataka, is operated by the New Mangalore Port Trust. Mormugao Port, commissioned in 1885, is located on Goa's western coast.", "source": null}, {"id": 618, "topic": "Transportation", "question": "In which year was the Konkan Railway constructed?", "options": {"a": "1998", "b": "1978", "c": "1988", "d": "2008 a"}, "answer": "a", "explanation": "1998. Indian Railways founded the Konkan Railway on 19th July 1990. Konkan Railways crosses 146 river streams, nearly 2000 bridges, and 91 tunnels. The states of Maharashtra, Goa, and Karnataka are partners in this undertaking.", "source": null}, {"id": 619, "topic": "Transportation", "question": "The Atal Tunnel has been built by Border Road Organisation at an altitude of 3000 metres. Which places are connected by this tunnel?", "options": {"a": "Manali to Shimla", "b": "Shimla to Srinagar", "c": "Shimla to Ladakh", "d": "Manali to Lahaul-Spiti"}, "answer": "d", "explanation": "Manali to Lahaul-Spiti. Atal Tunnel (also known as Rohtang Tunnel) is a highway tunnel built under the Rohtang Pass in the eastern Pir Panjal range of the Himalayas on the Leh- Manali Highway in Himachal Pradesh. It reduces the distance between Solang Valley and Sissu by approximately 46 km. Pir Panjal Railway Tunnel - India's longest transportation railway tunnel.", "source": null}, {"id": 620, "topic": "Transportation", "question": "Match the following ports with their related states correctly. Ports States 1. Mormugao port a. West Bengal 2. Paradip Port b. Odisha 3. Haldia Port c. Tamil Nadu 4. Tuticorin Port d. Goa", "options": {"a": "1-d, 2-b, 3-a, 4-c", "b": "1-a, 2-b, 3-d, 4-c", "c": "1-b, 2-d, 3-a, 4-c", "d": "1-b, 2-d, 3-c, 4-a:"}, "answer": "a", "explanation": "1-d, 2-b, 3-a, 4-c. Other major ports of India: Andhra Pradesh - Visakhapatnam Port. Tamil Nadu - Kamarajar Port, Chennai Port, Tuticorin Port.", "source": null}, {"id": 621, "topic": "Transportation", "question": "When was air transport nationalised in India?", "options": {"a": "1950", "b": "1952", "c": "1951", "d": "1953"}, "answer": "d", "explanation": "1953. The Air Corporations Act of 1953 led to the nationalization of Indian airlines and the formation of two corporations: Indian Airlines for domestic routes and Air India International for international routes.", "source": null}, {"id": 622, "topic": "Transportation", "question": "Match the railway zones in column A with their headquarters in column B. Column A Column B (Railway zones) (Headquarters) 1. Central a. New Delhi 2. Northern b. Mumbai CST 3. Eastern c. Chennai 4. Southern d. Kolkata", "options": {"a": "1-b, 2-d, 3-a, 4-c", "b": "1-a, 2-b, 3-d, 4-c", "c": "1-b, 2-a, 3-d, 4-c", "d": "1-b, 2-a, 3-c, 4-d"}, "answer": "c", "explanation": "1-b, 2-a, 3-d, 4-c.", "source": null}, {"id": 623, "topic": "Transportation", "question": "Consider the following statements: I. The Howrah Bridge was officially opened in 1943. II. It was renamed Rabindra Setu in 1965 in honour of Rabindranath Tagore. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. The Howrah Bridge is a balanced steel bridge over the Hooghly River in West Bengal, India. At the time it was built the name given to itF was the New Howrah Bridge. It was renamed Rabindra Setu in 1965 after the great Bengali poet Rabindranath Tagore. But it is still popularly known by the name Howrah Bridge.", "source": null}, {"id": 624, "topic": "Transportation", "question": "What is the total length of the Golden Quadrilateral, built by the National Highways Authority of India (NHAI)?", "options": {"a": "5978 km", "b": "4658 km", "c": "5790 km", "d": "5846 km"}, "answer": "d", "explanation": "5846 km. The Golden Quadrilateral is a major highway network connecting four megacities in India: Delhi, Kolkata, Chennai, and Mumbai. The routes are Delhi-Kolkata via NH-2, Mumbai-Delhi via NH-8, Mumbai-Chennai via NH-4, and Chennai-Kolkata via NH-5. The National Highways Authority of India, established in 1988, operates under the Ministry of Road Transport and Highways.", "source": null}, {"id": 625, "topic": "Transportation", "question": "Pipelines as a means of transport are looked after by the _________ of the Government of India.", "options": {"a": "Ministry of Petroleum and Natural Gas", "b": "Ministry of Home Affairs", "c": "Ministry of Railways", "d": "Ministry of Road Transport and Highways"}, "answer": "a", "explanation": "Ministry of Petroleum and Natural Gas. Some major pipelines in India: Hazira - Bijaypur - Jagdishpur Pipeline - India's longest gas pipeline, which runs from Gujarat to Uttar Pradesh. Jamnagar-Loni LPG Pipeline - It transports LPG from Jamnagar to Loni near Delhi. Naharkatia-Nunmati-Barauni Pipeline - India's first crude oil pipeline, which runs from Assam to the Barauni refinery.", "source": null}, {"id": 626, "topic": "Transportation", "question": "As of 2022, which of the following is the longest national waterway in India?", "options": {"a": "Allahabad-Haldia stretch", "b": "Sadiya-Dhubri stretch", "c": "Godavari-Krishna stretch h", "d": "Kottapuram-Kollam stretch"}, "answer": "a", "explanation": "Allahabad-Haldia stretch (1,620 km). It is divided into three parts for developmental pureposes - (i) Haldia-Farakka (560 km), (ii) Farakka -Patna (460 kmm), (iii) Patna Allahabad (600 km). National Waterways (NW) of India: NW 2 - Sadiya-Dhubri stretch (891 km). NW 3e - Kottapuram-Kollam stretch (205 km). NW 4 - Specific stretches of Godaevari and Krishna rivers along with Kakinada-Puducherry stretch of canals (r1078 km). NW 5 - Specified stretches of river Brahmani along with Matai river, delta channels of Mahanadi and Brahmani rivers and East Coast canals (588 km).", "source": null}, {"id": 627, "topic": "Transportation", "question": "How many major ports are there in India for maritime transportation?", "options": {"a": "21", "b": "15", "c": "18", "d": "13"}, "answer": "d", "explanation": "13. Ports and State: Chennai Port (Tamil Nadu), Ennore Port (Tamil Nadu), Shyama Prasad Mukherji Port (West Bengal), Deendayal Port (Gujarat), Kochi Port (Kerala), Port Blair (Andaman and Nicobar Islands), New Mangalore Port (Karnataka), Mormugao (Goa), Mumbai Port (Maharashtra), Paradip Port (Odisha), Tuticorin Port (Tamil Nadu).", "source": null}, {"id": 628, "topic": "Transportation", "question": "The historical Sher Shah Suri Marg is called the National Highway no. _________ between Delhi and Amritsar.", "options": {"a": "9", "b": "3", "c": "1", "d": "7"}, "answer": "c", "explanation": "1. Sher Shah Suri built the Shahi (Royal) Road to strengthen and consolidate his empire from the Indus Valley to Bengal's Sonar Valley. This road was renamed the Grand Trunk (GT) Road during British rule, connecting Kolkata and Peshawar. Currently, it extends from Amritsar to Kolkata and is divided into two segments: National Highway (NH)-1 from Delhi to Amritsar and NH-2 from Delhi to Kolkata.", "source": null}, {"id": 629, "topic": "Transportation", "question": "In which of the following years was the air transport in India launched?", "options": {"a": "1948", "b": "1932", "c": "1954", "d": "1911"}, "answer": "d", "explanation": "1911. Air Transportation: Air transport in India was launched between Allahabad and Naini (10 km). George Light started Air Transport in India. The first airmail flight was piloted by French pilot Henri Pequet. Air transport was nationalised and two Corporations, Air India Inteirnational and Indian Airlines were foirmed in 1953.", "source": null}, {"id": 630, "topic": "Transportation", "question": "In India, which of the following modes of transportation reduces trans-shipment losses and delays in supply of petroleum and gas?", "options": {"a": "Waterways", "b": "Railways", "c": "Pipeline", "d": "Roadways"}, "answer": "c", "explanation": "Pipelines are cost-effective and can transport large volumes of liquids or gasses over long distances with minimal environmental impact. Advantages - Dedicated Infrastructure, Minimized Handling, Continuous Flow, Cost-Effective, Environmental Benefits, Energy Efficiency, Reduces Congestion. Naharkatia-Noonmati -Barauni Pipeline is the first crude oil pipeline constructed in India. Jamnagar-Loni LPG Pipeline is India's longest pipeline.", "source": null}, {"id": 631, "topic": "Transportation", "question": "Which of the following is NOT a part of the six communication mail channels in India?", "options": {"a": "Metro channel", "b": "Monthly channel", "c": "Rajdhani channel", "d": "Business channel"}, "answer": "b", "explanation": "Monthly Channel. The six communication mail channels in India: Rajdhani (Yellow colored mailboxes are installed at post offices), Metro (Blue colored mailboxes are installed at post offices), Green (Green colored mailboxes are installed at post offices in large and metropolitan cities), Business (Physical mail that is commercial in nature), Periodical (Intended for newspapers, magazines, and other periodical publications) and Bulk (Consists of letters, newsletters, leaflets, and other similar products).", "source": null}, {"id": 632, "topic": "Transportation", "question": "Which of the following is NOT a characteristic of National Highways in India?", "options": {"a": "Meant for inter-state transport", "b": "Connect state capitals and major cities", "c": "Construction of border roads in high altitude areas", "d": "Maintained by the Central Government"}, "answer": "c", "explanation": "Border Roads Organisation (BRO): Functions under the control of the Ministry of Defence. Formation - 1960. Headquarters - Seema Sadak Bhawan (New Delhi). National Highways Authority of India - Formed under the NHAI (National Highways Authority of India Act) in 1988. Headquarters - New Delhi. It operates under the Ministry of Road Transport and Highways.", "source": null}, {"id": 633, "topic": "Transportation", "question": "Which project aims to develop state roads along coastal border areas, including connectivity of non-major ports?", "options": {"a": "Golden Quadrilateral", "b": "Setubharatam Pariyojana", "c": "District Headquarters Connectivity Scheme", "d": "Bharatmala"}, "answer": "d", "explanation": "Bharatmala. This centrally funded project is an ecosystem of road development which includes development of tunnels, bridges, elevated corridors, flyovers, overpasses, interchanges, bypasses, ring roads etc. Golden Quadrilateral - Highway network which links 4 largest metropolises: Delhi (north), Kolkata (east), Mumbai (west), and Chennai (south). Setu Bharatam - To make all National Highways free of railway level crossings.", "source": null}, {"id": 634, "topic": "Transportation", "question": "Consider the following statements: I. The Grand Trunk Road was built by Sher Shah Suri. II. It connects Amritsar and Kolkata in India. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Grand Trunk Road (built by Sher Shah Suri) - One of the oldest road routes in India. Length 2400 km. It links Central Asia to the Indian Subcontinent. The route was called Uttarapatha. NH-44 - India’s longest highway. NH-548 - India’s shortest highways.", "source": null}, {"id": 635, "topic": "Transportation", "question": "Which waterway provides connectivity with mainland India through the India - Bangladesh Protocol route?", "options": {"a": "NW-10", "b": "NW-15", "c": "NW-2", "d": "NW-83"}, "answer": "c", "explanation": "NW - 2 (891 Km) Between Sadiya and Dhubri on river Brahmaputra. Pandu port (Assam) is the largest river port in Assam. NW - 1 (1620 km): Ganga - Bhagirathi - Hooghly River (Allahabad Haldia). It is the longest and oldest National Waterways in India. NW-10: Amba River. NW-69: It is the smallest waterway (5 km).", "source": null}, {"id": 636, "topic": "Transportation", "question": "Asansol, Howrah, Malda and Sealdah division come under which railway zone of India?", "options": {"a": "West Central Railway", "b": "Northern Railway", "c": "Central Railway", "d": "Eastern Railway"}, "answer": "d", "explanation": "Eastern Railway. Formed on 14 April 1952 by amalgamating three lower divisions of the East Indian Railway: Howrah, Asansol and Danapur, the entire Bengal Nagpur Railway (BNR) and the Sealdah division of the erstwhile Bengal Assam Railway. Headquarters Kolkata. Kalka Mail of Eastern R ailway is the oldest running train in the history of Indian Railways. e", "source": null}, {"id": 637, "topic": "Transportation", "question": "Which amutonomous body was operationalised under the Ministry of Surface Transport in 1995 ?", "options": {"a": "Border Roads Organization (BRO)", "b": "Centre for Railway Information Syestem (CRIS)", "c": "Inland Waterways Authority of India r (IWAI)", "d": "National Highways Authority of India (NHAI)"}, "answer": "d", "explanation": "National Highways Authority of India (NHAI) - Operationalised in 1995 and established under the National Highways Authority of India Act, 1988. Headquarters - New Delhi. Other organizations:- Border Roads Organization (BRO) - Formed, 7 May 1960. Headquarters - New Delhi. Center for Railway Information System (CRIS) Founded, July 1986. Headquarters - New Delhi. Inland Waterways Authority of India (IWAI) - Founded, 27 October 1986 and headquartered - Noida (Uttar Pradesh). -", "source": null}, {"id": 638, "topic": "Transportation", "question": "Which of the following is the only rack railway in India that was declared UNESCO World Heritage Site in 2005?", "options": {"a": "Nilgiri Mountain Railway", "b": "Kangra Valley Railway", "c": "Matheran Hill Railway", "d": "Kalka–Shimla Railway"}, "answer": "a", "explanation": "Nilgiri Mountain Railway. Darjeeling Himalayan Railway (In UNESCO list in 1999), Kalka Shimla Railway (2008) and Chhatrapati Shivaji Terminus, Mumbai (2004). There are 43 World Heritage Sites in India. Out of these, 35 are cultural, seven are natural, - and one, Khangchendzonga National Park, is of mixed type (As of October 2024).", "source": null}, {"id": 639, "topic": "Transportation", "question": "Select the natural port of India from the following.", "options": {"a": "Mumbai Port", "b": "Chennai Port", "c": "Deendayal Port", "d": "Kolkata Port"}, "answer": "a", "explanation": "Mumbai Port - India’s largest natural port. Chennai Port (Madras Port) - It is a man-made, all-weather harbor with wet docks, the largest port in the Bay of Bengal. Deendayal Port (Kandla - Port) - Larigest port of India by volume of cargo i handled. Kolkata Port (Shyama a Prasad Mookerjee Port) - Oldest operating port in India, built by East India Company. -", "source": null}, {"id": 640, "topic": "Transportation", "question": "Match the National Waterways with their respective states: A. NW–97 → (i) West Bengal B. NW–98 → (ii) Punjab & Himachal Pradesh C. NW–93 → (iii) Meghalaya D. NW–99 → (iv) Tamil Nadu", "options": {"a": "A–i, B–ii, C–iii, D–iv", "b": "A–iii, B–iv, C–ii, D–i", "c": "A–ii, B–i, C–iv, D–iii", "d": "A–iv, B–iii, C–i, D–ii"}, "answer": "a", "explanation": "NW - 1 (Ganga - Bhagirathi - Hooghly): The longest waterways in India (Prayagraj to Haldia) - Uttar Pradesh, Bihar, Jharkhand & West Bengal. NW - 2 (Brahmaputra River) - Assam. NW - 3 (West Coast Canal and Champakara and Udyogamandal Canals) - Kerala. NW - 98 (Sutlej River) - Punjab and Himachal Pradesh. NW - 10 (Amba River) - Maharashtra. NW - 93 (Simsang River) - Meghalaya. NW - 83 (Rajpuri Creek) - Maharashtra. NW - 111 (Zuari River) - - Goa. NW - 73 (Narmada River) - Gujarat and Maharashtra. NW - 97 (Sundarbans Waterways) - West Bengal.", "source": null}, {"id": 641, "topic": "Transportation", "question": "In India, roads are classified in the _____ classes according to their capacity.", "options": {"a": "seven", "b": "four", "c": "three", "d": "six"}, "answer": "d", "explanation": "Six. Classification of Roads: Expressways, National highways, State highways, District roads, Rural roads, and Border roads or Project roads. NH-44 is the longest national highway in India with a length of 3745 Kilometers running from Srinagar in the north to Kanyakumari in the south.", "source": null}, {"id": 642, "topic": "Transportation", "question": "_______ is the deepest landlocked and well - protected port.", "options": {"a": "Kandla", "b": "Mumbai", "c": "Visakhapatnam", "d": "Paradip"}, "answer": "c", "explanation": "Visakhapatnam - It is a major port (total 13 in India) located in Andhra Pradesh coast of Bay of Bengal. It is natural harbor. The major commodities this port include Iron ore, manganese ore, steel products, general cargo, coal and crude oil.", "source": null}, {"id": 643, "topic": "Transportation", "question": "The Vadhavan Port is located _____.", "options": {"a": "Kerala", "b": "Tamil Nadu", "c": "West Bengal", "d": "Maharashtra"}, "answer": "d", "explanation": "Maharashtra. It will be India's 13th port. Other ports of India: Largest Port - Mumbai Port. Deepest Sea Port Gangavaram Port (Andhra Pradesh). Largest Artificial Port - Jawaharlal Nehru Port.", "source": null}, {"id": 644, "topic": "Transportation", "question": "Which among the following India's first corporatised port?", "options": {"a": "Kochi", "b": "Kandla", "c": "Mangalore", "d": "Ennore"}, "answer": "d", "explanation": "Ennore (Kamarajar port). Located - Coromandel Coast, Tamil Nadu. The Kochi International Container Transshipment Terminal (ICTT), locally known as the Vallarpadam Terminal, the first transshipment terminal in India and the first container terminal operate in a SEZ (Special Economic Zone).", "source": null}, {"id": 645, "topic": "Transportation", "question": "In Trans-Siberian railway systemF Vladivostoclies on_________coast.", "options": {"a": "Atlantic", "b": "Antarctic", "c": "Arctic", "d": "Pacific"}, "answer": "d", "explanation": "Pacific. Trans-Siberian Railway is the longest railway, connecting St. Petersburg to Vladivostok on the Pacific coast.", "source": null}, {"id": 646, "topic": "Transportation", "question": "The ancient port, Sopara located in which of the following states", "options": {"a": "Maharashtra", "b": "Kerala", "c": "Odisha", "d": "Tamil Nadu"}, "answer": "a", "explanation": "Maharashtra. The ancient port, Sopara (capital of the ancient Aparanta) - In ancient times, it was the largest township on India's west coast, trading with Mesopotamia, Egypt, Cochin, Arabia and Eastern Africa.", "source": null}, {"id": 647, "topic": "Transportation", "question": "National Highway No. 7 connects:", "options": {"a": "Fazilka to Mana", "b": "Kashmir to Kanyakumari", "c": "Varanasi to Kanyakumari", "d": "Kanpur to Silchar"}, "answer": "a", "explanation": "Fazilka to Mana. Fazilka (Punjab) - Rishikesh - Badrinath - Mana (Uttarakhand).", "source": null}, {"id": 648, "topic": "Transportation", "question": "Which of the following ancient ports was situated on the Malabar Coast? a", "options": {"a": "Barygaza", "b": "Muziris in", "c": "Tamralipti", "d": "Palur"}, "answer": "b", "explanation": "Muziris Port. It became popular when Babylonians, Assyrians, and Egyptians came to the Malabar in Coast in search of spices in 3000 BC.", "source": null}, {"id": 649, "topic": "Transportation", "question": "What is the approximate length of the navigable inland waterways of India?", "options": {"a": "14,500 km", "b": "15,600 km", "c": "16,400 km", "d": "12,800 km -"}, "answer": "a", "explanation": "14,500 km. To promote Inland Water Transport (IWT), 111 waterways (5 existing and 106 new) were declared National Waterways under the National Waterways Act, 2016, effectivhe is from 12th April 2016.", "source": null}, {"id": 650, "topic": "Transportation", "question": "What was National High way 66 (NH 66) previously known as?", "options": {"a": "NH2", "b": "NH8", "c": "NH5 e", "d": "NH 17"}, "answer": "d", "explanation": "NH 1m7. It connects Panvel in Maharashtra to Kanyakumari in Tamil Nadu state. is Population to e", "source": null}, {"id": 651, "topic": "Population", "question": "Which Indian state has the h ighest proportion of its workforce population engaged in agriculture ?", "options": {"a": "Rajasthan", "b": "Uttar Pradesh", "c": "Bihar", "d": "Punjab"}, "answer": "b", "explanation": "Uttar Pradesh has the highest proportion of its workforce engaged in agriculture, with nearly 70% of its population depending on farming and allied activities for livelihood. is Despite this, the state contributes ? relatively less to India’s overall agricultural output due to small landholdings, low mechanization, and dependence on monsoon rains. Other states like Bihar, Rajasthan and Punjab also have large agricultural bases, but in terms of percentage of workforce engaged, Uttar Pradesh has the highest proportion.", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 652, "topic": "Population", "question": "Which Union Territory has the highest population density as per Census 2011 ?", "options": {"a": "Chandigarh", "b": "Puducherry", "c": "Lakshadweep", "d": "Delhi"}, "answer": "d", "explanation": "Delhi. As per Census 2011, Delhi has the highest population density among Union Territories with 11,297 persons per sq.km. Other UTs: Chandigarh - 9,252, Puducherry - 2,598, Lakshadweep - 2,149 persons/sq. km. Highest population density state – Bihar (1,106 persons/sq. km). Lowest population density state - Arunachal Pradesh (17 persons/sq. km).", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 653, "topic": "Population", "question": "What is the term for the shift of workers from agriculture to industry and services ?", "options": {"a": "Industrialization", "b": "Urbanization", "c": "Occupational diversification", "d": "Economiic transition"}, "answer": "c", "explanation": "Occupational diversification. The shift of workers from the agriculture sector to industry and services is termed occupational diversification. It reflects structural changes in the economy as development takes place. In a developing economy, most of the workforce is initially engaged in agriculture. With industrialization and urbanization, workers gradually move to secondary (industry) and tertiary (services) sectors. This transition is also linked to economic development and is a sign of modernization. In India, despite progress, a significant proportion of the workforce is still dependent on agriculture, though the services sector contributes the highest share to GDP.", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 654, "topic": "Population", "question": "What shape does a population pyramid take for a rapidly growing population?", "options": {"a": "Inverted triangle shape", "b": "Circular shape", "c": "Triangular shape", "d": "Rectangular shape"}, "answer": "c", "explanation": "Triangular shape. A population pyramid for a rapidly growing population has a broad base and narrow top, forming a triangular shape. This indicates high birth rates, a large proportion of young people, and relatively fewer elderly individuals. Rectangular shape indicates a stable or slowly growing population where birth and death rates are low and the population is evenly distributed across age groups (seen in developed countries).", "source": "SSC Stenographer 6/08/2025 (Shift 2)"}, {"id": 655, "topic": "Population", "question": "Which of the following statements are correct? 1. Birth rate measures the number of children born per 1000 people annually. 2. Pull factors include opportunities that attract people to new regions. 3. Death rate is always higher than birth rate. 4. Push factors can include civil unrest and lack of jobs.", "options": {"a": "All of the above", "b": "2 and 3 only", "c": "1, 2, and 4 only", "d": "1 and 3 only"}, "answer": "c", "explanation": "1, 2, and 4 only. Birth rate is correctly defined as the number of live births per 1000 population in a year. Pull factors are positive conditions and opportunities, such as better jobs, education, or security, that attract people to a new location. Death rate is not always higher than birth rate; in fact, most countries experience higher birth rates, except in advanced economies with population decline. Push factors are negative conditions, such as poverty, unemployment, political instability, or civil unrest, that compel people to leave their home region.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 656, "topic": "Population", "question": "Which Indian Union Territory has the most Scheduled Castes?", "options": {"a": "Delhi", "b": "Chandigarh", "c": "Ladakh", "d": "Lakshadweep"}, "answer": "a", "explanation": "Delhi. As per the 2011 Census of India, among all Union Territories, Delhi has the highest Scheduled Caste (SC) population in absolute numbers. Scheduled Castes constitute about 16.75% of Delhi’s total population, which is the largest share compared to other Union T erritories. Chandigarh also has a significant SC population (around 18.9%), but in absolute numbers, Delhi far exceeds all others because of its large population base. Lakshadweep and Ladakh, being small in population, have negligible SC representation.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 657, "topic": "Population", "question": "Which of the following statements best explains why certain regions exhibit high population density ?", "options": {"a": "Regions offering fertile land, favorable climates, abundant natural resources, and robust economic opportunities are more likely to have high population densities.", "b": "High population density is predominantly found in areas with poor infrastructure and limited access to essential services.", "c": "Regions with limited natural resources tend to have Areas with scarce natural resources have higher population concentrations because of greater competition for few materials.", "d": "Areas characterized by mountainous terrain and arid climates often support dense populations because of their challenging living conditions."}, "answer": "a", "explanation": "Population density is strongly influenced by physical and economic factors. Fertile soil and favorable climate support agriculture, ensuring food security. Access to water bodies and natural resources sustains livelihoods. Economic opportunities and infrastructure in such regions attract migration. Hence, such areas develop into population-dense centers.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 658, "topic": "Population", "question": "Which of the following statements best captures the essence of Malthus' theory as outlined in the passage?", "options": {"a": "The natural imbalance between foodh supply and population growth leads to unavoidable hardships unle ss population is controlled.", "b": "Voluntary checks on population are more effective than natu ral calamities in curbing overpopulation.", "c": "Population gro ws in arithmetic progression, while food production grows geometrically.", "d": "Agriculteural production can grow faster than population with technological advancement. Srol.658."}, "answer": "a", "explanation": "The statement perfectly encapsulates the core argument of Thomas Malthus's theory on population. He posited that there is a fundamental tension between the rates of population growth and food production. Population, when unchecked, increases at a geometric rate (e.g., 2, 4, 8, 16), while the food supply increases at a much slower, arithmetic rate (e.g., 2, 3, 4, 5). This \"natural imbalance\" inevitably leads to a point where the population outstrips the available resources, resulting in \"unavoidable hardships\" like famine, disease, and war. These are what Malthus called \"positive checks.\" The only way to avoid this fate, he argued, is through \"preventive checks\"—conscious decisions to control the population, such as delaying marriage and practicing moral restraint.", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 659, "topic": "Population", "question": "Which of the following statements is/are true regarding India's rural and urban population trends from 1901 to 2011? 1. The rural population has consistently increased in absolute numbers. 2. The percentage share of rural population in total population has steadily declined. 3. Urban population first exceeded 100 million in 1981.", "options": {"a": "Only 1 and 2", "b": "All of the above", "c": "Only 1 and 3", "d": "Only 2 and 3"}, "answer": "a", "explanation": "Only 1 and 2. Despite rapid urbanization, India’s rural population kept increasing in absolute numbers in every census from 1901 to 2011. It rose from about 212 million in 1901 to over 833 million in 2011. However, the share of the rural population declined from 89% (1901) to 68.84% (2011). India’s urban population crossed 100 million in the 1971 Census, reaching about 109 million (10.78 croire), and further increased to aroundi 159 million in 1981.", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 660, "topic": "Population", "question": "Which of the following factors contributes to the low child sex ratio in some economically developed Northern states of India? 1. Increased accessibility to prenatal sex-determination methods 2. High levels of female literacy and empowerment 3. Societal preference for male children in inheritance and family support 4. Strengthened enforcement of gender- equal policies", "options": {"a": "2 and 3", "b": "2 and 4", "c": "1 and 3", "d": "1 and 4"}, "answer": "c", "explanation": "1 and 3. The low child sex ratio in some economically developed northern states of India can be attributed primarily to two key factors. Firstly, increased accessibility to prenatal sex-determination methods has led to the misuse of medical technology for sex-selective abortions, despite being legally prohibited. Secondly, a deep-rooted societal preference for male children, particularly due to traditional views on inheritance, family lineage, and support for aging parents, continues to influence family decisions.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 661, "topic": "Population", "question": "Read the following statements and choose the correct option: Statement 1: Karnataka has the highest elephant population among Southern States. Statement 2: A high number of juvenile elephant deaths in Karnataka are due to Elephant Endotheliotropic Herpesvirus (EEHV).", "options": {"a": "Only Statement 1 is correct", "b": "Only Statement 2 is correct", "c": "Both Statements 1 and 2 are correct", "d": "Neither Statement 1 nor 2 is correct"}, "answer": "c", "explanation": "Statement 1 is correct: Among the southern states, Karnataka has the highest elephant population, as per recent wildlife census data. Statement 2 is also correct: There has been a significant number of juvenile elephant deaths in Karnataka due to Elephant Endotheliotropic Herpesvirus (EEHV), a fatal disease affecting young elephants. Both statements are factually accurate.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 662, "topic": "Population", "question": "Which of the following states has the lowest population in India, according to the 2011 Census of India?", "options": {"a": "Maharashtra", "b": "Odisha", "c": "Punjab", "d": "Madhya Pradesh"}, "answer": "c", "explanation": "Punjab. According to Census 2011, Punjab’s population was about 2.77 crore, which is the lowest among the given options (Maharashtra - 11.24 cr, Madhya Pradesh - 7.26 cr, Odisha 4.19 cr). A Census is the process of collecting, analyzing, and publishing demographic, social, and economic data of a country’s population. In India, it is conducted every 10 years by the Registrar General & Census Commissioner (MHA). The first synchronous Census was held in 1881, and since then, it has been conducted regularly every decade till 2011. It is the largest administrative exercise in the world.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 663, "topic": "Population", "question": "Which of the following correctly matches the population growth phase in India with its key characteristics?", "options": {"a": "Phase IV (Post-1981) - Sudden increase in fertility rate due to migration", "b": "Phase III (1951-1981) - Population explosion caused by falling death rate and high fertility", "c": "Phase I (1901-1921) - Rapid population explosion due to low mortality and high fertility", "d": "Phase II (1921-1951) - High mortality rate and declining birth rate"}, "answer": "b", "explanation": "Phase III (1951-1981) Population explosion caused by falling death rate and high fertility. India’s population growth can be studied in four phases: Phase I (1901–1921) – Stagnant Growth / High Mortality. Characterized by very high birth and death rates, frequent famines and epidemics, resulting in almost stagnant growth. Phase II (1921–1951) – Steady Growth. After the \"Year of Great Divide\" (1921), mortality began to decline due to improved health facilities, but birth rates remained high, leading to gradual growth. Phase III (1951–1981) – Population Explosion. This period saw a sharp fall in death rates due to medical and technological advancements, while fertility remained high, leading to rapid population growth (population explosion). Phase IV (Post-1981 – Present) – Declining Growth Rate. Birth rates started declining significantly due to family planning, urbanization, education, and awareness. There was no sudden fertility rise due to migration.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 664, "topic": "Population", "question": "In each of the following questions, a statement labeled Assertion (A) is given, followed by a statement labeled Reason (R). Assertion (A): Migration can be driven by negative and positive circumstances. Reason (R): Push factors makhe individuals migrate away from a region, - whereas pull factors draw indiviBduals to a region.", "options": {"a": "A is false, but R is true.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "Both A and R are true, and R is the correct explanation of A.", "d": "A is true, but R is false."}, "answer": "c", "explanation": "Migration occurs due to a combination of negative pressures and attractive opportunities. Push factors like F poverty, unemployment, natural disasters, and political instability compel people to leave their place of origin. On the other hand, pull factors such as better employment, education, healthcare, and safety motivate them to move toward a new region. These contrasting influences explain why migration is driven by both negative and positive circumstances.", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 665, "topic": "Population", "question": "In each of the following questions, a statement labeled Assertion (A) is given, followed by a statement labeled Reason (R). Assertion (A): Migrants who enter a new country or region are called immigrants. - Reason (R): Emigrants are people who leave their country to settle elsewhere.", "options": {"a": "Both A and R are true, but R is not the correct explanation of A.", "b": "Both A and R are true, and R is the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "a", "explanation": "The terms immigrant and emigrant describe the same act of migration but from different perspectives. A person leaving one country becomes an emigrant there but simultaneously an immigrant in the destination country. This dual usage explains why both statements are true and interconnected.", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 666, "topic": "Population", "question": "Which state has the lowest population in India?", "options": {"a": "Manipur", "b": "Arunachal Pradesh", "c": "Sikkim", "d": "Mizoram"}, "answer": "c", "explanation": "Sikkim. Based on the 2011 Census of India, Sikkim has the smallest population among all Indian states, with 610,577 r esidents. Projections for 2025 also indicate that Sikkim will remain the least populous state. The Census 2011 was the 15th National Census of India, conducted in two phases – House Listing and Population Enumeration. It was carried out under the supervision of C. Chandramouli, the Registrar General and Census Commissioner of India.", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 667, "topic": "Population", "question": "According to Census 2011 which Indian State/UT has no Scheduled Tribe?", "options": {"a": "Kerala", "b": "Goa", "c": "Puducherry", "d": "Chhattisgarh"}, "answer": "c", "explanation": "Puducherry. Along with Puducherry, the states/UTs of Punjab, Haryana, Chandigarh, and Delhi also do not have any notified Scheduled Tribes. As per Census 2011, the lowest proportion of Scheduled Tribes was recorded in: Uttar Pradesh (0.6%), Tamil Nadu (1.1%), Bihar (1.3%), Kerala (1.5%), Uttarakhand (2.9%). The highest proportion of Scheduled Tribes was found in Mizoram. The Census of India is the most credible source of data on demography, literacy, education, economic activity, housing, urbanisation, fertility, mortality, etc. The 2011 Census was the 15th National Census, conducted with the slogan “Our Census, Our Future.”", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 668, "topic": "Population", "question": "Consider the following statements: I. Three phases are involved in the census operations in India II. The first phase of census operations is Houselisting/Housing Census. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "b", "explanation": "Only II. The Two phases are involved in the census operations in India. First - Houselisting/Housing Census under which details of all buildings, permanent or temporary, are noted with their type, amenities, and assets. Second - Population Enumeration where more detailed information on each individual residing in the country, Indian national or otherwise is noted. The first non-synchronous census was conducted in 1872 under Lord Mayo's administration, while the first synchronous census took place in 1881 under W.C. Plowden. The 16th Census (2021) was postponed due to the COVID-19 pandemic.", "source": null}, {"id": 669, "topic": "Population", "question": "Which of the following statements is/are correct according to the Census of India-2011? a. A person aged seven years or above, who can both read and write with understanding in any language, is treated as literate. b. A person who can only read but cannot write is not literate.", "options": {"a": "Both", "b": "and", "c": "are correct", "d": "Only"}, "answer": "b", "explanation": "is correct (c) Only (a) is correct (d) Neither (a) nor (b) is correct Sol.669.(a) According to the 2011 Census of India, the overall literacy rate is 74.04%, with the youth literacy rate being about 9% higher than the adult rate. The female literacy rate is 65.46%.", "source": null}, {"id": 670, "topic": "Population", "question": "As per Census 2011, which of the following states recorded negative growth in child sex ratio ?", "options": {"a": "Maharashtra", "b": "Himachal Pradesh", "c": "Punjab", "d": "Haryana"}, "answer": "a", "explanation": "Maharashtra recorded a significant decline in child sex ratio, from 913 girls per 1,000 boys in 2001 to 894 girls per 1,000 boys in 2011. According to the 2011 census, India's sex ratio was 943 females per 1,000 males, and the child sex ratio was 919 females per 1,000 males.", "source": null}, {"id": 671, "topic": "Population", "question": "When the analysis of population density is done by calculating it through net cultivated area, then the measure is termed as:", "options": {"a": "Agricultural density", "b": "Physiological density", "c": "Gross density", "d": "Net density"}, "answer": "b", "explanation": "Physiological density. Density of population is expressed as the number of persons per unit area. Physiological density = 𝑡𝑜𝑡𝑎𝑙 𝑝𝑜𝑝𝑢𝑙𝑎𝑡𝑖𝑜𝑛. Agricultural density 𝑛𝑒𝑡 𝑐𝑢𝑙𝑡𝑖𝑣𝑎𝑡𝑒𝑑 𝑎𝑟𝑒𝑎 is the number of farmers per unit of arable land. The agricultural population includes cultivators and agricultural labourers and their family members.", "source": null}, {"id": 672, "topic": "Population", "question": "According to Census of India 2011, in rural India, which state has the maximum female workforce participation rate?", "options": {"a": "Arunachal Pradesh", "b": "Uttar Pradesh", "c": "Himachal Pradesh", "d": "Andhra Pradesh"}, "answer": "c", "explanation": "Himachal Pradesh. As per Census 2011, the workforce participation rate for females is 25.51% against 53.26% for males. Rural sector has a better female workforce participation rate of 30.02% compared with 53.03% for males whereas for the urban sector. In Rural, Himachal Pradesh has the highest female workforce participation rate (47.4) whereas Tamil Nadu has ma x (21.8) among major states.", "source": null}, {"id": 673, "topic": "Population", "question": "As per the definition of CeBnsus of India, a ‘marginal worker’ is a person who works for: e", "options": {"a": "less than 183 days (or six months) in a year m", "b": "more than 183 days (or six months) in a year", "c": "eight months in a year", "d": "83 days in a year"}, "answer": "a", "explanation": "The population of India according to their economic status is divided into three groups, namely; main F workers, marginal workers and non-workers. A Main Worker is a person who works for at least 183 days (or six months) in a year. Marginal Worker is a person who works for less than 183 days (or six months) in a year. The proportion of workers (both main and marginal) is only 39.8 per cent (2011) leaving a vast majority of about 60 percent as non-workers.", "source": null}, {"id": 674, "topic": "Population", "question": "The Accelerated Female Literacy Programme was initiated in districts where the female literacy rate, based on the 2001 census, was _______.", "options": {"a": "below 35%", "b": "below 45%", "c": "below 30%", "d": "below 50%"}, "answer": "c", "explanation": "below 30%. According to the 2001 Census, 47 districts in India had a female literacy rate below 30%. Most of these districts were located in Bihar, Jharkhand, Uttar Pradesh, and Odisha. The Accelerated Female Literacy Programme aims to empower women by helping them develop literacy skills and gain access to information and services.", "source": null}, {"id": 675, "topic": "Population", "question": "According to Census of India 2011, what is the gap between male and female literacy rate in India?", "options": {"a": "21.59%", "b": "18.30%", "c": "24.84%", "d": "16.68%"}, "answer": "d", "explanation": "16.68%. According to the 2011 Census of India, the overall literacy rate was 74.04%. The literacy rate for males was 82.14%, while for females, it was 65.46%. Literacy rates for States and Union Territories (UTs): Kerala - 94% (highest among states), Bihar - 61.80% (lowest among states), Lakshadweep - 91.85% (highest among UTs), Dadra and Nagar Haveli - 76.24% (lowest among UTs), Mizoram - 91.33%, Goa - 88.70% and Delhi - 86.21%.", "source": null}, {"id": 676, "topic": "Population", "question": "i According to the Census of India a 2011, the percentage of adolescent population (10-19 years) from the total population is how much?", "options": {"a": "22.9%", "b": "21.9%", "c": "20.9%", "d": "19.9%"}, "answer": "c", "explanation": "20.9%. The population of the country as per the provisional figures of Census 2011 is 1210.19 million of which 623.72 million (51.54%) are males and 586.46 million (48.46%) are females. The proportion of Child Population in the age group of 0-6 years to total population is 13.1 percent. From 2001 to 2011, the population in the 0-6 age group registered minus 3.08 percent growth with minus 2.42 for males and minus 3.80 for females.", "source": null}, {"id": 677, "topic": "Population", "question": "According to the Census of India 2011, which group of Union Territories recorded the highest sex ratio?", "options": {"a": "Puducherry, Delhi, Andaman and Nicobar Islands", "b": "Puducherry, Lakshadweep, Andaman and Nicobar Islands", "c": "Chandigarh, Puducherry, Lakshadweep", "d": "Chandigarh, Puducherry, Delhi"}, "answer": "b", "explanation": "The sex ratio. In the union territories, the sex ratios were as follows: Puducherry (1,037), Lakshadweep (946), Andaman and Nicobar Islands (876). Among the states, the highest sex ratios were found in Kerala (1,084), Tamil Nadu (996), and Andhra Pradesh (993).", "source": null}, {"id": 678, "topic": "Population", "question": "Consider the following statements: I. As per Census 2011, Delhi has the highest slum population among Union Territories. II. Maharashtra has the highest slum population among Indian states. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Slum Population - Census 2011: India - 5.41%. Maharashtra (10.54%) has the highest slum population in India. The Dharavi slum in Mumbai is considered one of the most educated slums in India, with an estimated literacy rate of 69%.", "source": null}, {"id": 679, "topic": "Population", "question": "According to the Census of India 2011, ‘Other Religions and Persuasions (ORP)’ comprise how much of the population?", "options": {"a": "3.9 million", "b": "7.9 million", "c": "5.9 million", "d": "9.9 million"}, "answer": "b", "explanation": "7.9 million (0.7%). The total population in 2011 was 121.09 crores, with Hindus comprising 96.63 crores (79.8%), Muslims 17.22 crores (14.2%), Christians 2.78 crores (2.3%), Sikhs 2.08 crores (1.7%), Buddhists 0.84 crores (0.7%), Jains 0.45 crores (0.4%) and Religion Not Stated 0.29 crores (0.2%).", "source": null}, {"id": 680, "topic": "Population", "question": "According to Census 2011, which district displays the highest population?", "options": {"a": "Kollam", "b": "Ajmer", "c": "Thane", "d": "Pune"}, "answer": "c", "explanation": "Thane is a district located in the state of Maharashtra. It is often referred to as the \"City of Lakes\" due to its large number of water bodies.", "source": null}, {"id": 681, "topic": "Population", "question": "Who published the logistic equation model of population growth in 1838 ?", "options": {"a": "Howard Thomas Odum", "b": "Alfred Russel Wallace", "c": "Pierre François Verhulst", "d": "George Evelyn Hutchinson"}, "answer": "c", "explanation": "Pierre François Verhulst. He was a Belgian mathematician who earned a doctorate in number theory from the University of Ghent in 1825. He is renowned for the logistic growth model, which is widely applied in population growth modeling. This model, first proposed by Pierre-François Verhulst in 1838, states that the reproduction rate is proportional to both the existing population and the available resources, assuming all else is equal.", "source": null}, {"id": 682, "topic": "Population", "question": "According to the Census of India 2011, which group of Union Territories has the highest density of population?", "options": {"a": "Lakshadweep, Daman and Diu and Puducherry", "b": "Delhi, Chandigarh and Daman and Diu", "c": "Delhi, Chandigarh and Puducherry", "d": "Lakshadweep, Daman and Diu and Chandigarh"}, "answer": "c", "explanation": "Delhi, Chandigarh and Puducherry. In 2011, the population density of India was 382 persons per square kilometer, with Arunachal Pradesh having the lowest density at 17 persons per square kilometer; Bihar had the highest density at 1,106 persons per square kilometer, followed by West Bengal (1028), Kerala (860), Uttar Pradesh (829), and Haryana (573).", "source": null}, {"id": 683, "topic": "Population", "question": "Consider the following statements: 1. India’s annual exponential growth rate as per Census 2011 was 0.64%. 2. The slogan of Census 2011 was “Our Census, Our Right”. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "d", "explanation": "Neither 1 nor 2. Indiah’s annual exponential growth rate as per Census 2011 was 1.64%. ThBe 2011 Census was the 15th census in India and the 7th since the coeuntry gained Independence. Its slogan was “Our Census, Our Futumre”.", "source": null}, {"id": 684, "topic": "Population", "question": "According to Census of India 2011, female adolescents in the age group of 10 -19 years had a share of:", "options": {"a": "52.7%", "b": "47.3%", "c": "31.3%", "d": "20.9%"}, "answer": "b", "explanation": "47.3%.", "source": null}, {"id": 685, "topic": "Population", "question": "According to the Census of India 2011, most people had out-migrated from ________ to other states in India.", "options": {"a": "Rajasthan and Gujarat", "b": "Uttar Pradesh and Madhya Pradesh", "c": "Maharashtra and Gujarat", "d": "Uttar Pradesh and Bihar"}, "answer": "d", "explanation": "Uttar Pradesh and Bihar. According to the 2011 Census, Uttar Pradesh and Bihar are responsible for the most number of migrants as 20.9 million people migrated outside the state from the two states. Reason for Migration Lack of Employment opportunities, Lack of proper Educational and Healthcare Facilities, Marriage. Uttar Pradesh has the highest share of out-migrants while Maharashtra has the highest share of in-migrants.", "source": null}, {"id": 686, "topic": "Population", "question": "The growth rate of India's population has been declining since ____.", "options": {"a": "1991", "b": "1951", "c": "1981", "d": "1971"}, "answer": "c", "explanation": "1981. The pace of population growth is slowing down in the country. Two major reasons behind this decline: a decrease in the fertility rate and improvements in family planning practices. The population growth rate was 23.6% in the decade 1981-1991, which declined to 21.5% in 1991-2001. This rate declined further to 17.6% in the decade 2001-2011.", "source": null}, {"id": 687, "topic": "Population", "question": "Consider the following statements regarding Census in India: I. The Census Act was enacted in India in 1947. II. The first census of Independent India was conducted in 1950. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. The Census Act wais enacted in India in 1948. The a first census of Independent India was conducted in 1951, which was the seventh census in its continuous series. The enumeration period of this Census was from 9th to 28th, February 1951. The Census Act, 1948 - An Act to provide for certain matters in connection with the taking of Census.", "source": null}, {"id": 688, "topic": "Population", "question": "According to the Census of India - 2011, which state has the largest gap between male and female literacy rates?", "options": {"a": "Andhra Pradesh", "b": "Assam", "c": "Rajasthan", "d": "Karnataka"}, "answer": "c", "explanation": "Rajasthan.", "source": null}, {"id": 689, "topic": "Population", "question": "According to Census of India 2011, how many districts are there in India?", "options": {"a": "630", "b": "640", "c": "610", "d": "620"}, "answer": "b", "explanation": "640. As per 2011 census, India has 28 States, 640 districts, 5,924 sub-districts, 7,935 Towns and 6,40,867 Villages. There is an increase of 47 Districts, 461 Sub Districts, 2774 Towns (242 Statutory and 2532 Census Towns) and 2279 Villages in Census 2011 as compared to Census 2001.:", "source": null}, {"id": 690, "topic": "Population", "question": "According to the Census of India 2011, which group of states has the least urban population?", "options": {"a": "Madhya Pradesh and Bihar", "b": "Himachal Pradesh and Meghalaya", "c": "Himachal Pradesh and Bihar", "d": "Uttar Pradesh and Bihar"}, "answer": "c", "explanation": "Himachal Pradesh and Bihar. According to the 2011 census of India: Urban Population - 31.16%. Rural Population - 69%. Goa is the most urbanized state with 62.17% of the population living in urban areas. The total population percentage of people that lived in urban regions of Himachal Pradesh is 10.03%, Bihar is 11.29%, Odisha is 16.69%, and Rajasthan is 24.87%.", "source": null}, {"id": 691, "topic": "Population", "question": "According to Census of India 2011, what was the sex ratio recorded in the Union Territory of Puducherry?", "options": {"a": "890 females/1000 males", "b": "980 females/1000 males", "c": "1037 females/1000 males", "d": "1095 females/1000 males"}, "answer": "c", "explanation": "1037 females/1000 males. According to the Census, the sex ratio in India has increased from 933 females per 1,000 males in 2001 to 943 females per 1,000 males in 2011, with Kerala recording the highest sex ratio at 1,084 and Haryana recording the lowest sex ratio among states at 879, while Delhi had the lowest sex ratio among Union Territories at 868.", "source": null}, {"id": 692, "topic": "Population", "question": "As per the Census-2011, the population growth during the decade remained ________.", "options": {"a": "15.30%", "b": "14.25%", "c": "17.64%", "d": "18.30%"}, "answer": "c", "explanation": "17.64%. The Census 2011 is the 15th National census survey conducted by the Census Organization of India. Mr. C. Chandramouli is the Commissioner & Registrar General of the Indian 2011 Census. Top Growth Rated States/UTs: Dadra and Nagar Haveli (55.88%), Daman and Diu (53.76%), Puducherry (28.08%), MeghalayaF (27.95%), Arunachal Pradesh (26.03%).", "source": null}, {"id": 693, "topic": "Population", "question": "On the basis of highest population growth rate (Census, 2011), select the option that arranges the following states in descending order. (A) Bihar (B) Arunachal Pradesh (C) Meghalaya", "options": {"a": "A, B, C", "b": "C, A, B", "c": "C, B, A", "d": "B, C, A"}, "answer": "c", "explanation": "C, B, A. As per Census 2011: Highest Populated State - Uttar Pradesh (19.98 crore), Least Populated State Sikkim. Highest Populated Union territory - National Capital Territory of Delhi, Least Populated Union territory - Lakshadweep. Bihar has experienced the largest decadal population growth among the main states (25.4%).", "source": null}, {"id": 694, "topic": "Population", "question": "According to Census of India 2011, which district in India has the lowest literacy rate in India?", "options": {"a": "Aizawl", "b": "Alirajpur", "c": "Rampur", "d": "Madhubani"}, "answer": "b", "explanation": "Alirajpur: It is considered one of the poorest cities in India, with over 70% of the population living below the poverty line. According to the 2011 Census, the female literacy rate in Alirajpur (in Madhya Pradesh) is 31.0%, while the male literacy rate is 43.6%. In contrast, Serchhip, a town in Mizoram, was the most literate district, with an average literacy rate of 98.23%.", "source": null}, {"id": 695, "topic": "Population", "question": "Consider the following statements regarding Census 2011: 1. Kerala is the most urbanised state in India with 62.2% urban population. 2. Himachal Pradesh has the lowest urban population (10%) among Indian states. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. Goa has the highest urban population among states, at 62.2%, followed by Kerala at 47.7%. The National Capital Territory of Delhi (97.5%) and Chandigarh (97.25%) e are the most urbanized Union Territories. Himachal Pradesh has the m lowest urban population, at 10%, followed by Bihar at 11.3%.", "source": null}, {"id": 696, "topic": "Population", "question": "As per the Census of India-2011, the density of population per km 2 was ________ persons.", "options": {"a": "382", "b": "394", "c": "345", "d": "320"}, "answer": "a", "explanation": "382. The density of population is the ratio between the numbers of people to the size of land. It is usually measured in persons per square kilometer. As per Census of India 2011, Bihar has the highest population density (1,106) in India while Arunachal Pradesh has the lowest population density in India with 17 people per square kilometer.", "source": null}, {"id": 697, "topic": "Population", "question": "According to the Census 2011 of India, which metropolitan has the second highest population ?", "options": {"a": "Chennai", "b": "Delhi", "c": "Kolkata", "d": "Mumbai -"}, "answer": "b", "explanation": "Delhi. Census 2011: Highest populated metropolitan city - Mumbai (18 million), Second - Delhi (16 million), followed by Kolkata (14 million). Mumbai, Delhi, Kolkata, Chennai, Bangalore, Pune, Ahmedabad, Surat and Hyderabad are the metropolitan cities of India with a population of more than four million.", "source": null}, {"id": 698, "topic": "Population", "question": "According to the census of India 2011, which state has the lowest population growth rate ?", "options": {"a": "Jharkhand", "b": "Punjab", "c": "Uttar Pradesh", "d": "Nagaland"}, "answer": "d", "explanation": "Nagaland (-0.58%). Census 2011: India's population growth rate 17.64%. States/UTs with top population growth rates: Dadra and Nagar Haveli (55.88%), Daman and Diu (53.76%), Puducherry (28.08%), Meghalaya (27.95%), Arunachal Pradesh (26.03%). India's decadal growth rate was 13.31% from 1941 to 1951.", "source": null}, {"id": 699, "topic": "Population", "question": "What was the Child Sex Ratio in the country as per the Census of India 2011 ?", "options": {"a": "189", "b": "981", "c": "919", "d": "911"}, "answer": "c", "explanation": "919. As per the Census, the child sex ratio has decreased from 927 females per thousand males in 2001 to 919 females per thousand males in 2011. Child sex ratio 2011: Highest in Kerala (964), Puducherry (967), Tamil Nadu (943), Andhra Pradesh (939), Chhattisgarh (969), Lowest in Haryana (834).", "source": null}, {"id": 700, "topic": "Population", "question": "As per Census of India 2011, in which of the following states was the total population less than 10 lakh?", "options": {"a": "Telangana", "b": "Sikkim", "c": "Tripura", "d": "Goa"}, "answer": "b", "explanation": "Sikkim (6.71 lakhs). Census 2011: India's most populated state is Uttar Pradesh (19.98 crores, 829 people/square km), followed by Maharashtra (11.24 crores, 365 people/square km), Bihar (10.41 crores, 1106 people/square km), West Bengal (9.13 crores, 1028 people/square km), and Andhra Pradesh (8.46 crores, 308 people/square km).", "source": null}, {"id": 701, "topic": "Population", "question": "As per the Census-2011, the total absolute increase in population during the decade is ________.", "options": {"a": "18.19 crore", "b": "16.41 crore", "c": "17.21 crore", "d": "15.23 crore"}, "answer": "a", "explanation": "18.19 crore. The population density in India in 2011 was 382 people per square kilometer. Bihar has the highest population density (1106 people per square kilometer), followed by Bengal (1028) and Kerala (860). The state with the lowest population density is Arunachal Pradesh (17 persons/square km) and the Union Territory with the lowest density population is Andaman & Nicobar Islands.", "source": null}, {"id": 702, "topic": "Population", "question": "Match the following States/UTs with their Sex Ratio (Census 2011): A. Kerala → (i) 996 B. Puducherry → (ii) 877 C. Tamil Nadu → (iii) 1084 D. Haryana → (iv) 1037 E. Daman & Diu → (v) 618", "options": {"a": "A–i, B–ii, C–iii, D–iv, E–v", "b": "A–ii, B–i, C–iv, D–iii, E–v", "c": "A–iii, B–iv, C–i, D–ii, E–v", "d": "A–i, B–iii, C–ii, D–v, E–iv"}, "answer": "c", "explanation": "A–iii, B–iv, C–i, D–ii, E–v. The sex ratio is the ratio of males to females in a population, usually expressed as the number of females per 1000 males. States with Highest Sex Ratio (census 2011): Kerala (1084), Puducherry (1037), Tamil Nadu (996), Andhra Pradesh (993), Chhattisgarh (991). Haryana has the lowest sex ratio (877) in Indian states while in union territory Daman & Diu has lowest sex ratio of 618.", "source": null}, {"id": 703, "topic": "Population", "question": "Consider the following: Which of the following reasons may be considered as India’s pull factors for migration? 1. Labour demand 2. Natural disaster 3. Protection of human and civil rights 4. High consumption and living standards", "options": {"a": "Both 1 and 4", "b": "Only 2", "c": "Only 1, 3 and 4", "d": "Only 2, 3 and 4"}, "answer": "c", "explanation": "Only 1, 3 and 4. Pull factors attract migrants to an area, like better job opportunities or quality of life. Push factors drive people to leave, such as poor living conditions or lack of jobs.", "source": null}, {"id": 704, "topic": "Population", "question": "What is the literacy rate of males in India as per the report published in the National Survey of India-2022 ?", "options": {"a": "81.2%", "b": "83.4%", "c": "86.3%", "d": "84.7%"}, "answer": "d", "explanation": "84.7%. According to the National Survey of India 2022, the overall literacy rate in India is 77.7%, with female literacy at 70.3%.", "source": null}, {"id": 705, "topic": "Population", "question": "The __________ results from an increase in the proportion of workers relative to nonworkers in the population.", "options": {"a": "age structure of population", "b": "population momentum", "c": "old-age dependency ratio", "d": "demographic dividend"}, "answer": "d", "explanation": "Demographic dividend refers to the economic growth potential from changes in a population's age structure, typically when the working-age population grows larger relative to dependents. Population momentum describes the potential for growth or decline based on age structure, even with constant fertility, mortality, and migration rates. The old-age dependency ratio (OADR) is the number of people aged 65+ compared to those aged 20–64, the working - age group.", "source": null}, {"id": 706, "topic": "Population", "question": "According to the Census of India 2011, which of the following states has the largest Buddhist population?", "options": {"a": "Madhya Pradesh", "b": "Uttar Pradesh", "c": "Maharashtra", "d": "West Bengal"}, "answer": "c", "explanation": "Maharashtra. As per Census 2011: Among 121.09 crores population (religions) are: Hindu 96.63 crores (79.8%), Muslim (14.2%), Christian (2.3%), Sikh (1.7%), Buddhist (0.7%), Jain (0.4%), others (0.9%). Muslims (14.2%) form the largest religious minority in India.", "source": null}, {"id": 707, "topic": "Population", "question": "With regard to the component of population density, which state is the odd one out of the following?", "options": {"a": "Tamil Nadu", "b": "Bihar", "c": "Arunachal Pradesh", "d": "Uttar Pradesh"}, "answer": "c", "explanation": "Arunachal Pradesh. According to the 2011 census, Arunachal Pradesh had a pmopulation density of 17 people per square kilometer, while the average for India was 382 people per square kilometer. Some other states and Union Territories had the following densities: Uttar Pradesh (829), Maharashtra (365), Bihar (1,106), West Brengal (1,028), Delhi (11,320), Puducherry (2,547), Andaman and Nicobar Islands (46), and Sikkim (86).", "source": null}, {"id": 708, "topic": "Population", "question": "What is the national female workforce participation rate as per the Census of India 2011?", "options": {"a": "53.26%", "b": "30.02%", "c": "25.51%", "d": "53.03%"}, "answer": "c", "explanation": "25.51%. As per the 2011 Census, female workforce participation is 25.51% compared to 53.26% for males. Rural areas have higher female participation (30.02%) than urban areas. In Rural, Himachal Pradesh has the maximum female workforce participation rate (47.4) whereas Tamil Nadu has maximum (21.8) among major states. There is a significant gap between rural and urban female workforce participation, though male participation is similar in both sectors.", "source": null}, {"id": 709, "topic": "Population", "question": "According to Census
