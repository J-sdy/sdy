nd using simple tools and more. More than one crop is cultivated during a year.", "source": null}, {"id": 349, "topic": "Agriculture", "question": "Which of the following states of India still uses the ancient bamboo drip irrigation method?", "options": {"a": "Telangana", "b": "Meghalaya", "c": "Maharashtra", "d": "Chhattisgarh"}, "answer": "b", "explanation": "Meghalaya. Bamboo drip irrigation system is tapping stream and spring water by using bamboo pipes. It Types of Irrigation systems: Well and Tube well, Canal, Tank, Drip, Sprinkler, Furrow, Surge, Ditch. The word - Meghalaya means “abode of clouds”. - ‘Krem Liat Prah’ Longest cave of India i s in Meghalaya. Hills: Garo, Khasi, Jaintia.", "source": null}, {"id": 350, "topic": "Agriculture", "question": "Which of the fBollowing is classification bases of industry applies to the products - cotton, jeute, wool, silk textile, rubber, tea, sugar, coffee, edible a oil ? m", "options": {"a": "Key industries", "b": "Consumer industries", "c": "Agro baesed industries", "d": "Mineral based industries"}, "answer": "c", "explanation": "Agro-based industries use p lant and animal products as raw materials. Mineral-based industries, like F iron and steel, copper smelting, and cement, use mineral ores. Consumer industries produce goods for direct consumer use, such as sugar, toothpaste, paper, sewing machines, and fans.", "source": null}, {"id": 351, "topic": "Agriculture", "question": "Consider the following statements regarding Census of India 2011: 1. 4.6% of the total workforce was engaged in manufacturing and allied sector activities. 2. The total number of agricultural workers was 263.1 million as per Census 2011 Which of the above statements is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. 54.6% of the total workforce is engaged in Agriculture and allied sector activities. Census 2011 was conducted by the Registrar General of India. The total number of agricultural workers in the country: 263.1 million a (118.8 million cultivators and 144.3 million agricultural labourers) in 2011. The workforce participation rate for females was 25.51% against 53.26% for males.", "source": null}, {"id": 352, "topic": "Agriculture", "question": "Cultivation of rice needs high rainfall ________.", "options": {"a": "Low temperature and low humidity", "b": "High temperature and low humidity", "c": "High temperature and high humidity", "d": "Low temperature and high humidity"}, "answer": "c", "explanation": "High temperature and high humidity. Fertile riverine alluvial soil is best for rice cultivation. It is a type of Kharif crop. West Bengal is the largest rice-producing state in India. China is the world's largest producer of rice followed by India. Methane is the gas produced by the rice fieild.", "source": null}, {"id": 353, "topic": "Agriculture", "question": "Consider the following statements: 1. The cultivation of tea was introduced on the Baba Budan Hills in India. 2. Baba Budan introduced the coffee plant to Chikkamagaluru, Karnataka in 1670. Which of the above statement(s) is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. The cultivation of Coffee was introduced on the Baba Budan Hills in India. Baba Budan introduced the coffee plant to Chikkamanglur, Karnataka in 1670. Growth of coffee was encouraged during the time of General Sir Mark Cubbon in 1834. Types of coffee bean: Arabica, Robusta, Excelsa and Liberica. Coffee producer country: 1 st - Brazil. 2 nd - Vietnam.", "source": null}, {"id": 354, "topic": "Agriculture", "question": "Dr D.S. Athwal was known as the 'Father of___________Revolution in India'.", "options": {"a": "Oilseed", "b": "Rice", "c": "Millet", "d": "Wheat"}, "answer": "d", "explanation": "Wheat. Father of Agricultural revolutions in India: Green Revolution (Agriculture) - M.S. Swaminathan, White Revolution or Operation flood (Milk/ Dairy products) - Dr. Varghese Kurien, Blue Revolution (Fish and Aqua) - Dr. Arun Krishnan and Dr. Harilal Chaudhari, Golden Revolution (Fruits, Honey, Horticulture) - Nirpakh Tutaj, Silver Revolution (Eggs) - Indira Gandhi, Yellow Revolution (Oil Seeds) - Sam Pitroda, Pink Revolution (Pharmaceuticals, Prawns, Onion) - Durgesh Patel, Brown Revolution (Leather, Coco) - Hiralal Chaudri, Red Revolution (Meat, Tomato) - Vishal Tewari.", "source": null}, {"id": 355, "topic": "Agriculture", "question": "Consider the following statements regarding the Agricultural Census in India: 1. The Agricultural Census in India is conducted every six years. 2. The Agriculture Census has been conducted by the Ministry of Agriculture since 1980 -81 Which of the above statement(s) is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. Agricultural Census is conducted in India at an interval of 5 years. It is conducted following the broad guidelines of the decennial World Census of Agriculture (WCA) developed by the Food and Agriculture Organization (FAO) of the United Nations. The Agriculture Census has been conducted by the Ministry of Agriculture since 1970-71. “The Eleventh Agricultural Census” (2021-22) Launched by The Ministry of Agriculture & Farmers' Welfare.", "source": null}, {"id": 356, "topic": "Agriculture", "question": "Which of the following is termed as \"sericulture\" ?", "options": {"a": "Cultivation of grapes", "b": "Growing of fruits", "c": "Breeding of fish", "d": "Commercial rearing of silk worms"}, "answer": "d", "explanation": "Commercial rearing of silkworms. ‘Bombyx mori', ‘Eri’, ‘Muga’ and ‘Tasar’ are silkworm species used in sericulture. These are used to produce silk fiber (protein) from their silk glands Moriculture refers to the cultivation ofF mulberry plants. Other types of farming Aviculture (birds), Apiculture (bees), Pisciculture (fish), Viticulture (grapes), Fungiculture (mushroom), Arboriculture (tree), Silviculture (fodder crops), Olericulture (vegetables).", "source": null}, {"id": 357, "topic": "Agriculture", "question": "There are regions where farmers specialize in vegetables only. This type of farming is known as ______.", "options": {"a": "Mixed farming", "b": "Pastoral farming", "c": "Dairy farming", "d": "Truck farming"}, "answer": "d", "explanation": "Truck farming. Mixed farming includes crop cultivation and raising animals. Pastoral farming involves livestock, such as cattle, sheep, and goats, while dairy farming focuses on milk production from cows.", "source": null}, {"id": 358, "topic": "Agriculture", "question": "Which among the following terms means growing of fruits?", "options": {"a": "Apiculture", "b": "Arboriculture", "c": "Pomiculture", "d": "Sericulture"}, "answer": "c", "explanation": "Pomiculture. Apiculture - The maintenance of honeybees and hives. Arboriculture - Cultivation of trees, shrubs, and woody plants for shading and decorating.", "source": null}, {"id": 359, "topic": "Agriculture", "question": "It is a tropical as well as a subtropical crop. It grows well in hot and humid climates with a temperature of 21°C to 27°C and an annual rainfall between 75cm and 100cm. Which of the crops is being talked about in the information given above?", "options": {"a": "Sugarcane", "b": "Cotton", "c": "Maize", "d": "Rubber"}, "answer": "a", "explanation": "Sugarcane. India is the second-largest producer of sugarcane after Brazil. Maize - Grown in tropics, sub tropics and temperate regions. Rubber Equatorial crop produced primarily for the manufacture of latex for industrial use.", "source": null}, {"id": 360, "topic": "Agriculture", "question": "Cotton requires ____ temperature, light rainfall or irrigation,_____ frost - free days and bright sun-shine for its growth.", "options": {"a": "high, 210", "b": "low, 150", "c": "low, 210", "d": "high, 150"}, "answer": "a", "explanation": "High, 210. Cotton crop requires light rainfall or irrigation and bright sunshine for its growth. It comes under the Kharif Cmrop.", "source": null}, {"id": 361, "topic": "Agriculture", "question": "In India initially HYVP was implemented in about how much area?", "options": {"a": "5 millione hectares", "b": "3 million hectares", "c": "4 meillion hectares", "d": "2 million hectares."}, "answer": "d", "explanation": "2 million hectares. HYVP (High Yielding Variety Programme) was: restricted to only five crops – Wheat, rice, jowar, bajra and maize. The high yielding variety of seeds (resistant to insects and diseases) played an important role in the Green Revolution of India.", "source": null}, {"id": 362, "topic": "Agriculture", "question": "In rainforests which kind of cultivation is practiced?", "options": {"a": "Dry farming", "b": "Vertical farming", "c": "Terrace farming", "d": "Slash and burn"}, "answer": "d", "explanation": "Slash and burn cultivation or swidden cultivation, is commonly practiced in rainforest areas.", "source": null}, {"id": 363, "topic": "Agriculture", "question": "The Purple revolution was launched by the Union Ministry of Science & Technology in Jammu and Kashmir. This revolution is related to cultivation of which crop?", "options": {"a": "Marigold", "b": "Kashmiri Rose", "c": "Lavender", "d": "Himalayan Indigo"}, "answer": "c", "explanation": "Lavender. The Purple Revolution was initiated in 2016 through the Aroma Mission of the Council of Scientific and Industrial Research (CSIR). In India, the lavender crop is cultivated in low rainfall regions and on the slopes of hills of Himachal Pradesh (HP) and Uttar Pradesh (UP).", "source": null}, {"id": 364, "topic": "Agriculture", "question": "Consider the following statements regarding types of agriculture: 1. Soilless agriculture is called Hydroponics. 2. In Dry farming, crops are cultivated without irrigation in regions of limited rainfall. Which of the above statement(s) is/are correct? -", "options": {"a": "1 only", "b": "2 only -", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. In shifting agriculiture, a clearing is made in the a forest, usually on the slopes of hills. Dry farming is the cultivation of crops without irrigation in regions of limited moisture, typically less than 20 inches of precipitation annually.", "source": null}, {"id": 365, "topic": "Agriculture", "question": "The word agriculture is derived from the Latin words ager and culture. What does ‘ager’ mean?", "options": {"a": "Rocks", "b": "Soil", "c": "Water", "d": "Plants"}, "answer": "b", "explanation": "Soil. The English word agriculture derives from the Latin ager (field) and colo (cultivate) signifying, when combined, the Latin agricultura: field or land tillage. Agriculture is the art and science of cultivating the soil, growing crops and raising livestock. It is the backbone of the Indian economy.", "source": null}, {"id": 366, "topic": "Agriculture", "question": "India lost a large proportion of ___ growing area to Pakistan during partition.", "options": {"a": "sunflower", "b": "jute", "c": "soyabean", "d": "cotton"}, "answer": "d", "explanation": "Cotton is a key fiber and cash crop in India, with Gujarat and Maharashtra as leading producers. The first cotton mill, Bombay Spinning and Weaving Company, was established in Bombay on 7 July 1854. Madhya Pradesh is the largest producer of soybeans, Karnataka of sunflower, and West Bengal of jute.", "source": null}, {"id": 367, "topic": "Agriculture", "question": "Which of the following is the main food crop of the semi-arid areas of central and southern India?", "options": {"a": "Jowar", "b": "Maize", "c": "Bajra", "d": "Ragi"}, "answer": "a", "explanation": "Jowar is mainly concentrated in the peninsular and central India. Karnataka is the highest maize producer. Rajasthan is the state with the highest yield of bajra in India. Karnataka is the leading producer of ragi in the country followed by Tamil Nadu, Uttarakhand, Maharashtra and Andhra Pradesh.", "source": null}, {"id": 368, "topic": "Agriculture", "question": "Which of the following is a well known variety of coffee initially brought to India from Yemen?", "options": {"a": "Gesha", "b": "Arabica", "c": "Canephora", "d": "Charrieriana"}, "answer": "b", "explanation": "Arabica is grown in Karnataka (Kodagu, Chikkamagaluru, Hassan), Kerala (Malabar region), and Tamil Nadu (Nilgiris, Yercaud, Kodaikanal).", "source": null}, {"id": 369, "topic": "Agriculture", "question": "Assertion (A): Taramira is a variety of oilseed cultivated mainly in the drier regions of north-western India. Reason (R): Arabica, Robusta, and Liberica are major varieties of oilseed crops in India.", "options": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "answer": "c", "explanation": "A is true, but R is false. Taramira is an important oilseed crop drier regions of north-western India. The oil is not directly eaten, although it mixed with mustard oil to increase the pungency of the latter. Arabica, Robusta, and the less common Liberica and Excelsa are the four main types of coffee beans. Soil", "source": null}, {"id": 370, "topic": "Soil", "question": "Consider the following characteristics: 1. High moisture-retaining capacity, often developing deep cracks during dry hot weather. 2. Ideal for tea and apple cultivation due to high fertility and cold climate preference. 3. Rich in lime, iron, magnesia, and alumina, but poor in phosphoric contents. Which of the above characteristics are primarily associated with Black Soils?", "options": {"a": "Only 1", "b": "Only 1 and 3", "c": "Only 2 and 3", "d": "1, 2 and 3 are correct"}, "answer": "b", "explanation": "Only 1 and 3. Black soils, also called Regur soils, have high moisture-retaining capacity due to their clay content, causing swelling when wet and deep cracks when dry. They are rich in lime, iron, magnesia, and alumina but lack phosphoric acid, nitrogen, and organic matter. These soils are ideal for cotton, sugarcane, jowar, and wheat cultivation. Tea requires well-drained, acidic, loamy soils (like Laterite soil) in humid hilly regions, while apples grow - best in loamy soils of colder climates.", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 371, "topic": "Soil", "question": "Which of the following statements correctly differentiates Alluvial soils from Red and Yellow soils?", "options": {"a": "Alluvial: from rocks; Red/Yellow: river-transported", "b": "Alluvial: older types most fertile; Red/Yellow: colored by iron", "c": "Alluvial: sandy loam to clay; Red/Yellow: sandy loam, less fertile uplands", "d": "Alluvial: rich in phosphorus and humus; Red/Yellow: rich in potash"}, "answer": "c", "explanation": "Alluvial soils exhibit a wide range of textures from sandy loam to clay, depending on the river's depositional environment. In contrast, Red and Yellow soils, especially in upland regions, are often coarser, such as sandy loam, and are generally less fer tile than the nutrient-rich alluvial soils found in river plains. e of", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 372, "topic": "Soil", "question": "Which omf the following agro climatic and soil conditions is most is suitable for the cultivation of wheat?", "options": {"a": "Arid crop; temperature above 40°C; saendy loam soil", "b": "Subtropical crop; high humidity; r laterite soil", "c": "Temperate crop; winter temp 10-15°C, summer 21-26°C; clay loam soil", "d": "Tropical crop; 30-35°C temperature; sandy soil"}, "answer": "c", "explanation": "Wheat is a rabi crop in India and thrives best under cool winters and warm summers. The ideal climatic and soil conditions are: Temperature: Sowing: around 10–15°C, Ripening/Harvesting: around 21–26°C, Rainfall: Moderate rainfall (75–100 cm), with irrigation support in drier regions.Soil: Well-drained clay loam or alluvial soil, rich in humus, is best for wheat cultivation.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 373, "topic": "Soil", "question": "Consider the following statements about plateaus: 1. The Deccan Lava Plateau in India is very fertile because it is rich in black soil, which is highly suitable for farming. 2. The African Plateau is famous for its fertile black soil, whereas the Katanga Plateau is primarily known for agriculture. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. Deccan lava plateau is a volcanic plateau in west-central India that was formed by the solidification of lava from deep within the Earth. It is a triangular landmass that lies to the south of the river Narmada. The African plateau is famous for gold and diamond mining. The Katanga Plateau in the Democratic Republic of the Congo is known for its rich deposits of copper and uranium.", "source": null}, {"id": 374, "topic": "Soil", "question": "In a laterite soil profile, which of the following elements is present in an excessive amount?", "options": {"a": "Iron", "b": "feldspar", "c": "Nitrogen", "d": "Lime"}, "answer": "a", "explanation": "Iron. Laterite soil contains excess iron due to intense leaching in high rainfall and temperature areas. The leaching process removes lime and silica, leaving iron oxide and aluminum compounds. These soils are poor in nitrogen, phosphate, and calcium, making them less fertile naturally. However, after adding manures and fertilizers, they are suitable for tree crops - like cashew nuts.", "source": null}, {"id": 375, "topic": "Soil", "question": "Which of the following factors is primarily responsible for soil formation?", "options": {"a": "Weathering", "b": "Irrigation", "c": "Degradation", "d": "Mining"}, "answer": "a", "explanation": "Weathering: It involves the breakdown of rocks and minerals into smaller particles through exposure to environmental factors like wind, water, ice, temperature fluctuations and others. Irrigation: It supports agriculture and affects soil moisture. Degradation: This refers to the deterioration of soil quality. Mining: It can disturb existing soils.", "source": null}, {"id": 376, "topic": "Soil", "question": "Which of the following is the main cause of land degradation in Jharkhand and Chhattisgarh?", "options": {"a": "Intensive use of manure", "b": "Over-irrigation", "c": "Deforestation due to mining", "d": "Overgrazing"}, "answer": "c", "explanation": "Deforestation due to mining. Human activities like deforestation, over-grazing, mining, and quarrying significantly contribute to land degradation. Deforestation due to mining has severely impacted states like Jharkhand and Odisha. Over-grazing affects Gujarat, Rajasthan, and Madhya Pradesh, while excessive irrigation causes waterlogging and soil degradation in Punjab, Haryana, and western Uttar Pradesh.", "source": null}, {"id": 377, "topic": "Soil", "question": "Which is the largest part of the northern plains and is formed of older alluvium?", "options": {"a": "Terai", "b": "Bhabar", "c": "Bhangar", "d": "Khadar"}, "answer": "c", "explanation": "Bhangar. It is characterized by slightly elevated terraces and is composed of older, more compact sediments compared to the newer and more fertile alluvial deposits found in the Khadar regions. The Bhangar area is less fertile due to the presence of calcareous deposits known as \"Kankar.\"", "source": null}, {"id": 378, "topic": "Soil", "question": "Which unit is used to measure the concentration of contaminants in soil and sediment?", "options": {"a": "DPMO", "b": "TDS", "c": "PPBB", "d": "PPM"}, "answer": "d", "explanation": "PPM (Parts per million) is commonly used to express very dilute concentrations of substances in various environmental contexts, including soil and sediment analysis.", "source": null}, {"id": 379, "topic": "Soil", "question": "In which of the following processes nutrients or contaminants are carried away by water or moved into the lower layer of the soil ?", "options": {"a": "Leaching", "b": "Bleaching", "c": "Sowing", "d": "Ploughing"}, "answer": "a", "explanation": "Leaching: It occurs as excess water removes water-soluble nutrients out of the soil, by runoff or drainage. It is an environmental problem for agricultural professionals whether chemical-heavy fertilisers or chemicals are swept out and find their way into water bodies.", "source": null}, {"id": 380, "topic": "Soil", "question": "Assertion (A): The black soil of the Deccan Plateau is deficient in phosphorus. Reason (R): Black soil is rich in iron, lime, calcium, potassium, aluminum, and magnesium but poor in nitrogen and organic matter.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "b", "explanation": "Both A and R are true, but R is not the correct explanation of A. Black soil or cotton soil is good for moisture and good for growing cotton, sugarcane, wheat, jawar, rice, citrus fruits, sunflower, linseed, etc. Black soil requires minimum tillage because of its self-cultivating feature.", "source": null}, {"id": 381, "topic": "Soil", "question": "Laterite soil develops as a result of which of the following reasons ?", "options": {"a": "Compaction", "b": "Leaching", "c": "High temperature only", "d": "Sedimentation"}, "answer": "b", "explanation": "Leaching - It is used to extract the substances from the solids. Laterite Soil: It develops in areas with high temperature and high rainfall. These are the result of intense leaching due to tropical rains. It is commonly found in Karnataka, Kerala, Tamil Nadu, Madhya Pradesh and the hilly areas of Odisha and Assam. Laterite Soil is most suitable soil for growing coffee in India", "source": null}, {"id": 382, "topic": "Soil", "question": "The black soil area of the _______ is known as the Deccan Trap.", "options": {"a": "Northern Plains", "b": "Peninsular Plateau", "c": "Coastal Plains", "d": "Himalayan Mountains"}, "answer": "b", "explanation": "Peninsular Plateau.B It is an ancient landmass composed mainly of igneous and metamorphic hard crystalline rocks. It was formed due to the breaking and drifting of Gondwanaland. Deccan Plateau - A triangular landmass that lies to the south of the river Narmada. Black Soil Covers most of the deccan plateau which includes part of Maharashtra, Madhya Pradesh, Gujarat, Andhra Pradesh and s ome part of Tamil Nadu. F", "source": null}, {"id": 383, "topic": "Soil", "question": "In which of the following states of India is the maximum extent of alluvial soil found?", "options": {"a": "Telangana", "b": "Uttar Pradesh", "c": "Karnataka", "d": "Maharashtra"}, "answer": "b", "explanation": "Uttar Pradesh. Alluvial Soil found in northern plains and the river valleys. It is rich in potash but poor in phosphorus. Two types of alluvial soil Khadar - New alluvium, deposited by floods annually, which enriches the soil by depositing fine slits. Bhangar - Old alluvium, deposited away from the flood plains. Alluvial soils are intensively cultivated.", "source": null}, {"id": 384, "topic": "Soil", "question": "What is the type of soil composed of silt and dust ?", "options": {"a": "Loam", "b": "Marl", "c": "Loess", "d": "Pod"}, "answer": "c", "explanation": "Loess. Properties: Colour Yellowish Brown, Homogeneous and Highly Porous. Mostly Found (India) Kashmir Valley. Loam - The type of Soil composed of sand, silt, and clay soil. Marl - The type of soil composed of Clays and Slit. Podsol - The soil derives from either quartz-rich sands and sandstone or sedimentary debris from magmatic rocks.", "source": null}, {"id": 385, "topic": "Soil", "question": "Consider the following statements about soils in India: 1. Red and Yellow soils together cover about 40% of the total area of India. 2. Black soil, also called Regur soil, is suitable for cotton cultivation. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Alluvial soil is found on about 40% of the total area of India. It is deposited by surface water, commonly found in riiver valleys and northern plains. It is hiighly fertile and rich in humus and a lime. Crops cultivated on it include sugarcane, rice, maize, wheat, oilseeds, and pulses.", "source": null}, {"id": 386, "topic": "Soil", "question": "The colour of the alluvial soils varies from ________.", "options": {"a": "pale white to warm white", "b": "light orange to dark orange", "c": "orange to red", "d": "light grey to ash grey"}, "answer": "d", "explanation": "light grey to ash grey. Alluvial soils are formed by the deposition of sediments from rivers and streams. These sediments are typically composed of sand, silt, and clay, which are all light-coloured materials. The colour of the alluvial soils can also be affected by the presence of organic matter, which can give them a darker colour. Light orange to dark orange is the colour of laterite soils. Orange to red is the colour of red soils.", "source": null}, {"id": 387, "topic": "Soil", "question": "Which of the following is an example of micronutrient supplied by soil ?", "options": {"a": "Potassium", "b": "Iron:", "c": "Calcium", "d": "Sulphur"}, "answer": "b", "explanation": "Iron. Soil is a major source of nutrients needed by plants for growth. Macronutrients in soil - Nitrogen (N), Phosphorus (P), Potassium (K), Calcium (Ca), Magnesium (Mg) and Sulphur (S). Micronutrients in soil - Chlorine (Cl), Boron (B), Iron (Fe), Manganese (Mn), Copper (Cu), Zinc (Zn), Nickel (Ni) and Molybdenum (Mo). -", "source": null}, {"id": 388, "topic": "Soil", "question": "Which of the following statements is NOT correct regarding fertilizers ? -", "options": {"a": "They are prepared in factories", "b": "They are very rich in plant nutrients", "c": "They provide humus to the soil", "d": "They are man-made inorganic salt"}, "answer": "c", "explanation": "Humus is the organic component of soil that is formed by the decomposition of plant and animal matter. It can be produced naturally or through a process called composting. Manures are used to provide humus in soil.", "source": null}, {"id": 389, "topic": "Soil", "question": "Arid soils are characteristically developed in ___________. which exhibit characteristic arid topography.", "options": {"a": "Southern Uttar Pradesh", "b": "Western Uttar Pradesh", "c": "Western Rajasthan", "d": "Southern Rajasthan"}, "answer": "c", "explanation": "Western Rajasthan. In India, the Indian Council of Agricultural Research (ICAR) has classified soils into 8 categories. They are: Alluvial Soil, Black Cotton Soil, Red & Yellow Soil, Laterite Soil, Mountainous or Forest Soil, Arid or Desert Soil, Saline and Alkaline Soil, Peaty and Marshy Soil.", "source": null}, {"id": 390, "topic": "Soil", "question": "Which of the following pairs of 'soil - characteristics' is correct? I. Sandy - proportion of fine particles is relatively higher II. Clayey - greater proportion of big particles", "options": {"a": "Only I", "b": "Neither I nor II", "c": "Both I and II", "d": "Only II"}, "answer": "b", "explanation": "Neither I nor II. Sandy Soil Consists of small particles of weathered rock; One of the poorest types of soil for growing plants (very low nutrients and poor water holding capacity); Good forF the drainage system; Usually formed by the breakdown or fragmentation of rocks like granite, limestone and quartz. Clay Soil: Smallest particles (tightly packed together with each other with very little or no airspace); Good water storage qualities; Very sticky to touch when wet but smooth when dried; Densest and heaviest type of soil which does not drain well or provide space for plant roots to flourish.", "source": null}, {"id": 391, "topic": "Soil", "question": "Which of the following factors of soil formation determines the accumulation of the soil ?", "options": {"a": "Fauna", "b": "Flora", "c": "Relief", "d": "Parent rock"}, "answer": "c", "explanation": "Relief: Altitude and slope, determine accumulation of soil. Other Factors: Fauna is all of the animal life present in a particular region or time. Flora is all the plant life present in a particular region or time, generally the naturally occurring native plants.", "source": null}, {"id": 392, "topic": "Soil", "question": "Statement I: In terrace farming, different crops are grown in alternate rows and are sown at different times to protect the soil from rain wash. Statement II: In contour ploughing, different crops are grown in alternate rows and are sown at different times to protect the soil from rain wash.", "options": {"a": "Only Statement I is correct", "b": "Only Statement II is correct", "c": "Both Statements I and II are correct", "d": "Neither Statement I nor Statement II is correct"}, "answer": "d", "explanation": "Neither Statement I nor Statement II is correct. Intercropping crops are grown in alternate rows and are sown at different times to protect the soil from rain wash. Contour ploughing - Process of cutting furrows into the slope of the land in order to control the flow of water.", "source": null}, {"id": 393, "topic": "Soil", "question": "In which of the soil conservation methods in the coastal and dry regions, rows of trees are planted to check the wind movement to protect soil cover?", "options": {"a": "Mulching", "b": "Sheelter belts", "c": "Rock dam", "d": "Contour barriers"}, "answer": "b", "explanation": "Shelterbelts. Mulching: The bare ground between plants is covered with a layer of organic matter like straw. It helps to retain soil moisture. Contour: barrie rs: Stones, grass, soil are used to build barriers along contours. Trenches arre made in front of the barriers to collect water.", "source": null}, {"id": 394, "topic": "Soil", "question": "Identify the step that is NOT a part of decomposition.", "options": {"a": "Leaching", "b": "Humification", "c": "Catabolism", "d": "Soil erosion"}, "answer": "d", "explanation": "Soil erosion is the denudation or wearing away of the upper layer of soil. It is a form of soil degradation. There are five steps of decomposition. These are fragmentation, leaching, catabolism, humification, and mineralization.", "source": null}, {"id": 395, "topic": "Soil", "question": "Statement I: Climate, parent material, and topography are important factors that influence soil formation. Statement II: Landslides are a major factor responsible for soil formation.", "options": {"a": "Only Statement I is correct", "b": "Only Statement II is correct", "c": "Both Statements I and II are correct", "d": "Neither Statement I nor Statement II is correct"}, "answer": "a", "explanation": "Only Statement I is correct. Soil formation is influenced mainly by climate, parent material, topography, organisms, and time; landslides do not affect soil formation directly.", "source": null}, {"id": 396, "topic": "Soil", "question": "What do you call the weight a soil can withstand before severe damage occurs to the structure of the soil?", "options": {"a": "Field capacity", "b": "Bearing capacity", "c": "Bulk density", "d": "Buffering capacity"}, "answer": "b", "explanation": "Bearing capacity is the capacity of soil to support the loads that are applied to the ground above. Field capacity is the amount of soil moisture or water content held in the soil after excess water has drained away and the rate of downward movement has decreased. Bulk density is defined as the mass of the many particles of the material diivided by the total volume they occupyi. Buffer capacity refers to the amount of acid or base a buffer can neutralise before the pH changes by a large amount.", "source": null}, {"id": 397, "topic": "Soil", "question": "__________ develops on crystalline igneous rocks in areas of low rainfall in the eastern and southern part of the Deccan Plateau.", "options": {"a": "Red soil", "b": "Black soil", "c": "Alluvial soil", "d": "Arid soil"}, "answer": "a", "explanation": "Red soil. It contains a high percentage of iron content, which is responsible for its colour.", "source": null}, {"id": 398, "topic": "Soil", "question": "Consider the following statements regarding soil horizons: Statement I: The A-horizon, also called the topsoil, contains humus and is rich in organic materials. Statement II: The C-horizon is also called humus layer and is rich in organic matter. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. A-horizon layer is the top layer of soil which is also known as a humus layer and is mainly rich in organic materials. B-horizon is typically a mineral subsurface horizon and is a zone of accumulation, called illuviation. C- horizon: This soil layer lies beneath the B horizon and consists essentially of the more or less weathered parent rock. Bedrock: Bedrock in geology is a solid rock that lies under loose softer material within the crust of Earth or another terrestrial planet.", "source": null}, {"id": 399, "topic": "Soil", "question": "_____ are thick deposits of glacial clay and other materials embedded with moraines.", "options": {"a": "Karewas", "b": "Bhabars", "c": "Duars", "d": "Duns"}, "answer": "a", "explanation": "Karewas are lacustrine deposits (deposits in a lake) in the valley of Kashmir and in the Bhaderwah valley of the Jammu division of Jammu and Kashmir. These are the flat-topped mounds that border the Kashmir valley on all sides.", "source": null}, {"id": 400, "topic": "Soil", "question": "_______ is a deep red soil found in tropical regions and often developed on mafic igneous bedrock.", "options": {"a": "Arid", "b": "Pedocal", "c": "Laterite", "d": "Saline"}, "answer": "c", "explanation": "Laterite. Arid soils are formed from the fragmentation of adjacent rocks and are largely blown from the Indus valley area and coastal regions. Saline soils are formed whenever climate, soil, and hydrological conditions favor the accumulation of soluble salts in the root zone.", "source": null}, {"id": 401, "topic": "Soil", "question": "Consider the following statements: Statement I: Diastrophism is the process that moves, elevates or builds up portions of the Earth’s crust. Statement II: Weathering is the process of molten rock (magma) erupting onto the Earth’s surface. Which of the following is correct?", "options": {"a": "Both Statement I and II are correct", "b": "Both Statement I and II are incorrect", "c": "Statement I is correct but Statement is incorrect", "d": "Statement I is incorrect but Statement II is correct"}, "answer": "c", "explanation": "Statement I is correct but Statement II is incorrect. Denudation is the process of wearing away the Earth's surface by weathering and erosion. Volcanism is the process of molten rock (magma) erupting onto the Earth's surface. Vegetation", "source": null}, {"id": 402, "topic": "Vegetation", "question": "Name the state in which The Bhitarkanika Mangroves are located?", "options": {"a": "Odisha", "b": "Andhra Pradesh", "c": "Tamil Nadu", "d": "West Bengal"}, "answer": "a", "explanation": "Odisha. The Bhitarkanika Mangroves ecosystem is one of the largest in India and is situated in the Kendrapara district. It is known for its rich biodiversity, including saltwater crocodiles, migratory birds, and mangrove forests. The area is protected as the Bhitarkanika National Park and is recognized for its ecological importance.", "source": "SSC Stenographer 7/08/2025 (Shift 3)"}, {"id": 403, "topic": "Vegetation", "question": "The Ebony, Mahogany, Cinchona etc. are trees found in which type of forests in India?", "options": {"a": "Tropical Deciduous Forests", "b": "Thorny Forests", "c": "Mangrove Forests", "d": "Tropical Evergreen Forests"}, "answer": "d", "explanation": "Tropical Evergreen Forests are restricted to heavy rainfall areas of the Western Ghats and the island groups of Lakshadweep, Andaman and Nicobar, upper parts of Assam and Tamil Nadu coast. Other trees are rosewood, and rubber. Tropical Deciduous Forests Teak, Bamboos, sal, shisham. Thorny Forests - Acacias, palms, euphorbias and cacti. Mangrove Forests - Sundari trees, Palm, Coconut.", "source": null}, {"id": 404, "topic": "Vegetation", "question": "Consider the following statements regarding forests in India: Statement I: Magnolia and Laurel trees are typically found in Montane forests of India. Statement II: Montane forests show variation with altitudee, including evergreen broad-leaf trees between 1000–2000 metemrs and coniferous trees between 1500–3000 meters. Which of the above statements is/are correct? e", "options": {"a": "Only I", "b": "Only II", "c": "Boeth I and II", "d": "Neither I nor II II Srol.404."}, "answer": "c", "explanation": "Both I and II. In mountainous areas, temperature decreases with altitude, leading to a change in vegetation. Between 1000–2000 meters, wet temperate forests with evergreen broad-leaf trees like oaks and chestnuts are found. Between 1500–3000 meters, coniferous trees such as pine, deodar, and cedar dominate, mainly on the southern slopes of the Himalayas. Higher elevations feature temperate grasslands, and above 3600 meters, alpine vegetation takes over with trees like silver fir, junipers, and pines.", "source": null}, {"id": 405, "topic": "Vegetation", "question": "________ leaves are used to make bidis.", "options": {"a": "Neem", "b": "Champa", "c": "Betel", "d": "Tendu"}, "answer": "d", "explanation": "Tendu tree (Diospyros melanoxylon Roxb.) belonging to Family Ebenaceae.", "source": null}, {"id": 406, "topic": "Vegetation", "question": "Sundari trees are found in which type of forests in India?", "options": {"a": "Mangrove forests", "b": "Tropical deciduous forests", "c": "The thorn forests and scrubs", "d": "Tropical evergreen forests"}, "answer": "a", "explanation": "Mangrove forests. Sundari tree is the most abundant tree in the mangrove forests of the Sunderban delta in West Bengal and the Andaman and Nicobar Islands. The Sunderbans are named after the Sundari tree. Mangrove forests grow only at tropical and subtropical latitudes near the equator because they cannot withstand freezing temperatures. Uppu ponna, Boddu ponna, Urada, Mada, Telli Mada, Gundu mada, Kadili, Palm, coconut, keora, agar and Bella are some of the typical vegetation of the mangroves. -", "source": null}, {"id": 407, "topic": "Vegetation", "question": "Which of the following states has mangrove forests?", "options": {"a": "Telangana", "b": "Andhra Pradesh", "c": "Rajasthian", "d": "Manipur"}, "answer": "b", "explanation": "Andhra Pradesh. Mangroves are practically evergreen with thick leathery leaves. Such types of forests are found in the deltas of Sundarbans, Mahanadi, the Godavari, Krishna, Kaveri rivers and in the Andaman and Nicobar Islands.", "source": null}, {"id": 408, "topic": "Vegetation", "question": "In which of the following regions is the tropical evergreen forests found in India?", "options": {"a": "Eastern Ghats", "b": "Western Ghats", "c": "Rann of Kutch", "d": "Thar Desert"}, "answer": "b", "explanation": "Western Ghats. Tropical evergreen forests are found on the western slopes of the Western Ghats, northeastern hills, and Andaman and Nicobar Islands. They thrive in warm, humid areas with over 200 cm of annual rainfall and temperatures above 22°C. These forests are dense, with tall trees reaching up to 60 meters and remain green year-round. Common species include rosewood, mahogany, and ebony.", "source": null}, {"id": 409, "topic": "Vegetation", "question": "In which of the following parts of India are thorn forests and scrub forests found?", "options": {"a": "South-eastern India", "b": "North-eastern India", "c": "North-western India", "d": "South-western India"}, "answer": "c", "explanation": "North-western India. Thorn and scrub forests are a type of natural vegetation found in regions that receive less than 70 cm of annual rainfall. These regions typically experience dry and arid climatic conditions, and the vegetation here has adapted to conserve water and withstand harsh environments. It is found in parts of northwestern India, central Deccan Plateau, and parts of the Thar Desert. The main plant species include Acacia (Babool), Cactus, Euphorbias, and Palms.", "source": null}, {"id": 410, "topic": "Vegetation", "question": "Which of the following statements is NOT true about the moist deciduous forests of India?", "options": {"a": "They grow in regions with rainfall of 100-200 cm.", "b": "They are found in the foothills of Himalayas.", "c": "They are found in the plains of Bihar and Uttar Pradesh.", "d": "Sal, amla, shisham and mahua are some of the main species of these forests."}, "answer": "c", "explanation": "Moist deciduous forests exist mostly in the eastern part of the country – northeastern states, along the foothills of the Himalayas, Jharkhand, West Odisha and Chhattisgarh, and on the eastern slopes of the Western Ghats. The dry deciduous forests are found in areas having rainfall between 100 cm and 70 cm. These forests are found in the rainier parts of the Peninsular plateau and the plains of Bihar and Uttar Pradesh.", "source": null}, {"id": 411, "topic": "Vegetation", "question": "Which of the following statements is/are correct? Statement 1: Deciduous forests are found on the foothills of the Himalayas. Statement 2: Alpine forests occur at altitudes between 2,900 to 3,500 m in the Himalayas.", "options": {"a": "Only Statement 1 is correct", "b": "Only Statement 2 is correct", "c": "Both Statement 1 and 2 are correct", "d": "Neither Statement 1 nor 2 is correct"}, "answer": "c", "explanation": "Both Statement 1 and 2 are correct. Deciduous is an evergreen forest where a majority of the trees remain “green” throughout the year because they shed leaves not seasonally but at various periods of the year. Example - Maple, oak, and elm. Alpine forests: Example Spruce and birch.", "source": null}, {"id": 412, "topic": "Vegetation", "question": "In the Himalayas, the ________ temperature with increasing altitude causes the change in vegetation.", "options": {"a": "increasing", "b": "decreasing", "c": "fluctuating", "d": "stable"}, "answer": "b", "explanation": "decreasing. The Himalayan ranges show change in vegetation from tropical to tundra. Since air is less dense at higher altitudes, its molecules are spread farther apart than they are at sea level. These molecules have fewer collisions, so they produce less heat. At the bottom of the mountain, the temperature is high year-round while it much cooler at the top due to which it covered with snow.", "source": null}, {"id": 413, "topic": "Vegetation", "question": "Which one of the following statements regarding vegetation strata NOT correct?", "options": {"a": "Trees fall under the Top vertical strata.", "b": "The Second vertical contains shrubs and small trees.", "c": "The Bottom vertical contains medium-sized shrubs and trees.", "d": "The Middle vertical includes medium-sized shrubs and trees."}, "answer": "c", "explanation": "Bottom vertical - It contains the shortest plants in a forest ecosystem, such as mosses and ferns.", "source": null}, {"id": 414, "topic": "Vegetation", "question": "The natural vegetation of India broadly divided into ______ groups.", "options": {"a": "7", "b": "9", "c": "6", "d": "5"}, "answer": "d", "explanation": "5. Vegetation of India Tropical evergreen forest, Tropical deciduous forest, Thorny bushehs, Mountain vegetation and Mangrove forests.", "source": null}, {"id": 415, "topic": "Vegetation", "question": "In which type of forests are wild donkeys and camels founde in India?", "options": {"a": "Tropical evergreen forest", "b": "Mountain foremst", "c": "Thorny forests and bushes", "d": "Mangrove forest"}, "answer": "c", "explanation": "Thorny forests and bushes. Animals found in different forests India: Tropical Evergreen Forests Erlephants, Monkeys, Lemurs and Deer. Montane Forests - Leopard, Yak, Sheep and Goat. Mangrove forest - Royal Bengal Tiger. In terms of area, Madhya Pradesh has the largest forest area in the country. It is followed by Arunachal Pradesh, Chhattisgarh, Odisha and Maharashtra.", "source": null}, {"id": 416, "topic": "Vegetation", "question": "Sal, acacia and bamboo, which are types of Dry Tropical Forest, receive - what amount of annual rainfall?", "options": {"a": "From 51 cm to 151 cm", "b": "Between 200 and 250 cm", "c": "251 cm or more", "d": "Below 25 cm"}, "answer": "a", "explanation": "From 51 cm to 151 cm. Tropical forests (rainforests): rainforest is an area of tall, mostly evergreen trees and a high amount rainfall, Earth’s oldest living ecosystems, with some surviving in their present form for at least 70 million years. Types Tropical forests - Evergreen Rain (200 cm or more), Monsoon Deciduous (100 to 200 cm), Tropical Savanna (50 to 100 is cm), Dry Thorny Scrub (Semi-arid) (25 to is 50 cm), Desert (Arid) (Below 25 cm).", "source": null}, {"id": 417, "topic": "Vegetation", "question": "Which of the following is the most widespread forest type in India? is", "options": {"a": "Littoral and Swamp Forest", "b": "Tropical Thorn Forests", "c": "Montane Forests", "d": "Tropical Deciduous Forests"}, "answer": "d", "explanation": "Tropical Deciduous Forests (Monsoon Forests): It Found in India along the Equator belt between the tropic of Cancer and the tropic of Capricorn, (Major states - Madhya Pradesh, Uttar Pradesh, Chattisgarh, Odisha, Some Parts of Maharashtra).", "source": null}, {"id": 418, "topic": "Vegetation", "question": "What type of vegetation is found in the plateau of Meghalaya, Sahyadri is and the central and southern islands of the Nicobar group?", "options": {"a": "Dry Tropical Deciduous Vegetation", "b": "Dry Tropical Thorny Vegetation – a", "c": "Alpine Vegetation", "d": "Moist Tropical Semi - Evergreen Vegetation"}, "answer": "d", "explanation": "Moist Tropical Semi - Evergreen Vegetation are transitional forests between tropical wet evergreen forests and tropical deciduous forests. Examples - Laurel, rosewood, mesua, white cedar. Tropical Dry Deciduous Vegetation - Occurs in an irregular wide strip running from the foot of the Himalayas to Kanyakumari except in Rajasthan, Western Ghats and West in Bengal. Example - Teak, bamboo. - Tropical Thorn Forests - Found in Rajasthan, south-western Punjab, western Haryana, Kachchh and neighbouring parts of Saurashtra. Example - Babool, neem, cactii.", "source": null}, {"id": 419, "topic": "Vegetation", "question": "Plant varieties like bamboo, epiphytes, aini, semul, gutel and mundane are found in which type of Indian forest?", "options": {"a": "Alpine forest", "b": "Montane temperate forest", "c": "Moist tropical forest", "d": "Dry tropical forest"}, "answer": "c", "explanation": "Moist tropical forests have 200-250 cm annual rainfall, 24-27°C temperature. Alpine forest - Common in A both the main Himalayan regions as well as the barren cold deserts of the Trans of Himalaya. Examples - Black juniper and willow. Montane temperate forest - Mainly generated in Northern middle of Himalayas ranges (1801 to 3001 m) and Southern Niligiri higher Mountain ranges. Examples - Ferns, oak and maple. Dry tropical forest - Mainly found in Indian Northern Hilly regions and some states of Southern India. Examples - Sal, acacia, mangoes.", "source": null}, {"id": 420, "topic": "Vegetation", "question": "Which of the following states is associated with the tropical thorn forests?", "options": {"a": "Andaman and Nicobar Islands", "b": "West Bengal", "c": "Madhya Pradesh", "d": "Mizoram"}, "answer": "c", "explanation": "Madhya Pradesh. Tropical Thorn Forests and Scrubs (receive rainfall less than 50 cm) - It includes semi - arid areas of south west Punjab, Haryana, Rajasthan, Gujarat, Madhya Pradesh and Uttar Pradesh. Trees like – Babool, ber, wild date palm, Khair tree.", "source": null}, {"id": 421, "topic": "Vegetation", "question": "Mosses and lichens are found in which kind of forest?", "options": {"a": "Tropical Rainforest", "b": "Temperate Forest", "c": "Coniferous Forest", "d": "Tundra Forest"}, "answer": "d", "explanation": "Tundra Forest - It has relatively little rain and extremely cold temperatures. It is composed of dwarf shrubs, sedges, and grasses.", "source": null}, {"id": 422, "topic": "Vegetation", "question": "Major plantations are found in the __________ region of the world.", "options": {"a": "Tropical", "b": "Grassland", "c": "Temperate", "d": "Desert"}, "answer": "a", "explanation": "Tropical. Plantation crops - A type of commercial farming where a single crop of tea, coffee, sugarcane, cashew, rubber, banana or cotton are grown. Major plantations - Rubber in Malaysia, coffee in Brazil, tea in India andF Sri Lanka. Major food crops - Wheat, rice, maize and millets. Jute and cotton are fibre crops.", "source": null}, {"id": 423, "topic": "Vegetation", "question": "Which of the following is an example of a terrestrial ecosystem?", "options": {"a": "Ponds", "b": "River", "c": "Grasslands", "d": "Oceans"}, "answer": "c", "explanation": "Grasslands. Terrestrial ecosystem - It is a land-based community of species that includes biotic and abiotic interactions in a specific area. Examples - Forest, Grasslands, Tundra, Desert. Aquatic ecosystem - It is related to water. It includes Freshwater ecosystem (Pond, lake, river) and Marine ecosystem (Ocean, sea or estuary). Kelp is a type of large, brown seaweed that grows in shallow, nutrient-rich saltwater near coastal fronts around the world.", "source": null}, {"id": 424, "topic": "Vegetation", "question": "Which of the following statements is incorrect? Statement 1: Taiga forests are found in the higher latitudes (50°–70°) of the Northern Hemisphere and are mainly coniferous. Statement 2: Tundra forests are coniferous and found in the higher latitudes of the Northern Hemisphere.", "options": {"a": "Only Statement 1 is incorrect", "b": "Only Statement 2 is incorrect", "c": "Both statements are incorrect", "d": "Neither statement is incorrect"}, "answer": "b", "explanation": "Only Statement 2 is incorrect. Taiga - Trees found are mainly cone-bearing trees like spruce, pine, fir, and hemlock. Veld - Open, uncultivated country or grassland in southern Africa. Tundra - A vast, flat, treeless Arctic region of Europe, Asia, and North America in which the subsoil is permanently frozen. Llanos - A vast tropical grassland plain situated to the east of the Andes in Colombia and Venezuela, in northwestern South America. h", "source": null}, {"id": 425, "topic": "Vegetation", "question": "In India, trees of which forest type shed their leaves for about six to eight weeks in dry summer?", "options": {"a": "Tropical Deciduous Foreests", "b": "Tropical Evergreen Forests", "c": "Montane Foremsts", "d": "Tropical Thorn Forests and Scrubs"}, "answer": "a", "explanation": "Tropical Deciduous Forests. These forests spread over regions which receiv e rainfall between 70-200 cm. Tendu, palas, amaltas, bel, khair, arxlewood, etc are the common trees of these forests.", "source": null}, {"id": 426, "topic": "Vegetation", "question": "In India, what is the mean annual average temperature in subtropical vegetation zone ?", "options": {"a": "Above 24° C", "b": "7°C to 17°C", "c": "Below 7°C", "d": "17°C to 24°C"}, "answer": "d", "explanation": "17°C to 24°C. Natural vegetation - The plant life that grows in an area without the influence of human activity. Types - Forests, Grasslands (divided into savannas, steppes and prairies, depending on the climate and other environmental factors), Deserts (These are arid regions with very little rainfall and sparse vegetation), Tundra (This is a cold, treeless region found in the Arctic and on high mountain slopes), Wetland (These are areas with water-logged soil, such as marshes).", "source": null}, {"id": 427, "topic": "Vegetation", "question": "Which of the following pairs of countries - name of grassland is correct? I. Argentina - Pampas, II. Brazil - Steppe", "options": {"a": "Neither I nor II", "b": "Only II", "c": "Only I", "d": "Both I and II"}, "answer": "c", "explanation": "Only I. Steppe - Europe and North Asia, Brazil - Campos, Pustaz- Hungary, Prairies - USA, Veld - South Africa, Downs - Australia, Canterbury - New Zealand, Savannah - Africa, Taiga - Europe and Asia.", "source": null}, {"id": 428, "topic": "Vegetation", "question": "The wet temperate type of forests are found between a height of _______ metres.", "options": {"a": "2000 and 3000", "b": "1500 and 3000", "c": "1000 and 2000", "d": "500 to 1000"}, "answer": "c", "explanation": "1000 and 2000. Wet temperate forests: Average annual rainfall and temperature in wet temperate forests are 150-300 cm and 11°C-14°C respectively. The relative humidity is over 80% on average. Oak trees and chestnut trees are found here. Other important species include Chilauni, Indian chestnut, Deoda r, Machilus, Cinnamomum, Litsea, Plum, Blue pine, Birch, Oak, Hemlock, etc.", "source": null}, {"id": 429, "topic": "Vegetation", "question": "Thorny bushes are found in _____ region.", "options": {"a": "mediterranean", "b": "polar", "c": "dry desert", "d": "high rainfall"}, "answer": "c", "explanation": "dry desert. In areas where there is less than 70 cm of rainfall, thorn forests and shrubs are found in the natural vegetation. This type of vegetation is found in the north-western parts of the country, which include the semi-arid regions of Gujarat, Rajasthan, Chhattisgarh, Madhya Pradesh, Uttar Pradesh and Haryana.", "source": null}, {"id": 430, "topic": "Vegetation", "question": "Consider the following statements about forests: Statement I: Temperate evergreen forests are mainly located in the mid-latitudinal coastal regions such as southeastern USA, southern China, and southeastern Brazil. Statement II: Tropical rainforests are mainly located in the mid-latitudinal coastal regions. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Temperate evergreen forests are mainly located in the mid-latitudinal coastal regions. Tropical rainforests are mainly located in the tropics, between the latitudes of 23.5°N (the Tropic of Cancer) and 23.5°S (the Tropic of Capricorn)—the tropics.", "source": null}, {"id": 431, "topic": "Vegetation", "question": "The birds like pheasant and monals are found in which type of forest?", "options": {"a": "Temperate deciduous forest", "b": "Tropical evergreen forest", "c": "Temperate evergreen forest", "d": "Mediterranean forests"}, "answer": "a", "explanation": "Temperate deciduous forest. As we go towards higher latitudes, there are more temperate deciduous forests. These are found in the north eastern part of the USA, China, New Zealand, Chile and also found in the coastal regions Western Europe. They shed their leaves in the dry season. Common trees include oak, ash, and beech. Animals commonly found in these forests are deer, foxes, and wolves.", "source": null}, {"id": 432, "topic": "Vegetation", "question": "A species of grass named ______ is on the verge of extinction due to its insensitivity towards the environment.", "options": {"a": "Helianthus annuus", "b": "Saccharum officinarum", "c": "Hubbardia heptaneuron", "d": "Bellis perennis"}, "answer": "c", "explanation": "Hubbardia heptaneuron. The native range of this species is India (Karnataka). It is an annual and grows primarily in the seasonally dry tropical biome. Helianthus annuus (Common Sunflower).", "source": null}, {"id": 433, "topic": "Vegetation", "question": "What type of forests are found north and south of the equator between 40° and 60° where rainfall is high, between 500-1500 mm in a year?", "options": {"a": "Taiga forests", "b": "Coniferous forests", "c": "Mediterranean forests", "d": "Temperate deciduous forests"}, "answer": "d", "explanation": "Temperate deciduous forests.", "source": null}, {"id": 434, "topic": "Vegetation", "question": "Which type of biome is located Eastern North America, Western Europe, and Northeast Asia?", "options": {"a": "Tropical Rainforest Biomes", "b": "Coniferous Forest Biomes", "c": "Aquatic Biomes", "d": "Deciduous Forest Biomes"}, "answer": "d", "explanation": "Deciduous Forest Biomes This biome experiences all four seasons, these forests are divided into five zones based on the heights of the trees. The soil is particularly fertile and nutrient-rich and is located in North America (Canada, the United States, and Mexico), Europe, and western regions of Asia (Japan, China, North Korea, South Korea, and parts of Russia).", "source": null}, {"id": 435, "topic": "Vegetation", "question": "Consider the following statements regarding Social Forestry India: Statement I: The National Commission on Agriculture (1976) classified Social Forestry into 5 categories. Statement II: The motto of the social forestry is good management and protection of the forest with the development of the environment. Which of the above statements is/are incorrect?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II of"}, "answer": "a", "explanation": "Only I. The National Commission on Agriculture (1976) classified Social Forestry into 3 categories - Urban forestry, Rural forestry and Farm forestry. Social forestry means the management and protection of forests and afforestation on barren lands with the purpose of helping in the environmental, social and rural development.", "source": null}, {"id": 436, "topic": "Vegetation", "question": "Which of the following statements about forests is INCORRECT?", "options": {"a": "In a forest, trees form the uppermost layer of vegetation. h", "b": "Forests protect the soil from erosion.", "c": "In a forest, shrubs form the lo west layer of vegetation.", "d": "Forests influence climate, water cycle and air quality."}, "answer": "c", "explanation": "The lamyer of vegetation in the forest which is just below the shrub layer is called the herb layer. The herb layer consists meainly of herbs, ferns and grasses. This layer is the lowest layer of vegeteation in the forest (having leafy plants). Very little sunlight remains for trhe plants in the herb layer.", "source": null}, {"id": 437, "topic": "Vegetation", "question": "Coringa is a beautiful _____ forest where the Godavari joins the backwaters in of Bay of Bengal.", "options": {"a": "evergreen", "b": "coniferous", "c": "mangrove", "d": "deciduous"}, "answer": "c", "explanation": "Mangrove. Coringa is the second largest mangrove formation in India, next to Sundarbans. The Coringa mangroves are bordered on the northern - side by Kakinada Bay.", "source": null}, {"id": 438, "topic": "Vegetation", "question": "Which of the following trees will you find in the Littoral forests?", "options": {"a": "Chinar", "b": "Ebony", "c": "Sundari", "d": "Cypress"}, "answer": "c", "explanation": "Sundari tree is found in Sundarbans delta in West Bengal in Mangrove forest (Littoral forests). Climate in", "source": null}, {"id": 439, "topic": "Climate", "question": "Which of the following is NOT a primary factor affecting the variation of insolation on Earth?", "options": {"a": "Presence of water bodies in an area", "b": "Rotation of the Earth on its axis", "c": "Transparency of the atmosphere", "d": "Angle of inclination of the Sun's rays"}, "answer": "a", "explanation": "Presence of water bodies in an area. Insolation refers to the incoming solar radiation received on Earth’s surface. Its primary variation depends on factors like the rotation of the Earth on its axis, which causes day and night; the angle of inclination of the Sun’s rays, which changes with latitude and seasons; and the transparency of the atmosphere, which determines how much radiation penetrates through clouds, dust, and gases. The presence of water bodies, however, influences the distribution and moderation of temperature rather than the actual amounit of insolation received.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 440, "topic": "Climate", "question": "The highest rainfall in India gets recorded in the Khasi and Jaintia Hills. In which state will you find these hills?", "options": {"a": "Meghalaya", "b": "Nagaland", "c": "Arunachal Pradesh", "d": "Assam"}, "answer": "a", "explanation": "Meghalaya. The Khasi and Jaintia Hills are part of the Garo-Khasi-Jaintia range, which forms the central and eastern parts of the state of Meghalaya. These hills are renowned for receiving some of the highest rainfall in the world. Their unique funnel-like topography traps the moisture-laden winds from the Bay of Bengal branch of the Southwest Monsoon, forcing them to rise and shed their moisture as extremely heavy orographic rainfall. Mawsynram and Cherrapunji (Sohra), the two wettest places on Earth, are located in the Khasi Hills.", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 441, "topic": "Climate", "question": "Tropical cyclones originate over which of the following regions?", "options": {"a": "Bay of Bengal, Arabian Sea and the Indian Ocean", "b": "Mediterranean Sea, Pacific Ocean and the Indian Ocean", "c": "Bay of Bengal, Arabian Sea and the Atlantic Ocean", "d": "Mediterranean Sea, Arabian Sea and the Indian Ocean"}, "answer": "a", "explanation": "A tropical cyclone is formed over warm ocean waters near the equator. The centre of a cyclone is very calm and clear with very low air pressure. The average speed is 120 kmph. They move from east to west under the influence of trade winds.", "source": null}, {"id": 442, "topic": "Climate", "question": "Which of the following statements regarding orographic rainfall is correct?", "options": {"a": "It occurs mainly during summer and is common over equatorial doldrums in theCongo basin.", "b": "This type of precipitation occurs when warm, humid air strikes on a mountain range.", "c": "This precipitation is heavy but of short duration, highly localised and is associated with minimum amount of cloudiness.", "d": "This type of precipitation is characterised by seasonal reversal of winds that carry oceanic moisture."}, "answer": "b", "explanation": "Orographic rainfall occurs when moist air hits a mountain and is forced to rise. As the air ascends, it cools, leading to condensation and saturation. The excess moisture then falls as precipitation on the windward slopes.", "source": null}, {"id": 443, "topic": "Climate", "question": "The climatic diversity of India is characterised by its distinctiveness, and one of the following factors does NOT contribute to it is ___________.", "options": {"a": "longitudinal extent", "b": "latitudinal extent", "c": "topography", "d": "vegetation"}, "answer": "b", "explanation": "The latitudinal extent influences temperature and rainfall patterns due to variations in solar energy and atmospheric density. However, it is not a major factor contributing to India's climatic diversity compared to longitudinal extent, topography, and vegetation.", "source": null}, {"id": 444, "topic": "Climate", "question": "Which state lies in the rain shadow region of the Arabian Sea branch of the southwest monsoon?", "options": {"a": "Tamil Nadu", "b": "Gujarat", "c": "Goa", "d": "Kerala"}, "answer": "a", "explanation": "Tamil Nadu. The Bay of Bengal monsoon branch strikes Myanmar and southeast Bangladesh, but the Arakan Hills deflect much of it towards India. It enters West Bengal and Bangladesh from the south - southeast, splitting into two branches. One moves westward along the Ganga plains to the Punjab plains, while the other ascends the Brahmaputra valley, causing rains in the northeast. A sub-branch hits Meghalaya's Khasi hills. The Tamil Nadu coast remains dry as it lies parallel to the Bay of Bengal monsoon branch and in the rain-shadow region of the Arabian Sea branch.", "source": null}, {"id": 445, "topic": "Climate", "question": "Match the following hot winds with their respective regions: List I (Hot Winds): a. Loo, b. Chinook, c. Sirocco, d. Harmattan. List II (Regions): i. North Africa & South Europe, ii. North and Northwestern India, iii. Guinea Coast, iv. USA (Rocky Mountain region)", "options": {"a": "a – ii, b – iv, c – i, d – iii", "b": "a – iii, b – ii, c – i, d – iv", "c": "a – ii, b – i, c – iv, d – iii", "d": "a – iv, b – iii, c – ii, d – i"}, "answer": "a", "explanation": "Loo - These are strong, gusty, hot, dry winds blowing during the day over the north and northwestern India. In West Bengal, similar storms are known as 'Kaal Baisakhi'. They blow in the summer season. Other hot winds - Foehn (Europe), Santa Ana (USA), Harmattan (Guinea coast), Khamsin (Egypt).", "source": null}, {"id": 446, "topic": "Climate", "question": "The climate of a place is NOhT affected by which of the following?", "options": {"a": "Relief", "b": "Type of soil B", "c": "Location", "d": "Distance from the sea"}, "answer": "b", "explanation": "Type of soil. Celimate refers to the long-term conditions of a specific region. The chanmges in climate within region are influenced by its atmospheric and environmental conditions. The six major factoers that influence the climate of a location are latitude, altitude, presseure, and wind systems, distance from the sea (continentality), ocean crurrents, and relief features. F", "source": null}, {"id": 447, "topic": "Climate", "question": "Which region in India receives less rainfall in summer, but heavy rainfall in winter season due to the retreating north easterly winds?", "options": {"a": "Southern coastal region", "b": "Western coastal region", "c": "Northern coastal region", "d": "Eastern coastal region"}, "answer": "d", "explanation": "Eastern coastal region stretches from West Bengal in the north to Tamil Nadu in the south and passes through Andhra Pradesh and Odisha. The retreating or North-East monsoon brings heavy rainfall to the Coromandel coast from October to December. This monsoon, blowing from land to sea, gathers moisture and causes rain, making it the primary rainy season for southeastern India, including Tamil Nadu. The Coromandel coast lies between Pulicat Lake and Kanyakumari.", "source": null}, {"id": 448, "topic": "Climate", "question": "Consider the following statements regarding pre-monsoon rains in India: Statement I: Mango showers are pre-monsoon rains that occur in Kerala, Karnataka, and Tamil Nadu. Statement II: Kalbaisakhi, also known as Nor’westers, are violent thunderstorms occurring during summer in West Bengal and Assam. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Mango showers are pre-monsoon rains that occur at the end of the summer season, helping the mangoes ripen; These are also called April rains.", "source": null}, {"id": 449, "topic": "Climate", "question": "The tropical cyclones in Australia are known as ________.", "options": {"a": "hurricaines", "b": "willy-willies", "c": "cycilones", "d": "typhoons"}, "answer": "b", "explanation": "willy-willies. Tropical cyclones are intense low-pressure areas that form in the atmosphere between 30° N and 30° S latitudes. They can extend up to 1,000 km horizontally and 12–14 km vertically from the surface. Tropical cyclones rotate counterclockwise in the Northern Hemisphere and clockwise in a the Southern Hemisphere. Their names in different countries: Hurricanes - United States, Typhoons - China Sea and Pacific Ocean, Cyclones - Indian Ocean.", "source": null}, {"id": 450, "topic": "Climate", "question": "What is the duration of monsoon in India?", "options": {"a": "100-120 days", "b": "40-60 days", "c": "150-200 days", "d": "50-80 days"}, "answer": "a", "explanation": "100-120 days. The monsoon season in India lasts from June to September. The southwest monsoon (summer monsoon) brings the majority of annual rainfall, blowing from the sea to land across the Indian Ocean, Arabian Sea, and Bay of Bengal. In contrast, the northeast monsoon (winter monsoon) blows from land to sea.", "source": null}, {"id": 451, "topic": "Climate", "question": "Which of the following group of months is the coldest in North India?", "options": {"a": "February and March", "b": "September and October", "c": "December and January", "d": "October and November"}, "answer": "c", "explanation": "In December and January, temperatures decrease from south to north, with the Northern Plains averaging 10°C to 15°C, while Chennai on the eastern coast sees averages of 24°C to 25°C. Days are warm, and nights are cold during this period.", "source": null}, {"id": 452, "topic": "Climate", "question": "Which of the following parts of the mountain will receive the most rainfall from moisture-laden winds?", "options": {"a": "Windward side", "b": "Leeward side", "c": "Upward side", "d": "Relief side"}, "answer": "a", "explanation": "Windward side - The on-shore moisture laden winds are forced to rise after striking against the mountains and give heavy rainfall on the windward side. Leeward side - It receives little to no rainfall and is known as the rain shadow area. Orographic rainfall occurs when saturated air mass comes across a mountain.", "source": null}, {"id": 453, "topic": "Climate", "question": "Which theory describes the collective effects of changes in Earth's movements on its climate over thousands of years?", "options": {"a": "Milankovitch theory", "b": "Copernicus' heliocentric theory", "c": "Plate tectonics theory", "d": "Continental drift theory"}, "answer": "a", "explanation": "Milankovitch theory. Copernican heliocentrism, proposed by Copernicus in 1543, positions the Sun at the center, with Earth and other planets orbiting it. Plate tectonics is a scientific theory that explains how major landforms are created as a result of Earth's subterranean movements.", "source": null}, {"id": 454, "topic": "Climate", "question": "Which of the following groups of places in India has little differences in day and night temperatures?", "options": {"a": "Chennai and Thiruvananthapuram", "b": "Jaipur and Jaisalmer", "c": "Bhopal and Indore", "d": "Jammu and Kashmir"}, "answer": "a", "explanation": "Chennai and Thiruvananthapuram. Thar desert experiences the highest diurnal range of temperature. This is because of the fact that sand (found in ample quantity in this region) gains and loses heat very quickly. As a result of this phenomenon, there is a wide difference between day and night temperatures in this region. The day temperature may rise to 50°C and drop down to near 15°C the same night. There is no sea closer to this area and hence there is no moderating effect.", "source": null}, {"id": 455, "topic": "Climate", "question": "Which of the following statements about climate is INCORRECT?", "options": {"a": "India’s climate has characteristics of tropical as well as subtropical climates.", "b": "Coastal areas of India experience less contrasts in temperature conditions as compared to the interior of the country.", "c": "‘Monsoon’ type of climate is found mainly in south and southeast Asia.", "d": "India experiences comparatively stronger winters as compared to central Asia."}, "answer": "d", "explanation": "Central Asia generally experiences stronger winters compared India due to its continental location and lack of moderating influences like large bodies of water. The Climate of India is the tropical monsoon climate type with regional variations in temperature, precipitation, and amount of rainfall because of the large geographical area.", "source": null}, {"id": 456, "topic": "Climate", "question": "Western disturbances are responsible for:", "options": {"a": "dusty storms in eastern coastal area of India", "b": "hot winds during summers in northern India", "c": "extremely chilled weather of north - east India", "d": "rainfall during winters in north - western part of India h"}, "answer": "d", "explanation": "The western cyclonic disturbances which enter the Indian subcontinent from the west and the northwest during the weinter months, originate over the Mediterranean Sea and are brought into m India by the westerly jet stream.", "source": null}, {"id": 457, "topic": "Climate", "question": "According to Koeppen's Scheme of classification of climate, which of the following characteristics is associated with 'Group E' ?", "options": {"a": "The average temperature of the coldest month is –3°C or below", "b": "The average temperature for all months is below 10°C", "c": "The average temperature of the coldest month is higher than –3°C but below 18°C", "d": "The average temperature of the coldest month is 18°C or higher"}, "answer": "b", "explanation": "Climatic Groups According to Koeppen: A - Tropical: Average temperature of the coldest month is 18° C or higher. B - Dry Climates: Potential evaporation exceeds precipitation. C Warm Temperate: The average temperature of the coldest month of the (Mid-latitude) climates is higher than minus 3°C but below 18°C. D - Cold Snow Forest Climates: The average temperature of the coldest month is minus 3° C or below. H - High Land: Cold due to elevation.", "source": null}, {"id": 458, "topic": "Climate", "question": "El Nino is a climate pattern that describes the unusual warming of surface waters in which ocean?", "options": {"a": "Indian Ocean", "b": "Pacific Ocean", "c": "Atlantic Ocean", "d": "Arctic Ocean"}, "answer": "b", "explanation": "Pacific Ocean. El Nino is a complex weather system that occurs every 3-7 years, causing droughts, floods, to and extreme weather globally. It involves warm ocean currents off Peru's coast in the Eastern Pacific, affecting various regions, including India. El Nino is an extension of the warm equatorial current that temporarily replaces the cold Humboldt (Peruvian) Current, increasing water temperatures by 10°C.", "source": null}, {"id": 459, "topic": "Climate", "question": "In the context of local storms of hot weather season, Nor'Westers are:", "options": {"a": "the pre-monsoon showers that are a common phenomenon in Kerala and coastal areas of Karnataka", "b": "the dreiaded evening thunderstorms in Benigal and Assam a", "c": "the hot, dry and oppressing winds blowing in the Northern plains from Punjab to Bihar with higher intensity between Delhi and Patna", "d": "a nearby wind that blows coffee flowers in Kerala"}, "answer": "b", "explanation": "Nor Westers: Their notorious nature can be understood from the local nomenclature of ‘Kalbaisakhi’, a calamity of the month of Baisakh. These showers are useful for tea, jute and rice cultivation. In Assam, these storms are known as “Bardoli Chheerha”. Some Famous Local Storms: Blossom Shower: Useful for coffee flowers blooming in Kerala. Loo: Hot, dry and oppressing winds blowing in the Northern plains.", "source": null}, {"id": 460, "topic": "Climate", "question": "Which of the following States / Union Territories of India receives the highest average annual rainfall ?", "options": {"a": "Rajasthan", "b": "Ladakh", "c": "Meghalaya", "d": "Delhi"}, "answer": "c", "explanation": "Meghalaya. The maximum rainfall of this season is received in the north-eastern part of the country. Mawsynram in the southern ranges of the Khasi Hills receives the highest - average rainfall in the world. Mawsynram, the wettest place on the earth is also reputed for its stalagmite and stalactite caves. Rainfall in the Ganga valley decreases from the east to the west. Rajasthan and parts of Gujarat get scanty rainfall.", "source": null}, {"id": 461, "topic": "Climate", "question": "One term for the continuous movement of water through the lithosphere, atmosphere and hydrosphere is:", "options": {"a": "hydro equilibrium cycle", "b": "hydrological cycle", "c": "hydrostatical equilibrium", "d": "water circulation"}, "answer": "b", "explanation": "hydrological cycle. Components of the Hydrological Cycle Evaporation - Water changes from liquid to gas, primarily from bodies of water.", "source": null}, {"id": 462, "topic": "Climate", "question": "Identify a type of season that is NOT a part of the four seasons of India.", "options": {"a": "The southeast monsoon season", "b": "The southwest monsoon season", "c": "The hot weather season", "d": "The cold weather season"}, "answer": "a", "explanation": "The southeast monsoon season. Four main seasons can be identified in India: The hot weather season (March to May), The southwest monsoon season (June to September), The post - monsoon or retreating monsoon season (October to December), The cold weather season (January to February).", "source": null}, {"id": 463, "topic": "Climate", "question": "What is the name of the cold phase of the ENSO climate pattern that describes the unusual cooling of the surface waters of the region ?", "options": {"a": "NINO-3 region", "b": "ENSO-neutral", "c": "Trans-Nino", "d": "La Nina"}, "answer": "d", "explanation": "La Nina. In La Nina, the tropical Pacific trade winds become very strong and an abnormal accumulation of cold water occurs in the central and eastern Pacific Ocean. El Nino is a climate pattern that describes the unusual warming of surface waters in the eastern tropical Pacific Ocean. El Nino is the “warm phase” of a larger phenomenon called the El Nino-Southern Oscillation (ENSO).", "source": null}, {"id": 464, "topic": "Climate", "question": "Sea ice helps determine Earth's climate. According to this, what percentage of the sunlight falling on sea ice is reflected back into space ?", "options": {"a": "80%", "b": "70%", "c": "75%", "d": "85%"}, "answer": "a", "explanation": "80%. Sea ice reflects a significant portion of sunlight, which is essential for regulating Earth’s temperature. As sea ice diminishes, more solar energy is absorbed by the ocean, resulting in higher temperatures. This change affects global climate patterns and contributes to the acceleration of climate change. Albedo is the percentage of solar radiation reflected by a given surface.", "source": null}, {"id": 465, "topic": "Climate", "question": "Who is best known for his testimony on climate change to congressional committees in the 1980s, which helped raise wider awareness of the global warming issue?", "options": {"a": "James Hansen", "b": "Shen Kuo", "c": "Joseph Fourier", "d": "Svante Arrhenius:"}, "answer": "a", "explanation": "James Hansen. He is referred to as the “father of global warming” because of his early warnings about the phenomenon in the 1980s.", "source": null}, {"id": 466, "topic": "Climate", "question": "According to the Koppen climate classification system, ‘Am’ is the code for which type of climate?", "options": {"a": "Tropical wet and dry climate", "b": "Tropical monsoon climate", "c": "Humid subtropical climate", "d": "Marine west coast climate"}, "answer": "b", "explanation": "Tropical monsoon climate. Koeppen’s Classification of Climatic Regions of India is based on mean annual and monthly temperature and precipitation data. He identified five major climatic groups: four based on temperature (A, C, D, E for humid climates) and one on precipitation (B fohr dry climates). These groups are further divided into types, indicated bBy small letters that describe seasonality: f (no dry season), m (monsooen), w (winter dry), and s (summer dry). Climatic Regions of Indiam: Amw, As, Aw, BShw, BWhw, Cwg, Dfc, Et, E.", "source": null}, {"id": 467, "topic": "Climate", "question": "Assertion (A): The climate of a particular p lace is control
