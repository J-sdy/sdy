 2011, which of the following languages is spoken by the least population in India ?", "options": {"a": "Sanskrit", "b": "Dogri", "c": "Assamese", "d": "Konkani"}, "answer": "a", "explanation": "Sanskrit. The 2011 census identified 31 languages with over 1 million native speakers. Sanskrit is the only scheduled language having fewer than 1 million speakers. According to the census, 43.63% of Indians speak Hindi as their mother tongue, followed by Bengali at 8.03%, Marathi at 6.86%, Telugu at 6.7%, and Tamil at 5.7%.", "source": null}, {"id": 710, "topic": "Population", "question": "Consider the following statements regarding Census 2011 literacy data: 1. Lakshadweep had the lowest literacy rate among Union Territories at 76.24%. 2. Tamil Nadu was the most literate state with 94% literacy. Which of i the above statements is/are correcti? a", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "d", "explanation": "Neither 1 nor 2. Dadra and Nagar Haveli had the lowest literacy rate among Union Territories at 76.24%.. According to census 2011, its literacy rate is 76.24% (Male 85.17, female 64.32). Top Literate States: Kerala (94.00%), Lakshadweep (91.85%), Mizoram (91.33%), Goa (88.70%), Tripura (87.22%).", "source": null}, {"id": 711, "topic": "Population", "question": "As per Census 2011, what is the percentage of rural population in India?", "options": {"a": "52.4%", "b": "59.3%", "c": "65.2%", "d": "68.8%"}, "answer": "d", "explanation": "68.8%. Census 2011: Urban Population in India: 31.16%. Level of urbanization increased from 27.81% in the 2001 Census to 31.16% in the 2011 Census. The proportion of the rural population declined from 72.19% to 68.84%.", "source": null}, {"id": 712, "topic": "Population", "question": "The density of population is the crude relationship between humans and _________.", "options": {"a": "land", "b": "family", "c": "growth", "d": "capital"}, "answer": "a", "explanation": "land. Population density is calculated by dividing the total population of a region by the total land area. This gives an idea of how crowded or sparsely populated a region is. According to Census 2011, the population density of India is 382 (per square km). State with highest population density - Bihar (1106 person per square km). State with lowest population density - Arunachal Pradesh (17 person per square km).", "source": null}, {"id": 713, "topic": "Population", "question": "As per the 2011 census, what is the density of population in Arunachal Pradesh?", "options": {"a": "19 persons/km²", "b": "18 persons/km²", "c": "20 persons/km²", "d": "17 persons/km²"}, "answer": "d", "explanation": "17 persons/km². As per census 2011, Arunachal Pradesh has lowest Population density. Bihar has the highest population density (1106) among states. The population density of India was 382. The 2011 Census motto was \"Our Census, Our Future.\" The first successful Census occurred in 1881 under Lord Ripon, and since then, it has been conducted every ten years. Population density, defined as the number of persons per square Kilometer.", "source": null}, {"id": 714, "topic": "Population", "question": "What is the density of population in NCT of Delhi as per the 2011 Census?", "options": {"a": "11320", "b": "11342", "c": "10265", "d": "10567"}, "answer": "a", "explanation": "11,320.", "source": null}, {"id": 715, "topic": "Population", "question": "What is the name of the large-scale demographic survey conducted to provide reliable estimates of birth and death rates and other fertility and mortality indicators at the national and sub-national levels?", "options": {"a": "Sample Registration System (SRS)", "b": "Enumeration of Human Resource system (EHRS)", "c": "Direct Recruitment System (DRS)", "d": "Creation and bifurcation System (CBS)"}, "answer": "a", "explanation": "The SRS employs a dual record system with a part-time enumerator and a full-time supervisor. The enumerator continuously tracksF births and deaths in sample villages and urban blocks, while the supervisor conducts an independent survey every six months. Data from both sources is matched, and unmatched events are re-verified. It was launched by the Office of the Registrar General, India as a pilot in 1964-65, the SRS became fully operational in 1969-70.", "source": null}, {"id": 716, "topic": "Population", "question": "Which of the following is expressed as the total number of deaths per thousand population per year in India?", "options": {"a": "Death Rate", "b": "Age Specific Death Rate", "c": "Incidence Rate", "d": "Infant Mortality rate"}, "answer": "a", "explanation": "Death Rate. Age-specific mortality rate is defined as the number of deaths in a specific age group per thousand populations in the same age-group in a given year. The Crude Death Rate (CDR) is defined as Number of deaths per thousand population. Infant mortality rate refers to the number of deaths under one year of age divided by 1000 live births in a given year. Maternal Mortality Ratio refers to the number of women who die as a result of complications of pregnancy or childbearing in a given year per 100,000 live births in that year.", "source": null}, {"id": 717, "topic": "Population", "question": "According to Census 2011, what is the estimated percentage of people below the poverty line in rural areas?", "options": {"a": "27.09%", "b": "13.04%", "c": "18.90%", "d": "25.70%"}, "answer": "d", "explanation": "25.70%. In 2011-12, the poverty rate was estimated at 13.7% in urban areas, and 21.9% nationwide. The Below Poverty Line (BPL) is an economic benchmark that identifies individuals and households that are economically disadvantaged and may need government assistance. It is a minimum level of income required to maintain a basic standard of living.", "source": null}, {"id": 718, "topic": "Population", "question": "Consider the fBollowing statements regarding population change: 1. The three basic coemponents of population change are Birth, Death, and Migrationm. 2. Demography is derived from the Greek words Demos (Population) and Graphy (Science). Which of the above statements is/are correcet?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. The three components of population change (i) Birth (ii) Death and (iii) Migration are core to the domain of population studies. The word Demography has been derived from the Greek words ‘Demos’ and ‘Graphy’ which mean 'Population' and ‘Science’. Thus, demography is the scientific study of the human population.", "source": null}, {"id": 719, "topic": "Population", "question": "What is the percentage share of the population working in the agricultural sector as per Census of India 2011?", "options": {"a": "0.567", "b": "0.58", "c": "0.546", "d": "0.503"}, "answer": "c", "explanation": "0.546. As per Census 2011, the total number of agricultural workers in the country has increased from 234.1 million (127.3 million cultivators and 106.8 million agricultural labourers) in 2001 to 263.1 million (118.8 million cultivators and 144.3 million agricultural labourers) in 2011. However, the share of the workforce engaged in the agriculture sector (comprising cultivators and agricultural labourers) has come down from 58.2 per cent in 2001 to 54.6 per cent in 2011.", "source": null}, {"id": 720, "topic": "Population", "question": "According to the Census of India-2011, which of the following options represents a group of the most urbanized union territories in India?", "options": {"a": "Chandigarh and Lakshadweep", "b": "Delhi and Chandigarh", "c": "Puducherry and Delhi", "d": "Lakshadweep and Puducherry"}, "answer": "b", "explanation": "Delhi and Chandigarh. As per Census 2011, the most urbanized state - Goa.", "source": null}, {"id": 721, "topic": "Population", "question": "According to the census of India 2011, which group of Union Territories of India has the highest literacy rate ?", "options": {"a": "Lakshadweep and Daman and Diu", "b": "Daman and Diu and Delhi", "c": "Andaman and The Nicobar Islands and Puducherry", "d": "Chandigarh and Daman and Diu"}, "answer": "a", "explanation": "Lakshadweep (91.85%) and Daman and Diu (87.10%).", "source": null}, {"id": 722, "topic": "Population", "question": "Match the following states with the percentage of population below the poverty line. According to the Planning Commission of India (2011-12).% of population States below poverty line 1. Gujarat a. 8.06 2. Haryana b. 11.16 3. Himachal c. 16.63 Pradesh", "options": {"a": "1- c, 2- a, 3- b", "b": "1- a, 2- b, 3- c", "c": "1- b, 2- c, 3- a", "d": "1- c, 2- b, 3- a"}, "answer": "d", "explanation": "1- (c), 2- (b), 3- (a). The Planning Commission of India estimated the poverty rate in India for 2011-12 to be 21.9%, based on the Tendulkar poverty line.", "source": null}, {"id": 723, "topic": "Population", "question": "The _________ birth rate indicates the number of live births occurring during the year per 1000 population estimated at midyear.", "options": {"a": "neutral", "b": "positive", "c": "negative", "d": "crude"}, "answer": "d", "explanation": "crude. Birth rate is the total number of live births in a particular area (an entire country, a state, a district or other territorial unit) during a specified period (usually a year) divided by the total population of that area in thousands. Death rate is expressed as the number of deaths in a given area during a given time per 1000 population. Rate of natural increase refers to the difference between the birth rate and the death rate.", "source": null}, {"id": 724, "topic": "Population", "question": "Consider the following statements regarding Census 2011 sex ratio: I. Lakshadweep recorded the lowest sex ratio in the Union Territory in India. II. Punjab had the highest sex ratio among Indian states. Which of the above statement(s) is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. Sex ratio is used to describe the number of females per 1000 of males. Daman and Diu recorded the lowest sex ratio in the Union Territory in India. Kerala had the highest sex ratio among Indian states.", "source": null}, {"id": 725, "topic": "Population", "question": "As per the Census of India 2011, which Union Territory recorded the lowest population growth rate?", "options": {"a": "Lakshadweep", "b": "Delhi", "c": "Daman and Diu", "d": "Chandigarh"}, "answer": "a", "explanation": "Lakshadweep. Census of India 2011- Lowest Population Growth Rate: States - Nagaland, Kerala, Goa, Andhra Pradesh. UT - Lakshadweep, Andaman and Nicobar, Chandigarh, New Delhi. Highest Population Growth Rate States - Meghalaya, Arunachal Pradesh, Bihar. UT - Dadra and Nagar Haveli, Daman and Diu, Puducherry.", "source": null}, {"id": 726, "topic": "Population", "question": "According to the Census of India 2011, the female literacy rate was recorded as ___________.", "options": {"a": "75.35%", "b": "65.46%", "c": "55.84%", "d": "70.24%"}, "answer": "b", "explanation": "65.46%. As per Census 2011: Literacy rate in India (74.04%) - Male (82.14%). Highest in Kerala (Male: 96.1%, Female: 92.07%). Lowest in Bihar (Male: 71.2%, Female: 51.5%).", "source": null}, {"id": 727, "topic": "Population", "question": "According to Census of India 2011, what was the total population of India (approx)?", "options": {"a": "131 Crore", "b": "121 Crore", "c": "111 Crore", "d": "101 Crore"}, "answer": "b", "explanation": "121 Crore. Census 2011: 833.5 million persons live in rural areas and 377.1 million persons live in urban areas.", "source": null}, {"id": 728, "topic": "Population", "question": "Which of the following states had the highest percentage of Scheduled Tribes in the country as per census 2011?", "options": {"a": "Rajasthan", "b": "Maharashtra", "c": "Madhya Pradesh", "d": "Chhattisgarh"}, "answer": "c", "explanation": "Madhya Pradesh. As per Census 2011: Punjab, Haryana, Chandigarh, Delhi and Puducherry have no population of Scheduled tribes. Uttar Pradesh has the largest Scheduled Caste population.", "source": null}, {"id": 729, "topic": "Population", "question": "According to Census of India 2011, which state in India has the highest female literacy rate ?", "options": {"a": "Himachal Pradesh", "b": "Kerala", "c": "Tamil Nadu", "d": "Maharashtra"}, "answer": "b", "explanation": "Kerala (94.0%): Literacy rate (male: 96.1%, female 92.7%).", "source": null}, {"id": 730, "topic": "Population", "question": "The population density of India as per the Census of 1951 is _______.", "options": {"a": "117 per sq km", "b": "324 per sq km", "c": "103 per sq km", "d": "382 per sq km"}, "answer": "a", "explanation": "117 per sq km. There has been a steady increase of more than 200 persons per sq km over the last 50 years. The density of population in India (2011) is 382 persons per sq km. Population density of States (2011): Arunachahl Pradesh (17, Lowest), Bihar (1106. Highest), West Bengal (1028B), Uttar Pradesh (829), Kerala (860), Tamil Nadu (555), Delhi - (11,320, Most dense UT), Andaman and Nicobar Islands (46, Least Dense UT).:", "source": null}, {"id": 731, "topic": "Population", "question": "What is the Crude Death Rate of India as per Census 2011?", "options": {"a": "10%", "b": "8.5%", "c": "5.9%", "d": "7.1%"}, "answer": "d", "explanation": "7.1%. Percentage of infant deaths to total death - 13.6, Crude Birth Rrate - 21.8 (Rural - 23.3, Urban - 17.6), General Fertility rate - 81.2, Percentage distribution of population by broad age group: (0 - 14) - 29.5, (15 - 59) - 62.5, (60+) - 8.0.", "source": null}, {"id": 732, "topic": "Population", "question": "What was the percentage of India's population that belonged to the Muslim religion in 2011?", "options": {"a": "14.2%", "b": "11.9%", "c": "16.4%", "d": "18.5%"}, "answer": "a", "explanation": "14.2%.", "source": null}, {"id": 733, "topic": "Population", "question": "On the basis of tribal population (2011), identify the option that arranges the following states in ascending order. A. Madhya Pradesh B. Maharashtra C. Odisha", "options": {"a": "(C), (B), (A)", "b": "(B), (A), (C)", "c": "(C), (A), (B)", "d": "(B), (C), (A)"}, "answer": "a", "explanation": "Madhya Pradesh has the highest and Punjab has the lowest tribal population in India as per 2011 census. Tribal population percentage of these states to total ST population in India Madhya Pradesh - 14.7, Maharashtra - 10.1, Odisha - 9.2.", "source": null}, {"id": 734, "topic": "Population", "question": "Which of the following periods is referred to as a period of stagnant or stationary phase of growth of India's population?", "options": {"a": "1921-1941", "b": "1901-1921", "c": "1961-1981", "d": "1941-1961"}, "answer": "b", "explanation": "1901-1921. The year 1921 is known as the year demographic divide because it is the only census year when there was a decrease in the growth of population.", "source": null}, {"id": 735, "topic": "Population", "question": "India can be considered to be a country with Demographic Dividend due to _______.", "options": {"a": "high population above 70 years", "b": "high population between 15 - 64 years", "c": "high population between 10 - 20 years", "d": "high total population"}, "answer": "b", "explanation": "This working age group must support itself as well as those outside this age group (i.e., children and elderly people) who are unable to work and are therefore dependents.", "source": null}, {"id": 736, "topic": "Population", "question": "Consider the following statements: 1. The period 1951–1981 is called the period of population explosion in India. 2. During this period, India’s population grew from 261 million to 683 million. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. During this period the population of India grew rapidly from 361 million (1951) to 683 million (1981). The average annual growth rate of this period was 2.14 percent.", "source": null}, {"id": 737, "topic": "Population", "question": "What does the Lincoln index measure?", "options": {"a": "Population Size", "b": "Population Natality Rate", "c": "Population Mortality Rate", "d": "Population Density"}, "answer": "a", "explanation": "Population Size. Lincoln index described by Frederick Charles Lincoln (in 1930). Population Natality Rate - The number of births per unit of time in a population, often expressed as births per 1,000 individuals per year. Population Mortality Rate - The number of deaths per unit of time in a population, often expressed as deaths per 1,000 individuals per year.:", "source": null}, {"id": 738, "topic": "Population", "question": "Consider the following statements: 1. As per Census classification, the working age group is taken as 18–60 years. 2. The National Youth Policy 2014 defines youth as persons in the age group of 15–29 years. Which of the above is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. The population of nation in the working age group generally grouped between 15-59 years. The 2011 Census has divided the working population of India into four major categories: Cultivators, Agricultural Labourers, Household Industrial Workers, Other Workers.", "source": null}, {"id": 739, "topic": "Population", "question": "In which of the following decades, there was a negative growth rate in the Indian population?", "options": {"a": "1911-1921", "b": "1941-1951", "c": "1961-1971", "d": "1921-1931"}, "answer": "a", "explanation": "1911-1921. Decadal Growth Rates in India: Census year (% of Growth) - 1911 (+ 5.75), 1921 (- 0.31). Percentage growth in 2001-2011 is 17.64%; males 17.19% and females 18.12%.", "source": null}, {"id": 740, "topic": "Population", "question": "According to census 2011, which is the second largest religious minority India?", "options": {"a": "Christians", "b": "Buddhist", "c": "Sikhs", "d": "Muslim"}, "answer": "a", "explanation": "Christians.", "source": null}, {"id": 741, "topic": "Population", "question": "According to the Union Home Ministry, the census 2021 (which got postponed due to COVID 19) was supposed to collect data for _________ for the first time.", "options": {"a": "Schedule Tribes", "b": "Schedule Castes", "c": "Economically weaker sections", "d": "Other Backward Castes"}, "answer": "d", "explanation": "Other Backward Castes. Fifteenth Census (2011). The Socio Economic and Caste Census (SECC) was conducted in 2011 for the first time since 1931. 29 questions canvassed during Population Enumeration in census 2011.", "source": null}, {"id": 742, "topic": "Population", "question": "As per census 2011, What is the Total Fertility Rate in India? (provide an approximate range)", "options": {"a": "3.1 - 3.9", "b": "2.1 - 2.9", "c": "4.1 - 4.9", "d": "5.1 - 5.9"}, "answer": "b", "explanation": "2.1 - 2.9.", "source": null}, {"id": 743, "topic": "Population", "question": "The long term objective National Population Policy (NPP) 2000 to achieve a stable population by ______ with sustainable economic growth, social development and environmental protection.", "options": {"a": "2045", "b": "2035", "c": "2025", "d": "2055"}, "answer": "a", "explanation": "2045. The immediate objective of the National Population Policy (NPP) 2000 is to address the unmet needs for contraception, health care infrastructure, and health personnel, a and to provide integrated service delivery is for basic reproductive and child health care.", "source": null}, {"id": 744, "topic": "Population", "question": "Consider the following statements: 1. If the birth rate equals the death rate, the population remains constant. 2. If the birth rate is higher than the death rate, the population decreases. Which of the above is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "Only 2. If the birth rate of country is more than the death rate then the population will increase. Birth Rate The number of babies born every year per 1000 people in a populationB. Death Rate - The number of deaths every year per 1000 people in a popuelation. If Birth Rate > Death Rate: Population will of increase, Birth m rate = Death rate: Population will remain constant, Birth rate < Death rate: Population will decrease. e", "source": null}, {"id": 745, "topic": "Population", "question": "Which of the following factors can affect distribution of population? I. Geographical factors II. Social factors F III. Cultural factors IV. Economic factors", "options": {"a": "I, II, III only", "b": "I and II only", "c": "I, II, III and IV", "d": "II and III only"}, "answer": "c", "explanation": "Geographical Factors Availability of water, Landforms, Climate, Soils. Economic Factors - Minerals, Urbanisation, Industrialisation. Social - and Cultural Factors - Religious beliefs attract people, better housing, health facilities, educational institutions and transport systems etc.", "source": null}, {"id": 746, "topic": "Population", "question": "Settlements in which houses are built close to each other are called _____.", "options": {"a": "Scattered settlement", "b": "Compact settlement", "c": "Line settlement", "d": "Grid settlement"}, "answer": "b", "explanation": "Compact settlement. Grid of settlements are settlements in which is houses are built in a grid pattern, such as cities. Scattered settlements are settlements in which houses are spaced apart, such as forests or deserts, rural areas. Line settlements are settlements in which houses are built along a road or river and canals.", "source": null}, {"id": 747, "topic": "Population", "question": "Officially, the first recorded data on transgenders in India was collected in which census?", "options": {"a": "2011", "b": "2001", "c": "1991", "d": "1981"}, "answer": "a", "explanation": "2011 - It was the 15th census and 7th after independence. The Registrar General of India (RGI), during Enumeration of Census 2011, for the first time provided three codes; these are Male-1, Female-2 and other-3 for enumeration.", "source": null}, {"id": 748, "topic": "Population", "question": "According to census 2011, what is the population (nearest value) of tribals in India?", "options": {"a": "16.45 crore", "b": "14.45 crore", "c": "10.42 crore", "d": "12.45 crore"}, "answer": "c", "explanation": "10.42 crore. According to the h 2011 census, 'Scheduled Tribes' (ST) - - 8.6% of the total population of the country. The state and Union Territory with the largest tribal population - Madhya Pradesh, and Lakshadweep. The population density in India is 382 per km 2.", "source": null}, {"id": 749, "topic": "Population", "question": "As per census 2011, which among the following states has the highest sex ratio?", "options": {"a": "Madhya Pradesh", "b": "Maharashtra", "c": "Meghalaya", "d": "Uttar Pradesh"}, "answer": "c", "explanation": "Meghalaya. According to Census 2011: Sex Ratio of North East States (Highest to Lowest) - Meghalaya (989), Manipur (985), Mizoram (976), Tripura (960), Assam (958), Arunachal Pradesh (938), Nagaland (931). -", "source": null}, {"id": 750, "topic": "Population", "question": "Which of the following states has the highest fertility rate in India according to the 2011 census?", "options": {"a": "Kerala", "b": "Punjab", "c": "Maharashtra", "d": "Bihar"}, "answer": "d", "explanation": "Bihar. Total fertility rate (TFR): Total number of children born or likely to be born to a woman in her lifetime if she were subject to the prevailing rate of age-specific fertility in the population.", "source": null}, {"id": 751, "topic": "Population", "question": "Why is there low population growth in a society that is underdeveloped and technologically backward?", "options": {"a": "Because both death rate and birth rate are high", "b": "Because both death rate and birth rate are low", "c": "Because such countries usually have strict government policies related to population growth", "d": "Because people migrate from underdeveloped countries"}, "answer": "a", "explanation": "The first stage is that of low population growth in society because both the death rate and the birth rate are very high so the difference between the two (or the net growth rate) is low. Stage II (Higher than death rate), Stage III (Low birth rate; Curves of both death and birth rate get closer; Population growth rate- Very low), and Stage IV (Birth rate curve further dips, more than the death rate curve; Net population goes down).", "source": null}, {"id": 752, "topic": "Population", "question": "According to the Socio-Economic Census 2015, which state has the largest population of households with ‘destitute / living on alms’?", "options": {"a": "Chhattisgarh", "b": "Bihar", "c": "Tamil Nadu", "d": "Odisha"}, "answer": "d", "explanation": "Odisha. Socio-Economic Census 2015 is a study of the socio-economic status of rural and urban households and allows the ranking of households based on predefined parameters.", "source": null}, {"id": 753, "topic": "Population", "question": "Growth rate of population refers to the:", "options": {"a": "difference between birth rate and GDP", "b": "addition of birth rate and death rate", "c": "difference between birth rate and death rate", "d": "difference between death rate and GDP"}, "answer": "c", "explanation": "Population growth rate is the change in the number of individuals over a specific period of time. The rate of population growth is the rate of natural increase combined with the effects of migration.", "source": null}, {"id": 754, "topic": "Population", "question": "The distribution of the population according to different types of occupation is known as __________.", "options": {"a": "occupational structure", "b": "age composition", "c": "adolescent population", "d": "Migration"}, "answer": "a", "explanation": "Occupational structure refers to the aggregate distribution of the population according to different occupations in society, defined by skill level, and economic status. The age composition refers to the number of people in different age groups in a country.", "source": null}, {"id": 755, "topic": "Population", "question": "Which period in India is referred to as a steady population growth period?", "options": {"a": "1921-1951", "b": "1921-1941", "c": "1921-1961", "d": "1921-1931"}, "answer": "a", "explanation": "1921-1951. Four phases of population growth in India: Stagnant population (1901-1921), Steady growth stage (1921-1951), Rapid growth stage (1951- 1981) and high growth with definite signs of slowing down (1981-2011).", "source": null}, {"id": 756, "topic": "Population", "question": "What is the percentage of rural child population to the total child population of the country in India as per Provisional Population Totals of Census 2011?", "options": {"a": "74.05%", "b": "79.03%", "c": "62.45%", "d": "55.23%"}, "answer": "a", "explanation": "74.05%.", "source": null}, {"id": 757, "topic": "Population", "question": "Consider the following statements: I. Neonatal mortality rate refers to the number of deaths during the first 3h0 completed days of life per 1000 live births. B II. Infant mortality rate refers to the number of deaths of ch ildren below 1 month of age per 1000 live births. Which of the abmove statement(s) is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I an d II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. The number of deaths during the first 28 completed d ays of life per 1000 live births in a given year or period is defined as neonatal F mortality rate. An age-specific mortality rate is a mortality rate limited to a particular age group. The crude death rate is calculated as the number of deaths in a given period divided by the population exposed to risk of death in that period. The Infant mortality rate (IMR) is the number of deaths of infants under one year of age per 1,000 live births", "source": null}, {"id": 758, "topic": "Population", "question": "What was the estimated national mortality rate of children under the age of five in the country as per Census of India 2011?", "options": {"a": "34", "b": "55", "c": "76", "d": "13"}, "answer": "b", "explanation": "55. As per Census 2011, the share of children (0-6 years) accounts for 13.1% of the total population in the Country.", "source": null}, {"id": 759, "topic": "Population", "question": "As per the theory of demographic transition, the post-transitional stage of demographic transition is characterised by ______.", "options": {"a": "low and nearly equal birth and death rates", "b": "falling birth rates and high death rates", "c": "high and nearly equal birth and death rates", "d": "falling death rates and high birth Rates"}, "answer": "a", "explanation": "The demographic transition model has four stages: pre-industrial, urbanizing/industrializing, mature industrial, and post-industrial. Atmosphere", "source": null}, {"id": 760, "topic": "Atmosphere", "question": "Read the following statements: Statement 1: The process of vertical heating of the atmosphere is known as advection. Statement 2: The transfer of heat through horizontal movement of air is called convection. Statement 3: 'Loo' winds in northern India during summer are caused by advection. Which of the above statements is/are correct ?", "options": {"a": "All three statements 1, 2 and 3 are correct", "b": "Statements 2 and 3 are correct", "c": "Only Statements 1 and 2 are correct", "d": "Only Statement 3 is correct"}, "answer": "d", "explanation": "Only Statement 3 is correct. The vertical heating of the atmosphere through the upward movement of heated air is known as convection. The transfer of heat through the horizontal movement of air is called advection. The 'Loo' is a hot, dry wind that blows horizontally across the plains of northern India during summer, which is a classic example of heat transfer by advection.", "source": "SSC Stenographer 6/08/2025 (Shift 1)"}, {"id": 761, "topic": "Atmosphere", "question": "Which layer of the Earth's atmosphere is primarily responsible for absorbing ultraviolet radiation from the Sun?", "options": {"a": "Thermosphere", "b": "Stratosphere", "c": "Mesosphere", "d": "Troposphere"}, "answer": "b", "explanation": "Stratosphere. The stratosphere, lying above the troposphere (about 10–50 km altitude), contains the ozone layer, which absorbs most of the Sun’s harmful ultraviolet (UV) radiation. This protective function shields living organisms from DNA damage, skin cancer, and other harmful effects of excessive UV exposure. The thermosphere absorbs X-rays and gamma rays, while the mesosphere mainly helps burn up meteors. The troposphere is the lowest layer where weather occurs but does not absorb significant UV radiation. Thus, the stratosphere is primarily responsible for UV absorption.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 762, "topic": "Atmosphere", "question": "Read the following statements: Statement 1: The temperature in Troposphere decreases at the rate of 1°C for every 165 meters of height. Statement 2: The temperature in mesosphere starts to decrease with the increase in altitude and reaches up to -100°C at around 80 km. Which of the following statements is/are correct ?", "options": {"a": "Only Statement 1 is correct", "b": "Only Statement 2 is correct", "c": "Both statements 1 and 2 are correct", "d": "Both statements 1 and 2 are incorrect"}, "answer": "c", "explanation": "Both statements 1 and 2 are correct. Statement 1 describes the Normal Lapse Rate in the troposphere, where temperature decreases by approximately 1°C for every 165 meters (or 6.5°C per kilometer) of ascent. Statement 2 is also correct; in the mesosphere, temperature again decreases with increasing altitude, reaching the coldest temperatures in the Earth's atmosphere, around -90°C to -100°C, at the mesopause (approx. 80-85 km).", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 763, "topic": "Atmosphere", "question": "Consider the following statements: I. Smog is a dense mass of water dropsF mixed with smoke and dust particles near the ground. II. Mist and fog differ mainly on the basis of visibility reduction. Which of the above statement(s) is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Fog forms when an air mass with high water vapor suddenly cools, causing condensation on fine dust particles. It is essentially a cloud at or near the ground, leading to poor visibility, often reduced to zero. Fog is denser and thicker than mist. Fog reduces visibility to less than one kilometer, while mist reduces visibility to one to two kilometers. Frost forms on cold surfaces when condensation takes place below freezing point (00C), i.e. the dew point is at or below the freezing point.", "source": null}, {"id": 764, "topic": "Atmosphere", "question": "Atmospheric temperature usually decreases with altitude, but sometimes this phenomenon gets reversed in the troposphere. This phenomenon is known as _________.", "options": {"a": "Temperature Inversion", "b": "Adiabatic Lapse Rate", "c": "Global Warming", "d": "Temperature Convection"}, "answer": "a", "explanation": "Temperature Inversion occurs when the normal pattern of temperature decreasing with altitude is reversed, and the air becomes warmer as you go higher. This phenomenon can lead to air pollution problems and is often seen in valleys or areas with stagnant air. Adiabatic lapse rate: Change of temperature with a change in altitude of an air parcel without gaining or losing any heat to the environment surrounding the parcel. Temperature Convection - The process by which heat is transferred through the movement of fluid (like air or water) due to temperature differences. h", "source": null}, {"id": 765, "topic": "Atmosphere", "question": "What kind of radia tion is absorbed by the ozone layer?", "options": {"a": "Green radiation", "b": "Infrared radiation", "c": "Visible radiation", "d": "Ultraviolet radiation"}, "answer": "d", "explanation": "Ultraviolet radiation. The UV radiation sepectrum is divided into three types: UVA, UVB and UVC. These rays can aeffect our skin in different ways. Ozone layer: It is a region in the Earth's srtratosphere that contains a high concentration of ozone (O) gas. This layer acts as a shield, protecting the Earth from the Sun's harmful ultraviolet (UV) radiation. Infrared radiation (IR), also known as thermal radiation, is that band in the electromagnetic radiation spectrum with wavelengths above red visible light between 780 nm to 1mm (0.78 μm to 1000 μm).", "source": null}, {"id": 766, "topic": "Atmosphere", "question": "The upper portion of the earth is known as:", "options": {"a": "Stratosphere", "b": "Troposphere", "c": "Lithosphere", "d": "Mesosphere"}, "answer": "c", "explanation": "Lithosphere. It is bounded by the atmosphere above and the asthenosphere (another part of the upper mantle) below. The stratosphere is the second-lowest layer of Earth's atmosphere. The troposphere, the lowest layer of the atmosphere, contains about 75-80% of the atmospheric mass. Most clouds form in the troposphere, where nearly all weather occurs. The mesosphere is the third highest layer, situated between the stratosphere and the thermosphere.", "source": null}, {"id": 767, "topic": "Atmosphere", "question": "The zone separating the troposphere from the stratosphere is called the __________.", "options": {"a": "Tropopause", "b": "stratospause", "c": "Stratomerge", "d": "Tropomerge"}, "answer": "a", "explanation": "Tropopause. The air temperature at the tropopause is about - 80 o C over the equator and about - 45 o C over the poles. The temperature in this region is nearly constant, and hence, it is called the tropopause. The stratosphere is found above the tropopause and extends up to a height of 50 km. One important feature of the stratosphere is that it contains the ozone layer.", "source": null}, {"id": 768, "topic": "Atmosphere", "question": "Consider the following statements: I. All weather phenomena like rainfall, storms, and winds occur in the Thermosphere. II. The ozone layer is present in the Troposphere. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. All the changes in climate and weather takes place in the Troposphere. It is the lowermost layer of the atmosphere and is often referred to as the \"region of mixing”. Its average height is 13 km and extends roughly to a height of 8 km near the poles and about 18 km at the equator. Stratosphere (contains the ozone layer) - 2nd layer of the Earth's atmosphere, extending from about 10 to 50 km in altitude. Mesosphere - 3rd layer of the Earth's atmosphere, extending from about 50 to 85 km in altitude. Most meteors burn up in this atmospheric layer. Thermosphere - 4th layer of the Earth's atmosphere, extending from about 85 to 500 km in altitude.", "source": null}, {"id": 769, "topic": "Atmosphere", "question": "Which of the following claims about chlorofluorocarbons (CFCs) is accurate?", "options": {"a": "CFCs are used as repairers of the troposphere", "b": "CFCs are used as fuel for air crafts", "c": "CFCs are used as repairers of the ozone layer", "d": "CFCs are used as refrigerants"}, "answer": "d", "explanation": "CFCs, banned in India for depleting the ozone layer, were used in plastic foams, cleaning electronics, and aerosol cans. They are now replaced by HFCs, which have an ozone depletion potential of 0.", "source": null}, {"id": 770, "topic": "Atmosphere", "question": "What is the purpose of the Earth's magnetic field?", "options": {"a": "To provide an energy source for life on Earth", "b": "To control the Earth's climate", "c": "To shield the Earth from solar wind and cosmic radiation", "d": "To cause the tides in the ocean"}, "answer": "c", "explanation": "Earth's magnetic field (Geomagnetic field) - The magnetic field that extends from Earth's interior out into space, where it interacts with the solar wind, a stream of charged particles emerging from the Sun. Earth’s Magnetism - Generated by convection currents of molten iron and nickel in the earth’s core. These convection currents are caused by heat escaping from the core, a natural process called geodynamo.", "source": null}, {"id": 771, "topic": "Atmosphere", "question": "What is the main objective of the 'Graded Response Action Plan'?", "options": {"a": "legalizing illegal colonies", "b": "To control the cases of malaria", "c": "introduction of electric vehicles", "d": "controlling air pollution"}, "answer": "d", "explanation": "Controlling air pollution. Graded Response Action Plan (GRAP): was formulated in 2016 and notified in 2017 for Delhi and the National Capital Region (NCR) by the Ministry of Environment, Forest and Climate Change.", "source": null}, {"id": 772, "topic": "Atmosphere", "question": "Which of the following statements is NOT correct regarding the stratosphere ?", "options": {"a": "It lies above the mesosphere.", "b": "It extends up to a height of 50 km.", "c": "It contains a layer of ozone gas.", "d": "This layer is almost free from clouds."}, "answer": "a", "explanation": "Stratosphere - Its height of the bottom varies with latitude and with the seasons. Aviation & Jet Streams fly the Stratosphere.", "source": null}, {"id": 773, "topic": "Atmosphere", "question": "In which layer of atmosphere does the meteorites burn up on entering from space?", "options": {"a": "Stratosphere", "b": "Thermosphere", "c": "Mesosphere", "d": "Exosphere"}, "answer": "c", "explanation": "Mesosphere. Meteorites are space rocks that fall to Earth's surface. Meteorites are the last stage in the existence of these types of space rocks.", "source": null}, {"id": 774, "topic": "Atmosphere", "question": "Which layer of atmosphere helps in radio transmission?", "options": {"a": "Exosphere", "b": "Thermosphere", "c": "Mesosphere", "d": "Stratosphere"}, "answer": "b", "explanation": "Thermosphere. It is a layer of Earth's atmosphere that is directly above the Mesosphere and below the Exosphere. The temperature starts increasing again with increasing height in this layer. Aurora and satellites occur in this layer.", "source": null}, {"id": 775, "topic": "Atmosphere", "question": "At what height do the Jet Streams blow in India during winter months?", "options": {"a": "9-15 km", "b": "9-17 km", "c": "9-16 km", "d": "9-13 km"}, "answer": "d", "explanation": "9-13 km. Jet Streams (geostrophic wind) are relatively narrow bands of strong wind. Types: Polar-Night Jet Stream, SubTropical Jet Streams (westerlies), Tropical Easterly Jet Stream.", "source": null}, {"id": 776, "topic": "Atmosphere", "question": "The climate of Assam can be described as:", "options": {"a": "subtropical humid climate", "b": "mountain climate", "c": "tropical dry climate", "d": "tropical monsoon rainforest climate"}, "answer": "d", "explanation": "Tropical Monsoon Rainforest Climate. Tropical monsoon climates have monthly mean temperatures above 18°C (64°F) in every month of the year and a dry season. Tropical monsoon climate is the intermediate climate between the wet Af (or tropical wet It climate) and the drier Aw (or tropical savanna climate).", "source": null}, {"id": 777, "topic": "Atmosphere", "question": "__________ is a naturally occurring phenoemenon that is responsible for the heating of the Earth’s surface and artmosphere.", "options": {"a": "Radiation", "b": "Global warming", "c": "Greenhouse effect", "d": "Global heating"}, "answer": "c", "explanation": "Greenhouse Effect. When the Sun's energy reaches the Earth's atmosphere, some of it is reflected back to space and the rest is absorbed and re-radiated by greenhouse gases. The absorbed energy warms the atmosphere in and the surface of the Earth.", "source": null}, {"id": 778, "topic": "Atmosphere", "question": "The term ‘monsoon’ is derived from a/an:", "options": {"a": "Italian word", "b": "Latin word", "c": "Arabic word", "d": "Greek word"}, "answer": "c", "explanation": "Arabic word 'mausim', meaning weather, was first used in English in British India to refer to seasonal changes in wind direction. Rocks", "source": null}, {"id": 779, "topic": "Rocks", "question": "What is Karst topography primarily associated with?", "options": {"a": "Groundwater action in limestone or dolomite regions", "b": "River meandering in alluvial plains", "c": "Glacial deposition in polar regions", "d": "Wind erosion in arid deserts"}, "answer": "a", "explanation": "Groundwater action in limestone or dolomite regions. Karst topography develops in regions where limestone, dolomite, or gypsum rocks are present. It is formed due to the chemical action of groundwater (carbonation and solution processes). Key features of karst landscapes: Sinkholes (dolines), Caves and caverns, Stalactites and stalagmites, Underground streams and disappearing rivers. Famous example in India: Karst landforms of Meghalaya (Krem caves).", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 780, "topic": "Rocks", "question": "The igneous, sedimentary and metamorpihic rocks are interconvertible througih a continuous process called: a", "options": {"a": "lithification", "b": "metamorphism", "c": "rock cycle", "d": "weathering and erosion"}, "answer": "c", "explanation": "rock cycle. It is a series of processes that create and transform the types of rocks in Earth's crust. Lithification: This is specifically the process by which sediments are compacted and cemented to form sedimentary rocks. Metamorphism is the process by which existing rocks (Igneous, Sedimentary, or even other Metamorphic rocks) are transformed into metamorphic rocks under high pressure, and temperature. Weathering and erosion: These are processes that break down existing rocks into smaller particles.", "source": null}, {"id": 781, "topic": "Rocks", "question": "The layer made up of unconsolidated rock, dust, soil, etc. that is deposited on a bed rock surface like a blanket is known as:", "options": {"a": "Talus", "b": "Regolith", "c": "Scree", "d": "Protolith"}, "answer": "b", "explanation": "Regolith. It can be found both at the surface and at varying depths. This layer of fragmented soil material forms the outermost covering of the land and is present almost everywhere, covering the underlying bedrock. Regolith is primarily inorganic and acts like a blanket over unbroken rock.", "source": null}, {"id": 782, "topic": "Rocks", "question": "Consider the following statements: I. Sedimentary rocks are formed by the deposition and compaction of sediments, usually in layers. II. Igneous rocks are also layered due to volcanic eruptions. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Igneous rocks (primary rocks) form out of magma and lava from the interior of the earth. Examples - Granite, gabbro, pegmatite. Sedimentary rocks are formed by the deposition and compaction of sediments over time, often in layers. These layers, also called strata. Examples - Sandstone, conglomerate, limestone, shale, loess. Metamorphic Rocks form under the action of pressure, volume and temperature changes. Examples Gneissoid, granite, syenite, slate.", "source": null}, {"id": 783, "topic": "Rocks", "question": "Exfoliation is a form of _________.", "options": {"a": "physical weathering", "b": "chemical weathering", "c": "mass wasting", "d": "biochemical weathering"}, "answer": "a", "explanation": "Physical weathering is caused by the effects of changing temperature on rocks, causing the rock to break apart. The process is sometimes assisted by water. Exfoliation occurs as cracks develop parallel to the land surface, a consequence of the reduction in pressure during uplift and erosion.", "source": null}, {"id": 784, "topic": "Rocks", "question": "The outermost part of the Earth is known as __________.", "options": {"a": "volcano", "b": "the crust", "c": "the core", "d": "the mantle"}, "answer": "b", "explanation": "the crust. The Earth's crust is the thinnest of all its layers, about 35 km thick on the continental masses and only 5 km on the ocean floors. The main minerals in the continental crust are silica and alumina, while the oceanic crust consists primarily of silica and magnesium. Beneath the crust lies the mantle, which extends to a depth of 2900 km. The innermost layer is the core, with a radius of about 3500 km, made mostly of nickel and iron.", "source": null}, {"id": 785, "topic": "Rocks", "question": "Which of the following is the correct match between column-A and column-B? Column-A Column-B (Type of rock) (Method of formation) i. Sedimentary a. Transformed its Rock chemical qualities from other type of rocks ii. Metamorphic b. Derived from magma Rock that was poured out or ejected at the Earth's Surface iii. Igneous c. Formed from Rock fragments of other rocks or the remains of plants or animals", "options": {"a": "i-a, ii-b, iii-c", "b": "i-b, ii-a, iii-c", "c": "i-c, ii-a, iii-b", "d": "i-a, ii-c, iii-b"}, "answer": "c", "explanation": "i-c, ii-a, iii-b. The rock cycle is a web of processes that outlines how each of the three major rock types igneous, metamorphic, and sedimentary form and break down based on the different applications of heat and pressure over time.", "source": null}, {"id": 786, "topic": "Rocks", "question": "Structural geology deals with: -", "options": {"a": "the age of rocks", "b": "the components and chemical nature of soil", "c": "the form, classification, mechanism, and causes of rock structures’ evolution", "d": "the cause of volcano formation"}, "answer": "c", "explanation": "Petrology is the science of rocks. Rock: Any natural mass of minerahl matter that makes up the Earth's crust.", "source": null}, {"id": 787, "topic": "Rocks", "question": "Which of the following is yellowish green to green coloured gemstone often found ien mafic and ultramafic igneous rocks such as basalt, gabbro, dunite, dimabase and peridotite?", "options": {"a": "Bornite", "b": "Olivine", "c": "Tremolite", "d": "Garnet"}, "answer": "b", "explanation": "Olivine. The mineral olivine is a magnesium iron silicate with the chemical formula (Mg,Fe) SiO. It is 2 4 trype of nesosilicate or orthosilicate. Bornite, also known as peacock ore, is sulfide mineral with a chemical composition of Cu FeS. 5 4", "source": null}, {"id": 788, "topic": "Rocks", "question": "The steep rocky coast rising almost vertically above sea water is called ______.", "options": {"a": "sea caves", "b": "sea cliff", "c": "sea arches", "d": "ox-bow lake"}, "answer": "b", "explanation": "Sea cliffs are steep faces of rock and soil that are formed by destructive waves. A sea cave is a cave formed on a cliff by the wave action of an ocean or lake. A sea arch is a natural arch or bridge made of stone that has been created when water wears away the underside of a rock, leaving just the top behind.", "source": null}, {"id": 789, "topic": "Rocks", "question": "The core of the Great Himalayas is composed of ______.", "options": {"a": "Slate", "b": "Granite", "c": "Sandstone", "d": "Limestone"}, "answer": "b", "explanation": "Granite rock (Igneous rock). Lesser Himalaya consists of metamorphosed sedimentary rocks (quartzite, marble, slate, phyllite, schist and gneiss).", "source": null}, {"id": 790, "topic": "Rocks", "question": "Which of the following determines the colour, texture,chemical properties, mineral, content and permeability of the soil?", "options": {"a": "Parent rock", "b": "Time -", "c": "Relief", "d": "Climate -"}, "answer": "a", "explanation": "Parent rock. The color in the soil is mainly due to two factors – organic content and the chemical nature of iron compounds found in the soil.", "source": null}, {"id": 791, "topic": "Rocks", "question": "How many types of igneous rocks are there?", "options": {"a": "Four", "b": "Two", "c": "Six", "d": "Five"}, "answer": "b", "explanation": "Two. Based on the texture of rocks, igneous rocks are classified into Intrusive igneous rocks (Plutonic rocks) and Extrusive igneous rocks (Lava or Volcanic rocks).", "source": null}, {"id": 792, "topic": "Rocks", "question": "Mushroom rocks are formed due to _____.", "options": {"a": "glacial deposition", "b": "deposition of sea waves", "c": "running water erosion", "d": "wind erosion"}, "answer": "d", "explanation": "Wind erosion. A mushroom rock (perched rock) is a typical mushroom-shaped landform that is formed by the action of wind erosion. These rocks are mostly found in arid regions. Such rocks are found in the Thar Desert of India.", "source": null}, {"id": 793, "topic": "Rocks", "question": "What type of rocks were once igneous or sedimentary, but have metamorphosed as a result of intense heat and/or pressure within the Earth's crust?", "options": {"a": "Granite", "b": "Quartzite", "c": "Sandstone", "d": "Basalt"}, "answer": "b", "explanation": "Quartzite. Granite is a coarse-grained (phaneritic) intrusive igneous rock composed mostly of quartz, alkali feldspar, and plagioclase. Sandstone is a clastic sedimentary rock composed mainly of sand-sized silicate grains. Basalt is a mafic extrusive rock, is the most widespread of all igneous rocks, and comprises more than 90% of all volcanic rocks.", "source": null}, {"id": 794, "topic": "Rocks", "question": "Which of the following rocks floats in water?", "options": {"a": "Granite", "b": "Obsidian", "c": "Pumice", "d": "Slate"}, "answer": "c", "explanation": "Pumice is a light-colored, extremely porous igneous rock that forms during explosive volcanic eruptions. Obsidian has been used for tools and ornaments. Granite is a hard igneous rock made of quartz, feldspar, and mica. Slate is a metamorphic rock.", "source": null}, {"id": 795, "topic": "Rocks", "question": "________ plains are formed due to the weathering of soluble rocks such as limestone and dolomite.", "options": {"a": "Glacial", "b": "Karst", "c": "Deposition", "d": "Desert"}, "answer": "b", "explanation": "Karst regions contain aquifers that are capable of providing large supplies of water. Typical karst forms include sinkholes, caves, natural bridges and sinking streams. Mountain", "source": null}, {"id": 796, "topic": "Mountain", "question": "Read the following statements: Statement 1: Diastrophism includes all processes that move, elevate, or build up portions of the Earth's crust. Statement 2: Exogenic processes derive their energy from the atmosphere, influenced by solar energy and tectonic gradients. Which of the above statements is/are correct?", "options": {"a": "Only Statement 1 is correct", "b": "Both statements 1 and 2 are correct", "c": "Both statements 1 and 2 are incorrect", "d": "Only Statement 2 is correct"}, "answer": "b", "explanation": "Both statements 1 and 2 are correct. Diastrophism encompasses all slow, large-scale movements, such as uplift and folding, that deform and build up portions of the Earth's crust, leading to mountain building (orogeny) and continental warping (epeirogeny). Exogenic processes derive their energy from both the atmosphere, powered by solar energy, and from tectonic factors that create gradients. The Sun's energy influences atmospheric conditions like temperature and precipitation, which are key components of weather and climate.", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 797, "topic": "Mountain", "question": "Consider the following statements: I. K2 is the highest peak of the Karakoram Range. II. Nanda Devi lies in the Zanskar Range. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. K2, also known as Mount Godwin Austen (8,611 meters), is the world’s second-highest peak in the Karakoram range, spanning Pakistan, China, India, and extending into Afghanistan and Tajikistan. Trishul Peak is in the Himalayas, while Kamet Peak (7,756 meters) is the highest in the Zanskar range. Nanda Devi (7,817 meters) is the third-highest peak in the Himalayas.", "source": null}, {"id": 798, "topic": "Mountain", "question": "Which of the following mountains of India is famous for tea and coffee production?", "options": {"a": "Nilgiri", "b": "Aravali", "c": "Himalaya", "d": "Vidhyanchal"}, "answer": "a", "explanation": "Nilgiri Hills are where the Western Ghats and Eastern Ghats meet. They are located at the tri-junction of Karnataka, Kerala, and Tamil Nadu. The highest peak in this region is Doda Betta. The Aravalli Range is known for its mineral resources, such as copper and zinc. The Himalayas are famous for saffron cultivation in the Kashmir region.", "source": null}, {"id": 799, "topic": "Mountain", "question": "What is the name of the highest peak of Indian Garhwal Himalayas located in Chamoli district of Uttarakhand state with a height of 7,816 metres ?", "options": {"a": "Trisul", "b": "Heardeol", "c": "Mukut Parbat", "d": "Nanda Devi"}, "answer": "d", "explanation": "Nanda Devi. It is the second-highest mountain in India, after Kangchenjunga (8598 m), and the highest entirely within the country. It rankse as the 23rd highest peak in the world. The Garhwal Himalayas lie bretween the Sutlej and the Kali river and is 320 km long. It is a part of the Himalayan Shivalik Hills (outermost hills of the Himalayas found in Himachal Pradesh and Uttarakhand).", "source": null}, {"id": 800, "topic": "Mountain", "question": "The Garo, Khasi and Jaintia hills are a subdivision of:", "options": {"a": "Assam valley", "b": "Barak basin", "c": "Surma basin", "d": "Meghalaya plateau"}, "answer": "d", "explanation": "Meghalaya Plateau. The plateau is separated from the main block of the peninsular plateau by a gap called the Garo-RajMahal gap. It is located on the northeastern flank of Peninsular India. It is one of the rainiest, most tectonically active areas in the world. Hills in North East India - Lushai Hills or Mizo Hills (Mizoram and Tripura), Chin Hills (Manipur to Chin State of Myanmar), Japfu Mountain Range (Nagaland), Barail Range (Assam), Dafla Hills and Abor Hills (Arunachal Pradesh).", "source": null}, {"id": 801, "topic": "Mountain", "question": "The holy mountain 'Kailash' is located in which neighbouring country of India ?", "options": {"a": "Pakistan", "b": "Afghanistan", "c": "Bangladesh", "d": "China"}, "answer": "d", "explanation": "China. Mount Kailash - Located near Lake Mansarovar and Lake Rakshastal. The Indus River originates from Mansarovar lake (Tibet). Some highest mountain peaks: India - Kanchenjunga (8598m), Nanda Devi (7817m). Nepal - Mount Everest (8848.86 m), Dhaulagiri (8172m). Hindu temple outside India: Nepal - Pashupatinath Temple, Indonesia - Prambanan Temple, Bangladesh - Dhakeshwari temple, Cambodia - Angkor Wat.", "source": null}, {"id": 802, "topic": "Mountain", "question": "Name an oval-shaped range of hills sculpted by glacial flow.", "options": {"a": "Sandur", "b": "Drumlins", "c": "Moraines", "d": "Esker"}, "answer": "b", "explanation": "Drumlins - It is formed by the filling of heavy rocky debris in the glacial crevices and its stay under the ice. One end of the drumlins facing the glacier called the stoss end and the other end called tail. Eskers: When glaciers melt in summer, the water flows on the surface of the ice. These waters accumulate beneath the glacier and flow like streams in a channel beneath the ice.", "source": null}, {"id": 803, "topic": "Mountain", "question": "Consider the following statements regarding famous hills in India: I. The Shevaroy Hills are located in Tamil Nadu. II. Guru Shikhar is the highest peak in Rajasthan. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Famous hills:- Chhattisgarh - Tulasi Dongar, Bailadila, Balaraja Gutta. Odisha - Devmali, Turia Konda, Mahendragiri, Devagiri. Rajasthan - Guru Shikhar, Mt. Abu, Sunda. Kangchenjunga (Sikkim) - Highest mountain peak in India.", "source": null}, {"id": 804, "topic": "Mountain", "question": "Which among the following is the highest peak of West Bengal?", "options": {"a": "Sandakphu", "b": "Saramati", "c": "Doddabetta", "d": "Deomali"}, "answer": "a", "explanation": "Sandakphu (3636 m). It is located on the border between India and Nepal, belongs to the Singalia Mountain ranges. It is a part of the Purvanchal range. Doddabetta (2637 m) - It is the highest peak of Tamil Nadu and a part of Nilgiri Mountain Range.", "source": null}, {"id": 805, "topic": "Mountain", "question": "The Himalayan Mountain range was formed by the collision of ________.", "options": {"a": "African Plate and Australian Plate", "b": "Indian Plate and African Plate", "c": "Eurasian Plate and African Plate", "d": "Indian Plate and Eurasian Plate"}, "answer": "d", "explanation": "Indian Plate and Eurasian Plate. Plates - They are large, rigid pieces of the Earth's lithosphere that fit together like a jigsaw puzzle, and their movements are responsible for shaping the Earth's surface through processes such as earthquakes and the formation of mountains. Major plates (7) - African Plate, Antarctic Plate, Eurasian Plate, North American Plate, South American Plate, Pacific Plate and Indo-Australian Plate.", "source": null}, {"id": 806, "topic": "Mountain", "question": "Dhinodhar Hills is located which Indian state/Union Territory?", "options": {"a": "Andaman and Nicobar Islands", "b": "Maharashtra", "c": "Gujarat", "d": "West Bengal"}, "answer": "c", "explanation": "Gujarat. Dhinodhar Hill is tourist and pilgrimage spot. Other hills Gujarat - Chotila, Pavagadh, Palitana, Saputara, Girnar, Bardo, Gabbar. Hills Maharashtra - Mahabaleshwar, Panchgani, Matheran, Lonavala, Amboli etc. West Bengal - Gorgaburu Hill, Ajodhya Hills, Susunia Hill etc. Andaman and Nicobar Islands - Ross Island, Barren Island, Saddle Peak, Katchal, Narcondam Island etc.", "source": null}, {"id": 807, "topic": "Mountain", "question": "Which among the following peaks is the highest peak of Jharkhand?", "options": {"a": "Kangto", "b": "Girnar", "c": "Anamudi", "d": "Parasnath"}, "answer": "d", "explanation": "Parasnath. It is named after Lord Parshvanath (23rd Jain Tirthankara). Kangto peak (Arunachal Pradesh). State and Highest Peak Gujarat (Girnar Peak), Rajasthan (Guru Shikhar), Andhra Pradesh (Arma Konda), Haryana (Karah Peak), Karnataka (Mullayanagiri Peak).", "source": null}, {"id": 808, "topic": "Mountain", "question": "Which of the following statements is NOT correct?", "options": {"a": "Mahendragiri is the highest peak in the Eastern Ghats.", "b": "The height of the Western Ghats progressively decreases from north south.", "c": "The Western Ghats cause orographic rain.", "d": "The Eastern Ghats stretch from the Mahanadi Valley to the Nilgiris in the south."}, "answer": "b", "explanation": "The height of the Western Ghats progressively increases from north to south. The highest peaks of Western Ghats include the Anai Mudi (2,695 metres) and the Doda Betta (2,637 meters).The Western Ghats, also known as the Sahyadri Hills, Mainly traverse the States of Kerala, Tamil Nadu, Karnataka, Goa, Maharashtra and Gujarat.", "source": null}, {"id": 809, "topic": "Mountain", "question": "Which among the following is the largest of all the duns of the Shiwaliks mountain range in India?", "options": {"a": "Patli Dun", "b": "Jammu Dun", "c": "DehraDun", "d": "Kotli Dun"}, "answer": "c", "explanation": "Dehradun (Length - 35-45 km, Width - 22-25 km). Dun- Valleys that lie between the Shivalik and Lesser himalaya. Other duns of Uttarakhand in Kota dun, Patli dun, Har ki dun. Kotli dun Himachal Pradesh. Kashmir Himalayas Jammu dun and Pathankot dun.", "source": null}, {"id": 810, "topic": "Mountain", "question": "Kalsubai peak is located in which of the following Indian states?", "options": {"a": "Madhya Pradesh", "b": "Maharashtra a", "c": "Andhra Pradesh", "d": "Himachal Pradesh in"}, "answer": "b", "explanation": "Maharashtra. Kalsubai (Everest of Maharashtra) is the highest: e peak of Maharashtra’s Ahmednagar district in Akola tmaluka.", "source": null}, {"id": 811, "topic": "Mountain", "question": "Which of the following is NOT type of a fold mountain?", "options": {"a": "Aravali reange", "b": "The Rhine Valley", "c": "Appalachians", "d": "Ural Mountains"}, "answer": "b", "explanation": "Rhine Valley. Fold mountains are the most common type of mountain F in the world. The rugged, soaring heights of the Himalayas, Andes, Alps and Aravalli Range (oldest range) are all active fold mountains. Rhine Valley (Germany) is the valley of the river Rhine in Europe. It is also known as Alpine Rhine. The Appalachian Mountains are - found in North America.", "source": null}, {"id": 812, "topic": "Mountain", "question": "Match the Following List I (Peak) List II (Height in metres) A. Mount Everest (i) 8,598 m B. Kanchenjunga (ii) 8,172 m C. Makalu (iii) 8,848 m D. Dhaulagiri (iv) 8,481 m", "options": {"a": "A–iii, B–i, C–iv, D–ii", "b": "A–ii, B–iv, C–i, D–iii", "c": "A–iv, B–iii, C–ii, D–i to", "d": "A–i, B–ii, C–iii, D–iv"}, "answer": "a", "explanation": "A–iii, B–i, C–iv, D–ii. The great Himalayan range width varies between 160-400 km from north to south. Famous peaks of Himalayas: Mount Everest (8848 m), Mt. Kanchenjunga (8598 m), Mt. Makalu (8481 m), Mt. Dhaulagiri (8172 m). The Himalayas consist of three parallel ranges - Himadri (Great Himalayas or the Higher Himalayas), Himachal (Lesser Himalayas or the Lower Himalayas) and Shiwaliks (Outer Himalayas).", "source": null}, {"id": 813, "topic": "Mountain", "question": "What is the average height of inner Himalayas?", "options": {"a": "6000 metres", "b": "4500 metres", "c": "5200 metres", "d": "7100 metres"}, "answer": "a", "explanation": "6000 metres. The Himalayas consist of three parallel ranges, the Greater Himalayas or the Inner Himalayas or the Himadri, the Lesser Himalayas called the Himachal (with an average height of 3,700 to 4500 meters), - and the Shivalik hills (with an average - height of 900 to 1100 meters), which - comprise ithe foothills.", "source": null}, {"id": 814, "topic": "Mountain", "question": "Asia is separated from Europe by ______ mountains.", "options": {"a": "Himalayan", "b": "Andes Mountains", "c": "Alps", "d": "Ural"}, "answer": "d", "explanation": "Ural. It is formed as a result of the compression of tectonic plates, leading to the formation of large fold-like structures on the Earth's crust. Alps mountain (natural boundary between France and Italy), Andes Mountains range (South American countries of Chile and Argentina), Himalaya (plains of the Indian subcontinent from the Tibetan Plateau). Caucasus mountains (Asia and Europe).", "source": null}, {"id": 815, "topic": "Mountain", "question": "Which of the following have mountain range young fold mountains?", "options": {"a": "Appalachians mountain range", "b": "Alps mountain range", "c": "Aravali mountain range", "d": "Ural mountain range"}, "answer": "b", "explanation": "Alps mountain range. Fold mountains form when two or more of the Earth's tectonic plates collide. Types - Anticline, Syncline, Monocline, Isocline. Features - Rugged relief, imposing height (lofty), high conical peaks. Examples are the Rockies, the Andes, the Alps, the Himalayas, etc. Old fold Mountain - An Appalachian mountain range, Aravali mountain range, and Ural mountain range.", "source": null}, {"id": 816, "topic": "Mountain", "question": "The uplifted blocks of block mountains are called ______.", "options": {"a": "horsts", "b": "grabens", "c": "slopes", "d": "cones"}, "answer": "a", "explanation": "Horsts. Block mountains are formed due to the upward movement of the middle block between two normal faults. The up-thrown block is also called a horst. Graben is bounded by normal faults dipping toward each other. These mountains include the Great African Rift Valley, the Rhine Valley (graben) in Germany, etc.", "source": null}, {"id": 817, "topic": "Mountain", "question": "Consider the following statements about mountain passes in India: I. Fotu La is the highest point in Ladakh. II. Namika La is located in Himachal Pradesh. III. Rohtang Pass is in Himachal Pradesh. Which of the above statements is/are incorrect?", "options": {"a": "Only II", "b": "Only I", "c": "Only III", "d": "I and II"}, "answer": "a", "explanation": "Only II. Namika La is a high mountain pass in the Zaskar Range of the Himalayas in Ladakh. Fatu La is a mountain pass on the Srinagar-Leh highway in the Zanskar Range of the Himalayas in Ladakh, UT. It is one of two high mountain passes between Leh and Kargil, the other being Namika La.", "source": null}, {"id": 818, "topic": "Mountain", "question": "Which of the following is also known as the ‘White Mountain’?", "options": {"a": "Cho Oyu", "b": "Makalu", "c": "Dhaulagiri", "d": "Lhotse"}, "answer": "c", "explanation": "Dhaulagiri is in west-central Nepal. Cho Oyu lies on the Nepal-Tibet border. Makalu is southeast of Everest, on the Nepal-Tibet border. Lhotse is on the border between Tibet and Nepal's Khumbu region.", "source": null}, {"id": 819, "topic": "Mountain", "question": "Which of the following statement(s) is/are correct regarding mountains? I. Mountains may be arranged in a line known as range. II. The Aravali range in India is one of the oldest fold mountain systems in the world. III. Mt. Kilimanjaro in South America is an example of Volcanic Mountain", "options": {"a": "Only I and II", "b": "Only II", "c": "I, II and III", "d": "Only I"}, "answer": "a", "explanation": "Only I and II. Mount Kilimanjaro is a dormant volcano in Tanzania. It is the highest mountain in Africa. It was formed when molten rock from the depths of the earth rose from the crust and piled up on its own. Top mountains in Africa:- Mount Kenya, Mount Stanley, Mount Speke, Mount Baker, Mount Emin.", "source": null}, {"id": 820, "topic": "Mountain", "question": "The Deomali is the highest mountain peak of ______.", "options": {"a": "Assam", "b": "West Bengal", "c": "Bihar", "d": "Odisha"}, "answer": "d", "explanation": "Odisha. The Deomali peak height is 1,762 m. The Borail Range is the highest Mountain Ranges in Assam. Someshwar Fort is the highest peak of Bihar. It is part of Shivalik hill.", "source": null}, {"id": 821, "topic": "Mountain", "question": "In which Indian state will you find Mount Tiyi?", "options": {"a": "Arunachal Pradesh", "b": "Odisha", "c": "Himachal Pradesh", "d": "Nagaland"}, "answer": "d", "explanation": "Nagaland. Some other mountains: Japfu Peak, Changkikong Range, Mount Saramati, Veda Peak, Ongpangkong Range.", "source": null}, {"id": 822, "topic": "Mountain", "question": "Consider the following statements regarding the highest peaks in India: I. Gorichen Peak, with an elevation of 6858 m, is the highest peak in Arunachal Pradesh. II. Dhupgarh is the highest peak ihn Himachal Pradesh. Which of the above statementBs is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Onl y I. Dhupgarh is the highest in Madhya Pradesh, and Reo Purgyil is the highest in Himachal Pradesh. e", "source": null}, {"id": 823, "topic": "Mountain", "question": "Mountaineers refer to altitudes above about _______ meters as the ‘death zrone’.", "options": {"a": "5,800", "b": "8,000", "c": "6,700", "d": "7,200"}, "answer": "b", "explanation": "8,000. The death zone refers to altitudes where oxygen pressure is too low to sustain human life for extended periods.", "source": null}, {"id": 824, "topic": "Mountain", "question": "Which of the following is a mountain peak that rises above the surrounding peaks at the mountainous border of the Indian state of Nagaland and the Sagaing region of Myanmar?", "options": {"a": "Mount Kalsubai", "b": "Mount Doddabetta", "c": "Mount Saramati", "d": "Mount Dhupgarh"}, "answer": "c", "explanation": "Mount Saramati. Doddabetta is the highest mountain in the Nilgiri Mountains at 2,637 meters. Kalsubai (highest point) is a mountain in the Western Ghats, located in the Indian state of Maharashtra.", "source": null}, {"id": 825, "topic": "Mountain", "question": "Generally, a steep hill with an elevation of more than _______ meters is classified as a mountain.", "options": {"a": "600", "b": "500", "c": "1000", "d": "800"}, "answer": "a", "explanation": "600. Within the earth, a continuous movement is taking place. The internal process leads to the upliftment and sinking of the earth's surface at several places. The external process is the continuous wearing down and rebuilding of the land surface. Eg: Erosion and Deposition.", "source": null}, {"id": 826, "topic": "Mountain", "question": "_______ is created by the collision of convergent plate boundaries.", "options": {"a": "Mid-ocean ridge", "b": "Land erosion", "c": "Oceanic trench", "d": "Mountain building"}, "answer": "d", "explanation": "Mountain building. A convergent boundary is an area on earth where two or more lithospheric plates converge or collide and one plate eventually slides beneath the other.", "source": null}, {"id": 827, "topic": "Mountain", "question": "'Pidurutalagala' is the highest mountain peak in ______.", "options": {"a": "Bhutan", "b": "Sri Lanka", "c": "Myanmar", "d": "Nepal"}, "answer": "b", "explanation": "Sri Lanka. Pidurutalagala (Mount Pedro) is the tallest mountain in Sri Lanka, standing at 2,524 m in Nuwara Eliya.", "source": null}, {"id": 828, "topic": "Mountain", "question": "Which of the following hills is situated in Assam?", "options": {"a": "Aravali Hills", "b": "Karbi Anglong Hills", "c": "Javadi Hills", "d": "Shevaroy Hills"}, "answer": "b", "explanation": "Karbi Anglong Hills. Javadi Hills and Shevaroy Hills are located in Tamil Nadu.", "source": null}, {"id": 829, "topic": "Mountain", "question": "Where is Mount Diavolo, an important mountain peak in the Andaman and Nicobar Islands, Located?", "options": {"a": "Great Nicobar", "b": "North Andaman", "c": "Middle Andaman", "d": "South Andaman"}, "answer": "d", "explanation": "South Andaman. It has an elevation of 295 meters. Middle Andaman is separated from North Andaman Island by Austen Strait, and from Baratang Island at the south by Homfray's Strait.", "source": null}, {"id": 830, "topic": "Mountain", "question": "Mount Jopuno is situated in which of the following states?", "options": {"a": "Uttarakhand", "b": "Sikkim", "c": "Andhra Pradesh", "d": "Himachal Pradesh"}, "answer": "b", "explanation": "Sikkim. Mount Jopuno, located in western Sikkim at 5,603 meters, is situated within Khangchendzonga National Park.", "source": null}, {"id": 831, "topic": "Mountain", "question": "Which of the following hills is situated in Andhra Pradesh?", "options": {"a": "Kaimur Hills", "b": "Pachmarhi Hills", "c": "Nagari Hills", "d": "Girnar Hills"}, "answer": "c", "explanation": "Nagari hills. Other hill stations in Andhra Pradesh include Tirumala, Araku Valley, Horsley Hills, Lambasingi, Nallamala Hills.", "source": null}, {"id": 832, "topic": "Mountain", "question": "In which of the following states is the Shatrunjaya Hills located?", "options": {"a": "Gujarat", "b": "Andhra Pradesh", "c": "Madhya Pradesh", "d": "Karnataka"}, "answer": "a", "explanation": "Gujarat. Other prominent hills in Gujarat include– Bhujia Hill, Dhinodhar, Girnar, Kalo Dungar, Pavagadh Hill, Thaltej-Jodhpur Tekra, Wilson Hills.", "source": null}, {"id": 833, "topic": "Mountain", "question": "Which of the following mountains is situated near the Siachen region of Ladakh in India?", "options": {"a": "Kirat Chuli Mountain", "b": "Kabru Mountain", "c": "Kanchenjunga Mountain", "d": "K12 Mountain"}, "answer": "d", "explanation": "K12 Mountain. Kirat Chuli Mountain or Tent Peak is a mountain in the Himalayas. Kabru is a mountain in the Himalayas on the border of eastern Nepal and India. Kanchenjunga is part of the Great Himalaya Range. K12 is the second highest peak in the Saltoro Mountains, a subrange of the Karakoram range in the Siachen region, in Ladakh.", "source": null}, {"id": 834, "topic": "Mountain", "question": "Borra Caves are situated on the East Coast of India in which of the following hills?", "options": {"a": "Nallamala Hills", "b": "Horsley Hills", "c": "Nagari Hills", "d": "Ananthagiri Hills"}, "answer": "d", "explanation": "Ananthagiri Hills. Borra Caves, also called Borra Guhalu, are located on the East Coast of India, in the Ananthagiri hills of the Araku Valley of the Visakhapatnam district in Andhra Pradesh. Volcano", "source": null}, {"id": 835, "topic": "Volcano", "question": "Which Indian plateau is formed primarily by volcanic activity ?", "options": {"a": "Malwa Plateau", "b": "Shillong Plateau", "c": "Chota Nagpur Plateau", "d": "Deccan Plateau"}, "answer": "d", "explanation": "Deccan Plateau. The Deccan Plateau was formed due to volcanic activity around 65 million years ago. The eruption created the Deccan Traps, one of the largest volcanic features on Earth. Malwa Plateau - Formed by lava flow partly, but not the largest volcanic plateau. Shillong Plateau - Tectonic origin. Chota Nagpur Plateau - Rich in minerals, formed due to uplift and erosion.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 836, "topic": "Volcano", "question": "Consider the following statements regarding volcanic eruptions: I. Caldera eruptions are the most explosive type of volcanic activity on Earth. II. Flood basalt provinces, like the Deccan Traps, are examples of highly explosive eruptions. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. A caldera eruption is the most explosive type of volcanic activity, occurring when a volcano's magma chamber empties and the ground above collapses, forming a large, circular depression. Example: Yellowstone Caldera. Dykes: It is a vertical or steeply inclined geological formation that occurs when magma cuts through rock layers and solidifies. Flood basalt provinces: Flood basalt refers to large, extensive lava flows that spread out over vast areas. Example: Deccahn Traps in India.", "source": null}, {"id": 837, "topic": "Volcano", "question": "What is the name of the process of gases being outpour ed from the interior of the solid earth ?", "options": {"a": "Evaporation", "b": "Transpiration", "c": "Degassing", "d": "Gas evolution"}, "answer": "c", "explanation": "Degassing is the process by which gasees are released from the interior of the solid Earth, typically throu gh volcanic activity or other geological processes. This includes g ases such as water vapor, carbon F dioxide, sulfur dioxide, and others that are expelled from magma or other subsurface materials.", "source": null}, {"id": 838, "topic": "Volcano", "question": "Which of the following statements is best related to the 'pacific ring of fire'?", "options": {"a": "Known for thermal power station", "b": "Known for volcano and earthquakes", "c": "Known for only glacial formations", "d": "Known for tropical rainforests"}, "answer": "b", "explanation": "The 'ring of fire' is a ring of volcanoes in the Pacific Ocean. World Geography and Map", "source": null}, {"id": 839, "topic": "World Geography and Map", "question": "Which is the largest island of India in terms of area?", "options": {"a": "Rameswaram", "b": "Great Nicobar Island", "c": "Sriharikota", "d": "Majuli"}, "answer": "b", "explanation": "Great Nicobar Island. Great Nicobar Island, located in the southernmost part of the Andaman and Nicobar Islands, is the largest island of India with an area of about 1045 sq km. It is strategically important as it lies close to the Malacca Strait. Rameswaram is a small island in Tamil Nadu, Sriharikota is a barrier island in Andhra Pradesh housing ISRO’s launch centre, and Majuli in Assam is the world’s largest river island but not the largest overall island of India.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 840, "topic": "World Geography and Map", "question": "Where is the Gulf of Mannar located?", "options": {"a": "Between the south-eastern tip of India and the eastern coast of Sri Lanka", "b": "Between the south-eastern tip of India and the western coast of Sri Lanka", "c": "Between the south-eastern tip of India and the north-western coast of Sri Lanka", "d": "Between the south-eastern tip of India and the southern coast of Sri Lanka"}, "answer": "b", "explanation": "Gulf of Mannar: It is located in the Coromandel Coast region. The Gulf of Mannar is separated from the Palk Bay by a chain of islands and coral reefs known as Adam's Bridge or Ram Setu. It is bound to the northeast by Rameswaram (island), Adam’s (Rama’s) Bridge (a chain of shoals), and Mannar Island.", "source": null}, {"id": 841, "topic": "World Geography and Map", "question": "Consider the following statements regarding straits separating continents: I. The Strait of Gibraltar separates Europe and Africa, connecting the Mediterranean Sea with the Atlantic Ocean. II. The Bosporus Strait separates Europe and Africa. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Bosporus Strait (the narrowest strait of the world)- It is a natural strait connecti
