and Kashmir", "b": "Assam", "c": "Bihar", "d": "Meghalaya"}, "answer": "a", "explanation": "Jammu and Kashmir. It is located near the Soura area in the city of Srinagar, Jammu and Kashmir. The lake is connected with the famous Dal Lake.", "source": null}, {"id": 228, "topic": "Indian Drainage System", "question": "Yerla, Warna and Dindi are tributaries of the ______ river system.", "options": {"a": "Brahmaputra", "b": "Godavari", "c": "Kaveri", "d": "Krishna"}, "answer": "d", "explanation": "Krishna.", "source": null}, {"id": 229, "topic": "Indian Drainage System", "question": "Consider the following statements regarding hydrological units: Statement I: A watershed is a natural geo-hydrological unit of land that collects water and drains it through a common point by a system of streams. Statement II: Watersheds are classified based on their area — Macro (>50,000 ha), Sub-watershed (10,000–50,000 ha), Milli (1,000–10,000 ha), Micro (100–1,000 ha), and Mini (1–100 ha). Which of the statements given abohve is/are correct?", "options": {"a": "Only I", "b": "Only II B", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. A watershed, also known as a drainage basin catchment area, is an area of land where all the surface water from rain, snowmelt, etc., converges and drains into a single point, suche as a river, lake, or other body water.", "source": null}, {"id": 230, "topic": "Indian Drainage System", "question": "A channel of a canal where water flrows under the influence of gravity is called ______.", "options": {"a": "lift channel", "b": "command area", "c": "warabandi system", "d": "flow channel"}, "answer": "d", "explanation": "flow channel. It is the flow of water induced by the effect of gravity. The surface of the flowing liquid is at atmospheric pressure and free to air. The example of open channel flow includes flow in canal, river, etc.", "source": null}, {"id": 231, "topic": "Indian Drainage System", "question": "On which river is Peacock Island located?", "options": {"a": "Mahanadi", "b": "Ganga", "c": "Brahmaputra", "d": "Yamuna"}, "answer": "c", "explanation": "Brahmaputra. Peacock Island or Umananda Island is the smallest inhabited river island in the middle of river Brahmaputra, flowing through the city of Guwahati. Its name derives from Assamese Uma. It is also known as Bhasmachal.", "source": null}, {"id": 232, "topic": "Indian Drainage System", "question": "Which of the following is Uttarakhand’s first gravity dam?", "options": {"a": "Tehri dam", "b": "Baigul dam", "c": "Dhora dam", "d": "Song dam"}, "answer": "d", "explanation": "Song dam which is to be built on the foothills of Mussoorie on the Song river to meet the water shortage of the state during the summers.", "source": null}, {"id": 233, "topic": "Indian Drainage System", "question": "Consider the following statements about the rivers of Nepal: Statement I: The Karnali River, also called Ghaghara, originates on the Tibetan Plateau near Lake Manasarovar. Statement II: The Seti River is the longest river of Nepal. Which of the above statements is/are incorrect?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "b", "explanation": "Only II. The Karnali River is the longest river of Nepal. The river cuts through the Himalayas in Nepal and eventually joins the Sharda River at Brahmaghat in India, becoming the Ghaghara River", "source": null}, {"id": 234, "topic": "Indian Drainage System", "question": "Which type of dam is a temporary dam constructed to exclude water from the specific area?", "options": {"a": "Coffer", "b": "Impounding", "c": "Detention", "d": "Debris or"}, "answer": "a", "explanation": "coffer. It is built to permit damming, diversion, or dewatering and construction of a permanent structure in of a dry area. A detention dam is built to catch surface runoff and stream water flow to regulate the water flow in areas below the dam. Detention dams are commonly used to reduce the damage caused by flooding or to manage the flow rate through a channel.", "source": null}, {"id": 235, "topic": "Indian Drainage System", "question": "Suryadhar lake is located in which of the following states?", "options": {"a": "HimachalPradesh", "b": "Arunachal Pradesh", "c": "Uttarakhand", "d": "Meghalaya"}, "answer": "c", "explanation": "Uttarakhand. Famous Lakes in Uttarakhand - Auli Artificial Lake, Baraadsar Lake, Bedni Kund, Bhalu Dam, Bhimtal Lake, Bhulla Tal, Bisurital, Brahmatal Trek etc.", "source": null}, {"id": 236, "topic": "Indian Drainage System", "question": "In which of the following states is the Sirki Waterfall located?", "options": {"a": "Arunachal Pradesh", "b": "Andhra Pradesh", "c": "Himachal Pradesh", "d": "Madhya Pradesh"}, "answer": "a", "explanation": "Arunachal Pradesh. Other Waterfalls - The Nuranang Waterfall, the Bap Teng Kang Waterfall.", "source": null}, {"id": 237, "topic": "Indian Drainage System", "question": "Rain is liquid ______.", "options": {"a": "precipitation", "b": "condensation", "c": "decantation", "d": "sedimentation"}, "answer": "a", "explanation": "Precipitation is any product of the condensation of atmospheric water vapor that falls under gravitational pull from clouds. The main forms of precipitation include drizzling, rain, sleet, snow, ice pellets, graupel and hail.", "source": null}, {"id": 238, "topic": "Indian Drainage System", "question": "Which of the following dams is located in Jharkhand?", "options": {"a": "Koyna", "b": "Maithon", "c": "Mettur", "d": "Sardar Sarovar"}, "answer": "b", "explanation": "Maithon dam is on the river Barakar in the district Dhanbad of Jharkhand. It has an underground power station, the first of its own kind in the whole of SouthEast Asia.", "source": null}, {"id": 239, "topic": "Indian Drainage System", "question": "Assertion (A): The mouth of the Indus River lies to the north of the Tropic of Cancer. Reason (R): The rivers Mahanadi, Krishna, and Godavari lie to the south of the Tropic of Cancer.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "answer": "b", "explanation": "Both A and R are true, but R is not the correct explanation of A. The Tropic of Cancer is an imaginary line on the Earth's surface, located at approximately 23.5 degrees North latitude. In India, the Tropic of Cancer passes through eight states: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, and Mizoram", "source": null}, {"id": 240, "topic": "Indian Drainage System", "question": "What kind of depositional landforms are formed when streams flowing from higher levels break into foot slope plains of low gradient?", "options": {"a": "Point bars", "b": "Flood plains", "c": "Alluvial fans", "d": "Natural levees"}, "answer": "c", "explanation": "Alluvial fans. A point bar is a depositional feature made of alluvium that accumulates on the inside bend of streams and rivers below the slip-off slope. An alluvial fan is a triangle-shaped deposit of gravel, sand, and even smaller pieces of sediment, such as silt", "source": null}, {"id": 241, "topic": "Indian Drainage System", "question": "Where is the Baglihar Dam located?", "options": {"a": "Gujarat", "b": "Himachal Pradesh", "c": "Jammu & Kashmir", "d": "Telangana"}, "answer": "c", "explanation": "Jammu and Kashmir. Baglihar dam is a run-of-the-river power project on the Chenab river. Important Dams - Kadana Dam (Gujarat), Chamera Dam (Himachal Pradesh), Singur Dam (Telangana). World Drainage System", "source": null}, {"id": 242, "topic": "Indian Drainage System", "question": "Which of the following has the highest salinity?", "options": {"a": "Great salt lake", "b": "Lake Van", "c": "Red sea", "d": "Dead sea"}, "answer": "b", "explanation": "Lake Van. Being the largest lake in Turkey, it has the highest salinity (330%). As a saline soda lake fed by small streams, it is one of the few endorheic lakes over 3,000 square kilometers. High salinity usually prevents it from freezing, despite high altitude and winter temperatures below 0°C (32°F).", "source": null}, {"id": 243, "topic": "Indian Drainage System", "question": "Consider the following statements about river landforms: 1. A river in its middle course is capabl e of forming meanders due to both erosion and deposition. 2. Landforms such as V-shaped valleys and waterfalls are typically associated with the uppeer course of a river. Which of the ab ove statement(s) is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 aend 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. A meander is a U-shaped bend in a river formed by errosion and deposition. A V-shaped valley is created by river erosion. A waterfall is where water drops vertically over a ledge. A delta forms at a river's mouth where it meets the sea or ocean.", "source": null}, {"id": 244, "topic": "Indian Drainage System", "question": "As of 2021, which is the world's largest drainage basin with an area of about 70,00,000 km 2 ?", "options": {"a": "Congo basin", "b": "Amur basin", "c": "Amazon basin", "d": "Nile basin"}, "answer": "c", "explanation": "Amazon basin. The Amazon Basin, formed by numerous tributaries, drains parts of Brazil, Peru, Bolivia, Ecuador, Colombia, and a small section of Venezuela. It lies directly on the equator and experiences a hot, humid climate year-round, with both day and night feeling equally warm and sticky. High rainfall, high temperature, and high humidity are the features of the basin.", "source": null}, {"id": 245, "topic": "Indian Drainage System", "question": "Which of the following is the largest artificial lake of Asia?", "options": {"a": "Naini Lake", "b": "Bhopal Lake", "c": "Dal Lake", "d": "Chilika Lake"}, "answer": "b", "explanation": "Bhopal Lake, also known as Bhojtal, was created in the 11th century by King Bhoja of the Paramara dynasty. It is situated in Bhopal, Madhya Pradesh, and is constructed on Kolans river. Lakes in Madhya Pradesh: Sangram Sagar, Shahpura lake. Dal Lake - It is often referred to as Srinagar's Jewel, is a freshwater lake located in Srinagar, Jammu and Kashmir.", "source": null}, {"id": 246, "topic": "Indian Drainage System", "question": "Which river originates south of the equator and flows north through north-eastern Africa to drain into the Mediterranean Sea?", "options": {"a": "Lena River", "b": "Nile River", "c": "Amazon River", "d": "Congo River"}, "answer": "b", "explanation": "Nile River. Its length is about 6,695 kilometers (4,160 miles). The Nile basin is huge and includes parts of Tanzania, i Burundi, Rwanda, Congo (Kinshaisa), Kenya. Other important rivers a of the world: Lena River: Origin - Baikal range, Drains - Laptev Sea. Amazon River: Origin - Andes Mountains, Drains - Atlantic Ocean. Congo River (cross the equator twice): Origin - Africa Rift, Drains - Atlantic Ocean.", "source": null}, {"id": 247, "topic": "Indian Drainage System", "question": "Where are Huka Falls located ?", "options": {"a": "Germany", "b": "Spain", "c": "New Zealand", "d": "Australia"}, "answer": "c", "explanation": "New Zealand. Huka Falls is on the Waikato River. Major Waterfalls: New Zealand - Kitekite Falls, Dawson Falls, Taranaki Falls, Owharoa Falls. Germany - Triberger Waterfall, Todtnau falls. Spa. Australia - Wallaman Falls, Millaain - Salto del Nervion, Fervenza do Ezaro Millaa falls, Liffey Falls, Russell Falls. Angel Falls in Venezuela is the highest waterfall in the world.", "source": null}, {"id": 248, "topic": "Indian Drainage System", "question": "Consider the following statements about lakes: 1. Red Lake is located in the United Kingdom. 2. Chilka Lake, Sambhar Lake, Loktak Lake and Wular Lake are examples of important lakes of India. Which of the above statement(s) is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. Red Lake is located in the USA. Country and Lakes: USA - Abert, Ontario, Erie, Huron, Michigan. India - Chilka Lake, Sambhar Salt Lake, Loktak Lake, Wular Lake. Canada - Aberdeen Lake, Lake Abitibi. Brazil - Agua Vermelha. Australia - Lake Alexandrina, Lake Amadeus. Scotland - Loch Lomond.", "source": null}, {"id": 249, "topic": "Indian Drainage System", "question": "Which of the following is the highest navigable lake in the world?", "options": {"a": "Huron", "b": "Titicaca", "c": "Superior", "d": "Como"}, "answer": "b", "explanation": "Titicaca - Situated 3810 m above sea level and is situated between Peru to the west and Bolivia to the east, South America.", "source": null}, {"id": 250, "topic": "Indian Drainage System", "question": "What is the total number of rivers including tributaries in Bangladesh?", "options": {"a": "About 1000", "b": "About 800", "c": "About 700", "d": "About 500"}, "answer": "c", "explanation": "About 700. Bangladesh: It has four major river systems – The Brahmaputra - Jamuna, the Ganges Padma, the Surma - Meghna and the Chittagong region river system. Chittagong is the largest and most important seaport in Bangladesh.", "source": null}, {"id": 251, "topic": "Indian Drainage System", "question": "Which sea, located in the north -western part of the Indian Ocean, joins the Gulf of Oman in the north-west and the Gulf of Aden in the south-west and covers a total area of 1,491,000 square miles?", "options": {"a": "Arabian Sea", "b": "Mediterranean Sea", "c": "Caribbean Sea", "d": "Coral Sea"}, "answer": "a", "explanation": "Arabian Sea forms part of the sea route between Europe and India. Name of Straits and Joining Seas - Strait of Gibraltar (Atlantic Ocean with the Mediterranean Sea), Sunda Strait (Java Sea and Indian Ocean), Mesina Strait island of Sicily and the southern tip of mainland Italy), Bab-el-Mandeb Strait (Red Sea and Gulf of Aden), North Channel (Irish Sea and Atlantic Ocean).", "source": null}, {"id": 252, "topic": "Indian Drainage System", "question": "Consider the following statements regarding important straits and channels: 1. The Grand Channel lies between Great Nicobar Island and Indonesia’s Sumatra Island. 2. The Coco Strait lies between Sumatra and Java islands. Which of the above statement(s) is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. The Coco Strait is between the North Andaman islands and the Coco Islands of Myanmar. Sumatra and Java are separated by the Sunda Strait.", "source": null}, {"id": 253, "topic": "Indian Drainage System", "question": "The city of _________ is located at the mouth of the Yangtze River.", "options": {"a": "Shanghai", "b": "Beijing", "c": "Lhasa", "d": "Guangzhou"}, "answer": "a", "explanation": "Shanghai. Yangtze river (approximately 6300 km) is the longest river of both China and Asia. It rises in the mountains of Qinghai province of China.", "source": null}, {"id": 254, "topic": "Indian Drainage System", "question": "Which is the correct sequence of lakes according to depth (from maximum to minimum) ?", "options": {"a": "Caspian Sea > Tanganyika > Vostok > Baikal", "b": "Baikal > Caspian Sea > Tanganyika > Vostok", "c": "Baikal > Tanganyika > Caspian Sea > Vostok", "d": "Caspian Sea > Baikal >Tanganyika > Vostok -"}, "answer": "c", "explanation": "Baikal (world’s deepest lake): Depth - 5,387 ft, Location - Russia. Tanganyika: Depth - 4,823 ft, Location Central Africa on the borders of Tanzania, the Democratic Republic of Congo, Zambia and Burundi. Caspian Sea: Depth - 3,363 ft, Location Kazakhstan, Turkmenistan, Iranh, Azerbaijan, and Russia. Vostok: Depth about 3000 ft, Location - Antarctica. Minerals and Energy Resources in India", "source": null}, {"id": 255, "topic": "Minerals and Energy Resources", "question": "Name the state which is the largest producer of lignite coal ?", "options": {"a": "Maharashtra", "b": "Gujarat (", "c": "Rajasthan", "d": "Tamil Nadu"}, "answer": "d", "explanation": "Tamil Nadu. Coal is a vital mineral in India, mainly used for thermal F power generation and iron smelting. It is found in Gondwana and Tertiary deposits, with about 80% being non-coking bituminous coal. Major Gondwana coalfields lie in the Damodar Valley, with Jharia being the largest and Raniganj the second. Important coal mining centres include Singrauli, Korba, Talcher, Chanda–Wardha, and Singareni, while Tertiary coal is found in Assam, Meghalaya, Arunachal Pradesh, and Nagaland. Lignite deposits occur in Tamil Nadu, Puducherry, Gujarat, and Jammu & Kashmir.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 256, "topic": "Minerals and Energy Resources", "question": "Name the major coal producing region located in Telangana state?", "options": {"a": "Singareni Coalfield", "b": "Raniganj Coalfield", "c": "Talcher Coalfield", "d": "Jharia Coalfield"}, "answer": "a", "explanation": "Singareni Coalfield. These coal reserves are located in the Pranhita -Godavari Valley and are managed by The Singareni Collieries Company Limited (SCCL), a government-owned coal mining company. This coalfield is a crucial source of coal for the power plants and other industries in Southern India. Major coalfields in India: Raniganj Coalfield (West Bengal), Talcher Coalfield (Odisha), Jharia (Jharkhand), Korba (Chhattisgarh).", "source": "SSC Stenographer 7/08/2025 (Shift 2)"}, {"id": 257, "topic": "Minerals and Energy Resources", "question": "Which of the following river valleys is NOT known for coal deposits in India ?", "options": {"a": "Mahanadi", "b": "Satluj", "c": "Godavari", "d": "Son"}, "answer": "b", "explanation": "Satluj. The Satluj originates in the 'Raksas tal' near Mansarovar at an altitude of 4,555 m in Tibet where it is - known as Langchen Khambab. Satluj, is the longeist of the five rivers that flow througih the historic crossroads region of a Punjab in northern India and Pakistan. - The Damodar Valley is particularly rich in coal and is known as the \"Ruhr of India\" - because of its similarities to the coal-rich Ruhr region of Germany.", "source": null}, {"id": 258, "topic": "Minerals and Energy Resources", "question": "Match the following mineral deposits with their respective states: List – I List – II (Mineral (States) Deposits/Regions)", "options": {"a": "Panchpatmali 1. Madhya Pradesh (Bauxite)", "b": "Balaghat 2.Odisha (Manganese)", "c": "Khetri (Copper) 3.Andhra Pradesh", "d": "Nellore Belt 4.Rajasthan (Mica)"}, "answer": "a", "explanation": "a-2, b-1, c-4, d-3 (b) a-2, b-3, c-4, d-1 (c) a-3, b-4, c-1, d-2 (d) a-4, b-1, c-2, d-3 Sol.258.(A) a-2, b-1, c-4, d-3. Panchpatmali deposits in Koraput district are the most important bauxite deposits in the state. Important Mines deposit in India: Balaghat mines (Madhya Pradesh), Khetri mines (Rajasthan), Maikal hills (Madhya Pradesh and Chhattisgarh), Nellore mica belt (Andhra Pradesh), Kudremukh mines (Karnataka).", "source": null}, {"id": 259, "topic": "Minerals and Energy Resources", "question": "Which of the following is a precious mineral?", "options": {"a": "Hematite", "b": "Mica", "c": "Bauxite", "d": "Platinum"}, "answer": "d", "explanation": "Platinum. It is used in hard disk drives, thermocouples, optical fibers, LCDs, turbine blades, and spark plugs. Hematite: A common iron ore used in iron production. Platinum-based drugs cisplatin, carboplatin, and oxaliplatin are widely used for chemotherapeutic eradication of cancer. Mica: A group of silicate minerals used in various industrial applications, including electronics and construction. Bauxite: The primary ore of aluminum.", "source": null}, {"id": 260, "topic": "Minerals and Energy Resources", "question": "Which type of coal is found in Damodar valley?", "options": {"a": "Anthracite", "b": "Lignite", "c": "Bituminous", "d": "Peat"}, "answer": "c", "explanation": "Bituminous is a type of coal with a carbon content ranging from 60% to 80% and a relatively low moisture content, making it highly efficient for energy production. It has a high calorific value. The Damodar Valley, located in the states of Jharkhand and West Bengal in eastern India, is renowned for its extensive bituminous coal deposits. This region is part of the Jharia and Raniganj coalfields, which are significant contributors to India's coal production.", "source": null}, {"id": 261, "topic": "Minerals and Energy Resources", "question": "Which of the following is an inosilicate amphibole mineral used in highway construction and as railroad ballast?", "options": {"a": "Shale", "b": "Olivine", "c": "Geyserite", "d": "Hornblende"}, "answer": "d", "explanation": "Hornblende: It is an inosilicate amphibole mineral. Uses: Highway construction: As an aggregate for road bases and surfaces. Railroad ballast: To provide drainage and stability under railroad tracks.", "source": null}, {"id": 262, "topic": "Minerals and Energy Resources", "question": "Which coal is low-grade, brown and soft with high moisture content?", "options": {"a": "Metallurgical", "b": "Lignite", "c": "Bituminous", "d": "Anthracite"}, "answer": "b", "explanation": "Lignite. Bituminous: Medium-grade, black, and less moisture content than lignite, used for electricity, industrial, and domestic purposes. Anthracite: High-grade, hard, black, and very low moisture content, used for residential heating and industrial processes. Tamil Nadu is the largest producer of lignite in India.", "source": null}, {"id": 263, "topic": "Minerals and Energy Resources", "question": "Match the following renewable sources of energy with their producing regions in India correctly. Renewable source Regions in India of energy 1. Tidal energy a. Gulf of Khambhat 2. Wind energy b. Nagercoil 3. Geo Thermal c. Puga valley energy", "options": {"a": "1-c, 2-b, 3-a", "b": "1-a, 2-b, 3-c", "c": "1-b, 2-a, 3-c", "d": "1-b, 2-c, 3-a"}, "answer": "b", "explanation": "1-a, 2-b, 3-c. Renewable energy comes from natural sources that are regenerated more quickly than they are used up. They are natural and self-replenishing, and usually have a low- or zero-carbon footprint. Examples of renewable energy sources include wind power, solar power, bioenergy (organic matter burned as a fuel) and hydroelectric.", "source": null}, {"id": 264, "topic": "Minerals and Energy Resources", "question": "The district of Shivamogga that is famous for its Iron-Ore and Manganese mineral is located in which state of India?", "options": {"a": "Karnataka", "b": "Jharkhand", "c": "Maharashtra", "d": "Rajasthan"}, "answer": "a", "explanation": "Karnataka. Other famous mines in India: Panna and Bunder Project - Madhya Pradesh. West Singhbhum, Pahadia, Kunderkocha and Parasi Jharkhand. Bailadila iron ore and Dalli-Rajhara - Chhattisgarh. Ratnagiri Maharashtra. Sundergarh, Joda, Keonjhar and Jajpur - Odisha.", "source": null}, {"id": 265, "topic": "Minerals and Energy Resources", "question": "Match the following Nuclear Power Plants with their respective states: List – I List – II (Nuclear Power Plant) (State)", "options": {"a": "Narora 1. Kearnataka", "b": "Kakrapar 2. Gujarat", "c": "Kudankulam 3. Tamil Nadu", "d": "Kaiga 4. Uttar Pradesh"}, "answer": "a", "explanation": "a-1, b-2, c-3, d-4 (b) a-2, b-3, c-4, d-1 (c) a-3, b-4,e c-1, d-2 (d) a-4, b-2, c-3, d-1 Sol.2e65.(d) a-4, b-2, c-3, d-1. Operational Nuclear power plants in Irndia: Kakrapar Atomic Power Station (Gujarat), Madras Atomic Power Station (Tamil Nadu), Kaiga Nuclear Power Plant (Karnataka), Rajasthan Atomic Power Station (Rajasthan), Tarapur Atomic Power Station (Maharashtra), Kudankulam Nuclear Power Plant (Tamil Nadu).", "source": null}, {"id": 266, "topic": "Minerals and Energy Resources", "question": "Jharkhand and Chhattisgarh states are rich with ____________ material deposits.", "options": {"a": "gold", "b": "petroleum", "c": "silicon", "d": "coal"}, "answer": "d", "explanation": "Coal. Jharkhand - 40% of the country's total mineral resources are available here. It produces coking coal, uranium, and pyrite. Jharkhand ranks 1st in the production of coal, mica, kyanite, and copper in India. Major coal fields include Jharia, Bokaro, Karanpura, Hutar, Auranga, Daltonganj, Deoghar, and Rajmahal. Chhattisgarh: A leading producer of coal, dolomite, bauxite, and iron ore. Major coal-producing areas include Korea, Korba, Raigarh, and Sarguja districts.", "source": null}, {"id": 267, "topic": "Minerals and Energy Resources", "question": "The Salal Project, also called the Salal Hydroelectric Power Station, is on which river?", "options": {"a": "Chenab", "b": "Krishna", "c": "Ganga", "d": "Ravi"}, "answer": "a", "explanation": "Chenab. Salal Hydroelectric Power Station is a run-of-the-river power project in the Reasi district of Jammu and Kashmir. The project has a capacity of 690 MW. The beneficiary states are Uttar Pradesh, Jammu and Kashmir, Punjab, Haryana, Delhi, Himachal Pradesh, Chandigarh & Rajasthan. Important hydel power stations and the rivers on which they are located: Bhakra Nangal (Sutlej River), Gandhi Sagar Dam - (Chambal River), and Nagarjuna Sagar Dam (Krisihna River). - i", "source": null}, {"id": 268, "topic": "Minerals and Energy Resources", "question": "Consider the following statements regarding sources of energy: 1. Solar power and geothermal energy are examples of conventional sources of energy. 2. Coal, petroleum, natural gas, and nuclear energy are conventional sources of energy. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Mineral fuels like coal, petroleum and natural gas (known as fossil fuels), nuclear energy minerals, are the conventional sources of energy. These conventional sources are exhaustible resources.", "source": null}, {"id": 269, "topic": "Minerals and Energy Resources", "question": "The Durg-Bastar-Chandrapur iron ore belt lies in _____ states.", "options": {"a": "Maharashtra and Karnataka", "b": "Chhattisgarh and Maharashtra", "c": "Maharashtra and Telangana", "d": "Chhattisgarh and Jharkhand"}, "answer": "b", "explanation": "Chhattisgarh and Maharashtra. The Durg-Bastar-Chandrapur iron ore belt stretches across the Durg and Bastar districts in Chhattisgarh and the Chandrapur district in Maharashtra. Iron ore mines in India: Bailadila (Chhattisgarh), Joda (Odisha), Noamundi (Jharkhand), and Kudremukh (Karnataka).", "source": null}, {"id": 270, "topic": "Minerals and Energy Resources", "question": "Which of the following agencies is responsible for the operation and maintenance of the Hazira- Vijaypur- Jagdishpur pipeline?", "options": {"a": "Hindustan Petroleum Corporation Limited", "b": "Gas Authority of India Limited", "c": "Indian Oil Corporation Limited", "d": "Oil and Natural Gas Commission"}, "answer": "b", "explanation": "Hazira-Vijaipur-Jagdishpur (HVJ) is India's first cross-country natural gas pipeline commissioned in 1987-88 with compressor stations at Hazira, Jhabua (Madhya Pradesh), Vijaipur (Madhya Pradesh) and Auraiya (Uttar Pradesh). It transports natural gas from Hazira in Gujarat to Jagdishpur in Uttar Pradesh.", "source": null}, {"id": 271, "topic": "Minerals and Energy Resources", "question": "According to the Indian Mineral Yearbook 2018, which state alone accounts for 72% of the magnetite deposits in India?", "options": {"a": "West Bengal", "b": "Maharashtra", "c": "Tamil Nadu", "d": "Karnataka"}, "answer": "d", "explanation": "Karnataka is the leading producer of iron ore in India, with major deposits located in the Bellary-Hospet, Chitradurga, and Shimoga regions. Other significant iron ore-producing states include Odisha, Jharkhand, and Chhattisgarh.", "source": null}, {"id": 272, "topic": "Minerals and Energy Resources", "question": "NALCO is an Indian government enterprise, dealing with which of the following minerals?", "options": {"a": "Bauxite", "b": "Iron", "c": "Mica", "d": "Copper"}, "answer": "a", "explanation": "Bauxite. National Aluminium Company Limited (NALCO), a ‘Navratna’ public sector undertaking (PSU) established in 1981. Headquarters Bhubaneswar, Odisha. Odisha has the largest bauxite reserves in India. Lohardaga in Jharkhand is known as the land of bauxite mines.", "source": null}, {"id": 273, "topic": "Minerals and Energy Resources", "question": "Which of the following are major coal fields in India?", "options": {"a": "Jharia and Raniganj", "b": "Jhunjhunu and Alwar", "c": "Satara and Pune", "d": "Coimbatore and Madurai"}, "answer": "a", "explanation": "Jharia and Raniganj. Jharkhand is home to several significant coalfields, including Jharia (the largest), Bokaro, Dhanbad, Giridih, Karanpura, Ramgarh, and Daltonganj. Major coal fields: West Bengal - Dalingkot (Darjeeling) Birbhum, Chinakuri. Madhya Pradesh - Singrauli, Suhagpur. Odisha Talcher. Other Minerals in India: Copper Found in Jhunjhunu and Alwar in Rajasthan. Limestone - Commonly found in Coimbatore and Madurai in Tamil Nadu.", "source": null}, {"id": 274, "topic": "Minerals and Energy Resources", "question": "Which is the world’s largest PV Solar Park located in one of the Indian states ?", "options": {"a": "Pavagada Solar Park", "b": "Bhadla Solar Park", "c": "Dholera Solar Park", "d": "Harshad Solar Park"}, "answer": "b", "explanation": "Bhadla Solar Park. It located in Rajasthan's Jodhpur district, spans 14,000 acres. The Pavagada Solar Park, located in Karnataka's Tumkur district. It was developed by Karnataka Solar Power Development Corporation (KSPDCL). Dholera Solar Park - Gujarat. Harshad Solar Park - Gujarat.", "source": null}, {"id": 275, "topic": "Minerals and Energy Resources", "question": "Consider the following statements regarding coal deposits in India: 1. Tertiary coal deposits are mainly found in Bihar and Haryana. 2. Lignite occurs in the Himalayan states of Himachal Pradesh and Uttarakhand. Which of the above statements is/are incorrect?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "c", "explanation": "Both 1 and 2. Tertiary coals, which include lignite and sub-bitBuminous coal, occur in Assam, Arunachal Pradesh, Meghalaya and Nagaland. e It is extracted from Darangiri, Cherrapunji, Mewlong and Langrin (Megmhalaya); Makum, Jaipur and Nazira (Assam); Namchik - Namphuk (Arunachal Pradesh) and Kalakot (Jammu aned Kashmir). The brown coal - or lignite occurs in the coastal areas of Tamile Nadu, Pondicherry, Gujarat and Jammu and Kashmir.", "source": null}, {"id": 276, "topic": "Minerals and Energy Resources", "question": "Koderma Gaya Hazaribagh belt is F known for the production of which of the following minerals?", "options": {"a": "Bauxite", "b": "Mica", "c": "Coal", "d": "Copper"}, "answer": "b", "explanation": "Mica deposits are found on the northern edge of the Chota Nagpur Plateau, with the Koderma - Gaya Hazaribagh belt in Jharkhand leading production. Major mica-producing regions include Gaya, Hazaribagh, Ajmer, Beawar, Bhilwara, Udaipur, Dungarpur, Banswara, and Nellore. The main mica-producing states are Jharkhand, Rajasthan, and Andhra Pradesh. -", "source": null}, {"id": 277, "topic": "Minerals and Energy Resources", "question": "Which of the following is NOT - among the commercial sources of energy?", "options": {"a": "Petroleum", "b": "Electricity", "c": "Fuel wood", "d": "Hydropower"}, "answer": "c", "explanation": "Fuel wood. It is a non commercial or traditional source of energy, primarily used for domestic purposes such as cooking and heating. Commercial sources of energy are typically: Fossil fuels (petroleum, coal, natural gas), Electricity (produced from a variety of energy sources), Hydropower (electricity generated from water is resources).", "source": null}, {"id": 278, "topic": "Minerals and Energy Resources", "question": "The Mumbai High region in the Arabian Sea is known for mining _______.", "options": {"a": "uranium", "b": "coal", "c": "copper", "d": "mineral oil"}, "answer": "d", "explanation": "Mineral Oil. Other oil cities/states in India: Digboi is known as the Oil City of Assam where the first oil well in Asia was drilled. Surma Valley (Assam), Rajasthan (Largest producer of Petroleum in India), Gujarat.", "source": null}, {"id": 279, "topic": "Minerals and Energy Resources", "question": "Match List I (Iron ore mines) with List II (States) and select the correct answer us ing the codes given below: List I i(Mines) List II (States)", "options": {"a": "Joda (i) Andhra Pradesh", "b": "Gua and h (ii) Chhattisgarh Noamundi", "c": "Bailadila (iii) Jharkhand", "d": "Guntur (iv) Odisha"}, "answer": "a", "explanation": "a – iv, b – iii, c – ii, d – i (b) a – ii, b – iv, c – iii, d – i (c) a – iii, b – i, c – ii, d – iv (d) a – i, b – iii, c – ii, d – iv Sol.279.(A) a – iv, b – iii, c – ii, d – i. Noamundi and Gua are Iron ore Mines. Iron ore mines in Jharkhand: Kiriburu, Meghahatuburu, Chiria. Major reserves of haematite iron in India: Odisha, Jharkhand, Chhattisgarh, Karnataka and Goa. Iron ore mines in India: Bailadila (Chattisgarh), Balda Block, Joda (Odisha).", "source": null}, {"id": 280, "topic": "Minerals and Energy Resources", "question": "According to the Indian Minerals Yearbook 2020, which state has the highest production of manganese in - India ?", "options": {"a": "Karnataka", "b": "Madhya Pradesh", "c": "Odisha", "d": "Maharashtra"}, "answer": "b", "explanation": "Madhya Pradesh (33%), followed by Maharashtra (24%) and Odisha (18%). Other Mineral producing states: Iron Ore - Odisha, Chhattisgarh and Karnataka. Chromite - Odisha, Karnataka and Andhra Pradesh. Nickel - Odisha, Jharkhand. Cobalt - Jharkhand, Odisha, Nagaland. Coal - Jharkhand, Orissa, Chattisgarh. Petroleum - Maharashtra, Gujarat. -", "source": null}, {"id": 281, "topic": "Minerals and Energy Resources", "question": "Which district of Madhya Pradesh is a leading producer of copper?", "options": {"a": "Balaghat", "b": "Jabalpur", "c": "Bhopal", "d": "Gwalior"}, "answer": "a", "explanation": "Balaghat (Largest producer district of copper in India). Other Copper producing States (India) - Rajasthan (Khetri), Jharkhand (Singhbhum). Largest Copper producer (World) - Chile. Top Minerals Producers (India) - Bauxite (Odisha), Gold (Karnataka), Silver (Rajasthan), Coal (Jharkhand), Uranium (Andhra Pradesh).", "source": null}, {"id": 282, "topic": "Minerals and Energy Resources", "question": "Which of the following is an open pit copper mine ?", "options": {"a": "Malanjkhand", "b": "Bastar", "c": "Singhbhum", "d": "Ballari"}, "answer": "a", "explanation": "Malanjkhand (Madhya Pradesh). Open-pit mining (opencast mining) - A surface mining technique that extracts minerals from an open pit in the ground. Copper Mines in India: Khetri (Rajasthan), Singhbhum (Jharkhand), Kolihan (Rajasthan), Surda (Jharkhand) etc.", "source": null}, {"id": 283, "topic": "Minerals and Energy Resources", "question": "Which of the following regions in India is nicknamed as the storehouse of minerals?", "options": {"a": "Deccan Plateau", "b": "Western Ghats", "c": "Chota Nagpur", "d": "Himalayas"}, "answer": "c", "explanation": "Chota Nagpur Plateau is a rich source of minerals, including mica, bauxite, copper, limestone, iron ore, coal, manganese ore, and chromite.", "source": null}, {"id": 284, "topic": "Minerals and Energy Resources", "question": "What are the main energy sources for earth's internal heat engine?", "options": {"a": "Radiogenic heat and oceanic tide heat", "b": "Heat from volcanoes and", "c": "Solar heat and oceanic tide heat", "d": "Radiogenic heat and primordial heat"}, "answer": "d", "explanation": "The Earth's heat is the internal heat that arises from two sources: The decay of radioactive isotopes in crustal rocks and the mantle, and primordial heat left over from the planet's fiery formation. Geothermal energy is the heat produced deep in the Earth's core.", "source": null}, {"id": 285, "topic": "Minerals and Energy Resources", "question": "Consider the following statements about Thermal Power Plants in Gujarat: 1. The Mundra Thermal Power Plant is located in Kutch district of Gujarat. 2. Wanakbori Thermal Power Station is located in Rajasthan. Which of the above statements is/are correct?", "options": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "Only 1. Other Power plants in Gujarat: Jhanor-Gandhar Thermal Power Station, Kawas Thermal Power Station, Essar Power Gujarat Limited, Kutch Lignite Thermal Power Station, Sabarmati Thermal Power Station, Sikka Thermal Power Station, Surat Lignite Thermal Power Station, Ukai Thermal Power Station, Wanakbori Thermal Power Station.", "source": null}, {"id": 286, "topic": "Minerals and Energy Resources", "question": "The Bailadila range of Chhattisgarh is famous for which of the following minerals ?", "options": {"a": "Copper", "b": "Bauxite", "c": "Iron ore", "d": "Coal"}, "answer": "c", "explanation": "Iron ore. Types of Iron Ore – Haematite, Magnetite, Limonite and Siderite. Mines and Iron deposit in India: Chhattisgarh - Dalli-Rajhara; Jharkhand Noamundi mines; Karnataka Kemmangundi (Baba Budan hills), Sandur (Bellary); Rajasthan - Jaipur, Udaipur, Jhunjhunu, Sikar, Bhilwara, Alwar, Bharatpur, Dausa and Banswara; Andhra Pradesh - Kurnool, Guntur, Cuddapah, Anantapur, Nellore; Kerala Naduvallur, Eleyettimala, Nanminda, Alampara; Tamil Nadu - Kanjamalai, Mudumalai Hills (Salem district).", "source": null}, {"id": 287, "topic": "Minerals and Energy Resources", "question": "The approximate amount of silica present in cement is:", "options": {"a": "between 27% mand 35%", "b": "between 37% and 45%", "c": "between 17% and 25%", "d": "between 47% and 55%"}, "answer": "c", "explanation": "Between 17% and 25%. Cement - It was first introduced in England in 1824 by Joseph Aspdin. Composition of Cement: Lime (60-65%), F Silica (17-25%), Alumina (3-8%), Magnesia (1-3%), Iron oxide (0.5-6%), Calcium Sulfate (0.1-0.5%), Sulfur Trioxide (1-3%), Alkaline (0-1%).", "source": null}, {"id": 288, "topic": "Minerals and Energy Resources", "question": "Consider the following statements regarding oil production in India: 1. Assam is the oldest oil-producing state of India, with Digboi being the first oil reserve. 2. Rajasthan is currently the largest producer of petroleum in India. 3. Major oil fields of Gujarat include Ankleshwar and Kalol. 4. Maharashtra is the second largest producer of petroleum in India. Which of the above statements is/are correct?", "options": {"a": "1, 2 and 3 only", "b": "1 and 4 only", "c": "2 and 3 only", "d": "1, 2, 3 and 4"}, "answer": "a", "explanation": "1, 2 and 3 only. The largest producer of petroleum in India is Rajasthan, followed by Gujarat and Assam. Oil fields of Rajasthan: Mangla, Bhagyam, Kameshwari. Gujarat oil fields: Ankleshwar, Kalol. Naharkatiya and Moran - Hugrijan are important oil fields of Assam.", "source": null}, {"id": 289, "topic": "Minerals and Energy Resources", "question": "Kawas Thermal Power Station is located in which of the following states?", "options": {"a": "Gujarat", "b": "Maharashtra", "c": "West Bengal", "d": "Rajasthan"}, "answer": "a", "explanation": "Gujarat. Thermal power station in India: Gujarat - Kutch, Sikka, Dhuvaran. Maharashtra - Bhusawal, Trombay, Khaparkheda. Rajasthan - Chhabra, Barsingsar, Suratgarh, Kota. West Bengal - Farakka Super, Kolaghat, Bakreshwar. - -", "source": null}, {"id": 290, "topic": "Minerals and Energy Resources", "question": "The main mineral constituents of the continental mass are ____ and _____.", "options": {"a": "silica, m agnesium", "b": "silic a, alumina", "c": "oxygen, carbon", "d": "alumina, magnesium -"}, "answer": "b", "explanation": "Silica, alumina. It is often termed Sial (Si-silica and Al - aluminum). Earth (three layers): Crust, Mantle, and Core. Crust (outermost) - It is about 5 km thick under the oceans and about 30 km thick under the continents. Mantle - The major constituent elements are silicon and Magnesium. Core (mostly Iron and nickel) - This is the innermost layer of the earth.", "source": null}, {"id": 291, "topic": "Minerals and Energy Resources", "question": "Which state among the following has the largest reserves of gold ore in India as of 2021?", "options": {"a": "Jharkhand", "b": "Rajasthan", "c": "Bihar", "d": "Karnataka"}, "answer": "c", "explanation": "Bihar. Karnataka (Land of Gold) produces 80% of the gold in India. Three goldfields in India - Kolar Gold Field (Karnataka), Kolar Hutti Goldfield (Karnataka) and Ramgiri Gold Fields (Andhra Pradesh). Largest producer of Gold in the world - China. The largest producers of gold ore - Bihar (44%), Rajasthan (25%), Karnataka (21%), West Bengal (3%) and Jharkhand (2%).", "source": null}, {"id": 292, "topic": "Minerals and Energy Resources", "question": "Which of the following statements regarding coal is NOT correct?", "options": {"a": "Anthracite is the highest quality hard coal.", "b": "Coal that has been buried deep and subjected to increased temperatures is bituminous coal.", "c": "Lignite is a low-grade brown coal, which is soft with high moisture content.", "d": "Metallurgical coal is high grade lignite coal which has a special value for smelting iron in blast furnaces."}, "answer": "d", "explanation": "Coal is the most important and abundant fossil fuel in India. It is variously referred to as the 'black gold' or 'black diamond'. It contains carbon, volatile matter, moisture, and ash.", "source": null}, {"id": 293, "topic": "Minerals and Energy Resources", "question": "Which of the following is NOT a major iron ore belt in India?", "options": {"a": "Maharashtra - Goa belt", "b": "Haryana - Rajasthan belt", "c": "Odisha - Jharkhand belt", "d": "Durg - Bastar - Chandrapur belt"}, "answer": "b", "explanation": "Haryana-Rajasthan belt. The major iron ore belts in India are Odisha- Jharkhand belt: High grade haematite ore is found in Badampahar mines in the Mayurbhanj and Kendujhar districts.", "source": null}, {"id": 294, "topic": "Minerals and Energy Resources", "question": "The largest wind farm cluster of India is located in ______.", "options": {"a": "Gujarat", "b": "Tamil Nadu", "c": "Maharashtra", "d": "Karnataka"}, "answer": "b", "explanation": "Tamil Nadu. The name of this wind farm is Muppandal Wind Farm, located in Muppandal, Kanyakumari district, Tamil Nadu. It is an onshore wind farm with a capacity of 1,500 MW. The largest wind farm in the world is the Gansu Wind Farm in China.", "source": null}, {"id": 295, "topic": "Minerals and Energy Resources", "question": "The major resources of Gondwana coal, which are metallurgical coal located in______.", "options": {"a": "Damodar valley", "b": "Chambal valley", "c": "Krishna valley", "d": "Narmada valley"}, "answer": "a", "explanation": "Damodar valley (West Bengal -Jharkhand). Jharia, Raniganj, Bokaro are important coalfields. The Godavari,F Mahanadi, Son and Wardha valleys also contain coal deposits.", "source": null}, {"id": 296, "topic": "Minerals and Energy Resources", "question": "Peat coal has ____ carbon and ____ moisture content?", "options": {"a": "High, Low", "b": "Low, high", "c": "High, High", "d": "Low, Low"}, "answer": "b", "explanation": "Low, high. Peat is a soft, dark brown coal that is formed from dead and decaying organic matter. It has an energy density of 15 MJ/kg. It has a low heating capacity. India has the fifth-largest coal reserves in the world. Coal India Limited (CIL) (Public Sector Undertaking) was established on 1 November 1975 under the ownership of the Ministry of Coal. Headquarters: Kolkata.", "source": null}, {"id": 297, "topic": "Minerals and Energy Resources", "question": "Which of the following minerals is NOT found in rivers (alluvial placers) and on the coast, especially beaches (beach placers)?", "options": {"a": "Tin", "b": "Bauxite", "c": "Platinum", "d": "Gold"}, "answer": "b", "explanation": "Bauxite deposits are formed by the decomposition of a wide variety of rocks rich in aluminium silicates.", "source": null}, {"id": 298, "topic": "Minerals and Energy Resources", "question": "Consider the following statements regarding Export Processing Zones (EPZs) in India: 1. Falta Export Processing Zone is located in West Bengal. 2. An Export Processing Zone (EPZ) is a customs area that allows import of machinery and raw materials for manufacturing export goods without payment of duty. 3. Farakka is also an Export Processing Zone in West Bengal. Which of the above statements is/are correct?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "answer": "a", "explanation": "1 and 2 only. Farakka is known for its barrage, not an EPZ. Agriculture", "source": null}, {"id": 299, "topic": "Agriculture", "question": "Given below are the Assertion and Reason, choose the correct options regarding both the statements. Assertion (A): Seasonal agricultural practices, such as stubble burning, have no significant impact on AQI levels in India. Reason (R): Stubble burning is a is controlled practice that doesn't release substantiale pollutants into the atmosphere. SSC S tenographer 6/08/2025 (Shift 2)", "options": {"a": "A is true, but R is false.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "Both A and R are false.", "d": "Both A and R are true, and R is the correct explanation of A."}, "answer": "c", "explanation": "Both A and R are false. Seasonal stubble burning in North India is a major cause of severe air pollution, raising AQI to hazardous levels. This uncontrolled practice releases large amounts of PM2.5, PM10, carbon monoxide, and toxic gases into the atmosphere.", "source": null}, {"id": 300, "topic": "Agriculture", "question": "High honey yield and gentle behaviour in bees for commercial beekeeping can be achieved through one of the following methods:", "options": {"a": "Using wild bee species with aggressive defence traits", "b": "Frequently relocating hives to prevent bees from settling", "c": "Avoiding bee farms and relying solely on natural honey collection", "d": "Introducing Italian bees that collect more honey and remain in hives longer"}, "answer": "d", "explanation": "Italian bees (Apis mellifera ligustica) are preferred in commercial apiculture because they are gentle in nature, highly productive, and stay longer in hives. They gather more nectar compared to indigenous species, making them suitable for large-scale honey production. Unlike wild or aggressive species, they are easier to manage, ensuring higher yield and safer beekeeping practices.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 301, "topic": "Agriculture", "question": "Match the columns: Column A Column B (Cropping Season) (Major Crops - Shuffled) A. Kharif 1. Vegetables, Fruits (June-Sepitember), Fodder B. Rabii 2. Rice, Cotton, Bajra, a (October-March) Maize, Jowar, Tur C. Zaid 3. Wheat, Gram, (April-June) Rapeseeds and Mustard, Barley", "options": {"a": "A-3, B-2, C-1", "b": "A-2, B-1, C-3", "c": "A-1, B-2, C-3", "d": "A-2, B-3, C-1"}, "answer": "d", "explanation": "A-2, B-3, C-1. Kharif Crops (Monsoon season: June–Sept). Sown with onset of monsoon, harvested in autumn. Examples: Rice, Cotton, Bajra, Maize, Jowar, Tur (Pigeon pea). Rabi Crops (Winter season: Oct–March). Sown in winter, harvested in spring. Examples: Wheat, Gram, Rapeseed, Mustard, Barley. Zaid Crops (Summer season: April–June). Short-season crops grown between Rabi and Kharif. Examples: Vegetables, Fruits (melon, cucumber), Fodder.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 302, "topic": "Agriculture", "question": "Match the local names of shifting agriculture with the states where they are practiced: List I List II (Local Name) (State/Region) a. Penda 1. Odisha b. Bringa 2. Andhra Pradesh c. Dahiya 3. Madhya Pradesh d. Jhumming 4. North-Eastern region", "options": {"a": "a-2, b-1, c-3, d-4", "b": "a-1, b-2, c-3, d-4", "c": "a-3, b-2, c-1, d-4", "d": "a-2, b-3, c-1, d-4"}, "answer": "a", "explanation": "a-2, b-1, c-3, d-4. In India, shifting agriculture is called ‘Bewar’ or ‘Dahiya’ in Madhya Pradesh, ‘Podu’ or ‘Penda’ in Andhra Pradesh, ‘Pama Dabi’ or ‘Koman’ or ‘Bringa’ in Odisha, ‘Kumari’ in Western Ghats, ‘Valre’ or ‘Waltre’ in South-eastern Rajasthan, ‘Khil’ in the Himalayan belt, ‘Kuruwa’ in Jharkhand, and‘Jhumming’ in the North-eastern region.", "source": null}, {"id": 303, "topic": "Agriculture", "question": "The term 'Aus', 'Aman' and 'Boro' are associated with which crop in India?", "options": {"a": "Maize", "b": "Wheat", "c": "Jute", "d": "Paddy"}, "answer": "d", "explanation": "Paddy is basically a tropical crop. 'Aus', 'Aman' and 'Boro' are grown in states like Assam, West Bengal, and Odisha throughout the year. Aus: Sown in the summer, along with pre-monsoonal rains, and harvested in the autumn. Aman: Sown in the monsoon and harvested in the winter. Boro: Sown in the winter and harvested in the summer.", "source": null}, {"id": 304, "topic": "Agriculture", "question": "Which type of tea in large amount is exported from India to importing countries?", "options": {"a": "Herbal tea", "b": "Regular tea", "c": "Green tea", "d": "Black tea"}, "answer": "d", "explanation": "Black tea. India is the world's second largest tea producer after China. The types of tea exported through India are: Black tea, Regular tea, Green tea, Herbal tea, Masala tea, and Lemon tea. The majority of the tea exported out of India is black tea which makes up about 96% of the total exports.", "source": null}, {"id": 305, "topic": "Agriculture", "question": "The people of Himachal Pradesh make channels to bring water from a glacier or rainwater to villages for the function of mainly irrigation. These channels are locally known as:", "options": {"a": "Khadins", "b": "Guls or Kuls", "c": "Johads", "d": "Baori"}, "answer": "b", "explanation": "Guls or Kuls. In hill and mountainous regions, people built diversion channels like the ‘guls’ or ‘kuls’ of the Western Himalayas for agriculture. Water harvesting system: ‘Rooftop rain water harvesting’ was commonly practised to store drinking water, particularly in Rajasthan. In arid and semi-arid regions, agricultural fields were converted into rain fed storage structures that allowed the water to stand and moisten the soil like the ‘khadins’ in Jaisalmer and ‘Johads’ in other parts of Rajasthan. Roof top rain water harvesting is the most common practice in Shillong, Meghalaya.", "source": null}, {"id": 306, "topic": "Agriculture", "question": "Which of the following states is the biggest producer of Pulses?", "options": {"a": "Madhya Pradesh", "b": "Haryana", "c": "Punjab", "d": "Bihar"}, "answer": "a", "explanation": "Madhya Pradesh. Based on the production estimates for the year 2022-23, Madhya Pradesh, Maharashtra and Rajasthan are the top three pulses producing states in the country. India is the largest producer of pulses in the world.", "source": null}, {"id": 307, "topic": "Agriculture", "question": "Which of the following statements correctly defines the green revolution?", "options": {"a": "It is a new strategy in agriculture to produce food grains, especially wheat and rice.", "b": "It is a new strategy to increase the share of the forest.", "c": "It is a new strategy to use green colour for all purposes.", "d": "It is a new strategy to use only herbal products."}, "answer": "a", "explanation": "The Green Revolution, starting in the 1960s, aimed to achieve food security and reduce food imports, particularly in India. It involved the introduction of high-yielding variety seeds, mechanized farming, improved irrigation, and the use of pesticides and fertilizers.", "source": null}, {"id": 308, "topic": "Agriculture", "question": "According to the Agricultural and Processed food products Export Development Authority (APEDA) 2020-2021, which state of India has the first rank in grapes production?", "options": {"a": "Maharashtra", "b": "Kaernataka", "c": "Bihar", "d": "Uttar Pradesh"}, "answer": "a", "explanation": "Maharashtra. APEDA was established in 1986, operates under the Ministry o f Commerce and Trade promote the export of agricultural and proce ssed food products.", "source": null}, {"id": 309, "topic": "Agriculture", "question": "The green revolution technology resulted in an increase in production F cereal production from 72.4 million tons in 1965-66 to ________ million tons 1978-79.", "options": {"a": "150.8", "b": "165.9", "c": "131.9", "d": "141.2"}, "answer": "c", "explanation": "131.9. The cereal production was increased due to three factors: Increase in net area under cultivation; (ii) Growing two or more crops in a year the same piece of land; and (iii) Use HYV seeds.", "source": null}, {"id": 310, "topic": "Agriculture", "question": "Consider the following statements regarding the Second Green Revolution Cell: 1. The headquarters of the Second Green Revolution (SGR) Cell located at ICAR–Research Complex for Eastern Region (RCER), Patna. 2. The benefits of the first Green Revolution were mainly confined the eastern region of India. Which of the above statements is/are correct?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "a", "explanation": "1 only. The Second Green Revolution (SGR) Cell was created by the Ministry of Agriculture and Farmers' Welfare, Government of India to improve agricultural productivity and livelihood in the Eastern region of India because the benefits of first Green Revolution were mainly confined to north-western states of Haryana, Punjab and western Uttar Pradesh.", "source": null}, {"id": 311, "topic": "Agriculture", "question": "Which of the following statements about the aims of National Mission for Sustainable Agriculture (NMSA) of India is/are correct? 1. To make agriculture more productive. 2. To make agriculture more sustainable. 3. To promote organic farming.", "options": {"a": "Only 1 iis correct.", "b": "Onliy 2 and 3 are correct. a", "c": "1, 2 and 3 are correct.", "d": "Only 1 and 2 are correct."}, "answer": "c", "explanation": "1, 2 and 3 are correct. National Mission for Sustainable Agriculture (NMSA) has been made operational from the year 2014-15 which aims at making agriculture more productive, sustainable, remunerative and climate resilient by promoting location specific integrated /composite farming systems; soil and moisture to conservation measures; comprehensive soil health management; efficient water management practices and mainstreaming rainfed technologies. of", "source": null}, {"id": 312, "topic": "Agriculture", "question": "What was a significant negative environmental impact of the Green in Revolution?", "options": {"a": "Deforestation", "b": "Soil degradation", "c": "Increase in air pollution", "d": "Ozone layer depletion (i)"}, "answer": "b", "explanation": "Soil degradation. The Green on Revolution caused soil fertility loss of through the use of chemical fertilizers. Chemical fertilizers also kill bacteria and other microorganisms in the soil. Green Revolution also led to groundwater depletion due to extensive tubewell irrigation, impacting long-term is environmental resources.", "source": null}, {"id": 313, "topic": "Agriculture", "question": "How was the growth in all food grains after the Green Revolution?", "options": {"a": "Unitary", "b": "Proportionate to", "c": "Unpredictable", "d": "Disproportionate"}, "answer": "d", "explanation": "Disproportionate. Larger farmers with more resources were able to afford the necessary inputs, like high-yield variety (HYV) seeds, fertilizers, and irrigation, and thus reaped greater benefits. Smaller farmers often lacked access to these resources and faced higher risks, as the HYV crops were more vulnerable to pests, potentially causing severe losses. About 65 percent of the country’s population continued to employed in agriculture even as late 1990.", "source": null}, {"id": 314, "topic": "Agriculture", "question": "What was the main objective the Second Green Revolution in India?", "options": {"a": "Ensuring food security in the western states", "b": "Promoting conventional agricultural practices", "c": "Focusing on holistic development in agriculture", "d": "Increasing the use of chemical fertilizers and pesticides"}, "answer": "c", "explanation": "In the second phase of the green revolution (mid-1970s mid-1980s), the HYV technology spread to a larger number of states and benefited more variety of crops. The spread of green revolution technology enabled India to achieve self-sufficiency in food grains.", "source": null}, {"id": 315, "topic": "Agriculture", "question": "Which of the following movements created regional disparities between large and small farmers India?", "options": {"a": "Green revolution", "b": "Yellow revolution", "c": "Pink revolution", "d": "Blue revolution"}, "answer": "a", "explanation": "Green revolution in India started with the aim of increasing India's agricultural production to make India self-sufficient in food grains.", "source": null}, {"id": 316, "topic": "Agriculture", "question": "Which of the following statements is/are correct? I. The first green revolution led over-exploitation of natural resources. II. The second Green Revolution was more focused on Southern India. III. The second green revolution ensured in achieving sustainable livelihood security.", "options": {"a": "I and III", "b": "Only II", "c": "II and III", "d": "I and II"}, "answer": "a", "explanation": "I and III. The Second Green Revolution focuses on sustainable agriculture in eastern India, rainfed areas, and small farmers, promoting climate- resilient practices and livelihood security.", "source": null}, {"id": 317, "topic": "Agriculture", "question": "What action was taken by the government to celebrate the achievement of the Green Revolution agriculture?", "options": {"a": "Released a regular salary for the farmers", "b": "Distributed free food to all the people", "c": "Released a special stamp, ‘Wheat Revolution’", "d": "Distributed green vegetables to the people"}, "answer": "c", "explanation": "Green Revolution: The term be was first used by William Gaud, with as Norman Borlaug recognized as its global father and M.S. Swaminathan was of father of the Green Revolution in India. India adopted a new agricultural strategy, boosting wheat and rice production. July 1968, Prime Minister Indira Gandhi commemorated its success by releasing special stamp titled \"Wheat Revolution.\"", "source": null}, {"id": 318, "topic": "Agriculture", "question": "What is the economic justification for subsidies in the agriculture sector?", "options": {"a": "It is mostly used to provide benefits for rich farmers.", "b": "It is a part of government expenditure to in the service sector.", "c": "It is an incentive to provide the benefits of advanced technology and decrease the cost of production.", "d": "It is used to provide benefits for capital goods producers in agriculture."}, "answer": "c", "explanation": "Agricultural subsidies support food semcurity and development in by helping farmers boost production, improve food availability, and reduce poverty. Ineput subsidies lower costs, incentivize adoption, increase produectivity, and stimulate economic growth.", "source": null}, {"id": 319, "topic": "Agriculture", "question": "In West Bengal, how many rice F crops are grown in a year?", "options": {"a": "Three", "b": "Two", "c": "Four", "d": "One"}, "answer": "a", "explanation": "Three. In states like Assam, to West Bengal, and Odisha, three paddy crops are grown annually: Aus, Aman, and Boro.", "source": null}, {"id": 320, "topic": "Agriculture", "question": "In the given main characteristics of farming which is NOT a characteristic of the Indian commercial farming?", "options": {"a": "Slash and burn", "b": "Insecticides and pesticides", "c": "Chemical fertilisers", "d": "High yielding variety seeds"}, "answer": "a", "explanation": "Slash and burn farming is form of shifting agriculture where natural vegetation is cut down and burned clear the land for cultivation. commercial farming, higher doses modern inputs are used to obtain higher in productivity. The degree commercialization in agriculture varies from one region to another. For example, rice is a commercial crop in Haryana and Punjab, but in Odisha, it is a subsistence crop.", "source": null}, {"id": 321, "topic": "Agriculture", "question": "Which of the following types of crops are sown after the end of the monsoon season?", "options": {"a": "Kharif crops", "b": "Zaid crops", "c": "Rabi crops", "d": "Vital crops the"}, "answer": "c", "explanation": "Rabi crops. It is an agricultural crop that is sown in the winter and harvested in the spring. In", "source": null}, {"id": 322, "topic": "Agriculture", "question": "Which of the following is NOT one of the consequences of the Green Revolution?", "options": {"a": "Employment of agricultural workers increased", "b": "Rising prices and a shift in the mode of payment of agricultural workers from p ayment in cash to payment in kind (grain)", "c": "Wages of agricultural workers increased", "d": "The rich grew richer and many of the poor stagnated or grew poorer"}, "answer": "b", "explanation": "Impact of Green Revolution: Positive - Increase in production and productivity of food grains, reduction in hunger, and technological advancements in agriculture. Negative - Decline in Soil fertility, High production costs, Regional disparities.", "source": null}, {"id": 323, "topic": "Agriculture", "question": "Match the following names of primitive forms of cultivation in different states correctly. Name of Primitive States form of cultivation 1. Madhya Pradesh a. Penda 2. Andhra Pradesh b. Bewar 3. Odisha c. Kuruwa 4. Jharkhand d. Bringa", "options": {"a": "1-a, 2-b, 3-d, 4-c", "b": "1-b, 2-a, 3-d, 4-c", "c": "1-b, 2-a, 3-c, 4-d", "d": "1-a, 2-b, 3-c, 4-d"}, "answer": "b", "explanation": "1-b, 2-a, 3-d, 4-c.", "source": null}, {"id": 324, "topic": "Agriculture", "question": "Match the items in List I with those in List II. List I List II i. Blue revolution a. Oilseeds ii. Yellow revolution b. Overall horticulture iii. Round revolution c. Fish iv. Golden revolution d. Potato to", "options": {"a": "i-b, ii-c, iii-d, iv-a", "b": "i-d, ii-a, iii-b, iv-c In", "c": "i-c, ii-a, iii -d, iv-b", "d": "i-b, ii-d, iii-a, iv-c of"}, "answer": "c", "explanation": "i-c, ii-a, iii -d, iv-b. Agricultural Revolutions in India: Green Revolution - To of increase agricultural productivity, White Revolution - Milk production, Black Revolution - Petroleum products, Brown Revolution - Leather / Cocoa Non-Conventional Products, Golden Fiber Revolution - Jute Production, Silver Revolution - Egg Production / Poultry Production, Red Revolution - Meat Production / Tomato Production.", "source": null}, {"id": 325, "topic": "Agriculture", "question": "Which of the following types of crops are sown at the beginning of the monsoon season?", "options": {"a": "Rabi crops", "b": "Kharif crops", "c": "Vital crops", "d": "Zaid crops"}, "answer": "b", "explanation": "Kharif crops. These crops are typically planted during June to September and harvested in the post-monsoon season (October to November). Examples of Kharif crops include rice, maize, cotton, and sorghum. Rabi crops are sown after the monsoon season, usually in the winter months (October to December), and harvested in the spring (March to May). Zaid crops are grown in the intervening period between Kharif and Rabi seasons, typically in the summer months (March to June).", "source": null}, {"id": 326, "topic": "Agriculture", "question": "Which of the following statement/s about the Green Revolution is/are CORRECT? I. India became self-sufficient with the introduction of the Green Revolution. II. The Green Revolution led to loss of nutrients in the soil from farming the same crop over and over again. III. The Green Revolution led to depletion of fresh ground water.", "options": {"a": "Only I and III", "b": "Only I and II", "c": "I, II and III", "d": "Only II"}, "answer": "c", "explanation": "I, II and III. The Green Revolution resulted in a great increase in production of food grains (especially wheat and rice) due to the introduction into developing countries of new, high-yielding variety (HYV) seeds. The green revolution enabled the government to procure sufficient amounts of food grains to build a stock which could be used in times of food shortage.", "source": null}, {"id": 327, "topic": "Agriculture", "question": "Which of the following statements are true about the positive impact of the Green Revolution (GR) on yield levels in India? I. During the post GR period, the yield of rice grew at a much faster rate than that of wheat. II. GR technology had penetrated more in wheat crop than in the rice crop. III. During post GR period, the area under rice achieved a relatively slow growth when compared to the area under wheat.", "options": {"a": "Only II and III", "b": "Only I and III /", "c": "Only I and II", "d": "I, II and III"}, "answer": "a", "explanation": "Only ii and iii. The Green Revolution technology had a greater impact on wheat crops than on rice crops. Important Crops in the Revolution: Main crops were - Wheat, Rice, Jowar, Bajra and Maize. Non-food grains were excluded from the ambit of the new strategy. Wheat remained the mainstay of the Green Revolution for years. Mankombu Sambasivan Swaminathan is known as the \"Father of India's Green Revolution\" for his work to increase food production and alleviate world hunger.", "source": null}, {"id": 328, "topic": "Agriculture", "question": "Which of these is NOT true of the second phase of the green revolution?", "options": {"a": "It was adopted by farmers living in dry and semi-arid regions of India.", "b": "It was launched in areas with a significant shift from dry to wet (irrigated) cultivation.", "c": "It covered the period of the 1960s and 1970s. h", "d": "It covered the period of the 1980s."}, "answer": "c", "explanation": "The use of HYV seeds was restricted to the more affluent states such as Punjab, Andhra e Pradesh and Tamil Nadu in the 1st Phase(Mid 1960s to mid-1970s). Imn the second phase of the green revolution (mid-1970s to mid-1980s), the HYV technology spread to a largeer number of states and benefited more variety of crops.", "source": null}, {"id": 329, "topic": "Agriculture", "question": "Who among the following is NOT arssociated with the Green Revolution?", "options": {"a": "Norman Borlaug", "b": "P Chidambaram", "c": "Chidambaram Subramaniam", "d": "MS Swaminathan"}, "answer": "b", "explanation": "P Chidambaram. Green Revolution: Initiated by - Norman Borlaug (1960s). He is known as the ‘Father of Green Revolution’ in world. He received the Nobel prize (1970) for developing High yielding varieties (HYVs) of wheat. M.S. Swaminathan (Father of Green Revolution in India). The Green revolution came under the third five year plan (1961-66). Chidambaram Subramaniam was an Indian politician and agricultural scientist who played a crucial role in India's Green Revolution. Award - Bharat Ratna (1998).", "source": null}, {"id": 330, "topic": "Agriculture", "question": "Identify the crop which is grown in Kharif cropping season in Northern States of India.", "options": {"a": "Mustard", "b": "Rice", "c": "Gram", "d": "Barley"}, "answer": "b", "explanation": "Rice. Kharif is sown during the rainy season, typically from June to September in India. Examples include paddy, maize, soybean, groundnut, and cotton. Rabi grows in the winter season, from October to March. Examples include wheat, gram, peas, mustard, and linseed. In between the rabi and the kharif seasons, there is a short season during the summer months known as the Zaid season. Examples are watermelon, muskmelon, cucumber.", "source": null}, {"id": 331, "topic": "Agriculture", "question": "In which of the following ways were farmers encouraged to begin to use high yielding variety seeds ?", "options": {"a": "Farmers’ children were given free education in government colleges and universities.", "b": "Agricultural labourers were paid wages directly by the government.", "c": "Farmers were given monetary support in cash to cultivate food grains.", "d": "Thei government provided seeds and a other inputs at prices lower than those prevailing in the market."}, "answer": "d", "explanation": "Farmers were encouraged to use high-yielding variety (HYV) seeds during the Green Revolution through various forms of support from the government. The government made HYV seeds, fertilizers, pesticides, and irrigation systems available at subsidized prices, meaning they were cheaper than market rates. This helped reduce the financial burden on farmers and incentivized them to adopt new agricultural technologies. HYV seeds are resistant to insects and diseases and are known for their high yields.", "source": null}, {"id": 332, "topic": "Agriculture", "question": "Which of the following is NOT an agro-based industry?", "options": {"a": "Jute", "b": "Fertiliser", "c": "Sugar", "d": "Edible oil"}, "answer": "b", "explanation": "Fertiliser. Agro-based industries depend on agricultural raw materials, producing mainly consumer goods. Major industries include cotton, jute, textiles, and edible oil. India's first sugar mill was established in Pratappur, Uttar Pradesh, in 1903. The Sugar Cane Act of 1934 allowed state governments to set the minimum price for sugarcane.", "source": null}, {"id": 333, "topic": "Agriculture", "question": "Which of the following is NOT true with regard to the Green Revolution?", "options": {"a": "Cultivation became more intensive in nature.", "b": "In its second phase, there was a shift to from dry to wet (irrigated) cultivation in dry and semi-arid regions of India.", "c": "Cultivation became more extensive in nature.", "d": "There was change in the cropping pattern and types of crops grown in its second phase."}, "answer": "c", "explanation": "The Green Revolution did not focus on expanding the area under cultivation but rather on making the existing land more productive (intensive cultivation), using modern inputs and technology.", "source": null}, {"id": 334, "topic": "Agriculture", "question": "Which crops are benefitted from the temperate cyclones arising from the Mediterranean Sea that cause rainfall in Punjab?", "options": {"a": "Cash crops", "b": "Kharif crops", "c": "Rabi crops", "d": "Zaid crops"}, "answer": "c", "explanation": "Rabi crops. Temperate cyclones cause rainfall in Punjab, Haryana, Delhi and western Uttar Pradesh. The precipitation is in the form of snowfall in the lower Himalayas. It is this snow that sustains the flow of water in the Himalayan rivers during the summer months. The precipitation goes on decreasing from west to east in the plains and from north to south in the mountains.", "source": null}, {"id": 335, "topic": "Agriculture", "question": "In July 1968, Indira Gandhi, the then Prime Minister of India, officially recorded impressive strides of the Green Revolution in agriculture by releasing a special stamp entitled _________.", "options": {"a": "Wheat Revolution", "b": "Fasal Kranti", "c": "Harit Kranti", "d": "Green Revolution"}, "answer": "a", "explanation": "Wheat Revolution (Part of Green Revolution) was initiated under the Third Five Year Plan (1961-66) by introducing high-yielding varieties of seeds of rice and wheat.", "source": null}, {"id": 336, "topic": "Agriculture", "question": "Which of the following reasons can be attributed to the excessive pressure on agricultural land in India? A. Right of inheritance B. Size of unprofitable land holding C. Division of land D. Multiple cropping", "options": {"a": "Only A and B", "b": "B, C and D", "c": "A, C and D", "d": "A, B and C"}, "answer": "d", "explanation": "A, B and C. Reasons that cause pressure on Agriculture: The right of inheritance, Division of land, Rising population, Use of Excessive Chemical Fertilizer, Salinization of soil, Desertification, Urbanisation, Waterlogging, Climate Change, Droughts, Pollution etc.", "source": null}, {"id": 337, "topic": "Agriculture", "question": "Which of the following countries is related with high yielding variety seeds that are used as part of Green Revolution policies in India?", "options": {"a": "Russia", "b": "Mexico", "c": "China", "d": "The US"}, "answer": "b", "explanation": "Mexico. Green Revolution - A period that began in the 1960s during which agriculture in India was converted into a modern industrial system by the adoption of technology (The use of high yielding variety (HYV) seeds, mechanised farm tools, irrigation facilities, pesticides, and fertilizers).", "source": null}, {"id": 338, "topic": "Agriculture", "question": "Consider the following statements regarding rice varieties in India: 1. IR8, also called Miracle Rice, was first harvested in 1967 and helped India overcome a massive famine. 2. Golden Rice, developed in 1998, is genetically modified to contain pro-vitamin A. 3. PETA is the high-yielding semi-dwarf rice variety developed by the International Rice Research Institute (IRRI) in 1967. Which of the above statements is/arhe incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "2 and 3 only"}, "answer": "d", "explanation": "2 and 3 onely. IR8 is a high-yielding semi-dwarf rice variety developed by m the International Rice Research Institute (IRRI). Golden rice: A transgenic rice having a gene for carotene. Iet was first introduced in 1999 by Ingo Potrykus and Peter Beyer. It contaeins pro-vitamin A which upon ingestion is converted to vitamin A in the hruman body.", "source": null}, {"id": 339, "topic": "Agriculture", "question": "For Kharif crops, the temperature required for farming is above 25 degrees Celsius with high humidity and annual rainfall above ________ cm.", "options": {"a": "16", "b": "50", "c": "100", "d": "35"}, "answer": "c", "explanation": "100. Kharif crops are sown during the monsoon season, which lasts from June to September in India.", "source": null}, {"id": 340, "topic": "Agriculture", "question": "Consider the following statements regarding the Green Revolution in India: 1. Punjab was the most transformed state due to the Green Revolution. 2. The Green Revolution had maximum impact in Punjab, Haryana, and western Uttar Pradesh. 3. The eastern region, including Assam, Bihar, West Bengal, and Odisha, was the most benefitted from the Green Revolution. Which of the above statements is/are correct?", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "answer": "a", "explanation": "1 and 2 only. Statement 3 is incorrect because the eastern region had minimal impact, not maximum, from the Green Revolution.", "source": null}, {"id": 341, "topic": "Agriculture", "question": "The agricultural land below the main canal water level forms the ______.", "options": {"a": "command area", "b": "lift system", "c": "flow system", "d": "warebandi"}, "answer": "a", "explanation": "command area. Lift system - Water is lifted from lower level to higher level with the help of pumps and other equipment. Flow system - The type of irrigation in which water is available at a higher level to enable supply to the land by gravity flow. Warabandi - It is a system of rotation of supply of water according to a predetermined schedule as per area and crop needs specifying the day, time and duration of supply to each holding to ensure equitable water distribution among farmers of an outlet command.", "source": null}, {"id": 342, "topic": "Agriculture", "question": "_______ land is suitable for regular cropping.", "options": {"a": "Arable", "b": "Barren", "c": "Marginal", "d": "Urban"}, "answer": "a", "explanation": "Arable land is the land under temporary crops, temporary meadows for mowing or for pasture, land under market or kitchen gardens, and temporary fallow. It is capable of being ploughed and used to grow crops. Barren land - Land that normally cannot be brought under cultivation with the available technology. Marginal land - Land that has little or no agricultural Value.", "source": null}, {"id": 343, "topic": "Agriculture", "question": "Which group of crops belong to fibre crops and are produced on a large scale in India ?", "options": {"a": "Gram and tur", "b": "Jute and hemp", "c": "Tea and coffee", "d": "Wheat and rice"}, "answer": "b", "explanation": "Jute and Hemp. Jute is known as Golden Fibre. It grows well on well-drained fertile soils in the floodplains. MajorJute producing states (West Bengal, Bihar, Assam, Odisha and Meghalaya).", "source": null}, {"id": 344, "topic": "Agriculture", "question": "Which of the following crops is the only genetically modified (GM) crop approved for commercial cultivation in India?", "options": {"a": "Bt Brinjal", "b": "Mustard", "c": "Bt Cotton", "d": "Tomato"}, "answer": "c", "explanation": "Bt Cotton. GM crops: These are derived from plants whose genes are artificially modified, usually by inserting genetic material from another organism. India approved the release of Bt cotton (Cry 1 AC) for commercial cultivation 2002 - Andhra Pradesh, Gujarat, Maharashtra, Madhya Pradesh, Karnataka, and Tamil Nadu. The best known variety of GM rice is golden rice.", "source": null}, {"id": 345, "topic": "Agriculture", "question": "Consider the following statements: 1. Extensive cultivation refers to farming on large farms with moderately low inputs of labour and capital. 2. Hybrid cultivation is the practice of cultivating crops only on small plots of land with no use of hybrid seeds. Which of the above statements is/are incorrect?", "options": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "answer": "b", "explanation": "2 only. Hybrid cultivation - involves the use of hybrid seed varieties (created by crossbreeding two or more genetically distinct plants). Example Wheat - Sonalika and Kalyan Sona, Rice Jaya and Ratna.", "source": null}, {"id": 346, "topic": "Agriculture", "question": "Which of the following crops classified as fine grain?", "options": {"a": "Bajra", "b": "Ragi", "c": "Maize", "d": "Wheat"}, "answer": "d", "explanation": "Wheat. India produces variety of cereals, which are classified into fine grains (rice, wheat) and coarse grains (jowar, bajra, maize, ragi, etc.).", "source": null}, {"id": 347, "topic": "Agriculture", "question": "Which of the following is the most suitable application of rainwater harvesting?", "options": {"a": "Used in cooking", "b": "Irrigation", "c": "Water for pets", "d": "Use for industrial purposes"}, "answer": "b", "explanation": "Irrigation. Rainwater harvesting is the process of collecting, storing, and purifying rainwater from rooftops, parks, roads, and open grounds. It is used for drinking, domestic needs, livestock, small irrigation, and replenishing groundwater levels.", "source": null}, {"id": 348, "topic": "Agriculture", "question": "What is meant by subsistence agriculture ?", "options": {"a": "Agricultural output is sufficient for the country.", "b": "Agriculturists produce primarily for themselves.", "c": "Agriculture generates sufficient income.", "d": "Agriculturists produce primarily for the market."}, "answer": "b", "explanation": "Types of Subsistence Farming: Primitive subsistence farming or shifting cultivation (oldest form of agriculture) - It happens on in self-sufficient basis, and farmers raise food according to their family’s needs. The trees are cut down and burnt and the cleared land is cultivated. Other names: Shifting cultivation or slash and burn cultivation. Intensive subsistence farming - The farmer cultivates a small plot of la
