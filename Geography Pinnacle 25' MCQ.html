led by six major factors. Reason (R): Latitude, altitude, pressure and wind system, distance from the sea, ocean currents, and relief features are F the six main controls of climate.", "options": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "answer": "a", "explanation": "Both A and R are true, and R is the correct explanation of A.", "source": null}, {"id": 468, "topic": "Climate", "question": "When was the Indian Meteorological Department, which collects data on temperature, rainfall, wind, etc., and makes weather forecasts, established by the Government of India?", "options": {"a": "1873", "b": "1879", "c": "1876", "d": "1875"}, "answer": "d", "explanation": "1875. Indian Meteorological Department - An agency of the Ministry of Earth Sciences of the Government of India. It is the principal agency responsible for meteorological observations, weather forecasting and seismology. Formed - 15 January 1875. Headquarters - New Delhi. Regional offices - Chennai, Mumbai, Kolkata, Nagpur, Guwahati and New Delhi.", "source": null}, {"id": 469, "topic": "Climate", "question": "Choose the INCORRECT statement related to monsoon.", "options": {"a": "The intensity and position of the high - pressure area, east of Madagascar, affects the Indian Monsoon", "b": "The Southwest Monsoon winds blow over the warm oceans, gather moisture and bring widespread rainfall over the mainland of India.", "c": "The difference in pressure over Tahiti (Pacific Ocean), and Darwin in northern Australia (Indian Ocean) is computed to predict the intensity of the monsoons.", "d": "The western cyclonic disturbances occur due to withdrawal or the retreat of the monsoon"}, "answer": "d", "explanation": "Western Cyclonic a Disturbances are weather phenomena of the winter months brought in by the westerly flow from the Mediterranean region. They usually influence the weather of the north and north-western regions of India. It originates over the Mediterranean: The region which includes the Mediterranean Sea and seven Member States, either partially (France, Portugal, Italy, Spain) or completely (Greece, Malta, Cyprus).", "source": null}, {"id": 470, "topic": "Climate", "question": "Which winds blow across the Asian continent at latitudes north of the Himalayas roughly parallel to the Tibetan highlands ?", "options": {"a": "Trade winds", "b": "Jet streams", "c": "Southwest winds", "d": "Northwest winds"}, "answer": "b", "explanation": "Jet streams - A narrow belt of high altitude (above 12,000 m) westerly winds in the Troposphere. Their speed varies from about 110 km/h in summer to about 184 km/h in winter. The polar jet is located between the 50°-60° latitude lines in both the northern and southern hemispheres. The subtropical jet is located around the 30° latitude line.", "source": null}, {"id": 471, "topic": "Climate", "question": "What type of climate is found in North Western Europe, West Coast of North America, North of California, Southern Chile, South-eastern Australia and New Zealand?", "options": {"a": "Tropical wet and dry climate", "b": "Cold snow forest climate", "c": "Marine west coast climate", "d": "Subtropical steppe climate"}, "answer": "c", "explanation": "Marine west coast climate - Under the Koppen Climate Classification, it comes under Warm Temperate (Mid-Latitude) Climates (Group C) and is represented by ‘Cfb’.", "source": null}, {"id": 472, "topic": "Climate", "question": "Choose the INCORRECT statement out of the following.", "options": {"a": "There is an increase in rainfall generally from east to west in the Northern Plains.", "b": "Most parts of the country receive rainfall from June to September.", "c": "The annual precipitation in Meghalaya is over 400 cm.", "d": "Some parts like the Tamil Nadu’s coast gets a large portion of its rains during October and November."}, "answer": "a", "explanation": "Rainfall decreases from the east to the west in Northern India because there is a decrease in the moisture content of the winds. The monsoon approaches the Indian landmass in two branches: The Arabian Sea branch (The monsoon winds originating over the Arabian Sea) and the Bay of Bengal branch.", "source": null}, {"id": 473, "topic": "Climate", "question": "In which type of rainfall, winds move out from a high-pressure area with wind direction clockwise in the northern hemisphere, and anti-clockwise in the southern hemisphere ?", "options": {"a": "Cyclones", "b": "Convection", "c": "Anticyclone", "d": "Orography"}, "answer": "c", "explanation": "Anticyclone - It is the center of high pressure, surrounded by closed isobars. Due to Coriolis force, blowing winds are deflected from their paths to the right in the Northern hemisphere (Clockwise) and left in the Southern hemisphere (Anti clockwise). Cyclones that develop in the mid and high latitudes, beyond the tropical regions, are referred to as middle latitude or extratropical cyclones.", "source": null}, {"id": 474, "topic": "Climate", "question": "According to the Koppen classification, Which regions experience cold humid winters with short summers?", "options": {"a": "South of Goa", "b": "Western Rajasthan", "c": "Arunachal Pradesh", "d": "Northern Madhya Pradesh"}, "answer": "c", "explanation": "Arunachal Pradesh. Koeppen identified a close relationship between the distribution of vegetation and climate.", "source": null}, {"id": 475, "topic": "Climate", "question": "What is the usual term used to describe the climate of India ?", "options": {"a": "Polar climate", "b": "Tropical monsoon", "c": "Desert climate", "d": "Arid climate"}, "answer": "b", "explanation": "Tropical monsoon. A monsoon is a seasonal change in the direction of the prevailing, or strongest, winds of a region. It always blows from cold to warm regions. The Indian Meteorological Department (IMD) designates four official seasons: Winter (December to early April); Summer or pre-monsoon (April to June); Monsoon or rainy (June to September) and Post- monsoon (October to December).", "source": null}, {"id": 476, "topic": "Climate", "question": "What is 'Mahawat' in India ?", "options": {"a": "Cold waves during the winter season", "b": "Cloud burst during the monsoon season", "c": "Cyclonic rainfall during the winter season", "d": "Hot and dry winds during the summer season"}, "answer": "c", "explanation": "Mahawat is the total amount of rainfall in the cold weather season, that is the winter season which is caused by the western cyclonic disturbances in the north and north -western part of India.", "source": null}, {"id": 477, "topic": "Climate", "question": "The target for the first commitment period of the Kyoto Protocol is to reduce emissions of greenhouse gasses by 5.2% fro m 1990 levels?", "options": {"a": "6", "b": "10", "c": "8 e", "d": "7"}, "answer": "a", "explanation": "6. Kmyoto Protocol: It was adopted on 11 December 1997 and entered into force on 16 February 2005. It was adopted in Kyoto, Japan. It was the result of the Rio-1992 and the United Nations Framework Convention on Climate Change (UNFCCC). Kyoto Prrotocol cover emissions of the six main greenhouse gases Carbon dioxide (CO), methane (CH), nitrous oxide (N O), 4 2 hydrofluorocarbons (HFCs), perfluorocarbons (PFCs), and sulfur hexafluoride (SF).", "source": null}, {"id": 478, "topic": "Climate", "question": "In the context of mapping climate data, what term refers to a line drawn through all points on a map that contain the same amount of cloud?", "options": {"a": "Isohels", "b": "Isocheim", "c": "Isonephs", "d": "Isochalaz"}, "answer": "c", "explanation": "Isonephs. Isocheim - A line on a map connecting points having the same average temperature in winter. Isohel - A line on a map connecting points having the same duration of sunshine. Isochalaz - A line of constant frequency of hail storms.", "source": null}, {"id": 479, "topic": "Climate", "question": "According to Koeppen's Scheme, which type of climate is denoted by 'Cwg' in India?", "options": {"a": "Monsoon with dry winter", "b": "Semi-arid steppe climate", "c": "Polar type", "d": "Monsoon with dry summer"}, "answer": "a", "explanation": "Monsoon with dry winter - It is mostly found in the Ganga Plain, eastern Rajasthan, Assam, and the Malwa Plateau. Amw (Monsoon type with a short dry winter season): This climate is found in the western coastal region, south of Mumbai.", "source": null}, {"id": 480, "topic": "Climate", "question": "Which of the following is incorrectly matched?", "options": {"a": "Montane climate - Uttar Pradesh, Bihar and Jharkhand", "b": "Tropical monsoon climate - The Western Ghats, the Malabar Coast And Southern Assam", "c": "Tropical semi-arid (steppe) climate - Karnataka, central Maharashtra, some parts of Tamil Nadu and Andhra Pradesih", "d": "Hoti desserts, arid climate - rajasthan a and some parts of Gujarat"}, "answer": "a", "explanation": "Montane climate - Found in Assam, Nagaland, Mizoram, Meghalaya, Manipur, Arunachal Pradesh, Higher hills of Tamil Nadu.", "source": null}, {"id": 481, "topic": "Climate", "question": "The centre of a cyclone is a calm area. It is called the_______of the storm.", "options": {"a": "base", "b": "focal point", "c": "eye", "d": "trigger point"}, "answer": "c", "explanation": "Eye. The eye of a storm is usually circular and typically 25-40 miles in diameter. It is surrounded by an eyewall, where the most severe weather of a cyclone occurs.", "source": null}, {"id": 482, "topic": "Climate", "question": "What would happen if the difference in pressure in Tahiti was negative?", "options": {"a": "Above average late monsoon", "b": "Drought", "c": "Below average and late monsoon", "d": "Above average and early monsoon"}, "answer": "c", "explanation": "The difference in pressure over Tahiti (Pacific Ocean) and Darwin in Northern Australia (Indian Ocean) is computed to predict the intensity of the monsoons. Factors Affecting Monsoon - The shift of the position of Inter Tropical Convergence Zone (ITCZ); The presence of the high-pressure area, east of Madagascar; Heating of The Tibetan plateau in summers; The movement of the jet streams; Southern Oscillation (SO) - Change of pressure between south Pacific Ocean and eastern Indian Ocean.", "source": null}, {"id": 483, "topic": "Climate", "question": "What type of climate occurs along the west coast of continents in subtropical latitudes between 30°-40° latitudes, covering Central California, Central Chile along the coast in South East and South Western Australia?", "options": {"a": "Subtropical steppe climate", "b": "Humid subtropical climate", "c": "Mediterranean climate", "d": "Marine west coast climate"}, "answer": "c", "explanation": "Mediterranean climate: Clear skies and high temperatures; hot, dry summers and cool, wet winters. The climate is not extreme because of cooling from water bodies. This unique seasonal pattern makes it ideal for growing crops like olives, grapes, and citrus fruits.", "source": null}, {"id": 484, "topic": "Climate", "question": "Consider the following statements regarding the climate of the hills of the Western Ghats: Statement I: The average temperature in the hills of the Western Ghats is usually below 25°C. Statement II: Western Ghats are intervein by major rivers like the Godavari, Krishna and Pennar. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Western Ghats are known as the Sahyadri Hills. It covers six states - Gujarat, Maharashtra, Goa, Karnataka, Tamil Nadu, and Kerala. The Eastern Ghats are intervein by major rivers like the Godavari, Krishna and Pennar.", "source": null}, {"id": 485, "topic": "Climate", "question": "Which winds are also known by the name of 'Roaring Forties' ?", "options": {"a": "Polar easterlies", "b": "westerly winds", "c": "Polar winds", "d": "Trade winds"}, "answer": "b", "explanation": "Westerly Wind. The polar easterlies are one of the five primary wind zones, known as wind belts, that make up our atmosphere's circulatory system. Polar winds begin near the North and South Poles. The trade winds are air currents closer to Earth's surface that blow from east to west near the equator.", "source": null}, {"id": 486, "topic": "Climate", "question": "Which among the following wind is associated with extreme cold and dryness?", "options": {"a": "Monsoon Winds", "b": "Westerlies", "c": "Trade Winds", "d": "Polar Easterlies"}, "answer": "d", "explanation": "Polar Easterlies. They emanate from the polar highs, areas of high pressure around the North and South Poles. They flow to low-pressure areas in sub-polar regions. Easterlies (blow from the east) - It is the name of the permanent winds that come from the direction of their origin. Monsoon Winds They are caused when the air over land gets heated and rises, causing winds to blow from the ocean toward land. Westerlies - Prevailing winds from the west toward the east in the middle latitudes.", "source": null}, {"id": 487, "topic": "Climate", "question": "The summer months experience __________ in the northern part of India.", "options": {"a": "rising air pressure", "b": "falling air pressure", "c": "decreasing temperature", "d": "heavy rain"}, "answer": "b", "explanation": "Falling air pressure. An elongated low-pressure area develops in the region extending from the Thar Desert in the northwest to Patna and Chotanagpur plateau in the east and southeast towards the end of May. Circulation of air begins to set in around this trough. InterTropical Convergence Zone (ITCZ) - Low pressure region around which the southeast trade winds and the northeast trade winds converge.", "source": null}, {"id": 488, "topic": "Climate", "question": "The day to day condition of the atmosphere at a place with respect to the temperature, humidity, rainfall, wind speed etc. is called _______ at that place.", "options": {"a": "climate", "b": "weeather", "c": "environment", "d": "ecology"}, "answer": "b", "explanation": "Weather. Climate - It is the long-term average of weather conditions, including temperature, humidity, precipitation, wind patterns, and other atmospheric elements, in a particular region over an extended period, typically 3r0 years or more. F", "source": null}, {"id": 489, "topic": "Climate", "question": "Which of the following pressure belts is known as the horse latitude?", "options": {"a": "Equatorial Low Pressure", "b": "Sub - Polar Low Pressure", "c": "High Pressure", "d": "Sub - Tropical High Pressure"}, "answer": "d", "explanation": "Subtropical high pressure belts (Horse latitude) extend 30° N and 30° S. It is formed because the warm air rising from the equator moves towards the tropics in both hemispheres. Equatorial Low - Pressure belt extends from 0 to 5° North and South. The subpolar low pressure belt extends around latitudes 60° to 70° North and South. High Pressure belts are located at 70°- 90° North and South latitudes. There are majorly seven Pressure Belts on the surface of Earth i.e., the Equatorial Low, two Subtropical Highs, two Subpolar Lows, and two Polar Highs.", "source": null}, {"id": 490, "topic": "Climate", "question": "When the grains of sand are very - fine and light, the wind can carry it over a very long distance. When such sand is deposited in large areas, it is called_____.", "options": {"a": "loess", "b": "moraines", "c": "mushroom", "d": "stacks"}, "answer": "a", "explanation": "Loess. It is a clastic, predominantly silt-sized sediment that is formed by the accumulation of wind - blown dust.", "source": null}, {"id": 491, "topic": "Climate", "question": "Consider the following statements about the main reasons for the excessive cold in north India during the cold weather season and identify which of the statements are correct. 1. States like Punjab, Haryana and Rajasthan, being far away from the moderating influence of sea, experience continental climate. 2. The snowfall in the nearby Himalayan ranges creates a cold wave situation. 3. Aroundi February, the cold winds coming from the Caspian Sea and Turkmenistan bring a cold wave along with frost and fog over the northwestern parts of India.", "options": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1, 2 and 3", "d": "1 and 3 only"}, "answer": "c", "explanation": "1, 2 and 3. Coastal areas have moderate temperatures because the land absorbs and radiates heat much faster than sea. So, during the day cool air from the sea rushes towards the land and during the night cool air from the land rushes towards the sea.", "source": null}, {"id": 492, "topic": "Climate", "question": "Low annual range of temperature and high annual rainfall are characteristics of a _________.", "options": {"a": "Mediterranean climate", "b": "temperate climate", "c": "tropical humid climate", "d": "cold climate"}, "answer": "c", "explanation": "Tropical Humid Climate: Low range of temperature, Rainfall exceeds evapotranspiration for at least 270 days in a year, between Tropic of Cancer and Capricorn.", "source": null}, {"id": 493, "topic": "Climate", "question": "Which of the following codes signify Cold Climate with Dry Winters according to Koeppen’s classification?", "options": {"a": "EF", "b": "Df", "c": "ET", "d": "Dw"}, "answer": "d", "explanation": "Dw. Koeppen recognised six major climatic groups based on seasonal precipitation and temperature patterns. The six main groups are A (tropical), B (arid), C (temperate), D (continental), E (polar) and H (highland).", "source": null}, {"id": 494, "topic": "Climate", "question": "The cold snow forest climate is found largely in the continental region in the Northern Hemisphere between _______ northern latitudes in Europe, Asia and North America", "options": {"a": "40°- 70°", "b": "30°- 50°", "c": "80°- 110°", "d": "15°- 20°"}, "answer": "a", "explanation": "40°-70°. India has a tropical climate because of the Himalayan mountain.", "source": null}, {"id": 495, "topic": "Climate", "question": "In early November, the low Pressure conditions shift over the Bay of Bengal. This transfer is related to cyclonic low pressure, which originates over ________.", "options": {"a": "Andaman Sea", "b": "Sea of Japan", "c": "Caspian Sea", "d": "Pacific Ocean"}, "answer": "a", "explanation": "Andaman Sea (Burma sea in Thai) is a body of water to the southeast of the Bay of Bengal, south of Myanmar, west of Thailand and east of the Andaman Islands; it is a part of the Indian Ocean. Industries", "source": null}, {"id": 496, "topic": "Industries", "question": "Name the port that is privately owned by the Adani Group?", "options": {"a": "Visakhapatnam Port, Andhra Pradesh", "b": "Chennai Port, Tamil Nadu", "c": "Kandla Port, Gujarat", "d": "Mundra Port, Gujarat"}, "answer": "d", "explanation": "Mundra Port, Gujarat. Mundra Port, located in Gujarat, is India’s largest private commercial port, owned and operated by the Adani Ports and Special Economic Zone (APSEZ) under the Adani Group. It handles bulk, container, and liquid cargo, and has emerged as a key hub for India’s international trade, unlike otherF government-owned major ports.", "source": "SSC Stenographer 8/08/2025 (Shift 1)"}, {"id": 497, "topic": "Industries", "question": "Select the INCORRECT statement from the following.", "options": {"a": "The development of the cotton textile industry in Britain led to the decline of Indian textile producers.", "b": "Cotton clothes made in England had driven Indian clothes out of the markets of Europe and America in the beginning of the 20th century.", "c": "The Sale and Devang communities of South India were famous for weaving.", "d": "The first cotton textile mill in India was established in Bombay in 1854."}, "answer": "b", "explanation": "By the beginning of the 20th century, India was not competing in European and American markets because British policies had already eliminated Indian textile exports to these regions by the 19th century. The decline of Indian textiles in international markets occurred much earlier, during the late 18th and 19th centuries, following the Industrial Revolution in Britain.", "source": null}, {"id": 498, "topic": "Industries", "question": "Identify the oldest iron and steel company of India from the following options.", "options": {"a": "Tata Iron & Steel Company (TISCO)", "b": "Visvesvaraiya Iron & Steel Works", "c": "Indian Iron & Steel Company (IISCO)", "d": "Mysore Iron & Steel Works"}, "answer": "a", "explanation": "Tata Iron and Steel Company (TISCO): Founded by Jamsetji Tata and Dorabji Tata in 1907, It is located in Jamshedpur (Jharkhand). Visvesvaraya Iron and Steel Plant: Founded in 1923, this plant is situated in Bhadravathi (Karnataka), and specializes in the production of pig iron and steel. Indian Iron and Steel Company (IISCO): Established in 1918, IISCO is an integrated steel plant located in Burnpur (West Bengal) and is part of Steel Authority of India Limited (SAIL).", "source": null}, {"id": 499, "topic": "Industries", "question": "Identify the group of districts that are NOT an example of industrial districts of India.", "options": {"a": "Cuttack and Kota", "b": "Kanpur and Agra", "c": "Alwar and Bhiwani e", "d": "Jabalpur and Bhopal"}, "answer": "c", "explanation": "Alwar and Bhiwani. Cuttack (Odisha) is known for textile and handicraft industries, especially the silver filigree (Tarakasi) work. Kota (Rajasthan) is famous for its engineering and chemical industries. Kanpur is a srignificant industrial hub, historically known for its leather and textile industries. It is sometimes called the \"Manchester of the East.\" Agra is widely known for its tourism, but it also has industries related to leather goods, footwear, and marble stone carving. Jabalpur (Madhya Pradesh) is known for ordnance factories, defense-related industries, and manufacturing units. Bhopal (Madhya Pradesh) is a major industrial center with industries like electrical goods, chemicals, and the famous Bharat Heavy Electricals Limited (BHEL).", "source": null}, {"id": 500, "topic": "Industries", "question": "Consider the following statements about industries in India: Statement I: BHEL (Bharat Heavy Electricals Limited) is a public sector industry established in 1964, headquartered in New Delhi. Statement II: Reliance, Tata, and Adani Groups are public sector industries. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Reliance Industries Limited is an Indian multinational company based in Mumbai, Maharashtra. It was founded by Dhirubhai Ambani. The Tata Group is one of India's oldest and largest business conglomerates. It was founded in 1868 by Jamsetji Tata. The Adani Group is an Indian multinational conglomerate based in Ahmedabad, Gujarat. It was founded in 1988 by Gautam Adani.", "source": null}, {"id": 501, "topic": "Industries", "question": "Which of the following is an example of a major industrial region of India?", "options": {"a": "Chota Nagpur region", "b": "Bhojpur-Munger", "c": "Jaipur- Ajmer", "d": "Bilaspuir-Korba"}, "answer": "a", "explanation": "Chota Nagpur region. India has several industrial regions like Mumbai- Pune cluster, Bangalore-Tamil Nadu region, Hugli region, Ahmedabad -Baroda region, Chottanagpur industrial belt, Vishakhapatnam-Guntur belt, Gurgaon -Delhi-Meerut region and the Kollam -Thiruvanathapuram industrial cluster.", "source": null}, {"id": 502, "topic": "Industries", "question": "Where was the first successful textile mill established in India?", "options": {"a": "Kolkata", "b": "Surat", "c": "Mumbai", "d": "Jaipur"}, "answer": "c", "explanation": "Mumbai. The first successful textile mill in India was the Bombay Spinning and Weaving Company, established in 1854 in Bombay (now Mumbai) by Cowasjee Nanabhoy Davar, a Parsi businessman and banker. Located in Tardeo, Bombay, it began production in 1856.", "source": null}, {"id": 503, "topic": "Industries", "question": "Where is the oldest centre of lace work located in Gujarat?", "options": {"a": "Kutch", "b": "Rajkot", "c": "Jamnagar", "d": "Ahmedabad"}, "answer": "c", "explanation": "Jamnagar. Crafts Centers of Gujarat: Kutch - Known for its rich tradition in embroidery and textile crafts. Surat - It is an important silk weaving center of India and is famous for silk brocades. Rajkot - It is popular for traditional and folk silver jewelry. Palitana - Known for making bronze sculptures. Ahmedabad (Manchester of India) - Famous for cotton textile works. The first cotton textile mill was started in 1861.", "source": null}, {"id": 504, "topic": "Industries", "question": "There is a cable manufacturing facility at HCL in Rupnarainpur. It belongs to which state?", "options": {"a": "Haryana", "b": "Assam", "c": "Andhra Pradesh", "d": "West Bengal"}, "answer": "d", "explanation": "West Bengal. West Bengal along with their notable industries: Durgapur (Iron and Steel), Kharagpur (Chemicals), Haldia (petrochemicals), Darjeeling (tea), Chittaranjan (Electric locomotives), Asansol (Coal, Iron and Steel), Kalyani (Heavy Engineering), Rishra (Textiles).", "source": null}, {"id": 505, "topic": "Industries", "question": "According to the Department of Industrial Policy and Promotion, which of the following is NOT a core industry ?", "options": {"a": "Jute", "b": "Fertilisers", "c": "Crude oil", "d": "Electricity"}, "answer": "a", "explanation": "Jute. The eight core industries are- Coal, Crude oil, Natural Gas, Petroleum refinery products, Fertilizer, Cement, Steel, and Electricity generation.", "source": null}, {"id": 506, "topic": "Industries", "question": "Select the INCORRECT pair of the location of the refinery and its state from the following", "options": {"a": "Bina Refinery - Madhya Pradesh", "b": "Numaligarh Refinery - Assam", "c": "Koyali Refinery - Gujarat", "d": "Tatipaka Refinery - Telangana"}, "answer": "d", "explanation": "Tatipaka Refinery Telangana. Tatipaka Oil Refinery is located in the East Godavari district in Andhra Pradesh. It was set up on 3rd September 2001. Some list of oil refineries: Vadinar Refinery (Gujarat), Kochi Refinery (Kerala), Mangalore Refinery (Karnataka), Paradip Refinery (Odisha), Barauni Refinery (Barauni inF Bihar).", "source": null}, {"id": 507, "topic": "Industries", "question": "Which group of states was concentrated in the cotton production in the early years to develop textile industry?", "options": {"a": "West Bengal and Odisha", "b": "Punjab and Haryana", "c": "Maharashtra and Gujarat", "d": "Bihar and West Bengal"}, "answer": "c", "explanation": "Maharashtra and Gujarat. Cotton is a tropical crop and it is raised in India as a Kharif crop. Climatic condition - Temperatures between 21 degrees Celsius and 30 degrees Celsius. It grows best in Black soil. India grows both short staple (Indian) cotton as well as long staple (American) cotton called ‘narma’ in north-western parts of the country.", "source": null}, {"id": 508, "topic": "Industries", "question": "Where was the first cement plant located in India in the year 1904 ?", "options": {"a": "Jaipur", "b": "Rajkot", "c": "Chennai", "d": "Hyderabad"}, "answer": "c", "explanation": "Chennai. South India Industries Limited in Madras, made an initiative to manufacture Portland cement. India entered into the Cement Era in 1914, when the Indian Cement Company Ltd. started manufacturing Cement in Porbandar in Gujarat.", "source": null}, {"id": 509, "topic": "Industries", "question": "Consider the following statements about oilfields in India: Statement I: Digboi and Naharkatiya oilfields are located in Assam. Statement II: Ankaleshwar, Kalol, Mehsana, Nawagam, Kosamba and Lunej oilfields are located in Maharasthra. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Digboi Oilfield: One of the oldest oil fields in Asia, discovered in 1867, and home to Asia's oldest oil refinery (Established in 1901). It is located in Tinsukia district, Assam. Naharkatiya Oilfield: DiscoveredB in 1953, with oil production starting in 1954. It is located in Dibrugarh disetrict, Assam. Other Oil Refineries in Assam - Noonmati Refinery, Numamligarh Refinery, and - Bongaigaon Refinery. Kosamba, Lunej, Mehsana, Nawagam, Ankleshwar and Kalol are oeil-producing regions located in Gujarat.", "source": null}, {"id": 510, "topic": "Industries", "question": "Which of the following cities is c alled the Silicon Valley of India due to its prominence in the IT industry ?", "options": {"a": "Bengaluru", "b": "Dehradun", "c": "Hyderabad", "d": "Gurugram"}, "answer": "a", "explanation": "Bengaluru I. Nicknames of Indian Cities: Hyderabad - City of Pearls; Gurugram - Millennium City; Korba Power Hub of India; Jamshedpur - Steel Capital of India; Nalanda - The Land of Knowledge; Guntur - Land of Chillies; Kashmir - Switzerland of India; Pondicherry - Paris of the East; Coimbatore - Manchester of South India; Chennai - Detroit of Asia.", "source": null}, {"id": 511, "topic": "Industries", "question": "Which of the following is the only vertically - integrated, primary copper producer in India ?", "options": {"a": "Sterlite Industries", "b": "Jhagadia Copper Limited", "c": "Hindalco Industries (Birla Copper)", "d": "Hindustan Copper Limited"}, "answer": "d", "explanation": "Hindustan Copper Limited. It is a public sector undertaking under the Ministry of Mines. The company was incorporated on 9th November 1967, under the Companies Act, 1956. Headquarters - Kolkata.", "source": null}, {"id": 512, "topic": "Industries", "question": "Consider the following statements regarding gold mines in India: 1. The Kolar region of Karnataka is famous for its gold fields and is also called the “Golden City of India.” 2. Hutti Gold Mines is located in Jharkhand, is among the largest gold producers in India. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Kolar - Golden City of India. It is popularly known as the land of Silk, Milk, Mango, Gold. Other Gold mines - Hutti Golid Mines (Karnataka), Lava Gold Mines i (Jharkhand), Sonbhadra Mine a (Uttar Pradesh), Parasi (Jharkhand), Dadam (Haryana).", "source": null}, {"id": 513, "topic": "Industries", "question": "Which state in India has the highest number of aluminium smelting plants?", "options": {"a": "Odisha", "b": "Tamil Nadu", "c": "Maharashtra", "d": "Uttar Pradesh"}, "answer": "a", "explanation": "Odisha. Aluminum smelting plants - Korba, Alupuram, Renukoot, Mettur, Hirakud, Angul, Jharsuguda and Faridabad. Aluminium Companies in India - Hindustan Aluminium Company (Mumbai, Maharashtra), Vedanta Limited (Jharsuguda, Odisha), Sacheta Metals (Mumbai, Maharashtra).", "source": null}, {"id": 514, "topic": "Industries", "question": "Which of the following industries is its own major consumer in India?", "options": {"a": "Iron and steel", "b": "Aviation", "c": "Automobile", "d": "Chemical"}, "answer": "d", "explanation": "Chemical. India is the 6th - largest producer of chemicals in the world and 3rd in Asia. Also the fourth-largest producer of agrochemicals after the United States, Japan and China.", "source": null}, {"id": 515, "topic": "Industries", "question": "Which city in India is known as the ‘Detroit of India’ due to its automobile industry?", "options": {"a": "Chennai", "b": "Mumbai", "c": "Bengaluru", "d": "Pune"}, "answer": "a", "explanation": "Chennai - It is contributing more than 40% of the country's auto parts and vehicles. The World's major automotive giants that operate in Chennai are TVS, Ashok Leyland, Royal Enfield, TI Cycle, TAFE, Hyundai, Mitsubishi etc.", "source": null}, {"id": 516, "topic": "Industries", "question": "The Kudremukh Mines are located in which of the following states?", "options": {"a": "Karnataka", "b": "Chhattisgarh", "c": "Maharashtra", "d": "Odisha"}, "answer": "a", "explanation": "Karnataka. Kudremukh Mines is an iron ore mine located in the Bellary, Chitradurga, Chikkamagaluru, Tumkur belt. Other Iron ore mines Chhattisgarh - Rowghat Mines, Bailadila. Odisha - Balda Block, Joda East, Gorumahisani, Jajang Rungta. Madhya Pradesh - Agaria Iron Ore mine.", "source": null}, {"id": 517, "topic": "Industries", "question": "In which of the following regions in India are there high-grade iron ore deposits?", "options": {"a": "Western Rajasthan", "b": "Southern Punjab", "c": "Eastern Uttar Pradesh", "d": "Northern Odisha"}, "answer": "d", "explanation": "Northern Odisha. The iron ore mines are located near the coal fields in the northeastern plateau region. Odisha, Jharkhand, Chhattisgarh, Karnataka, Goa, Telangana, Andhra Pradesh, and Tamil Nadu account for approximately 95% of total iron ore reserves. Iron Ore and Percentage of iron: Magnetite - 72%, Hematite - 60-70 Limonite - 40 to 60%, Siderite - 48%.", "source": null}, {"id": 518, "topic": "Industries", "question": "Which is the first integrated steel plant in the public sector in India?", "options": {"a": "The Visvesvaraya Iron and Steel Limited", "b": "Rourkela Steel Plant", "c": "The Salem Steel Plant", "d": "Indian Iron and Steel Company"}, "answer": "b", "explanation": "Rourkela Steel Plant (Odisha - 1959). Established with the help of West German Industrial Corporations. Steel plants built in India during the Second Five Year Plan (FYP): Durgapur Steel Plant (West Bengal Britain Cooperation), Bhilai Steel Plant (Chattisgarh - USSR Cooperation).", "source": null}, {"id": 519, "topic": "Industries", "question": "Which is the oldest aluminium refinery plant in India?", "options": {"a": "The Damanjodi Plant", "b": "The Muri Alumina Plant", "c": "The Mettur Plant", "d": "The Belgaum Plant"}, "answer": "b", "explanation": "The Muri Alumina Plant Situated near Chota Muri at Swarnarekha River in Ranchi (Jharkhand). It was commissioned in 1948. Its capacity 450 Kilo tonne per annum (present). The Mettur Plant, Tamil Nadu. Damanjodi Located in the Koraput district (Odisha), famous for discovery of bauxite mines and setting up of NALCO (National Aluminium Company Limited).", "source": null}, {"id": 520, "topic": "Industries", "question": "With respect to value addition the textile industry, knitting is followed which procedure?", "options": {"a": "Garment manufacture", "b": "Spinning", "c": "Fiber production", "d": "Dyeing and finishing:"}, "answer": "d", "explanation": "Dyeing and finishing. In the textile industry, the process begins with fiber production, followed by spinning create yarn, and then knitting or weaving to form fabric. Next comes dyeing, printing, and finishing to enhance the fabric, and finally, garment manufacturing, involving cutting and sewing. Thus, the step following knitting is dyeing and finishing.", "source": null}, {"id": 521, "topic": "Industries", "question": "Which of the following is dark reddish coloured stone used as raw material in aluminum smelting?", "options": {"a": "Mica", "b": "Gypsum", "c": "Bauxite", "d": "Conglomerate"}, "answer": "c", "explanation": "Bauxite.", "source": null}, {"id": 522, "topic": "Industries", "question": "The Paithani saree weaving industry is in which state? B", "options": {"a": "Rajasthan", "b": "Gujarat%,", "c": "Maharashtra", "d": "Assam"}, "answer": "c", "explanation": "Maharashtra. They are woven by hand. They are made from very fine mulberry silk. Bieosphere Reserves", "source": null}, {"id": 523, "topic": "Biosphere Reserves", "question": "Which of the following srtatements best links a current conservation initiative for the Great Indian Bustard with its geographical location?", "options": {"a": "National Avian Research Centre in - Maharashtra conducted habitat simulation for GIB.", "b": "Kalyan Sanctuary in Karnataka now houses the largest wild GIB population.", "c": "India's first successful artificial insemination of GIB took place in the National Breeding Centre in Jaisalmer, Rajasthan.", "d": "A GIB conservation breeding centre - was set up in Kutch, Gujarat for desert climate adaptation."}, "answer": "c", "explanation": "The Great Indian Bustard is (GIB) is critically endangered, with its last viable wild population mainly surviving - Rajasthan’s Desert National Park. save the species, the National Bustard Breeding Centre (NBBC) was established in Jaisalmer and Pokhran, Rajasthan. in June 2021, India achieved the milestone by of the first successful artificial insemination and captive breeding of GIB here.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 524, "topic": "Biosphere Reserves", "question": "What is the role of National Parks under the Wildlife Protection Act, 1972?", "options": {"a": "To promote tourism", "b": "To protect wildlife and their habitats to", "c": "To regulate trade", "d": "To oversee elections"}, "answer": "b", "explanation": "To protect wildlife and their habitats. Under the Wildlife Protection Act, 1972, National Parks are designated areas aimed at protecting wildlife and preserving natural habitats. Human activities like hunting, grazing, forestry, or private land use are strictly prohibited inside National Parks. Unlike sanctuaries, even privaite land rights cease once an area isi declared a National Park. While a tourism may occur in a regulated manner, its primary objective remains the h conservation of ecosystems and protection of biodiversity.", "source": "SSC Stenographer 6/08/2025 (Shift 3)"}, {"id": 525, "topic": "Biosphere Reserves", "question": "Which of the following Biosphere Reserves is correctly matched with its state?", "options": {"a": "Seshachalam Hills - Andhra Pradesh", "b": "Dehang-Dibang - Meghalaya", "c": "Pachmarhi - Gujarat", "d": "Dibru-Saikhowa - Manipur"}, "answer": "a", "explanation": "Seshachalam Hills - Andhra Pradesh. The Seshachalam Hills are located in the southern part of Andhra Pradesh and were designated as a Biosphere Reserve in 2010. This area is part of the Eastern Ghats and encompasses the famous Tirumala Venkateswara Temple. The Dehang-Dibang Biosphere Reserve is located in the state of Arunachal Pradesh. The Pachmarhi Biosphere Reserve is situated in the Satpura Range of Madhya Pradesh. The Dibru-Saikhowa National Park and Biosphere Reserve is located in the state of Assam.", "source": "SSC Stenographer 8/08/2025 (Shift 2)"}, {"id": 526, "topic": "Biosphere Reserves", "question": "Match the following Wildlife Sanctuaries (Column A) with their respective States (Column B). Choose the option correct option: Column A Column B (Wildlife Sanctuary) (State) 1. Gandhi Sagar a. Assam in WLS To 2. Sonai Rupai WLS b. Madhya Pradesh 3. Kaimur WLS c. Telangana 4. Eturnagaram WLS d. Bihar In", "options": {"a": "1-b, 2-a, 3-d, 4-c", "b": "1-a, 2-c, 3-b, 4-d", "c": "1-d, 2-c, 3-a, 4-b", "d": "1-c, 2-d, 3-a, 4-b"}, "answer": "a", "explanation": "Sonai Rupai Wildlife Sanctuary is situated in the foothills of the Himalayas in the Sonitpur district of Assam. Kaimur Wildlife Sanctuary, the largest in the state, is located in the Kaimur district of Bihar. Eturnagaram Wildlife Sanctuary is located in the Mulugu district of Telangana. The Gandhi Sagar Wildlife Sanctuary in Madhya Pradesh has been identified as the second potential home for cheetahs in India, after Kuno National Park.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 527, "topic": "Biosphere Reserves", "question": "Read the below statements and choose the correct option: Statement 1: India's first initiative to track Fishing Cats through radio-collars has been introduced at Coringa Wildlife Sanctuary. Statement 2: Fishing Cats are primarily found in coastal wetlands and mangrove ecosystems.", "options": {"a": "Both Statements 1 and 2 are correct", "b": "Neither Statement 1 nor 2 is correct", "c": "Only Statement 1 is correct", "d": "Only Statement 2 is correct"}, "answer": "a", "explanation": "The Wildlife Institute of India (WII), Dehradun, in collaboration with the Andhra Pradesh Forest Department, has undertaken India’s first Fishing Cat Collaring Project at Coringa Wildlife Sanctuary (Andhra Pradesh) to track the movements and behaviors of these endangered felines. Fishing Cats (Prionailurus viverrinus) are semi-aquatic wildcats that predominantly inhabit wetland ecosystems, including coastal wetlands, swamps, marshes, tidal creeks, and mangrove forests. These habitats are critical to their survival and hunting behavior.", "source": "SSC Stenographer 8/08/2025 (Shift 3)"}, {"id": 528, "topic": "Biosphere Reserves", "question": "Match the following. 1. Ranthambore National", "options": {"a": "Tamil Nadu Park 2. Bandipur National", "b": "Rajasthan Park 3. Mudumalai National", "c": "Karnataka Park", "d": "1-a, 2-c, 3-b"}, "answer": "b", "explanation": "1-a, 2-b, 3-c (c) 1-c, 2-b, 3-a (d) 1-b, 2-c, 3-a Sol.528.(d) 1-b, 2-c, 3-a.", "source": null}, {"id": 529, "topic": "Biosphere Reserves", "question": "Which of the following protected areas are located in Telangana? I. Kawal Tiger Reserve II. Pranahita Wildlife Sanctuary III. Nagarjuna Sagar–Srisailam Tiger Reserve IV. Kinnerasani Wildlife Sanctuary", "options": {"a": "Only I and II", "b": "Only II and III", "c": "Only I, II, III and IV", "d": "Only I and III"}, "answer": "c", "explanation": "Only I, II, III and IV. Kawal Tiger Reserve is located at Adilabad district in Telangana. It was declared wildlife sanctuary in 1965 and later became part of the Kawal Tiger Reserve under Project Tiger in 2012.", "source": null}, {"id": 530, "topic": "Biosphere Reserves", "question": "The Betul, Hoshangabad and Chhindwara districts of Madhya Pradesh is a part of which of the following Biosphere Reserves?", "options": {"a": "Manas", "b": "Seshachalam", "c": "Agasthyamalai", "d": "Pachmarhi"}, "answer": "d", "explanation": "Pachmarhi Biosphere Reserve is recognized for its rich biodiversity and has been designated as a UNESCO Biosphere Reserve in 2009. The Satpura mountain ranges across India from west to east and Pachmarhi lies directly in its centre. It comprises three protection sites: the Bori Sanctuary, Satpura National Park and Pachmarhi Sanctuary. Other Biosphere Reserve: Manas (Assam), Seshachealam (Andhra Pradesh), Agasthyamalai (Kerala and Tamil Nadu). m", "source": null}, {"id": 531, "topic": "Biosphere Reserves", "question": "As of the June 2021, how many biosphere reserves are established in India?", "options": {"a": "18", "b": "20", "c": "26", "d": "15"}, "answer": "a", "explanation": "18. The Government of India started the Biosphere Reserve scheme in F 1986. This is guided by the UNESCO MAB programme, as India is a signatory to the landscape approach supported by MAB. The Nilgiri Biosphere Reserve was the first and Oldest biosphere reserve in India established in 1986.", "source": null}, {"id": 532, "topic": "Biosphere Reserves", "question": "Which national park in the Andaman and Nicobar Islands is home to species like Megapode, crab-eating Macaque, Nicobar Pigeon, and Giant Robber Crab?", "options": {"a": "Raimona National Park", "b": "Campbell Bay National Park", "c": "Mouling National Park", "d": "Papikonda National Park"}, "answer": "b", "explanation": "Campbell Bay National Park established in 1992, spans 426.23 square km and is part of the Great Nicobar Biosphere Reserve. Other notable parks include Raimona National Park in Assam (famous for elephants and tigers), Mouling National Park in Arunachal Pradesh (known for temperate forests and Himalayan wildlife), and Papikonda National Park in Andhra Pradesh (noted for Eastern Ghats biodiversity).", "source": null}, {"id": 533, "topic": "Biosphere Reserves", "question": "Consider the following statements regarding Tadoba National Park: a I. Tadoba National Park is located in Chandrapur district of Maharashtra. II. It was declared a National Park in 1956. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. In 1955, Tadoba National Park was given the designation of a National Park. Other National Parks of Maharashtra are Chandoli National Park, Naviegaon National Park, Gugamal Nationial Park, Sanjay Gandhi National a Park.", "source": null}, {"id": 534, "topic": "Biosphere Reserves", "question": "In which state is the Nanda Devi Biosphere Reserve located?", "options": {"a": "Assam", "b": "Himachal Pradesh", "c": "Odisha", "d": "Uttarakhand"}, "answer": "d", "explanation": "Uttarakhand. Nanda Devi Biosphere Reserve included in UNESCO World Heritage site in 1988. Some biosphere reserves in India: Cold Desert (Himachal Pradesh), Khangchendzonga (Sikkim), Dihang - Dibang (Arunachal Pradesh), Manas (Assam), Dibru - Saikhowa (Assam), Nokrek (Meghalaya), Panna (Madhya Pradesh), Pachmarhi (Madhya Pradesh).", "source": null}, {"id": 535, "topic": "Biosphere Reserves", "question": "Select the natural habitat of the Asiatic Lion from the following.", "options": {"a": "Gir forest", "b": "Sundarbans", "c": "Kanha National Park", "d": "Saranda forest"}, "answer": "a", "explanation": "Gir forest. Asiatic lions are an endangered species and their 534is restricted only to the Gir National Park situated in Gujarat. India is the only country in the world to have both tigers and lions. Tigers are found in the forests of Madhya Pradesh, the Sundarbans of West Bengal. Number of Lions in India - 674. The first tiger reserve in India was established in 1973 (Project Tiger).,", "source": null}, {"id": 536, "topic": "Biosphere Reserves", "question": "Which of the following statements is/are correct I. Maximum National Parks in India are located in the state of Madhya Pradesh. II. Mudumalai National Park is located in Kerala. III. The Salim Ali Centre for Ornithology and Natural History is located Tamil Nadu.", "options": {"a": "Both I and II are correct", "b": "Both I and III are correct", "c": "Only III is correct", "d": "Only I is correct."}, "answer": "b", "explanation": "Both I and III are correct.", "source": null}, {"id": 537, "topic": "Biosphere Reserves", "question": "Which biosphere of Southern Andhra Pradesh is home to many endemic species including the famous Red Sanders and Slender Loris?", "options": {"a": "Cold Desert", "b": "Pachmarhi", "c": "Seshachalam", "d": "Agasthyamalai"}, "answer": "c", "explanation": "Seshachalam. It is Biosphere Reserve situated in the Seshachalam Hill ranges of the Eastern Ghats in southern Andhra Pradesh, covering a total area of 4755.9 km². Seshachalam SLBR was designated 2011. It is known for its large reserves Red Sandalwood.", "source": null}, {"id": 538, "topic": "Biosphere Reserves", "question": "The Keoladeo National Park located in the state of _______.", "options": {"a": "Gujarat", "b": "Rajasthan", "c": "Odisha", "d": "Madhya Pradesh"}, "answer": "b", "explanation": "Rajasthan. Keoladeo National Park in Bharatpur district was declared a UNESCO World Heritage Site in 1985. States and National Parks: Rajasthan - Ranthambhore, Sariska. Gujarat - Gir, Marine. Odisha - Simlipal. Madhya Pradesh - Bandhavgarh, Fossil, Madhav, Sanjay-Dubri.", "source": null}, {"id": 539, "topic": "Biosphere Reserves", "question": "Correctly match the following. States Bio-reserve 1. Assam a. Pachmarhi 2. Madhya Pradesh b. Nokrek 3. Odisha c. Manas 4. Meghalaya d. Similipa", "options": {"a": "1-c, 2-a, 3-d, 4-b", "b": "1-b, 2-a, 3-d, 4-c", "c": "1-a, 2-b, 3-c, 4-d", "d": "1-b, 2-c, 3-a, 4-d"}, "answer": "a", "explanation": "1-c, 2-a, 3-d, 4-b.", "source": null}, {"id": 540, "topic": "Biosphere Reserves", "question": "Match the following. i) Gir National Park a) Rhinos ii) Rajaji National b) Siberian cranes Park iii) Keoladeo c) Lions NationalPark iv) Kaziranga d) Elephants National Park", "options": {"a": "i-d, ii-b, iii-c, iv-a", "b": "i-d, ii-c, iii-a, iv-b", "c": "i-c, ii-d, iii-b, iv-a", "d": "i-a, ii-b, iii-c, iv-d"}, "answer": "c", "explanation": "i-c, ii-d, iii-b, iv-a. Jim Corbett National Park (Uttarakhand) Tiger; Sundarban National Park (West Bengal) - Bengal tiger; Dudhwa National Park (Uttar Pradesh) - Swamp deer and in Tiger; Silent Valley National Park (Kerala) - Lion Tailed Macaque; Orang National Park (Assam) - One Horned Rhinoceros and the Royal Bengal Tiger.", "source": null}, {"id": 541, "topic": "Biosphere Reserves", "question": "Match the wildlife sanctuaries column A with their corresponding states in column B. Column A Column B (Wildlife Sanctuaries) (States) 1. Tansa a. Tamil Nadu 2. Guindy b. Maharashtra 3. Orchha c. Madhya Pradesh 4. Kaziranga d. Assam", "options": {"a": "1-a, 2-b, 3-c, 4-d", "b": "1-b, 2-a, 3-c, 4-d", "c": "1-b, 2-a, 3-d, 4-c", "d": "1-b, 2-c, 3-a, 4-d"}, "answer": "b", "explanation": "1-b, 2-a, 3-c, 4-d.", "source": null}, {"id": 542, "topic": "Biosphere Reserves", "question": "Which of the following is declared as a Wild Ass Sanctuary? in", "options": {"a": "Ladakh", "b": "Sunderbans of", "c": "Spiti Valley", "d": "Rann of Kachchh is"}, "answer": "d", "explanation": "Rann of Kachchh (Gujarat). is the only home to wild ass in India. The sanctuary was set up in 1972.", "source": null}, {"id": 543, "topic": "Biosphere Reserves", "question": "Which of the following is the closest wild relative of doemestic cattle protected in some of the famous national parks omf India like Nagarhole and Bandipur?", "options": {"a": "Red angus", "b": "Asiatic buffalo", "c": "Nilgai", "d": "Gaur"}, "answer": "d", "explanation": "Gaur. First population estimation exercise of the Indian Gaur (Bison) was carried out in the Nilgiris Forest Division (Tamil Nadu).", "source": null}, {"id": 544, "topic": "Biosphere Reserves", "question": "Consider the following statements regarding Biosphere Reserves in India: I. Gulf of Mannar Biosphere Reserve located in Kerala. II. Dugong, the largest endangered marine mammal, is found in the Gulf of Mannar. III. Seshachalam Biosphere Reserve situated in Andhra Pradesh. Which of the above statements is/are incorrect?", "options": {"a": "Only I", "b": "Only II", "c": "Only III", "d": "I and II"}, "answer": "a", "explanation": "Only I. Gulf of Mannar Biosphere Reserve (Tamil Nadu, India’s first marine biosphere reserve). Biosphere Reserves: Khangchendzonga (Sikkim), and Pachmarhi (Madhya Pradesh). -", "source": null}, {"id": 545, "topic": "Biosphere Reserves", "question": "In which state is Gorumara National Park located?", "options": {"a": "Assam", "b": "West Bengal", "c": "Uttarakhand", "d": "Bihar"}, "answer": "b", "explanation": "West Bengal. Gorumara National Park was established in 1994. It is primarily known for its population of in Indian rhinoceros. Other National Parks: West Bengal - Jaldapara, Sunderban, Singalila, Neora. Assam - Kaziranga, Nameri, Manas. Uttarakhand - Jim Corbett, Rajaji, Gangotri. Bihar - Valmiki. Rajasthan - Ranthambore, Keoladeo. Madhya Pradesh - Kanha, Van Vihar, Satpura.", "source": null}, {"id": 546, "topic": "Biosphere Reserves", "question": "The famous Nelapattu Bird Sanctuary is located in which of the following states?", "options": {"a": "Tamil Nadu", "b": "Andhra Pradesh", "c": "Karnataka", "d": "Madhya Pradesh"}, "answer": "b", "explanation": "Andhra Pradesh. Nelapattu Bird Sanc tuary - It is an important breedin g site for spot-billed pelicans (Pelecanus philippensis). Other bird sanctuaries in Andhra Pradesh - Kolleru, I t h Uppalapadu, Telineelapuram and Telukunchi. Tamil Nadu - Karikili Birds Sanctuary, Chitrangudi. Karnataka - Ranganathittu, Attiveri. Madhya Pradesh - Ghatigaon, Karera Bustard Sanctuary.", "source": null}, {"id": 547, "topic": "Biosphere Reserves", "question": "Which country is the only country in the world to have both tigers and lions?", "options": {"a": "Kenya", "b": "South Africa", "c": "India", "d": "China"}, "answer": "c", "explanation": "India. The natural habitat of the Indian lion is the Gir forest in Gujarat. Tigers are found in the forests of Madhya Pradesh, the Sundarbans of West Bengal. Number of Lions in India - 674. In 2023, the tiger population in India was recorded at 3682. is", "source": null}, {"id": 548, "topic": "Biosphere Reserves", "question": "The Eld's deer subspecies, which is classified as endangered in the IUCN Red List, is found only in the:", "options": {"a": "Hemis National Park in Ladakh", "b": "Ranthambore National Park in is Rajasthan", "c": "Keibul Lamjao National Park in Manipur", "d": "Pench National Park in Madhya Pradesh"}, "answer": "c", "explanation": "Keibul Lamjao National Park in Manipur. IUCN Headquarter is at Gland, Switzerland. The 7 categories of the IUCN Red List are Data Deficient (DD), Least Concern (LC), Near Threatened (NT), Vulnerable (VU), Endangered (EN), Critically Endangered (CR), Extinct In The Wild (EW), Extinct (EX).", "source": null}, {"id": 549, "topic": "Biosphere Reserves", "question": "Baghmara Pitcher Plant Sanctuary is located in which of the following states?", "options": {"a": "Meghalaya", "b": "Goa", "c": "Karnataka", "d": "Assam"}, "answer": "a", "explanation": "Meghalaya (South Garo Hills District). The sanctuary is named after rare insectivorous Pitcher Plant that endemic to this region only.", "source": null}, {"id": 550, "topic": "Biosphere Reserves", "question": "Assertion (A): Laokhowa Wildlife Sanctuary is located in Nagaon district Assam. Reason (R): It lies on the northern bank of the Subansiri River.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true but R is false.", "d": "A is false but R is true."}, "answer": "c", "explanation": "A is true but R is false. Laokhowa Wildlife Sanctuary is protected area located in the state Assam. This wildlife sanctuary covers 70.13 km 2, on the south bank of Brahmaputra River in Nagaon district.", "source": null}, {"id": 551, "topic": "Biosphere Reserves", "question": "In which of the following Indian states is the Barnawapara Wildlife Sanctuary located?", "options": {"a": "Assam", "b": "Karnataka", "c": "Sikkim", "d": "Chhattisgarh"}, "answer": "d", "explanation": "Chhattisgarh (Balodabazar district). It was established in 1976 under the Wildlife Protection Act, 1972. The Jonk River flows through the sanctuary, which is a tributary of the Mahanadi river.", "source": null}, {"id": 552, "topic": "Biosphere Reserves", "question": "In which of the following states Kali Tiger Reserve located ?", "options": {"a": "Arunachal Pradesh", "b": "Karnataka", "c": "Telangana", "d": "Assam"}, "answer": "b", "explanation": "Karnataka. Kali Tiger Reserve is a protected area and tiger reserve in Uttara Kannada district, Karnataka. The park is a habitat Bengal tigers, black panthers, and Indian elephants, amongst other distinctive fauna. The Kali River flows through whole tiger reserve.", "source": null}, {"id": 553, "topic": "Biosphere Reserves", "question": "Peppara Wildlife Sanctuary situated in which of the following states", "options": {"a": "Tamil Nadu", "b": "Meghalaya", "c": "Punjab", "d": "Kerala"}, "answer": "d", "explanation": "Kerala. Other Wildlife Sanctuaries in Kerala: Eravikulam, Periyar, Shendurney, Chinnar, Parambikulam, Idukki, Wayanad, Thattekad.", "source": null}, {"id": 554, "topic": "Biosphere Reserves", "question": "Dandeli Wildlife Sanctuary located in which of the following states?", "options": {"a": "Karnataka", "b": "Jharkhand", "c": "Sikkim", "d": "Kerala"}, "answer": "a", "explanation": "Karnataka.", "source": null}, {"id": 555, "topic": "Biosphere Reserves", "question": "The wetland of Ashtamudi located in: a", "options": {"a": "Assam", "b": "Tamil Nadu is", "c": "Kerala", "d": "Karnataka"}, "answer": "c", "explanation": "Kerala (in Kollam District). has a unique wetland ecosystem and of large palm shaped waterbody. Ashtamudi Wetland is included in the of wetlands of international importance.", "source": null}, {"id": 556, "topic": "Biosphere Reserves", "question": "Which sanctuary is famous endangered Estuarine Crocodiles conservation in India?", "options": {"a": "Indira Gandhi Wildlife Sanctuary", "b": "Bhitarkanika Wildlife Sanctuary, Odisha", "c": "Chinnar Wildlife Sanctuary, Kerala", "d": "Dandeli Wildlife Sanctuary, Karnataka"}, "answer": "b", "explanation": "Bhitarkanika Wildlife of Sanctuary (Odisha) is a Ramsar site and is one of India’s biggest estuarinhe the crocodile habitats and a major coastal ecosystem.", "source": null}, {"id": 557, "topic": "Biosphere Reserves", "question": "Which wildlife sanctuary is tri-state protected area in neorthern India? It is also famous for the Critically Endangered ghmarial, the red-crowned roofed turtle and the Endangered Ganges river dolphin?", "options": {"a": "Nationael Chambal Sanctuary", "b": "Chinnar Wildlife Sanctuary", "c": "Daendeli Wildlife Sanctuary", "d": "Bhadra Wildlife Sanctuary is"}, "answer": "a", "explanation": "National Chambal Sanctuary is located on the Chambal River near tri-point of Rajasthan, Madhya Pradesh and Uttar Pradesh.", "source": null}, {"id": 558, "topic": "Biosphere Reserves", "question": "In which district of Karnataka the Brahmagiri Wildlife Sanctuary in located? of", "options": {"a": "Hassan", "b": "Mandya", "c": "Udupi", "d": "Kodagu the"}, "answer": "d", "explanation": "Kodagu (Coorg). Brahmagiri Wildlife Sanctuary is situated on border between Wayanad District is Kerala state on the south and Kodagu ? District in Karnataka on the north side. Physiographic Division of India", "source": null}, {"id": 559, "topic": "Physiographic Division of India", "question": "Which of the following plateaus located in the northeastern part of India?", "options": {"a": "Malwa Plateau is", "b": "Deccan Plateau", "c": "Chota Nagpur Plateau", "d": "Shillong Plateau"}, "answer": "d", "explanation": "Shillong Plateau. This plateau is part of the peninsular block separated from the Chota Nagpur Plateau by the Garo–Rajmahal Gap. It is is known for its rich mineral resources and scenic landscape. Other plateau location: Malwa Plateau - Central India. Deccan Plateau - Southern & Central India. Chota It Nagpur Plateau - Eastern India a (Jharkhand, Odisha, West Bengal).", "source": "SSC Stenographer 6/08/2025 (Shift 2)"}, {"id": 560, "topic": "Physiographic Division of India", "question": "Which of the following is a list characteristic feature of the Western Coastal Plains? for", "options": {"a": "Mangrove forests", "b": "High rainfall", "c": "Large deltas", "d": "Lagoons and backwaters"}, "answer": "d", "explanation": "Lagoons and backwaters. The Westiern Coastal Plains are narrow plains i lying between the Western Ghats a and the Arabian Sea. A unique feature is the presence of lagoons and backwaters, especially in Kerala (e.g., Vembanad Lake). Unlike the Eastern Coastal Plains, which are broader and have large deltas (e.g., Ganga, Mahanadi), the Western a Coastal Plains are narrow and do not support major delta formation.", "source": "SSC Stenographer 6/08/2025 (Shift 2)"}, {"id": 561, "topic": "Physiographic Division of India", "question": "The Western Coastal Plains are narrower compared to the Eastern Coastal Plains because:", "options": {"a": "They receive less rainfall", "b": "They are less populated", "c": "They are older in formation", "d": "They are bordered by the Western Ghats the"}, "answer": "d", "explanation": "They are bordered by the Western Ghats. The Western Coastal Plains are much narrower than the is Eastern Coastal Plains. This is because the Western Ghats run close and almost parallel to the Arabian Sea coast. As a result, there is very little flat land between the mountains and the sea. On the other hand, the Eastern Ghats are more eroded the and lie farther from the Bay of Bengal. of Hence, the Eastern Coastal Plains are wider, while the Western ones remain narrow.", "source": "SSC Stenographer 7/08/2025 (Shift 1)"}, {"id": 562, "topic": "Physiographic Division of India", "question": "Select the correct order of the following plateaus and ranges from is south to north in India.", "options": {"a": "Malwa Plateau, Vindhya Range, Satpura Range and Deccan Plateau", "b": "Deccan Plateau, Vindhya Range, Satpura Range and Malwa Plateau", "c": "Deccan Plateau, Satpura Range, Vindhya Range and Malwa Plateau", "d": "Malwa Plateau, Satpura Range, Vindhya Range and Deccan Plateau"}, "answer": "c", "explanation": "Deccan Plateau: The southernmost plateau, covering parts of Maharashtra, Karnataka, Andhra Pradesh, and Telangana. Satpura Range: Located to the north of the Deccan Plateau and runs through Madhya Pradesh and Maharashtra. Vindhya Range: Lies further north of the Satpura Range, stretching across Madhya Pradesh and separating the northern plains from the southern plateaus. Malwa Plateau: Located to the north of the Vindhya Range, covering parts of Madhya Pradesh and Rajasthan.", "source": null}, {"id": 563, "topic": "Physiographic Division of India", "question": "Consider the following statements regarding temperature variation in deserts: I. Deserts experience extreme temperature variation between day and night due to low humidity and sparse vegetation. II. In the Thar Desert, daytime temperature can reach around 50°C, while nights may drop to nearly 15°C. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "c", "explanation": "Both I and II. Desert like the ‘Thar Desert’ experience extreme temperature variations due to low moisture, sparse vegetation, and clear skies. Daytime temperatures can reach up to 50°C, while nights drop to around 15°C, creating a difference of about 35°C in 24 hours.", "source": null}, {"id": 564, "topic": "Physiographic Division of India", "question": "Which physical feature of IndiaF prevents the cold winds from central Asia from entering the Indian subcontinent?", "options": {"a": "Indian plains", "b": "Indian desert", "c": "Coastal area", "d": "Himalayas"}, "answer": "d", "explanation": "Himalaya: It acts as a natural barrier, blocking cold winds from Central Asia and protecting the climate of India. This mountain range effectively protects the subcontinent, and maintains its relatively warm temperatures. Coastal area: Allows winds from the sea to enter India.", "source": null}, {"id": 565, "topic": "Physiographic Division of India", "question": "In which of the following districts of Rajasthan are the ‘Barchans’ found?", "options": {"a": "Udaipur", "b": "Jaisalmer", "c": "Bhilwara", "d": "Alwar"}, "answer": "b", "explanation": "Jaisalmer. Barchan, crescent -shaped sand dune produced by the action of wind predominately from one direction. The Indian desert lies west of the Aravali Hills, with sandy plains and sand dunes. It receives very low rainfall (below 150 mm annually) and has an arid climate with sparse vegetation.", "source": null}, {"id": 566, "topic": "Physiographic Division of India", "question": "Purvanchal Himalayas does NOT comprise of:", "options": {"a": "Naga hills", "b": "Pir Panjal range", "c": "Manipur hills", "d": "Mizo hills"}, "answer": "b", "explanation": "Pir Panjal Range in the Himalayas is a part of the Lesser Himalayas. The Pir Panjal Range starts near PatniTop in Jammu and Kashmir and runs through Himachal Pradesh to Garhwal. The Purvanchal Himalayas, also known as the Eastern Hills, are a mountain range in northeastern India. This range includes the Patkai Hills, the Naga Hills in Nagaland, the Manipur Hills in Manipur, and the Mizo Hills in Mizoram.", "source": null}, {"id": 567, "topic": "Physiographic Division of India", "question": "Which of the following hills is located in the Eastern Ghats?", "options": {"a": "Naga hills", "b": "Khasi hills", "c": "Shevaroy hills", "d": "Anamudi hills"}, "answer": "c", "explanation": "Shevaroy hills. The Eastern Ghats are a series of discontinuous low hills with an average elevation of 600 meters. They extend paralelel to the east coast, from the southern part of the Mahanadi valleym to the Nilgiri hills. The highest peak in this region is Jindhagada Peak (1,690 meters). Notable hills in the Eastern Gheats include: Mahendragiri and Niyamgiri hills in Odisha, Nallamala hills (Andhera Pradesh), and Kollimalai and Pachaimalai hills in Tamil Nadu.", "source": null}, {"id": 568, "topic": "Physiographic Division of India", "question": "Consider the following statements regarding Mawsynram: I. Mawsynram, the wettest place on Earth, is located in the Jaintia Hills of Meghalaya. II. Cherrapunji receives more rainfall annually than Mawsynram. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "d", "explanation": "Neither I nor II. In the southern ranges of Khasi hills is Mawsynram, which receives the highest rainfall in the world. Mawsynram, located about 16 kilometers west of Cherrapunji, is recognized as the wettest place on Earth, receiving a higher annual average rainfall than Cherrapunji.", "source": null}, {"id": 569, "topic": "Physiographic Division of India", "question": "What is the name of the highest peak of the Eastern Ghats?", "options": {"a": "Kangchenjunga", "b": "Mahendragiri", "c": "Khasi", "d": "Anamudi"}, "answer": "b", "explanation": "Mahendragir. This hill was once believed to be the highest peak in the Eastern Ghats. However, in April 2011, a team led by Mr. Venkat Reddy Y found that the elevation of Mahendra Giri Hill is actually 1,501 meters. Jindhagada Peak: After this discovery, it was determined that the highest peak in the Eastern Ghats is Jindhagada Peak, which stands at 1,690 meters. It is located in the Araku Valley in Andhra Pradesh.", "source": null}, {"id": 570, "topic": "Physiographic Division of India", "question": "Which sub-division of Himalayas are famous for Karewa formations ?", "options": {"a": "Sikkim Himalayas", "b": "Arunachal Himalayas", "c": "Uttarakhand Himalayas", "d": "Kashmir Himalayas"}, "answer": "d", "explanation": "Kashmir Himalayas. Karewa - thick deposits of glacial clay and moraines.i These are the flat topped moundis that border the Kashmir Valley a on all sides. The other Himalayan sub - divisions are: Uttarakhand Himalayas: Between the Ravi and Kali rivers. Arunachal Himalayas: Between the Tista and Brahmaputra rivers. Sikkim Himalayas: Between the Kali and Teesta rivers.", "source": null}, {"id": 571, "topic": "Physiographic Division of India", "question": "The Lushai Hills are also known as _________.", "options": {"a": "Khasi Hills", "b": "Mizo Hills", "c": "Naga Hills", "d": "Patkai Hills"}, "answer": "b", "explanation": "Mizo Hills (Mizoram and Manipur). The highest point of Mizo hills is the Blue Mountain. Eastern Hills (The Purvanchal) are the southward extension of Himalayas running along the north- eastern edge of India.", "source": null}, {"id": 572, "topic": "Physiographic Division of India", "question": "The central stretch of the Western Coastal Plains of India is known as the:", "options": {"a": "Coromandel coast", "b": "Konkan coast", "c": "Malabar coast", "d": "Kannad plains"}, "answer": "d", "explanation": "Kannad plains (Between Goa and Mangalore). Malabar coast - Extends from the southern part of Goa to Kanyakumari.", "source": null}, {"id": 573, "topic": "Physiographic Division of India", "question": "The Himalayas' outermost range is called __________.", "options": {"a": "Shiwaliks", "b": "Kanchenjunga", "c": "Dhaula Dhar", "d": "Pir Panjal"}, "answer": "a", "explanation": "Shiwaliks. They extend over a width of 10-50 Km and have an altitude varying between 900 and 1100 metres. They have low hills like Jammu Hills, etc. Pir Panjal and Dhauladhar are important ranges of lesser Himalayas.", "source": null}, {"id": 574, "topic": "Physiographic Division of India", "question": "In which direction is the general elevation of the peninsular plateau of India?", "options": {"a": "From North to South", "b": "From South to North", "c": "From West to East", "d": "From East to West"}, "answer": "c", "explanation": "From West to East. The Peninsular Plateau of India lies south of the Northern Plains, with an average elevation of 600-900 m. It consists of smaller plateaus and hill ranges with river basins and valleys. The plateau divided into three groups: Central Highlands (e.g., Malwa, Bundelkhand), Deccan Plateau (e.g., Maharashtra, Karnataka), and Northwestern Plateau (e.g., Aravalli, Vindhya, Satpura ranges).", "source": null}, {"id": 575, "topic": "Physiographic Division of India", "question": "Which of the following hills located in the Eastern most part of India?", "options": {"a": "Jaintia Hills", "b": "Khasi Hills", "c": "Garo Hills", "d": "Patkai Bum Hills"}, "answer": "d", "explanation": "Patkai Bum Hills. Patkai Hills (Arunachal Pradesh, Nagaland and Upper Burma region of Myanmar). Western Ghats {Anamudi (highest peak), Mannamala, Meesapulimala, Doddabetta peak, Kolaribetta Peak, etc). The Mizo Hills, located in the southeastern Mizoram state, were formerly called Lushai Hills.", "source": null}, {"id": 576, "topic": "Physiographic Division of India", "question": "Consider the following statements regarding the Eastern Ghats: I. The average elevation of the Eastern Ghats is about 600 metres. II. The Eastern Ghats are a continuous mountain range extending from Odisha to Tamil Nadu. Which of the above statements is/are correct?", "options": {"a": "Only I", "b": "Only II", "c": "Both I and II", "d": "Neither I nor II"}, "answer": "a", "explanation": "Only I. Eastern Ghats comprises the discontinuous and low hills that are highly eroded by the rivers such as the Mahanadi, the Godavari, the Krishna, the Cauvery, etc. The Eastern Ghats are a mesmerising mountain range that extends across the states of Odisha, Andhra Pradesh, Telangana, Karnataka, and Tamil Nadu.", "source": null}, {"id": 577, "topic": "Physiographic Division of India", "question": "Choose the correct statements about the islands of India. a. Lakshadweep Islands are composed of coral islands. b. Andaman and Nicobar islands are composed of coral islands. c. It is believed that Lakshadweep islands are an elevated portion of submarine mountains. d. It is believed that Andaman and Nicobar islands are an elevated portion of submarine mountains.", "options": {"a": "b and c", "b": "a and b", "c": "a and d", "d": "c and d"}, "answer": "c", "explanation": "a and d.", "source": null}, {"id": 578, "topic": "Physiographic Division of India", "question": "What is the name of the physical feature that is the longitudinal valley lying between the Lesser Himalayas and the Siwalik in India?", "options": {"a": "Duns", "b": "Doab", "c": "Bhabhar", "d": "Terai"}, "answer": "a", "explanation": "Duns are structurally formed is valleys covered with boulders and gravel from the erosion of the Himalayas and Shivalik uplands. Major duns in the region include Dehra, Kohtri, Chaukham, Patli, and Kota, with Dehradun being the largest at 35 km long and 25 km wide. is", "source": null}, {"id": 579, "topic": "Physiographic Division of India", "question": "The Himalayas have uplifted from which of the following geosynclines?", "options": {"a": "Tethys geosynclines", "b": "Appalachians geosynclines", "c": "Caledonian geosynclines", "d": "Aravalli geosynclines"}, "answer": "a", "explanation": "Tethys geosynclines. The northward drift of the Indian Plate resulted in the collision of the plate with the much larger Eurasian Plate. Due to this collision, the sedimentary rocks which were accumulaeted in the geosyncline known as the Tethys were folded to form tmhe mountain system of western Asia and Himalaya.", "source": null}, {"id": 580, "topic": "Physiographic Division of India", "question": "What is the name of the northern part of the western coastal plain between Mumbai and Goa?", "options": {"a": "Coromandel coast", "b": "Malabar coast", "c": "Kannad plain", "d": "Konkan coast F"}, "answer": "d", "explanation": "Konkan coast. The central stretch of Arabian Sea is called the Kannad Plain, while the southern stretch is known as the Malabar coast. In the Bay of Bengal, the northern part is called the Northern Circar, and the southern part is the Coromandel Coast.", "source": null}, {"id": 581, "topic": "Physiographic Division of India", "question": "Which of the following physiographic divisions of India has extensive alluvial soil ?", "options": {"a": "The North Indian Plain", "b": "The Island Group", "c": "The Himalayan Range", "d": "The Great Indian Desert"}, "answer": "a", "explanation": "The North Indian Plain formed by alluvial deposits brought by rivers such as the Indus, Ganga, and Brahmaputra. These plains stretch about 3,200 km from east to west and are divided into three zones: Bhabar, Tarai, and Alluvial plains. Bhabar is a narrow belt near the Shiwalik foothills, while lies south of it. The alluvial plains include the Khadar (new alluvium) and Bhangar (old alluvium).", "source": null}, {"id": 582, "topic": "Physiographic Division of India", "question": "The Great Indian desert/Thar desert is located on the western margin of which of the following mountain ranges?", "options": {"a": "Vindhya range", "b": "Aravalli range", "c": "Eastern ghats", "d": "Satpura range"}, "answer": "b", "explanation": "Aravalli range. It runs approximately 670 km (430 mi) in a south-west direction, starting near Delhi, passing through southern Haryana and Rajasthan, and ending in Gujarat. The highest peak is Guru Shikhar at 1,722 metres (5,650 ft). Vindhya range forms a dividing line between the Ganges Plain and the Deccan Plateau. Satpura range is situated between two west flowing rivers - Narmada and Tapi.", "source": null}, {"id": 583, "topic": "Physiographic Division of India", "question": "Choose the correct statements about the Western Ghats. a. The height of the Western Ghats progressively increases from north to south. b. Mahendragiri is the highest peak in the Western Ghats. c. The Western Ghats are higher than the Eastern Ghats. d. The height of the Western Ghats progressively decreases from north to south.", "options": {"a": "b, c and d", "b": "a and b", "c": "a and c", "d": "Only c and d"}, "answer": "c", "explanation": "a and c. The highest peak in the Western Ghats is Anamudi (2,695 metres).", "source": null}, {"id": 584, "topic": "Physiographic Division of India", "question": "Which triangular plateau region of India lies south of the river Narmada?", "options": {"a": "Deccan plateau", "b": "Marwar plateau", "c": "Baghelkhand plateau", "d": "Malwa plateau"}, "answer": "a", "explanation": "Deccan plateau. Its broad base is flanked by the Satpura Range to the north, while the Mahadev, Kaimur Hills, and Maikal Range extend to the east. The Deccan Plateau is higher in the west and slopes gently eastwards.", "source": null}, {"id": 585, "topic": "Physiographic Division of India", "question": "Geologically, which of the following physiographic divisions of India is supposed to be one of the most stable is land blocks?", "options": {"a": "The Northern Plains", "b": "The Himalayas", "c": "The Peninsular Plateau", "d": "The Indian Desert"}, "answer": "c", "explanation": "The Peninsular plateau is a tableland composed of the old crystalline, igneous and metamorphic rocks. This plateau consists of two broad divisions, namely, the Central Highlands and the Deccan Plateau. The part of the Peninsular plateau lying to the north of the Narmada river. The Indian desert lies towards the western margins of the Aravali Hills. It is an undulating sandy plain covered with sand dunes. The northern plain is formed of alluvial soil. The Himalayas, geologically young and structurally fold mountains stretch over the northern borders of India.", "source": null}, {"id": 586, "topic": "Physiographic Division of India", "question": "With reference to the physical features of India, the ‘Kayals’ are ______.", "options": {"a": "Hillocks", "b": "backwaters", "c": "mountain passes", "d": "valleys"}, "answer": "b", "explanation": "Backwaters: The inland water bodies, often formed by the merging of rivers and lakes or by the backflow of seawater, creating a network of interconnected waterways. In Kerala, these backwaters are locally known as kayals.", "source": null}, {"id": 587, "topic": "Physiographic Division of India", "question": "Which of the following physical divisions of India is densely populated?", "options": {"a": "The North Indian Plains", "b": "The islands", "c": "The Himalayan Range", "d": "The Thar Desert"}, "answer": "a", "explanation": "The North Indian Plains has been formed by the interplay of the three major river systems, namely the Indus, the Ganga and the Brahmaputra along with their tributaries, which makes its soil highly fertile. Alluvial soil is the major soil found in the plains. The swampy belt of the plains is known as terai.", "source": null}, {"id": 588, "topic": "Physiographic Division of India", "question": "India accounts for what percent of the total geographical area of the world ?", "options": {"a": "3.2%", "b": "5.2%", "c": "4.8%", "d": "2.4%"}, "answer": "d", "explanation": "2.4%. The land mass of India has an area of 3.28 million square km. India is the seventh largest country in the world. Largest countries in the world: Russia, Canada, China, United States, Brazil, Australia, etc.", "source": null}, {"id": 589, "topic": "Physiographic Division of India", "question": "The Standard Meridian of India (82°30’E) passes through _______ state of India.", "options": {"a": "Karnataka", "b": "Madhya Pradesh", "c": "West Bengal", "d": "Punjab"}, "answer": "b", "explanation": "Madhya Pradesh. The Standard Meridian - A longitude that determines a standard time for the whole country.", "source": null}, {"id": 590, "topic": "Physiographic Division of India", "question": "Assertion (A): Rajasthan is the biggest state of India in terms of area. Reason (R): Rajasthan has the maximum population among all Indian states.", "options": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true but R is false.", "d": "A is false but R is true."}, "answer": "c", "explanation": "A is true but R is false. Uttar Pradesh has the maximum population, not Rajasthan. Indian states biggest in terms of area: Rajasthan, Madhya Pradesh, Maharashtra, Uttar Pradesh, Gujarat. Smallest state (in terms of area) - Goa. Smallest Union Territories (in terms of area) - Lakshadweep, Daman and Diu, Chandigarh, Puducherry, Dadra and Nagar Haveli, Delhi.", "source": null}, {"id": 591, "topic": "Physiographic Division of India", "question": "India's total length of coastline of the mainland including Andaman and Nicobar and Lakshadweep is ________", "options": {"a": "7416.6 km", "b": "7616 km", "c": "7516.6 km", "d": "7716 km"}, "answer": "c", "explanation": "7516.6 km. Length of Coastline of the Indian mainland - 6100 km. The Coast of the Indian ma inland is surrounded by Arabian Sea in the west, Bay of Bengal in the easte, and Indian Ocean in the south. India's coastline extends to Nmine states (Gujarat, Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu, Andhra Pradesh, Odisha, and West Bengael). Largest coastline - Gujarat (1214 km).", "source": null}, {"id": 592, "topic": "Physiographic Division of India", "question": "The plains from Ambala to the Srunderban stretch over nearly 1800 km, but the fall in its slope is hardly ________ metres.", "options": {"a": "550", "b": "300", "c": "600", "d": "450"}, "answer": "b", "explanation": "300. In other words, there is a fall of just one meter
