"Fifth Schedule"],"a":0,"e":"Eighth Schedule. Article 344(1) provides for the constitution of a Commission by the President on expiration of five years. Article 351 - It provides for the spread of the Hindi language to develop it. The Eighth Schedule recognizes 22 official languages. Schedule and subject: Third Schedule - Oaths or affirmations."},{"t":"Articles, Schedules & Parts","n":103,"tag":"","q":"Consider the following statements regarding the Finance Commission of India:\n1. The Finance Commission is mentioned in Article 280 of the Indian Constitution.\n2. It is a constitutional body constituted by the President of India every six years.\n3. Article 292 of the Constitution deals with the borrowing powers of the Government of India. Which of the above statement(s) is/are correct?","o":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 3 only. The Finance Commission is a constitutional body, it is constituted by the President of India every five years. The Commission consists of five members, including a chairperson. Article 292: Borrowing by the Government of India. Article 375: Courts, authorities and officers continue to function subject to the provisions of the Constitution. Article 370: Temporary provisions with respect to the State of Jammu and Kashmir."},{"t":"Articles, Schedules & Parts","n":104,"tag":"","q":"As per Article ____________ of the Indian Constitution, the Council of Ministers are collectively responsible to the Lok Sabha.","o":["74(1)","72(1)","73(2)","75(3)"],"a":3,"e":"75(3). Article 75 (1) - The Prime Minister shall be appointed by the President and the other Ministers shall be appointed by the President on the advice of the Prime Minister. Article 75(2) - The Ministers shall hold office during the pleasure of the President."},{"t":"Articles, Schedules & Parts","n":105,"tag":"","q":"Biological Diversity Act 2002 was passed by the Government of India. It fulfilled ideals of which article of Directive Principles of State Policy in the Constitution of India ?","o":["Article 49","Article 48A","Article 48","Article 47"],"a":1,"e":"Article 48A outlines the directive principle for environmental protection and safeguarding forests and wildlife. It was added through the 42nd Constitutional Amendment, 1976. The Biological Diversity Act, 2002, was enacted to fulfill India's obligations under the Convention on Biological Diversity. It established the National Biodiversity Authority (NBA), State Biodiversity Boards (SBB), and local Biodiversity Management Committees (BMC) to regulate access to biological resources and ensure equitable benefit-sharing."},{"t":"Articles, Schedules & Parts","n":106,"tag":"","q":"Consider the following statements regarding provisions related to the State Legislature in the Indian Constitution:\n1. Article 175 provides the Governor the right to address and send messages to the House (or Houses) of the State Legislature.\n2. Article 176 deals with the Governor’s special address to the Legislative Assembly.\n3. Article 171 mentions the composition of the Legislative Councils. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 . Other Articles: Article 172 - Duration of State Legislatures. Article 173 - Qualification for membership of the State Legislature. Article 174 - Sessions of the State Legislature, prorogation and dissolution."},{"t":"Articles, Schedules & Parts","n":107,"tag":"","q":"Consider the following statements regarding the ‘Magna Carta of India’:\n1. Part III of the Indian Constitution, which contains the Fundamental Rights, is often called the ‘Magna Carta of India’.\n2. Fundamental Rights are mentioned in Articles 12 to 35 of the Constitution. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Fundamental Rights (Article 12 to 35). ‘Magna Carta’ is the Charter of Rights issued by King John of England in 1215 under pressure from the barons."},{"t":"Articles, Schedules & Parts","n":108,"tag":"","q":"Which Article of the Indian Constitution mentions about the salaries and allowances of the Chairman and Deputy Chairman of the Rajya Sabha and the Speaker and Deputy Speaker of the Lok Sabha?","o":["Article 92","Article 97","Article 94","Article 95"],"a":1,"e":"Article 97. Other important Articles: Article 92 - The Chairman or the Deputy Chairman not to preside while a resolution for his removal from office is under consideration. Article 94 - Vacation and resignation of, and removal from, the offices of Speaker and Deputy Speaker. Article 95 - Power of the Deputy Speaker or other person to perform the duties of the office of, or to act as, Speaker."},{"t":"Articles, Schedules & Parts","n":109,"tag":"","q":"Which of the following Articles of the Indian Constitution mentions that the Vice - President of India shall be the ex officio Chairman of the Council of States?","o":["Article 89","Article 90","Article 91","Article 92"],"a":0,"e":"Article 89. Article 64 and Article 89(1) state that the Vice President of India shall serve as the ex officio Chairman of the Council of States (Rajya Sabha). Other related articles include: Article 90 - Specifies the conditions for the vacation, resignation, and removal of the Deputy Chairman of the Council of States. Article 91- Grants the Deputy Chairman or another designated person the power to perform the duties of the Chairman in their absence."},{"t":"Articles, Schedules & Parts","n":110,"tag":"","q":"Consider the following statements regarding provisions of the Indian Constitution:\n1. Article 177 provides the Advocate-General of a state the right to speak and take part in the proceedings of the State Legislature, though without a right to vote.\n2. Article 183 deals with the resignation, vacation, and removal of the Chairman and Deputy Chairman of the Legislative Council. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2."},{"t":"Articles, Schedules & Parts","n":111,"tag":"","q":"Which Article of the Indian Constitution mentions that ‘The Council of Ministers shall be collectively responsible to the Legislative Assembly of the state’ ?","o":["Article 164(3)","Article 164(1)","Article 164(2)","Article 164(4)"],"a":2,"e":"Article 164(2). Article 164(1) - The Chief Minister is appointed by the Governor, while other Ministers are appointed on the Chief Minister's advice, and they hold office at the Governor's pleasure. Article 164(3) - Before assuming office, a Minister must take the oaths of office and secrecy administered by the Governor, as specified in the Third Schedule. Article 164(4) - A Minister who is not a member of the State Legislature for six consecutive months will cease to hold office at the end of that period."},{"t":"Articles, Schedules & Parts","n":112,"tag":"","q":"Consider the following statements regarding amendment of the Indian Constitution: i. Article 368 in Part XX of the Constitution specifies the procedure for amending the Constitution. ii. In the Kesavananda Bharati case (1973), the Supreme Court ruled that Parliament cannot amend those provisions which form the ‘basic structure’ of the Constitution. Which of the above statements is/are correct ?","o":["i only","ii only","Both i and ii","Neither i nor ii"],"a":2,"e":"Both i and ii."},{"t":"Articles, Schedules & Parts","n":113,"tag":"","q":"Which Article of the Indian Constitution mentions about the salaries and allowances of members of the Legislative Assembly and the Legislative Council of a state?","o":["Article 195","Article 199","Article 198","Article 194"],"a":0,"e":"Article 195. Important Articles in Part VI (The States): Article 168 - Constitution of Legislatures in States. Article 169 - Abolition or creation of Legislative Councils in States. Article 170 - Composition of the Legislative Assemblies. Article 194 - Powers, privileges, etc., of the Houses of Legislatures and of the members and committees thereof. Article 199 - Definition of “Money Bills”."},{"t":"Articles, Schedules & Parts","n":114,"tag":"","q":"Which Article of the Indian Constitution mentions that a person may be appointed as the Governor of two or more states?","o":["Article 153","Article 152","Article 151","Article 150"],"a":0,"e":"Article 153. The Seventh Amendment Act, 1956, amended Article 153 to allow a governor to oversee two or more states. Other important articles : Article 150 - Form of Accounts of The Union and of The States. Article 151 - The audit reports of the Union and State by the Comptroller and Auditor General of India. Article 152 - States about the Definition of state."},{"t":"Articles, Schedules & Parts","n":115,"tag":"","q":"Which Article of the Indian Constitution states that “There shall be a High Court for each state” ?","o":["Article 275","Article 245","Article 214","Article 125"],"a":2,"e":"Article 214. Other important Articles: Article 215 - Every High Court shall be a court of record and shall have all the powers of such a court including the power to punish for contempt of itself. Article 217 - Appointment and conditions of the office of a Judge of a High Court. Article 245 - Parliament may make laws for the whole or any part of the territory of India. Article 275 - provides for the grants from the Union to certain States."},{"t":"Articles, Schedules & Parts","n":116,"tag":"","q":"Which Article of the Indian Constitution mentions that ‘All the executive action of the Government of a state shall be expressed to be taken in the name of the Governor’ ?","o":["Article 163(1)","Article 165(1)","Article 166(1)","Article 164(1)"],"a":2,"e":"Article 166(1). Other important Articles: Article 163(1) - There shall be a Council of Ministers with the Chief Minister at the head to aid and advise the Governor in the exercise of his functions. Article 164(1) - The Chief Minister shall be appointed by the Governor and the other Ministers shall be appointed by the Governor on the advice of the Chief Minister. Article 165(1) - The Governor of each State shall appoint a person who is qualified to be appointed a Judge of a High Court to be Advocate-General for the State."},{"t":"Articles, Schedules & Parts","n":117,"tag":"","q":"Consider the following statements regarding provisions of the Indian Constitution:\n1. Article 173 mentions the qualifications for membership of the State Legislature.\n2. A person must be at least 25 years old for the Legislative Assembly and 30 years old for the Legislative Council. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The person must be at least 25 years old for a seat in the Legislative Assembly and at least 30 years old for a seat in the Legislative Council. Other important Articles : Article 171 - The total number of members in the Legislative Council of a State shall not exceed one-third of the total number of members in the Legislative Assembly of that State. Article 179 - Vacation and resignation of, and removal from, the offices of Speaker and Deputy Speaker. Article 180 - Power of the Deputy Speaker to perform the duties of Speaker."},{"t":"Articles, Schedules & Parts","n":118,"tag":"","q":"What Article of the Indian Constitution provides that the State Governor has the authority to reserve a bill for the consideration of the President.","o":["Article 181","Article 200","Article 190","Article 267"],"a":1,"e":"Article 200. The Governor may also return the Bill with a message requesting reconsideration by the House or Houses. Article 201 - It states that when a Bill is reserved for the consideration of the President, the President may assent to or withhold assent from the Bill. Article 190 - A person cannot be a member of both houses of a state legislature. Article 181 - The Speaker or the Deputy Speaker not to preside while a resolution for his removal from office is under consideration. Article 267 - Contingency Fund."},{"t":"Articles, Schedules & Parts","n":119,"tag":"","q":"Consider the following statements regarding provisions of the Indian Constitution:\n1. Article 112 provides for the annual financial statement of the Government of India, to be laid before each House of Parliament every year.\n2. Article 120 defines “Money Bills” while Article 116 deals with the annual financial statement. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Article 112 - The President shall cause, in respect of each financial year, to be laid before each House of Parliament a statement of the estimated receipts and expenditure of the Government of India for that year, which is in this Part referred to as \"the annual financial Statement\". Other important Articles: Article 110 - Definition of \"Money Bills\". Article 116 - Votes on account, votes of credit and exceptional grants. Article 120 - Language to be used in Parliament."},{"t":"Articles, Schedules & Parts","n":120,"tag":"","q":"________ of the Indian Constitution sets qualifications for being a member of Lok Sabha.","o":["Article 74","Article 84","Article 64","Article 76"],"a":1,"e":"Article 84 outlines the qualifications for being a member of the Lok Sabha. A person must: Be an Indian citizen; Take an oath or affirmation before an authorized person appointed by the Election Commission; Be at least 25 years old; Meet any other qualifications set by the Parliament of India. Article 74 : Council of Ministers to aid and advise the President. Article 64 : The Vice-President to be ex-officio Chairman of the Council of States (Rajya Sabha). Article 76 : It is to the appointment and responsibilities of the Attorney-General for India."},{"t":"Articles, Schedules & Parts","n":121,"tag":"","q":"Which of the following Articles of the Indian Constitution are related to the Comptroller and Auditor General of India?","o":["Article 147-150","Article 148-154","Article 148-152","Article 148-151"],"a":3,"e":"Article 148-151. The CAG handles the audit of the accounts of the Union and State governments. Article 148: Establishes the office of the Comptroller and Auditor General of India. Article 149: Duties and powers of the Comptroller and Auditor-General. Article 150: Form of accounts of the Union and of the States. Article 151: Mandates the presentation of audit reports by the Comptroller and Auditor General to the President of India, which are then laid before Parliament."},{"t":"Articles, Schedules & Parts","n":122,"tag":"","q":"Consider the following statements regarding Directive Principles of State Policy (DPSP):\n1. Article 37 makes it clear that the Directive Principles are fundamental in the governance of the country and it shall be the duty of the State to apply them in making laws.\n2. Directive Principles of State Policy in Part IV of the Constitution were directly borrowed from the U.S. Constitution. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Directive Principles of State Policy (DPSP) in Part IV of the Indian Constitution are based on the Irish Constitution, which in turn was based on the Spanish Constitution."},{"t":"Articles, Schedules & Parts","n":123,"tag":"","q":"Consider the following statements regarding the Concurrent List in the Indian Constitution:\n1. Medical education, protection of wildlife, and population control are included in the Concurrent List.\n2. Artificial habitats are also included in the Concurrent List. Which of the above statements is/are incorrect?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The Parliament and state legislatures can both make laws on matters listed under the Concurrent List. As of now, the list includes 52 subjects (originally 47). Some Subjects in Concurrent list: Bankruptcy and insolvency, Forests, Factories, Boilers, Electricity, Newspapers, books and printing presses."},{"t":"Articles, Schedules & Parts","n":124,"tag":"","q":"In respect of Arunachal Pradesh, the Governor has special responsibility under ________ of the Constitution of India with respect to law and order and in discharge of his functions in relation thereto.","o":["Article 359 A","Article 380 A","Article 371 H","Article 361 H"],"a":2,"e":"Article 371 H. Under Article 359, during a national emergency, the President can suspend the right to move courts for Fundamental Rights enforcement, except for Articles 20 and 21. Article 380, which once addressed the President of India, was omitted by the Constitution (Forty-second Amendment) Act of 1976. Article 361 provides protection to the President, Governors, and Rajpramukhs from being held accountable in courts for actions taken while performing their duties."},{"t":"Articles, Schedules & Parts","n":125,"tag":"","q":"Consider the following statements regarding the Schedules of the Indian Constitution: i. The Third Schedule contains the forms of oaths and affirmations for constitutional offices, including Judges of the Supreme Court. ii. The Second Schedule contains provisions regarding the emoluments, allowances, and privileges of certain constitutional authorities. Which of the above statements is/are correct?","o":["i only","ii only","Both i and ii","Neither i nor ii"],"a":2,"e":"Both i and ii. The Third Schedule of the Indian Constitution outlines the forms of oaths and affirmations for various constitutional offices : President, Vice-President, Union and State Ministers, Parliament and state legislature candidates, Judges, Comptroller and Auditor General. First Schedule : Names of the States and Union Territories, Second Schedule : Provisions for the emoluments, allowances, privileges of certain constitutional authorities, and Fourth Schedule : Allocation of seats in the Rajya Sabha and union territories."},{"t":"Articles, Schedules & Parts","n":126,"tag":"","q":"Which Article of the Indian Constitution mentions that ‘In the performance of his/her duties, the Attorney - General for India shall have the right of audience in all the courts in the territory of India’ ?","o":["Article 76(1)","Article 76(3)","Article 76(4)","Article 76(2)"],"a":1,"e":"Article 76(3). Article 76 of the Indian Constitution addresses the Attorney General of India. Under Article 76(1), the President of India appoints the Attorney General. Article 76(2) states that it is the duty of the Attorney General to provide legal advice to the Government of India and perform other legal duties. Article 76(4) specifies that the Attorney General holds office at the pleasure of the President and receives remuneration as determined by the President."},{"t":"Articles, Schedules & Parts","n":127,"tag":"","q":"Match the following subject matters with their concerned Articles. a b\n1. Superintendence, direction and control of elections to (A) Article 329 be Vested in an Election commission.\n2. Power of parliament to make provision with respect (B) Article 324 to election to legislature.\n3. Bar of interference by courts in electoral matters (C) Article 327","o":["1 - C, 2 - B, 3 - A","1 - A, 2 - C, 3 - B","1 - A, 2 - B, 3 - C","1 - B, 2 - C, 3 - A"],"a":3,"e":"1-B, 2-C, 3-A. Article 325 - No person to be ineligible for inclusion in, or to claim to be included in a special, electoral roll on grounds of religion, race, caste or sex. Article 328 - Power of Legislature of a State to make provision with respect to elections to such Legislature."},{"t":"Articles, Schedules & Parts","n":128,"tag":"","q":"Which Article of the Constitution of India mentions that “there shall be a Public Service Commission for the Union and a Public Service Commission for each State” ?","o":["315 (4)","315 (1)","315 (3)","315 (2)"],"a":1,"e":"Article 315 (1). Article 315 (2) - Two or more States may agree that there shall be one Public Service Commission for that group of States. Article 315 (3) - Any such law as aforesaid may contain such incidental and consequential provisions as may be necessary or desirable for giving effect to the purposes of the law. Article 315 (4) - UPSC can, if requested by a state government, conduct examinations and interviews to select candidates for state government jobs."},{"t":"Articles, Schedules & Parts","n":129,"tag":"","q":"Which of the following Articles of the Constitution of India provides that the Governor appoints the Chief Minister and later, the Chief Minister recommends the appointment of ministers to the Governor?","o":["Article 163","Article 165","Article 164","Article 167"],"a":2,"e":"Article 164. Other Appointments by Governor: State Election Commissioner (Article 243 K), Vice-Chancellors of the universities in the state (University Grants Commission (UGC) Regulations, 2018), Advocate General for the State (Article 165) etc. Article 163 - Council of Ministers to aid and advise the Governor of the State."},{"t":"Articles, Schedules & Parts","n":130,"tag":"","q":"Which of the following Articles of the Indian Constitution empowers the Parliament to restrict or abrogate the fundamental rights of the members of the armed forces, paramilitary forces, police forces, intelligence agencies and analogous forces ?","o":["Article 33","Article 31","Article 37","Article 35"],"a":0,"e":"Article 33. Fundamental rights are included in Part III (Article 12-35) of the Constitution. It is described as the Magna Carta of India. Article 35 - Power to make laws to give effect to certain specified fundamental rights shall vest only in the Parliament and not in the state legislatures."},{"t":"Articles, Schedules & Parts","n":131,"tag":"","q":"As per Article 361 of the Constitution of India, who among the following shall NOT be answerable to any court for the exercise and performance of the powers and duties of his/her office?","o":["Secretary","Chief Minister","Prime Minister","Governor"],"a":3,"e":"Governor. Article 361 - The President, or the Governor or Rajpramukh of a State, shall not be answerable to any court for the exercise and performance of the powers and duties of his office or for any act done or purporting to be done by him in the exercise and performance."},{"t":"Articles, Schedules & Parts","n":132,"tag":"","q":"Consider the following statements regarding provisions of the Indian Constitution: A. The Tenth Schedule contains provisions for disqualification of legislators on the ground of defection, introduced by the 52nd Constitutional Amendment Act, 1985. B. The Ninth Schedule, added by the First Constitutional Amendment Act, 1951, contains laws that are immune from judicial review. Which of the above statements is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B."},{"t":"Articles, Schedules & Parts","n":133,"tag":"","q":"Which Article of the Indian Constitution mentions that all the authorities— civil and judicial— in the territory of India shall act in aid of the Supreme Court ?","o":["Article 143","Article 141","Article 144","Article 142"],"a":2,"e":"Article 144. Article 142: Enforcement of decrees and orders of the Supreme Court and orders as to discovery, etc. Article 141: The law declared by the Supreme Court shall be binding on all courts within the territory of India."},{"t":"Articles, Schedules & Parts","n":134,"tag":"","q":"Article 149 of the Constitution deals with ___________ .","o":["the qualifications required for the appointment of the Comptroller and Auditor-General of India","the duties and powers of the Comptroller and Auditor-General of India","the term of office of the Comptroller and Auditor-General of India","the appointment of the Comptroller and Auditor-General of India"],"a":1,"e":"Part V (Chapter V) of the Indian Constitution (Articles 148-151) deals with the Comptroller and Auditor-General (CAG). Article 148: This article deals with the appointment, oath, tenure and removal of CAG of India. There are no specific qualifications required to become the CAG of India. The President of India appoints the CAG through a warrant under their hand and seal. The CAG serves a term of 6 years or until the age of 65, whichever comes first."},{"t":"Articles, Schedules & Parts","n":135,"tag":"","q":"Which of the following statements is correct about Article 129 of the Constitution of India ?","o":["It provides for the Supreme Court to give advisory opinions to the President.","It provides for the Supreme Court to be a court of original jurisdiction","It provides for the Supreme Court to be a court of record.","It provides for the Supreme Court to be the highest court of appeal."],"a":2,"e":"Article 143 - Power of the President to consult the Supreme Court. Article 132 - Appellate jurisdiction of the Supreme Court in appeals from High Courts in certain cases. Articles 133 and 134 grant the Supreme Court appellate jurisdiction in civil and criminal matters from High Courts."},{"t":"Articles, Schedules & Parts","n":136,"tag":"","q":"Consider the following statements regarding the Schedules of the Indian Constitution : A. The Constitution of India contains 12 Schedules in total. B. The Eleventh Schedule relates to the Panchayati Raj institutions, while the Twelfth Schedule relates to Municipalities. Which of the above statements is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. 12 Schedules in Indian Constitution: First - List of States and UT; Second - Emoluments, allowances, and privileges; Third - Oath and affirmation ; Fourth - Seat allocation of the Rajya Sabha; Fifth - Administration of Scheduled Areas and Scheduled Tribes; Sixth - Administration of Tribal Areas in the States of Assam, Meghalaya, Tripura and Mizoram; Seventh - Union list, State list and the concurrent list; Eight - List of recognized languages; Ninth - Land reforms and regulations; Tenth - Anti defection law; Eleventh - Panchayati Raj and Twelfth - Municipalities."},{"t":"Articles, Schedules & Parts","n":137,"tag":"","q":"Which Clause of Article 19 of the Indian Constitution guarantees the 'right to move freely throughout the territory of India' ?","o":["Clause","(b) Clause","(c) Clause","(d) Clause (a)"],"a":2,"e":"Clause (d). Article 19 - Protection of certain rights regarding freedom of speech, etc. Other clauses of Article 19(1): Clause (a) grants the freedom of speech and expression; Clause (b) grants the right to assemble peaceably and without arms; Clause (c) grants the right to form associations, unions, or co-operative societies; Clause (d) grants the right to move freely throughout the territory of India; Clause . (e) grants the right to reside and settle in any part of the territory of India; Clause (g) grants the right to practise any profession or to carry on any occupation, trade, or business."},{"t":"Articles, Schedules & Parts","n":138,"tag":"","q":"Which Articles of the Constitution of India deal with the Union and its territory ?","o":["Articles 5-11","Articles 1-4","Articles 12-35","Article 36-51"],"a":1,"e":"Articles 1-4. Article 1- Name and territory of the Union; Article 2 - Admission or Establishment of New States; Article 3 - Formation of New States and alteration of areas, Boundaries or Names of existing States; Article 4 : Laws made under articles 2 and 3 to provide for the amendment of the first and the fourth schedules and supplemental, incidental and consequential matters."},{"t":"Articles, Schedules & Parts","n":139,"tag":"","q":"In India which of the following is a Gandhian principle of Directive Principles of State Policy ?","o":["To Separate judiciary from executive","To organise village panchayat","To secure uniform civil code","To provide equal pay for equal work"],"a":1,"e":"To organise village panchayat. Article based on Gandhian principles: 40 - Organise village panchayats. 43 - Living wage, etc., for workers. 43B - To promote voluntary formation, autonomous functioning, democratic control of cooperative societies. 46 - promote educational and economic interests of the weaker sections. 47 - To improve public health. 48 - To prohibit the slaughter of cows, calves and other milch. Other Groups - Socialist Principle - Article (38, 39, 41, 42, 43, 43A, 47). Liberal - Intellectual Principle - Article (44, 45, 48, 48A, 49, 50, 51)."},{"t":"Articles, Schedules & Parts","n":140,"tag":"","q":"Which of the following Articles says that double jeopardy which says that “no person shall be prosecuted or punished for the same offence more than once?","o":["Article 21 (2)","Article 19 (1)","Article 20 (2)","Article 22 (2)"],"a":2,"e":"Article 20 (2). Article 21 - Protection of life and personal liberty. Article 19 (1) - The right to freedom of speech and expression. Article 22 - Protection Against Arrest and Detention in Certain Cases. Article 22(2) - A person who is arrested and detained must be produced before a magistrate within 24 hours."},{"t":"Articles, Schedules & Parts","n":141,"tag":"","q":"Under which Article of the Directive Principles of State Policy, a working woman on maternity leave, must receive all maternity benefits from the employer?","o":["Article 42","Article 44","Article 45","Article 43"],"a":0,"e":"Article 42. Directive Principles of State Policies are non-justiciable rights (which means that they cannot be enforced by a Court of Law). Article 43 - The State shall endeavour to secure all workers a living wage and a decent standard of life. Article 44 - Uniform civil code for the citizens ."},{"t":"Articles, Schedules & Parts","n":142,"tag":"","q":"'The state shall endeavour to secure to all workers a living wage and a decent standard of life'. Which of the following is correct about the given statement in the context of India?","o":["It is mentioned in the 43rd Article of the Constitution.","It is mentioned in the 44th Article of Constitution.","This is a Gandhian principle of Directive Principles of State Policy.","This is a liberal principle of Directive Principles of State Policy."],"a":0,"e":"Article 43 (Living wage, etc., for workers). Directives based on Liberal-Intellectual Principles: Article 44, Article 45, Article 48, Article 48A, Article 49, Article 50, Article 51."},{"t":"Articles, Schedules & Parts","n":143,"tag":"","q":"Consider the following statements regarding Co-operative Societies in the Indian Constitution: A. The provisions related to Co-operative Societies are given under Articles 243 ZH to 243 ZT. B. The 97th Constitutional Amendment Act, 2011 added Article 43-B to the Directive Principles of State Policy, promoting Co-operative Societies. Which of the above statements is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B."},{"t":"Articles, Schedules & Parts","n":144,"tag":"","q":"The government is bound to ensure observance of social welfare and labour laws enacted to secure for workmen a life compatible with human dignity, under ___________ of the Indian Constitution.","o":["Article 17","Article 15","Article 19","Article 21"],"a":3,"e":"Article 21. Article 15 - Prohibition of discrimination on grounds of religion, race, caste, sex or place of birth. Article 19: Protection of certain rights regarding freedom of Speech, etc. Article 17 - Abolition of Untouchability."},{"t":"Articles, Schedules & Parts","n":145,"tag":"","q":"Consider the following statements regarding the Right to move to the Supreme Court for enforcement of Fundamental Rights:\n1. Article 32 of the Indian Constitution provides the right to move the Supreme Court for the enforcement of Fundamental Rights.\n2. Article 30 of the Indian Constitution is also related to the Right to move the Supreme Court. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Article 32 (Right to Constitutional Remedies) - The ‘Heart and Soul of the Constitution’ by Dr. B.R. Ambedkar. Article 30 - Right of minorities to establish and administer educational institutions."},{"t":"Articles, Schedules & Parts","n":146,"tag":"","q":"Poshan Abhiyaan is a programme to achieve nutritional status of children from 0 to 6 years. Which of the following Articles of the Indian Constitution provides for raising the nutrition level?","o":["Article 47","Article 44","Article 46","Article 45"],"a":0,"e":"Article 47 - Duty of the State to raise the level of nutrition and the standard of living and to improve public health comes under Directive Principles of State Policy (Articles 36-51 under Part-IV)."},{"t":"Articles, Schedules & Parts","n":147,"tag":"","q":"Which of the following Articles of the Indian Constitution has the idea that 'No child below the age of fourteen years shall be employed to work in any factory or mine or engaged in any other hazardous employment?","o":["Article 22","Article 24","Article 19","Article 20"],"a":1,"e":"Article 24. Article 22 - Protection against arrest and detention in certain cases. Article 19 - Protection of certain rights regarding freedom of speech, etc."},{"t":"Articles, Schedules & Parts","n":148,"tag":"","q":"KA Najeeb Vs Union of India case deals with violation of rights under_____","o":["Article 16","Article 21","Article 14","Article 19"],"a":1,"e":"Article 21 (Protection of life and personal liberty). Important Cases related to Article 21: A.K Gopalan vs the State of Madras 1950 : The Supreme court has taken a narrow interpretation of Article 21 in this case. Maneka Gandhi vs. Union of India, 1978: In this case, the SC overruled its judgement of the Gopalan Case by taking a wider interpretation of Article 21."},{"t":"Articles, Schedules & Parts","n":149,"tag":"","q":"Consider the following statements regarding the Constitution of India: A. Provisions of the Union Executive are contained in Part V of the Constitution. B. Provisions of Fundamental Rights are also contained in Part\nV. Which of the above statements is/are correct ?","o":["A only","B only","Both A and B","Neither A nor B"],"a":0,"e":"A only. Other parts of constitution: Part III - Fundamental Rights (Article 12 to 35), Part IV - Directive Principle of State Policy (Article - 36 to 51), Part VI - The States (Article 152 to 237)."},{"t":"Articles, Schedules & Parts","n":150,"tag":"","q":"Fundamental duties were not placed in Part III of the Indian Constitution because Part III is_________.","o":["non-justiciable","justiciable","not enforceable","absolute"],"a":1,"e":"Justiciable. Part III Article (12-35): Fundamental Rights. Fundamental duties (Part IVA Article 51A) added by the 42nd Amendment Act (1976). These duties are non-justiciable, meaning they are not enforceable by a court of law."},{"t":"Articles, Schedules & Parts","n":151,"tag":"","q":"Which of the following Articles of the Indian Constitution provides for a bicameral Parliament of India?","o":["Article 49","Article 59","Article 79","Article 89"],"a":2,"e":"Article 79 :- Constitution of Parliament - There shall be a Parliament of the Union consisting of the President and two Houses known as the Council of States (Rajya Sabha, Article 80) and the House of the People (Lok Sabha, Article 81). Article 49 - Protection of monuments and places and objects of national importance. Article 59 - Conditions of the President's office."},{"t":"Articles, Schedules & Parts","n":152,"tag":"","q":"As per Article 172 (2)_______of a State shall NOT be subject to dissolution.","o":["Legislative Assembly","Legislative Council","House of People","Council of States"],"a":1,"e":"Legislative Council (Saasana Mandali) - It is the upper house in those states of India that have a bicameral state legislature. Six States have a Legislative Council: Andhra Pradesh, Telangana, Uttar Pradesh, Bihar, Maharashtra, Karnataka."},{"t":"Articles, Schedules & Parts","n":153,"tag":"","q":"Article 323 of the Indian Constitution deals with __________ .","o":["expenses of Public Services Commissions","reports of Public Services Commissions","functions of Public Services Commissions","power to extend functions of Public Services Commissions"],"a":1,"e":"reports of Public Services Commissions. Articles 315 to 323 (Part XIV) of the Constitution of India establish the Union Public Service Commission (UPSC) and State Public Service Commissions (SPSC). The UPSC Chairman is appointed by the President for a term of six years or until the age of 65, whichever is earlier."},{"t":"Articles, Schedules & Parts","n":154,"tag":"","q":"Which Article of the Indian Constitution empowers the Supreme Court to review its own judgements or orders ?","o":["Article 138","Article 135","Article 136","Article 137"],"a":3,"e":"Article 137. Article 138 - Enlargement of the jurisdiction of the Supreme Court. Article 135 - Jurisdiction and powers of the Federal Court under existing law to be exercisable by the Supreme Court. Article 136 - Special leave to appeal by the Supreme Court."},{"t":"Articles, Schedules & Parts","n":155,"tag":"","q":"Consider the following statements regarding provisions of the Indian Constitution:\n1. Article 247 empowers the Parliament to establish additional courts for better administration of laws made by it.\n2. Article 248 deals with residuary powers of legislation. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 are correct."},{"t":"Articles, Schedules & Parts","n":156,"tag":"","q":"Which Article of the Indian Constitution deals with the removal and suspension of a member of the Public Service Commission?","o":["Article 320","Article 324","Article 317","Article 315"],"a":2,"e":"Article 317. Part XIV (Articles 315 to 323) - Establishment of UPSC for Union and Public Service Commission for each state. Article 320 - Functions of Public Service Commissions. Article 315 - Public Service Commissions for the Union and for the States."},{"t":"Articles, Schedules & Parts","n":158,"tag":"","q":"Consider the following statements regarding the Indian Constitution:\nI. Part IV (Articles 36 to 51) deals with the organisation, composition and powers of the State Legislature.\nII. Article 171 specifies the composition of the Legislative Councils in States. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":1,"e":"II only is correct. Part VI Article (152 to 237). Article 168 Constitution of Legislatures in States. Article 169 deals with abolition or creation of Legislative Councils in states. Article 170 - Composition of the Legislative Assemblies. Article 171 - Composition of the legislative Councils. Article 172 - Duration of State Legislatures."},{"t":"Articles, Schedules & Parts","n":159,"tag":"","q":"Which of the following Articles of the Constitution of India provides that there shall be a Legislative Assembly for the National Capital Territory of Delhi?","o":["Article 231AA","Article 239AA","Article 233AA","Article 237AA"],"a":1,"e":"Article 239AA. The 69th Amendment Act (1991) - A special status to the Union Territory of Delhi by designing it as the National Capital Territory of Delhi. Brahm Prakash was the first chief minister of Delhi."},{"t":"Articles, Schedules & Parts","n":160,"tag":"","q":"Which among the following is a subject of Union Lists in the Constitution of India ?","o":["Liquor","Social planning","Extradition","Boilers"],"a":2,"e":"Extradition. The 7th Schedule of the Indian Constitution consists of three lists: Union List: 100 items (e.g., Defence, Army, International Relations). State List: 61 items (e.g., Local Government, Public Health, Prisons). Concurrent List: 52 items (e.g., Education, Forest, Trade Unions)."},{"t":"Articles, Schedules & Parts","n":161,"tag":"","q":"Provisions related to the seat of the \"Supreme Court of India\" is mentioned in which Article?","o":["Article 132","Article 131","Article 130","Article 129"],"a":2,"e":"Article 130. The Federal Court of India was established on 1 October 1937. After Independence, the Federal Court was replaced as the Supreme Court of India (28 January 1950). Other related Articles : Article 124: Establishment and Constitution of Supreme Court. Article 129: Supreme Court to be a Court of Record. Article 131: Original Jurisdiction of the Supreme Court. Article 132: Appellate Jurisdiction of Supreme Court in appeals from High Court in certain cases."},{"t":"Articles, Schedules & Parts","n":162,"tag":"","q":"Part XVI of the Indian constitution deals with ___________ .","o":["Elections","Special provisions related to certain classes","Constitutional amendments","Special provisions related to municipal corporation"],"a":1,"e":"Special provisions related to certain classes (Article 330 to 342A). Article 330 - Reservation of seats for Scheduled Castes and Scheduled Tribes in the House of the People. Part XV (Article 324-329): Elections. Part XX (Article 368): Amendment of the Constitution. Part IXA (Article 243P-243ZG): The Municipalities."},{"t":"Articles, Schedules & Parts","n":163,"tag":"","q":"Which of the following Articles of the Indian constitution provides for the National commission for Scheduled Castes ?","o":["Article 337","Article 344","Article 343","Article 338"],"a":3,"e":"Article 338. National commission for Scheduled Castes is a constitutional body.Other Commissions - National Commission for Scheduled Tribes (Article 338A inserted by the 89th Amendment Act 2003) and National Commission for Backward Classes (Article 338B). Article 343 - Official language of the Union. Article 344 - Commission and Committee of Parliament on Official Language. Article 337 - Special provisions in terms of educational grants/subsidies provided to the Anglo-Indian population of India."},{"t":"Articles, Schedules & Parts","n":164,"tag":"","q":"Consider the following statements regarding the provisions of the Indian Constitution:\nI. Provisions related to Municipalities are mentioned under Part IXA.\nII. Provisions related to Municipalities are mentioned under Part XII. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. The Municipalities (Urban Local Governments) is a system of Democratic Decentralisation. It was added through the 74th Constitutional Amendment Act of 1992. Part VII - Repealed by the Constitution (Seventh Amendment Act, 1956). Part V - Provisions for the functioning of the Union Government. Part XII - Laws pertaining to Finance, Property, Contracts and Suits for Republic of India."},{"t":"Articles, Schedules & Parts","n":165,"tag":"","q":"Which Article of the Indian constitution mentions that it is duty of the Union government to protect States against external aggression and internal disturbance?","o":["353","356","355","358"],"a":2,"e":"Article 355. Other Articles - Article 353 - States about the Effect of the proclamation of emergency. Article 356 - States about the Provision in case of failure of constitutional machinery in the state (president rule). Article 358 - It deals with the suspension of fundamental rights guaranteed under Article 19 of the constitution."},{"t":"Articles, Schedules & Parts","n":166,"tag":"","q":"Consider the following statements regarding the Comptroller and Auditor-General of India (CAG):\nI. Article 151 of the Constitution deals with CAG audit reports.\nII. Article 150 of the Constitution deals with CAG audit reports. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Part V: The Union, Chapter V : Comptroller and Auditor - General (CAG) of India (Article 148 - 151). Article 150: Form of accounts of the Union and of the States. Article 149: Duties and powers of the Comptroller and Auditor-General. Article 148: Comptroller and Auditor-General of India."},{"t":"Articles, Schedules & Parts","n":167,"tag":"","q":"Central Bureau of Intelligence and Investigation comes under which list of the seventh schedule of the Indian constitution ?","o":["Union list","Concurrent list","State list","Transferred list"],"a":0,"e":"Union list (100) - Defence, Army, International Relations, Ports, Railways, Census, Communication, Central Bureau of Investigation etc. State list (61) - Public order, Police, Public health and sanitation, Hospitals and dispensaries, Agriculture, State Public Service Commission, etc. Concurrent list (52) - Education, Forest, Trade unions, population control and family planning, Marriage, Adoption, etc. Seventh schedule under Article 246 of the constitution deals with the division of powers between the union and the states."},{"t":"Articles, Schedules & Parts","n":168,"tag":"","q":"Consider the following statements about Part VII of the Indian Constitution:\nI. Part VII was related to the States in Part B of the First Schedule.\nII. Part VII was related to the reservation of Anglo-Indians in Parliament. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. States in part B of the first schedule. Provision relating to property - constitutional right under Part XII, Article 300A (Added by 44th Amendment Act, 1978). The 104th Constitutional Amendment Act of 2019 abolished the reservation of seats for Anglo-Indians in the Parliament and State Legislatures of India in January 2020. The amendment also extended reservations for Scheduled Castes and Scheduled Tribes for up to ten years."},{"t":"Articles, Schedules & Parts","n":169,"tag":"","q":"The Indian parliament has power to impose restrictions on trade, commerce and intercourse through which Article of the Indian constitution?","o":["304","300 A","303","302"],"a":3,"e":"Article 302. Part XIII (Article 301-307) - Trade, Commerce and Intercourse within the Territory of India. Article 304: Restrictions on trade, commerce and intercourse among States. Article 303: Restrictions on the legislative powers of the Union and of the States with regard to trade and commerce. Article 300A: Persons not to be deprived of property save by authority of law."},{"t":"Articles, Schedules & Parts","n":170,"tag":"","q":"Consider the following statements regarding powers of the Governor:\nI. Article 213 states that the Governor has the power to promulgate ordinances during the recess of the State Legislature.\nII. Article 214 states that the Governor has the power to promulgate ordinances during the recess of the State Legislature. Which of the above statements is/are correct ?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Article 214 mandates that every state in India must have its own High Court. Exceptions – Parliament may establish a common High Court for two or more states and union territories under Article 231. Example: Punjab & Haryana share the same High Court at Chandigarh. Assam, Nagaland, Mizoram, Arunachal Pradesh share the Guwahati High Court."},{"t":"Articles, Schedules & Parts","n":171,"tag":"","q":"Part V chapter II of the Indian constitution does not include which of the following provisions?","o":["Joint sitting of both house of Parliament in certain cases","Power of President to promulgate Ordinances during recess of Parliament","Language to be used in Parliament","Restriction on discussion in Parliament"],"a":1,"e":"Article 123 - Power of President to promulgate Ordinances during recess of Parliament. It is included under chapter III of part V of Indian constitution. Article 108 - Joint sitting of both Houses in certain cases. Article 120 - Language to be used in Parliament. Article 121 - Restriction on discussion in Parliament."},{"t":"Articles, Schedules & Parts","n":172,"tag":"","q":"Article 350A of the Indian constitution is related with______.","o":["Special officers for linguistic minorities","Facilities for instruction in mother-tongue at primary stage","Direction for development of the Hindi language","Language to` be used in Supreme Court and High Courts of India"],"a":1,"e":"Article - 350 : Language to be used in representations for redress of grievances. Article - 350B: Special Officer for linguistic minorities. Article- 351: Directive for development of the Hindi language. Article 348 (1)(a): All proceedings in the Supreme Court and in every High Court, shall be in English language."},{"t":"Articles, Schedules & Parts","n":173,"tag":"","q":"Which Article of the Constitution does India mention that business in Parliament shall be transacted in Hindi or English?","o":["Article 120","Article 121","Article 122","Article 119"],"a":0,"e":"Article 120 . Article 121 - Restriction on discussion in Parliament. Article 122 - Courts not to inquire into proceedings of Parliament. Article 119 - Regulation by law of procedure in Parliament in relation to financial business."},{"t":"Articles, Schedules & Parts","n":174,"tag":"","q":"Which Article of Indian constitution is related with the Special provisions with respect to the State of Sikkim?","o":["Article 371C","Article 371","Article 371F","Article 371A"],"a":2,"e":"371 F - Sikkim (36th Amendment Act, 1975). Article 371 of the Constitution includes special provisions for 11 states (6 states of the Northeast). Article 371 - provisions for Maharashtra and Gujarat. Article 371 A - Nagaland (13 th Amendment Act, 1962). 371 B - Assam (22 nd Amendment Act, 1969). 371 C - Manipur (27 th Amendment Act, 1971). 371 D - Andhra Pradesh and nd. Telangana (32 Amendment Act, 1973). 371 E - To establish Central University in Andhra Pradesh. 371 G - Mizoram (53 rd. Amendment Act, 1986). 371 H - Arunachal Pradesh (55 th Amendment Act, 1986). 371 I - Goa."},{"t":"Articles, Schedules & Parts","n":175,"tag":"","q":"Consider the following statements regarding appointment of judges in India:\nI. Article 127 deals with the appointment of ad-hoc judges to the Supreme Court.\nII. Article 126 deals with the appointment of ad-hoc judges to the Supreme Court. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Article 126: Appointment of acting Chief Justice of India. Article 128: Attendance of retired judges at sitting of the Supreme Court. Article 125: talks about the financial privileges and allowances that are defined for the judges of the Supreme Court."},{"t":"Articles, Schedules & Parts","n":176,"tag":"","q":"Which Article of the Constitution of India deals with the Sessions of the Parliament?","o":["Article 85","Article 89","Article 90","Article 101"],"a":0,"e":"Article 85 - Sessions of Parliament, prorogation, and dissolution. A session is a period during which a House meets almost every day uninterruptedly to manage the business. Article 90 - Vacation and resignation of (and removal from) the office of Deputy Chairman. Article 101- Vacation of seats in Parliament."},{"t":"Articles, Schedules & Parts","n":177,"tag":"","q":"Consider the following statements regarding the Articles of Parliament in the Indian Constitution:\nI. Chapter II of Part V (Articles 79–122) deals with the Articles of Parliament.\nII. Chapter I of Part V deals with the Articles of Parliament. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Part V - The Union of Indian Constitution Chapter II deals with the Articles of Parliament . Chapter I (The Executive; Articles 52 to 78); Chapter III: Legislative powers of the President; Article 123); Chapter IV (The Union Judiciary; Articles 124 - 147). Chapter V (Comptroller and Auditor - General of India (CAG); Articles 148 to 151)."},{"t":"Articles, Schedules & Parts","n":178,"tag":"","q":"The Article of the Indian Constitution that deals with all the executive powers of the Governor is ____","o":["Article 150","Article 157","Article 154","Article 156"],"a":2,"e":"Article 154- Executive power of Governor. Article 150 - Form of accounts of the Union and of the States. Article 157 - Qualifications for appointment as Governor. Article 156 - Term of office of Governor."},{"t":"Articles, Schedules & Parts","n":179,"tag":"","q":"Consider the following statements regarding the Union Public Service Commission (UPSC):\nI. Part XIV of the Indian Constitution provides for the Union Public Service Commission.\nII. Part X of the Indian Constitution provides for the Union Public Service Commission. Which of the above statements is/are correct ?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Union Public Service Commission (UPSC) is an independent constitutional body. The provisions regarding the composition of UPSC, the appointment, and removal of its members, and the powers and functions of UPSC are provided in Part XIV of the Indian Constitution under Article 315 to Article 323."},{"t":"Articles, Schedules & Parts","n":180,"tag":"","q":"Consider the following statements regarding the National Commission for Backward Classes:\nI. Article 338B(1) states that there shall be a Commission for socially and educationally backward classes, called the National Commission for Backward Classes.\nII. Article 243S(1) states that there shall be a Commission for socially and educationally backward classes. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Article 243S(1) - There shall be constituted Wards Committees, consisting of one or more wards, within the territorial area of a Municipality having a population of three lakhs or more."},{"t":"Articles, Schedules & Parts","n":181,"tag":"","q":"Consider the following statements regarding the official language of the Union:\nI. Article 343(1) states that Hindi in Devanagari script shall be the official language of the Union.\nII. Article 343(2) states that Hindi in Devanagari script shall be the official language of the Union. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Article 343(2) -The Constitution adopted in 1950 stipulated that English and Hindi would be used for the Union's official business for a period of fifteen years. Article 354 deals with the application of provisions related to the distribution of revenues while a Proclamation of Emergency is in operation."},{"t":"Articles, Schedules & Parts","n":182,"tag":"","q":"Consider the following statements regarding the GST Council in India:\nI. Article 279A provides for the creation of the Goods and Services Tax (GST) Council.\nII. Article 246A provides for the creation of the Goods and Services Tax (GST) Council. Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":0,"e":"I only is correct. Article 279A empowers the president to constitute a joint forum of the central and states namely, Goods and Services Tax Council. The GST Council is a constitutional body for making recommendations to the union and state government on issues related to Goods and Service Tax."},{"t":"Articles, Schedules & Parts","n":183,"tag":"","q":"According to which of the following Articles of the Constitution of India shall a Money Bill NOT be introduced in the Council of States ?","o":["Article 109","Article 354","Article 298","Article 193"],"a":0,"e":"Article 109 . Rajya Sabha (Council of States), the upper house of the Parliament of India. A money bill is a specific type of financial legislation that exclusively deals with matters related to taxes, government revenues, or expenditures."},{"t":"Articles, Schedules & Parts","n":184,"tag":"","q":"As per Article ______ of the Constitution of India, English is the official language for all the high courts in the country.","o":["329 (1)","336 (1)","315 (1)","348 (1)"],"a":3,"e":"Article 348 (1) . 329(a) the validity of any law relating to the delimitation of constituencies or the allotment of seats to such constituencies, made or purporting to be made under Article 327 or Article 328, shall not be called in question in any court"},{"t":"Articles, Schedules & Parts","n":185,"tag":"","q":"Consider the following statements regarding secretarial staff for the Houses of Parliament:\nI. Article 98 provides for a separate secretarial staff for each House of the Parliament.\nII. Article 99 specifies the oath or affirmation that members of Parliament must take before sitting and voting in the House Which of the above statements is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both I and II are correct."},{"t":"Amendments","n":186,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which of the following was a major effect of the 42nd Constitutional Amendment?","o":["It abolished the Directive Principles of State Policy.","It increased the tenure of the Lok Sabha and introduced Fundamental Duties","It introduced Fundamental Rights for citizens.","It reduced the term of the Lok Sabha to four years"],"a":1,"e":"The 42nd Constitutional Amendment Act, 1976, often called the “Mini-Constitution,” extended the Lok Sabha and State Legislative Assemblies’ term from 5 to 6 years (later reverted to 5 by the 44th Amendment 1978) and added a new part (Part IVA) introducing Fundamental Duties of citizens. This amendment was enacted during the Emergency. It also amended the Preamble, adding the words \"Socialist,\" \"Secular,\" and \"Integrity\" to the description of India."},{"t":"Amendments","n":187,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which constitutional amendment is known as the \"Mini Constitution\" ?","o":["52nd Amendment","44th Amendment","42nd Amendment","24th Amendment"],"a":2,"e":"The 42nd Amendment . It was enacted in 1976 during the Emergency by the Indira Gandhi government. Key changes included adding \"socialist,\" \"secular,\" and \"integrity\" to the Preamble, establishing Fundamental Duties for citizens, and transferring several subjects from the State List to the Concurrent List, increasing central power. It also extended the term of the Lok Sabha and state legislative assemblies from five to six years and modified emergency provisions, including granting the President authority to deploy central forces in states."},{"t":"Amendments","n":188,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Which Constitutional Amendment Act made the Right to Education a Fundamental Right in India?","o":["44 th Amendment Act, 1978","42 nd Amendment Act, 1976 th","86 Amendment Act, 2002 th","97 Amendment Act, 2011"],"a":2,"e":"86th Amendment Act, 2002. The 86th Constitutional Amendment Act, 2002 made elementary education a Fundamental Right by inserting Article 21A, which mandates the State to provide free and compulsory education to all children aged 6 to 14 years. It also modified Article 45 (Directive Principles) and added Article 51A(k) as a Fundamental Duty, requiring parents/guardians to provide educational opportunities to children. 44th Amendment Act, 1978 – Reversed several provisions of the 42nd Amendment and removed the Right to Property from the list of Fundamental Rights. 42nd Amendment Act, 1976 – Known as the “Mini-Constitution”, it introduced Fundamental Duties, added “Socialist” and “Secular” to the Preamble, and shifted Education from the State List to the Concurrent List (but did not make it a Fundamental Right). 97th Amendment Act, 2011 – Gave constitutional status and protection to co-operative societies."},{"t":"Amendments","n":189,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"What major reform does Bharatiya Sakshya Adhiniyam bring?","o":["Digitization of evidence","Introduction of new fundamental rights","Abolishment of the Supreme Court","Removal of all existing laws"],"a":0,"e":"Digitization of evidence. The Bharatiya Sakshya Adhiniyam, 2023 modernizes the Indian legal system by allowing digital recording, storage, and submission of evidence in courts. This reform aims to increase efficiency, reduce delays, and ensure secure handling of documents and witness statements. By embracing technology, the act facilitates faster judicial processes and enhances transparency, marking a significant step toward digitization in India’s justice delivery system."},{"t":"Amendments","n":190,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which act replaces the Code of Criminal Procedure, 1973?","o":["Bharatiya Nagarik Suraksha Sanhita","Bharatiya Nyaya Sanhita","None of the above","Bharatiya Sakshya Adhiniyam"],"a":0,"e":"Bharatiya Nagarik Suraksha Sanhita. In 2023, India introduced three new criminal laws to replace colonial-era laws: → Bharatiya Nyaya Sanhita (BNS), 2023 Replaces the Indian Penal Code (IPC), 1860. Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023 → Replaces the Code of Criminal Procedure (CrPC), 1973. Bharatiya Sakshya Adhiniyam (BSA), 2023 → Replaces the Indian Evidence Act, 1872. Thus, the CrPC 1973 has been replaced by the Bharatiya Nagarik Suraksha Sanhita, 2023."},{"t":"Amendments","n":191,"tag":"","q":"As per the Constitution (Ninety - First Amendment) Act, 2003, the total number of ministers, including the Prime Minister, shall NOT exceed:","o":["20% of the total number of members of the Lok Sabha","15% of the total number of members of the Lok Sabha","10% of the total number of members of the Lok Sabha","25% of the total number of members of the Lok Sabha"],"a":1,"e":"91st Amendment Act 2003: The total number of ministers in the Council of Ministers, including the Prime Minister, cannot exceed 15% of the total number of members in the Lok Sabha. The total number of ministers in a State Council of Ministers, including the Chief Minister, cannot exceed 15% of the total number of members in the Legislative Assembly of that State."},{"t":"Amendments","n":192,"tag":"","q":"Part IV A of the Indian Constitution was inserted in the Indian Constitution through______ Constitutional Amendment Act.","o":["44 th","46 th","48 th","42 nd"],"a":3,"e":"42nd. The fundamental duties were incorporated in Part IV-A of the Constitution by the 42nd Constitutional Amendment Act, 1976 on the recommendations of the Swaran Singh Committee. Initially, there were 10 duties, but an additional duty was added by the 86th Constitutional Amendment Act, 2002, bringing the total to 11 duties."},{"t":"Amendments","n":193,"tag":"","q":"Consider the following statements regarding Part IV-A of the Indian Constitution:\n1. Part IV-A was inserted by the 42nd Constitutional Amendment Act, 1976 on the recommendations of the Swaran Singh Committee.\n2. Initially, 10 Fundamental Duties were included in Part IV-A.\n3. The 86th Constitutional Amendment Act, 2002 added one more Fundamental Duty, raising the total to 11. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. All three statements are correct: the 42nd Amendment introduced Fundamental Duties (based on Swaran Singh Committee’s recommendations), originally 10 in number, and the 86th Amendment added the duty related to education of children, making them 11."},{"t":"Amendments","n":194,"tag":"","q":"____________ Directive principles of State Policy were added to the Indian Constitution by the 42nd Constitutional Amendment Act of 1976.","o":["Two","Three","Five","Four"],"a":3,"e":"Four. These Directive Principles of State Policy (DPSP) are: Article 39(f) which provided that “the State shall direct its policy towards securing for the children opportunities and facilities to develop in a healthy manner and in conditions of freedom and dignity and for protecting children and youth from exploitation and against material abandonment”; Article 39(A) promotes equal justice and free legal aid for the poor; Article 43(A) secures workers' participation in industry management; and Article 48(A) protects the environment and wildlife."},{"t":"Amendments","n":195,"tag":"","q":"Which of the following Constitution Amendment Bills is related to the provision of modifying the list of Scheduled Caste in Tamil Nadu ?","o":["The Constitution (Scheduled Tribes) Order (Amendment) Bill, 2019","The Constitution (Scheduled Tribes) Order Amendment Act, 2013","The Constitution (Scheduled Caste) Order (Amendment) Bill, 2015","The Constitution (Scheduled Castes) Order (Amendment) Bill, 2021"],"a":3,"e":"The Bill amends the Constitution (Scheduled Castes) Order, 1950. The Constitution empowers the President to specify the Scheduled Castes (SCs) in various states and union territories. Further, it permits Parliament to modify this list of notified SCs. The Statement of Objects and Reasons of the Bill states that the Bill has been introduced to give effect to modifications proposed by the state of Tamil Nadu."},{"t":"Amendments","n":196,"tag":"","q":"Consider the following statements:\n1. The 101st Constitutional Amendment Act, 2016 established the Goods and Services Tax (GST) Council under Article 279A.\n2. The 103rd Constitutional Amendment Act introduced 10% reservation for Economically Weaker Sections (EWS). Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 279A of the Indian Constitution establishes the Goods and Services Tax Council (GST Council) chaired by the finance minister of India. 100th Constitutional Amendment Act, 2015: Ratified the land boundary agreement between India and Bangladesh. The 102nd Constitutional Amendment Act: Enhanced regulations to support backward classes in India. The 103rd Constitutional Amendment Act: Established a 10% reservation for Economically Weaker Sections."},{"t":"Amendments","n":197,"tag":"","q":"Consider the following statements:\n1. Article 21, which guarantees the Right to Life and Personal Liberty, can be amended by a simple majority of Parliament.\n2. Article 21 is a Fundamental Right under Part III and therefore requires a special majority for any amendment. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Article 21 asserts that no person shall be deprived of their life except according to the procedure established by law. This means that every individual has the right to live, and their life cannot be taken away except in accordance with the prescribed legal procedures. It is a part of Fundamental rights (Part III). It can be amended only by a special majority in both houses of Parliament by two-thirds of members present and voting."},{"t":"Amendments","n":198,"tag":"","q":"Which of the following Articles was amended by The Constitution Fiftieth Amendment Act, 1984 ?","o":["Article 78","Article 99","Article 33","Article 56"],"a":2,"e":"Article 33 - the Power of Parliament to modify the rights conferred by this Part in their application to Forces, etc. Article 78 - Duties of the Prime Minister as respects the furnishing of information to the President, etc. Article 99 - Oath or affirmation by members of the Parliament. Article 56 - Term of office of President."},{"t":"Amendments","n":199,"tag":"","q":"On 9 August 2021, the Parliament had passed the Limited Liability Partnership (Amendment) Bill, 2021. It amended the:","o":["Limited Liability Partnership Act, 2004","Limited Liability Partnership Act, 2008","Limited Liability Partnership Act, 2012","Limited Liability Partnership Act, 2016"],"a":1,"e":"Limited Liability Partnership Act, 2008. It was published in the official Gazette of India on 9 January 2009 and has been in effect since 31 March 2009. LLP Amendment Bill, 2021 passed on 28th July 2021 by both house of Parliament. 29 amendments were made to LLP Act 2008 by LLP Amendment Bill 2021."},{"t":"Amendments","n":200,"tag":"","q":"On 7 November 2022, the Supreme Court of India upheld the reservations for the weaker sections (EWS). Which of the following amendments brought this reservation in the first place ?","o":["101st Amendment of the Constitution","102nd Amendment of the Constitution","103rd Amendment of the Constitution","104th Amendment of the Constitution"],"a":2,"e":"103rd Amendment to the Constitution. The 103rd Amendment Act of the Constitution, 2019 was enacted to introduce reservation for the economically weaker sections (EWS). Under this amendment, Articles 15(6) and 16(6) of the Constitution were amended. Through this amendment, 10% reservation was provided in educational institutions and government jobs for the economically weaker sections of the country."},{"t":"Amendments","n":201,"tag":"","q":"Consider the following statements:\n1. The Constitution (100th Amendment) Act came into force in 2015.\n2. This Amendment ratified the Land Boundary Agreement between India and Bangladesh, enabling the transfer of territories as per the 1974 Agreement and 2011 Protocol. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Constitution (100th Amendment) Act of 2015 ratified the Land Boundary Agreement between India and Bangladesh. This amendment gave effect to the acquisition and transfer of territories between the two countries, pursuant to the Land Boundary Agreement of 1974 and its protocol of 2011."},{"t":"Amendments","n":202,"tag":"","q":"Consider the following statements:\n1. The Constitution (Fifth Amendment Act), 1955 amended Article 3, which deals with the formation of new states and alteration of areas, boundaries, or names of existing states.\n2. Article 45, dealing with early childhood care and education, was amended later by the 86th Constitutional Amendment Act, 2002. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 3 deals with the formation of new states and the alteration of areas, boundaries, or names of existing states. Article 45 was amended by the Constitution (Eighty-sixth Amendment) Act of 2002. The amendment changed the subject matter of Article 45 and made elementary education a fundamental right under Article 21."},{"t":"Amendments","n":203,"tag":"","q":"Consider the following statements:\n1. The 86th Constitutional Amendment Act, 2002 inserted Article 21A, making the Right to Education a Fundamental Right for children aged 6 to 14 years.\n2. The 85th Constitutional Amendment Act, 2002 provided for promotion with consequential seniority for SC/ST government employees. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Eighty-sixth Amendment Act, 2002, made the Right to Education a fundamental right for children aged 6-14 by adding Article 21A in Part III of the Constitution. The 87th Amendment Act, 2003 involved readjusting electoral constituencies based on the 2001 census. The 85th Amendment Act, 2002 provided for promotion with consequential seniority for government employees from Scheduled Castes and Scheduled Tribes."},{"t":"Amendments","n":204,"tag":"","q":"The 42 nd Amendment of the Indian Constitution (1976) states that India is a/an ______ nation.","o":["secular","capitalist","aristocratic","oligarchic"],"a":0,"e":"secular. The term means that all the religions in India get equal respect, protection and support from the state. The Preamble was amended only once by the 42nd Amendment Act to add ‘Socialist’, ‘Secular’ and Integrity terms."},{"t":"Amendments","n":205,"tag":"","q":"Consider the following statements:\n1. The 73rd Constitutional Amendment Act, 1992 mandated a 3-tier Panchayati Raj system for all states having a population above 20 lakh.\n2. The Balwant Rai Mehta Committee first recommended the three-tier structure consisting of Zilla Parishad, Panchayat Samiti, and Gram Panchayat. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. 73rd Constitutional Amendment Act of 1992, enacted by the Narasimha Rao government and effective from April 24, 1993, aimed to strengthen local self-governance by establishing democracy at the grassroots level. Part IX of the Constitution outlines the Panchayati Raj system, with Rajasthan implementing it first in Nagaur district on October 2, 1959. The Balwant Rai Mehta Committee recommended a three-tier structure: Zilla Parishad (district level), Panchayat Samiti (block level), and Gram Panchayat (village level)."},{"t":"Amendments","n":206,"tag":"","q":"In which year did the 44th Amendment remove the right to property from the list of fundamental rights?","o":["1978","1975","1973","1981"],"a":0,"e":"1978. The right to property was listed under Article 31 before its deletion. At present the right to property is listed under Article 300A as a legal right."},{"t":"Amendments","n":207,"tag":"","q":"Which among the following is INCORRECT about the salient features of the 73rd Amendment Act ?","o":["The Act corresponds to Part III of the Constitution of India.","The Act gives a Constitutional status to the Panchayati Raj Institutions.","The Act has added the Eleventh Schedule to the Constitution of India.","It contains 29 functional items of the Panchayats and deals with Article 243 to 243(O)."],"a":0,"e":"The 73rd Amendment Act - It was enacted in 1992 and came into force from April 1993. It added Part IX (Article 243 - 243O) to the constitution. It was enacted to implement the Directive Principles of State Policy under Article 40 on the recommendation of L.M. Singhvi Committee."},{"t":"Amendments","n":208,"tag":"","q":"Consider the following statements:\n1. As per Article 368, the Indian Constitution provides for two types of amendment procedures.\n2. Certain amendments require not only a special majority in Parliament but also ratification by at least half of the state legislatures. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 368 (Part XX) grants Parliament the power to amend the Constitution. Amendments require either (1) a special majority or (2) a special majority with ratification by at least half of the state legislatures by a simple majority. The amendment procedure is inspired by the South African Constitution."},{"t":"Amendments","n":209,"tag":"","q":"The Unlawful Activities (Prevention) Act, which provides for the more effective prevention of certain unlawful activities of individuals and associations dealing with terrorist activities, was first put into effect in India in the year.","o":["1991","1967","2014","1947"],"a":1,"e":"1967. Unlawful Activities (Prevention) Act - Its main objective is dealing with activities directed against the integrity and sovereignty of India. It assigns absolute power to the central government and provides for death penalty and life imprisonment of culprits. Related acts - Armed Forces Special Powers Act (AFSPA) 1958; Prevention of Terrorism Act, 2002; The National Investigation Agency Act, 2008; The Anti - Hijacking Act, 2016."},{"t":"Amendments","n":210,"tag":"","q":"The Family Courts (Amendment) Act 2022 has amended the Family Courts Act, 1984. The Act allows ________ to establish Family Courts.","o":["District Courts","State Governments","Union Government","District Collector"],"a":1,"e":"State Governments. Purpose of establishment of family court - To promote conciliation and secure speedy settlement of disputes relating to marriage and family affairs and for related matters. This bill was passed by Lok Sabha on 26th July 2022. This bill has granted statutory cover to already established family courts in Himachal Pradesh and Nagaland."},{"t":"Amendments","n":211,"tag":"","q":"Consider the following statements:\n1. The 105th Constitutional Amendment Act, 2021 restored the power of states and Union Territories to identify and specify Socially and Educationally Backward Classes (SEBCs).\n2. Article 342A was introduced earlier by the 102nd Constitutional Amendment Act, relating to the identification of SEBCs. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Reservation in India: Other Backward Class (OBCs) were included in the ambit of reservation in 1991 on the recommendations of the Mandal Commission. It recommended a 27% reservation quota for OBC. Constitutional Provisions: Part XVI deals with reservation of SC and ST in Central and State legislatures. 342A - Socially and educationally backward classes."},{"t":"Amendments","n":212,"tag":"","q":"In which year was the Andhra Pradesh Reorganisation Act passed?","o":["2013","2012","2014","2015"],"a":2,"e":"2014. The States Reorganisation Act (1956), under the provisions of Part I (Article 3). The State Reorganisation Commission (SRC) was constituted in 1953 appointed by Jawahar Lal Nehru. It was headed by Sir Fazal Ali. The first state formed on the linguistic basis is Andhra Pradesh (1 October 1953). Formation of other states: Gujarat and Maharashtra (1960), Karnataka (1956), Nagaland (1963), Haryana (1966), Sikkim (1975)."},{"t":"Amendments","n":213,"tag":"","q":"How many Directive Principles of the original list in the Indian Constitution were amended by the 44th Amendment Act of 1978 ?","o":["Three","One","Two","Four"],"a":1,"e":"One (Article 38(2): Requires the state to reduce inequalities in income, status, facilities, and opportunities). Directive Principles of State Policy: Part IV of the Constitution of India (Article 36–51). It was borrowed from the Irish Constitution. Article 38 (1) - The State shall strive to promote the welfare of the people by securing and protecting as effectively as it may a social order in which justice, social, economic and political, shall inform all the institutions of national life."},{"t":"Amendments","n":214,"tag":"","q":"Which among the following Constitutional Amendment Act of the Indian constitution reduced the age of voting from 21 to 18 for elections to the Lok Sabha and to the Legislative Assemblies of states?","o":["81st","61st","52nd","72nd"],"a":1,"e":"61st. It was done by amending Article 326 of the constitution in 1988. 81st Constitutional Amendment Act 2000 was inserted to protect the reservation for SCs and STs in backlog of vacancies. 52nd Constitutional Amendment Act 1985, known as anti-defection law and 10th schedule added in the Indian constitution. 72nd Constitutional Amendment Act 1992 provides reservation to Scheduled Tribes in Tripura State Legislative Assembly."},{"t":"Amendments","n":215,"tag":"","q":"Which amendment in the Indian constitution is related to extension of jurisdiction of High Courts to Union territories ?","o":["9th Amendment","7th Amendment","1st Amendment","13th Amendment"],"a":1,"e":"7th Amendment. This constitutional amendment was done in 1956 to reorganise the classes of states in the country and to change the powers and functions of the state governors. 1 st Amendment (1951) - The rights of property owners and made it more difficult for the government to enact land reform measures. It also added the Ninth Schedule, which protected certain laws from being th challenged in the courts. 9 Amendment (1960) - Facilitate the cession of the Berubari union. 13 th Amendment (1962) - Nagaland was formed with special status under Article 371A."},{"t":"Amendments","n":216,"tag":"","q":"Consider the following statements:\n1. The 71st Constitutional Amendment Act, 1992 included Konkani, Manipuri, and Nepali languages in the Eighth Schedule of the Constitution.\n2. The 92nd Constitutional Amendment Act, 2003 added Bodo, Dogri, Maithili, and Santhali languages to the Eighth Schedule, raising the total number of scheduled languages to 22. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. 21st Amendment Act (1967) - Include Sindhi language. 92nd Amendment Act (2003)
