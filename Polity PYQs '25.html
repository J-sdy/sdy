n be extended indefinitely with the consent of the Prime Minister.","The President cannot impose President's Rule unless the Supreme Court permits.","President's Rule can be declared without Parliament's approval."],"a":0,"e":"President’s Rule is imposed under Article 356 of the Constitution when the President is satisfied that the government of a state cannot be carried on in accordance with the Constitution. The Governor’s report is the usual basis for recommending President’s Rule, though the President may act otherwise too. Historically, it has often been misused to dismiss state governments even when they had majority support (e.g., S.R. Bommai case, 1994)."},{"t":"President, VP & PM","n":333,"tag":"","q":"Which of the following is NOT a condition for the President’s office in India?","o":["He shall not be entitled, without payment of rent, to use his official residence","He shall not be a member of either House of the Parliament.","The allowances shall not be diminished during his term of office.","He shall not hold any office of profit."],"a":0,"e":"Article 59 of the Constitution of India outlines the conditions for the office of the President of India. Article 59 (3) - The President shall be entitled without payment of rent to the use of his official residences and shall be also entitled to such emoluments, allowances and privileges as may be determined by Parliament by law."},{"t":"President, VP & PM","n":334,"tag":"","q":"Which Article of the Constitution of India expressly provides that the President is eligible for re-election?","o":["Article 58","Article 56","Article 59","Article 57"],"a":3,"e":"Article 57. Important articles related to the President of India : Article 52 - The President of India. Article 53 - Executive power of the Union. Article 54 - Election of President. Article 55 - Manner of election of President. Article 56 - Term of office of President. Article 58 - Qualifications for election as President. Article 59 - Conditions of President’s office. Article 60 - Oath or affirmation by the President."},{"t":"President, VP & PM","n":335,"tag":"","q":"In the state legislative assembly, the Money bill can be introduced with the prior permission of __________.","o":["Governor","Auditor General","Finance Minister","CAG"],"a":0,"e":"Governor. Money Bills in State Legislatures : A Money Bill is a special type of financial bill that deals with matters like taxation, borrowing, or expenditure from the state's Consolidated Fund. Article 198 of the Constitution of India deals with the special procedure for money bills in state legislatures. Article 148 : Provision for the appointment of the Comptroller and Auditor General of India (CAG) by the President."},{"t":"President, VP & PM","n":336,"tag":"","q":"As per article 123, the ordinance making power is the most important legislative power of ____________.","o":["President","Rajya Sabha","Legislative council","Chief Justice of India"],"a":0,"e":"President. Article 123 of the Indian Constitution allows the President to issue ordinances when Parliament is not in session, with approval required within six weeks of reassembly. The maximum life of an ordinance is six months and six weeks. Fakhruddin Ali Ahmed issued the most ordinances in India. Article 213 : Power of Governor to promulgate Ordinances during recess of Legislature."},{"t":"President, VP & PM","n":337,"tag":"","q":"Which Article of the Constitution of India provides that ‘there shall be a Vice President of India’ ?","o":["Article 61","Article 63","Article 65","Article 62"],"a":1,"e":"Article 63. The Vice President of India is the second-highest constitutional office in India, after the President. Important Articles related to Vice President: Article 64 - The Vice-President to be ex officio Chairman of the Council of States. Article 65 - The Vice-President to act as President or to discharge his functions during casual vacancies in the office, or during the absence, of President."},{"t":"President, VP & PM","n":338,"tag":"","q":"The ________ of every state unfurls the flag in its capital on the Republic Day.","o":["Judge of High Court","Chief Minister","Governor","Speaker"],"a":2,"e":"Governor is the constitutional head of a state in India, appointed by the President. They represent the central government at the state level. Article 153 - Governors of States."},{"t":"President, VP & PM","n":339,"tag":"","q":"Which of the following Articles states that the Prime Minister should be appointed by the President ?","o":["Article 71","Article 66","Article 75","Article 62"],"a":2,"e":"Article 75. Article 62 - Time of holding the election to fill the vacancy in the office of President and the term of office of the person elected to fill the casual vacancy. Article 66 - Election of Vice-President. Article 71 - Matters relating to, or connected with, the election of a President or Vice-President."},{"t":"President, VP & PM","n":340,"tag":"","q":"Which of the following is the most controversial Article in the Indian Constitution, which provides for President’s rule in any state?","o":["Article 358","Article 356","Article 360","Article 352"],"a":1,"e":"Article 356. Other Articles : Article 352 - Proclamation of Emergency. Article 358 - Suspension of provisions of article 19 during emergencies. Article 360 - Provisions as to financial emergency."},{"t":"President, VP & PM","n":341,"tag":"","q":"Who is considered the highest law officer of the state in India?","o":["Advocate general","Attorney general","Chief justice of high court","Auditor general"],"a":0,"e":"Advocate general. It is a Constitutional post and its authority is mentioned in article 165 of the Indian Constitution. Appointment: The Governor of each State shall appoint a person qualified to be a High Court Judge as the Advocate-General for the State. Term and Remuneration: The Advocate-General holds office at the pleasure of the Governor and receives remuneration as determined by the Governor."},{"t":"President, VP & PM","n":342,"tag":"","q":"Which Article deals with the election of the President ?","o":["Article 72","Article 54","Article 74","Article 66"],"a":1,"e":"Article 54 - The President shall be elected by the members of an electoral college consisting of: (a) the elected members of both Houses of Parliament; and (b) the elected members of the Legislative Assemblies of the States."},{"t":"President, VP & PM","n":343,"tag":"","q":"As per article 158, the Governor shall NOT be a member of either House of Parliament or of a House of the Legislature of any State specified in ___________ Schedule.","o":["Seventh","Fifth","First","Third"],"a":2,"e":"First. If a member of either House of Parliament or of a House of the Legislature of any such State be appointed Governor, he shall be deemed to have vacated his seat in that House on the date on which he enters upon his office as Governor. First Schedule - The list of names of states and union territories and their extent and territorial jurisdictions."},{"t":"President, VP & PM","n":344,"tag":"","q":"Which part of the Indian Constitution deals with the election of the Vice President?","o":["Part IV","Part III","Part VI","Part V"],"a":3,"e":"Part V (Article 52- 151) . Article 66 - Election of Vice President. The Vice-President shall be elected by the members of an electoral college consisting of the members of both Houses of Parliament in accordance with the system of proportional representation by means of the single transferable vote and the voting at such election shall be by secret ballot."},{"t":"President, VP & PM","n":345,"tag":"","q":"Who among the following was the shortest-serving Prime Minister of India?","o":["Chandra Shekhar","Gulzarilal Nanda","Charan Singh","Atal Bihari Vajpayee"],"a":1,"e":"Gulzarilal Nanda was an Indian politician and economist specializing in labor issues. He served as the Acting Prime Minister of India twice, for 13 days each, following the deaths of Jawaharlal Nehru in 1964 and Lal Bahadur Shastri in 1966. Chandra Shekhar, known as Jananayak, was Prime Minister from 10 November 1990 to 21 June 1991. Chaudhuri Charan Singh briefly served as Prime Minister from 1979 to 1980. Atal Bihari Vajpayee, an Indian politician and poet, was Prime Minister first for 13 days in 1996, then for 13 months from 1998 to 1999, and finally for a full term from 1999 to 2004."},{"t":"President, VP & PM","n":346,"tag":"","q":"In case the President is satisfied with the Governor’s report, he may declare President’s Rule under Article 356 but such proclamation is initially for a period of ________.","o":["two months","one month","six months","three months"],"a":2,"e":"Six months. Article 356 allows the President to issue a proclamation if a state's government cannot function according to the Constitution. The President can act based on the governor's report or independently. This proclamation must be approved by both Houses of Parliament within two months. It can be extended for a maximum of three years, with parliamentary approval every six months."},{"t":"President, VP & PM","n":347,"tag":"","q":"Among the following, which is not a qualification for membership in the Vidhan Sabha","o":["Not hold any office of profit","Have attained the age of 25 Years","Citizen of India","Knowledge of Politics"],"a":3,"e":"Knowledge of Politics. The Legislative Assembly, also known as the Vidhan Sabha, consists of a maximum of 500 members and a minimum of 60. Its tenure is five years, but the Governor can dissolve it before the completion of the period."},{"t":"President, VP & PM","n":348,"tag":"","q":"The minimum strength of the Council of Ministers in a state as per the Indian Constitution is ________ .","o":["12 persons","13 persons","15 persons","14 persons"],"a":0,"e":"12 persons. As per the Constitution (91st Amendment) Act, 2003, clause 1A was inserted into Article 164, which states: \"The total number of Ministers, including the Chief Minister, in the Council of Ministers of a State shall not exceed 15% of the total number of members of the Legislative Assembly of that State.\""},{"t":"President, VP & PM","n":349,"tag":"","q":"Who has the power to prorogue the House or either House of State Legislature from time to time ?","o":["Speaker","Governor","Chief Minister","Chairman"],"a":1,"e":"Governor. According to Article 174 (1) The Governor shall from time to time summon the House or each House of the Legislature of the State to meet at such time and place as he thinks fit, but six months shall not intervene between its last sitting in one session and the date appointed for its first sitting in the next session. Article 174 (2): The Governor may from time to time—(a) prorogue the House or either House; (b) dissolve the Legislative Assembly."},{"t":"President, VP & PM","n":350,"tag":"","q":"Which option is NOT correct in case of appointment of a Governor ?","o":["Citizen of India","Cannot hold any office of profit during his tenure","Appointed for six years","Should be at least 35 years"],"a":2,"e":"Appointed for six years. Governors in India are appointed by the President under Article 155 of the Constitution, with a tenure of five years. However, they serve at the President's pleasure and can be removed at any time."},{"t":"President, VP & PM","n":351,"tag":"","q":"On whose advice does the Governor appoint the ministers ?","o":["Prime Minister","President","Chief Minister","Vice-President"],"a":2,"e":"Chief Minister. According to Article 164, the Governor appoints the Chief Minister, who in turn advises the Governor on appointing other Ministers. The Ministers hold office at the pleasure of the Governor."},{"t":"President, VP & PM","n":352,"tag":"","q":"Who unfurls the flag at Rajpath on the Republic Day?","o":["The Chief of Defence Staff","The President of India","The Chief Minister of Delhi","The Prime Minister of India"],"a":1,"e":"The President of India takes the salute from various units of the Army, Navy, Air force, Para-military, and Police forces during the parade. This ceremony commemorates the adoption of the country's Constitution on January 26, 1950. The Prime Minister of India, on the other hand, hoists the national flag on Independence Day at the Red Fort."},{"t":"President, VP & PM","n":353,"tag":"","q":"The Governor’s emoluments are decided by the:","o":["Prime Minister","President","State Legislature","Parliament"],"a":3,"e":"Parliament. The Governor (Part VI, Article 153 -167) serves as a titular or constitutional head and acts as the agent of the central government. The Governor of State is appointed by the President. Article 158 (4) - The emoluments and allowances of the Governor cannot be diminished during his term of office. Article 158(3A) - When the same person is appointed as the Governor of two or more States, the emoluments and allowances payable to him are shared by the States."},{"t":"President, VP & PM","n":354,"tag":"","q":"The ministers in the state hold office during the pleasure of the:","o":["Deputy Chief Minister","Speaker of the Legislative Assembly","Chief Minister","Governor"],"a":3,"e":"Governor. Under Article 164 (1) The Chief Minister shall be appointed by the Governor and the other Ministers shall be appointed by the Governor on the advice of the Chief Minister, and the Ministers shall hold office during the pleasure of the Governor."},{"t":"President, VP & PM","n":355,"tag":"","q":"In which year did Dr. Sarvepalli Radhakrishnan assume office as the first Vice-President of India ?","o":["1954","1951","1952","1950"],"a":2,"e":"1952. Dr. Sarvepalli Radhakrishnan served as first vice president of India from 1952 to 1962 and the second president of India from 1962 to 1967. He received Bharat Ratna in 1954. Teachers' Day is celebrated on September 5 in India to honor him."},{"t":"President, VP & PM","n":356,"tag":"","q":"Which Article of the Indian Constitution mentions that ‘The President shall, notwithstanding the expiration of his/her term, continue to hold office until his successor enters upon his/her office’?","o":["Article 61","Article 56","Article 58","Article 50"],"a":1,"e":"Article 56. The President shall hold office for a term of five years. The President may, by writing under his hand addressed to the Vice-President, resign his office. Other important Articles: Article 61 - Procedure for impeaching the President of India. Article 58 - Qualifications for election as a President of India. Article 50 - The separation of the judiciary from the executive."},{"t":"President, VP & PM","n":357,"tag":"","q":"Which Article of the Indian Constitution mentions that an election to fill a vacancy caused by the expiration of the term of office of the President shall be completed before the expiration of the term?","o":["Article 59","Article 62","Article 61","Article 60"],"a":1,"e":"Article 62. This article also covers the scenario where a vacancy arises due to the President's death, resignation, or removal, requiring the election to be held within six months. Other articles: Article 59: Conditions of President’s office. Article 61: Procedure for impeachment of the President. Article 60: Oath or affirmation by the President."},{"t":"President, VP & PM","n":358,"tag":"","q":"Who was the second vice - President of India?","o":["VV Giri","Krishna Kant","Dr Zakir Hussain","Dr S Radhakrishnan"],"a":2,"e":"Dr Zakir Hussain (1962 -1967) - He was the third President of India from 1967-1969, and the first Indian President to die in office in 1969. He was awarded Bharat Ratna in 1963. First five vice presidents of India : First - Dr. Sarvepalli Radhakrishnan (1952-1962). Third - Sh. V.V. Giri (1967-1969). Fourth - Sh. Gopal Swarup Pathak (1969-1974). Fifth - Sh. B.D.Jatti (1974-1979)."},{"t":"President, VP & PM","n":359,"tag":"","q":"Consider the following statements:\n1. Article 112 provides for the annual financial statement at the Union level.\n2. Article 202 provides for the annual financial statement at the State level, which is laid before the Legislature by the Governor. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 112 relates to the Union Budget presented by the President, while Article 202 relates to the State Budget presented by the Governor."},{"t":"President, VP & PM","n":360,"tag":"","q":"When the President of India keeps a bill (except money bill and constitutional amendment bill) pending for an indefinite period, it is called______.","o":["absolute veto of the President","amendatory veto of the President","pocket veto of the President","suspensive veto of the President"],"a":2,"e":"Pocket veto of the President. Veto Power of the President of India is guided by Article 111. Three types of Veto Power: Absolute veto, Suspensive veto and Pocket veto. Absolute Veto: It refers to the power of the President to withhold his assent to a bill passed by the Parliament. The bill then ends and does not become an act. Suspensive Veto: The President uses a suspensive veto when he returns the bill to the Indian Parliament for its reconsideration."},{"t":"President, VP & PM","n":361,"tag":"","q":"The Governor of an Indian state before entering upon his office takes an oath or affirmation before ____________.","o":["the Chief Justice of the High Court exercising jurisdiction in relation to the State","the President of India","the Chief Minister of the concerned state","the Prime Minister of India"],"a":0,"e":"Article 159 - Oath or affirmation to the Governor by the Chief Justice of the High Court and in his Absence, senior most Judge of that Court available. Article 155 - The Governor of a State shall be appointed by the President. Article 153 - Governors of States."},{"t":"President, VP & PM","n":362,"tag":"","q":"What is the duty of the Chief Minister, as mentioned under Article 167 of the Indian Constitution?","o":["Communication of all decisions of the Council of Ministers to the Governor.","Appointment and removal of Council of the Ministers.","Appointment of the Speaker of the Legislative Assembly.","Appointment of Advocate General of the state in consultation with Attorney general."],"a":0,"e":"Article 167 imposes on the Chief Minister the responsibility of keeping the Governor informed of all decisions made by the Council of Ministers concerning administration and legislation. Article 178 - It deals with the corresponding position for Speaker and Deputy Speaker of the Legislative Assembly of a state."},{"t":"President, VP & PM","n":363,"tag":"","q":"Who among the following served the shortest tenure as the Prime Minister of India ?","o":["HD Deva Gowda","VP Singh","Chandra Shekhar","IK Gujral"],"a":2,"e":"Chandra Shekhar. Shri Gulzari Lal Nanda (11 January 1966 - 24 January 1966 and 27 May 1964 - 9 June 1964) served the shortest tenure as PM. H D Deva Gowda (June 1, 1996 - April 21, 1997) - 11th Prime Minister of India. V. P. Singh (December 2, 1989 - November 10, 1990) - 7th Prime Minister of India. Chandra Shekhar (10 November 1990 and 21 June 1991) - 8th Prime Minister of India. The longest-serving prime minister was Jawaharlal Nehru, (16 years and 286 days)."},{"t":"President, VP & PM","n":364,"tag":"","q":"Consider the following statements about the Inter-State Council:\n1. It is established under Article 263 of the Constitution.\n2. It is chaired by the Prime Minister of India.\n3. It consists of four Cabinet Ministers of the Union Council of Ministers nominated by the Prime Minister.\n4. Chief Ministers of all States are its members. Which of the above statements is/are correct?","o":["1, 2 and 4 only","1, 3 and 4 only","2 and 3 only","1, 2, 3 and 4"],"a":0,"e":"1, 2 and 4 only. Inter-State Council is a constitutional body under Article 263, established by the President to promote coordination between Centre and States. It is chaired by the Prime Minister and includes Chief Ministers of all States/UTs with legislatures, Administrators of UTs without legislatures, and Governors of States under President’s Rule. Additionally, six Union Cabinet Ministers are nominated by the Prime Minister as members."},{"t":"President, VP & PM","n":365,"tag":"","q":"Who appoints the Chief Justice of India ?","o":["Vice - President","President","Supreme Court Judge","Prime Minister"],"a":1,"e":"President. Article 124 (2) - Vests power on the President to appoint every Judge of the Supreme Court including the Chief Justice of India. Article 124 - States the establishment of the Supreme Court. Article 124 (3) - Qualification of Supreme court Judge."},{"t":"President, VP & PM","n":366,"tag":"","q":"Consider the following statements regarding the qualifications for the appointment of a Governor in India: A. A person must be a citizen of India and must have completed 35 years of age. B. The minimum age required to contest for the Lok Sabha election is 30 years. Which of the above statements is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":0,"e":"A only. Article 157 - Qualifications for appointment as Governor (must be a citizen of India and must have completed 35 years of age). Article 153 - Governors of States. Article 154 - Executive power of State. Article 155 - Appointment of Governor. Article 58 - The presidential candidate must complete the age of 35 years. Article 84 (b) - the minimum age for Lok Sabha election shall be 25 years, not 30, hence Statement B is incorrect."},{"t":"President, VP & PM","n":367,"tag":"","q":"Who administers the Union Territories of India?","o":["President","Prime Minister","Chief Minister","Member of Legislative Assembly"],"a":0,"e":"President. The administrator appointed by the President runs the administration on the behalf of the President. Part - VIII (Union Territories), Article 239 (Administration of Union territories). Article 239A (Creation of local legislatures or council of ministers or both for certain Union territories. Example (Pondicherry). Article 239AA (Special provisions with respect to Delhi)."},{"t":"President, VP & PM","n":368,"tag":"","q":"Which of the following statements are correct regarding the benefits of the retired President of India? A. The former President of India will also be entitled to a monthly pension of ₹2.5 lakh. B. He/She is entitled to a secretarial staff comprising a private secretary, a personal assistant, an additional private secretary, two peons, and office expenses up to ₹1 lakh per annum. C. He/She is also entitled to free highest-class travel anywhere in India, accompanied by one person, by rail, air, or steamer.","o":["A and B only","B and C only","A and C only","A, B and C"],"a":3,"e":"A, B and C. The President {Article (52-62)} of India is the head of state of the Republic of India. First President - Rajendra Prasad (held office for two terms, longest serving president of India)."},{"t":"President, VP & PM","n":369,"tag":"","q":"Who among the following Presidents of India was also the deputy chairman of the Planning Commission?","o":["VV Giri","KR Narayanan","Ramaswamy Venkataraman","Pranab Mukherjee"],"a":3,"e":"Dr. Pranab Mukherjee (13th president). Other positions he hold were Minister of Finance (2009 - 2012), Minister of Defence (2004 - 2006), Minister of External Affairs (2006 - 2009), 15th Leader of the Lok Sabha (2004 – 2012), Deputy Chairman of the Planning Commission (1991 - 1996), 14th Leader of the Rajya Sabha (1980 – 1984), Member of Parliament, Lok Sabha (2004 - 2012), and Member of Parliament, Rajya Sabha (1969 - 1981). V.V Giri (4th President), K.R Narayan (10th president). Ramaswamy Venkataraman (8th president)."},{"t":"President, VP & PM","n":370,"tag":"","q":"Which of the following statements about the Vice President of India is INCORRECT?","o":["Members of State legislatures do not take part in his elections.","He acts as the ex-officio Chairman of the Rajya Sabha.","The Vice President is elected for five years.","He can be removed from his office by the President approved through a resolution passed by the Lok Sabha and Rajya Sabha."],"a":3,"e":"Vice president of India: The vice president is elected for five years. Minimum age: 35. He acts as the ex-officio chairman of the Rajya sabha. In the electoral college for Vice President, both elected and nominated members of both the Houses of Parliament take part."},{"t":"President, VP & PM","n":371,"tag":"","q":"The emoluments and allowances of the President and other expenditure relating to his office is charged on the ______ of India.","o":["contingency fund","estimates fund","consolidated fund","public accounts fund"],"a":2,"e":"Consolidated Funds - Article 266(1). Three types of funds of the Central Government – Consolidated Fund of India - Revenues received by the government and expenses made by it, excluding the exceptional items. Contingency Fund of India (Article 267) - the emergency fund for the nation and Public Accounts of India (Article 266(2) - those funds that are received on behalf of the Government of India."},{"t":"President, VP & PM","n":372,"tag":"","q":"Which is NOT correct about the powers of the Chief Minister?","o":["He allocates portfolios among ministers.","He presides over the meetings of the Council of Ministers.","When he resigns or dies, it has no effect in the functioning of the council of ministers.","The Governor appoints ministers on His recommendations."],"a":2,"e":"The Governor appoints the Chief Minister and other Ministers (Article 164). The Chief Minister is the head of the State Council of Ministers and the real executive head of state government. Article 167 (Chief Minister acts as a link between Governor and state council of ministers)."},{"t":"President, VP & PM","n":373,"tag":"","q":"Who among the following is NOT appointed by the President of India?","o":["Ambassadors and High Commissioners","Comptroller and Auditor General of India","Attorney General of India","Solicitor General of India"],"a":3,"e":"Solicitor General of India (the second - highest law officer of the country) is appointed by the Appointments Committee of the Cabinet (ACC). Attorney Generals of India (Article 76). Comptroller and Auditor General of India (Article 148)."},{"t":"President, VP & PM","n":374,"tag":"","q":"Who among the following was the third Vice - President of India?","o":["BD Jatti","Zakir Hussain","Gopal Swarup Pathak","V. V. Giri"],"a":3,"e":"V. V. Giri. Vice Presidents of India - 1st Sarvepalli Radhakrishnan, 2nd- Zakir Hussain, 4th Gopal Swarup Pathak, 5th B D Jatti. 14th- Jagdeep Dhankhan."},{"t":"President, VP & PM","n":375,"tag":"","q":"The election of the next Vice - President is to be held within _____ of the expiry of the term of office of the outgoing Vice - President.","o":["90 days","60 days","120 days","75 days"],"a":1,"e":"60 days . Article 66 of the Constitution of India states the manner of election of the vice president."},{"t":"Judiciary","n":376,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Who among the following is the final interpreter of the Indian Constitution?","o":["The President of India","The Prime Minister","The Supreme Court of India","The Parliament"],"a":2,"e":"The Supreme Court of India. The Supreme Court of India, as the apex judicial body, holds the ultimate power to interpret the Constitution and exercise Judicial Review over laws and executive actions of both the Centre and States. Its decisions are final and binding, unless changed by a Constitutional amendment or a larger bench. The President, as head of the executive, can seek the Court’s advice under Article 143. The Prime Minister functions as the real executive authority, while the Parliament holds supreme legislative powers, including amendments under Article 368."},{"t":"Judiciary","n":377,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Under the Bharatiya Nyaya Sanhita, what is the punishment for mob lynching?","o":["House arrest","Fine only","Life imprisonment or death penalty","No punishment"],"a":2,"e":"The Bharatiya Nyaya Sanhita (BNS), 2023, which replaces the Indian Penal Code, has introduced a specific provision to deal with the crime of mob lynching. Section 103(2) of the BNS addresses this offense. It states that when a group of five or more individuals, acting in concert, commits murder on the grounds of race, caste, community, sex, place of birth, language, personal belief, or any other similar ground, each member of that group shall be punished with death or with imprisonment for life, and shall also be liable to a fine. This provision was specifically created to provide a stringent and clear punishment for hate crimes committed by mobs."},{"t":"Judiciary","n":378,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Which of the following statements is correct in the context of constitutional interpretation and judicial doctrine?","o":["The Constitution of India clearly defines the term \"basic structure\" under Article 368.","The Judiciary rejected the idea of spirit-based interpretation and strictly follows the written text.","The \"basic structure\" doctrine was brought into existence by the Supreme Court to protect the fundamental features of the Constitution.","The Parliament can propose amendments that repeal judicial principles without limitation."],"a":2,"e":"The Basic Structure Doctrine is a judicial principle evolved in Kesavananda Bharati v. State of Kerala (1973). The Supreme Court held that while Parliament can amend the Constitution under Article 368, it cannot alter or destroy its “basic structure”. This doctrine safeguards the core identity and fundamental features of the Constitution from being undermined by a temporary majority in Parliament."},{"t":"Judiciary","n":379,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"According to Section 21 of the Bharatiya Nagarik Suraksha Sanhita, 2023, which of the following statements is correct regarding the trial of offences under Sections 64 to 71 of the Bharatiya Nyaya Sanhita, 2023?","o":["The trial must be conducted by any police officer of the rank of DSP and above.","These offences must be tried only in a High Court under a male judge.","Such offences are exclusively triable by Executive Magistrates.","These offences shall, as far as practicable, be tried by a court presided over by a woman."],"a":3,"e":"According to Section 21 of the Bharatiya Nagarik Suraksha Sanhita, 2023, offences covered under Sections 64 to 71 of the Bharatiya Nyaya Sanhita, 2023—which relate to crimes against women such as sexual offences—are to be handled with sensitivity and care. The law states that such offences shall, as far as practicable, be tried by a court presided over by a woman. This provision aims to ensure a more empathetic and comfortable environment for victims during the trial process, promoting gender sensitivity and improving the judicial experience for women seeking justice."},{"t":"Judiciary","n":380,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Which of the following High Courts has jurisdiction over more than one state?","o":["Kerala High Court","Guwahati High Court","Delhi High Court","Patna High Court"],"a":1,"e":"Guwahati High Court. The Guwahati High Court (established in 1948) originally had jurisdiction over the entire Northeast region. At present, it has jurisdiction over Assam, Nagaland, Mizoram, and Arunachal Pradesh. Other Northeastern states such as Manipur, Meghalaya, and Tripura now have their own separate High Courts (established in 2013). Kerala High Court – Has jurisdiction only over Kerala and the Union Territory of Lakshadweep. Delhi High Court – Jurisdiction is limited to the National Capital Territory (NCT) of Delhi. Patna High Court – Jurisdiction is only over the state of Bihar."},{"t":"Judiciary","n":381,"tag":"","q":"Which of the following statements is correct regarding the jurisdiction of the Supreme Court of India?","o":["Article 30 of the Constitution of India gives the Supreme Court wide original jurisdiction.","Original jurisdiction extends to any dispute between the Government of India and one or more states.","The Supreme Court has very wide advisory jurisdiction over all courts and tribunals in India.","The original jurisdiction of the Supreme Court can be exercised by a certificate granted by the High Court."],"a":1,"e":"According to Article 131 of the Indian Constitution, the Supreme Court has original jurisdiction over any dispute arising between the Government of India and one or more States."},{"t":"Judiciary","n":382,"tag":"","q":"Consider the following statements regarding the first-ever motion to remove a Supreme Court Justice in India: A. The first motion to remove a Supreme Court Judge was signed in 1991 by 108 Members of Parliament. B. It was filed against Justice\nV. Ramaswami for alleged misconduct during his tenure as Chief Justice of the Allahabad High Court. Which one of the above statements is correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":0,"e":"Only A. The first motion to remove a Supreme Court Justice was signed in 1991 by 108 MPs against Justice V. Ramaswami. He was accused of financial and administrative misconduct during his tenure as Chief Justice of the Punjab and Haryana High Court (1987–1989), not the Allahabad High Court."},{"t":"Judiciary","n":383,"tag":"","q":"Which Article of the Constitution of India grants power to the President to appoint Judges of the Supreme Court?","o":["Article 124(2)","Article 123(1)","Article 127(3)","Article 128(4)"],"a":0,"e":"Article 124(2). It states that every Supreme Court judge is appointed by the President through a warrant, after consulting judges of the Supreme Court and High Courts as deemed necessary. Judges hold office until the age of sixty-five. Additionally, the Chief Justice of India must always be consulted for the appointment of judges other than the Chief Justice."},{"t":"Judiciary","n":384,"tag":"","q":"The Supreme Court of India comprises the Chief Justice and not more than ______ other Judges appointed by the President of India.","o":["37","35","38","33"],"a":3,"e":"33. The judges of supreme court are appointed by the president under the Article 124 (2) of the Indian Constitution. Supreme Court Judges retire at the age of 65. As per Article 124 (3) - In order to be appointed as a Judge of the Supreme Court, a person must be a citizen of India and must have been, for at least five years, a Judge of a High Court or an Advocate of a High Court for at least 10 years or he must be, in the opinion of the President, a distinguished jurist."},{"t":"Judiciary","n":385,"tag":"","q":"Consider the following statements regarding the Indian Constitution: A. Articles 214 to 231 in Part VI deal with the High Courts in the states. B. These Articles provide for the organization, independence, jurisdiction, powers, and procedures of the High Courts. Which of the above statements is/are correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Articles 214 to 231 in Part VI of the Indian Constitution deal with the High Courts in the states, covering their establishment, powers, jurisdiction, independence, and functioning."},{"t":"Judiciary","n":386,"tag":"","q":"Which writ is issued by a high court or supreme court when a lower court has considered a case going beyond its jurisdiction?","o":["Quo Warrant","Habeas Corpus","Certiorari","Prohibition"],"a":3,"e":"Prohibition. Writs are issued by the Supreme Court under Article 32 and by the High Court under Article 226 of the Indian Constitution. The five types of writs in India are: Habeas Corpus: Ensures that a detained person is brought before the court. Mandamus: Directs a public official to perform a duty. Certiorari: Transfers a case for review by a higher court. Prohibition: Prevents a lower court from exceeding its jurisdiction. Quo-Warranto: Questions the legal authority of someone holding a public office."},{"t":"Judiciary","n":387,"tag":"","q":"In which judgement did the Supreme Court extend the scope of Article 21 and observed that ‘the Right to education flows directly from the ‘Right to life’ ?","o":["Mohini Jain v State of Karnataka","Neerja Choudhari v State of M. P.","Kharak Singh v State of UP","Malak Singh v State of Punjab"],"a":0,"e":"Mohini Jain v State of Karnataka. The Supreme Court declared that it was impermissible for any educational institution to charge capitation fees as a consideration for admission. Neeraja Chaudhary vs. State of Madhya Pradesh - addressed the issue of bonded labor. Kharak Singh v State of UP - focused on the constitutional review of Uttar Pradesh Police Regulations."},{"t":"Judiciary","n":388,"tag":"","q":"Which Article of the Indian Constitution mentions that the law declared by the Supreme Court shall be binding on all the courts within the territory of India?","o":["Article 151","Article 147","Article 137","Article 141"],"a":3,"e":"Article 141. Other Articles: Article 137 - Review of judgments or orders by the Supreme Court. Article 147 - Any substantial question of law as to the interpretation of the Constitution shall be construed as including references to any substantial question of law as to the interpretation. Article 151 - Audit reports."},{"t":"Judiciary","n":389,"tag":"","q":"Which of the following statements are correct regarding the jurisdiction of the Supreme Court of India? A. Original jurisdiction extends to any dispute between the Government of India and one or more States or between the Government of India and any State or States on one side and one or more States on the other or between two or more States. B. Appellate Jurisdiction extends when the Union plus some States are one side and some other States on the other side of the dispute. C. Under Articles 129 and 142 of the Constitution, the Supreme Court has been vested with the power to punish for contempt of court. D. As of now, the International Commercial Arbitration cannot be initiated in the Supreme Court.","o":["B and D only","A and C only","A, B, C and D","A and B only"],"a":1,"e":"A and C only. Advisory Jurisdiction (Article 143) - The President to seek the opinion of the Supreme Court. The appellate jurisdiction of the Supreme Court can be invoked by a certificate granted by the High Court concerned under Article 132(1), 133(1) or 134 of the Constitution. The Supreme Court (Article 124) of India is the apex judicial body under the Constitution of India. Inaugurated - On January, 28, 1950."},{"t":"Judiciary","n":390,"tag":"","q":"The advisory board under provisions of Article 22 of the Constitution is to consist of persons who are, or have been or are qualified to be appointed as __________.","o":["Judges of Supreme court","Judges of Lower court","Judges of High court","Judges of District court"],"a":2,"e":"Judges of High court. Related Articles : Article 214 - High Courts for States. Article 215 - High Courts to be courts of record. Article 216 - Constitution of High Courts. Article 217 - Appointment and conditions of the office of a Judge of a High Court. Article 218 - Application of certain provisions relating to the Supreme Court to High Courts. Article 219 - Oath or affirmation by Judges of High Courts. Article 220 - Restriction on practice after being a permanent Judge."},{"t":"Judiciary","n":391,"tag":"","q":"Consider the following statements regarding the Federal Court of India: A. The Federal Court of India was established in Delhi under the Government of India Act, 1935, and started functioning from 1937. B. It served as the highest judicial body in India until it was replaced by the Supreme Court of India in 1950. Which of the above statements is/are correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The Federal Court of India was set up under the Government of India Act, 1935, and began functioning in 1937. It was created to resolve disputes between provinces and federal states and remained active until 1950, when the Supreme Court of India replaced it. Calcutta High Court (1862) is the oldest High Court in India, and Justice Harilal Jekisundas Kania was the first Chief Justice of independent India."},{"t":"Judiciary","n":392,"tag":"","q":"Consider the following statements regarding the Supreme Court of India: A. Article 124 of the Indian Constitution provides that there shall be a Supreme Court of India. B. Article 121 deals with restrictions on discussion in Parliament regarding the conduct of judges of the Supreme Court or a High Court. Which of the above statements is/are correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Article 124 establishes the Supreme Court of India, laying down its structure and provisions for appointment of judges. Article 121 restricts Parliament from discussing the conduct of Supreme Court or High Court judges except during impeachment proceedings. Article 122 states that courts cannot inquire into parliamentary proceedings."},{"t":"Judiciary","n":393,"tag":"","q":"Disputes between two or more states come under the _______ of the Supreme Court.","o":["original jurisdiction","advisory jurisdiction","Appellate Jurisdiction","writ jurisdiction"],"a":0,"e":"Original jurisdiction - The power to hear and determine a dispute in the first instance. It is provided under Article 131 of the Indian Constitution. Article 143 of the Indian Constitution confers upon the Supreme Court advisory jurisdiction. Article 133 - Appellate jurisdiction of Supreme Court in appeals from High Courts in regard to civil matters."},{"t":"Judiciary","n":394,"tag":"","q":"In which of the following cases the Supreme Court, while laying out the 'basic structure' of the Constitution held that the democratic character of the polity was an essential component of the 'basic structure\" ?","o":["Romesh Thappar vs State of Madras","AK Gopalan vs State of Madras","Kesavananda Bharati vs State of Kerala","Sajjan Singh vs State of Rajasthan"],"a":2,"e":"This judgement was delivered on 24 April 1973. The case was filed by Sri Kesavananda Bharati (head of a Hindu religious mutt in Kerala), challenging the constitutional validity of the 24th, 25th and 29th Amendments to the Indian Constitution. Romesh Thappar vs State of Madras: Freedom of speech and expression includes Freedom of press. AK Gopalan vs State of Madras - Deals with the constitutionality of preventive detention. Sajjan Singh vs State of Rajasthan - Involved a challenge to the validity of the Constitution (26th Amendment) Act."},{"t":"Judiciary","n":395,"tag":"","q":"Consider the following statements regarding important Supreme Court judgments: A. In the State of Kerala vs Leesamma Joseph case, the Supreme Court held that persons with disabilities are entitled to reservation in promotions under Article 16. B. In the Shayara Bano vs Union of India case, the Supreme Court struck down the practice of triple talaq as unconstitutional. Which of the above statements is/are correct?","o":["Only A","Only B","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The Leesamma Joseph case recognized reservation in promotions for persons with disabilities under Article 16, ensuring equal opportunity in employment. The Shayara Bano case (2017) declared instant triple talaq (talaq-e-biddat) unconstitutional, reinforcing gender justice and equality. The Kesavananda Bharati case (1973) laid down the Basic Structure Doctrine of the Constitution."},{"t":"Judiciary","n":396,"tag":"","q":"The Supreme Court of India came into existence on ___________ .","o":["30 January 1935","26 January 1950","15 August 1947","2 October 1952"],"a":1,"e":"26 January 1950. The Supreme Court was inaugurated in the Chamber of Princes in the Parliament House on January 28, 1950. The foundation stone of the Supreme Court building was laid by the first President of India, Rajendra Prasad, on October 29, 1954. The 50th Chief Justice of India is Dhananjaya Y. Chandrachud."},{"t":"Judiciary","n":397,"tag":"","q":"Till which year did the High Court of Delhi continue to exercise jurisdiction over Himachal Pradesh?","o":["1969","1967","1971","1968"],"a":2,"e":"1971. The Indian High Courts Act (1861) established High Courts of Calcutta, Madras and Bombay. The first high court of India was established in Kolkata and formally it was called the High Court of Judicature at Fort William. India has 25 High Courts (now). Article 214 - High Court for each State. Article 226 - Power of high court to issue certain writs. Article 216 - Constitution of High Court."},{"t":"Judiciary","n":398,"tag":"","q":"Which of the following statements are true regarding the Family Courts (Amendment) Bill, 2022?\n1. The Family Courts (Amendment) Bill was introduced in Lok Sabha on 18 July 2022.\n2. The Bill amends the Family Courts Act, 1984.\n3. The Act allows state governments to establish Family Courts.\n4. The Act is not applicable in Punjab and Tamil Nadu.","o":["1, 2 and 3","1, 3 and 4","1, 2 and 4","2, 3 and 4"],"a":0,"e":"1, 2 and 3. Family Courts (Amendment) Bill 2022 seeks to amend the Family Courts Act, 1984 to establish family courts in Himachal Pradesh and Nagaland. Family Court Act, 1984 - Enacted for the establishment of Family Courts with a view to promote conciliation, and secure speedy settlement of disputes relating to marriage and family affairs and for related matters."},{"t":"Judiciary","n":399,"tag":"","q":"The High court of Delhi was established in _______.","o":["1962","1947","1951","1966"],"a":3,"e":"1966. The High Court of Delhi was established with four Judges. They were Chief Justice K.S.Hegde, Justice I.D. Dua, Justice H.R.Khanna and Justice S.K.Kapur. Before 1966 under the States Reorganisation Act, 1956 Delhi was under the jurisdiction of the Punjab High Court."},{"t":"Judiciary","n":400,"tag":"","q":"The first High Court in India was established in ______________ .","o":["1860","1862","1867","1857"],"a":1,"e":"1862 . Calcutta High Court: It was brought into existence under the High Court's Act (1861). Location - Esplanade Row West (Kolkata). Jurisdiction - West Bengal and the Andaman and Nicobar Islands. Bombay High Court {(14 August 1862) (Indian High Courts Act 1861)}, Madras High Court {(15 August 1862, Indian High Courts Act 1861}."},{"t":"Judiciary","n":401,"tag":"","q":"In which of the following cases did the Supreme Court of India pronounce the theory of the ‘Basic Structure’ of the Constitution?","o":["Kesavananda Bharati Case, 1973","Golaknath Case, 1967","Minerva Mills Case, 1980","Swarn Singh Case, 1989"],"a":0,"e":"Kesavananda Bharati Case, 1973 - Parliament can not amend or alter the ‘Basic Structure’ of the constitution. Golaknath Case, 1967 - Parliament cannot take away or abridge any of the Fundamental Rights. Minerva Mills Case, 1980 - Parliament can amend any part of the Constitution but it cannot change the “Basic Structure” of the Constitution. Swarn Singh Case, 1998 - In this case, the SC held the UP Governor's pardon of a convict unconstitutional."},{"t":"Judiciary","n":402,"tag":"","q":"Consider the following statements regarding the structure of the Indian judiciary: A. The Supreme Court is at the top, High Courts are in the middle, and subordinate courts are at the bottom. B. The Indian judiciary follows a three-tier unified system. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The judiciary in India has a three-tier structure: the Supreme Court (Article 124) at the top, High Courts (Article 214) at the state level, and subordinate courts (district and sessions courts) at the bottom, making it a unified system."},{"t":"Judiciary","n":403,"tag":"","q":"A judge of the Supreme Court can be removed only on the grounds of ______.","o":["disrespect of the Constitution","proven misbehaviour or incapacity","murder charges","lack of knowledge"],"a":1,"e":"Proven misbehaviour or incapacity. Article 124 - There shall be a Supreme Court of India. Article 143 - Power of the President to consult the Supreme Court."},{"t":"Judiciary","n":404,"tag":"","q":"Consider the following statements regarding the jurisdiction of the Supreme Court of India: A. The Original jurisdiction of the Supreme Court (Article 131) allows it to settle disputes between the Centre and States, and among States. B. The Advisory jurisdiction of the Supreme Court (Article 143) deals with disputes between the Union and the States. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":0,"e":"A only. The Original Jurisdiction (Article 131) empowers the Supreme Court to adjudicate disputes between the Centre and States or among States. The Advisory Jurisdiction (Article 143) only enables the President to seek the Court’s opinion, not to decide such disputes."},{"t":"Judiciary","n":405,"tag":"","q":"A Supreme Court or High Court judge can be removed by the Parliament by:","o":["simple majority","both simple and two third majority","special majority","two third majority"],"a":2,"e":"Special majority. Special majority as per Article 249 requires a majority of 2/3rd members present and voting. For example, if out of the 245 members in Rajya Sabha, only 150 are present and voting, then the special majority required as per Article 249 would be 101. Simple majority refers to a majority of more than 50% of the members present and voting in the House. Majorities in the Constitution can be categorised into four Types : Absolute, Effective, Simple and Special."},{"t":"Judiciary","n":406,"tag":"","q":"Which is NOT correct about the independence of the judiciary in our country?","o":["The judiciary has the power to penalise those who are found guilty of contempt of court.","The judges are financially dependent on both the executive and legislature for their salaries and allowances.","The Constitution prescribes a very difficult procedure for removal of judges.","The legislature is not involved in the process of appointment of judges."],"a":1,"e":"Judges salaries and allowances are fixed and not subject to legislative approval. Supreme Court Judges {The Salaries, Pension and Allowances are charged upon the Consolidated Fund of India (Article 266 (1)}, High Court Judges {Salaries and Allowances are charged upon the Consolidated Fund of the States and the Pension is charged on the Consolidated Fund of India} ."},{"t":"Judiciary","n":407,"tag":"","q":"The Indian judicial system is based on:","o":["both integrated and dual system","dual court system","multiple court system","single integrated system"],"a":3,"e":"single integrated system. The judiciary is the watchdog of democracy, and also the guardian of the Constitution. Structure of Indian Judiciary {Supreme Court at the top, High Courts are below the SC, and below them are the district and subordinate courts}."},{"t":"Government Bodies","n":408,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following commissions is NOT a statutory body in India ?","o":["National Commission for Scheduled Tribes","National Human Rights Commission","National Commission for Farmers","National Commission for Women"],"a":2,"e":"National Commission for Farmers. A statutory body is one created by a law (Act of Parliament/State Legislature). National Commission for Farmers (NCF) – set up in 2004 as an advisory body/committee under M.S. Swaminathan (not statutory, only an expert commission). National Commission for Scheduled Tribes (NCST) – statutory body under Article 338A, established through the 89th Constitutional Amendment Act, 2003. National Human Rights Commission (NHRC) – Statutory body under the Protection of Human Rights Act, 1993. National Commission for Women (NCW) – statutory body under the National Commission for Women Act, 1990."},{"t":"Government Bodies","n":409,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which of the following statement(s) is/are correct regarding the Bharatiya Nyaya Sanhita (BNS)?\n1. The Bharatiya Nyaya Sanhita introduces community service as a punishment for minor offences.\n2. The scope of summary trials has been limited to only serious offences under the new law.\n3. The reformative approach aims to ensure societal reintegration of offenders.","o":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2, and 3 all are correct"],"a":1,"e":"1 and 3 only. The Bharatiya Nyaya Sanhita (BNS) 2023 is India's new criminal code, enacted to replace the colonial-era Indian Penal Code (IPC) of 1860, with provisions coming into effect from July 1, 2024. It introduces community service as punishment for minor offences (Statement 1) and adopts a reformative approach to help offenders reintegrate into society (Statement 3). However, the scope of summary trials has been expanded to more petty offences, not limited to serious ones."},{"t":"Government Bodies","n":410,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Given below are two statements marked as\nAssertion (A) and\nReason (R). Read and mark the correct options:\nAssertion (A): The Bharatiya Nagarik Suraksha Sanhita, 2023, promotes e-filing and virtual trials to expedite the justice delivery system.\nReason (R): The integration of technology aims to reduce case pendency and enhance accessibility to justice.","o":["Both A and R are true, and R is the correct explanation of A.","A is false, but R is true.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false."],"a":0,"e":"The Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023, replaces the CrPC and emphasizes digitalisation of justice through e-filing, electronic communication of summons, and virtual trials. The reason given directly explains the purpose—to cut delays and make justice more accessible."},{"t":"Government Bodies","n":411,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which level of the Panchayati Raj system operates at the village level?","o":["Panchayat Samiti","Zila Parishad","Gram Panchayat","Gram Sabha"],"a":2,"e":"The Gram Panchayat is the executive body at the village level in the three-tier Panchayati Raj system (Village → Block → District). It handles local administration, development works, and welfare schemes for the village. The three-tier Panchayati Raj system was given constitutional status and made mandatory for states with a population of over 20 lakhs through the 73rd Constitutional Amendment Act of 1992. This landmark amendment added a new Part IX (\"The Panchayats\") to the Constitution"},{"t":"Government Bodies","n":412,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"What is the role of the Foreigners' Tribunal in the NRC (National Register of Citizens) process?","o":["To conduct the Census","To issue voter ID cards","To deport illegal immigrants","To verify citizenship claims of individuals excluded from the NRC"],"a":3,"e":"Foreigners' Tribunals are quasi-judicial bodies, established under the Foreigners' Act of 1946 and Foreigners (Tribunals) Order, 1964, to determine if a person suspected of being a foreigner is, in fact, one."},{"t":"Government Bodies","n":413,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"What is the role of the finance minister under the FRBM Act?","o":["To regulate the stock market","To oversee disinvestment strategies","To manage foreign trade policies","To present fiscal policy statements to Parliament"],"a":3,"e":"The Fiscal Responsibility and Budget Management (FRBM) Act, 2003, was enacted to ensure fiscal discipline, transparency, and accountability in the government's financial operations. A key requirement under this Act is that the Union Finance Minister must, along with the annual Union Budget, present the following three statements before both Houses of Parliament: The Macro-Economic Framework Statement; The Medium-Term Fiscal Policy Statement; and The Fiscal Policy Strategy Statement. These documents provide a transparent overview of the government's fiscal position and its roadmap for achieving targets related to fiscal deficit, revenue deficit, and public debt."},{"t":"Government Bodies","n":414,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Which of the following accurately describes the statutory responsibilities of the Lokpal under the Lokpal and Lokayuktas Act, 2013?","o":["The Lokpal is mandated to provide the President with an annual report, which will be laid before both Houses of Parliament.","The Lokpal operates under the direct administrative control of the Prime Minister's Office.","The Lokpal must submit regular reports to the Election Commission for public disclosure.","The Lokpal is a constitutional body tasked with making final judgments in corruption cases."],"a":0,"e":"Under Section 48 of the Lokpal and Lokayuktas Act, 2013, the Lokpal is mandated to submit an annual performance report to the President of India, who must then place it before both Lok Sabha and Rajya Sabha for parliamentary scrutiny and transparency. The Lokpal, established as an independent statutory body under Section 3 of the Act, serves as a dedicated anti-corruption authority, functioning free from executive influence."},{"t":"Government Bodies","n":415,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Statutory grants to states by the Union government, under Article 275 of the Constitution, are primarily recommended by which body?","o":["National Development Council","Finance Commission","Ministry of Finance","NITI Aayog"],"a":1,"e":"Finance Commission. Article 275 of the Constitution provides for statutory grants-in-aid from the Union to certain states. These grants are given to help states meet the costs of schemes for welfare of Scheduled Tribes, administration of Scheduled Areas, and other special needs. The Finance Commission (constituted every 5 years under Article 280) recommends: Distribution of net tax proceeds between Centre and States. Grants-in-aid of revenues of the states under Article 275. Measures to improve fiscal stability."},{"t":"Government Bodies","n":416,"tag":"","q":"How many other members are there in the Finance Commission EXCEPT, Chairman ?","o":["6","4","3","5"],"a":1,"e":"4. The Finance Commission is a constitutional body set up by the President of India under Article 280 of the Indian Constitution. Its primary function is to recommend the distribution of financial resources between the Union (Central Government) and States. The Commission is set up for a period of five years."},{"t":"Government Bodies","n":417,"tag":"","q":"In which of the following years was the Election Commission of India founded?","o":["1955","1952","1950","1947"],"a":2,"e":"1950. Election Commission of India (ECI) is a permanent Constitutional Body. The Commissioners have a fixed tenure of six years , or up to the age of 65 years, whichever is earlier."},{"t":"Government Bodies","n":418,"tag":"","q":"What is the tenure of office for the Chief Election Commissioner?","o":["6 years or up to the age of 65 years","5 years or up to the age of 65 years","5 years or up to the age of 60 years","6 years or up to the age of 60 years"],"a":0,"e":"6 years or up to the age of 65 years. Article 324 - Superintendence, direction and control of elections to be vested in an Election Commission : (2) The Election Commission shall consist of the Chief Election Commissioner and such number of other Election Commissioners, if any, as the President may from time to time fix and the appointment of the Chief Election Commissioner and other Election Commissioners shall, subject to the provisions of any law made in that behalf by Parliament, be made by the President."},{"t":"Government Bodies","n":419,"tag":"","q":"Who among the following is NOT a member of the National Human Rights Commission?","o":["District Magistrate","Former Chief Justice of the High Court","Former Chief Justice of the Supreme Court","Former Judge of the Supreme Court"],"a":0,"e":"District Magistrate : They are administrative officers who are responsible for maintaining law and order in their respective districts. National Human Rights Commission (NHRC): It is a statutory body established on October 12, 1993."},{"t":"Government Bodies","n":420,"tag":"","q":"Consider the following statements regarding the Election Commission of India: A. The Election Commission is dealt with under Part XV of the Indian Constitution (Articles 324–329). B. The Election Commission of India was established on 25th January 1950 as an autonomous constitutional authority. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Part XV (Articles 324–329) of the Constitution deals with elections and the Election Commission, which was established on 25th January 1950 to conduct free and fair elections in India."},{"t":"Government Bodies","n":421,"tag":"","q":"UPSC is a Constitutional Body to conduct examinations for appointments to the services of the Union and the services of the State, respectively, under Article ________","o":["320","324","328","332"],"a":0,"e":"Article 320. Article 324 establishes a single Commission to oversee elections to the Central Legislature, including both the Upper and Lower Houses. Article 328 grants state legislatures the authority to create provisions for elections to their respective legislatures, including the preparation of electoral rolls, delimitation of constituencies, and other arrangements for the constitution of the legislature. Article 332 reserves seats in state legislative assemblies for Scheduled Castes and Scheduled Tribes."},{"t":"Government Bodies","n":422,"tag":"","q":"Consider the following statements regarding Public Service Commissions in India: A. The Union Public Service Commission (UPSC) functions as the central recruitment agency, while each State has its own Public Service Commission. B. The establishment of Union, State, and Joint Public Service Commissions reflects the federal character of the Indian Constitution. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. UPSC, SPSC, and Joint PSC are constitutional bodies, and their existence represents the federal principle by dividing recruitment functions between the Union and the States."},{"t":"Government Bodies","n":423,"tag":"","q":"The Office of the Registrar General and Census Commissioner, India comes under the:","o":["Ministry of Finance","Ministry of Home Affairs","Ministry of Corporate Affairs","Ministry of Rural Development"],"a":1,"e":"Ministry of Home Affairs. Registrar General and Census Commissioner of India, founded in 1961 by the Government of India, Ministry of Home Affairs, for arranging, conducting and analysing the results of the demographic surveys of India including Census of India and Linguistic Survey of India. Headquarters - Delhi."},{"t":"Government Bodies","n":424,"tag":"","q":"Who among the following are eligible for free legal aid under the National Legal Services Authority? A. A member of a Scheduled Caste or Scheduled Tribe. B. A victim of trafficking in human beings or beggar as referred to in Article 23 of the Constitution C. An industrial workman D. A person under circumstances of undeserved want such as being a victim of a mass disasters E. To file any case in Supreme Court, if any person needs free legal aid, the person’s annual income must be below 10 lakhs.","o":["A, B, C and D only","A, B and E only","B, C and D only","A, B, C, D and E"],"a":0,"e":"A, B, C and D only. According to the National Legal Services Authority (NALSA), the following individuals are eligible for free legal aid: women and children, mentally ill or disabled persons, and victims of mass disasters, violence, floods, droughts, earthquakes, and industrial disasters. NALSA was founded in 1995 under the Legal Services Authorities Act of 1987 to provide free legal services to the weaker sections of society. Its headquarters is located in New Delhi."},{"t":"Government Bodies","n":425,"tag":"","q":"The Finance Commission of India consists of ________.","o":["a Chairperson and four other members","a Chairperson and three other members","a Chairperson and two other members","a Chairperson and five other members"],"a":0,"e":"A Chairperson and four other members. The Finance Commissions are periodically constituted by the President of India under Article 280 of the Indian Constitution. Its main function is to recommend the distribution of tax revenues between the central government and the states. The first finance commission was constituted in 1951. It is constituted for every five years."},{"t":"Government Bodies","n":426,"tag":"","q":"Consider the following statements about the Finance Commission under the Indian Constitution: A. The recommendations of the Finance Commission are mentioned in Article 281, which requires the President to lay them before both Houses of Parliament with an explanatory memorandum. B. Articles 282 and 283 deal with expenditure from Union/State revenues and custody of Consolidated and Contingency Funds. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Article 281 specifically deals with the Finance Commission’s recommendations, while Articles 282–283 cover financial provisions regarding Union and State funds."},{"t":"Government Bodies","n":427,"tag":"","q":"What is the maximum age for a member of a joint public service commission to hold his/her office as per the Constitution of India ?","o":["62 years","66 years","65 years","60 years"],"a":0,"e":"62 years. Joint State Public Service Commission (JSPSC) - It can be created by an act of Parliament at the request of the state legislatures concerned. It is a statutory body. Its chairman is appointed by the President. A member of a Public Service Commission shall hold office for a term of six years. In the case of the Union Commission, his or her minimum age is 65 years to attain the office."},{"t":"Government Bodies","n":428,"tag":"","q":"Who was the first chairman of Finance Commission of India?","o":["K Santhanam","KC Neogy","Ashok Kumar Chanda","PV Rajamannar"],"a":1,"e":"KC Neogy. The Finance Commission of India is an independent constitutional body that is set up by the President of India after every five years or earlier to make recommendations on the distribution of financial resources between the Union and the states."},{"t":"Government Bodies","n":429,"tag":"","q":"Under which of the following Acts was the National Commission for Women established?","o":["The National Commission for Women Act, 1988","The National Commission for Women Act, 1990","The National Commission for Women Act, 1989","The National Commission for Women Act, 1987"],"a":1,"e":"The National Commission for Women is a statutory body set up in January 1992 under the National Commission for Women Act, 1990 to review the constitutional and legal safeguards for women; recommend remedial legislative measures; facilitate redressal of grievances and advise the Government on all policy matters affecting women. The First Commission was constituted on 31st January 1992 with Mrs. Jayanti Patnaik as the Chairperson."},{"t":"Government Bodies","n":430,"tag":"","q":"Which of the following is responsible for attending to disputes concerning recruitment and conditions of service of public personnel at the Centre?","o":["Central Administrative Tribunal","The Settlement and Appellate Tribunal","The Competition Appellate Tribunal","Joint Administrative Tribunal"],"a":0,"e":"Central Administrative Tribunal (CAT) - It is a Statutory body, established under Administrative Tribunals Act, 1985. It comes under the purview of Article 323-A (Added by 42nd amendment act 1976). Its chairman and members are appointed by the President after consulting the Chief justice of India."},{"t":"Government Bodies","n":431,"tag":"","q":"Consider the following statements regarding the State Election Commissioner (SEC) in India: A. The State Election Commissioner is appointed by the Governor of the state. B. The SEC is responsible for conducting free, fair, and impartial elections to local bodies in the state. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The Governor appoints the State Election Commissioner (SEC) under Article 243K (for Panchayats) and Article 243ZA (for Municipalities). The SEC is responsible for conducting free, fair, and impartial elections to local bodies in the state. The SEC functions independently and cannot be removed from office except in the manner and on the grounds prescribed for a High Court judge, ensuring autonomy and fairness in the electoral process."},{"t":"Government Bodies","n":432,"tag":"","q":"Who conducts elections for both the houses of Parliament in India?","o":["Ministry of Parliamentary Affairs","Election Commission","President","Prime Minister"],"a":1,"e":"Election Commission - established in 1950. Part XV Election Commission (324 - 329): Article 326 - Elections to the House of the People and to the Legislative Assemblies of States to be on the basis of adult suffrage."},{"t":"Government Bodies","n":433,"tag":"","q":"In India, which Ministry issues the coins of all denominations ?","o":["Ministry of External Affairs","Ministry of Home Affairs","Ministry of Mines","Ministry Of Finance"],"a":3,"e":"Ministry of Finance. The Government of India has the sole right to mint coins. The responsibility for coinage vests with the Government of India in accordance with the Coinage Act, 1906 as amended from time to time. The designing and minting of coins in various denominations is also the responsibility of the Government of India. Coins are minted at the four Indian Government Mints at Mumbai, Alipore (Kolkata), Saifabad (Hyderabad), Cherlapally (Hyderabad) and Noida (UP). It is issued for circulation only through the Reserve Bank in terms of the RBI Act."},{"t":"Government Bodies","n":434,"tag":"","q":"The Chairman of a State Public Service Commission can be removed by the order of the __________ .","o":["Prime Minister","President","Governor","Chief Minister"],"a":1,"e":"President. Provisions regarding the composition of SPSC provided in Part XIV of the Article 315 - 323. Article 317: Removal and suspension of a member of both the UPSC or SPSC. Article 316 (Appointment and terms of office of Members) : The Chairman and other members of the SPSC are appointed by the Governor of the State. Term of Office: A member of the SPSC shall hold office for a term of six years or till the age of 62 years, whichever is earlier."},{"t":"Government Bodies","n":435,"tag":"","q":"Which of the following statements is/are correct regarding the Finance Commission of India? A. The Finance Commission consists of a Chairman and four other members. B. The recommendations made by the Finance Commission are binding on the government and government needs to grant funds according to the advice of the Commission. C. Article 280 of the Indian Constitution talks about the recommendations of the Finance Commission.","o":["A and B only","A, B and C","A only","B and C only"],"a":2,"e":"A only. Finance Commission (FC) is a constitutional body under Article 280. It is set up after every five years or earlier to make recommendations on the distribution of financial resources between the Union and the states."},{"t":"Government Bodies","n":436,"tag":"","q":"Which of the following is NOT a Constitutional Body in India?","o":["Election Commission of India","State Human Rights Commission","State Public Service Commission","Union Public Service Commission of India"],"a":1,"e":"State Human Rights Commission - It is a Statutory body, established under protection of human right act 1993. The Chairman and the members of the State Commission are appointed by the Governor. Tenure - Three years or till they reach the age of 70 years."},{"t":"Government Bodies","n":437,"tag":"","q":"In which year did the Election Commission of India for the first time in its history become a multi member body?","o":["2004","2014","1995","1989"],"a":3,"e":"1989. The Election Commission of India (ECI) is a constitutional body. The Election Commissioner Amendment Act, 1989 (adopted on 1 January 1990) turned the commission into a 3-member Commission. The ECI body administers elections to the Lok Sabha, Rajya Sabha, State Legislative Assemblies, State Legislative Councils and the offices of the President and the Vice President of the country."},{"t":"Government Bodies","n":438,"tag":"","q":"The Gram Sabha is a meeting of all adults who live in the area covered by a ___________.","o":["district","city","state","panchayat"],"a":3,"e":"Panchayat. The term Gram Sabha is defined in the Constitution of India under Article 243(b). Gram Sabha is the primary body of the Panchayati Raj system and by far the largest. It is a permanent body. The power to annul a decision of the Gram Sabha rests with the Gram Sabha only. Related Articles - 243A - Constitution of Gram Sabha."},{"t":"Government Bodies","n":439,"tag":"","q":"The Bureau of Indian Standard is a statutory body working under the aegis of which union ministry?","o":["Ministry of Commerce and Industry","Ministry of Micro, Small & Medium Enterprises","Ministry of Corporate Affairs","Ministry of Consumer Affairs, Food and Public Distribution"],"a":3,"e":"The Ministry of Consumer Affairs, Food and Public Distribution . It operates various schemes like Product Certification (ISI mark), Management Systems Certification, Hallmarking of Gold and Silver Jewellery/Artefacts and Laboratory Services. Bureau of Indian Standards (BIS), earlier known as the Indian Standards Institution (ISI), was founded in 1947."},{"t":"Government Bodies","n":440,"tag":"","q":"Which of the following is NOT one of the objectives of the NITI Aayog ?","o":["To develop mechanisms to formulate credible plans at the village level","To design and print new currency notes and to bring them in circulation","To pay special attention to the sections of our society that may be at risk of not benefiting adequately from economic progress.","To evolve a shared vision of national development priorities."],"a":1,"e":"NITI Aayog: National Institution for Transforming India, Established: 1 January 2015, Chairman: Prime Minister of India, First Chairman: Narendra Modi, First CEO (Chief Executive Officer): Sindhushree Khullar, First Vice - Chairperson: Arvind Panagariya."},{"t":"Government Bodies","n":441,"tag":"","q":"Consider the following statements regarding elections to Panchayati Raj institutions: A. The State Election Commission conducts elections to Panchayati Raj institutions in the states. B. The State Election Commission is responsible for preparing electoral rolls, fixing dates for nominations and polls, and counting votes. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The State Election Commission is empowered to conduct elections to Panchayati Raj bodies, prepare electoral rolls, schedule nominations and polling dates, and oversee counting of votes, ensuring free and fair local elections."},{"t":"Government Bodies","n":442,"tag":"","q":"The State Finance Commission is appointed every_____ years by the_______","o":["5, state government","5, central government","2.5, state government","2.5, central government"],"a":0,"e":"5, state government . According to Article 243 (I), the Governor of a State shall establish a State Finance Commission rd (constitutional body) every 5 years (73 Amendment Act 1992). It distributes state resources to Panchayati Raj institutions at all three levels in the form of taxes, duties, and levies to be collected by the state and local governments."},{"t":"Government Bodies","n":443,"tag":"","q":"Consider the following statements regarding the National Commission for Protection of Child Rights (NCPCR): A. The NCPCR was established in 2007 under the Commission for Protection of Child Rights (CPCR) Act, 2005. B. The NCPCR functions under the Ministry of Women and Child Development, Government of India. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The NCPCR is a statutory body created to protect and promote child rights in India, established in 2007 through the CPCR Act, 2005, and operates under the Ministry of Women and Child Development, GoI."},{"t":"Government Bodies","n":444,"tag":"","q":"What is the tenure of the Chairperson of National Human Rights Commission?","o":["Three Years","Five Years","Six Years","Four Years"],"a":0,"e":"Three years (or until they attain the age of 70 years). National Human Rights Commission: Statutory body, Founded: 12 October, 1993, Composition: chairperson, five full-time Members and seven deemed Members, Appointed by the President."},{"t":"Government Bodies","n":445,"tag":"","q":"In which year was the National Commission for Women established in India ?","o":["1992","1994","1993","1991"],"a":0,"e":"1992. Other Commissions - The National Commission for Scheduled Castes (2004). National Commission for Scheduled Tribes (2004), National Commission for Minorities (1993), National Commission for Backward Classes (1993)."},{"t":"Neighbouring Countries","n":446,"tag":"","q":"Consider the following statements regarding the official language of India’s neighbouring countries: A. The official language of Bangladesh is Bengali. B. The official language of Bhutan is Dzongkha. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Bangladesh: Capital - Dhaka. Currency - Bangladeshi Taka Other Nation’s Official Languages: Urdu (Pakistan), Dzongkha (Bhutan), Hindi (India), Tamil (Sri Lanka), Mandarin (China), Burmese (Myanmar), Dari and Pashto (Afghanistan), Nepali (Nepal) and Dhivehi (Maldives)."},{"t":"Neighbouring Countries","n":447,"tag":"","q":"Sri Lanka got independence in the year:","o":["1948","1950","1947","1949"],"a":0,"e":"1948. Sri Lanka got independence on February 4, 1948. National animal of Sri Lanka - Elephant, National flower - Blue Water Lily, The national sport - Volleyball. Myanmar (4 January, 1948). Bangladesh (26 March 1971)."},{"t":"Neighbouring Countries","n":448,"tag":"","q":"To which neighbouring country was the Indian Peace Keeping Force (IPKF) sent in the year 1987?","o":["Nepal","Sri Lanka","Bhutan","Burma"],"a":1,"e":"Sri Lanka. It was formed under the mandate of the 1987 Indo-Sri Lankan Accord that aimed to end the Sri Lankan Civil War between Sri Lankan Tamil militant groups such as the Liberation Tigers of Tamil Eelam (LTTE) and the Sri Lankan military."},{"t":"Neighbouring Countries","n":449,"tag":"","q":"In which year was a new Constitution adopted in Sri Lanka creating the 'Democratic The Socialist Republic of Sri Lanka'?","o":["1978","1965","1982","1980"],"a":0,"e":"1978 . The Constitution of the Democratic Socialist Republic of Sri Lanka has been the constitution of the island nation of Sri Lanka since its original promulgation by the National State Assembly on 7 September 1978."},{"t":"Neighbouring Countries","n":450,"tag":"","q":"In which year did Nepal adopt its first democratic constitution?","o":["2010","2015","2013","2017"],"a":1,"e":"2015. Nepal's first democratic constitution came into effect on Sept 20, 2015. The constitution of Nepal is divided into 35 parts, 308 Articles, and 9 Schedules."},{"t":"Miscellaneous","n":451,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which principle of the Digital Personal Data Protection Act, 2023 ensures that entities collecting personal data must obtain explicit consent from individuals ?","o":["Purpose Limitation","Storage Reduction Compliance","Data Localization","Notice and Choice Framework"],"a":3,"e":"Notice and Choice Framework. The Digital Pers
