<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2733; --ink2:#52606d; --line:#e3dfd5;
  --accent:#27406b; --accent-soft:#eaeef5;
  --good:#1f6f46; --good-bg:#e7f3ec; --bad:#a3342a; --bad-bg:#f8e9e7;
  --mark:#f7dc7a; --note-bg:#f4f1e8;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:820px;margin:0 auto;padding:12px 16px 4px}
.title h1{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:0;letter-spacing:.2px}
.title span{font-size:.78rem;color:var(--ink2)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;max-width:820px;margin:0 auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:84px;padding:6px 14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink2);font:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tab .n{font-size:1.05rem;font-weight:700;color:var(--ink);line-height:1.2}
.tab .l{font-size:.74rem;font-weight:500;white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent);color:#e6ebf4}
.tab.active .n{color:#fff}
main{max-width:820px;margin:0 auto;padding:14px 16px 90px}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.summary h2{font-family:var(--serif);font-size:1.1rem;margin:0;font-weight:600}
.stats{font-size:.82rem;color:var(--ink2)}
.stats b{color:var(--ink)}
.bar{flex-basis:100%;height:6px;border-radius:6px;background:#ebe7dc;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.reset{font:inherit;font-size:.8rem;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.qno{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.4px}
.src{font-size:.7rem;color:var(--ink2);background:#f0ede4;border-radius:6px;padding:2px 8px;text-align:right}
.stem{font-family:var(--serif);font-size:1.08rem;line-height:1.65;margin:0 0 12px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:46px}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.exp{margin-top:12px;border-left:4px solid var(--accent);background:var(--note-bg);border-radius:0 10px 10px 0;padding:12px 14px;font-family:var(--serif);font-size:1rem;line-height:1.7;display:none}
.exp.show{display:block}
.verdict{font-family:var(--sans);font-size:.82rem;font-weight:700;margin-bottom:6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.exp strong{font-weight:600}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%);color:inherit;padding:0 2px;border-radius:2px}
#top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(29,39,51,.25);opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:30}
#top.show{opacity:1;pointer-events:auto;transform:none}
@media(min-width:700px){.stem{font-size:1.15rem}.q{padding:20px 22px 18px}}
</style>

<script>
const DATA = {"topics":["Constitution","Sources of Constitution","Articles, Schedules & Parts","Amendments","Fundamental Rights & Duties","Committee Reports","Parliament","President, VP & PM","Judiciary","Government Bodies","Neighbouring Countries","Miscellaneous"],"qs":[{"t":"Constitution","n":1,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Read the statements given below:\nStatement 1: The Constitution of India divides the legislative subjects into 3 lists, namely the Centre, State and Concurrent List.\nStatement 2: The subject of 'Protection of wild animals and birds' is transferred to the Concurrent list from the State list by the 42nd Amendment Act\nStatement 3: Only the Parliament of India can make laws on the subjects under the Concurrent List. Which of the following statements given above is/are correct?","o":["Only Statements 1 and 3 are correct","All three statements 1, 2 and 3 are correct","Only Statement 2 is correct","Only Statements 1 and 2 are correct"],"a":3,"e":"The Seventh Schedule of the Indian Constitution divides powers into Union, State, and Concurrent Lists. The 42nd Amendment Act, 1976 transferred five subjects (including Forests and Protection of wild animals and birds) from the State List to the Concurrent List for uniform laws. In the Concurrent List, both Parliament and State Legislatures can make laws, unlike the Union List where only Parliament legislates."},{"t":"Constitution","n":2,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which of the following is correctly matched with their leadership role in the Constituent Assembly (During the making of the Indian constitution)?","o":["G.V. Mavalankar - Chairman of the Committee on the Functions of the Constituent Assembly","Dr. B.R. Ambedkar - Head of the Committee on the Functions of the Assembly","N. Gopalaswami Ayyangar - Chairman of the Order of Business Committee","K.M. Munshi - Leader of the Committee on Fundamental Rights"],"a":0,"e":"During the framing of the Constitution, several committees were set up to divide work efficiently. G.V. Mavalankar, who later became the first Speaker of the Lok Sabha, was entrusted with leading the Committee on the Functions of the Constituent Assembly. Dr. B.R. Ambedkar chaired the Drafting Committee, not this committee. Similarly, N. Gopalaswami Ayyangar headed the Rules of Procedure Committee, and K.M. Munshi contributed significantly to the Fundamental Rights Sub-Committee but was not its leader."},{"t":"Constitution","n":3,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Who headed the Credentials Committee in the Constituent Assembly?","o":["Alladi Krishnaswamy Aiyar","T.T. Krishnamachari","Jawaharlal Nehru","K.M. Munshi"],"a":0,"e":"Alladi Krishnaswamy Aiyar. The Constituent Assembly of India set up several committees to frame the Constitution, one of which was the Credentials Committee, responsible for deciding disputes regarding the validity of Assembly members’ elections. This important committee was headed by Alladi Krishnaswamy Aiyar, a distinguished jurist and member of the Drafting Committee, who played a vital role in shaping India’s constitutional framework."},{"t":"Constitution","n":4,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Who was the Chairman of the \"Advisory Committee on Fundamental Rights, Minorities, and Tribal and Excluded Areas\" in the Constituent Assembly ?","o":["Sardar Vallabhbhai Patel","Jawaharlal Nehru","K.M. Munshi","Dr. B.R. Ambedkar"],"a":0,"e":"Sardar Vallabhbhai Patel. Dr. B.R. Ambedkar was the Chairman of the Drafting Committee, responsible for framing the Constitution. Jawaharlal Nehru headed the Union Constitution Committee, which dealt with the structure of the central government. K.M. Munshi was the chairman of a sub-committee on Fundamental Rights, working under the Advisory Committee chaired by Patel."},{"t":"Constitution","n":5,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"The Indian Constitution is often described as 'quasi-federal' or 'federal in form, unitary in spirit' primarily due to which characteristic?","o":["The equal representation of states in the Rajya Sabha.","The presence of a written constitution.","Strong centralizing tendencies and powers of the Union Government.","The existence of independent judiciary."],"a":2,"e":"India’s Constitution is federal in form but unitary in spirit: Centre stronger – Union List dominance, Residuary powers (Art. 248). Emergency provisions (Arts. 352, 356, 360) → unitary tilt. Governor’s role & Art. 356 misuse → Centre’s influence on states. Single Constitution & Citizenship unlike true federations. Hence, India is described as “quasi-federal” (K.C. Wheare) or a “federation with a strong Centre” (B.R. Ambedkar)."},{"t":"Constitution","n":6,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"The system of federalism in India divides power between:","o":["Centre and States","Lok Sabha and Rajya Sabha","President and Governors","Executive and Judiciary"],"a":0,"e":"Centre and States. Federalism is a system where powers are divided between two levels of government: Union/Centre → National-level matters (defence, foreign affairs, currency, etc.). States → Local/state matters (police, agriculture, public health, etc.). In India, this division is clearly laid out in the Seventh Schedule of the Constitution through: Union List, State List, Concurrent List."},{"t":"Constitution","n":7,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"The Preamble to the Indian Constitution declares India to be a Sovereign, Socialist, Secular, Democratic Republic. Which of these terms were added to the Preamble by the 42 nd Constitutional Amendment Act, 1976 ?","o":["Socialist, Secular","Sovereign, Democratic","Republic, Democratic","Justice, Liberty"],"a":0,"e":"Socialist, Secular. The original Preamble (1950) described India as: “Sovereign Democratic Republic.” The 42nd Constitutional Amendment Act, 1976 (during the Emergency period under Indira Gandhi’s government) added: The words “Socialist” and “Secular” between “Sovereign” and “Democratic.” The word “Integrity” was also added to the phrase “Unity of the Nation.” Thus, after 1976, the Preamble reads: “Sovereign, Socialist, Secular, Democratic Republic.”"},{"t":"Constitution","n":8,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Who among the following was the Chairman of the Drafting Committee of the Constituent Assembly?","o":["Sardar Vallabhbhai Patel","Dr. B.R. Ambedkar","Dr. Rajendra Prasad","Jawaharlal Nehru"],"a":1,"e":"Dr. B. R. Ambedkar. The Constituent Assembly of India formed various committees to prepare the Constitution. The most important was the Drafting Committee, set up on 29 August 1947. It consisted of 7 members, with Dr. B.R. Ambedkar as Chairman. Ambedkar is therefore called the “Chief Architect of the Indian Constitution.” Other key members included N. Gopalaswami Ayyangar, Alladi Krishnaswami Ayyar, K.M. Munshi, Mohammed Saadulla, B.L. Mitter (later replaced), and D.P. Khaitan (later replaced by T.T. Krishnamachari)."},{"t":"Constitution","n":9,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Who was the Home Minister in the first cabinet of free India?","o":["Dr. Rajendra Prasad","Rajagopalachari","Maulana Abul Kalam Azad","Sardar Vallabhbhai Patel"],"a":3,"e":"Sardar Vallabhbhai Patel. In the first cabinet of independent India (15 August 1947), Sardar Vallabhbhai Patel served as the Deputy Prime Minister and Home Minister. As Home Minister, he played a crucial role in: Integration of princely states into the Indian Union. Handling internal security and administrative consolidation. Reorganizing services and laying the foundation of the Indian Administrative System. Dr. Rajendra Prasad later became the first President of India (1950). C. Rajagopalachari became the last Governor-General of India (1948–50). Maulana Abul Kalam Azad was the first Education Minister."},{"t":"Constitution","n":10,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"With reference to the Indian Councils Act, 1892, consider the following statements and choose the correct option:\n1. It significantly increased the number of official members in the Central Legislative Council.\n2. It empowered the legislative councils to discuss the budget and address questions to the executive.\n3. It introduced the principle of direct election for non-official members of provincial legislative councils.","o":["1 only","2 only","1 and 3 only","2 and 3 only"],"a":1,"e":"2 only. Statement 2 - For the first time, councils were allowed to discuss the budget (though without voting rights) and ask questions to the executive (with restrictions). This was a key reform. Statement 1 - The Act of 1892 did increase the number of members in the legislative councils, but it was mainly non-official members (not officials). Thus, the statement is incorrect. Statement 3 - The Act introduced an indirect method of election (through nomination by universities, municipalities, district boards, chambers of commerce), not direct election. Direct elections came later with the Indian Councils Act of 1909 (Morley-Minto Reforms)."},{"t":"Constitution","n":11,"tag":"","q":"Which of the following statements are incorrect in the context of the Constituent Assembly of India ?\n1. It held a total of twelve sessions during the framing of the Indian Constitution.\n2. Its sittings were spread over 165 days.\n3. The first session was held on 9 December 1947 in the Constitution Hall (now Central Hall of Parliament).","o":["1 and 3 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 3. The Constituent Assembly of India held 11 sessions over nearly three years, meeting for 165 days, with 114 days dedicated to discussing the Draft Constitution. The first session began on 9 December 1946 in the Constitution Hall, which is now known as the Central Hall of Parliament."},{"t":"Constitution","n":12,"tag":"","q":"Consider the following statements regarding the Indian judicial system:\n1. The Indian Constitution has established an independent judicial system.\n2. In this system, the executive and legislature must not restrain the functioning of the judiciary in such a way that it is unable to deliver justice. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2 . The Constitution of India ensures an independent judiciary, meaning the other organs of the government cannot interfere with its ability to dispense justice impartially."},{"t":"Constitution","n":13,"tag":"","q":"Who among the following, while praising the amending feature of the Indian Constitution said that ‘This variety in the amending process is wise but is rarely found’ ?","o":["Granville Austin","Ivor Jennings","K C Wheare","HM Seervai"],"a":2,"e":"K C Wheare was an Australian academic who was an expert on the constitutions of the British Commonwealth. He also described the Indian Constitution as Quasi federal . Granville Austin, a well-known scholar of the Indian Constitution, said, “The amending process has proved itself as one of the most ably conceived aspects of the constitution”. Ivor Jennings said that ‘India is a federation with a strong centralising tendency’."},{"t":"Constitution","n":14,"tag":"","q":"Consider the following statements regarding the features of the Constitution of India:\nI. It provides for Universal Adult Franchise.\nII. It provides for Dual Citizenship. Which of the above statements is/are NOT correct ?","o":["I only","II only","Both I and II","Neither I nor II"],"a":1,"e":"II only. The Indian Constitution provides single citizenship for all Indians (Article 5–11, Part II). India's commitment to the rule of law is grounded in the Constitution which establishes India as a ‘Sovereign Socialist Secular Democratic Republic’ with a Parliamentary form of Government. Other key features: Federal system of governance between the Union and the States; Separation of powers between the three organs of the Government; free and fair elections; Equality before the law; A secular state that recognizes freedom of conscience and religion."},{"t":"Constitution","n":15,"tag":"","q":"Which of the following statements are INCORRECT vis-à-vis features of the Indian Constitution?\n1. The Constitution empowers the Prime Minister to proclaim three types of emergencies.\n2. A reservation policy is there to uplift the disadvantaged sections of society.\n3. The Supreme Court has no power of judicial review.\n4. The Constitution provides for universal adult suffrage.","o":["1 and 3","1 and 2","2 and 4","3 and 4"],"a":0,"e":"1 and 3. The Constitution empowers the President to proclaim three types of emergencies. National Emergency (Article 352), President’s Rule (State Emergency) (Article 356), Financial Emergency (Article 360). The Supreme Court has the power of judicial review under Articles 13, 32, 131–136, etc."},{"t":"Constitution","n":16,"tag":"","q":"Which of the following statement(s) is/are INCORRECT vis-a-vis features of the Indian Constitution?\n1. Though India has a federal system, the Constitution does not mention the word 'federation'.\n2. Article 5 of the Constitution says that the Parliament by law can create a new state.\n3. On the subjects in the Union list, each State Legislature can enact laws for the State.\n4. Both the Parliament and State Legislature can pass laws on subjects in concurrent list.","o":["1 and 4","2 and 3","Only 1","1 and 3"],"a":1,"e":"2 and 3. Article 1 of the Indian Constitution defines India, also known as Bharat, as a union of states. Although the term \"federation\" is not explicitly used, India functions as a holding-together type of federation where power distribution among states can be unequal. The Parliament has exclusive authority to legislate on Union List subjects. Article 2 allows for the admission or establishment of new states, while Article 3 provides for the formation of new states and the alteration of existing states' areas, boundaries, or names."},{"t":"Constitution","n":17,"tag":"","q":"Consider the following statements regarding the Indian Constitution:\n1. The Constitution of India was adopted by the Constituent Assembly on 26th November 1949.\n2. It came into force on 26th January 1950, celebrated as Republic Day. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Constitution of India was adopted by the Constituent Assembly on 26th November 1949. It came into force on 26th January 1950, which is celebrated as Republic Day to honor the 1930 Declaration of Purna Swaraj. The Drafting Committee, chaired by Dr. B.R. Ambedkar took 2 years, 11 months, and 18 days to complete the Constitution."},{"t":"Constitution","n":18,"tag":"","q":"Secularism is a feature of the Indian Constitution, which means:","o":["The State does not promote any religion.","The State promotes the religion of the minority community.","The State promotes the religion of the majority community.","The State can promote any religion."],"a":0,"e":"In India, secularism means the State maintains equal respect for all religions and does not identify itself with any particular religion. The word Secular was formally added to the Preamble by the 42nd Amendment (1976), though secular principles were already guaranteed by Articles 25–28 (freedom of religion, right to manage religious affairs, no taxation for promotion of religion, freedom from religious instruction in educational institutions)."},{"t":"Constitution","n":19,"tag":"","q":"Consider the following statements: A. Under Article 343(1) of the Indian Constitution, Hindi in the Devanagari script was declared as the official language of the Union. B. This declaration was made in the year 1949. Which of the statements given above is/are correct ?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. Under Article 343(1), the official language of the Union shall be Hindi in Devanagari script, while Section 3 of the Official Language Act, 1963 talks about the continuance of the English language for official purposes of the Union and for use in Parliament."},{"t":"Constitution","n":20,"tag":"","q":"Consider the following statements: A. The Preamble of the Constitution of India describes the country as a secular state. B. In a secular state, the government does not uphold any religion as the state religion. Which of the statements given above is/are correct ?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. A secular state does not consider anyone's religion as an official religion. India is a Sovereign Socialist Secular Democratic Republic with a Parliamentary form of government which is federal in structure with unitary features. Atheist State - No belief in Gods. Unitary State - Central government holds complete authority. Federal State - Central and state governments share autonomy."},{"t":"Constitution","n":21,"tag":"","q":"Which of the following word sequences is correct as per the Preamble to the Constitution ?","o":["Sovereign, socialist, secular, democratic, republic","Secular, democratic, secular, socialist, sovereign","Sovereign, secular, socialist, democratic, republic","Socialist, secular, democratic, republic, sovereign"],"a":0,"e":"The words \"Socialist\" and \"Secular\" were added to the Preamble of the Indian Constitution by the 42nd Amendment in 1976. Before this, India was described as a Sovereign, Democratic, Republic, and after the amendment, it was changed to Sovereign, Socialist, Secular, Democratic, Republic."},{"t":"Constitution","n":22,"tag":"","q":"Consider the following statements:\n1. The National Anthem of India, \"Jana-Gana-Mana,\" was adopted in its Hindi version by the Constituent Assembly in 1950.\n2. It was originally composed in Bengali by Rabindranath Tagore and titled \"Bharoto Bhagyo Bidhata.\" Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The National Anthem of India, \"Jana-Gana-Mana,\" was originally composed in Bengali by Rabindranath Tagore and titled \"Bharoto Bhagyo Bidhata.\" It was first publicly sung on December 27, 1911, at the Calcutta (now Kolkata) Session of the Indian National Congress. It was translated into Hindi by Captain Abid Ali and set to music by Captain Ram Singh."},{"t":"Constitution","n":23,"tag":"","q":"Consider the following statements:\n1. The ‘Objective Resolution’ was moved by Pt. Jawaharlal Nehru on 13 December 1946.\n2. It was adopted by the Constituent Assembly on 13 December 1946. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The Objective Resolution outlines the fundamental ideas and philosophy of our Constitution, defining the goals of the Constituent Assembly. It serves as the basis for the preamble of the Constitution. This important resolution was adopted by the Assembly on January 22, 1947."},{"t":"Constitution","n":24,"tag":"","q":"Which of the following is NOT a basic feature of the Indian Constitution ?","o":["Parliamentary system","Blend of rigidity and flexibility","Lengthiest written Constitution","Drawn from one source"],"a":3,"e":"Drawn from one source. The salient features of the Indian Constitution include: the lengthiest written constitution, drawn from various sources, a blend of rigidity and flexibility, a federal system with a unitary bias, a parliamentary form of government, a synthesis of parliamentary sovereignty and judicial supremacy, rule of law, an integrated and independent judiciary, fundamental rights, directive principles of state policy, fundamental duties, secularism, single citizenship, judicial review, and the basic structure doctrine."},{"t":"Constitution","n":25,"tag":"","q":"Which of the following statements are correct in the context of the Indian Constitution?\n1. There are three major organs of the government, namely Legislature, Executive and Judiciary.\n2. A separation of functions rather than powers is followed.\n3. All organs of the government are independent.","o":["1 and 3 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 2 only. In the context of the Indian Constitution: Legislative Function - Parliament (Lok Sabha and Rajya Sabha) makes laws, with the President giving assent to bills. Executive Function - The Prime Minister and the Council of Ministers execute laws and are also part of the legislature, linking the two branches. Judicial Function - The judiciary interprets laws and administers justice, reviewing legislative and executive actions for constitutional compliance. This system fosters collaboration and interdependence among branches, with distinct functions but not complete separation of powers."},{"t":"Constitution","n":26,"tag":"","q":"Consider the following statements:\n1. Dr. K.M. Munshi, a member of the Drafting Committee, described the Preamble of the Indian Constitution as \"The Political Horoscope of our Constitution.\"\n2. Sir Ernest Barker referred to the Preamble as the \"Identity card of the Constitution.\" Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Dr. KM Munshi was a member of the Drafting Committee of the Indian Constitution. Other names for the preamble: Soul of the Constitution: By Thakurdas Bhargav. Identity card of the Constitution: By N.A. Palkhiwala. Keynote to the Constitution: By Sir Ernest Barker."},{"t":"Constitution","n":27,"tag":"","q":"When was the preamble to the Indian Constitution amended ?","o":["1981","1976","1974","1980"],"a":1,"e":"1976. The Preamble of the Constitution was amended only once, in 1976, by the 42 nd Constitutional Amendment. The terms 'Socialist', 'Secular', and 'Integrity' were added to the preamble. 'Socialist' and 'Secular' were added between 'Sovereign' and 'Democratic'. 'Unity of the Nation' was changed to 'Unity and Integrity of the Nation'."},{"t":"Constitution","n":28,"tag":"","q":"When is Constitution Day observed in India ?","o":["12 January","26 November","26 January","31 October"],"a":1,"e":"26 November. The ‘Purna Swaraj’ resolution, meaning total independence, was passed by the Indian National Congress on 19 December 1929, during the Lahore session presided by Jawaharlal Nehru. The pledge for independence was publicly announced on 26 January 1930. Nehru, along with Congress members, marched to the banks of the Ravi, taking an oath not to rest until Purna Swaraj was achieved."},{"t":"Constitution","n":29,"tag":"","q":"Who among the following is called 'Father of Indian constitution' ?","o":["Bhim Rao Ambedkar","P Subbarayan","Gopinath Bordoloi","Rajendra Prasad"],"a":0,"e":"Bhim Rao Ambedkar. He played a pivotal role in drafting the Constitution of India, serving as the Chairman of the Constitution Drafting Committee. Gopinath Bordoloi was the first Chief Minister of Assam. Rajendra Prasad served as the first President of India. Paramasivan Subbarayan was the first Minister of Madras Presidency."},{"t":"Constitution","n":30,"tag":"","q":"Consider the following statements about the designer of India’s National Flag: i. Pingali Venkayya presented the original design of the Indian flag with red and green colors to Mahatma Gandhi in 1921. ii. The National Flag was adopted by the Constituent Assembly of India on 22 July 1947. Which of the statements given above is/are correct?","o":["I only","II only","Both I and II","Neither I nor II"],"a":2,"e":"Both I and II. Pingali Venkayya was the designer of India’s National Flag and proposed its initial design in 1921, which was later modified and officially adopted on 22 July 1947."},{"t":"Constitution","n":31,"tag":"","q":"Who among the following personalities was appointed as the legal advisor of the Constituent Assembly that drafted the document of the Constitution","o":["HVR Iyengar","SN Mukherjee","BR Ambedkar","BN Rau"],"a":3,"e":"BN Rau. On 9 December 1946, the Constituent Assembly of India met for the first time. Temporary President of constituent assembly - Dr. Sachchidananda Sinha. Permanent President - Dr. Rajendra Prasad. Vice - President - H C Mukherjee."},{"t":"Constitution","n":32,"tag":"","q":"Consider the following statements:\n1. The original Constitution of India was handwritten in English by Prem Behari Narayan Raizada in a flowing italic style.\n2. The original Indian Constitution consisted of 117,369 words and 251 pages. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Prem Behari Narayan Raizada - The calligrapher of the Indian Constitution. The original constitution was handwritten by him in a flowing italic style."},{"t":"Constitution","n":33,"tag":"","q":"Who among the following personalities was the chief draftsman of the constituent assembly that drafted the document of the Constitution ?","o":["KM Munshi","Vasant Krishan Vaidya","SN Mukherjee","HVR Iyenger"],"a":2,"e":"SN Mukherjee. The drafting committee was formed under the chairmanship of Dr B R Ambedkar by the Constituent Assembly on 29th August 1947. The other six members of the committee were K.M. Munshi, Muhammed Sadullah, Alladi Krishnaswamy Iyer, N. Gopalaswami Ayyangar, Devi Prasad Khaitan and BL Mitter."},{"t":"Constitution","n":34,"tag":"","q":"Consider the following statements:\n1. The Hindi version of the original Indian Constitution was written in calligraphic style by Vasant Krishan Vaidya.\n2. Artists from Shantiniketan, including Nand Lal Bose and Beohar Rammanohar Sinha, decorated and beautified the original Constitution. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The original version of the constitution was beautified and decorated by artists from Shantiniketan including Nand Lal Bose and Beohar Rammanohar Sinha."},{"t":"Constitution","n":35,"tag":"","q":"Consider the following statements:\n1. The structural part of the Indian Constitution is largely derived from the Government of India Act, 1935.\n2. The Act provided for the division of powers between the Centre and units through the Federal, Provincial, and Concurrent Lists. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Government of India Act, 1935 provides the establishment of an All India federation consisting of provinces and princely states as units. It divided the powers between the centre and units in terms of three lists- Federal list, provincial list and the concurrent list. Jawaharlal Nehru called it a “machine with strong brakes but no engine”. He also called it a “Charter of Slavery”."},{"t":"Constitution","n":36,"tag":"","q":"Which is NOT a unitary feature of the Constitution of India?","o":["Bicameral Legislature","Integrated Judicial System","Single Citizenship","Appointment of the Governor by the President"],"a":0,"e":"Bicameral Legislature. (legislative body with two houses). At the central level (Lok Sabha and Rajya Sabha). Other Unitary features of Indian Constitution: Single Constitution for Union and States, Common All-India Services, Inequality of Representation in the Council of States, Centralised Electoral Machinery, Special Powers of Council of State over State List, etc."},{"t":"Constitution","n":37,"tag":"","q":"Consider the following statements:\n1. Division of powers, written constitution, and independent judiciary are federal features of the Indian Constitution.\n2. All India Services is a federal feature of the Indian Constitution. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Federal Features of the Indian Constitution - Division of powers, Supremacy of the constitution, Written constitution, Rigid constitution, Independent Judiciary, Bi-cameral Legislature."},{"t":"Constitution","n":38,"tag":"","q":"With reference to the Constituent Assembly, which of the following statements is Correct ?","o":["The Constituent Assembly ratified India’s membership of the Commonwealth in May 1947.","The Constituent Assembly adopted the National Anthem in January 1950.","The Constituent Assembly adopted the National Song in January 1948.","The Constituent Assembly adopted the National Flag in July 1949."],"a":1,"e":"The Constituent Assembly played a significant role in adopting the national symbols of India. On 22 July 1947, the Indian National Flag was adopted as the official flag of the nation. The National Anthem, “Jana Gana Mana,” which was first sung on 27 December 1911 at the Calcutta Session of the Indian National Congress, was formally adopted by the Constituent Assembly on 24 January 1950. On the same day, the patriotic song “Vande Mataram” was also adopted as the National Song of India. Meanwhile, India had already joined the Commonwealth of Nations in May 1949. Thus, on 24 January 1950, just two days before the Constitution of India came into effect, the Constituent Assembly gave India its National Anthem and National Song, symbolizing unity and patriotism."},{"t":"Constitution","n":39,"tag":"","q":"How many female members were part of the Constituent Assembly that framed the Constitution of India?","o":["12","10","14","15"],"a":3,"e":"15. The Constituent Assembly was formed on 6 December 1946. The idea for a Constituent Assembly was proposed in 1934 by M. N. Roy."},{"t":"Constitution","n":40,"tag":"","q":"Which of the following statements is incorrect ?","o":["B. Pattabhi Sitaramayya was the Chairman of the House Committee of the Constituent Assembly of India.","AV Thakkar was the founder of the Bharatiya Vidya Bhavan in 1938.","J.B. Kripalani was the President of the Indian National Congress during Independence.","K.M. Munshi served as Minister for Agriculture & Food (1952–53)."],"a":1,"e":"In 1922, AV Thakkar founded the Bhil Seva Mandal. JB Kripalani was the president of Indian National Congress during Independence. K M Munshi - Founder of Bharatiya Vidya Bhavan (1938), Member of the Constituent Assembly of India, Minister for Agriculture & Food (1952–53)"},{"t":"Constitution","n":41,"tag":"","q":"GV Mavalankar was the Chairman of the ______ of the Constituent Assembly of India.","o":["Advisory Committee on Fundamental Rights, Minorities and Tribal and Excluded Areas","Committee on the Functions","Order of Business Committee","Ad hoc Committee on the National Flag"],"a":1,"e":"Committee on the Functions. GV Mavalankar was the first speaker of Lok Sabha. Advisory Committee on Fundamental Rights, Minorities and Tribal and Excluded Areas - Vallabhbhai Patel. Ad hoc Committee on the National Flag - Rajendra Prasad."},{"t":"Constitution","n":42,"tag":"","q":"Consider the following statements:\n1. The total membership of the Constituent Assembly was 389.\n2. Out of this, 93 members represented the princely states. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The total membership of the Constituent Assembly was 389, of which 292 were representatives of the provinces, 93 represented the princely states and 4 were from the chief commissioner provinces of Delhi, Ajmer-Merwara, Coorg and British Baluchistan."},{"t":"Constitution","n":43,"tag":"","q":"The members of the Constituent Assembly signed the Constitution of India on ______.","o":["26 November 1948","24 January 1950","26 November 1949","24 January 1952"],"a":1,"e":"24 January 1950. On that day, the last meeting of the Constituent Assembly was held and the 'Constitution of India' ( with 395 Articles, 8 schedules, 22 parts) was signed and accepted by all."},{"t":"Constitution","n":44,"tag":"","q":"In which year did Motilal Nehru (Chairman) and eight other Congress leaders draft a constitution for India?","o":["1925","1950","1928","1930"],"a":2,"e":"1928. The Motilal Nehru Report 1928 was made by a committee headed by Pt. Motilal Nehru. This committee was created when Lord Birkenhead, Secretary of State of India asked the Indian leaders to draft a constitution for the country."},{"t":"Sources of Constitution","n":45,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Which constitutional features in India are linked to the Australian Constitution ? A) Freedom of trade and commerce B) Joint sitting of the two Houses C) Federal structure with strong Centre D) Advisory jurisdiction of the Supreme Court","o":["Only B","A and B both","A and C both","Only A"],"a":1,"e":"A and B both. The Indian Constitution borrowed several provisions from different world constitutions. From Australia, India adopted: Freedom of trade and commerce – Ensures free movement of goods and trade across states. Joint sitting of the two Houses — Provision for resolving deadlock between Lok Sabha and Rajya Sabha (Article 108). Federal structure with strong Centre, residuary powers, and Advisory jurisdiction of the Supreme Court borrowed from Canada. Other key borrowings: From the UK: Parliamentary system, rule of law, single citizenship. From USA: Fundamental Rights, Judicial Review, Impeachment of President. From Ireland: DPSPs, election of President."},{"t":"Sources of Constitution","n":46,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"The concept of \"Directive Principles of State Policy (DPSP)\" in the Indian Constitution has been borrowed from the Constitution of which country?","o":["Ireland","United States of America","United Kingdom","Canada"],"a":0,"e":"Ireland. The Directive Principles of State Policy (DPSP) are included in Part IV (Articles 36–51) of the Indian Constitution. They are non-justiciable guidelines for the government to establish a welfare state based on social, economic, and political justice. The idea of DPSPs was borrowed from the Irish Constitution (1937), which itself was influenced by the Spanish Constitution. Examples of DPSPs: securing equal justice, free legal aid, organization of village panchayats, protection of environment, promotion of international peace."},{"t":"Sources of Constitution","n":47,"tag":"","q":"Consider the following statements:\n1. The Republic feature of the Indian Constitution has been borrowed from the French Constitution.\n2. Ideals of liberty, equality, and fraternity in the Preamble are also taken from the French Constitution. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The French Constitution inspired India’s Republic feature and the ideals of liberty, equality, and fraternity mentioned in the Preamble. Other features were borrowed from countries like Australia, the UK, and Ireland."},{"t":"Sources of Constitution","n":48,"tag":"","q":"Which of the following Constitutions inspired the law-making process in India?","o":["Irish Constitution","British Constitution","US Constitution","Canadian Constitution"],"a":1,"e":"British Constitution. Borrowed features of Indian Constitution: British - Parliamentary government, Rule of Law, legislative procedure, single citizenship, cabinet system, prerogative writs. US - Fundamental rights, independence of judiciary, judicial review, impeachment of the President."},{"t":"Sources of Constitution","n":49,"tag":"","q":"Consider the following statements:\n1. The concept of ‘Independence of Judiciary’ in the Indian Constitution is borrowed from the Constitution of the USA.\n2. Fundamental Rights and the process of impeachment of the President are also borrowed from the USA. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The USA provided the model for Independence of the Judiciary, Fundamental Rights, the President’s impeachment process, and the Office of the Vice-President in the Indian Constitution."},{"t":"Sources of Constitution","n":50,"tag":"","q":"Consider the following statements:\n1. The Indian Constitution adopted the ‘First Past the Post’ system from the American Constitution.\n2. In the FPTP system, the candidate with the highest votes is declared elected even without an absolute majority. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. First Past the Post (FPTP) borrowed from the British Constitution, declares the candidate with the most votes as elected, even without an absolute majority."},{"t":"Sources of Constitution","n":51,"tag":"","q":"Judicial Review, a salient feature of the Constitution of India, has been borrowed from which of the following countries?","o":["The U.S.","Ireland","South Africa","Canada"],"a":0,"e":"The U.S. Borrowed Features of Indian Constitution: US - Impeachment of the president, Functions of president and vice president, Removal of Supreme Court and High court judges."},{"t":"Sources of Constitution","n":52,"tag":"","q":"Consider the following statements:\n1. The Indian Constitution borrowed the concept of the Concurrent List from Australia.\n2. From Australia, India also borrowed the provisions for freedom of trade, commerce and intercourse, and the joint sitting of the two Houses of Parliament. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The Concurrent List, along with provisions for freedom of trade, commerce and intercourse and the joint sitting of the two Houses, was borrowed from the Australian Constitution."},{"t":"Sources of Constitution","n":53,"tag":"","q":"From which of the following Constitutions is the idea of ‘Charter of Fundamental Rights’ adopted in the Indian Constitution?","o":["Brazilian Constitution","Spanish Constitution","United States of America’s Constitution","French Constitution"],"a":2,"e":"United States of America’s Constitution. Borrowed Features of Indian Constitution: US (United States) - Independence of judiciary, Judicial review, Impeachment of the President, Removal of Supreme Court and High Court judges, Post of vice-president. France - Republic, Ideals of liberty, equality and fraternity in the Preamble."},{"t":"Sources of Constitution","n":54,"tag":"","q":"Consider the following statements:\n1. The ideals of justice (social, economic, and political) in the Indian Constitution were borrowed from the USSR.\n2. The concept of Fundamental Duties in the Indian Constitution was also borrowed from the USSR. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. From the USSR (now Russia), India borrowed the ideals of justice mentioned in the Preamble and the concept of Fundamental Duties."},{"t":"Sources of Constitution","n":55,"tag":"","q":"Consider the following statements:\n1. The emergency provisions of the Indian Constitution were borrowed from the Government of India Act, 1935.\n2. The Government of India Act, 1935 also provided features like the federal scheme, office of the governor, judiciary, and public service commissions. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The emergency provisions (Part XVIII, Articles 352 to 360) and several structural features of the Constitution — including the federal scheme, office of the governor, judiciary, and public service commissions — were borrowed from the Government of India Act, 1935."},{"t":"Sources of Constitution","n":56,"tag":"","q":"From which country has the concept of Martial Law, which restricts Fundamental rights, borrowed ?","o":["China","The UK","Japan","The USSR"],"a":1,"e":"The UK. The expression ‘martial law’ has not been defined anywhere in the Constitution. It refers to the suspension of ordinary law and the government by military tribunals."},{"t":"Sources of Constitution","n":57,"tag":"","q":"Consider the following statements:\n1. India follows the Westminster model of parliamentary democracy, which is based on the United Kingdom system.\n2. From the UK, India borrowed features like the parliamentary form of government, single citizenship, rule of law, writs, role of the Speaker, law-making procedure, bicameralism, and political structure of the Constitution. Which of the statements given above is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. India’s parliamentary democracy is modeled on the Westminster system of the United Kingdom, and several key constitutional features - including bicameral legislature, rule of law, and single citizenship - are borrowed from the British Constitution."},{"t":"Sources of Constitution","n":58,"tag":"","q":"The concept of \"Amendment of the Constitution\" in the Indian Constitution was borrowed from the constitution of which of the following countries?","o":["South Africa","Germany","Canada","Australia"],"a":0,"e":"South Africa. Article 368 of Part XX - \"Constitutional Amendment\". Indian Constitution Sources: South Africa - Election of members of Rajya Sabha."},{"t":"Sources of Constitution","n":59,"tag":"","q":"Which of the following provisions of the Indian constitution is borrowed from the Constitution of Canada?","o":["Independence of judiciary","Concept of Republic","Advisory jurisdiction of the Supreme court","Concept of concurrent list"],"a":2,"e":"Advisory jurisdiction of the Supreme court. Borrowed Features of Indian Constitution from Canada - Centrifugal form of federalism where the center is stronger than the states, To provide residuary powers to the Centre, Supreme Court’s advisory jurisdiction, and Appointment of state governors by the Centre."},{"t":"Articles, Schedules & Parts","n":60,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following is a subject under the State List ?","o":["Banking","Public Order","Defence","Education"],"a":1,"e":"Public Order. The State List under the Seventh Schedule of the Indian Constitution contains subjects on which only state legislatures can make laws (except in exceptional circumstances when Parliament can legislate). Public Order is a State List subject (Entry 1, State List). Banking : Union List. Defence : Union List. Education : Originally in State List, but shifted to the Concurrent List by the 42nd Constitutional Amendment, 1976."},{"t":"Articles, Schedules & Parts","n":61,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"How does Article 356 impact the federal structure of India ?","o":["It ensures judicial independence","It promotes decentralization","It allows Centre to dismiss State governments","It enforces cooperative federalism"],"a":2,"e":"It allows the Centre to dismiss State governments. Article 356 of the Indian Constitution provides for President’s Rule in a state if the President, on receipt of a report from the Governor or otherwise, is satisfied that the government of the state cannot be carried on in accordance with the provisions of the Constitution. Under this provision, the Centre can assume control of the state government: The State Council of Ministers is dismissed; The State Legislative Assembly may be dissolved or suspended; The administration of the state comes directly under the President (Union Government). S.R. Bommai case 1994, provides safeguards on misuse of Article 356."},{"t":"Articles, Schedules & Parts","n":62,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following pairs is correctly matched with respect to the Schedules of the Indian Constitution ?","o":["Eleventh Schedule - Powers and responsibilities of Panchayats","Twelfth Schedule - Election of President and Vice-President","Tenth Schedule - Languages recognised by the Constitution","Ninth Schedule - Allocation of powers between Union and States"],"a":0,"e":"First Schedule - Names of States and Union Territories. Second Schedule - Provisions regarding emoluments, allowances of President, Governors, Judges, etc. Third Schedule - Forms of oath or affirmation. Fourth Schedule - Allocation of seats in Rajya Sabha. Fifth Schedule - Administration of Scheduled Areas and Scheduled Tribes. Sixth Schedule - Administration of Tribal Areas in Assam, Meghalaya, Tripura, Mizoram. Seventh Schedule - Division of powers between Union and States (Union, State, Concurrent Lists). Eighth Schedule – Recognised official languages (22 languages). Ninth Schedule – Laws protected from judicial review (mainly land reforms). Tenth Schedule – Anti-defection law for legislators. Eleventh Schedule – Powers, authority, and responsibilities of Panchayats (added by 73rd Amendment, 1992). Twelfth Schedule – Powers, authority, and responsibilities of Municipalities (added by 74th Amendment, 1992)."},{"t":"Articles, Schedules & Parts","n":63,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Under which article can the President declare a National Emergency?","o":["Article 360","Article 356","Article 352","Article 365"],"a":2,"e":"Article 352. The President of India can proclaim a National Emergency under Article 352 in cases of war, external aggression, or armed rebellion. Earlier, the term \"internal disturbance\" was used (before the 44th Amendment, 1978), but it was replaced by \"armed rebellion\" to prevent misuse. The proclamation must be approved by both Houses of Parliament within 1 month (earlier 2 months). Once approved, it remains in force for 6 months at a time, and can be extended with further approval of Parliament. India has declared National Emergency three times : 1962 – Chinese aggression (war); 1971 – Indo-Pak war; 1975 – 77 – Internal disturbance (controversial, declared by Indira Gandhi)."},{"t":"Articles, Schedules & Parts","n":64,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which schedule of the Constitution contains provisions for the disqualification of legislators under the anti-defection law ?","o":["Ninth Schedule","Eleventh Schedule","Tenth Schedule","Eighth Schedule"],"a":2,"e":"Tenth Schedule. The Tenth Schedule of the Indian Constitution (added by the 52nd Amendment Act, 1985) contains provisions regarding the disqualification of legislators on the grounds of defection. It applies to both Parliament and State Legislatures. It aims to prevent political defections motivated by the lure of office or material benefits. The authority to decide cases of disqualification under this schedule lies with the Speaker/Chairman of the concerned House. Judicial review of the Speaker’s decision was later permitted by the Supreme Court (Kihoto Hollohan case, 1992)."},{"t":"Articles, Schedules & Parts","n":65,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which of the following statements based on the Union List entries is/are correct?\n1. The Parliament has exclusive power to legislate on lotteries conducted by both the Central and State governments.\n2. Matters related to the incorporation and regulation of cooperative societies are included in the Union List.\n3. The Reserve Bank of India, foreign exchange, and currency are all under the legislative domain of the Union.\n4. Parliament can make laws regarding corporations whose activities are not limited to one State, excluding universities.","o":["Only 1, 3, and 4","Only 2 and 3","Only 1 and 4","All four statements 1, 2, 3 and 4 are correct"],"a":0,"e":"Only 1, 3, and 4. cooperative societies are in State List, not Union . The Seventh Schedule of the Indian Constitution contains three lists that distribute legislative powers between the Union and the States: List I (Union List): Contains subjects of national importance like defence, banking, and foreign affairs, on which only Parliament can legislate. List II (State List): Contains subjects of local or state importance like police, public health, and agriculture, cooperative societies, on which state legislatures have exclusive power. List III (Concurrent List): Contains subjects like education, forests, and marriage, on which both Parliament and state legislatures can make laws. In case of a conflict, the law made by the Parliament prevails."},{"t":"Articles, Schedules & Parts","n":66,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which of the following North - Eastern states has areas governed under the Sixth Schedule?","o":["Tripura","Manipur","Nagaland","Arunachal Pradesh"],"a":0,"e":"Tripura. The Sixth Schedule of the Indian Constitution contains special provisions for the administration of tribal areas in four northeastern states: Assam, Meghalaya, Tripura, and Mizoram. It allows for the formation of Autonomous District Councils (ADCs) to protect the rights and cultural identity of tribal populations. Tripura has the Tripura Tribal Areas Autonomous District Council (TTAADC) under this schedule. Manipur, Nagaland, and Arunachal Pradesh are not covered under the Sixth Schedule."},{"t":"Articles, Schedules & Parts","n":67,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Which article provides for the appointment of Governors in India ?","o":["Article 170","Article 154","Article 155","Article 168"],"a":2,"e":"Article 155. Articles related to Governor (Articles 153 to 162): Article 153 - Governors of states. Article 154 - Executive power of the state. Article 156 - Term of office of Governor. Article 157 - Qualifications for appointment as Governor. Article 158 - Conditions of Governor’s office. Article 159 - Oath or affirmation by the Governor. Article 160 - Discharge of the functions of the Governor in certain contingencies. Article 161 - Power of Governor to grant pardons, etc., and to suspend, remit or commute sentences in certain cases. Article 162 - Extent of executive power of State."},{"t":"Articles, Schedules & Parts","n":68,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Which Article of the Constitution deals with the extent of executive power of the Union ?","o":["Article 78","Article 75","Article 52","Article 73"],"a":3,"e":"Article 73. Extent of Executive Power of the Union: The executive power of the Union is defined in Article 73 of the Indian Constitution. It states that the executive power of the Union shall extend to matters on which Parliament has the power to make laws (Union List and, in certain cases, Concurrent List). Article 78 – Duties of the Prime Minister with respect to furnishing information to the President. Article 75 — Deals with appointment of PM, Council of Ministers, their tenure, and responsibility. Article 52 - Establishes the office of the President."},{"t":"Articles, Schedules & Parts","n":69,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Match the following Schedules of the Indian Constitution with their respective features: Column A Column B (Feature) (Schedule)\n1. First a. Allocation of powers and Schedule responsibilities between Union and States\n2. Third b. Forms of Oaths or Schedule Affirmations\n3. Fifth c. Administration and control of Schedule Scheduled Areas and Tribes (excluding NE states)\n4. Seventh d. Names of the States and Schedule Union Territories and their territorial jurisdiction","o":["1-b, 2-d, 3-а, 4-c","1-a, 2-c, 3-b, 4-d","1-c, 2-a, 3-d, 4-b","1-d, 2-b, 3-c, 4-а"],"a":3,"e":"1-d, 2-b, 3-c, 4-а."},{"t":"Articles, Schedules & Parts","n":70,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"The \"emoluments, allowances, and privileges of constitutional officeholders\" are governed under which Schedule of the Indian Constitution?","o":["Fifth Schedule","Seventh Schedule","Eleventh Schedule","Second Schedule"],"a":3,"e":"The Second Schedule of the Indian Constitution deals with the salaries, emoluments, allowances, and privileges of key constitutional officeholders. This includes the President, Vice-President, Governors, Judges of the Supreme Court and High Courts, Comptroller and Auditor General (CAG), and members of the Union and State Legislatures. It contains detailed provisions regarding how these payments are structured and who determines them. The aim is to ensure transparency and fairness in compensating those holding high constitutional responsibilities."},{"t":"Articles, Schedules & Parts","n":71,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which list allows both Centre and State to legislate on the same subject ?","o":["Reserved List","Union List","Concurrent Lis","State List"],"a":2,"e":"Concurrent List. The Concurrent List, provided in the Seventh Schedule of the Indian Constitution, contains subjects on which both the Union and State governments can make laws. In case of a conflict between the two, the Union law prevails. Examples include criminal law, marriage and divorce, bankruptcy, and education. This list ensures cooperative federalism by allowing shared responsibility between Centre and States on important matters."},{"t":"Articles, Schedules & Parts","n":72,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Read the below statements related to Concurrent List laws:\n1. Union law overrides state law in conflict.\n2. State law can prevail if reserved and assented by President. Which is/are correct ?","o":["Only 2","Only 1","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. In the Concurrent List, both Parliament and State legislatures can make laws. When a conflict arises, the Union law normally prevails, ensuring uniformity across the nation. However, if a state law on a concurrent subject is reserved for the President’s consideration and receives his assent, it can prevail in that state, despite being inconsistent with a central law. This balance allows flexibility for states while maintaining the supremacy of Parliament when required."},{"t":"Articles, Schedules & Parts","n":73,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Which part of the Indian Constitution is known as the \"Magna Carta of India\" and guarantees fundamental rights to the citizens?","o":["Part I","Part II","Part III","Part IV"],"a":2,"e":"Part III. Part III (Articles 12 to 35) of the Indian Constitution deals with Fundamental Rights. These rights guarantee civil liberties such as equality, freedom, protection from exploitation, freedom of religion, cultural & educational rights, and constitutional remedies. Because Fundamental Rights ensure justice, liberty, and equality, and safeguard the dignity of individuals, Part III is often referred to as the “Magna Carta of India.” The term Magna Carta refers to the historic English charter of 1215 that limited the powers of the king and laid the foundation for constitutional governance."},{"t":"Articles, Schedules & Parts","n":74,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Initially, when the 'Constitution of India' was adopted on 26th November 1949, how many Articles and Schedules did it originally contain?","o":["284 Articles and 8 Schedules","395 Articles and 12 Schedules","395 Articles and 8 Schedules","444 Articles and 12 Schedules"],"a":2,"e":"395 Articles and 8 Schedules. The Constitution of India was adopted on 26th November 1949 and came into effect on 26th January 1950. Originally, it contained: 395 Articles divided into 22 Parts. 8 Schedules. Over time, through numerous amendments, the Constitution has expanded. Currently (2025), it has 470+ Articles and 12 Schedules."},{"t":"Articles, Schedules & Parts","n":75,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"'The provision for 'Oath or Affirmation' by members of the legislature is mentioned in which Schedule of the Indian Constitution?","o":["Second Schedule","Fourth Schedule","Fifth Schedule","Third Schedule"],"a":3,"e":"Third Schedule. The Third Schedule of the Indian Constitution prescribes the forms of Oaths or Affirmations for: Union Ministers and State Ministers. Members of Parliament (MPs) and State Legislatures (MLAs/MLCs). Judges of the Supreme Court and High Courts. The Comptroller and Auditor General (CAG). The oath is taken before assuming office, affirming faith in the Constitution of India and upholding its integrity and sovereignty."},{"t":"Articles, Schedules & Parts","n":76,"tag":"","q":"Which Articles of the Constitution of India provide for a parliamentary form of government at the Centre ?","o":["Articles 74 and 75","Articles 71 and 72","Articles 79 and 80","Articles 76 and 77"],"a":0,"e":"Articles 74 and 75. Article 74: Council of Ministers to aid and advise President.-[(1) There shall be a Council of Ministers with the Prime Minister at the head to aid and advise the President who shall, in the exercise of his functions, act in accordance with such advice. Article 75 - Other provisions as to Ministers.-(1) The Prime Minister shall be appointed by the President and the other Ministers shall be appointed by the President on the advice of the Prime Minister."},{"t":"Articles, Schedules & Parts","n":77,"tag":"","q":"Which of the following articles of the Constitution of India mentions that every Minister and the Attorney-General of India shall have the right to speak in and participate in the proceedings of either House of Parliament ?","o":["Article 86","Article 87","Article 89","Article 88"],"a":3,"e":"Article 88. Ministers and the Attorney - General of India shall not be entitled to vote in either House of the Parliament. Article 86 : Right of President to address and send messages to Houses. Article 87 : Relates to the special address by the President to the Houses of Parliament at the commencement of the first session after each general election."},{"t":"Articles, Schedules & Parts","n":78,"tag":"","q":"Which Article of the Constitution explains that the executive power of every state shall be so exercised as not to impede or prejudice the exercise of the executive power of the Union, and the executive power of the union shall extend to the giving of such directions to a state as may appear to the Government of India to be necessary for that purpose?","o":["Article 261","Article 247","Article 257","Article 123"],"a":2,"e":"Article 257 - Control of the Union over States in certain cases. Article 261 - Public acts, records and judicial proceedings."},{"t":"Articles, Schedules & Parts","n":79,"tag":"","q":"Consider the following statements regarding Article 77 of the Indian Constitution:\n1. It empowers the Prime Minister to make rules for the transaction of the business of the Government of India.\n2. It provides for the allocation of government business among Ministers. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The President shall make rules for the more convenient transaction of the business of the Government of India, and for the allocation among Ministers of the said business. Article 67 - Term of office of Vice - President."},{"t":"Articles, Schedules & Parts","n":80,"tag":"","q":"Which of the following Articles of the Indian Constitution mentions, about the organisation of 'Village Panchayats'?","o":["Article 31","Article 38","Article 36","Article 40"],"a":3,"e":"Article 40 : This article directs the state to organise village panchayats and empower them to function as self-governing units. Directive Principles of State Policy (DPSPs): Outlined in Part IV (Articles 36 - 51) of the Constitution, inspired by the Irish Constitution."},{"t":"Articles, Schedules & Parts","n":81,"tag":"","q":"Consider the following statements regarding Article 166 of the Indian Constitution:\n1. It provides for the conduct of business of the Government of a State.\n2. It empowers the Governor to make rules for the convenient transaction of such business and the allocation among Ministers. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 164 (1) - The Chief Minister shall be appointed by the Governor and the other Ministers shall be appointed by the Governor on the advice of the Chief Minister, and the Ministers shall hold office during the pleasure of the Governor."},{"t":"Articles, Schedules & Parts","n":82,"tag":"","q":"Consider the following provisions of the Directive Principles of State Policy (DPSPs):\n1. Article 36 defines the term “State” for the purpose of Part IV of the Constitution.\n2. Article 37 states that the DPSPs are enforceable by the courts.\n3. Article 38 directs the State to secure a social order for the promotion of the welfare of the people. Which of the statements given above is/are correct ?","o":["1 and 3 only","2 and 3 only","3 only","1, 2 and 3"],"a":0,"e":"Other Articles: Article 36 : Defines the Directive Principles of State Policy. Article 37: States that DPSPs are not enforceable by courts but are fundamental in governance, and the state is expected to apply them in making laws. Article 39: Outlines specific principles for state policy that promote social and economic welfare, such as equal pay for equal work, protection of children, and equitable distribution of resources."},{"t":"Articles, Schedules & Parts","n":83,"tag":"","q":"Which article of the Constitution of India lays down that it shall be the duty of the Advocate-General to give advice to the Government of the State upon legal matters?","o":["Article 168","Article 165","Article 167","Article 166"],"a":1,"e":"Article 165. Other Important Articles: Article 167 - Duties of Chief Minister as respects the furnishing of information to the Governor, etc. Article 168 - Constitution of Legislatures in States."},{"t":"Articles, Schedules & Parts","n":84,"tag":"","q":"Articles 245 to 255 in Part XI of the Indian Constitution deal with the _______.","o":["emergency provisions","financial relations between the Centre and the states","legislative relations between the Centre and the states","tribunals"],"a":2,"e":"legislative relations between the Centre and the states. Emergency Provisions - Part XVIII, Articles 352 - 360. Tribunals - Part XIV-A Article 323A, and Article 323B. Financial relations between the Centre and the states - Part XII, Articles 268 - 293."},{"t":"Articles, Schedules & Parts","n":85,"tag":"","q":"Consider the following Directive Principles of State Policy (DPSPs):\n1. Provision for just and humane conditions of work and maternity relief – Article 42\n2. Promotion of cottage industries on an individual or co-operative basis in rural areas – Article 43\n3. Participation of workers in the management of industries - Article 43A Which of the above is/are correctly matched?","o":["1 and 2 only","2 and 3 only","1, 2 and 3","1 and 3 only"],"a":2,"e":"1, 2 and 3. Important Articles : Article 42 - Provision for just and humane conditions of work and maternity relief. Article 43A - Participation of workers in management of Industries. Article 43B - Promotion of co-operative societies."},{"t":"Articles, Schedules & Parts","n":86,"tag":"","q":"Which part of the Constitution deals with the Panchayats ?","o":["Part IV","Part IX","Part VII","Part X"],"a":1,"e":"Part IX. The Panchayats (Articles 243-243O): This part was inserted by the 73rd Constitutional Amendment Act, 1992, and came into effect on April 24, 1993. Part IV: Directive Principles of State Policy. Part VII: States in the First Schedule (now repealed). Part X: The Scheduled and Tribal Areas."},{"t":"Articles, Schedules & Parts","n":87,"tag":"","q":"Consider the following statements regarding Part V (Articles 52 to 78) of the Indian Constitution:\n1. It contains provisions related to the President and Vice-President of India.\n2. It defines the powers of the Attorney-General for India.\n3. It deals with the Union Executive. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 — Articles 52 to 78 in Part V deal with the Union Executive, covering the President (Art. 52), Vice-President (Art. 63), Council of Ministers (Art. 74), and Attorney-General (Art. 76), among other provisions."},{"t":"Articles, Schedules & Parts","n":88,"tag":"","q":"Which of the following articles of the Indian constitution deals with the parliament and its proceedings?","o":["Article 51A","Article 36 to 51","Article 79 to 122","Article 12 to 35"],"a":2,"e":"Article 79 to 122. These articles in Part V of the Indian Constitution deal with the provisions related to the Parliament of India, including its organisation, composition, duration, officers, procedures, privileges, powers, and other related aspects."},{"t":"Articles, Schedules & Parts","n":89,"tag":"","q":"Consider the following statements about environmental protection in the Indian Constitution:\n1. The Directive Principles of State Policy include a provision for protecting and improving the environment and safeguarding forests and wildlife.\n2. This provision is contained in Article 48-A of the Constitution.\n3. Article 48-A was inserted by the 42nd Constitutional Amendment Act, 1976. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 - Article 48-A, part of the DPSPs, directs the State to protect and improve the environment and safeguard forests and wildlife; it was added through the 42nd Amendment in 1976, inspired by the Irish Constitution."},{"t":"Articles, Schedules & Parts","n":90,"tag":"","q":"Which of the following Articles of the Indian Constitution mentions that ‘The State shall, in particular, direct its policy towards securing that the ownership and control of the material resources of the community are so distributed as best to subserve the common good’ ?","o":["Article 39(a)","Article 39(b)","Article 39(c)","Article 39(d)"],"a":1,"e":"Article 39(b). This article is part of the Directive Principles of State Policy (DPSP), which outlines the guiding principles for the state to follow while making policies. Article 39(a): Ensures citizens have equal rights to an adequate means of livelihood. Article 39(c): Prevents concentration of wealth and means of production. Article 39(d): Advocates for equal pay for equal work for men and women."},{"t":"Articles, Schedules & Parts","n":91,"tag":"","q":"Consider the following statements regarding provisions in the Indian Constitution:\n1. Articles 168 to 212 in Part VI deal with the State Legislature.\n2. Articles 214 to 231 relate to the High Courts in the States.\n3. Articles 79 to 122 in Part V are about the Parliament of India. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3 — Articles 168–212 in Part VI govern the structure, composition, and functioning of State Legislatures; Articles 214–231 pertain to High Courts; Articles 79–122 in Part V relate to Parliament; while Articles 243–243-O in Part IX cover Panchayats."},{"t":"Articles, Schedules & Parts","n":92,"tag":"","q":"Which Article of the Indian Constitution mentions about the 'Promotion of educational and economic interests of Scheduled Castes, Scheduled Tribes and other weaker sections' ?","o":["Article 45","Article 48","Article 47","Article 46"],"a":3,"e":"Article 46. Article 45 directs the state to ensure early childhood care and education for children under the age of six. Article 48 provides guiding principles for organizing agriculture and animal husbandry in India. Article 47 outlines the state's duty to improve the standard of living and nutrition for its citizens."},{"t":"Articles, Schedules & Parts","n":93,"tag":"","q":"Consider the following statements:\n1. Article 79 of the Constitution states that Parliament consists of the President and two Houses — the Council of States (Rajya Sabha) and the House of the People (Lok Sabha).\n2. Article 82 deals with the composition of the House of the People. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only — Article 79 correctly defines the Parliament’s composition, but Article 82 is about readjustment of seats after each census, not the composition of the House of the People (which is in Article 81)."},{"t":"Articles, Schedules & Parts","n":94,"tag":"","q":"In a situation wherein A (female) and B (male) are working in the same office, same designation, same nature of work but unequal payment, which of the following Articles of the Constitution be applicable?","o":["Article 48A","Article 39(d)","Article 21","Article 18"],"a":1,"e":"Article 39(d) of the Constitution proclaims \"equal pay for equal work for both men and women\" as a Directive Principle of State Policy (DPSP). Article 21: Guarantees the fundamental right to protection of life and personal liberty. Article 18: Abolition of titles."},{"t":"Articles, Schedules & Parts","n":95,"tag":"","q":"Which Articles of the Constitution deal with citizenship ?","o":["Articles 5 to 11","Articles 5 to 8","Articles 5 to 10","Articles 5 to 9"],"a":0,"e":"Articles 5 to 11. Part II of the Constitution of India deals with Citizenship: Article 5 - Citizenship at the commencement of the Constitution. Article 6 - Rights of citizenship of certain persons who have migrated to India from Pakistan. Article 7 - Rights of citizenship of certain migrants to Pakistan. Article 8 - Rights of citizenship of certain persons of Indian origin residing outside India. Article 9 - Persons voluntarily acquiring citizenship of a foreign State not to be citizens. Article 10 - Continuance of citizenship rights. Article 11- Parliament to regulate the right of citizenship by law."},{"t":"Articles, Schedules & Parts","n":96,"tag":"","q":"Consider the following statements:\n1. Article 142 empowers the Supreme Court to pass any decree or order necessary for doing complete justice in any case.\n2. Article 141 deals with the ancillary powers of the Supreme Court. Which of the above statements is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Article 141 of Indian Constitution provides that the law declared by the Supreme Court shall be binding on all courts within the territory of India."},{"t":"Articles, Schedules & Parts","n":97,"tag":"","q":"Which of the following Articles in the Constitution of India provides protection to the President and Governors and Rajpramukhs ?","o":["Article 352","Article 356","Article 361","Article 370"],"a":2,"e":"Article 361 . Other Articles: Article 352: Deals with the proclamation of Emergency due to war, external aggression, or internal disturbance. Article 356: Relates to the President's rule in a state, where the President takes over the governance of a state due to failure of the constitutional machinery. Article 370: Provided special status to the state of Jammu and Kashmir, which was repealed in 2019."},{"t":"Articles, Schedules & Parts","n":98,"tag":"","q":"Which Article provides that all minorities have the right to establish and administer educational institutions of their choice ?","o":["Article 26","Article 24","Article 32","Article 30"],"a":3,"e":"Article 30. Other important articles: Article 26 - It gives freedom to manage religious affairs. Article 24 - It prohibits the employment of children below the age of 14 years in any factory, mine, or hazardous occupation. Article 32 - It grants every individual the right to move the Supreme Court for the enforcement of their fundamental rights."},{"t":"Articles, Schedules & Parts","n":99,"tag":"","q":"Consider the following statements:\n1. The Eighth Schedule of the Constitution currently contains 22 scheduled languages.\n2. Bodo, Dogri, Maithili, and Santhali were added to the Eighth Schedule by the 71st Constitutional Amendment Act, 1992. Which of the above statements is/are correct ?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . The Eighth Schedule indeed has 22 scheduled languages, but Bodo, Dogri, Maithili, and Santhali were added by the 92nd Constitutional Amendment Act, 2003, and the 71st Amendment added Konkani, Manipuri, and Nepali."},{"t":"Articles, Schedules & Parts","n":100,"tag":"","q":"Article 15 of the Constitution of India entails:","o":["equality of opportunity for all citizens in matters relating to employment or appointment","prohibition of discrimination against any citizen on grounds only of religion, race, caste, sex or place of birth","cultural and educational rights","freedom of speech and expression"],"a":1,"e":"Other important articles: Article 16 - Equality of opportunity for all citizens in matters relating to employment or appointment. Articles 29 - The cultural and educational rights of minorities. Article 30 - The right of minorities to establish and administer educational institutions of their choice. Article 19(1)(a) - Freedom of speech and expression."},{"t":"Articles, Schedules & Parts","n":101,"tag":"","q":"Consider the following statements regarding ‘Reservation in promotion’ in the Indian Constitution:\n1. Article 16 of the Constitution deals with equality of opportunity in matters of public employment.\n2. Clause (4A) of Article 16, inserted by the 77th Constitutional Amendment Act, 1995, provides for reservation in promotion for SCs and STs if they are underrepresented in services. Which of the above statement(s) is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Article 16(4) allows the state to provide reservations for appointments or posts for any backward class of citizens that is not adequately represented in state services. Article 16: Equality of opportunity in matters of public employment. The 77th Amendment Act introduced clause (4A) to Article 16, which specifically permits reservations in promotions for Scheduled Castes (SC) and Scheduled Tribes (ST) if they are underrepresented in the services."},{"t":"Articles, Schedules & Parts","n":102,"tag":"","q":"Articles 344 (1) and 351 of the Constitution of India are related to the:","o":["Eighth Schedule","Third Schedule","Sixth Schedule",
