onal Data Protection Act, 2023 (DPDPA) is India’s landmark law on safeguarding personal data. The Notice and Choice Framework ensures that entities (called Data Fiduciaries) must provide individuals (Data Principals) with a clear notice of what data is being collected, why it is being collected, and how it will be used. It also requires obtaining explicit and informed consent from individuals before processing their personal data."},{"t":"Miscellaneous","n":452,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which of these is not a feature of Indian federalism?","o":["Independent Judiciary","Written Constitution","Dual Citizenship","Division of Powers"],"a":2,"e":"Dual Citizenship . India provides single citizenship for all its citizens, unlike countries like the USA which follow dual citizenship under federalism. Other features of Indian federalism include a written constitution, independent judiciary, and clear division of powers."},{"t":"Miscellaneous","n":453,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"What is the punishment for abetment of an offense under the POCSO Act?","o":["Same punishment as the offense","Half the punishment prescribed for the offense","No punishment","Community service"],"a":0,"e":"Same punishment as the offense. Under the Protection of Children from Sexual Offences (POCSO) Act, 2012, abetment of an offense is treated with the same gravity as the actual commission of the offense. Section 16 of the Act defines abetment, and Section 17 prescribes that anyone who abets a POCSO offense shall be punished with the same punishment as is provided for the offense itself. This strict provision ensures that those who encourage, assist, or facilitate crimes against children are held equally accountable, thereby strengthening child protection."},{"t":"Miscellaneous","n":454,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"If \"a soldier fires on a mob by the order of his superior officer, in conformity with the law\". According to the Bharatiya Nyaya Sanhita, 2023, has he committed an offence?","o":["Yes, because he could have disobeyed","Yes, because violence is punishable","No, because he followed public orders","No, because he believed in good faith that he was bound by law"],"a":3,"e":"Under the Bharatiya Nyaya Sanhita, 2023 (earlier IPC Section 76), an act done by a person who believes in good faith that they are bound by law is not an offence. A soldier acting under lawful orders of a superior, in conformity with the law, is protected from criminal liability."},{"t":"Miscellaneous","n":455,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Identify the following constitutional attributes with their respective democratic values: Column A Column B a) Fundamental i. Grassroots Duties democracy b) Equal voting ii. Respect for rights individual conscience c) Local self- iii. Recognition of government citizens' provisions responsibilities d) Religious iv. Principle of freedom universal franchise assurance","o":["a-ii, b-i, c-iv, d-iii","a-i, b-ii, c-iii, d-iv","a-iii, b-iv, c-i, d-ii","a-iv, b-iii, c-ii, d-i"],"a":2,"e":"a-iii, b-iv, c-i, d-ii."},{"t":"Miscellaneous","n":456,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Under which ministry does the National Productivity Council operate ?","o":["Ministry of Education","Ministry of Commerce and Industry","Ministry of Social Justice and Empowerment","Ministry of Agriculture"],"a":1,"e":"Ministry of Commerce and Industry. National Productivity Council (NPC)is an autonomous, non-profit organization. Established in 1958 to promote productivity culture in India. It works on consultancy, training, productivity promotion, and research. It functions under the Ministry of Commerce and Industry (Department for Promotion of Industry and Internal Trade – DPIIT)."},{"t":"Miscellaneous","n":457,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Consider the following statements: Statement I: Land and agriculture fall under the State List. Statement II: Marriage laws and adoption fall under the Concurrent List. Which of the statements given above is/are correct ?","o":["Only Statement I is correct","Only Statement II is correct","Both statements I and II are correct","Neither statement I nor II is correct"],"a":2,"e":"Both statements I and II are correct. Subjects like land, rights in land, land revenue, agriculture, agricultural education & research are placed in the State List under the 7th Schedule of the Indian Constitution. Matters like marriage, divorce, infants, minors, adoption, succession, transfer of property are in the Concurrent List. This allows both Parliament and State legislatures to make laws (e.g., Hindu Marriage Act, Special Marriage Act)."},{"t":"Miscellaneous","n":458,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"The new criminal laws aim to replace British-era laws with a focus on:","o":["Political advantages","Religious governance","Corporate laws","Justice delivery and citizen rights"],"a":3,"e":"New Criminal Laws (Effective from July 1, 2024): Replaced the British-era laws: Indian Penal Code (IPC), 1860 → Bharatiya Nyaya Sanhita (BNS), 2023. Code of Criminal Procedure (CrPC), 1973 → Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023. Indian → Evidence Act, 1872 Bharatiya Sakshya Adhiniyam (BSA), 2023. Main Focus: Justice delivery over punishment. Protection of citizen rights. Speedier trials, use of technology, stronger provisions against crimes like terrorism, mob lynching, crimes against women and children. Ending colonial legacy and making laws more citizen-centric."},{"t":"Miscellaneous","n":459,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Under Chapter V of the Bharatiya Sakshya Adhiniyam, 2023, which of the following qualifies as primary evidence?","o":["A counterpart document executed by one of the parties","A photocopy of the document signed by a clerk","A handwritten summary prepared later","A typed copy of the original document"],"a":0,"e":"Under Section 57 of the Bharatiya Sakshya Adhiniyam, 2023, primary evidence is defined as the document itself produced for the inspection of the Court. Explanation 2 of this section clarifies that when a document is executed in counterpart, with each counterpart being signed by one or some of the parties, each counterpart is considered primary evidence against the party who executed it."},{"t":"Miscellaneous","n":460,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"What is the maximum time limit for completing the trial of a case under the POCSO Act?","o":["6 months","3 years","2 years","1 year"],"a":3,"e":"1 year. Under the Protection of Children from Sexual Offences (POCSO) Act, 2012, the law mandates that the trial for any offence under the Act should be completed within one year from the date the court takes cognizance of the case. This time-bound trial provision is aimed at delivering swift justice to child victims of sexual offences, minimizing their trauma and ensuring the justice system is sensitive to their needs. The Act recognizes the vulnerability of children and thus puts emphasis on a child-friendly, efficient, and expeditious legal process."},{"t":"Miscellaneous","n":461,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Which discretionary power allows a Governor to reserve a bill passed by the state legislature for the consideration of the President?","o":["To send a report to the President for the imposition of President's Rule.","To reserve a bill for the President's consideration.","To grant pardon in certain cases.","To summon, prorogue, and dissolve the state legislative assembly."],"a":1,"e":"To reserve a bill for the President's consideration. Under Article 200 of the Indian Constitution, the Governor has the discretionary power to reserve certain state bills for the consideration of the President. While most bills are assented to by the Governor, in specific cases (especially those that may conflict with central laws, affect national interest, or fall under the ambit of Article 31A, 31C, etc.), the Governor may choose to withhold assent and refer the bill to the President."},{"t":"Miscellaneous","n":462,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following statements regarding the implementation challenges of UCC is most accurate in the context of judicial interpretations and recent state-level developments?","o":["UCC is enforceable only when ratified by all religious communities through a national referendum.","The Law Commission of India (2018) recommended UCC for all religions to ensure uniformity.","The Supreme Court has uniformly declared UCC as mandatory across states.","The UCC is already implemented in Goa and Uttarakhand through their respective legislative frameworks."],"a":3,"e":"The Uniform Civil Code (UCC) has been discussed in multiple Supreme Court judgments as a directive principle but has not been made mandatory across India. The 2018 Law Commission stated that a UCC was neither necessary nor desirable at that stage, instead suggesting reforms within personal laws. Goa already follows a Portuguese Civil Code, functioning as a form of UCC, and Uttarakhand passed its own UCC legislation in 2024, marking the first state to do so under Indian law."},{"t":"Miscellaneous","n":463,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"As per the Bharatiya Nagarik Suraksha Sanhita, 2023, which of the following best defines \"electronic communication\"?","o":["Any information transmitted using electronic devices like phones or computers","Only video calls conducted through secure government networks","Telephonic conversations recorded manually","Verbal messages sent through written documents only"],"a":0,"e":"According to Section 2 of the Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023, \"electronic communication\" is broadly defined as the transmission of any written, verbal, pictorial information, or video content using electronic devices. This includes devices like telephones, mobile phones, computers, and any other electronic means specified by the government. The definition is comprehensive, covering various forms of digital information exchange."},{"t":"Miscellaneous","n":464,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Which of the following best reflects the constitutional dilemma in implementing the Uniform Civil Code (UCC) in India, as discussed in debates surrounding Article 44 and Article 25?","o":["UCC allows gender-based personal law systems to remain untouched under Article 14","UCC enforces cooperative federalism by giving states legislative powers on personal law","UCC operationalises the secular ethos by completely eliminating all religious laws","UCC aligns with Article 44 but may be seen to infringe upon religious freedom under Article 25"],"a":3,"e":"Article 44 (Directive Principle): Directs the State to endeavor to secure a Uniform Civil Code for all citizens, promoting unity and gender justice by replacing religion-based personal laws with a common set of rules. Article 25 (Fundamental Right): Guarantees freedom of conscience and the right to freely profess, practice, and propagate religion. The dilemma: Implementing UCC ensures equality (Article 14) and fulfills Article 44’s directive, but it may be perceived as restricting Article 25 if it overrides religious practices tied to personal laws (marriage, divorce, succession, etc.)."},{"t":"Miscellaneous","n":465,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Consider the below statements:\n1. Governor is state's constitutional head.\n2. He acts solely on Council's advice. Which of the above statements holds true regarding Governor's executive powers?","o":["Both 1 and 2","Only 1","Only 2","Neither 1 nor 2"],"a":1,"e":"Only 1. Statement 1 – Correct. The Governor is the constitutional head of the state (Article 153). Just as the President is the head of the Union, the Governor is the head of the State Executive. Statement 2 – Incorrect. The Governor is required to act on the aid and advice of the Council of Ministers headed by the Chief Minister (Article 163). However, he does not act solely on their advice. In certain matters, he exercises discretionary powers (e.g., reserving bills for the President, recommending President’s Rule under Article 356, appointment of CM in a hung assembly, etc.)."},{"t":"Miscellaneous","n":466,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Under Section 25(1) of the Bharatiya Nagarik Suraksha Sanhita, 2023, what may the Court do when a person is convicted in one trial for multiple offences?","o":["Can impose only one punishment for all the offences, regardless of their nature","Must give the harshest punishment only and remit other punishments altogether","Shall suspend all sentences unless directed by a higher court in the same trial","May impose punishments to run either concurrently or consecutively as appropriate"],"a":3,"e":"Section 25(1) of the Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023 deals with the sentencing in cases where a person is convicted of two or more offences in the same trial. It empowers the Court to: Award punishments for each offence separately. Direct that the punishments may run concurrently (at the same time) or consecutively (one after the other), depending on the facts of the case and judicial discretion. This provision is similar to Section 31(1) of the Code of Criminal Procedure (CrPC), 1973."},{"t":"Miscellaneous","n":467,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which of the following pairs of newly created States/Union Territories after the States Reorganisation Act, 1956 is correctly matched?","o":["Jharkhand – 2001","Uttarakhand – 1998","Chhattisgarh – 2000","Telangana – 2001"],"a":2,"e":"Chhattisgarh - 2000. The States Reorganisation Act, 1956 reorganized Indian states on linguistic basis. After that, several new states were created in later years through separate legislations: Chhattisgarh - Created on 1st November 2000, carved out of Madhya Pradesh. Jharkhand - Created on 15th November 2000, carved out of Bihar (not 2001). Uttarakhand - Created on 9th November 2000 as Uttaranchal (renamed Uttarakhand in 2007), not 1998. Telangana - Created on 2nd June 2014, carved out of Andhra Pradesh (not 2001)."},{"t":"Miscellaneous","n":468,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which Indian state does S. Jaishankar represent in the Rajya Sabha?","o":["Maharashtra","Gujarat","Uttar Pradesh","Tamil Nadu"],"a":1,"e":"Gujarat. He was first elected to the Rajya Sabha in 2019 from Gujarat and re-elected in 2023 for his second term, again representing Gujarat. Gujarat elects 11 members to the Rajya Sabha (the upper house of India's Parliament), who are chosen indirectly by the state's Legislative Assembly members. Additionally, as part of overall Parliamentary representation, Gujarat holds 26 Lok Sabha seats (the lower house), making a total of 37 directly or indirectly elected MPs from the state."},{"t":"Miscellaneous","n":469,"tag":"","q":"On which date did Punjab abolish the Legislative Council?","o":["1 January 1971","1 January 1977","1 January 1975","1 January 1970"],"a":3,"e":"1 January 1970. The Punjab Legislative Council (Abolition) Act, 1969 abolished the Legislative Council of Punjab, leading to the cessation of its members' positions. It amended Article 168 of the Constitution, removing reference to Punjab, and made changes to the Representation of the People Act, 1950."},{"t":"Miscellaneous","n":470,"tag":"","q":"Consider the following statements regarding the ‘Rule of Law’ in the Indian Constitution: A. The ‘Rule of Law’ is a key feature of the Indian Constitution and is a doctrine ascribed to Albert Venn Dicey. B. Plato, Adam Smith, and Karl Marx are not associated with the doctrine of the Rule of Law. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The Rule of Law, a fundamental principle in the Indian Constitution, was popularized by Albert Venn Dicey, a British jurist. Plato, Adam Smith, and Karl Marx contributed to philosophy, economics, and political theory, but not specifically to the doctrine of the Rule of Law."},{"t":"Miscellaneous","n":471,"tag":"","q":"The National Population Register was created under the provisions of ___________ and ___________ . a. the Citizenship Act, 1965 b. the Citizenship Rules, 2004 c. the Citizenship Act, 1955 d. the Citizenship Rules, 2003","o":["a; c","a; b","b; d","c; d"],"a":3,"e":"c; d. The Citizenship Act, 1955 provides for the acquisition and loss of citizenship after the commencement of the Constitution. Originally, the Act 1955 also provided for Commonwealth Citizenship. But, this provision was repealed by the Citizenship (Amendment) Act, 2003."},{"t":"Miscellaneous","n":472,"tag":"","q":"Which party formed the government in Britain in the year 1945?","o":["Democratic Party","Labour Party","Socialist Party","Liberal Party"],"a":1,"e":"Labour Party. In the 1945 general elections in Britain, the Labour Party, under the leadership of Clement Attlee, achieved a decisive victory, defeating Winston Churchill's Conservative Party. Democratic Party is one of the two major political parties, alongside the Republican Party, in the United States."},{"t":"Miscellaneous","n":473,"tag":"","q":"The concept of Public Interest Litigation originated in _______________.","o":["Switzerland","Iceland","USA","New Zealand"],"a":2,"e":"USA. Public Interest Litigation (PIL) means litigation filed in a court of law, for the protection of “Public Interest”, such as Pollution, Terrorism, Road safety, Constructional hazards etc. The concept of PIL was initially sown in India by Justice Krishna Iyer, in 1976 in Mumbai Kamagar Sabha vs. Abdul Thai."},{"t":"Miscellaneous","n":474,"tag":"","q":"Dr. B. R. Ambedkar described Directive Principles of State Policy as __________of the Indian constitution.","o":["soul of the state","identity card of the constitution","The most precious part of the constitution","a novel feature of the constitution"],"a":3,"e":"a novel feature of the Indian constitution."},{"t":"Miscellaneous","n":475,"tag":"","q":"In which of the following years was the Right of Persons with Disabilities Act passed?","o":["2010","2002","2016","2019"],"a":2,"e":"2016. The Rights of Persons with Disabilities (RPwD) Act came into force from 19th April, 2017. It replaced the Persons with Disabilities (Equal Opportunities, Protection of Rights and Full Participation) Act, 1995. Objective - To ensure that all persons with disabilities can lead their lives with dignity, without discrimination and with equal opportunities."},{"t":"Miscellaneous","n":476,"tag":"","q":"When did a States Reorganisation Commission was set up, which recommended the creation of linguistic States on the basis of larger linguistic groups?","o":["December 1963","December 1953","December 1956","December 1958"],"a":1,"e":"December 1953. India faced demands to reorganise states based on regional languages after independence. In November 1956, India underwent division into 14 states and six union territories through the implementation of the State Reorganisation Act. The Andhra State held the distinction of being the first state of Independent India, and it was later transformed into Andhra Pradesh on the 1st of November 1956. The State Reorganisation Commission was chaired by Fazal Ali, and two other members, namely K. M. Panikkar and H. N. Kunzru."},{"t":"Miscellaneous","n":477,"tag":"","q":"Which of the following states is one of those states that have no Panchayati Raj Institution at all?","o":["Assam","Gujarat","Nagaland","Punjab"],"a":2,"e":"Nagaland. Panchayats (Part IX, Articles 243 to 243-O): It is the system of local self-government of villages in rural India. Rajasthan was the first state to implement Panchayati Raj in India (on October 2nd, 1959, in Nagaur district), followed by Andhra Pradesh later in 1959. 24th April - National Panchayati Raj Day. Currently, the Panchayati Raj system exists in all states except Nagaland, Meghalaya, and Mizoram, and in all Union Territories except Delhi."},{"t":"Miscellaneous","n":478,"tag":"","q":"The Citizenship Act, 1955 does NOT deal with ____________.","o":["acquisition","determination","election","termination"],"a":2,"e":"election. The Citizenship Act, 1955 deals with the acquisition, determination, and termination of Indian citizenship. Citizenship Acquisition: The Act provides for the acquisition of citizenship by birth, descent, registration, naturalization, and incorporation of territory. Citizenship Determination: The Act defines how to determine Indian citizenship. Citizenship Termination: The Act provides for the termination and deprivation of citizenship. Election Commission of India: PART XV (Article 324-329) of the Constitution."},{"t":"Miscellaneous","n":479,"tag":"","q":"Which Section of the Representation of People’s Act (RPA), 1951 deprives the prisoners of their right to vote?","o":["Section 10 (4)","Section 72 (5)","Section 62 (5)","Section 15 (3)"],"a":2,"e":"Section 62 (5) : A person cannot vote in an election if they are in prison or in police custody. However, this rule does not apply to those in preventive detention. Even if someone cannot vote due to imprisonment, they still remain an elector if their name is on the electoral roll."},{"t":"Miscellaneous","n":480,"tag":"","q":"The proclamation of which Act by the King of England in 1773 paved the way for the establishment of the Supreme Court at Calcutta?","o":["Pitt’s India Act","Indian Councils Act","Regulating Act","Charter Act"],"a":2,"e":"Regulating Act. The Regulating Act of 1773 led to the establishment of the Supreme Court at Calcutta, which included a chief justice (Elijah Impey) and three other judges. An amendment in 1781 exempted the Governor-General, the Council, and government officials from its jurisdiction while performing their duties."},{"t":"Miscellaneous","n":481,"tag":"","q":"Which directive principle has been implemented in establishing Handloom and Handicrafts Boards?","o":["Participation of workers in management of Industries","Provision for just and humane condition of work","Protection and improvement of environment","Promote cottage industries on cooperative basis"],"a":3,"e":"The All India Handloom Board (AIHB) and the All India Handicrafts Board (AIHB) were two boards in India aimed to promote and develop cottage industries, such as handlooms and handicrafts, through cooperative efforts and support. The All India Handicrafts Board was set up in 1952 whereas the All India Handloom Board was established in 1992. However, the government decided to abolish the board in 2020 as part of its vision of \"Minimum Government and Maximum Governance\"."},{"t":"Miscellaneous","n":482,"tag":"","q":"Which south-eastern Dravidian language has been approved by Odisha state to be included in the Eighth Schedule of the Constitution of India, on 10th July 2023 ?","o":["Kui","Malto","Tulu","Kodagu"],"a":0,"e":"Kui. It is spoken by the Kandhas community. It is closely related to the Gondi and Kuvi languages. Some other languages included in the eighth schedule are: Sindhi was introduced in 1967. Konkani, Manipuri, and Nepali in 1992. Santali, Dogri, Maithili, and Bodo in 2003."},{"t":"Miscellaneous","n":483,"tag":"","q":"Which of the following organisation’s initiative is ‘India Justice Report’?","o":["HCL Foundation","Infosys Foundation","Tata Trusts","Azim Premji Foundation"],"a":2,"e":"Tata Trusts. The India Justice Report (IJR) is an initiative by Tata Trusts, in collaboration with the Centre for Social Justice, Common Cause, and the Commonwealth Human Rights Initiative, among others. It was first published in 2019. Karnataka was the top-ranked state in the 2022 India Justice Report (IJR)."},{"t":"Miscellaneous","n":484,"tag":"","q":"Which of the following is NOT a way to acquire citizenship in India ?","o":["Incorporation of territory","Renunciation","Registration","Birth"],"a":1,"e":"Renunciation. There are five recognized ways to acquire citizenship in India under the Citizenship Act, 1955: By Birth - A person born in India can acquire citizenship by birth. By Descent - A person born outside India to Indian parents can acquire citizenship. By Registration - Certain persons, such as foreign nationals married to Indian citizens, can acquire citizenship through registration. By Naturalization - Foreign nationals can acquire citizenship after fulfilling certain residency requirements. By Incorporation of Territory - If a foreign territory becomes part of India."},{"t":"Miscellaneous","n":485,"tag":"","q":"Which of the following Sections of the Indian Penal Code deals with 'rape'?","o":["Section 370","Section 375","Section 380","Section 385"],"a":1,"e":"Section 375. Section 370 of the Indian Penal Code (IPC) deals with the crime of human trafficking. Section 380 of the Indian Penal Code (IPC) deals with theft in a dwelling house, tent, or vessel that is used as a human dwelling or for the custody of property. Section 385 of the Indian Penal Code (IPC) deals with putting someone in fear of injury to commit extortion. According to BNS (Bhartiya Nyaya Sanhita) Section for Rape is Section 63 and for Punishment for rape is Section 64."},{"t":"Miscellaneous","n":486,"tag":"","q":"Who is the Chief Executive Head of the State ?","o":["President","Governor","CM","PM"],"a":1,"e":"Governor. He is appointed by the President for a five-year term and holds office at the President's pleasure. The Governor has several key powers, including appointing the Chief Minister and other Ministers (Article 164), assenting or withholding assent to bills (Article 200), promulgating ordinances (Article 213), and granting pardons (Article 161)."},{"t":"Miscellaneous","n":487,"tag":"","q":"How many members (elected and nominated) were there in the Council of State under the Government of India Act 1919 passed by the Parliament of the United Kingdom to expand participation of Indians in the government of India?","o":["70","50","75","60"],"a":3,"e":"60. The Central Legislature was made more powerful and more representative by the Government of India Act, 1919. The Act made the Governor-General the chief executive authority. 26 nominated; 34 elected (20 General, 10 Muslims, 3 Europeans and 1 Sikh)."},{"t":"Miscellaneous","n":488,"tag":"","q":"Which of the following was widely considered as the ‘heaven born service’ for Indians during British rule?","o":["Military service on the Burma front","The Indian Civil Service or ICS","The Indian Judicial Service","The British Indian Army"],"a":1,"e":"The Indian Civil Service or ICS. It was brought into existence by Lord Cornwallis (1786-93) to check the corruption in the East India company (EEIC). The Charter Act of 1853 provided for Open competition for ICS examination. Satyendranath Tagore was the first Indian to join ICS in 1863. Aitchson commission (1886) and Lee commission (1926) is related to reform in ICS."},{"t":"Miscellaneous","n":489,"tag":"","q":"Which of the following is the proposed successor to the Information Technology Act, 2000?","o":["Digital India Bill","Cyber India Bill","Optical India Bill","Multimedia Bill"],"a":0,"e":"Digital India Bill. The Digital India Act (DIA) aims to regulate the digital ecosystem, including cybersecurity, digital governance, and internet intermediaries. The Information Technology Act, 2000 (ITA-2000), notified on 17 October 2000, is India's primary law addressing cybercrime and e-commerce. Secondary legislation includes the Intermediary Guidelines Rules, 2011, and the IT (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021."},{"t":"Miscellaneous","n":490,"tag":"","q":"The ‘Pradhan Mantri Jan Arogya Yojana’ (‘PM-JAY’) scheme of the government is associated with which of the following Directive Principles of State Policy ?","o":["Participation of workers in the management of industries","Promotion of co-operative societies","Equal justice and free legal aid","Duty of State to raise the level of nutrition and the improvement of public health"],"a":3,"e":"Article 47 - Duty of the State to raise the level of nutrition and the improvement of public health. Part IV - Directive Principles of State Policy (Article 36 to 51): Article 38 - State to secure a social order for the promotion of welfare of the people."},{"t":"Miscellaneous","n":491,"tag":"","q":"Consider the following statements regarding the Benami Transactions (Prohibition) Act: A. The Benami Transactions (Prohibition) Act was originally enacted in 1988. B. The Act was amended in 2016 and renamed as the Prohibition of Benami Property Transactions Act, 1988. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The Benami Transactions (Prohibition) Act was enacted in 1988 to prohibit benami transactions and recover property held benami. The 2016 amendment renamed it the Prohibition of Benami Property Transactions Act and strengthened provisions for enforcement."},{"t":"Miscellaneous","n":492,"tag":"","q":"Who among the following founded an expatriate Communist Party of India at Tashkent in 1920?","o":["Jolly Kaul","M.N. Roy","P.C. Joshi","Shripad Amrut Dange"],"a":1,"e":"M.N. Roy (Father of Indian Communism) . He was the first person to give the idea of a Constituent Assembly for India and the creator of the Mexican Communist Party. Communist Party of India (CPI) - It is the oldest communist party in India. Founded - in modern-day Kanpur on 26 December 1925. First General Secretary - S.V. Ghate . Headquarters - Ajoy Bhavan (New Delhi)."},{"t":"Miscellaneous","n":493,"tag":"","q":"Which of the following Acts prevents disrespect to the National Flag and National Anthem?","o":["Prevention of insults to National Honour Act, 1971","Unlawful Activities (Prevention) Act, 2006","Protection of National Honour Act, 1996","Civil Liberties Act, 2001"],"a":0,"e":"Prevention of Insults to National Honour Act, 1971: Insults to Indian National Flag and Constitution of India - Whoever in any public place or in any other place within public view burns, mutilates, defaces, disfigures, destroys, tramples upon or into contempt the Indian National Flag or the Constitution of India or any part thereof, shall be punished with imprisonment for a term which may extend to three years, or with fine, or with both."},{"t":"Miscellaneous","n":494,"tag":"","q":"In the Interim Government formed on 2 September 1946, Liaquat Ali Khan was given the charge of:","o":["the External Affairs Ministry","the Finance Ministry","the Defence Ministry","the Home Ministry"],"a":1,"e":"The Finance Ministry. Interim Government (1946): Headed by Jawahar Lal Nehru. Sardar Vallabhbhai Patel held the Home Affairs, Information, and Broadcasting. Rajendra Prasad held the portfolio of Agriculture and Food. C Rajagopalachari was the Education and Arts Minister. Jagjivan Ram held the Labour Ministry. Jogendra Nath Mandal was the Law Minister."},{"t":"Miscellaneous","n":495,"tag":"","q":"Consider the following statement about the Government of India Act, 1935.\n1. This act was enacted by the British Parliament.\n2. This Act was divided into two separate acts for the India and Burma Government.\n3. This act commenced from 1 April 1935. Select the correct statement(s) using the code given below.","o":["Both 1 and 2","1, 2 and 3","Both 2 and 3","Both 1 and 3"],"a":0,"e":"Both 1 and 2 . The Government of India Act 1935 (Commenced in 1937): It provided for the establishment of an All India Federation consisting of provinces and princely states as units. It divided the powers between the Centre and units in terms of three lists, Federal List, Provincial List and Concurrent List."},{"t":"Miscellaneous","n":496,"tag":"","q":"Who propounded the concept of 'Rule of Law'?","o":["AV Dicey","CK Daphtary","Austin","AK Sen"],"a":0,"e":"AV Dicey. Rule of Law - It means all laws apply equally to all citizens of the country and no one can be above the law. Three principles of Rule of Law given by A.V. Dicey : Supremacy of law, Equality before law, Individual rights. Chander Kishan Daphtary - First solicitor general of India (1950-63)."},{"t":"Miscellaneous","n":497,"tag":"","q":"In which of the following years was the Child Marriage Restraint Act passed?","o":["1856","1947","1878","1929"],"a":3,"e":"1929. Child Marriage (The marriage of a girl or a boy before the age of 18 years). Prohibtion of Child Marriage Act (PCMA), 2006 :- It replaced the Child Marriage Restraints Act, 1929. The marriageable age to be 18 and 21 for girls and boys respectively Other laws to protect the child :- Juvenile Justice (Care and Protection of Children) Act, 2015, Domestic Violence Act, 2005 and the Protection of Children from Sexual Offences Act, 2012."},{"t":"Miscellaneous","n":498,"tag":"","q":"Justice Indu Malhotra penned a dissenting opinion in which of the following landmark judgements?","o":["Basic structure doctrine","Preamble part of the Constitution","Entry of women to Sabarimala","Land reforms in India"],"a":2,"e":"Entry of women to Sabarimala. Justice Indu Malhotra opined that religious practices cannot be solely tested on the basis of Article 14. The right to equality under Article 14 does not override the fundamental right to religion under Article 25. The notions of rationality cannot be invoked in matters of religion. The Supreme Court struck down provisions of the Kerala Hindu Places of Public Worship (Authorisation of Entry) Rules, 1965, and allowed women, irrespective of their age, to enter Sabarimala temple and worship the deity."},{"t":"Miscellaneous","n":499,"tag":"","q":"The Taxation Laws (Amendment) Act, 2021, amends the Income Tax Act of ________.","o":["1961","1974","1995","1988"],"a":0,"e":"1961. Taxation Law Amendment Act, 2021 - It aims to withdraw tax demands made using a 2012 retrospective legislation to tax the indirect transfer of Indian assets. Income Tax Act (1961) - It provides an elaborate mechanism for the levying of taxes, their administration, collection & recovery. It has 298 sections & 14 schedules."},{"t":"Miscellaneous","n":500,"tag":"","q":"The Constitution (One Hundred and Twenty Seventh Amendment) Bill, 2021, was introduced in the Lok Sabha by the ______ in August 2021.","o":["Minister of Social Justice and Empowerment","Minister of Minority Affairs","Minister of Tribal Affairs","Minister of Rural Development"],"a":0,"e":"Minister of Social Justice and Empowerment - By Dr. Virendra Kumar. 102 Amendment Act, 2018: Constitutional status was provided to the National Commission for Backward Classes under Article 338B. Articles 338 and 338A - The National Commission for Scheduled Castes (SC) and National Commission for Scheduled Tribes (ST), respectively. 103 rd Amendment Act, 2019:- Reservations for the Economic Weaker Section and amendment in Articles 15(6) and 16(6), provide 10% reservation in public employment."},{"t":"Miscellaneous","n":501,"tag":"","q":"Offences for which the police can arrest a person without an order from the court are called _________.","o":["Cognizable offences","Detention offences","Non Cognizable offences","Cross offences"],"a":0,"e":"Cognizable offenses - It includes murder, rape, theft, kidnapping, counterfeiting, etc. Detention - The act of . temporarily holding individuals in t custody or confinement, typically by a d government or governing authority by o removing their freedom or liberty at that time. Non-Cognizable offences - An offence for which a Police officer has no y authority to arrest without warrant. These . include offences like cheating, assault, n defamation etc. f"},{"t":"Miscellaneous","n":502,"tag":"","q":"Which act has been amended by , the Supreme Court of India to provide r equal rights to daughters in their ancestral property ?","o":["The Contempt of Courts Act","Hindu Succession Act","Hindu Marriage Act","Sharda Act"],"a":1,"e":"Hindu Succession Act (1956) - It governs the inheritance of property by Hindus, Buddhists, Jains, and Sikhs. Contempt of Courts Act (1971) - It defines the power to punish for contempt of court and regulates their procedure. Hindu Marriage Act (1955) - It defines the minimum age of 18 years for the bride and 21 years for the groom."},{"t":"Miscellaneous","n":503,"tag":"","q":"In which year was the Dowry Prohibition Act passed in India?","o":["1973","1982","1961","1954"],"a":2,"e":"1961. Dowry Prohibition Act: It extends to the whole of India except the State of Jammu and Kashmir. Important Acts in India - Hindu Widow Remarriage Act 1856, Child Marriage Restraint Act 1929, Muslim Women Protection of Rights on Marriage Act 2019 (Triple Talaq Act), Rights of Persons with Disabilities Act 2016, National Security Act 1980."},{"t":"Miscellaneous","n":504,"tag":"","q":"In which year was the Arms Act passed in India?","o":["1951","1955","1959","1964"],"a":2,"e":"The Indian Arms Act of 1959 : As per the preamble, this Act aims to consolidate and amend the law relating to arms and ammunition. The main objective of this Act is to regulate and restrict the circulation of arms and ammunition, which were illegal. It was enacted by the Indian government after independence, recognizing that certain law-abiding citizens must own and use firearms for sports, crop protection, and self-defence."},{"t":"Miscellaneous","n":505,"tag":"","q":"In which year was the Special Marriage Act passed in India?","o":["1958","1954","1962","1950"],"a":1,"e":"1954 . Special Marriage Act (SMA) is an Indian law that provides a legal framework for the marriage of people belonging to different religions or castes. The applicability of the Act extends to the people of all faiths, including Hindus, Muslims, Sikhs, Christians, Jains, and Buddhists, across India. The minimum age to get married under the SMA is 21 years for males and 18 years for females."},{"t":"Miscellaneous","n":506,"tag":"","q":"In India, according to the Insolvency and Bankruptcy Code, 2016, the process of insolvency resolution for companies should be completed in how many days?","o":["180","150","170","120"],"a":0,"e":"180. The Insolvency and Bankruptcy Code, 2016 (IBC) - A time - bound process for resolving insolvency in companies and among individuals. Objective - To consolidate and amend all existing insolvency laws, to simplify and expedite the Insolvency and Bankruptcy Proceedings, to promote entrepreneurship."},{"t":"Miscellaneous","n":507,"tag":"","q":"In which year was the Indian Parliamentary Group established?","o":["1950","1949","1948","1951"],"a":1,"e":"In 1949, The Indian Parliamentary Group was an autonomous body formed in the year 1949 in pursuance of a motion adopted by the Constituent Assembly (Legislative) on 16th August 1948. Speaker of Lok Sabha is its ex-officio President."},{"t":"Miscellaneous","n":508,"tag":"","q":"If the State government dissolves the Panchayati Raj Institutions before the end of their five-year term, fresh elections should ordinarily be held within _____.","o":["one month","six months","one year","three months"],"a":1,"e":"Six months. Under Article 243 E - An election to constitute a Panchayat shall be completed - Before the expiry of its duration specified in clause (1) or before the expiration of a period of six months from the date of its dissolution."},{"t":"Miscellaneous","n":509,"tag":"","q":"The detention of a person cannot exceed ________ unless an advisory board consisting of judges of a High Court reports sufficient cause for extended detention.","o":["one month","three months","six months","two months"],"a":1,"e":"three months. Article 22 (Part III) grants protection to persons who are arrested or detained (available to both citizens and foreigners). Preventive detention means the detention of a person without trial and conviction by a court."},{"t":"Miscellaneous","n":510,"tag":"","q":"When was the National Emergency declared for the first time under Article 352 ?","o":["1963 - 69","1961 - 65","1961 - 67","1962 - 68"],"a":3,"e":"1962-68. The National Emergency has been declared 3 times in India : 1962 to 1968 {During the India-China war, when “the security of India” was declared as being “threatened by external aggression”, President (Sarvepalli Radhakrishnan)}. 1971 {During the Indo - Pakistan war, President (V.V.Giri), Prime Minister (Indira Gandhi)}. 1975 to 1977 {The emergency was declared on the basis of “internal disturbance”, President (Fakhruddin Ali Ahmed), Prime Minister (Indira Gandhi)}."},{"t":"Miscellaneous","n":511,"tag":"","q":"In which year was the National Youth Policy launched by the Government of India ?","o":["2015","2014","2016","2017"],"a":1,"e":"2014 . It seeks to define the Vision of the Government of India for the Youth of the Country. The first youth policy was released in 1988. National Youth Day is held every year on 12 th January to observe the birth anniversary of Swami Vivekananda."},{"t":"Miscellaneous","n":512,"tag":"","q":"Which freedom fighter abolished the Zamindari System in Uttar Pradesh and was elected as the Home Minister in 1955?","o":["Lala Hardayal","Govind Ballabh Pant","Gopal Krishna Gokhale","Jyotiba Phule"],"a":1,"e":"Govind Ballabh Pant successfully abolished the exploitative Zamindari system and revolutionised laws pertaining to women’s inheritance and marriage. He was appointed Minister of Home Affairs in the Union Cabinet on 10 January 1955 in New Delhi by Nehru. He started a weekly paper called ‘Shakti’. In 1957, he was awarded the Bharat Ratna."},{"t":"Miscellaneous","n":513,"tag":"","q":"As per the coding convention of India Census, how many digit code is used for showing state code?","o":["1","3","2","4"],"a":2,"e":"2. The coding convention used: State code (2 digits); District code (3 digits); Sub-district code (5 digits); Village code (6 digits)."},{"t":"Miscellaneous","n":514,"tag":"","q":"Consider the following statements regarding the National Emblem of India: A. The National Emblem of India was adopted on 26th January 1950. B. The emblem is adapted from the Sarnath Lion Capital of Ashoka and carries the motto “Satyameva Jayate” from the Mundaka Upanishad. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. The National Emblem was officially adopted on 26th January 1950, is based on the Sarnath Lion Capital of Ashoka, and features the motto “Satyameva Jayate”, meaning “Truth Alone Triumphs,” from the Mundaka Upanishad."},{"t":"Miscellaneous","n":515,"tag":"","q":"The Right of Children to Free and Compulsory Education Act 2009 is an Act of Parliament which came into force in:","o":["2012","2011","2009","2010"],"a":3,"e":"2010. The Act makes education a fundamental right of every child between the ages of 6 and 14 and specifies minimum norms in elementary schools."},{"t":"Miscellaneous","n":516,"tag":"","q":"In which of the following years was an Act enacted to provide for the reorganisation of the states of India and for matters connected therewith?","o":["1947","1956","1959","1962"],"a":1,"e":"1956. The States Reorganisation Act, 1956 was a major reform of the boundaries of India's states and territories, organising them along linguistic lines. The Government divided the country into 14 states and 6 union territories under the State Reorganisation Act."},{"t":"Miscellaneous","n":517,"tag":"","q":"Which of the following Acts was passed by the Government of India to inquire into allegations of corruption against certain public functionaries?","o":["Delimitation Act","Prevention of Money Laundering Act","Central Vigilance Commission Act","The Lokpal and Lokayukta Act"],"a":3,"e":"The Lokpal and Lokayukta Act was passed by the Government of India to inquire into allegations of corruption against certain public functionaries."},{"t":"Miscellaneous","n":518,"tag":"","q":"The Indian Forest Act 1927 was enacted after repealing which of the following Indian forest acts?","o":["Indian Forest Act, 1882","Indian Forest Act, 1922","Indian Forest Act, 1865","Indian Forest Act, 1878"],"a":3,"e":"Indian Forest Act, 1878. The Indian Forest Act of 1878 divided Indian forests into reserved forests (completely government-controlled), protected forests (partially government-controlled) and village forests (controlled by abutting villages)."}]};
const LS='polityQuizV1';
let state={};try{state=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}};
const byTopic={};DATA.topics.forEach(t=>byTopic[t]=[]);DATA.qs.forEach(q=>byTopic[q.t].push(q));
let current=DATA.topics[0];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HL=/(Articles?\s+\d+[A-Z]{0,2}(?:\(\w+\))?(?:\s*(?:,|and|&|to|–|-)\s*\d+[A-Z]{0,2}(?:\(\w+\))?)*|Part\s+[IVX]+(?:-[A-Z])?|\d+(?:st|nd|rd|th)\s+(?:Constitutional\s+)?Amendment(?:\s+Act)?(?:,?\s*\d{4})?|(?:Seventh|Eighth|Ninth|Tenth|Eleventh|Twelfth|Fifth|Sixth)\s+Schedule|\b(?:1[89]\d{2}|20[0-2]\d)\b)/g;
const ABBR=/(?:Dr|Mr|Mrs|Ms|Shri|St|No|Art|Sh|vs|Prof|Smt|Hon|B|K|M|N|C|R|S|T|D|V|G|H|P|J|A|L|E|F|U)$/;
function fmtExp(t){
  let s=esc(t),cut=-1;
  const re=/\.\s+(?=[A-Z])/g;let m;
  while((m=re.exec(s))){const pre=s.slice(0,m.index);const w=pre.split(/\s+/).pop();if(!ABBR.test(w)&&!/\.[A-Z]$/.test(w)){cut=m.index+1;break}}
  let head='',rest=s;
  if(cut>0&&cut<=170){head=s.slice(0,cut);rest=s.slice(cut)}
  const hl=x=>x.replace(HL,'<mark>$1</mark>');
  return (head?'<strong>'+hl(head)+'</strong>':'')+hl(rest);
}
function stats(t){const a=state[t]||{};const qs=byTopic[t];let ans=0,ok=0;qs.forEach(q=>{if(a[q.n]!==undefined){ans++;if(a[q.n]===q.a)ok++}});return{ans,ok,total:qs.length}}
function renderTabs(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  DATA.topics.forEach(t=>{
    const b=document.createElement('button');b.className='tab'+(t===current?' active':'');
    b.innerHTML='<span class="n">'+byTopic[t].length+'</span><span class="l">'+esc(t)+'</span>';
    b.onclick=()=>{current=t;renderTabs();render();window.scrollTo({top:0,behavior:'auto'})};
    nav.appendChild(b);
  });
  const act=nav.querySelector('.active');if(act)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function updateSummary(){
  const s=stats(current);const el=document.getElementById('sum');if(!el)return;
  el.querySelector('.stats').innerHTML='Answered <b>'+s.ans+'/'+s.total+'</b> &middot; Correct <b>'+s.ok+'</b>'+(s.ans?' &middot; Accuracy <b>'+Math.round(100*s.ok/s.ans)+'%</b>':'');
  el.querySelector('.bar i').style.width=(100*s.ans/s.total)+'%';
}
function render(){
  const main=document.getElementById('main');const qs=byTopic[current];
  main.innerHTML='<div class="summary" id="sum"><h2>'+esc(current)+'</h2><button class="reset">Reset</button><div class="stats"></div><div class="bar"><i></i></div></div>';
  main.querySelector('.reset').onclick=()=>{if(confirm('Reset your answers for this topic?')){delete state[current];save();render()}};
  const a=state[current]||{};
  qs.forEach((q,i)=>{
    const card=document.createElement('article');card.className='q';
    const sel=a[q.n];
    let h='<div class="qhead"><span class="qno">Q'+(i+1)+'</span>'+(q.tag?'<span class="src">'+esc(q.tag)+'</span>':'')+'</div><p class="stem">'+esc(q.q)+'</p><div class="opts">';
    q.o.forEach((o,j)=>{h+='<button class="opt" data-j="'+j+'"><span class="k">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></button>'});
    h+='</div><div class="exp"></div>';card.innerHTML=h;
    const apply=(j,animate)=>{
      card.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');else if(k===j)b.classList.add('wrong');else b.classList.add('dim')});
      const e=card.querySelector('.exp');const ok=j===q.a;
      e.innerHTML='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'&#10003; Correct':'&#10007; Incorrect &mdash; correct answer: '+'ABCD'[q.a])+'</div>'+fmtExp(q.e);
      e.classList.add('show');
    };
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;(state[current]=state[current]||{})[q.n]=j;save();apply(j);updateSummary();
    });
    if(sel!==undefined)apply(sel);
    main.appendChild(card);
  });
  updateSummary();
}
document.getElementById('total').textContent=DATA.qs.length+' questions';
const topBtn=document.getElementById('top');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>300),{passive:true});
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
renderTabs();render();
</script>
</body>
</html>
