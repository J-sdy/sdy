- Include Bodo, Dogri, Maithili and Santhali language. 5th schedule - The President can declare any such area or the whole state as a scheduled area. 6th schedule - Deals with administration of tribal areas in Assam, Meghalaya, Tripura, Mizoram. 7th Schedule - Deals with the division of powers between the Union government and State governments."},{"t":"Amendments","n":217,"tag":"","q":"The Eighty - ninth Amendment Act, 2003 of the Indian Constitution established which of the following Commission ?","o":["Competition Commission of India","National Commission for Backward Classes","National Commission for Woman","National Commission for Scheduled Tribes"],"a":3,"e":"The National Commission for Scheduled Tribes (NCST) was established by amending Article 338 and inserting a new Article 338A in the Constitution."},{"t":"Amendments","n":218,"tag":"","q":"Which among the following constitutional amendments of the Indian Constitution deals with the formation of Sikkim as a state?","o":["36th","51th","42nd","30th"],"a":0,"e":"36th. 51st amendment: Reservation of seats in the Lok Sabha for Scheduled Tribes in Meghalaya, Arunachal Pradesh, Nagaland and Mizoram as well as in the Legislative Assemblies of Meghalaya and Nagaland. 30th amendment: Abolished provision to appeal to the Supreme Court on a civil case related to a certain amount."},{"t":"Amendments","n":219,"tag":"","q":"Consider the following statements:\n1. The 99th Constitutional Amendment Act, 2014 led to the establishment of the National Judicial Appointments Commission (NJAC).\n2. The 97th Constitutional Amendment Act, 2011 created the NJAC for appointments of judges in higher judiciary. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. The 97th Constitutional Amendment Act, 2011, deals with co-operative societies. It granted constitutional status and protection to co-operative societies by adding Part IX-B to the Constitution."},{"t":"Amendments","n":220,"tag":"","q":"Which of the following Constitutional Amendments incorporated Dadra and Nagar Haveli in the Union of India as a Union Territory ?","o":["19th","14th","12th","10th"],"a":3,"e":"The 10th Amendment (1961) added Dadra and Nagar Haveli as India’s seventh Union Territories. The 12th Amendment (1962) incorporated Goa, Daman, and Diu as the eighth Union Territory, while the 14th Amendment (1962) included Pondicherry as the ninth. The 19th Amendment (1966) abolished Election Tribunals, assigning election petition trials to High Courts."},{"t":"Amendments","n":221,"tag":"","q":"The Government of National Capital Territory of Delhi (Amendment) Bill, 2021, which was passed in March 2021 amended the Government of National Capital Territory of Delhi Act, ___","o":["1998","1994","1996","1991"],"a":3,"e":"1991 . Delhi became the capital of India on 12 December 1911."},{"t":"Amendments","n":222,"tag":"","q":"Which of the following Amendments of the Constitution of India gave the status of state to Goa ?","o":["52nd Amendment","56th Amendment","59th Amendment","48th Amendment"],"a":1,"e":"56th Amendment. The 59th Amendment Act, 1988- It empowered the Central Government to impose Emergency in Punjab when deemed necessary. Under the amendment, the President's rule can be extended up to three years. 48th Amendment Act passed in 1984 with respect to the State of Punjab, Parliament may pass any resolution with respect to the continuance in force of the Proclamation for a period up to two years."},{"t":"Amendments","n":223,"tag":"","q":"An amendment to the Hindu Succession Act, 1956 was passed in the year ______.","o":["2012","2005","2010","2008"],"a":1,"e":"2005. The Hindu Succession Act, 1956 is an Act of the Parliament of India enacted to amend and codify the law relating to intestate or unwilled succession, among Hindus, Buddhists, Jains, and Sikhs."},{"t":"Amendments","n":224,"tag":"","q":"The 60th Amendment to the Constitution of India increased the ceiling of profession tax from ₹ 250 p.a. to ______ p.a.","o":["₹7,000","₹5,000","₹1,000","₹2,500"],"a":3,"e":"₹2,500 . The Sixtieth Amendment of the Constitution of India Act, 1988, amended Article 276 of the Constitution relating to taxes on professions, trades, callings and employments."},{"t":"Amendments","n":225,"tag":"","q":"Which of the following provisions was amended by the 40th Constitutional Amendment Act, 1976? (1) Article 297 to vest all resources of the exclusive economic zone in the Union of India. (2) Article 226 to curtail the jurisdiction of High Courts. Select the correct answer using the code below:","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Article 226 - Power of High Courts to issue certain writs."},{"t":"Amendments","n":226,"tag":"","q":"Which of the following Amendment Acts of the Constitution of India abolished the privy purses and privileges of former rulers of princely states?","o":["25th Amendment Act 1971","26th Amendment Act 1971","28th Amendment Act 1972","27th Amendment Act 1971"],"a":1,"e":"26th Amendment Act 1971 . 25th Amendment Act 1971- Restrict property rights and compensation in case the state takes over private property. 28th Amendment Act 1972, abolished the special privileges of ICS officers and empowered the Parliament to determine their service conditions. 27th Amendment Act 1971- Reorganisation of Mizoram into a Union Territory with a legislature and council of ministers."},{"t":"Amendments","n":227,"tag":"","q":"Which amendment to the Constitution of India added a new subject in the Union List called 'taxes on services’","o":["56th","62nd","78th","88th"],"a":3,"e":"88th constitutional amendment 2003. 62nd Amendment Act, 1989 - Extend reservation for SCs and STs and nomination of Anglo Indian members in Parliament and State Assemblies for another ten years i.e. up to 2000. 78th Amendment Act, 1995 - Place land reform acts and amendments to these acts under Schedule 9 of the constitution."},{"t":"Amendments","n":228,"tag":"","q":"Which of the following Amendments of the Constitution of India amended Article 19 and inserted provisions fully securing the constitutional validity of zamindari abolition laws in general and certain specified State Acts in particular?","o":["Fourth Amendment","First Amendment","Third Amendment","Second Amendment"],"a":1,"e":"The First Amendment (1951) introduced provisions for advancing socially and educationally backward classes, SCs, and STs, added the Ninth Schedule to secure zamindari abolition laws, and allowed reasonable restrictions on freedom of speech (Article 19) by adding grounds such as public order, friendly relations with foreign states, and incitement to an offence. It also upheld the state’s right to nationalise businesses without violating the right to trade."},{"t":"Fundamental Rights & Duties","n":229,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Arrange the following Fundamental Rights in the order they are listed in the Indian Constitution:\n1. Right to Constitutional Remedies\n2. Right to Freedom\n3. Right against Exploitation\n4. Right to Equality","o":["1-2-3-4","3-2-1-4","4-1-3-2","4-2-3-1"],"a":3,"e":"4-2-3-1. In the Indian Constitution, Fundamental Rights are arranged systematically. First comes the Right to Equality (Articles 14–18), followed by the Right to Freedom (Articles 19–22). Next is the Right against Exploitation (Articles 23–24), and finally the Right to Constitutional Remedies (Article 32). This order reflects the logical flow from equality and freedom, to protection against exploitation, and finally the mechanism to enforce these rights."},{"t":"Fundamental Rights & Duties","n":230,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Arrange the following Fundamental Rights in the order of their appearance in the Constitution :\n1. Right to Freedom\n2. Right to Equality\n3. Right to Freedom of Religion\n4. Right against Exploitation","o":["1-2-3-4","2-1-4-3","2-4-1-3","4-2-1-3"],"a":1,"e":"2-1-4-3. The Fundamental Rights (Part III, Articles 12–35) of the Constitution appear in the following order : Right to Equality – Articles 14 to 18, Right to Freedom – Articles 19 to 22, Right against Exploitation – Articles 23 to 24, Right to Freedom of Religion – Articles 25 to 28."},{"t":"Fundamental Rights & Duties","n":231,"tag":"","q":"Which of the following duties is specified as the 10th Fundamental Duty in the Indian Constitution?","o":["To strive towards excellence in all spheres of individual and collective activity","To provide opportunities for education to his child or as the case may be, ward between the age of six and fourteen years","To cherish and follow the noble ideals which inspired our national struggle for freedom","To develop the scientific temper, humanism and the spirit of inquiry and reform"],"a":0,"e":"The idea of Fundamental Duties is inspired from the Constitution of Russia. These were incorporated in Part IV-A (Article 51A) of the Constitution by the 42nd Constitutional Amendment Act, 1976 on the recommendations of the Swaran Singh Committee. Originally 10 in number. The 86th Amendment Act of 2002 added another duty (Article 51A(k)) related to providing educational opportunities for children between the ages of 6 and 14."},{"t":"Fundamental Rights & Duties","n":232,"tag":"","q":"Consider the following statements regarding Fundamental Duties in the Indian Constitution:\n1. Fundamental Duties are enforceable by law and justiciable in courts.\n2. Fundamental Duties are inspired by the erstwhile USSR Constitution.\n3. Fundamental Duties aim to promote national spirit and strengthen unity. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":1,"e":"2 and 3 only. Fundamental Duties (Article 51A, Part IV-A) were added by the 42nd Constitutional Amendment, 1976 based on the USSR model. They are non-justiciable, i.e., not enforceable in courts, but they serve as moral obligations to promote patriotism, discipline, and unity among citizens."},{"t":"Fundamental Rights & Duties","n":233,"tag":"","q":"Right of a prisoner to speedy trial will be categorised in which of the following Fundamental Rights?","o":["Right against Exploitation","Right to Life","Right to Constitutional Remedies","Right to Equality"],"a":1,"e":"Right to Life. Speedy trial is an inalienable right under Article 21 of the constitution and hence no person shall be deprived of his life and liberty without the procedure of law and the procedure of law must be 'fair', 'reasonable', and 'just'."},{"t":"Fundamental Rights & Duties","n":234,"tag":"","q":"Consider the following statements regarding writ jurisdiction in India:\n1. Only the Supreme Court can issue writs under Article 32.\n2. High Courts are empowered to issue writs for the enforcement of Fundamental Rights as well as for other purposes under Article 226.\n3. The Constitution of India recognizes five types of writs – Habeas Corpus, Mandamus, Certiorari, Prohibition, and Quo Warranto. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":1,"e":"2 and 3 only. Article 32 provides the right to constitutional remedies through the Supreme Court, but not exclusively—since High Courts under Article 226 enjoy even wider writ jurisdiction, covering both Fundamental Rights and legal rights. The five writs form the backbone of judicial review, ensuring checks on executive and legislative excesses."},{"t":"Fundamental Rights & Duties","n":235,"tag":"","q":"Which Article of the Indian Constitution prohibits providing of any religious instruction in the educational institutions maintained by the State?","o":["Article 29","Article 28","Article 30","Article 31"],"a":1,"e":"Article 28. Other Important Articles of Fundamental Rights (Part III, Articles 12-35) : Article 29 - Protects the cultural and educational rights of minorities in India. Article 30 - The Rights of Minorities to establish and administer educational institutions. Article 31 (Right to Property) - The 44th Amendment Act of 1978 repealed it and made it a constitutional right under Article 300A."},{"t":"Fundamental Rights & Duties","n":236,"tag":"","q":"Consider the following statements regarding Fundamental Duties in the Indian Constitution:\n1. Fundamental Duties are enumerated in Article 51A of the Constitution.\n2. They were originally ten in number, added through the 42nd Constitutional Amendment Act, 1976.\n3. The eleventh Fundamental Duty was inserted by the 86th Constitutional Amendment Act, 2002. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. Fundamental Duties, found in Article 51A (Part IV-A), were introduced by the 42nd Amendment (1976) on the recommendation of the Swaran Singh Committee. Initially ten in number, they were expanded to eleven by the 86th Amendment (2002), making it the duty of parents/guardians to provide opportunities for education to children between 6–14 years."},{"t":"Fundamental Rights & Duties","n":237,"tag":"","q":"A student, on his school assignment, is taking a session on how to make compost at home for using it at a park. Which fundamental duty is he performing ?","o":["To strive towards excellence in all spheres of individual and collective activity","To safeguard public property and to abjure violence","To develop the scientific temper, humanism and the spirit of inquiry","To protect and improve the natural environment"],"a":3,"e":"Fundamental Duty (Part IVA - Article 51A). Related Article: Article 51A(g) - To protect and improve the natural environment. Article 51A (h): To develop the scientific temper, humanism and the spirit of inquiry and reform; Article 51A(i): To safeguard public property and to abjure violence; Article 51A(j): To strive towards excellence in all spheres of individual and collective activity so that the nation constantly rises to higher levels of endeavour and achievement."},{"t":"Fundamental Rights & Duties","n":238,"tag":"","q":"Which of the following duties has been NOT prescribed by the Indian Constitution as Fundamental Duties?\n1. To defend the country\n2. To pay income tax\n3. To cast the vote in election\n4. To safeguard the public property","o":["1 only","2 only","2 and 3 both","2 and 4 both"],"a":2,"e":"2 and 3 both. Fundamental duties were incorporated into the Constitution by the 42nd Constitutional Amendment Act of 1976 on the recommendations of the Swaran Singh Committee. Article 51-A (d) states the duty to defend the country and render national service when called upon to do so, while Article 51-A (i) emphasises the duty to safeguard public property and abjure violence."},{"t":"Fundamental Rights & Duties","n":239,"tag":"","q":"Which fundamental duty applies on you when you see a few school students, on their educational trip to Humayun’s tomb, writing their names on the walls?","o":["To safeguard public property","To defend the country and render national service","To uphold and protect the sovereignty, unity and integrity of India","To protect and improve the natural environment"],"a":0,"e":"To safeguard public property. Article 51A —It shall be the duty of every citizen of India—(a) to abide by the Constitution and respect its ideals and institutions, the National Flag and the National Anthem; (b) to cherish and follow the noble ideals which inspired our national struggle for freedom; (c) to uphold and protect the sovereignty, unity and integrity of India; (d) to defend the country and render national service when called upon to do so."},{"t":"Fundamental Rights & Duties","n":240,"tag":"","q":"Consider the following statements regarding suspension of Fundamental Rights during an emergency:\n1. Articles 20 and 21 cannot be suspended even during a National Emergency on the grounds of war or external aggression.\n2. Articles 14, 19, and 22 can be suspended during such an emergency.\n3. Article 32, which gives the right to move the Supreme Court, can never be suspended under any circumstances. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. While Articles 20 and 21 (protection in criminal convictions & right to life and personal liberty) cannot be suspended even during an emergency, Articles 14, 19, and 22 may be curtailed. However, Article 32 can be suspended under Article 359 during a National Emergency, which means citizens cannot directly approach the Supreme Court for enforcement of Fundamental Rights."},{"t":"Fundamental Rights & Duties","n":241,"tag":"","q":"Which fundamental duty applies to you when you see your college friends start fighting with the canteen person when he passes a few anti-religious statements?","o":["To promote harmony and spirit of brotherhood","To value and preserve the rich heritage","To develop the scientific temper, humanism, and the spirit of inquiry","To protect and improve our natural environment"],"a":0,"e":"This fundamental duty encourages citizens to maintain harmony and foster a spirit of brotherhood among all people, transcending religious, linguistic, or regional differences. It applies in situations where religious sentiments might cause conflicts."},{"t":"Fundamental Rights & Duties","n":242,"tag":"","q":"Which of the following statements is INCORRECT regarding Fundamental Rights?","o":["Fundamental Rights can be enforced by Law.","Fundamental rights are derived from the Britain Constitution.","The Fundamental Rights are mentioned in the constitution from article 12 to 35.","Article 21 provides the right to life."],"a":1,"e":"Fundamental Rights is derived from the Constitution of the USA. Enshrined in Part III (Article 12 to 35) of the Indian Constitution."},{"t":"Fundamental Rights & Duties","n":243,"tag":"","q":"If a 12-year-old is found to be working in a factory manufacturing carpets, which of the following Articles of the Constitution of India will be violated?","o":["Article 24","Article 25","Article 23","Article 26"],"a":0,"e":"Article 24 - “No child below the age of fourteen years shall be employed to work in any factory or mine or engaged in any other hazardous employment”. Other Articles: Article 23 - Prohibition of traffic in human beings and forced labour. Article 25 - Freedom of conscience and free profession, practice and propagation of religion. Article 26 - Freedom to manage religious affairs."},{"t":"Fundamental Rights & Duties","n":244,"tag":"","q":"In which part of the Constitution will you find the six broad categories of Fundamental Rights?","o":["Part I","Part IV","Part II","Part III"],"a":3,"e":"Part III (Articles 12 to 35). Six broad categories of Fundamental Rights : Right to Equality (Articles 14-18), Right to Freedom (Articles 19-22), Right against Exploitation (Articles 23-24), Right to Freedom of Religion (Articles 25-28), Cultural and Educational Rights (Articles 29-30), Right to Constitutional Remedies (Article 32)."},{"t":"Fundamental Rights & Duties","n":245,"tag":"","q":"Consider the following statements about the Writ of Mandamus in the Indian Constitution:\n1. The Writ of Mandamus compels a public authority to perform a duty it is bound to do.\n2. It is available under the Right to Constitutional Remedies (Article 32 and 226).\n3. It is classified under the Right to Equality in the Constitution. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. The Writ of Mandamus is issued to direct a public authority to discharge its legal duty and is part of the Right to Constitutional Remedies (Article 32 & 226), not the Right to Equality. It ensures accountability of state authorities and was borrowed from the English common law tradition."},{"t":"Fundamental Rights & Duties","n":246,"tag":"","q":"Consider the following statements regarding Article 20 of the Indian Constitution:\n1. Clause (2) of Article 20 embodies the doctrine of Double Jeopardy.\n2. Double Jeopardy means that no person shall be prosecuted and punished more than once for the same offence.\n3. The doctrine of Double Jeopardy is contained in Article 20(3) of the Constitution. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Article 20 provides protection in criminal cases: Clause (1) bars retrospective criminal laws, Clause (2) incorporates the doctrine of Double Jeopardy, and Clause (3) grants protection against self-incrimination. Double Jeopardy ensures that no individual faces repeated punishment for the same offence, reflecting the principle of fairness in criminal justice."},{"t":"Fundamental Rights & Duties","n":247,"tag":"","q":"Article 20 of the Constitution of India is related to _____.","o":["equality of opportunities in matters of public employment","protection in respect of conviction for offenses","freedom to manage religious affairs","abolition of titles"],"a":1,"e":"Article 20 provides three key protections: Ex-Post Facto Laws: No punishment for acts not punishable at the time they were committed, nor penalties exceeding those in force. Self-Incrimination: Individuals cannot be compelled to confess or make self-harming statements; includes the right to remain silent. Double Jeopardy: No one can be punished twice for the same offense."},{"t":"Fundamental Rights & Duties","n":248,"tag":"","q":"Which of the following Articles of the Constitution states that ‘It shall be the duty of every citizen of India to promote harmony and the spirit of common brotherhood amongst all the people of India transcending religious, linguistic and regional or sectional diversities; to renounce practices derogatory to the dignity of women.’?","o":["51 A","(b) 51 A","(c) 51 A (e)","51 A (d)"],"a":2,"e":"51 A (e). Fundamental Duties, outlined in Part IVA, Article 51A of the Indian Constitution, include: Abiding by the Constitution and respecting its ideals, as well as the National Flag and National Anthem. Cherishing and following the noble ideals that inspired India's struggle for freedom. Upholding and protecting the sovereignty, unity, and integrity of India. Defending the country and serving the nation when required."},{"t":"Fundamental Rights & Duties","n":249,"tag":"","q":"Consider the following statements regarding the Right to Constitutional Remedies:\n1. Dr. B.R. Ambedkar described the Right to Constitutional Remedies (Article 32) as the “Heart and Soul of the Constitution.”\n2. Article 32 empowers citizens to directly approach the Supreme Court for the enforcement of Fundamental Rights.\n3. The Right to Constitutional Remedies was called the “Soul of the Constitution” by Jawaharlal Nehru during the Constituent Assembly debates. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. Article 32 ensures the enforcement of Fundamental Rights through writs like Habeas Corpus, Mandamus, Prohibition, Certiorari, and Quo Warranto. Dr. Ambedkar emphasized its importance by calling it the “Heart and Soul of the Constitution”, as without it, Fundamental Rights would remain theoretical. The Supreme Court has also upheld Article 32 as a basic feature of the Constitution."},{"t":"Fundamental Rights & Duties","n":250,"tag":"","q":"Certiorari comes under the:","o":["right to religious freedom","right to constitutional remedies","right against exploitation","right to equality"],"a":1,"e":"right to constitutional remedies. Certiorari is a writ issued by the Supreme Court or a High Court to review the decision or action of a lower court or tribunal. Article 32 of the Indian Constitution is a fundamental right that guarantees the right to constitutional remedies. This right allows individuals to seek redressal from the judiciary when their fundamental rights are violated."},{"t":"Fundamental Rights & Duties","n":251,"tag":"","q":"Consider the following statements regarding Fundamental Duties in the Indian Constitution:\n1. Ten Fundamental Duties were added by the 42nd Constitutional Amendment Act, 1976.\n2. They were included in Part IV-A of the Constitution under Article 51A.\n3. The Swaran Singh Committee recommended the incorporation of Fundamental Duties. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":3,"e":"1, 2 and 3. The 42nd Amendment Act, 1976 added 10 Fundamental Duties in Article 51A (Part IV-A), based on the Swaran Singh Committee’s recommendations. Later, the 86th Amendment Act, 2002 introduced the 11th duty related to education for children aged 6–14 years."},{"t":"Fundamental Rights & Duties","n":252,"tag":"","q":"Which of the following statement(s) is/are INCORRECT vis-à-vis Fundamental Duties? 1) The 44 th amendment Act introduced Fundamental duties in the Constitution. 2) Fundamental Duties were expanded th by the 86 amendment act. 3) Article 51A (a) entails respect for its ideals and institutions, national flag and the national anthem. 4) Fundamental Duty obliges parents to provide opportunities for education to their child between 6-14 years of age.","o":["1","2 and 3","2 and 4","Only 3"],"a":0,"e":"1. The 44th Constitutional Amendment Act of 1978 was enacted to undo many changes made by the 42nd Amendment during the Emergency in India. Key provisions include restoring judicial review, protecting civil liberties, and ensuring that the right to property is no longer a fundamental right but a legal right."},{"t":"Fundamental Rights & Duties","n":253,"tag":"","q":"Consider the following statements: A. The Swarna Singh Committee recommended 8 fundamental duties. B. Fundamental Duties were incorporated by the 42nd Constitutional Amendment Act, 1976. Which of the following is correct?","o":["Both A and B are correct","Only A is correct","Only B is correct","Both A and B are incorrect"],"a":0,"e":"Both A and B are correct. The Swarna Singh Committee recommended 8 fundamental duties, which were incorporated in Part IV-A of the Constitution by the 42nd Amendment Act, 1976, inspired by the USSR Constitution."},{"t":"Fundamental Rights & Duties","n":254,"tag":"","q":"A ________ is issued to prevent an inferior court or tribunal from exceeding its jurisdiction, which is not legally vested, or acting without jurisdiction or acting against the principles of natural justice.","o":["writ of quo-warranto","writ of habeas corpus","writ of prohibition","writ of mandamus"],"a":2,"e":"Writ of prohibition. The Supreme Court and High Courts in India have the power to issue the writs under Article 32 (Supreme Court) and Article 226 (High Courts) of the Constitution, respectively. The Constitution of India provides for five types of writs: Habeas Corpus (To have the body), Mandamus (We Command), Prohibition (To forbid), Certiorari (To be certified), and Quo Warranto (By what authority)."},{"t":"Fundamental Rights & Duties","n":255,"tag":"","q":"A housemaid gets her 12-year-old daughter to help in her work as a house cleaner at a residential colony instead of sending her to school. Which fundamental duty is violated by the housemaid ?","o":["To provide opportunities for education to his/her child","To promote harmony and the spirit of common brotherhood","To defend the country and render national service","To safeguard public property and to abjure violence"],"a":0,"e":"To provide opportunities for education to his/her child. Fundamental duty (Part IV-A, Article 51-A) incorporated by the 42nd Constitutional Amendment Act, 1976 on the recommendations of the Swaran Singh Committee. It mandates that parents should provide educational opportunities for their children between the ages of six and fourteen years (added by the 86th Constitutional Amendment Act, 2002)."},{"t":"Fundamental Rights & Duties","n":256,"tag":"","q":"Consider the following statements: A. Citizens are not discriminated against on the basis of religion, caste, sex, race or place of birth under the Right to Equality. B. Articles 19 to 22 of the Constitution collectively provide for the Right to Equality. Which of the following is correct?","o":["Both A and B are correct","Only A is correct","Only B is correct","Both A and B are incorrect"],"a":1,"e":"Only A is correct. The Right to Equality is guaranteed under Articles 14-18, not Articles 19-22. The Fundamental Rights (Part III, Articles 12-35). Right to equality (Articles 14-18). Article 14: Equality before the law. Article 15: Prohibition of discrimination on grounds of religion, race, caste, sex, or place of birth. Article 16: Equality of opportunity in public employment. Article 17: Abolition of untouchability. Article 18: Prohibition of titles, except for military or academic distinctions."},{"t":"Fundamental Rights & Duties","n":257,"tag":"","q":"Consider the following statements:\n1. Article 32 of the Constitution provides the right to move the Supreme Court for enforcement of Fundamental Rights.\n2. Article 19 of the Constitution deals with the legal enforcement of Fundamental Rights. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. Article 32, called the \"heart and soul\" of the Constitution (Dr. Ambedkar), provides the right to move the Supreme Court for enforcement of Fundamental Rights through writs. Article 19, on the other hand, guarantees specific freedoms like speech, assembly, association, movement, residence, and profession, but it is not about legal enforcement."},{"t":"Fundamental Rights & Duties","n":258,"tag":"","q":"Which of the following Fundamental Rights has been deleted from the original list of fundamental rights provided in the Constitution of India?","o":["Right to property","Cultural and educational rights","Right to constitutional remedies","Right to freedom of religion"],"a":0,"e":"Right to property. It was deleted by the 44th Constitutional amendment act 1978 from the list of Fundamental Rights (FR) and was listed under Article 300A as a legal right in Part XII."},{"t":"Fundamental Rights & Duties","n":259,"tag":"","q":"Which of the following Fundamental Rights is available for Indians as well as foreigners?","o":["Right to protection of language, script and culture of minorities","Equality of opportunity in matters of public employment","Right of minorities to establish and administer educational institutions","Right to elementary education"],"a":3,"e":"Right to elementary education. Fundamental rights available to both citizens and foreigners (except enemy aliens) include: Article 14, Article 20, Article 21, Article 21A, Article 22, Article 23, Article 24, Article 25, Article 26, Article 27, and Article 28. Fundamental Rights Available Only to Citizens of India: Article 15, Article 16, Article 19, Article 29, and Article 30."},{"t":"Fundamental Rights & Duties","n":260,"tag":"","q":"All historical monuments have signages with instructions that public should not write on the walls. To which fundamental duty does the given statement belong?","o":["To defend the country and render national service","To safeguard public property and to abjure violence","To develop the scientific temper","To promote harmony and spirit of common brotherhood"],"a":1,"e":"Fundamental Duties outline the responsibilities of every citizen of India. These duties include: (a) to abide by the Constitution and respect its ideals and institutions, the National Flag and the National Anthem; (c) to uphold and protect the sovereignty, unity and integrity of India; (f) to value and preserve the rich heritage of our composite culture. Article 49 - Protection of monuments and places and objects of national importance."},{"t":"Fundamental Rights & Duties","n":261,"tag":"","q":"Which of the following is NOT mentioned in fundamental duties provided under the Indian Constitution ?","o":["To safeguard public property","To develop scientific temper","To join Defence forces","To respect the national flag"],"a":2,"e":"To join Defence forces. The Fundamental Duties, listed in Part IVA (Article 51A) of the Indian Constitution, were added by the 42nd Amendment in 1976 based on the Swaran Singh Committee's recommendations. Initially there were 10 fundamental duties, and by the 86th Amendment of 2002 one more fundamental duty (to provide right to education to all children of the age of 6 to 14 years) was added."},{"t":"Fundamental Rights & Duties","n":262,"tag":"","q":"Which writ literally means 'what is your authority’ ?","o":["Quo-Warranto","Prohibition","Habeas Corpus","Mandamus"],"a":0,"e":"Quo-Warranto. The Supreme Court and High Courts in India have the power to issue writs under Article 32 and Article 226 of the Constitution, respectively. Five types of writs - Habeas Corpus (To have the body); Mandamus (We Command); Prohibition (To forbid); Certiorari (To be certified)."},{"t":"Fundamental Rights & Duties","n":263,"tag":"","q":"The original constitution did NOT mention any fundamental duty because:","o":["initially fundamental duties were not expected to be performed","initially fundamental duties were punishable as per the constitution","it was expected that the citizens of the country would perform their duties willingly","it was expected that the citizens of the country would perform their duties forcefully"],"a":2,"e":"The fundamental duties were incorporated in Part IV-A of our constitution through the 42nd Constitutional Amendment Act, 1976. At present, there are eleven fundamental duties under article 51 A of the constitution."},{"t":"Fundamental Rights & Duties","n":264,"tag":"","q":"Which of the following is NOT a fundamental duty of an Indian citizen?","o":["To uphold and protect the sovereignty, unity and integrity of India","To safeguard public property and to abjure violence","To vote in public elections","To value and preserve the rich heritage of our composite culture"],"a":2,"e":"To vote in public elections. The 42nd Amendment Act of 1976 added 10 Fundamental Duties to the Indian Constitution, based on the recommendations of the Swaran Singh Committee. The 86th Amendment Act of 2002 introduced the 11th Fundamental Duty, requiring parents or guardians to provide educational opportunities to children aged 6 to 14. These duties are outlined in Article 51A, under Part IV-A."},{"t":"Fundamental Rights & Duties","n":265,"tag":"","q":"Consider the following statements:\n1. Article 18 of the Indian Constitution deals with the abolition of titles except military and academic distinctions.\n2. Article 24 of the Indian Constitution prohibits traffic in human beings and forced labour. Which of the following is correct ?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. Article 18 provides for abolition of titles, ensuring no State-conferred titles except military or academic distinctions. Article 24, however, prohibits the employment of children below 14 years in factories, mines, and hazardous work — not traffic in human beings (which is covered under Article 23)."},{"t":"Fundamental Rights & Duties","n":266,"tag":"","q":"Article 21 is related to which of the following fundamental rights?","o":["Freedom to Manage Religious Affairs","Protection of Language, Culture of Minorities","Protection of Life and Personal Liberty","Freedom of Speech"],"a":2,"e":"Protection of Life and Personal Liberty. Fundamental Rights (Part III) : Right to Equality (Article 14 - 18), Right to Freedom (Article 19 - 22), Right against Exploitation (23 - 24), Right to Freedom of Religion (Article 25 - 28), Cultural and Educational Rights (Article 29 - 30), Article 31 (now repealed) - Saving of Certain Laws related to property rights, Right to Constitutional Remedies (Article 32)."},{"t":"Fundamental Rights & Duties","n":267,"tag":"","q":"If a person who is arrested, is NOT produced before the Magistrate within 24 hours from the time of arrest, he will be entitled to be released on the writ of ________.","o":["Habeas Corpus","Prohibition","Quo-warranto","Mandamus"],"a":0,"e":"Habeas Corpus. The Supreme Court and High Courts in India have the power to issue writs under Article 32 and Article 226 of the Constitution, respectively. Five types of writs - Habeas Corpus (To have the body); Mandamus (We Command); Prohibition (To forbid); Certiorari (To be certified) and Quo Warranto (By what authority)."},{"t":"Fundamental Rights & Duties","n":268,"tag":"","q":"Consider the following statements:\n1. Article 14 guarantees the Right to Equality before the Law and the Right to Equal Protection of the Laws.\n2. Articles 15, 16, and 17 are also part of the Right to Equality under the Constitution of India. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":0,"e":"Both 1 and 2 are correct. Article 14 guarantees equality before law and equal protection of laws, while Articles 15–17 prohibit discrimination, ensure equality of opportunity in public employment, and abolish untouchability. Together with Article 18 (abolition of titles), these form the Right to Equality under the Constitution."},{"t":"Fundamental Rights & Duties","n":269,"tag":"","q":"Consider the following statements:\n1. Article 26(c) of the Indian Constitution grants every religious denomination the right to own and acquire movable and immovable property.\n2. Article 26(b) gives the right to own and acquire property to religious denominations. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. Article 26(c) specifically provides the right to own and acquire movable and immovable property for religious denominations. Article 26(b), however, deals with the right of denominations to manage their own affairs in matters of religion, not property."},{"t":"Fundamental Rights & Duties","n":270,"tag":"","q":"Which Article of the Indian Constitution mentions that ‘No person shall be prosecuted and punished for the same offence more than once’?","o":["Article 20(3)","Article 20(2)","Article 20(4)","Article 20(1)"],"a":1,"e":"Article 20(2). This clause is known as the doctrine of \"double jeopardy,\" which ensures that no individual is tried twice for the same crime. Other clauses: Article 20(1) : This provision ensures that a person cannot be convicted of any offense which was not in force at the time. Article 20(3) ensures that no person accused of an offense shall be compelled to be a witness against themselves."},{"t":"Fundamental Rights & Duties","n":271,"tag":"","q":"Which Committee had suggested a penalty or punishment for the non - performance of Fundamental Duties ?","o":["Indira Gandhi Committee","Morarji Desai Committee","Verma Committee","Swaran Singh Committee"],"a":3,"e":"Swaran Singh Committee. The Swaran Singh Committee recommended that the duty to pay taxes to be included in the fundamental duties. The committee also recommended that the legislatures should prescribe a law for imposing a penalty for violation of the duties. But these recommendations were not included in Article 51A."},{"t":"Fundamental Rights & Duties","n":272,"tag":"","q":"Which Article of the Constitution clarifies that policies like 'reservation' is not a violation of the right to equality ?","o":["Article 16 (4)","Article 15 (2)","Article 14 (1)","Article 21"],"a":0,"e":"Article 16 (4). Article 15 (2) - No citizen shall, on grounds only of religion, race, caste, sex, place of birth, be subject to any disability, liability, restriction or condition with regard to. Article 21 - Protection of life and personal liberty."},{"t":"Fundamental Rights & Duties","n":273,"tag":"","q":"What is the purpose of the Cultural and Educational Rights?","o":["To promote a particular religion","To protect the language, culture, and religion of the minority communities","To protect the majority community","To prevent exploitation"],"a":1,"e":"Cultural and Educational Right (Article 29 - 30) : Article 29 - Guarantees the Protection of Interests of Minorities. Article 30 - Guarantees the right of minorities to establish and administer educational institutions of their choice."},{"t":"Fundamental Rights & Duties","n":274,"tag":"","q":"Which of the following is enforceable by the Indian Constitution?","o":["Preamble","Fundamental rights","Directive Principles of State Policy","Fundamental duties"],"a":1,"e":"Fundamental Rights ( Part III, Articles 12-35)."},{"t":"Fundamental Rights & Duties","n":275,"tag":"","q":"Which of the following statements is FALSE about the right to freedom of religion mentioned in the Indian Constitution ?","o":["It provides freedom to manage religious affairs.","It provides freedom of worship.","It is mentioned in Articles 25 to 28.","It mentions that the state has its own religion."],"a":3,"e":"The Right to Freedom of Religion (Fundamental Right under Part III) - Article 25 - Freedom of conscience and free profession, practice and propagation of religion. Article 26 - Freedom to manage religious affairs. Article 27 - Freedom as to payment of taxes for promotion of any particular religion. Article 28 - Freedom as to attendance at religious instruction or religious worship in certain educational institutions."},{"t":"Fundamental Rights & Duties","n":276,"tag":"","q":"Which statement is FALSE regarding fundamental rights mentioned in the Indian Constitution ?","o":["Only Article 20 and 21 can be suspended during emergency","They are justiciable","Some fundamental rights are negative in nature","Can be suspended during emergency"],"a":0,"e":"44th Amendment Act, 1978 limits the scope of Article 359 (suspension of the enforcement of the rights conferred by Part III during emergencies). All fundamental rights except articles 20 and 21 can be suspended only on the basis of National Emergency (Article 352)."},{"t":"Fundamental Rights & Duties","n":277,"tag":"","q":"The celebration of Christmas, Eid and Holi in school is an example of making children learn fundamental duties as well. Which of the following fundamental duties advocates about this type of ideals ?","o":["To defend the country and render national service","To develop the scientific temper","To safeguard public property and to abjure violence","To promote harmony and spirit of common brotherhood"],"a":3,"e":"Fundamental Duties: Part IV-A of the Indian constitution in Article 51A. Article 51A(e) refers to the duty of every citizen to promote harmony and the spirit of common brotherhood amongst all the people of India. '"},{"t":"Fundamental Rights & Duties","n":278,"tag":"","q":"What is the aim of fundamental rights mentioned in the Indian Constitution ?","o":["To establish a welfare state","To have an absolute independence","To promote economic justice","To establish political democracy"],"a":3,"e":"To establish political democracy. The fundamental rights in the Indian Constitution aim to build a democratic society by safeguarding individual liberty, equality, and protection against discrimination based on race, caste, sex, religion, or birthplace."},{"t":"Fundamental Rights & Duties","n":279,"tag":"","q":"Fundamental duties are ______ and not enforceable by law but are taken into account by the courts while adjudicating any matter.","o":["regulatory","non - statutory","statutory","common"],"a":2,"e":"Statutory. Fundamental Duties (Part IVA, Article 51A):- Adopted from the Constitution of Russia (erstwhile Soviet Union). Fundamental duties - Non - justiciable in nature."},{"t":"Fundamental Rights & Duties","n":280,"tag":"","q":"Consider the following statements:\n1. The Fundamental Duty to uphold and protect the sovereignty, unity and integrity of India is mentioned in Article 51A(c).\n2. Article 51A(d) of the Constitution mentions the duty to uphold sovereignty, unity and integrity of India. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The duty to uphold and protect the sovereignty, unity and integrity of India is provided under Article 51A(c). Article 51A(d), on the other hand, refers to the duty to defend the country and render national service when called upon, not sovereignty and unity."},{"t":"Committee Reports","n":281,"tag":"","q":"The central bank of India or Reserve Bank of India was created before Independence, in the year 1934. The recommendation to create a central bank was made by a commission called:","o":["Dr. Raja Chelliah Committee","Kothari Commission","Narasimham Committee","Hilton Young Commission"],"a":3,"e":"Hilton Young Commission. It is also known as the Royal Commission on Indian Currency and Finance, was established in 1926. The Reserve Bank of India (RBI) is India's central bank and regulatory body overseeing the Indian banking system. It manages the control, issuance, and supply of the Indian rupee. The Reserve Bank of India (RBI) was established on April 1, 1935, in accordance with the provisions of the Reserve Bank of India Act, 1934."},{"t":"Committee Reports","n":282,"tag":"","q":"Consider the following statements:\n1. The P.K. Thungon Committee (1989) recommended constitutional recognition for local government bodies along with provisions for regular elections, specific functions, and financial support.\n2. The Ashok Mehta Committee (1977) studied the Panchayati Raj system and suggested a two-tier structure instead of the three-tier system recommended earlier. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":0,"e":"Both 1 and 2 are correct. The P. K. Thungon Committee (1989) recommended constitutional recognition for Panchayati Raj with elections and financial backing, while the Ashok Mehta Committee (1977) suggested replacing the three-tier Panchayat system with a two-tier system for better functioning."},{"t":"Committee Reports","n":283,"tag":"","q":"Which of the following commissions/committees identified the existence of legal provisions for implementation of some of the Fundamental Duties?","o":["Vasantrao Naik Committee","Sarkaria Commission","Rajamannar Commission","Justice Verma Committee"],"a":3,"e":"Justice Verma Committee. The committee was set up in 1999. It identified the existence of following legal provisions - Prevention of Insults to National Honour Act (1971), Protection of Civil Right Act (1955), Representation of People Act (1951), Wildlife Protection Act (1972) and Forest Conservation Act (1980)."},{"t":"Committee Reports","n":284,"tag":"","q":"Which of the following committees had recommended the inclusion of a chapter on the Fundamental Duties in the Constitution of India and stressed that the citizens should become conscious that, in addition to the enjoyment of rights, they also have certain duties to perform ?","o":["JR Varma Committee (1996)","Ashok Mehta Committee (1977)","Swaran Singh Committee (1976)","Balwant Rai Mehta Committee (1976)"],"a":2,"e":"Swaran Singh Committee (1976) originally recommended eight Fundamental Duties under Article 51A of the Indian Constitution. However, at the time of incorporation, ten duties were added to Part IV-A by the 42nd Constitutional Amendment Act, 1976. Initially, there were 10 duties, and one more was added by the 86th Constitutional Amendment Act, 2002, making a total of 11 duties."},{"t":"Committee Reports","n":285,"tag":"","q":"Consider the following statements:\n1. The Dutt Committee was associated with the Industrial Licensing Policy Inquiry.\n2. The Gadgil Committee was constituted to review the industrial licensing system under the Industries (Development and Regulation) Act, 1951. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Dutt Committee examined issues related to industrial licensing policy. The Gadgil Committee, however, was not related to licensing policy; it studied ecological and developmental concerns of the Western Ghats."},{"t":"Committee Reports","n":286,"tag":"","q":"In November 2022, the Supreme Court upheld the 10% reservation of EWS quota. This EWS reservation was granted on the basis of recommendations from which of the following commissions ?","o":["Sarkaria commission","Kelkar commission","Mandal commission","Sinho commission"],"a":3,"e":"Sinho commission: Constituted in 2005, and submitted its report in 2010. In 2019, the Cabinet decided to amend the Constitution (103rd Amendment) to provide reservation to EWS. Sarkaria Commission (1983) - Reviewed center-state relations. Kelkar Commission (1953) - Also known as the First Backward Classes Commission. Mandal Commission (1979) - The Second Socially and Educationally Backward Classes Commission."},{"t":"Committee Reports","n":287,"tag":"","q":"Which of the following persons was appointed Chairman of the Second National Judicial Pay Commission ?","o":["Justice PV Reddi","Justice JS Verma","Justice R Basant","Justice AS Anand"],"a":0,"e":"Justice PV Reddi. The second National judicial Pay Commission was formed in 2017 due to the supreme court’s order in the all India judges association case, under article 32, i.e., constitutional remedies. Justice Verma Committee was constituted to recommend amendments to the Criminal Law so as to provide for quicker trial and enhanced punishment for criminals accused of committing sexual assault against women. The Committee submitted its report on January 23, 2013."},{"t":"Committee Reports","n":288,"tag":"","q":"Consider the following statements:\n1. The Motilal Nehru Report (1928) and the Tej Bahadur Sapru Report (1945) are associated with Fundamental Rights.\n2. The Sarkaria Commission Report is also associated with Fundamental Rights. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Motilal Nehru Report and Tej Bahadur Sapru Report discussed Fundamental Rights and political safeguards. The Sarkaria Commission Report (1983), however, was related to Centre–State relations, not Fundamental Rights."},{"t":"Committee Reports","n":289,"tag":"","q":"Consider the following statements:\n1. The Sarkaria Commission (1983) recommended that the appointment of Governors should be non-partisan.\n2. The Fazal Ali Commission (1953) recommended that Governors should be appointed on a non-partisan basis. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Sarkaria Commission (1983), set up to review Centre–State relations, suggested that Governors should be appointed in a non-partisan manner. The Fazal Ali Commission (1953), however, was related to State Reorganisation, not to the role or appointment of Governors."},{"t":"Committee Reports","n":290,"tag":"","q":"Constitution Review Commission chaired by______recommended some initiatives to be taken by the government for successful implementation of Fundamental Duties.","o":["PK Joshi","MN Venkatachaliah","UC Banerjee","Michael G Aguinaldo"],"a":1,"e":"MN Venkatachaliah Commission was set up by Government resolution in 2000 to Review the Working of the Constitution. He got Padma Vibhushan In 2004. Justice U.C.Banerjee headed the Commission report on Godhra incident."},{"t":"Committee Reports","n":291,"tag":"","q":"Consider the following statements:\n1. The Mandal Commission (1979) recommended 27% reservation for OBC candidates in Central government jobs and public sector undertakings.\n2. The Kothari Commission recommended 27% reservation for OBC candidates in all levels of government services. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Mandal Commission (1979), headed by B.P. Mandal recommended 27% reservation for OBCs in Central government jobs and PSUs. The Kothari Commission (1964–66), however, dealt with educational reforms, not reservations in government services."},{"t":"Parliament","n":292,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which of the following bodies has the power to create new All-India Services common to both the Union and the States?","o":["The President of India by issuing an executive order.","The Union Cabinet by a simple majority.","The Prime Minister with the consent of all Chief Ministers.","The Parliament, provided the Rajya Sabha passes a resolution by a special majority."],"a":3,"e":"Under Article 312 of the Indian Constitution, Parliament has the power to create new All-India Services (like IAS, IPS, IFS) if the Rajya Sabha passes a resolution by a special majority (two-thirds of members present and voting) declaring that it is necessary in the national interest. Once such a resolution is passed, Parliament can enact a law to create the new service. The President or Prime Minister alone cannot create such services, and the Union Cabinet’s decision is not sufficient without parliamentary approval."},{"t":"Parliament","n":293,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"According to the Constitution of India, what is the quorum required to constitute a meeting of either House of Parliament?","o":["One-third of the total number of members of the House.","Fifty members in the Lok Sabha and twenty-five members in the Rajya Sabha.","One-tenth of the total number of members of the House.","One-fourth of the total number of members of the House."],"a":2,"e":"One-tenth of the total number of members of the House. Article 100(3) of the Indian Constitution states that the quorum to constitute a meeting of either House of Parliament is one-tenth of the total number of members of that House. If at any time there is no quorum, the presiding officer (Speaker in Lok Sabha or Chairman in Rajya Sabha) must either adjourn the House or suspend the meeting until a quorum is present. This provision ensures that parliamentary decisions are not taken without minimum representation."},{"t":"Parliament","n":294,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"The maximum strength of the Lok Sabha (House of the People) as stipulated by the Constitution is:","o":["530 members","552 members","550 members","545 members"],"a":1,"e":"552 members. Composition of Lok Sabha: The Lok Sabha consists of members who are directly elected by the people of India. The elections are based on Universal Adult Suffrage, meaning every citizen of India aged 18 or above has the right to vote. The Constitution allows a maximum of 550 members in Lok Sabha: 530 from the States and 20 from the Union Territories. At present, Lok Sabha has 543 elected members. The 104th Constitutional Amendment Act, passed in 2020, abolished the provision of reserved seats for the Anglo-Indian community in the Lok Sabha and State Legislative Assemblies."},{"t":"Parliament","n":295,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"What is the role of the Speaker in case of a tied vote in the Lok Sabha election ?","o":["Decides based on personal preference","Votes to break the tie","Does not participate","Refers the decision to the President"],"a":1,"e":"Votes to break the tie. In the Lok Sabha, the Speaker normally does not vote during divisions to maintain neutrality. However, in case of a tie, the Speaker uses the casting vote under Article 100 of the Constitution to resolve the deadlock. This vote is exercised only to maintain the status quo and not to favour any side. The provision ensures smooth legislative functioning and prevents paralysis in decision-making. Famous instances of casting votes have been rare, reflecting the Speaker’s role as an impartial presiding officer."},{"t":"Parliament","n":296,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Which body has the power to amend the Union and State power distribution under the Indian Constitution?","o":["Supreme Court","Lok Sabha","State Legislature","Parliament"],"a":3,"e":"Parliament. The power to amend the Indian Constitution lies solely with Parliament under Article 368, especially for matters like the Seventh Schedule on Union–State powers. Such amendments need a special majority in both Houses and, for federal subjects, ratification by at least half of the state legislatures. The Supreme Court cannot amend but can review amendments under the Basic Structure doctrine. The Lok Sabha alone cannot amend; approval of the Rajya Sabha and in some cases states is mandatory."},{"t":"Parliament","n":297,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"The power to legislate on 'Residuary Subjects' (matters not enumerated in any of the three Lists) rests exclusively with:","o":["The President of India","Parliament","The Supreme Court","State Legislatures"],"a":1,"e":"Parliament. Under the Seventh Schedule of the Indian Constitution, legislative subjects are divided into: Union List – Parliament’s exclusive power. State List – State legislatures’ exclusive power. Concurrent List – Both Parliament and State legislatures can make laws. However, certain subjects may not fall under any of these lists. These are called Residuary Subjects. According to Article 248 and Entry 97 of the Union List, the Parliament has exclusive power to make laws on residuary matters, including the power to impose taxes not mentioned in State or Concurrent Lists."},{"t":"Parliament","n":298,"tag":"","q":"Consider the following statements :\n1. The Parliament is the legislative organ of the Union Government of India.\n2. The Executive is the legislative organ of the Union Government of India. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Parliament is the legislative organ of the Union Government and consists of the Lok Sabha, Rajya Sabha, and the President. The Executive is a separate organ that implements the laws made by the legislature."},{"t":"Parliament","n":299,"tag":"","q":"Which of the following is NOT a device of parliamentary proceedings?","o":["Half - an - hour discussion","Zero - hour discussion","Two - hour (short) discussion","Full - day discussion"],"a":3,"e":"Full-day discussion. In parliamentary proceedings, there are various devices used to facilitate discussions and manage time effectively. These include: Half-an-hour discussion - A device used to discuss matters of urgent public importance. It usually lasts for 30 minutes. Zero-hour discussion - A device where members can raise issues without prior notice, typically after the Question Hour, which allows for unscheduled discussions. Two-hour (short) discussion - This is also a formal discussion where specific issues are debated for two hours."},{"t":"Parliament","n":300,"tag":"","q":"Consider the following statements:\n1. Parliament has the power to regulate the right of citizenship in India under Article 11.\n2. The President has the power to regulate the right of citizenship in India under Article 11. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. Article 11 empowers Parliament to regulate the right of citizenship by law. The President has no such power; citizenship provisions are dealt with under Part II (Articles 5–11) of the Constitution."},{"t":"Parliament","n":301,"tag":"","q":"The parliamentary standing committees have a tenure of _____ years.","o":["four","two","three","one"],"a":3,"e":"one . Parliamentary committees are of two types—Standing Committees and Ad Hoc Committees. Standing Committees are permanent and function on a continuous basis. In contrast, Ad Hoc Committees are temporary and cease to exist once they complete the task assigned to them. Examples - The Joint Committee on Bofors Contract and the Joint Committee on Fertilizer Pricing."},{"t":"Parliament","n":302,"tag":"","q":"Which of the following statements are correct regarding State Legislatures? A. Notwithstanding anything in part XVII, but subject to the provisions of Article 348, business in the Legislature of a State shall be transacted in the official language or languages of the State or in Hindi or in English. B. The Speaker of the Legislative Assembly or Chairman of the Legislative Council can permit any member to speak in his mother tongue. C. Only the Supreme Court is entitled to inquire into the proceedings of the StateLegislature.","o":["B and C only","A and C only","A, B and C","A and B only"],"a":3,"e":"A and B only. State Legislature is mentioned in Chapter III of Part VI (The States) of the Indian Constitution. Related Articles: Article 178 - The Speaker and Deputy Speaker of the Legislative Assembly. Article 179 - Vacation and resignation of, and removal from, the offices of Speaker and Deputy Speaker. Article 180 - Power of the Deputy Speaker or other person to perform the duties of the office of, or to act as, Speaker."},{"t":"Parliament","n":303,"tag":"","q":"Consider the following statements:\n1. The Jammu and Kashmir Legislative Council was abolished in 2019 through the Jammu and Kashmir Reorganisation Act.\n2. The Jammu and Kashmir Legislative Council was abolished in 2020 through the Jammu and Kashmir Reorganisation Act. Which of the following is correct?","o":["Both 1 and 2 are correct","Only 1 is correct","Only 2 is correct","Both 1 and 2 are incorrect"],"a":1,"e":"Only 1 is correct. The Jammu and Kashmir Reorganisation Act, 2019 abolished the Legislative Council in 2019 and bifurcated the state into two Union Territories – Jammu & Kashmir and Ladakh. Statement 2 is incorrect because the abolition did not happen in 2020."},{"t":"Parliament","n":304,"tag":"","q":"Consider the following statements:\n1. Meghalaya has two Lok Sabha seats, namely Shillong and Tura.\n2. Meghalaya has one Rajya Sabha seat. Which of the following is correct?","o":["Only 1 is correct","Only 2 is correct","Both 1 and 2 are correct","Neither 1 nor 2 is correct"],"a":2,"e":"Both 1 and 2 are correct. Meghalaya elects 2 MPs to the Lok Sabha (Shillong and Tura) and 1 MP to the Rajya Sabha; Additionally, Meghalaya has 60 legislative assembly seats. Other states and their Lok Sabha seats: Manipur (2), Nagaland (1), Mizoram (1), Assam (14), Arunachal Pradesh (2), Tripura (2), Sikkim (1)."},{"t":"Parliament","n":305,"tag":"","q":"Who was the first speaker of the Lok Sabha after India’s Independence?","o":["Ganesh V Mavalankar","Meira Kumar","M Ananthasayanam","MA Ayyangar"],"a":0,"e":"Ganesh V Mavalankar was the Chairman of the Committee on the Functions of the Constituent Assembly of India. Ganesh Vasudev Mavalankar has been conferred the title of 'Father of Lok Sabha' by Jawaharlal Nehru. M. A. Ayyangar was the first deputy speaker of the Lok Sabha. Meira Kumar was the first woman speaker of Lok Sabha (2009 - 2014)."},{"t":"Parliament","n":306,"tag":"","q":"Members of the Rajya Sabha are elected for a term of how many years ?","o":["5 years","3 years","6 years","4 years"],"a":2,"e":"6 years. The Rajya Sabha is a permanent body and is not subject to dissolution. However, one-third of its members retire every two years. The Vice-President of India serves as the ex-officio Chairman of the Rajya Sabha. The House has a maximum of 250 members, with 238 elected members from states and union territories, and 12 nominated by the President."},{"t":"Parliament","n":307,"tag":"","q":"Who elects the Presiding Officer (the speaker) in the State legislature?","o":["Council of Minsters","Members of Vidhan Sabha","Member of Vidhan Parishad","Chief Minster"],"a":1,"e":"Members of Vidhan Sabha. There is a Legislative Assembly (Vidhan Sabha) in every State. It represents the people of the State. The members of Vidhan Sabha are directly elected by people on the basis of universal adult franchise. The Speaker presides over the meetings of the House and conducts its proceedings. He maintains order in the House, allows the members to ask questions and speak. Article 178 - The Speaker and Deputy Speaker of the Legislative Assembly."},{"t":"Parliament","n":308,"tag":"","q":"The First hour of a sitting of the House allotted for asking and answering of questions is called as __________ .","o":["Censure motion","Zero hour","Privilege motion","Question hour"],"a":3,"e":"Question hour. Censure motion - A motion to express disapproval of the conduct of the government or a minister. Zero hour - The first hour of a sitting of the House, when MPs can raise matters of urgent public importance without notice. Privilege motion - A motion to protect the privileges of the House or its members."},{"t":"Parliament","n":309,"tag":"","q":"A money bill under Article 111 of the Constitution of India, presented to the President for assent, has to be endorsed by a Certificate of the ________signed by him/her that it is a money bill.","o":["Secretary General of the Lok Sabha","Secretary General of the Rajya Sabha","Speaker of the Lok Sabha","Deputy Chairman of the Rajya Sabha"],"a":2,"e":"Speaker of the Lok Sabha. Articles related to Money Bill: Article 107 - Provisions as to introduction and passing of Bills. Article 108 - Joint sitting of both Houses in certain cases. Article 109 - Special procedure in respect of Money Bills. Article 110 - Definition of “Money Bills”. Article 197 - Restriction on powers of Legislative Council as to Bills other than Money Bills."},{"t":"Parliament","n":310,"tag":"","q":"After how many days of absence from Parliament without permission will a Member of Parliament be disqualified?","o":["60 days","30 days","50 days","20 days"],"a":0,"e":"60 days. Disqualifications of Members of parliament : Article 101 - Vacation of seats. Article 102 - Disqualifications for membership. Article 103 - Decision on questions as to disqualifications of members. Article 104 - Penalty for sitting and voting before making oath or affirmation under article 99 or when not qualified or when disqualified."},{"t":"Parliament","n":311,"tag":"","q":"What is the bicameral legislature of the Indian Constitution ?","o":["It is a legislative body with four houses.","It is a legislative body with two houses.","It is a legislative body with one house.","It is a legislative body with three houses."],"a":1,"e":"The bicameral legislature of the Indian Constitution refers to a legislative body with two houses: the Lok Sabha (House of the People) and the Rajya Sabha (Council of States). Lok Sabha: The lower house, consisting of directly elected members. Rajya Sabha: The upper house, consisting of representatives elected by the members of the state legislative assemblies and by members of the Lok Sabha, along with nominated members."},{"t":"Parliament","n":312,"tag":"","q":"What is the most powerful weapon that enables the Parliament to ensure executive accountability ?","o":["Approval or refusal of laws","The no-confidence motion","Confirmation of treaties","Deliberation and discussion"],"a":1,"e":"The no-confidence motion. It moved in the Lok Sabha (and not in the Rajya Sabha) to test the confidence of the government. It needs the support of 50 members to be admitted. Other ways to ensure executive accountability: Question-hour, zero hour, calling attention motion, adjournment motion, censure motion, and other discussions."},{"t":"Parliament","n":313,"tag":"","q":"What is the maximum time gap between two sessions of the State Legislature ?","o":["Three months","Two months","Six months","One year"],"a":2,"e":"Six months. Article 174 (1) - The Governor shall from time to time summon the House or each House of the State Legislature to meet at such time and place as he thinks fit. Article 85 (1) of the Constitution empowers the President to summon and prorogue either house of Parliament or to dissolve the Lok Sabha. Three types of Sessions in the Parliament of India: Budget session (February - May), Monsoon session (July - September) and Winter session (November - December) are held in a calendar year."},{"t":"Parliament","n":314,"tag":"","q":"Which of the following pairs is/are correctly matched regarding the terminology used in the Parliament? A. Appropriation Bill - A Money Bill passed for providing for the withdrawal or appropriation from and out of the Consolidated Fund of India B. Demand for Grants - Earmarking of budgetary allocation for meeting only planned expenditure of a Ministry/Department C. Short Duration Discussion - For raising a discussion on a matter of urgent public importance for which a notice has to be given by a Member and supported by 50 Members.","o":["A, B and C","B and C only","A only","A and C only"],"a":2,"e":"A only. Demand for Grants is the form in which estimates of expenditure from the Consolidated Fund (included in the annual financial statement and required to be voted upon in the Lok Sabha) are submitted in pursuance of Article 113 of the Constitution. Short Duration Discussion is a procedural device to enable members to raise discussion on matters of urgent public importance without a formal motion on a matter of urgent public importance. The Speaker can allot two days in a week for such discussions."},{"t":"Parliament","n":315,"tag":"","q":"Which of the following can make provisions for Ancillary powers of the Supreme Court ?","o":["President of India","Law Commission of India","Minister of Law & Justice","Parliament of India"],"a":3,"e":"Parliament of India. Ancillary powers of the Supreme Court (Article 140): The Parliament, through legislation, can grant the Supreme Court additional powers that are in line with the Constitution's provisions. These extra powers should help the Court better fulfill its constitutional jurisdiction. President of India : Articles 52 - 62 (Part V), Parliament of India : Articles 79-122 (Part V), Supreme Court : Articles 124-147 (Part V)."},{"t":"Parliament","n":316,"tag":"","q":"In India, during a meeting of the Legislative Assembly or Council, if there is no quorum, it shall be the duty of the ________ to adjourn the House or suspend the meeting.","o":["Chairman/Governor","Speaker/Chairman","Governor/Chief Minister","Speaker/Chief Minister"],"a":1,"e":"Speaker/Chairman. Article 100 - Voting in Houses, power of Houses to act notwithstanding vacancies and quorum. Quorum - It refers to the number of members that must be present for a house meeting to take place. Article 189 (3) - The quorum to constitute a meeting of the state legislature shall be ten members or one-tenth of the total number of members of the house whichever is greater."},{"t":"Parliament","n":317,"tag":"","q":"A Money Bill should be returned to the Lok Sabha within ___ days by Rajya Sabha, either with recommendations or without recommendations.","o":["8","21","14","10"],"a":2,"e":"14. Money Bill (Article 110) - It is involved with tax collection, public expense bills, and other significant costs associated with running the government. Money Bill Types - Financial Bill and Appropriation Bill. The Speaker has the authority to determine whether or not a specific bill is a money bill."},{"t":"Parliament","n":318,"tag":"","q":"Archana wishes to contest for Lok Sabha elections in India. What is the maximum limit of constituencies that can she contest ?","o":["One","Four","Three","Two"],"a":3,"e":"Two. Candidates were allowed to contest more than Two seats until 1996. As per, Section 33 (7) of the RPA (Representation of the People Act) 1951, one candidate can contest from a maximum of two constituencies. Section 70 bars candidates from representing two constituencies in the Lok Sabha/state, which means candidates have to vacate one seat in case of winning both the seats."},{"t":"Parliament","n":319,"tag":"","q":"Which of the following is NOT a kind of question related to Indian Parliamentary Proceedings ?","o":["Starred Question","Unstarred Question","Short Notice Question","Long Notice Question"],"a":3,"e":"Long Notice Question. Starred Questions are those for which an oral answer is expected. Non-starred questions are those for which a written reply is expected. Short notice questions are those which are asked on matters of urgent public importance and can be asked on a shorter notice, less than 10 days."},{"t":"Parliament","n":320,"tag":"","q":"Which of the following is called 'the temple of the country's democracy' ?","o":["Raj Ghat","Supreme Court","Ashok Pillar","Parliament"],"a":3,"e":"Parliament (Article 79) consists of the President (Article 52), Council of States (Article 80 - Rajya Sabha) and House of the People (Article 81 - Lok Sabha)."},{"t":"Parliament","n":321,"tag":"","q":"The state legislative assembly has a strength of ____, with exceptions for smaller states.","o":["600 to 1000","60 to 500","50 to 400","10 to 100"],"a":1,"e":"60 and 500 members. However an exception may be granted in the states of Goa, Sikkim, Mizoram, and the union territory of Puducherry which have fewer than 60 members. Maximum seats (Uttar Pradesh; 403) and least number of seats (Puducherry; 30)."},{"t":"Parliament","n":322,"tag":"","q":"According to the Indian Constitution, the House of People shall consist of not more than ______ members to represent the Union territories.","o":["thirty","twenty","fifteen","Thirty-five"],"a":1,"e":"Twenty . The Lok Sabha is composed of representatives of people chosen by direct election on the basis of adult suffrage. The maximum strength of the House envisaged by the Constitution is now 550 (530 members to represent States, 20 to represent Union Territories)"},{"t":"Parliament","n":323,"tag":"","q":"How many organs of government are there according to the Indian Constitution?","o":["Two","Four","One","Three"],"a":3,"e":"Three Organs: the Legislature consists of the President and two Houses, known as Council of States (Rajya Sabha) and House of the People (Lok Sabha), the Executive consists of the President, the Vice-President, and the Council of Ministers with the Prime Minister as the head to aid and advise the President. and the Judiciary consists of the Supreme Court, High Court, District Court or Subordinate Court."},{"t":"Parliament","n":324,"tag":"","q":"__________ is a motion moved by a member to cut short the debate on a matter before the House.","o":["Closure","No-Confidence","Privilege","Censure"],"a":0,"e":"‘Closure Motion’ . No Confidence Motion’ also called as Motion of No Confidence: A Vote of No Confidence is a formal proposal in Lok Sabha to evoke a decision of the house."},{"t":"Parliament","n":325,"tag":"","q":"Which of the following is NOT a feature of parliamentary government in India?","o":["Membership of the ministers in the legislature,","Undissolvable lower house","Presence of nominal and real executives","Collective responsibility of the executive to the legislature"],"a":1,"e":"Undissolvable lower house. Features of Parliamentary Government : Nominal and Real Executives, Double Membership, Collective Responsibility, Secrecy of procedure, Prime Ministerial Leadership, Majority Party Rule, Bicameral Legislature, Political Homogeneity, No fixed term."},{"t":"Parliament","n":326,"tag":"","q":"Consider the following statements regarding forms of government: A. An alliance formed by political parties after elections when no party secures a clear majority is called a coalition government. B. Appropriation refers to setting aside money for a specific purpose, prorogation is the termination of a House session by the President, and allegiance is a tie that binds an individual to an institution or person. Which of the above statement(s) is/are correct?","o":["A only","B only","Both A and B","Neither A nor B"],"a":2,"e":"Both A and B. A coalition government is formed when parties join hands to achieve a majority, while appropriation, prorogation, and allegiance have distinct meanings unrelated to forming government alliances."},{"t":"Parliament","n":327,"tag":"","q":"The period between prorogation of Parliament and re-assembly in a new session is called______.","o":["adjournment","recess","dissolution","cut motion"],"a":1,"e":"Recess . An adjournment suspends the work in a sitting for a specified time, which may be hours, days or weeks. A dissolution ends the very life of the existing House, and a new House is constituted after general elections are held. Cut motion is a power given to the members of the Lok Sabha that enables its members to oppose any demand in a Finance Bill proposed by a government"},{"t":"Parliament","n":328,"tag":"","q":"In the absence of the Speaker and the Deputy Speaker of Lok Sabha, who presides over the joint sitting of the two houses of Parliament?","o":["Chairman of Rajya Sabha","Any senior member of Rajya Sabha","Deputy Chairman of Rajya Sabha","Any senior member of Lok Sabha"],"a":2,"e":"Deputy Chairman of Rajya Sabha . Article 93 - The Speaker and Deputy Speaker of the House of the People . Article 95 - Power of the Deputy Speaker or other person to perform the duties of the office of, or to act as, Speaker. Article 96 - The Speaker or the Deputy Speaker not to preside while a resolution for his removal from office is under consideration."},{"t":"Parliament","n":329,"tag":"","q":"The salary and allowances of leaders of opposition in parliament are governed by the Act passed for the first time by the parliament in the year ______.","o":["1972","1982","1977","1979"],"a":2,"e":"1977 . Second Schedule of the Indian Constitution deals with the provisions in relation to allowances, privileges, emoluments of : The President of India, Governors of Indian States, Speaker of Lok Sabha & Deputy Speaker of Lok Sabha etc. The leader of the largest Opposition party having not less than one-tenth of the seats of the total strength of the House is recognized as the leader of the Opposition in that House opposition cabinet."},{"t":"President, VP & PM","n":330,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"The Vice-President of India is part of which branch of the government ?","o":["Legislative only","Executive only","Judicial only","Both Executive and Legislative"],"a":3,"e":"Both Executive and Legislative. The Vice-President of India is part of the Executive as he is the second highest constitutional authority after the President. At the same time, he is also part of the Legislature, since he is the ex-officio Chairman of the Rajya Sabha (Council of States). Thus, the Vice-President has a dual role, functioning in both the Executive and Legislative branches of the government."},{"t":"President, VP & PM","n":331,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which body is responsible for resolving disputes related to the election of the President of India?","o":["Election Commission","Supreme Court","Lok Sabha","Rajya Sabha"],"a":1,"e":"Supreme Court. Article 71 of the Indian Constitution provides that all doubts and disputes regarding the election of the President (and Vice-President) shall be inquired into and decided by the Supreme Court, whose decision is final. The decision of the Supreme Court in such matters is final and cannot be challenged in any other court. Under Article 71(2), if a President’s election is declared void, all acts done before the verdict remain valid to ensure continuity."},{"t":"President, VP & PM","n":332,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following statements is true in relation to the enforcement of President's Rule ?","o":["The Governor's recommendation can lead to dismissal of a State government, even if it enjoys a majority.","It ca
