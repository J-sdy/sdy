topic": "President of India", "question": "Under Article 123 of the Constitution, when can the President promulgate an Ordinance?", "options": {"A": "When both Houses of Parliament are in session", "B": "When either House of Parliament is in session", "C": "When both Houses of Parliament are not in session and immediate action is necessary", "D": "Only when Parliament has been dissolved"}, "answer": "C", "explanation": "session and the President is satisfied that immediate action is necessary. An Ordinance has the same force and effect\nas an Act of Parliament, but it must be laid before both Houses when they reassemble and normally ceases to operate\nsix weeks after their reassembly, unless Parliament approves it earlier."}, {"id": 139, "topic": "President of India", "question": "Consider the following statements regarding the Legislative Powers of the President of India:\n\n    1.   The President summons and prorogues Parliament and can dissolve the Lok Sabha.\n    2.   The President can nominate 12 members to the Rajya Sabha.\n    3.   The President can give assent to Bills and can return a non-Money Bill for reconsideration.\n    4.   The President can promulgate Ordinances when Parliament is not in session.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 2, 3 and 4", "C": "2 and 4 only", "D": "1 and 3 only"}, "answer": "B", "explanation": "•    Summoning & Prorogation – Article 85: President summons and prorogues both Houses of Parliament and\n         can dissolve the Lok Sabha.\n    •    Address to Parliament – Article 87: President addresses both Houses assembled together at the beginning of\n         the first session after each general election and at the beginning of the first session every year.\n    •    Nomination to Rajya Sabha – Article 80: President nominates 12 members having special knowledge or\n         practical experience in literature, science, art and social service.\n\n\n\n      •    Bills – Article 111: President may give assent, withhold assent, or return a non-Money Bill once for\n           reconsideration. If Parliament passes it again, the President cannot withhold assent.\n      •    Money Bill: A Money Bill cannot be returned for reconsideration.\n      •    Ordinance Power – Article 123: President can promulgate an Ordinance when both Houses of Parliament\n           are not in session, and immediate action is necessary. It has the same force as an Act of Parliament but\n           must be approved by Parliament within 6 weeks of its reassembly.\n      •    Messages to Parliament – Article 86: President can send messages to either House of Parliament regarding\n           pending Bills or other matters.\n      •    Joint Sitting – Article 108: President may summon a joint sitting of both Houses to resolve a deadlock on a\n           Bill.\n      •    Previous Recommendation: Certain Bills require the President’s recommendation before introduction, such\n           as a Bill involving expenditure from the Consolidated Fund of India.\n      •    Annual Financial Statement – Article 112: The President causes the Union Budget/Annual Financial\n           Statement to be laid before Parliament.\n      •    Reports before Parliament: The President causes reports of constitutional bodies such as the CAG, UPSC\n           and Finance Commission to be laid before Parliament.\n      •    Anglo-Indian nomination: The former provision for nomination of 2 Anglo-Indian members to the Lok\n           Sabha was abolished by the 104th Constitutional Amendment Act, 2019.\n\nQ14"}, {"id": 140, "topic": "President of India", "question": "Consider the following statements regarding the Executive Powers of the President of India:\n\n      1.   The executive power of the Union is vested in the President and is exercised by him directly or through\n           subordinate officers.\n      2.   The President appoints the Prime Minister and other Union Ministers, with the other Ministers being\n           appointed on the advice of the Prime Minister.\n      3.   The President appoints important constitutional authorities such as the Attorney General, CAG, Governors\n           and UPSC Chairman and members.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Article 53: The executive power of the Union is vested in the President and is exercised directly or through\n           subordinate officers.\n      •    Article 74: President exercises executive powers on the aid and advice of the Council of Ministers headed\n           by the Prime Minister.\n      •    Article 75: President appoints the Prime Minister and appoints other Ministers on the Prime Minister’s\n           advice.\n\n\n\n    •    Article 76: President appoints the Attorney General of India.\n    •    Article 148: President appoints the Comptroller and Auditor General (CAG).\n    •    Article 155: President appoints the Governors of States.\n    •    Article 316: President appoints the Chairman and members of UPSC.\n    •    Article 280: President constitutes the Finance Commission and appoints its members.\n    •    Article 324: President appoints the Chief Election Commissioner and Election Commissioners, subject to\n         the constitutional/statutory framework in force.\n    •    Article 338/338A/338B: President appoints the Chairperson and members of the National Commissions for\n         SCs, STs and Backward Classes.\n    •    Article 77: All executive actions of the Government of India are expressed to be taken in the name of the\n         President.\n    •    Article 78: Prime Minister has the duty to communicate important decisions and legislative proposals to the\n         President.\n    •    Union Territories: President administers Union Territories through Administrators/Lieutenant Governors,\n         as provided by the Constitution."}, {"id": 141, "topic": "President of India", "question": "Consider the following statements regarding the Veto Powers of the President of India:\n\n    1.   The President can withhold assent to a Bill passed by Parliament, which is known as Absolute Veto.\n    2.   The President can return a non-Money Bill to Parliament for reconsideration, which is known as\n         Suspensive Veto.\n    3.   The President can keep a Bill pending without taking any action, which is known as Pocket Veto.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3\n\nAnswer:D\n\nExp: Veto Powers of President\n\n    •    Absolute Veto: President withholds assent to a Bill. The Bill does not become an Act.\n    •    Suspensive Veto: President returns a non-Money Bill for reconsideration. If Parliament passes it again, the\n         President must give assent. A Money Bill cannot be returned.\n    •    Pocket Veto: President does not take any action on a Bill and keeps it pending. The Constitution does not\n         prescribe any specific time limit for the President to decide on a Bill under Article 111.\n\nQualified Veto: The President of India does not have a qualified veto. It is found in the U.S. presidential\nsystem.Qualified Veto means the President/Head of State can reject a Bill, but the legislature can override that veto\nby passing the Bill again with a specified special majority.\n\n145.Consider the following statements regarding Articles 63, 64 and 65 of the Indian Constitution:\n\n\n\n    1.   Article 63 provides for the office of the Vice-President of India.\n    2.   Article 64 makes the Vice-President the ex-officio Chairman of the Rajya Sabha.\n    3.   Article 65 provides for the Vice-President acting as President or discharging the functions of the President.\n\nWhich of the statements given above is/are correct?"}, "answer": "D", "explanation": "•    Absolute Veto: President withholds assent to a Bill. The Bill does not become an Act.\n    •    Suspensive Veto: President returns a non-Money Bill for reconsideration. If Parliament passes it again, the\n         President must give assent. A Money Bill cannot be returned.\n    •    Pocket Veto: President does not take any action on a Bill and keeps it pending. The Constitution does not\n         prescribe any specific time limit for the President to decide on a Bill under Article 111.\n\nQualified Veto: The President of India does not have a qualified veto. It is found in the U.S. presidential\nsystem.Qualified Veto means the President/Head of State can reject a Bill, but the legislature can override that veto\nby passing the Bill again with a specified special majority.\n\n145.Consider the following statements regarding Articles 63, 64 and 65 of the Indian Constitution:\n\n\n\n    1.   Article 63 provides for the office of the Vice-President of India.\n    2.   Article 64 makes the Vice-President the ex-officio Chairman of the Rajya Sabha.\n    3.   Article 65 provides for the Vice-President acting as President or discharging the functions of the President.\n\nWhich of the statements given above is/are correct?\n\nA.1 and 2 only\n\nB.2 and 3 only\n\nC.1 and 3 only\n\nD.1, 2 and 3\n\nAns:D\n\nExp: Vice-president\n\nOffice of Vice-President — Article 63\n\n    •    Article 63 provides for the office of the Vice-President of India.\n    •    It states that “There shall be a Vice-President of India.”\n\nThus, Article 63 establishes the constitutional office of Vice-President.\n\nVice-President as Rajya Sabha Chairman — Article 64\n\n    •    Article 64 makes the Vice-President the ex-officio Chairman of the Rajya Sabha.\n    •    The Vice-President does not vote in the first instance as Chairman.\n    •    In case of equality of votes, he exercises a casting vote under Article 100.\n    •    When the Vice-President acts as President or discharges the President’s functions, he does not perform the\n         duties of Chairman of Rajya Sabha.\n\nVice-President acting as President — Article 65\n\n    •    Article 65 deals with the Vice-President acting as President or discharging the functions of President.\n    •    When a vacancy occurs in the office of President due to death, resignation, removal or otherwise, the Vice-\n         President acts as President.\n    •    When the President is unable to perform his functions due to absence, illness or any other cause, the Vice-\n         President discharges the President’s functions.\n    •    During this period, the Vice-President does not perform the duties of Rajya Sabha Chairman.\n    •    He enjoys the powers and immunities of the President during this period."}, {"id": 142, "topic": "Vice-President", "question": "Which of the following statements regarding Article 66 of the Indian Constitution is/are correct?\n\n    1.   The Vice-President is elected by the members of both Houses of Parliament.\n    2.   The election is held by proportional representation through the Single Transferable Vote system and voting\n         is by secret ballot.\n    3.   A candidate for Vice-President must be a citizen of India, have completed 35 years of age, and be qualified\n         for election as a member of the Rajya Sabha.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3\n\nAnswer:D.1, 2 and 3\n\nExp: Article 66 – Election of Vice-President\n\nArticle 66(1): Electoral College – Vice-President is elected by the members of both Houses of Parliament.\n\n    •    Both elected and nominated members of Parliament participate in the Vice-Presidential election.\n    •    State Legislative Assembly/council members do not participate in this election.\n\nArticle 66(1): Method of election - Proportional Representation by means of Single Transferable Vote (STV).Voting\nis conducted by secret ballot.\n\nArticle 66(3): Qualifications - Candidate must:\n\n    •    Be a citizen of India;\n    •    Have completed 35 years of age;\n    •    Be qualified for election as a member of Rajya Sabha.\n\nArticle 66(4): Office of Profit → Candidate must not hold any office of profit under the Government of India, State\nGovernment, or a local/other authority subject to the control of these governments.\n\nImportant: A sitting MP can contest the Vice-Presidential election, but if elected, his/her seat is deemed vacant on\nentering the office of Vice-President under Article 66(2).\n\n147.Which of the following statements regarding Article 67 of the Indian Constitution is/are correct?\n\n    1.   The Vice-President holds office for a term of five years from the date on which he enters upon his office.\n    2.   The Vice-President may resign by addressing his resignation to the President.\n    3.   The Vice-President can be removed by a resolution of the Rajya Sabha agreed to by the Lok Sabha."}, "answer": "D", "explanation": "Article 66 – Election of Vice-President\n\nArticle 66(1): Electoral College – Vice-President is elected by the members of both Houses of Parliament.\n\n    •    Both elected and nominated members of Parliament participate in the Vice-Presidential election.\n    •    State Legislative Assembly/council members do not participate in this election.\n\nArticle 66(1): Method of election - Proportional Representation by means of Single Transferable Vote (STV).Voting\nis conducted by secret ballot.\n\nArticle 66(3): Qualifications - Candidate must:\n\n    •    Be a citizen of India;\n    •    Have completed 35 years of age;\n    •    Be qualified for election as a member of Rajya Sabha.\n\nArticle 66(4): Office of Profit → Candidate must not hold any office of profit under the Government of India, State\nGovernment, or a local/other authority subject to the control of these governments.\n\nImportant: A sitting MP can contest the Vice-Presidential election, but if elected, his/her seat is deemed vacant on\nentering the office of Vice-President under Article 66(2).\n\n147.Which of the following statements regarding Article 67 of the Indian Constitution is/are correct?\n\n    1.   The Vice-President holds office for a term of five years from the date on which he enters upon his office.\n    2.   The Vice-President may resign by addressing his resignation to the President.\n    3.   The Vice-President can be removed by a resolution of the Rajya Sabha agreed to by the Lok Sabha.\n\nA.1 and 2 only\n\nB.1 and 3 only\n\nC.2 and 3 only\n\nD.1, 2 and 3\n\nAns:D\n\nExp: Article 67\n\nArticle 67(a) – Term: Vice-President holds office for 5 years from the date he enters office.\n\n    •    Even after completion of 5 years, he continues in office until his successor enters office.\n\nArticle 67(b) – Removal: Vice-President can be removed by a resolution of Rajya Sabha, passed by a majority of all\nthe then members of Rajya Sabha and agreed to by Lok Sabha.\n\n\n\n    •      14 days’ notice must be given before moving the removal resolution.\n\nArticle 67(c) – Resignation: Vice-President may resign by addressing the resignation to the President.\n\n    •      Note Vice-President is not removed through impeachment, unlike the President."}, {"id": 143, "topic": "Vice-President", "question": "Consider the following statements regarding Article 68 of the Indian Constitution:\n\n    1.     An election to fill a vacancy caused by the expiration of the Vice-President’s term must be completed\n           before the term expires.\n    2.     An election to fill a vacancy caused by the death, resignation or removal of the Vice-President must be held\n           as soon as possible after the vacancy occurs.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "•      Article 68(1) – Vacancy due to expiry of term: Election to fill the vacancy must be completed before the\n           expiration of the term of the outgoing Vice-President.\n    •      Article 68(2) – Casual vacancy: If the vacancy arises due to death, resignation, removal or otherwise, the\n           election must be held as soon as possible after the vacancy occurs.\n    •      The person elected to fill a casual vacancy gets a full term of 5 years from the date he enters office, as\n           provided under Article 67(a).\n    •      Important distinction: Article 68 deals with when the election to fill a vacancy must be held, while Article\n           67 deals with the term of office."}, {"id": 144, "topic": "Vice-President", "question": "Which of the following is correct regarding the oath or affirmation taken by the Vice-President of India?", "options": {"A": "The Vice-President takes the oath before the Chief Justice of India.", "B": "The Vice-President takes the oath before the President or a person appointed by the President.", "C": "The Vice-President takes the oath before the Chairman of the Rajya Sabha.", "D": "The Vice-President takes the oath before the Prime Minister."}, "answer": "B", "explanation": "•      Under Article 69, the Vice-President must make and subscribe to an oath or affirmation before entering\n           office.\n    •      The oath is administered by the President, or a person appointed by the President for this purpose.\n\n\n\n    •    The oath is to bear true faith and allegiance to the Constitution of India and to faithfully discharge the\n         duties of the office."}, {"id": 145, "topic": "Vice-President", "question": "What does Article 70 of the Indian Constitution deal with?", "options": {"A": "Discharge of the Vice-President’s functions", "B": "Election of the Vice-President", "C": "Discharge of the President’s functions in other contingencies", "D": "Removal of the Vice-President"}, "answer": "C", "explanation": "•    Article 70 deals with situations where the President’s functions need to be discharged in a contingency not\n         specifically provided for in the Constitution.In such a situation, Parliament may make provisions by law for\n         the discharge of the President’s functions.\n    •    Article 65 → Vice-President acts as President or discharges the President’s functions in specified\n         situations.\n    •    Article 70 → Other contingencies not specifically provided for in the Constitution.\n\nContingencies means unexpected or special situations/events that may happen."}, {"id": 146, "topic": "PM & Council of Ministers", "question": "Which of the following statements correctly describes the constitutional position regarding the aid and advice\nof the Council of Ministers to the President?", "options": {"A": "The President is bound by the advice of the Prime Minister alone.", "B": "The President acts on the aid and advice of the Council of Ministers headed by the Prime Minister.", "C": "The President can permanently reject the advice of the Council of Ministers.", "D": "The Council of Ministers is bound by the President’s advice."}, "answer": "B", "explanation": "Article 74(1): There shall be a Council of Ministers with the Prime Minister at the head to aid and advise the\nPresident.\n\n    •    The President acts in accordance with such advice.\n    •    The President can ask the Council of Ministers to reconsider its advice once.\n    •    However, after reconsideration, the President must act according to the advice tendered.\n    •    Therefore, the President is the constitutional/formal executive, while the Council of Ministers headed by\n         the Prime Minister is the real executive."}, {"id": 147, "topic": "PM & Council of Ministers", "question": "Consider the following statements regarding the Council of Ministers under the Constitution:\n\n\n\n    1.   The Prime Minister is appointed by the President, and the other Ministers are appointed by the President on\n         the advice of the Prime Minister.\n    2.   The Council of Ministers is collectively responsible to the Lok Sabha.\n    3.   A Minister who is not a member of either House of Parliament for six consecutive months ceases to be a\n         Minister.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Article 75(1): The Prime Minister is appointed by the President. Other Ministers are appointed by the\n         President on the advice of the Prime Minister.\n    •    Article 75(2): Ministers hold office during the pleasure of the President.\n    •    Article 75(3): The Council of Ministers is collectively responsible to the Lok Sabha.\n    •    Article 75(4): Every Minister takes the oath of office and secrecy before the President.\n    •    Article 75(5) A person can become a Minister even if they are not an MP.\n\nBut there is a condition:\n\n             Ø They can remain a Minister for a maximum of 6 months.\n             Ø Within those 6 months, they must become a member of Lok Sabha or Rajya Sabha.\n             Ø If they do not become an MP within 6 months, they cease to be a Minister.\n    •    Article 75(6): Salaries and allowances of Ministers are determined by Parliament."}, {"id": 148, "topic": "PM & Council of Ministers", "question": "Which of the following is correctly associated with Article 77 of the Indian Constitution?", "options": {"A": "Appointment of the Prime Minister", "B": "Conduct of the business of the Government of India", "C": "Collective responsibility of the Council of Ministers", "D": "Duties of the Prime Minister towards the President"}, "answer": "B", "explanation": "Ø Article 77(1): All executive actions of the Government of India are taken in the name of the President.\n    Ø Article 77(2): Orders and instruments made in the name of the President are authenticated according to\n      prescribed rules.\n    Ø Article 77(3): The President makes rules for the convenient transaction of Government business and for\n      allocation of business among Ministers.\n\n\n\nNoteAllocation of business among ministers means Different Government departments/subjects are divided and\nassigned among different Ministers."}, {"id": 149, "topic": "PM & Council of Ministers", "question": "Which of the following correctly describes the constitutional duties of the Prime Minister under Article 78?", "options": {"A": "To appoint the other Union Ministers", "B": "To communicate important decisions of the Council of Ministers to the President", "C": "To preside over the Rajya Sabha", "D": "To appoint the Governors of States"}, "answer": "B", "explanation": "The Prime Minister must:\n\n    Ø Communicate to the President all decisions of the Council of Ministers relating to the administration of\n      Union affairs and proposals for legislation.\n    Ø President asks → PM provides: If the President asks for information about the Government’s\n      administration or legislative proposals, the PM must provide it.\n    Ø President wants discussion → PM places before Council: If a Minister has taken a decision individually\n      and the President wants the Council of Ministers to consider it, the PM must place that matter before the\n      Council"}, {"id": 150, "topic": "PM & Council of Ministers", "question": "Consider the following statements regarding the powers and functions of the Prime Minister of India:\n\n    1.   The Prime Minister plays a central role in the formation and functioning of the Council of Ministers.\n    2.   The Prime Minister acts as the main link between the President and the Council of Ministers.\n    3.   The Prime Minister plays an important role in the functioning and leadership of Parliament.\n    4.   The Prime Minister performs various other functions such as coordinating different ministries and\n         representing the country at the international level.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 3 and 4 only", "C": "2 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "In relation to the Council of Ministers\n\n    •    Head of the Council of Ministers: PM is the head of the Union Council of Ministers.\n    •    Formation of Ministry: PM recommends the appointment of other Ministers to the President.\n\n\n\n    •    Allocation of Portfolios: PM allocates and reshuffles portfolios among Ministers.\n    •    Coordination: PM coordinates the work of different Ministers and Departments.\n    •    Cabinet Meetings: PM presides over Cabinet meetings and provides overall leadership.\n    •    Resignation/Removal: PM can ask a Minister to resign. If necessary, PM can advise the President to\n         dismiss a Minister.\n    •    Council’s survival: If the PM resigns or dies, the entire Council of Ministers falls, as the Council exists\n         under the leadership of the PM.\n\nIn relation to the President\n\n    •    Main link: PM acts as the important link between the President and the Council of Ministers.\n    •    Under Article 78, PM communicates important decisions of the Council of Ministers to the President.\n    •    PM provides information about Union administration and legislative proposals when the President asks.\n    •    If the President requires, PM places before the Council of Ministers a matter decided by an individual\n         Minister but not considered by the Council.\n    •    PM advises the President regarding the appointment of other Ministers under Article 75.\n\nIn relation to Parliament\n\n    •    PM is generally the leader of the majority party/coalition in the Lok Sabha.\n    •    PM provides leadership to the government in Parliament and plays a key role in getting government\n         legislation passed.\n    •    PM coordinates the government’s legislative programme and important parliamentary business.\n    •    PM advises the President on important matters relating to summoning, prorogation and dissolution of the\n         Lok Sabha, as part of the constitutional system of aid and advice.\n    •    PM can communicate important government policies and decisions to Parliament.\n\nOther Functions and Powers\n\n    •    Chief Coordinator: Coordinates the activities of different Ministries and Departments.\n    •    National Leadership: Provides overall political leadership to the Union Government.\n    •    Appointments: Plays an important role in advising on various important appointments under the\n         constitutional and legal framework.\n    •    International Role: Represents India at important international meetings, summits and diplomatic\n         engagements.\n    •    Crisis Leadership: Provides overall political leadership during major national crises and emergencies.\n    •    Link with the President: Keeps the President informed about important matters concerning the\n         administration of the Union."}, {"id": 151, "topic": "PM & Council of Ministers", "question": "Which of the following Chief Ministers later became Prime Ministers of India?", "options": {"A": "Morarji Desai", "B": "Charan Singh", "C": "H. D. Deve Gowda", "D": "All of the above"}, "answer": "D", "explanation": "•    Morarji Desai – Chief Minister of Bombay State → Prime Minister (1977–1979)\n    •    Charan Singh – Chief Minister of Uttar Pradesh → Prime Minister (1979–1980)\n    •    V. P. Singh – Chief Minister of Uttar Pradesh → Prime Minister (1989–1990)\n    •    P. V. Narasimha Rao – Chief Minister of Andhra Pradesh → Prime Minister (1991–1996)\n    •    H. D. Deve Gowda – Chief Minister of Karnataka → Prime Minister (1996–1997)\n    •    Narendra Modi – Chief Minister of Gujarat → Prime Minister (2014–present)"}, {"id": 152, "topic": "PM & Council of Ministers", "question": "Which of the following can participate in the proceedings of either House of Parliament without being a\nmember of that particular House?", "options": {"A": "Only the Prime Minister", "B": "Ministers and the Attorney-General of India", "C": "Only the Attorney-General", "D": "Only the Speaker of Lok Sabha"}, "answer": "B", "explanation": "•    Ministers and the Attorney-General of India have the right to speak and participate in the proceedings of\n         either House of Parliament.\n    •    They can also participate in the proceedings of any parliamentary committee of which they may be named\n         as a member.\n    •    Important: Article 88 gives them the right to participate, but it does not give a voting right.\n    •    A Minister can vote in the House if they are a member of that House, but not merely because they are a\n         Minister.\n    •    The Attorney-General is not a member of Parliament, but can participate under Article 88; he/she has no\n         right to vote."}, {"id": 153, "topic": "PM & Council of Ministers", "question": "Consider the following statements regarding the responsibility of Ministers:\n\n    1.   The Council of Ministers is collectively responsible to the Lok Sabha.\n    2.   A Minister holds office during the pleasure of the President.\n    3.   The Constitution does not provide for the legal responsibility of Ministers.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Collective Responsibility\n\n    •    Article 75(3) – Entire Council of Ministers is responsible to Lok Sabha.\n    •    If the Lok Sabha passes a No-Confidence Motion, the whole Council of Ministers must resign.\n    •    All Ministers must support the decisions of the government as one team.\n\nIndividual Responsibility\n\n    •    Article 75(2) – A Minister holds office during the pleasure of the President.\n    •    In practice, the President acts on the advice of the Prime Minister.\n    •    If the PM wants a Minister to leave, the PM can ask the Minister to resign or advise the President to\n         dismiss that Minister.\n\nNo Legal Responsibility\n\n    •    In India, Ministers do not have legal responsibility for every official act of the President.\n    •    A Minister does not have to countersign the President’s orders to make them valid.\n    •    So, the Constitution does not follow the legal responsibility system for Ministers."}, {"id": 154, "topic": "PM & Council of Ministers", "question": "Which of the following correctly describes the composition of the Union Council of Ministers?", "options": {"A": "Cabinet Ministers, Ministers of State and Deputy Ministers", "B": "Cabinet Ministers and Members of Parliament only", "C": "Cabinet Ministers and Governors", "D": "Ministers of State and Deputy Ministers only"}, "answer": "A", "explanation": "The Union Council of Ministers consists of the following three categories:\n\nCabinet Ministers\n\n    •    They are the senior-most Ministers in the Council of Ministers.\n    •    They head important Ministries such as Home, Defence, Finance, External Affairs, etc.\n    •    They are the main members of the Cabinet, which takes major policy decisions.\n\nMinisters of State\n\n    •    They are below Cabinet Ministers in rank.\n\nA Minister of State may:\n\n    •    Assist a Cabinet Minister in a particular Ministry, or\n    •    Be given Independent Charge of a Ministry/Department.\n\nIndependent Charge means the Minister directly handles that Ministry/Department without a Cabinet Minister above\nthem.\n\n\n\nDeputy Ministers\n\n    •    They are junior Ministers.\n    •    They assist Cabinet Ministers or Ministers of State in their work.\n    •    They do not have independent charge of a Ministry.\n\nNote\n\n    •    The Prime Minister is the head of the Council of Ministers.\n    •    Cabinet is a smaller and more powerful body within the Council of Ministers.\n    •    Article 75(1A): Total number of Ministers, including the Prime Minister, cannot exceed 15% of the total\n         strength of the Lok Sabha.\n    •    Article 75(1B): A member disqualified under the Tenth Schedule (anti-defection law) cannot be appointed\n         as a Minister for the specified period."}, {"id": 155, "topic": "Governor & State Executive", "question": "Which of the following is correct regarding Article 153 of the Indian Constitution?", "options": {"A": "Every State shall have a Chief Minister.", "B": "There shall be a Governor for each State.", "C": "The Governor is elected by the people of the State.", "D": "The Governor is appointed by the Chief Minister."}, "answer": "B", "explanation": "•    Article 153 provides that there shall be a Governor for each State.\n    •    The same person can be appointed as Governor of two or more States.This provision was made possible by\n         the 7th Constitutional Amendment Act, 1956.\n\nExample:\n\n    •    E. S. L. Narasimhan – Governor of Andhra Pradesh + Telangana (2014–2019).\n    •    Koshyari – Governor of Maharashtra + Goa (2019–2023).\n    •    S. S. Barnala – Governor of Tamil Nadu + Andhra Pradesh (1990–1991)."}, {"id": 156, "topic": "Governor & State Executive", "question": "Which of the following correctly describes Article 154 of the Indian Constitution?", "options": {"A": "The executive power of the State is vested in the Governor.", "B": "The Governor is elected by the people of the State.", "C": "The Governor appoints the Chief Minister directly without any constitutional limitations.", "D": "The executive power of the State is vested in the Chief Minister."}, "answer": "A", "explanation": "Article 154(1): The executive power of the State is vested in the Governor.\n\n\n\n    •    The Governor can exercise this power directly or through officers subordinate to him, according to the\n         Constitution.\n    •    This does not mean the Governor personally runs the State Government.\n    •    In the parliamentary system, the Governor normally acts on the aid and advice of the Council of Ministers\n         headed by the Chief Minister."}, {"id": 157, "topic": "Governor & State Executive", "question": "Consider the following statements regarding the Governor of a State:\n\n    1.   The Governor is appointed by the President of India.\n    2.   The Governor normally holds office for a term of five years but continues to hold office during the pleasure\n         of the President.\n    3.   A person must be a citizen of India and have completed 35 years of age to be appointed as Governor.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Appointment of Governor – Article 155\n\n    •    The President appoints the Governor of a State.\n    •    The Governor is appointed by a warrant under the hand and seal of the President.\n    •    The Governor is not directly elected by the people.\n\nTerm of Governor – Article 156\n\n    •    The normal term of a Governor is 5 years.\n    •    However, the Governor holds office during the pleasure of the President.\n    •    The Governor may resign by addressing the resignation to the President.\n    •    A Governor can also continue in office after 5 years until the successor enters office.\n\nQualifications of Governor – Article 157\n\nA person must:\n\n    •    Be a citizen of India.\n    •    Have completed 35 years of age.\n\nLater 2 conventions have developed:Governor should be an outsider(Not belong to same state)& While appointing\nconsultation with Chief minister.(These 2 are also followed present &Not Compulsory -same state also allowed\nacc.to constitution)\n\nSarkaria Commission – Additional Guidelines for Governor\n\n\n\nThe Sarkaria Commission (1983–1988) suggested some guidelines for selecting Governors. These are\nrecommendations, not constitutional qualifications under Article 157.\n\n    •    Eminent person – Governor should be an eminent person in some field.\n    •    Not too closely connected with the local politics – Should preferably be from outside the State.\n    •    Detached from local politics – Should not be actively involved in the State’s local political affairs.\n    •    Non-partisan – Should not be an active member of a political party.\n    •    Not recently active in politics – A person who has taken an active part in politics in the recent past should\n         preferably not be appointed.\n    •    Consultation with the Chief Minister while appointment of governor."}, {"id": 158, "topic": "Governor & State Executive", "question": "Consider the following statements regarding the conditions of office and oath of the Governor:\n\n    1.   The Governor shall not be a member of Parliament or a member of a State Legislature during his term of\n         office.\n    2.   The Governor shall not hold any other office of profit during his term of office.\n    3.   The Governor is entitled to use his official residence without payment of rent.\n    4.   The Governor takes the oath before the Chief Justice of the concerned High Court or, in his absence, the\n         senior-most available Judge of that High Court.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 2 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Conditions of Governor’s Office – Article 158\n\n    •    Article 158(1): Governor shall not be a member of Parliament or a House of the Legislature of any State.If\n         an MP/MLA is appointed Governor, their seat is deemed vacant from the date they enter office.\n    •    Article 158(2): Governor shall not hold any other office of profit.\n    •    Article 158(3): Governor is entitled to the use of his/her official residence (Raj Bhavan) without payment\n         of rent.\n    •    Article 158(3A): Where the same person is appointed Governor of two or more States, the salary and\n         allowances are allocated among the States in the proportion determined by the President. This was added\n         through 7 th Amendment Act,1956.\n    •    Article 158(4): Salary, allowances and privileges cannot be diminished during the Governor’s term of\n         office.\n\nOath of Governor – Article 159\n\n    •    Before entering office, the Governor takes an oath or affirmation.\n    •    It is administered by the Chief Justice of the concerned High Court.\n\n\n\n    •    In the absence of the Chief Justice, it is administered by the senior-most available Judge of that High Court.\n    •    The Governor promises to preserve, protect and defend the Constitution and the law and to devote\n         himself/herself to the service and well-being of the people."}, {"id": 159, "topic": "Governor & State Executive", "question": "Which of the following correctly describes Article 160 of the Indian Constitution?", "options": {"A": "It deals with the appointment of the Governor.", "B": "It deals with the discharge of the Governor’s functions in certain contingencies.", "C": "It deals with the Governor’s oath.", "D": "It deals with the Governor’s removal."}, "answer": "B", "explanation": "specifically provided for in the Constitution.\n\n    •    The President may make such provision as he thinks fit.\n    •    This provision is used for an unusual or special situation where the Constitution has not specifically stated\n         who should perform the Governor’s functions."}, {"id": 160, "topic": "Governor & State Executive", "question": "Which of the following Supreme Court cases held that the Governor does not have a guaranteed tenure of five\nyears and can be removed by the President under the pleasure doctrine?", "options": {"A": "S.R. Bommai v. Union of India", "B": "Shamsher Singh v. State of Punjab", "C": "Surya Narain Choudhary v. Union of India", "D": "Rameshwar Prasad v. Union of India"}, "answer": "C", "explanation": "Under Article 156(1), the Governor holds office during the pleasure of the President.\n\nAlthough Article 156(3) provides a normal term of 5 years, it does not guarantee that the Governor will remain in\noffice for the full five years.\n\nTherefore, the President can remove the Governor before completion of five years\n\n    •    Issue: Rajasthan Governor Raghukul Tilak was removed before completing his 5-year term.\n    •    The petitioner argued that the Governor should be allowed to complete the 5-year term under Article\n         156(3).\n    •    The Court held that the Governor holds office during the pleasure of the President under Article 156(1).\n    •    Therefore, the 5-year term is not an absolute guarantee; the Governor can be removed before completing\n         five years."}, {"id": 161, "topic": "Governor & State Executive", "question": "Which of the following statements regarding the judicial powers and functions of the Governor is/are correct?\n\n    1.   The Governor has the power to grant pardon, reprieve, respite, remission or commutation of punishment\n         under Article 161.\n    2.   The Governor can exercise this power in cases relating to matters within the State’s executive power.\n    3.   The Governor appoints the judges of the High Court and can remove them from office.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "Pardoning Power – Article 161\n\nThe Governor can grant:\n\n    •    Pardon → Completely removes the punishment and conviction.\n    •    Reprieve → Gives a temporary stay of execution, especially in a death sentence.\n    •    Respite → Gives a lesser punishment because of special circumstances.\n    •    Remission → Reduces the period of punishment without changing its nature.\n    •    Commutation → Changes a heavier punishment into a lighter one.\n\nNote: The Governor can exercise this power for offences relating to matters within the State’s executive power.\n\nImp: The Governor cannot pardon a death sentence, but can suspend, remit or commute a death sentence.\n\nOther Judicial Functions\n\n    •    Article 161: Governor’s main judicial power is the pardoning power.\n    •    Article 233: Governor appoints District Judges in consultation with the High Court.\n    •    Article 234: Governor makes appointments of persons other than District Judges to the State Judicial\n         Service, according to rules made after consultation with the State Public Service Commission and High\n         Court.\n    •    Article 229: The Governor has a role in certain matters relating to the High Court staff, as provided by the\n         Constitution.\n\nNote\n\n    •    Governor does NOT appoint High Court Judges.\n    •    High Court Judges are appointed by the President under Article 217."}, {"id": 162, "topic": "Governor & State Executive", "question": "Consider the following statements regarding the discretionary powers of the Governor:\n\n    1.   The Governor can reserve a Bill passed by the State Legislature for the consideration of the President.\n    2.   The Governor can recommend President’s Rule when he is satisfied that the government of the State cannot\n         be carried on according to the Constitution.\n\n\n\n    3.   The Governor has complete discretion in all matters and need not follow the advice of the Council of\n         Ministers.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "The Governor normally acts on the aid and advice of the Council of Ministers, but the Constitution gives him certain\ndiscretionary powers.\n\nConstitutional Discretion\n\n    •    Appointment of Chief Minister:When no party has a clear majority in the Legislative Assembly, the\n         Governor can use discretion in choosing a person who is most likely to command majority support.\n    •    Reservation of Bills – Article 200:The Governor can reserve certain Bills for the consideration of the\n         President.Money Bill cannot be reserved by the Governor.\n    •    President’s Rule – Article 356:If the Governor feels that the State Government cannot function according to\n         the Constitution, he can send a report to the President recommending President’s Rule.\n\nDiscretion under Constitutional Situations\n\n    •    Article 239(2): Governor of a State may be appointed as Administrator of an adjoining Union Territory and\n         may perform functions as Administrator independently of the Council of Ministers.\n    •    Article 371 gives the Governors of Maharashtra and Gujarat a special responsibility for the development of\n         certain regions of these States. The Governor ensures the establishment of separate Development Boards\n         and fair allocation of funds and development opportunities among different regions.\n\nThis is a special constitutional responsibility, not unlimited discretionary power."}, {"id": 163, "topic": "Governor & State Executive", "question": "Which of the following is a financial power of the Governor?", "options": {"A": "The Governor can introduce the Union Budget in Parliament.", "B": "The Governor causes the State Budget to be laid before the State Legislature.", "C": "The Governor can impose taxes without approval of the State Legislature.", "D": "The Governor can withdraw money from the Consolidated Fund without legislative authorization."}, "answer": "B", "explanation": "•    Article 202: Annual Financial Statement (State Budget) to be laid before the State Legislature by the\n         Governor.\n\n\n\n    •   Article 207: A Money Bill can be introduced in the State Legislature only with the Governor’s prior\n        recommendation.\n    •   Article 203: Demands for grants can be made only on the Governor’s recommendation.\n    •   Article 205: The Governor causes supplementary, additional or excess grants to be presented before the\n        State Legislature.\n    •   Article 204: Governor can make advances from the Consolidated Fund of the State to meet any unforeseen\n        expenditure only after legislative authorization."}, {"id": 164, "topic": "Governor & State Executive", "question": "Which of the following is an executive power of the Governor?", "options": {"A": "The Governor appoints the Chief Minister and other Ministers of the State.", "B": "The Governor can make laws on all subjects in the State List without the Legislature.", "C": "The Governor appoints the President of India.", "D": "The Governor directly controls the Parliament."}, "answer": "A", "explanation": "•   Article 154: The executive power of the State is vested in the Governor.\n    •   Article 164: Governor appoints the Chief Minister and appoints other Ministers on the advice of the Chief\n        Minister.\n    •   The Governor appoints the Advocate-General of the State under Article 165.\n    •   The Governor appoints the State Election Commissioner under Article 243K.\n    •   The Governor appoints the Chairman and members of the State Public Service Commission under Article\n        316.\n    •   The Governor acts as the Chancellor of State Universities only when the relevant State law provides so; this\n        is not a power given directly by the Constitution.\n    •   The Governor can seek information from the Chief Minister regarding the administration and legislative\n        proposals under Article 167.\n    •   The Governor can recommend President’s Rule by sending a report to the President under Article 356."}, {"id": 165, "topic": "Governor & State Executive", "question": "Which of the following is a legislative power of the Governor?", "options": {"A": "The Governor can dissolve the Lok Sabha.", "B": "The Governor can summon and prorogue the State Legislature.", "C": "The Governor can introduce Bills directly in Parliament.", "D": "The Governor can amend the Constitution independently."}, "answer": "B", "explanation": "•    Article 174: Governor can summon and prorogue the State Legislature and can dissolve the Legislative\n         Assembly.\n    •    Article 175: Governor can address the State Legislature and send messages to it.\n    •    Article 176: Governor gives a special address at the first session after every general election and at the\n         beginning of each year’s first session.\n    •    Article 200: Governor can give assent, withhold assent, return a Bill for reconsideration, or reserve a Bill\n         for the President.\n    •    Article 201: When a Bill is reserved for the President, the Governor deals with it according to the\n         President’s decision.\n    •    Article 213: Governor can issue an Ordinance when the State Legislature is not in session.\n    •    Article 333: The Governor’s power to nominate an Anglo-Indian member to the State Legislative\n         Assembly was abolished by the 104th Amendment Act, 2019.\n    •    Article 192: Governor decides questions regarding the disqualification of State Legislature members, after\n         obtaining the Election Commission’s opinion.\n    •    Governor lays the reports of State finance commission, SPSC, CAG general relating to the accounts of the\n         state before the state legislature\n    •    Nominates one sixth of the members of the state legislative council from amongst persons having special\n         knowledge or practical experience in literature,science,art,cooperative movement & social service.\n    •    He can appoint any member of state legislature Assembly /council when speaker and deputy speaker&\n         chairman and deputy chairman fall vacant to President over its proceedings."}, {"id": 166, "topic": "Governor & State Executive", "question": "Which Article of the Indian Constitution gives the Governor the power to promulgate Ordinances?", "options": {"A": "Article 200", "B": "Article 210", "C": "Article 213", "D": "Article 215"}, "answer": "C", "explanation": "•    The Governor must be satisfied that immediate action is necessary.\n    •    If the State has a Legislative Council, both Houses must not be in session for the Governor to exercise this\n         power.\n    •    An Ordinance has the same force and effect as a law passed by the State Legislature.\n    •    It must be placed before the State Legislature when it reassembles.\n    •    It will cease to operate 6 weeks after the reassembly of the Legislature, unless it is approved earlier.\n    •    The Governor can withdraw the Ordinance at any time."}, {"id": 167, "topic": "Governor & State Executive", "question": "Consider the following statements regarding Article 163:\n\n    1.   Article 163(1) provides for a Council of Ministers headed by the Chief Minister to aid and advise the\n         Governor, except where the Constitution requires the Governor to exercise discretion.\n\n\n\n    2.   Article 163(2) provides that if a question arises whether a matter is within the Governor’s discretion, the\n         Governor’s decision is final.\n    3.   Article 163(3) states that the advice given by Ministers to the Governor cannot be inquired into in any\n         court.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 163(1) – Aid & Advice\n\n    •    There shall be a Council of Ministers headed by the Chief Minister to aid and advise the Governor.\n    •    Exception: Where the Constitution requires the Governor to act in his discretion.\n\nArticle 163(2) – Governor’s Discretion\n\n    •    If there is a question whether a matter is within the Governor’s discretionary power, the Governor’s\n         decision is final.\n    •    The validity of anything done by the Governor cannot be challenged merely on the ground that he should or\n         should not have acted in his discretion.\n\nArticle 163(3) – Advice of Ministers\n\n    •    The advice given by Ministers to the Governor cannot be inquired into in any court."}, {"id": 168, "topic": "Governor & State Executive", "question": "Consider the following statements regarding Article 164 of the Indian Constitution:\n\n    1.   The Chief Minister is appointed by the Governor, and the other Ministers are appointed by the Governor on\n         the advice of the Chief Minister.\n    2.   The Council of Ministers is collectively responsible to the Legislative Assembly of the State.\n    3.   A Minister who is not a member of the State Legislature for six consecutive months ceases to be a Minister.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 164(1) – Appointment\n\n    •    Governor appoints the Chief Minister.\n    •    Other Ministers are appointed by the Governor on the advice of the Chief Minister.\n    •    Ministers hold office during the pleasure of the Governor.\n\nArticle 164(2) – Collective Responsibility\n\nThe Council of Ministers is collectively responsible to the Legislative Assembly of the State.\n\nArticle 164(4) – Six-Month Rule\n\n    •    A person who is not a member of the State Legislature can become a Minister.\n    •    But they must become a member of the State Legislature within 6 consecutive months.\n    •    If they fail to become a member within six months, they cease to be a Minister.\n\nArticle 164(1A) – Size of Council of Ministers\n\n    •    Total number of Ministers, including the Chief Minister, cannot exceed 15% of the total strength of the\n         Legislative Assembly.\n    •    However, the number of Ministers, including the CM, cannot be less than 12."}, {"id": 169, "topic": "Governor & State Executive", "question": "Consider the following statements regarding the powers and functions of the Chief Minister:\n\n    1.   The Chief Minister plays a key role in the formation, allocation of portfolios and functioning of the Council\n         of Ministers.\n    2.   The Chief Minister acts as the principal channel of communication between the Governor and the Council\n         of Ministers.\n    3.   The Chief Minister plays an important role in the State Legislature and advises the Governor on matters\n         such as summoning, prorogation and dissolution of the Legislative Assembly.\n    4.   The Chief Minister coordinates the administration of different departments and advises the Governor on\n         important matters concerning the State Government.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Relation with Council of Ministers\n\n    •    Head of the Council of Ministers – CM leads the State Council of Ministers.\n    •    Formation of Ministry – CM recommends to the Governor the persons to be appointed as other Ministers.\n    •    Allocation of portfolios –CM allocates and reshuffles departments among Ministers.\n    •    Removal of Ministers– CM can ask a Minister to resign or advise the Governor to remove the Minister.\n\n\n\n    •      Coordination– CM coordinates the work of different Ministers and departments.\n    •      Cabinet meetings– CM presides over Cabinet meetings and guides government policy.\n    •      Collective responsibility – CM ensures that the Council of Ministers works as a team and remains\n           collectively responsible to the Legislative Assembly.\n\nRelation with Governor – Article 167\n\nThe CM is the main link between the Governor and the Council of Ministers.\n\n    •      Communicates to the Governor all decisions of the Council of Ministers relating to administration and\n           legislative proposals.\n    •      Furnishes whatever information regarding administration and legislative proposals the Governor may call\n           for.\n    •      If the Governor asks, the CM places before the Council of Ministers any matter decided by an individual\n           Minister which has not been considered by the Council.\n\nAdvises the Governor on important matters relating to the State administration.\n\nThe CM also keeps the Governor informed about the functioning of the State Government.\n\nRelation with State Legislature\n\n    •      CM is generally the leader of the majority party/coalition in the Legislative Assembly.\n    •      Leads the government in the Legislature.\n    •      Helps in getting Government Bills, policies and programmes approved.\n    •      Maintains the confidence of the Legislative Assembly.\n    •      Advises the Governor regarding summoning and proroguing the State Legislature.\n    •      May advise the Governor regarding dissolution of the Legislative Assembly.\n    •      Coordinates with the Ministers for answering questions, debates and legislative business.\n\nOther Powers and Functions\n\n    •       Coordinates different departments and resolves differences between Ministers.\n    •      The Chief Minister generally acts as the Chairman of the State Planning Board.\n    •       The Chief Minister acts as Vice-Chairman of the concerned Zonal Council by rotation, for one year at a\n           time.\n    •       The Chief Minister is a member of the Inter-State Council and the Governing Council of NITI Aayog, both\n           headed by the Prime Minister.\n    •      The Chief Minister acts as the chief spokesperson of the State Government.\n    •      The Chief Minister acts as the chief political-level crisis manager during emergencies and major crises."}, {"id": 170, "topic": "Governor & State Executive", "question": "Which of the following pairs is/are correctly matched?\n\n1.Article 166 – Conduct of business of the State Government\n\n2.Article 167 – Duties of Chief Minister towards the Governor\n\n3.Article 177 – Rights of Ministers and Advocate-General in the State Legislature", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    All executive actions of the State Government are taken in the name of the Governor.\n    •    Governor makes rules for the convenient transaction of government business.\n    •    These rules also provide for allocation of business among Ministers.\n\nArticle 167 – Duties of Chief Minister\n\n    •    CM communicates the decisions of the Council of Ministers to the Governor.\n    •    CM provides information about State administration and legislative proposals when the Governor asks.\n    •    CM places before the Council any matter decided by an individual Minister if the Governor requires it.\n\nArticle 177 – Rights of Ministers and Advocate-General\n\n    •    Every Minister and the Advocate-General of the State has the right to speak and take part in the\n         proceedings of either House of the State Legislature.\n    •    They can also participate in the proceedings of any committee of the Legislature of which they are named\n         as a member.\n    •    They do not have a right to vote merely by virtue of Article 177."}, {"id": 171, "topic": "Governor & State Executive", "question": "Which of the following States are required to have a Minister in charge of Tribal Welfare under Article\n164(1)?", "options": {"A": "Odisha, Jharkhand, Chhattisgarh and Madhya Pradesh", "B": "Odisha, Bihar, Jharkhand and Gujarat", "C": "Madhya Pradesh, Rajasthan, Odisha and Maharashtra", "D": "Chhattisgarh, Telangana, Jharkhand and Odisha"}, "answer": "A", "explanation": "Madhya Pradesh & Odisha\n\n    •    This Minister may also be given charge of the welfare of Scheduled Castes and Backward Classes.\n    •    This is a special constitutional provision for these States.\n    •    The Tribal Welfare Minister is not separately elected. Like other Ministers, the person is appointed by the\n         Governor on the advice of the Chief Minister."}, {"id": 172, "topic": "Inter-State Relations", "question": "Which Article of the Indian Constitution provides for “Full Faith and Credit” to public acts, records and\njudicial proceedings throughout the territory of India?", "options": {"A": "Article 260", "B": "Article 261", "C": "Article 262", "D": "Article 263"}, "answer": "B", "explanation": "judicial proceedings of the Union and every State.\n\n    •    Final civil court judgments and orders can be executed anywhere in India according to law.\n    •    Parliament can make laws regarding the proof and effect of such acts, records and proceedings."}, {"id": 173, "topic": "Inter-State Relations", "question": "Consider the following statements:\n\n1.Article 262 empowers Parliament to set up tribunals for river disputes.\n\n2.The Supreme Court has appellate jurisdiction in such disputes.\n\nWhich of the above is/are correct?", "options": {"A": "Only 1", "B": "Only 2", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "A", "explanation": "•    Article 262(1) gives Parliament the power to make laws for settling disputes about the use, distribution, or\n         control of water in inter-State rivers and river valleys.\n    •    Article 262(2)It also allows Parliament to exclude the jurisdiction of the Supreme Court and other courts in\n         such matters (Article 262(2)).\n\nNote: Under this provision, Parliament enacted2 laws\n\n1.The River Boards acts 1956: Establishment of river boards for the regulation and development of inter state river\nand river valleys.\n\n2. The Inter-State River Water Disputes Act, 1956, which provides for the formation of tribunals to resolve these\ndisputes ."}, {"id": 174, "topic": "Inter-State Relations", "question": "Which Article enables the President to establish an Inter-State Council?", "options": {"A": "Article 263", "B": "Article 264", "C": "Article 312", "D": "Article 262"}, "answer": "A", "explanation": "discussing common interests, coordinating policies, and advising on inter-state disputes. It serves as a consultative\nand advisory body in matters affecting Centre–State and inter-State relations"}, {"id": 175, "topic": "Inter-State Relations", "question": "Consider the following statements:\n\n1.Interstate Council was established in 1990 the recommendations of Sarkaria Commission.\n\n2.It is a constitutional body under article 263\n\n3.It has powers to enforce compliance among states\n\nWhich of the above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1,2 and 3"}, "answer": "A", "explanation": "body under Article 263 of the Indian Constitution.\n\n    •    It aims to promote coordination and cooperation between the Union and the States.\n    •    The Council discusses and advises on inter-governmental issues but has no power to enforce its decisions.\n    •    Its recommendations are advisory in nature and not legally binding on the States\n    •    Its composition includes the Prime Minister as Chairman, Chief Ministers of all States and Union\n         Territories with legislative assemblies , Administrators/LG of other Union Territories not having legislative\n         assemblies,Governors of states under President’s rule, and six Union Cabinet Ministers nominated by the\n         Prime Minister.\n    •    No fixed term prescribed for Inter-State Council members"}, {"id": 176, "topic": "Inter-State Relations", "question": "What is meant by Inter-State Trade and Commerce?", "options": {"A": "Trade and movement of goods and services between different States", "B": "Trade carried out only within the boundaries of one State", "C": "Trade carried out only between India and foreign countries", "D": "Trade controlled only by the State Legislature"}, "answer": "A", "explanation": "one State to another State.\n\n    •    It is mainly covered under Part XIII of the Constitution.\n    •    Articles 301–307 deal with Trade, Commerce and Intercourse within the territory of India.\n    •    Article 301 → Freedom of trade, commerce and intercourse.\n    •    Articles 302–305 → Restrictions and exceptions to this freedom.\n    •    Article 306 → Repealed\n    •    Article 307 →Appointment of Authority for carrying out the purposes of Articles 301–304."}, {"id": 177, "topic": "Inter-State Relations", "question": "Which Article of the Indian Constitution provides that trade, commerce and intercourse throughout the\nterritory of India shall be free?", "options": {"A": "Article 300", "B": "Article 301", "C": "Article 302", "D": "Article 304"}, "answer": "B", "explanation": "•    It aims to ensure the free flow of trade and commerce across States.\n    •    However, this freedom is not absolute.\n    •    It is subject to the restrictions provided under Articles 302–305."}, {"id": 178, "topic": "Inter-State Relations", "question": "Consider the following statements regarding Articles 302 to 305 of the Indian Constitution:\n\n1.Article 302 empowers Parliament to impose restrictions on trade, commerce and intercourse in the public interest.\n\n2.Article 303 generally prohibits Parliament and State Legislatures from giving preference to one State over another\nor discriminating between States.\n\n3.Article 304 allows States to impose certain taxes and reasonable restrictions on trade, commerce and intercourse,\nsubject to constitutional conditions.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 302 – Parliament’s Power\n\n    •    Parliament can impose restrictions on trade, commerce and intercourse between or within States.\n    •    Such restrictions must be in the public interest.\n    •    This is an exception to the freedom guaranteed under Article 301.\n\nArticle 303 – No Discrimination\n\n    •    Article 303(1):Neither Parliament nor a State Legislature can make a law that gives preference to one State\n         over another or discriminates between States in matters of trade and commerce.\n    •    Article 303(2):Exception: Parliament can make such a law if it is necessary to deal with a situation arising\n         from scarcity of goods in any part of India.\n\nArticle 304 – Restrictions by States\n\n    •    Article 304(a):A State Legislature can impose a tax on goods imported from other States or Union\n         Territories.But the tax must not discriminate against goods imported from other States/UTs compared with\n         similar goods produced in that State.\n    •    Article 304(b):A State Legislature can impose reasonable restrictions on trade, commerce and intercourse\n         with or within that State.Such restrictions must be in the public interest.A Bill for this purpose requires the\n         previous sanction of the President before introduction in the State Legislature.\n\nArticle 305 – Saving of Existing Laws & State Monopolies\n\n    •    Protects existing laws and laws providing for State monopolies in trade, commerce, industry or services.\n    •    Such laws are protected from being invalid merely because they are inconsistent with Article 301."}, {"id": 179, "topic": "Inter-State Relations", "question": "Which Article of the Indian Constitution provides for the appointment of an authority to carry out the\npurposes of Articles 301 to 304?", "options": {"A": "Article 305", "B": "Article 306", "C": "Article 307", "D": "Article 308"}, "answer": "C", "explanation": "and 304.\n\n    •    Parliament can also determine the powers and functions of such authority through law."}, {"id": 180, "topic": "Inter-State Relations", "question": "Fill in the blanks:Zonal Councils were created by the __________.", "options": {"A": "States Reorganisation Act, 1956", "B": "Finance Commission", "C": "Panchayati Raj Act", "D": "Representation of People Act"}, "answer": "A", "explanation": "discuss common regional issues.They are not Constitutional bodies.Created under the States Reorganisation Act,\n1956.\n\n    •   The idea for these Councils was proposed by Prime Minister Jawaharlal Nehru in 1956 during the\n        reorganization of states.\n\nThere are 5 Zonal Councils.\n\n    •   Northern Zonal Council\n    •   Central Zonal Council\n    •   Eastern Zonal Council\n    •   Western Zonal Council\n    •   Southern Zonal Council\n\nImportant: The North Eastern Council (NEC) is not one of these five Zonal Councils. It is a separate statutory body\ncreated under the North Eastern Council Act, 1971."}, {"id": 181, "topic": "Inter-State Relations", "question": "Fill in the blanks:The Union Home Minister chairs a Zonal Council meeting as ____ chairman.", "options": {"A": "ex-officio", "B": "rotating", "C": "ceremonial", "D": "honorary"}, "answer": "A", "explanation": "•   Union Home Minister – ex-officio Chairman of all Zonal Councils.\n    •   Vice-Chairman – Chief Minister of one of the States in that zone, by rotation for one year.\n\nMembers\n\nThe main members include:\n\n    •   Chief Ministers of the States in the zone.\n    •   Two Ministers from each State, nominated by the Governor.\n    •   One representative from each Union Territory included in the zone.\n\nThe Union Home Minister is the common Chairman."}, {"id": 182, "topic": "Inter-State Relations", "question": "Which of the following are the main objectives/functions of Zonal Councils?\n\n1.To promote cooperation and coordination among the States of the zone.\n\n\n\n2.To discuss and resolve common problems affecting the States in the zone.\n\n3.To promote balanced economic and social development in the region.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•   Cooperation and Coordination – Promote cooperation and coordination among the States.\n    •   Common Problems – Discuss issues and problems common to two or more States.\n    •   Economic and Social Development – Promote balanced economic and social development in the region.\n    •   Inter-State Issues – Discuss issues such as border disputes, linguistic minorities and inter-State transport.\n    •   Regional Planning – Encourage coordination in development programmes and policies."}, {"id": 183, "topic": "Constitutional Amendments", "question": "Which of the following was a major feature of the 1st Constitutional Amendment Act, 1951?", "options": {"A": "It introduced the Anti-Defection Law.", "B": "It reduced the voting age from 21 to 18 years.", "C": "It added Articles 31A and 31B and introduced the Ninth Schedule.", "D": "It introduced the GST system."}, "answer": "C", "explanation": "Major Provisions\n\nArticle 15(4) – Backward Classes\n\n    •   Added Article 15(4).\n\n    •   Enabled the State to make special provisions for the advancement of socially and educationally\n\n        backward classes, SCs and STs.\n\n    •   It was introduced following the State of Madras v. Champakam Dorairajan (1951) judgment.\n\n\n\nArticle 19 – Reasonable Restrictions\n\n    •   Expanded the grounds on which reasonable restrictions could be imposed on freedom of speech and\n\n        expression.\n\n    •   Added public order, friendly relations with foreign States and incitement to an offence as grounds.\n\nArticle 31 – Land Reforms\n\n    •   Protected certain land reform and zamindari abolition laws from being challenged on Fundamental\n\n        Rights grounds.\n\nArticles 31A & 31B\n\n    •   Article 31A → Protected laws relating mainly to acquisition of estates and certain related rights.\n\n    •   Article 31B → Protected laws placed in the Ninth Schedule from being invalidated on the ground of\n\n        violation of specified Fundamental Rights.\n\nNinth Schedule\n\n    •   The Ninth Schedule was added to the Constitution.Initially, 13 laws were placed in it, mainly relating to\n\n        land reforms."}, {"id": 184, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment abolished the classification of States into Part A, Part B, Part C and Part D?", "options": {"A": "7th Amendment Act, 1956", "B": "15th Amendment Act, 1963", "C": "24th Amendment Act, 1971", "D": "42nd Amendment Act, 1976"}, "answer": "A", "explanation": "Major Provisions\n\n    •   Implemented the recommendations of the States Reorganisation Commission.\n    •   Abolished the old classification of States into Part A, Part B, Part C and Part D.\n    •   Introduced a new classification of States and Union Territories.\n    •   14 States and 6 Union Territories were created/reorganised under the new arrangement.\n\n\n\n    •   Provided for the establishment of High Courts and changes in their jurisdiction in connection with the\n        reorganisation of States.\n    •   Made provisions for common High Courts for two or more States/States and UTs.\n    •   Article 1 and the First Schedule were amended to reflect the new territorial organisation.\n    •   Introduced changes relating to appointment and jurisdiction of High Courts.\n    •   Article 350A was inserted, providing for facilities for instruction in the mother tongue at the primary stage\n        for children belonging to linguistic minority groups.\n    •   Article 350B was inserted, providing for a Special Officer for Linguistic Minorities."}, {"id": 185, "topic": "Constitutional Amendments", "question": "Which of the following was provided by the 15th Constitutional Amendment Act, 1963?", "options": {"A": "Retirement age of High Court judges was increased from 60 to 62 years.", "B": "Voting age was reduced from 21 to 18 years.", "C": "Right to Property was removed from Fundamental Rights.", "D": "Anti-Defection Law was introduced."}, "answer": "A", "explanation": "The 15th Constitutional Amendment Act, 1963 mainly dealt with the High Courts, judges, and retirement age.\n\nMajor Provisions\n\n    •   Article 217: Increased the retirement age of High Court judges from 60 to 62 years.\n    •   Article 222: Made provisions relating to the transfer of High Court judges.\n    •   Article 224: Provided for the appointment of additional and acting judges of High Courts.\n    •   Article 224A: Enabled the Chief Justice of a High Court, with the President’s prior consent, to request a\n        retired High Court judge to sit and act as a judge of that High Court.\n    •   Article 226: Expanded the writ jurisdiction of High Courts.\n    •   Article 297: Made changes relating to territorial waters and resources.\n    •   Article 311: Modified provisions relating to dismissal, removal and reduction in rank of government\n        servants."}, {"id": 186, "topic": "Constitutional Amendments", "question": "A Constitutional Amendment declared that Article 13 would not apply to constitutional amendments and\nmade the President’s assent mandatory to a Constitution Amendment Bill duly passed by Parliament. Which\nAmendment was this?", "options": {"A": "25th Amendment Act, 1971", "B": "38th Amendment Act, 1975", "C": "24th Amendment Act, 1971", "D": "42nd Amendment Act, 1976"}, "answer": "C", "explanation": "The 24th Constitutional Amendment Act, 1971 was passed mainly to affirm Parliament’s power to amend any part of\nthe Constitution, including Fundamental Rights.\n\nMajor Provisions\n\n    •    Article 13: Added Article 13(4), stating that Article 13 shall not apply to constitutional amendments made\n         under Article 368.\n    •    Article 368: Parliament’s power to amend the Constitution was expressly recognised.\n    •    Parliament can amend any provision of the Constitution, including Fundamental Rights.\n    •    The President must give assent to a Constitution Amendment Bill duly passed under Article 368.\n    •    The President no longer has discretion to withhold assent to such an amendment.\n    •    The amendment strengthened Parliament’s position after the Golaknath case (1967), where the Supreme\n         Court had held that Parliament could not amend Fundamental Rights."}, {"id": 187, "topic": "Constitutional Amendments", "question": "A Constitutional Amendment inserted Article 31C to protect laws implementing Article 39(b) and 39(c) from\nchallenges under certain Fundamental Rights. Which Amendment was this?", "options": {"A": "24th Amendment Act, 1971", "B": "25th Amendment Act, 1971", "C": "42nd Amendment Act, 1976", "D": "44th Amendment Act, 1978"}, "answer": "B", "explanation": "Main Purpose\n\nThe 25th Amendment was mainly aimed at giving priority to certain Directive Principles of State Policy (DPSPs)\nover certain Fundamental Rights.\n\nArticle 31C – Inserted\n\n    •    The Amendment inserted Article 31C.\n    •    It provided protection to laws made to implement Article 39(b) and Article 39(c).\n\nOriginally, such laws were protected from challenge under:\n\n    •    Article 14 → Right to Equality\n    •    Article 19 → Six freedoms\n    •    Article 31 → Right to Property\n    1.   Article 39(b):Objective: Distribution of the material resources of the community to serve the common\n         good.\n    2.   Article 39(c):Objective: Prevent concentration of wealth and means of production to the common\n         detriment.\n\nImportant: Article 39(b) and 39(c) were not added by the 25th Amendment. They were already part of the\nConstitution. The 25th Amendment inserted Article 31C to protect laws implementing them.\n\n\n\nKesavananda Bharati Case, 1973\n\nThe Supreme Court:\n\n    •   Allowed Article 31C protection for laws implementing Article 39(b) and 39(c).\n    •   Did not allow Parliament to completely exclude judicial review"}, {"id": 188, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment Act, 1975 made the President’s satisfaction regarding the proclamation of a\nNational Emergency final and conclusive, thereby excluding judicial review?", "options": {"A": "42nd Constitutional Amendment Act, 1976", "B": "44th Constitutional Amendment Act, 1978", "C": "38th Constitutional Amendment Act, 1975", "D": "24th Constitutional Amendment Act, 1971"}, "answer": "C", "explanation": "The 38th Constitutional Amendment Act, 1975 was mainly related to the Emergency provisions and the\nPresident/Governor’s satisfaction.\n\nMajor Provisions\n\n    •   Made the President’s satisfaction in issuing certain proclamations, including National Emergency under\n        Article 352, final and conclusive.Such satisfaction was made immune from judicial review.\n    •   Similarly, the Governor’s satisfaction in issuing certain orders under Article 356 (President’s Rule) was\n        also given protection from judicial review.\n    •   It also made the ordinance-making satisfaction of the President and Governor final and conclusive in\n        specified contexts.\n    •   These provisions significantly reduced the scope for judicial scrutiny during the Emergency period.\n\nLater Change\n\n    •   The 44th Constitutional Amendment Act, 1978 removed the protection that made the President’s\n        satisfaction under Article 352 final and conclusive."}, {"id": 189, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment Act is popularly known as the “Mini-Constitution” because it made\nextensive changes to the Indian Constitution?", "options": {"A": "44th Constitutional Amendment Act, 1978", "B": "42nd Constitutional Amendment Act, 1976", "C": "52nd Constitutional Amendment Act, 1985", "D": "73rd Constitutional Amendment Act, 1992"}, "answer": "B", "explanation": "The 42nd Constitutional Amendment Act, 1976 is popularly known as the “Mini-Constitution” because it made\nextensive changes to the Constitution.\n\nMajor Provisions\n\n    •   Added “Socialist”, “Secular” and “Integrity” to the Preamble.\n    •   Changed “unity of the Nation” to “unity and integrity of the Nation”.\n    •   Added Fundamental Duties under Article 51A.\n    •   Added 10 Fundamental Duties originally.\n    •   Added new Directive Principle\n            o under Article 39A → Equal justice and free legal aid.\n            o Added Artic
