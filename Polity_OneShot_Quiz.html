ng if the Speaker is absent.\n\nResignation – Article 94\n\nDeputy Speaker can resign by writing to the Speaker.\n\nRemoval – Article 94\n\nThe Deputy Speaker can be removed by:\n\n    •    A resolution of Lok Sabha.\n    •    Majority of all the then members of the House → Effective Majority.\n    •    At least 14 days’ notice is required.\n\nDuring Removal Resolution\n\n    •    Deputy Speaker cannot preside over the sitting when a resolution for his/her removal is under\n         consideration.\n    •    Can participate in the proceedings.\n    •    Can vote in the first instance.\n    •    Cannot exercise a casting vote in this situation.\n\n\n\nVacation of Office\n\nThe office becomes vacant when:\n\n    •    Deputy Speaker ceases to be a member of Lok Sabha.\n    •    Deputy Speaker resigns.\n    •    Deputy Speaker is removed by Lok Sabha.\n\nImportant Difference from Speaker\n\n    •    Unlike the Speaker, the Deputy Speaker does not continue in office after the dissolution of Lok Sabha.\n         His/her office normally ends when the Lok Sabha is dissolved."}, {"id": 275, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Panel of Chairpersons of the Lok Sabha?", "options": {"A": "The President nominates four members to act as Chairpersons of Lok Sabha.", "B": "The Speaker nominates not more than ten members from among the members of Lok Sabha to act as\nChairpersons when the Speaker and Deputy Speaker are absent.", "C": "The Deputy Speaker permanently heads the Panel of Chairpersons.", "D": "Members of the Panel can preside over the House even after the dissolution of Lok Sabha."}, "answer": "B", "explanation": "•    Under Rule 10 of the Rules of Procedure and Conduct of Business in Lok Sabha, the Speaker nominates\n         not more than ten members to the Panel of Chairpersons.\n\nAny member of the Panel can preside over the sitting of Lok Sabha when:\n\n    •    Speaker is absent, and\n    •    Deputy Speaker is also absent.\n    •    The Panel member has the same powers as the Speaker while presiding over the sitting.\n    •    A member of the Panel cannot preside if the office of Speaker and Deputy Speaker are vacant. In such a\n         situation, the President appoints a member to perform the Speaker’s duties under Article 95.\n    •    The Panel of Chairpersons ceases to exist when a new Lok Sabha is constituted."}, {"id": 276, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Speaker Pro Tem of Lok Sabha?", "options": {"A": "The Speaker Pro Tem is a permanent presiding officer elected for the full term of Lok Sabha.", "B": "The President appoints a member of the newly elected Lok Sabha as Speaker Pro Tem to perform specified duties\nuntil the election of the new Speaker.", "C": "The Speaker Pro Tem is elected by Rajya Sabha.", "D": "The Deputy Speaker automatically becomes Speaker Pro Tem after every general election."}, "answer": "B", "explanation": "may no longer be available to preside over the first sitting.\n\n    •    The President appoints a member of the newly elected Lok Sabha as Speaker Pro Tem.\n    •    Usually, a senior member is appointed for this temporary role.\n    •    The Speaker Pro Tem performs the functions necessary for the first sitting of the new Lok Sabha.\n\nImportant duties include:\n\n    •    Administering oath/affirmation to newly elected members.\n    •    Presiding over the election of the new Speaker.\n    •    Once the new Speaker is elected, the office of Speaker Pro Tem ends.\n    •    The Speaker Pro Tem is therefore a temporary arrangement, not a permanent constitutional office.\n\nNote: The Constitution does not specifically mention the term “Speaker Pro Tem”; it is a parliamentary\npractice/arrangement."}, {"id": 277, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Chairman of the Rajya Sabha?", "options": {"A": "The Vice-President of India is the ex-officio Chairman of Rajya Sabha; he presides over its proceedings but is not\na member of the House.", "B": "The Chairman is elected by Rajya Sabha from among its members and has a normal vote on every question.", "C": "The Chairman is appointed by the President and can be removed by a simple majority of Rajya Sabha.", "D": "The Chairman continues as Chairman even after ceasing to be Vice-President."}, "answer": "A", "explanation": "Position – Article 89\n\n    •    The Vice-President of India is the ex-officio Chairman of Rajya Sabha.\n    •    The Chairman is not a member of Rajya Sabha.\n    •    Therefore, unlike the Speaker of Lok Sabha, the Chairman does not come from among the members of the\n         House.\n\nMain Functions & Powers\n\n    •    Presides over the sittings of Rajya Sabha.\n    •    Maintains order and discipline.\n    •    Regulates the proceedings of the House.\n    •    Decides who may speak.\n    •    Interprets and applies the Rules of Procedure.\n    •    Has a casting vote in case of equality of votes.\n    •    Has important powers relating to Parliamentary Committees and procedural matters.\n\nVoting – Article 100\n\n    •    Chairman does not vote in the first instance.\n    •    If there is an equality of votes, he can exercise the casting vote.\n\n\n\nRemoval / End of Office\n\nThe Chairman is the Vice-President.\n\n    •    Therefore, his office as Chairman ends when:\n    •    He ceases to be Vice-President.\n    •    He resigns as Vice-President.\n    •    He is removed from the office of Vice-President according to Article 67.\n\nImportant: Rajya Sabha does not remove the Chairman separately like it removes the Deputy Chairman.\n\nWhen Chairman Cannot Preside – Article 91\n\n    •    If the Chairman’s office is vacant or the Vice-President is unable to perform the functions of Chairman:\n    •    Deputy Chairman → Performs the Chairman’s duties."}, {"id": 278, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Deputy Chairman of the Rajya Sabha?\n\n1. The Deputy Chairman is elected by the Rajya Sabha from among its members.\n\n2. The Deputy Chairman performs the functions of the Chairman when the Chairman’s office is vacant or when the\nChairman is unable to perform his functions.\n\n3. The Deputy Chairman may resign by writing to the Chairman and may be removed by a resolution of Rajya\nSabha passed by a majority of all the then members of the House after 14 days’ notice.\n\n4. The Deputy Chairman is appointed by the President and remains in office for a fixed term of six years.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "B", "explanation": "Deputy Chairman\n\nElection – Article 89\n\n    •    Rajya Sabha chooses one of its members as Deputy Chairman.\n    •    Therefore, the Deputy Chairman must be a member of Rajya Sabha.\n    •    He/she is not appointed by the President.\n\nRole & Functions – Article 91\n\nThe Deputy Chairman performs the functions of Chairman when:\n\n    •    The office of Chairman is vacant, or\n    •    The Vice-President is unable to perform the functions of Chairman.\n\n\n\n    •    While presiding over Rajya Sabha, the Deputy Chairman exercises the powers of the Chairman for that\n         sitting.\n\nResignation – Article 90\n\nDeputy Chairman may resign by writing to the Chairman.\n\nRemoval – Article 90\n\nThe Deputy Chairman can be removed by:\n\n    •    A resolution of Rajya Sabha.\n    •    Resolution must be passed by a majority of all the then members of the House → Effective Majority.\n    •    At least 14 days’ notice must be given.\n\nDuring Removal Resolution – Article 92\n\n    •    Deputy Chairman cannot preside over the sitting when the resolution for his/her removal is under\n         consideration.\n    •    Can participate in the proceedings.\n    •    Can vote in the first instance.\n    •    Cannot exercise a casting vote in this situation.\n\nVacation of Office\n\nDeputy Chairman’s office becomes vacant when:\n\n    •    He/she ceases to be a member of Rajya Sabha.\n    •    He/she resigns.\n    •    He/she is removed by Rajya Sabha."}, {"id": 279, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Panel of Vice-Chairpersons of the Rajya Sabha?", "options": {"A": "The President appoints the members of the Panel of Vice-Chairpersons.", "B": "The Chairman nominates not more than six members to the Panel of Vice-Chairpersons, who can preside over the\nRajya Sabha in the absence of the Chairman and Deputy Chairman.", "C": "The Deputy Chairman alone nominates all members of the Panel.", "D": "Panel members become permanent Deputy Chairman of Rajya Sabha."}, "answer": "B", "explanation": "•    Under Rule 8 of the Rules of Procedure and Conduct of Business in the Council of States, the Chairman\n         nominates not more than six members to the Panel of Vice-Chairpersons.\n\nAny member of this Panel can preside over a sitting of Rajya Sabha when:\n\n    • Chairman is absent, and\n    • Deputy Chairman is also absent.\n    v While presiding, the Panel member has the same powers as the Chairman.\n\n\n\n    v However, the Panel member cannot preside when the offices of both Chairman and Deputy Chairman are\n      vacant.\n    v In such a situation, the President makes provision for performing the Chairman’s functions under Article\n      91.\n    v The Panel is constituted from among the members of Rajya Sabha."}, {"id": 280, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the provision under Article 97 of the Constitution?", "options": {"A": "The President fixes the salaries and allowances of the Speaker and Chairman.", "B": "Parliament determines by law the salaries and allowances of the Speaker and Deputy Speaker of Lok Sabha, and\nthe Chairman and Deputy Chairman of Rajya Sabha.", "C": "The Election Commission determines the salaries of all presiding officers.", "D": "The salaries of all presiding officers are permanently fixed by the Constitution."}, "answer": "B", "explanation": "It covers four offices:\n\n    v    Speaker of Lok Sabha\n    v    Deputy Speaker of Lok Sabha\n    v    Chairman of Rajya Sabha\n    v    Deputy Chairman of Rajya Sabha\n\nTheir salaries and allowances are determined by Parliament by law.\n\nUntil Parliament makes a law for this purpose, they receive the salaries and allowances specified in the Second\nSchedule."}, {"id": 281, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the constitutional provisions regarding the Secretariat of\nParliament?", "options": {"A": "The Secretariat of Parliament is directly controlled by the President, and its officers are appointed by the Prime\nMinister.", "B": "The Parliament Secretariat is common to both Houses and is headed by the Speaker of Lok Sabha.", "C": "Each House of Parliament has a separate secretarial staff, and Parliament may regulate their recruitment and\nconditions of service by law.", "D": "The Election Commission appoints and controls the secretarial staff of both Houses."}, "answer": "C", "explanation": "Separate Secretariat\n\nEach House of Parliament has its own separate secretarial staff.\n\n\n\nTherefore:\n\n    v Lok Sabha → Lok Sabha Secretariat\n    v Rajya Sabha → Rajya Sabha Secretariat\n\nRecruitment & Service Conditions\n\nParliament may regulate by law:\n\n    v Recruitment\n    v Conditions of service of persons appointed to the secretarial staff of either House.\n\nUntil Parliament makes a law\n\n    v Until such a law is made, the President may make rules regarding recruitment and conditions of service.\n    v However, such rules relating to the secretarial staff of a House require consultation with the Speaker of Lok\n      Sabha or Chairman of Rajya Sabha, as applicable."}, {"id": 282, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Leaders of Parliament?", "options": {"A": "The Prime Minister is the Leader of the House in Lok Sabha, while the Minister of Parliamentary Affairs is\nalways the Leader of the House in Rajya Sabha.", "B": "The Speaker is the Leader of the House in Lok Sabha, while the Vice-President is the Leader of the House in\nRajya Sabha.", "C": "The Prime Minister is always the Leader of both Houses of Parliament.", "D": "The Leader of the House is the Prime Minister or another minister nominated by the Prime Minister in Lok\nSabha, and a minister nominated by the Prime Minister in Rajya Sabha; the Leader of the Opposition is the leader of\nthe largest opposition party recognised as such under the applicable rules."}, "answer": "D", "explanation": "Leader of the House – Lok Sabha\n\n    v The Prime Minister is normally the Leader of the House in Lok Sabha when he/she is a member of Lok\n      Sabha.\n    v If the Prime Minister is a member of Rajya Sabha, another minister who is a member of Lok Sabha may be\n      nominated as Leader of the House.\n\nThe Leader of the House has an important role in:\n\n    v Planning and arranging government business.\n    v Coordinating legislative work.\n    v Advising on the scheduling of important government business.\n\nLeader of the House – Rajya Sabha\n\n    v The Leader of the House is a minister who is a member of Rajya Sabha and is nominated by the Prime\n      Minister.\n    v The Leader of the House coordinates the Government’s business in Rajya Sabha.\n\n\n\nLeader of Opposition (LoP)\n\n    v The Leader of the Opposition is the leader of the largest opposition party recognised as such under the\n      rules.\n    v The party generally needs to have at least 10% of the total strength of the House for its leader to be\n      recognised as LoP under the relevant parliamentary convention/rules.\n\nThe LoP:\n\n    v Provides an alternative viewpoint to the Government.\n    v Scrutinises government policies and legislation.\n    v Plays an important role in parliamentary committees and certain statutory selection processes.\n\nWhips\n\n    v A Whip is a political party functionary who ensures party members attend the House and follow the party’s\n      position on important votes.\n    v The whip is not a constitutional office.\n    v Defying a party direction in circumstances covered by the Tenth Schedule can result in disqualification."}, {"id": 283, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the Whip in the Indian Parliament?", "options": {"A": "The Whip is a constitutional office created by the Constitution and appointed by the President.", "B": "The Whip is a party functionary who maintains party discipline, ensures the attendance of members and\ncommunicates the party’s position on important votes.", "C": "The Whip is the presiding officer of the House and decides whether a Bill is a Money Bill.", "D": "The Whip is appointed by the Election Commission to supervise voting in Parliament."}, "answer": "B", "explanation": "Main Functions of Whip\n\n    v Maintains Party Discipline\n    v Ensures that party members follow the party’s position on important matters.\n\nEnsures Attendance\n\n    v Instructs members to be present in the House when important business or voting is scheduled.\n\nVoting Direction\n\n    v Communicates the party’s instructions regarding voting on particular Bills, motions or resolutions.\n\nProvides Information\n\nKeeps party members informed about important parliamentary business and the party’s stand.\n\nThree-Line Whip\n\n\n\n    v A three-line whip is a particularly strong instruction requiring members to attend and vote according to the\n      party’s direction.\n    v Defying a valid party direction in circumstances covered by the Tenth Schedule can lead to\n      disqualification."}, {"id": 284, "topic": "Parliament: Composition", "question": "Consider the following statements regarding Articles 86, 87 and 88 of the Constitution:\n\n1. Under Article 86, the President may address either House of Parliament or both Houses assembled together and\nmay send messages to either House.\n\n2. Under Article 87, the President delivers a special address to both Houses assembled together at the\ncommencement of the first session after each general election and at the commencement of the first session of each\nyear.\n\n3. Under Article 88, every Minister and the Attorney-General of India has the right to speak and take part in the\nproceedings of either House, joint sittings and committees of Parliament of which he/she is named a member, but\ndoes not have the right to vote merely by virtue of this Article.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 86 – Right of President to Address & Send Messages\n\n    v    The President may address either House of Parliament.\n    v    The President may also address both Houses assembled together.\n    v    The President may send messages to either House regarding pending Bills or other matters.\n    v    The House concerned must consider the matter with due expedition.\n\nArticle 87 – Special Address by President\n\nThe President gives a special address to both Houses assembled together:\n\nFirst session after every general election\n\n    v At the beginning of the first session of the newly elected Lok Sabha.\n\nFirst session of each year\n\n    v At the beginning of the first session of every year.\n    v The President’s Address outlines the Government’s policies and programmes and the legislative agenda for\n      the session.\n\nArticle 88 – Rights of Ministers & Attorney-General\n\nEvery Minister and the Attorney-General of India has the right to:\n\n\n\n    v    Speak in either House of Parliament.\n    v    Take part in the proceedings of either House.\n    v    Participate in a joint sitting of both Houses.\n    v    Participate in a parliamentary committee of which he/she is named as a member.\n    v    But: They cannot vote merely by virtue of Article 88.\n\nNote\n\nA Minister who is not a member of either House can still participate in parliamentary proceedings under Article 88,\nbut must become a member of either House within 6 months of becoming a Minister, otherwise he/she ceases to be a\nMinister (Article 75(5))."}, {"id": 285, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the provisions of Article 85 of the Constitution?", "options": {"A": "The President summons and prorogues Parliament and can dissolve the Lok Sabha, subject to the constitutional\nrequirement regarding the maximum gap between two sessions.", "B": "The Speaker summons both Houses of Parliament and can dissolve the Rajya Sabha.", "C": "The Prime Minister directly summons Parliament and can prorogue either House without the President.", "D": "The President can dissolve both Lok Sabha and Rajya Sabha whenever required."}, "answer": "A", "explanation": "Summoning of Parliament\n\n    v The President summons each House of Parliament from time to time.\n    v The President can summon Parliament at a place and time considered appropriate.\n    v There cannot be a gap of more than six months between the last sitting of one session and the first sitting of\n      the next session.\n    v Therefore, Parliament must meet at least twice a year.\n\nProrogation\n\n    v The President can prorogue either House or both Houses.\n    v Prorogation = termination of a session, but it does not dissolve Lok Sabha.\n\nDissolution of Lok Sabha\n\n    v The President can dissolve Lok Sabha.\n    v Rajya Sabha cannot be dissolved because it is a permanent House."}, {"id": 286, "topic": "Parliamentary Procedures", "question": "Which of the following pairs is correctly matched?", "options": {"A": "Summoning — President; Adjournment — Presiding Officer; Adjournment Sine Die — Presiding Officer;\nProrogation — President", "B": "Summoning — Speaker; Adjournment — President; Adjournment Sine Die — President; Prorogation — Speaker", "C": "Summoning — President; Adjournment — President; Adjournment Sine Die — Council of Ministers;\nProrogation — Speaker", "D": "Summoning — Prime Minister; Adjournment — Presiding Officer; Adjournment Sine Die — President;\nDissolution — Rajya Sabha"}, "answer": "A", "explanation": "Summoning – Calling Parliament to Meet\n\n    •    Authority → President\n    •    Article 85\n    •    The President summons each House of Parliament.\n    •    There cannot be a gap of more than 6 months between the last sitting of one session and the first sitting of\n         the next session.\n    •    Hence, Parliament must meet at least twice a year.\n    •    Summoning does not mean starting a new Lok Sabha; it simply calls the Houses to meet for a session.\n\n.Adjournment – Temporary Suspension of a Sitting\n\n    •    Authority → Presiding Officer\n    •    It means ending/suspending a sitting for a specified period.\n    •    Example: The House is adjourned until 2 PM.\n    •    The session continues; only the particular sitting is suspended.\n    •    In Lok Sabha → Speaker/Deputy Speaker or person presiding.\n    •    In Rajya Sabha → Chairman/Deputy Chairman or person presiding.\n\nAdjournment Sine Die – No Date Fixed\n\n    •    Authority → Presiding Officer\n    •    Sine die means “without assigning a day”.\n    •    The House is adjourned without fixing a date for its next sitting.\n    •    It is different from ordinary adjournment because no specific date is announced for the next sitting.\n    •    However, the session is not formally terminated merely by adjournment sine die.\n    •    The President may subsequently prorogue the House.\n\nProrogation – Ending a Session\n\n    •    Authority → President\n    •    Article 85\n    •    Prorogation means termination of a session of Parliament.\n    •    The President can prorogue either House or both Houses.\n    •    The House itself does not cease to exist.\n    •    Membership continues.\n    •    Pending Bills generally do not lapse merely because of prorogation.\n\nDissolution – Ending the Life of Lok Sabha\n\n    •    Authority → President\n    •    Article 85\n\n\n\n    •    Dissolution means the end of the life of Lok Sabha.\n    •    It applies only to Lok Sabha.\n    •    Rajya Sabha is never dissolved because it is a permanent House.\n    •    After dissolution, a new Lok Sabha must be constituted through elections.\n    •    Dissolution has a greater effect than prorogation because it ends the House itself, not merely a session."}, {"id": 287, "topic": "Parliamentary Procedures", "question": "What is meant by the term “Lame Duck Session” in the Indian Parliament?", "options": {"A": "A session held when Parliament is unable to pass any Bill.", "B": "A session held immediately after the dissolution of Lok Sabha.", "C": "The last session of the existing Lok Sabha, in which members who have not been re-elected may still participate\nuntil the House is dissolved.", "D": "A special session called by the President during a national emergency."}, "answer": "C", "explanation": "Lame Duck Session refers to the last session of the existing Lok Sabha before its dissolution.\n\n    •    It may include members who have lost the election or are not seeking re-election, but who are still members\n         until the existing Lok Sabha is dissolved.\n    •    Such members are called “lame ducks” because their term is coming to an end.\n    •    They continue to enjoy the rights and privileges of members until the dissolution of the House.\n    •    The term is not specifically mentioned in the Constitution; it is a parliamentary term"}, {"id": 288, "topic": "Parliamentary Procedures", "question": "Consider the following statements regarding Question Hour and Zero Hour in the Indian Parliament:\n\n1. Question Hour is generally the first hour of a sitting of Parliament, during which members ask questions to\nMinisters to obtain information and ensure accountability of the Executive.\n\n2. Questions may be Starred, Unstarred and Short Notice Questions, with Starred Questions requiring oral answers\nand permitting supplementary questions.\n\n3. The lists of Starred, Unstarred, Short Notice Questions and Questions to Private Members are printed in green,\nwhite, light pink and yellow colours, respectively, to distinguish them from one another.\n\n4. Zero Hour generally follows Question Hour and is used by members to raise matters of urgent public importance;\nit is not mentioned in the Constitution and evolved through parliamentary practice.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 2 and 4 only", "C": "1, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Devices uses in Parliament sessions\n\nQuestion Hour\n\n    •    Question Hour is generally the first hour of a sitting of Parliament.\n    •    During this period, MPs ask questions to Ministers regarding government policies, administration,\n         programmes and matters of public importance.\n    •    It is an important instrument of parliamentary control over the Executive.\n    •    Ministers are required to provide information and answer questions according to parliamentary rules.\n\nTypes of Questions:\n\nStarred Question (★)\n\n    •    Requires an oral answer by the Minister.\n    •    Supplementary questions can be asked.\n    •    In the printed list, it is distinguished by an asterisk (*).\n\nUnstarred Question\n\n    •    Requires a written answer.\n    •    Supplementary questions cannot be asked.\n    •    The answer is laid on the Table of the House.\n\nShort Notice Question\n\n    •    Relates to a matter of urgent public importance.\n    •    Asked with notice shorter than the prescribed normal period.\n    •    Requires the permission of the competent parliamentary authority under the applicable rules.\n\nColour of Printed Question Lists\n\nThe lists are printed in different colours to distinguish them:\n\n    •    Starred Questions → Green\n    •    Unstarred Questions → White\n    •    Short Notice Questions → Light Pink\n    •    Questions to Private Members → Yellow\n\nZero Hour\n\n    •    Zero Hour generally follows the Question Hour.\n    •    Members raise matters of urgent public importance during this period.\n    •    It provides an opportunity to raise issues that require the Government’s immediate attention.\n    •    The term “Zero Hour” is not mentioned in the Constitution.\n    •    It is also not formally recognised as such in the Rules of Procedure.\n    •    It developed through parliamentary practice and convention.\n    •    It is therefore different from Question Hour, which is a formally regulated parliamentary procedure.\n    •"}, {"id": 289, "topic": "Parliamentary Procedures", "question": "Which of the following correctly describes a Motion and some important types of Parliamentary Motions?\n\n1. A motion is a formal proposal made by a member of the House for the purpose of eliciting a decision of the\nHouse on a matter.\n\n2. A Closure Motion is a motion to bring a debate on a matter before the House to an end before the members who\nwish to speak have spoken.\n\n3. A Privilege Motion is concerned with a case of alleged breach of the privileges of the House or one or more of its\nmembers.\n\n4. A Calling Attention Motion enables a member to call the attention of a Minister to a matter of urgent public\nimportance and seek an authoritative statement from the Minister.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Motion – Meaning\n\nA motion is a formal proposal made by a member of Parliament for the purpose of eliciting a decision of the House\non a matter.\n\nIt is placed before the House for discussion and decision.\n\nA motion may relate to:\n\n    •    Public importance\n    •    Government policy\n    •    Parliamentary business\n\nA specific matter under consideration by the House.\n\nMotions are an important instrument of parliamentary debate and control over the Executive.\n\nGenerally, a motion requires the admission/permission of the Presiding Officer according to the rules.\n\nClosure Motion\n\n    •    A Closure Motion is a motion moved to cut short debate on a matter before the House.\n    •    It seeks to bring the discussion to an end before all members who wish to speak have spoken.\n    •    If the closure is accepted, the matter is put to the vote, subject to the rules.\n    •    It is used to prevent unnecessarily prolonged debate.\n\nTypes of Closure:\n\n    •    Simple Closure → Debate is declared closed and the question is put to vote.\n\n\n\n    •    Closure by Compartments → Different parts of a Bill/resolution are discussed and voted upon separately.\n    •    Kangaroo Closure → Only important clauses are taken up for discussion and voting; insignificant clauses\n         are skipped.\n    •    Gilatine → Undiscussed clauses are put to vote along with the other clauses when the allotted time expires.\n\nPrivilege Motion\n\n    •    A Privilege Motion is concerned with an alleged breach of parliamentary privilege.\n    •    It may be moved when a member or the House’s privileges are considered to have been violated.\n    •    It can be moved against:A Minister ;AMember\n    •    Any other person, depending on the circumstances.\n    •    The purpose is to protect the privileges and authority of Parliament and its members.\n    •    The Presiding Officer decides whether the matter is admissible under the rules.\n    •    It is different from a Censure Motion, which concerns condemnation of Government policy/action.\n\nCalling Attention Motion\n\n    •    Under a Calling Attention procedure, a member calls the attention of a Minister to a matter of urgent public\n         importance.\n    •    The Minister makes an authoritative statement on the matter.\n    •    The member may seek clarification through questions as permitted by the rules.\n    •    It is an important device for obtaining the Government’s response to an urgent issue.\n\nUnlike an Adjournment Motion, it does not involve suspension of the normal business of the House."}, {"id": 290, "topic": "Parliamentary Procedures", "question": "Which of the following statements correctly describes the Adjournment Motion, No-Confidence Motion and\nConfidence Motion?\n\n1. An Adjournment Motion is moved to discuss a definite matter of urgent public importance and involves setting\naside the normal business of the House.\n\n2. A No-Confidence Motion is used to test whether the Council of Ministers continues to enjoy the confidence of the\nLok Sabha.\n\n3. A Confidence Motion is generally moved by the Government to demonstrate that it enjoys the confidence of the\nLok Sabha.\n\n4. Both No-Confidence and Confidence Motions are directly concerned with determining whether the Government\nhas the support of the Lok Sabha.", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    It is moved to discuss a definite matter of urgent public importance.\n\n\n\n    •   It seeks to interrupt the normal business of the House to discuss that urgent matter.\n    •   It is primarily a Lok Sabha device.\n    •   The matter must be specific, urgent and of public importance.\n    •   It should relate to a matter for which the Government is responsible.\n    •   The admission of the motion is subject to the Speaker’s permission and parliamentary rules.\n    •   Adoption of an Adjournment Motion involves an element of censure against the Government.\n\nNo-Confidence Motion\n\n    •   It tests whether the Council of Ministers enjoys the confidence of Lok Sabha.\n    •   It can be moved only in Lok Sabha.\n    •   It does not have to state specific reasons for lack of confidence.\n    •   If the motion is passed, the Government is considered to have lost the confidence of Lok Sabha.\n    •   Since the Council of Ministers is collectively responsible to Lok Sabha under Article 75(3), it must resign.\n\nConfidence Motion\n\nIt is generally moved by the Government to demonstrate that it enjoys the confidence of Lok Sabha.\n\nIt may become important when:\n\n    •   A Government’s majority is in doubt.\n    •   There is a change in political circumstances.\n    •   The Government is required to prove its majority.\n    •   If the Government fails to obtain the required support, it may have to resign.\n             1. Key Difference\n\nNo-Confidence Motion → Opposition/members challenge the Government’s majority.\n\nConfidence Motion → Government seeks to demonstrate its majority.\n\nBoth → Concern the confidence/support of Lok Sabha."}, {"id": 291, "topic": "Parliamentary Procedures", "question": "Which of the following correctly describes the Censure Motion, Motion of Thanks, No-Day-Yet-Named\nMotion and Dilatory Motion?\n\n1. A Censure Motion expresses disapproval of a specific policy, action or conduct of the Government and must state\nthe reasons for the censure.\n\n2. The Motion of Thanks is moved after the President’s Special Address to Parliament and provides an opportunity\nto discuss the Government’s policies and programmes.\n\n3. A No-Day-Yet-Named Motion is a motion that has been admitted but for which no date has yet been fixed for\ndiscussion.\n\n4. A Dilatory Motion seeks to delay or adjourn the consideration of a matter before the House.", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "A Censure Motion is moved to express disapproval or condemnation of:\n\n    •    A specific policy\n    •    An action\n    •    A decision\n    •    Conduct of the Government.\n\nIt must state the reasons for the censure.\n\nIt can be moved against:\n\n    •    The Council of Ministers, or\n    •    An individual Minister.\n\nIt is generally used as a means of criticising Government policy/action.\n\nAdoption of a Censure Motion does not automatically require the resignation of the Council of Ministers.\n\nHowever, it may have significant political consequences.\n\nCensure vs No-Confidence\n\nCensure → Specific reason/policy/action must be stated.\n\nNo-Confidence → Need not state a specific reason.\n\nNo-Confidence passed → Government must resign.\n\nMotion of Thanks\n\n    •    The President addresses both Houses assembled together under Article 87.\n    •    Following this address, a Motion of Thanks is moved in Parliament.\n    •    Members discuss the Government’s policies, programmes and achievements.\n    •    Members can also criticise the Government during the discussion.\n    •    Amendments to the Motion of Thanks can be moved.\n    •    The Government’s handling of the Motion is politically important because defeat of the Motion may\n         indicate loss of parliamentary support.\n\nNo-Day-Yet-Named Motion\n\n    •    A motion that has been admitted by the Speaker/Chairman, but no date has yet been fixed for its discussion.\n    •    It remains pending until a date is allotted.\n    •    It is therefore different from a motion that has already been scheduled for discussion.\n\nDilatory Motion\n\n    •    A Dilatory Motion is intended to delay or retard the consideration of a matter before the House.\n    •    It may seek postponement or adjournment of the discussion/proceeding.\n\n\n\n    •    It is a subsidiary motion because it relates to the matter already before the House.\n    •    It can be used to delay consideration of a Bill or other business."}, {"id": 292, "topic": "Parliamentary Procedures", "question": "Which of the following correctly describes the Point of Order, Half-an-Hour Discussion and Short-Duration\nDiscussion in Parliament?", "options": {"A": "Point of Order deals with parliamentary procedure; Half-an-Hour Discussion seeks clarification on facts arising\nfrom a Minister’s answer; Short-Duration Discussion deals with a matter of urgent public importance without\nvoting.", "B": "Point of Order is used for voting on Demands for Grants; Half-an-Hour Discussion deals with Money Bills;\nShort-Duration Discussion requires voting.", "C": "Point of Order can be raised only by the Minister; Half-an-Hour Discussion is limited to Rajya Sabha; Short-\nDuration Discussion is used for constitutional amendments.", "D": "All three discussions necessarily conclude with a formal vote."}, "answer": "A", "explanation": "•    A Point of Order is raised when a member draws attention to a violation of the rules or procedure of the\n         House.\n    •    It must relate to the business being conducted in the House.\n    •    The Speaker in Lok Sabha or Chairman in Rajya Sabha decides the Point of Order.\n\nHalf-an-Hour Discussion\n\n    •    It is used when a member wants to obtain further clarification on a matter of fact arising out of an answer\n         already given by a Minister.\n    •    It is normally held for half an hour.\n    •    There is no formal voting on the matter.\n\nShort-Duration Discussion\n\n    •    It is used to discuss a matter of urgent public importance.\n    •    It does not require a formal motion and no voting takes place at the end.\n    •    In Lok Sabha, two days in a week are generally allotted for Short-Duration Discussions, subject to the\n         scheduling of House business by the Speaker."}, {"id": 293, "topic": "Parliamentary Procedures", "question": "Which of the following correctly describes Special Mention and Resolution as parliamentary devices?", "options": {"A": "Special Mention is used to raise a matter of public importance without a formal motion, while a Resolution is a\nformal proposal submitted for the consideration of the House.", "B": "Special Mention is used only for Money Bills, while a Resolution is used only for Constitutional Amendment\nBills.", "C": "Special Mention always requires voting, while a Resolution never requires voting.", "D": "Both Special Mention and Resolution are used only to seek clarification from Ministers."}, "answer": "A", "explanation": "•    Special Mention is a parliamentary device used by members to raise matters of public importance which\n         are not covered by other parliamentary procedures.\n    •    In Rajya Sabha, it is known as Special Mention.\n    •    In Lok Sabha, a similar device is known as Matter under Rule 377.\n    •    It does not involve voting like a formal resolution.\n\nResolution\n\nA Resolution is a formal proposal submitted to the House for its consideration.\n\nIt can be used to express the opinion or recommendation of the House on a matter of public importance.\n\nA Resolution may be:\n\n    •    Private Member’s Resolution → Moved by a member who is not a Minister\n    •    Government Resolution → Moved by a Minister\n    •    Statutory Resolution → Moved under a provision of the Constitution or an Act\n\nA Resolution may be discussed and voted upon, depending on its nature."}, {"id": 294, "topic": "Bills & Legislation", "question": "Which of the following is the correct classification of Bills in the Indian Parliament?", "options": {"A": "Ordinary Bill, Money Bill, Financial Bill and Constitutional Amendment Bill", "B": "Ordinary Bill, Appropriation Bill, Finance Bill and Private Member’s Bill", "C": "Money Bill, Government Bill, Private Bill and Constitutional Bill", "D": "Ordinary Bill, Money Bill, Financial Bill and Private Member’s Bill"}, "answer": "A", "explanation": "•    Deals with matters other than those specifically covered by Money Bills and Financial Bills.\n    •    Can be introduced in either House of Parliament.\n    •    It can be introduced by a Minister or a Private Member.\n    •    Both Lok Sabha and Rajya Sabha have equal powers regarding an Ordinary Bill.\n\nMoney Bill – Article 110\n\n    •    Deals exclusively with matters such as taxation, borrowing of money, Consolidated Fund of India and\n         appropriation of money.\n    •    Can be introduced only in Lok Sabha.\n    •    It can be introduced only on the President’s recommendation.\n    •    Rajya Sabha can only recommend changes and must return it within 14 days.\n\n\n\n    •    The Speaker of Lok Sabha decides whether a Bill is a Money Bill.\n\nFinancial Bills\n\n    •    Financial Bills are related to financial matters, but not every Financial Bill is a Money Bill.\n    •    They are mainly classified under Article 117.\n    •    Some Financial Bills can be introduced only in Lok Sabha, while others can be introduced in either House,\n         depending on their category.\n\nConstitutional Amendment Bill – Article 368\n\n    •    Used to amend the Constitution of India.\n    •    Can be introduced in either House of Parliament.\n    •    Prior permission of the President is not required for introduction.\n    •    It must be passed according to the special procedure prescribed by Article 368."}, {"id": 295, "topic": "Bills & Legislation", "question": "Which of the following correctly describes the stages involved in passing an Ordinary Bill in Parliament?", "options": {"A": "Introduction → Second Reading → Committee Stage → Third Reading → Other House → President", "B": "Introduction → Committee Stage → Second Reading → Third Reading → Other House → President", "C": "Introduction → Second Reading → Third Reading → Committee Stage → Other House → President", "D": "Introduction → First Reading → President → Second Reading → Other House → Third Reading"}, "answer": "A", "explanation": "1.First Reading – Introduction\n\n    •    An Ordinary Bill can be introduced in either Lok Sabha or Rajya Sabha.\n    •    It may be introduced by a Minister or a Private Member.\n    •    The member introduces the Bill and its title and objectives are presented.\n    •    After introduction, the Bill is published in the Gazette.\n\n2.Second Reading\n\n    •    This is the most important stage because the Bill is discussed and examined in detail.\n    •    First, there is a general discussion on the main principles of the Bill.\n    •    The House may then refer the Bill to a Select Committee, Joint Committee or Department-related Standing\n         Committee.\n    •    The Committee examines the Bill clause by clause and submits its report.\n    •    After the Committee stage, the House considers the Bill clause by clause and amendments may be moved.\n\n3.Third Reading\n\n    •    The House discusses the Bill in its final form.\n    •    Discussion is generally restricted to the acceptance or rejection of the Bill.\n    •    No major changes are normally made at this stage.\n    •    The House then votes on the Bill.\n\n\n\n    •     If passed by a simple majority of members present and voting, it moves to the other House.\n\nBill in the Other House\n\n    •     The Bill goes through similar stages in the other House.\n    •     The other House may: Pass the Bill without changes → Bill moves forward\n    •     Pass it with amendments → First House must consider those amendments\n    •     Reject the Bill → Deadlock may arise\n    •     Take no action for more than six months → Deadlock may arise\n\nJoint Sitting – Article 108\n\n    •     If there is a deadlock between the two Houses, the President may summon a Joint Sitting.\n    •     It is presided over by the Speaker of Lok Sabha.\n    •     The Bill is passed by a majority of members present and voting.\n    •     Joint sitting is not applicable to Money Bills or Constitutional Amendment Bills.\n\nPresident’s Assent – Article 111\n\nAfter being passed by both Houses, the Bill is presented to the President.\n\nThe President can:\n\n    •     Give assent → Bill becomes an Act\n    •     Withhold assent → Bill is rejected\n    •     Return the Bill for reconsideration → Only once\n\nIf Parliament passes the returned Bill again, the President cannot withhold assent."}, {"id": 296, "topic": "Bills & Legislation", "question": "Which of the following statements regarding a Money Bill is correct?", "options": {"A": "A Money Bill can be introduced in either House of Parliament.", "B": "A Money Bill can be introduced in Lok Sabha only with the previous recommendation of the President.", "C": "Rajya Sabha can reject a Money Bill and prevent it from becoming law.", "D": "The President can return a Money Bill to Parliament for reconsideration."}, "answer": "B", "explanation": "Article 110 – Definition of Money Bill\n\nA Money Bill deals only with matters specifically mentioned in Article 110, such as:\n\n1. Imposition, abolition, remission, alteration or regulation of any tax.\n\n2. Regulation of borrowing of money by the Government of India.\n\n3. Custody of the Consolidated Fund of India or Contingency Fund of India.\n\n4. Appropriation of money out of the Consolidated Fund of India.\n\n\n\n5. Declaring expenditure as charged on the Consolidated Fund of India.\n\n6. Receipt of money into the Consolidated Fund/Public Account or the audit of Union or State accounts.\n\nBill Procedure\n\n    •     Introduction:A Money Bill can be introduced only in Lok Sabha and only with the President’s prior\n          recommendation.\n    •     Rajya Sabha:Rajya Sabha cannot reject or amend a Money Bill. It can only make recommendations and\n          must return it to Lok Sabha within 14 days.\n    •     Lok Sabha:Lok Sabha may accept or reject the recommendations of Rajya Sabha.\n    •     Speaker:The Speaker of Lok Sabha has the final authority to decide whether a Bill is a Money Bill. The\n          Speaker’s decision is final under Article 110.\n    •     President:After being passed by Parliament, the President cannot return a Money Bill for reconsideration.\n          The President may give or withhold assent."}, {"id": 297, "topic": "Bills & Legislation", "question": "Which of the following statements regarding Financial Bills under Article 117 is/are correct?\n\n    1.    Financial Bills are classified into three categories under the Constitution.\n    2.    A Financial Bill under Article 117(1) can be introduced only in the Lok Sabha and requires the President’s\n          recommendation.\n    3.    A Financial Bill under Article 117(3) can be introduced in either House, but it cannot be passed by either\n          House unless the President has recommended its consideration.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Financial Bills are classified into three categories under the Constitution.-Moneybills , Financial Bill I, Financial\nBill II.\n\nFinancial Bills deal with financial matters, but all Financial Bills are not Money Bills.\n\nFinancial Bill I – Article 117(1)\n\n    •     It contains one or more matters mentioned in Article 110, along with other matters.\n    •     It can be introduced only in Lok Sabha.\n    •     Prior recommendation of the President is necessary for its introduction.\n    •     It cannot be introduced in Rajya Sabha.\n    •     But, unlike a Money Bill, Rajya Sabha has equal power to amend or reject it.\n    •     There is no provision for joint sitting if a deadlock arises? A joint sitting can be held, subject to Article 108.\n\nFinancial Bill II – Article 117(3)\n\n\n\n    •    It contains provisions involving expenditure from the Consolidated Fund of India, but does not contain\n         matters specified in Article 110.\n    •    It can be introduced in either House of Parliament.\n    •    President’s recommendation is not required for introduction.\n    •    However, it cannot be passed by either House unless the President has recommended consideration of the\n         Bill.\n\nOrdinary Bill with Financial Provisions\n\nFinancial Bills that do not fall under Article 117(1) or 117(3) are dealt with as ordinary bills, subject to the relevant\nconstitutional requirements."}, {"id": 298, "topic": "Bills & Legislation", "question": "Which of the following statements regarding the Joint Sitting of Parliament under Article 108 is/are correct?\n\n    1.   The President may summon a Joint Sitting when there is a deadlock between the two Houses on a Bill.\n    2.   A Joint Sitting may be summoned when one House rejects a Bill passed by the other House, or when the\n         Houses finally disagree on amendments, or when the other House does not pass the Bill for more than six\n         months.\n    3.   The Joint Sitting is presided over by the Speaker of the Lok Sabha, and the Bill is decided by a majority of\n         members present and voting.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Joint Sitting means a joint meeting of Lok Sabha and Rajya Sabha to resolve a deadlock over a Bill.\n    •    The President summons the Joint Sitting.\n\nWhen can it be summoned?\n\n    •    Rejection of Bill:If one House has rejected a Bill passed by the other House, a deadlock may arise.\n    •    Disagreement over Amendments:Ifboth Houses have finally disagreed as to the amendments to be made in\n         the Bill, a Joint Sitting may be called.\n    •    More than Six Months:If a Bill passed by one House is sent to the other House and the other House does\n         not pass it for more than six months, the President may summon a Joint Sitting.\n\nNote The six-month period does not include periods when the other House is prorogued or adjourned for more than\nfour consecutive days.\n\nThe Joint Sitting is presided over by:\n\n    •    Speaker of Lok Sabha → Deputy Speaker of Lok Sabha → Deputy Chairman of Rajya Sabha\n    •    This order applies when the preceding officer is absent.\n\nVoting\n\n\n\n    •    The Bill is passed by a majority of the members of both Houses present and voting at the Joint Sitting.\n    •    If the Bill is passed in the Joint Sitting, it is considered to have been passed by both Houses and is then\n         presented to the President for assent.\n\nBills for which Joint Sitting is NOT available\n\n    1.   Money Bill – Article 110\n\nThere is no Joint Sitting because Lok Sabha has overriding power over the recommendations of Rajya Sabha.\n\n    2.   Constitutional Amendment Bill – Article 368\n\nThere is no Joint Sitting. The Bill must be passed separately by each House with the required special majority."}, {"id": 299, "topic": "Bills & Legislation", "question": "Which of the following is a special power exclusively available to the Lok Sabha?", "options": {"A": "To authorise the creation of All India Services", "B": "To vote on Demands for Grants and have the final say on a Money Bill", "C": "To initiate the removal of the Vice-President", "D": "To authorise Parliament to legislate on a State List matter in the national interest"}, "answer": "B", "explanation": "1.   Money Bill – Article 110:A Money Bill can be introduced only in Lok Sabha. Rajya Sabha can only make\n         recommendations.\n    2.   Final Say on Money Bill – Article 109:Rajya Sabha must return a Money Bill within 14 days. Lok Sabha\n         can accept or reject its recommendations.\n    3.   Demands for Grants – Article 113:only Lok Sabha has the power to vote on Demands for Grants. Rajya\n         Sabha can discuss them but cannot vote.\n    4.   No-Confidence Motion: No-Confidence Motion against the Council of Ministers can be moved only in\n         Lok Sabha because the Council is collectively responsible to Lok Sabha under Article 75(3).\n    5.   Removal of Vice-President – Special Role:The removal resolution is initiated in Rajya Sabha, but Lok\n         Sabha must agree to it. Therefore, this is not an exclusive power of Lok Sabha."}, {"id": 300, "topic": "Bills & Legislation", "question": "Which of the following is a special power exclusively available to the Rajya Sabha?", "options": {"A": "To vote on Demands for Grants", "B": "To initiate a No-Confidence Motion against the Council of Ministers", "C": "To authorise Parliament to make laws on a matter in the State List in the national interest", "D": "To introduce a Money Bill"}, "answer": "C", "explanation": "1.   Article 249 – State List:Rajya Sabha can pass a resolution by a two-thirds majority of members present and\n         voting declaring that it is necessary in the national interest for Parliament to make a law on a matter in the\n         State List.\n    2.   Article 312 – All India Services:Rajya Sabha can pass a resolution by a two-thirds majority of members\n         present and voting authorising Parliament to create one or more All India Services common to the Union\n         and the States.\n    3.   Article 67(b) – Removal of Vice-President:A resolution for the removal of the Vice-President can be\n         initiated only in Rajya Sabha. After being passed by Rajya Sabha, it must be agreed to by Lok Sabha.\n    4.   Special Role during Lok Sabha Dissolution:Since Rajya Sabha is a permanent House, it can continue to\n         exercise its constitutional functions even when Lok Sabha is dissolved. For example, in certain\n         circumstances it can approve a National Emergency proclamation when Lok Sabha is dissolved."}, {"id": 301, "topic": "Constitutional Bodies", "question": "Which of the following correctly describes the Election Commission of India?", "options": {"A": "It conducts elections to Panchayats and Municipalities.", "B": "It is a constitutional body responsible for superintendence, direction and control of elections to Parliament, State\nLegislatures, President and Vice-President.", "C": "It is a statutory body under the Representation of the People Act, 1951.", "D": "It is responsible for auditing election expenditure of the Government."}, "answer": "B", "explanation": "Purpose - To ensure free and fair elections.\n\n    •    Composition - Chief Election Commissioner + such number of Election Commissioners as the President\n         may fix.\n    •    Appointment - CEC and other Election Commissioners are appointed by the President, subject to the law\n         made by Parliament.\n    •    Tenure -6 years or 65 years, whichever is earlier, under the current statutory framework.\n    •    Removal of CEC - Same manner and on the same grounds as a Supreme Court Judge.\n    •    Removal of other Election Commissioners - President can remove them on the recommendation of the\n         CEC.\n    •    Qualification - Constitution does not prescribe a specific educational qualification for the CEC or Election\n         Commissioners.\n\nMain Functions\n\n    •    Conducts elections to Lok Sabha and Rajya Sabha.\n    •    Conducts elections to State Legislative Assemblies and Legislative Councils.\n    •    Conducts elections to President and Vice-President.\n    •    Prepares and supervises electoral rolls.\n    •    Allots election symbols and recognises political parties under the applicable law.\n    •    Advises President/Governor on disqualification of MPs/MLAs under Articles 103 and 192.\n    •    Important → ECI does not conduct Panchayat and Municipal elections.\n    •"}, {"id": 302, "topic": "Constitutional Bodies", "question": "Which of the following correctly describes the Union Public Service Commission (UPSC)?", "options": {"A": "A constitutional body responsible for recruitment to important Union and All-India services", "B": "A statutory body responsible only for conducting elections", "C": "A constitutional body responsible for auditing government accounts", "D": "A statutory body responsible for distribution of tax revenue"}, "answer": "A", "explanation": "•    Constitutional Basis → Articles 315–323\n    •    Purpose → To ensure merit-based recruitment to Union services and to advise the Government on service\n         matters.\n    •    Composition → Chairman + other members; number is determined by the President.\n    •    Appointment → Chairman and members are appointed by the President.\n    •    Tenure → 6 years or until the age of 65 years, whichever is earlier.\n    •    Resignation → Chairman/member submits resignation to the President.\n    •    Removal → President removes them. In case of misbehaviour, the President refers the matter to the\n         Supreme Court and acts on its report.\n    •    Qualification → Constitution does not prescribe specific educational qualifications. At least half of the\n         members should have held government office for at least 10 years.\n\nMain Functions\n\n    •    Conducts examinations for appointments to Union services.\n    •    Advises Government on methods of recruitment.\n    •    Advises on appointment, promotion and transfer.\n    •    Advises on disciplinary matters affecting government servants.\n    •    Advises on claims for reimbursement of legal expenses incurred by a government servant in defending\n         proceedings connected with official duties.\n    •    Advises on claims for compensation/pension for injuries sustained in service.\n    •    Annual Report → Submitted to the President, who places it before Parliament.\n\nNote → UPSC’s advice is advisory, not binding."}, {"id": 303, "topic": "Constitutional Bodies", "question": "Which of the following correctly describes the State Public Service Commission (SPSC)?", "options": {"A": "It is appointed and removed entirely by the State Legislature.", "B": "It is a constitutional body concerned mainly with recruitment and service matters of the State.", "C": "It conducts elections to State Legislative Assemblies.", "D": "It audits the financial accounts of the State Government."}, "answer": "B", "explanation": "•    Constitutional Basis → Articles 315–323\n    •    Purpose → To ensure merit-based recruitment to State services and advise the State Government on service\n         matters.\n    •    Composition → Chairman + other members; number determined by the Governor.\n    •    Appointment → Chairman and members are appointed by the Governor.\n    •    Tenure → 6 years or until the age of 62 years, whichever is earlier.\n    •    Resignation → Resignation is submitted to the Governor.\n    •    Removal → Removal is by the President, not the Governor. In case of misbehaviour, the President obtains\n         the Supreme Court’s inquiry/report.\n    •    Qualification → No specific educational qualification is prescribed. At least half of the members should\n         have held government office for 10 years.\n\nMain Functions\n\n    •    Conducts examinations for State services.\n    •    Advises State Government on recruitment methods.\n    •    Advises on appointment, promotion and transfer.\n    •    Advises on disciplinary matters.\n    •    Advises on claims for reimbursement of legal expenses and compensation/pension in specified service\n         matters.\n    •    Annual Report → Submitted to the Governor, who places it before the State Legislature.\n\nImportant Note: Its advice is advisory, not binding."}, {"id": 304, "topic": "Constitutional Bodies", "question": "Which of the following correctly describes the NCSC, NCST and NCBC?", "options": {"A": "All three are statutory bodies established by ordinary laws of Parliament.", "B": "NCSC and NCST are constitutional bodies, while NCBC became a constitutional body through the 102nd\nConstitutional Amendment Act, 2018.", "C": "NCSC and NCST are executive bodies, while NCBC is a statutory body.", "D": "All three are established under the same Article of the Constitution."}, "answer": "B", "explanation": "National Commission for Scheduled Castes – NCSC\n\n    •    Article - 338\n    •    Constitutional body -Yes\n    •    Composition - Chairperson + Vice-Chairperson + 3 other Members\n    •    Appointment - President\n    •    Tenure - Determined by President\n\nMain function –\n\n\n\n    •    Protect and safeguard the interests of Scheduled Castes\n    •    Reports -Submits reports to the President\n    •    The President places the reports before Parliament along with a memorandum explaining the action taken\n         on the recommendations.\n\nNational Commission for Scheduled Tribes – NCST\n\n    •    Article - 338A\n    •    Constitutional body - Yes\n    •    Established separately - 89th Constitutional Amendment Act, 2003\n    •    Composition - Chairperson + Vice-Chairperson + 3 other Members\n    •    Appointment -President\n\nMain function\n\n    •    Protect and safeguard the interests of Scheduled Tribes\n    •    Reports → Submits reports to the President\n    •    The President places the reports before Parliament along with an action-taken memorandum.\n\nNational Commission for Backward Classes – NCBC\n\n    •    Article → 338B\n    •    Constitutional body → Yes\n    •    Constitutional status → 102nd Constitutional Amendment Act, 2018\n    •    Composition → Chairperson + Vice-Chairperson + 3 other Members\n    •    Appointment → President\n\nMain function\n\n    •    Examine and monitor safeguards for socially and educationally backward classes and inquire into specific\n         complaints regarding their rights and safeguards\n    •    Reports → Submits reports to the President\n    •    The President places the reports before Parliament."}, {"id": 305, "topic": "Constitutional Bodies", "question": "Which of the following correctly describes the Comptroller and Auditor General of India (CAG)?", "options": {"A": "CAG is a statutory authority appointed by Parliament.", "B": "CAG is a constitutional authority responsible for auditing public accounts and promoting legislative control over\npublic expenditure.", "C": "CAG conducts elections to Parliament.", "D": "CAG advises the Government on recruitment to civil services."}, "answer": "B", "explanation": "•    Constitutional Basis Article 148\n    •    Purpose - To ensure accountability and transparency in public financial administration.\n    •    Appointment - President of India\n\n\n\n    •   Composition -Single-member office → Comptroller and Auditor General\n    •   Tenure - 6 years or 65 years, whichever is earlier.\n    •   Resignation -President\n    •   Removal -Same manner and on the same grounds as a Supreme Court Judge.\n    •   Qualification -Constitution does not prescribe specific educational qualifications for CAG.\n\nMain Functions\n\n    •   Audits accounts of the Union and State Governments.\n    •   Audits expenditure from the Consolidated Fund of India and of States.\n    •   Audits transactions relating to the Contingency Fund and Public Account, as provided by law.\n    •   Audits receipts and examines whether revenue due to Government has been properly assessed and\n        collected.\n    •   Audits government companies and corporations where required under law.\n    •   Reports on Union accounts → President → Parliament\n    •   Reports on State accounts → Governor → State Legislature\n\nImportant → CAG is an important instrument of legislative control over public finance."}]</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('quizData').textContent);

  // Build topic list preserving first-seen order, with counts
  const topicOrder = [];
  const topicMap = {};
  data.forEach(q => {
    if(!topicMap[q.topic]){
      topicMap[q.topic] = [];
      topicOrder.push(q.topic);
    }
    topicMap[q.topic].push(q);
  });

  const state = {
    answered: 0,
    correct: 0,
    wrong: 0,
    activeTopic: topicOrder[0]
  };

  const statTotal = document.getElementById('statTotal');
  const statAnswered = document.getElementById('statAnswered');
  const statCorrect = document.getElementById('statCorrect');
  const statWrong = document.getElementById('statWrong');
  statTotal.textContent = data.length;

  function updateStats(){
    statAnswered.textContent = state.answered;
    statCorrect.textContent = state.correct;
    statWrong.textContent = state.wrong;
  }

  function formatText(t){
    if(!t) return '';
    return t.split('\n').map(line => {
      const m = line.match(/^(\s*)/);
      const lead = m[1];
      let rest = line.slice(lead.length);
      rest = rest.replace(/ {3,}/g, ' \u2014 ');
      return lead + rest;
    }).join('\n');
  }

  // ---------- Tabs ----------
  const tabsNav = document.getElementById('topicTabs');
  topicOrder.forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.type = 'button';
    btn.dataset.topic = topic;
    btn.innerHTML = topic + '<span class="tab-count">(' + topicMap[topic].length + ')</span>';
    btn.addEventListener('click', () => selectTopic(topic, true));
    tabsNav.appendChild(btn);
  });

  function setActiveTabUI(topic){
    tabsNav.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.topic === topic);
    });
  }

  // ---------- Question rendering ----------
  const container = document.getElementById('quizContainer');

  function renderTopic(topic){
    container.innerHTML = '';
    const questions = topicMap[topic];

    const heading = document.createElement('div');
    heading.className = 'topic-heading';
    const h2 = document.createElement('h2');
    h2.textContent = topic;
    const prog = document.createElement('span');
    prog.className = 'topic-progress';
    prog.id = 'topicProgress';
    heading.appendChild(h2);
    heading.appendChild(prog);
    container.appendChild(heading);

    function updateTopicProgress(){
      let ans = 0;
      questions.forEach(q => { if(q._answered) ans++; });
      prog.textContent = ans + ' / ' + questions.length + ' answered';
    }

    questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const qHead = document.createElement('div');
      qHead.className = 'q-head';
      const num = document.createElement('div');
      num.className = 'q-num';
      num.textContent = 'Q' + q.id;
      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = formatText(q.question);
      qHead.appendChild(num);
      qHead.appendChild(qText);
      card.appendChild(qHead);

      const optsWrap = document.createElement('div');
      optsWrap.className = 'options';

      const letters = ['A','B','C','D'];
      const explanationBox = document.createElement('div');
      explanationBox.className = 'explanation';
      const explanationInner = document.createElement('div');
      explanationInner.className = 'explanation-inner';
      const expLabel = document.createElement('span');
      expLabel.className = 'exp-label';
      expLabel.textContent = 'Explanation';
      const expText = document.createElement('div');
      expText.textContent = formatText(q.explanation || 'No explanation provided.');
      explanationInner.appendChild(expLabel);
      explanationInner.appendChild(expText);
      explanationBox.appendChild(explanationInner);

      function lockOptions(selectedLetter){
        optsWrap.querySelectorAll('.option').forEach(btn => {
          btn.classList.add('locked');
          btn.disabled = true;
          const letter = btn.dataset.letter;
          if(letter === q.answer){
            btn.classList.add('correct');
          } else if(letter === selectedLetter){
            btn.classList.add('incorrect');
          }
        });
      }

      letters.forEach(letter => {
        const optText = q.options[letter];
        if(optText === undefined) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.dataset.letter = letter;
        const letterSpan = document.createElement('span');
        letterSpan.className = 'opt-letter';
        letterSpan.textContent = letter + '.';
        const textSpan = document.createElement('span');
        textSpan.textContent = formatText(optText);
        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if(q._answered) return;
          q._answered = true;
          state.answered++;
          if(letter === q.answer){
            state.correct++;
          } else {
            state.wrong++;
          }
          lockOptions(letter);
          explanationBox.classList.add('open');
          revealBtn.disabled = true;
          updateStats();
          updateTopicProgress();
        });

        optsWrap.appendChild(btn);
      });

      card.appendChild(optsWrap);

      const qFooter = document.createElement('div');
      qFooter.className = 'q-footer';
      const revealBtn = document.createElement('button');
      revealBtn.type = 'button';
      revealBtn.className = 'reveal-link';
      revealBtn.textContent = 'Show answer & explanation';
      revealBtn.addEventListener('click', () => {
        if(q._answered) return;
        q._answered = true;
        state.answered++;
        updateStats();
        updateTopicProgress();
        lockOptions(null);
        explanationBox.classList.add('open');
        revealBtn.disabled = true;
      });
      qFooter.appendChild(revealBtn);
      card.appendChild(qFooter);

      card.appendChild(explanationBox);
      container.appendChild(card);
    });

    updateTopicProgress();
  }

  function selectTopic(topic, scroll){
    state.activeTopic = topic;
    setActiveTabUI(topic);
    renderTopic(topic);
    if(scroll){
      window.scrollTo({top: container.offsetTop - 10, behavior:'smooth'});
    }
  }

  selectTopic(topicOrder[0], false);

  // ---------- Scroll to top ----------
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('show', window.scrollY > 420);
  });
  scrollBtn.addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
  });

})();
</script>
</body>
</html>
