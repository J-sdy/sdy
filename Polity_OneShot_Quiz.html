le 43A → Participation of workers in management of industries.\n    o   Added Article 48A → Protection of environment, forests and wildlife.\n    •   Shifted 5 subjects from State List to Concurrent List:Education, Forests, Protection of wild animals and\n        birds, Weights and measures, Administration of justice; constitution and organisation of all courts except\n        Supreme Court and High Courts.\n\nParliament & Judiciary\n\n    •   Tried to give Parliament greater power to amend the Constitution.\n    •   Tried to restrict the judicial review of constitutional amendments.\n    •   Introduced provisions giving greater importance to DPSPs over certain Fundamental Rights.\n    •   Made several changes to the jurisdiction of the Supreme Court and High Courts.\n\nEmergency & Centre-State Relations\n\n    •   Article 352: Allowed National Emergency to apply to the whole of India or only a part of India.\n    •   Extended the Lok Sabha and State Legislative Assembly term from 5 years to 6 years.\n    •   Made several changes that strengthened the Centre in relation to the States.\n\nImportant Case Connection\n\nMinerva Mills Case (1980):\n\n    •   Supreme Court struck down parts of the 42nd Amendment.\n    •   Held that limited amending power and judicial review are part of the Basic Structure."}, {"id": 190, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment Act restored the normal term of the Lok Sabha and State Legislative\nAssemblies from 6 years to 5 years and replaced “internal disturbance” with “armed rebellion” as a ground for\nNational Emergency?", "options": {"A": "38th Constitutional Amendment Act, 1975", "B": "42nd Constitutional Amendment Act, 1976", "C": "44th Constitutional Amendment Act, 1978", "D": "52nd Constitutional Amendment Act, 1985"}, "answer": "C", "explanation": "The 44th Constitutional Amendment Act, 1978 was enacted mainly to restore democratic safeguards and reverse\nseveral provisions introduced during the Emergency period.\n\nMajor Provisions\n\nRight to Property\n\n    •    Removed Right to Property from the list of Fundamental Rights.\n    •    Article 19(1)(f) and Article 31 were deleted.\n    •    Added Article 300A → Right to Property became a constitutional/legal right, not a Fundamental Right.\n\nNational Emergency – Article 352\n\n    •    Replaced “internal disturbance” with “armed rebellion”.\n    •    Written advice of the Union Cabinet became compulsory.\n    •    President’s satisfaction became subject to judicial review.\n    •    Parliamentary approval period was reduced from 2 months to 1 month.\n    •    Continued Emergency requires approval every 6 months.\n    •    Lok Sabha was given a special power to disapprove the Emergency.\n\nFundamental Rights during Emergency\n\n    •    Articles 20 and 21 cannot be suspended, even during a National Emergency.\n    •    Article 19 is automatically suspended only when Emergency is declared on the grounds of war or external\n         aggression.\n\nLok Sabha & State Assemblies\n\nRestored the normal term from 6 years to 5 years.\n\nPresident’s Powers\n\n    •    President can send the advice of the Council of Ministers back once for reconsideration.\n    •    After reconsideration, the President must act according to the advice.\n\nPresident’s Rule – Article 356\n\n    •    Introduced additional safeguards regarding the extension of President’s Rule beyond one year.\n\nPreventive Detention\n\n    •    Reduced the maximum period for detention without obtaining the opinion of an Advisory Board from 3\n         months to 2 months."}, {"id": 191, "topic": "Constitutional Amendments", "question": "Which of the following correctly describes the 52nd Constitutional Amendment Act, 1985?", "options": {"A": "It introduced the Right to Education as a Fundamental Right.", "B": "It gave constitutional status to Panchayati Raj Institutions.", "C": "It introduced the Anti-Defection Law by adding the Tenth Schedule.", "D": "It reduced the voting age from 21 to 18 years."}, "answer": "C", "explanation": "The 52nd Constitutional Amendment Act, 1985 is known for introducing the Anti-Defection Law.\n\nMajor Provisions\n\n    •   Added the Tenth Schedule to the Constitution.\n    •   Introduced provisions to prevent political defections by members of Parliament and State Legislatures.\n    •   A member can be disqualified for defection under the conditions specified in the Tenth Schedule.\n    •   Speaker/Chairman of the concerned House was given the power to decide questions of disqualification\n        under the Anti-Defection Law.\n    •   Originally, the law recognised a “split” in a political party as an exception to disqualification.\n\nGrounds for Disqualification\n\nA member can be disqualified if:\n\n    •   They voluntarily give up membership of their political party.\n    •   They vote or abstain from voting in the House contrary to the direction (whip) of their political party,\n        without prior permission, and the party does not condone the act within the prescribed period.\n    •   An independent member joins a political party after election.\n    •   A nominated member joins a political party after 6 months from the date they become a member of the\n        House.\n\nImportant Later Change\n\n    •   The 91st Constitutional Amendment Act, 2003 removed the “split” exception and retained only the merger\n        exception, requiring at least two-thirds of the members of the legislature party to agree to the merger."}, {"id": 192, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment reduced the minimum voting age for elections to the Lok Sabha and State\nLegislative Assemblies from 21 years to 18 years?", "options": {"A": "52nd Constitutional Amendment Act, 1985", "B": "61st Constitutional Amendment Act, 1988", "C": "65th Constitutional Amendment Act, 1990", "D": "69th Constitutional Amendment Act, 1991"}, "answer": "B", "explanation": "The 61st Constitutional Amendment Act, 1988 is mainly associated with the reduction of the voting age in India.\n\nMajor Provision\n\n    •   Amended Article 326.\n    •   Reduced the minimum voting age from 21 years to 18 years.\n\n\n\n    •   This enabled 18-year-old Indian citizens to vote in elections to the Lok Sabha and State Legislative\n        Assemblies."}, {"id": 193, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment gave Delhi the status of National Capital Territory (NCT) and provided for\na Legislative Assembly and Council of Ministers?", "options": {"A": "65th Constitutional Amendment Act, 1990", "B": "69th Constitutional Amendment Act, 1991", "C": "73rd Constitutional Amendment Act, 1992", "D": "74th Constitutional Amendment Act, 1992"}, "answer": "B", "explanation": "The 69th Constitutional Amendment Act, 1991 gave special constitutional status to Delhi.\n\nMajor Provisions\n\n    •   Inserted Article 239AA → Special provisions for the National Capital Territory (NCT) of Delhi.\n    •   Delhi was designated as the National Capital Territory of Delhi.\n    •   The Lieutenant Governor (LG) became the administrator of Delhi.\n    •   Provided for a Legislative Assembly for Delhi.\n    •   The Legislative Assembly can make laws on matters in the State List and Concurrent List, except:Public\n        Order, Police, Land\n    •   The Parliament continues to have power to make laws for Delhi, even on matters within the legislative\n        competence of the Delhi Assembly.\n    •   Provided for a Council of Ministers headed by the Chief Minister to aid and advise the LG.\n    •   In case of a difference of opinion between the LG and Council of Ministers, the matter can be referred to\n        the President.\n\nArticle 239AB\n\n    •   Inserted Article 239AB.\n    •   Provides for action when the administration of Delhi cannot be carried on in accordance with Article\n        239AA."}, {"id": 194, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment gave constitutional status to Panchayati Raj Institutions and added the\nEleventh Schedule containing 29 subjects?", "options": {"A": "69th Constitutional Amendment Act, 1991", "B": "74th Constitutional Amendment Act, 1992", "C": "86th Constitutional Amendment Act, 2002", "D": "73rd Constitutional Amendment Act, 1992"}, "answer": "D", "explanation": "The 73rd Constitutional Amendment Act, 1992 gave constitutional status to Panchayati Raj Institutions (PRIs) and\nstrengthened rural local self-government.\n\nMajor Provisions\n\n    •      Came into effect on 24 April 1993.\n    •      Added Part IX to the Constitution → “The Panchayats”.\n    •      Covers Articles 243 to 243-O.\n    •      Added the Eleventh Schedule, containing 29 subjects that may be entrusted to Panchayats.\n\nThree-Tier Panchayati Raj System\n\nThe Constitution provides for Panchayats at:\n\n    •      Village level → Gram Panchayat\n    •      Intermediate/Block level → Panchayat Samiti\n    •      District level → Zila Parishad\n\nException: States having a population not exceeding 20 lakh need not constitute Panchayats at the intermediate\nlevel.\n\nGram Sabha\n\n    •      Article 243A:Gram Sabha is the body consisting of persons registered in the electoral rolls of a village\n           within the area of the Panchayat.\n\nElections\n\n    •      Article 243K → Elections to Panchayats are conducted under the supervision of the State Election\n           Commission.\n\nReservation\n\n    •      Seats are reserved for SCs and STs in proportion to their population.\n    •      Not less than one-third of the total seats are reserved for women.\n    •      Not less than one-third of the seats reserved for SCs/STs are also reserved for women.\n    •      Reservation of offices of Chairpersons for SCs, STs and women is also provided.\n\nDuration\n\nArticle 243E\n\n    •      Every Panchayat normally has a 5-year term.\n    •      If dissolved earlier, elections must generally be completed within 6 months.\n\nState Finance Commission\n\nArticle 243I\n\n    •      The Governor constitutes a State Finance Commission every 5 years.\n    •      It reviews the financial position of Panchayats and recommends principles for distribution of financial\n           resources.\n\n\n\nState Election Commission\n\nArticle 243K\n\n    •   The State Election Commission conducts and supervises Panchayat elections.\n    •   The State Election Commissioner is appointed by the Governor.\n\nNote:24 April 1993 → Panchayati Raj Constitutional Status Day."}, {"id": 195, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment gave constitutional status to Urban Local Bodies and added the Twelfth\nSchedule containing 18 subjects?", "options": {"A": "73rd Constitutional Amendment Act, 1992", "B": "86th Constitutional Amendment Act, 2002", "C": "74th Constitutional Amendment Act, 1992", "D": "69th Constitutional Amendment Act, 1991"}, "answer": "C", "explanation": "The 74th Constitutional Amendment Act, 1992 gave constitutional status to Urban Local Bodies (Municipalities) and\nstrengthened urban local self-government.\n\nMajor Provisions\n\n    •   Came into force on 1 June 1993.\n    •   Added Part IX-A to the Constitution → “The Municipalities”.\n    •   Covers Articles 243P to 243ZG.\n    •   Added the Twelfth Schedule, containing 18 subjects for municipalities.\n\nTypes of Municipalities – Article 243Q\n\nThree types of urban local bodies:\n\n    •   Nagar Panchayat → Area transitioning from rural to urban.\n    •   Municipal Council → Smaller urban area.\n    •   Municipal Corporation → Larger urban area.\n\nComposition – Article 243R\n\n    •   Members of municipalities are generally directly elected from territorial constituencies.\n    •   State law may provide representation for persons having special knowledge or experience in municipal\n        administration, but such nominated persons do not have the right to vote in municipal meetings.\n\nReservation – Article 243T\n\n    •   Seats are reserved for SCs and STs in proportion to their population.\n    •   Not less than one-third of total seats are reserved for women.\n    •   At least one-third of SC/ST reserved seats are also reserved for women.\n    •   Reservation of offices of Chairpersons for SCs, STs and women is provided according to State law.\n\n\n\nDuration – Article 243U\n\n    •   Every Municipality normally has a 5-year term.\n    •   If dissolved earlier, elections must generally be completed within 6 months.\n    •   A Municipality cannot be dissolved merely because its remaining term is less than six months.\n\nElections – Article 243ZA\n\n    •   Municipal elections are conducted under the supervision of the State Election Commission.\n\nState Finance Commission – Article 243Y\n\n    •   The State Finance Commission, constituted under Article 243 for rural panchayats; Article 243Y extends\n        the provisions also reviews the financial position of Municipalities.\n    •   It recommends principles regarding the distribution of financial resources.\n\nDistrict Planning Committee – Article 243ZD\n\n    •   Constituted at the district level.\n    •   Consolidates plans prepared by Panchayats and Municipalities.\n\nMetropolitan Planning Committee – Article 243ZE\n\n    •   Constituted in every Metropolitan Area.\n    •   Prepares a draft development plan for the metropolitan area."}, {"id": 196, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment made free and compulsory education for children aged 6–14 years a\nFundamental Right?", "options": {"A": "73rd Constitutional Amendment Act, 1992", "B": "74th Constitutional Amendment Act, 1992", "C": "86th Constitutional Amendment Act, 2002", "D": "89th Constitutional Amendment Act, 2003"}, "answer": "C", "explanation": "The 86th Constitutional Amendment Act, 2002 made education a Fundamental Right for children in the age group of\n6–14 years.\n\nMajor Provisions\n\nArticle 21A – Fundamental Right to Education\n\n    •   Inserted Article 21A.\n    •   The State must provide free and compulsory education to all children aged 6–14 years.\n    •   It is a Fundamental Right.\n\nArticle 45 – DPSP\n\n    •   Modified Article 45.\n\n\n\n    •   Earlier → provision for free and compulsory education up to 14 years.\n    •   After amendment → State shall endeavour to provide early childhood care and education for children\n        below 6 years.\n\nArticle 51A(k) – Fundamental Duty\n\n    •   Added Article 51A(k).\n    •   It is the duty of every parent or guardian to provide opportunities for education to their child/ward between\n        6–14 years."}, {"id": 197, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment separated the National Commission for Scheduled Castes and Scheduled\nTribes into two separate constitutional commissions?", "options": {"A": "65th Constitutional Amendment Act, 1990", "B": "89th Constitutional Amendment Act, 2003", "C": "102nd Constitutional Amendment Act, 2018", "D": "105th Constitutional Amendment Act, 2021"}, "answer": "B", "explanation": "The 89th Constitutional Amendment Act, 2003 reorganised the constitutional safeguards for Scheduled Castes (SCs)\nand Scheduled Tribes (STs).\n\nMajor Provision\n\nThe amendment split the combined National Commission for SCs and STs into two separate constitutional\ncommissions.\n\nNational Commission for Scheduled Castes — Article 338\n\n    •   Article 338 now provides for the National Commission for Scheduled Castes (NCSC).\n    •   It deals exclusively with matters relating to Scheduled Castes.\n\nNational Commission for Scheduled Tribes — Article 338A\n\n    •   Inserted Article 338A.\n    •   Created a separate National Commission for Scheduled Tribes (NCST).\n    •   It deals exclusively with matters relating to Scheduled Tribes.\n\nArticle 339\n\n    •   The amendment also made consequential changes to Article 339, relating to the Union’s control over the\n        administration of Scheduled Areas and the welfare of Scheduled Tribes.\n\nBackground\n\n65th Amendment Act, 1990 → Created a combined National Commission for SCs & STs under Article 338.\n\n89th Amendment Act, 2003 → Separated it into two commissions"}, {"id": 198, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment gave constitutional recognition to co-operative societies by adding\nprovisions to Article 19(1)©, Article 43B and Part IX-B?", "options": {"A": "89th Constitutional Amendment Act, 2003", "B": "97th Constitutional Amendment Act, 2011", "C": "102nd Constitutional Amendment Act, 2018", "D": "101st Constitutional Amendment Act, 2016"}, "answer": "B", "explanation": "97th Constitutional Amendment Act, 2011\n\n    •   Article 19(1)(c):Added the right to form co-operative societies.\n    •   Article 43B: Added as a Directive Principle of State Policy to promote:Voluntary formation, Autonomous\n        functioning, Democratic control, Professional management of co-operative societies.\n    •   Part IX-B: Added provisions relating to Co-operative Societies.It originally covered Articles 243ZH to\n        243ZT.\n\nThe amendment aimed to ensure autonomy, democratic functioning and professional management of co-operative\nsocieties."}, {"id": 199, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment introduced a dual GST system in India, enabling both the Union and the\nStates to levy GST?", "options": {"A": "97th Constitutional Amendment Act, 2011", "B": "100th Constitutional Amendment Act, 2015", "C": "101st Constitutional Amendment Act, 2016", "D": "102nd Constitutional Amendment Act, 2018"}, "answer": "C", "explanation": "•   Introduced the constitutional framework for Goods and Services Tax (GST).\n    •   Article 246A → Gives both Parliament and State Legislatures power to make GST laws.\n    •   Article 269A → GST on inter-State supplies is levied and collected by the Union and apportioned between\n        the Union and States.\n    •   Article 279A → Established the GST Council.\n    •   Article 270 → Provides for distribution of certain GST revenues between the Union and States.\n    •   It subsumed several Central and State indirect taxes, including Central Excise Duty, Service Tax,\n        VAT/Sales Tax, Entry Tax, Luxury Tax and Entertainment Tax.\n    •   Article 268A and Entry 92C of the Union List, relating to service tax, were subsequently omitted as part of\n        the GST framework.\n    •   GST was implemented from 1 July 2017."}, {"id": 200, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment gave constitutional status to the National Commission for Backward\nClasses (NCBC) and inserted Article 338B?", "options": {"A": "101st Constitutional Amendment Act, 2016", "B": "102nd Constitutional Amendment Act, 2018", "C": "103rd Constitutional Amendment Act, 2019", "D": "105th Constitutional Amendment Act, 2021"}, "answer": "B", "explanation": "The 102nd Constitutional Amendment Act, 2018 gave constitutional status to the National Commission for\nBackward Classes (NCBC).\n\nMajor Provisions\n\nArticle 338B – NCBC\n\n    •   Inserted Article 338B.\n    •   Established the National Commission for Backward Classes (NCBC) as a constitutional body.\n    •   The Commission deals with safeguards and complaints relating to socially and educationally backward\n        classes.\n        Note:NCBC Composition: The NCBC consists of:Chairperson,Vice-Chairpers, 3 other Members\n\nArticle 342A – Socially & Educationally Backward Classes\n\n    •   Inserted Article 342A.\n    •   Provided for specification of Socially and Educationally Backward Classes (SEBCs).\n    •   Originally, the President specified SEBCs for each State/Union Territory after consultation with the\n        Governor, and Parliament could include or exclude communities from the Central List.\n\nArticle 366(26C)\n\n    •   Inserted the definition of “Socially and Educationally Backward Classes” (SEBCs)."}, {"id": 201, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment introduced a provision for up to 10% reservation for Economically Weaker\nSections (EWS) in educational institutions and public employment?", "options": {"A": "102nd Constitutional Amendment Act, 2018", "B": "104th Constitutional Amendment Act, 2019", "C": "105th Constitutional Amendment Act, 2021", "D": "103rd Constitutional Amendment Act, 2019"}, "answer": "D", "explanation": "The 103rd Constitutional Amendment Act, 2019 introduced 10% reservation for Economically Weaker Sections\n(EWS) in education and public employment.\n\nMajor Provisions\n\nArticle 15(6)\n\n    •    Inserted Article 15(6).\n    •    Permits the State to make special provisions for the advancement of Economically Weaker Sections\n         (EWS).\n    •    Allows up to 10% reservation in educational institutions, including private educational institutions.\n\nMinority educational institutions under Article 30(1) are excluded.\n\nArticle 16(6)\n\n    •    Inserted Article 16(6).\n    •    Permits up to 10% reservation in public employment and posts for EWS.\n    •    This reservation is in addition to the existing reservations for SCs, STs and OBCs.\n\nWho can get EWS Reservation?\n\n    •    EWS reservation is meant for economically weaker persons other than the classes already covered by\n         SC/ST/OBC reservation.\n    •    The 10% limit is a constitutional enabling provision; eligibility criteria are prescribed by the government."}, {"id": 202, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment extended the reservation of seats for SCs and STs in the Lok Sabha and\nState Legislative Assemblies up to 2030, while ending the provision for nomination of Anglo-Indian members?", "options": {"A": "102nd Constitutional Amendment Act, 2018", "B": "103rd Constitutional Amendment Act, 2019", "C": "104th Constitutional Amendment Act, 2019", "D": "105th Constitutional Amendment Act, 2021"}, "answer": "C", "explanation": "The 104th Constitutional Amendment Act, 2019 mainly dealt with reservation of seats for SCs and STs in the Lok\nSabha and State Legislative Assemblies and the Anglo-Indian nominated seats.\n\nMajor Provisions\n\n    SC/ST Reservation Extended\n\n    •    Extended the reservation of seats for Scheduled Castes (SCs) and Scheduled Tribes (STs) in:Lok\n         Sabha,State Legislative Assemblies\n    •    The reservation was extended for 10 more years, from 70 years to 80 years from the commencement of the\n         Constitution.\n    •    Thus, the reservation was extended up to 25 January 2030.\n\n\n\nAnglo-Indian Representation Ended\n\n    •   Discontinued the provision for nomination of Anglo-Indian members to:Lok Sabha, State Legislative\n        Assemblies\n    •   Therefore, the special representation of the Anglo-Indian community through nomination ceased after the\n        original period ended.\n\nImportant Articles\n\nArticle 334 → Deals with reservation of seats for SCs/STs and special representation of Anglo-Indians.The\namendment effectively continued SC/ST reservation but ended the Anglo-Indian nomination."}, {"id": 203, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment clarified that States and Union Territories can prepare and maintain their\nown lists of Socially and Educationally Backward Classes (SEBCs)?", "options": {"A": "102nd Constitutional Amendment Act, 2018", "B": "103rd Constitutional Amendment Act, 2019", "C": "104th Constitutional Amendment Act, 2019", "D": "105th Constitutional Amendment Act, 2021"}, "answer": "D", "explanation": "to identify and specify Socially and Educationally Backward Classes (SEBCs) for their own purposes.\n\nMajor Provisions\n\nArticle 342A\n\n    •   Clarified that the State/UT Government can prepare and maintain its own list of SEBCs.\n    •   This State/UT list may be different from the Central List.\n    •   The Central List continues to be maintained for purposes of the Union Government.\n\nArticle 338B\n\n    •   Clarified that the provisions relating to the National Commission for Backward Classes (NCBC) do not\n        take away the power of States/UTs to identify their own SEBCs.\n\nArticle 366(26C)\n\n    •   Modified the definition of SEBCs to support the distinction between the Central List and State/UT lists.\n\nWhy was it needed?\n\n    •   The 102nd Constitutional Amendment Act, 2018 gave constitutional status to the NCBC.\n    •   In the Maratha Reservation Case (2021), the Supreme Court interpreted the 102nd Amendment as affecting\n        the States’ power to identify SEBCs.\n    •   The 105th Amendment clarified/restored the States’ and UTs’ power to identify SEBCs for their own\n        purposes."}, {"id": 204, "topic": "Constitutional Amendments", "question": "Which Constitutional Amendment provides one-third reservation for women in the Lok Sabha, State\nLegislative Assemblies and the Delhi Legislative Assembly?", "options": {"A": "103rd Constitutional Amendment Act, 2019", "B": "104th Constitutional Amendment Act, 2019", "C": "105th Constitutional Amendment Act, 2021", "D": "106th Constitutional Amendment Act, 2023"}, "answer": "D", "explanation": "The 106th Constitutional Amendment Act, 2023 is popularly known as the Women’s Reservation Act, 2023 or Nari\nShakti Vandan Adhiniyam.\n\nMajor Provisions\n\n33% Reservation for Women\n\nProvides one-third reservation for women in the:\n\n    •   Lok Sabha\n    •   State Legislative Assemblies\n    •   Delhi Legislative Assembly\n\nArticle 330A\n\n    •   Inserted Article 330A.\n    •   Provides reservation of seats for women in the Lok Sabha.\n    •   One-third of the seats reserved for SCs and STs in Lok Sabha will also be reserved for women.\n\nArticle 332A\n\n    •   Inserted Article 332A.\n    •   Provides one-third reservation for women in State Legislative Assemblies.\n    •   One-third of SC/ST reserved seats in State Assemblies will also be reserved for women.\n\nArticle 239AA(2)\n\nAmended Article 239AA to provide one-third reservation for women in the Delhi Legislative Assembly.\n\nArticle 334A – When will reservation operate?\n\n    •   The reservation will take effect after a delimitation exercise is undertaken following the publication of the\n        relevant figures of the first Census conducted after the commencement of the 106th Amendment Act.\n    •   The reservation will continue for 15 years from the date it comes into effect.\n    •   Parliament may determine its continuation by law."}, {"id": 205, "topic": "Constitutional Amendments", "question": "Which of the following statements regarding Article 368 is correct?", "options": {"A": "A Constitutional Amendment Bill can be introduced only in the Lok Sabha with the President’s prior permission.", "B": "State Legislatures can introduce Constitutional Amendment Bills but cannot pass them.", "C": "A Constitutional Amendment Bill can be introduced in either House of Parliament, and State Legislatures have a\nrole only in ratifying certain specified amendments.", "D": "All Constitutional Amendments require ratification by at least half of the State Legislatures."}, "answer": "C", "explanation": "•    A Constitutional Amendment Bill can be introduced only in Parliament—either Lok Sabha or Rajya Sabha.\n    •    President’s prior permission is not required for introducing the Bill.\n    •    State Legislatures cannot introduce Constitutional Amendment Bills.\n    •    Normally, amendments require a Special Majority in both Houses separately.\n    •    For certain federal provisions, ratification by at least half of the State Legislatures is required.\n    •    There is no provision for a Joint Sitting for a Constitutional Amendment Bill.\n    •    After the required procedure is completed, the President must give assent.\n    •    Parliament’s amending power is subject to the Basic Structure Doctrine established in Kesavananda Bharati\n         (1973)."}, {"id": 206, "topic": "Judiciary", "question": "In January 2025, which of the following is NOT among the six cities where the Supreme Court of India\nbanned manual scavenging?", "options": {"A": "Delhi", "B": "Bengaluru", "C": "Jaipur", "D": "Chennai"}, "answer": "B", "explanation": "which included Delhi, Jaipur, Chennai, Mumbai, Kolkata, and Hyderabad. The ruling reinforced the Prohibition of\nEmployment as Manual Scavengers Act, 2013."}, {"id": 207, "topic": "Judiciary", "question": "In May 2025, the Supreme Court set aside which High Court order that had denied maternity leave to a\ngovernment school teacher for the birth of their third child?", "options": {"A": "Madras High Court", "B": "Delhi High Court", "C": "Calcutta High Court", "D": "Bombay High Court"}, "answer": "A", "explanation": "government school teacher for the birth of a third child. The judgment reaffirmed that maternity benefits are a\nfundamental aspect of women’s dignity and labour rights."}, {"id": 208, "topic": "Judiciary", "question": "What does the principle of victim-centric justice emphasize?", "options": {"A": "Emphasizing the rights of the victim, including speedy justice and rehabilitation", "B": "Prioritizing the media coverage of the case", "C": "Punishing the accused without trial", "D": "Allowing victims to determine the punishment\n\nAns:A\n\nExp:Victim-centric justice emphasizes protecting and prioritizing victims’ rights throughout the criminal justice\nprocess. This includes ensuring speedy trials, adequate compensation, rehabilitation support, protection from\nintimidation, and dignified treatment. Modern criminal justice systems increasingly focus on victim welfare\nalongside punishing offenders.\n\nKey Points:\n\n    •      Includes right to information, participation in proceedings, legal aid\n\n\n\n    •   Victim Compensation Scheme provides financial support\n    •   Protection of witnesses and victims from threats\n    •   New criminal laws (BNSS, BNS) have strengthened victim rights\n\n217.Which of the following statements regarding Article 124 of the Indian Constitution is correct?"}, "answer": "A", "explanation": "process. This includes ensuring speedy trials, adequate compensation, rehabilitation support, protection from\nintimidation, and dignified treatment. Modern criminal justice systems increasingly focus on victim welfare\nalongside punishing offenders.\n\nKey Points:\n\n    •      Includes right to information, participation in proceedings, legal aid\n\n\n\n    •   Victim Compensation Scheme provides financial support\n    •   Protection of witnesses and victims from threats\n    •   New criminal laws (BNSS, BNS) have strengthened victim rights\n\n217.Which of the following statements regarding Article 124 of the Indian Constitution is correct?\n\nA.The Supreme Court consists only of the Chief Justice of India and four other judges.\n\nB.A Supreme Court Judge holds office until the age of 62 years.\n\nC.The Supreme Court consists of the Chief Justice of India and such number of other judges as Parliament may\nprescribe.\n\nD.Supreme Court Judges are appointed directly by Parliament.\n\nAns:C\n\nExp:Article 124 – Establishment and Constitution of Supreme Court\n\nArticle 124(1): Establishes the Supreme Court of India.\n\n    •   It consists of the Chief Justice of India (CJI) and such number of other judges as Parliament may prescribe\n        by law.\n\nNote:The number of other Judges was increased from 33 to 37 by the Supreme Court (Number of Judges)\nAmendment Act, 2026.\n\nSupreme Court = 1 CJI + 37 other Judges = 38 total sanctioned strength.effect from June 1\n\nArticle 124(2): Supreme Court Judges are appointed by the President.\n\n    •   A Supreme Court Judge holds office until the age of 65 years.\n\nArticle 124(3): Provides the qualifications for appointment as a Supreme Court Judge.\n\nArticle 124(4): Provides the procedure for removal of a Supreme Court Judge on the ground of proved misbehaviour\nor incapacity.\n\nArticle 124(5): Parliament may regulate the procedure for investigation and proof of such misbehaviour or\nincapacity.\n\nQualifications – Article 124(3): A person must be a citizen of India and must have:\n\n    •   Been a High Court Judge for at least 5 years, OR\n    •   Been an advocate of a High Court for at least 10 years, OR\n    •   Be a distinguished jurist, in the opinion of the President."}, {"id": 209, "topic": "Judiciary", "question": "Which of the following correctly describes the removal procedure of a Supreme Court Judge?", "options": {"A": "The President can remove a Supreme Court Judge directly after receiving a complaint.", "B": "The Chief Justice of India can remove a Supreme Court Judge after an inquiry.", "C": "A Supreme Court Judge can be removed by the President only after both Houses of Parliament pass an address\nwith the required special majority for proved misbehaviour or incapacity.", "D": "The Supreme Court can remove one of its Judges by a two-thirds majority."}, "answer": "C", "explanation": "Grounds:A Judge can be removed only for:Proved misbehaviour, Incapacity\n\nProcedure\n\n    1.     Removal Motion:A notice of removal motion is given in Parliament.\n    •      Lok Sabha - 100 members must sign\n    •      Rajya Sabha - 50 members must sign\n    2.     Admission of Motion:The Speaker of Lok Sabha / Chairman of Rajya Sabha decides whether to admit the\n           motion.\n    3.     Inquiry Committee:After admission, a 3-member Inquiry Committee investigates the charges.\n    4.     Charges Proved:If the Committee finds the Judge guilty of proved misbehaviour or incapacity, the motion\n           proceeds further.\n    5.     Parliament’s Approval\n\nBoth Lok Sabha and Rajya Sabha must pass the removal address.\n\nEach House requires:\n\nMajority of total membership + 2/3 of members present and voting\n\n    6.     President’s Action\n\nAfter both Houses pass the address in the same session, it is presented to the President.\n\nThen the President issues the order of removal."}, {"id": 210, "topic": "Judiciary", "question": "Consider the following statements regarding the Oath and Salaries of Supreme Court Judges:\n\n1. Under Article 124(6), a Supreme Court Judge must take an oath or affirmation before entering office, according to\nthe form prescribed in the Third Schedule.\n\n2. Under Article 125, the salaries, allowances, leave and pension of Supreme Court Judges are determined by\nParliament by law, and their privileges, allowances and rights relating to leave and pension cannot be varied to their\ndisadvantage after appointment.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "•    Every person appointed as a Supreme Court Judge must take an oath or affirmation before entering office.\n    •    The oath is made before the President or a person appointed by the President.\n    •    The form of the oath is given in the Third Schedule.\n\nArticle 125 - Salaries, Allowances, Leave & Pension\n\nArticle 125(1) - Salary of Supreme Court Judges is determined by Parliament by law.\n\n    •    Until Parliament makes such a law, the salary specified in the Second Schedule applies.\n\nArticle 125(2) - Covers privileges, allowances, leave of absence and pension.\n\n    •    These rights are determined by Parliament by law.\n    •    After appointment, the privileges, allowances, and rights relating to leave and pension cannot be changed to\n         the Judge’s disadvantage."}, {"id": 211, "topic": "Judiciary", "question": "Who appoints the Chief Justice of India (CJI)?", "options": {"A": "Prime Minister of India", "B": "Chief Justice of India", "C": "President of India", "D": "Union Law Minister"}, "answer": "C", "explanation": "•    The Constitution does not specifically mention that the senior-most Judge must be appointed as CJI.\n    •    However, by established convention, the senior-most Supreme Court Judge considered suitable is normally\n         appointed as the CJI.\n    •    The outgoing CJI recommends the name of the senior-most suitable Judge.\n    •    The recommendation goes through the (Cabinet)Union Government, and the Prime Minister advises the\n         President.\n    •    Finally, the President makes the formal appointment."}, {"id": 212, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 124A, 124B and 124C:\n\n1. Article 124A provided for the establishment and composition of the National Judicial Appointments Commission\n(NJAC).\n\n2. Article 124B specified the functions of the NJAC, including recommending persons for appointment as Chief\nJustice of India and other Supreme Court and High Court Judges.\n\n3. Article 124C empowered Parliament to make laws regarding the procedure for appointment of Judges and the\nfunctions of the NJAC.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1, 2 and 3", "D": "1 and 3 only"}, "answer": "C", "explanation": "Judicial Appointments Commission (NJAC).\n\nArticle 124A - Composition of NJAC\n\n    •    Chief Justice of India – Chairperson\n    •    Two other senior Supreme Court Judges\n    •    Union Minister of Law and Justice\n    •    Two eminent persons\n\nArticle 124B -Functions of NJAC\n\n    •    Recommend persons for appointment as CJI and other Supreme Court Judges.\n    •    Recommend persons for appointment as Chief Justices and other Judges of High Courts.\n    •    Recommend transfer of Chief Justices and other High Court Judges.\n    •    Ensure that the recommended person has ability and integrity.\n\nArticle 124C - Parliament’s power\n\n    •    Parliament could make a law to regulate the procedure for appointment of Judges and the functions of the\n         NJAC.\n\n Note:The Supreme Court struck down the 99th Amendment and NJAC Act in 2015 as unconstitutional, holding that\nthey violated the Basic Structure, particularly judicial independence. Therefore, Articles 124A, 124B and 124C are\npresently inoperative."}, {"id": 213, "topic": "Judiciary", "question": "Which of the following correctly matches Articles 126, 127 and 128?", "options": {"A": "126 – Ad hoc Judges; 127 – Acting CJI; 128 – Retired Judges", "B": "126 – Acting CJI; 127 – Ad hoc Judges; 128 – Retired Judges", "C": "126 – Retired Judges; 127 – Ad hoc Judges; 128 – Acting CJI", "D": "126 – Acting CJI; 127 – Retired Judges; 128 – Ad hoc Judges"}, "answer": "B", "explanation": "Article 126 – Appointment of Acting Chief Justice of India\n\nIf the office of the Chief Justice of India (CJI) is vacant, or if the CJI is temporarily unable to perform the duties of\nthe office:\n\n\n\n    •      The President appoints another Judge of the Supreme Court as Acting CJI.\n    •      The appointed Judge performs the duties of the CJI until the new CJI takes charge or the CJI resumes\n           duties.\n\nArticle 127 – Appointment of Ad hoc Judges\n\nSometimes the Supreme Court may not have enough permanent Judges to constitute the required quorum.\n\nIn such a situation:\n\n    •      The Chief Justice of India may request a High Court Judge to sit as an ad hoc Judge of the Supreme Court.\n    •      The Judge must be qualified for appointment as a Supreme Court Judge.\n    •      Previous consent of the President is required.\n    •      The concerned High Court Chief Justice must also be consulted.\n    •      The High Court Judge, while sitting in the Supreme Court, has the jurisdiction, powers and privileges of a\n           Supreme Court Judge.\n\nArticle 128 – Attendance of Retired Judges at the sitting of the supreme court\n\nThe Supreme Court can also use the services of retired Judges.\n\nUnder Article 128:\n\n    •      The Chief Justice of India may request a retired Judge to sit and act as a Judge of the Supreme Court.\n    •      Previous consent of the President is required.\n    •      The retired Judge must also consent to sitting.\n    •      The person can be a former Supreme Court Judge or a former High Court Judge who is qualified to be\n           appointed as a Supreme Court Judge.\n    •      While sitting, the retired Judge gets the jurisdiction, powers and privileges of a Supreme Court Judge."}, {"id": 214, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 129 and 130 of the Indian Constitution:\n\n1. Under Article 129, the Supreme Court is a Court of Record and has the power to punish for contempt of itself.\n\n2. Under Article 130, the Supreme Court shall sit in Delhi, but the Chief Justice of India may appoint another place\nor places as its seat with the approval of the President.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "•      The proceedings and judgments of the Supreme Court are recorded and preserved permanently.\n    •      These records have evidentiary value and are recognised as authoritative legal records.\n\n\n\n    •    The authenticity of such records cannot ordinarily be questioned.\n\nThe Supreme Court has the power to punish for contempt of itself.\n\n    •    This power helps protect the authority and dignity of the Court.\n    •    Example:If a person wilfully disobeys an order of the Supreme Court, the Court can take contempt action\n         against that person.\n\nArticle 130 – Seat of Supreme Court\n\nArticle 130 deals with the seat of the Supreme Court.\n\n    •    The Supreme Court seated in Delhi.\n    •    The Chief Justice of India (CJI) may appoint another place or places as a seat of the Supreme Court, but\n         only with the approval of the President.\n    •    Therefore, the CJI cannot unilaterally change the seat of the Supreme Court."}, {"id": 215, "topic": "Judiciary", "question": "Which Article of the Indian Constitution deals with the Original Jurisdiction of the Supreme Court?", "options": {"A": "Article 131", "B": "Article 132", "C": "Article 136", "D": "Article 143"}, "answer": "A", "explanation": "Original jurisdiction means the Supreme Court can hear a case directly at the first instance, without the case first\nbeing decided by a lower court.\n\nUnder Article 131, the Supreme Court has exclusive original jurisdiction in disputes involving:\n\n    •    Government of India and one or more States\n    •    Government of India and one or more States on one side and one or more other States on the other side\n    •    Two or more States\n\nCondition\n\n    •    The dispute must involve a question of law or fact on which the existence or extent of a legal right depends.\n    •    So, every dispute between governments does not automatically come under Article 131.\n\nExclusive\n\nExclusive Original Jurisdiction means these specified disputes can be directly brought before the Supreme Court,\nand ordinary courts cannot exercise jurisdiction over them under Article 131.\n\nExceptions to original jurisdiction\n\n    •    Pre-Constitution treaties, agreements, covenants, etc. related disputes.\n    •    Inter-State water disputes covered under Article 262.\n\n\n\n    •    Matters referred to Finance Commission under Article 280.\n    •    Adjustment of certain expenses/revenues between Union and States where the Constitution provides a\n         specific mechanism.\n    •    Disputes relating to the use of resources/property where Parliament has provided another mechanism under\n         the Constitution/law.\n    •    Private individuals or private organisations cannot invoke Article 131; it is confined to disputes between\n         the Union and States or between States, involving a legal right."}, {"id": 216, "topic": "Judiciary", "question": "Consider the following statements regarding the Appellate Jurisdiction of the Supreme Court:\n\n1. Article 132 deals with appeals involving a substantial question of law relating to the interpretation of the\n\nConstitution.\n\n2. Article 133 deals with civil appeals involving a substantial question of law of general importance.\n\n3. Article 134 deals with criminal appeals in specified cases.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "decrees of lower courts, mainly High Courts.\n\nArticle 132 – Constitutional Matters\n\n    •    Deals with appeals involving a substantial question of law as to the interpretation of the Constitution.\n\n    •    Appeal can be made against a judgment, decree or final order of a High Court.\n\n    •    The High Court must certify that the case is fit for appeal to the Supreme Court.\n\nExamples: Fundamental Rights, interpretation of constitutional provisions, constitutional validity of a law.\n\n\n\nArticle 133 – Civil Matters\n\n    •      Deals with civil appeals from High Courts to the Supreme Court.\n\nThe High Court must certify that:\n\n    •      The case involves a substantial question of law of general importance, and\n\n    •      The question needs to be decided by the Supreme Court.\n\nExamples: Property/land disputes, contract disputes, money recovery, family or inheritance disputes.\n\nArticle 134 – Criminal Matters\n\n    •      Deals with criminal appeals to the Supreme Court in specified cases:\n\n    •      When the High Court reverses an acquittal and sentences the accused to death.\n\n    •      When the High Court withdraws a case from a subordinate court, tries it itself, convicts the accused\n\n           and sentences the accused to death.\n\n    •      Article 134(2): Parliament can provide additional criminal appellate powers to the Supreme Court by\n\n           law.\n\nExamples: Murder, theft, robbery, kidnapping, cheating and other offences."}, {"id": 217, "topic": "Judiciary", "question": "Consider the following statements regarding Article 134A of the Indian Constitution:\n\n1. Article 134A deals with the certificate for appeal to the Supreme Court from a High Court.\n\n2. The High Court may grant the certificate on its own motion or on an oral application by the aggrieved party\n\nimmediately after the judgment, decree or final order.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "•     Article 134A deals with the certificate required for an appeal to the Supreme Court under Article 132 or\n\n          Article 133.\n\n    •     After passing a judgment, decree or final order, the High Court considers whether the case is fit for\n\n          appeal to the Supreme Court.\n\n    •     The High Court can consider granting the certificate on its own motion.\n\n    •     It can also consider it when the aggrieved party makes an oral application immediately after the\n\n          decision.\n\n    •     If the requirements of Article 132 or Article 133 are satisfied, the High Court grants the certificate."}, {"id": 218, "topic": "Judiciary", "question": "Consider the following statements regarding Appeal by Special Leave under Article 136:\n\n1. Article 136 empowers the Supreme Court to grant Special Leave to Appeal against a judgment, order, decree\n\nor sentence of any court or tribunal in India.\n\n2. Granting Special Leave is a discretionary power of the Supreme Court and is not an automatic right of\n\nappeal.\n\n3. The power under Article 136 does not extend to courts or tribunals constituted under laws relating to the\n\nArmed Forces.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 136 gives the Supreme Court a special discretionary power to hear appeals.\n\n    •   A person can approach the Supreme Court against a judgment, decree, determination, sentence or\n\n        order passed by a court or tribunal in India.\n\n    •   The person first requests Special Leave to Appeal (SLP).\n\n    •   The Supreme Court examines the matter and may grant or refuse Special Leave.\n\n    •   If Special Leave is granted, the matter proceeds as an appeal before the Supreme Court.\n\n    •   Therefore, an SLP is not an automatic right of appeal; granting leave is entirely within the discretion of\n\n        the Supreme Court.\n\n    •   Article 136(2) specifically excludes courts or tribunals constituted under laws relating to the Armed\n\n        Forces."}, {"id": 219, "topic": "Judiciary", "question": "Which of the following best describes the Power of Judicial Review of the Supreme Court?", "options": {"A": "The power to make laws for Parliament and State Legislatures", "B": "The power to appoint all constitutional authorities", "C": "The power to examine the constitutional validity of laws and executive actions", "D": "The power to amend any provision of the Constitution"}, "answer": "C", "explanation": "Judicial Review means the power of the Supreme Court and High Courts to examine whether laws and\n\ngovernment actions are constitutional.\n\n    •   Laws: The Court can examine laws made by Parliament and State Legislatures.\n\n    •   Executive actions: The Court can check whether government decisions or actions violate the\n\n        Constitution or law.\n\n\n\n    •   Constitutional Amendments: The Supreme Court can examine constitutional amendments and strike\n\n        them down if they violate the Basic Structure of the Constitution.\n\n    •   If a law or action is found unconstitutional, the Court can declare it invalid to the extent of the violation.\n\n    •   Judicial Review helps maintain the supremacy of the Constitution and protects Fundamental Rights.\n\nConstitutional Basis\n\nJudicial Review is derived from several Articles, mainly:\n\n    •   Article 13 → Laws violating Fundamental Rights can be declared void.\n\n    •   Article 32 → Supreme Court can protect Fundamental Rights through writs.\n\n    •   Article 131 → Original jurisdiction in certain Centre–State/State–State disputes.\n\n    •   Article 132 → Appeals involving constitutional interpretation.\n\n    •   Article 226 → High Courts can exercise judicial review through writ jurisdiction."}, {"id": 220, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 135, 137 and 138 of the Indian Constitution:\n\n1. Article 135 continues certain jurisdiction and powers of the former Federal Court with the Supreme Court.\n\n2. Article 137 empowers the Supreme Court to review its own judgments or orders.\n\n3. Article 138 provides for the enlargement of the jurisdiction and powers of the Supreme Court by Parliament.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•   Before the Constitution, India had a Federal Court under the Government of India Act, 1935.\n\n\n\n    •    After the Constitution came into force, the Supreme Court replaced the Federal Court.\n\n    •    Article 135 allows the Supreme Court to continue certain jurisdiction and powers of the former Federal\n\n         Court.\n\n    •    These continue until Parliament provides otherwise.\n\nArticle 137 – Review of Judgments or Orders\n\n    •    Article 137 empowers the Supreme Court to review its own judgments or orders.\n\n    •    Thus, a person can seek a review of a Supreme Court judgment instead of treating the judgment as\n\n         completely unchangeable.\n\n    •    This is a limited power and is subject to Parliamentary law and Supreme Court rules.\n\nArticle 138 deals with the enlargement of the jurisdiction and powers of the Supreme Court.\n\n    •    Under Article 138(1), Parliament can enlarge the Supreme Court’s jurisdiction with respect to matters in\n\n         the Union List.\n\n    •    Under Article 138(2), Parliament can confer further jurisdiction and powers regarding any matter, if the\n\n         Government of India and the Government of any State agree through a special agreement.\n\n    •    Therefore, Article 138 allows the Supreme Court’s jurisdiction to be expanded beyond its existing\n\n         constitutional limits, subject to the conditions provided."}, {"id": 221, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 139, 139A and 140:\n\n1. Article 139 allows Parliament to confer additional writ powers on the Supreme Court.\n\n2. Article 139A deals with the transfer and withdrawal of certain cases by the Supreme Court.\n\n3. Article 140 allows Parliament to make laws giving the Supreme Court supplemental powers to help it\n\nexercise its jurisdiction effectively.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 139 – Additional Writ Powers\n\n    •   Article 32 → Supreme Court can issue writs for Fundamental Rights.\n\n    •   Article 139 → Parliament can give the Supreme Court additional power to issue directions, orders or\n\n        writs.\n\nThese writs can be for purposes other than the enforcement of Fundamental Rights.\n\nArticle 139A – Transfer of Cases\n\nArticle 139A gives the Supreme Court power to transfer or withdraw certain cases.\n\n    •   Withdraw cases to Supreme Court:If the same or substantially the same question of law is involved in\n\n        cases pending before different High Courts, the Supreme Court can withdraw those cases and decide\n\n        them itself.\n\n    •   Transfer cases between High Courts:If the Supreme Court considers it necessary for the ends of\n\n        justice, it can transfer a case from one High Court to another High Court.\n\nArticle 140 – Supplemental Powers\n\n    •   Article 140 allows Parliament to make laws giving the Supreme Court additional/supplemental powers.\n\n    •   These powers help the Supreme Court exercise its jurisdiction more effectively.\n\n    •   The powers given must be consistent with the Constitution."}, {"id": 222, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 141, 145 and 146:\n\n1. Article 141 provides that the law declared by the Supreme Court is binding on all courts in India.\n\n\n\n2. Article 145 deals with the rules of the Supreme Court, including rules relating to its practice and procedure.\n\n3. Article 146 deals with the officers and servants of the Supreme Court, including their appointment and\n\nconditions of service.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 141 – Law Declared by Supreme Court\n\n    •    The law declared by the Supreme Court is binding on all courts in India.\n\n    •    This means High Courts and lower courts must follow the legal principles laid down by the Supreme\n\n         Court.\n\n    •    It ensures uniformity in the interpretation and application of law across the country.\n\nArticle 145 – Rules of Supreme Court\n\n    •    Article 145 gives the Supreme Court power to make rules for regulating its practice and procedure.\n\n    •    The rules are made with the approval of the President.\n\n    •    The Supreme Court can make rules regarding matters such as:\n\n    o    Persons entitled to practice before the Court.\n\n    o    Procedure for hearing cases.\n\n    o    Conditions for exercising powers under Article 139A.\n\n    o    Review of judgments under Article 137.\n\n    •    Rules made under Article 145 must be consistent with the Constitution and laws made by Parliament.\n\n\n\n    •    Matters involving a substantial question of constitutional interpretation require a bench of at least 5\n\n         Judges under Article 145(3).\n\nArticle 146 – Officers and Servants of Supreme Court\n\n    •    The Chief Justice of India has the power to appoint officers and servants of the Supreme Court, or\n\n         another Judge/officer as directed by the CJI.\n\n    •    The conditions of service of these employees are prescribed by rules made by the CJI or by a person\n\n         authorised by the CJI.\n\n    •    Rules relating to salaries, allowances, leave or pension require the approval of the President.\n\n    •    The administrative expenses of the Supreme Court, including salaries and allowances of its officers and\n\n         servants, are charged on the Consolidated Fund of India."}, {"id": 223, "topic": "Judiciary", "question": "Consider the following statements regarding the High Courts under Articles 214, 216 and 217:\n\n1. Article 214 provides for a High Court for each State.\n\n2. Article 216 provides for the composition of a High Court.\n\n3. Article 217 deals with the appointment and conditions of office of High Court Judges.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Provides for a High Court for each State.\n    •    Parliament can establish a common High Court for two or more States or for two or more States and a\n         Union Territory under Article 231.\n\nArticle 216 – Constitution of High Court\n\n    •    A High Court consists of a Chief Justice and such other Judges as the President may deem necessary.\n    •    The Constitution does not fix a specific number of Judges for each High Court.\n\nArticle 217 – Appointment and Conditions of Office\n\n    •    High Court Judges are appointed by the President.\n\n\n\n    •    The President consults the Chief Justice of India, Governor of the concerned State, and, for a Judge other\n         than the Chief Justice, the Chief Justice of that High Court.\n    •    A person must be a citizen of India and must have either 10 years of judicial office or 10 years as an\n         advocate of a High Court/High Courts.\n    •    A High Court Judge holds office until the age of 62 years.\n    •    A Judge may resign by writing to the President."}, {"id": 224, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 218, 219, 220 and 221 of the Indian Constitution:\n\n1. Article 218 applies certain provisions relating to the removal of Supreme Court Judges to High Court Judges.\n\n2. Article 219 deals with the oath or affirmation of High Court Judges.\n\n3. Article 220 restricts the practice of a person who has been a permanent Judge of a High Court.\n\n4. Article 221 deals with the salaries and allowances of High Court Judges.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "2, 3 and 4 only", "C": "1, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Article 218 makes certain provisions of Article 124(4) and 124(5) applicable to High Court Judges.\n    •    Therefore, the procedure for removal of a High Court Judge is similar to that of a Supreme Court Judge.\n    •    A High Court Judge can be removed only for proved misbehaviour or incapacity.\n    •    The removal involves an address by both Houses of Parliament with the required special majority, followed\n         by an order of the President.\n\nArticle 219 – Oath or Affirmation\n\n    •    Every person appointed as a High Court Judge must take an oath or affirmation before entering office.\n    •    The oath is made before the Governor of the State or a person appointed by the Governor.\n    •    The form of oath is given in the Third Schedule.\n\nArticle 220 – Restriction on Practice\n\nA person who has been a permanent Judge of a High Court cannot plead or act in any court or before any authority\nin India after retirement.\n\nException: They can practice before the Supreme Court and other High Courts.\n\nThis restriction is intended to maintain the independence and dignity of the judiciary.\n\nArticle 221 – Salaries and Allowances\n\n\n\n    •    Article 221 deals with the salary and allowances of High Court Judges.\n    •    These are determined by Parliament by law.\n    •    Their allowances, privileges and rights relating to leave or pension cannot be varied to their disadvantage\n         after appointment, subject to the Constitution."}, {"id": 225, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 225 and 226 of the Indian Constitution:\n\n1. Article 225 deals with the jurisdiction and powers of existing High Courts.\n\n2. Article 226 empowers High Courts to issue writs for the enforcement of Fundamental Rights and for other\npurposes.\n\n3. The writ jurisdiction of High Courts under Article 226 is wider than that of the Supreme Court under Article 32.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 225 deals with the jurisdiction and powers of existing High Courts.\n\n    •    It continues the jurisdiction and powers that existing High Courts had before the Constitution, subject to the\n         Constitution and laws made by the competent legislature.\n    •    It does not create a new High Court; it mainly deals with the continuation of existing jurisdiction.\n\nArticle 226 – Writ Jurisdiction\n\n    •    Article 226 gives High Courts the power to issue writs, directions and orders.\n    •    The five writs are Habeas Corpus, Mandamus, Prohibition, Certiorari and Quo Warranto.\n\nWrits can be issued for:\n\n    •    Enforcement of Fundamental Rights, and\n    •    Any other purpose (other legal rights).\n\nTherefore, Article 226 is wider in scope than Article 32 of the Supreme Court."}, {"id": 226, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 227, 228 and 229 of the Indian Constitution:\n\n1. Article 227 gives the High Court the power of superintendence over courts and tribunals within its jurisdiction.\n\n2. Article 228 allows the High Court to withdraw certain cases involving a substantial constitutional question from a\nsubordinate court.\n\n\n\n3. Article 229 deals with the officers and servants of the High Court.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Every High Court has superintendence over all courts and tribunals within its territorial jurisdiction.\n    •    The High Court can call for returns, make rules and prescribe forms for regulating the practice and\n         proceedings of subordinate courts.\n    •    This power does not extend to Armed Forces courts or tribunals.\n\nArticle 228 – Transfer of Constitutional Cases\n\n    •    If a case pending before a subordinate court involves a substantial question of law as to the interpretation of\n         the Constitution, the High Court can withdraw the case.\n    •    The High Court can decide the case itself, or decide the constitutional question and return the case to the\n         subordinate court.\n\nArticle 229 – Officers & Servants\n\n    •    The Chief Justice of the High Court has the power to appoint officers and servants of the High Court.\n    •    The Chief Justice also controls their conditions of service, subject to constitutional provisions.\n    •    Rules regarding salaries, allowances, leave or pension require the Governor’s approval where prescribed."}, {"id": 227, "topic": "Judiciary", "question": "Consider the following statements regarding Articles 230 and 231 of the Indian Constitution:\n\n1. Article 230 empowers Parliament to extend the jurisdiction of a High Court to a Union Territory.\n\n2. Article 230 also allows Parliament to exclude the jurisdiction of a High Court from a Union Territory.\n\n3. Article 231 provides for a common High Court for two or more States or for two or more States and a Union\nTerritory.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Parliament can, by law, extend the jurisdiction of a High Court to a Union Territory.\n    •    Parliament can also exclude the jurisdiction of a High Court from a Union Territory.\n\nExample:\n\nParliament can provide by law that a particular High Court will exercise jurisdiction over a particular Union\nTerritory.\n\nArticle 231 – Common High Court\n\nParliament can establish a common High Court for:\n\n    •    Two or more States, OR\n    •    Two or more States and a Union Territory.\n    •    The same High Court can therefore serve more than one State/UT."}, {"id": 228, "topic": "Centre-State Relations", "question": "How are Centre-State Relations broadly classified under the Indian Constitution?", "options": {"A": "Legislative, Administrative and Financial Relations", "B": "Executive, Judicial and Electoral Relations", "C": "Legislative, Judicial and Emergency Relations", "D": "Financial, Electoral and Constitutional Relations"}, "answer": "A", "explanation": "•    Legislative Relations – Deal with the distribution of legislative powers between the Union and the States.\n         Covered under Part XI, Articles 245–255.\n    •    Administrative Relations – Deal with administrative relations and coordination between the Union and\n         States. Covered under Part XI, Articles 256–263.\n    •    Financial Relations – Deal with distribution of financial resources, taxation and grants between the Union\n         and States. Covered under Part XII, Articles 268–293."}, {"id": 229, "topic": "Centre-State Relations", "question": "Which of the following correctly represents the four aspects of Legislative Relations between the Union and\nthe States?", "options": {"A": "Territorial extent of laws, distribution of legislative subjects, Parliament’s power to legislate on State matters, and\nCentre’s control over State Legislature", "B": "Financial relations, administrative relations, judicial relations, and emergency provisions", "C": "Distribution of taxes, appointment of Governors, judicial review, and inter-State disputes", "D": "Fundamental Rights, DPSP, elections, and emergency provisions"}, "answer": "A", "explanation": "1.Territorial extent of laws – Article 245\n\n2.Distribution of legislative subjects – Articles 246 & 246A\n\n3.Parliament’s power to legislate on State matters – Articles 249–253\n\n4.Centre’s control over State Legislature – Articles 254–255"}, {"id": 230, "topic": "Centre-State Relations", "question": "Which of the following statements is correct regarding Article 245?", "options": {"A": "Parliament can make laws only for the whole of India.", "B": "State Legislature can make laws for any State in India.", "C": "Parliament can make laws for the whole or any part of India, while a State Legislature can make laws for the\nwhole or any part of its State.", "D": "A Parliamentary law is invalid if it has extra-territorial operation."}, "answer": "C", "explanation": "Article 245(1):\n\n    •    Parliament can make laws for the whole or any part of India.\n    •    A State Legislature can make laws for the whole or any part of that State.\n\nArticle 245(2):\n\n    •    A law made by Parliament cannot be considered invalid merely because it has extra-territorial operation.\n    •    In simple words, a Parliamentary law may have effects outside India and it is not invalid merely for that\n         reason."}, {"id": 231, "topic": "Centre-State Relations", "question": "Which of the following correctly describes Article 246 of the Indian Constitution?", "options": {"A": "Article 246 deals with the distribution of legislative powers between Parliament and State Legislatures through\nthe Union List, State List and Concurrent List.", "B": "Article 246 gives Parliament exclusive power over all subjects in the State List.", "C": "Article 246 deals only with the distribution of financial resources between the Union and States.", "D": "Article 246 gives State Legislatures exclusive power over all residuary subjects."}, "answer": "A", "explanation": "Article 246 distributes legislative powers between Parliament and State Legislatures through the Seventh Schedule.\n\nUnion List – List I\n\n    •    Parliament has exclusive power to make laws on subjects in the Union List.\n\n\n\n    •    97 entries originally; 98 at present (commonly counted entries).\n    •    Important subjects: Defence, Foreign Affairs, Citizenship, Railways, Banking, Currency, Atomic Energy,\n         Posts and Telegraphs, Foreign Trade, Inter-State Trade, Census, Union Public Services and Supreme Court.\n\nState List – List II\n\n    •    State Legislatures normally have exclusive power to make laws on subjects in the State List.\n    •    66 entries originally; 59 at present (commonly counted entries).\n    •    Important subjects: Public Order, Police, Public Health, Agriculture, Local Government, Land, Fisheries,\n         Markets and Fairs, Betting and Gambling, State Public Services.\n\nConcurrent List – List III\n\n    •    Both Parliament and State Legislatures can make laws.\n    •    47 entries originally; 52 at present.\n    •    Important subjects: Criminal Law, Criminal Procedure, Civil Procedure, Marriage and Divorce, Adoption,\n         Succession, Contracts, Forests, Education, Labour Welfare, Electricity and Factories.\n\nNote: In case of conflict between a Parliamentary law and a State law on a Concurrent List subject, the\nParliamentary law generally prevails under Article 254, subject to the constitutional exception for a State law\nreserved for and receiving Presidential assent."}, {"id": 232, "topic": "Centre-State Relations", "question": "Consider the following statements regarding Articles 246A and 248:\n\n1. Article 246A deals with the legislative powers relating to Goods and Services Tax (GST).\n\n2. Parliament has exclusive power to make laws relating to GST on inter-State supplies.\n\n3. Article 248 gives Parliament exclusive power over residuary matters.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 246A – Special Provision for GST\n\n    •    Article 246A was inserted by the 101st Constitutional Amendment Act, 2016.\n    •    It gives Parliament and State Legislatures power to make laws relating to GST.\n    •    However, Parliament has exclusive power to make laws relating to GST where the supply takes place in the\n         course of inter-State trade or commerce.\n    •    Thus, GST has a special legislative arrangement and does not simply follow the normal\n         Union/State/Concurrent List arrangement.\n\nArticle 248 – Residuary Legislative Powers\n\n    •    Residuary matters are subjects not enumerated in the State List or Concurrent List.\n\n\n\n    •    Under Article 248, Parliament has exclusive power to make laws on residuary matters.\n    •    This also includes the power to impose a tax not mentioned in either List II or List III."}, {"id": 233, "topic": "Centre-State Relations", "question": "Parliament wants to establish an additional court for the better administration of laws made by it on matters\nwithin the Union List. Which constitutional provision enables Parliament to do so?", "options": {"A": "Article 245", "B": "Article 247", "C": "Article 248", "D": "Article 249"}, "answer": "B", "explanation": "Article 247 – Additional Courts\n\n    •    It empowers Parliament to establish additional courts for the better administration of laws made by\n         Parliament or of existing laws relating to matters in the Union List.\n    •    The purpose is to ensure the effective administration and implementation of Parliamentary laws.\n    •    This power belongs specifically to Parliament.\n    •    Example: If effective implementation of a Parliamentary law requires an additional court, Parliament can\n         establish such a court under Article 247."}, {"id": 234, "topic": "Centre-State Relations", "question": "Parliament can enter the State List under special constitutional situations. Which of the following is correctly\nmatched?", "options": {"A": "Article 249 – National Interest; Article 250 – National Emergency", "B": "Article 249 – President’s Rule; Article 250 – Financial Emergency", "C": "Article 249 – International Agreements; Article 250 – Two or more States request", "D": "Article 249 – National Emergency; Article 250 – National Interest"}, "answer": "A", "explanation": "Article 249 – Parliament’s Power in National Interest\n\n    •    Normally, State List subjects are under the legislative power of State Legislatures.\n    •    As an exception, Parliament can make laws on a State List subject when the Rajya Sabha considers it\n         necessary in the national interest.\n    •    The Rajya Sabha must pass a resolution by a two-thirds majority of members present and voting.\n    •    The resolution remains in force for one year.\n    •    It can be renewed for further periods of one year at a time.\n    •    A law made by Parliament under Article 249 continues to operate even after the resolution expires, but not\n         beyond six months after its expiry.\n\n\n\nArticle 250 – During National Emergency\n\n    •    During a Proclamation of Emergency under Article 352, Parliament gets the power to make laws on any\n         matter in the State List.\n    •    This power is available throughout the territory of India or in any part of it, as applicable.\n    •    Unlike Article 249, no Rajya Sabha resolution is required.\n    •    A law made under Article 250 ceases to have effect six months after the Emergency ceases to operate.\n    •    However, anything already done or omitted under that law remains valid."}, {"id": 235, "topic": "Centre-State Relations", "question": "Which of the following situations correctly explains when Parliament can make laws on matters in the State\nList under Articles 251 and 252?", "options": {"A": "A Parliamentary law made under Article 249 or 250 prevails over an inconsistent State law under Article 251,\nwhile Article 252 allows Parliament to legislate when two or more States request it.", "B": "Article 251 allows Parliament to legislate on any State List matter without conditions, while Article 252 applies\nonly during a National Emergency.", "C": "Article 251 deals with international treaties, while Article 252 allows Parliament to legislate on State List matters\nduring President’s Rule.", "D": "Article 251 gives States priority over Parliamentary laws, while Article 252 requires approval of the Rajya Sabha\nby a two-thirds majority."}, "answer": "A", "explanation": "Article 251 – Inconsistency between Parliamentary and State Laws\n\n    •    It deals with conflict between a Parliamentary law made under Article 249 or Article 250 and a law made\n         by a State Legislature.\n    •    In case of inconsistency, the Parliamentary law prevails.\n    •    The State law is not permanently invalid; it can operate to the extent that it is not inconsistent with the\n         Parliamentary law.\n    •    This provision ensures that Parliament’s law prevails when it has legislated on a State List matter under\n         national interest or during a National Emergency.\n\nArticle 252 – Legislation for Two or More States\n\n    •    Parliament can make a law on a State List subject when two or more State Legislatures pass resolutions\n         requesting Parliament to make such a law.\n    •    Other States can adopt the same law later by passing similar resolutions.\n    •    Once Parliament makes such a law, only Parliament can amend or repeal it; the concerned State Legislature\n         cannot independently do so.\n    •    This provision is based on the consent of the States, unlike Article 249 or 250."}, {"id": 236, "topic": "Centre-State Relations", "question": "Consider the following situations:\n\n1. Parliament makes a law to implement an international treaty.\n\n\n\n2. A State law conflicts with a Parliamentary law on a Concurrent List subject.\n\n3. A law requires a recommendation, sanction or previous consent, but the required recommendation or consent was\nnot obtained.\n\nWhich Articles deal with these situations respectively?", "options": {"A": "253, 254 and 255", "B": "254, 253 and 255", "C": "255, 254 and 253", "D": "253, 255 and 254"}, "answer": "A", "explanation": "Article 253 – International Agreements\n\n    •    Parliament has the power to make laws for implementing treaties, agreements and conventions with foreign\n         countries.\n    •    It can make such laws even if the subject normally falls within the State List.\n    •    It also covers decisions made at an international conference, association or other body.\n    •    Therefore, Article 253 is an important exception to the normal distribution of legislative powers.\n\nArticle 254 – Inconsistency between Central and State Laws\n\n    •    Applies mainly to conflicts between Parliamentary and State laws on Concurrent List subjects.\n    •    Generally, when there is a conflict, the Parliamentary law prevails and the State law becomes inoperative to\n         the extent of inconsistency.\n    •    Exception: If a State law has been reserved for the consideration of the President and has received\n         Presidential assent, it can prevail in that State.\n    •    However, Parliament can later override such a State law by making another law.\n\nArticle 255 – Requirements as to Recommendations and Previous Sanctions\n\n    •    Certain Bills require a recommendation, sanction or previous consent under the Constitution.\n    •    Article 255 provides that failure to obtain such recommendation, sanction or previous consent does not by\n         itself invalidate the Act, if the required consent is subsequently given in accordance with the Constitution.\n    •    Thus, Article 255 mainly deals with procedural requirements, not the distribution of legislative power."}, {"id": 237, "topic": "Centre-State Relations", "question": "Which of the following correctly explains the constitutional obligations of the States and the Union in their\nadministrative relations?", "options": {"A": "States are free to disregard Parliamentary laws within their territory, while the Union has no constitutional\nresponsibility towards the States.", "B": "The Union can take over the administration of any State whenever it considers the State Government inefficient.", "C": "States must ensure compliance with laws made by Parliament, while the Union has a constitutional duty to\nprotect States and ensure that their governments are carried on in accordance with the Constitution.", "D": "The Union and States have identical administrative powers and no constitutional obligations towards each other."}, "answer": "C", "explanation": "•    Every State must exercise its executive power to ensure compliance with laws made by Parliament and\n         existing laws applicable in the State.\n    •    The Union can give directions to a State for this purpose.\n\nArticle 257 – State should not obstruct the Union\n\n    •    State executive power must not impede or prejudice the exercise of Union executive power.\n    •    The Union can issue directions to States in certain specified matters.\n\nArticle 355 – Obligation of the Union The Union has
