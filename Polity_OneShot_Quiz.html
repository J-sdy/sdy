be prosecuted and punished for the same offence more\n           than once.\n    •      Article 20(3) – Self-Incrimination: An accused person cannot be compelled to be a witness against\n           himself/herself.\n           Example:A person accused of theft cannot be forced to give a statement admitting that he committed the\n           theft."}, {"id": 70, "topic": "Fundamental Rights", "question": "Which of the following best explains Article 21 of the Indian Constitution?", "options": {"A": "It protects only the physical existence of a person and does not include personal liberty.", "B": "It guarantees the Right to Life and Personal Liberty and protects a person from deprivation except according to a\nprocedure established by law.", "C": "It guarantees the Right to Property as a Fundamental Right.", "D": "It protects only Indian citizens from arbitrary arrest."}, "answer": "B", "explanation": "Article 21 states that no person shall be deprived of life or personal liberty except according to procedure established\nby law.\n\n    •    It is available to all persons, including citizens and foreigners.\n    •    The Supreme Court has interpreted “life” as more than mere physical existence; it includes the right to live\n         with human dignity.\n    •    Personal liberty protects individuals from arbitrary interference with their freedom.\n    •    In Maneka Gandhi v. Union of India (1978), the Supreme Court held that the procedure under Article 21\n         must be fair, just and reasonable.\n    •    Various rights have been read into Article 21, including Right to Privacy, Right to Livelihood, Right to\n         Clean Environment, Right to Legal Aid and Right to Speedy Trial."}, {"id": 71, "topic": "Fundamental Rights", "question": "Through which Constitutional Amendment was Article 21A introduced, mandating free and compulsory\neducation as a Fundamental Right for children between 6 and 14 years of age?", "options": {"A": "42nd Amendment Act", "B": "86th Amendment Act", "C": "93rd Amendment Act", "D": "44th Amendment Act"}, "answer": "B", "explanation": "Right for children aged 6 to 14 years. It requires the State to provide such education as determined by law. This led\nto the Right to Education Act, 2009, which implemented this right in practice"}, {"id": 72, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 22 of the Indian Constitution?", "options": {"A": "It deals only with preventive detention and provides no protection against ordinary arrest.", "B": "It provides safeguards against arrest and detention, while also laying down special provisions relating to\npreventive detention.", "C": "It provides the Right to Education for children aged 6–14 years.", "D": "It protects a person from conviction under an ex-post-facto law."}, "answer": "B", "explanation": "Article 22 provides certain safeguards to a person who is arrested or detained.\n\nFor ordinary arrest – Article 22(1) & 22(2)\n\n    •    22(1) → The arrested person must be informed of the grounds of arrest.\n    •    The person has the right to consult and be defended by a legal practitioner of their choice.\n    •    22(2) → The arrested person must be produced before the nearest magistrate within 24 hours of arrest,\n         excluding the time necessary for the journey.\n    •    Detention beyond 24 hours requires the authority of a magistrate.\n\nExceptions – Article 22(3)\n\nThese safeguards under 22(1) and 22(2) do not apply to:\n\n    •    Enemy aliens\n    •    Persons arrested or detained under preventive detention laws.\n\nPreventive Detention – Article 22(4)–22(7)\n\n    •    Preventive detention means detaining a person to prevent possible future harmful acts, not as punishment\n         for a past offence.\n    •    Detention beyond 3 months generally requires the opinion of an Advisory Board, subject to constitutional\n         provisions and Parliament’s law.\n    •    The Constitution provides safeguards regarding grounds of detention, representation and Advisory Boards.\n\nArrest – Generally connected with an alleged offence that has already occurred.\n\nPreventive Detention – Detention in advance to prevent a possible future harmful act."}, {"id": 73, "topic": "Fundamental Rights", "question": "Consider the following statements regarding Articles 23 and 24 of the Indian Constitution:\n\n1.Article 23 prohibits traffic in human beings, begar and other similar forms of forced labour.\n\n2.Article 23(2) permits compulsory service for public purposes, but prohibits discrimination on grounds only of\nreligion, race, caste or class.\n\n3.Article 24 prohibits the employment of children below 14 years in factories, mines or other hazardous\nemployment.\n\n4.The protections under Articles 23 and 24 are available only to Indian citizens.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "B", "explanation": "•    Article 23(1) → Prohibits traffic in human beings, begar and other similar forms of forced labour.\n    •    Article 23(2) → State can impose compulsory service for public purposes, but cannot discriminate only on\n         the grounds of religion, race, caste or class.\n    •    Article 23 can operate against both the State and private individuals.\n\nIt protects all persons, not only citizens.\n\nArticle 24 – Prohibition of Child Labour\n\n    •    Prohibits employment of a child below 14 years in factories, mines or other hazardous employment\n         (Construction works ,railways etc)\n    •    It protects children from hazardous and exploitative labour.\n    •    Article 24 is also not restricted only to citizens."}, {"id": 74, "topic": "Fundamental Rights", "question": "Which of the following are included within the meaning of “traffic in human beings” under Article 23?\n\n1.Buying and selling of human beings\n\n2.Trafficking persons for prostitution or commercial sexual exploitation\n\n3.Slavery and similar forms of exploitation\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2 and 3", "D": "1 and 3"}, "answer": "B", "explanation": "“Traffic in human beings” refers to the trade, recruitment, transportation, transfer or exploitation of persons for\nunlawful or exploitative purposes.\n\n    •    Buying and selling of persons – Human trafficking.\n    •    Trafficking for prostitution/commercial sexual exploitation – Human trafficking.\n    •    Slavery and similar exploitation – Covered as forms of exploitation prohibited under Article 23.\n    •    Begar/forced labour – Separately prohibited under Article 23(1)"}, {"id": 75, "topic": "Fundamental Rights", "question": "Which Act was enacted to prevent immoral traffic and commercial sexual exploitation and is related to the\nprohibition of human trafficking under Article 23?", "options": {"A": "Protection of Civil Rights Act, 1955", "B": "Immoral Traffic (Prevention) Act, 1956", "C": "Child Labour (Prohibition and Regulation) Act, 1986", "D": "Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act, 1989"}, "answer": "B", "explanation": "•    Originally called the Suppression of Immoral Traffic in Women and Girls Act, 1956 (SITA).\n    •    It was renamed the Immoral Traffic (Prevention) Act, 1956 (ITPA) in 1986.\n    •    It aims to prevent and punish immoral traffic and commercial sexual exploitation.\n    •    It contains provisions dealing with activities such as keeping brothels, procuring persons, and living on the\n         earnings of prostitution, subject to the Act.\n    •    It is an important law connected with Article 23, which prohibits traffic in human beings."}, {"id": 76, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 25 of the Indian Constitution?", "options": {"A": "It gives every religious denomination the right to manage its own religious affairs.", "B": "It guarantees to all persons freedom of conscience and the right to profess, practise and propagate religion, subject\nto constitutional restrictions.", "C": "It prohibits the State from imposing any tax whatsoever on religious institutions.", "D": "It prohibits religious instruction in all educational institutions."}, "answer": "B", "explanation": "Article 25 guarantees freedom of conscience and the right of every person to profess, practise and propagate\nreligion.\n\n    •    Freedom of conscience → Freedom to hold, change or follow one’s religious beliefs.\n    •    Profess → To declare or openly express one’s religious beliefs.\n    •    Practise → To follow and perform religious practices and rituals.\n    •    Propagate → To spread or communicate one’s religious beliefs to others.\n\nImportant Restrictions:Article 25 is not an absolute right. It is subject to:Public order, Morality,Health &Other\nprovisions of Part III\n\n    •    The State can also regulate secular activities associated with religious practices and can make laws for\n         social welfare and reform."}, {"id": 77, "topic": "Fundamental Rights", "question": "Which of the following pairs relating to Articles 26, 27 and 28 of the Indian Constitution is/are correctly\nmatched?\n\n1.Article 26 – Freedom to manage religious affairs\n\n2.Article 27 – Freedom from payment of taxes for promotion of a particular religion\n\n3.Article 28 – Freedom from religious instruction in certain educational institutions", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 26 – Freedom to Manage Religious Affairs\n\nEvery religious denomination or any section thereof has the right to:\n\n    •      Establish and maintain institutions for religious and charitable purposes.\n    •      Manage its own affairs in matters of religion.\n    •      Own and acquire movable and immovable property.\n    •      Administer such property according to law.\n\nThese rights are subject to public order, morality and health.\n\nArticle 27 – Freedom from Religious Taxation\n\n    •      No person can be compelled to pay a tax, the proceeds of which are specifically appropriated for the\n           promotion or maintenance of any particular religion or religious denomination.\n    •      It prevents the State from favouring, patronising or supporting one religion over another through taxation.\n    •      However, general taxes imposed for public purposes are not prohibited merely because some benefit may\n           indirectly reach religious institutions.\n\nArticle 28 – Religious Instruction in Educational Institutions\n\n    •      Article 28(1) → No religious instruction in educational institutions wholly maintained out of State funds.\n    •      Article 28(2) → Exception for institutions administered by the State but established under an endowment or\n           trust requiring religious instruction.\n    •      Article 28(3) → No person attending a State-recognised or State-aided educational institution can be\n           required to participate in religious instruction or worship without consent. For a minor, guardian’s consent\n           is required."}, {"id": 78, "topic": "Fundamental Rights", "question": "Which of the following correctly describes the Cultural and Educational Rights guaranteed under Articles 29\nand 30 of the Indian Constitution?", "options": {"A": "Article 29 protects the interests of minorities only, while Article 30 applies to all citizens.", "B": "Article 29 protects the language, script and culture of a section of citizens, while Article 30 gives religious and\nlinguistic minorities the right to establish and administer educational institutions of their choice.", "C": "Article 29 deals with religious freedom, while Article 30 deals with freedom from religious taxation.", "D": "Both Articles 29 and 30 deal only with reservation in government educational institutions."}, "answer": "B", "explanation": "Article 29 – Protection of Language, Script and Culture\n\n    •    Article 29(1) → Any section of citizens having a distinct language, script or culture has the right to\n         conserve it.\n    •    Article 29(2) → No citizen can be denied admission into an educational institution maintained by the State\n         or receiving State aid only on grounds of religion, race, caste, language or any of them.\n\nImportant: Article 29 is not limited to minorities; any section of citizens with a distinct language, script or culture\ncan claim Article 29(1).\n\nArticle 30 – Rights of Minorities\n\n    •    Article 30(1) → Religious and linguistic minorities have the right to establish and administer educational\n         institutions of their choice.\n    •    Article 30(2) → The State cannot discriminate against an educational institution while granting aid merely\n         because it is under the management of a religious or linguistic minority.\n\nThe purpose is to protect the educational and cultural identity of minorities."}, {"id": 79, "topic": "Fundamental Rights", "question": "Which of the following correctly explains the present status of Article 31 of the Indian Constitution?", "options": {"A": "Article 31 continues to protect the Right to Property as a Fundamental Right.", "B": "Article 31 was repealed completely by the 44th Amendment and has no constitutional relevance today.", "C": "Article 31 dealt with the Right to Property as a Fundamental Right, but it was removed from Part III by the 44th\nConstitutional Amendment Act, 1978.", "D": "Article 31 deals with the Right to Education."}, "answer": "C", "explanation": "•    Originally, Article 31 guaranteed the Right to Property as a Fundamental Right.\n    •    It protected a person’s property from being acquired by the State except according to constitutional\n         provisions.\n    •    The 44th Constitutional Amendment Act, 1978 removed the Right to Property from the list of Fundamental\n         Rights.\n    •    Article 31 was omitted from Part III of the Constitution.\n    •    The Right to Property is now a constitutional/legal right under Article 300A.\n    •    Article 300A states that no person shall be deprived of his property save by authority of law."}, {"id": 80, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 32 of the Indian Constitution?", "options": {"A": "It provides the Right to Equality before law.", "B": "It provides the Right to Constitutional Remedies, allowing a person to approach the Supreme Court for\nenforcement of Fundamental Rights.", "C": "It deals with the abolition of untouchability.", "D": "It provides the Right to Property as a Fundamental Right."}, "answer": "B", "explanation": "•    Article 32 guarantees the right to move the Supreme Court for the enforcement of Fundamental Rights.\n    •    Dr. B.R. Ambedkar called Article 32 the “heart and soul of the Constitution.”\n    •    The Supreme Court can issue five types of writs:Habeas Corpus , Mandamus, Prohibition ,Certiorari &\n         Quo Warranto → Questions the legal authority of a person occupying a public office.\n    •    Under Article 32(3), Parliament may empower other courts to exercise these powers.\n    •    During an Emergency, the President may suspend the right to move courts for enforcement of specified\n         Fundamental Rights under Article 359, subject to constitutional limitations."}, {"id": 81, "topic": "Fundamental Rights", "question": "Which of the following pairs relating to the writs issued by the Supreme Court under Article 32 are correctly\nmatched?\n\n1.Habeas Corpus – Protection against unlawful detention\n\n2.Mandamus – Command to perform a public/legal duty\n\n3.Prohibition – Preventing a lower court or tribunal from exceeding its jurisdiction\n\n4.Quo Warranto – Questioning the legal authority of a person holding a public office", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    A writ is a formal direction issued by a constitutional court to protect rights or ensure that a person or\n         authority acts according to law.\n\nUnder Article 32, the Supreme Court has the power to issue five types of writs for the enforcement of Fundamental\nRights.\n\n1.Habeas Corpus\n\n    •    Meaning: “To have the body.”\n    •    It is mainly used to protect a person against unlawful detention.\n    •    The court can order the person having custody to produce the detained person before the court.\n    •    If the court finds that the detention is unlawful, it can order the person’s release.\n    •    It can be issued against State authorities and, in appropriate cases, even against private individuals.\n\n2.Mandamus\n\n    •    Meaning: “We command.”\n\n\n\n    •    It is a command issued by a court directing a public authority to perform a legal/public duty.\n    •    It is issued when the authority has failed or refused to perform a duty required by law.\n    •    It can be issued against government departments, public officials, statutory bodies and other authorities\n         performing public duties.\n    •    It is generally not issued to enforce a purely private contractual obligation.\n    •    It is also generally not issued against the President or Governor for the exercise of their constitutional\n         powers under Article 361.\n\n3.Prohibition\n\n    •    Meaning: “To forbid.”\n    •    It is issued by a higher court to a lower court or tribunal.\n    •    Its purpose is to prevent the lower judicial or quasi-judicial body from continuing proceedings when it is\n         acting without jurisdiction or beyond its jurisdiction.\n    •    It is a preventive writ because it stops an improper proceeding before the lower authority completes it.\n    •    It is generally directed against judicial or quasi-judicial authorities, not ordinary administrative actions.\n\n4.Certiorari\n\n    •    Meaning: Literally, “to be informed/certified.”\n    •    It is issued by a higher court to a lower court, tribunal or quasi-judicial authority.\n    •    Its main purpose is to quash an order or decision that has been made without jurisdiction, beyond\n         jurisdiction or in violation of principles of natural justice.\n    •    It is generally associated with an order or decision already made.\n\nProhibition vs Certiorari\n\n    •    Prohibition:Proceedings are still going on ; Higher court says “Stop.”\n    •    Certiorari: Decision/order has already been made; Higher court can quash the order.\n\n5.Quo Warranto\n\n    •    Meaning: “By what authority?”\n    •    It is used to question the legal authority of a person occupying a public office.\n    •    The court examines whether the person has been lawfully appointed and satisfies the legal qualifications\n         prescribed for that office.\n    •    Its purpose is to prevent a person from illegally occupying a public office.\n\nNote:\n\n    • Article 32: Supreme Court issues these writs for the enforcement of Fundamental Rights.\n     • Article 226: High Courts can also issue these writs, not only for Fundamental Rights but also “for any\n       other purpose” (other legal rights)."}, {"id": 82, "topic": "Fundamental Rights", "question": "Which of the following can Parliament do under Article 33?", "options": {"A": "Suspend all Fundamental Rights for every citizen", "B": "Modify the application of Fundamental Rights in relation to armed forces and certain specified services", "C": "Abolish Article 32", "D": "Suspend Article 21 permanently"}, "answer": "B", "explanation": "Forces, forces charged with maintenance of public order, intelligence organisations and certain related\ntelecommunication systems, to ensure proper discharge of their duties and maintenance of discipline."}, {"id": 83, "topic": "Fundamental Rights", "question": "Which of the following statements regarding Martial Law in India is/are correct?\n\n1.Martial Law involves the use of military authority to maintain or restore order in an area where the normal civil\nadministration is unable to effectively maintain order.\n\n2.Article 34 empowers Parliament to provide indemnity for acts done in connection with maintaining or restoring\norder during Martial Law.\n\n3.Martial Law and National Emergency under Article 352 are identical in nature and effect.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "B", "explanation": "•     Martial Law means a situation in which military authority is used to maintain or restore law and order in a\n           particular area when normal civil authorities are unable to effectively deal with a serious disturbance.\n\nArticle 34 – Constitutional Provision\n\nArticle 34 deals with the situation when Martial Law is in force in any area of India.During such a situation,\nParliament can make a law to:\n\n     •     Provide indemnity to any person in respect of acts done under Martial Law while maintaining or restoring\n           order.\n     •     Validate acts and orders made under Martial Law.\n\nIndemnity means providing legal protection from liability or legal consequences for specified acts done in\nconnection with maintaining or restoring order.\n\nImportant Points about Martial Law\n\n    •      The Constitution does not define the term “Martial Law.”\n    •      The Constitution does not prescribe a specific procedure for its declaration.\n    •      Martial Law is generally associated with a particular area, rather than the entire country.\n    •      Article 34 does not itself impose Martial Law; it deals with the legal consequences of Martial Law and\n           Parliament’s power to provide indemnity.\n\nMartial Law , National Emergency both are not same\n\n\n\n    •    Martial Law – Military authority used to maintain/restore order in an area Article 34\n    •    National Emergency – Declared under Article 352 for war, external aggression or armed rebellion →\n         Affects the constitutional system more broadly"}, {"id": 84, "topic": "Fundamental Rights", "question": "Which of the following statements about Article 35 is correct?", "options": {"A": "It gives Parliament exclusive power to make laws on certain matters connected with Fundamental Rights.", "B": "It gives this power exclusively to State Legislatures.", "C": "It abolishes Fundamental Rights during Emergency.", "D": "It deals with the Right to Property."}, "answer": "A", "explanation": "to Fundamental Rights, including matters connected with Articles 16(3), 32(3), 33, 34 and punishment for acts\ndeclared offences under Part III."}, {"id": 85, "topic": "Fundamental Rights", "question": "Which Supreme Court case held that Fundamental Rights cannot be overridden by Directive Principles of State\nPolicy, leading to the principle of primacy of Fundamental Rights at that time?", "options": {"A": "Kesavananda Bharati v. State of Kerala", "B": "Minerva Mills v. Union of India", "C": "State of Madras v. Champakam Dorairajan", "D": "Maneka Gandhi v. Union of India"}, "answer": "C", "explanation": "•    The case concerned communal reservation in educational institutions in the former Madras State.\n     •    The Supreme Court held that Directive Principles cannot override Fundamental Rights.\n     •    The judgment contributed to the First Constitutional Amendment Act, 1951, which introduced Article\n          15(4) to enable special provisions for socially and educationally backward classes and SCs/STs."}, {"id": 86, "topic": "Fundamental Rights", "question": "Which Supreme Court case held that Fundamental Rights cannot be amended by Parliament, leading to the 24th\nConstitutional Amendment?", "options": {"A": "Golaknath v. State of Punjab", "B": "Kesavananda Bharati v. State of Kerala", "C": "Minerva Mills v. Union of India", "D": "Shankari Prasad v. Union of India"}, "answer": "A", "explanation": "•   The Supreme Court held that Parliament could not amend Fundamental Rights.\n    •   It treated a constitutional amendment as “law” for the purpose of Article 13.\n    •   This position was later changed by the 24th Constitutional Amendment Act, 1971.\n    •   In Kesavananda Bharati (1973), the Supreme Court overruled the absolute position and held that\n        Fundamental Rights can be amended, but the Basic Structure cannot be destroyed"}, {"id": 87, "topic": "Fundamental Rights", "question": ".Which Supreme Court case is associated with the Basic Structure Doctrine and held that Parliament can amend\nthe Constitution but cannot destroy its basic structure?", "options": {"A": "Golaknath v. State of Punjab", "B": "Kesavananda Bharati v. State of Kerala", "C": "Minerva Mills v. Union of India", "D": "I.R. Coelho v. State of Tamil Nadu"}, "answer": "B", "explanation": "•   The Supreme Court laid down the Basic Structure Doctrine.\n    •   Parliament has the power to amend the Constitution under Article 368.\n    •   However, this power is not unlimited.\n    •   Parliament cannot alter or destroy the basic structure of the Constitution.\n    •   The case is important for Fundamental Rights because it protected the constitutional framework within\n        which Fundamental Rights operate."}, {"id": 88, "topic": "Fundamental Rights", "question": "Which case is associated with the Supreme Court’s recognition of the Right to Privacy as a Fundamental Right?", "options": {"A": "Vishaka v. State of Rajasthan", "B": "K.S. Puttaswamy v. Union of India", "C": "Shreya Singhal v. Union of India", "D": "Olga Tellis v. Bombay Municipal Corporation"}, "answer": "B", "explanation": "•   A nine-judge bench of the Supreme Court unanimously recognized the Right to Privacy as a Fundamental\n        Right.\n    •   Privacy was held to be protected primarily under Article 21, along with the freedoms and guarantees\n        contained in Part III.\n    •   The judgment recognized privacy as an essential aspect of dignity, liberty and autonomy."}, {"id": 89, "topic": "Fundamental Rights", "question": "Which case held that Section 66A of the Information Technology Act, 2000 was unconstitutional because it\nviolated the freedom of speech and expression under Article 19(1)(a)?", "options": {"A": "K.S. Puttaswamy v. Union of India", "B": "Shreya Singhal v. Union of India", "C": "Maneka Gandhi v. Union of India", "D": "Romesh Thappar v. State of Madras"}, "answer": "B", "explanation": "•      The Supreme Court struck down Section 66A of the Information Technology Act, 2000.\n    •      The provision was held unconstitutional because it imposed an impermissible restriction on freedom of\n           speech and expression under Article 19(1)(a).\n    •      The judgment is an important case concerning freedom of speech in the digital/online space."}, {"id": 90, "topic": "Fundamental Rights", "question": "Which case is associated with the Right to Livelihood as part of the broader protection of life under Article 21?", "options": {"A": "Olga Tellis v. Bombay Municipal Corporation", "B": "Vishaka v. State of Rajasthan", "C": "A.D.M. Jabalpur v. Shivkant Shukla", "D": "I.R. Coelho v. State of Tamil Nadu"}, "answer": "A", "explanation": "•      The Supreme Court recognized that the Right to Livelihood is an important part of the broader Right to\n           Life under Article 21.\n    •      The Court observed that depriving a person of livelihood can affect the person’s ability to live.\n    •      The case is therefore important for understanding the expanded meaning of Article 21."}, {"id": 91, "topic": "Fundamental Rights", "question": "Which of the following pairs relating to important Supreme Court judgments on Fundamental Rights are\ncorrectly matched?\n\n1.I.R. Coelho v. State of Tamil Nadu (2007) – Laws placed in the Ninth Schedule can be tested against the Basic\nStructure Doctrine.\n\n2.Unni Krishnan, J.P. v. State of Andhra Pradesh (1993) – Recognised the Right to Education as part of Article 21,\nwhich later led to the insertion of Article 21A.\n\n3.NALSA v. Union of India (2014) – Recognised the constitutional rights and legal identity of transgender persons.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "1.I.R. Coelho v. State of Tamil Nadu (2007)\n\n    •    The Supreme Court held that laws placed in the Ninth Schedule after 24 April 1973 can be subjected to\n         judicial review if they damage the Basic Structure of the Constitution.\n    •    24 April 1973 → Date of the Kesavananda Bharati judgment.\n    •    Inclusion in the Ninth Schedule does not automatically give absolute immunity from judicial review.\n    •    The Court can examine whether such a law violates Fundamental Rights forming part of the Basic\n         Structure.\n\n2.Unni Krishnan, J.P. v. State of Andhra Pradesh (1993)\n\n    •    The Supreme Court held that the Right to Education is part of the Right to Life under Article 21,\n         particularly for children up to the constitutionally recognised age at that time.\n    •    The judgment treated education as an important component of Article 21.\n    •    It played an important role in the constitutional development that ultimately resulted in Article 21A.\n    •    The 86th Constitutional Amendment Act, 2002 inserted Article 21A, making free and compulsory education\n         a Fundamental Right for children 6–14 years.\n\n3.NALSA v. Union of India (2014)\n\nThe Supreme Court recognised transgender persons as a “third gender” and affirmed that they are entitled to\nconstitutional protection.\n\nThe judgment emphasised:\n\n    •    Equality before law – Article 14\n    •    Protection against discrimination\n    •    Right to life and dignity – Article 21\n    •    Freedom and autonomy of transgender persons\n\nIt directed governments to take appropriate measures for the recognition and protection of transgender persons’\nrights."}, {"id": 92, "topic": "DPSP", "question": "Consider the following statements regarding the Directive Principles of State Policy (DPSP):\n\n    1.   DPSPs are contained in Part IV of the Indian Constitution.\n    2.   They are non-justiciable, meaning they cannot be directly enforced by courts.\n    3.   The provisions of DPSP are fundamental in the governance of the country.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Part IV (Articles 36–51) of the Constitution deals with DPSPs.\n    •    Article 37 states that these principles are not enforceable by any court, but they are fundamental in the\n         governance of the country and the State must apply them while making laws.\n    •    They were largely inspired by the Irish Constitution.\n    •    DPSPs are constitutional guidelines for the State to promote social and economic welfare and establish a\n         welfare state."}, {"id": 93, "topic": "DPSP", "question": "The Directive Principles of State Policy are commonly classified into which of the following three categories?", "options": {"A": "Political, Economic and Religious", "B": "Socialist, Gandhian and Liberal-Intellectual", "C": "Federal, Unitary and Socialist", "D": "Democratic, Secular and Gandhian"}, "answer": "B", "explanation": "Intellectual principles.This classification is not officially mentioned in the Constitution; it is based on the objectives\nand ideas reflected in different DPSPs.\n\n    •    Socialistic Principles:These principles aim to achieve social and economic equality and improve the living\n         conditions of people. Government should reduce inequality and ensure social and economic justice.\n    •    Gandhian Principles:These principles reflect Mahatma Gandhi’s ideas about village development, rural\n         economy and the welfare of weaker sections. Government should develop villages and promote the\n         interests of weaker sections.\n    •    Liberal-Intellectual Principles:These focus on modern governance, individual development, legal reforms,\n         education, environment and international peace. Government should promote modern, rational and\n         progressive governance."}, {"id": 94, "topic": "DPSP", "question": "Which of the following pairs are correctly matched with the Socialist Principles of DPSP?\n\n    1.   Article 38 – Promotion of welfare of the people and reduction of inequalities\n    2.   Article 39 – Adequate livelihood, equal pay and prevention of concentration of wealth\n    3.   Article 39A – Equal justice and free legal aid\n    4.   Article 41 – Right to work, education and public assistance", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Article 38 – Welfare of People\n\n    •    State should promote the welfare of the people.\n    •    It should establish a social order based on social, economic and political justice.\n    •    It should reduce inequalities in income, status, facilities and opportunities\n\nArticle 39 – Principles of Policy\n\n    •    Article 39 (a):Provide adequate means of livelihood to men and women.\n    •    Article 39(b):Ensure proper distribution of resources for the common good.\n    •    Article 39(c):Prevent concentration of wealth and means of production.\n    •    Article 39(d)Ensure equal pay for equal work and protect workers and children.\n    •    Article 39(e): Preservation of the health and the strength of workersand children against forcible abuse.\n    •    Article 39 (f): Opportunities for Healthy development of Children\n\nArticle 39 A-Equal Justice\n\n    •    State should provide equal justice to all.\n    •    It aims to ensure that poverty does not prevent anyone from getting justice.\n    •    State should provide free legal aid to economically weaker persons.\n\nArticle 41 – Work, Education & Assistance\n\n    •    State should make provisions for right to work and education within its economic capacity.\n    •    It should provide public assistance in cases of unemployment, old age and sickness.\n    •    Assistance should also be available in cases of disablement and undeserved want."}, {"id": 95, "topic": "DPSP", "question": "Consider the following statements regarding the Socialist Principles of DPSP:\n\n    1.   Article 42 provides for just and humane conditions of work and maternity relief.\n    2.   Article 43 aims to secure a living wage and a decent standard of life for workers.\n    3.   Article 43A provides for workers’ participation in the management of industries.\n    4.   Article 47 directs the State to improve nutrition, standard of living and public health.\n\nWhich of the statements given above are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 2 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Article 42 – Working Conditions\n\n    •     State should ensure just and humane conditions of work.\n    •     Workers should be provided with safe and fair working conditions.\n    •     It specifically provides for maternity relief.\n\nArticle 43 – Living Wage\n\n    •     State should secure a living wage and decent conditions of work for workers.\n    •     Workers should have a decent standard of life.\n    •     It also promotes opportunities for leisure and social and cultural activities.\n\nArticle 43A – Workers’ Participation\n\n    •     State should take steps to secure workers’ participation in management of industries.\n    •     It gives workers a role in the decision-making process of industries.\n    •     It aims to improve cooperation between workers and management\n\nArticle 47 – Nutrition & Public Health\n\n    •     State should improve nutrition and the standard of living of people.\n    •     Improvement of public health is one of its primary duties.\n    •     State should work towards prohibition of intoxicating drinks and harmful drugs."}, {"id": 96, "topic": "DPSP", "question": "Which of the following pairs are related to Gandhian Principles?\n\n    1.    Article 40 – Organisation of village Panchayats\n    2.    Article 43 – Promotion of cottage industries in rural areas\n    3.    Article 43B – Promotion of cooperative societies\n    4.    Article 43 A– Workers’ participation in management of industries", "options": {"A": "1,2&3", "B": "2,3&4", "C": "1,3&4", "D": "1,23&4"}, "answer": "A", "explanation": "Article 40 – Village Panchayats\n\n    •     State should organise village Panchayats.\n    •     Panchayats should be given necessary powers and authority.\n    •     It promotes local self-government at the village level.\n\nArticle 43 – Cottage Industries\n\n\n\n    •    State should promote cottage industries in rural areas.\n    •    They may be promoted on an individual or cooperative basis.\n    •    It helps create employment and strengthen rural economy.\n\nArticle 43B – Cooperative Societies\n\n    •    State should promote the voluntary formation of cooperative societies.\n    •    It should encourage their autonomous functioning and democratic control.\n    •    It also promotes professional management of cooperatives.\n\nNote: Article 43A related to Socialist principles"}, {"id": 97, "topic": "DPSP", "question": "Consider the following statements regarding the Gandhian Principles of DPSP:\n\n    1.   Article 46 directs the State to promote the educational and economic interests of weaker sections,\n         particularly SCs and STs.\n    2.   Article 47 prohibit the consumption of intoxicating drinks and drugs which are injurious to health.\n    3.   Article 48 prohibit the slaughter of cows,calves and other milch and draught cattle and to improve their\n         breeds.\n    4.   Article 49 directs the State to protect monuments and places of national importance.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "1, 2, 3 and 4", "D": "2, 3 and 4 only"}, "answer": "B", "explanation": "Article 46 – Weaker Sections\n\n    •    State should promote the educational and economic interests of weaker sections.Special attention is given\n         to SCs and STs.\n    •    State should protect them from social injustice and exploitation.\n\nArticle 47 – Prohibition\n\n    •    It should work towards prohibition of intoxicating drinks.\n    •    It should also discourage harmful drugs, except for medicinal purposes.\n\nArticle 48 – Agriculture & Animal Husbandry\n\n    •    It should preserve and improve breeds of animals.\n    •    It specifically seeks to prohibit slaughter of cows, calves and other milch and draught cattle.\n\nNote: Article 49 related to liberal intellectual principles."}, {"id": 98, "topic": "DPSP", "question": "Which of the following pairs are correctly matched with the Liberal-Intellectual Principles of DPSP?\n\n    1.   Article 44 – Uniform Civil Code\n    2.   Article 45 – Early childhood care and education for children below six years\n    3.   Article 49 – Protection of monuments and places of national importance\n    4.   Article 50 – Separation of judiciary from executive", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Article 44 – Uniform Civil Code\n\n    •    State should try to secure a Uniform Civil Code (UCC) for all citizens.\n    •    It aims to have a common set of civil laws in matters such as marriage, divorce and inheritance.\n    •    It promotes uniformity and equality in civil matters.\n\nArticle 45 – Early Childhood Care & Education\n\n    •    State should provide early childhood care and education for children below 6 years.\n    •    It focuses on the child’s development during the early years.\n    •    The provision is directed towards all children.\n\nArticle 49 – Protection of Monuments\n\n    •    State should protect monuments and places of artistic or historic interest.\n    •    It covers objects declared to be of national importance.\n    •    The aim is to preserve India’s historical and cultural heritage.\n\nArticle 50 – Separation of Judiciary\n\n    •    State should separate the judiciary from the executive in public services.\n    •    It aims to ensure judicial independence.\n    •    This helps prevent executive interference in judicial functions."}, {"id": 99, "topic": "DPSP", "question": "Consider the following statements regarding the Liberal-Intellectual Principles of DPSP:\n\n    1.   Article 48 – Organisation of agriculture and animal husbandry on modern and scientific lines.\n    2.   Article 48A – Protection and improvement of the environment and safeguarding forests and wildlife.\n    3.   Article 51 – Promotion of international peace and security.\n    4.   Article 47 – Improvement of nutrition, standard of living and public health.\n\nWhich of the statements given above are NOT correctly classified as Liberal-Intellectual Principles?", "options": {"A": "1 and 2 only", "B": "1 and 4 only", "C": "1, 2 and 3 only", "D": "1, 2 and 4 only"}, "answer": "C", "explanation": "Article 48 – Agriculture & Animal Husbandry\n\n    •    Organisation of agriculture and animal husbandry on modern and scientific lines.\n\nArticle 48A – Environment Protection\n\n    •    State should protect and improve the environment.\n    •    It should safeguard forests and wildlife.\n\nArticle 51 – International Peace\n\n    •    State should promote international peace and security.\n    •    It should maintain just and honourable relations between nations.\n    •    It should encourage respect for international law and treaty obligations.\n    •    It also encourages settlement of international disputes by arbitration.\n\nNote: Article 47 related to Socialist principles"}, {"id": 100, "topic": "DPSP", "question": "Which of the following is true about Fundamental Rights and DPSPs?", "options": {"A": "Both are justiciable and enforceable by courts", "B": "DPSPs override Fundamental Rights when in conflict", "C": "Fundamental Rights are justiciable, but DPSPs are not", "D": "DPSPs are guaranteed by the Constitution; Fundamental Rights are optional"}, "answer": "C", "explanation": "•    Directive Principles of State Policy aim to guide the state in promoting social and economic justice.\n         However, DPSPs are non-justiciable and cannot be enforced by any court."}, {"id": 101, "topic": "DPSP", "question": "What is the primary objective of a Uniform Civil Code (UCC) in India?", "options": {"A": "To establish a common criminal law for all citizens.", "B": "To unify direct and indirect tax laws.", "C": "To provide a common set of personal laws for all citizens, irrespective of religion.", "D": "To standardize administrative procedures across all states."}, "answer": "C", "explanation": "religion, covering marriage, divorce, inheritance, and adoption.\n\n    •    Its objective is to promote equality, gender justice, and secularism by replacing religion-based personal\n         laws that cause legal disparities.\n    •    This goal is rooted in Article 44 of the Constitution, which directs the State to work towards national\n         integration through uniform civil laws."}, {"id": 102, "topic": "DPSP", "question": "What makes the Goa Civil Code distinct from other personal laws in India?", "options": {"A": "It applies only to the Hindu community in Goa.", "B": "It is a uniform civil code that applies to all communities regardless of religion.", "C": "It is based on British common law.", "D": "It allows separate personal laws for different religions."}, "answer": "B", "explanation": "religion.\n\n    •    It regulates marriage, divorce, inheritance, and adoption under a single legal framework.\n    •    Key features include compulsory marriage registration, monogamy for all, and equal property rights for\n         spouses and heirs.\n    •    It upholds gender equality and is often cited as a model for a Uniform Civil Code in India."}, {"id": 103, "topic": "DPSP", "question": "Which of the following Directive Principles was inserted by the 25th Constitutional Amendment Act, 1971?", "options": {"A": "Article 39A – Equal justice and free legal aid", "B": "Article 43A – Workers’ participation in management", "C": "Article 39© – Prevention of concentration of wealth", "D": "Article 48A – Protection of environment"}, "answer": "C", "explanation": "distribution of material resources for the common good and preventing concentration of wealth.\n\n    •    It also inserted Article 31C, giving protection to laws made to implement Article 39(b) and 39(c) from\n         challenge under certain Fundamental Rights."}, {"id": 104, "topic": "DPSP", "question": "Which Article was added to the Directive Principles by the 42nd Constitutional Amendment Act, 1976,\nspecifically relating to workers’ participation in the management of industries?", "options": {"A": "Article 39A", "B": "Article 43A", "C": "Article 48A", "D": "Article 43B"}, "answer": "B", "explanation": "Article 39A (free legal aid) and Article 48A (environment protection)."}, {"id": 105, "topic": "DPSP", "question": "Which of the following was introduced into Article 38 by the 44th Constitutional Amendment Act, 1978?", "options": {"A": "Promotion of welfare through social, economic and political justice", "B": "Organisation of village Panchayats", "C": "Minimisation of inequalities in income, status, facilities and opportunities", "D": "Equal justice and free legal aid"}, "answer": "C", "explanation": "social, economic and political justice.\n\nThe 44th Amendment Act, 1978 added clause Article 38(2), directing the State to minimise inequalities in income,\nstatus, facilities and opportunities."}, {"id": 106, "topic": "DPSP", "question": "Which of the following Articles was inserted into the Directive Principles by the 86th Constitutional\nAmendment Act, 2002?", "options": {"A": "Article 39A", "B": "Article 43A", "C": "Article 45", "D": "Article 48A"}, "answer": "C", "explanation": "education for children below six years.\n\n    •    It also inserted Article 21A as a Fundamental Right for free and compulsory education for children aged 6–\n         14 years and added Article 51A(k) as a Fundamental Duty."}, {"id": 107, "topic": "DPSP", "question": "Which Article relating to co-operative societies was added to the DPSPs by the 97th Constitutional\nAmendment Act, 2011?", "options": {"A": "Article 43A", "B": "Article 43B", "C": "Article 44", "D": "Article 48A"}, "answer": "B", "explanation": "autonomous functioning, democratic control and professional management of co-operative societies.\n\n    •    It also gave constitutional recognition to co-operative societies through changes relating to Article 19(1)(c)\n         and insertion of Part IXB."}, {"id": 108, "topic": "DPSP", "question": "Which of the following were recommendations of the Swaran Singh Committee regarding Fundamental\nDuties?\n\n    1.   Fundamental Duties should be included in the Constitution.\n    2.   Parliament should be empowered to impose punishment for violation of certain Fundamental Duties.\n    3.   The duty to pay taxes should be included as a Fundamental Duty.\n    4.   Fundamental Duties should be directly enforceable through the Supreme Court.\n\nWhich of the statements given above are correct?", "options": {"A": "1, 2 and 3 only", "B": "1 and 3 only", "C": "2 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "A", "explanation": "Duties of citizens.\n\n    •    Fundamental Duties should be included in the Constitution.\n    •    Parliament should have the power to impose punishment for violation/non-compliance with Fundamental\n         Duties.\n    •    Such punishment could be prescribed by law and should not be challenged merely on the ground that it\n         affects Fundamental Rights.\n    •    Duty to pay taxes should be included as a Fundamental Duty.\n         → Not accepted and therefore not present in Article 51A.\n    •    Fundamental Duties should be given greater constitutional significance, so that citizens understand that\n         rights are accompanied by responsibilities.\n\nNote:The Committee did not recommend making Fundamental Duties directly enforceable through the Supreme\nCourt. Fundamental Duties are generally non-justiciable"}, {"id": 109, "topic": "Fundamental Duties", "question": "Which of the following statements regarding Fundamental Duties is correct?", "options": {"A": "Fundamental Duties were part of the original Constitution and are contained in Part IV.", "B": "Fundamental Duties were added by the 42nd Constitutional Amendment Act, 1976, and are contained in Part IVA\nunder Article 51A.", "C": "Fundamental Duties were added by the 44th Constitutional Amendment Act, 1978, and are contained in Part III.", "D": "Fundamental Duties were added by the 86th Constitutional Amendment Act, 2002, and are contained in Part IV."}, "answer": "B", "explanation": "•     Fundamental Duties were not part of the original Constitution adopted in 1950.\n    •     They were introduced through the 42nd Constitutional Amendment Act, 1976, based on the\n          recommendations of the Swaran Singh Committee.\n    •     The amendment inserted a new Part IVA containing Article 51A.\n    •     10 Fundamental Duties were originally added in 1976.\n    •     Later, the 86th Constitutional Amendment Act, 2002 added the 11th Fundamental Duty under Article\n          51A(k), relating to providing educational opportunities to children between 6 and 14 years."}, {"id": 110, "topic": "Fundamental Duties", "question": "Which of the following statements correctly describes the nature of Fundamental Duties?", "options": {"A": "Fundamental Duties are directly enforceable by courts in the same manner as Fundamental Rights.", "B": "Fundamental Duties are applicable only during a National Emergency.", "C": "Fundamental Duties are generally non-justiciable, but Parliament may make laws to give effect to certain duties.", "D": "Fundamental Duties can be enforced only by the Supreme Court under Article 32."}, "answer": "C", "explanation": "cannot dapproach a court solely on the basis of that violation) so they cannot be directly enforced by courts like\nFundamental Rights.\n\n    •     However, Parliament can make laws to give effect to certain Fundamental Duties, and courts may also\n          consider them while interpreting laws."}, {"id": 111, "topic": "Fundamental Duties", "question": "Fundamental Duties are primarily addressed to:", "options": {"A": "Parliament", "B": "State Governments", "C": "Citizens", "D": "Judiciary"}, "answer": "C", "explanation": "Duties are specifically directed towards citizens."}, {"id": 112, "topic": "Fundamental Duties", "question": "Which of the following pairs are correctly matched?\n\n    1.    Article 51A(b) – Noble ideals of the freedom struggle\n    2.    Article 51A(c)– Sovereignty, unity and integrity of India\n    3.    Article 51A(d) – Defence of the country and national service\n    4.    Article 51A(f) – Preservation of India’s composite cultural heritage", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Some of them are:\n\n51A(b) – Ideals of the Freedom Struggle\n\n    •     Citizens should remember and follow the noble ideals that inspired India’s national struggle for freedom.\n    •     These ideals include patriotism, sacrifice and commitment to the nation.\n\n51A(c) – Sovereignty, Unity and Integrity\n\n    •     Citizens should protect the sovereignty, unity and integrity of India.\n    •     They should not support activities that threaten the unity or security of the country.\n\n51A(d) – Defend the Country\n\n    •     Citizens should be ready to defend the country when required.\n    •     They should also perform national service when called upon to do so.\n\n51A(f) – Value and Preserve the rich heritage of country’s Composite Culture\n\n    •     Citizens should value and protect India’s rich and diverse cultural heritage.\n    •     They should respect and preserve the cultural traditions passed down through generations."}, {"id": 113, "topic": "Fundamental Duties", "question": "The 11th Fundamental Duty was added by which Constitutional Amendment?", "options": {"A": "42nd Amendment Act, 1976", "B": "44th Amendment Act, 1978", "C": "73rd Amendment Act, 1992", "D": "86th Amendment Act, 2002"}, "answer": "D", "explanation": ":The 86th Constitutional Amendment Act, 2002 inserted Article 51A(k). It makes it a duty of every parent or\nguardian to provide opportunities for education to their child or ward between 6 and 14 years of age."}, {"id": 114, "topic": "Fundamental Duties", "question": "Match the Following:\n\nList I – Fundamental Duties\n\n    1.     Respect the Constitution, National Flag and National Anthem\n    2.     Protect the natural environment\n    3.     Develop scientific temper\n    4.     Safeguard public property\n\nList II – Articles\n\na. Article 51A(a)\n\nb. Article 51A(g)\n\nc. Article 51A(h)\n\nd. Article 51A(i)\n\nOptions:", "options": {"A": "1-a, 2-b, 3-c, 4-d", "B": "1-b, 2-a, 3-d, 4-c", "C": "1-c, 2-d, 3-a, 4-b", "D": "1-d, 2-c, 3-b, 4-a"}, "answer": "A", "explanation": "•      Every citizen should follow the Constitution and respect the National Flag and National Anthem.\n    •      They should also respect the ideals and institutions of the Constitution.\n\n51A(g) – Protection of Environment\n\n    •      Citizens should protect and improve the environment, forests, lakes, rivers and wildlife.\n    •      They should also show compassion towards living creatures.\n\n51A(h) – Scientific Temper\n\n    •      Citizens should develop scientific thinking, humanism and a spirit of inquiry.\n    •      They should question, learn and support positive reforms instead of blindly accepting everything.\n\n51A(i) – Public Property and Non-Violence\n\n    •      Citizens should protect public property such as buses, trains, schools and government buildings.\n    •      They should also avoid violence and settle issues peacefully."}, {"id": 115, "topic": "Fundamental Duties", "question": "Assertion–Reason\n\nAssertion (A): Article 51A(e) requires citizens to promote harmony and the spirit of common brotherhood among all\npeople of India.\n\nReason (R): It also requires citizens to renounce practices that are derogatory to the dignity of women.", "options": {"A": "Both A and R are true, and R is the correct explanation of A.", "B": "Both A and R are true, but R is not the correct explanation of A.", "C": "A is true, but R is false.", "D": "A is false, but R is true."}, "answer": "B", "explanation": "•    Citizens should promote harmony, brotherhood and unity among people despite their differences.\n    •    They should also reject practices that are against the dignity of women.\n\nBoth A and R are true;But R is not the correct explanation of A because Harmony & Dignity of women both are\ndifferent concepts."}, {"id": 116, "topic": "Fundamental Duties", "question": "Assertion–Reason\n\nAssertion (A): Citizens should strive towards excellence in all spheres of individual and collective activity.\n\nReason (R): Striving for excellence helps the nation continuously rise to higher levels of achievement.", "options": {"A": "Both A and R are true, and R is the correct explanation of A.", "B": "Both A and R are true, but R is not the correct explanation of A.", "C": "A is true, but R is false.", "D": "A is false, but R is true."}, "answer": "A", "explanation": "•    Citizens should always try to achieve excellence in their personal and collective activities.\n    •    This helps individuals improve themselves and contributes to the progress of the country.\n\nBoth A and R are true, and R is the correct explanation of A."}, {"id": 117, "topic": "Fundamental Duties", "question": "Which of the following Acts is directly associated with the Fundamental Duty under Article 51A(a) relating to\nrespect for the Constitution, National Flag and National Anthem?", "options": {"A": "Environment (Protection) Act, 1986", "B": "Prevention of Insults to National Honour Act, 1971", "C": "Protection of Civil Rights Act, 1955", "D": "Wildlife (Protection) Act, 1972"}, "answer": "B", "explanation": "disrespect to the Indian Constitution, National Flag and National Anthem.It supports the spirit of Article 51A(a).\n\nPunishments\n\nSection 2 – National Flag / Constitution:\n\n    •    Intentionally insulting or showing disrespect to the Indian National Flag or Constitution can lead to\n         imprisonment up to 3 years, or fine, or both.\n\nSection 3 – National Anthem:\n\n    •    Intentionally preventing the singing of the National Anthem, or causing disturbance to an assembly\n         engaged in singing it, can lead to imprisonment up to 3 years, or fine, or both.\n\nRepeat offence:\n\n    •    For a second or subsequent conviction, the punishment can include imprisonment for a minimum of 1 year."}, {"id": 118, "topic": "Fundamental Duties", "question": "Which of the following Acts is most closely related to the Fundamental Duty under Article 51A(g) to protect\nand improve the natural environment?", "options": {"A": "Protection of Civil Rights Act, 1955", "B": "Environment (Protection) Act, 1986", "C": "Prevention of Insults to National Honour Act, 1971", "D": "Representation of the People Act, 1951"}, "answer": "B", "explanation": "The Environment (Protection) Act, 1986 is an important law for protecting and improving the environment and\npreventing environmental pollution.\n\n    •    It gives the Central Government wide powers to take measures for environmental protection, including\n         regulating pollutants and laying down environmental standards.\n    •    Connection with Fundamental Duty:Article 51A(g)"}, {"id": 119, "topic": "Fundamental Duties", "question": "Which of the following Acts is closely associated with the Fundamental Duty under Article 51A(g) to protect\nwildlife and the natural environment?", "options": {"A": "Wildlife (Protection) Act, 1972", "B": "Prevention of Insults to National Honour Act, 1971", "C": "Protection of Civil Rights Act, 1955", "D": "Right to Education Act, 2009"}, "answer": "A", "explanation": "activities such as hunting and trade in protected wildlife.\n\n    •    Prohibits trade in rare and endangered species.\n    •    It supports Article 51A(g)"}, {"id": 120, "topic": "Fundamental Duties", "question": "Which of the following Acts is closely related to the Fundamental Duty under Article 51A(e) to promote\nharmony and renounce practices derogatory to the dignity of women?", "options": {"A": "Protection of Civil Rights Act, 1955", "B": "Environment (Protection) Act, 1986", "C": "Wildlife (Protection) Act, 1972", "D": "Prevention of Insults to National Honour Act, 1971"}, "answer": "A", "explanation": "untouchability and prohibits its practice in any form.\n\n    •    It penalises the enforcement of disabilities arising from untouchability and supports the constitutional\n         objective of equality, social harmony and human dignity, which is consistent with the spirit of Article\n         51A(e)."}, {"id": 121, "topic": "Fundamental Duties", "question": "Which of the following cases is important in understanding the constitutional significance of Fundamental\nDuties?", "options": {"A": "AIIMS Students’ Union v. AIIMS (2001)", "B": "Kesavananda Bharati v. State of Kerala (1973)", "C": "Maneka Gandhi v. Union of India (1978)", "D": "Golaknath v. State of Punjab (1967)"}, "answer": "A", "explanation": "constitutional importance and are not merely moral obligations.\n\n    •    The Court recognised that Fundamental Duties can be considered while interpreting constitutional\n         provisions and laws, although they are generally non-justiciable."}, {"id": 122, "topic": "President of India", "question": "Which Article of the Indian Constitution provides for the office of the President of India?", "options": {"A": "Article 52", "B": "Article 53", "C": "Article 54", "D": "Article 55"}, "answer": "A", "explanation": "•    The President is the constitutional head of the Union.\n    •    He is the first Citizen of India and acts as the symbol of unity , Integrity and solidarity of the Nation."}, {"id": 123, "topic": "President of India", "question": "Which of the following correctly describes the relationship between Articles 53 and 74?", "options": {"A": "Article 53 gives all executive power to the Prime Minister", "B": "Article 53 vests Union executive power in President, while Article 74 requires the President to act on ministerial\nadvice", "C": "Article 74 makes President independent of Council of Ministers", "D": "Article 53 applies only during emergencies"}, "answer": "B", "explanation": "•    The President exercises these powers either directly or through officers subordinate to him, in accordance\n         with the Constitution.\n    •    All executive actions taken on President’s name.\n\nNote:In the parliamentary system, the President is the nominal/executive head, while the real executive authority is\nexercised by the Council of Ministers headed by the Prime Minister.\n\nArticle 74 → There shall be a Council of Ministers headed by the Prime Minister to aid and advise the President.\n\n    •    The President may ask the Council to reconsider its advice once.\n    •    After reconsideration, the President must act according to the advice.\n    •    This reflects India’s parliamentary form of government."}, {"id": 124, "topic": "President of India", "question": "Which of the following is NOT a qualification required for election as President of India?", "options": {"A": "He must be a citizen of India", "B": "He must have completed 35 years of age", "C": "He must be qualified for election as a member of the Lok Sabha", "D": "He must have been a member of Parliament for at least five years"}, "answer": "D", "explanation": "•    Must be a citizen of India.\n    •    Must have completed 35 years of age.\n    •    Must be qualified for election as a member of the Lok Sabha.\n    •    Must not hold any office of profit under the Government of India, State Government, or local/other\n         authority under their control.\n    •    There is no requirement that the person must have previously been a Member of Parliament."}, {"id": 125, "topic": "President of India", "question": "Who elects the President of India?", "options": {"A": "All Members of Parliament and all State Legislatures", "B": "Elected members of both Houses of Parliament and elected members of State Legislative Assemblies", "C": "Only elected members of Lok Sabha and Rajya Sabha", "D": "Elected members of Parliament, State Legislatures and Legislative Councils"}, "answer": "B", "explanation": "The President is elected by an Electoral College consisting of:\n\n    •    Elected members of Parliament (Rajya Sabha& Loksabha)\n    •    Elected members of the Legislative Assemblies of States.\n    •    Elected members of the Legislative Assemblies of Delhi and Puducherry are also included.\n    •    70th Constitutional Amendment Act, 1992, amended Article 54 and added elected members of the\n         Legislative Assemblies of Delhi and Puducherry are included in the electoral college.\n\nWho are not participated in Presidential Election:\n\n    •    Nominated MPs do not vote.\n    •    Nominated members of State Legislative Assemblies do not vote.\n    •    Members of Legislative Councils do not vote."}, {"id": 126, "topic": "President of India", "question": "Which method is used for election of the President?", "options": {"A": "Proportional representation by single transferable vote", "B": "First-past-the-post", "C": "Direct election", "D": "Two-round system"}, "answer": "A", "explanation": "The President is elected by:\n\nProportional Representation:It is an electoral system in which seats are allocated in proportion to the no.of votes\nreceived.\n\nSingle Transferable Vote:Voters Rank candidates in order of preferences (1,2,3,4….etc).\n\n    •    A Candidate must achieve a minimum no.of votes (quota)to be elected.\n    •    Surplus votes of elected candidates and votes of eliminated candidates are transferred based on next\n         preferences.\n\nQuota: (Total Valid votes÷ how many seats filled +1)+1\n     •     Candidates must secure 50%+1 vote to be declared elected President.\nSecret Ballot: Voting is conducted in confidential manner .\n     •     Free& Fair election.\n     •     Each member of electoral college will be given a ballot paper.\nNote :No one crossed the Quota transfer of votes happens.\n\nExample:\n\nTotal voters=100 ;Seats to be filled =3; Candidates=A,B,C,D,E\n\nQuota=(100÷3+1)+1 =(100÷4)+1=25+1=26\n\n Candidates            A                 B                    C                  D                   E\n 1st Preference       40                 15                   10                 25                  10\n Votes\n\nA=1st Preference Votes 40 passed the quota so elected\n\nOthers not crossed the Quota so, transfer of votes happens.\n\n40-26 =14 (this votes are transferred to NXT highest 1 st preference votes)\n\nD=25 1 st preference votes\n\nTransferred votes14so total 25+14=39\n\n39-26=13 (transferred to NXT highest 1 st preference votes)\n\nB=15\n\nTransferred 13 so total 13+15 = 28\n\nSo 3 seats filled A,D,B"}, {"id": 127, "topic": "President of India", "question": "Which of the following statements regarding the President of India are correct?\n\n    1.   Under Article 56, the President holds office for a term of five years from the date on which he enters upon\n         his office.\n\n\n\n    2.   Under Article 57, a person who has held the office of President is eligible for re-election for any number of\n         terms.\n    3.   Under Article 59, the President shall not be a member of either House of Parliament or of a House of the\n         Legislature of any State.\n    4.   The President is prohibited from holding any other office of profit during his term of office.", "options": {"A": "1, 2 and 3 only", "B": "1, 3 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Article 56(1)(a): The President holds office for a term of five years from the date on which he enters upon\n         his office.\n    •    Article 56(1)(b): The President may resign from office by writing addressed to the Vice-President of India.\n    •    Article 56(1)(c): The President may be removed from office by impeachment for violation of the\n         Constitution, following the procedure prescribed under Article 61.\n    •    Note: The President continues to hold office even after the expiry of his five-year term until his successor\n         enters upon office.\n\nArticle 57 – Eligibility for Re-election\n\n    •    A person who has held or is holding the office of President is eligible for re-election to that office.\n    •    Important : The Constitution does not prescribe any maximum limit on the number of terms a person can\n         serve as President.\n    •    Difference from the USA: The Indian Constitution does not impose a two-term limit on the President ;USA\n         has 2 term limit on President.\n\nArticle 59 – Conditions of President’s Office\n\n    •    Article 59(1): The President cannot be a member of either House of Parliament or of a House of the\n         Legislature of any State.\n                 Ø If a Member of Parliament or a State Legislature is elected President, his/her seat is deemed to\n                    have been vacated on the date on which he/she enters upon the office of President.\n    •    Article 59(2): The President shall not hold any other office of profit during his/her term of office.\n    •    Article 59(3): The President is entitled, without payment of rent, to use his official residence(Rashtrapati\n         Bhavan). He is also entitled to such emoluments, allowances and privileges as may be determined by\n         Parliament by law.\n    •    Article 59(4): The emoluments and allowances of the President shall not be diminished during his term of\n         office."}, {"id": 128, "topic": "President of India", "question": "Which of the following statements regarding the impeachment of the President under Article 61 is/are correct?\n\n    1.   The President can be impeached only for violation of the Constitution.\n    2.   The impeachment charge can be initiated in either House of Parliament.\n\n\n\n    3.   A 14-day notice is required before initiating the charge, signed by at least one-fourth of the total members\n         of that House.\n    4.   The charge must be passed by two-thirds of the total membership of the concerned House.", "options": {"A": "1, 2 and 3 only", "B": "1, 2 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Ground: Only violation of the Constitution\n    •    Who can initiate: Either House of Parliament\n    •    Notice period: 14 days\n    •    Notice signed by: At least ¼ of the total membership of the initiating House\n    •    First House: Charge must be passed by 2/3 of total membership\n    •    Second House: Investigates the charge\n    •    President’s right: Right to appear and be represented\n    •    Second House: Must sustain the charge by 2/3 of total membership\n    •    Result: President is removed from office\n    •    Nature: Parliamentary impeachment process\n    •    Important: It is not an ordinary majority and not merely 2/3 of members present and voting; the\n         Constitution specifically says 2/3 of the total membership.\n\nNote:No President so far impreached."}, {"id": 129, "topic": "President of India", "question": "Under Article 62 of the Constitution, within what period must an election be held to fill a vacancy in the office\nof the President caused by death, resignation, removal or otherwise?", "options": {"A": "The election must be held within 3 months", "B": "The election must be held within 6 months", "C": "The election must be held within 1 year", "D": "The election must be held immediately within 30 days"}, "answer": "B", "explanation": "•    Article 62(1) –Vacancy due to expiration of term → election completed before the term expires.\n    •    Article 62(2) – Vacancy due to death, resignation, removal or otherwise → election as soon as possible,\n         within 6 months."}, {"id": 130, "topic": "President of India", "question": "Who administers the oath of office to the President of India?", "options": {"A": "The Prime Minister of India", "B": "The Vice-President of India", "C": "The Chief Justice of India", "D": "The Speaker of the Lok Sabha"}, "answer": "C", "explanation": "absence of the Chief Justice, the oath is administered by the senior-most Judge of the Supreme Court available."}, {"id": 131, "topic": "President of India", "question": "Under Article 65 of the Constitution, who acts as the President when a vacancy occurs in the office of the\nPresident?", "options": {"A": "The Prime Minister", "B": "The Chief Justice of India", "C": "The Vice-President", "D": "The Speaker of the Lok Sabha"}, "answer": "C", "explanation": "removal or otherwise of the President. The Vice-President continues to act as President until a new President is\nelected and enters upon office.\n\n    •    If the President is temporarily unable to perform his functions due to absence, illness or any other cause,\n         the Vice-President discharges the functions of the President under Article 65.\n\nNote:\n\n    •    If Vice-president office is vacant ,the chief justice of India acts as President.\n    •    If CJI also vacant senior most judge of supreme court acts as President.\n    •    Anyone acting as President,all amoluments &other facilities same given to them also."}, {"id": 132, "topic": "President of India", "question": "Which of the following statements regarding Article 71 of the Constitution of India is correct?", "options": {"A": "The Election Commission decides all disputes relating to the election of the President and Vice-President.", "B": "The Supreme Court decides disputes relating to the election of the President and Vice-President.", "C": "The Parliament decides disputes relating to the election of the President and Vice-President.", "D": "The President decides disputes relating to his own election."}, "answer": "B", "explanation": "• Any doubt or dispute regarding such an election is decided by the Supreme Court, and its decision is final.\n    • The Supreme Court can also determine the consequences when an election is declared void.\n    • The validity of the election is not affected merely because there is a vacancy among the members of the\n       Electoral College."}, {"id": 133, "topic": "President of India", "question": "Which of the following statements regarding the Diplomatic, Military and Emergency powers of the President\nof India are correct?\n\n    1.   The President represents India in international affairs and appoints India’s diplomatic representatives to\n         other countries.\n    2.   The President is the Supreme Commander of the Defence Forces of India.\n    3.   The President can proclaim a National Emergency under Article 352 when the security of India or any part\n         of it is threatened by war, external aggression or armed rebellion.\n    4.   During a National Emergency, the President can suspend the Fundamental Rights under Articles 20 and 21.", "options": {"A": "1, 2 and 3 only", "B": "1, 3 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "A", "explanation": "Diplomatic Powers:\n\n    •    The President represents India in international affairs. He appoints Indian ambassadors and other\n         diplomatic representatives and receives foreign diplomatic representatives. Treaties and international\n         agreements are made in the name of the Union, subject to constitutional and legal requirements.\n\nMilitary Powers:\n\nUnder Article 53(2), the Supreme Command of the Defence Forces is vested in the President. The President appoints\nthe heads of the Army, Navy and Air Force and exercises military powers according to the Constitution and laws\nmade by Parliament.\n\nEmergency Powers:\n\nThe President can proclaim three types of emergencies:\n\n    •    Article 352 → National Emergency – War, external aggression or armed rebellion.\n    •    Article 356 → President’s Rule – Failure of constitutional machinery in a State.\n    •    Article 360 → Financial Emergency – Threat to the financial stability or credit of India or any part of it.\n\nNote: Even during an Emergency, the Fundamental Rights under Articles 20 and 21 cannot be suspended."}, {"id": 134, "topic": "President of India", "question": "Under Article 72 of the Constitution, the President has the power to grant pardon in which of the following\ncases?", "options": {"A": "Only offences under State laws", "B": "Only civil offences", "C": "Offences against laws relating to matters under the Union List only", "D": "Cases involving punishment by a Court Martial, offences under Union laws, and all cases where the sentence is a\nsentence of death"}, "answer": "D", "explanation": "is a sentence of death\n\nExp: Article 72 gives the President the power to grant pardon, reprieve, respite, remission, or commute the sentence\nin three important situations:\n\n(1) punishment by a Court Martial, (2) offences against laws relating to matters to which the Union executive power\nextends, and (3) in all cases where the sentence is a sentence of death.\n\nArticle 72 – Pardoning Powers of the President\n\n    1.   Pardon\n\nMeaning: Completely forgives the offence and removes the sentence as well as the conviction.\n\nExample: A person is sentenced to death. If the President grants pardon, the death sentence is completely removed\nand the person is treated as fully forgiven.\n\n    2.   Reprieve\n\nMeaning: A temporary suspension of the execution of a sentence, especially a death sentence, to allow time for\nfurther consideration of the case.\n\nExample: A person is sentenced to death. The President grants reprieve, so the execution is temporarily postponed\nwhile the mercy petition is considered.\n\n    3.   Respite\n\nMeaning: Awarding a lesser sentence because of special circumstances relating to the offender.\n\nExample: A pregnant woman is sentenced to imprisonment. Considering her special condition, the President may\ngrant respite and reduce the punishment.\n\n    4.   Remission\n\nMeaning: Reducing the period or duration of the sentence without changing its nature.\n\nExample: A person is sentenced to 10 years of imprisonment. Remission may reduce the period to 5 years, but the\npunishment remains imprisonment.\n\n    5.   Commutation\n\nMeaning: Substituting one form of punishment with a lighter form of punishment.\n\nExample: Death sentence → Life imprisonment or Rigorous imprisonment → Simple imprisonment."}, {"id": 135, "topic": "President of India", "question": ".Which of the following correctly distinguishes the pardoning powers of the President and Governor?", "options": {"A": "Both can pardon death sentences completely", "B": "Only the Governor can pardon a death sentence", "C": "The President can pardon a death sentence, while the Governor cannot pardon a death sentence but can suspend,\nremit or commute it", "D": "Neither has any power over death sentences"}, "answer": "C", "explanation": "•    Under Article 161, the Governor can suspend, remit or commute a death sentence, but does not have the\n         power to pardon it."}, {"id": 136, "topic": "President of India", "question": "Which of the following is NOT a judicial power of the President of India?", "options": {"A": "Granting pardon, reprieve, respite, remission and commutation under Article 72", "B": "Appointing the Judges of the Supreme Court under Article 124", "C": "Appointing the Judges of High Courts under Article 217", "D": "Causing the Annual Financial Statement to be laid before Parliament under Article 112"}, "answer": "D", "explanation": "Supreme Court Judges under Article 124, appointment of High Court Judges under Article 217, and seeking the\nadvisory opinion of the Supreme Court under Article 143."}, {"id": 137, "topic": "President of India", "question": "Which of the following statements regarding the financial powers of the President of India is/are correct?\n\n    1.   The President causes the Annual Financial Statement to be laid before both Houses of Parliament.\n    2.   No demand for a grant can be made except on the recommendation of the President.\n    3.   A Money Bill can be introduced in the Lok Sabha only on the recommendation of the President.\n    4.   The President constitutes the Finance Commission under Article 280.", "options": {"A": "1, 2 and 3 only", "B": "1, 3 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Financial Powers of President\n\n    •    Under Article 112, the President causes the Annual Financial Statement (Union Budget) to be laid before\n         Parliament.\n\n\n\n    •    Under Article 113, demands for grants require the President’s recommendation. Under Article 117, a\n         Money Bill can be introduced in the Lok Sabha only on the President’s recommendation.\n    •    He can make advances out of the contingency fund of India to meet any unforeseen expenditure.\n    •    Under Article 280, the President constitutes the Finance Commission after every 5 yrs , which recommends\n         the distribution of financial resources between the Union and the States."}, {"id": 138, "
