<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polity One-Shot &mdash; MCQ Quiz | SSC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F3EE;
    --paper: #FFFFFF;
    --ink: #1B241E;
    --ink-soft: #4B564D;
    --indigo: #22345E;
    --indigo-soft: #4A5C8C;
    --gold: #A9762F;
    --green: #2E7D4F;
    --green-bg: #E7F3EA;
    --red: #B3413E;
    --red-bg: #FBEAE9;
    --border: #DDE1D6;
    --border-soft: #E9ECE3;
    --radius: 10px;
    --serif: 'Lora', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 16px 80px;
  }

  /* ---------- Header ---------- */
  header.site-header{
    padding:34px 0 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }

  .chakra{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--indigo);
    position:relative;
    flex:none;
  }
  .chakra::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    background:
      repeating-conic-gradient(var(--indigo) 0deg 15deg, transparent 15deg 30deg);
  }
  .chakra::after{
    content:"";
    position:absolute;
    inset:14px;
    border-radius:50%;
    background:var(--bg);
  }

  .header-top{
    display:flex;
    align-items:center;
    gap:14px;
  }

  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--indigo);
  }

  .subtitle{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  .stats-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    margin-top:18px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  .stats-bar strong{
    color:var(--ink);
    font-weight:600;
  }

  .stats-bar .stat-correct strong{ color:var(--green); }
  .stats-bar .stat-wrong strong{ color:var(--red); }

  /* ---------- Topic tabs ---------- */
  nav.topic-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 0 14px;
    margin-bottom:8px;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  nav.topic-tabs::-webkit-scrollbar{ height:6px; }
  nav.topic-tabs::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

  .tab-btn{
    flex:none;
    white-space:nowrap;
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:500;
    padding:9px 15px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{ border-color:var(--indigo-soft); color:var(--indigo); }
  .tab-btn.active{
    background:var(--indigo);
    border-color:var(--indigo);
    color:#fff;
  }
  .tab-count{
    opacity:0.7;
    font-size:0.8em;
    margin-left:3px;
  }

  /* ---------- Topic section ---------- */
  .topic-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin:22px 0 16px;
  }

  .topic-heading h2{
    font-family:var(--serif);
    font-size:1.25rem;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }

  .topic-progress{
    font-size:0.82rem;
    color:var(--ink-soft);
  }

  /* ---------- Question card ---------- */
  .q-card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:14px;
  }

  .q-head{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:12px;
  }

  .q-num{
    flex:none;
    font-family:var(--serif);
    font-weight:600;
    font-size:0.82rem;
    color:var(--indigo);
    background:var(--border-soft);
    border-radius:6px;
    padding:3px 8px;
    margin-top:2px;
  }

  .q-text{
    white-space:pre-wrap;
    font-size:0.98rem;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
  }

  .option{
    text-align:left;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-family:var(--sans);
    font-size:0.93rem;
    color:var(--ink);
    background:#FBFBF9;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
    white-space:pre-wrap;
  }
  .option:hover:not(.locked){
    border-color:var(--indigo-soft);
    background:#F5F6FB;
  }
  .option .opt-letter{
    flex:none;
    font-weight:600;
    color:var(--indigo-soft);
  }

  .option.correct{
    background:var(--green-bg);
    border-color:var(--green);
  }
  .option.correct .opt-letter{ color:var(--green); }

  .option.incorrect{
    background:var(--red-bg);
    border-color:var(--red);
  }
  .option.incorrect .opt-letter{ color:var(--red); }

  .option.locked{
    cursor:default;
  }

  .q-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }

  .reveal-link{
    background:none;
    border:none;
    font-family:var(--sans);
    font-size:0.83rem;
    color:var(--indigo-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .reveal-link:disabled{
    opacity:0.45;
    cursor:default;
    text-decoration:none;
  }

  .result-tag{
    font-size:0.83rem;
    font-weight:600;
    display:none;
  }
  .result-tag.show{ display:inline-block; }
  .result-tag.correct{ color:var(--green); }
  .result-tag.incorrect{ color:var(--red); }

  .explanation{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .explanation.open{
    max-height:2400px;
    margin-top:12px;
  }

  .explanation-inner{
    border-top:1px dashed var(--border);
    padding-top:12px;
    font-size:0.9rem;
    color:var(--ink-soft);
    white-space:pre-wrap;
  }

  .explanation-inner .exp-label{
    display:block;
    font-family:var(--serif);
    font-weight:600;
    font-style:italic;
    color:var(--gold);
    margin-bottom:6px;
    font-size:0.85rem;
  }

  /* ---------- Scroll to top ---------- */
  #scrollTopBtn{
    position:fixed;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--indigo);
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
    z-index:50;
  }
  #scrollTopBtn.show{ display:flex; }

  footer.site-footer{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:0.8rem;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:480px){
    h1{ font-size:1.4rem; }
    .wrap{ padding:0 12px 70px; }
    .q-card{ padding:14px 14px 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .explanation, .tab-btn, .option{ transition:none; }
  }
</style>
</head>

<script id="quizData" type="application/json">[{"id": 1, "topic": "Constitution Basics", "question": "How many Parts of Indian Constitution as of now ?", "options": {"A": "22", "B": "23", "C": "25", "D": "26"}, "answer": "C", "explanation": "•     Nov 26,1949 — Constitution adopted\n    •     Jan 26,1950 — Indian Constitution came into Existence\n    •     Original Constitution — 22 Parts, 395 Articles and 8 Schedules\n    •     Present — 25 Parts ,448 Articles and 12 Schedules + 106 Amendments"}, {"id": 2, "topic": "Constitution Basics", "question": "Which of these pairs are correctly matched related to parts of Indian Constitution?\n\n    1.    Union and its territories – Part I\n    2.    Citizenship – Part II\n    3.    The Union Territories – Part VIII\n    4.    The Emergency Provisions – XVIII", "options": {"A": "1,2&3", "B": "2,3&4", "C": "1,3&4", "D": "1,2,3&4"}, "answer": "D", "explanation": "•     Part I – The Union and its Territory: Deals with the territory of India, formation of new states, alteration of\n          boundaries, etc. (Articles 1 to 4)\n    •     Part II – Citizenship: Contains provisions relating to citizenship at the commencement of the\n          Constitution.(Articles 5 to 11)\n    •     Part VIII – The Union Territories: Deals with the administration and provisions relating to Union\n          Territories.(Articles 239 to 242)\n    •     Part XVIII – Emergency Provisions: Contains provisions related to National Emergency (Article 352),\n          President’s Rule (Article 356), and Financial Emergency (Article 360)."}, {"id": 3, "topic": "Constitution Basics", "question": "Match the following:\n\n   Parts of Indian Constitution                                         Contains\n 1.Part III                                                   a.Directive Principles Of State Policy\n 2.Part IV                                                    b.Fundamental Duties\n\n\n\n 3.Part IV-A                                               c.Fundamental Rights\nSelect the correct code:", "options": {"A": "1-a,2-b,3-c", "B": "1-c,2-a,3-b", "C": "1-b,2-c,3-a", "D": "1-c,2-b,3-a"}, "answer": "B", "explanation": "•    Part III – Fundamental Rights: It deals with the Fundamental Rights of citizens, such as Right to Equality,\n         Right to Freedom, Right against Exploitation, Freedom of Religion, Cultural & Educational Rights, and\n         Constitutional Remedies. These rights are mainly covered under Articles 12–35.\n    •    Part IV – Directive Principles of State Policy (DPSP): It contains guidelines for the Central and State\n         Governments to establish a welfare-oriented state and promote social and economic justice. These are given\n         under Articles 36–51.\n    •    Part IV-A – Fundamental Duties: It contains the Fundamental Duties of citizens, listed under Article 51A.\n         These duties encourage citizens to respect the Constitution, protect the environment, promote harmony, and\n         uphold national values.This part added through 42nd amendment act 1976."}, {"id": 4, "topic": "Constitution Basics", "question": "Which one discussed under Part V of Indian Constitution?", "options": {"A": "Union Government", "B": "State Government", "C": "Panchayats", "D": "Municipalities"}, "answer": "A", "explanation": "of the Union-level constitutional authorities.\n\nPart V – The Union: 5 Chapter\n\nCh-1 :The Executive – Articles 52–78\n\n→ President, Vice-President, Prime Minister, Council of Ministers, Attorney-General.\n\nCh-2:Parliament – Articles 79–122\n\n→ Rajya Sabha, Lok Sabha, Parliamentary officers, legislative procedure, etc.\n\nCh-3:Legislative Powers of the President – Article 123\n\n→ President’s power to issue Ordinances when Parliament is not in session.\n\nCh-4:The Union Judiciary – Articles 124–147\n\n\n\n→ Supreme Court, its composition, powers and jurisdiction.\n\nCh-5:Comptroller and Auditor-General of India (CAG) – Articles 148–151\n\n→ CAG’s appointment, duties, powers and reports."}, {"id": 5, "topic": "Constitution Basics", "question": "Which part of the Indian Constitution has State Government?", "options": {"A": "Part VII", "B": "Part VI", "C": "Part IX", "D": "Part X"}, "answer": "B", "explanation": "Chapter I – General\n\n    •      Articles 152\n    •      Contains the definition of “State” for Part VI.\n\nChapter II – The Executive\n\n    •      Articles 153–167\n    •      Deals with the Governor, Chief Minister, Council of Ministers and Advocate-General.\n\nChapter III – The State Legislature\n\n    •      Articles 168–212\n    •      Covers Legislative Assembly, Legislative Council, their officers, powers and legislative procedure.\n\nChapter IV – Legislative Powers of the Governor\n\n    •      Article 213\n    •      Deals with the Governor’s power to promulgate Ordinances when the State Legislature is not in session.\n\nChapter V – The High Courts in the States\n\n    •      Articles 214–232\n    •      Deals with the High Courts, their judges, powers and jurisdiction.\n\nChapter VI – Subordinate Courts\n\n    •      Articles 233–237\n    •      Deals with District Courts and other subordinate courts under the control of the High Court."}, {"id": 6, "topic": "Constitution Basics", "question": "Which Part of the Indian Constitution deleted through 7 th Constitutional Amendment Act 1956?", "options": {"A": "Part 12", "B": "Part 13", "C": "Part 7", "D": "Part 9"}, "answer": "C", "explanation": "•      The 7 th Constitutional Amendment act 1956 related to states reorganization.\n    •      Before 1956 ,States classified into Part A,Part B,Part C& Part D .Later States reorganization Act 1956 tells\n           states be classified based on languages .\n    •      The 7th Constitutional Amendment Act, 1956 abolished the classification of States into Part A, Part B, Part\n           C and Part D States.\n    •      As a result, Part VII of the Constitution, which dealt with Part B States, was deleted, Article 238, which\n           dealt with the application of constitutional provisions to Part B States, was also repealed.\n\nRepealed = To formally cancel or revoke an Article/Act, making it no longer legally effective.\n\nDeleted = To remove a Part or Provision from the Constitution."}, {"id": 7, "topic": "Constitution Basics", "question": "Consider the following statements:\n\n    1.     Part IX deals with Panchayats.\n    2.     Part IX-A deals with Municipalities.\n    3.     Part IX-B deals with Co-operative Societies.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Part IX – Panchayats\n\nPart IX deals with Panchayats, the institutions of rural local self-government. It was added by the 73rd Constitutional\nAmendment Act, 1992 and contains Articles 243 to 243-O. It provides constitutional provisions relating to the\nstructure, elections, reservation, tenure, powers and functioning of Panchayats.\n\nPart IX-A – Municipalities\n\nPart IX-A deals with Municipalities, which represent urban local self-government. It was added by the 74th\nConstitutional Amendment Act, 1992 and contains Articles 243P to 243ZG. It provides for Nagar Panchayats,\nMunicipal Councils and Municipal Corporations.\n\nPart IX-B – Co-operative Societies\n\n\n\nPart IX-B deals with Co-operative Societies. It was inserted by the 97th Constitutional Amendment Act, 2011 and\ncontains Articles 243ZH to 243ZT. These provisions relate to the democratic and autonomous functioning of co-\noperative societies."}, {"id": 8, "topic": "Constitution Basics", "question": "Which of the following pairs are correctly matched related to Parts of the Indian Constitution ?\n\n1.Part X – The Scheduled and Tribal Areas\n\n2.Part XIV -A : Tribunals\n\n3.Part XV – Elections\n\n4.Part XX – Amendment Of the Constitution", "options": {"A": "1,2&3", "B": "2,3&4", "C": "1,3&4", "D": "1,2,3&4"}, "answer": "D", "explanation": "Part X – The Scheduled and Tribal Areas\n\n    •     Articles 244 and 244A deal with the administration of Scheduled Areas and Tribal Areas. The Fifth and\n          Sixth Schedules provide special arrangements for these areas.\n\nPart XIV-A – Tribunals\n\n    •     This Part was inserted by the 42nd Constitutional Amendment Act, 1976. It deals with Administrative\n          Tribunals and other Tribunals under Articles 323A and 323B.\n\nPart XV – Elections\n\n    •     Articles 324 to 329A relate to elections. Article 324 establishes the Election Commission of India and gives\n          it the power of superintendence, direction and control over elections.\n\nPart XX – Amendment of the Constitution\n\n    •     Article 368 deals with the power and procedure for amending the Constitution. Therefore, Part XX is\n          correctly matched with Constitutional Amendment."}, {"id": 9, "topic": "Constitution Basics", "question": "Part XI of the Indian Constitution deals with which of the following?", "options": {"A": "Relations between the Union and the States", "B": "Finance, Property, Contracts and Suits", "C": "Trade, Commerce and Intercourse within India", "D": "Services under the Union and the States"}, "answer": "A", "explanation": "Part XI deals with Relations between the Union and the States.\n\n    •    It covers Articles 245 to 263.\n\nIt mainly deals with two types of relations:\n\n    •    Legislative Relations – Articles 245–255\n    •    Administrative Relations – Articles 256–263\n\nArticle 246 is important because it deals with the distribution of legislative powers between the Union and the States\nthrough the Union List, State List and Concurrent List."}, {"id": 10, "topic": "Constitution Basics", "question": "Part XII of the Indian Constitution deals with which of the following?", "options": {"A": "Services, Tribunals, Elections and Emergency Provisions", "B": "Finance, Property, Contracts and Suits", "C": "Trade, Commerce and Intercourse within India", "D": "Services under the Union and the States"}, "answer": "B", "explanation": "Part XII: Finance, Property, Contracts and Suits\n\nArticles 264–300A\n\n1. Finance – Articles 264–293\n\n    •    Deals with taxation, distribution of revenues and financial relations between the Union and the States.\n    •    Article 280 – Finance Commission.\n\n2. Borrowing – Articles 292–293\n\n    •    Deals with the borrowing powers of the Union and State Governments.\n\n3. Property, Contracts and Suits – Articles 294–300\n\n    •    Deals with government property, contracts made by governments and legal proceedings involving the\n         Union or States.\n\n4. Right to Property – Article 300A\n\n    •    The Right to Property is not a Fundamental Right. It is a constitutional right. A person can be deprived of\n         property only by authority of law."}, {"id": 11, "topic": "Constitution Basics", "question": "Consider the following statements regarding Part XIII of the Indian Constitution:\n\n    1.    It deals with Trade, Commerce and Intercourse within the Territory of India.\n    2.    It provides for freedom of trade, commerce and intercourse throughout India, subject to constitutional\n          provisions.\n    3.    It deals with the distribution of legislative powers between the Union and the States.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "Part XIII of the Indian Constitution deals with Trade, Commerce and Intercourse within the Territory of India.\n\n    •     It aims to ensure the freedom of trade, commerce and intercourse throughout India, subject to the\n          restrictions permitted by the Constitution.\n    •     Articles covered 301 to 307.\n\n Note :The distribution of legislative powers between the Union and the States is not covered under Part XIII; it is\ndealt with under Part XI."}, {"id": 12, "topic": "Constitution Basics", "question": "Which Part of the Indian Constitution deals with “Services under the Union and the States”?", "options": {"A": "Part XII", "B": "Part XIII", "C": "Part XIV", "D": "Part XV"}, "answer": "C", "explanation": "Part XIV – Services under the Union and the States\n\nArticles 308–323 into 2 chapters.\n\nCh-1:Services under the Union and the States\n\n    •     Articles 308–314\n    •     Deals with provisions relating to government services and service conditions.\n\nCh-2: Public Service Commissions\n\n    •     Articles 315–323\n\n\n\n    •     Deals with UPSC and State Public Service Commissions."}, {"id": 13, "topic": "Constitution Basics", "question": "Which Part of the Indian Constitution deals with “Special Provisions Relating to Certain Classes”?", "options": {"A": "Part XIV", "B": "Part XV", "C": "Part XVI", "D": "Part XVII"}, "answer": "C", "explanation": "Part XVI –Special Provisions Relating to Certain Classes\n\n    •     Articles covered 330 to 342A\n    •     Including constitutional provisions for the representation and safeguards of Scheduled Castes, Scheduled\n          Tribes and other backward classes."}, {"id": 14, "topic": "Constitution Basics", "question": "Which Part of the Indian Constitution deals with the Official Language?", "options": {"A": "Part XVI", "B": "Part XVII", "C": "Part XVIII", "D": "Part XIX"}, "answer": "B", "explanation": "Part XVII – Official Language\n\nArticles 343–351 into 4 chapters.\n\nCh-1: Language of the Union\n\n    •     Articles 343–344\n    •     Deals with the official language of the Union.\n\nCh-2:Regional Languages\n\n    •     Articles 345–347\n    •     Deals with the official languages of States and recognition of regional languages.\n\nCh-3:Language of the Supreme Court, High Courts, etc.\n\n    •     Articles 348–349\n    •     Deals with the language used in courts and legislative documents.\n\n\n\nCh-4:Special Directives\n\n      •   Articles 350–351\n      •   Provides for language-related safeguards and promotion of Hindi."}, {"id": 15, "topic": "Constitution Basics", "question": "Which Part of the Indian Constitution deals with Emergency Provisions?", "options": {"A": "Part XVII", "B": "Part XVIII", "C": "Part XIX", "D": "Part XX"}, "answer": "B", "explanation": "Part XVIII – Emergency Provisions\n\nArticles 352–360\n\nIt deals with 3 types of emergencies:\n\n1. National Emergency – Article 352\n\n      •   Declared when India’s security is threatened by war, external aggression or armed rebellion.\n\n2. President’s Rule – Article 356\n\n      •   Applied when the constitutional government of a State cannot function properly.\n\n3. Financial Emergency – Article 360\n\n      •   Declared when the financial stability or credit of India is under serious threat."}, {"id": 16, "topic": "Constitution Basics", "question": "How many Schedules are there in Indian Constitution initially ?", "options": {"A": "12", "B": "9", "C": "8", "D": "7"}, "answer": "C", "explanation": "Schedules of Indian Constitution\n\n\n\n    •    Indian Constitution adopted in Nov 26,1949; came into force on Jan 26,1950 at that time 8 Schedules are\n         adopted .\n    •    Later through Several amendments 9,10,11,12 Schedules are added .\n    •    Present 12 Schedules are there in the Constitution."}, {"id": 17, "topic": "Constitution Basics", "question": "Which one of the following is correctly associated with the First Schedule?", "options": {"A": "Allocation of seats in Rajya Sabha", "B": "Names and territorial extent of States and Union Territories", "C": "Forms of constitutional oaths", "D": "Division of legislative powers"}, "answer": "B", "explanation": "First Schedule\n\n    •    The First Schedule contains\n                Ø Names of States and their territorial extent /jurisdiction.\n                Ø Names of Union Territories and their extent.\n    •    Whenever the boundaries or names of States/UTs are changed through a constitutional or statutory process,\n         the First Schedule may also be amended.\n    •    It is therefore directly connected with the territorial organization of India.\n    •    Articles covered 1 and 4"}, {"id": 18, "topic": "Constitution Basics", "question": "Which of the following is mainly covered under the Second Schedule of the Indian Constitution?", "options": {"A": "Forms of oaths and affirmations", "B": "Official languages of India", "C": "Salaries, allowances and privileges of certain constitutional authorities", "D": "Allocation of Rajya Sabha seats"}, "answer": "C", "explanation": "Second Schedule\n\n    v Deals with the salaries, allowances, privileges and related provisions of important constitutional authorities.\n    v These include the President, Governors, Speakers and Deputy Speakers of Loksabha & Legislative\n      Assemblies of States, Chairman and Deputy Chairmans of Rajya Sabha & Legislative Councils of\n      States ,Judges of the Supreme Court and High Courts, and the Comptroller and Auditor-General of India\n      (CAG).\n    v It is important to remember that this Schedule is associated mainly with the financial and service-related\n      provisions of constitutional offices."}, {"id": 19, "topic": "Constitution Basics", "question": "A newly elected Member of Parliament has to make a formal constitutional commitment before taking his/her\nseat. Which Schedule provides the prescribed form for this?", "options": {"A": "Second Schedule", "B": "Third Schedule", "C": "Fourth Schedule", "D": "Fifth Schedule"}, "answer": "B", "explanation": "Third Schedule\n\nDeals with Forms of Oaths or Affirmations to various offices before taking his/her seat .\n\nThose include —\n\n    v    Union Ministers & State Ministers\n    v    Candidates for election to Parliament & Candidates for election to State Legislature\n    v    Members of Parliament (MPs) & Members of State Legislature (MLAs/MLCs)\n    v    Supreme Court Judges & High Court Judges\n    v    Comptroller and Auditor-General (CAG)"}, {"id": 20, "topic": "Constitution Basics", "question": "If a question asks about the distribution of seats among States and Union Territories in the Rajya Sabha, which\nconstitutional Schedule should be consulted?", "options": {"A": "First Schedule", "B": "Third Schedule", "C": "Fourth Schedule", "D": "Seventh Schedule"}, "answer": "C", "explanation": "Fourth Schedule\n\n    •    The Fourth Schedule provides for the allocation of seats in the Rajya Sabha among the States and Union\n         Territories.\n    •    The allocation is not equal for all States; it is broadly based on their population and constitutional\n         provisions."}, {"id": 21, "topic": "Constitution Basics", "question": "The Fifth Schedule of the Constitution contains provisions relating to:", "options": {"A": "Municipalities", "B": "Administration and control of Scheduled Areas and Scheduled Tribes", "C": "Official languages", "D": "Anti-defection provisions"}, "answer": "B", "explanation": "Fifth Schedule\n\n    •    The Fifth Schedule deals with the administration and control of Scheduled Areas and Scheduled Tribes in\n         States other than those covered by the Sixth Schedule.\n    •    It provides a special administrative framework to protect the interests of tribal communities living in these\n         areas.\n    •    The Governor has special responsibilities regarding Scheduled Areas ; The Governor can make regulations\n         concerning matters such as transfer of tribal land, allotment of land and money-lending to tribal\n         communities, subject to constitutional provisions.\n    •    The Tribes Advisory Council (TAC) is an important body under the Fifth Schedule. It advises the Governor\n         on matters relating to the welfare and advancement of Scheduled Tribes.\n    •    The President has the power to declare an area as a Scheduled Area and can alter its boundaries or\n         discontinue its status, based on the constitutional procedure."}, {"id": 22, "topic": "Constitution Basics", "question": "The Sixth Schedule provides special provisions for the administration of tribal areas in which group of States?", "options": {"A": "Odisha, Jharkhand, Chhattisgarh and Madhya Pradesh", "B": "Assam, Meghalaya, Tripura and Mizoram", "C": "Rajasthan, Gujarat, Maharashtra and Goa", "D": "Nagaland, Manipur, Sikkim and Arunachal Pradesh"}, "answer": "B", "explanation": "Sixth Schedule\n\n    •    The Sixth Schedule provides for the administration of certain tribal areas in Assam, Meghalaya, Tripura\n         and Mizoram.\n    •    It establishes Autonomous District Councils and Regional Councils to provide a significant degree of self-\n         government to tribal communities.\n    •    These councils have specified legislative, judicial and administrative powers within their areas.These\n         councils can make laws on certain matters such as land, forests, customs, marriage and inheritance.\n    •    Article 244(2) provides for the application of the Sixth Schedule."}, {"id": 23, "topic": "Constitution Basics", "question": "Schedule VII of the Constitution contains:", "options": {"A": "Election guidelines", "B": "Three legislative lists", "C": "Emergency powers", "D": "Judicial provisions"}, "answer": "B", "explanation": "Seventh Schedule\n\nSchedule VII of the Indian Constitution divides the subjects of legislation between the Union and the States through\nthree lists —\n\n    •     The Union List (only Parliament can legislate)\n    •     The State List (only State Legislatures can legislate)\n    •     The Concurrent List (both Parliament and States can legislate)\n\nThese lists ensure a federal balance between central and state powers.\n\nNote : If a Union and State law conflict on a Concurrent List subject, Union law generally prevails, subject to\nconstitutional exceptions."}, {"id": 24, "topic": "Constitution Basics", "question": "Which of the following statements are correct?\n\n1.Criminal law is under Union List\n\n2.Census is under Union List\n\n3.Trade within a State falls under State List", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "B", "explanation": "•     Criminal law is in the Concurrent List, so both Parliament and States can make laws on it, though central\n          laws like IPC and CrPC apply nationwide.\n    •     The Census is a Union List subject, so only the Central Government can conduct and regulate it.\n    •     Trade within a State comes under the State List, allowing States to make laws on internal trade."}, {"id": 25, "topic": "Constitution Basics", "question": "To which level of government do taxes on railway fares and freights accrue?", "options": {"A": "Union", "B": "State", "C": "Municipal Corporation", "D": "Panchayat"}, "answer": "A", "explanation": "•     According to the Seventh Schedule of the Indian Constitution, railway fares and freights fall under the\n          Union List, making them a central subject.\n    •     As per Article 269, taxes on railway passenger fares and freights are levied and collected by the Union\n          Government. The revenue thus goes to the Centre, not to States or local bodies.\n    •     States cannot impose or collect taxes on railway fares or freight."}, {"id": 26, "topic": "Constitution Basics", "question": "Consider the following pairs:\n\n    1.    Union List – Defence\n    2.    State List – Police\n    3.    Concurrent List – Education\n    4.    Union List – Agriculture\n\nWhich of the pairs given above are correctly matched?", "options": {"A": "1, 2 and 3 only", "B": "1 and 4 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "A", "explanation": "Lists- Imp Subjects\n\n    •     Union List: Defence, Foreign Affairs, Banking, Railways, Currency, Atomic Energy.\n    •     State List: Police, Public Order, Agriculture, Public Health, Local Government.\n    •     Concurrent List: Education, Forests, Marriage & Divorce, Adoption, Labour Welfare."}, {"id": 27, "topic": "Constitution Basics", "question": "Which of the following is the primary subject of the Eighth Schedule of the Indian Constitution?", "options": {"A": "Official language of the Union", "B": "Languages recognized by the Constitution", "C": "Languages used in the Supreme Court", "D": "Languages used for State administration only"}, "answer": "B", "explanation": "Eight Schedule\n\n    •      The Eighth Schedule contains the list of 22 constitutionally recognized languages.\n    •      It originally contained 14 languages, and additional languages were included through subsequent\n           Constitutional Amendments.\n    •      22 Languages: Assamese, Bengali, Bodo, Dogri, Gujarati, Hindi, Kannada, Kashmiri, Konkani, Maithili,\n           Malayalam, Manipuri, Marathi, Nepali, Odia, Punjabi, Sanskrit, Santali, Sindhi, Tamil, Telugu and Urdu."}, {"id": 28, "topic": "Constitution Basics", "question": "Which of the following languages were added to the Eighth Schedule through Constitutional Amendments?\n\n    1.     Sindhi\n    2.     Konkani\n    3.     Manipuri\n    4.     Bodo", "options": {"A": "1 and 2 only", "B": "2, 3 and 4 only", "C": "1, 2, 3 and 4", "D": "1 and 4 only"}, "answer": "C", "explanation": "•      Sindhi → Added by the 21st Constitutional Amendment Act, 1967.\n    •      Konkani, Manipuri & Nepali → Added by the 71st Constitutional Amendment Act, 1992.\n    •      Bodo, Dogri, Maithili & Santhali → Added by the 92nd Constitutional Amendment Act, 2003."}, {"id": 29, "topic": "Constitution Basics", "question": "Which of the following languages of 8 th schedule was renamed through the 96th Constitutional Amendment\nAct, 2011", "options": {"A": "Oriya", "B": "Konkani", "C": "Manipuri", "D": "Sindhi"}, "answer": "A", "explanation": "•      96th Constitutional Amendment Act, 2011 changed the name “Oriya” to “Odia”."}, {"id": 30, "topic": "Constitution Basics", "question": "Consider the following statements regarding the Ninth Schedule of the Indian Constitution:\n\n\n\n    1.    It was added by the 1st Constitutional Amendment Act, 1951.\n    2.    It was originally introduced mainly to protect certain land reform laws from judicial challenge.\n    3.    Laws included in the Ninth Schedule have absolute immunity from judicial review.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "Ninth Schedule\n\n    •     Ninth Schedule: Added by the 1st Constitutional Amendment Act, 1951.\n    •     It includes:Acts and Regulations (originally 13, present 284) of state legislatures dealing with landreforms\n          and the abolition of Zamindari System,and of the Parliament dealing with other matters .\n    •     Purpose: It was initially created mainly to protect land reform and agrarian laws from challenges based on\n          Fundamental Rights.\n    •     Judicial Review: Ninth Schedule laws do not have absolute immunity. The Supreme Court held in I.R.\n          Coelho case (2007) that laws inserted after 24 April 1973 can be reviewed if they violate the Basic\n          Structure of the Constitution."}, {"id": 31, "topic": "Constitution Basics", "question": "Consider the following statements regarding the Tenth Schedule of the Indian Constitution:\n\n    1.    It deals with the disqualification of legislators on the ground of defection.\n    2.    It was inserted by the 52nd Constitutional Amendment Act, 1985.\n    3.    The 91st Constitutional Amendment Act, 2003 strengthened the anti-defection provisions.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Tenth Schedule\n\nDefection means leaving one political party and joining another political party after being elected as a\nrepresentative.\n\nTenth Schedule → Anti-Defection Law\n\n\n\n    •    Its main purpose is to prevent elected representatives from changing political parties for political gains.\n    •    Deals with: Disqualification of MPs and MLAs/MLCs for political defection.\n    •    Added by: 52nd Constitutional Amendment Act, 1985\n\n91st Constitutional Amendment Act, 2003:\n\n    •    No Split :Earlier, if 1/3rd members of a party left together, they could avoid disqualification by claiming it\n         was a “split.” The 91st Amendment removed this split exception.\n    •    Merger exception :Under the Tenth Schedule, if at least 2/3rd of the members of a legislative party agree to\n         merge with another political party, it is treated as a valid merger and they are not disqualified under the\n         Anti-Defection Law"}, {"id": 32, "topic": "Constitution Basics", "question": "The Eleventh Schedule of the Indian Constitution contains how many subjects related to Panchayats?", "options": {"A": "18", "B": "22", "C": "29", "D": "30"}, "answer": "C", "explanation": "11th Schedule\n\n    •    Specifies the powers , authority and Responsibilities of Panchayats.\n    •    It contains 29 subjects, including agriculture, rural housing, drinking water, roads, rural electrification,\n         poverty alleviation and education.\n    •    It was added through the 73rd Constitutional Amendment Act, 1992, which gave constitutional status to\n         Panchayati Raj Institutions."}, {"id": 33, "topic": "Constitution Basics", "question": "A State government wants to identify the constitutional subjects that may be devolved to urban local bodies\nsuch as Municipalities. Which Schedule provides this framework?", "options": {"A": "Eighth Schedule", "B": "Ninth Schedule", "C": "Eleventh Schedule", "D": "Twelfth Schedule"}, "answer": "D", "explanation": "Twelfth Schedule\n\n    •    Specifies the powers , authority and Responsibilities of Municipalities.\n    •    Introduced by the 74th Constitutional Amendment Act, 1992.\n\n\n\n    •    It contains 18 subjects that may be entrusted to urban local bodies.\n    •    These include urban planning, regulation of land use, roads and bridges, water supply, public health,\n         sanitation, fire services, urban forestry and slum improvement."}, {"id": 34, "topic": "Constitution Basics", "question": "Who aclaimed that Indian Constitution was framed after” Ransacking all the known constitutions of the world\n“?", "options": {"A": "Dr.Rajendra Prasad", "B": "Mahatma Gandhi", "C": "DR.B.R.Ambedkar", "D": "Pandit. Jawaharlal Nehru"}, "answer": "C", "explanation": "Dr. B. R. Ambedkar, the Chairman of the Drafting Committee, made this famous remark about the Indian\nConstitution.\n\n    •    The Constitution-makers studied various constitutions of the world and adopted suitable features according\n         to Indian conditions.\n    •    Therefore, the Indian Constitution is often described as a blend of ideas borrowed from different countries,\n         while adapting them to India’s needs."}, {"id": 35, "topic": "Constitution Basics", "question": "Which of the following features of the Indian Constitution was largely borrowed from the Government of India\nAct, 1935?", "options": {"A": "Fundamental Rights", "B": "Directive Principles of State Policy", "C": "Federal Scheme and administrative provisions", "D": "Fundamental Duties"}, "answer": "C", "explanation": "The Government of India Act, 1935\n\n    •    Most important source for many administrative and structural provisions of the Constitution.Nearly 250\n         provisions of this act included in Indian Constitution\n    •    Features such as the federal scheme, office of Governor, Public Service Commissions, Central – State\n         Relations, emergency provisions and administrative details were largely influenced by this Act."}, {"id": 36, "topic": "Constitution Basics", "question": "Match the following regarding Sources of Constitution:\n\n\n\n List I ( Country/Constitution)                               List II ( Features Borrowed)\n 1.South African Constitution                                 a.DPSP , Method of Election to President\n 2.Russian / Soviet/ USSR Constitution                        b.Concurrent List\n 3.Irish Constitution                                         c.Procedure of Amendment Of Constitution\n 4.Australian Constitution                                    d.Fundamental Duties, Ideal of Justice in Preamble\nSelect the Correct Code:", "options": {"A": "1-c, 2-d, 3-a, 4-b", "B": "1-a, 2-c, 3-d, 4-b", "C": "1-c, 2-a, 3-b, 4-d", "D": "1-d, 2-b, 3-a, 4-c"}, "answer": "A", "explanation": "South African Constitution →Features borrowed:\n\n    •     Procedure for Amendment of the Constitution\n    •     Method of election of Rajya Sabha members by proportional representation through single transferable vote\n\nRussian / Soviet / USSR Constitution →Features borrowed:\n\n    •     Fundamental Duties\n    •     Ideal of Justice(social, economic and political justice) in the Preamble\n\nIrish Constitution →Features borrowed:\n\n    •     Directive Principles of State Policy (DPSP)\n                 Ø Ireland borrowed it from Spain\n    •     Method of election of the President\n    •     Nomination of members to the Rajya Sabha by the President\n\nAustralian Constitution →Features borrowed:\n\n    •     Concurrent List\n    •     Freedom of trade, commerce and intercourse\n    •     Provision for Joint Sitting of Parliament\n    •     Language of the Constitution"}, {"id": 37, "topic": "Constitution Basics", "question": "Which of the following Pairs is/are correctly matched?\n\n    1.    Germany Constitution – Suspension of Fundamental rights during emergency.\n    2.    French Constitution – Ideals of Liberty, Equality and Fraternity in the Preamble.\n    3.    Ombudsman in Scandinavia – Office of Lokpal and Lokayukta in India\n    4.    Norway Constitution – Procedure for electing members for Upper and Lower Houses", "options": {"A": "1,2&3", "B": "2,3&4", "C": "1,3&4", "D": "1,23&4"}, "answer": "D", "explanation": "German Constitution (Weimar Constitution)-Features borrowed\n\n          •   Suspension of Fundamental rights during emergency.\n\nFrench Constitution -Features borrowed\n\n          •   Concept of Republic\n          •   Ideals of Liberty, Equality and Fraternity in the Preamble\n\nOmbudsman in Scandinavia – Features borrowed\n\n    •     Office of Lokpal and Lokayukta in India\n\nNorway Constitution -Features borrowed\n\n    •     Procedure for electing members for Upper and Lower Houses"}, {"id": 38, "topic": "Constitution Basics", "question": "Which of the following combinations correctly represents features borrowed from the American Constitution?", "options": {"A": "Fundamental Rights and Judicial Review", "B": "DPSP and Fundamental Duties", "C": "Parliamentary System and Rule of Law", "D": "Concurrent List and Joint Sitting"}, "answer": "A", "explanation": "American Constitution →Features Borrowed\n\n    •     Fundamental Rights, Judicial Review, Independence of Judiciary, Impeachment of the President, Removal\n          of Judges of the Supreme Court and High Courts, Preamble , and Vice-President as the ex-officio Chairman\n          of Rajya Sabha."}, {"id": 39, "topic": "Constitution Basics", "question": "Which one of the following expressions in the Indian Constitution was borrowed from the Japanese\nConstitution?", "options": {"A": "Due Process of Law", "B": "Procedure Established by Law", "C": "Rule of Law", "D": "Equal Protection of Law"}, "answer": "B", "explanation": "Japanese Constitution →Features Borrowed\n\n    •    Procedure Established by Law.\n\n🔹 This principle is reflected in Article 21, which protects life and personal liberty.\n\n🔹 Procedure Established by Law means that a person can be deprived of life or personal liberty if it is done\naccording to a valid law and the procedure prescribed by that law."}, {"id": 40, "topic": "Constitution Basics", "question": "Which of the following features of the Indian Constitution reflects the influence of the Canadian Constitution?", "options": {"A": "Fundamental Rights", "B": "Directive Principles of State Policy", "C": "Federation with a strong Centre", "D": "Fundamental Duties"}, "answer": "C", "explanation": "Canadian Constitution →Features Borrowed\n\n    •    Federation with a Strong Centre, Residuary Powers vested in the Centre, Appointment of Governors by the\n         Centre, and Advisory Jurisdiction of the Supreme Court."}, {"id": 41, "topic": "Constitution Basics", "question": "Which of the following features of the Indian Constitution was borrowed from the British Constitution?", "options": {"A": "Fundamental Rights", "B": "Parliamentary Government", "C": "Fundamental Duties", "D": "Procedure Established by Law"}, "answer": "B", "explanation": "British /UK Constitution – Features Borrowed\n\nParliamentary Government, Cabinet System, Rule of Law, Single Citizenship, Bicameralism, Parliamentary\nPrivileges, Legislative Procedure, Prerogative Writs , Post of PM , Election System , Speaker , Deputy Speaker and\nOffice of CAG."}, {"id": 42, "topic": "Preamble", "question": "Who said Preamble as ‘The Identity Card Of the Constitution ‘?", "options": {"A": "Pandit Jawaharlal Nehru", "B": "DR.Babu Rajendra Prasad", "C": "N.A.Palkhivala", "D": "DR.B.R.Ambedkar"}, "answer": "C", "explanation": "Preamble :refers to the introduction or preface of the constitution.It contains essence or summary of constitution.\n\n    •    N.A.Palkhivala:An eminent jurist and constitutional expert – called the Preamble as ‘The Identity Card Of\n         the Constitution ‘."}, {"id": 43, "topic": "Preamble", "question": "Consider the following statements regarding the Preamble:\n\n    1.   It was adopted along with the Constitution on 26 November 1949.\n    2.   It came into force along with the Constitution on 26 January 1950.\n    3.   It declares the source of authority of the Constitution.\n\nWhich of the statements given above are correct?", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    The Preamble was adopted on 26 November 1949 and the Constitution came into force on 26 January\n         1950. The opening words “We, the People of India” indicate that the ultimate source of authority is the\n         people of India."}, {"id": 44, "topic": "Preamble", "question": "Which of the following best represents the significance of the Preamble?", "options": {"A": "It establishes all Fundamental Rights.", "B": "It explains the source, nature and objectives of the Indian Constitution.", "C": "It prescribes the complete procedure for constitutional amendments.", "D": "It defines the powers of every constitutional authority."}, "answer": "B", "explanation": "•    The Preamble explains the source of the Constitution (“We, the People of India”), the nature of the Indian\n         State (Sovereign, Socialist, Secular, Democratic Republic), and its objectives (Justice, Liberty, Equality\n         and Fraternity). Hence, it is often described as the key to the Constitution."}, {"id": 45, "topic": "Preamble", "question": "The Preamble to the Constitution of India is based on which of the following?", "options": {"A": "Cabinet Mission Plan", "B": "Objectives Resolution", "C": "Government of India Act, 1935", "D": "Indian Independence Act, 1947"}, "answer": "B", "explanation": "•    The Preamble is based on the Objectives Resolution moved by Jawaharlal Nehru on 13 December 1946 and\n         adopted by the Constituent Assembly on 22 January 1947.\n    •    It laid down the basic ideals and objectives of the future Constitution of India.\n    •    In simple words, it explained what kind of India the Constitution should create.The Objectives Resolution\n         became the basis for the Preamble of the Indian Constitution."}, {"id": 46, "topic": "Preamble", "question": "Which of the following words were added to the Preamble by the 42nd Constitutional Amendment Act, 1976?\n\n    1.   Socialist\n    2.   Secular\n    3.   Integrity", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    The 42nd Constitutional Amendment Act, 1976 added “Socialist” and “Secular” and Integrity words to\n         Constitution.”\n    •    This was the only amendment so far made to the Preamble."}, {"id": 47, "topic": "Preamble", "question": "Consider the following pairs related to the Preamble:\n\n    1.   Socialist – Commitment to social and economic justice\n    2.   Secular – Equal respect and protection for all religions\n    3.   Democratic – Government based on the will of the people\n\n\n\n    4.    Republic – Elected head of the State\n\nWhich of the pairs given above are correctly matched?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•      Socialist: It means the State aims to promote social and economic justice and reduce inequalities. Indian\n          socialism follows a democratic and welfare-oriented approach. The word “Socialist” was added to the\n          Preamble by the 42nd Constitutional Amendment Act, 1976.\n    •     Secular: It means India has no official State religion. The State treats all religions equally and protects the\n          freedom of individuals to follow their religion. The word “Secular” was added by the 42nd Constitutional\n          Amendment Act, 1976.\n    •      Democratic: It means political power ultimately belongs to the people. Citizens elect their representatives\n          through regular elections. India follows a representative democratic system.Simply- Of the People,by the\n          people ,for the people.\n    •      Republic: It means the head of the State is elected and is not a hereditary ruler. In India, the President is\n          the elected head of the State."}, {"id": 48, "topic": "Preamble", "question": "Consider the following pairs related to the Justice mentioned in the Preamble:\n\n    1.    Social Justice – Removal of social inequalities and discrimination\n    2.    Economic Justice – Reduction of economic inequalities and fair distribution of resources\n    3.    Political Justice – Equal political rights and opportunities to participate in government\n\nWhich of the pairs given above are correctly matched?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3\n\nAns: D\n\nTheory\n\nJustice: The Constitution promises “Justice — social, economic and political” to all citizens.\n\n    •     Social Justice:It aims to eliminate social inequalities, discrimination and social disadvantages. It promotes\n          equal treatment of individuals irrespective of caste, religion, gender or social status.\n\n\n\n    •    Economic Justice:It aims to reduce economic inequalities and ensure that people have fair opportunities to\n         earn a livelihood and access economic resources. It does not mean that everyone must have exactly the\n         same income.\n    •    Political Justice:It means providing equal political rights and opportunities to citizens. It includes the right\n         to participate in the political process, such as voting and contesting elections, subject to constitutional\n         conditions.\n\nQ49Which of the following is NOT specifically mentioned under Liberty in the Preamble?"}, "answer": "D", "explanation": "Justice: The Constitution promises “Justice — social, economic and political” to all citizens.\n\n    •     Social Justice:It aims to eliminate social inequalities, discrimination and social disadvantages. It promotes\n          equal treatment of individuals irrespective of caste, religion, gender or social status.\n\n\n\n    •    Economic Justice:It aims to reduce economic inequalities and ensure that people have fair opportunities to\n         earn a livelihood and access economic resources. It does not mean that everyone must have exactly the\n         same income.\n    •    Political Justice:It means providing equal political rights and opportunities to citizens. It includes the right\n         to participate in the political process, such as voting and contesting elections, subject to constitutional\n         conditions.\n\nQ49Which of the following is NOT specifically mentioned under Liberty in the Preamble?\n\nA. Thought\n\nB. Expression\n\nC. Association\n\nD. Belief\n\nAns:C\n\nTheory\n\nLiberty:The Preamble secures “Liberty of thought, expression, belief, faith and worship.”\n\n    •    Liberty of Thought: Freedom to develop and hold one’s own ideas and opinions.\n    •    Liberty of Expression: Freedom to communicate or express one’s thoughts, opinions and views.\n    •    Liberty of Belief: Freedom to hold personal beliefs about religion, philosophy or other matters.\n    •    Liberty of Faith: Freedom to have faith in and follow one’s chosen religion or system of belief.\n    •    Liberty of Worship: Freedom to practise religious worship according to one’s faith, subject to constitutional\n         limitations.\n\nNote :Liberty is not the licence to do anything.\n\n    •    It is not absolute ,can be reasonably restricted under the constitution .\n    •    Individual liberty must be balanced with public order, security, morality and the rights of others, wherever\n         the Constitution permits restrictions."}, {"id": 49, "topic": "Preamble", "question": "Consider the following pairs related to Equality mentioned in the Preamble:\n\n    1.   Equality of Status – Equal social status for all individuals\n    2.   Equality of Opportunity – Equal opportunities for all individuals\n    3.   Equality before Law – Equal treatment under the law\n\nWhich of the pairs given above are correctly matched?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1 and 2 only"}, "answer": "A", "explanation": "The Preamble promises “Equality of status and of opportunity.”\n\nEquality of Status:\n\n    •     It means all individuals should enjoy equal social status. No person should be considered superior or\n          inferior because of caste, religion, gender, or social position.\n\nEquality of Opportunity:\n\n    •     It means everyone should have equal opportunities to progress in life, particularly in areas such as\n          education, employment and public services, subject to constitutional provisions permitting special measures\n          for disadvantaged groups.\n\nEquality before Law: Equality before Law is provided under Article 14, not as the wording of the Preamble."}, {"id": 50, "topic": "Preamble", "question": "Which of the following best describes Fraternity in the Preamble of the Indian Constitution?", "options": {"A": "Equal distribution of wealth", "B": "Sense of brotherhood among all citizens", "C": "Freedom to practise any religion", "D": "Equal political rights"}, "answer": "B", "explanation": "Fraternity means a sense of brotherhood, unity and common belonging among all citizens. It encourages people to\nlive together with mutual respect and harmony despite differences of caste, religion, language, region or culture.\n\nThe Preamble connects Fraternity with two important objectives:\n\n    1.    Dignity of the Individual:Every person should be treated with respect and dignity. No individual should be\n          considered inferior because of their social, religious, economic or other background.\n    2.    Unity and Integrity of the Nation:Fraternity promotes a feeling of national unity and togetherness among\n          citizens. It helps maintain the unity and integrity of India despite its diversity.\n\n    Note: Orginal Preamble-Unity of the Nation\n\n    •     42 nd Constitutional Amendment act – Unity and Integrity of the Nation."}, {"id": 51, "topic": "Preamble", "question": "Consider the following cases regarding Preamble a part of the Indian Constitution or not ?\n\n    1.    Berubari Union Case (1960)\n    2.    Kesavananda Bharati Case (1973)\n\nWhich statement correctly describes the change in the Supreme Court’s position?", "options": {"A": "Both cases held that the Preamble is not a part of the Constitution.", "B": "Both cases held that the Preamble is a part of the Constitution.", "C": "Berubari held it was not a part; Kesavananda Bharati held it was a part.", "D": "Berubari held it was a part; Kesavananda Bharati held it was not a part."}, "answer": "C", "explanation": "Preamble a part of the Indian Constitution or not :\n\n    •     Berubari Union Case (1960):The Preamble was considered not a part of the Constitution.\n    •     Kesavananda Bharati Case (1973):The Supreme Court held that the Preamble is a part of the Constitution\n          and can be used as an important guide for constitutional interpretation.\n\nOther cases which supports / tells Preamble is a part of Indian Constitution are:\n\n    1.    Minerva Mill Case1980\n    2.    S.R.Bommai Case 1994\n    3.    LIC of India Case 1995"}, {"id": 52, "topic": "Preamble", "question": "Which Supreme Court case held that the Preamble can be amended, but such an amendment cannot alter the\nBasic Structure of the Constitution?", "options": {"A": "Berubari Union Case", "B": "Golaknath Case", "C": "Kesavananda Bharati Case", "D": "S.R. Bommai Case"}, "answer": "C", "explanation": "In Kesavananda Bharati v. State of Kerala (1973), the Supreme Court held that the Preamble is a part of the\nConstitution.\n\n    •     The Court also held that the Preamble can be amended under Article 368.\n    •     However, Parliament cannot amend the Preamble in a way that destroys the Basic Structure of the\n          Cameonstitution.\n    •     The judgment is also famous for establishing the Basic Structure Doctrine."}, {"id": 53, "topic": "Fundamental Rights", "question": "Why is Part III of the Indian Constitution often called the “Magna Carta of India”?", "options": {"A": "Part III establishes the structure of Parliament and State Legislatures.", "B": "Part III guarantees Fundamental Rights and protects individual liberty against arbitrary State action.", "C": "Part III contains the Directive Principles of State Policy.", "D": "Part III deals exclusively with the powers of the President."}, "answer": "B", "explanation": "which are the basic rights guaranteed to individuals and protect their liberty, equality and dignity against arbitrary\nState action.\n\n      •   Like the Magna Carta of 1215, which limited the arbitrary powers of the English monarch, Part III places\n          constitutional limitations on State power.\n      •   Article 32 provides a constitutional remedy for the enforcement of these rights."}, {"id": 54, "topic": "Fundamental Rights", "question": "How many Fundamental Rights are currently guaranteed by the Constitution of India?", "options": {"A": "5", "B": "6", "C": "7", "D": "8"}, "answer": "B", "explanation": "was removed from the list of Fundamental Rights by the 44th Constitutional Amendment Act, 1978. It is now a\nconstitutional/legal right under Article 300A. Therefore, at present, India has 6 Fundamental Rights:\n\n1.Right to Equality – Articles 14–18\n\n2.Right to Freedom – Articles 19–22\n\n3.Right against Exploitation – Articles 23–24\n\n4.Right to Freedom of Religion – Articles 25–28\n\n5.Cultural and Educational Rights – Articles 29–30\n\n6.Right to Constitutional Remedies – Article 32"}, {"id": 55, "topic": "Fundamental Rights", "question": ".Which of the following are the important features of Fundamental Rights?\n\n1.They are guaranteed by the Constitution.\n\n2.They are enforceable by courts.\n\n3.They are absolute and cannot be subject to any restrictions.\n\n4.They can be suspended or restricted in certain constitutional circumstances.", "options": {"A": "1, 2 and 4 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2, 3 and 4"}, "answer": "A", "explanation": "•    Constitutional Guarantee: Fundamental Rights are guaranteed by the Constitution under Part III (Articles\n         12–35).\n    •    Justiciable: They are enforceable by courts. Article 32 provides the right to approach the Supreme Court for\n         their enforcement.\n    •    Not Absolute: Fundamental Rights are not absolute. Reasonable restrictions can be imposed as permitted\n         by the Constitution.\n    •    Protection against State: They primarily protect individuals against arbitrary action of the State.\n    •    Some Rights against Private Individuals: Certain rights, such as Articles 17, 23 and 24, also operate against\n         private individuals.\n    •    Citizens and Non-Citizens: Some rights are available only to citizens (Articles 15, 16, 19 and 29), while\n         several others are available to all persons.\n    •    Amendable: Fundamental Rights can be amended by Parliament, but the amendment cannot violate the\n         Basic Structure of the Constitution (Kesavananda Bharati case, 1973).\n    •    Special Constitutional Protection: Articles 20 and 21 cannot be suspended through an order under Article\n         359, even during a National Emergency, following the 44th Amendment Act, 1978.\n    •    Writ Remedies: The Supreme Court under Article 32 and High Courts under Article 226 can issue writs for\n         protection of rights.\n    •    Right to Property: It was originally a Fundamental Right but was removed by the 44th Amendment Act,\n         1978 and is now a constitutional right under Article 300A."}, {"id": 56, "topic": "Fundamental Rights", "question": "Which Fundamental Rights are available only to citizens of India?", "options": {"A": "14, 15, 16, 19 and 29", "B": "15, 16, 19 and 29", "C": "14, 16, 19 and 21", "D": "15, 17, 19 and 21"}, "answer": "B", "explanation": "Rights such as Articles 14, 20, 21, 21A, 23–28 are available to all persons, including non-citizens (subject to\nconstitutional exceptions)."}, {"id": 57, "topic": "Fundamental Rights", "question": "Which of the following correctly defines Friendly Aliens and Enemy Aliens?", "options": {"A": "Friendly aliens are Indian citizens living abroad, while enemy aliens are foreign tourists.", "B": "Friendly aliens are foreigners whose country is at peace with India, while enemy aliens are foreigners whose\ncountry is at war with India.", "C": "Friendly aliens are foreigners working for the Indian Government, while enemy aliens are refugees.", "D": "Both terms refer to Indian citizens during a National Emergency."}, "answer": "B", "explanation": "Enemy Alien: A foreign national whose country is at war with India. Enemy aliens are subject to certain special\nconstitutional restrictions. Under Article 22(3)(a), the safeguards under Article 22(1) and 22(2) do not apply to\nenemy aliens."}, {"id": 58, "topic": "Fundamental Rights", "question": "Which of the following correctly represents the meaning of “State” under Article 12 of the Indian Constitution?", "options": {"A": "Government of India, Parliament, State Governments and private companies", "B": "Parliament, State Legislatures, courts and foreign governments", "C": "Government of India, State Governments, Local Authorities and private organisations only", "D": "Government and Parliament of India, Government and Legislatures of States, Local Authorities and Other\nAuthorities"}, "answer": "D", "explanation": "For the purpose of Part III (Fundamental Rights), “State” includes:\n\n    •    Government of India\n    •    Parliament of India\n    •    Government of each State\n    •    Legislature of each State\n    •    Local Authorities – Municipalities, Panchayats, District Boards, etc.\n    •    Other Authorities – Bodies/instrumentalities of government having sufficient governmental control and\n         performing public functions- statutory or non statutory authorities like LIC,ONGC,SAIL etc."}, {"id": 59, "topic": "Fundamental Rights", "question": "Which of the following statements best explains Article 13 of the Indian Constitution?", "options": {"A": "Article 13 defines “State” and specifies which authorities can be sued for violation of Fundamental Rights.", "B": "Article 13 protects Fundamental Rights by making laws that violate them void to the extent of the violation.", "C": "Article 13 gives citizens the right to approach only the High Court for enforcement of Fundamental Rights.", "D": "Article 13 deals with the suspension of Fundamental Rights during a National Emergency."}, "answer": "B", "explanation": "Article 13 – Laws inconsistent with Fundamental Rights\n\n    •   Pre-Constitution laws: Any law made before the Constitution came into force becomes void to the extent it\n        is inconsistent with Fundamental Rights – Article 13(1).\n    •   Post-Constitution laws: The State cannot make any law that takes away or reduces Fundamental Rights. If\n        it does, that law is void to the extent of the violation – Article 13(2).\n    •   Meaning of “law”: Under Article 13(3), law includes ordinance, order, bye-law, rule, regulation,\n        notification, custom or usage having the force of law.\n    •   Constitutional Amendments: Article 13(4) says Article 13 does not apply to constitutional amendments\n        made under Article 368. This was inserted by the 24th Constitutional Amendment Act, 1971.\n    •   Judicial Review: Article 13 provides an important constitutional basis for Judicial Review, allowing courts\n        to examine whether laws violate Fundamental Rights."}, {"id": 60, "topic": "Fundamental Rights", "question": "Which of the following statements correctly explains Article 14 of the Indian Constitution?", "options": {"A": "Article 14 guarantees identical treatment to every person in all situations.", "B": "Article 14 provides equality only to Indian citizens in matters of public employment.", "C": "Article 14 guarantees equality before law and equal protection of laws, while permitting reasonable classification.", "D": "Article 14 prohibits discrimination only on the grounds of religion, race, caste and sex."}, "answer": "C", "explanation": "•    Equality before Law: No person is above the law and everyone is subject to the ordinary law of the land.\n    •    Equal Protection of Laws: Persons in similar circumstances should be treated alike.\n    •    Available to: It is available to all persons, including citizens and foreigners.\n    •    Reasonable Classification: Article 14 does not require identical treatment in every situation. Reasonable\n         classification is permitted.\n\nTwo requirements of valid classification:\n\n    •    Intelligible Differentia → There must be a clear basis for distinguishing the grouped persons from others.\n    •    Rational Nexus → The classification must have a reasonable connection with the objective of the law.\n\nRule of Law – A.V. Dicey: The concept of Equality before Law in Article 14 is closely associated with Dicey’s Rule\nof Law, particularly the principle that no person is above the law.\n\nArbitrary State action: Arbitrary or unreasonable State action can violate Article 14."}, {"id": 61, "topic": "Fundamental Rights", "question": "The concept of “Reasonable Classification” as a limitation to the Right to Equality (Article 14) was established\nin which case?", "options": {"A": "Kesavananda Bharati v. State of Kerala", "B": "State of West Bengal v. Anwar Ali Sarkar", "C": "Maneka Gandhi v. Union of India", "D": "Golaknath Case v. State of Punjab & Anrs."}, "answer": "B", "explanation": "Sarkar (1952). The Supreme Court held that a valid classification must be based on intelligible differentia and have a\nrational nexus with the object of the law. The Court struck down the West Bengal Special Courts Act, 1950, as it\nallowed arbitrary discrimination without clear criteria."}, {"id": 62, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 15 of the Indian Constitution?", "options": {"A": "Article 15 provides equality of opportunity in public employment and permits reservation in promotions.", "B": "Article 15 prohibits discrimination against citizens on specified grounds and permits certain special provisions for\ndisadvantaged groups.", "C": "Article 15 abolishes untouchability and makes its practice punishable.", "D": "Article 15 abolishes titles and regulates foreign awards."}, "answer": "B", "explanation": "•    Article 15(1): The State shall not discriminate against any citizen only on grounds of religion, race, caste,\n         sex or place of birth.\n    •    Article 15(2): No citizen can be subjected to discrimination on these grounds regarding access to shops,\n         public restaurants, hotels, places of public entertainment and certain public-use facilities.\n    •    Article 15(3): Permits special provisions for women and children.\n    •    Article 15(4): Permits special provisions for the advancement of Socially and Educationally Backward\n         Classes (SEBCs/OBCs), SCs and STs.\n    •    Article 15(5): Permits special provisions for admission of SEBCs/OBCs, SCs and STs in educational\n         institutions, including private educational institutions, except minority educational institutions under\n         Article 30(1).\n    •    Article 15(6): Permits special provisions for Economically Weaker Sections (EWS), including reservation\n         in educational institutions, subject to the constitutional limit of up to 10%.\n\nImportant Amendments:\n\n1st Amendment, 1951 → Article 15(4)\n\n93rd Amendment, 2005 → Article 15(5)\n\n103rd Amendment, 2019 → Article 15(6)"}, {"id": 63, "topic": "Fundamental Rights", "question": "Which of the following best explains Article 16 of the Indian Constitution?", "options": {"A": "Equality of opportunity in matters of public employment, along with constitutionally permitted reservations", "B": "Equality before law for all persons", "C": "Prohibition of discrimination in public places only", "D": "Abolition of titles"}, "answer": "A", "explanation": "•    Article 16 guarantees equality of opportunity to all citizens in matters of employment or appointment to\n         any office under the State.\n    •    Article 16(1) –Guarantees equality of opportunity in public employment.\n    •    Article 16(2)– Prohibits discrimination against citizens on grounds only of religion, race, caste, sex,\n         descent, place of birth or residence.\n    •    Article 16(3) –Empowers Parliament to prescribe local residence requirements for specific public posts\n         within a state or union territory.\n    •    Article 16(4) –Permits reservation for a backward class of citizens that is not adequately represented in\n         State services.\n\n\n\n    •   Article 16(4A) – Permits reservation in promotion for SCs and STs, subject to constitutional conditions.\n    •   Article 16(4B) – Allows unfilled reserved vacancies to be carried forward to subsequent years for SCs and\n        STs.\n    •   Article 16(5) – Exempts office-bearers of religious or denominational institutions from general secular\n        hiring rules if the role requires adherence to that specific religion.\n    •   Article 16(6) – Enables EWS reservation up to 10% in public employment."}, {"id": 64, "topic": "Fundamental Rights", "question": "Which of the following correctly explains the Mandal Commission, Indra Sawhney case and Creamy Layer?", "options": {"A": "The Mandal Commission recommended 10% EWS reservation, and the Indra Sawhney case introduced EWS\nreservation.", "B": "The Mandal Commission dealt only with SC/ST reservation, while the Indra Sawhney case abolished OBC\nreservation.", "C": "The Mandal Commission recommended 27% OBC reservation; the Indra Sawhney case upheld it and required\nexclusion of the creamy layer.", "D": "The Mandal Commission recommended reservation in promotions for all OBCs, which was upheld by the\nSupreme Court."}, "answer": "C", "explanation": "•   Official name: Second Backward Classes Commission.\n    •   Established: 1979 under Article 340.\n    •   Chairman: B.P. Mandal.\n    •   Purpose: To identify socially and educationally backward classes and recommend measures for their\n        advancement.\n    •   Major recommendation: 27% reservation for OBCs in Central Government services.\n\nIndra Sawhney v. Union of India (1992)\n\n    •   Also known as the Mandal case.\n    •   Supreme Court’s 9-judge Constitution Bench upheld 27% OBC reservation under Article 16(4).\n    •   The Court held that the creamy layer among OBCs must be excluded from reservation benefits.\n    •   It laid down the general principle that total reservation should ordinarily not exceed 50%, subject to\n        exceptional circumstances.\n    •   It held that Article 16(4) does not permit reservation for OBCs in promotions.\n    •   Income alone is not the sole basis; the applicable government criteria also consider prescribed status,\n        occupation and other conditions.\n\nCreamy Layer\n\n    •   Creamy Layer means the socially and economically advanced sections within the OBC category.They are\n        excluded from OBC reservation benefits.The purpose is to ensure that reservation benefits reach the\n        genuinely backward sections of the OBC community."}, {"id": 65, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 17 of the Indian Constitution?", "options": {"A": "Article 17 abolishes titles and prohibits citizens from accepting foreign titles.", "B": "Article 17 abolishes untouchability and makes its practice in any form an offence punishable by law.", "C": "Article 17 provides equality of opportunity in public employment.", "D": "Article 17 prohibits discrimination on grounds of religion, race, caste, sex and place of birth."}, "answer": "B", "explanation": "•    Untouchability is abolished and its practice in any form is prohibited.\n    •    Enforcing any disability arising out of untouchability is an offence punishable according to law.\n    •    Article 17 is available against both the State and private individuals.\n\nParliament enacted the Protection of Civil Rights Act, 1955 to prescribe punishment for the practice of\nuntouchability.\n\n    •    It covers practices such as denying access to shops, restaurants, public places, places of worship and other\n         public facilities on the ground of untouchability.\n    •    The Act was originally called the Untouchability (Offences) Act, 1955 and was renamed the Protection of\n         Civil Rights Act, 1955 in 1976.\n\nArticle 17 is an important example of a Fundamental Right that has a horizontal application, meaning it can operate\nagainst private individuals as well as the State."}, {"id": 66, "topic": "Fundamental Rights", "question": "Which of the following correctly explains Article 18 – Abolition of Titles?", "options": {"A": "Article 18 prohibits only hereditary titles and allows all other titles.", "B": "Article 18 abolishes all government awards, including military and academic distinctions.", "C": "Article 18 abolishes titles, while allowing military and academic distinctions and regulating acceptance of foreign\ntitles and benefits.", "D": "Article 18 prohibits only Indian citizens from accepting awards from foreign States."}, "answer": "C", "explanation": "•    Article 18(1) → The State shall not confer any title, except military or academic distinctions.\n    •    Article 18(2) → No citizen of India shall accept any title from a foreign State.\n    •    Article 18(3) → A non-citizen holding an office of profit or trust under the State cannot accept a foreign\n         title without the President’s consent.\n    •    Article 18(4) → A person holding an office of profit or trust under the State cannot accept any present,\n         emolument or office from a foreign State without the President’s consent.\n\nNational awards such as Bharat Ratna and Padma Awards are not treated as titles,provided they are not used as\nprefixes or suffixes."}, {"id": 67, "topic": "Fundamental Rights", "question": ".Which of the following pairs relating to Article 19 is/are correctly matched?\n\n1.Freedom of speech and expression – Article 19(1)(a)\n\n2.Freedom to assemble peacefully and without arms – Article 19(1)(b)\n\n3.Freedom to form associations or unions – Article 19(1)(c)\n\n4.Freedom to move freely throughout India – Article 19(1)(d)", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "1, 2, 3 and 4", "D": "2, 3 and 4 only"}, "answer": "C", "explanation": "Article 19 guarantees six freedoms to Indian citizens, subject to reasonable restrictions.\n\n    •    Article 19(1)(a) → Freedom of speech and expression\n    •    Article 19(1)(b) → Freedom to assemble peacefully and without arms\n    •    Article 19(1)(c) → Freedom to form associations, unions or co-operative societies\n    •    Article 19(1)(d) → Freedom to move freely throughout India\n    •    Article 19(1)(e)→ Freedom to reside and settle in any part of India\n    •    Article 19(1)(g) → Freedom to practise any profession or carry on any occupation, trade or business\n\nNote:19(1)(f) = Right to acquire,hold and dispose of property repealed by the 44th Amendment Act, 1978."}, {"id": 68, "topic": "Fundamental Rights", "question": "Which of the following pairs relating to reasonable restrictions under Article 19 is/are correctly matched?\n\n1.Article 19(2) – Freedom of speech and expression\n\n2.Article 19(3) – Freedom to assemble peacefully and without arms\n\n3.Article 19(5) – Freedom of movement and residence\n\n4.Article 19(6) – Freedom of profession, occupation, trade or business", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•      Article 19 freedoms are not absolute. The government can restrict them only on the grounds specifically\n           permitted by the Constitution, and the restriction must be reasonable, not arbitrary or excessive.\n\nArticle 19 – Reasonable Restrictions\n\n    •      19(2) – Speech & Expression: Sovereignty & integrity, security of State, friendly relations with foreign\n           States, public order, decency/morality, contempt of court, defamation, incitement to an offence.\n    •      19(3) – Assembly: Sovereignty & integrity of India, security of State, public order.\n    •      19(4) – Associations: Sovereignty & integrity of India, security of State, public order, morality.\n    •      19(5) – Movement & Residence: Interest of general public, protection of interests of Scheduled Tribes.\n    •      19(6) – Profession/Trade/Business: Interest of general public, professional/technical qualifications, State\n           monopoly."}, {"id": 69, "topic": "Fundamental Rights", "question": "Which of the following pairs correctly describes the protections guaranteed under Article 20 of the Indian\nConstitution?\n\n1.Protection against ex-post-facto laws – Article 20(1)\n\n2.Protection against double jeopardy – Article 20(2)\n\n3.Protection against self-incrimination – Article 20(3)", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•      Article 20 provides protection against arbitrary and excessive punishments to an accuse person .\n\nThree important protections to persons accused of offences:\n\n    •      Article 20(1) –Protection against Ex-post-facto Law: A person cannot be convicted for an act that was not\n           an offence when it was committed, nor can a greater punishment be imposed than what was applicable at\n           the time of the offence.\n           Example:Abhi commits an act in 2025 when it is not an offence. In 2026, a new law makes that act an\n           offence. Abhi cannot be punished for the act committed in 2025 under the new law.\n    •      Article 20(2) –Double Jeopardy: A person cannot
