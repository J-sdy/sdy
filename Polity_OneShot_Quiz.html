a constitutional duty to:\n\n    •    Protect every State against external aggression and internal disturbance.\n    •    Ensure that the government of every State is carried on according to the Constitution.\n\nArticle 356 – Constitutional Machinery\n\n    •    If the government of a State cannot be carried on in accordance with the Constitution, President’s Rule may\n         be imposed under Article 356, subject to constitutional requirements."}, {"id": 238, "topic": "Centre-State Relations", "question": "Which of the following correctly describes the constitutional provisions relating to directions issued by the\nUnion to the States?", "options": {"A": "The Union can issue directions to States only when a National Emergency is in operation.", "B": "The Union can issue directions to States in specified situations, including ensuring compliance with\nParliamentary laws, preventing obstruction of Union executive power and certain matters relating to Scheduled\nAreas and linguistic minorities.", "C": "The Union can issue directions to States on every subject without any constitutional limitation.", "D": "Only the President of India, acting personally, can issue all directions to State Governments."}, "answer": "B", "explanation": "Article 256 – Compliance with Laws\n\nStates must ensure compliance with Parliamentary laws and applicable existing laws.\n\nThe Union can give directions to States for their proper implementation.\n\nArticle 257 – Protection of Union’s Executive Power\n\nState executive power must not impede or prejudice Union executive power.\n\nUnion directions may relate to:\n\n\n\n• Means of communication → Construction and maintenance of communication facilities declared to be of national\nor military importance.\n\n• Railways → Measures for the protection of railways within the State.\n\n    Article 339(2) – Scheduled Areas & Scheduled Tribes\n\nThe Union can give directions to a State regarding the welfare of Scheduled Tribes and administration of Scheduled\nAreas, as provided by the Constitution.\n\n  Article 350A – Linguistic Minorities\n\nThe Union can issue directions to a State regarding provision of adequate facilities for instruction in the mother\ntongue at the primary stage for children belonging to linguistic minority groups.\n\n Article 353 – During National Emergency\n\nDuring a National Emergency under Article 352, the Union’s executive power extends to giving directions to a State\nregarding the manner in which its executive power is to be exercised."}, {"id": 239, "topic": "Centre-State Relations", "question": "Which of the following best explains Article 258?", "options": {"A": "The State Government transfers its executive functions to the Union Government.", "B": "The Union Government transfers its legislative powers to the State Legislature.", "C": "The Union entrusts some of its executive functions to the State Government or its officers, with the consent of the\nState Government.", "D": "The State Government transfers Union subjects to Parliament."}, "answer": "C", "explanation": "•    Whose function? → Union’s executive function\n    •    Who can entrust it? → President\n    •    Who performs it? → State Government or State officers\n    •    Whose consent is required? → State Government\n    •    What type of matter? → A matter falling within the executive power of the Union\n\nSimple\n\n    •    A particular Union subject normally comes under the Union Government.\n    •    If the Union wants the State Government or its officers to perform a particular executive function related to\n         that Union subject.\n\n     President – entrusts the union’s executive Function – State govt/offucers"}, {"id": 240, "topic": "Centre-State Relations", "question": "Which of the following best explains Article 258A?", "options": {"A": "The Union Government transfers its executive functions to the State Government.", "B": "Parliament transfers State legislative powers to the Union.", "C": "The State entrusts some of its executive functions to the Union Government or its officers, with the consent of the\nGovernment of India.", "D": "The Governor transfers all State subjects permanently to the Union."}, "answer": "C", "explanation": "•      Whose function? → State’s executive function\n    •      Who can entrust it? → Governor\n    •      Who performs it? → Government of India or Union officers\n    •      Whose consent is required? → Government of India\n    •      What type of matter? → A matter falling within the executive power of the State\n\nSimple :\n\nA particular State subject normally comes under the State Government.\n\nIf the State wants the Union Government or Union officers to perform a particular executive function related to that\nState subject:\n\nGovernor → entrusts State function → Union Government/Officers"}, {"id": 241, "topic": "Centre-State Relations", "question": "Which of the following correctly explains Article 260 of the Indian Constitution?", "options": {"A": "The Union Government can exercise its powers over any foreign country without obtaining its consent.", "B": "The Government of India can undertake certain executive, legislative or judicial functions in a territory outside\nIndia, if an agreement is made with the government of that territory.", "C": "Parliament can automatically make every foreign territory a part of India.", "D": "Article 260 deals with the settlement of disputes between Indian States."}, "answer": "B", "explanation": "•      A territory outside India can request India to perform certain functions on its behalf.\n    •      The Government of India can agree to undertake those functions.\n    •      This arrangement must be based on an agreement with the government of that foreign territory.\n\nThe Government of India may undertake:\n\n    •      Executive functions\n    •      Legislative functions\n    •      Judicial functions\n\nBut only according to the terms of the agreement.\n\n\n\nImportant\n\n    •    The territory does not become part of India merely because India performs these functions.\n    •    It remains a foreign territory, and India only performs the agreed functions.\n\nExample\n\nSuppose Territory X, which is outside India, enters into an agreement with the Government of India.\n\nIf the agreement says:\n\n    •    “India will perform certain judicial functions in Territory X.”\n    •    Then India can perform those judicial functions according to that agreement."}, {"id": 242, "topic": "Centre-State Relations", "question": "Which of the following correctly explains Article 261?", "options": {"A": "Laws made by one State automatically become laws of every other State.", "B": "Only Supreme Court judgments are recognised throughout India.", "C": "Full faith and credit must be given throughout India to public acts, records and judicial proceedings of the Union\nand every State.", "D": "A judgment of one State can never be enforced in another State."}, "answer": "C", "explanation": "Under Article 261(1):Full faith and credit is given throughout India to:\n\n    •    Public acts\n    •    Public records\n    •    Judicial proceedings\n\nThese may belong to the Union or any State.\n\nFinal Judgments and Orders – Article 261(2)\n\n    •    The final judgments or orders of civil courts in any part of India can be executed anywhere within India,\n         according to law.\n    •    Therefore, a person cannot normally avoid enforcement of a civil court’s final judgment merely because it\n         was passed in another State.\n\nParliament’s Power – Article 261(3)\n\nParliament can make laws regarding:\n\n    •    The manner in which such judgments/orders are proved.\n    •    Their effect and enforcement.\n\nExample\n\n    •    A civil court in Andhra Pradesh passes a final judgment against a person who has property in Telangana.\n    •    The judgment does not become useless simply because the property is in another State.\n\n\n\n    •    Under Article 261, it can be enforced throughout India, subject to law."}, {"id": 243, "topic": "Centre-State Relations", "question": "Which of the following correctly explains Article 262 in the context of Administrative Relations between the\nUnion and States?", "options": {"A": "The Supreme Court alone must settle all disputes between States over river waters.", "B": "Parliament can provide for the settlement of disputes relating to the use, distribution or control of waters of inter-\nState rivers or river valleys and can exclude the jurisdiction of courts over such disputes.", "C": "The President can distribute the water of every inter-State river without consulting the States.", "D": "Article 262 deals only with financial disputes between the Union and States."}, "answer": "B", "explanation": "Parliament can make a law for the adjudication of disputes relating to:\n\n    •    Use of water\n    •    Distribution of water\n    •    Control of water of an inter-State river or river valley.\n\nParliament can also provide that the Supreme Court or other courts will not have jurisdiction over such disputes.\n\nParliament enacted the Inter-State River Water Disputes Act, 1956.\n\nThus, Article 262 promotes administrative coordination and settlement of disputes between States."}, {"id": 244, "topic": "Centre-State Relations", "question": "Which of the following correctly explains Article 263 of the Indian Constitution?", "options": {"A": "Article 263 makes the Inter-State Council a permanent constitutional body that must always exist.", "B": "The Inter-State Council is created only to settle disputes relating to river waters.", "C": "The President may establish an Inter-State Council when it appears that public interest would be served by its\nestablishment, mainly to promote coordination and cooperation between the Union and States and among States.", "D": "The Inter-State Council can make laws binding on all States."}, "answer": "C", "explanation": "•    Article 263 provides for the establishment of an Inter-State Council.\n    •    The President can establish it when it appears that public interest would be served by doing so.\n\nMain Functions\n\nThe Council may be given the following functions:\n\n    1.   Inquire into and advise upon disputes: It can inquire into disputes between States and advise on them.\n    2.   Discuss matters of common interest : It can an discuss subjects in which:\n\n\n\n               Union and States, or\n                Two or more States have a common interest.\n    3.   Make recommendations :It can make recommendations for better coordination of policy and action\n         regarding such matters.\n\nNote:\n\n    •    The Inter-State Council is mainly a coordinating and advisory body.\n    •    It does not make laws.\n    •    Its recommendations are generally advisory, not automatically binding."}, {"id": 245, "topic": "Centre-State Relations", "question": "Which of the following features help maintain administrative cooperation and uniformity between the Centre\nand the States?", "options": {"A": "All India Services, Public Service Commissions and an integrated judicial system", "B": "Only the Union Public Service Commission and Supreme Court", "C": "Separate All India Services for every State and separate judicial systems for the Union and States", "D": "Only State Public Service Commissions and State High Courts"}, "answer": "A", "explanation": "•    All India Services are common to the Union and the States.\n    •    Officers are recruited through an all-India system but serve under both Central and State Governments.\n    •    Examples: IAS, IPS and Indian Forest Service.\n    •    They promote uniform administrative standards and strengthen Centre–State coordination.\n    •    A new All India Service can be created by Parliament when Rajya Sabha passes a resolution by not less\n         than 2/3 of members present and voting, declaring it necessary in the national interest.\n\nPublic Service Commissions – Articles 315–323\n\nThe Constitution provides for:\n\n    •    UPSC → Union services\n    •    State PSCs → State services\n    •    Joint State PSC → Common PSC for two or more States, when established as provided by the Constitution.\n\nThey conduct examinations and perform advisory functions relating to public-service recruitment and other service\nmatters.\n\nThus, they provide a constitutional framework for recruitment to public services at both Union and State levels.\n\nIntegrated Judicial System\n\nIndia has one integrated judicial system, unlike countries such as the USA where federal and State judicial systems\nare separate.\n\nThe hierarchy is:\n\nSupreme Court\n\n\n\n    ↓\n\nHigh Courts\n\n    ↓\n\nDistrict & Subordinate Courts\n\n    •    The same judicial system deals with Union as well as State laws.\n    •    High Courts also exercise supervisory jurisdiction over subordinate courts in their respective territories.\n    •    This promotes uniformity in the administration of justice throughout India."}, {"id": 246, "topic": "Centre-State Relations", "question": "Which of the following correctly explains the basic constitutional framework of Financial Relations between\nthe Union and the States?", "options": {"A": "Financial relations are dealt with only under the State List and States have complete control over taxation.", "B": "The Constitution gives Parliament exclusive power over all taxes and does not provide for sharing of revenue\nwith States.", "C": "The Constitution distributes taxation powers between the Union and States and provides for assignment and\nsharing of certain revenues, grants-in-aid and financial assistance to States.", "D": "States can impose any tax even if the Constitution does not authorise them to do so."}, "answer": "C", "explanation": "The major provisions relating specifically to financial relations between Union and States are mainly found in\nArticles 268–293.\n\nThe Constitution determines:\n\n    •    Who can levy and collect particular taxes.\n    •    How certain tax revenues are assigned or shared.\n    •    Grants-in-aid to States.\n    •    Borrowing powers of the Union and States.\n\nThus, States do not depend only on their own taxes; the Constitution provides mechanisms for financial sharing and\nassistance."}, {"id": 247, "topic": "Centre-State Relations", "question": "Which of the following correctly explains Articles 268, 269 and 269A?\n\nUnder Article 268, certain duties are imposed by the Union but collected and appropriated by the States.\n\nUnder Article 269, certain taxes on inter-State transactions are imposed and collected by the Union but assigned to\nthe States.\n\nUnder Article 269A, GST on inter-State supplies is imposed and collected by the Union and apportioned between\nthe Union and States.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "collected and appropriated by the State Governments. In simple words, Union imposes the duty, but the State\ncollects the money and keeps the proceeds.\n\n    •     Stamp duty: It is a duty charged by the government on certain legal documents or instruments, such as\n         certain property-related documents and agreements.\n\n Article 269: It deals with certain taxes on inter-State sale/purchase and consignment of goods. Here, the Union\nGovernment levies and collects the tax, but the proceeds are assigned to the States according to the principles laid\ndown by Parliament.\n\n    •     Inter-State sale/purchase: When goods are sold or purchased as part of a transaction involving movement\n         from one State to another, it is an inter-State transaction. Example: A business in Andhra Pradesh sells\n         goods to a business in Telangana.\n\n Article 269A: It deals with GST on inter-State supplies. When goods or services are supplied from one State to\nanother State, it is generally an inter-State supply, and IGST (Integrated GST) is charged.\n\n    •     IGST is levied and collected by the Government of India. The amount collected is then apportioned\n         between the Union and the States according to the law made by Parliament.\n    •     Article 269A was introduced by the 101st Constitutional Amendment Act, 2016, as part of the GST system.\n\nInter-State = between two different States\n\nExample: Andhra Pradesh → Telangana\n\nIntra-State = within the same State\n\nExample: Vijayawada → Visakhapatnam (both in Andhra Pradesh)\n\n Imports into India are treated as inter-State supplies for GST purposes, even though they come from a foreign\ncountry."}, {"id": 248, "topic": "Centre-State Relations", "question": "Which of the following statements regarding Articles 270 and 271 is/are correct?\n\n    1.   Article 270 deals with taxes levied and collected by the Union and distributed between the Union and the\n         States.\n    2.   Article 271 empowers Parliament to impose a surcharge on certain Union taxes for the purposes of the\n         Union.\n    3.   The proceeds of surcharge under Article 271 form part of the divisible pool and are shared with the States.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "•    Deals with taxes that are levied and collected by the Union but whose proceeds are distributed between the\n         Centre and States.\n    •    The share of States is determined according to the recommendations of the Finance Commission.\n    •    This sharing is known as the divisible pool.\n    •    Certain taxes are excluded from this pool, such as surcharges under Article 271 and specific cesses.\n\nDivisible Pool\n\n    •    Divisible pool = shareable Central taxes distributed between Centre and States.\n    •    States receive their share according to the Finance Commission’s recommendations.\n\nArticle 271 – Surcharge\n\n    •    Parliament can impose a surcharge on taxes or duties referred to in Articles 269 and 270.\n    •    The entire proceeds of such surcharge are retained by the Union.\n    •    Therefore, the surcharge is not shared with the States.\n    •    Parliament can also increase the rate of surcharge by law.\n    •    Important: Proceeds of Article 271 surcharge are outside the divisible pool.\n\nSurcharge means an additional tax imposed on an existing tax."}, {"id": 249, "topic": "Centre-State Relations", "question": "Consider the following statements regarding the types of grants under the Indian Constitution:\n\n    1.   Statutory grants are provided under Article 275 on the recommendation of the Finance Commission.\n    2.   Discretionary grants can be provided under Article 282 for any public purpose.\n    3.   Grants under Article 275 also include special grants for the welfare of Scheduled Tribes and administration\n         of Scheduled Areas.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Statutory Grants – Article 275\n\n    •    Article 275 provides for grants-in-aid from the Union to certain States.\n    •    These grants are paid from the Consolidated Fund of India.\n    •    They are given to States that are in need of financial assistance.\n    •    The Finance Commission recommends the principles governing these grants.\n    •    Parliament decides the grants based on the constitutional and financial framework.\n\n\n\n    •    The amount need not be the same for every State; it depends on the needs and circumstances of the States.\n    •    Article 275 also provides special grants for promoting the welfare of Scheduled Tribes.\n    •    It also provides grants for improving the administration of Scheduled Areas.\n\nDiscretionary Grants – Article 282\n\n    •    Article 282 allows the Union or a State to make grants for any public purpose.\n    •    The purpose may even be a subject on which the concerned government does not have legislative\n         competence.\n    •    These grants are called discretionary grants because they are not based on the recommendations of the\n         Finance Commission.\n    •    They are generally used to provide financial assistance for particular public programmes or purposes.\n    •    Therefore, Article 282 gives the Union considerable flexibility to provide financial assistance to States.\n\nGrants under Article 273 – Historical Special Grants\n\n    •    Article 273 provided grants to certain States in lieu of their share of export duty on jute and jute products.\n    •    These grants were linked to the loss of revenue suffered by States after the abolition of the export duty\n         arrangement.\n    •    The provision was mainly associated with Assam, Bihar, Odisha and West Bengal.\n    •    This was a special and time-bound constitutional arrangement.\n\nNote:It is important for exams as a constitutional provision concerning grants, but it is not a general present-day\ngrant mechanism."}, {"id": 250, "topic": "Centre-State Relations", "question": "Which of the following statements regarding the GST Council under Article 279A is/are correct?\n\n    1.   The GST Council is a constitutional body established under Article 279A.\n    2.   The Union Finance Minister is the Chairperson of the GST Council.\n    3.   The Council makes recommendations on important matters relating to GST, including rates, exemptions\n         and principles of apportionment of GST on inter-State supplies.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 279A – GST Council\n\n    •    Article 279A provides for the establishment of the Goods and Services Tax Council (GST Council).\n    •    It was inserted by the 101st Constitutional Amendment Act, 2016.\n    •    The GST Council is a constitutional body.\n    •    It is a joint forum of the Centre and the States.\n    •    Its main purpose is to promote cooperative federalism in GST matters.\n\nComposition\n\n\n\n    •    Chairperson: Union Finance Minister.\n    •    Member: Union Minister of State in charge of Revenue or Finance.\n    •    Members: Finance/Taxation Minister or any other Minister nominated by each State Government.\n    •    State members choose one among themselves as the Vice-Chairperson.\n\nMajor Functions\n\n    •    The GST Council makes recommendations regarding:\n    •    Taxes, cesses and surcharges to be subsumed under GST.\n    •    Goods and services that may be subjected to or exempted from GST.\n    •    Model GST Laws.\n    •    Principles of levy, apportionment and place of supply of GST on inter-State supplies.\n    •    GST rates, including the floor rates with bands.\n    •    Special rates during natural calamities or disasters.\n    •    Special provisions for certain States.\n    •    Any other GST-related matter referred to it by the Union or State Governments.\n\nVoting\n\n    •    A decision requires a 3/4th majority of the weighted votes of members present and voting.\n    •    The Centre has 1/3 of the total weighted votes.\n    •    All the States together have 2/3.\n    •    Therefore, neither the Centre nor the States can take a decision alone.\n\nImportant Point\n\n    •    GST Council’s recommendations are recommendatory in nature.\n    •    It is an important mechanism for Centre–State coordination in taxation."}, {"id": 251, "topic": "Centre-State Relations", "question": "Which of the following statements regarding the Finance Commission under Article 280 is/are correct?\n\n    1.   The Finance Commission is a constitutional body constituted by the President.\n    2.   It is constituted every five years or earlier, if the President considers it necessary.\n    3.   It recommends the distribution of certain financial resources between the Centre and the States.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Article 280 provides for the establishment of the Finance Commission.\n    •    It is a constitutional body.\n    •    The President of India constitutes the Finance Commission.\n    •    It is normally constituted every five years.\n\n\n\n    •    The President can constitute it earlier, if considered necessary.\n\nFinance Commission consists of:\n\n    •    Chairman\n    •    Four other members\n    •    Therefore, normally it has five members.\n\nThey are appointed by the President.\n\nParliament determines the qualifications and method of selection of members.\n\nMain Functions\n\nThe Finance Commission recommends to the President:\n\n1.Distribution of Taxes\n\n    •    Distribution of the net proceeds of taxes between the Centre and States.\n    •    This is called vertical devolution.\n    •    It also recommends the distribution of the States’ share among the States themselves.\n    •    This is called horizontal devolution.\n\n2.Grants-in-Aid: Recommends the principles governing grants-in-aid to States from the Consolidated Fund of India\nunder Article 275.\n\n3.Panchayats and Municipalities:Recommends measures to augment the Consolidated Fund of a State to supplement\nthe resources of Panchayats and Municipalities.\n\n    •    This is based on the recommendations of the State Finance Commission.\n\nOther Matters\n\nIt performs any other function referred to it by the President in the interests of sound financial administration."}, {"id": 252, "topic": "Centre-State Relations", "question": "Article 281 deals with:", "options": {"A": "Constitution of Finance Commission", "B": "Distribution of taxes between Centre and States", "C": "Recommendations of Finance Commission", "D": "Constitution of GST Council"}, "answer": "C", "explanation": "•    Recommendations are submitted to the President.\n    •    President lays them before both Houses of Parliament.\n    •    An explanatory memorandum on the action taken by the Government is also placed before Parliament."}, {"id": 253, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Administrative Reforms Commission (ARC) and its role in\nCentre–State relations:\n\n    1.     The Administrative Reforms Commission was appointed by the Central Government in 1966.\n    2.     It was initially headed by Morarji Desai and was later headed by K. Hanumanthayya.\n    3.     The ARC submitted its report on Centre–State relations to the Central Government in 1969.\n    4.     It recommended the establishment of an Inter-State Council under Article 263.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "six-member commission, initially headed by Morarji Desai, who was later succeeded by K. Hanumanthayya. One of\nits terms of reference was to examine Centre–State relations.\n\nPurpose:\n\n    •      The ARC was constituted to examine various aspects of administration and suggest reforms. In the context\n           of Centre–State relations, it examined the issues affecting the relationship between the Union and the\n           States.\n\nStudy Team:\n\n    •      To examine Centre–State relations in detail, the ARC constituted a study team under M. C. Setalvad.\n\nReport Submission:\n\nBased on the study team’s report, the ARC finalised its own report and submitted it to the Central Government in\n1969.\n\nImportant Recommendations:\n\n• Establishment of an Inter-State Council under Article 263.\n\n• Appointment of Governors having long experience in public life and administration and a non-partisan attitude.\n\n• Maximum delegation of powers to the States.\n\n• Transfer of more financial resources to the States to reduce their dependence on the Centre.\n\n• Deployment of Central armed forces in States either on their request or otherwise.\n\nImportant Point:\n\nThe Central Government did not take action on the recommendations of the ARC regarding Centre–State relations."}, {"id": 254, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Rajamannar Committee:\n\n\n\n    1.     The Rajamannar Committee was appointed by the Tamil Nadu Government in 1969.\n    2.     It was a three-member committee headed by Dr. P. V. Rajamannar.\n    3.     It submitted its report to the Tamil Nadu Government in 1971.\n    4.     It was constituted to examine Centre–State relations and suggest constitutional amendments to secure\n           greater autonomy for the States.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "committee under the chairmanship of Dr. P. V. Rajamannar. Its main objective was to examine the entire question of\nCentre–State relations and suggest constitutional amendments to secure maximum autonomy for the States. It\nsubmitted its report to the Tamil Nadu Government in 1971.\n\nPurpose:\n\nTo examine the reasons for the prevailing centralising tendencies in India and suggest measures for greater State\nautonomy.\n\nReasons for Centralisation identified:\n\n• Certain constitutional provisions conferring special powers on the Centre.\n\n• One-party rule at both the Centre and in the States.\n\n• Inadequate financial resources of States and their dependence on the Centre for financial assistance.\n\n• Central planning and the role of the Planning Commission.\n\nImportant Recommendations:\n\n• Establishment of an Inter-State Council.\n\n• The Finance Commission should be made a permanent body.\n\n• Articles 356, 357 and 365 dealing with President’s Rule should be totally omitted.\n\n• Certain subjects from the Union List and Concurrent List should be transferred to the State List.\n\n• Residuary powers should be allocated to the States.\n\n• All-India Services such as IAS, IPS and IFS should be abolished.\n\nNote:\n\nThe Central Government did not accept the demands made in the Rajamannar Committee memorandum/report."}, {"id": 255, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Anandpur Sahib Resolution:\n\n    1.     The Anandpur Sahib Resolution was adopted by the Shiromani Akali Dal in 1973.\n    2.     It demanded greater autonomy for the States and a substantial limitation of the powers of the Centre.\n    3.     It sought to strengthen the federal structure while retaining defence, foreign affairs, communications and\n           currency with the Centre.\n    4.     It was one of the important developments in the debate over Centre–State relations.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Year: 1973\n\nOrganisation: Shiromani Akali Dal (SAD)\n\nPurpose:\n\nThe resolution sought greater autonomy for the States and proposed a reorganisation of the Centre–State relationship\nso that the Union would exercise limited powers while the States would enjoy greater authority.\n\nImportant Demands/Recommendations:\n\n• Strengthening of the federal structure of the Indian Constitution.\n\n• Restriction of the Centre’s powers to subjects of national importance.\n\n• Greater political and economic autonomy for the States.\n\n• The Centre should primarily deal with Defence, Foreign Affairs, Communications and Currency.\n\n• Greater financial powers and resources for the States.\n\n• Protection and promotion of the political, economic and cultural interests of Punjab and the Sikh community."}, {"id": 256, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the West Bengal Memorandum on Centre–State relations:\n\n    1.     The word ‘Union’ in the Constitution should be replaced by the word ‘Federal’.\n    2.     The jurisdiction of the Centre should be confined to defence, foreign affairs, currency, communications and\n           economic coordination.\n    3.     Articles 356, 357 and 360 should be repealed.\n    4.     Seventy-five per cent of the total revenue raised by the Centre should be allocated to the States.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Year: 1977\n    •    Submitted by: Government of West Bengal\n    •    Purpose:To strengthen the federal character of the Constitution and provide greater autonomy and powers\n         to the States.\n\nImportant Recommendations:\n\n• Replace the word ‘Union’ in the Constitution with ‘Federal’.\n\n• Restrict the Centre’s jurisdiction to Defence, Foreign Affairs, Currency, Communications and Economic\nCoordination.\n\n• All other subjects, including residuary powers, should be vested in the States.\n\n• Articles 356 and 357 relating to President’s Rule and Article 360 relating to Financial Emergency should be\nrepealed.\n\n• State consent should be made obligatory for the formation of new States or reorganisation of existing States.\n\n• 75% of the total revenue raised by the Centre from all sources should be allocated to the States.\n\n• Rajya Sabha should have equal powers with the Lok Sabha.\n\n• There should be only Central Services and State Services, and the All-India Services should be abolished.\n\nImportant Point:\n\nThe Central Government did not accept the demands made in the West Bengal Memorandum."}, {"id": 257, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Sarkaria Commission:\n\n    1.   The Sarkaria Commission was appointed in 1983 to examine Centre–State relations.\n    2.   It was headed by Justice R. S. Sarkaria, a former Judge of the Supreme Court of India.\n    3.   The Commission recommended that the office of Governor should be abolished to strengthen federalism.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "•    Appointed: 1983 by the Government of India.\n    •    Chairman: Justice R. S. Sarkaria, former Supreme Court Judge.\n    •    Purpose: To examine Centre–State relations.\n    •    Report: Submitted in 1988.\n    •    Approach: Emphasised cooperative federalism.\n\nMajor Recommendations\n\n    •    Cooperative Federalism: Centre and States should work together.\n    •    Inter-State Council: Establish a permanent Inter-State Council under Article 263. – Major outcome\n    •    Governor: Appoint an eminent, impartial and politically detached person; normally ensure 5-year tenure.\n    •    Article 356: Use very sparingly; normally give the State government a warning before imposing President’s\n         Rule.\n    •    Chief Minister: Governor should invite the majority leader to form the government; in a hung Assembly,\n         follow objective principles.\n    •    Concurrent List: Centre should consult States on matters affecting their interests.\n    •    Central Forces: Consult the State, as far as practicable, before deploying Central forces.\n    •    Financial Relations: Ensure adequate resources for States and greater Centre–State consultation.\n    •    All India Services: Continue and strengthen All India Services.\n    •    Residuary Powers: Continue with the Centre.\n    •    Governor’s Office: Should not be abolished; Governor should function as an impartial constitutional head."}, {"id": 258, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Punchhi Commission:\n\n    1.   The Punchhi Commission was constituted in 2007 to review Centre–State relations.\n    2.   It was headed by Justice Madan Mohan Punchhi, former Chief Justice of India.\n    3.   It recommended strengthening the Inter-State Council under Article 263.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Appointed: 2007 by the Government of India.\n    •    Chairman: Justice Madan Mohan Punchhi, former Chief Justice of India.\n    •    Purpose: To examine Centre–State relations and recommend changes for strengthening federalism.\n    •    Report: Submitted in 2010.\n    •    It was constituted as a Commission on Centre–State Relations.\n\nMajor Recommendations\n\n\n\n    •      Inter-State Council: Strengthen the Inter-State Council under Article 263 for better Centre–State\n           consultation.\n    •      Zonal Councils: Strengthen Zonal Councils for regional cooperation and coordination.\n    •      Governor: Governor should be an eminent person, politically detached and preferably from outside the\n           State.\n    •      Governor’s Tenure: Governor should normally have a five-year tenure.\n    •      Governor’s Removal: Governor should not be removed arbitrarily.\n    •      Hung Assembly: Governor should follow clear constitutional guidelines while inviting a person to form the\n           government.\n    •      Article 356: President’s Rule should be imposed only as a last resort.\n    •      Localised Emergency: A localised emergency may be considered for a specific area of a State without\n           imposing President’s Rule on the entire State.\n    •      Article 355: Union intervention under Article 355 should not unnecessarily undermine State autonomy.\n    •      Concurrent List: States should be consulted on important matters in the Concurrent List.\n    •      Central Forces: Deployment of Central forces in a State should generally be done in consultation with the\n           State Government.\n    •      All India Services: Strengthen All India Services and consider creating additional services where necessary.\n    •      Fiscal Relations: Improve Centre–State financial relations and provide States with greater fiscal autonomy.\n    •      Inter-State River Disputes: Establish a permanent Tribunal for resolving inter-State river water disputes.\n    •      Centrally Sponsored Schemes: Reduce unnecessary burden on States and provide greater flexibility in\n           implementation."}, {"id": 259, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Balwant Rai Mehta Committee:\n\n    1.     The Government of India appointed the Balwant Rai Mehta Committee in January 1957 to examine the\n           working of the Community Development Programme and the National Extension Service.\n    2.     The Committee was headed by Balwant Rai G. Mehta and submitted its report in November 1957.\n    3.     It recommended a three-tier Panchayati Raj system consisting of Gram Panchayat at the village level,\n           Panchayat Samiti at the block level and Zila Parishad at the district level.\n    4.     It recommended that the Panchayati Raj institutions should be provided adequate resources and genuine\n           transfer of power and responsibility.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•      Year: 1957\n    •      Chairman: Balwant Rai G. Mehta\n\nPurpose:\n\n\n\nTo examine the working of the Community Development Programme (1952) and National Extension Service (1953)\nand suggest measures for their effective implementation.\n\nReport Submission::The Committee submitted its report in November 1957.\n\nImportant Recommendations\n\nThree-tier Panchayati Raj: Establish a three-tier system:\n\n    •    Gram Panchayat – Village level\n    •    Panchayat Samiti – Block level\n    •    Zila Parishad – District level\n\nThe three tiers should be organically linked through indirect elections.\n\n    •    Gram Panchayat should consist of directly elected representatives.\n    •    Panchayat Samiti and Zila Parishad should consist of indirectly elected members.\n    •    Panchayat Samiti should be the executive body.\n    •    Zila Parishad should function as the advisory, coordinating and supervisory body.\n    •    District Collector should be the Chairman of the Zila Parishad.\n    •    All planning and development activities should be entrusted to these democratic bodies.\n    •    There should be a genuine transfer of power and responsibility to Panchayati Raj institutions.\n    •    Adequate resources should be transferred to these bodies so that they can discharge their functions\n         effectively.\n    •    A system should be developed for the future devolution of authority.\n\nImplementation\n\n    •    The recommendations were accepted by the National Development Council (NDC) in January 1958.\n    •    First State to implement: Rajasthan\n    •    The Panchayati Raj system was inaugurated in Rajasthan on 2 October 1959 at Nagaur district.\n    •    Andhra Pradesh followed Rajasthan and adopted the system in 1959."}, {"id": 260, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Ashok Mehta Committee on Panchayati Raj:\n\n    1.   The Janata Government appointed the Ashok Mehta Committee on Panchayati Raj institutions in December\n         1977.\n    2.   The Committee was headed by Ashok Mehta and submitted its report in August 1978.\n    3.   It recommended replacing the existing three-tier Panchayati Raj system with a two-tier system consisting of\n         Zila Parishad at the district level and Mandal Panchayat below it.\n    4.   It made 132 recommendations for reviving and strengthening the declining Panchayati Raj system in the\n         country.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Year: 1977\n    •    Chairman: Ashok Mehta\n    •    Appointed by: Janata Government\n    •    Purpose::To examine the reasons for the decline of Panchayati Raj institutions and suggest measures to\n         revive and strengthen the system.\n    •    Report Submission: August 1978\n    •    Total Recommendations: 132\n\nImportant Recommendations\n\n    •    Two-tier system: The existing three-tier system should be replaced by a two-tier system:\n    •    Zila Parishad – District level\n    •    Mandal Panchayat – Below district level, consisting of a group of villages with a population of about\n         15,000–20,000.\n    •    District as the first point of decentralisation: The district should be the first point for decentralisation below\n         the State level.\n    •    Zila Parishad as executive body: The Zila Parishad should be the executive body and should be responsible\n         for planning at the district level.\n    •    Political parties: There should be official participation of political parties at all levels of Panchayat\n         elections.\n    •    Taxation powers: Panchayati Raj institutions should have compulsory powers of taxation to mobilise their\n         own financial resources.\n    •    Social audit: There should be a regular social audit by a district-level agency and a committee of legislators\n         to check whether funds meant for vulnerable social and economic groups are actually spent on them.\n    •    State interference: The State Government should not supersede Panchayati Raj institutions. If supersession\n         becomes unavoidable, elections should be held within six months.\n    •    Nyaya Panchayats: Nyaya Panchayats should be kept separate from development Panchayats and should be\n         presided over by a qualified judge.\n    •    Panchayat elections: The Chief Electoral Officer of the State, in consultation with the Chief Election\n         Commissioner, should organise and conduct Panchayati Raj elections.\n    •    Development functions: Development functions should be transferred to the Zila Parishad, and all\n         development staff should work under its control and supervision.\n    •    Voluntary agencies: Voluntary agencies should play an important role in mobilising people’s support for\n         Panchayati Raj.\n    •    Minister for Panchayati Raj: A Minister for Panchayati Raj should be appointed in the State Council of\n         Ministers to look after Panchayati Raj institutions.\n    •    Reservation: Seats for SCs and STs should be reserved on the basis of their population.\n    •    Constitutional recognition: Panchayati Raj institutions should receive constitutional recognition, giving\n         them requisite status, security and assurance of continuous functioning."}, {"id": 261, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the G.V.K. Rao Committee on Panchayati Raj:\n\n    1.   The G.V.K. Rao Committee was appointed by the Planning Commission in 1985 to review the existing\n         administrative arrangements for Rural Development and Poverty Alleviation Programmes.\n\n\n\n    2.   It observed that rural development administration had become increasingly bureaucratised and had become\n         divorced from Panchayati Raj institutions.\n    3.   It recommended that the Zila Parishad should be the principal body for managing development\n         programmes at the district level.\n    4.   It recommended that Panchayati Raj institutions should be constitutionally recognised, protected and\n         preserved.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "B", "explanation": "•    Year: 1985\n    •    Chairman: G.V.K. Rao\n    •    Appointed by: Planning Commission\n    •    Purpose:To review the existing administrative arrangements for Rural Development and Poverty\n         Alleviation Programmes and suggest measures to strengthen Panchayati Raj institutions.\n\nImportant Recommendations\n\n    •    Zila Parishad: The district-level body, Zila Parishad, should be of pivotal importance in democratic\n         decentralisation.\n    •    District as principal unit: The district should be the proper unit for planning and development.\n    •    Zila Parishad: It should become the principal body for managing all development programmes that can be\n         handled at the district level.\n    •    Role of Panchayati Raj: Panchayati Raj institutions at the district and lower levels should play an important\n         role in planning, implementation and monitoring of rural development programmes.\n    •    District planning: Some planning functions at the State level should be transferred to district-level planning\n         units for effective decentralised district planning.\n    •    District Development Commissioner: A post of District Development Commissioner should be created.\n    •    Chief Executive Officer: The District Development Commissioner should act as the chief executive officer\n         of the Zila Parishad and supervise development departments at the district level.\n    •    Panchayat elections: Elections to Panchayati Raj institutions should be held regularly; elections should not\n         become overdue for one or more terms.\n    •    Decentralised system: The Committee supported a leading role for Panchayati Raj in local planning and\n         development rather than leaving development administration entirely to bureaucracy.\n\nReport: The Committee’s recommendations are associated with the G.V.K. Rao Committee Report (1986).\n\n4 th statement related to: L.M. Singhvi Committee (1986)."}, {"id": 262, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the L.M. Singhvi Committee on Panchayati Raj:\n\n\n\n    1.   The L.M. Singhvi Committee was appointed by the Rajiv Gandhi Government in 1986.\n    2.   It was constituted to prepare a concept paper on the “Revitalisation of Panchayati Raj Institutions for\n         Democracy and Development”.\n    3.   It recommended that Panchayati Raj institutions should be given constitutional recognition, protection and\n         preservation.\n    4.   It recommended the establishment of Nyaya Panchayats for a cluster of villages.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Year: 1986\n    •    Chairman: L.M. Singhvi\n    •    Appointed by: Rajiv Gandhi Government\n    •    Purpose:To prepare a concept paper on the revitalisation of Panchayati Raj Institutions for Democracy and\n         Development.\n\nImportant Recommendations\n\n    •    Constitutional recognition: Panchayati Raj institutions should be constitutionally recognised, protected and\n         preserved.\n    •    A new chapter should be added to the Constitution for Panchayati Raj institutions.\n    •    Constitutional provisions should ensure regular, free and fair elections to Panchayati Raj bodies.\n    •    Nyaya Panchayats should be established for a cluster of villages.\n    •    Villages should be reorganised to make Gram Panchayats more viable.\n    •    Gram Sabha should be given importance as the embodiment of direct democracy.\n    •    Panchayati Raj institutions should be provided with more financial resources.\n    •    Judicial tribunals should be established in each State to adjudicate disputes relating to the election,\n         dissolution and functioning of Panchayati Raj institutions."}, {"id": 263, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Thungon Committee on Panchayati Raj:\n\n    1.   The Thungon Committee was constituted in 1988 as a sub-committee of the Consultative Committee of\n         Parliament.\n    2.   It was constituted under the chairmanship of P. K. Thungon to examine the political and administrative\n         structure at the district level for the purpose of district planning.\n    3.   It recommended that Panchayati Raj bodies should be given constitutional recognition and a three-tier\n         system should be established at the village, block and district levels.\n    4.   It recommended that Panchayati Raj bodies should have a fixed tenure of five years.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "•    Year: 1988\n    •    Chairman: P. K. Thungon\n    •    Type: Sub-committee of the Consultative Committee of Parliament\n    •    Purpose:To examine the political and administrative structure at the district level for the purpose of district\n         planning and suggest measures for strengthening Panchayati Raj.\n\nReport/Recommendations:\n\nThe Committee made several recommendations concerning the constitutional status, structure, tenure, elections and\nfinances of Panchayati Raj institutions.\n\nImportant Recommendations\n\n    •    Constitutional recognition: Panchayati Raj bodies should be constitutionally recognised.\n    •    Three-tier system: A three-tier Panchayati Raj system should operate at the village, block and district\n         levels.\n    •    Zila Parishad: The Zila Parishad should be the pivot of the Panchayati Raj system and should act as the\n         planning and development agency at the district level.\n    •    Fixed tenure: Panchayati Raj bodies should have a fixed tenure of five years.\n    •    Maximum supersession: The maximum period of supersession of a Panchayati Raj body should be six\n         months.\n    •    Planning and coordination committee: A planning and coordination committee should be established at the\n         State level under the chairmanship of the Minister for Planning; presidents of Zila Parishads should be its\n         members.\n    •    Constitutional subjects: A detailed list of subjects for Panchayati Raj should be prepared and incorporated\n         in the Constitution.\n    •    Reservation: Seats in all three tiers should be reserved on the basis of population, with reservation also\n         provided for women.\n    •    State Finance Commission: A State Finance Commission should be established in each State to lay down\n         criteria and guidelines for the devolution of finances to Panchayati Raj institutions.\n    •    District Collector: The District Collector should be the Chief Executive Officer of the Zila Parishad."}, {"id": 264, "topic": "Committees & Commissions", "question": "Consider the following statements regarding the Gadgil Committee on Panchayati Raj:\n\n    1.   The Committee on Policy and Programmes was constituted in 1988 by the Indian National Congress under\n         the chairmanship of V. N. Gadgil.\n    2.   The Committee was asked to consider the question of how Panchayati Raj institutions could be made more\n         effective.\n\n\n\n    3.   It recommended constitutional status for Panchayati Raj institutions and a three-tier system at the village,\n         block and district levels.\n    4.   It recommended a fixed tenure of five years for Panchayati Raj institutions.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "1988 by the Indian National Congress under the chairmanship of V. N. Gadgil.\n\n    •    Year: 1988\n    •    Chairman: V. N. Gadgil\n    •    Appointed by: Indian National Congress\n    •    Purpose:To examine how Panchayati Raj institutions could be made more effective.\n\nImportant Recommendations\n\n    •    Constitutional status: Constitutional status should be bestowed on Panchayati Raj institutions.\n    •    Three-tier system: A three-tier system of Panchayati Raj should be established at:Village level,Block\n         level,District level\n    •    Five-year tenure: The term of Panchayati Raj institutions should be fixed at five years.\n    •    Direct elections: Members of Panchayats at all three levels should be directly elected.\n    •    Reservation: Seats should be reserved for Scheduled Castes, Scheduled Tribes and women.\n    •    Development responsibility: Panchayati Raj bodies should have the responsibility for preparation and\n         implementation of plans for socio-economic development.\n    •    Subjects in Constitution: A list of subjects relating to Panchayati Raj should be specified in the\n         Constitution.\n    •    Taxation powers: Panchayati Raj institutions should be empowered to levy, collect and appropriate taxes\n         and duties.\n    •    State Finance Commission: A State Finance Commission should be established for allocation of finances to\n         Panchayats.\n    •    State Election Commission: A State Election Commission should be established for conducting elections to\n         Panchayats.\n    •    Planning and coordination: A planning and coordination committee should be set up at the State level under\n         the chairmanship of the Minister for Planning, with presidents of Zila Parishads as members.\n\nImportant Outcome:\n\nThe recommendations of the Gadgil Committee became the basis for drafting the constitutional amendment aimed at\nconferring constitutional status and protection on Panchayati Raj institutions."}, {"id": 265, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the composition of Parliament under Article 79 of the Indian\nConstitution?", "options": {"A": "President, Rajya Sabha and Lok Sabha", "B": "President and Lok Sabha only", "C": "Rajya Sabha and Lok Sabha only", "D": "President, Supreme Court and Lok Sabha"}, "answer": "A", "explanation": "Parliament consists of three components:\n\n    •    President\n    •    Rajya Sabha (Council of States)\n    •    Lok Sabha (House of the People)\n\nThe President is an integral part of Parliament, but the President is not a member of either House.\n\nPart V, Chapter II -Art.79 to 122 dealss with the Parliament (organisation, composition,\nDuration,officers,procedures,privileges, powers…etc).\n\nWhy is the President an integral part of Parliament?\n\n    •    Article 79 – Parliament consists of the President, Rajya Sabha and Lok Sabha.\n    •    Article 85 – President summons and prorogues Parliament and can dissolve Lok Sabha.\n    •    Articles 86 & 87 – President can address Parliament and deliver the special address.\n    •    Article 111 – Every Bill passed by Parliament requires the President’s assent to become law, subject to the\n         constitutional procedure.\n    •    Article 108 – President can summon a joint sitting of both Houses in case of a deadlock on an ordinary Bill.\n    •    Article 123 – President can promulgate Ordinances when both Houses of Parliament are not in session.\n    •    Article 80 – President nominates 12 members to Rajya Sabha from persons having special knowledge or\n         practical experience in literature, science, art and social service.\n\nSo,The President is not a member of either House, but is an integral component of Parliament because the\nConstitution assigns the President several essential functions in the legislative process."}, {"id": 266, "topic": "Parliament: Composition", "question": "Consider the following statements regarding the composition of the Rajya Sabha and Lok Sabha:\n\n    1.   Article 80 deals with the composition of the Rajya Sabha, which has a constitutional maximum of 250\n         members, including 12 nominated members.\n    2.   The representatives of the States in the Rajya Sabha are elected by the elected members of the State\n         Legislative Assemblies through proportional representation by means of Single Transferable Vote.\n    3.   Article 81 deals with the composition of the Lok Sabha, whose members are directly elected by the people\n         from territorial constituencies.", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Article 80 – Council of States(Rajyasabha)\n\n    •    Article 80 deals with the composition of the Rajya Sabha.\n    •    Rajya Sabha can have a maximum of 250 members.\n    •    12 members are nominated by the President.\n    •    The remaining 238 members represent the States and Union Territories.\n    •    Nominated members are persons with special knowledge or practical experience in literature, science, art\n         and social service.\n    •    State representatives are elected by the elected members of State Legislative Assemblies.\n    •    Election is conducted by Proportional Representation through Single Transferable Vote (STV).\n    •    The present sanctioned strength of Rajya Sabha is 245 members — 233 elected + 12 nominated.\n\nUnion Territories in Rajya Sabha\n\n    •    At present, Delhi, Puducherry and Jammu & Kashmir have representation in Rajya Sabha.\n    •    Their representatives are elected according to the procedure prescribed by Parliament.\n\nArticle 81 – Lok Sabha(House of People)\n\n    •    Article 81 deals with the composition of the Lok Sabha.\n    •    Lok Sabha members are directly elected by the people.\n    •    Elections take place from territorial constituencies.\n    •    The constitutional maximum is 550 members — 530 from States + 20 from Union Territories.\n    •    At present, Lok Sabha has 543 elected seats."}, {"id": 267, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the duration of the Houses of Parliament?", "options": {"A": "Lok Sabha normally continues for 5 years, while Rajya Sabha is a permanent House and one-third of its members\nretire every two years.", "B": "Both Lok Sabha and Rajya Sabha have a fixed term of 5 years and are dissolved together.", "C": "Lok Sabha has a 6-year term, while Rajya Sabha is dissolved every 5 years.", "D": "Rajya Sabha members retire every 5 years and Lok Sabha is a permanent House."}, "answer": "A", "explanation": "Lok Sabha – Article 83(2)\n\n    •    Normal duration: 5 years from the date appointed for its first meeting.\n    •    After the expiry of 5 years, it automatically dissolves.\n    •    During a National Emergency under Article 352, Parliament may extend its term one year at a time.\n    •    However, the extension cannot continue beyond 6 months after the Emergency ceases.\n\n\n\nRajya Sabha – Article 83(1)\n\n    •    Rajya Sabha is a permanent House and is not subject to dissolution.\n    •    One-third of its members retire every two years.\n    •    Each member normally has a 6-year term."}, {"id": 268, "topic": "Parliament: Composition", "question": "With reference to the qualifications for membership of Parliament, consider the following statements:\n\n    1.   A person must be a citizen of India to become a member of Parliament.\n    2.   A person must make and subscribe to the prescribed oath or affirmation before becoming a member of\n         Parliament.\n    3.   A person must have completed 25 years of age for membership of the Lok Sabha and 30 years for\n         membership of the Rajya Sabha.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•    Citizenship: The person must be a citizen of India.\n    •    Oath/Affirmation: The person must make and subscribe to the oath or affirmation prescribed in the Third\n         Schedule.\n    •    Age:Lok Sabha – 25 years;Rajya Sabha – 30 years\n    •    Other qualifications: Article 84(c) provides that the person must possess such other qualifications as may\n         be prescribed by Parliament by law.\n\nAdditional Qualifications prescribed by Parliament\n\nParliament has prescribed these qualifications through the Representation of the People Act, 1951 (RPA, 1951):\n\n    •    Rajya Sabha – A person must be a registered elector in India.\n    •    Lok Sabha – A person must be a registered elector in India.\n    •    For SC/ST reserved seats, the candidate must satisfy the applicable requirements relating to membership of\n         the SC/ST community under the Act.\n    •    A person must be a member of sc/st in any state or UT ,if he wants to contest a seat reserved for them ."}, {"id": 269, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the provisions of Articles 99 and 100 of the Constitution?", "options": {"A": "Article 99 deals with the oath or affirmation by Members of Parliament, while Article 100 deals with voting,\nquorum and decision-making in the Houses of Parliament.", "B": "Article 99 deals with disqualification of MPs, while Article 100 deals with the election of the President.", "C": "Article 99 deals with the duration of Parliament, while Article 100 deals with resignation of MPs.", "D": "Article 99 deals with the composition of Parliament, while Article 100 deals only with the casting vote of the\nSpeaker."}, "answer": "A", "explanation": "•    Every person elected to either House of Parliament must make and subscribe to the prescribed oath or\n         affirmation before taking his/her seat.\n    •    The oath/affirmation is made before the President or a person appointed by him for this purpose.\n    •    The form of oath/affirmation is given in the Third Schedule.\n\nThe member promises to:\n\n    •    Bear true faith and allegiance to the Constitution of India.\n    •    Uphold the sovereignty and integrity of India.\n    •    Faithfully discharge the duties of the office.\n\nImportant: Until the prescribed oath/affirmation is taken, the member cannot validly take his/her seat or vote in the\nHouse.\n\nArticle 100 – Voting, Vacancies & Quorum\n\n    •    Questions in either House are generally decided by a majority of members present and voting.\n    •    The Speaker of Lok Sabha / Chairman of Rajya Sabha generally does not vote in the first instance.\n    •    In case of an equality of votes, the Speaker/Chairman exercises the casting vote.\n    •    The validity of proceedings is not affected merely because there are vacancies in the House.\n    •    Quorum: The quorum to constitute a meeting of either House is one-tenth of the total number of members\n         of the House.\n    •    If there is no quorum, the House must be adjourned or suspended until there is a quorum."}, {"id": 270, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the constitutional provisions relating to vacation of seats and\ndisqualification of Members of Parliament?", "options": {"A": "Article 101 deals with vacation of seats, while Article 102 deals with disqualification of Members of Parliament.", "B": "Article 101 deals only with resignation, while Article 102 deals only with anti-defection.", "C": "Article 101 deals with disqualification and Article 102 deals with vacation of seats.", "D": "Both Articles 101 and 102 deal only with disqualification arising from criminal conviction."}, "answer": "A", "explanation": "Article 101 specifies when a seat of a Member of Parliament becomes vacant.\n\nMembership of both Houses\n\n    •    A person cannot be a member of both Houses of Parliament at the same time.\n\n\n\n    •    If a person is elected to both Lok Sabha and Rajya Sabha, the person must give up one seat according to the\n         law prescribed by Parliament.\n\nMembership of Parliament and State Legislature\n\n    •    A person cannot simultaneously be a member of Parliament and a State Legislature.\n    •    If a person is elected to both, the Parliamentary seat becomes vacant after the prescribed period unless the\n         person resigns the State Legislature seat as required by law.\n\nDisqualification\n\n    •    If a person becomes subject to any disqualification mentioned in Article 102, the seat becomes vacant.\n\nResignation\n\nA member may resign by writing to:\n\n    •    Chairman of Rajya Sabha, in the case of a Rajya Sabha member.\n    •    Speaker of Lok Sabha, in the case of a Lok Sabha member.\n    •    If the Chairman/Speaker is satisfied that the resignation is voluntary and genuine, it is accepted.\n    •    If it is not voluntary or genuine, it can be refused.\n\nAbsence from the House\n\n    •    If a member is absent from all meetings of the House for a period of 60 days, without permission of the\n         House, the House may declare the seat vacant.\n    •    The period during which the House is prorogued or adjourned for more than four consecutive days is\n         excluded while calculating the 60 days.\n\nArticle 102 – Disqualification of Members\n\nA person is disqualified for being chosen as, and for being, a Member of Parliament if any of the following applies:\n\nOffice of Profit\n\n    •    Holds an office of profit under the Government of India or Government of any State.\n    •    Exception: an office declared by Parliament by law not to disqualify its holder.\n\nUnsound Mind:Has been declared by a competent court to be of unsound mind.\n\n    •    Undischarged Insolvent:is an undischarged insolvent.\n\nForeign Citizenship\n\nA person is disqualified if he/she:\n\n    •    Is not a citizen of India, or\n    •    Has voluntarily acquired the citizenship of a foreign State, or\n    •    Has acknowledged allegiance or adherence to a foreign State.\n\nDisqualification under Parliamentary Law\n\nA person can be disqualified under any law made by Parliament.\n\nThe Representation of the People Act, 1951 provides several such grounds.\n\n\n\nArticle 102(2) – Anti-Defection\n\nA Member of Parliament can also be disqualified under the Tenth Schedule.\n\nImportant grounds:\n\n    •    A member voluntarily gives up membership of the political party.\n    •    A member votes or abstains from voting contrary to the direction/whip of the political party, without prior\n         permission, and the party does not condone the action within the prescribed period.\n    •    An independent MP joins a political party after election.\n    •    A nominated MP joins a political party after six months from the date of becoming a member.\n\nWho decides Anti-Defection?\n\nLok Sabha → Speaker\n\nRajya Sabha → Chairman"}, {"id": 271, "topic": "Parliament: Composition", "question": "Which of the following correctly explains the constitutional provisions relating to disqualification of Members\nof Parliament and the penalty for sitting or voting when not qualified?", "options": {"A": "Article 103 provides that the President decides questions regarding disqualification of an MP under Article\n102(1), after obtaining the opinion of the Election Commission; Article 104 provides a penalty for a person who sits\nor votes in Parliament when not qualified or before taking the required oath.", "B": "Article 103 gives the Speaker the power to decide all disqualification matters, while Article 104 deals with\nresignation of MPs.", "C": "Article 103 deals with the election of the President, while Article 104 deals with the anti-defection law.", "D": "Article 103 gives the Election Commission final authority over disqualification, while Article 104 provides for\ndissolution of Parliament."}, "answer": "A", "explanation": "Article 103 – Decision on Questions of Disqualification\n\nWhen a question arises regarding whether a sitting Member of Parliament has become subject to a disqualification\nunder Article 102(1):\n\n    •    The President takes the decision.\n    •    Before making the decision, the President shall obtain the opinion of the Election Commission.\n    •    The President acts according to the opinion of the Election Commission.\n    •    Therefore, the Election Commission’s opinion is binding on the President in this matter.\n\nNote: Article 103 concerns disqualifications under Article 102(1). Anti-defection disqualification under Article\n102(2)/Tenth Schedule is decided by the Speaker or Chairman of the concerned House.\n\nArticle 104 – Penalty for Sitting and Voting\n\nA person is liable to a penalty of ₹500 for each day on which he/she:\n\n    •    Sits or votes in Parliament before taking the prescribed oath or affirmation, or\n\n\n\n    •    Knows that he/she is not qualified or is disqualified for membership, or\n    •    Knows that he/she is prohibited by law from sitting or voting.\n    •    The penalty is recoverable as a debt due to the Union."}, {"id": 272, "topic": "Parliament: Composition", "question": "Which of the following correctly describes the provisions of Articles 105 and 106 of the Constitution?", "options": {"A": "Article 105 deals with the powers, privileges and immunities of Parliament and its members, while Article 106\ndeals with the salaries and allowances of Members of Parliament.", "B": "Article 105 deals with salaries of MPs, while Article 106 deals with parliamentary privileges.", "C": "Article 105 deals with the election of MPs, while Article 106 deals with disqualification of MPs.", "D": "Article 105 deals with the oath of MPs, while Article 106 deals with the duration of Parliament."}, "answer": "A", "explanation": "members and committees.\n\nFreedom of Speech in Parliament\n\n    •    MPs have freedom of speech and expression in Parliament.\n    •    This freedom is subject to the Constitution and the rules/standing orders of Parliament.\n\nFreedom from Court Proceedings\n\n    •    An MP cannot be held liable in any court for anything said or any vote given in Parliament or its\n         committees.\n    •    This protects members from legal action for their parliamentary speech and voting.\n\nPublication of Parliamentary Proceedings\n\n    •    No person is liable in respect of publication of a true report of proceedings of Parliament, subject to the\n         constitutional provisions.\n    •    This helps protect genuine reporting of parliamentary proceedings.\n\nOther Privileges\n\n    •    Parliament may define its other powers, privileges and immunities by law.\n    •    Until Parliament makes such a law, the privileges continue according to the constitutional provision.\n\nNote: Parliamentary privilege does not mean that MPs are above the law. It mainly protects the independent\nfunctioning of Parliament.\n\nArticle 106 – Salaries & Allowances\n\nMembers of Lok Sabha and Rajya Sabha are entitled to salaries and allowances.\n\n    •    These are determined by Parliament by law.\n    •    Until Parliament makes such a law, the applicable provisions prescribed by law continue to operate."}, {"id": 273, "topic": "Parliament: Composition", "question": "Which of the following statements correctly describes the election, tenure, powers, functions, resignation,\nvacation and removal of the Speaker of the Lok Sabha?\n\n1. The Speaker is elected by the Lok Sabha from among its members.\n\n2. The Speaker continues in office after the dissolution of Lok Sabha until immediately before the first meeting of\nthe newly elected Lok Sabha.\n\n3. The Speaker can be removed by a resolution of Lok Sabha passed by a majority of all the then members of the\nHouse, after giving at least 14 days’ notice.\n\n4. The Speaker normally does not vote in the first instance but has a casting vote in case of equality of votes.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1, 2 and 3 only", "B": "1, 3 and 4 only", "C": "2 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "D", "explanation": "Election – Article 93\n\n    •    The Lok Sabha elects the Speaker from among its own members.\n    •    The Speaker is elected as soon as possible after the commencement of a new Lok Sabha.\n    •    Similarly, Lok Sabha elects a Deputy Speaker from among its members.\n    •    The Speaker is not appointed by the President.\n\nTenure\n\n    •    Normally, the Speaker remains in office during the life of the Lok Sabha.\n    •    But the Speaker does not immediately vacate office when Lok Sabha is dissolved.\n    •    The Speaker continues until immediately before the first meeting of the newly elected Lok Sabha.\n\nMain Role\n\nThe Speaker is the presiding officer of Lok Sabha and ensures the smooth and orderly conduct of its business.\n\nImportant Powers & Functions\n\nPresiding over Lok Sabha\n\n    •    Conducts the sittings of the House.\n    •    Decides who may speak.\n    •    Maintains order and discipline.\n    •    Regulates parliamentary proceedings.\n\nInterprets Rules\n\n    •    Interprets the Rules of Procedure and Conduct of Business of Lok Sabha.\n    •    Gives rulings on procedural matters.\n\n\n\nMoney Bill – Article 110\n\n    •    Decides whether a Bill is a Money Bill.\n    •    The Speaker’s decision on this question is final.\n    •    The Speaker’s certificate is endorsed on the Bill when it is transmitted to Rajya Sabha and when it is\n         presented to the President.\n\nCasting Vote – Article 100\n\nThe Speaker does not vote in the first instance.\n\nIf there is an equality of votes, the Speaker exercises a casting vote.\n\nJoint Sitting – Article 108\n\nThe Speaker presides over a joint sitting of both Houses of Parliament.\n\nIn the Speaker’s absence, the Deputy Speaker presides.\n\nAnti-Defection – Tenth Schedule\n\nThe Speaker decides questions of disqualification of Lok Sabha members under the Anti-Defection Law.\n\nThe decision is subject to judicial review.\n\nParliamentary Committees The Speaker has important powers regarding Lok Sabha committees.\n\nThe Speaker is the ex-officio Chairman of:\n\n    •    Business Advisory Committee\n    •    Rules Committee\n    •    General-Purpose Committee\n    •    The Speaker also nominates/appoints members to several other committees as provided by the rules.\n\nMotions & Notices\n\nDecides the admissibility of questions, motions, resolutions and notices according to the rules.\n\nDetermines the order in which business is taken up.\n\nLok Sabha Secretariat\n\nExercises important administrative control over the Lok Sabha Secretariat.\n\nGuardian of the House\n\nProtects the rights and privileges of Lok Sabha.\n\nEnsures that parliamentary proceedings are conducted according to the Constitution and rules.\n\nVacation of Office – Article 94\n\nThe Speaker’s office becomes vacant in three main situations:\n\nCeases to be a Member\n\n    •    If the Speaker ceases to be a member of Lok Sabha, the office of Speaker becomes vacant.\n\n\n\nResignation\n\n    •    Speaker resigns by writing to the Deputy Speaker.\n    •    Deputy Speaker resigns by writing to the Speaker.\n\nRemoval\n\n    •    Speaker can be removed by a resolution of Lok Sabha.\n\nRemoval of Speaker – Article 94\n\nFor removal of the Speaker:\n\n    •    Resolution must be passed by Lok Sabha\n    •    Majority required → Majority of all the then members of the House(50%+1)\n    •    This is called Effective Majority.\n\nExample:\n\nIf Lok Sabha has 540 existing members( Total 545;5vacany )\n\n540 ÷ 2 = 270\n\nTherefore, 271 votes are required.\n\nNotice → Minimum 14 days’ notice\n\nA resolution for removal cannot be moved without giving the Speaker at least 14 days’ notice.\n\nImportant Point During Removal\n\nWhen a resolution for the removal of the Speaker is under consideration:\n\n    •    The Speaker cannot preside over the sitting.\n    •    The Deputy Speaker or another authorised person presides according to the constitutional rules.\n    •    The Speaker can participate in the proceedings.\n    •    The Speaker can vote in the first instance.\n    •    The Speaker does not have a casting vote while the removal resolution is being considered.\n\nDeputy Speaker Acting as Speaker – Article 95\n\nIf the office of Speaker is vacant, or the Speaker is unable to perform his duties:\n\n    •    Deputy Speaker → Performs the functions of Speaker.\n    •    If both offices are vacant, the President may appoint a member of Lok Sabha to perform the Speaker’s\n         duties."}, {"id": 274, "topic": "Parliament: Composition", "question": "Which of the following statements correctly describes the Deputy Speaker of the Lok Sabha?\n\n1. The Deputy Speaker is elected by the Lok Sabha from among its members.\n\n2. The Deputy Speaker performs the duties of the Speaker when the office of Speaker is vacant or when the Speaker\nis unable to perform his functions.\n\n\n\n3. The Deputy Speaker can resign by writing to the Speaker and can be removed by a resolution of the Lok Sabha\npassed by a majority of all the then members of the House after 14 days’ notice.\n\n4. The Deputy Speaker continues in office after the dissolution of Lok Sabha until immediately before the first\nmeeting of the newly elected Lok Sabha.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 2, 3 and 4"}, "answer": "B", "explanation": "Deputy Speaker\n\nElection – Article 93\n\n    •    The Lok Sabha elects the Deputy Speaker from among its own members.\n    •    The Deputy Speaker is not appointed by the President.\n    •    The Constitution does not prescribe a fixed time limit for the election, but it should be held as soon as\n         possible.\n\nRole & Functions – Article 95\n\nThe Deputy Speaker performs the duties of the Speaker when:\n\n    •    The office of Speaker is vacant, or\n    •    The Speaker is absent/unable to perform his functions.\n\nWhen presiding over the House, the Deputy Speaker has the same powers as the Speaker for conducting that sitting.\n\nThe Deputy Speaker also presides over the joint sitti
