8th July 2025, despite facing floods in 2024.\n2. Swachh Survekshan survey is conducted every year by the Ministry of Jal Shakti under the Swachh Bharat Mission (Urban). Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The survey is conducted by the Ministry of Housing and Urban Affairs (MoHUA), not the Ministry of Jal Shakti."},{"t":"Awards","n":150,"tag":"","q":"Which organization received the National Geospatial Practitioner Award 2025 for its work in ocean information services, on 18 July 2025?","o":["ISRO","IMD","INCOIS","DRDO"],"a":2,"e":"INCOIS (Indian National Centre for Ocean Information Services) was recognized for its use of open-source geospatial technology in marine governance and environmental protection."},{"t":"Awards","n":151,"tag":"","q":"Who received the Kalinga Ratna Award 2024, conferred by President Droupadi Murmu on July 16, 2025 ?","o":["Narendra Modi","Ashwini Vaishnaw","Dharmendra Pradhan","Naveen Patnaik"],"a":2,"e":"Dharmendra Pradhan. The Kalinga Ratna Award, presented annually by the Sarala Sahitya Sansad, recognizes individuals who have made significant contributions in the fields of education, literature, culture, or public service."},{"t":"Awards","n":152,"tag":"","q":"Who won the 2025 PEN Pinter Prize on July 10, 2025 for her powerful writing on faith, migration, and the lives of Muslim women?","o":["Elif Shafak","Leila Aboulela","Fatima Bhutto","Zadie Smith"],"a":1,"e":"Leila Aboulela. She is also known for her novels like The Translator (1999), Minaret (2005), and River Spirit (2023). Past winners include Arundhati Roy (2024), Salman Rushdie (2014), and Chimamanda Ngozi Adichie (2018)."},{"t":"Awards","n":153,"tag":"","q":"Who received the Hem Bahadur Malla Award 2080 for outstanding contributions to Nepal’s judicial system on 15 July 2025?","o":["Cholendra Shumsher Rana","Gopal Parajuli","Kalyan Shrestha","Sushila Karki"],"a":2,"e":"Kalyan Shrestha. Former Chief Justice Kalyan Shrestha was honoured in Kathmandu with the Hem Bahadur Malla Award 2080 for his significant role in judicial reforms and promoting justice in Nepal."},{"t":"Awards","n":154,"tag":"","q":"Who won the 2025 United Nations Population Award on July 11, 2025, for her efforts in promoting gender equality and preventing sex-selective abortions?","o":["Medha Patkar","Varsha Deshpande","Laxmi Narayan Tripathi","Bezwada Wilson"],"a":1,"e":"Varsha Deshpande. She is the secretary of Dalit Mahila Vikas Mandal, which she founded in 1990. The UN Population Award was set up in 1981 and first given in 1983."},{"t":"Awards","n":155,"tag":"","q":"Which state won the India Energy Storage Alliance (IESA) Industry Excellence Award 2025 on July 10 for its leadership in battery manufacturing and clean energy initiatives?","o":["Karnataka","Maharashtra","Gujarat","Telangana"],"a":3,"e":"Telangana. It received this Award in New Delhi on July 10 for its leadership in battery manufacturing and creating a supportive ecosystem for clean energy and advanced battery technologies. The IESA Industry Excellence Awards were started in 2017."},{"t":"Awards","n":156,"tag":"","q":"Who was selected for the Chintha Raveendran Award 2025 for his contributions to Indian literature?","o":["Namdeo Dhasal","Sarankumar Limbale","Bhalchandra Nemade","Uday Prakash"],"a":1,"e":"Sarankumar Limbale. The Chintha Raveendran Award is given each year to a writer who has made a strong impact in the field of literature and social issues."},{"t":"Awards","n":157,"tag":"","q":"What is the name of Namibia’s highest civilian award presented to Prime Minister Narendra Modi during his 2025 visit?","o":["The Order of the African Unity","The Medal of Desert Resilience","The Order of the Most Ancient Welwitschia Mirabilis","The Namib Desert Friendship Honour"],"a":2,"e":"The Order of the Most Ancient Welwitschia Mirabilis. The Welwitschia Mirabilis Award was started in 1995. This is PM Modi’s 27th international award."},{"t":"Awards","n":158,"tag":"","q":"Which district won the Kerala Fisheries Department Excellence Award 2025 for achievements in aquaculture under the Popular Fish Farming Project on 9 July 2025?","o":["Alappuzha","Thrissur","Kasaragod","Kollam"],"a":2,"e":"Kasaragod. Kasaragod received the Kerala Fisheries Department Excellence Award 2025 for its outstanding performance in aquaculture through the Popular Fish Farming Project, with recognition also given to local farmers."},{"t":"Awards","n":159,"tag":"","q":"Who became the first Indian actress to receive a star on the Hollywood Walk of Fame in July 2025 ?","o":["Aishwarya Rai Bachchan","Priyanka Chopra","Alia Bhatt","Deepika Padukone"],"a":3,"e":"Deepika Padukone. She made her Hollywood debut in 2017 with the film ‘XXX: Return of Xander Cage’."},{"t":"Awards","n":160,"tag":"","q":"Who received the ‘Key to the City of Buenos Aires’ in July 2025 as a mark of honour?","o":["Deepika Padukone","Radhanath Swami","Narendra Modi","Ram Bahadur Rai"],"a":2,"e":"Narendra Modi. The award was given to honour his work in improving India-Argentina ties. This marked the first visit by an Indian Prime Minister in 57 years."},{"t":"Awards","n":161,"tag":"","q":"On July 4, 2025, Prime Minister Narendra Modi received the highest civilian award of which country during his official visit ?","o":["Guyana","Trinidad and Tobago","South Africa","Mauritius"],"a":1,"e":"Trinidad and Tobago. This is PM Modi’s first official visit to Trinidad and Tobago as Prime Minister. It is also the first Indian Prime Ministerial-level visit to the country since 1999."},{"t":"Awards","n":162,"tag":"","q":"Consider the following statements regarding the NASA–NSS Space Settlement Design Contest 2025:\n1. S.R.N. Mehta CBSE School, Kalaburagi won the first prize in the 8th grade category on 5th July 2025.\n2. The contest is jointly organised by NASA and ISRO to encourage school students in space settlement design. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The competition is jointly organised by NASA and NSS (National Space Society, USA), not ISRO."},{"t":"Awards","n":163,"tag":"","q":"On July 3, 2025, which leader was conferred with Ghana’s highest civilian honour, the \"Officer of the Order of the Star of Ghana\"?","o":["Dr. S. Jaishankar","Ram Nath Kovind","Narendra Modi","Pranab Mukherjee"],"a":2,"e":"Narendra Modi. Prime Minister Narendra Modi received Ghana’s top civilian award, Officer of the Order of the Star of Ghana, on July 3, 2025, during his first state visit. The honour, presented by President John Dramani Mahama, recognized Modi's global leadership and his role in strengthening India-Ghana relations."},{"t":"Awards","n":164,"tag":"","q":"Which state’s Sahitya Akademi announced the 2024 Literary Award winners to celebrate contributions in Malayalam literature?","o":["Tamil Nadu","Karnataka","Kerala","Andhra Pradesh"],"a":2,"e":"Kerala. The 2024 Kerala Sahitya Akademi Awards were officially declared on June 26, 2025, in Thrissur, recognizing a wide array of Malayalam literary contributions."},{"t":"Awards","n":165,"tag":"","q":"Which organisation won the Digital Payments Award 2024–25 presented by the Department of Financial Services, Ministry of Finance?","o":["State Bank of India","India Post Payments Bank","Paytm Payments Bank","HDFC Bank"],"a":1,"e":"India Post Payments Bank. India Post Payments Bank (IPPB), a 100% government-owned payments bank under the Department of Posts."},{"t":"Awards","n":166,"tag":"","q":"Which Indian animated film won the Jury Prize for Best Commissioned Film at the Annecy International Animation Festival 2025?","o":["Bombay Rose","Desi Oon","Hanuman","The Legend of Prince Rama"],"a":1,"e":"Desi Oon. It directed by renowned Indian animator Suresh Eriyat, won the Jury Award for Best Commissioned Film at the Annecy International Animation Festival 2025."},{"t":"Awards","n":167,"tag":"","q":"Consider the following statements regarding the WAN-IFRA Digital Media Awards South Asia 2025:\n1. The Hindu was named Champion of Digital Media Awards South Asia 2025 at the event held in Chennai on June 18, 2025.\n2. The WAN-IFRA Digital Media Awards South Asia were first launched in 2018 to recognise excellence in digital journalism and storytelling. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The Digital Media Awards South Asia by WAN-IFRA were actually launched in 2016, not 2018."},{"t":"Awards","n":168,"tag":"","q":"How many young authors were recognized with the Sahitya Akademi Yuva Puraskar 2025 across Indian languages?","o":["18","20","23","25"],"a":2,"e":"23. The Sahitya Akademi announced the Yuva Puraskar 2025 for 23 young writers across various Indian languages. The award includes ₹50,000 in cash and is given based on jury recommendations to promote emerging literary talent."},{"t":"Awards","n":169,"tag":"","q":"Who won the Sahitya Akademi Yuva Puraskar 2025 in the English language category?","o":["Advait Kolarkar","Akhil P. Dharmajan","Pradeep Kokane","Neetu"],"a":0,"e":"Advait Kolarkar. He was awarded in the English category for his novel \"Siddhartha – The Boy Who Became the Buddha.\""},{"t":"Awards","n":170,"tag":"","q":"The book \"Ram Oru Anandhi\", which won the Sahitya Akademi Yuva Puraskar 2025, is written in which language?","o":["Malayalam","Tamil","Telugu","Kannada"],"a":0,"e":"Malayalam. Ram Oru Anandhi, a novel by Akhil P. Dharmajan, won in the Malayalam language category."},{"t":"Awards","n":171,"tag":"","q":"Who received the Sahitya Akademi Yuva Puraskar 2025 for the Sanskrit work \"Panchbhautikshahol-swavasyam...\" ?","o":["Dhiresna Kumar Pandey","Subash Thakuri","Amar Khungur Boro","Parvati Tirkey"],"a":0,"e":"Dhiresna Kumar Pandey. Dhiresna Kumar Pandey was awarded in Sanskrit for his critical work on Vedanta philosophy."},{"t":"Awards","n":172,"tag":"","q":"For which genre did Mayur Kharadi receive the Sahitya Akademi Yuva Puraskar 2025 in Gujarati?","o":["Novel","Poetry","Short Stories","Essays"],"a":3,"e":"Essays. Mayur Kharadi won the Sahitya Akademi Yuva Puraskar 2025 in Gujarati for his essay collection \"Naranch Tekari.\""},{"t":"Awards","n":173,"tag":"","q":"Which poet received the Sahitya Akademi Yuva Puraskar 2025 in the Punjabi language category?","o":["Subrat Kumar Senapati","Mandeep Aulakh","Parvati Tirkey","Amar Khungur Boro"],"a":1,"e":"Mandeep Aulakh. He won the Sahitya Akademi Yuva Puraskar 2025 in Punjabi for his poetry collection \"Girka Hostel.\""},{"t":"Awards","n":174,"tag":"","q":"The book \"Phir Ugna\" that won the Sahitya Akademi Yuva Puraskar 2025 in Hindi belongs to which genre?","o":["Novel","Criticism","Poetry","Short Stories"],"a":2,"e":"Poetry. Phir Ugna is a poetry collection by Parvati Tirkey, which won the Sahitya Akademi Yuva Puraskar 2025 in Hindi."},{"t":"Awards","n":175,"tag":"","q":"Who received the Sahitya Akademi Yuva Puraskar 2025 in Urdu for the novel \"Maulard Haqeqat, Thereek-e-Azadi, or Hindi Jihad Ka Farmonsuti Kardah Qasaid\" ?","o":["Saiba Sehar","Neetu","Manjham Bachani","Sudeshna Moitra"],"a":1,"e":"Neetu."},{"t":"Awards","n":176,"tag":"","q":"How many authors were selected for the Bal Sahitya Puraskar 2025 by the Sahitya Akademi for their contribution to children's literature?","o":["12","18","24","30"],"a":2,"e":"24."},{"t":"Awards","n":177,"tag":"","q":"In which language did Jitendra Sharma win the Bal Sahitya Puraskar 2025 for his drama Panahravansh Ni Pira?","o":["Maithili","Rajasthani","Gujarati","Odia"],"a":1,"e":"Rajasthani."},{"t":"Awards","n":178,"tag":"","q":"Which author won the Bal Sahitya Puraskar 2025 for the Assamese poetic work Mahabharathar Padya?","o":["K. Shivaling gappa Harisdhal","Surendra Mohan Das","Binay Kumar Brahma","Hansda Murmu"],"a":1,"e":"Surendra Mohan Das."},{"t":"Awards","n":179,"tag":"","q":"Who was conferred the Padma Bhushan on June 18, 2025, at IGNCA, New Delhi, for his outstanding contributions to journalism and cultural thought?","o":["Ravish Kumar","Ram Bahadur Rai","Rajdeep Sardesai","Shekhar Gupta"],"a":1,"e":"Ram Bahadur Rai. Padma Bhushan, India’s third-highest civilian honor."},{"t":"Awards","n":180,"tag":"","q":"Which acclaimed filmmaker will receive the Honorary Leopard Award at the Locarno Film Festival 2025 for contributions to global cinema?","o":["Christopher Nolan","Steven Spielberg","Alexander Payne","Wes Anderson"],"a":2,"e":"Alexander Payne. The Locarno Film Festival 2025 will present the Honorary Leopard Award to Alexander Payne, known for impactful films like Nebraska. The award, to be conferred on August 15, celebrates his significant influence in world cinema."},{"t":"Awards","n":181,"tag":"","q":"Which Gram Panchayat won the Gold Award in the Grassroots Level Initiatives category at the National Awards for e‑Governance 2025?","o":["Suakati Gram Panchayat, Odisha","West Majlishpur Gram Panchayat, Tripura","Rohini Gram Panchayat, Dhule, Maharashtra","Palsana Gram Panchayat, Gujarat"],"a":2,"e":"Rohini Gram Panchayat, Dhule, Maharashtra."},{"t":"Awards","n":182,"tag":"","q":"In the Defence Investiture Ceremony (Phase-II) held on June 4, 2025, at Rashtrapati Bhawan, how many Distinguished Service Decorations were presented by President Droupadi Murmu?","o":["82","88","92","96"],"a":2,"e":"92. During Phase-II of the Defence Investiture Ceremony 2025, President Droupadi Murmu conferred 92 Distinguished Service Decorations on personnel from the Indian Armed Forces, Indian Coast Guard, and BRO."},{"t":"Awards","n":183,"tag":"","q":"Who was crowned Miss World 2025, making history as the first winner from Thailand?","o":["Nandini Gupta","Hasset Dereje Admassu","Opal Suchata Chuangsri","Priyanka Chopra"],"a":2,"e":"Opal Suchata Chuangsri. The 72nd Miss World pageant was held in Hyderabad, India, where Opal impressed the judges with her poise and message Hasset Dereje Admassu from Ethiopia was the runner-up, while India’s Nandini Gupta did not place in the Top 8."},{"t":"Awards","n":184,"tag":"","q":"Which Indian author recently won the 2025 International Booker Prize ?","o":["Arundhati Roy","Jhumpa Lahiri","Banu Mushtaq","Kiran Desai"],"a":2,"e":"Banu Mushtaq . She won the 2025 International Booker Prize for Heart Lamp, the first Kannada-language book to receive this honor."},{"t":"Agreements & MoUs","n":185,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following is the specific port facility within Chabahar Port that India is primarily developing and operating ?","o":["Jask Port","Shahid Beheshti Port","Shahid Kalantari Port","Bandar Abbas Port"],"a":1,"e":"Shahid Beheshti Port. Chabahar Port, located in southeastern Iran on the Gulf of Oman, is Iran’s only oceanic port. India is primarily involved in the development and operation of the Shahid Beheshti Terminal at Chabahar Port. This port facility is strategically important for India as it provides: Direct access to Afghanistan and Central Asia, bypassing Pakistan; A key role in the International North-South Transport Corridor (INSTC). Shahid Kalantari Port – Another terminal at Chabahar but not developed by India. Bandar Abbas Port – Iran’s largest port, located on the Strait of Hormuz, unrelated to India’s project."},{"t":"Agreements & MoUs","n":186,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"India's primary interest in developing Chabahar Port is to:","o":["Establish a direct naval base for military operations in the Persian Gulf.","Gain direct access to Afghanistan and Central Asia, bypassing Pakistan.","Develop a new tourism hub for its citizens.","Export agricultural products exclusively to Iran."],"a":1,"e":"Chabahar Port in Iran’s Sistan-Baluchestan province is strategically important for India as it provides a trade and transit route to Afghanistan and Central Asia, avoiding Pakistan. It strengthens India’s regional connectivity, energy security, and influence in Eurasia."},{"t":"Agreements & MoUs","n":187,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"In May 2024, India signed a long-term agreement for the operation of Chabahar Port. What is the duration of this agreement ?","o":["20 years","10 years","99 years","5 years"],"a":1,"e":"In May 2024, India and Iran signed a long-term bilateral contract for the operation of the Shahid Beheshti terminal at Chabahar Port. This agreement grants India operational control for a period of 10 years."},{"t":"Agreements & MoUs","n":188,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"What strategic rationale drives India's investment in Iran's Chabahar Port?","o":["To reach Afghanistan and Central Asia bypassing Pakistan","To monitor US naval operations","To build naval bases in Iran","To import natural gas from Saudi Arabia"],"a":0,"e":"The strategic rationale behind India's investment in Iran's Chabahar Port is primarily geopolitical and economic. The port provides India with a crucial sea-land access route to Afghanistan and the resource-rich, landlocked countries of Central Asia. This is vital because Pakistan does not grant India overland transit rights for trade with these regions. By developing and operating a part of the Chabahar Port, India secures an alternative and reliable trade route that completely bypasses Pakistan, thus overcoming a significant strategic bottleneck and enhancing its regional influence."},{"t":"Agreements & MoUs","n":189,"tag":"","q":"Consider the following statements regarding India’s MoU on fisheries and aquaculture in 2025:\n1. India signed an MoU with Maldives to enhance cooperation in the field of fisheries and aquaculture.\n2. The MoU was signed during PM Modi’s State visit, as part of six MoUs exchanged between the two nations.\n3. India signed the MoU with Sri Lanka for strengthening fisheries and aquaculture. Which of the above statements is/are correct?","o":["1 and 2 only","2 and 3 only","1 and 3 only","1, 2 and 3"],"a":0,"e":"1 and 2 only. In 2025, India signed an MoU with Maldives, not Sri Lanka, to strengthen cooperation in fisheries and aquaculture."},{"t":"Agreements & MoUs","n":190,"tag":"","q":"Which organization signed an MoU with the Ministry of Rural Development to promote the Bima Sakhi Yojana ?","o":["NABARD","LIC","SIDBI","NITI Aayog"],"a":1,"e":"LIC. This MoU was signed during the national financial inclusion conclave \"Anubhuti\" held in Goa from July 8 to 10, 2025. The Bima Sakhi Yojana aims to empower rural women by appointing them as insurance agents or \"Bima Sakhis\" who help spread awareness about life insurance in rural areas."},{"t":"Agreements & MoUs","n":191,"tag":"","q":"Which two organizations signed an MoU to promote structured education for children with intellectual disabilities ?","o":["NCERT and NHRC","NIEPID and JVF","NIMHANS and UNICEF","IGNOU and CSWB"],"a":1,"e":"NIEPID and JVF. On July 18, 2025, National Institute for Empowerment of Persons with Intellectual Disabilities (NIEPID) and Jai Vakeel Foundation (JVF) signed an MoU to promote structured education for children with intellectual disabilities by implementing the DISHA curriculum with personalized, multisensory, and regionally adapted teaching methods."},{"t":"Agreements & MoUs","n":192,"tag":"","q":"Which two organizations partnered to boost India's UAV (drone) manufacturing capabilities ?","o":["DRDO and HAL","ISRO and BDL","Vimananu and CYGR","BEL and NSIL"],"a":2,"e":"Vimananu and CYGR. Vimananu Ltd (a subsidiary of RRP Defence) partnered with Franco-American firm CYGR to boost UAV manufacturing under Make in India. A drone unit will be set up in Navi Mumbai."},{"t":"Agreements & MoUs","n":193,"tag":"","q":"Which two organizations signed an agreement to launch India’s first weather derivatives on June 26, 2025 ?","o":["NABARD and ISRO","NCDEX and IMD","SEBI and IARI","RBI and IMD"],"a":1,"e":"NCDEX and IMD. On June 26, 2025, National Commodity & Derivatives Exchange Ltd (NCDEX) and India Meteorological Department (IMD) signed an MoU to launch India’s first parametric weather derivatives, focused on rainfall-based products."},{"t":"Agreements & MoUs","n":194,"tag":"","q":"Which Indian minister finalized a 5-year DAP fertilizer agreement with Saudi firm Maaden during a visit in July 2025 ?","o":["Mansukh Mandaviya","Piyush Goyal","JP Nadda","Narendra Singh Tomar"],"a":2,"e":"JP Nadda. During his July 11–13, 2025 visit to Saudi Arabia, Union Minister J. P. Nadda finalized a 5-year DAP fertilizer deal with Ma’aden for 3.1 million metric tonnes annually, ensuring India’s fertilizer security amid global supply issues."},{"t":"Agreements & MoUs","n":195,"tag":"","q":"Which organization signed a three-year MoU with the Handball Association of India to promote handball through national broadcasting?","o":["Sports Authority of India","Doordarshan Kendra","Prasar Bharati","All India Radio"],"a":2,"e":"Prasar Bharati. In July 2025, Prasar Bharati signed a 3-year MoU with the Handball Association of India to broadcast national and international handball events via DD Sports and Waves OTT, aiming to boost the sport’s visibility and talent development."},{"t":"Agreements & MoUs","n":196,"tag":"","q":"Which organization collaborated with UNICEF and Tata Motors to launch new student programs for tribal students?","o":["NCERT","NESTS","NIOS","AICTE"],"a":1,"e":"NESTS. In July 2025, NESTS (National Education Society for Tribal Students), under the Ministry of Tribal Affairs, collaborated with UNICEF India and Tata Motors to launch the “Kaushalya Programme”. It targets Class 12 EMRS students, offering vocational training, apprenticeships, psychometric assessment, and placement support, aiming to benefit over 50,000 tribal youth."},{"t":"Agreements & MoUs","n":197,"tag":"","q":"Which organization partnered with the Department of Empowerment of Persons with Disabilities (DEPwD) on July 7, 2025, to promote inclusive education ?","o":["National Council of Educational Research and Training","Sri Aurobindo Society","Rehabilitation Council of India","Indian Institute of Education"],"a":1,"e":"Sri Aurobindo Society. The \"Project Inclusion\" launched under the Rupantar Programme. It aims to promote inclusive education for children with disabilities through app and web-based training, e-certification, and capacity building of teachers and professionals."},{"t":"Agreements & MoUs","n":198,"tag":"","q":"Where did India and Trinidad & Tobago sign six new agreements during PM Modi’s visit on July 4, 2025 ?","o":["San Fernando","Port of Spain","Chaguanas","Arima"],"a":1,"e":"Port of Spain. It was signed during PM Modi visits. The talks were held at the Red House (Trinidadian Parliament), covering pharma, culture, sports, diplomatic training, quick-impact projects, and ICCR academic collaboration."},{"t":"Agreements & MoUs","n":199,"tag":"","q":"Which university in Sri Lanka launched a Hindi language course in collaboration with India’s SVCC to promote educational and cultural ties ?","o":["University of Colombo","University of Peradeniya","General Sir John Kotelawala Defence University","Eastern University, Sri Lanka"],"a":2,"e":"General Sir John Kotelawala Defence University, Colombo launched a Hindi language course in collaboration with India’s Swami Vivekananda Cultural Centre (SVCC). The course, open to cadets and civilian students, promotes practical Hindi skills and strengthens Indo–Sri Lanka educational and cultural ties."},{"t":"Agreements & MoUs","n":200,"tag":"","q":"Which media organization partnered with DPIIT to empower over one million entrepreneurs across India?","o":["Inc42","The Print","YourStory","TechCrunch"],"a":2,"e":"YourStory. On June 19, 2025, DPIIT partnered with YourStory under the Bharat Project to empower 1 million entrepreneurs in Tier II, Tier III, and rural India through AI tools, startup launchpads, and regional-language content."},{"t":"Agreements & MoUs","n":201,"tag":"","q":"Which bank partnered with NPCI to introduce UPI services for cross-border payments in Cyprus ?","o":["Bank of Cyprus","Hellenic Bank","Eurobank Cyprus","Alpha Bank"],"a":2,"e":"Eurobank Cyprus. In June 2025, NPCI International partnered with Eurobank Cyprus to launch UPI-based cross-border payments, enabling seamless digital transactions for Indian tourists, diaspora, and Cypriot merchants—marking India’s growing global fintech footprint."},{"t":"Agreements & MoUs","n":202,"tag":"","q":"Which bank has partnered with Maruti Suzuki to enhance retail car financing options ?","o":["Ujjivan Small Finance Bank","Jana Small Finance Bank","Equitas Small Finance Bank","AU Small Finance Bank"],"a":2,"e":"Equitas Small Finance Bank. In June 2025, Maruti Suzuki partnered with Equitas Small Finance Bank to boost retail car financing for new, used, and commercial vehicles—aiming to offer easier, customized loan options and expand vehicle access across India."},{"t":"Agreements & MoUs","n":203,"tag":"","q":"Which company partnered with the Government of India to train youth in EV technologies and green energy ?","o":["Tata Power","Shell India","Adani Green","ReNew Power"],"a":1,"e":"Shell India. On June 13, 2025, Shell India partnered with the Ministry of Skill Development & Entrepreneurship to train youth in EV and green energy technologies. The program includes practical training at ITIs and NSTIs, covering EV systems, batteries, and sustainability, with joint certification and placement support."},{"t":"Agreements & MoUs","n":204,"tag":"","q":"Which two organizations signed an MoU on June 12, 2025, to strengthen cybersecurity in India’s digital payment systems ?","o":["RBI & NITI Aayog","NPCI & IDRBT","SEBI & CERT-In","MeitY & ICICI Bank"],"a":1,"e":"NPCI & IDRBT. On June 12, 2025, the National Payments Corporation of India (NPCI) entered into a Memorandum of Understanding (MoU) with the Institute for Development and Research in Banking Technology (IDRBT) to bolster cybersecurity across India’s rapidly expanding digital payments ecosystem—including UPI (Unified Payments Interface)."},{"t":"Agreements & MoUs","n":205,"tag":"","q":"Where was the tripartite MoU signed on June 10, 2025, to combat road dust pollution in the NCR, and which organizations were involved ?","o":["Vanijya Bhawan, Delhi – DPIIT, FICCI & CRRI","Sushma Swaraj Bhawan, Delhi – CPCB, TERI & SPA","Vigyan Bhawan, Delhi – CAQM, CSIR-CRRI & SPA","India Habitat Centre, Delhi – NITI Aayog, NEERI & IIT Delhi"],"a":2,"e":"Vigyan Bhawan, Delhi – CAQM, CSIR-CRRI & SPA. The agreement was signed between the Commission for Air Quality Management (CAQM), CSIR-Central Road Research Institute (CRRI), and the School of Planning and Architecture (SPA). The initiative aims to develop a standard framework for dust mitigation involving paving, greening, and monitoring using GIS tools."},{"t":"Agreements & MoUs","n":206,"tag":"","q":"Which two organizations have partnered to develop Quantum Key Distribution (QKD) for drones in India ?","o":["ISRO and DRDO","BARC and HAL","C-DOT and Synergy Quantum","NIC and BEL"],"a":2,"e":"C-DOT and Synergy Quantum. Quantum Key Distribution (QKD) is a secure communication method that uses quantum mechanics to encrypt and transmit data. The project aims to boost the security and confidentiality of drone communications using quantum encryption. The Centre for Development of Telematics (C-DOT) is spearheading this strategic technology collaboration."},{"t":"Agreements & MoUs","n":207,"tag":"","q":"Where was the first round of India– New Zealand Free Trade Agreement (FTA) negotiations held ?","o":["Auckland","Wellington","New Delhi","Mumbai"],"a":2,"e":"New Delhi. The FTA aims to boost trade, investment, and economic ties between the two countries."},{"t":"Agreements & MoUs","n":208,"tag":"","q":"Which two Indian states have collaborated on the Tapti Basin Mega Recharge Project ?","o":["Gujarat and Rajasthan","Madhya Pradesh and Maharashtra","Maharashtra and Karnataka","Chhattisgarh and Odisha"],"a":1,"e":"Madhya Pradesh and Maharashtra. The project aims to replenish groundwater reserves and improve long-term water security in the Tapti river basin. The Tapti River traverses Madhya Pradesh, Maharashtra, and Gujarat."},{"t":"Agreements & MoUs","n":209,"tag":"","q":"Which two countries signed a Memorandum of Understanding (MoU) to strengthen Buddhist cultural ties in May 2025 ?","o":["India and Thailand","India and Sri Lanka","India and Vietnam","India and Nepal"],"a":2,"e":"India and Vietnam. The MoU aims to enhance Buddhist linkages, cultural exchange, and academic cooperation between the two nations."},{"t":"Agreements & MoUs","n":210,"tag":"","q":"India recently signed a new MoU on energy cooperation with which country in 2025 ?","o":["Sweden","Norway","Denmark","Germany"],"a":2,"e":"Denmark. The MoU emphasizes collaboration in renewable energy, green hydrogen, and energy efficiency. The agreement is part of the Green Strategic Partnership, enhancing cooperation on climate and sustainability goals."},{"t":"Agreements & MoUs","n":211,"tag":"","q":"Which Indian bank has been selected to provide banking services at 26 land ports across India ?","o":["HDFC Bank","Punjab National Bank","State Bank of India (SBI)","ICICI Bank"],"a":2,"e":"State Bank of India (SBI). SBI has partnered with the Land Ports Authority of India (LPAI) to deliver banking infrastructure at land ports."},{"t":"Agreements & MoUs","n":212,"tag":"","q":"During which session did India and Russia agree on six new strategic investment projects ?","o":["6th Session of IRWG-PIP","7th Session of IRWG-PIP","8th Session of IRWG-PIP","9th Session of IRWG-PIP"],"a":2,"e":"8th Session of IRWG-PIP. India and Russia agreed on six new strategic projects during the 8th Session of the India-Russia Working Group on Priority Investment Projects (IRWG-PIP) held in New Delhi. The projects focused on trade, economic development, and technological innovation to deepen bilateral cooperation."},{"t":"Agreements & MoUs","n":213,"tag":"","q":"What is the major component to be set up under IOCL’s petrochemical project in Paradip ?","o":["Oil refinery","Dual-feed cracker unit","Fertilizer plant","Textile manufacturing unit"],"a":1,"e":"Dual-feed cracker unit. The complex will manufacture products like phenol, polypropylene (PP), isopropyl alcohol (IPA), HDPE, LLDPE, PVC, and butadiene. Union Petroleum and Natural Gas Minister Hardeep Singh Puri was present during the formalization of the investment agreement."},{"t":"Defence","n":214,"tag":"","q":"Which country recently unveiled Gazap, claimed to be the world’s most powerful non-nuclear bomb, at the IDEF 2025 defence fair?","o":["Russia","United States","Turkey","China"],"a":2,"e":"Turkey. Gazap, meaning “Wrath” in Turkish, was unveiled by Turkey at the 17th International Defence Industry Fair (IDEF) 2025 held in Istanbul. It weighs 970 kg and is considered one of the most powerful non-nuclear bombs ever built."},{"t":"Defence","n":215,"tag":"","q":"Who conducted \"Operation Mahadev\" in July 2025?","o":["Indian Navy","Indian Air Force","Indian Army, CRPF & J&K Police","NSG Commandos"],"a":2,"e":"Indian Army, CRPF & J&K Police. Operation Mahadev was conducted in the Dara region near Dachigam National Park, Jammu and Kashmir. It was a joint operation by the Indian Army, CRPF, and J&K Police. The terrorists killed were affiliated with Lashkar-e-Taiba (LeT) and had links to the Pahalgam attack."},{"t":"Defence","n":216,"tag":"","q":"Consider the following statements regarding India’s newly launched pollution control vessel:\n1. Samudra Prachet, India’s second indigenously designed Pollution Control Vessel, was launched on July 23, 2025, at Goa Shipyard Limited in Vasco da Gama, Goa.\n2. Samudra Rakshak was launched as the first pollution control vessel in 2025 at Cochin Shipyard. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The name of the newly launched vessel is Samudra Prachet, not Samudra Rakshak, and it was not launched at Cochin Shipyard."},{"t":"Defence","n":217,"tag":"","q":"Which advanced combat helicopters were recently inducted by the Indian Army from the United States?","o":["Chinook","Apache","Black Hawk","Viper"],"a":1,"e":"Apache. In July 2025, the Indian Army inducted its first batch of AH-64E Apache attack helicopters from the U.S. under a ₹5,691 crore deal signed in 2020."},{"t":"Defence","n":218,"tag":"","q":"Which iconic Indian Air Force (IAF) aircraft is set to be retired bySeptember 2025?","o":["Sukhoi Su-30MKI","Mirage 2000","MiG-21","Tejas"],"a":2,"e":"MiG-21. The Indian Air Force will retire the iconic MiG-21 by September 2025, ending over 60 years of service. Inducted in 1963, it was India’s first supersonic jet and served in major operations like the 1965, 1971 wars and Balakot airstrike."},{"t":"Defence","n":219,"tag":"","q":"India has partnered with global satellite firms primarily to enhance which of the following capabilities?","o":["Naval shipbuilding","Real-time military surveillance","Civilian weather forecasting","Agricultural land mapping"],"a":1,"e":"Real-time military surveillance. India has tied up with global satellite firms to boost real-time military surveillance, improve border monitoring, and support defense modernization alongside ISRO-DRDO systems."},{"t":"Defence","n":220,"tag":"","q":"What is the primary purpose of INS Nistar, India’s first indigenous Diving Support Vessel?","o":["Coastal patrol operations","Anti-piracy missions","Submarine rescue and underwater operations","Amphibious troop transport"],"a":2,"e":"Submarine rescue and underwater operations. INS Nistar, commissioned in July 2025, is India’s first indigenous Diving Support Vessel designed for submarine rescue and deep-sea missions. It operates rescue submersibles and ROVs, enhancing India’s underwater operational and maritime rescue capabilities."},{"t":"Defence","n":221,"tag":"","q":"SIMBEX 2025, in which the Indian Navy is set to participate, is a bilateral maritime exercise between India and which country?","o":["Singapore","Sri Lanka","Seychelles","South Korea"],"a":0,"e":"Singapore. SIMBEX 2025 is a bilateral maritime exercise between India and Singapore, held annually since 1994. It enhances naval coordination through joint drills like anti-submarine warfare and air defense, reinforcing Indo-Pacific maritime cooperation."},{"t":"Defence","n":222,"tag":"","q":"Which of the following correctly compares the key features of JASSM and BrahMos missile systems?","o":["JASSM is hypersonic; BrahMos is subsonic","JASSM is known for stealth; BrahMos for high speed","BrahMos has a longer range than JASSM","JASSM is a naval missile; BrahMos is air-launched only"],"a":1,"e":"JASSM is known for stealth; BrahMos for high speed."},{"t":"Defence","n":223,"tag":"","q":"Consider the following statements regarding India’s ballistic missile tests in July 2025:\n1. India successfully tested Prithvi-II and Agni-I ballistic missiles on July 17, 2025, reaffirming its strategic preparedness.\n2. The tests of Prithvi-II and Agni-I were conducted at Pokhran Test Range, Rajasthan under the Strategic Forces Command. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The tests were conducted at Chandipur (Odisha) and Abdul Kalam Island, not at Pokhran Test Range, Rajasthan."},{"t":"Defence","n":224,"tag":"","q":"Where did the Indian Army successfully test the Akash Prime Air Defence System at an altitude of 15,000 feet?","o":["Sikkim","Dras","Ladakh","Tawang"],"a":2,"e":"Ladakh. On July 16, 2025, the Indian Army, in collaboration with DRDO, successfully tested the Akash Prime Air Defence System in Ladakh at over 15,000 feet altitude. The system intercepted and destroyed high-speed aerial targets, showcasing its precision in rarefied conditions."},{"t":"Defence","n":225,"tag":"","q":"Which fighter aircraft will be powered by the GE-F404 engine recently acquired by India?","o":["Rafale","Tejas Mk 1A","Mirage 2000","Jaguar"],"a":1,"e":"Tejas Mk 1A. The GE-F404-IN20 engine, recently acquired from the U.S., will power India’s indigenous Light Combat Aircraft Tejas Mk 1A. Under a $716 million deal, 99 such engines will support accelerated production and strengthen the Indian Air Force's fighter fleet, addressing its squadron shortfall."},{"t":"Defence","n":226,"tag":"","q":"Where was the India-Greece PASSEX naval exercise held on July 10, 2025?","o":["Bay of Bengal","Andaman Sea","Arabian Sea near Mumbai","Aegean Sea"],"a":2,"e":"Arabian Sea near Mumbai. On July 10, 2025, India and Greece held a PASSEX naval exercise in the Arabian Sea off Mumbai. Warships INS Tarkash and HS Psara carried out joint drills like tactical maneuvers and cross-deck operations, boosting naval interoperability and defense ties."},{"t":"Defence","n":227,"tag":"","q":"Consider the following statements about the ‘Prachand Shakti’ military exercise of the Indian Army in 2025:\n1. The ‘Prachand Shakti’ exercise was conducted in Meerut, Uttar Pradesh under the Ram Division of Kharga Corps.\n2. The exercise mainly focused on naval operations and submarine warfare with the participation of the Indian Navy. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The exercise emphasized high-tech land-based rapid-strike capabilities, not naval or submarine warfare."},{"t":"Defence","n":228,"tag":"","q":"In which defence exercise did India participate for the first time in Australia on July 13, 2025?","o":["Pitch Black","Indo-Pacific Shield","Talisman Sabre","Southern Star"],"a":2,"e":"Talisman Sabre. India joined Exercise Talisman Sabre for the first time on July 13, 2025, in Australia—marking a key step in Indo-Australian military ties. Hosted by Australia and the U.S., it involved 35,000+ troops from 19 nations in joint air, sea, and land operations."},{"t":"Defence","n":229,"tag":"","q":"Where was the Astra missile, tested by DRDO and IAF on July 11, 2025, successfully launched from a Su-30 MKI?","o":["Rajasthan Desert","Bay of Bengal, off Odisha coast","Andaman Sea","Rann of Kutch"],"a":1,"e":"Bay of Bengal, off Odisha coast. On July 11, 2025, the DRDO and Indian Air Force successfully test-fired the Astra BVRAAM from a Su-30 MKI over the Bay of Bengal near Odisha. Both missiles scored direct hits on aerial targets, demonstrating India’s growing indigenous capability in advanced air-to-air missile systems with homegrown RF seeker technology."},{"t":"Defence","n":230,"tag":"","q":"Which port hosted the Japan-India Coast Guard joint sea exercise in July 2025?","o":["Kochi Port","Chennai Port","Visakhapatnam Port","Mumbai Port"],"a":1,"e":"Chennai Port. In July 2025, the Japan-India Coast Guard joint sea exercise was held at Chennai Port. Japan’s Coast Guard ship Itsukushima participated in drills to boost coordination, maritime safety, and disaster response."},{"t":"Defence","n":231,"tag":"","q":"From which Indian naval ship was the Extended Range Anti-Submarine Rocket (ERASR) successfully tested?","o":["INS Vikrant","INS Kiltan","INS Kavaratti","INS Shivalik"],"a":2,"e":"INS Kavaratti. The Extended Range Anti-Submarine Rocket (ERASR) was successfully tested from INS Kavaratti, an advanced anti-submarine warfare corvette. The test marks a key step in strengthening India’s indigenous underwater warfare capabilities."},{"t":"Defence","n":232,"tag":"","q":"At which naval air station was Sub Lt Aastha Poonia honored for becoming the first woman fighter pilot trainee in the Indian Navy?","o":["INS Garuda","INS Rajali","INS Hansa","INS Dega"],"a":3,"e":"INS Dega. The first Sub-Lieutenant Aastha Poonia was honored at INS Dega in Visakhapatnam after becoming the first woman fighter pilot trainee in the Indian Navy. She earned her “Wings of Gold” upon completing training on Hawk advanced jet trainers. This marks a historic step in integrating women into combat aviation roles."},{"t":"Defence","n":233,"tag":"","q":"Where was INS Tamal (F71), the last foreign-built warship for the Indian Navy, commissioned on July 1, 2025?","o":["Saint Petersburg","Kaliningrad","Vladivostok","Sevastopol"],"a":1,"e":"Kaliningrad. INS Tamal (F71), India’s last foreign-built warship, was commissioned on July 1, 2025, at the Yantar Shipyard in Kaliningrad, Russia. This marks the completion of the Project 11356 series and reflects India’s shift toward indigenous warship production under the Aatmanirbhar Bharat initiative."},{"t":"Defence","n":234,"tag":"","q":"What is the name of the second stealth frigate commissioned under Project 17A by India on July 1, 2025?","o":["INS Satpura","INS Udaygiri","INS Shivalik","INS Vindhyagiri"],"a":1,"e":"INS Udaygiri. Built by Mazagon Dock Shipbuilders, it features advanced weapons, sensors, and stealth technology. The ship boosts India's indigenous naval capabilities and strengthens maritime security under the Aatmanirbhar Bharat initiative."},{"t":"Defence","n":235,"tag":"","q":"Who has been appointed as the new Commandant of the Military Institute of Technology (MILIT), Pune in 2025?","o":["Vice Admiral Sanjay Jasjit Singh","Rear Admiral V Ganapathy","Air Marshal Sandeep Singh","Lt General Raj Shukla"],"a":1,"e":"Rear Admiral V Ganapathy. In 2025, Rear Admiral V. Ganapathy was appointed as the Commandant of the Military Institute of Technology (MILIT), Pune, succeeding Air Vice Marshal Vivek Blouria."},{"t":"Defence","n":236,"tag":"","q":"How many indigenous weapon systems has DRDO offered for emergency procurement by the Indian Armed Forces in 2025?","o":["18","22","28","35"],"a":2,"e":"28. In 2025, DRDO offered 28 indigenous weapon systems for emergency procurement—14 for the Army, 8 for the Navy, and 6 for the Air Force—boosting self-reliance in defence."},{"t":"Defence","n":237,"tag":"","q":"Which bomber is known for its unmatched stealth capabilities and nuclear strike range in modern warfare?","o":["B-1 Lancer","B-52 Stratofortress","B-2 Spirit","TU-160 Blackjack"],"a":2,"e":"B-2 Spirit. The B-2 Spirit is a stealth bomber with intercontinental nuclear strike capability. Its flying wing design and radar-absorbing material make it nearly invisible to enemy radars."},{"t":"Defence","n":238,"tag":"","q":"Which of the following countries operates the H-6K strategic bomber?","o":["Russia","China","United States","France"],"a":1,"e":"China. The H-6K is a Chinese long-range strategic bomber, operated by the People’s Liberation Army Air Force (PLAAF), and based on the Soviet Tu-16 design."},{"t":"Defence","n":239,"tag":"","q":"What was the name of the U.S. military operation targeting Iran’s nuclear facilities with B-2 bombers and Tomahawk missiles?","o":["Operation Desert Storm","Operation Enduring Freedom","Operation Midnight Hammer","Operation Neptune Spear"],"a":2,"e":"Operation Midnight Hammer. Operation Midnight Hammer was launched by the U.S. on June 22, 2025, targeting Iran’s nuclear sites using B-2 bombers and Tomahawk missiles. It marked the first combat use of the GBU-57 bunker-buster bomb and showcased America’s long-range precision strike capabilities."},{"t":"Defence","n":240,"tag":"","q":"Which indigenous artillery system with a range of up to 300 km is India planning to induct?","o":["Agni Prime","BrahMos","Pinaka","Prahar"],"a":2,"e":"Pinaka. India plans to induct upgraded Pinaka rocket systems (Pinaka-3 & 4) with range up to 300 km, developed by DRDO to boost long-range, precision artillery capabilities."},{"t":"Defence","n":241,"tag":"","q":"Which missile has been identified as Iran’s hypersonic weapon posing a significant threat to Israel in 2025?","o":["Zolfaghar","Fateh-110","Fattah-1","Shahab-3"],"a":2,"e":"Fattah-1 is Iran’s hypersonic missile, capable of Mach 13–15 speeds and 1,400 km range, with terminal phase maneuverability—making it hard to intercept and a major strategic threat toIsrael in 2025."},{"t":"Defence","n":242,"tag":"","q":"Where is the India-France joint military exercise ‘Shakti 2025’ being conducted?","o":["Camp Larzac, France","Fort William, India","Lyon, France","Jaisalmer, India"],"a":0,"e":"Camp Larzac, France. Exercise Shakti 2025 was held at Camp Larzac, France, from June 18 to July 1, 2025, involving Indian and French troops, including the Jammu & Kashmir Rifles and the French Foreign Legion."},{"t":"Defence","n":243,"tag":"","q":"Where was INS Arnala, the Indian Navy's first Anti-Submarine Warfare Shallow Water Craft, commissioned?","o":["Kochi Naval Base","Mumbai Dockyard","Chennai Port","Visakhapatnam Naval Dockyard"],"a":3,"e":"Visakhapatnam Naval Dockyard. INS Arnala, India’s first Anti-Submarine Warfare Shallow Water Craft (ASW-SWC), was commissioned on June 18, 2025, at Visakhapatnam Naval Dockyard. It is indigenously built with over 80% local content, enhancing India’s littoral ASW capability."},{"t":"Defence","n":244,"tag":"","q":"What is the name of the cybersecurity exercise launched by the Indian Defence Cyber Agency in June 2025?","o":["Cyber Rakshak","Digital Sena","Cyber Suraksha","Surakshit Bharat"],"a":2,"e":"Cyber Suraksha. It was launched by the Indian Defence Cyber Agency in June 2025. Cyber Suraksha was a national-level cyber exercise aimed at boosting cyber preparedness across defence and strategic sectors. It featured realistic threat simulations and involved over 100 participants."},{"t":"Defence","n":245,"tag":"","q":"Which Indian Navy air station supported the daring mid-sea salvage operation on the burning MV Wan Hai 503?","o":["INS Hansa","INS Rajali","INS Garuda","INS Dega"],"a":2,"e":"INS Garuda. On June 13, 2025, INS Garuda, based in Kochi, launched a Sea King helicopter to carry out a high-risk mid-sea operation. The Navy team successfully winched down onto the burning vessel MV Wan Hai 503, showcasing exceptional courage in tough weather conditions."},{"t":"Defence","n":246,"tag":"","q":"What is the name of the VTOL-capable drone recently tested by the Indian Army for precision strikes?","o":["Vayushakti","Rudrastra","Trinetra","Astra-VTOL"],"a":1,"e":"Rudrastra. In June 2025, the Indian Army tested Rudrastra, a VTOL (Vertical Take-Off and Landing) drone developed by Solar Aerospace. It combines vertical lift with fixed-wing cruising and demonstrated airburst precision strikes at Pokhran, with a range of 170 km and real-time targeting capabilities."},{"t":"Defence","n":247,"tag":"","q":"What is the name of the first-ever joint special operations exercise conducted by the Indian and US Air Forces in 2025?","o":["Vajra Strike","Desert Claw","Tiger Claw","Air Dagger"],"a":2,"e":"Tiger Claw. It was the first joint special operations drill between the Indian and U.S. Air Forces, held from May 26 to June 10, 2025, at Chandinagar, Uttar Pradesh. It involved Garud Commandos and U.S. Special Forces, focusing on interoperability and joint air operations."},{"t":"Defence","n":248,"tag":"","q":"Consider the following statements about the NCC Cadet Expedition Team felicitated in 2025:\n1. On May 18, 2025, a team of five girl and five boy cadets from the National Cadet Corps (NCC) successfully summited Mount Everest.\n2. They were felicitated in June 2025 by the Defence Minister at Vigyan Bhawan, New Delhi for their achievement. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – They were felicitated in June 2025 by Defence Minister Rajnath Singh at South Block, New Delhi, not Vigyan Bhawan."},{"t":"Defence","n":249,"tag":"","q":"Where was the 137th Offshore Security Coordination Committee (OSCC) meeting held on June 12, 2025?","o":["Mumbai","Kochi","New Delhi","Visakhapatnam"],"a":2,"e":"New Delhi. The 137th OSCC meeting was held on June 12, 2025, in New Delhi, chaired by the Indian Coast Guard. It involved key stakeholders like the Navy, Air Force, Intelligence Bureau, ONGC, and Ministries of Petroleum, Home Affairs, and Shipping."},{"t":"Defence","n":250,"tag":"","q":"Which country is hosting the multinational peacekeeping Exercise Khaan Quest 2025 in which the Indian Army is participating?","o":["Kazakhstan","Mongolia","Uzbekistan","Kyrgyzstan"],"a":1,"e":"Mongolia. Khaan Quest 2025 is a multinational peacekeeping exercise hosted by Mongolia, starting on June 14, 2025, at the Five Hills Training Area near Ulaanbaatar. The Indian Army, represented by the Kumaon Regiment."},{"t":"Defence","n":251,"tag":"","q":"Which Indian maritime force led the firefighting and salvage mission for MV Wan Hai 503 off the Kerala coast?","o":["Indian Navy","Indian Coast Guard","Marine Police","DRDO"],"a":1,"e":"Indian Coast Guard. The Indian Coast Guard (ICG) led the firefighting and salvage operation for the container vessel MV Wan Hai 503, which caught fire off the Kerala coast in June 2025. The ICG deployed ships like Samudra Prahari, Sachet, and Samarth, and coordinated with the Indian Navy and Air Force."},{"t":"Defence","n":252,"tag":"","q":"Who has been appointed as the Deputy Chief of Army Staff (Strategy) in 2025?","o":["Lt Gen Upendra Dwivedi","Lt Gen Rakesh Kapoor","Lt Gen Rajiv Ghai","Lt Gen S Harimohan Iyer"],"a":2,"e":"Lt Gen Rajiv Ghai was appointed as the Deputy Chief of Army Staff (Strategy) in June 2025, succeeding Lt Gen Pratik Sharma, who held the post from November 1, 2024, to June 9, 2025."},{"t":"Defence","n":253,"tag":"","q":"What is the name of the FM radio station inaugurated by Army Chief Gen Upendra Dwivedi in Jyotirmath, Uttarakhand?","o":["Veer Bhagirathi 88.4 FM","Shatrujeet 89.6 FM","Ibex Tarana 88.4 FM","Nanda Devi Radio 90.2 FM"],"a":2,"e":"Ibex Tarana 88.4 FM. This station is the first of its kind in the Garhwal region in Jyotirmath, Uttarakhand. It was established to empower local communities by broadcasting programs."},{"t":"Defence","n":254,"tag":"","q":"Where did the Indian Coast Guard inaugurate a strategic 76.7-metre-long jetty on June 7, 2025, to enhance coastal security?","o":["Kandla Port","Vizhinjam Harbour","Paradip Port","Kochi Port"],"a":1,"e":"Vizhinjam Harbour. This jetty enhances maritime surveillance and boosts the Coast Guard's operational capability along India’s southern coastline."},{"t":"Defence","n":255,"tag":"","q":"What is the name of the vessel used by India’s first tri-services all-women sailing team during their historic voyage to Seychelles?","o":["Samudra Shakti","Triveni","Nari Veer","Sahasika"],"a":1,"e":"Triveni. The 11-member crew (representing the Army, Navy, and Air Force) sailed nearly 1,800 nautical miles to Seychelles and back, completing the groundbreaking mission in around 55 days aboard Triveni."},{"t":"Defence","n":256,"tag":"","q":"Who has been appointed as the new Director General of Defence Estates in 2025?","o":["Rajeev Kumar Singh","Manoj Ahuja","Shailendra Nath Gupta","Pankaj Tripathi"],"a":2,"e":"Shailendra Nath Gupta , a 1990‑batch officer of the Indian Defence Estates Service (IDES), officially assumed the role of Director General of Defence Estates (DGDE) on May 31, 2025."},{"t":"Defence","n":257,"tag":"","q":"Which Indian special forces unit is often compared with the US Navy SEALs for its elite capabilities?","o":["Garud Commandos","Para SF","MARCOS","NSG"],"a":2,"e":"MARCOS. The MARCOS (Marine Commandos) of the Indian Navy are often compared to the US Navy SEALs due to their similar maritime special operations capabilities, including amphibious warfare, counter-terrorism, and underwater demolition."},{"t":"Defence","n":258,"tag":"","q":"Which of the following is an indigenously developed artillery system under India’s modernization program?","o":["Bofors FH-77","M777 Howitzer","Dhanush","CAESAR"],"a":2,"e":"Dhanush is a 155 mm x 45-calibre towed howitzer, designed and built in India by the Ordnance Factory Board (now Advanced Weapons and Equipment India Ltd). It features digital fire control, inertial navigation, auto-laying, and onboard ballistic computing."},{"t":"Defence","n":259,"tag":"","q":"Which Indian-developed system is used for counter-battery operations and competes with the U.S. AN/TPQ-53 radar?","o":["Rajendra Radar","Akash Radar","Swathi Radar","Rohini Radar"],"a":2,"e":"Swathi Radar is developed by DRDO. It is India’s indigenous counter-battery radar system. It detects and tracks enemy artillery, locating the origin of incoming shells."},{"t":"Defence","n":260,"tag":"","q":"Who has been appointed as the Senior Air Staff Officer of the Western Air Command in the Indian Air Force?","o":["Air Marshal Rajesh Vaidya","Air Marshal Sanjay Seth","Air Marshal Jasvir Singh Mann","Air Marshal Anil Sharma"],"a":2,"e":"Air Marshal Jasvir Singh Mann. He is an alumnus of the National Defence Academy, Defence Services Staff College, and the Royal College of Defence Studies in London."},{"t":"National Affairs","n":261,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following powers granted under the Criminal Procedure (Identification) Act, 2022 extends beyond the scope of its predecessor, the Identification of Prisoners Act, 1920 ?","o":["Permitting collection of biometric and biological data","Restricting identification procedures only to convicts","Limiting law enforcement access to stored data","Allowing only fingerprints for crime investigation"],"a":0,"e":"Permitting collection of biometric and biological data. The Identification of Prisoners Act, 1920 allowed only the collection of fingerprints, footprints, and photographs of certain convicted persons. The Criminal Procedure (Identification) Act, 2022 greatly expanded the scope by permitting the collection of biometric data (fingerprints, iris, retina scans), biological samples (blood, hair, saliva, DNA profiling), and other physical and behavioral measurements. It applies not only to convicts, but also to persons under preventive detention, arrested for offenses, or suspected in investigations. The data can be stored by the National Crime Records Bureau (NCRB) for 75 years."},{"t":"National Affairs","n":262,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which of the following is not a Maharatna company as of 2024?","o":["Hindustan Copper Limited","National Thermal Power Corporation Limited","Oil & Natural Gas Corporation Limited","Steel Authority of India Limited"],"a":0,"e":"Hindustan Copper Limited. It is classified as a Miniratna (Category-I) company. National Thermal Power Corporation (NTPC) Limited, Oil & Natural Gas Corporation (ONGC) Limited, and Steel Authority of India (SAIL) Limited are all on the official list of Maharatna companies."},{"t":"National Affairs","n":263,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"As per Chapter I (Preliminary) of the Bharatiya Sakshya Adhiniyam, 2023, which of the following is not applicable under the Act ?","o":["Hearings before a District Magistrate","Affidavits submitted before court officer","Trials before Military Court (Court-Martial)","Proceedings before Civil Judge Court"],"a":1,"e":"According to Chapter I (Preliminary), Section 1(2) of the Bharatiya Sakshya Adhiniyam, 2023, the Act: applies to all judicial proceedings in or before any court, including Courts‑martial; does not apply to affidavits presented before any court or officer, nor to proceedings before an arbitrator"},{"t":"National Affairs","n":264,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"How did the Medical Termination of Pregnancy (Amendment) Act, 2021 extend the legal abortion framework in India ?","o":["Increased gestational limit for termination to 24 weeks for special cases","Restricted abortion access only to married women","Allowed termination solely on the discretion of healthcare providers","Made abortion legal for all pregnancies up to 30 weeks"],"a":0,"e":"Medical Termination of Pregnancy (Amendment) Act, 2021: Amended the original MTP Act of 1971. Key provisions: Increased the upper gestational limit from 20 weeks to 24 weeks for certain categories of women (rape survivors, victims of incest, differently-abled women, minors, etc.). Termination up to 20 weeks requires the opinion of 1 registered medical practitioner. Termination between 20–24 weeks requires the opinion of 2 registered medical practitioners. Extended benefits to unmarried women as well (not just married).Introduced confidentiality provisions."},{"t":"National Affairs","n":265,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following is true about the Voluntary Vehicle Fleet Modernisation Programme?\n1. It promotes scrapping of old vehicles to reduce emissions.\n2. The 'Ministry of Road Transport and Highways' is the nodal agency.\n3. The scheme incentivizes buyers of fuel-efficient new vehicles only in urban areas.","o":["Only 1 and 3 are correct","All 1, 2 and 3 are correct","Only 1 and 2 are correct","Only 2 and 3 are correct"],"a":2,"e":"Only 1 and 2 are correct. The Voluntary Vehicle Fleet Modernisation Programme (V-VMP) encourages the scrapping of old, polluting vehicles to reduce emissions. The Ministry of Road Transport and Highways acts as the nodal agency. However, the scheme provides incentives across urban and rural areas and is not limited only to buyers of fuel-efficient vehicles in cities."},{"t":"National Affairs","n":266,"tag":"","q":"Consider the following statements regarding the 2025 report on tiger density:\n1. Kaziranga Tiger Reserve was ranked third globally in terms of tiger density as per the 2025 Global Tiger Day report.\n2. The report stated that Bandhavgarh Tiger Reserve ranked third globally in tiger density. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – It was not Bandhavgarh, but Kaziranga that achieved the 3rd global rank."},{"t":"National Affairs","n":267,"tag":"","q":"Where will India’s first Hindi-medium MBBS college be established ?","o":["Lucknow, Uttar Pradesh","Jaipur, Rajasthan","Patna, Bihar","Jabalpur, Madhya Pradesh"],"a":3,"e":"Jabalpur, Madhya Pradesh. India’s first Hindi-medium MBBS college will start in Jabalpur, Madhya Pradesh, from the 2027–28 academic session. It will offer 50 MBBS seats initially."},{"t":"National Affairs","n":268,"tag":"","q":"Which is the largest Hing (asafoetida) producing state in India?","o":["Rajasthan","Uttar Pradesh","Himachal Pradesh","Madhya Pradesh"],"a":2,"e":"Himachal Pradesh, particularly the Lahaul Valley, has emerged as the largest and only major producer of hing in India. The cold and dry climate of the region mimics the conditions of countries like Iran and Afghanistan, where hing traditionally grows."},{"t":"National Affairs","n":269,"tag":"","q":"What is the primary objective of the India-UK Vision 2035?","o":["To establish a common currency","To enhance defence exports only","To advance bilateral ties through comprehensive cooperation","To form a political union between India and the UK"],"a":2,"e":"The India-UK Vision 2035 outlines a holistic roadmap to deepen strategic, economic, technological, and cultural relations."},{"t":"National Affairs","n":270,"tag":"","q":"What is a key feature of the India-UK Free Trade Agreement (FTA) signed in July 2025?","o":["Complete elimination of all import duties on both sides","Focus solely on digital services and IT exports","Promotion of balanced trade with mutual tariff benefits","Ban on automobile imports from the UK"],"a":2,"e":"The India-UK FTA signed in July 2025 enables cheaper imports (e.g., Scotch whisky, cars, chocolates, pharma devices) and supports Indian exports, reflecting a balanced and mutually beneficial trade framework."},{"t":"National Affairs","n":271,"tag":"","q":"What major public health milestone did India achieve under the National Sickle Cell Anemia Elimination Mission as of 2025?","o":["Distribution of 6 crore iron supplements","Screening of 6 crore individuals for sickle cell anemia","Treatment of 6 crore anemia patients","Vaccination of 6 crore children in tribal regions"],"a":1,"e":"India completed 6 crore screenings under the National Sickle Cell Anemia Elimination Mission, launched to combat a genetic blood disorder primarily affecting tribal populations. The mission aims to eliminate the disease by 2047 through early detection, awareness, and comprehensive care."},{"t":"National Affairs","n":272,"tag":"","q":"What is the primary objective of India’s World’s Largest Grain Storage Plan in the Cooperative Sector, launched in 2025?","o":["To promote organic farming in rural areas","To distribute free grain to all rural households","To enhance storage capacity through PACS and reduce post-harvest losses","To privatize grain storage infrastructure across the country"],"a":2,"e":"The initiative aims to improve grassroots storage through Primary Agricultural Credit Societies (PACS), reduce grain wastage, post-harvest losses, and enhance market accessibility for farmers."},{"t":"National Affairs","n":273,"tag":"","q":"What was India’s final rank at the International Mathematical Olympiad (IMO) 2025?","o":["5th","6th","7th","8th"],"a":2,"e":"7th . India secured 7th place at the IMO 2025, achieving a record-breaking score with a medal tally of 3 golds, 2 silvers, and 1 bronze, showcasing the strength of its Olympiad training system."},{"t":"National Affairs","n":274,"tag":"","q":"What is the primary objective of the newly inaugurated Mahila Aarogyam Kaksh at Shastri Bhawan, New Delhi ?","o":["Providing legal aid to women employees","Offering skill training programs for women","Promoting women’s health and wellness at the workplace","Facilitating recruitment drives for women in civil services"],"a":2,"e":"The Mahila Aarogyam Kaksh, inaugurated by the Department of Legal Affairs under the Ministry of Law and Justice, is a first-of-its-kind fitness and wellness space exclusively for women employees, aimed at supporting their physical and mental health."},{"t":"National Affairs","n":275,"tag":"","q":"Which Indian state has launched the country’s first Tribal Genome Sequencing Project ?","o":["Madhya Pradesh","Jharkhand","Odisha","Gujarat"],"a":3,"e":"Gujarat. The project aims to improve healthcare in tribal communities through genetic research, enabling early detection of hereditary diseases and personalised medical solutions."},{"t":"National Affairs","n":276,"tag":"","q":"Which of the following institutions was chosen for the pilot launch of the Health Ministry’s campaign on nutritional awareness of Indian snacks in 2025?","o":["AIIMS Delhi","AIIMS Nagpur","ICMR Hyderabad","NIN Pune"],"a":1,"e":"AIIMS Nagpur. The Health Ministry of India launched a new campaign to raise awareness about hidden sugars, fats, and oils in Indian snacks."},{"t":"National Affairs","n":277,"tag":"","q":"Which Indian state emerged as the top producer of processed potatoes in 2024–25, particularly for French fries and wafers?","o":["Punjab","Uttar Pradesh","Madhya Pradesh","Gujarat"],"a":3,"e":"Gujarat. Gujarat became India’s leading producer of processed potatoes in 2024–25, driven by modern farming, government support, and rising global demand."},{"t":"National Affairs","n":278,"tag":"","q":"Which village has been launched as India’s first Digital Nomad Village in July 2025?","o":["Ziro, Arunachal Pradesh","Yakten, Sikkim","Chitkul, Himachal Pradesh","Tawang, Arunachal Pradesh"],"a":1,"e":"Yakten, Sikkim. Digital Nomad Village aimed at supporting remote workers with modern facilities while boosting local incomes through homestays."},{"t":"National Affairs","n":279,"tag":"","q":"In July 2025, who among the following was not one of the four individuals nominated by President Droupadi Murmu to the Rajya Sabha under Article 80?","o":["Ujjwal Nikam","Dr. Meenakshi Jain","C. Sadanandan Master","Arvind Panagariya"],"a":3,"e":"Arvind Panagariya. President Droupadi Murmu nominated four individuals to the Rajya Sabha in July 2025 under Article 80 of the Constitution — Ujjwal Nikam, C. Sadanandan Master, Harsh Vardhan Shringla, and Dr. Meenakshi Jain."},{"t":"National Affairs","n":280,"tag":"","q":"What is the name of the Indian Army operation launched in 2025 to ensure the safe conduct of the Shri Amarnath Yatra?","o":["Operation TRINETRA","Operation AMARNATH","Operation SHIVA","Operation SURAKSHA"],"a":2,"e":"Operation SHIVA. It involves extensive troop deployment, surveillance tech, and disaster response due to heightened cross-border threats."},{"t":"National Affairs","n":281,"tag":"","q":"Where was the Uttar Pradesh Agritech Innovation Hub and Agritech Startup and Technology Showcase inaugurated in 2025?","o":["Banaras Hindu University","Sardar Vallabhbhai Patel University of Agriculture and Technology","Lucknow University","Indian Institute of Technology Kanpur"],"a":1,"e":"The Uttar Pradesh Agritech Innovation Hub, inaugurated on July 9, 2025, at SVPUAT, Meerut, aims to foster collaboration between farmers, startups, technologists, and academic institutions to create sustainable, region-specific agricultural innovations."},{"t":"National Affairs","n":282,"tag":"","q":"During his 2025 visit to Brazil, what key initiative did PM Modi announce to strengthen Indo-Brazil economic ties?","o":["Launch of BRICS digital currency","Setting a $20 billion trade target by 2030","Signing a full free trade agreement with ASEAN","Establishment of a joint space mission with Brazil"],"a":1,"e":"Setting a $20 billion trade target by 2030. PM Modi, during his 2025 Brazil visit, announced a $20 billion trade target with Brazil by 2030, focusing on expanding Mercosur trade, UPI introduction, and deeper cooperation in agriculture, pharma, and critical minerals."},{"t":"National Affairs","n":283,"tag":"","q":"Which Indian state announced plans in July 2025 to develop Asia’s largest jungle safari in the Aravalli Hills?","o":["Rajasthan","Uttarakhand","Haryana","Madhya Pradesh"],"a":2,"e":"Haryana. On July 6, 2025, the Haryana government announced it will develop Asia’s largest jungle safari across 10,000 acres in the Aravalli Hills."},{"t":"National Affairs","n":284,"tag":"","q":"According to the World Bank’s 2025 report, what is India’s rank in terms of income equality based on the Gini Index?","o":["2nd","4th","6th","8th"],"a":1,"e":"4th. The Gini Index measures income distribution, where 0 indicates perfect equality and 100 complete inequality. In the World Bank’s July 2025 report, India scored 25.5."},{"t":"National Affairs","n":285,"tag":"","q":"Which Indian city became the first to launch QR-coded digital address plates embedded with GPS locations for better civic services?","o":["Bhopal","Ahmedabad","Indore","Pune"],"a":2,"e":"Indore. This aims to improve urban governance and civic service delivery."},{"t":"National Affairs","n":286,"tag":"","q":"What is the new name of the National Institute of Public Cooperation and Child Development (NIPCCD) ?","o":["Sarojini Naidu Institute of Women and Child Welfare","Rani Lakshmibai Institute of Women Empowerment","Savitribai Phule National Institute of Women and Child Development","Kasturba Gandhi National Institute for Child Care"],"a":2,"e":"The Union Government renamed NIPCCD to honour Savitribai Phule, a pioneer in women's education and empowerment. The announcement was made by Women and Child Development Minister Annpurna Devi in 2025."},{"t":"National Affairs","n":287,"tag":"","q":"What is the main purpose of the ‘RailOne’ mobile app ?","o":["To promote private investment in railways","To provide a unified digital platform for passenger services","To monitor railway employee performance","To track freight movement across zones"],"a":1,"e":"The ‘RailOne’ app, launched on July 2, 2025, is an all-in-one digital platform developed to modernize railway services."},{"t":"National Affairs","n":288,"tag":"","q":"Where is the CIP-South Asia Regional Center (CSARC) being established to promote potato research in collaboration with the International Potato Center?","o":["Shimla","Agra","Patna","Bhopal"],"a":1,"e":"Agra. The CSARC is being set up in Agra as a regional wing of the International Potato Center (CIP), Peru."},{"t":"National Affairs","n":289,"tag":"","q":"Where has India built its first dedicated animal overpass corridor to protect wildlife along a major expressway?","o":["Jim Corbett National Park","Kaziranga National Park","Gir Forest National Park","Ranthambore Tiger Reserve"],"a":3,"e":"Ranthambore Tiger Reserve. The initiative includes multiple wildlife crossings to ensure safe animal movement."},{"t":"National Affairs","n":290,"tag":"","q":"Which Indian state recently became the third to achieve full functional literacy as per the national benchmark?","o":["Sikkim","Tripura","Kerala","Nagaland"],"a":1,"e":"Tripura. Tripura became the third state in India after Mizoram and Goa to achieve full functional literacy (95%+) among people aged 15 and above."},{"t":"National Affairs","n":291,"tag":"","q":"Which premier Indian institute launched a special PhD admission drive in 2025 to improve SC/ST representation?","o":["IISc Bengaluru","IIT Bombay","IIT-Delhi","JNU Delhi"],"a":2,"e":"IIT-Delhi. In a major move to enhance inclusivity in higher education, IIT Delhi has launched its first-ever special PhD admission drive exclusively for Scheduled Caste (SC) and Scheduled Tribe (ST) candidates."},{"t":"National Affairs","n":292,"tag":"","q":"Consider the following statements regarding UPSC’s new platform launched in 2025:\n1. Pratibha Setu was launched to connect non-recommended yet deserving candidates with potential employers.\n2. Civil Talent Portal was launched in 2025 by UPSC to help candidates who missed the final selection. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The platform is Pratibha Setu, not Civil Talent Portal."},{"t":"National Affairs","n":293,"tag":"","q":"From which location will India export its first locally-built locomotive to the Republic of Guinea in June 2025?","o":["Chittaranjan Locomotive Works, West Bengal","Kapurthala Rail Coach Factory, Punjab","Varanasi Locomotive Factory, Uttar Pradesh","Marhowrah Rail Factory, Bihar"],"a":3,"e":"Marhowrah Rail Factory, Bihar. India’s first locally-built locomotive export to Guinea will be flagged off from Marhowrah Rail Factory."},{"t":"National Affairs","n":294,"tag":"","q":"Who became the first Indian-born academic to be appointed as the Provost of MIT in 2025?","o":["Subra Suresh","Anantha Chandrakasan","Arvind Krishna","Raghunath Mashelkar"],"a":1,"e":"Anantha Chandrakasan. was appointed as the Provost of MIT, effective July 1, 2025, becoming the first Indian-born academic to hold this role."},{"t":"National Affairs","n":295,"tag":"","q":"What is the name of the operation launched by India in 2025 to evacuate its citizens from Iran amid rising tensions?","o":["Operation Shakti","Operation Sindhu","Operation Suraksha","Operation Vande Bharat"],"a":1,"e":"Operation Sindhu. The mission aimed to evacuate Indian citizens safely from Iran."},{"t":"National Affairs","n":296,"tag":"","q":"Which country's highest civilian honour, the Grand Cross of the Order of Makarios III, was conferred on PM Narendra Modi in June 2025?","o":["Greece","Cyprus","Italy","Portugal"],"a":1,"e":"Cyprus. The award recognizes exceptional contributions to global peace and diplomacy."},{"t":"National Affairs","n":297,"tag":"","q":"Where is India’s first underwater museum and artificial coral reef being developed using the decommissioned warship INS Guldar?","o":["Lakshadweep","Vengurla, Sindhudurg","Kochi, Kerala","Havelock Island"],"a":1,"e":"Vengurla, Sindhudurg. India’s first underwater museum and artificial coral reef is coming up near Nivati Rocks off Vengurla in Sindhudurg district, Maharashtra, using the decommissioned warship INS Guldar."},{"t":"National Affairs","n":298,"tag":"","q":"Which Indian metro has recently been declared the ‘Leopard Capital’ of India due to the highest number of wild leopards living around its outskirts?","o":["Mumbai","Chennai","Hyderabad","Bengaluru"],"a":3,"e":"Bengaluru. A year-long survey by the Holematthi Nature Foundation (HNF), led by conservationist Dr. Sanjay Gubbi, found that Bengaluru has an estimated 80–85 wild leopards in its surrounding forests and scrublands. This surpasses Mumbai, making Bengaluru the new ‘Leopard Capital’ of India, a rare distinction for a major metropolis."},{"t":"National Affairs","n":299,"tag":"","q":"Which campaign’s second phase was launched by PM Modi on World Environment Day 2025 by planting a sapling in New Delhi?","o":["Green India Mission","Ek Ped Maa Ke Naam","Vriksha Bandhan Abhiyan","Harit Bharat Yatra"],"a":1,"e":"PM Modi launched the second phase of the ‘Ek Ped Maa Ke Naam’ campaign on World Environment Day 2025. He planted a sapling at Mahavir Jayanti Park in New Delhi."},{"t":"National Affairs","n":300,"tag":"","q":"Which two wetlands from Rajasthan were added to the Ramsar List in 2025, raising India’s total to 91 Ramsar sites?","o":["Sambhar and Keoladeo","Tal Chhapar and Jaisamand","Khichan and Menar","Bikaner and Udaipur"],"a":2,"e":"Khichan and Menar. India added Khichan and Menar wetlands from Rajasthan to the Ramsar List in 2025.. This brought the country’s total to 91 Ramsar sites, just ahead of World Environment Day."},{"t":"National Affairs","n":301,"tag":"","q":"Consider the following statements regarding the revamped digital platform for coal sector employees:\n1. C CARES 2.0 was launched in 2025 to enhance social security services for coal sector workers.\n2. CoalSetu was launched in 2025 as the digital platform for real-time coal sector employee services. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The correct platform name is C CARES 2.0, not CoalSetu."},{"t":"National Affairs","n":302,"tag":"","q":"Which Indian state is set to launch the country’s first Mining Tourism Project to highlight its mineral heritage?","o":["Odisha","Chhattisgarh","Jharkhand","Madhya Pradesh"],"a":2,"e":"Jharkhand will be the first Indian state to launch a Mining Tourism Project. The initiative is led by the state government and Central Coalfields Limited (CCL). It aims to promote tourism and public awareness of mining practices and local heritage."},{"t":"National Affairs","n":303,"tag":"","q":"Which Indian state is setting up a dedicated Hornbill Conservation Centre at the Anamalai Tiger Reserve?","o":["Kerala","Karnataka","Tamil Nadu","Maharashtra"],"a":2,"e":"Tamil Nadu. The initiative focuses on scientific research, community participation, and ecological restoration to protect threatened hornbill species."},{"t":"National Affairs","n":304,"tag":"","q":"Where was the first campus of the Indian Institute of Creative Technology (IICT) inaugurated to boost India’s AVGC-XR sector?","o":["Bengaluru","Hyderabad","Mumbai","Pune"],"a":2,"e":"Mumbai. The first campus of the Indian Institute of Creative Technology (IICT) was inaugurated in Mumbai to strengthen India’s AVGC-XR (Animation, Visual Effects, Gaming, Comic & Extended Reality) sector."},{"t":"National Affairs","n":305,"tag":"","q":"Where was India’s first Aqua Tech Park inaugurated to promote modern fish farming techniques like biofloc and aquaponics?","o":["Siliguri","Sonapur","Bhubaneswar","Ranchi"],"a":1,"e":"Sonapur. India’s first Aqua Tech Park was inaugurated by Assam Chief Minister Himanta Biswa Sarma in Sonapur, near Guwahati. The park aims to educate fish farmers on modern techniques such as biofloc and aquaponics, helping improve fish production and farmer incomes."},{"t":"National Affairs","n":306,"tag":"","q":"India’s first RoRo (Roll-on/Roll-off) ferry service was launched in July 2025 on which river?","o":["Zuari River","Ganga River","Mandovi River","Brahmaputra River"],"a":2,"e":"Mandovi River. On July 14, 2025, Goa launched India’s first RoRo ferry service on the Mandovi River. The ferries, Gangotri and Dwarka, will ease travel between Chorao Island and Ribandar, benefiting daily commuters, enhancing tourism, and strengthening water transport in the state."},{"t":"National Affairs","n":307,"tag":"","q":"The Behdeinkhlam Festival, recently celebrated in Meghalaya, is associated with which tribal community?","o":["Garos","Khasis","Pnars","Nagas"],"a":2,"e":"Pnars. The Behdeinkhlam Festival is an annual celebration of the Pnars, a tribal community in Jowai, Meghalaya. Held in July, the festival involves prayers for a good harvest, and rituals to ward off diseases and evil, while reinforcing the community’s traditional faith and identity."},{"t":"National Affairs","n":308,"tag":"","q":"Which Indian state became the first to join the Cruise Bharat Mission to promote cruise tourism?","o":["Maharashtra","Kerala","Gujarat","Goa"],"a":2,"e":"Gujarat became the first Indian state to join the Cruise Bharat Mission, a national initiative aimed at enhancing cruise tourism across India. Announced in Ahmedabad, this move leverages Gujarat’s extensive coastline to develop new cruise circuits and aligns with India’s vision to become a leading global cruise destination by 2029."},{"t":"National Affairs","n":309,"tag":"","q":"Consider the following statements regarding Gingee Fort:\n1. Gingee Fort, recently declared a UNESCO World Heritage Site, is located in Tamil Nadu.\n2. Gingee Fort, recently declared a UNESCO World Heritage Site, is located in Karnataka. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The fort is not located in Karnataka."},{"t":"International Affairs","n":310,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Which of the following is the main reason that Prime Minister Narendra Modi meet Mr. Michal Spiczko, President of the Kabaddi Federation of Poland ?","o":["To congratulate him on Poland's football achievements","To appreciate his efforts in promoting Kabaddi in Europe","To sign a trade agreement between India and Poland","To discuss military cooperation through sports"],"a":1,"e":"To appreciate his efforts in promoting Kabaddi in Europe. Poland has been actively promoting Kabaddi, with its national team participating in international tournaments. During his visit to Warsaw, Prime Minister Narendra Modi met with Mr. Michal Spiczko, President of the Kabaddi Federation of Poland, and Ms. Anna Kalbarczy, a board member of the federation. The primary focus of their discussion was to explore strategies for further popularizing Kabaddi in Poland and the rest of Europe. ]"},{"t":"International Affairs","n":311,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which country withdrew from the NPT in 2003 and later developed nuclear weapons?","o":["Israel","North Korea","Syria","Iran"],"a":1,"e":"North Korea. The Nuclear Non-Proliferation Treaty (NPT), signed in 1968, aims to prevent the spread of nuclear weapons. North Korea had joined the treaty in 1985 but announced its withdrawal in 2003, citing U.S. hostility and security concerns. Subsequently, it carried out multiple nuclear tests (first in 2006) and openly declared itself a nuclear-armed state. In contrast, Israel never signed the NPT, Iran remains a member though controversial for its nuclear program, and Syria is also an NPT signatory."},{"t":"International Affairs","n":312,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which pair is correctly matched with India's geopolitical interest?","o":["Ashgabat Agreement - Partnership with BIMSTEC","Kaladan Project - Links to Iran","Ladakh Corridor - Access to Africa","SAGAR Policy - Maritime ties in the Indian Ocean"],"a":3,"e":"SAGAR Policy - Maritime ties in the Indian Ocean. The SAGAR Policy (“Securit
