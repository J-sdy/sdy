<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Current Affairs Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2733; --ink2:#52606d; --line:#e3dfd5;
  --accent:#27406b; --accent-soft:#eaeef5;
  --good:#1f6f46; --good-bg:#e7f3ec; --bad:#a3342a; --bad-bg:#f8e9e7;
  --mark:#f7dc7a; --note-bg:#f4f1e8;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:820px;margin:0 auto;padding:12px 16px 4px}
.title h1{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:0;letter-spacing:.2px}
.title span{font-size:.78rem;color:var(--ink2)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;max-width:820px;margin:0 auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:84px;padding:6px 14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink2);font:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tab .n{font-size:1.05rem;font-weight:700;color:var(--ink);line-height:1.2}
.tab .l{font-size:.74rem;font-weight:500;white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent);color:#e6ebf4}
.tab.active .n{color:#fff}
main{max-width:820px;margin:0 auto;padding:14px 16px 90px}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.summary h2{font-family:var(--serif);font-size:1.1rem;margin:0;font-weight:600}
.stats{font-size:.82rem;color:var(--ink2)}
.stats b{color:var(--ink)}
.bar{flex-basis:100%;height:6px;border-radius:6px;background:#ebe7dc;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.reset{font:inherit;font-size:.8rem;font-weight:600;color:var(--accent);background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.qno{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.4px}
.src{font-size:.7rem;color:var(--ink2);background:#f0ede4;border-radius:6px;padding:2px 8px;text-align:right}
.stem{font-family:var(--serif);font-size:1.08rem;line-height:1.65;margin:0 0 12px;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:.96rem;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:46px}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:700;display:grid;place-items:center;margin-top:1px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.exp{margin-top:12px;border-left:4px solid var(--accent);background:var(--note-bg);border-radius:0 10px 10px 0;padding:12px 14px;font-family:var(--serif);font-size:1rem;line-height:1.7;display:none}
.exp.show{display:block}
.verdict{font-family:var(--sans);font-size:.82rem;font-weight:700;margin-bottom:6px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.exp strong{font-weight:600}
mark{background:linear-gradient(transparent 38%,var(--mark) 38%);color:inherit;padding:0 2px;border-radius:2px}
#top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(29,39,51,.25);opacity:0;pointer-events:none;transform:translateY(10px);transition:.2s;z-index:30}
#top.show{opacity:1;pointer-events:auto;transform:none}
@media(min-width:700px){.stem{font-size:1.15rem}.q{padding:20px 22px 18px}}
</style>
</head>

<script>
const DATA = {"topics":["Schemes","Sports","Appointments","Awards","Agreements & MoUs","Defence","National Affairs","International Affairs","Science & Tech","Books & Authors","Portals & Apps","Obituary","Rankings & Indices","Important Days"],"qs":[{"t":"Schemes","n":1,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following ISRO initiatives, launched with the vision of \"Catch them young\", aims to introduce school students to space science and technology?","o":["Vidyarthi Vigyan Manthan","YUVIKA - Young Scientist Programme","SPARK Internship Programme","NISHTHA Space Module"],"a":1,"e":"YUVIKA - Young Scientist Programme. Launched by ISRO in 2019, YUVIKA (Young Scientist Programme) targets students of classes 9–12 to spark interest in space science and technology. The initiative provides hands-on experience, interactive sessions, and exposure to ISRO’s facilities, enabling young learners to understand satellite development, orbital mechanics, and space research. It embodies the “Catch them young” vision by nurturing future scientists and engineers from an early age, bridging school-level education with advanced space science concepts."},{"t":"Schemes","n":2,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following is a key focus area of the PM Gati Shakti National Master Plan?","o":["Multi-modal connectivity","Rural electrification","Agricultural subsidies","Urban development"],"a":0,"e":"Multi-modal connectivity. The PM Gati Shakti National Master Plan aims to improve multi-modal transport and logistics infrastructure across India. By integrating roads, railways, ports, and airports, it reduces bottlenecks, lowers logistics costs, and enhances economic efficiency. The plan prioritizes connectivity, coordination, and seamless movement of goods, supporting faster project implementation and boosting overall national productivity."},{"t":"Schemes","n":3,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Which of the following pairs is correctly matched regarding scheme and its implementing ministry?","o":["PM-JANMAN - Ministry of Rural Development","Samarth Scheme - Ministry of Textiles","Mission Shakti - Ministry of Home Affairs","PM MITRA - Ministry of Agriculture"],"a":1,"e":"Samarth Scheme – Ministry of Textiles. Samarth Scheme (Scheme for Capacity Building in Textile Sector): This scheme is implemented by the Ministry of Textiles to provide skill development across the textile value chain. PM-JANMAN (Pradhan Mantri Janjati Adivasi Nyaya Maha Abhiyan): This mission is implemented by the Ministry of Tribal Affairs in collaboration with nine other line ministries to improve the socio-economic conditions of Particularly Vulnerable Tribal Groups (PVTGs). Mission Shakti: This is an integrated women empowerment program implemented by the Ministry of Women and Child Development for the safety, security, and empowerment of women. PM MITRA (Mega Integrated Textile Region and Apparel Parks): This scheme is implemented by the Ministry of Textiles to create world-class industrial infrastructure that will attract investment, boost employment, and make India a global hub for textile manufacturing."},{"t":"Schemes","n":4,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"What is the aim of Ayushman Bharat scheme?","o":["Clean drinking water for all","Health insurance for the poor","Free education to children","Housing for the poor"],"a":1,"e":"Health insurance for the poor. The Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (PM-JAY) is a flagship scheme that provides health insurance cover of up to ₹5 lakh per family per year for secondary and tertiary hospitalization. It focuses on poor and vulnerable families, aiming to reduce out-of-pocket health expenditure and improve access to quality healthcare. Other Key Schemes: Clean Drinking Water: Jal Jeevan Mission. Free Education for Children: Right to Education Act (RTE), Sarva Shiksha Abhiyan. Housing for the Poor: Pradhan Mantri Awas Yojana (PMAY)"},{"t":"Schemes","n":5,"tag":"","q":"Consider the following statements regarding the Gyan Bharatam Mission:\n1. The mission was launched by Prime Minister Narendra Modi during the 124th episode of Mann Ki Baat on July 27, 2025.\n2. The mission’s main objective is to promote Sanskrit as a global language. Which of the above statements is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 – Incorrect: The mission’s main aim is not to promote Sanskrit, but to digitise and preserve India’s ancient manuscripts by creating a National Digital Repository."},{"t":"Schemes","n":6,"tag":"","q":"Which organization introduced the VCF Settlement Scheme 2025?","o":["RBI","SEBI","IRDAI","PFRDA"],"a":1,"e":"SEBI. The Securities and Exchange Board of India launched the VCF Settlement Scheme 2025 to help legacy venture capital funds wind up expired schemes."},{"t":"Schemes","n":7,"tag":"","q":"Consider the following statements regarding India’s first electric truck incentive scheme:\n1. India’s first electric truck incentive scheme was launched on 12th July 2025 by Union Minister H. D. Kumaraswamy.\n2. The scheme is being implemented by the Ministry of Heavy Industries under the Prime Minister’s E-Drive (PM E-DRIVE) initiative as part of India’s Green Freight Mobility Policy. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is incorrect – The scheme was launched on 11th July 2025, not on 12th July 2025."},{"t":"Schemes","n":8,"tag":"","q":"In which state was the Gajah Mitra scheme launched on July 11, 2025?","o":["West Bengal","Odisha","Assam","Bihar"],"a":2,"e":"Assam. The initiative targets 80 identified hotspot villages in Assam to implement its measures"},{"t":"Schemes","n":9,"tag":"","q":"In which state was the Digi‑Lakshmi scheme launched on June 30, 2025?","o":["Telangana","Karnataka","Andhra Pradesh","Tamil Nadu"],"a":2,"e":"Andhra Pradesh. The Digi-Lakshmi Scheme was launched by the Government of Andhra Pradesh with the aim of empowering urban poor women. Under this scheme, digital kiosks (digital service centers) are being established, through which women will be able to use digital services to become self-reliant and also promote digital literacy."},{"t":"Schemes","n":10,"tag":"","q":"Consider the following statements regarding the Poverty-Free Village Scheme named after Pandit Deendayal Upadhyay:\n1. The scheme was launched on 4th July 2025 in Rajasthan, and in its initial phase, 5,000 villages of the state have been included.\n2. The main objective of this scheme is to promote urban infrastructure development in metropolitan cities. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The scheme focuses on poverty eradication in rural areas through basic amenities, income generation, and social security, not urban infrastructure."},{"t":"Schemes","n":11,"tag":"","q":"Which organization relaunched the SPREE scheme and introduced the Amnesty Scheme 2025?","o":["EPFO","ESIC","NPS","SBI"],"a":1,"e":"ESIC (Employees' State Insurance Corporation). The Amnesty Scheme 2025 (Oct 1, 2025–Sep 30, 2026) offers a dispute-resolution window covering coverage disputes, damages, and interest."},{"t":"Schemes","n":12,"tag":"","q":"Which organization has floated the green ammonia tender to decarbonize India’s fertilizer sector?","o":["NTPC","Coal India","SECI","GAIL"],"a":2,"e":"SECI. The Solar Energy Corporation of India (SECI) issued the tender under the MNRE’s SIGHT scheme."},{"t":"Schemes","n":13,"tag":"","q":"In which state was the Vidya Shakti programme launched on June 25, 2025?","o":["Tamil Nadu","Andhra Pradesh","Karnataka","Telangana"],"a":1,"e":"Andhra Pradesh. This programme provides extra digital classes to help students struggling in core subjects. The programme targets Mathematics, Science, and English subjects after regular school hours"},{"t":"Schemes","n":14,"tag":"","q":"In which state was the NAVYA scheme launched as a pilot initiative?","o":["Bihar","Madhya Pradesh","Uttar Pradesh","Rajasthan"],"a":2,"e":"Uttar Pradesh. It is a collaborative effort by the Ministry of Women and Child Development and Ministry of Skill Development and Entrepreneurship. The scheme is designed for girls aged 16–18 who have passed at least Class 10."},{"t":"Schemes","n":15,"tag":"","q":"In which state was the ‘Udyog Kranti’ industrial reform initiative launched on June 10, 2025?","o":["Haryana","Rajasthan","Punjab","Uttar Pradesh"],"a":2,"e":"Punjab. The initiative comprises 12 transformative measures aimed at simplifying industrial approvals."},{"t":"Schemes","n":16,"tag":"","q":"Which organization has launched the scheme to promote original Hindi books on economics, banking, and finance?","o":["NITI Aayog","University Grants Commission","Reserve Bank of India","National Book Trust"],"a":2,"e":"Reserve Bank of India. The scheme is titled Scheme for Writing Books Originally in Hindi on Economics, Banking and Financial Subjects and was unveiled by the RBI."},{"t":"Schemes","n":17,"tag":"","q":"In which state was the Rajiv Gandhi Van Samvardhan Yojana launched on June 2, 2025?","o":["Uttarakhand","Himachal Pradesh","Madhya Pradesh","Chhattisgarh"],"a":1,"e":"Himachal Pradesh. The scheme was launched in Himachal Pradesh to boost green cover through community participation, especially by planting fruit-bearing trees. A key feature of the initiative is the involvement of local communities through the appointment of Van Mitras, who support forest staff in protecting forests and managing plantations effectively."},{"t":"Schemes","n":18,"tag":"","q":"What is the primary objective of the Modified Interest Subvention Scheme (MISS) for farmers?","o":["To provide crop insurance","To waive farm loans completely","To offer short-term loans to farmers at a subsidized interest rate","To increase agricultural exports"],"a":2,"e":"The scheme provides short-term loans up to ₹3 lakh at an interest rate of 7%, with a 3% subvention on prompt repayment, effectively reducing the interest to 4%. The scheme also covers short-term loans for allied activities such as animal husbandry, dairy, poultry, and fisheries."},{"t":"Schemes","n":19,"tag":"","q":"Consider the following statements regarding the 4% housing reservation for Persons with Disabilities (PwD):\n1. The Ministry of Housing and Urban Affairs has announced a 4% reservation in General Pool Residential Accommodation (GPRA) for Persons with Disabilities.\n2. This reservation is provided under the Right to Education Act, 2009. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The legal framework supporting this provision is the Rights of Persons with Disabilities Act, 2016, not the Right to Education Act, 2009."},{"t":"Schemes","n":20,"tag":"","q":"Which state has launched the Viksit Krishi Sankalp Abhiyan to help farmers?","o":["Assam","Tripura","Bihar","Punjab"],"a":1,"e":"Tripura. The campaign is implemented by the State Agriculture Department, Indian Council of Agricultural Research (ICAR), and Krishi Vigyan Kendras (KVKs). The campaign aims to raise awareness about state and centrally sponsored schemes across villages and gram panchayats to increase farm output and reduce costs."},{"t":"Schemes","n":21,"tag":"","q":"Which three schemes are collectively known as the Jan Suraksha Schemes?","o":["PMJDY, PMSBY, PMAY","PMJJBY, PMSBY, APY","PMJJBY, PMAY, APY","PMSBY, PMJDY, APY"],"a":1,"e":"PMJJBY, PMSBY, APY These three schemes-Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY), Pradhan Mantri Suraksha Bima Yojana (PMSBY), and Atal Pension Yojana (APY)—were launched on May 9, 2015, to provide affordable insurance and pension benefits to the poor, underprivileged, and unorganised sector workers."},{"t":"Schemes","n":22,"tag":"","q":"What does the acronym UP AGREES stand for?","o":["Uttar Pradesh Growth in Renewable Energy and Skill","Uttar Pradesh Accelerated Growth through Resilient, Equitable, and Sustainable Agriculture","Uttar Pradesh Green Revolution and Economic Empowerment Scheme","Uttar Pradesh Agricultural Reform and Economic Strategy"],"a":1,"e":"UP AGREES: Objective: To modernize and boost agricultural productivity and rural entrepreneurship.Focus Areas: Sustainable farming, agro-based industries, and infrastructure development in rural sectors. AI Pragya: Objective: To digitally empower youth with AI education and training. Focus Areas: Skill development in Artificial Intelligence, data science, and digital technologies."},{"t":"Schemes","n":23,"tag":"","q":"Under the expanded Credit Guarantee Scheme for Startups (CGSS), what is the new maximum guarantee cover per borrower?","o":["₹10 crore","₹15 crore","₹20 crore","₹25 crore"],"a":2,"e":"₹20 crore. The government has increased the ceiling on guarantee cover per borrower from ₹10 crore to ₹20 crore to enhance financial support for startups."},{"t":"Schemes","n":24,"tag":"","q":"Which state launched the Pandit Lakhmi Chand Kalakar Samajik Samman Yojana?","o":["Punjab","Uttar Pradesh","Haryana","Rajasthan"],"a":2,"e":"Haryana. Pandit Lakhmi Chand was a legendary Haryanvi poet and folk artist."},{"t":"Schemes","n":25,"tag":"","q":"Which cities will host the five National Centres of Excellence for Skilling?","o":["Mumbai, Delhi, Kolkata, Chennai, Bengaluru","Bhubaneswar, Chennai, Hyderabad, Kanpur, Ludhiana","Ahmedabad, Pune, Jaipur, Lucknow, Bhopal","Surat, Patna, Indore, Nagpur, Ranchi"],"a":1,"e":"The scheme aims to upgrade 1,000 government-run ITIs across India. The Asian Development Bank and the World Bank will co-finance 50% of the central share of the scheme."},{"t":"Schemes","n":26,"tag":"","q":"Which Indian state launched the Jyothi Scheme for educating migrant children?","o":["Tamil Nadu","Kerala","Karnataka","Andhra Pradesh"],"a":1,"e":"Kerala. The scheme aims to bring migrant children into Kerala’s formal education system. Implementation involves schoolteachers, Kudumbashree, and local self -governments."},{"t":"Schemes","n":27,"tag":"","q":"What is the primary objective of the Green Hydrogen Certification Scheme (GHCI) launched by the Ministry of New and Renewable Energy (MNRE) ?","o":["To subsidize hydrogen-powered vehicles","To certify hydrogen produced from renewable energy sources","To promote the use of hydrogen in agriculture","To import green hydrogen from other countries"],"a":1,"e":"Bureau of Energy Efficiency (BEE) is responsible for accrediting agencies for verification and certification of green hydrogen projects under the GHCI. The GHCI currently includes electrolysis and biomass conversion pathways, with provisions to add new methods upon BEE approval."},{"t":"Schemes","n":28,"tag":"","q":"What is the primary objective of the Sahajog initiative launched in Odisha?","o":["Promote digital education in rural schools","Support agricultural subsidies for farmers","Enhance access to government welfare schemes for the urban poor","Provide employment to tribal youth"],"a":2,"e":"Enhance access to government welfare schemes for the urban poor. Sahajog is designed to bridge the gap between urban poverty and government support by identifying eligible urban poor families and delivering essential services directly to them."},{"t":"Schemes","n":29,"tag":"","q":"What is the full form of PAI in the context of rural development?","o":["Panchayat Administrative Institution","Panchayat Advancement Index","Panchayat Agricultural Index","Public Administration Index"],"a":1,"e":"Panchayat Advancement Index. The Panchayat Advancement Index is a framework developed by the Ministry of Panchayati Raj. It assesses the performance of over 2.5 lakh Gram Panchayats. The index aligns with the Sustainable Development Goals and aims to improve local governance through data-driven insights."},{"t":"Schemes","n":30,"tag":"","q":"Which state government launched the Rahveer Scheme for road accident victims?","o":["Rajasthan","Uttar Pradesh","Madhya Pradesh","Gujarat"],"a":2,"e":"Madhya Pradesh. A reward of ₹25,000 is given for assisting accident victims within the critical golden hour. The scheme was approved in a cabinet meeting held at the historic Rajwada Fort in Indore."},{"t":"Schemes","n":31,"tag":"","q":"What is the primary objective of the 'Sagar Mein Samman' initiative launched by the Government of India?","o":["Promote tourism in coastal areas","Enhance women's participation in the maritime sector","Develop new ports across India","Increase fish exports"],"a":1,"e":"The 'Sagar Mein Samman' initiative aims to empower women in maritime through inclusivity, safety, equal opportunities, and skill development. The initiative was revealed by Union Minister Shri Sarbananda Sonowal during the International Day for Women in Maritime celebrations in Mumbai."},{"t":"Schemes","n":32,"tag":"","q":"What is the main objective of the Amrit Bharat Station Scheme?","o":["Increase railway fares","Privatize railway stations","Modernize and redevelop railway stations","Promote metro rail connectivity"],"a":2,"e":"The scheme focuses on upgrading station infrastructure, passenger amenities, and accessibility under Indian Railways. As of 2025, the scheme is being implemented at more than 1300 railway stations across India."},{"t":"Schemes","n":33,"tag":"","q":"What is the full form of the PM SHRI Scheme?","o":["Prime Minister’s Scheme for Rural India","Pradhan Mantri Schools for Rising India","Public Model Schools for Reform in India","Prime Minister’s Scheme for Higher Research Institutions"],"a":1,"e":"PM SHRI stands for Pradhan Mantri Schools for Rising India, a centrally sponsored scheme to upgrade 14,500 schools across India as model schools for implementing NEP 2020."},{"t":"Schemes","n":34,"tag":"","q":"Which ministry launched the Adishakti Abhiyan ?","o":["Ministry of Education","Ministry of Defence","Ministry of Women and Child Development","Ministry of Home Affairs"],"a":2,"e":"Ministry of Women and Child Development. It is a grassroots-level outreach campaign focused on gender justice and community participation. Adishakti Abhiyan is a part of Mission Shakti, which is a flagship scheme of the MWCD for women's empowerment and safety."},{"t":"Schemes","n":35,"tag":"","q":"Under the Ayushman Vay Vandana Scheme launched in Delhi, what is the annual health insurance coverage offered to senior citizens ?","o":["₹5 lakh","₹7 lakh","₹10 lakh","₹15 lakh"],"a":2,"e":"₹10 lakh. The scheme is exclusively for senior citizens aged 70 or above residing in Delhi. The scheme was jointly launched by Delhi's CM Rekha Gupta and Union Minister Hardeep Singh Puri."},{"t":"Schemes","n":36,"tag":"","q":"In which Indian state is the Yeshasvini Health Scheme implemented?","o":["Maharashtra","Tamil Nadu","Karnataka","Kerala"],"a":2,"e":"Karnataka. The scheme mainly targets rural beneficiaries. The scheme was initially launched in 2003."},{"t":"Schemes","n":37,"tag":"","q":"What does HEALD stand for ?","o":["Healthy Environment and Living Disease","Healthy Liver Education and Alcohol - associated Liver Disease Prevention","Health Emergency and Alcohol Liver Development","Healing Education for Liver Disease"],"a":1,"e":"HEALD focuses on liver education and prevention of alcohol-related liver diseases. It was launched on World Liver Day (April 19th)."},{"t":"Schemes","n":38,"tag":"","q":"Which state launched the 'Pink E-Rickshaw Initiative' to empower women through eco-friendly mobility?","o":["Gujarat","Maharashtra","Rajasthan","Uttar Pradesh"],"a":1,"e":"Maharashtra launched the Pink E-Rickshaw Initiative to empower women through eco-friendly transport. It was announced by Deputy CM Ajit Pawar and began with a pilot in Pune. The scheme provides electric rickshaws, training, and financial support to women, especially from vulnerable groups. It promotes sustainable livelihoods and social upliftment through green mobility solutions."},{"t":"Schemes","n":39,"tag":"","q":"Which state's government announced that its 'Zero Poverty' scheme will be named after Dr. B.R. Ambedkar?","o":["Bihar","Uttar Pradesh","Madhya Pradesh","Rajasthan"],"a":1,"e":"Uttar Pradesh. The declaration was made on Ambedkar’s 135th birth anniversary at the Ambedkar Mahasabha campus in Lucknow. The scheme aims to uplift every underprivileged individual above the poverty line in a comprehensive manner. It follows a saturation approach, ensuring all government benefits reach eligible families."},{"t":"Schemes","n":40,"tag":"","q":"What is the name of the new initiative approved under PMKSY for improving irrigation efficiency and water management?","o":["PM-Water Vision","M-CADWM","Jal Shakti Abhiyan","Krishi Neer Yojana"],"a":1,"e":"M-CADWM. The Union Cabinet, chaired by PM Narendra Modi, approved the M-CADWM sub-scheme under PMKSY. It has a financial outlay of ₹1,600 crore for the year 2025–2026. The scheme aims to modernize irrigation infrastructure and improve water-use efficiency. It integrates advanced technology to boost agricultural productivity and farmer incomes. M-CADWM will serve as a foundation for a broader national initiative starting in April 2026."},{"t":"Schemes","n":41,"tag":"","q":"Which state became the 35th to implement the Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB-PMJAY)?","o":["Delhi","Uttar Pradesh","Gujarat","Maharashtra"],"a":0,"e":"Delhi. This marks a significant milestone, allowing Delhi's residents to access healthcare benefits under the program. Chief Minister Rekha Gupta praised the decision, highlighting its positive impact on healthcare accessibility."},{"t":"Schemes","n":42,"tag":"","q":"How many years has the Stand-Up India Scheme completed as of April 2025, and how much in loans has been sanctioned under the scheme?","o":["5 years; ₹50,000 crore","7 years; ₹61,000 crore","8 years; ₹70,000 crore","6 years; ₹45,000 crore"],"a":1,"e":"The Stand-Up India Scheme has completed 7 years as of April 2025, with over ₹61,000 crore in loans sanctioned to empower marginalized entrepreneurs."},{"t":"Schemes","n":43,"tag":"","q":"Consider the following statements regarding the entrepreneurship support scheme launched by the Assam government:\n1. The scheme named Mukhya Mantri Mahila Udyamita Abhiyan was launched by CM Himanta Biswa Sarma in Biswanath district to empower 30 lakh women.\n2. Under this scheme, each woman will receive seed capital of ₹1,00,000 to establish or expand micro-businesses. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The scheme provides seed capital of ₹10,000 (not ₹1,00,000) to each woman for micro-business support."},{"t":"Schemes","n":44,"tag":"","q":"What is the name of the poverty eradication initiative launched by the Andhra Pradesh government as part of the Swarna Andhra-2047 vision?","o":["P4 Poverty Eradication Policy","Zero Poverty – P4 Policy","Swarna Andhra Poverty Reduction Scheme","Andhra Pradesh Poverty Alleviation Plan"],"a":1,"e":"Zero Poverty – P4 Policy. The 'P4' stands for Public, Private, People Partnership, fostering collaboration between the government, private sector, and citizens. The initiative focuses on empowering families with housing, sanitation, water and LPG connections, reliable power, and high-speed internet. It also provides incentives for rooftop solar installations and entrepreneurship opportunities for financial independence. The program is designed to create a sustainable, inclusive socio-economic development model."},{"t":"Schemes","n":45,"tag":"","q":"Which state has launched the 'Lakhpati Baideo' programme?","o":["West Bengal","Odisha","Assam","Bihar"],"a":2,"e":"Assam. Chief Minister Himanta Biswa Sarma launched the 'Lakhpati Baideo' scheme in Assam to empower women Self Help Groups (SHG) members."},{"t":"Schemes","n":46,"tag":"","q":"What is one of the main goals of the Vibrant Villages Programme ?","o":["Urbanization","Border area development","Industrialization","Smart city development"],"a":1,"e":"Border area development. The programme aims for comprehensive development of villages near international borders."},{"t":"Schemes","n":47,"tag":"","q":"In which year was the Palna Scheme launched?","o":["2020","2021","2022","2023"],"a":2,"e":"2022. The Palna Scheme was launched in 2022 to enhance child care for working mothers."},{"t":"Schemes","n":48,"tag":"","q":"What is the full form of ECMS ?","o":["Electronic Circuit Manufacturing Scheme","Electronics Components Manufacturing Scheme","Electronics Communication Management Scheme","Electronic Capital Market Scheme"],"a":1,"e":"This initiative aims to make India a global hub for electronics by promoting local production of passive components like resistors, capacitors, and inductors are the main focus."},{"t":"Schemes","n":49,"tag":"","q":"Telangana Bhu Bharati Act is related to:","o":["Education","Land records","Health services","Transportation"],"a":1,"e":"Land records. It focuses on fixing land ownership issues.Telangana was formed on 2nd June 2014."},{"t":"Schemes","n":50,"tag":"","q":"When was the Gold Monetisation Scheme (GMS) launched?","o":["November 2015","March 2016","January 2014","July 2017"],"a":0,"e":"November 2015. The Government discontinued fresh deposits under the Medium-Term Government Deposit (MTGD) and Long-Term Government Deposit (LTGD) schemes from March 26, 2025."},{"t":"Sports","n":51,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Consider the following two statements, labeled\nAssertion (A) and\nReason (R). Evaluate them and choose the appropriate answer from the given options.\nAssertion (A): India's participation in the Asian Winter Games 2025 will be unique, as it will be the first time the government has provided full financial support.\nReason (R): The government's objective is to enhance India's presence and performance in winter sports by ensuring fair and meritocratic athlete selection.","o":["A is true, but R is false.","A is false, but R is true.","Both A and R are true, but R is not the correct explanation of A.","Both A and R are true, and R is the correct explanation of A."],"a":3,"e":"For the 9th Asian Winter Games (Harbin, 7-14 February 2025), India gave full financial support for the first time and focused on fair, merit-based selection to improve its performance in winter sports. China topped the medal tally with 85 medals. India sent its largest team ever (59 athletes), led by flagbearers Arif Khan and Bhavani Thekkada, but did not win any medals."},{"t":"Sports","n":52,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Where was the National Shooting Championship 2024 held?","o":["Bhubaneswar, Odisha","Mumbai, Maharashtra","Panaji, Goa","Bhopal, Madhya Pradesh"],"a":3,"e":"Bhopal, Madhya Pradesh. The 67th National Shooting Championship 2024 was held at the M.P. Shooting Academy, Bhopal, for air rifle events, while air pistol events took place in New Delhi."},{"t":"Sports","n":53,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Where was the Khelo India University Games 2024 held?","o":["Mumbai, Maharashtra","Bhubaneswar, Odisha","Guwahati, Assam","Panaji, Goa"],"a":2,"e":"Guwahati, Assam. The Khelo India University Games (KIUG) is India’s largest national-level multi-sport event for university athletes. It is organized by the Sports Authority of India (SAI) and the Ministry of Youth Affairs and Sports, in collaboration with the Association of Indian Universities, Indian Olympic Association, and National Sports Federations. 1st Edition (2020): Odisha. 2nd Edition (2022): Bengaluru, Karnataka. 3rd Edition (2023): Uttar Pradesh (Lucknow, Varanasi, Noida, Gorakhpur). 4th Edition (2024): Assam and Meghalaya – first time in the North-East. 5th Edition (2025, upcoming): Jaipur, Rajasthan."},{"t":"Sports","n":54,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Where was the National Cadets Judo Championships 2024-25 held?","o":["Odisha","Delhi","Maharashtra","Goa"],"a":2,"e":"Maharashtra. The National Cadets Judo Championships 2024–25 are part of youth and sports development under national cadet training programs and involve cadets from NCC and other sports bodies."},{"t":"Sports","n":55,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"How many total medals did India win at the International Shooting Sport Federation (ISSF) Rifle/Pistol World Cup 2023 held in Bhopal?","o":["6","5","7","8"],"a":2,"e":"7. At the ISSF Rifle/Pistol World Cup held in Bhopal in March 2023, Indian shooters delivered a strong performance, securing a total of seven medals—comprising one gold, one silver, and five bronze. This achievement placed India second in the overall medal tally for the event. India’s gold came from Sarabjot Singh in the men's 10m air pistol event, while the silver was earned by Varun Tomar and Rhythm Sangwan in the mixed 10m air pistol team. The bronze medals were won by Varun Tomar (individual 10m air pistol), Rudrankksh Balasaheb Patil (men’s 10m air rifle), the mixed rifle team of Rudrankksh Patil and Narmada Raju, Manu Bhaker (women’s 25m pistol), and Sift Kaur Samra (women’s 50m rifle 3 positions)."},{"t":"Sports","n":56,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Where was the 86th Senior National Table Tennis Championships 2025 held?","o":["Panaji, Goa","Surat, Gujarat","Mumbai, Maharashtra","Bhubaneswar, Odisha"],"a":1,"e":"Surat, Gujarat. The 86th Senior National and Inter-State Table Tennis Championships were held from January 19 to 26, 2025, at the Pandit Dindayal Upadhyay Indoor Stadium in Surat, Gujarat. This event marked the first time the Gujarat State Table Tennis Association hosted the prestigious championship. The tournament featured over 800 players competing in various categories, including men's and women's singles, team events, and mixed doubles. Notably, Manush Shah and Diya Chitale clinched their maiden senior national titles in the men's and women's singles, respectively."},{"t":"Sports","n":57,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Where was the 72nd Senior National Volleyball Championship 2024 held?","o":["Bangalore, Karnataka","Bhubaneswar, Odisha","Guwahati, Assam","Mumbai, Maharashtra"],"a":2,"e":"Guwahati, Assam. The 71st Senior National Volleyball Championship was held in Guwahati, Assam from February 2nd to 9th, 2023. The matches took place at the Karmabir Nabin Chandra Bordoloi Indoor Stadium."},{"t":"Sports","n":58,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Where was the Khelo India Youth Games 2024 held?","o":["Goa","Tamil Nadu","Odisha","Maharashtra"],"a":1,"e":"(b) Tamil Nadu. The 6th edition of the Khelo India Youth Games (KIYG) took place from January 19 to 31, 2024, across four cities in Tamil Nadu—Chennai, Coimbatore, Madurai, and Trichy .This edition marked the first time that KIYG was hosted in South India."},{"t":"Sports","n":59,"tag":"","q":"Consider the following statements regarding India’s performance at the 29th Asian Youth Table Tennis Championships:\n1. Divyanshi Bhowmick, aged 14, won the U-15 Girls’ Singles title at the championship held in Tashkent, Uzbekistan.\n2. She became the first Indian in 20 years to win this title. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – She became the first Indian to win this title in 36 years, not 20 years."},{"t":"Sports","n":60,"tag":"","q":"Who won the 2025 Belgian Grand Prix at Spa-Francorchamps?","o":["Max Verstappen","Lewis Hamilton","Oscar Piastri","Lando Norris"],"a":2,"e":"Oscar Piastri secured victory at the 2025 Belgian Grand Prix, held at the Spa-Francorchamps circuit. He managed to hold off his McLaren teammate Lando Norris in a challenging race marked by wet-dry weather conditions. This win extended his lead in the Drivers’ Championship by 16 points, reinforcing McLaren’s strong performance this season."},{"t":"Sports","n":61,"tag":"","q":"Which team won the UEFA Women’s Euro 2025 football championship ?","o":["Germany","Spain","England","France"],"a":2,"e":"England. On 27th July 2025, the England Women’s Football Team won the UEFA Women’s Euro 2025 by defeating Spain in a penalty shoot-out held in Basel, Switzerland. They became the second team ever to retain the European title, showing their consistency and strength under the leadership of Coach Sarina Wiegman."},{"t":"Sports","n":62,"tag":"","q":"Consider the following statements regarding the hosting rights of upcoming ICC World Test Championship (WTC) Finals:\n1. At the ICC Annual Conference 2025 held in Singapore, the England and Wales Cricket Board (ECB) was awarded hosting rights for the 2027, 2029, and 2031 WTC Finals.\n2. The World Test Championship (WTC) was launched by the ICC in order to promote T20 cricket globally. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only . Statement 2 is incorrect – The WTC was launched by ICC to revive interest in Test cricket and provide context to bilateral Test series, not to promote T20 cricket."},{"t":"Sports","n":63,"tag":"","q":"Who won the men’s singles title at the Japan Badminton Open 2025?","o":["Alex Lanier","Kento Momota","Shi Yuqi","Lee Zii Jia"],"a":2,"e":"Shi Yuqi. At the Japan Badminton Open 2025 in Tokyo, China’s Shi Yuqi claimed the men’s singles title by defeating defending champion Alex Lanier. In the women’s singles, South Korea’s An Se-young emerged victorious, reaffirming her dominance on the global stage."},{"t":"Sports","n":64,"tag":"","q":"At the World University Games 2025, which Indian swimmer became the first to swim the 50m butterfly in under 24 seconds?","o":["Srihari Nataraj","Sajan Prakash","B. Benediction Rohit","Virdhawal Khade"],"a":2,"e":"B. Benediction Rohit clocked 23.96 seconds in the 50m butterfly event. He broke a 7-year-old national record at the 2025 World University Games in Germany. This made him the first Indian man to swim the event in under 24 seconds."},{"t":"Sports","n":65,"tag":"","q":"Which state won both the U18 Boys’ and U18 Girls’ titles at the 10th Junior National Rugby 7s Championship 2025?","o":["Odisha","Maharashtra","Punjab","Bihar"],"a":3,"e":"Bihar clinched the U18 Boys’ title by defeating Odisha 17–15. Earlier in the week, Bihar had also won the U18 Girls’ title. This marked a historic double win for the state in junior rugby."},{"t":"Sports","n":66,"tag":"","q":"Who won the Wimbledon 2025 men’s singles title by defeating Carlos Alcaraz?","o":["Novak Djokovic","Daniil Medvedev","Jannik Sinner","Stefanos Tsitsipas"],"a":2,"e":"Jannik Sinner, a 23-year-old Italian, defeated Spain’s Carlos Alcaraz (22) in four sets—4-6, 6-4, 6-4, 6-4—at Centre Court, All England Club. The victory marked his fourth Grand Slam title overall."},{"t":"Sports","n":67,"tag":"","q":"Who won the Wimbledon 2025 women’s singles title with a rare “double bagel” victory?","o":["Aryna Sabalenka","Amanda Anisimova","Iga Swiatek","Coco Gauff"],"a":2,"e":"Iga Swiatek won her first Wimbledon title on July 12, 2025. She defeated Amanda Anisimova 6-0, 6-0 in just 57 minutes. The match became historic due to the rare “double bagel” scoreline."},{"t":"Sports","n":68,"tag":"","q":"What is India’s current position in the FIFA world rankings as of July 10, 2025, following recent defeats?","o":["127","129","133","136"],"a":2,"e":"133. India dropped six spots in the FIFA rankings, falling from 127 to 133. This decline followed losses to Thailand (0-2) and Hong Kong (0-1) in June 2025. It also marked India’s lowest football ranking since December 2016."},{"t":"Sports","n":69,"tag":"","q":"Which two major international shooting events has India been selected to host, as announced by National Rifle Association of India (NRAI) on July 10, 2025 ?","o":["Asian Games 2026 and Shooting World Cup 2027","Shooting World Cup 2027 and World Junior Championship 2028","ISSF Championship 2026 and Olympic Trials 2028","World Junior Championship 2026 and Commonwealth Games 2028"],"a":1,"e":"According to the National Rifle Association of India (NRAI), India has been entrusted with hosting several major international shooting events: Junior World Cup (2025); Asian Rifle and Pistol Championship (2026); Shooting World Cup (2027); and World Junior Championship (2028). This reflects India’s growing stature as a global hub for competitive shooting."},{"t":"Sports","n":70,"tag":"","q":"Which IPL team became the most valuable franchise in 2025, following their first title win?","o":["Mumbai Indians","Chennai Super Kings","Gujarat Titans","Royal Challengers Bengaluru"],"a":3,"e":"Royal Challengers Bengaluru . In 2025, RCB won their first IPL title, defeating Punjab Kings in the final at Narendra Modi Stadium. Following this victory, their brand value rose to $269 million, making them the most valuable IPL team. The IPL's overall valuation also increased to $18.5 billion."},{"t":"Sports","n":71,"tag":"","q":"Who won the SuperUnited Rapid and Blitz 2025 chess tournament held in Zagreb?","o":["Hikaru Nakamura","D Gukesh","Magnus Carlsen","Fabiano Caruana"],"a":2,"e":"Magnus Carlsen. He clinched the title with one round to spare, showing dominant form. India’s D Gukesh also impressed by securing third place in the tournament."},{"t":"Sports","n":72,"tag":"","q":"When did India achieve its best-ever performance at the World Boxing Cup 2025 with 11 medals ?","o":["July 2, 2025","July 4, 2025","July 6, 2025","July 8, 2025"],"a":2,"e":"July 6, 2025, India secured 11 medals at the World Boxing Cup in Astana, Kazakhstan. Gold medals were won by Sakshi, Jaismine, and Nupur. It marked India's best-ever performance in the tournament’s history."},{"t":"Sports","n":73,"tag":"","q":"On July 6, 2025, where did India register its first-ever Test win at a historic cricket venue?","o":["Lord’s","Old Trafford","Edgbaston","The Oval"],"a":2,"e":"Edgbaston. On July 6, 2025, India defeated England by 336 runs at Edgbaston, marking their first-ever Test victory at the venue. Akash Deep was the standout performer, claiming a ten-wicket haul in the match, which helped India level the series."},{"t":"Sports","n":74,"tag":"","q":"Which Indian Grandmaster won the UzChess Cup Masters 2025, achieving a career-best World No. 4 live rating?","o":["D. Gukesh","Arjun Erigaisi","R. Praggnanandhaa","Vidit Gujrathi"],"a":2,"e":"R. Praggnanandhaa clinched the UzChess Cup Masters 2025 in Tashkent (Uzbekistan), marking his third classical tournament win of the year. His performance elevated his live rating to 2778.3, making him World No. 4 and the highest-ranked Indian player, ahead of D. Gukesh and Arjun Erigaisi."},{"t":"Sports","n":75,"tag":"","q":"What is the name of the mascot unveiled for the 2025 World Para Athletics Championships in India?","o":["Veer","Prerna","Viraaj","Udaan"],"a":2,"e":"Viraaj. India launched the logo and mascot ‘Viraaj’ on June 20, 2025. This was to mark 100 days before the 2025 World Para Athletics Championships. The event will be held at Jawaharlal Nehru Stadium, New Delhi, from Sept 27 to Oct 5."},{"t":"Sports","n":76,"tag":"","q":"At which event did Neeraj Chopra secure a win with an 88.16m throw in 2025 ?","o":["Lausanne Diamond League","Doha Diamond League","Paris Diamond League","Zurich Diamond League"],"a":2,"e":"Paris Diamond League. This victory marked his first Diamond League win since 2023. His powerful first attempt reasserted his global dominance in javelin. Neeraj Chopra, the Tokyo 2020 Olympic gold medallist in men’s javelin throw, last won a Diamond League title at Lausanne in June 2023, with a throw of 87.66 meters."},{"t":"Sports","n":77,"tag":"","q":"Consider the following statements regarding the 2025 Canadian Grand Prix:\n1. George Russell won the 2025 Canadian Grand Prix, securing victory for Mercedes.\n2. The win came after a dramatic collision between Ferrari teammates Charles Leclerc and Carlos Sainz. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The collision was between McLaren teammates Norris and Piastri, not Ferrari drivers.Hence, the correct answer is (a) 1 only."},{"t":"Sports","n":78,"tag":"","q":"Who was appointed as the Global Ambassador for the 2025 Esports World Cup ?","o":["Lionel Messi","Neymar Jr.","Cristiano Ronaldo","Kylian Mbappé"],"a":2,"e":"Cristiano Ronaldo. The 2025 Esports World Cup will take place in Riyadh from July 7 to August 24. The event will feature top players, global clubs, and record-breaking prize money."},{"t":"Sports","n":79,"tag":"","q":"Which Indian athlete won the women’s 10km race walk at the Austrian Race Walking Championships in her 2025 season debut?","o":["Bhawna Jat","Priyanka Goswami","Khushbir Kaur","Sonal Sukhwal"],"a":1,"e":"Priyanka Goswami clocked 47 minutes and 54 seconds despite a one-minute penalty and recent illness. Her win demonstrated resilience and top form under tough conditions."},{"t":"Sports","n":80,"tag":"","q":"Which West Indies cricketer announced a surprise retirement from international cricket at the age of 29 in 2025 ?","o":["Shimron Hetmyer","Nicholas Pooran","Rovman Powell","Shai Hope"],"a":1,"e":"Nicholas Pooran, the explosive left-handed batter and former West Indies white-ball captain, announced his retirement from international cricket on June 10, 2025, at the age of 29. Pooran is now expected to focus on his career in global franchise leagues."},{"t":"Sports","n":81,"tag":"","q":"Consider the following statements regarding the 2025 PSA Awards:\n1. Anahat Singh won two major\n2. honours at the 2025 PSA Awards, including Women’s Challenger Player of the Season and Women’s Young Player of the Season (shared with Amina Orfi).\n3. Following her 2024–25 season, Anahat Singh became the highest-ranked Indian woman in PSA history, entering the top 20. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – She broke into the top 60 PSA rankings, which is the highest among Indian women currently, but not the top 20."},{"t":"Sports","n":82,"tag":"","q":"Who were named the ICC Men’s and Women’s Players of the Month for May 2025?","o":["Babar Azam and Smriti Mandhana","Muhammad Waseem and Chloe Tryon","Rassie van der Dussen and Laura Wolvaardt","David Warner and Chamari Athapaththu"],"a":1,"e":"Muhammad Waseem and Chloe Tryon. The ICC honoured UAE’s Muhammad Waseem and South Africa’s Chloe Tryon for May 2025. Waseem impressed as a captain and top-order batter in ODIs and T20Is. Tryon delivered impactful all-round performances during the Sri Lanka tour."},{"t":"Sports","n":83,"tag":"","q":"Which team will the Indian women’s hockey team face in their opening match of the 2025 Women’s Asia Cup?","o":["Japan","South Korea","China","Thailand"],"a":3,"e":"Thailand. India will begin its 2025 Women’s Asia Cup campaign against Thailand on September 5. The tournament will be held in Hangzhou, China. India is placed in Pool B alongside defending champions Japan."},{"t":"Sports","n":84,"tag":"","q":"Which South African cricketer announced his retirement from international cricket in June 2025?","o":["Quinton de Kock","Temba Bavuma","Heinrich Klaasen","David Miller"],"a":2,"e":"Heinrich Klaasen. The 33-year-old Heinrich Klaasen, known for his explosive white-ball batting and finishing prowess, retired from international cricket in June 2025. His decision followed South Africa's semifinal exit in the Champions Trophy and came after his earlier retirement from red-ball cricket in 2024."},{"t":"Sports","n":85,"tag":"","q":"Which Indian chess player defeated World Champion Magnus Carlsen in a classical game at the Norway Chess 2025 tournament ?","o":["R Praggnanandhaa","D Gukesh","Arjun Erigaisi","Vidit Gujrathi"],"a":1,"e":"D Gukesh. In a spectacular display of skill and determination, Indian Grandmaster D Gukesh defeated World Chess Champion Magnus Carlsen at the prestigious Norway Chess 2025 tournament. This was Gukesh’s first classical victory over Carlsen and a landmark achievement in his rising career at just 19 years old."},{"t":"Sports","n":86,"tag":"","q":"In which event did Mahendra Gurjar set a world record at the World Para Athletics Grand Prix in Switzerland?","o":["5000m Race T12","100m Sprint T46","Javelin Throw F42","Long Jump T20"],"a":2,"e":"Javelin Throw F42. The event took place in Notwil, Switzerland."},{"t":"Sports","n":87,"tag":"","q":"Who became the first Indian to win a Formula 2 race?","o":["Narain Karthikeyan","Arjun Maini","Jehan Daruvala","Kush Maini"],"a":3,"e":"Kush Maini. He clinched victory at the Spanish Grand Prix, becoming the first Indian to stand on the top step of the F2 podium."},{"t":"Sports","n":88,"tag":"","q":"Who won the gold medal in the women's 10m air pistol event at the ISSF Junior World Cup 2025 ?","o":["Anna Dulce","Chen Yen-Ching","Kanak Budhwar","Prachi"],"a":2,"e":"Kanak Budhwar. The ISSF Junior World Cup 2025 was held in Suhl, Germany."},{"t":"Sports","n":89,"tag":"","q":"Who won the men's singles title at the 2025 Italian Open?","o":["Novak Djokovic","Rafael Nadal","Carlos Alcaraz","Jannik Sinner"],"a":2,"e":"Carlos Alcaraz. The Italian Open is held at the Foro Italico in Rome, Italy."},{"t":"Sports","n":90,"tag":"","q":"Which team won the 2025 SAFF U-19 Football Championship?","o":["Bangladesh","Nepal","India","Sri Lanka"],"a":2,"e":"India. India won the SAFF U-19 Championship 2025 by defeating Bangladesh. The final took place at the Golden Jubilee Stadium, Yupia, Arunachal Pradesh."},{"t":"Sports","n":91,"tag":"","q":"Who won the Superbet Classic 2025 chess tournament?","o":["Magnus Carlsen","Alireza Firouzja","R Praggnanandhaa","Wesley So"],"a":2,"e":"R Praggnanandhaa. The event took place in Bucharest, the capital of Romania."},{"t":"Sports","n":92,"tag":"","q":"What was Neeraj Chopra's best throw at the 2025 Doha Diamond League?","o":["88.44 meters","89.94 meters","90.23 meters","91.06 meters"],"a":2,"e":"90.23 meters. He became the first Indian athlete to cross the 90-meter mark in javelin throw."},{"t":"Sports","n":93,"tag":"","q":"Who won the 2025 CCI Billiards Classic title?","o":["Dhruv Sitwala","Sourav Kothari","Pankaj Advani","Peter Gilchrist"],"a":2,"e":"Pankaj Advani. The 2025 victory marked Advani's third CCI Billiards Classic title."},{"t":"Sports","n":94,"tag":"","q":"Who became India's 86th Chess Grandmaster in 2025 ?","o":["Pranav Anand","P Shyaamnikhil","Srihari L.R.","Vignesh N.R."],"a":2,"e":"Srihari L.R. He achieved his final Grandmaster norm in Al-Ain, United Arab Emirates."},{"t":"Sports","n":95,"tag":"","q":"How many medals did India win at the Archery World Cup Stage 2 in 2025 in Shanghai ?","o":["5","6","7","8"],"a":2,"e":"7. Deepika Kumari clinched a bronze medal in the women's recurve individual category."},{"t":"Sports","n":96,"tag":"","q":"Which country won the 2025 Sudirman Cup?","o":["South Korea","Indonesia","China","Japan"],"a":2,"e":"China. China clinched the 2025 Sudirman Cup title, defeating South Korea 3–1 in the final held in Xiamen, China."},{"t":"Sports","n":97,"tag":"","q":"How many medals did India win at the 2025 ISSF World Cup held in Lima ?","o":["5","6","7","8"],"a":2,"e":"7. India finished third overall in the medal standings at the ISSF World Cup 2025. Saurabh Chaudhary, Manu Bhaker, and Esha Singh all delivered impressive performances contributing to India's success."},{"t":"Sports","n":98,"tag":"","q":"Which Indian fast bowler was honored in the Wisden Cricketers' Almanack 2025 ?","o":["Mohammed Shami","Jasprit Bumrah","Bhuvneshwar Kumar","Mohammed Siraj"],"a":1,"e":"Jasprit Bumrah. First Test bowler to reach 200 wickets with an average below 20. Smriti Mandhana was recognized in Wisden Cricketers' Almanack 2025 for her consistent excellence in women's cricket."},{"t":"Sports","n":99,"tag":"","q":"Which Indian athlete won the silver medal (“Shot Put”) at the Asian -18 Athletics Championship 2025 ?","o":["Rohit Yadav","Nishchay","Neeraj Chopra","Anuj Kumar"],"a":1,"e":"Nishchay. The Asian U-18 Athletics Championship 2025 was hosted in Tashkent, Uzbekistan."},{"t":"Sports","n":100,"tag":"","q":"Who became the first Indian boxer to win a gold medal at the World Boxing Cup ?","o":["Abhinash Jamwal","Vishal","Hitesh Gulia","Manish Rathore"],"a":2,"e":"Hitesh Gulia. India finished with a total of six medals: 1 gold, 1 silver, and 4 bronze at the World Boxing Cup 2025."},{"t":"Sports","n":101,"tag":"","q":"Who did Carlos Alcaraz defeat in the final of the 2025 Monte Carlo Masters ?","o":["Novak Djokovic","Lorenzo Musetti","Alexander Zverev","Stefanos Tsitsipas"],"a":1,"e":"Lorenzo Musetti. Tennis Players: Novak Djokovic (Serbian), Daniil Medvedev (Russia), Jannik Sinner (Italy), Holger Rune (Denmark), Alexander Zverev (Germany), Taylor Fritz (USA), Rohan Bopanna, N Sriram Balaji and Sumit Nagal."},{"t":"Sports","n":102,"tag":"","q":"Which team won the Women's Premier League (WPL) 2025 title ?","o":["Delhi Capitals","Gujarat Giants","UP Warriorz","Mumbai Indians"],"a":3,"e":"Mumbai Indians. Mumbai Indians won their second WPL title in 2025 by defeating Delhi Capitals. Harmanpreet Kaur was named Player of the Match."},{"t":"Sports","n":103,"tag":"","q":"Which team did Hockey Jharkhand defeat in the final to win their first-ever national title ?","o":["Hockey Punjab","Hockey Haryana","Hockey Maharashtra","Hockey Mizoram"],"a":1,"e":"Hockey Haryana. The final match took place at the Tau Devi Lal Complex in Panchkula, Haryana."},{"t":"Appointments","n":104,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Who was appointed as the CEO (Chief Executive Officer) of NITI Aayog in February 2023 ?","o":["Dr. Sukhbir Singh Sandhu","Amitabh Kant","Dr. Vivek Joshi","BVR Subrahmanyam"],"a":3,"e":"BVR Subrahmanyam : He succeeded Parameswaran Iyer, who later joined the Executive Board of the World Bank. Other Key Officials of NITI Aayog (as of 2025): Chairperson: Prime Minister of India (ex-officio). Vice-Chairperson: Suman Bery. CEO: BVR Subrahmanyam. Full-time Members: Notable experts in economics, science, and public policy. Governing Council Members: Chief Ministers of all states and Lt. Governors of Union Territories."},{"t":"Appointments","n":105,"tag":"SSC Stenographer 6/08/2025 (Shift 1)","q":"Consider the following statements:\n1. Madhabi Puri Buch became the first woman to head SEBI in March 2022.\n2. Tuhin Kanta Pandey has been appointed as the new SEBI Chief for three years from February 28, 2025.\n3. Saudi Arabia has awarded PMNarendra Modi the Order of s Mubarak Al-Kabeer. Which of the above statement(s) is/are correct ?","o":["1 and 3 only","2 and 3 only","1, 2, and 3 all are correct","1 and 2 only"],"a":3,"e":"1 and 2 only. Madhabi Puri Buch took charge as Chairperson of SEBI on March 1, 2022, making her the first woman and the first person from the private sector to hold that position. Tuhin Kanta Pandey has been appointed as the new SEBI Chief for three years from February 28, 2025. The \"Order of Mubarak Al-Kabeer\" is the highest civilian award of Kuwait, which was conferred upon PM Modi in 2016. The highest civilian honor of Saudi Arabia that was awarded to PM Modi is the “Order of King Abdulaziz Sash\"."},{"t":"Appointments","n":106,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Who was announced on 26 June 2025 as first Indian astronaut for Titans Space mission?","o":["Rakesh Sharma","Sunita Williams","Jahnavi Dangeti","Minal Patel"],"a":2,"e":"Jahnavi Dangeti. Jahnavi Dangeti from Andhra Pradesh was announced on 26 June 2025 as the first Indian astronaut for the Titans Space mission (2029). Selected by Titan Space Industries, she is the first Indian graduate of NASA’s International Air and Space Program. The mission involves orbiting Earth with hours of zero gravity for research and human spaceflight experience."},{"t":"Appointments","n":107,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"Kishor Makwana's appointment as Chairman of NCSC is significant in which evaluative context?","o":["Agricultural economic reforms","Political consolidation in Southern India","Caste census leadership","Social justice administration and SC policy implementation"],"a":3,"e":"Kishor Makwana’s appointment as Chairman of the National Commission for Scheduled Castes (NCSC) is significant for monitoring, evaluating, and implementing policies related to Scheduled Castes. The NCSC safeguards SC rights, investigates complaints of discrimination, and recommends measures to the government. His leadership ensures effective oversight of social justice programs, helps address grievances, and strengthens policy implementation for the welfare and empowerment of SC communities across India."},{"t":"Appointments","n":108,"tag":"","q":"Consider the following statements regarding the new appointment in IRDAI:\n1. Ajay Seth has been appointed as the new Chairman of the Insurance Regulatory and Development Authority of India (IRDAI) for a tenure of three years, or until the age of 65, or until further orders.\n2. The headquarters of IRDAI is located in New Delhi. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – The headquarters of IRDAI is in Hyderabad, not New Delhi."},{"t":"Appointments","n":109,"tag":"","q":"Who has been appointed as the new Mission Director of the Atal Innovation Mission under NITI Aayog ?","o":["R. Ramanan","Pallavi Jain","Deepak Bagla","Joyanta Chakraborty"],"a":2,"e":"Deepak Bagla. Atal Innovation Mission (AIM), launched by NITI Aayog in 2016, aims to promote innovation and entrepreneurship across India. It fosters creativity and start-up culture through key programs like Atal Tinkering Labs (ATLs), Atal Incubation Centres (AICs), and ARISE for MSME R&D, supporting the \"Startup India\" and \"Make in India\" initiatives."},{"t":"Appointments","n":110,"tag":"","q":"Who has been appointed as Managing Director & Group CEO of GIFT City effective July 14–15, 2025 ?","o":["Tapan Ray","Sanjay M. Kaul","Rajesh Bansal","R. Doraiswamy"],"a":1,"e":"Sanjay M. Kaul. GIFT City (Gujarat International Finance Tec-City) is India’s first operational smart city and international financial services center (IFSC), located near Gandhinagar, Gujarat. Launched in 2015, it is a flagship project by the Government of Gujarat and Government of India to attract global financial institutions and businesses."},{"t":"Appointments","n":111,"tag":"","q":"Ajay Kumar Shrivastava has been appointed as Director of which department at HAL ?","o":["Finance","Operations","Engineering & R&D","Production"],"a":2,"e":"Engineering & R&D. Hindustan Aeronautics Limited (HAL) is a state-owned aerospace and defence company established on 23 December 1940, headquartered in Bengaluru. Under the Ministry of Defence, it designs and manufactures aircraft, helicopters, and avionics. HAL is vital to India's defence sector, producing indigenous platforms like the Tejas LCA and Dhruv helicopters, and supports the Make in India initiative."},{"t":"Appointments","n":112,"tag":"","q":"Who has been appointed as the new Governor of Haryana by President Murmu ?","o":["Bandaru Dattatreya","Rajendra Arlekar","Prof. Ashim Kumar Ghosh","Kavinder Gupta"],"a":2,"e":"Prof. Ashim Kumar Ghosh. Pusapati Ashok Gajapathi Raju, former Union Civil Aviation Minister and TDP leader, was appointed Governor of Goa on July 14, 2025. Kavinder Gupta, ex-Deputy CM of J&K, was appointed as the new Lieutenant Governor of Ladakh, succeeding Brig. B.D. Mishra (Retd)."},{"t":"Appointments","n":113,"tag":"","q":"Who has been appointed as the Managing Director & CEO of LIC for a three-year term in July 2025 ?","o":["Sat Pal Bhanoo","Siddhartha Mohanty","R. Doraiswamy","Dinesh Pant"],"a":2,"e":"R. Doraiswamy. LIC is India’s largest life insurance provider, offering a wide range of insurance, pension, and investment products. It plays a crucial role in mobilizing public savings and contributing to national development."},{"t":"Appointments","n":114,"tag":"","q":"Who has been appointed as the first woman Director General of the Railway Protection Force ?","o":["Kiran Bedi","Meera Borwankar","Sonali Mishra","Rekha Mishra"],"a":2,"e":"Sonali Mishra. In July 2021, she became the first woman to command a BSF formation on the Punjab border."},{"t":"Appointments","n":115,"tag":"","q":"Who has been appointed as the new Chairperson of the National Medical Commission (NMC) ?","o":["Dr. B. N. Gangadhar","Dr. M. K. Ramesh","Dr. Abhijat Sheth","Dr. Suresh Gangadhar"],"a":2,"e":"Dr. Abhijat Sheth. The National Medical Commission (NMC) is the regulatory body for medical education and medical professionals in India. It was established on 25 September 2020 following the enactment of the NMC Act, 2019, with the aim of enhancing transparency, accountability, and efficiency in the medical sector. Headquartered in New Delhi, the NMC replaced the Medical Council of India (MCI) as the apex authority overseeing medical education and ethical standards in the country."},{"t":"Appointments","n":116,"tag":"","q":"Who has been appointed as the Deputy Chief Information Security Officer (Deputy CISO) at SBI ?","o":["Indranil Bhattacharyya","Arnab Kumar Chowdhury","Babitha B P","Rajesh Bansal"],"a":2,"e":"Babitha B P. Before SBI, she was Vice President – System Audit at Reserve Bank Information Technology (ReBIT)."},{"t":"Appointments","n":117,"tag":"","q":"Consider the following statements regarding the International Cricket Council (ICC):\n1. On 17th July 2025, Sanjog Gupta was appointed as the new Chief Executive Officer (CEO) of the ICC.\n2. The headquarters of the International Cricket Council (ICC) is located in Dubai, United Arab Emirates (UAE). Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is incorrect – Sanjog Gupta was indeed appointed as the CEO of ICC, but the correct date is 7 July 2025, not 17 July 2025."},{"t":"Appointments","n":118,"tag":"","q":"Who has been appointed as the new Executive Director of SEBI effective July 1, 2025 ?","o":["Indranil Bhattacharyya","Sunil Kadam","Ajit Ratnakar Joshi","Arnab Kumar Chowdhury"],"a":1,"e":"Sunil Kadam. The Securities and Exchange Board of India (SEBI) is the regulatory body for India’s securities and capital markets. Its main objective is to protect the interests of investors, regulate the securities market, and ensure fair practices by companies and market intermediaries."},{"t":"Appointments","n":119,"tag":"","q":"Who has taken charge as the Air Officer‑in‑Charge Administration at Air Headquarters on July 1, 2025 ?","o":["Air Marshal Jasvir Singh Mann","Air Marshal Narmdeshwar Tiwari","Air Marshal S. Sivakumar","Air Marshal Ajay Kumar Arora"],"a":2,"e":"Air Marshal S. Sivakumar. He was awarded the Vishisht Seva Medal for distinguished service."},{"t":"Appointments","n":120,"tag":"","q":"Who has been appointed as the new Executive Director of the Reserve Bank of India (RBI) ?","o":["Indranil Bhattacharyya","Kesavan Ramachandran","Ajit Ratnakar Joshi","Arnab Kumar Chowdhury"],"a":1,"e":"Kesavan Ramachandran. Executive Directors are senior RBI officials tasked with heading major functional departments such as supervision, regulation, monetary policy, currency management, statistics, financial stability, and economic research."},{"t":"Appointments","n":121,"tag":"","q":"Whose tenure has been extended as the Chairman of the Central Board of Direct Taxes (CBDT) ?","o":["Nitin Gupta","Ravi Agrawal","Deepak Mohanty","N. Suresh Krishnan"],"a":1,"e":"Ravi Agrawal. The Central Board of Direct Taxes (CBDT) is the apex body for direct tax policy in India, operating under the Department of Revenue, Ministry of Finance. Established in 1944 as the Central Board of Revenue, it became CBDT in 1964 under the Central Boards of Revenue Act, 1963. Headquartered in New Delhi. The official languages are Hindi and English."},{"t":"Appointments","n":122,"tag":"","q":"Who has been appointed as Senior Advisor at Fairfax Financial Holdings in June 2025 ?","o":["Raghuram Rajan","Amitabh Kant","Urjit Patel","Arvind Subramanian"],"a":1,"e":"Amitabh Kant. Amitabh Kant, the former G20 Sherpa and ex‑CEO of NITI Aayog, joined Fairfax Financial Holdings as a Senior Advisor in June 2025. He is known for Make in India, Startup India, and steering the Aspirational Districts Programme."},{"t":"Appointments","n":123,"tag":"","q":"Who has become the first woman Navy officer appointed as Aide-de-Camp to the President of India ?","o":["Punita Arora","Manisha Padi","Yashasvi Solankee","Padmavathy Bandopadhyay"],"a":2,"e":"Yashasvi Solankee. Aide-de-Camp (ADC) is a French term that literally means “camp assistant.” In military and ceremonial contexts, an ADC is a personal assistant or secretary to a high-ranking official, usually a senior military officer, Governor, or the President."},{"t":"Appointments","n":124,"tag":"","q":"Who has been appointed as the Managing Director and Head of Meta (India) effective July 1, 2025 ?","o":["Sandhya Devanathan","Shivnath Thukral","Arun Srinivas","Ajit Mohan"],"a":2,"e":"Arun Srinivas. Meta Platforms Inc., formerly known as Facebook Inc., is a leading American technology company that focuses on social media, virtual reality, and the metaverse. It owns and operates some of the world’s largest digital platforms."},{"t":"Appointments","n":125,"tag":"","q":"Who has been appointed as the interim Chief Executive Officer and Managing Director of LIC in June 2025 ?","o":["Siddhartha Mohanty","Sat Pal Bhanoo","R Doraiswamy","Ratnakar Patnaik"],"a":1,"e":"Sat Pal Bhanoo. LIC was established on 1st September 1956 through the LIC Act, 1956, following the nationalization of over 240 private life insurance companies. Its headquarters is located in Mumbai, Maharashtra."},{"t":"Appointments","n":126,"tag":"","q":"Who has been appointed as the Chairman of the Fertiliser Association of India ?","o":["N. Suresh Krishnan","Rakesh Mohan","Sailesh C. Mehta","Sanjiv Puri"],"a":2,"e":"Sailesh C. Mehta. He aims to promote balanced nutrient use, sustainable fertiliser practices, and synergy between government, industry, and farmers."},{"t":"Appointments","n":127,"tag":"","q":"Who has been appointed Chairman of the Economic Advisory Council to the Prime Minister (EAC‑PM) in June 2025 ?","o":["Suman Bery","S. Mahendra Dev","Bibek Debroy","Rakesh Mohan"],"a":1,"e":"S. Mahendra Dev. The Economic Advisory Council to the Prime Minister (EAC-PM) is an independent body constituted to give objective economic advice to the Prime Minister of India on matters related to macroeconomic issues and policy."},{"t":"Appointments","n":128,"tag":"","q":"Till which year has Dr. Samir\nV. Kamat’s tenure as DRDO Chief now been extended ?","o":["May 2024","May 2025","May 2026","May 2027"],"a":2,"e":"May 2026. DRDO is India’s premier R&D organisation under the Ministry of Defence, responsible for developing indigenous defence technologies and systems."},{"t":"Appointments","n":129,"tag":"","q":"Who has been appointed as the brand ambassador for Karnataka Forest Department ?","o":["Rahul Dravid","Javagal Srinath","Anil Kumble","VVS Laxman"],"a":2,"e":"Anil Kumble. He is Known not only for his achievements in cricket but also for his past involvement in conservation efforts, Kumble’s appointment is expected to boost public engagement in preserving the state’s rich biodiversity."},{"t":"Appointments","n":130,"tag":"","q":"Who has been appointed as the new Director of the Marine Products Export Development Authority (MPEDA)?","o":["Dr. V.K. Singh","Dr. Rameshwar Sharma","Dr. Ram Mohan M.K.","Dr. Sanjeev Kumar"],"a":2,"e":"Dr. Ram Mohan M.K. MPEDA is a statutory body under the Ministry of Commerce and Industry, Government of India. MPEDA’s headquarters is situated in Kochi, Kerala."},{"t":"Appointments","n":131,"tag":"","q":"Who has been appointed as the 9th Chief Justice of the Manipur High Court?","o":["Justice D. Krishnakumar","Justice Siddharth Mridul","Justice Kempaiah Somashekar","Justice Abhay Manohar Sapre"],"a":2,"e":"Justice Kempaiah Somashekar. The oath of office was administered by Governor Ajay Kumar Bhalla at the Raj Bhavan in Imphal."},{"t":"Appointments","n":132,"tag":"","q":"Consider the following statements regarding Hewlett Packard Enterprise (HPE) India:\n1. On 15th July 2025, Som Satsangi was appointed as the new Senior Vice President and Managing Director of HPE India.\n2. Hewlett Packard Enterprise (HPE) was founded in 2015 after splitting from Hewlett-Packard and is headquartered in Houston, Texas. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is incorrect – The appointment was of Bhawna Agarwal, not Som Satsangi, and the date has been misstated."},{"t":"Appointments","n":133,"tag":"","q":"Who has been appointed as the new Chairman of the BRICS Chamber of Commerce and Industry (BRICS CCI) ?","o":["Rajiv Kumar","Harvansh Chawla","Suresh Prabhu","Anil Agarwal"],"a":1,"e":"Harvansh Chawla. The BRICS Chamber of Commerce and Industry is a non-profit organization focused on promoting trade, investment, and economic cooperation among Brazil, Russia, India, China, and South Africa."},{"t":"Appointments","n":134,"tag":"","q":"Who has recently been appointed as the Chairman of the Union Public Service Commission (UPSC) ?","o":["Preeti Sudan","Lt. Gen. Raj Shukla","Dr. Ajay Kumar","R.K. Mathur"],"a":2,"e":"Dr. Ajay Kumar. Dr. Ajay Kumar was instrumental in launching the Agniveer scheme during his Defence Secretary tenure. The UPSC Chairman is appointed by the President of India under Article 316(1)."},{"t":"Appointments","n":135,"tag":"","q":"Who has been appointed as the Executive Chairman of NALSA in May 2025 ?","o":["Justice B.R. Gavai","Justice Surya Kant","Justice D.Y. Chandrachud","Justice Sanjiv Khanna"],"a":1,"e":"Justice Surya Kant. The National Legal Services Authority provides free legal services to the needy and promotes legal awareness. The President appoints the Executive Chairman of NALSA. NALSA helps poor and needy people get free legal services."},{"t":"Appointments","n":136,"tag":"","q":"Who has been appointed as the new Managing Director (MD) of the National Film Development Corporation (NFDC) in May 2025 ?","o":["Sanjay Joshi","Ajoy Chawla","C.K. Venkataraman","Prakash Magdum"],"a":3,"e":"Prakash Magdum. NFDC is a government body that supports the growth and promotion of Indian cinema, especially non-commercial and regional films."},{"t":"Appointments","n":137,"tag":"","q":"Who has been appointed as India's representative on the IMF Executive Board in May 2025 ?","o":["B.V.R. Subrahmanyam","Harischandra Pahath Kumbure Gedara","Parameswaran Iyer","Krishnamurthy Subramanian"],"a":2,"e":"Parameswaran Iyer. He led the Swachh Bharat Mission successfully."},{"t":"Appointments","n":138,"tag":"","q":"Who has been appointed as the head of the National Security Advisory Board (NSAB) in April 2025 ?","o":["Rajiv Mehrishi","Ajit Doval","Alok Joshi","R.K. Mathur"],"a":2,"e":"Alok Joshi. NSAB helps the government with national security policy suggestions. NSAB is a part of the National Security Council setup."},{"t":"Appointments","n":139,"tag":"","q":"Who has been elected as the President of CIFEJ for the 2025–2027 term ?","o":["Anurag Kashyap","Jitendra Mishra","Zoya Akhtar","Nagesh Kukunoor"],"a":1,"e":"Jitendra Mishra. The International Centre of Films for Children and Young People (CIFEJ) is a global organization, founded in 1955 under UNESCO, to promote quality educational and cultural cinema for children and youth. It is headquartered in Athens."},{"t":"Appointments","n":140,"tag":"","q":"Who has been appointed as the Registrar (Vigilance) of the Delhi High Court in April 2025 ?","o":["Arun Bhardwaj","Kaveri Baweja","Pawan Kumar Jain","Rajiv Sahai Endlaw"],"a":1,"e":"Kaveri Baweja. Registrar is the \"manager\" of the High Court's internal operations, ensuring everything runs smoothly both on the judicial and administrative sides."},{"t":"Appointments","n":141,"tag":"","q":"Consider the following statements regarding the Department of Agricultural Research and Education (DARE) and ICAR:\n1. In January 2024, Dr. Trilochan Mohapatra was re-appointed as the Secretary of DARE and Director General of ICAR.\n2. The Indian Council of Agricultural Research (ICAR) was established on 16 July 1929 and is headquartered in New Delhi. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is incorrect – The current appointee (2025) is Dr. Mangi Lal Jat, not Dr. Trilochan Mohapatra, and the date is misstated."},{"t":"Appointments","n":142,"tag":"","q":"Consider the following statements regarding the 23rd Law Commission of India:\n1. In July 2024, Justice K.T. Sankaran was appointed as the Chairperson of the 23rd Law Commission of India.\n2. One of the key agendas of the 23rd Law Commission is to examine the feasibility of implementing a Uniform Civil Code (UCC). Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. Statement 1 is incorrect – The current Chairperson of the 23rd Law Commission is Justice Dinesh Maheshwari, not Justice K.T. Sankaran."},{"t":"Awards","n":143,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Which analytical inference best explains why Prof. Govindarajan Padmanabhan received the Vigyan Ratna award in Biological Sciences?","o":["For isolating SARS-CoV-2 protein markers","For discovering DNA replication enzymes","For elucidating malaria parasite metabolism and boosting biotech start-ups","For promoting chemical synthesis in pharma"],"a":2,"e":"Prof. Govindarajan Padmanabhan was awarded the inaugural Vigyan Ratna Award in 2024—the highest science honor in India—for his lifetime achievements in biological sciences . He made pioneering contributions by: Elucidating the heme-biosynthetic pathway in the malaria parasite (Plasmodium) and identifying it as a viable drug target . Demonstrating the antimalarial efficacy of curcumin, especially in combination therapies"},{"t":"Awards","n":144,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which of the following accurately describes The Seven Moons of Maali Almeida, winner of the 2022 Booker Prize?\n1. The novel is set during the civil war in Sri Lanka and explores the afterlife of a photojournalist.\n2. It is a non-fictional account of archaeological excavations in the Gandhara region.\n3. The author, Shehan Karunatilaka, uses satire and ghosts to comment on violence, memory, and political trauma.","o":["2 and 3 only","1 and 3 only","1 and 2 only","1, 2 and 3 all are correct"],"a":1,"e":"1 and 3 only. Statement 1 – Correct. The story is set in Sri Lanka during the civil war (1980s–1990s). It follows Maali Almeida, a war photographer who finds himself dead and in a ghostly afterlife, given seven moons to solve his own murder and expose hidden truths. Statement 2 – Incorrect .The book is fictional, not about archaeology or Gandhara excavations. Statement 3 – Correct . Author Shehan Karunatilaka uses satire, dark humor, and supernatural elements (ghosts, afterlife) to highlight violence, memory, corruption, and political trauma in Sri Lanka."},{"t":"Awards","n":145,"tag":"","q":"The Sansad Ratna Awards 2025 were given to how many Members of Parliament (MPs) for their outstanding performance in the 18th Lok Sabha?","o":["12","15","17","21"],"a":2,"e":"17. The Sansad Ratna Awards 2025 were presented on 26th July 2025. A total of 17 MPs were awarded for their exceptional contributions in the 18th Lok Sabha. These awards were instituted in 2010, inspired by Dr. A.P.J. Abdul Kalam, to promote parliamentary excellence. Notable winners include: Supriya Sule (NCP-SP), Ravi Kishan (BJP), Nishikant Dubey (BJP), Arvind Sawant (Shiv Sena-UBT), etc."},{"t":"Awards","n":146,"tag":"","q":"Consider the following statements regarding the FISM 2025 ‘Oscar for Magicians’:\n1. Suhani Shah became the first Indian to win the prestigious ‘Oscar for Magicians’ at the FISM 2025 World Championship of Magic, held in Torino, Italy from 14–19 July 2025.\n2. She won the title of Best Magic Performer 2025 at FISM. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"1 only. Statement 2 is incorrect – She won the award for Best Magic Creator 2025, not Best Magic Performer 2025."},{"t":"Awards","n":147,"tag":"","q":"Which Indian mobile application won the WSIS (World Summit Information Society) Prizes 2025 Champion Award?","o":["Digital Gram","e-Panchayat","My Village App","Meri Panchayat"],"a":3,"e":"\"Meri Panchayat\" app, developed by the Ministry of Panchayati Raj and NIC, won the WSIS Prizes 2025 Champion Award for cultural diversity and local content. The World Summit on the Information Society (WSIS)+20 High-Level Event 2025 was held from 7 to 11 July 2025 in Geneva, Switzerland."},{"t":"Awards","n":148,"tag":"","q":"Who was honored with the Pallavur Appu Marar Vadya Puraskaram for 2023 as part of the recent Kerala State arts awards announcement?","o":["Kuroor Vasudevan Namboothiri","Mattannur Sankarankutty Marar","Kalamandalam Sankara Warrier","Kalamandalam P.N. Girijadevi"],"a":1,"e":"Mattannur Sankarankutty Marar. Renowned Chenda exponent Mattannur Sankarankutty Marar received the prestigious Pallavur Appu Marar Vadya Puraskaram for 2023."},{"t":"Awards","n":149,"tag":"","q":"Consider the following statements regarding the Swachh Survekshan 2024–25:\n1. Vijayawada received the 'Super Swachh League City' award on 1
