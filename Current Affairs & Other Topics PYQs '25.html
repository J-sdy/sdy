y and Growth for All in the Region”), announced in 2015, is India’s strategic vision for the Indian Ocean Region. It emphasizes maritime cooperation, security, blue economy, and partnerships with littoral states to ensure peace and prosperity. The Ashgabat Agreement relates to a transport corridor linking Central Asia with the Persian Gulf, not BIMSTEC. The Kaladan Multimodal Project connects India’s Northeast to Myanmar’s Sittwe port, not Iran. The so-called Ladakh Corridor has no link to Africa."},{"t":"International Affairs","n":313,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Who was invited as the chief guest for India's 76th Republic Day celebrations on January 26, 2025?","o":["Joko Widodo","Ferdinand Marcos Jr.","Anwar Ibrahim","Prabowo Subianto"],"a":3,"e":"Prabowo Subianto. The chief guest at India's 76th Republic Day (January 26, 2025) was President Prabowo Subianto of Indonesia. His visit marked not only a high-profile diplomatic engagement but also saw the first-ever participation of an Indonesian Armed Forces marching contingent and military band in the Republic Day parade."},{"t":"International Affairs","n":314,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"The India-Middle East-Europe Economic Corridor (IMEC) is often viewed as a strategic counter-initiative to which other major global connectivity projects?","o":["Trans-Pacific Partnership (TPP)","Asia-Africa Growth Corridor (AAGC)","Belt and Road Initiative (BRI)","North American Free Trade Agreement (NAFTA)"],"a":2,"e":"Belt and Road Initiative (BRI). The India–Middle East–Europe Economic Corridor (IMEC) is a strategic connectivity initiative launched at the G20 Summit 2023 in New Delhi through an MoU signed by India, US, Saudi Arabia, UAE, France, Germany, Italy, and the EU. It is part of the Partnership for Global Infrastructure and Investment (PGII), launched by the G7 in 2021. IMEC aims to provide a transparent, sustainable, and debt-free alternative to China’s Belt and Road Initiative (BRI), while safeguarding national sovereignty. The corridor has two segments: Eastern Corridor – India to Gulf, and Northern Corridor – Gulf to Europe."},{"t":"International Affairs","n":315,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"The IMEC is envisaged as a multi-modal corridor. Which of the following modes of transport are its primary components?","o":["Air, Rail, and Sea","Road and Pipeline only","Maritime and Rail only","Air and Road only"],"a":2,"e":"Maritime and Rail only. The IMEC primarily uses maritime and rail transport to move goods from India to Europe via the Middle East. Ships carry cargo to the UAE, and high-speed rail transports it across the Arabian Peninsula to Europe, providing a faster, cost-effective alternative to traditional routes like the Suez Canal."},{"t":"International Affairs","n":316,"tag":"SSC Stenographer 8/08/2025 (Shift 1)","q":"India's support for which of the following missions aligns most closely with IMEC's purpose?","o":["African Union's Blue Charter mission","Non-Aligned Movement's Neutrality Declaration","International Solar Alliance energy initiative","One Sun One World One Grid initiative"],"a":3,"e":"One Sun One World One Grid initiative. IMEC (India–Middle East–Europe Economic Corridor) was announced during the G20 Summit 2023 in New Delhi. Its goal: To create an integrated transport and energy corridor linking India → Middle East → Europe via rail, shipping, and energy pipelines + green energy transmission lines. One Sun One World One Grid (OSOWOG) is an India-led global initiative that aims to establish a transnational solar power grid for sharing renewable energy across regions. Both IMEC and OSOWOG emphasize sustainable connectivity, renewable energy transfer, and infrastructure integration across continents."},{"t":"International Affairs","n":317,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which of the following correctly pairs the initiative with its primary objective from India's viewpoint?","o":["Chabahar Port - Access Central Asia via Iran","BIMSTEC - Land connectivity to Europe","QUAD - Strengthening oil diplomacy in Gulf","IMEC - Maritime security in South China Sea"],"a":0,"e":"Chabahar Port – Access Central Asia via Iran. Chabahar Port (Iran): India is developing this port to gain direct access to Afghanistan and Central Asia while bypassing Pakistan. It is part of India’s strategy to strengthen trade connectivity with landlocked Central Asian nations and Afghanistan. BIMSTEC (Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation): Objective: Promote regional cooperation among South and Southeast Asian countries around the Bay of Bengal. QUAD (Quadrilateral Security Dialogue): India, USA, Japan, Australia → Focus on Indo-Pacific security, maritime cooperation, emerging technologies. IMEC (India-Middle East-Europe Corridor, 2023 G20): Aim: Enhance connectivity (rail + shipping) between India, Middle East, and Europe."},{"t":"International Affairs","n":318,"tag":"","q":"A massive 8.7-magnitude earthquake struck which of the following regions on July 30, 2025, triggering tsunami warnings across the Pacific?","o":["Chilean Coast, South America","Kamchatka Peninsula, Russia","North Island, New Zealand","Western Coast of Indonesia"],"a":1,"e":"Kamchatka Peninsula, Russia. The 8.7 magnitude earthquake occurred near the Kamchatka Peninsula in Russia (Asia-Europe region). It caused tsunami alerts across the Pacific, including Japan, Hawaii, Alaska, and the U.S. West Coast. Though it was a powerful quake, no major casualties were reported."},{"t":"International Affairs","n":319,"tag":"","q":"Which country will be the largest producer of soybean oil in the world in 2025?","o":["United States","Brazil","China","India"],"a":2,"e":"China. In 2025, China ranks as the top producer of soybean oil, producing over 18 million metric tonnes annually. This is due to urbanization, rising incomes, and high demand for processed and fried foods. The top-5 soybean oil producers in 2025 are : China, United States, Brazil, Argentina, India."},{"t":"International Affairs","n":320,"tag":"","q":"Consider the following statements regarding the July 2025 Cambodia border conflict:\n1. Cambodia was engaged in a deadly border conflict with Thailand in July 2025.\n2. Cambodia was engaged in a deadly border conflict with Vietnam in July 2025. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – Cambodia did not clash with Vietnam during this incident."},{"t":"International Affairs","n":321,"tag":"","q":"In which country are the first parliamentary elections in decades scheduled to be held in September 2025 after the fall of President Bashar al-Assad?","o":["Iraq","Yemen","Syria","Jordan"],"a":2,"e":"Syria. The first parliamentary elections under the new regime between September 15 and 20, 2025. These are the first elections since Assad’s overthrow and will take place under a temporary electoral system overseen by interim President Ahmed al‑Sharaa and the High Election Committee."},{"t":"International Affairs","n":322,"tag":"","q":"India recently extended a ₹4,850 crore line of credit to which neighbouring country as part of its “Neighbourhood First” policy?","o":["Sri Lanka","Bangladesh","Nepal","Maldives"],"a":3,"e":"Maldives. This move aims to support key infrastructure and development projects while also easing the Maldives’ financial pressure by reducing its annual debt repayment obligations by around 40%. The assistance reflects India’s strategic commitment to strengthening bilateral ties and enhancing economic cooperation with its island neighbour in the Indian Ocean region."},{"t":"International Affairs","n":323,"tag":"","q":"Which country recently announced its decision to recognise Palestine, signaling a diplomatic shift in the Middle East?","o":["Germany","United Kingdom","France","Italy"],"a":2,"e":"France. In July 2025, France announced it would recognize Palestine in September, becoming the first G7 and UN Security Council permanent member to do so. This move, led by President Emmanuel Macron, marks a major diplomatic shift, signaling support for the two-state solution and influencing broader international recognition efforts."},{"t":"International Affairs","n":324,"tag":"","q":"After how many years did India resume tourist visas for Chinese citizens in 2025?","o":["Three years","Four years","Five years","Six years"],"a":2,"e":"Five years. India halted tourist visa issuance for Chinese nationals in 2020 amid pandemic controls and escalating border tensions. After a prolonged break, visa services were reopened starting July 24, 2025, ending the five-year hiatus and paving the way for renewed travel and tourism links."},{"t":"Science & Tech","n":325,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"Which AQI range corresponds to \"Unhealthy for Sensitive Groups\"?","o":["101-150","151-203","0-50","51-100"],"a":0,"e":"101-150. The Air Quality Index (AQI) is a scale used to report the level of air pollution and its associated health risks. The color for the \"Unhealthy for Sensitive Groups\" range (101-150) is Orange. The other ranges correspond to different levels: 0-50 is \"Good,\" 51-100 is \"Moderate,\" and 151-200 is \"Unhealthy\" for everyone."},{"t":"Science & Tech","n":326,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"Which of the following best describes the main objective of the Indo-French Megha-Tropiques satellite mission?","o":["Understanding convective systems and the water cycle in tropical regions","Studying polar ice melt and its impact on global sea levels","Mapping mineral resources in the Himalayan region","Monitoring ozone depletion over the equator"],"a":0,"e":"The Megha-Tropiques satellite mission, launched jointly by ISRO (India) and CNES (France) in 2011, was primarily designed to study the tropical climate system, especially the water cycle and energy exchanges in the atmosphere. Its instruments observed humidity, cloud systems, and precipitation patterns in tropical regions, helping in better climate modeling and monsoon prediction. It was not related to polar ice melt, mineral mapping, or ozone studies."},{"t":"Science & Tech","n":327,"tag":"SSC Stenographer 6/08/2025 (Shift 3)","q":"SpaDeX mission is related to ______.","o":["Artificial intelligence","Space docking","Space farming","Planetary geology"],"a":1,"e":"Space docking. ISRO’s SpaDeX (Space Docking Experiment) mission is designed to test autonomous docking between two spacecraft in orbit. This technology is crucial for future space station modules, refueling missions, and deep-space exploration. It helps India build capabilities for long-duration human spaceflight. It is not linked to AI, farming in space, or planetary geology."},{"t":"Science & Tech","n":328,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Which recent mission by ISRO aims to study the Sun from the Lagrange point L1 ?","o":["Aditya-L1","Chandrayaan-3","Shukrayaan-1","Mangalyaan"],"a":0,"e":"Aditya-L1. Aditya-L1 is India’s first solar observatory mission positioned at the Lagrangian point L1. It was launched on September 2, 2023, and successfully inserted into its targeted halo orbit on January 6, 2024. The spacecraft takes 178 days to complete one revolution around L1. It carries four remote sensing payloads—VELC to study the solar corona, SUIT to image the photosphere and chromosphere in near-UV, SoLEXS to observe soft X-rays focusing on solar flares, and HEL1OS to detect hard X-rays in Sun-as-a-star observations."},{"t":"Science & Tech","n":329,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"How can NISAR provide valuable information for understanding the relationship between fluid injection and earthquake ?","o":["By tracking changes in ground surface elevation associated with pumping and injection","By measuring seismic activity in real time","By monitoring water table levels","By analyzing satellite imagery of earthquake damage"],"a":0,"e":"NISAR is a joint ISRO–NASA mission and the first satellite to use dual-frequency radar (L-band and S-band) from a single platform. The L-band SAR, developed by NASA, can penetrate forests, ice, and soil for biomass and deformation studies. The S-band SAR, developed by ISRO, is effective in monitoring crops, wetlands, and surface features. It will be launched using India’s GSLV Mk II (GSLV-F16 variant), a three-stage launch vehicle. This mission also marks ISRO’s first use of GSLV to place a satellite in a sun-synchronous polar orbit."},{"t":"Science & Tech","n":330,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"In collaboration with which country is ISRO developing the Trishna satellite for high-resolution thermal infrared imaging of Earth?","o":["Israel","USA","France","UAE"],"a":2,"e":"France. TRISHNA (Thermal infraRed Imaging Satellite for High-resolution Natural resource Assessment) is a collaborative satellite mission between the Indian Space Research Organisation (ISRO) and the French space agency CNES. The mission aims to deliver high-resolution, frequent thermal imagery of Earth's surface to study the impacts of climate change and improve natural resource management, particularly for water and food security."},{"t":"Science & Tech","n":331,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"What is the name of the satellite launched by ISRO's GSLV-F09 that was a gift to SAARC nations?","o":["GSAT-9","GSAT-19","INSAT-3DR","IRNSS-1G"],"a":0,"e":"GSAT-9 , also known as the South Asia Satellite, was launched by ISRO's GSLV-F09 on May 5, 2017. It was offered as a gift to SAARC nations (excluding Pakistan) to promote regional cooperation in communication, telemedicine, and disaster support. The satellite symbolized India's leadership in using space technology for regional development."},{"t":"Science & Tech","n":332,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"Who will fly to ISS under Axiom-4 mission in June 2025?","o":["Gagandeep Singh","Sunita Williams","Shubhanshu Shukla","Prasanth Nair"],"a":2,"e":"Shubhanshu Shukla, a Group Captain with the Indian Air Force and ISRO astronaut (Gaganyatri), served as the Pilot on Axiom Mission 4 (Ax‑4), the private mission to the International Space Station."},{"t":"Science & Tech","n":333,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"In 2025, ISRO announced the construction of the \"Bharatiya Antariksh Station\" project. What is the first module scheduled to be tested under this initiative?","o":["Cryogenic Fuel Storage Hub","Robotic Refueling Unit","Autonomous AI-operated lab","Orbital Habitation Module"],"a":3,"e":"The first module scheduled to be tested under ISRO's \"Bharatiya Antariksh Station\" (BAS) project is known as BAS-01. Based on the detailed descriptions, this module is designed to function as an orbital laboratory supporting microgravity research, technology demonstrations, and scientific imaging, while also incorporating essential systems for human presence, such as an Environmental Control and Life Support System (ECLSS), docking mechanisms, and facilities for crew recreation. These features collectively indicate that the primary function of BAS-01 is consistent with an orbital habitation module, providing the foundation for future human activities in space."},{"t":"Science & Tech","n":334,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"What is a unique feature of the AstroSat mission operated by ISRO?","o":["Simultaneous multi-wavelength observations","Optical observations only","X-ray observations only","Single-wavelength observations"],"a":0,"e":"Simultaneous multi-wavelength observations. AstroSat, launched by ISRO in 2015, is India’s first dedicated multi-wavelength space observatory. Its unique feature is the ability to carry out simultaneous observations in multiple wavelengths: Ultraviolet (UV), Visible light (optical), Soft and hard X-rays. This allows scientists to study cosmic objects (stars, galaxies, black holes, neutron stars) in different energy bands at the same time, giving a more comprehensive understanding."},{"t":"Science & Tech","n":335,"tag":"","q":"Who will launch the NISAR Earth observation satellite?","o":["NASA","ISRO","JAXA","Both NASA and ISRO"],"a":3,"e":"Both NASA and ISRO. NASA-ISRO Synthetic Aperture Radar (NISAR) is a joint mission between NASA and ISRO. NASA provided the L-band radar, and ISRO provided the S-band radar. The satellite will be launched by ISRO from Sriharikota, India using the GSLV-F16 rocket."},{"t":"Science & Tech","n":336,"tag":"","q":"Consider the following statements regarding NASA's TRACERS mission:\n1. The TRACERS mission aims to analyze Earth's magnetic defense against solar storms.\n2. The TRACERS mission aims to study the soil composition of the Moon. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – The mission has nothing to do with lunar soil; it focuses on Earth's magnetosphere."},{"t":"Science & Tech","n":337,"tag":"","q":"What fungal disease does the new pineapple variety resist?","o":["Powdery mildew","Fusariosis","Leaf spot","Anthracnose"],"a":1,"e":"Fusariosis. Indian researchers have genetically enhanced a native gene in pineapple plants to strengthen their natural defense mechanisms against Fusariosis, a destructive fungal disease."},{"t":"Science & Tech","n":338,"tag":"","q":"On which date and time (IST) is the NISAR satellite scheduled to launch?","o":["July 29, 2025 at 17:00","July 30, 2025 at 17:40","July 30, 2025 at 17:13","July 31, 2025 at 18:00"],"a":1,"e":"July 30, 2025 at 17:40 IST. The NISAR (NASA-ISRO Synthetic Aperture Radar) satellite is the first Earth observation mission jointly developed by ISRO and NASA, marking a milestone in Indo-US space cooperation. Scheduled for launch aboard GSLV-F16 on July 30, 2025, from Sriharikota."},{"t":"Science & Tech","n":339,"tag":"","q":"Consider the following statements regarding the indigenous malaria vaccine:\n1. The indigenous malaria vaccine developed by ICMR is named AdFalciVax.\n2. The indigenous malaria vaccine developed by ICMR is named R21/Matrix‑M. Which of the above statement(s) is/are correct?","o":["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],"a":0,"e":"Only 1. Statement 2 is incorrect – R21/Matrix‑M is a malaria vaccine developed elsewhere, not by ICMR."},{"t":"Science & Tech","n":340,"tag":"","q":"What is the name of the largest Martian meteorite ever auctioned, which sold in July 2025?","o":["Zagami","ALH 84001","Northwest Africa 16788 (NWA 16788)","Black Beauty"],"a":2,"e":"Northwest Africa 16788 (NWA 16788), discovered in the Sahara Desert in 2023, is the largest known Martian meteorite on Earth, weighing 24.5 kg (54 pounds). Its sale at Sotheby’s for $5.3 million set a record-breaking price for any meteorite, marking a major scientific and commercial milestone."},{"t":"Science & Tech","n":341,"tag":"","q":"By which year does ISRO aim to have its own space station operational?","o":["2028","2030","2035","2040"],"a":2,"e":"2035. ISRO, under the leadership of Chairman V. Narayanan, has unveiled its long-term space vision, which includes setting up an independent Indian space station by the year 2035. This is part of India's broader roadmap that also targets a human moon landing by 2040, reflecting the nation's growing ambitions and capabilities in the global space sector."},{"t":"Science & Tech","n":342,"tag":"","q":"Which newly discovered lichen species was identified in the Western Ghats on July 19, 2025?","o":["Graphis glaucescens","Allographa xanthospora","Allographa effusosoredica","Fissurina microcarpa"],"a":2,"e":"The discovery of Allographa effusosoredica, a new lichen species in the Western Ghats, emphasizes the ecological richness and scientific significance of this UNESCO World Heritage site. Lichens like this play crucial roles in symbiotic evolution, ecological monitoring, and habitat sustainability, making such discoveries valuable for biodiversity conservation and research."},{"t":"Science & Tech","n":343,"tag":"","q":"Which institution launched the Gyanodaya Centre for Pedagogical Innovation and Publishing?","o":["IIM Bangalore","IIM Kozhikode","IIM Calcutta","IIM Ahmedabad"],"a":1,"e":"IIM Kozhikode’s ‘Gyanodaya – Centre for Pedagogical Innovation and Publishing’ is focused on reshaping management education by blending traditional Indian knowledge systems with modern teaching methods."},{"t":"Science & Tech","n":344,"tag":"","q":"Who is set to become the first Indian astronaut to pilot a space mission to the International Space Station (ISS)?","o":["Rakesh Sharma","Gaganyaan Vyomnaut","Shubhanshu Shukla","Sunita Williams"],"a":2,"e":"Group Captain Shubhanshu Shukla of the Indian Air Force has been selected as the pilot for Axiom Mission 4 (Ax-4), making him the first Indian to pilot a space mission to the ISS."},{"t":"Science & Tech","n":345,"tag":"","q":"What is the name of the advanced communications satellite launched by Israel on July 13, 2025?","o":["Ofek-16","Amos-17","Dror-1","Beresheet-2"],"a":2,"e":"Dror-1. On July 13, 2025, Israel successfully launched its most advanced communications satellite, Dror-1, into space using SpaceX’s Falcon 9 rocket from Cape Canaveral, USA. The satellite was developed by Israel Aerospace Industries (IAI)."},{"t":"Science & Tech","n":346,"tag":"","q":"Which country’s scientists have developed the world’s lightest brain controller to guide bees like flying robots?","o":["Japan","South Korea","China","USA"],"a":2,"e":"China. A team of scientists from China, specifically at the Beijing Institute of Technology, has developed the world’s lightest brain controller that can guide the flight of bees."},{"t":"Science & Tech","n":347,"tag":"","q":"What is the name of the new butterfly species discovered in the Western Ghats of Kerala?","o":["Graphium agamedes","Zographetus mathewi","Papilio buddha","Troides minos"],"a":1,"e":"Zographetus mathewi. This newly discovered species is found in low-elevation forests and is endemic to the Western Ghats. The species is named in honour of George Mathew, a renowned Indian entomologist."},{"t":"Science & Tech","n":348,"tag":"","q":"What is the name of the AI system launched by Microsoft to accelerate protein behavior simulation?","o":["AlphaFold","BioEmu","DeepGene","ProtAI"],"a":1,"e":"BioEmu is an advanced AI system that simulates protein behavior in hours, significantly transforming drug discovery and biological research. It was announced by Microsoft Chairman and CEO Satya Nadella as a leap forward in biomedical innovation."},{"t":"Science & Tech","n":349,"tag":"","q":"What is the name of the new tree species discovered in Assam’s Baksa district?","o":["Garcinia indica","Garcinia assamica","Garcinia kusumae","Garcinia arborea"],"a":2,"e":"Garcinia kusumae. This newly discovered tree species was found by senior botanist Jatindra Sarma and named in honour of his late mother Kusum Devi, highlighting Assam’s botanical richness and India’s natural heritage."},{"t":"Science & Tech","n":350,"tag":"","q":"What is the name of the smart AI-based system launched by Andhra Pradesh to control mosquito-borne diseases?","o":["MoSurv","AI-MED","SMoSS","VectraNet"],"a":2,"e":"SMoSS — The Smart Mosquito Surveillance System is an AI-powered initiative launched by the Andhra Pradesh government to monitor and control mosquito populations using drones, sensors, and smart data, beginning in six major cities."},{"t":"Science & Tech","n":351,"tag":"","q":"Which Hyderabad-based company has received approval to launch India’s first private space-based internet service by 2028?","o":["Skyroot Aerospace","Ananth Technologies","Pixxel","Dhruva Space"],"a":1,"e":"Ananth Technologies, based in Hyderabad, has been granted permission by IN-SPACe to launch India’s first private satellite-based broadband service, expected to begin in 2028."},{"t":"Science & Tech","n":352,"tag":"","q":"What is the name of India’s first automated biomedical waste conversion system launched by AIIMS Delhi ?","o":["SwachhMed","BioClean","Srjanam","MedRecycle"],"a":2,"e":"Srjanam. AIIMS Delhi launched Srjanam, developed by CSIR-NIIST, as India’s first automated biomedical waste conversion system, eliminating hazardous waste without incineration."},{"t":"Science & Tech","n":353,"tag":"","q":"On June 25–26, 2025, aboard which private company’s Dragon spacecraft did Shubhanshu Shukla fly to the ISS?","o":["Boeing Starliner (USA)","Dragon Crew (SpaceX)","Soyuz Capsule (Russia)","Shenzhou (China)"],"a":1,"e":"Dragon Crew (SpaceX). Group Captain Shubhanshu Shukla of the Indian Air Force became the second Indian in space after Rakesh Sharma, flying aboard SpaceX’s Crew Dragon spacecraft to the International Space Station (ISS) on June 25–26, 2025. This historic mission makes him the 634th human to travel to space."},{"t":"Science & Tech","n":354,"tag":"","q":"Where is India’s first Quantum Computing Valley scheduled to be launched by January 2026?","o":["Bengaluru","Pune","Amaravati","Hyderabad"],"a":2,"e":"Amaravati. This ambitious initiative, announced during a workshop in Vijayawada by Katamneni Bhaskar, Secretary, ITE&C, is part of the National Quantum Mission (NQM)."},{"t":"Science & Tech","n":355,"tag":"","q":"Who became the first Indian to complete NASA’s International Air and Space Program and was selected for a 2029 space mission to Titan's Orbital Port Space Station?","o":["Kalpana Chawla","Ritu Karidhal","Dangeti Jahnavi","Sunita Williams"],"a":2,"e":"Dangeti Jahnavi. Hailing from Palakollu in Andhra Pradesh’s West Godavari district, she became the first Indian to successfully complete NASA’s International Air and Space Program."},{"t":"Science & Tech","n":356,"tag":"","q":"What is the name of the advanced AI-powered feature recently launched by Google in India to enhance search experiences through complex queries and multimodal interactions?","o":["Smart Lens","AI Hub","Gemini Search","AI Mode"],"a":3,"e":"AI Mode. Google has launched its revolutionary AI Mode in India, powered by custom Gemini 2.5, allowing for advanced reasoning, complex query handling, and multimodal interaction to redefine the search experience."},{"t":"Science & Tech","n":357,"tag":"","q":"Which automobile company recently conducted a successful launch and landing test of its first experimental reusable rocket in June 2025?","o":["Toyota","Hyundai","Honda","Mitsubishi"],"a":2,"e":"Honda. The Japanese company conducted the successful test on June 17, 2025, at its facility in Taiki Town, Hokkaido, marking its debut in the reusable rocket technology sector."},{"t":"Science & Tech","n":358,"tag":"","q":"Where did Union Finance Minister Nirmala Sitharaman lay the foundation stone for a Mini Planetarium and Astro Globe on June 15, 2025?","o":["Pangong Tso","Nubra Valley","Hanle Dark Sky Reserve","Zanskar Valley"],"a":2,"e":"Hanle Dark Sky Reserve. The project in the Changthang region of Ladakh was sanctioned under the Special Development Package with an investment of ₹276.65 lakh to boost scientific literacy, astro-tourism, and local employment."},{"t":"Science & Tech","n":359,"tag":"","q":"What is the unofficial name of the COVID-19 subvariant NB.1.8.1, flagged by the WHO as a variant under monitoring?","o":["Kraken","Eris","Nimbus","Centaurus"],"a":2,"e":"Nimbus. The subvariant NB.1.8.1, an Omicron descendant first identified in January 2025, is known for its rapid transmission and the symptom “razor blade throat”, and is currently under WHO watch as a variant of concern."},{"t":"Science & Tech","n":360,"tag":"","q":"What is the primary objective of China’s Tianwen-2 mission launched by CNSA ?","o":["Explore the Moon's south pole","Study Jupiter’s atmosphere","Collect samples from asteroid 2016HO3 and study a comet","Launch a crewed Mars mission"],"a":2,"e":"China’s Tianwen-2 mission, launched by the China National Space Administration (CNSA), aims to retrieve asteroid samples and later explore comet 311P, enhancing our understanding of solar system formation."},{"t":"Science & Tech","n":361,"tag":"","q":"What is the name of India’s newly launched indigenous electric aircraft?","o":["Tejas EV","Akash-E","e-Hansa","Shakti Flyer"],"a":2,"e":"e-Hansa. The Council of Scientific and Industrial Research - National Aerospace Laboratories (CSIR-NAL) developed the e-Hansa aircraft."},{"t":"Science & Tech","n":362,"tag":"","q":"Where has DRDO inaugurated its Advanced Quantum Technology Research Centre (AQTRC) ?","o":["Mumbai","Hyderabad","Bengaluru","Delhi"],"a":3,"e":"Delhi. The AQTRC is aimed at developing and promoting indigenous capabilities in quantum computing, quantum communication, and sensing technologies."},{"t":"Science & Tech","n":363,"tag":"","q":"What is the target of China’s Tianwen-2 space mission?","o":["Mars","Jupiter’s moon Ganymede","Earth’s quasi-satellite Kamo’oalewa","Saturn’s rings"],"a":2,"e":"Kamo’oalewa is a small near - Earth asteroid that exhibits quasi - satellite behavior, staying close to Earth’s orbit."},{"t":"Science & Tech","n":364,"tag":"","q":"What is Google Beam ?","o":["A new search engine","A 3D video communication platform","A cloud storage service","A virtual reality headset"],"a":1,"e":"Google Beam is an AI-powered 3D video communication platform that transforms standard 2D video streams into immersive 3D experiences, enhancing remote interactions by making them feel more lifelike."},{"t":"Science & Tech","n":365,"tag":"","q":"What is the primary concept behind Google's AI Matryoshka ?","o":["A new search algorithm","A layered AI architecture integrating multiple services","A physical AI assistant device","A standalone AI application"],"a":1,"e":"Google's AI Matryoshka refers to a multi-layered AI system where various services and applications are interconnected, resembling the nested structure of Matryoshka dolls."},{"t":"Science & Tech","n":366,"tag":"","q":"How many winning ideas were announced under the 'Ideas4LiFE' initiative?","o":["10","14","21","28"],"a":2,"e":"21. A total of 21 winning ideas (top 3 in each of 7 themes) were selected under the 'Ideas4LiFE' initiative promoting sustainable living, launched with UNICEF YuWaah. 7 themes are : Save Energy, Save Water, Say No to Single-Use Plastic, Sustainable Food Systems, Reduce Waste, Reduce E-Waste, Adopt Healthy Lifestyles."},{"t":"Science & Tech","n":367,"tag":"","q":"What is 'Ankita' recently introduced by the Assam government?","o":["A new educational program","A regional language AI news anchor","A health initiative","A transportation project"],"a":1,"e":"‘Ankita’ is India’s first AI news anchor in a regional language (Assamese), launched by Assam CM Himanta Biswa Sarma to promote digital governance. It stands for Assam’s New-age Knowledge-based Information Technology Anchor."},{"t":"Science & Tech","n":368,"tag":"","q":"In which Indian state was the butterfly species Euthalia malaccana recently recorded for the first time?","o":["Assam","Sikkim","Arunachal Pradesh","Manipur"],"a":2,"e":"Arunachal Pradesh. Euthalia malaccana is also known as Fruhstorfer’s Baron."},{"t":"Science & Tech","n":369,"tag":"","q":"What is the primary purpose of both the GPS and BeiDou systems?","o":["Weather forecasting","Satellite television broadcasting","Global navigation and positioning","Space exploration missions"],"a":2,"e":"Both GPS (Global Positioning System) and BeiDou are satellite-based systems that provide global navigation and positioning services. The BeiDou Navigation Satellite System was developed by China as an alternative to the U.S.-owned GPS."},{"t":"Science & Tech","n":370,"tag":"","q":"What is OpenAI Codex primarily designed to do?","o":["Create graphic designs","Automate and accelerate coding tasks","Translate languages","Compose music"],"a":1,"e":"Automate and accelerate coding tasks. Codex performs its operations within a secure cloud sandbox environment, ensuring safety and isolation during task execution."},{"t":"Science & Tech","n":371,"tag":"","q":"How many total missions had ISRO completed before the PSLV-C61/EOS-09 mission?","o":["99","100","101","102"],"a":1,"e":"100. The mission aimed to deploy the EOS-09 Earth observation satellite into a Sun-Synchronous Polar Orbit. The mission failed due to a drop in chamber pressure in the third stage of the rocket."},{"t":"Science & Tech","n":372,"tag":"","q":"What is the name of the submersible vehicle developed for the Samudrayaan mission?","o":["Varuna 5000","Matsya 6000","Jalpari 3000","Neelkanth 7000"],"a":1,"e":"Matsya 6000. The Samudrayaan mission aims to explore deep-sea resources and assess marine biodiversity at depths of up to 6,000 meters. The Samudrayaan mission is expected to be launched by the end of 2026."},{"t":"Science & Tech","n":373,"tag":"","q":"What is Bulbul-v2 developed by Sarvam AI ?","o":["A robot for home automation","A search engine for Indian languages","A text-to-speech (TTS) AI model","A video translation tool"],"a":2,"e":"A text-to-speech (TTS) AI model. Sarvam AI is working under the IndiaAI Mission to build India's own large language models and speech technologies."},{"t":"Science & Tech","n":374,"tag":"","q":"What is the name of India’s newly unveiled genome-edited rice variety derived from Samba Mahsuri?","o":["Pusa DST Rice 1","MTU 1010 Gold","DRR Dhan 100 (Kamala)","Kharif Gold 2.0"],"a":2,"e":"DRR Dhan 100 (Kamala). ICAR led the development through advanced biotechnology research."},{"t":"Science & Tech","n":375,"tag":"","q":"Which critical component did India contribute to the ITER project?","o":["Central Solenoid","Cryostat chamber","Plasma-facing components","Vacuum vessel"],"a":1,"e":"Cryostat chamber. India contributed the cryostat chamber to ITER, which encases the Tokamak and ensures a super-cold environment. ITER, based in France, is a global project involving 7 members (India, China, USA, Russia, Japan, South Korea, and the European Union), aiming to produce clean, fusion-based energy."},{"t":"Science & Tech","n":376,"tag":"","q":"What is the name of Amazon's satellite internet initiative ?","o":["Project Orion","Project Kuiper","Project Apollo","Project Gemini"],"a":1,"e":"Project Kuiper. On April 28, 2025, Amazon launched 27 satellites for Project Kuiper. The primary goal of Project Kuiper is to provide high-speed, low-latency broadband internet to underserved and remote areas."},{"t":"Science & Tech","n":377,"tag":"","q":"Where was the semicryogenic engine hot test conducted ?","o":["Vikram Sarabhai Space Centre, Thiruvananthapuram","Satish Dhawan Space Centre, Sriharikota","ISRO Propulsion Complex (IPRC), Mahendragiri","Liquid Propulsion Systems Centre, Bengaluru"],"a":2,"e":"The test aimed to ensure stable ignition and performance at 60% of the rated power level, examining the operation of crucial subsystems like turbo pumps and the pre-burner."},{"t":"Science & Tech","n":378,"tag":"","q":"What is the official designation of the Bullseye Galaxy ?","o":["NGC 1300","LEDA 1313424","M87","UGC 2885"],"a":1,"e":"LEDA 1313424. The Bullseye Galaxy is located about 567 million light-years away from Earth. Initially, eight rings were detected by NASA’s Hubble Space Telescope, later observations confirmed nine."},{"t":"Science & Tech","n":379,"tag":"","q":"Where is India's first Quantum Computing Village being established ?","o":["Hyderabad","Bengaluru","Amaravati","Pune"],"a":2,"e":"Amaravati. The project aims to nurture rural youth and students in cutting-edge quantum technologies."},{"t":"Science & Tech","n":380,"tag":"","q":"Which telescope recently found signs of possible life on the exoplanet K2-18b ?","o":["Hubble Space Telescope","Chandra X-ray Observatory","James Webb Space Telescope","Spitzer Space Telescope"],"a":2,"e":"James Webb Space Telescope. Methane detection on K2-18b suggests potential biological processes."},{"t":"Books & Authors","n":381,"tag":"","q":"Consider the following statements regarding the launch of the book “Sustainable Wellness of Students: A Collective Responsibility in Higher Education”:\n1. The book was launched in July 2025 by Uttarakhand Chief Minister Pushkar Singh Dhami.\n2. It focuses on addressing mental health and life challenges faced by students in higher education. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. On July 26, 2025, the Uttarakhand Chief Minister emphasized the importance of addressing mental health and life challenges faced by students in higher education while unveiling a new book focused on student wellness and institutional responsibility."},{"t":"Books & Authors","n":382,"tag":"","q":"Who is the author of the book “Das Paise ka Postcard”, which nostalgically reflects on the postcard era?","o":["Vinay Varma","S.N. Ahmed","Vikram Sampath","Raghuram Rajan"],"a":1,"e":"S.N. Ahmed. A retired Army officer, S.N. Ahmed penned this emotionally rich book that captures the essence of personal communication through postcards. It was launched in Hyderabad, with actor Vinay Varma officiating the release."},{"t":"Books & Authors","n":383,"tag":"","q":"The book “Confessions of a Shakespeare Addict”, launched in Hyderabad in July 2025, was authored by:","o":["Shashi Tharoor","V.S. Ravi","William D. Dalrymple","Sudha Murty"],"a":1,"e":"V.S. Ravi. A former IPS officer, V.S. Ravi authored this literary work that chronicles his deep admiration for Shakespeare. The book was released in Hyderabad on July 7, 2025, during an event attended by literature enthusiasts and dignitaries."},{"t":"Books & Authors","n":384,"tag":"","q":"What is the title of Shikhar Dhawan’s autobiography published by HarperCollins India?","o":["Straight Drive","Playing It My Way","The One: Cricket, My Life and More","Behind the Stumps"],"a":2,"e":"The One: Cricket, My Life and More. In his memoir, Shikhar Dhawan offers a candid account of his personal journey and professional career in cricket. The book, published by HarperCollins India, explores his struggles, triumphs, and the emotions behind his on-field persona."},{"t":"Books & Authors","n":385,"tag":"","q":"Which book, released by Amit Shah in June 2025, highlights Narendra Modi’s underground activism during the 1975 Emergency?","o":["Modi: The Man, The Times","The Emergency Diaries","1975: The Untold Story","Saffron Years"],"a":1,"e":"The Emergency Diaries. Unveiled by Union Home Minister Amit Shah on June 25, 2025, this book provides insights into Narendra Modi’s role as a young RSS Pracharak during the Emergency, blending personal anecdotes with historical archives."},{"t":"Books & Authors","n":386,"tag":"","q":"Consider the following statements regarding the book “Woman! Life! Freedom!”:\n1. The book was authored by Nobel laureate Chowra Makaremi.\n2. It is primarily focused on India’s women’s empowerment movement. Which of the statements given above is/are incorrect?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. This work presents a profound account of the protests triggered by Mahsa Amini’s death in Iran. Combining personal narrative with anthropological insight, Chowra Makaremi reflects on the broader struggle for rights and justice in Iranian society."},{"t":"Books & Authors","n":387,"tag":"","q":"Which of the following books, authored by TCA Srinivasa Raghavan, revisits the political landscape of India during the 1970s?","o":["India After Gandhi","The Emergency: A Personal History","Indira Gandhi and the Years that Transformed India","Indira: The Life of Indira Nehru Gandhi"],"a":2,"e":"Indira Gandhi and the Years that Transformed India. This work offers a balanced and research-based examination of the turbulent political developments of the 1970s, including the Emergency period, contributing fresh insights ahead of its 50th anniversary."},{"t":"Books & Authors","n":388,"tag":"","q":"“Different Strokes (1998–2014)”, the third volume in a series on India’s finance ministers, has been authored by:","o":["T.T. Ram Mohan","A.K. Bhattacharya","Kaushik Basu","Y.V. Reddy"],"a":1,"e":"A.K. Bhattacharya. This third entry in A.K. Bhattacharya’s series delves into India’s economic leadership and policy-making from 1998 to 2014—a critical phase of consolidation following the liberalisation reforms of the early 1990s."},{"t":"Books & Authors","n":389,"tag":"","q":"Who authored the debut novel “The Stars Light the Way”, a reflective story set between Singapore and India?","o":["Sucheta Raj Khanna","Anuja Chauhan","Jhumpa Lahiri","Kiran Desai"],"a":0,"e":"Sucheta Raj Khanna. In her debut work, Sucheta Raj Khanna explores the inner and outer journeys of Shazma, a woman torn between her present and a spiritual-political path, in a story that spans across India and Singapore."},{"t":"Books & Authors","n":390,"tag":"","q":"Who is the author of the book “India: 5000 Years of History on the Subcontinent”, which offers a critical account of India's historical evolution?","o":["Romila Thapar","Audrey Truschke","William Dalrymple","Irfan Habib"],"a":1,"e":"Audrey Truschke. Audrey Truschke presents a sweeping narrative of India’s historical developments—from ancient civilizations to the present day—emphasizing political, cultural, and intellectual transitions that have shaped the subcontinent."},{"t":"Books & Authors","n":391,"tag":"","q":"What is the title of Puja Pujara's memoir?","o":["Life Beyond the Pitch","The Diary of a Cricketer’s Wife","Wife of a Cricketer","Behind the Stumps"],"a":1,"e":"The Diary of a Cricketer’s Wife. Authored by Puja Pujara, the memoir offers insights into her life with Indian cricketer Cheteshwar Pujara. It was published by HarperCollins India and captures the unique experiences of being a cricketer’s spouse."},{"t":"Books & Authors","n":392,"tag":"","q":"What is the title of the Coffee Table Book released in Kohima on May 16, 2025?","o":["\"Urban Renaissance: Nagaland's Housing Journey\"","\"Transforming Lives: A Glance of Pradhan Mantri Awas Yojana (Urban) Mission in Nagaland\"","\"Affordable Housing in Nagaland: A Visual Chronicle\"","\"Nagaland's Urban Evolution: PMAY-U Insights\""],"a":1,"e":"The event, held at Hotel Vivor in Kohima, was graced by Zhaleo Rio, Advisor for Municipal Affairs and Urban Development."},{"t":"Books & Authors","n":393,"tag":"","q":"What is the title of Bandaru Dattatraya's autobiography released in May 2025?","o":["“Meri Kahani”","“Janta Ki Kahani – Meri Aatmakatha”","“Safarnama”","“Mere Jeevan Ke Pal”"],"a":1,"e":"Janta Ki Kahani – Meri Aatmakatha. Released on May 9, 2025, by Vice-President Jagdeep Dhankhar, the book reflects Haryana Governor Bandaru Dattatraya’s life journey and public service."},{"t":"Books & Authors","n":394,"tag":"","q":"What is the title of the book authored by Himanshu Roy that explores the evolution of India's Prime Minister's Office?","o":["\"The PMO Chronicles\"","\"PMO: Prime Minister’s Office Through the Years\"","\"Inside the PMO\"","\"Governance and the PMO\""],"a":1,"e":"\"PMO: Prime Minister’s Office Through the Years\""},{"t":"Books & Authors","n":395,"tag":"","q":"Consider the following statements regarding the novel “The Kashmir Shawl”:\n1. The novel was authored by Janey King.\n2. Its narrative alternates between the 1940s colonial India and the present-day journey of Mair. Which of the statements given above is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":1,"e":"2 only. The author of the novel \"The Kashmir Shawl\" is Rosie Thomas."},{"t":"Books & Authors","n":396,"tag":"","q":"Who are the authors of the book \"Ramanujan: Journey of a Great Mathematician\" ?","o":["Robert Kanigel and G.H. Hardy","Arun Singhal and Devendra Kumar Sharma","Janey King and Shivam","Swapan Banerjee and Himanshu Verma"],"a":1,"e":"Arun Singhal and Devendra Kumar Sharma. The book delves into the extraordinary life of Srinivasa Ramanujan, highlighting his genius, personal struggles, and significant contributions to mathematics."},{"t":"Books & Authors","n":397,"tag":"","q":"Which ministry launched the ‘I Am Circular’ Coffee Table Book highlighting India’s progress in the circular economy?","o":["Ministry of Environment, Forest and Climate Change","Ministry of Commerce and Industry","Ministry of Electronics and Information Technology","Ministry of New and Renewable Energy"],"a":2,"e":"Ministry of Electronics and Information Technology. The book highlights India’s commitment to sustainability through the principles of the circular economy. It focuses on reusing, recycling, and reducing waste to promote eco-friendly practices. The launch event celebrated 30 innovative Indian initiatives driving a smart and sustainable circular economy."},{"t":"Books & Authors","n":398,"tag":"","q":"What is the name of the book launched on April 18, 2025, compiling Prime Minister Narendra Modi’s speeches on culture?","o":["Bharat Ki Sanskriti","Sanskriti Ka Paanchva Adhyay","Modi Aur Sanskriti","Sanskriti Ka Safar"],"a":1,"e":"Sanskriti Ka Paanchva Adhyay. It was officially launched on April 18, 2025, at the Samvet Auditorium, IGNCA, New Delhi. The book reflects the government's emphasis on preserving and promoting India's rich cultural legacy."},{"t":"Books & Authors","n":399,"tag":"","q":"What is the title of the memoir written by former Facebook executive Sarah Wynn-Williams?","o":["Behind the Screens","Power and Greed Unmasked","Careless People","Lost Ideals of Silicon Valley"],"a":2,"e":"'Careless People' is a memoir by former Facebook executive Sarah Wynn-Williams, offering a critical look at power, greed, and lost idealism during her seven years at Facebook."},{"t":"Books & Authors","n":400,"tag":"","q":"What is the title of the book that captures the life journey of freedom fighter S. Ambujammal ?","o":["My Life, My Nation","The India I Dreamed","The India I Saw","A Patriot’s Journey"],"a":2,"e":"'The India I Saw' is a book that reflects S. Ambujammal’s journey from personal sorrow to public service, highlighting her contributions to India's freedom struggle and her deep adherence to Gandhian principles."},{"t":"Books & Authors","n":401,"tag":"","q":"Consider the following statements regarding the book on Lal Bahadur Shastri authored by Sanjeev Chopra:\n1. The title of the book is “The Gentle Leader”.\n2. The book primarily focuses on Shastri’s role in India’s freedom struggle during the 1920s. Which of the statements given above is/are incorrect?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The title of the book is “The Great Conciliator'’. The book offers a detailed exploration of Shastri’s political, social, and administrative journey. It highlights his rise from humble beginnings in Mughalsarai to becoming India's second Prime Minister. Key contributions covered include the formation of the Border Security Force (BSF) and the slogan “Jai Jawan, Jai Kisan.”"},{"t":"Books & Authors","n":402,"tag":"","q":"Rujuta Diwekar’s upcoming book, published by Juggernaut, will focus on which of the following themes?","o":["Yoga and meditation practices","Debunking food myths and diet misconceptions","Mental health and well-being","Ayurveda and ancient remedies"],"a":1,"e":"Another book by her : ‘The 12-Week Fitness Project’, ‘Don'T Lose Your Mind, Lose Your Weight’, ‘Pregnancy Notes: Before, During & After’, ‘Indian Superfoods’, ‘Don't Lose Out, Work Out!’."},{"t":"Books & Authors","n":403,"tag":"","q":"What is the title of Pratap Bhanu Mehta’s upcoming anthology of writings, published by Juggernaut ?","o":["Ideas of India","The True Land of Promise","Reflections on Freedom","India Through My Eyes"],"a":1,"e":"The True Land of Promise. ‘The burden of democracy’book is written by him."},{"t":"Books & Authors","n":404,"tag":"","q":"What is the title of Sudha Murty’s latest book, published by Penguin Random House India, about five friends who reunite 25 years after meeting at IISc Bangalore?","o":["The Journey Within","The Circle of Life","Reunion of Hearts","Life’s Full Circle"],"a":1,"e":"The Circle of Life. More Books by her: ‘How I Taught My Grandmother to Read’, ‘The Magic of the Lost Temple’, ‘Wise and Otherwise’, ‘Dollar Bahu’, ‘Three Thousand Stitches’, ‘Mahashweta’."},{"t":"Books & Authors","n":405,"tag":"","q":"What is the title of Shashi Tharoor’s latest book on the Indian Constitution, published by Aleph Book Company?","o":["The Indian Constitution Explained","The People’s Constitution","Brief History of the Constitution of India","The Constitution: An Essential Guide"],"a":1,"e":"The People’s Constitution. Shashi Tharoor’s books: ‘Inglorious Empire’, ‘Why I Am a Hindu’, ‘An Era of Darkness: The British Empire in India’, ‘The Great Indian Novel’, ‘The Paradoxical Prime Minister’."},{"t":"Books & Authors","n":406,"tag":"","q":"What is the title of Geetanjali Shree’s upcoming collection of short stories, translated by Daisy Rockwell and published by Penguin Random House India?","o":["The Colour of Sand","The Roof Beneath Their Feet","The Tomb and Beyond","The Roof Beneath Their Feet and Other Stories"],"a":1,"e":"The Roof Beneath Their Feet. Her other books : ‘Tomb of Sand’, ‘Hamara Shahar Us Baras’, ‘The Roof Beneath Their Feet’, ‘Tirohit’, ‘Khali Jagah’."},{"t":"Books & Authors","n":407,"tag":"","q":"Anirudh Kanisetti’s upcoming book, published by Juggernaut, is a full-length history of which South Indian empire?","o":["Vijayanagara Empire","Chola Empire","Pandya Empire","Satavahana Empire"],"a":1,"e":"Chola Empire. ‘Lords of Earth And Sea : A History of The Chola Empire’ book covers the history and legacy of the Chola Empire, based on inscriptions and historical sources. His more books: ‘Lords of the Deccan : Southern India from the Chalukyas to the Cholas’, ‘Eleven Stops to the Present: Stories of Bengaluru’, ‘India's Marathon: Reshaping the Post-Pandemic World Order’."},{"t":"Books & Authors","n":408,"tag":"","q":"What is the title of Srinagar-born Mehak Jamal’s debut book, a collection of 16 true oral histories of Kashmir’s people, to be published by HarperCollins India?","o":["Mehboob","Mohabbat","Ishq-e-Kashmir","Pyar"],"a":1,"e":"Mohabbat."},{"t":"Books & Authors","n":409,"tag":"","q":"What is the title of the upcoming interconnected story of ten women and one man, written by Jissa Jose and translated by Jayasree Kalathil, to be published by HarperCollins India?","o":["The Missing Woman","Mudritha","The Vanishing Case","Women of the Past"],"a":1,"e":"Mudritha ."},{"t":"Books & Authors","n":410,"tag":"","q":"Who has compiled the upcoming anthology of Urdu poems, published by Hachette India, featuring works of poets like Mirza Ghalib and Faiz Ahmed Faiz?","o":["Rakhshanda Jalil","Satya Prabhakar","Syeda Hameed","Arvind Krishna Mehrotra"],"a":1,"e":"Satya Prabhakar."},{"t":"Books & Authors","n":411,"tag":"","q":"Who is the author of the upcoming biography of Begum Samru, published by Penguin Random House India?","o":["Manu S. Pillai","Ira Mukhoty","Anoushka Jain","Ruby Lal"],"a":1,"e":"Ira Mukhoty. More books by him: ‘Akbar: The Great Mughal’, ‘The Lion and The Lily: The Rise and Fall of Awadh’, ‘Song of Draupadi: A Novel’, ‘Daughters of the Sun: Empresses, Queens and Begums’, ‘Heroines: Powerful Indian Women of Myth and History’."},{"t":"Books & Authors","n":412,"tag":"","q":"What is the title of Tamil author Perumal Murugan’s latest collection of essays on student life in small-town Tamil Nadu, to be published by Penguin Random House India?","o":["The Lessons We Learn","Fire on the Hill","Studies in Small Towns","How to Study"],"a":3,"e":"How to Study. His other books: ‘One Part Woman’, ‘Pyre’, ‘Fire Bird’, ‘Seasons of the Palm’, ‘A Lonely Harvest’."},{"t":"Books & Authors","n":413,"tag":"","q":"What is the title of journalist Meher Mirza’s upcoming debut book on Mumbai’s culinary heritage, to be published by HarperCollins India?","o":["Flavours of Mumbai","Bombay Duck","The Taste of the City","Culinary Tales of Bombay"],"a":1,"e":"Bombay Duck."},{"t":"Books & Authors","n":414,"tag":"","q":"What is the title of Kiran Desai’s upcoming novel, set to be published by Penguin Random House India?","o":["The Inheritance of Loss","The Loneliness of Sonia & Sunny","A Saga Across Continents","The Journey of Love and Race"],"a":1,"e":"The Loneliness of Sonia & Sunny. Her other books: ‘The Inheritance of Loss’, ‘Emblems of Transformation’, ‘The Inheritance of Loss’, ‘Hullabaloo in the Guava Orchard’."},{"t":"Books & Authors","n":415,"tag":"","q":"What is the title of Amitav Ghosh’s latest collection of essays , published by HarperCollins India?","o":["The Living World","Wild Fictions: Essays","The Great Derangement","Fluid Journeys"],"a":1,"e":"Wild Fictions: Essays. His more books : ‘Sea of Poppies’, ‘The Hungry Tide’, ‘The Shadow Lines’, ‘The Great Derangement’, ‘Gun Island’, ‘River of Smoke’, ‘The Nutmeg's Curse’, ‘Flood of Fire’, ‘The Calcutta Chromosome’."},{"t":"Books & Authors","n":416,"tag":"","q":"Who is the author of the non-fiction book ‘The Himalaya in a Small House’, published by Hachette India?","o":["Arundhati Roy","Anuradha Roy","Avni Doshi","Janice Pariat"],"a":1,"e":"Anuradha Roy. Her more books: ‘Sleeping On Jupiter’, ‘The Folded Earth’, ‘The Earthspinner’."},{"t":"Books & Authors","n":417,"tag":"","q":"Who is the author of the book ‘Learning from Silence: Lessons from more than 100 retreats’, to be released by Penguin Random House India?","o":["Pico Iyer","William Dalrymple","Ruskin Bond","Rolf Potts"],"a":0,"e":"Pico Iyer. His other books: ‘Aflame: Learning from Silence’, ‘The Art of Stillness’, ‘The Half Known Life’, ‘The lady and the monk’, ‘The Global Soul’."},{"t":"Books & Authors","n":418,"tag":"","q":"Who is the author of the book ‘Badass Begums’, set to be published by HarperCollins India?","o":["Anoushka Jain","Koral Dasgupta","Arundhati Subramaniam","Krupa Ge"],"a":0,"e":"Anoushka Jain. ‘Badass Begums’ is the debut book by Anoushka Jain, founder of Enroute Indian History, and highlights the powerful stories of historical women like Jahanara Begum, Qudsiya Begum, and Razia Sultan."},{"t":"Books & Authors","n":419,"tag":"","q":"Who is the author of the memoir ‘Mother Mary Comes to Me’, one of the most awaited Indian books of 2025?","o":["Arundhati Roy","Kiran Desai","Jhumpa Lahiri","Anuradha Roy"],"a":0,"e":"Arundhati Roy. ‘Mother Mary Comes to Me’ is a memoir by Arundhati Roy, paying tribute to her mother, Mary Roy, and is set to be published by Penguin Random House India in 2025. More books of her: ‘The God of Small Things’, ‘The Ministry of Utmost Happiness’, ‘Azadi’, ‘Capitalism: A Ghost Story’, ‘The Doctor and the Saint: The Ambedkar - Gandhi Debate’, ‘An Ordinary Person's Guide to Empire’, ‘The Algebra of Infinite Justice’, ‘Walking With The Comrades’, ‘The Cost of Living’, ‘Power Politics’."},{"t":"Portals & Apps","n":420,"tag":"SSC Stenographer 6/08/2025 (Shift 2)","q":"What is the purpose of the two-day Hands-on Training Workshop on the e-SAKSHI Portal held in June 2024?","o":["To demonstrate biometric tracking of MPLAD assets","To train officials on the revised fund flow procedure under MPLAD Scheme","To launch a new e-commerce platform for district development","To train MPs in drafting local development plans"],"a":1,"e":"The e-SAKSHI portal is an online system for managing MPLADS, launched in 1993 to let MPs recommend community-focused development works. A two-day workshop in June 2024 trained officials on the new fund flow procedure for transparency, real-time monitoring, and faster project execution. The scheme is administered by MoSPI, implemented by District Collectors, with ₹5 crore per constituency annually."},{"t":"Portals & Apps","n":421,"tag":"","q":"What is the name of the mobile app launched by the Indian Railways in July 2025 to offer multiple passenger services in one place?","o":["RailYatra","IRCTC Go","RailOne","RailLink"],"a":2,"e":"RailOne. The RailOne app was launched on 1st July 2025 by the Union Railway Minister during the CRIS Foundation Day in New Delhi."},{"t":"Portals & Apps","n":422,"tag":"","q":"What is the name of the new mobile alert system being tested in India in July 2025 to send real-time emergency warnings ?","o":["Fast Alert System","Disaster Broadcast Network","Cell Broadcast System","Emergency SMS System"],"a":2,"e":"Cell Broadcast System. The Department of Telecommunications, in collaboration with NDMA, began testing the Cell Broadcast System to deliver real-time alerts in disaster-hit areas. Unlike SMS, it reaches all mobile users in a location instantly, ensuring faster and broader emergency communication."},{"t":"Portals & Apps","n":423,"tag":"","q":"What is the name of the mobile app launched by the Government of India in June 2025 to provide easy access to official statistics?","o":["StatIndia","GoIData","GoIStats","BharatStats"],"a":2,"e":"GoIStats. GoIStats, launched on 30th June 2025, was developed by the NSO under MoSPI. It provides mobile access to major socio-economic indicators such as GDP, inflation, and employment data, making government statistics more accessible to the public."},{"t":"Portals & Apps","n":424,"tag":"","q":"Which organisation has partnered with Indian Railways in June 2025 to integrate AI-powered multilingual solutions across major railway platforms?","o":["NITI Aayog","BHASHINI (Digital India Bhashini Division)","NIC (National Informatics Centre)","CDAC"],"a":1,"e":"BHASHINI (Digital India Bhashini Division). On 10th June 2025, BHASHINI and CRIS signed an MoU to introduce AI-based language tools into NTES and RailMadad, enabling multilingual support in 22 Indian languages on railway platforms."},{"t":"Portals & Apps","n":425,"tag":"","q":"What is the name of the nationwide survey launched through the NaMo App in June 2025 to collect citizens’ feedback on governance and development ?","o":["Bharat Voice Survey","Jan Man Survey","Nagrik Feedback Drive","Vikas Janmat Survey"],"a":1,"e":"Jan Man Survey. Launched on 10th June 2025 via the NaMo App, Jan Man Survey gathered public opinions on key national themes and received 5+ lakh responses in 26 hours, with high engagement from Uttar Pradesh and Maharashtra."},{"t":"Portals & Apps","n":426,"tag":"","q":"What is the full form of the UMEED Portal launched by the Government of India in June 2025 for Waqf property management ?","o":["Unified Management for Efficient Economic Development","Unified Monitoring for Empowerment and Efficiency Dashboard","Unified Waqf Management, Empowerment, Efficiency, and Development","Universal Mechanism for E-Governance and Estate Digitization"],"a":2,"e":"The UMEED Portal was launched on 6th June 2025 to digitize Waqf property records across India using geo-tagging, real-time verification, and e-Governance tools, promoting transparency and accountability."},{"t":"Portals & Apps","n":427,"tag":"","q":"What is the primary objective of the Ayush Suraksha Portal launched in May 2025 ?","o":["To promote AYUSH tourism across India","To provide online consultations with AYUSH doctors","To report misleading advertisements and monitor adverse drug reactions in traditional medicine","To digitalize AYUSH educational institutions"],"a":2,"e":"The Ayush Suraksha Portal, launched on 30th May 2025, aims to protect public health by empowering citizens and professionals to report misleading advertisements and adverse reactions in AYUSH systems, thereby enhancing transparency and consumer safety."},{"t":"Portals & Apps","n":428,"tag":"","q":"Which portal was launched by the Union Minister of Coal and Mines to provide online Provident Fund and Pension services for coal sector workers?","o":["UMEED","Suraksha Setu","C CARES 2.0","SEVA Coal"],"a":2,"e":"C CARES 2.0. C CARES 2.0 is a web portal launched by Union Minister of Coal and Mines G Kishan Reddy. Developed by C-DAC, the portal was introduced by the Coal Mines Provident Fund Organization (CMPFO) to digitally manage Provident Fund and Pension services for coal sector workers."},{"t":"Portals & Apps","n":429,"tag":"","q":"Which portal was launched by the Union Minister for Minority Affairs to improve transparency and efficiency in Waqf property management?","o":["PRAYAS","SAKSHAM","UMEED","NIDAN"],"a":2,"e":"UMEED portal (Unified Waqf Management, Empowerment, Efficiency and Development) was launched by Union Minister Kiren Rijiju on June 6, 2025."},{"t":"Portals & Apps","n":430,"tag":"","q":"Consider the following statements regarding initiatives in the traditional medicine sector of India:\n1. The \"Ayurveda Bandhu\" portal was launched to promote investment in India’s traditional medicine sector.\n2. The \"Ayush Nivesh Saarthi\" portal was developed by the Ministry of Health and Family Welfare. Which of the statements given above is/are incorrect?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. The “Ayush Nivesh Saarthi” portal was launched to promote investment in India’s traditional medicine sector. Launched by Ministers Piyush Goyal and Prataprao Jadhav, the Ayush Nivesh Saarthi portal aims to boost investment in traditional medicine. Developed by the Ministry of Ayush and Invest India."},{"t":"Portals & Apps","n":431,"tag":"","q":"Which portal is being developed as a unified platform to consolidate agriculture-related schemes across ministries and states?","o":["Krishi Dhan Setu","AgriOne Portal","Krishi Nivesh","Kisan Samriddhi"],"a":2,"e":"Krishi Nivesh. The Krishi Nivesh Portal is a unified digital platform developed by the Government of India under the Ministry of Agriculture & Farmers Welfare. It consolidates 17 flagship agriculture-sector schemes from multiple central ministries into one interface—serving investors, farmers, and agribusinesses."},{"t":"Portals & Apps","n":432,"tag":"","q":"Which portal was launched for digitizing the proceedings of the Puducherry Legislative Assembly ?","o":["Digital Sabha Portal","e-Sansad","NeVA","Vidhan Connect"],"a":2,"e":"NeVA. Union Minister of State Dr. L. Murugan inaugurated the National e‑Vidhan Application (NeVA) on June 9, 2025, for the Puducherry Legislative Assembly, marking its transition to a paperless, digital legislative process."},{"t":"Portals & Apps","n":433,"tag":"","q":"Which app was launched by Swathi Nelabhatla to help women monetise their skills through flexible work opportunities?","o":["Swayam Setu","Sitha","Nari Shakti","SheConnect"],"a":1,"e":"Sitha. Swathi Nelabhatla founded the Sitha App (“She Is The Hero Always”) to enable women across India to turn their skills into income. Designed as India’s first women-exclusive gig marketplace."},{"t":"Portals & Apps","n":434,"tag":"","q":"Consider the following statements regarding Adobe’s AI-powered mobile app:\n1. Adobe has launched the “PixelCrafter” app on iOS and Android for AI-generated image and video creation.\n2. The “Firefly” app is limited to desktop use and not available on smartphones. Which of the statements given above is/are incorrect?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Adobe has officially launched its Firefly mobile app for both iOS and Android, enabling users to generate and edit AI-powered images and videos directly on their smartphones. The app supports text‑to‑image, text‑to‑video, image‑to‑video, and editing tools like Generative Fill and Generative Expand."},{"t":"Portals & Apps","n":435,"tag":"","q":"Which portal was launched to serve as a digital repository for gender budgeting processes?","o":["Nari ArthSetu","Mahila Vitt Portal","Gender Budgeting Knowledge Hub","Stree Nivesh"],"a":2,"e":"Gender Budgeting Knowledge Hub. Union Minister of Women and Child Development Annpurna Devi launched the Gender Budgeting Knowledge Hub on June 19–20, 2025 during a national consultation at Vigyan Bhawan, New Delhi."},{"t":"Portals & Apps","n":436,"tag":"","q":"Tata Power partnered with which cloud service provider to drive India’s smart energy transition?","o":["Google Cloud","Microsoft Azure","Amazon Web Services","IBM Cloud"],"a":2,"e":"Amazon Web Services. Tata Power partnered with AWS to accelerate India's smart energy transition using AI, machine learning, and IoT for grid modernization, enhancing efficiency, power distribution, and renewable energy integration."},{"t":"Obituary","n":437,"tag":"SSC Stenographer 7/08/2025 (Shift 1)","q":"Prime Minister Narendra Modi paid tribute to Thiru K. Kamaraj on his birth anniversary. He is remembered for his contributions to which of the following areas ?","o":["Trade liberalization and digital governance","Freedom struggle and social welfare governance","Industrialization and foreign policy","Literature and environmental reforms"],"a":1,"e":"Freedom struggle and social welfare governance. Thiru K. Kamaraj, popularly known as the “Kingmaker” in Indian politics, was a freedom fighter and later Chief Minister of Tamil Nadu. He is remembered for his role in the Indian freedom struggle and for introducing significant social welfare measures, especially the Mid-Day Meal Scheme and widespread expansion of schools in Tamil Nadu, which greatly improved literacy and education."},{"t":"Obituary","n":438,"tag":"SSC Stenographer 7/08/2025 (Shift 2)","q":"Prime Minister Narendra Modi paid tribute to Mahatma Jyotiba Phule on his birth anniversary. Phule is best known for his contributions to which of the following?","o":["Agriculture and commerce","Industry and infrastructure","Military and diplomacy","Social Reform and Anti-Caste Movement"],"a":3,"e":"Jyotirao Phule was a social reformer, activist, and writer from Maharashtra, inspired by Thomas Paine’s The Rights of Man. He championed the upliftment of women and lower castes. In 1873, he founded the Satyashodhak Samaj (Seekers of Truth) to promote social and economic equality. In 1888, he was given the title “Mahatma” by Vithalrao Krishnaji Vandekar. His famous book Gulamgiri (Slavery) compared the plight of India’s lower castes with that of African-American slaves, offering a sharp critique of the caste system."},{"t":"Obituary","n":439,"tag":"","q":"Which celebrated queer poet and Colorado’s Poet Laureate passed away on July 14, 2025 ?","o":["Ocean Vuong","Andrea Gibson","Mary Oliver","Jericho Brown"],"a":1,"e":"Andrea Gibson, an acclaimed queer poet and Colorado’s Poet Laureate, passed away at the age of 49 on July 14, 2025. They were known for their powerful poetry on gender, identity, mental health, and love, and were a prominent voice in the LGBTQ+ community, inspiring many through spoken word and activism."},{"t":"Obituary","n":440,"tag":"","q":"Fauja Singh, who passed away in July 2025 at the age of 114, was famous for his achievements in which field?","o":["Wrestling","Long jump","Marathon running","Gymnastics"],"a":2,"e":"Marathon running. Fauja Singh, known as the ‘Turbaned Tornado’, was a globally celebrated marathon runner from Punjab who continued running into his 90s and beyond."},{"t":"Obituary","n":441,"tag":"","q":"Vatsala, who passed away on July 8, 2025, at the Panna Tiger Reserve, was known as:","o":["India’s first captive-born tiger","Asia’s oldest living elephant","The oldest lioness in Madhya Pradesh","The first elephant trained for forest patrols"],"a":1,"e":"Asia’s oldest living elephant. Vatsala, who died on July 8, 2025, at the Panna Tiger Reserve in Madhya Pradesh, was believed to be over 100 years old, making her Asia’s oldest living elephant. Her remarkable longevity and peaceful life symbolized the enduring bond between wildlife and conservation efforts in India."},{"t":"Obituary","n":442,"tag":"","q":"Which WWE legend, known for redefining professional wrestling and famous for his iconic yellow bandanas and nWo persona, passed away at the age of 71?","o":["The Undertaker","Hulk Hogan","Ric Flair","Stone Cold Steve Austin"],"a":1,"e":"Hulk Hogan. Hulk Hogan, a global pop culture icon and professional wrestling legend, passed away at the age of 71. Known for his charismatic presence, yellow bandanas, and later his role in the nWo (New World Order) faction, Hogan was instrumental in bringing wrestling to mainstream global popularity."},{"t":"Obituary","n":443,"tag":"","q":"Which former Kerala Chief Minister, known for his century-long life and commitment to transparent governance, recently passed away at the age of 101 ?","o":["Oommen Chandy","EK Nayanar","VS Achuthanandan","Pinarayi Vijayan"],"a":2,"e":"VS Achuthanandan was a senior Communist leader and one of the founding members of the CPI(M). He served as Kerala’s Chief Minister from 2006 to 2011 and was admired for his strong anti-corruption stance and social welfare policies."},{"t":"Obituary","n":444,"tag":"","q":"Which veteran Telugu actor, known for his versatile performances and cultural impact, passed away at the age of 83 on July 13, 2025 ?","o":["Akkineni Nageswara Rao","Kota Srinivasa Rao","SV Ranga Rao","Kaikala Satyanarayana"],"a":1,"e":"Kota Srinivasa Rao. He was a celebrated character actor renowned for redefining negative and supporting roles in Telugu cinema."},{"t":"Obituary","n":445,"tag":"","q":"Which veteran legal expert and former Chairman of the Karnataka Legislative Council passed away at the age of 97 on July 11, 2025 ?","o":["SR Bommai","N. Tippanna","DH Shankaramurthy","K. Ramesh Kumar"],"a":1,"e":"N. Tippanna. He was a respected legal luminary in Karnataka, known for his long-standing contributions to the legal profession and public life."},{"t":"Obituary","n":446,"tag":"","q":"Which international cricket umpire from Afghanistan, known for officiating in multiple ODIs and T20Is, passed away at the age of 41?","o":["Bismillah Jan Shinwari","Ahmed Shah Pakteen","Asad Rauf","Ahsan Raza"],"a":0,"e":"Bismillah Jan Shinwari, an international cricket umpire from Afghanistan, passed away at the age of 41. He had officiated in numerous ODIs and T20Is and was a member of the ICC’s International Panel."},{"t":"Obituary","n":447,"tag":"","q":"What was the name of Asia’s oldest elephant, who passed away at over 100 years old in Panna Tiger Reserve, Madhya Pradesh?","o":["Ganga","Lakshmi","Vatsala","Meenakshi"],"a":2,"e":"Vatsala was a revered female Asian elephant residing in Madhya Pradesh’s Panna Tiger Reserve."},{"t":"Obituary","n":448,"tag":"","q":"Which Nigerian football legend and former goalkeeper, part of the 1994 AFCON-winning team, passed away at the age of 61 on July 4, 2025?","o":["Vincent Enyeama","Peter Rufai","Jay-Jay Okocha","Nwankwo Kanu"],"a":1,"e":"Peter Rufai, one of Nigeria’s most celebrated goalkeepers, was part of the Super Eagles squad that won the 1994 Africa Cup of Nations and featured in the 1994 and 1998 FIFA World Cups."},{"t":"Obituary","n":449,"tag":"","q":"Which Australian actor, known for roles in ‘Fantastic Four’, ‘Nip/Tuck’, and ‘Charmed’, passed away at the age of 56?","o":["Hugh Jackman","Julian McMahon","Eric Bana","Simon Baker"],"a":1,"e":"Julian McMahon, a renowned Australian actor, passed away at the age of 56 after a battle with cancer."},{"t":"Obituary","n":450,"tag":"","q":"Which renowned Indian hypnotist and motivational expert, known for promoting psychological wellness, passed away at the age of 75 on July 1, 2025 ?","o":["Dr. BV Pattabhiram","Dr. Deepak Chopra","Dr. Rajiv Menon","Dr. Sudhir Kakar"],"a":0,"e":"Dr. BV Pattabhiram. He was widely respected for his work in promoting psychological wellness through hypnosis, personality development, and motivational speaking."},{"t":"Obituary","n":451,"tag":"","q":"Which former Indian left-arm spinner, known for his international career between 1979 and 1983, passed away at the age of 77 in London ?","o":["Bishan Singh Bedi","Dilip Doshi","Maninder Singh","Ravi Shastri"],"a":1,"e":"Dilip Doshi, former Indian left-arm spinner, passed away at the age of 77 in London on June 23, 2025."},{"t":"Obituary","n":452,"tag":"","q":"Which Padma Shri awardee, known as ‘Aranya Rishi’ for his environmental and literary contributions, passed away at the age of 93 in Solapur?","o":["Anil Agarwal","Rajendra Singh","Maruti Chitampalli","Sundarlal Bahuguna"],"a":2,"e":"Maruti Chitampalli."},{"t":"Obituary","n":453,"tag":"","q":"Which renowned ISRO scientist and Tamil author, known for writing over 170 books, passed away at the age of 74 in Thiruvananthapuram?","o":["Dr. K. Sivan","Nellai Su. Muthu","Dr. Mayilsamy Annadurai","Dr. Mylswamy Mylswamy"],"a":1,"e":"Nellai Su. Muthu , a noted ISRO scientist and Tamil author, passed away at 74 in Thiruvananthapuram on June 16, 2025. He worked at the Satish Dhawan Space Centre and wrote over 170 books, mainly on science and literature."},{"t":"Obituary","n":454,"tag":"","q":"Which Kashmiri music legend, also known as ‘Hamle Bulbul’ and renowned for his mastery of the sarangi, passed away on June 11, 2025 ?","o":["Ustad Allarakha","Ustad Ghulam Nabi Shah","Ustad Shahid Parvez","Ustad Imrat Khan"],"a":1,"e":"Ustad Ghulam Nabi Shah. He was known for popularizing Kashmiri folk traditions like Bacha Nagma and the unique ‘glass’ dance."},{"t":"Obituary","n":455,"tag":"","q":"Which veteran Urdu newsreader of All India Radio, known for his iconic voice in Indian radio broadcasting, passed away at the age of 76 in New Delhi?","o":["Shakeel Akhtar","Salim Akhtar","Anwar Hussain","Mazhar Ali"],"a":1,"e":"Salim Akhtar."},{"t":"Obituary","n":456,"tag":"","q":"Which pioneering Apple designer, known for innovations like QuickDraw and the graphical desktop interface, passed away at the age of 74?","o":["Steve Wozniak","Bill Atkinson","Jef Raskin","Jonathan Ive"],"a":1,"e":"Bill Atkinson, a key Apple designer, passed away at 74 on June 5, 2025. He created QuickDraw, MacPaint, and HyperCard, and introduced key GUI features like pull-down menus."},{"t":"Rankings & Indices","n":457,"tag":"SSC Stenographer 7/08/2025 (Shift 3)","q":"Which of the following statement is incorrect regarding global indices as of July 2025?","o":["The World Happiness Report 2024 highlights social support, life expectancy, and GDP per capita as key happiness factors.","AQI consistently above 200 signals general health risks and requires urgent policy action.","Despite being discontinued, the Ease of Doing Business report remains influential for investors assessing startup procedures.","A rise in GNI per capita alone can significantly improve HDI, even with falling life expectancy and education."],"a":2,"e":"The Ease of Doing Business Report was discontinued in September 2021 due to data irregularities. By 2025, it no longer holds real influence for investors; newer frameworks and indices are being used instead. The World Happiness Report 2024 indeed lists GDP per capita, social support, and healthy life expectancy among the key factors of happiness. An AQI above 200 is classified as very unhealthy, posing risks to all groups and requiring urgent policy response. The Human Development Index (HDI) is a composite of health, education, and income. A rise in GNI per capita alone cannot significantly raise HDI if life expectancy and education fall."},{"t":"Rankings & Indices","n":458,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"What is the score of India in Corruption Perception Index published by Transparency International?","o":["38","48","150","300"],"a":0,"e":"38. According to the 2024 Corruption Perception Index (CPI) released by Transparency International, India scored 38. The CPI ranks 180 countries and territories by their perceived levels of public sector corruption on a scale of 0 (highly corrupt) to 100 (very clean). This score placed India at the 96th position out of 180 countries."},{"t":"Rankings & Indices","n":459,"tag":"SSC Stenographer 8/08/2025 (Shift 2)","q":"In the Climate Change Performance Index 2025, why did India retain a top-10 spot unlike several developed economies?","o":["High renewable energy share and low per capita emissions","Lack of net-zero policy","Aggressive fossil fuel expansion","High energy consumption per capita"],"a":0,"e":"India has maintained a high ranking in the Climate Change Performance Index (CCPI) primarily because the index gives significant weight to the country's relatively low per capita greenhouse gas emissions and energy use compared to developed nations. Additionally, India has shown strong progress and commitment to expanding its renewable energy sector, particularly in solar power. This combination of low individual emissions and a positive trajectory on renewables places it ahead of many developed economies whose per capita emissions and historical contributions to climate change are much higher."},{"t":"Rankings & Indices","n":460,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"India's improvement in the Rule of Law Index is most critically challenged by which factor?","o":["Slow judicial delivery","Legislative overreach","Executive dominance","Media bias"],"a":0,"e":"Slow judicial delivery. The Rule of Law Index (by World Justice Project) assesses countries on constraints on government powers, absence of corruption, open government, fundamental rights, order and security, regulatory enforcement, civil justice, and criminal justice. In India, the biggest bottleneck remains slow judicial delivery due to a high backlog of cases, delays in trials, and inadequate judicial infrastructure."},{"t":"Rankings & Indices","n":461,"tag":"SSC Stenographer 8/08/2025 (Shift 3)","q":"Which region has become the new epicenter of global terrorism, according to the GTI (Global Terrorism Index) 2024?","o":["Southeast Asia","Central Sahel region of sub-Saharan Africa","Central Asia","Middle East and North Africa"],"a":1,"e":"Central Sahel region of sub-Saharan Africa. The Global Terrorism Index (GTI) 2024, released by the Institute for Economics and Peace (IEP), shows a rise in terrorism's spread despite a fall in the number of attacks and fatalities overall, with the Sahel region becoming a major epicentre. Key findings include Burkina Faso ranking as the most impacted country, while India is at 14th place."},{"t":"Rankings & Indices","n":462,"tag":"","q":"What is India's rank in the Henley Passport Index as of July 2025?","o":["85","80","77","70"],"a":2,"e":"77. India jumped 8 spots from 85th to 77th in the Henley Passport Index 2025. Countries in Henley Passport Index 2025: Rank 1 - Singapore. Rank 2 - Japan, South Korea."},{"t":"Rankings & Indices","n":463,"tag":"","q":"Who topped the Avendus Wealth – Hurun India U30 List 2025 as India’s youngest entrepreneurs?","o":["Devika Gholap & Ananyashree Birla","Arjun Deshpande & Mihir Menda","Aadit Palicha & Kaivalya Vohra (Zepto)","Swish co‑founders"],"a":2,"e":"Aadit Palicha & Kaivalya Vohra (Zepto). At age 22, the young co‑founders of Zepto led the inaugural U30 ranking based on quick‑commerce innovation and scale. 79 entrepreneurs under 30 were featured in the U30 list 2025."},{"t":"Rankings & Indices","n":464,"tag":"","q":"Which city was ranked as the most affordable student city in the world in the QS Best Student Cities 2026 rankings?","o":["Mumbai","Bengaluru","Chennai","Delhi"],"a":3,"e":"Delhi attained a near‑perfect affordability score of 96.5, securing the top spot globally for student affordability. QS Best Student Cities Rankings 2026 saw four major Indian cities—Delhi, Mumbai, Bengaluru, and Chennai"},{"t":"Rankings & Indices","n":465,"tag":"","q":"Who became the first and only Indian creator featured in TIME Magazine’s inaugural TIME 100 Creators List 2025?","o":["Kusha Kapila","Prajakta Koli","Dolly Singh","Sejal Kumar"],"a":1,"e":"Prajakta Koli."},{"t":"Rankings & Indices","n":466,"tag":"","q":"Assertion (A): The United States ranked as the world's largest tourism economy for 2024–25.\nReason (R): India achieved the 8th position in the same list, showing an improvement from its previous rank. Choose the correct option:","o":["Both A and R are true and R is the correct explanation of A.","Both A and R are true but R is not the correct explanation of
