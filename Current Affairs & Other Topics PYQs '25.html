A.","A is true but R is false.","A is false but R is true."],"a":1,"e":"The U.S. remained the world’s largest tourism economy with a contribution of USD 2.36 trillion. India rose to the 8th position, up from 10th in the previous year. The top 5 are: USA, China, Germany, Japan, and the UK."},{"t":"Rankings & Indices","n":467,"tag":"","q":"When was the 2nd edition of the NER District SDG Index (2023–24) officially released?","o":["July 1, 2025","July 7, 2025","June 30, 2025","August 1, 2025"],"a":1,"e":"July 7, 2025. The index shows how 121 districts from eight North East states are performing on Sustainable Development Goals (SDGs). All districts in Mizoram, Sikkim, and Tripura achieved Front Runner status, meaning they scored between 65 and 99 points."},{"t":"Rankings & Indices","n":468,"tag":"","q":"Which country topped the UN SDG Index 2025 with a score of 87.0?","o":["Sweden","Denmark","Finland","Germany"],"a":2,"e":"Finland. South Sudan ranks last (167th) in the SDG Index 2025 among 167 nations. India made history by entering the top 100 countries in the SDG index for the first time in 2025."},{"t":"Rankings & Indices","n":469,"tag":"","q":"Consider the following statements regarding the global unicorn landscape in 2025:\n1. According to the Hurun Global Unicorn Index 2025, the U.S. has 900 unicorns.\n2. India is ranked as the second-largest unicorn hub globally. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","Neither 1 nor 2","2 only"],"a":2,"e":"Neither 1 nor 2. The U.S. topped the Hurun Global Unicorn Index 2025 with 758 unicorns, nearly half of the global total. India is the third-largest unicorn hub, with 64 unicorns in 2025."},{"t":"Rankings & Indices","n":470,"tag":"","q":"Assertion (A): Japan was the largest foreign holder of the U.S. Treasury securities by the end of 2024.\nReason (R): Japan held approximately $1.1 trillion in U.S. debt, constituting about 12.4% of all foreign-owned U.S. debt. Choose the correct option:","o":["Both A and R are true and R is the correct explanation of A.","Both A and R are true but R is not the correct explanation of A.","A is true but R is false.","A is false but R is true."],"a":0,"e":"Both A and R are true and R is the correct explanation of A."},{"t":"Rankings & Indices","n":471,"tag":"","q":"Over the past five years (2019–2024), which two countries surpassed India in power generation capacity growth?","o":["China & Germany","China & USA","USA & Japan","China & Japan"],"a":1,"e":"China & USA. India recorded the third-highest growth in power generation capacity globally, only behind China and the United States"},{"t":"Rankings & Indices","n":472,"tag":"","q":"How many Indian universities entered the global top 100 in Times Higher Education (THE) Impact Rankings 2025?","o":["2","3","4","5"],"a":2,"e":"4. These four countries are : Amrita Vishwa Vidyapeetham (Tamil Nadu), Lovely Professional University (LPU) (Punjab), JSS Academy of Higher Education (Karnataka), Shoolini University (Himachal Pradesh)."},{"t":"Rankings & Indices","n":473,"tag":"","q":"What is India’s rank in the Global Gender Gap Index 2025?","o":["129","130","131","140"],"a":2,"e":"131. India slipped by two places from its 2024 position, moving from 129th to 131st among 148 countries."},{"t":"Rankings & Indices","n":474,"tag":"","q":"Which Indian city entered the global top 10 startup cities in 2025?","o":["Mumbai","New Delhi","Bengaluru","Hyderabad"],"a":2,"e":"Bengaluru."},{"t":"Rankings & Indices","n":475,"tag":"","q":"What was India’s rank in the Climate Change Performance Index 2025?","o":["8","9","10","11"],"a":2,"e":"10."},{"t":"Rankings & Indices","n":476,"tag":"","q":"Which country ranks first in technological innovation in 2025 ?","o":["China","United States","Japan","Germany"],"a":1,"e":"United States. India’s (Rank 9) innovation is booming in 2025, led by talent, R&D, and start-ups. With strengths in tech, space, and digital platforms like Aadhaar and UPI, India is emerging as a global innovation hub."},{"t":"Rankings & Indices","n":477,"tag":"","q":"What was India's Total Fertility Rate (TFR) according to the SRS 2021 report ?","o":["1.8","2.0","2.2","2.5"],"a":1,"e":"2.0. Bihar reported the highest TFR at 3.0, well above the national average."},{"t":"Rankings & Indices","n":478,"tag":"","q":"Which state ranked first in the Fiscal Health Index 2025 released by NITI Aayog ?","o":["Gujarat","Maharashtra","Odisha","Chhattisgarh"],"a":2,"e":"Odisha. The FHI included Quality of Expenditure, Revenue Mobilization, Fiscal Prudence, Debt Index, and Debt Sustainability."},{"t":"Rankings & Indices","n":479,"tag":"","q":"According to the Global Methane Tracker 2025, how much methane is emitted annually from energy-related sources ?","o":["60 million tonnes","90 million tonnes","100 million tonnes","Over 120 million tonnes"],"a":3,"e":"Over 120 million tonnes. The fossil fuel sector (including oil, gas, and coal) is the leading contributor to methane emissions, accounting for nearly one-third of human-induced emissions."},{"t":"Rankings & Indices","n":480,"tag":"","q":"What is India's rank in the 2025 Human Development Index (HDI) as per the United Nations Development Programme (UNDP) ?","o":["128","130","132","134"],"a":1,"e":"130. India improved its HDI ranking from 133 in 2022 to 130 in 2023, among 193 countries. Top 3 Countries : Iceland (0.9722), Norway (0.970), Switzerland (0.970)."},{"t":"Rankings & Indices","n":481,"tag":"","q":"Which state ranked highest among large and mid-sized states in the India Justice Report 2025 ?","o":["Tamil Nadu","Kerala","Karnataka","Andhra Pradesh"],"a":2,"e":"Karnataka. Sikkim continued to lead among small states (population under 1 crore), reflecting overall efficiency across the justice pillars."},{"t":"Rankings & Indices","n":482,"tag":"","q":"Which state secured the top position in the CareEdge State Rankings 2025 ?","o":["Gujarat","Karnataka","Maharashtra","Tamil Nadu"],"a":2,"e":"Maharashtra. It topped the rankings based on economic, fiscal, infrastructure, social, and environmental indicators. Gujarat ranked second, followed by Karnataka in third."},{"t":"Rankings & Indices","n":483,"tag":"","q":"Which family topped Bloomberg's list of Asia's wealthiest families in 2025 ?","o":["Chearavanont (Thailand)","Hartono (Indonesia)","Ambani (India)","Kwok (Hong Kong)"],"a":2,"e":"Ambani (India). Six Indian families made it to the top 20: Ambani, Mistry, Jindal, Birla, Bajaj, and Hinduja."},{"t":"Rankings & Indices","n":484,"tag":"","q":"Consider the following statements regarding global military spending in 2024:\n1. India ranked as the third largest military spender globally.\n2. India's military expenditure in 2024 showed an increase compared to the previous year. Which of the statements given above is/are correct?","o":["1 only","1 and 2 only","Neither 1 nor 2","Only 2"],"a":3,"e":"Only 2. According to the Stockholm International Peace Research Institute (SIPRI), India ranked as the fifth-largest military spender in the world in 2024, with an expenditure of $86.1 billion, marking a 1.6% increase from the previous year. The United States remained the top military spender in 2024."},{"t":"Rankings & Indices","n":485,"tag":"","q":"Which organization released the Hindu Kush ICIMOD 2025 Report ?","o":["UNEP","ICIMOD","UNDP","WWF"],"a":1,"e":"ICIMOD. The report highlights snow loss in the Hindu Kush Himalaya. The International Centre for Integrated Mountain Development (ICIMOD) is based in Kathmandu and focuses on sustainable mountain development."},{"t":"Important Days","n":486,"tag":"","q":"What is the theme of World Hepatitis Day 2025 ?","o":["Hepatitis Can’t Wait","Hepatitis: Know It, Confront It","Hepatitis: Let’s Break It Down","Eliminate Hepatitis by 2030"],"a":2,"e":"Hepatitis: Let’s Break It Down. World Hepatitis Day is observed every year on 28th July, marking the birth anniversary of Dr. Baruch Blumberg, the discoverer of the Hepatitis B virus."},{"t":"Important Days","n":487,"tag":"","q":"Which of the following statements about July 24 in India is NOT correct?","o":["July 24 is observed as Income Tax Day.","Income tax was introduced in India in 1860.","Sir James Wilson introduced income tax to address losses from the 1857 War.","July 24 marks the adoption of the Goods and Services Tax (GST)."],"a":3,"e":"July 24 marks the day in 1860 when income tax was first introduced in India by Sir James Wilson."},{"t":"Important Days","n":488,"tag":"","q":"What is observed on July 23 every year in India to commemorate the first-ever radio broadcast and celebrate the country’s rich broadcasting legacy?","o":["World Press Freedom Day","National Broadcasting Day","National Journalism Day","International Radio Day"],"a":1,"e":"National Broadcasting Day. National Broadcasting Day is observed annually on July 23 to mark the first-ever radio broadcast in India by the Indian Broadcasting Company (IBC) from Bombay in 1927."},{"t":"Important Days","n":489,"tag":"","q":"Consider the following statements regarding National Flag Day in India:\n1. National Flag Day is observed on July 22 every year.\n2. The day commemorates the adoption of the Indian National Flag by the Constituent Assembly in 1950.\n3. The tricolour symbolizes India’s values of courage, peace, and prosperity. Which of the statements given above is/are correct?","o":["1 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"a":1,"e":"1 and 3 only. National Flag Day is observed on July 22 to mark the historic adoption of the Indian National Flag (Tiranga) by the Constituent Assembly in 1947, just weeks before India’s independence. The tricolour symbolizes India’s values of courage, peace, and prosperity."},{"t":"Important Days","n":490,"tag":"","q":"What is the theme of World Brain Day 2025, observed on July 22?","o":["Mind Matters at Every Age","Brain Health for All Ages","Lifelong Neuro Wellness","Healthy Brains, Strong Lives"],"a":1,"e":"Brain Health for All Ages. World Brain Day 2025, led by the World Federation of Neurology, carries the theme “Brain Health for All Ages”— emphasizing the need to support neurological wellbeing at every life stage, from childhood through old age."},{"t":"Important Days","n":491,"tag":"","q":"When is International Moon Day observed, and what does it commemorate?","o":["July 20 – To mark the launch of Apollo 11","July 19 – To celebrate the Moon’s discovery","July 19 – To commemorate the first human landing on the Moon","July 21 – To promote space tourism"],"a":2,"e":"International Moon Day is observed annually on July 20 to mark the Apollo 11 landing in 1969. Its 2025 theme, “One Moon, One Vision, One Future”, highlights global unity and future lunar cooperation."},{"t":"Important Days","n":492,"tag":"","q":"When is World Chess Day celebrated each year?","o":["July 16","July 18","July 19","July 20"],"a":3,"e":"July 20. World Chess Day is observed every year on July 20, marking the founding of the International Chess Federation (FIDE) in 1924."},{"t":"Important Days","n":493,"tag":"","q":"Nelson Mandela International Day is observed annually on which date?","o":["July 15","July 17","July 18","July 19"],"a":2,"e":"July 18. This day marks Nelson Mandela’s birthday and is observed globally as Nelson Mandela International Day to honour his legacy of peace, freedom, and justice."},{"t":"Important Days","n":494,"tag":"","q":"On which date is the World Day for International Justice observed annually?","o":["July 15","July 17","July 18","July 20"],"a":1,"e":"July 17. The World Day for International Justice is observed every year on July 17 to mark the adoption of the Rome Statute in 1998, which established the International Criminal Court (ICC)."},{"t":"Important Days","n":495,"tag":"","q":"On which date was World Snake Day 2025 celebrated with a conservation awareness event at Bannerghatta Biological Park?","o":["July 15","July 16","July 17","July 18"],"a":2,"e":"July 17."},{"t":"Important Days","n":496,"tag":"","q":"When is AI Appreciation Day observed in India to celebrate advancements in Artificial Intelligence across sectors?","o":["July 15","July 16","July 17","July 18"],"a":1,"e":"July 16. India observes AI Appreciation Day on July 16 to highlight the role of Artificial Intelligence in transforming sectors like healthcare, education, agriculture, governance, and industry. The Digital India mission (2015) and NITI Aayog’s National AI Strategy (2018) provided strong policy frameworks that accelerated AI adoption across the country."},{"t":"Important Days","n":497,"tag":"","q":"When is World Youth Skills Day celebrated to promote skill development among youth, especially in AI and digital technologies in 2025?","o":["July 14","July 15","July 16","July 17"],"a":1,"e":"July 15. World Youth Skills Day is observed annually on July 15 to emphasize the importance of equipping young people with skills, and in 2025, the focus was on AI and digital empowerment. The United Nations General Assembly declared July 15th as World Youth Skills Day in 2014."},{"t":"Important Days","n":498,"tag":"","q":"When is World Population Day 2025 observed?","o":["July 10","July 11","July 12","July 13"],"a":1,"e":"July 11. World Population Day is observed every year on July 11; this traces back to the world population reaching five billion on July 11, 1987."},{"t":"Important Days","n":499,"tag":"","q":"On which date was the 125th birth anniversary of Dr. Syama Prasad Mookerjee observed in 2025?","o":["July 5","July 6","July 9","July 11"],"a":1,"e":"July 6. Dr. Mookerjee was born on July 6, 1901, so his 125th birth anniversary was commemorated on July 6, 2025. The Government declared a two ‑ year nationwide commemoration (July 2025 – July 2027) honoring his legacy across all states and union territories"},{"t":"Important Days","n":500,"tag":"","q":"Consider the following statements regarding Guru Purnima 2025:\n1. Guru Purnima commemorates the birth anniversary of Ved Vyasa, who compiled the Vedas and authored the Mahabharata.\n2. In 2025, Guru Purnima will be observed on July 10. Which of the above statements is/are correct?","o":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"a":2,"e":"Both 1 and 2. Guru Purnima is celebrated in honor of Ved Vyasa, and in 2025, it falls on July 10."}]};
const LS='currentAffairsQuizV1';
let state={};try{state=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}};
const byTopic={};DATA.topics.forEach(t=>byTopic[t]=[]);DATA.qs.forEach(q=>byTopic[q.t].push(q));
let current=DATA.topics[0];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HL=/(\b\d{1,2}(?:st|nd|rd|th)?\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)(?:\s+\d{4})?|\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2}(?:,\s*\d{4})?|(?:Rs\.?|₹|\$|US\$)\s?[\d,\.]+(?:\s?(?:crore|lakh|billion|million|trillion))?|\b\d+(?:\.\d+)?\s?(?:%|per cent|crore|lakh|billion|million|km|MW|GW|kg)|Ministry of [A-Z][A-Za-z&]+(?:\s(?:and|of|&)?\s?[A-Z][A-Za-z&]+)*|\b(?:19[5-9]\d|20[0-3]\d)\b)/g;
const ABBR=/(?:Dr|Mr|Mrs|Ms|Shri|St|No|Art|Sh|vs|Prof|Smt|Hon|B|K|M|N|C|R|S|T|D|V|G|H|P|J|A|L|E|F|U)$/;
function fmtExp(t){
  let s=esc(t),cut=-1;
  const re=/\.\s+(?=[A-Z])/g;let m;
  while((m=re.exec(s))){const pre=s.slice(0,m.index);const w=pre.split(/\s+/).pop();if(!ABBR.test(w)&&!/\.[A-Z]$/.test(w)){cut=m.index+1;break}}
  let head='',rest=s;
  if(cut>0&&cut<=170){head=s.slice(0,cut);rest=s.slice(cut)}
  const hl=x=>x.replace(HL,'<mark>$1</mark>');
  return (head?'<strong>'+hl(head)+'</strong>':'')+hl(rest);
}
function stats(t){const a=state[t]||{};const qs=byTopic[t];let ans=0,ok=0;qs.forEach(q=>{if(a[q.n]!==undefined){ans++;if(a[q.n]===q.a)ok++}});return{ans,ok,total:qs.length}}
function renderTabs(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  DATA.topics.forEach(t=>{
    const b=document.createElement('button');b.className='tab'+(t===current?' active':'');
    b.innerHTML='<span class="n">'+byTopic[t].length+'</span><span class="l">'+esc(t)+'</span>';
    b.onclick=()=>{current=t;renderTabs();render();window.scrollTo({top:0,behavior:'auto'})};
    nav.appendChild(b);
  });
  const act=nav.querySelector('.active');if(act)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function updateSummary(){
  const s=stats(current);const el=document.getElementById('sum');if(!el)return;
  el.querySelector('.stats').innerHTML='Answered <b>'+s.ans+'/'+s.total+'</b> &middot; Correct <b>'+s.ok+'</b>'+(s.ans?' &middot; Accuracy <b>'+Math.round(100*s.ok/s.ans)+'%</b>':'');
  el.querySelector('.bar i').style.width=(100*s.ans/s.total)+'%';
}
function render(){
  const main=document.getElementById('main');const qs=byTopic[current];
  main.innerHTML='<div class="summary" id="sum"><h2>'+esc(current)+'</h2><button class="reset">Reset</button><div class="stats"></div><div class="bar"><i></i></div></div>';
  main.querySelector('.reset').onclick=()=>{if(confirm('Reset your answers for this topic?')){delete state[current];save();render()}};
  const a=state[current]||{};
  qs.forEach((q,i)=>{
    const card=document.createElement('article');card.className='q';
    const sel=a[q.n];
    let h='<div class="qhead"><span class="qno">Q'+(i+1)+'</span>'+(q.tag?'<span class="src">'+esc(q.tag)+'</span>':'')+'</div><p class="stem">'+esc(q.q)+'</p><div class="opts">';
    q.o.forEach((o,j)=>{h+='<button class="opt" data-j="'+j+'"><span class="k">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></button>'});
    h+='</div><div class="exp"></div>';card.innerHTML=h;
    const apply=(j,animate)=>{
      card.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');else if(k===j)b.classList.add('wrong');else b.classList.add('dim')});
      const e=card.querySelector('.exp');const ok=j===q.a;
      e.innerHTML='<div class="verdict '+(ok?'ok':'no')+'">'+(ok?'&#10003; Correct':'&#10007; Incorrect &mdash; correct answer: '+'ABCD'[q.a])+'</div>'+fmtExp(q.e);
      e.classList.add('show');
    };
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;(state[current]=state[current]||{})[q.n]=j;save();apply(j);updateSummary();
    });
    if(sel!==undefined)apply(sel);
    main.appendChild(card);
  });
  updateSummary();
}
document.getElementById('total').textContent=DATA.qs.length+' questions';
const topBtn=document.getElementById('top');
window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>300),{passive:true});
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
renderTabs();render();
</script>
</body>
