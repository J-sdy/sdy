 21 October 1948, and the final draft was introduced on 4 November 1948.", "globalNum": 125}, {"tab": "t5", "tabTitle": "5. Committees", "q": "When was the 2nd Draft published, and when did Ambedkar introduce the final draft in the Assembly?", "options": ["2nd Draft: 21 October 1948; Final draft introduced: 4 November 1948", "2nd Draft: 4 November 1948; Final draft introduced: 21 October 1948", "2nd Draft: 21 February 1948; Final draft introduced: 26 November 1949", "2nd Draft: 26 November 1949; Final draft introduced: 21 February 1948"], "answer": 0, "explanation": "Correct: The 2nd Draft was published on 21 October 1948, and Ambedkar introduced the final draft in the Assembly on 4 November 1948. This sequence follows the earlier 1st Draft (21 Feb 1948).", "globalNum": 126}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Which minor committees, among others, were headed by Dr. Rajendra Prasad?", "options": ["Finance and Staff Committee, Credentials Committee, and Ad-hoc Committee on the National Flag", "Order of Business Committee and House Committee", "Committee on the Functions of the Constituent Assembly and Linguistic Provinces Commission", "Ad-hoc Committee on the Supreme Court and Ad-hoc Committee on Citizenship"], "answer": 0, "explanation": "Correct: Prasad headed the Finance and Staff Committee, Credentials Committee, and the Ad-hoc Committee on the National Flag, among his several roles. The other committees listed were headed by Munshi, Sitaramayya, Mavalankar, S.K. Dhar, or Varadachariar.", "globalNum": 127}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the House Committee and the Committee on Chief Commissioners Provinces?", "options": ["B. Pattabhi Sitaramayya", "Dr. K.M. Munshi", "G. V. Mavalankar", "S. Varadachariar"], "answer": 0, "explanation": "Correct: B. Pattabhi Sitaramayya headed both the House Committee and the Committee on Chief Commissioners Provinces. Munshi headed the Order of Business Committee; Mavalankar headed the Committee on the Functions of the Constituent Assembly; Varadachariar headed two Ad-hoc committees (Supreme Court and Citizenship).", "globalNum": 128}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the Order of Business Committee, and who headed the Committee on the Functions of the Constituent Assembly?", "options": ["Dr. K.M. Munshi (Order of Business); G. V. Mavalankar (Functions of the Constituent Assembly)", "G. V. Mavalankar (Order of Business); Dr. K.M. Munshi (Functions of the Constituent Assembly)", "B. Pattabhi Sitaramayya (Order of Business); S. Varadachariar (Functions of the Constituent Assembly)", "Nalini Ranjan Sarkar (Order of Business); S.K. Dhar (Functions of the Constituent Assembly)"], "answer": 0, "explanation": "Correct: Dr. K.M. Munshi headed the Order of Business Committee, and G. V. Mavalankar headed the Committee on the Functions of the Constituent Assembly. The other names headed unrelated minor committees (House Committee, Ad-hoc committees, Financial Provisions expert committee).", "globalNum": 129}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed both the Ad-hoc Committee on the Supreme Court and the Ad-hoc Committee on Citizenship?", "options": ["S. Varadachariar", "Nalini Ranjan Sarkar", "S. K. Dhar", "Usha Nath Sen"], "answer": 0, "explanation": "Correct: S. Varadachariar headed both these Ad-hoc committees. Nalini Ranjan Sarkar instead headed the Expert Committee on Financial Provisions; S.K. Dhar headed the Linguistic Provinces Commission; Usha Nath Sen headed the Press Gallery Committee.", "globalNum": 130}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the Expert Committee on the Financial Provisions of the Union Constitution, and who headed the Special Committee to Examine the Draft Constitution?", "options": ["Nalini Ranjan Sarkar (Financial Provisions); J. L. Nehru (Examine Draft Constitution)", "J. L. Nehru (Financial Provisions); Nalini Ranjan Sarkar (Examine Draft Constitution)", "S. K. Dhar (Financial Provisions); Usha Nath Sen (Examine Draft Constitution)", "B. Pattabhi Sitaramayya (Financial Provisions); S. Varadachariar (Examine Draft Constitution)"], "answer": 0, "explanation": "Correct: Nalini Ranjan Sarkar headed the Expert Committee on Financial Provisions, while J. L. Nehru additionally headed the Special Committee to Examine the Draft Constitution. The other names held unrelated minor committee roles.", "globalNum": 131}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the Linguistic Provinces Commission, and who headed the Press Gallery Committee?", "options": ["S. K. Dhar (Linguistic Provinces Commission); Usha Nath Sen (Press Gallery Committee)", "Usha Nath Sen (Linguistic Provinces Commission); S. K. Dhar (Press Gallery Committee)", "G. V. Mavalankar (Linguistic Provinces Commission); K.M. Munshi (Press Gallery Committee)", "S. Varadachariar (Linguistic Provinces Commission); Nalini Ranjan Sarkar (Press Gallery Committee)"], "answer": 0, "explanation": "Correct: S. K. Dhar headed the Linguistic Provinces Commission, and Usha Nath Sen headed the Press Gallery Committee — both minor committees. The other names in the wrong options headed different major/minor committees entirely.", "globalNum": 132}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Besides various foreign constitutions, which specific Act is named as a key source that the Indian Constitution draws upon?", "options": ["Government of India Act, 1935", "Government of India Act, 1919", "Indian Independence Act, 1947", "Regulating Act, 1773"], "answer": 0, "explanation": "Correct: The notes specifically name the Government of India Act, 1935 as a major source, alongside various foreign constitutions. The 1919 Act, the Indian Independence Act, and the Regulating Act are earlier/later Acts not listed as constitutional sources here.", "globalNum": 133}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Which features did India borrow from the UK Constitution?", "options": ["Parliamentary system, bicameral legislature, rule of law, cabinet system, and prerogative writs like habeas corpus", "Fundamental Rights and judicial review", "DPSP and the President's election method", "Federal structure with strong Centre"], "answer": 0, "explanation": "Correct: From the UK, India borrowed the parliamentary system, bicameral legislature (LS & RS), rule of law, legislative procedure, single citizenship, cabinet system, the Speaker's role, parliamentary privileges, and prerogative writs. Fundamental Rights and judicial review came from the USA; DPSP and the President's election method from Ireland; the strong-Centre federal structure from Canada.", "globalNum": 134}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Which of these features came from the USA?", "options": ["Fundamental Rights, Independence of Judiciary, Judicial Review, and separation of powers", "Concurrent List and freedom of trade/commerce", "Fundamental Duties and emergency powers", "Federal structure with residuary powers to the Centre"], "answer": 0, "explanation": "Correct: From the USA, India borrowed Fundamental Rights, an independent judiciary, judicial review, a written Constitution, the Preamble, the offices of President & Vice-President, the impeachment procedure, removal process for SC/HC judges, and separation of powers. The Concurrent List came from Australia, Fundamental Duties from Russia (USSR), and residuary powers to the Centre from Canada.", "globalNum": 135}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "From Ireland, India borrowed which features?", "options": ["DPSP, nomination of members to Rajya Sabha by the President, and the method of election of the President", "Concurrent List and joint sitting of Houses", "Fundamental Duties and Preamble ideals of justice", "Procedure established by law"], "answer": 0, "explanation": "Correct: From Ireland came DPSP, the President's power to nominate Rajya Sabha members, and the method of electing the President. The Concurrent List and joint sitting came from Australia, Fundamental Duties from the USSR, and 'procedure established by law' from Japan.", "globalNum": 136}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Canada is the source for which features of the Indian Constitution?", "options": ["Federal structure with a strong Centre, residuary powers vested in the Centre, and advisory jurisdiction of the Supreme Court", "DPSP and Preamble ideals", "Fundamental Duties and social/economic justice ideals", "Republican form of government"], "answer": 0, "explanation": "Correct: Canada is the source of a federal structure with a strong Centre, residuary powers vested in the Centre, Centre-appointed Governors, the Supreme Court's advisory jurisdiction, and the quasi-federal nature of the Constitution. DPSP came from Ireland, Fundamental Duties from the USSR, and the republican form of government from France.", "globalNum": 137}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "From Australia, India adopted which features?", "options": ["Concurrent List, freedom of trade/commerce, and joint sitting of the two Houses to resolve deadlock", "Emergency powers and Fundamental Rights suspension", "Procedure established by law", "Election of RS members by proportional representation"], "answer": 0, "explanation": "Correct: Australia contributed the Concurrent List, freedom of trade & commerce, and the mechanism of a joint sitting of both Houses to resolve legislative deadlocks. Emergency powers came from Weimar Germany, and proportional representation for RS elections came from South Africa.", "globalNum": 138}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Which country's (Weimar) Constitution is the source of India's emergency powers, including suspension of Fundamental Rights?", "options": ["Germany (Weimar)", "Japan", "South Africa", "Russia (USSR)"], "answer": 0, "explanation": "Correct: The Weimar Constitution of Germany is the source for India's emergency powers, including the suspension of Fundamental Rights and provisions on the proclamation and effects of Emergency. Japan is the source for 'procedure established by law'; South Africa for the amendment procedure; Russia for Fundamental Duties.", "globalNum": 139}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "South Africa is the source of which two features?", "options": ["The procedure for amending the Constitution, and election of RS members by proportional representation (single transferable vote)", "Emergency powers and Fundamental Rights suspension", "Concurrent List and joint sitting", "Republican form of government"], "answer": 0, "explanation": "Correct: South Africa contributed the Constitution's amendment procedure and the method of electing Rajya Sabha members via proportional representation (single transferable vote). Emergency powers came from Weimar Germany, the Concurrent List from Australia, and the republican form of government from France.", "globalNum": 140}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "The concept of 'Procedure established by Law' (as opposed to the US concept of 'due process of law') was borrowed from which country?", "options": ["Japan", "Ireland", "Canada", "UK"], "answer": 0, "explanation": "Correct: 'Procedure established by Law' was borrowed from Japan, deliberately contrasted with the USA's 'due process of law' concept. Ireland gave India DPSP; Canada gave a strong-Centre federal structure; the UK gave the parliamentary system.", "globalNum": 141}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Fundamental Duties and the Preamble's ideals of social, economic, and political justice were borrowed from which country?", "options": ["Russia (USSR)", "France", "Ireland", "Australia"], "answer": 0, "explanation": "Correct: Russia (USSR) is the source of Fundamental Duties and the justice-related ideals (social, economic, political) in the Preamble. France instead gave the ideals of Liberty, Equality, Fraternity and the republican form of government; Ireland gave DPSP; Australia gave the Concurrent List.", "globalNum": 142}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "From France, India borrowed which features?", "options": ["Republican form of government, and the Preamble ideals of Liberty, Equality, Fraternity", "Fundamental Duties", "DPSP and President's election method", "Federal structure with strong Centre"], "answer": 0, "explanation": "Correct: France is the source of the republican form of government and the Preamble's ideals of Liberty, Equality, and Fraternity. Fundamental Duties came from the USSR, DPSP from Ireland, and the strong-Centre federal structure from Canada.", "globalNum": 143}, {"tab": "t6", "tabTitle": "6. Sources of the Constitution", "q": "Which features did India's Constitution draw from the Government of India Act, 1935?", "options": ["Federal structure, office of Governor, Public Service Commissions, emergency provisions, and provincial autonomy", "Fundamental Rights and judicial review", "DPSP and Fundamental Duties", "Liberty, Equality, Fraternity"], "answer": 0, "explanation": "Correct: The 1935 Act contributed the federal structure, the office of Governor, Public Service Commissions, emergency provisions, administrative details (civil services, police), the judiciary system, provincial autonomy, and integrated judiciary. Fundamental Rights/judicial review came from the USA, DPSP/Fundamental Duties from Ireland/USSR respectively, and Liberty-Equality-Fraternity from France.", "globalNum": 144}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "On what date was the Constitution adopted, and what is this date celebrated as?", "options": ["26 November 1949, celebrated as 'Constitution Day'", "26 January 1950, celebrated as 'Constitution Day'", "15 August 1947, celebrated as 'Constitution Day'", "2 October 1949, celebrated as 'Constitution Day'"], "answer": 0, "explanation": "Correct: The Constitution was adopted on 26 November 1949 (also the last session day), celebrated as Constitution Day. 26 January 1950 is instead Republic Day, when the Constitution was enforced.", "globalNum": 145}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "On what date did the Constitution come into force/commence, and what is this date celebrated as?", "options": ["26 January 1950, celebrated as 'Republic Day'", "26 November 1949, celebrated as 'Republic Day'", "15 August 1947, celebrated as 'Republic Day'", "1 January 1950, celebrated as 'Republic Day'"], "answer": 0, "explanation": "Correct: The Constitution was enforced/commenced on 26 January 1950, celebrated as Republic Day. 26 November 1949 is instead Constitution Day, the adoption date.", "globalNum": 146}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which provisions of the Constitution came into force immediately on 26 November 1949, even before the rest of the Constitution took effect?", "options": ["Citizenship (Art 5-9), Elections (Art 324-329), and the Provisional Parliament", "Fundamental Rights (Art 12-35)", "Emergency Provisions (Art 352-360)", "DPSP (Art 36-51)"], "answer": 0, "explanation": "Correct: Citizenship provisions (Art 5-9), Elections (Art 324-329), and the Provisional Parliament came into force immediately on 26 November 1949, ahead of the general commencement on 26 January 1950. Fundamental Rights, Emergency Provisions, and DPSP all came into force only on 26 January 1950 along with the rest of the Constitution.", "globalNum": 147}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "On what date was India's membership of the Commonwealth ratified?", "options": ["26 January 1950", "26 November 1949", "15 August 1947", "2 October 1949"], "answer": 0, "explanation": "Correct: India's Commonwealth membership was ratified on 26 January 1950, the same day the Constitution was enforced and Republic Day was celebrated.", "globalNum": 148}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "When was Dr. Rajendra Prasad elected as the 1st President of India?", "options": ["May 1949", "26 January 1950", "26 November 1949", "1952"], "answer": 0, "explanation": "Correct: Dr. Rajendra Prasad was elected the 1st President of India in May 1949 — note this election happened even before the Constitution was formally adopted (Nov 1949) or enforced (Jan 1950).", "globalNum": 149}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Why was 26 January specifically chosen as the date for the Constitution's commencement?", "options": ["Because Purna Swaraj Day had been celebrated on this date, declared in 1930 following the Lahore Session of Congress (1929)", "Because it was Gandhi's birthday", "Because it marked the anniversary of the Cabinet Mission Plan", "Because it was chosen by the British monarch"], "answer": 0, "explanation": "Correct: 26 January was chosen because Purna Swaraj Day had been celebrated on this date since 1930, following the 1929 Lahore Session of Congress. It has no connection to Gandhi's birthday, the Cabinet Mission, or a British royal decision.", "globalNum": 150}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "How many Articles, Schedules, and Parts did the Constitution originally consist of, at the time of adoption?", "options": ["395 Articles, 8 Schedules, 22 Parts, and a Preamble", "395 Articles, 12 Schedules, 22 Parts", "448 Articles, 12 Schedules, 25 Parts", "395 Articles, 10 Schedules, 20 Parts"], "answer": 0, "explanation": "Correct: Originally, the Constitution had 395 Articles, 8 Schedules, 22 Parts, and a Preamble. It now has 12 Schedules after later amendments added the 9th through 12th Schedules.", "globalNum": 151}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Who was one of the speakers who addressed Parliament at midnight of 15th August 1947, according to the notes?", "options": ["Sarvepalli Radhakrishnan", "B.R. Ambedkar", "Rajendra Prasad", "Pingali Venkayya"], "answer": 0, "explanation": "Correct: Sarvepalli Radhakrishnan is named as one of the speakers who addressed Parliament at midnight of 15 August 1947. Ambedkar's noted remark in the passage is instead from 26 January 1950; Venkayya designed the flag, not a midnight speaker.", "globalNum": 152}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "On 26th January 1950, B.R. Ambedkar famously spoke of India entering 'a life of contradictions.' What contradiction did he describe?", "options": ["Political equality alongside social and economic inequality", "Religious freedom alongside economic freedom", "Federal structure alongside unitary bias", "Fundamental Rights alongside Fundamental Duties"], "answer": 0, "explanation": "Correct: Ambedkar spoke of political equality coexisting with social and economic inequality — a tension he warned India must resolve. The other pairings are not the contradiction he specifically referenced in this quote.", "globalNum": 153}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Who designed the Indian National Flag, and when/where was it approved?", "options": ["Pingali Venkayya; approved by Gandhi at a Congress meeting in Vijayawada, 1921", "H.V. Iyengar; approved in Lucknow, 1946", "Nand Lal Bose; approved in Delhi, 1947", "B.N. Rau; approved in Bombay, 1930"], "answer": 0, "explanation": "Correct: Pingali Venkayya designed the flag, approved by Mahatma Gandhi at a Congress meeting in Vijayawada in 1921. Iyengar was the Constituent Assembly's Secretary, Bose was a Constitution decorator, and Rau was the Chief Draftsman — none designed the flag.", "globalNum": 154}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Who said 'the Constituent Assembly was a conspiracy of Britishers,' and what was their background?", "options": ["Somnath Lehri, a writer/editor of the left newspaper Swadhinata", "B.R. Ambedkar, Chairman of the Drafting Committee", "H.M. Seervai, a constitutional law author", "Pingali Venkayya, the flag designer"], "answer": 0, "explanation": "Correct: Somnath Lehri, writer and editor of the left-leaning newspaper Swadhinata, made this remark. Ambedkar is instead known for a different, contradiction-themed quote; Seervai authored 'Constitutional Law of India'; Venkayya designed the flag.", "globalNum": 155}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Who authored the comprehensive commentary titled 'Constitutional Law of India'?", "options": ["H.M. Seervai", "B.N. Rau", "Somnath Lehri", "B.R. Ambedkar"], "answer": 0, "explanation": "Correct: H.M. Seervai authored 'Constitutional Law of India,' a comprehensive commentary on the Indian Constitution. Rau was the Chief Draftsman, Lehri was a critic of the Assembly, and Ambedkar chaired the Drafting Committee.", "globalNum": 156}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which political party called for the dissolution of the Constituent Assembly and its re-election by adult suffrage?", "options": ["The Socialist Party", "The Muslim League", "The Communist Party", "The Swaraj Party"], "answer": 0, "explanation": "Correct: The Socialist Party called for dissolving the Assembly and re-electing it via adult suffrage. The Muslim League instead boycotted the Assembly after Partition, a different form of objection.", "globalNum": 157}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "What is unique about the length of India's Constitution, and what symbol represents it?", "options": ["It is the largest written constitution in the world, symbolised by the Elephant", "It is the shortest written constitution, symbolised by the Lotus", "It is unwritten, like the UK's, symbolised by the Lion", "It is the largest, symbolised by the Ashoka Chakra"], "answer": 0, "explanation": "Correct: India's Constitution is the largest written constitution in the world, and its symbol (as noted) is the Elephant. It is very much written (unlike the UK's largely unwritten constitution), ruling out that option.", "globalNum": 158}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "In what language was the Constitution originally written, and who served as Secretary of the Constituent Assembly?", "options": ["English; H.V. Iyengar was Secretary", "Hindi; B.N. Rau was Secretary", "English; Prem Bihari Narain Raizada was Secretary", "Hindi; H.V. Iyengar was Secretary"], "answer": 0, "explanation": "Correct: The Constitution's language was English, and H.V. Iyengar served as Secretary of the Constituent Assembly. Raizada was instead the English-language calligrapher, and Rau was the Chief Draftsman.", "globalNum": 159}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Who decorated the Constitution, and who were its calligraphers for the English and Hindi versions respectively?", "options": ["Decorated by Nand Lal Bose & Beohar Rammanohar Sinha; English calligraphy by Prem Bihari Narain Raizada, Hindi by Vasant Krishan Vaidya", "Decorated by H.V. Iyengar; calligraphy entirely by B.N. Rau", "Decorated by Pingali Venkayya; calligraphy by Ambedkar", "Decorated by Prem Bihari Narain Raizada; calligraphy by Nand Lal Bose"], "answer": 0, "explanation": "Correct: Nand Lal Bose and Beohar Rammanohar Sinha decorated the Constitution, while Prem Bihari Narain Raizada did the English calligraphy and Vasant Krishan Vaidya the Hindi calligraphy. Iyengar was the Assembly Secretary, Venkayya the flag designer — neither did decoration or calligraphy.", "globalNum": 160}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Into how many volumes were the printed records of the Constituent Assembly's discussions compiled?", "options": ["12 Volumes", "8 Volumes", "22 Volumes", "5 Volumes"], "answer": 0, "explanation": "Correct: The discussions were compiled into 12 Volumes. The other numbers don't match figures given elsewhere in the notes (like 8 Major committees or 22 Parts), which are unrelated counts.", "globalNum": 161}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Part of the Constitution covers 'The Union & its Territory,' and which Articles does it span?", "options": ["Part I, Articles 1-4", "Part II, Articles 5-11", "Part III, Articles 12-35", "Part V, Articles 52-151"], "answer": 0, "explanation": "Correct: Part I covers 'The Union & its Territory,' Articles 1-4. Part II covers Citizenship (5-11), Part III Fundamental Rights (12-35), and Part V The Union executive/legislature (52-151).", "globalNum": 162}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Fundamental Rights (Part III) and DPSP (Part IV) span which Article ranges respectively?", "options": ["Part III: Articles 12-35; Part IV: Articles 36-51", "Part III: Articles 36-51; Part IV: Articles 12-35", "Part III: Articles 1-4; Part IV: Articles 52-151", "Part III: Articles 5-11; Part IV: Articles 12-35"], "answer": 0, "explanation": "Correct: Part III (Fundamental Rights) spans Articles 12-35, and Part IV (DPSP) spans Articles 36-51. The other ranges belong to different Parts (I, II, V) entirely.", "globalNum": 163}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Fundamental Duties are covered under which Part, and which single Article number?", "options": ["Part IVA, Article 51A", "Part IV, Articles 36-51", "Part III, Article 32", "Part V, Article 52"], "answer": 0, "explanation": "Correct: Fundamental Duties are covered under Part IVA, consisting of the single Article 51A. Part IV covers DPSP instead, Part III covers Fundamental Rights (with Article 32 being the remedies article within it).", "globalNum": 164}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Part V ('The Union' — President, Parliament, etc.) and Part VI ('The States') span which Article ranges?", "options": ["Part V: 52-151; Part VI: 152-237", "Part V: 1-4; Part VI: 5-11", "Part V: 152-237; Part VI: 52-151", "Part V: 244-244A; Part VI: 245-263"], "answer": 0, "explanation": "Correct: Part V spans Articles 52-151, and Part VI spans Articles 152-237. The other ranges belong to unrelated Parts covering the Union Territory (I), Citizenship (II), Scheduled Areas (X), or Centre-State relations (XI).", "globalNum": 165}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Why does Part numbering jump directly from VI to VIII, skipping Part VII?", "options": ["Part VII (States in the erstwhile Part B) was repealed by the 7th Amendment, 1956", "Part VII was never drafted", "Part VII is a typographical convention with no content ever existing", "Part VII was merged into Part IX"], "answer": 0, "explanation": "Correct: Part VII (which dealt with States in the erstwhile Part B category) was repealed by the 7th Constitutional Amendment, 1956, which is why the numbering jumps from VI straight to VIII. It was not a typo, nor was it merged into Part IX (which deals with Panchayats).", "globalNum": 166}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Part VIII covers Union Territories (Articles 239-242). Which Part covers the Panchayats, and which Articles?", "options": ["Part IX, Articles 243-243O", "Part IXA, Articles 243P-243ZG", "Part X, Articles 244-244A", "Part XI, Articles 245-263"], "answer": 0, "explanation": "Correct: Part IX covers the Panchayats, Articles 243-243O. Part IXA instead covers Municipalities, Part X covers Scheduled & Tribal Areas, and Part XI covers Union-State relations.", "globalNum": 167}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Part covers the Municipalities, and which covers Co-operative Societies?", "options": ["Part IXA (Municipalities, 243P-243ZG); Part IXB (Co-operative Societies, 243ZH-243ZT)", "Part IX (Municipalities); Part IXA (Co-operative Societies)", "Part X (Municipalities); Part XI (Co-operative Societies)", "Part IXB (Municipalities); Part IXA (Co-operative Societies)"], "answer": 0, "explanation": "Correct: Part IXA covers Municipalities (Articles 243P-243ZG), and Part IXB covers Co-operative Societies (Articles 243ZH-243ZT). Part IX itself covers Panchayats instead.", "globalNum": 168}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Part X covers Scheduled & Tribal Areas (244-244A). Which Part covers relations between the Union and States, and which covers Finance, Property, Contracts & Suits?", "options": ["Part XI (245-263) for Union-State relations; Part XII (264-300A) for Finance etc.", "Part XII for Union-State relations; Part XI for Finance", "Part XIII for Union-State relations; Part XIV for Finance", "Part IX for Union-State relations; Part X for Finance"], "answer": 0, "explanation": "Correct: Part XI (Articles 245-263) covers Union-State relations, and Part XII (Articles 264-300A) covers Finance, Property, Contracts & Suits. Parts XIII and XIV instead cover Trade/Commerce and Services under Union & States respectively.", "globalNum": 169}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Part covers Trade, Commerce & Intercourse, and which covers Services under the Union & States?", "options": ["Part XIII (301-307) for Trade/Commerce; Part XIV (308-323) for Services", "Part XII for Trade/Commerce; Part XIII for Services", "Part XIV for Trade/Commerce; Part XV for Services", "Part XI for Trade/Commerce; Part XII for Services"], "answer": 0, "explanation": "Correct: Part XIII (Articles 301-307) covers Trade, Commerce & Intercourse, and Part XIV (Articles 308-323) covers Services under the Union & States. Part XIVA instead covers Tribunals (323A-323B).", "globalNum": 170}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Part covers Elections, and which covers Special Provisions for SC/ST/OBC/Anglo-Indians?", "options": ["Part XV (324-329A) for Elections; Part XVI (330-342) for Special Provisions", "Part XIV for Elections; Part XV for Special Provisions", "Part XVI for Elections; Part XVII for Special Provisions", "Part XIII for Elections; Part XIV for Special Provisions"], "answer": 0, "explanation": "Correct: Part XV (Articles 324-329A) covers Elections, and Part XVI (Articles 330-342) covers Special Provisions relating to SC/ST/OBC/Anglo-Indians. Part XVII instead covers Official Language.", "globalNum": 171}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Part covers Official Language, and which covers Emergency Provisions?", "options": ["Part XVII (343-351) for Official Language; Part XVIII (352-360) for Emergency Provisions", "Part XVI for Official Language; Part XVII for Emergency Provisions", "Part XVIII for Official Language; Part XIX for Emergency Provisions", "Part XV for Official Language; Part XVI for Emergency Provisions"], "answer": 0, "explanation": "Correct: Part XVII (Articles 343-351) covers Official Language, and Part XVIII (Articles 352-360) covers Emergency Provisions. Part XIX instead covers Miscellaneous matters (361-367).", "globalNum": 172}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which single Article makes up Part XX, dealing with Amendment of the Constitution?", "options": ["Article 368", "Article 356", "Article 370", "Article 395"], "answer": 0, "explanation": "Correct: Part XX consists of the single Article 368, dealing with Constitutional Amendment. Article 356 relates to President's Rule (a different Part), and Article 395 concludes Part XXII with repeals.", "globalNum": 173}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Parts cover Temporary/Transitional/Special Provisions, and Short Title/Commencement/Repeals respectively, and their Article ranges?", "options": ["Part XXI (369-392) for Temporary Provisions; Part XXII (393-395) for Short Title etc.", "Part XX (369-392) for Temporary Provisions; Part XXI (393-395) for Short Title etc.", "Part XXII (369-392) for Temporary Provisions; Part XXI (393-395) for Short Title etc.", "Part XIX (369-392) for Temporary Provisions; Part XX (393-395) for Short Title etc."], "answer": 0, "explanation": "Correct: Part XXI (Articles 369-392) covers Temporary, Transitional & Special Provisions, and Part XXII (Articles 393-395) covers the Short Title, Commencement, and Repeals — the final Part of the Constitution.", "globalNum": 174}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "The 1st Schedule and 2nd Schedule of the Constitution cover which subjects respectively?", "options": ["1st: Names/territorial extent of States & UTs; 2nd: Salaries/allowances of President, Governors, Judges, etc.", "1st: Forms of Oaths; 2nd: RS seat allocation", "1st: Union/State/Concurrent Lists; 2nd: 22 Official Languages", "1st: Anti-Defection provisions; 2nd: Panchayat subjects"], "answer": 0, "explanation": "Correct: The 1st Schedule lists the names and territorial extent of States/UTs, and the 2nd Schedule covers salaries/allowances of high officials (President, Governors, Judges, Speaker, CAG, etc.). The other subjects belong to the 3rd, 7th, 8th, 10th, or 11th Schedules.", "globalNum": 175}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "Which Schedule covers Forms of Oaths & Affirmations, and which covers the allocation of Rajya Sabha seats to States/UTs?", "options": ["3rd Schedule (Oaths); 4th Schedule (RS seat allocation)", "4th Schedule (Oaths); 3rd Schedule (RS seat allocation)", "5th Schedule (Oaths); 6th Schedule (RS seat allocation)", "2nd Schedule (Oaths); 3rd Schedule (RS seat allocation)"], "answer": 0, "explanation": "Correct: The 3rd Schedule covers Forms of Oaths & Affirmations, and the 4th Schedule covers allocation of Rajya Sabha seats to States/UTs. The 5th and 6th Schedules instead deal with tribal administration.", "globalNum": 176}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "How do the 5th and 6th Schedules differ in their coverage of tribal area administration?", "options": ["5th Schedule covers general states; 6th Schedule covers only Assam, Meghalaya, Tripura & Mizoram (NE states)", "5th Schedule covers only NE states; 6th Schedule covers general states", "Both cover only NE states, with no distinction", "5th Schedule covers Panchayats; 6th Schedule covers Municipalities"], "answer": 0, "explanation": "Correct: The 5th Schedule deals with administration and control of Scheduled Areas & Tribes in general states, while the 6th Schedule specifically covers Tribal Areas administration in Assam, Meghalaya, Tripura & Mizoram. Panchayats and Municipalities are instead covered by the 11th and 12th Schedules.", "globalNum": 177}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "The 7th Schedule contains which three lists, and the 8th Schedule contains what?", "options": ["7th: Union, State & Concurrent Lists; 8th: 22 Official Languages", "7th: 22 Official Languages; 8th: Union, State & Concurrent Lists", "7th: Panchayat subjects; 8th: Municipality subjects", "7th: Anti-Defection rules; 8th: Oaths"], "answer": 0, "explanation": "Correct: The 7th Schedule contains the Union List, State List, and Concurrent List, while the 8th Schedule lists the 22 Official Languages. Panchayat and Municipality subjects instead belong to the 11th and 12th Schedules.", "globalNum": 178}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "The 9th Schedule contains laws immune from judicial review — when was it added? The 10th Schedule contains Anti-Defection provisions — when was that added?", "options": ["9th added by 1st CA, 1951; 10th added by 52nd CA, 1985", "9th added by 52nd CA, 1985; 10th added by 1st CA, 1951", "9th added by 73rd CA, 1992; 10th added by 74th CA, 1992", "9th and 10th both added by 42nd CA, 1976"], "answer": 0, "explanation": "Correct: The 9th Schedule (laws immune from judicial review) was added by the 1st Constitutional Amendment, 1951, and the 10th Schedule (Anti-Defection provisions) was added by the 52nd Amendment, 1985. The 73rd and 74th Amendments instead added the 11th and 12th Schedules.", "globalNum": 179}, {"tab": "t7", "tabTitle": "7. Constitution — Key Facts", "q": "The 11th and 12th Schedules were both added in 1992. What do they contain, and by which Amendments?", "options": ["11th: 29 subjects for Panchayats (73rd CA); 12th: 18 subjects for Municipalities (74th CA)", "11th: 18 subjects for Municipalities (73rd CA); 12th: 29 subjects for Panchayats (74th CA)", "11th: 22 languages (73rd CA); 12th: Anti-defection (74th CA)", "11th and 12th both cover the same 29 subjects"], "answer": 0, "explanation": "Correct: The 11th Schedule lists 29 subjects for Panchayats, added by the 73rd Constitutional Amendment, and the 12th Schedule lists 18 subjects for Municipalities, added by the 74th Amendment — both in 1992. This mirrors Parts IX (Panchayats) and IXA (Municipalities) of the Constitution.", "globalNum": 180}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "The opening phrase 'WE, THE PEOPLE OF INDIA' resolves to constitute India into what kind of Republic, and to secure which four values to citizens?", "options": ["SOVEREIGN, SOCIALIST, SECULAR, DEMOCRATIC Republic; securing JUSTICE, LIBERTY, EQUALITY, FRATERNITY", "SOVEREIGN, DEMOCRATIC Republic only; securing JUSTICE and LIBERTY", "FEDERAL, SECULAR Republic; securing EQUALITY and UNITY", "SOCIALIST, SECULAR Republic; securing PEACE, ORDER, JUSTICE, LIBERTY"], "answer": 0, "explanation": "Correct: The Preamble resolves to constitute India into a SOVEREIGN, SOCIALIST, SECULAR, DEMOCRATIC REPUBLIC, securing JUSTICE, LIBERTY, EQUALITY, and FRATERNITY. The other options omit or add words not in the actual text.", "globalNum": 181}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "The phrase 'We the people of India' was taken from which country's constitution, while the Preamble's overall language style was taken from which country?", "options": ["Phrase from USA; language style from Australia", "Phrase from Australia; language style from USA", "Phrase from France; language style from Ireland", "Phrase from UK; language style from France"], "answer": 0, "explanation": "Correct: 'We the people of India' was taken from the USA, while the language of the Preamble was taken from Australia. The other pairings misattribute these two distinct borrowings.", "globalNum": 182}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Who decorated the Preamble document, according to the notes?", "options": ["Beohar Ram Manohar Sinha and Nand Lal Bose", "Prem Bihari Narain Raizada and Vasant Krishan Vaidya", "Pingali Venkayya and H.V. Iyengar", "B.N. Rau and K.M. Munshi"], "answer": 0, "explanation": "Correct: Beohar Ram Manohar Sinha and Nand Lal Bose decorated the Preamble (the same pair who decorated the whole Constitution). Raizada and Vaidya were calligraphers, not decorators; Venkayya designed the flag; Rau and Munshi were Drafting Committee figures.", "globalNum": 183}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Which Amendment added the words 'Socialist' and 'Secular' to the Preamble, and what was the outcome of the 2024 challenge to this insertion?", "options": ["42nd Amendment (1976); the Supreme Court rejected the petition to remove these words in Ashwini Kumar Upadhyay v. Union of India (Nov 2024)", "44th Amendment (1978); the Supreme Court upheld removal of the words", "1st Amendment (1951); the challenge is still pending", "73rd Amendment (1992); the challenge was withdrawn"], "answer": 0, "explanation": "Correct: The 42nd Amendment (1976) added 'Socialist' and 'Secular,' and the Supreme Court rejected a petition seeking their removal in the November 2024 case of Ashwini Kumar Upadhyay v. Union of India. The 44th and 1st Amendments are unrelated to this specific insertion.", "globalNum": 184}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Match the commentator to their description of the Preamble: who called it the 'ID Card of the Constitution,' and who called it its 'Political Horoscope'?", "options": ["N.A. Palkhivala ('ID Card'); K.M. Munshi ('Political Horoscope')", "K.M. Munshi ('ID Card'); N.A. Palkhivala ('Political Horoscope')", "Ernest Barker ('ID Card'); Pt. Thakur Das ('Political Horoscope')", "Pt. Thakur Das ('ID Card'); Ernest Barker ('Political Horoscope')"], "answer": 0, "explanation": "Correct: N.A. Palkhivala called it the 'ID Card of the Constitution,' while K.M. Munshi called it the 'Political Horoscope of the Constitution.' Barker called it the 'Keynote of the Constitution,' and Pt. Thakur Das called it a 'Jewel set' and the 'Soul of the Constitution.'", "globalNum": 185}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Who described the Preamble as its 'Keynote,' in which book, and who called it the 'Soul of the Constitution' / 'Jewel set' / 'most precious part'?", "options": ["Ernest Barker in 'Principles of Social and Political Theory'; Pt. Thakur Das for the other descriptions", "K.M. Munshi in 'Principles of Social and Political Theory'; N.A. Palkhivala for the others", "Pt. Thakur Das in his own book; Ernest Barker for the others", "N.A. Palkhivala in 'Principles of Social and Political Theory'; K.M. Munshi for the others"], "answer": 0, "explanation": "Correct: Ernest Barker called it the 'Keynote of the Constitution' in his book 'Principles of Social and Political Theory,' while Pt. Thakur Das called it a 'Jewel set,' 'Soul of the Constitution,' and its 'most precious part.'", "globalNum": 186}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Which of these statements about the Preamble's nature is correct, per the notes?", "options": ["It is an introductory statement summarising the reasons and guiding values/philosophy of the Constitution, made after the entire Constitution was compiled", "It was drafted before the rest of the Constitution and has no connection to the Objective Resolution", "It lists all Fundamental Rights in detail", "It was drafted independently of Nehru's Objective Resolution"], "answer": 0, "explanation": "Correct: The Preamble is an introductory statement giving the Constitution's reasons and guiding philosophy, and was made after the entire Constitution was compiled. It is a modified version of Nehru's Objective Resolution, not an independent or earlier document, and it does not itself enumerate Fundamental Rights in detail.", "globalNum": 187}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "What does 'Sovereign' mean in the context of the Preamble?", "options": ["The people have the supreme right to make decisions on internal and external matters, with no external power dictating India's government", "The government can be overruled by international bodies", "Only the President holds sovereign power", "States within India each have sovereign power"], "answer": 0, "explanation": "Correct: 'Sovereign' means the people hold supreme decision-making power over internal and external matters, free from external dictation. It does not mean international bodies can overrule India, nor does it vest sovereignty solely in the President or individual states.", "globalNum": 188}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Which type of socialism does India follow, as described in the notes, and what does it mean?", "options": ["Mixed Socialism — state-controlled development of businesses & wealth so everyone is equal (a classless society)", "Radical Socialism — ending all private ownership", "Communist Socialism — as in China/the Russian Revolution", "Capitalistic Socialism — as in the USA"], "answer": 0, "explanation": "Correct: India follows Mixed Socialism, combining state-controlled development with private enterprise to pursue equality (a classless society). Radical Socialism ends private ownership entirely, Communist socialism is exemplified by China/Russia, and Capitalistic systems (like the USA) are the opposite end of the spectrum.", "globalNum": 189}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "The notes list four types/examples of socialism. Which type is associated with non-violence and self-reliance?", "options": ["Gandhian Socialism", "Nehruvian Socialism", "Radical Socialism", "Communist Socialism"], "answer": 0, "explanation": "Correct: Gandhian Socialism is associated with non-violence and self-reliance. Nehruvian Socialism refers to mixed socialism, Radical Socialism means ending private ownership, and Communist Socialism is exemplified by China/the Russian Revolution.", "globalNum": 190}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "What does 'Secular' mean under the Preamble, and what type of secularism does India follow?", "options": ["Complete freedom to follow any (or no) religion, with no official state religion; India follows a Positive concept of secularism (state treats all religions equally, can engage with religious matters)", "No religious freedom is guaranteed; India follows a Negative concept of secularism (state avoids all religious matters)", "Only Hinduism is recognised as the state religion", "Secularism means banning all religious practices in public"], "answer": 0, "explanation": "Correct: 'Secular' guarantees complete religious freedom with no state religion, and India follows a Positive concept of secularism, where the state may engage with religious matters but treats all religions equally and impartially. India does not have a negative/strict-separation model, nor a state religion, nor a ban on public religious practice.", "globalNum": 191}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "What does 'Democratic' mean under the Preamble, and give an example each of Direct and Indirect Democracy as per the notes.", "options": ["Government functions per constitutional rules; Direct Democracy example: Switzerland; Indirect/Representative Democracy is where elected reps decide on citizens' behalf", "Government functions per religious rules; Direct Democracy example: India; Indirect Democracy example: USA", "Democracy means only elections without any constitutional rules; example: UK", "Democratic means rule by hereditary monarchs following set traditions"], "answer": 0, "explanation": "Correct: 'Democratic' means government functions according to constitutional rules and principles; Switzerland (along with Uruguay, Latvia, Lithuania) exemplifies Direct Democracy, while Indirect/Representative Democracy involves citizens electing representatives to decide on their behalf. Democracy is unrelated to religious rules or hereditary monarchy.", "globalNum": 192}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Which book, and by which author (called the 'Father of Liberalism,' 1689), is associated with the idea of Indirect/Representative Democracy? Who coined the phrase 'Government of the people, by the people, for the people'?", "options": ["'Two Treatises of Government' by John Locke; phrase coined by Abraham Lincoln", "'Two Treatises of Government' by Abraham Lincoln; phrase coined by John Locke", "'The Social Contract' by John Locke; phrase coined by Nehru", "'Two Treatises of Government' by Montesquieu; phrase coined by Lincoln"], "answer": 0, "explanation": "Correct: John Locke, called the Father of Liberalism (1689), wrote 'Two Treatises of Government,' and Abraham Lincoln coined the phrase 'Government of the people, by the people, for the people.' Montesquieu is known instead for separation of powers, not this specific book.", "globalNum": 193}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "What does 'Republic' mean under the Preamble, and which major country is specifically noted as NOT being a Republic?", "options": ["Head of state is elected by the people, not hereditary; the UK is noted as NOT a Republic (it has a hereditary monarch)", "Head of state must be a military general; the USA is not a Republic", "Head of state is appointed by the UN; France is not a Republic", "Republic means a federal system of government; India is not a true Republic"], "answer": 0, "explanation": "Correct: 'Republic' means the head of state is elected, not hereditary, and the UK is specifically noted as NOT a Republic because it has a hereditary monarch as head of state. India, USA, and others are cited as Republic examples in the notes.", "globalNum": 194}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "How many types of Justice does the Preamble mention, and what are they?", "options": ["Three: Social, Economic, and Political", "Two: Social and Economic", "Four: Social, Economic, Political, and Religious", "One: only Social justice"], "answer": 0, "explanation": "Correct: The Preamble mentions three types of Justice: Social, Economic, and Political. There is no separate 'Religious' justice category listed.", "globalNum": 195}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "How many forms of Liberty does the Preamble mention, and what are they?", "options": ["Five: Thought, Expression, Belief, Faith, and Worship", "Three: Thought, Speech, and Action", "Four: Thought, Expression, Religion, and Movement", "Two: Thought and Expression"], "answer": 0, "explanation": "Correct: The Preamble mentions five forms of Liberty: Thought, Expression, Belief, Faith, and Worship. The other option lists fewer or incorrect forms.", "globalNum": 196}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "How many types of Equality does the Preamble mention, and what are they?", "options": ["Two: Status and Opportunity", "Three: Status, Opportunity, and Wealth", "One: only before the law", "Four: Status, Opportunity, Religion, and Gender"], "answer": 0, "explanation": "Correct: The Preamble mentions two types of Equality: Status and Opportunity. The notes do not list separate categories for wealth, religion, or gender under this specific 'types of equality' framing.", "globalNum": 197}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "What does 'Fraternity' mean under the Preamble?", "options": ["All citizens should behave as members of the same family, with no one treating a fellow citizen as inferior", "Only Kesavananda Bharati case (1973).", "globalNum": 200}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "How did the Kesavananda Bharati Case (1973) change the position established in the Berubari Union Case?", "options": ["It overruled Berubari, holding the Preamble IS part of the Constitution and can be amended under Article 368, but cannot touch the basic structure", "It fully agreed with Berubari that the Preamble is not part of the Constitution", "It held the Preamble can be amended without any limitation", "It held the Preamble is legally enforceable in all courts"], "answer": 0, "explanation": "Correct: Kesavananda Bharati (1973) overruled Berubari, holding that the Preamble IS part of the Constitution and can be amended under Article 368 — but any amendment cannot alter the basic structure. It did not make the Preamble fully enforceable in courts, nor allow unlimited amendment.", "globalNum": 201}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Which later case reaffirmed the Kesavananda Bharati ruling on the Preamble's status?", "options": ["LIC of India Case, 1995", "Ashwini Kumar Upadhyay Case, 2024", "Berubari Union Case, 1960", "Golaknath Case, 1967"], "answer": 0, "explanation": "Correct: The LIC of India Case (1995) reaffirmed the Kesavananda Bharati ruling that the Preamble is part of the Constitution. Berubari (1960) held the opposite (earlier) view, Golaknath (1967) dealt with Parliament's power to amend Fundamental Rights, and the 2024 case dealt with removing 'Socialist'/'Secular.'", "globalNum": 202}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "The Preamble has been amended only once. When, by which Amendment, and which words were added?", "options": ["1976, by the 42nd Constitutional Amendment, adding Integrity, Socialist, and Secular", "1950, by the 1st Constitutional Amendment, adding Sovereign and Republic", "1985, by the 52nd Constitutional Amendment, adding Justice and Liberty", "1992, by the 73rd Constitutional Amendment, adding Socialist and Democratic"], "answer": 0, "explanation": "Correct: The Preamble was amended only once, in 1976, via the 42nd Constitutional Amendment, which added Integrity, Socialist, and Secular (remembered by the trick 'ISS/SIS'). No other Amendment has touched the Preamble's text.", "globalNum": 203}, {"tab": "t8", "tabTitle": "8. Preamble", "q": "Is the Preamble enforceable in a court of law, and what role does it play in constitutional interpretation?", "options": ["It is NOT enforceable in court, and is neither a source of power nor a restriction on the legislature, but can aid legal interpretation of the Constitution", "It is fully enforceable and can be used to strike down any law directly", "It only applies to Fundamental Rights cases", "It is enforceable only during a National Emergency"], "answer": 0, "explanation": "Correct: The Preamble is not enforceable in courts and is neither a source of power nor a restriction on the legislature — but it can serve as an aid to interpreting the Constitution. It cannot be used on its own to strike down laws, nor is its role limited to Fundamental Rights or Emergency periods.", "globalNum": 204}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What are the key differences between a Written and an Unwritten Constitution, per the notes' comparison table?", "options": ["Written is compiled/structured, formally constituted, and not easy to amend (e.g., India); Unwritten is unstructured, not formally constituted, and easy to amend (e.g., UK)", "Written is easy to amend and unstructured; Unwritten is rigid and formally constituted", "Both are equally easy to amend", "Written constitutions exist only in the UK"], "answer": 0, "explanation": "Correct: A Written Constitution (like India's) is compiled and structured systematically, formally constituted, and not easy to amend. An Unwritten Constitution (like the UK's) is unstructured, not formally constituted, and easy to amend.", "globalNum": 205}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What was the Indian Constitution's original size, and what is its present size in terms of Articles, Parts, and Schedules?", "options": ["Originally 395 Articles, 22 Parts, 8 Schedules; presently more than 448 Articles, 25 Parts, 12 Schedules", "Originally 448 Articles, 25 Parts, 12 Schedules; presently 395 Articles, 22 Parts, 8 Schedules", "Originally and presently both 395 Articles, 22 Parts, 8 Schedules — unchanged", "Originally 300 Articles; presently 500 Articles"], "answer": 0, "explanation": "Correct: The Constitution originally had 395 Articles, 22 Parts, 8 Schedules, and now has more than 448 Articles, 25 Parts, 12 Schedules due to amendments over time.", "globalNum": 206}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Who described Indian federalism as having a 'centralising tendency with a strong centre,' and who described it as 'Bargaining Federalism'?", "options": ["Ivor Jennings (centralising tendency); Morris Jones (Bargaining Federalism)", "Morris Jones (centralising tendency); Ivor Jennings (Bargaining Federalism)", "K.C. Wheare (centralising tendency); Granville Austin (Bargaining Federalism)", "Granville Austin (centralising tendency); K.C. Wheare (Bargaining Federalism)"], "answer": 0, "explanation": "Correct: Ivor Jennings described India's federalism as having a centralising tendency/strong centre, while Morris Jones called it 'Bargaining Federalism.' Wheare called it 'Quasi Federal' and Austin called it 'Cooperative Federalism' — different descriptions covered elsewhere in the notes.", "globalNum": 207}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "India's Parliamentary form of Government was taken from which country?", "options": ["UK", "USA", "Ireland", "Canada"], "answer": 0, "explanation": "Correct: The Parliamentary form of Government was taken from the UK. USA contributed Fundamental Rights and judicial review; Ireland contributed DPSP; Canada contributed the strong-Centre federal structure.", "globalNum": 208}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What are the three organs of government listed in the notes, and their basic functions?", "options": ["Legislative (makes laws), Executive (carries out laws), Judicial (evaluates laws)", "Legislative (evaluates laws), Executive (makes laws), Judicial (carries out laws)", "Only two organs exist: Legislative and Executive", "Judicial (makes laws), Executive (evaluates laws), Legislative (carries out laws)"], "answer": 0, "explanation": "Correct: The Legislative organ makes laws (from Union + State), the Executive carries out laws, and the Judicial organ evaluates laws. India does not follow a strict separation of powers among these three.", "globalNum": 209}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What does the 5th Schedule deal with, and which Article gives the President authority to declare 'Scheduled Areas'?", "options": ["Administration & control of Scheduled Areas & Scheduled Tribes; Article 244(1)", "Tribal areas administration in Assam, Tripura, Meghalaya, Mizoram; Article 244(2)", "Allocation of Rajya Sabha seats; Article 245", "Land reforms; Article 244(1)"], "answer": 0, "explanation": "Correct: The 5th Schedule covers administration & control of Scheduled Areas & Scheduled Tribes, with the President empowered under Article 244(1) to declare 'Scheduled Areas.' The 6th Schedule instead covers the NE tribal areas, and the 4th Schedule covers RS seat allocation.", "globalNum": 210}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "The 6th Schedule covers tribal area administration in Assam, Tripura, Meghalaya, and Mizoram through Autonomous District Councils (ADCs). Which other states, per the notes, also have ADCs despite not being covered by the 6th Schedule itself?", "options": ["Himachal Pradesh, Madhya Pradesh, Gujarat, Jharkhand, Chhattisgarh, Maharashtra, Andhra Pradesh, Rajasthan, Odisha, Telangana", "Punjab, Haryana, Delhi, Goa", "Kerala, Tamil Nadu, Karnataka, Andhra Pradesh only", "Uttar Pradesh, Bihar, West Bengal"], "answer": 0, "explanation": "Correct: The notes list Himachal Pradesh, Madhya Pradesh, Gujarat, Jharkhand, Chhattisgarh, Maharashtra, Andhra Pradesh, Rajasthan, Odisha, and Telangana as states with ADCs, even though the 6th Schedule itself formally applies only to the four NE states named.", "globalNum": 211}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "The 8th Schedule lists official languages — how many were there originally, and how many are there presently?", "options": ["Originally 14, presently 22", "Originally 22, presently 14", "Originally 18, presently 22", "Originally 8, presently 12"], "answer": 0, "explanation": "Correct: The 8th Schedule originally listed 14 official languages, now expanded to 22. The other figures don't match this schedule's history.", "globalNum": 212}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "The 9th Schedule deals with land reforms and the Zamindari system. Which Amendment added it, and in what year?", "options": ["1st Constitutional Amendment, 1951", "52nd Constitutional Amendment, 1985", "73rd Constitutional Amendment, 1992", "74th Constitutional Amendment, 1992"], "answer": 0, "explanation": "Correct: The 9th Schedule was added by the 1st Constitutional Amendment in 1951. The 52nd Amendment (1985) added the 10th Schedule (anti-defection), and the 73rd/74th (1992) added the 11th/12th Schedules (Panchayats/Municipalities).", "globalNum": 213}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "The 11th Schedule (Panchayats) and 12th Schedule (Municipalities) list how many functional matters respectively?", "options": ["11th: 29 matters; 12th: 18 matters", "11th: 18 matters; 12th: 29 matters", "11th: 22 matters; 12th: 14 matters", "Both list 25 matters each"], "answer": 0, "explanation": "Correct: The 11th Schedule lists 29 functional matters for Panchayats, and the 12th Schedule lists 18 functional matters for Municipalities — both added by the 73rd and 74th Amendments respectively in 1992.", "globalNum": 214}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "According to the notes' mnemonic trick for Schedules 1-8, what does the sequence 'T-E-A-R-S-O-O' stand for?", "options": ["Territory, Emoluments, Affirmation and oath, Rajya Sabha, Scheduled areas, Other scheduled areas, Official languages", "Territory, Executive, Amendment, Rajya Sabha, Special areas, Other, Official duties", "Trade, Emoluments, Areas, Rajya Sabha, Schedules, Oaths, Official languages", "Tribunals, Emergency, Amendment, Rajya Sabha, Scheduled tribes, Oaths, Official languages"], "answer": 0, "explanation": "Correct: The mnemonic stands for Territory (1st), Emoluments (2nd), Affirmation and oath (3rd), Rajya Sabha (4th), Scheduled areas (5th), Other scheduled areas (6th), and Official languages (8th) — note the 7th Schedule (lists) isn't part of this specific acronym.", "globalNum": 215}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What is the basis for the Constitution being called both 'rigid' and 'flexible'?", "options": ["Some parts can be amended by Simple Majority (flexible) while others need a Special Majority (rigid)", "The entire Constitution requires only a Simple Majority to amend", "The entire Constitution can never be amended", "Only the judiciary can amend the Constitution, making it entirely rigid"], "answer": 0, "explanation": "Correct: The Constitution has a mixed amendment procedure — some provisions need only a Simple Majority (flexible), while others need a Special Majority (rigid), covered in more detail under the Amendment chapter.", "globalNum": 216}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What is the three-tier structure of government in India, per the Federalism section?", "options": ["Union/Centre → States → Local Bodies (Panchayats & Municipalities)", "Union → Districts → Villages", "President → Governors → Chief Ministers", "Parliament → State Legislatures → Courts"], "answer": 0, "explanation": "Correct: India follows a three-tier government structure: Union/Centre, States, and Local Bodies (Panchayats & Municipalities). The other options misrepresent this structure with unrelated hierarchies.", "globalNum": 217}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "How is Indian federalism commonly described in terms of the balance between the Centre and the States?", "options": ["'Federation with a unitary bias / Strong Centre'", "'Pure federation with equal Centre-State power'", "'Confederation of independent states'", "'Unitary system with no federal features at all'"], "answer": 0, "explanation": "Correct: India is described as a 'Federation with a unitary bias / Strong Centre,' balancing federal and unitary elements rather than being a pure federation, confederation, or purely unitary system.", "globalNum": 218}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which of these is a Federal Feature of the Indian Constitution, as opposed to a Unitary Feature?", "options": ["Written Constitution and Supremacy of the Constitution", "Single Citizenship", "Appointment of Governors by the Centre", "Integrated Judiciary"], "answer": 0, "explanation": "Correct: A Written Constitution and Supremacy of the Constitution are listed as Federal Features. Single Citizenship, Centre-appointed Governors, and an Integrated Judiciary are instead listed as Unitary Features that coexist alongside the federal ones.", "globalNum": 219}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which of these is a Unitary Feature of the Indian Constitution?", "options": ["All India Services and Emergency provisions", "Bicameralism and Dual Government", "Rigidity of the Constitution", "Independent Judiciary"], "answer": 0, "explanation": "Correct: All India Services and Emergency provisions are Unitary Features. Bicameralism, Dual Government, Constitutional rigidity, and an Independent Judiciary are instead listed as Federal Features.", "globalNum": 220}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Who described Indian federalism as 'Quasi Federal,' and who described it as 'Cooperative Federalism'?", "options": ["K.C. Wheare ('Quasi Federal'); Granville Austin ('Cooperative Federalism')", "Granville Austin ('Quasi Federal'); K.C. Wheare ('Cooperative Federalism')", "Ivor Jennings ('Quasi Federal'); Morris Jones ('Cooperative Federalism')", "Morris Jones ('Quasi Federal'); Ivor Jennings ('Cooperative Federalism')"], "answer": 0, "explanation": "Correct: K.C. Wheare called Indian federalism 'Quasi Federal,' while Granville Austin called it 'Cooperative Federalism.' Jennings and Morris Jones instead described it as having a centralising tendency and as 'Bargaining Federalism' respectively.", "globalNum": 221}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "How many subjects does the Union List presently contain, and how many did it originally contain?", "options": ["Originally 97, presently 100", "Originally 100, presently 97", "Originally 66, presently 61", "Originally 47, presently 52"], "answer": 0, "explanation": "Correct: The Union List originally had 97 subjects and presently has 100. The State List figures (66→61) and Concurrent List figures (47→52) are separate, smaller lists.", "globalNum": 222}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "According to the mnemonic 'ATM without Money,' which state is notably excluded when remembering the Union List trick?", "options": ["Manipur", "Mizoram", "Meghalaya", "Madhya Pradesh"], "answer": 0, "explanation": "Correct: The mnemonic notes that 'Money' (representing Manipur) is excluded — a memory trick to distinguish the Union List mnemonic from a similarly-worded one involving Manipur elsewhere.", "globalNum": 223}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which of these subjects fall under the Union List, as per the notes?", "options": ["Defence, atomic energy, citizenship, foreign affairs, banking, and census", "Public order, agriculture, and betting & gambling", "Marriage and divorce, and criminal laws", "Local government and pilgrimage"], "answer": 0, "explanation": "Correct: Defence, atomic energy, citizenship, foreign affairs, banking, and census are Union List subjects. Public order, agriculture, and betting/gambling are State List subjects, while marriage/divorce and criminal laws are Concurrent List subjects.", "globalNum": 224}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "How many subjects does the State List presently contain, and how many did it originally contain?", "options": ["Originally 66, presently 61", "Originally 61, presently 66", "Originally 97, presently 100", "Originally 47, presently 52"], "answer": 0, "explanation": "Correct: The State List originally had 66 subjects, now reduced to 61 (some were shifted to the Concurrent List, notably via the 42nd Amendment). The Union List and Concurrent List have different figures.", "globalNum": 225}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which of these subjects belong to the State List?", "options": ["Public order, local government, health, pilgrimage, liquor, agriculture, fisheries, betting and gambling, land, and lotteries", "Defence, foreign affairs, and citizenship", "Marriage/divorce and criminal law", "Education and forests (currently)"], "answer": 0, "explanation": "Correct: Public order, local government, health, pilgrimage, liquor, agriculture, fisheries, betting and gambling, land, and lotteries are all State List subjects. Defence/foreign affairs/citizenship are Union subjects, while marriage/divorce/criminal law and (since the 42nd Amendment) education/forests are Concurrent subjects.", "globalNum": 226}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "How many subjects does the Concurrent List presently contain, and how many did it originally contain?", "options": ["Originally 47, presently 52", "Originally 52, presently 47", "Originally 66, presently 61", "Originally 100, presently 97"], "answer": 0, "explanation": "Correct: The Concurrent List originally had 47 subjects and presently has 52 (having gained subjects like Education, Forests etc. via the 42nd Amendment). The State List's figures went the opposite direction, decreasing.", "globalNum": 227}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "If both the Centre and a State make laws on the same Concurrent List subject and they conflict, in which specific case will the State's law prevail over the Centre's?", "options": ["Only when the State's Bill has received the President's assent", "Never — the Centre's law always prevails automatically", "Only if the Supreme Court rules in the State's favour", "Only during a National Emergency"], "answer": 0, "explanation": "Correct: The State's law prevails over the Centre's on a Concurrent subject only in the specific case where the State's Bill was given assent by the President. This is the sole exception described in the notes — otherwise Central law generally prevails.", "globalNum": 228}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "What is the 'Residuary List,' and who has the power to legislate on residuary subjects?", "options": ["Subjects not included in the Union, State, or Concurrent Lists; Parliament has the power to legislate on them", "Subjects listed exclusively in the 7th Schedule under a fourth list; State Legislatures alone can legislate", "Subjects related only to defence; the President legislates on them", "There is no such thing as a Residuary List in India"], "answer": 0, "explanation": "Correct: The Residuary List covers subjects not found in any of the three enumerated lists, and Parliament (not the states or the President alone) holds the power to legislate on such residuary subjects.", "globalNum": 229}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "The 42nd Amendment transferred which five subjects from the State List to the Concurrent List?", "options": ["Education, Forests, Weights and Measures, Protection of wild animals and birds, and Administration of justice", "Defence, Citizenship, Banking, Foreign Affairs, and Census", "Public order, Health, Pilgrimage, Liquor, and Agriculture", "Marriage and divorce, Criminal law, Electricity, Insolvency, and Trade"], "answer": 0, "explanation": "Correct: The 42nd Amendment moved Education, Forests, Weights and Measures, Protection of wild animals and birds, and Administration of justice from the State List to the Concurrent List. The other lists include subjects that were already Union or Concurrent subjects, not newly transferred ones.", "globalNum": 230}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Under Article 250 (National Emergency), how long does a law made by Parliament on a State subject continue to remain in force?", "options": ["Until repealed, or until the Lok Sabha passes a resolution by Simple Majority to end it", "Permanently, with no repeal mechanism", "Only for 6 months regardless of any resolution", "Only for 1 year plus 6 months after expiry"], "answer": 0, "explanation": "Correct: Under Article 250, such a law continues until repealed, or until the Lok Sabha passes a resolution by Simple Majority. The '1 year plus 6 months' timeframe instead applies to Article 249 resolutions (Rajya Sabha's national-interest power).", "globalNum": 231}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Under Article 356 (President's Rule), how long does a law made by Parliament on a State subject during that period remain valid after the President's Rule ends?", "options": ["6 months after the emergency (President's Rule) ends", "1 year plus 6 months after expiry", "Permanently, unless the State Legislature repeals it", "Only until the next Lok Sabha session"], "answer": 0, "explanation": "Correct: Under Article 356, such a law remains valid for 6 months after President's Rule ends. This is distinct from the '1 year plus 6 months' rule that applies under Article 249.", "globalNum": 232}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Under Article 252, if two or more State legislatures request Parliament to legislate on a State subject, how long does that law remain in force, and can the requesting States themselves later amend it?", "options": ["It's permanent until repealed by Parliament, or until the Lok Sabha passes a resolution — states cannot amend it themselves", "It's valid for exactly 6 months, and states can freely amend it", "It automatically lapses after 1 year regardless of any action", "States can amend it, but only with Presidential assent"], "answer": 0, "explanation": "Correct: A law made under Article 252 remains permanent until repealed (or until the Lok Sabha passes a resolution to end it) — and importantly, the requesting states cannot amend such a law themselves, since it was made by Parliament.", "globalNum": 233}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which Article gives Parliament the power to make laws to enforce international treaties, even on subjects otherwise in the State List?", "options": ["Article 253", "Article 249", "Article 250", "Article 252"], "answer": 0, "explanation": "Correct: Article 253 empowers Parliament to legislate to implement international treaties, agreements, or conventions. Articles 249, 250, and 252 instead deal with Rajya Sabha's national-interest resolutions, National Emergency, and multi-state requests respectively.", "globalNum": 234}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Under Article 249, if the Rajya Sabha passes a resolution by special majority declaring it necessary in the national interest for Parliament to legislate on a State subject, how long is such a resolution valid, and how many subjects does this currently cover?", "options": ["Valid for 1 year plus 6 months after expiry; currently covers 52 subjects", "Valid for 6 months only; currently covers 100 subjects", "Valid permanently; currently covers 29 subjects", "Valid for 2 years; currently covers 18 subjects"], "answer": 0, "explanation": "Correct: An Article 249 resolution is valid for 1 year, extendable by 6 months after expiry, and presently covers 52 subjects (matching the Concurrent List's current count). This differs from Article 250's simpler 'until repealed or LS resolution' rule.", "globalNum": 235}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which six languages were originally recognised as Classical Languages of India?", "options": ["Tamil, Sanskrit, Telugu, Kannada, Malayalam, and Odia", "Hindi, Sanskrit, Tamil, Bengali, Marathi, and Punjabi", "Tamil, Telugu, Kannada, Malayalam, Hindi, and Urdu", "Sanskrit, Pali, Prakrit, Tamil, Telugu, and Assamese"], "answer": 0, "explanation": "Correct: The original six Classical Languages are Tamil, Sanskrit, Telugu, Kannada, Malayalam, and Odia — remembered via the mnemonic 'Tu Shuru Toh Kar Mai Aariya.' The 2024 additions expanded this list with five more languages.", "globalNum": 236}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which five languages were newly added to the list of Classical Languages of India in 2024?", "options": ["Marathi, Pali, Prakrit, Assamese, and Bengali", "Konkani, Manipuri, Nepali, Sindhi, and Bodo", "Dogri, Maithili, Santhali, Odia, and Tamil", "Hindi, Urdu, Punjabi, Gujarati, and Kashmiri"], "answer": 0, "explanation": "Correct: Marathi, Pali, Prakrit, Assamese, and Bengali were newly added as Classical Languages in 2024. The other options list languages added to the 8th Schedule via earlier Constitutional Amendments (21st, 71st, 92nd CA), a different (though related) list.", "globalNum": 237}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which Constitutional Amendment added Sindhi to the 8th Schedule's list of official languages, and in what year?", "options": ["21st CA, 1967", "71st CA, 1992", "92nd CA, 2003", "96th CA, 2011"], "answer": 0, "explanation": "Correct: The 21st Constitutional Amendment (1967) added Sindhi. The 71st Amendment (1992) added Konkani, Manipuri, and Nepali; the 92nd (2003) added Bodo, Dogri, Maithili, and Santhali; the 96th (2011) renamed 'Oriya' to 'Odia.'", "globalNum": 238}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which three languages were added by the 71st Constitutional Amendment (1992), remembered by the mnemonic 'KMN'?", "options": ["Konkani, Manipuri, Nepali", "Kannada, Marathi, Nagpuri", "Kashmiri, Maithili, Nepali", "Konkani, Malayalam, Nepali"], "answer": 0, "explanation": "Correct: The 71st CA (1992) added Konkani, Manipuri, and Nepali — remembered as 'KMN.' The 92nd CA instead added Bodo, Dogri, Maithili, and Santhali, remembered as 'BDSM.'", "globalNum": 239}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which four languages were added by the 92nd Constitutional Amendment (2003), remembered by the mnemonic 'BDSM'?", "options": ["Bodo, Dogri, Santhali, Maithili", "Bengali, Dogri, Sindhi, Marathi", "Bodo, Dogri, Sanskrit, Manipuri", "Bhojpuri, Dogri, Santhali, Malayalam"], "answer": 0, "explanation": "Correct: The 92nd CA (2003) added Bodo, Dogri, Santhali, and Maithili — remembered as 'BDSM.' The 71st CA instead added Konkani, Manipuri, and Nepali (KMN).", "globalNum": 240}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "Which Constitutional Amendment changed the name 'Oriya' to 'Odia,' and in what year?", "options": ["96th CA, 2011", "21st CA, 1967", "71st CA, 1992", "92nd CA, 2003"], "answer": 0, "explanation": "Correct: The 96th Constitutional Amendment (2011) renamed 'Oriya' to 'Odia.' The other Amendments listed instead added new languages to the 8th Schedule rather than renaming an existing one.", "globalNum": 241}, {"tab": "t9", "tabTitle": "9. Salient Features", "q": "How does the formal definition in the notes describe an 'Amendment'?", "options": ["A formal change to law, contract, constitution, or other legal document", "A complete rewriting of an entire legal document", "An informal suggestion for future legal reform", "A judicial ruling that overturns a law"], "answer": 0, "explanation": "Correct: An 'Amendment' is defined as a formal change to a law, contract, constitution, or other legal document — not a complete rewrite, an informal suggestion, or a court ruling.", "globalNum": 242}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What does Article 1(1) of the Constitution declare?", "options": ["India, that is Bharat, shall be a Union of States", "India shall be a Federation of States", "India shall be a Republic of Provinces", "India shall be a Confederation of Kingdoms"], "answer": 0, "explanation": "Correct: Article 1(1) declares 'India, that is Bharat, shall be a Union of States.' The term 'Federation' is deliberately not used anywhere in the Constitution, ruling out the other phrasings.", "globalNum": 243}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "According to Article 1(3), what three categories make up the territory of India?", "options": ["Territories of the States, Union Territories specified in the First Schedule, and such other territories as may be acquired in future", "Only the territories of the States", "Territories of States and foreign embassies only", "Union Territories and Princely States only"], "answer": 0, "explanation": "Correct: Article 1(3) lists three categories: (a) territories of the States, (b) Union territories in the First Schedule, and (c) other territories that may be acquired in future. The other options omit or misstate these categories.", "globalNum": 244}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Is India described in the Constitution as a 'Federation'?", "options": ["No — India is a 'Union of States'; the term 'federation' appears nowhere in the Constitution", "Yes — India is explicitly called a Federation in Article 1", "Yes, but only in the Preamble", "No — India is called a 'Confederation' instead"], "answer": 0, "explanation": "Correct: India is a 'Union of States' per Article
