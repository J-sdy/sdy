Adjournment Sine Die,' and when does it typically occur?", "options": ["Ending a session without fixing the next meeting date, done by the Presiding Officer, just before prorogation", "A permanent dissolution of the House, done by the President", "A break of exactly 60 days between sessions", "An adjournment that requires support of 50 members"], "answer": 0, "explanation": "Correct: Adjournment Sine Die means ending a sitting without setting a specific next date, done by the Presiding Officer, and it typically happens just before the President formally prorogues the session.", "globalNum": 613}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is an 'Adjournment Motion,' and how many members' support does it need to be admitted?", "options": ["A motion drawing attention to an urgent matter of public importance, needing support of 50 members", "A motion to end a session immediately, needing a simple majority", "A motion to dissolve Parliament, needing 2/3 majority", "A motion requiring no minimum member support at all"], "answer": 0, "explanation": "Correct: An Adjournment Motion draws urgent attention to a matter of public importance and requires the support of 50 members to be admitted — a relatively serious procedural tool that can interrupt normal business.", "globalNum": 614}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is a 'Closure Motion,' and what is a 'Call Attention Motion'?", "options": ["Closure Motion: cuts short debate on a matter; Call Attention Motion: calls a minister's attention to a matter of public importance", "Closure Motion: calls a minister's attention; Call Attention Motion: cuts short debate", "Both motions serve the exact same function", "Closure Motion: dissolves the House; Call Attention Motion: prorogues a session"], "answer": 0, "explanation": "Correct: A Closure Motion ends ongoing debate to move to a vote, while a Call Attention Motion specifically directs a minister's focus to a matter of public importance — two distinct procedural tools.", "globalNum": 615}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is a 'Point of Order,' and is debate allowed on it?", "options": ["Raised when proceedings deviate from normal rules; no debate is allowed on it", "A formal motion requiring extensive debate before a decision", "Only applicable during the Budget Session", "A type of question requiring written answers"], "answer": 0, "explanation": "Correct: A Point of Order is raised to flag a procedural deviation and does not permit debate — it's meant for quick procedural correction, not substantive discussion.", "globalNum": 616}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is the key difference between a Censure Motion and a No-Confidence Motion regarding the need to state reasons?", "options": ["A Censure Motion requires stating reasons; a No-Confidence Motion requires no reason", "A No-Confidence Motion requires stating reasons; a Censure Motion requires none", "Both require detailed reasons to be stated", "Neither motion requires any reason to be stated"], "answer": 0, "explanation": "Correct: A Censure Motion must specify the reasons/grounds for censure, while a No-Confidence Motion needs no stated reason — it simply tests whether the government retains majority support.", "globalNum": 617}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Against whom can a Censure Motion be moved, compared to a No-Confidence Motion?", "options": ["A Censure Motion can target an individual, group, or the entire Council; a No-Confidence Motion can only target the entire Council", "Both motions can only target the entire Council", "A Censure Motion can only target the entire Council; a No-Confidence Motion can target individuals", "Neither motion can target the entire Council"], "answer": 0, "explanation": "Correct: A Censure Motion has broader scope (individual minister, group, or entire Council), while a No-Confidence Motion is specifically aimed at testing the entire Council of Ministers' majority support.", "globalNum": 618}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "If a Censure Motion is passed, is resignation required? What about if a No-Confidence Motion is passed?", "options": ["Censure Motion passing does NOT require resignation; No-Confidence Motion passing REQUIRES mandatory resignation", "Both require mandatory resignation if passed", "Neither requires resignation if passed", "Censure Motion requires resignation; No-Confidence Motion does not"], "answer": 0, "explanation": "Correct: A passed Censure Motion criticises specific policies/actions without forcing resignation, while a passed No-Confidence Motion mandates the government's resignation, since it signals loss of majority support — a much more serious consequence.", "globalNum": 619}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is the difference between 'Starred' and 'Unstarred' Questions in Parliament?", "options": ["Starred questions get oral answers and allow supplementary questions; Unstarred questions get written answers with no supplementary questions", "Starred questions get written answers; Unstarred get oral answers", "Both types allow supplementary questions equally", "Starred questions require 10 days' prior notice; Unstarred require none"], "answer": 0, "explanation": "Correct: Starred questions receive oral answers and permit follow-up (supplementary) questions, while Unstarred questions receive only written answers with no supplementary questions allowed.", "globalNum": 620}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is a 'Short Notice Question,' and how many days' prior notice does it require?", "options": ["10 days' prior notice, for urgent matters of public importance", "30 days' prior notice", "No notice required at all", "60 days' prior notice"], "answer": 0, "explanation": "Correct: A Short Notice Question requires only 10 days' prior notice (much shorter than regular questions), reflecting its use for urgent matters needing quicker ministerial response.", "globalNum": 621}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Can questions be directed at 'private members' (non-minister MPs), and what time slots are allocated to Question Hour and Zero Hour in a typical session routine?", "options": ["Yes, questions can be asked of private members; Question Hour runs 11 AM-12 PM, followed by Zero Hour from 12-1 PM", "No, questions can only be asked of ministers; there is no fixed time for Question Hour", "Questions to private members are asked only during Zero Hour, which runs all day", "Question Hour and Zero Hour are the same thing, held simultaneously"], "answer": 0, "explanation": "Correct: Questions can indeed be asked of private members (non-minister MPs), not just ministers. The typical routine has Question Hour (11 AM-12 PM) followed immediately by Zero Hour (12-1 PM).", "globalNum": 622}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is 'Zero Hour,' and how is it distinguished from formal procedures like Question Hour?", "options": ["An informal device to raise matters without prior notice, lasting until the day's agenda is taken up", "A formal procedure requiring 30 days' advance notice", "A period exclusively for voting on bills", "The final hour of each parliamentary session"], "answer": 0, "explanation": "Correct: Zero Hour is an informal Indian parliamentary innovation (not found in the Constitution or rules) allowing MPs to raise urgent matters without advance notice, lasting until other business begins.", "globalNum": 623}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 86, what can the President do regarding addressing Parliament and pending Bills?", "options": ["Address either or both Houses jointly, and send messages on pending Bills", "Only address the Lok Sabha, never the Rajya Sabha", "Address Parliament only once per year, with no messaging power on Bills", "Only send written messages, never deliver an address"], "answer": 0, "explanation": "Correct: Article 86 allows the President to address either or both Houses (jointly), and separately to send messages regarding pending Bills — giving the President a communicative role in the legislative process.", "globalNum": 624}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 87, on which two occasions must the President specially address both Houses of Parliament, and what is this address also known as?", "options": ["First session after each general election, and first session of each fiscal year; also known as the 'Motion of Thanks' address", "Every Budget session and every Winter session; known as the 'State of the Union' address", "Only during a National Emergency; known as the 'Emergency Address'", "Only when requested by the Prime Minister; known as the 'PM's Address'"], "answer": 0, "explanation": "Correct: Article 87 mandates the President's special address on two occasions — the first session after a general election, and the first session of each fiscal year — commonly referred to as the 'Motion of Thanks' address, since both Houses then debate and thank the President.", "globalNum": 625}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 88, can Ministers and the Attorney General speak and vote in either House of Parliament?", "options": ["Ministers can speak in either House but vote only where they are members; the AG can speak in either House but has no voting right anywhere", "Both Ministers and the AG can speak and vote freely in either House", "Neither Ministers nor the AG can speak in a House they aren't members of", "Ministers cannot speak in Parliament at all; only the AG can"], "answer": 0, "explanation": "Correct: Ministers may speak in either House but vote only in their own House of membership, while the Attorney General (not being a member of either House) can speak in both but cannot vote in either.", "globalNum": 626}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 101, can a person simultaneously be a member of both Houses of Parliament, or of Parliament and a State Legislature?", "options": ["No to both — a person cannot be a member of both Houses of Parliament, nor of Parliament and a State Legislature simultaneously", "Yes, dual membership is allowed in both cases", "Only simultaneous Parliament-State Legislature membership is barred; dual-House membership is fine", "Only simultaneous dual-House membership is barred; Parliament-State Legislature dual membership is fine"], "answer": 0, "explanation": "Correct: Article 101 bars simultaneous membership in both Houses of Parliament, and also bars simultaneous membership in Parliament and a State Legislature — ensuring a person holds only one legislative seat at a time.", "globalNum": 627}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 101, if a member is absent from a House without permission for how many days can that House declare the seat vacant?", "options": ["60 days", "30 days", "90 days", "6 months"], "answer": 0, "explanation": "Correct: If a member is absent without permission for 60 days, the House may declare their seat vacant — encouraging regular attendance and participation.", "globalNum": 628}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under the Representation of the People Act (RPA), 1951, what sentence length leads to disqualification of a Member of Parliament?", "options": ["Jail for more than 2 years", "Jail for more than 6 months", "Any jail term, however short", "Jail for more than 5 years"], "answer": 0, "explanation": "Correct: Under RPA 1951, a conviction leading to imprisonment for more than 2 years results in disqualification from Parliament membership — a specific threshold, not any/all convictions.", "globalNum": 629}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 102, which of these is NOT a ground for disqualification from Parliament membership?", "options": ["Holding office of profit, unsound mind, undischarged insolvency, not being a citizen, or acquiring foreign citizenship/allegiance", "Being over the age of 60", "Being convicted of a minor traffic violation", "Belonging to an opposition political party"], "answer": 1, "explanation": "Correct: Article 102 lists office of profit, unsound mind, insolvency, non-citizenship, and foreign allegiance/citizenship as disqualification grounds. Age (beyond the minimum), minor convictions, and party affiliation are NOT disqualifying factors.", "globalNum": 630}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 102(2) and the 10th Schedule (Anti-Defection Law), which of these constitutes a ground for disqualification due to defection?", "options": ["An independent member joining any political party, or voting contrary to party direction (whip violation)", "A member simply disagreeing with their party's policy in private", "A member attending fewer than 50% of sessions", "A member switching committees within the same house"], "answer": 0, "explanation": "Correct: An independent member joining a party, or a member violating a party whip, are grounds for defection-based disqualification. Private disagreement, attendance issues, and committee switches are not defection grounds.", "globalNum": 631}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under the Anti-Defection Law, when can a nominated member join a political party without facing disqualification, and what is the merger exception?", "options": ["A nominated member can join a party only after 6 months of nomination; and if 2/3rds of a party's members merge with another party, none of them are disqualified (per the 91st CA, 2003)", "A nominated member can join immediately; merger requires 100% member agreement", "Nominated members can never join any party; merger exception requires 1/2 of members", "A nominated member must wait 1 year; there is no merger exception at all"], "answer": 0, "explanation": "Correct: Nominated members can join a party only after 6 months from nomination, and the merger exception (introduced by the 91st CA, 2003) protects members when 2/3rds of a party's members merge into another party — reduced from the earlier, more lenient 1/3rd threshold that had been misused.", "globalNum": 632}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What is a 'Whip' in parliamentary practice, and under what conditions does disobeying it lead to disqualification?", "options": ["A direction from a political party to vote a certain way; disqualification follows if a member votes against/abstains without prior permission, and the act isn't condoned within 15 days", "A ceremonial staff carried by the Speaker; disobedience has no legal consequence", "A written question in Parliament requiring an answer within 15 days", "A type of Bill requiring special majority to pass"], "answer": 0, "explanation": "Correct: A Whip directs party members on voting. Violating it without prior permission, and without the party condoning the act within 15 days, leads to disqualification under the anti-defection law.", "globalNum": 633}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What did the Kihoto Hollohan vs Zachilhu case establish regarding the Speaker's decision on defection-related disqualification?", "options": ["The judiciary CAN review the Speaker's final decision on disqualification under defection", "The judiciary can NEVER review the Speaker's decision under any circumstances", "Only the President can review the Speaker's decision", "The Speaker's decision requires prior approval from the Election Commission"], "answer": 0, "explanation": "Correct: Kihoto Hollohan established that judicial review IS available over the Speaker's defection-disqualification decisions, despite the Constitution's text suggesting the Speaker's decision is 'final' — an important check on potential partisan misuse.", "globalNum": 634}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 103, whose decision on disqualification (other than defection matters) is final, and whose opinion must be obtained first?", "options": ["The President's decision is final, but the Election Commission of India's (ECI) opinion must be obtained first", "The Speaker's decision is final, with no other body's input needed", "The Prime Minister decides directly, without any consultation", "The Supreme Court decides directly, bypassing the President"], "answer": 0, "explanation": "Correct: For non-defection disqualification matters, the President's decision is final, but only after obtaining the ECI's opinion first — ensuring an independent, expert body's input before a final political decision.", "globalNum": 635}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 104, what is the penalty for sitting and voting in Parliament while disqualified?", "options": ["₹500 per day", "₹1,000 per day", "₹100 per day", "₹5,000 per day"], "answer": 0, "explanation": "Correct: Article 104 imposes a ₹500-per-day penalty on a disqualified person who sits and votes in Parliament — a deterrent against knowingly participating while ineligible.", "globalNum": 636}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 105, what protections do MPs enjoy regarding freedom of speech and court scrutiny of parliamentary proceedings?", "options": ["Freedom of speech in Parliament (105(1)), and no parliamentary proceedings can be questioned in any court (105(2))", "MPs have no special speech protections beyond ordinary citizens", "Only Rajya Sabha MPs get free-speech protection, not Lok Sabha", "Courts CAN review any statement made by an MP in Parliament"], "answer": 0, "explanation": "Correct: Article 105(1) guarantees MPs freedom of speech within Parliament, and 105(2) shields parliamentary proceedings from judicial scrutiny — protections that apply equally to both Houses' members.", "globalNum": 637}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 105(3), from what type of arrest are MPs protected during a session, and for how long before/after by convention? Does this protection extend to criminal arrests?", "options": ["Protected from civil arrest during session plus 40 days before/after (by convention); this protection does NOT apply to criminal arrest or preventive detention", "Protected from all arrests, including criminal, during and around sessions", "Protected only during the session itself, with no before/after buffer", "Protected from civil arrest for 90 days before/after the session"], "answer": 0, "explanation": "Correct: MPs get civil arrest protection during sessions plus a 40-day buffer before/after (a convention, not codified numerically in the Article itself), but this explicitly does NOT extend to criminal arrest or preventive detention — MPs aren't above criminal law.", "globalNum": 638}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Is the President's protection from criminal proceedings found under Article 105?", "options": ["No — the President's immunity from criminal proceedings is under Article 361, a separate provision", "Yes, Article 105 covers both MPs and the President equally", "No, the President has no criminal immunity at all", "Yes, but only for the duration specified in Article 105(3)"], "answer": 0, "explanation": "Correct: The President's specific immunity is governed by Article 361, distinct from Article 105 (which covers MPs' privileges) — an important distinction the notes specifically flag as a common confusion point.", "globalNum": 639}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 107, in which House(s) can a Bill originate, with what exception?", "options": ["Either House, except a Money Bill (which can only originate in the Lok Sabha)", "Only the Lok Sabha, for all types of Bills", "Only the Rajya Sabha, except for Money Bills", "Both Houses simultaneously, for every Bill"], "answer": 0, "explanation": "Correct: Ordinary Bills can originate in either House, but Money Bills can only originate in the Lok Sabha — a key asymmetry in the bicameral legislative process.", "globalNum": 640}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 107(4), what happens to a Bill pending in the Lok Sabha (not yet passed) when the LS is dissolved? What about a Bill pending in the Rajya Sabha but not yet passed by the LS?", "options": ["A Bill pending in LS lapses on dissolution; a Bill pending in RS (not passed by LS) does NOT lapse on LS dissolution", "Both types of pending Bills lapse on LS dissolution", "Neither type of pending Bill ever lapses, regardless of dissolution", "A Bill pending in RS lapses; a Bill pending in LS does not lapse"], "answer": 0, "explanation": "Correct: A Bill pending in the LS (where it originated or is currently being considered) lapses upon LS dissolution, but a Bill that has passed the LS and is now pending in the RS does NOT lapse merely because the LS is dissolved — the RS being a permanent body.", "globalNum": 641}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Does a Bill pending in Parliament lapse due to a mere adjournment or prorogation (short of dissolution)?", "options": ["No — a pending Bill does not lapse due to adjournment or prorogation", "Yes, any adjournment causes all pending Bills to lapse", "Yes, but only prorogation causes Bills to lapse, not adjournment", "Only Money Bills survive adjournment; other Bills lapse"], "answer": 0, "explanation": "Correct: Adjournment and prorogation do not cause pending Bills to lapse — only dissolution of the Lok Sabha can cause certain pending Bills to lapse, as detailed under Article 107(4).", "globalNum": 642}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What distinguishes a Money Bill from a Financial Bill, and where must a Money Bill originate?", "options": ["A Money Bill needs the President's prior recommendation and can only originate in the LS; a Financial Bill has a broader scope than a Money Bill", "A Financial Bill needs the President's recommendation; a Money Bill has broader scope", "Both can originate in either House with no distinction", "A Money Bill can originate in the RS; a Financial Bill can only originate in the LS"], "answer": 0, "explanation": "Correct: A Money Bill requires the President's prior recommendation and must originate exclusively in the Lok Sabha, whereas a Financial Bill covers a broader range of matters (some financial provisions plus other subjects) and has different procedural rules.", "globalNum": 643}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What is a 'Private Member's Bill,' and what notice period does it require?", "options": ["A Bill introduced by a non-minister MP, requiring 1 week's prior notice", "A Bill introduced only by the Prime Minister, requiring no notice", "A Bill that can only be a Money Bill, requiring 6 weeks' notice", "A Bill that automatically becomes law without any Parliamentary vote"], "answer": 0, "explanation": "Correct: A Private Member's Bill is introduced by a Member of Parliament who is not a Minister, requiring 1 week's prior notice — distinct from Government Bills introduced by Ministers.", "globalNum": 644}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 108, from which country's constitution is the provision for a Joint Sitting of both Houses taken?", "options": ["Australia", "UK", "USA", "South Africa"], "answer": 0, "explanation": "Correct: The Joint Sitting mechanism is borrowed from Australia, designed to resolve legislative deadlocks between the two Houses of Parliament.", "globalNum": 645}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 108, what three scenarios constitute a 'deadlock' justifying a Joint Sitting?", "options": ["A Bill is rejected by the other House; the Houses finally disagree on amendments; or more than 6 months lapse without the other House passing the Bill", "A Bill is passed unanimously by both Houses", "The President refuses to sign a Bill", "A Bill is withdrawn by its sponsor before voting"], "answer": 0, "explanation": "Correct: A deadlock arises if the other House rejects the Bill, the Houses can't agree on amendments, or 6+ months pass without the other House acting on it — any of these three conditions can trigger a Joint Sitting.", "globalNum": 646}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 108(2), who presides over a Joint Sitting of both Houses, and why can't the Rajya Sabha Chairman preside?", "options": ["The Speaker of the Lok Sabha presides (or Deputy Speaker, or RS Deputy Chairman in succession); the RS Chairman (VP) cannot preside because he is not a member of either House", "The Chairman of Rajya Sabha always presides, since RS is the Upper House", "The President personally presides over all Joint Sittings", "The Chief Justice of India presides over Joint Sittings"], "answer": 0, "explanation": "Correct: The LS Speaker presides (with the Deputy Speaker, then the RS Deputy Chairman as backups) — the RS Chairman (who is the Vice President) is excluded specifically because the VP is not a member of either House, unlike the Deputy Chairman who is an elected RS member.", "globalNum": 647}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "For which two types of Bills is a Joint Sitting NOT allowed, even in case of a deadlock?", "options": ["Money Bill and Constitutional Amendment Bill", "Ordinary Bill and Private Member's Bill", "Financial Bill and Public Bill", "Any Bill originating in the Rajya Sabha"], "answer": 0, "explanation": "Correct: Joint Sittings cannot resolve deadlocks over Money Bills (which are LS's exclusive domain anyway) or Constitutional Amendment Bills (which require specific individual-House majorities, not joint action).", "globalNum": 648}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What majority is needed to pass a Bill in a Joint Sitting, and whose procedural rules are followed?", "options": ["Simple majority; the Rules of the Lok Sabha are followed", "Special (two-thirds) majority; the Rules of the Rajya Sabha are followed", "Absolute majority; a special Joint Sitting rulebook is used", "Unanimous consent; no specific rules apply"], "answer": 0, "explanation": "Correct: A Bill in Joint Sitting passes by simple majority of members present and voting, following the Lok Sabha's own procedural rules (reflecting the LS's typically larger numerical strength in such sittings).", "globalNum": 649}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "How many times has a Joint Sitting of Parliament actually been held, and for which three Bills?", "options": ["3 times: Dowry Prohibition Bill (1960), Banking Services Commission Bill (1977), Prevention of Terrorism Bill (2002)", "5 times, including the GST Bill", "Only once, for the Prevention of Terrorism Bill (2002)", "Never — Joint Sittings remain purely theoretical"], "answer": 0, "explanation": "Correct: Joint Sittings have occurred exactly 3 times in Indian parliamentary history — for the Dowry Prohibition Bill (1960), Banking Services Commission Bill (1977), and Prevention of Terrorism Bill (2002) — a rare but real constitutional mechanism.", "globalNum": 650}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 122, can courts inquire into the internal proceedings of Parliament or the conduct of its members/officers?", "options": ["No — courts are barred from inquiring into Parliament's proceedings or the conduct of MPs/officers", "Yes, courts have full jurisdiction over all parliamentary conduct", "Only the Supreme Court, not High Courts, can inquire", "Courts can inquire only if a Fundamental Right is violated"], "answer": 0, "explanation": "Correct: Article 122 shields Parliament's internal proceedings and the conduct of its members/officers from judicial review — reinforcing parliamentary privilege and separation of powers.", "globalNum": 651}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Under Article 123, when can the President issue an ordinance, and what legal force does it carry?", "options": ["When either/both Houses are not in session; it has the same force as an Act of Parliament", "Only during a National Emergency; it has lesser force than an ordinary law", "At any time, even when Parliament is in session; it needs no parliamentary approval ever", "Only for Money Bills; it automatically becomes permanent law"], "answer": 0, "explanation": "Correct: Ordinances can be issued only when Parliament (either or both Houses) isn't in session, and they carry the same legal force as a regular Act of Parliament — though they require later parliamentary approval to remain in effect.", "globalNum": 652}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What is the maximum possible life of an ordinance if Parliament never approves it, combining the 6-month gap rule and the 6-week reassembly rule?", "options": ["6 months + 6 weeks", "6 months only", "1 year exactly", "6 weeks only"], "answer": 0, "explanation": "Correct: Since Parliament must meet at least every 6 months, and an unapproved ordinance ceases 6 weeks after reassembly, the maximum theoretical life of an ordinance is 6 months + 6 weeks — a useful combined figure to remember.", "globalNum": 653}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What did the Cooper vs Union of India (1970) case establish about the President's ordinance-making 'satisfaction,' and what did D.C. Wadhwa vs State of Bihar (1986) address?", "options": ["Cooper case: the President's satisfaction can be questioned in court on grounds of mala fide; Wadhwa case: addressed misuse via repeated re-promulgation of ordinances", "Cooper case: satisfaction can never be questioned; Wadhwa case: dealt with Money Bills", "Both cases dealt with the same issue of Joint Sittings", "Cooper case addressed re-promulgation; Wadhwa case addressed mala fide satisfaction"], "answer": 0, "explanation": "Correct: Cooper (1970) opened the door to judicial review of the President's 'satisfaction' for mala fide exercise, while Wadhwa (1986) specifically tackled the problem of governments repeatedly re-issuing ordinances to bypass proper legislative scrutiny.", "globalNum": 654}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "Which Article governs the ordinance-making power of the President (at the Centre), and which Article governs the equivalent power of the Governor (at the State level)?", "options": ["Article 123 for the President; Article 213 for the Governor", "Article 213 for the President; Article 123 for the Governor", "Article 356 for both", "Article 249 for the President; Article 250 for the Governor"], "answer": 0, "explanation": "Correct: Article 123 gives the President ordinance power at the Union level, while Article 213 gives the Governor a parallel power at the State level — mirroring structures for the two tiers of government.", "globalNum": 655}, {"tab": "t26", "tabTitle": "26. Membership & Bills", "q": "What are the two special powers of the Rajya Sabha mentioned in the notes, relating to All India Services and State List legislation?", "options": ["Authorising a new All India Service under Article 312, and authorising Parliament to legislate on a State List subject under Article 249", "Authorising the Union Budget and impeaching the President", "Nominating the CAG and appointing the Attorney General", "Amending the Constitution unilaterally without the Lok Sabha"], "answer": 0, "explanation": "Correct: The RS can pass a special resolution to let Parliament create a new All India Service (Article 312 — currently IAS, IPS, IFoS) or legislate on a State List subject in the national interest (Article 249) — powers that give the RS unique leverage despite its generally weaker status compared to the LS on most matters.", "globalNum": 656}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 109(1), where can a Money Bill be introduced, and on whose recommendation?", "options": ["Only in the Lok Sabha, on the President's recommendation", "In either House, without any presidential involvement", "Only in the Rajya Sabha, on the PM's recommendation", "In both Houses simultaneously"], "answer": 0, "explanation": "Correct: A Money Bill can only be introduced in the Lok Sabha, and only with the President's prior recommendation — a stricter requirement than for ordinary Bills.", "globalNum": 657}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 109(2), within how many days must the Rajya Sabha respond to a Money Bill sent to it, and what happens if it doesn't?", "options": ["14 days; if RS doesn't act within this period, the Bill is deemed passed by both Houses", "30 days; if RS doesn't act, the Bill is deemed rejected", "6 months; if RS doesn't act, the Bill goes to a Joint Sitting", "There is no time limit for RS to respond"], "answer": 0, "explanation": "Correct: The RS must respond (approve, suggest amendments, or take no action) within 14 days; if it fails to act, the Bill is automatically deemed passed by both Houses — reflecting the RS's limited power over Money Bills.", "globalNum": 658}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 109(3), can the Lok Sabha reject the Rajya Sabha's suggested amendments to a Money Bill?", "options": ["Yes — the LS may accept or reject the RS's suggestions freely", "No, the LS must accept all RS suggestions on Money Bills", "The LS can reject amendments only with a two-thirds majority", "This requires a Joint Sitting to resolve"], "answer": 0, "explanation": "Correct: The LS has final say — it can accept or reject any RS suggestions on a Money Bill, reflecting the LS's dominance in financial legislation.", "globalNum": 659}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 110, a Bill is classified as a Money Bill only if it contains provisions EXCLUSIVELY on which matters?", "options": ["Taxation, borrowing regulation, custody/audit of Consolidated/Contingency Fund, appropriation from Consolidated Fund, charged expenditure, and receipts into Consolidated Fund/Public Account", "Any matter related to government spending, however broadly defined", "Only taxation matters, with no other financial provisions included", "Defence spending and foreign policy expenditure exclusively"], "answer": 0, "explanation": "Correct: Article 110 lists specific financial matters (taxation, borrowing, fund custody/audit, appropriation, charged expenditure, and fund receipts) — a Bill qualifies as a Money Bill ONLY if it deals EXCLUSIVELY with these, not broader financial or spending matters generally.", "globalNum": 660}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Is a Bill considered a Money Bill if it provides for the imposition or abolition of a fine by a local authority?", "options": ["No — such a provision does NOT make it a Money Bill", "Yes, any fine-related provision automatically qualifies as a Money Bill", "Only if the fine amount exceeds ₹10,000", "Yes, but only for fines imposed by state governments, not local authorities"], "answer": 0, "explanation": "Correct: Article 110 specifically excludes fines/penalties imposed by local authorities from the definition of a Money Bill — a notable carve-out among the otherwise broad financial criteria.", "globalNum": 661}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Who certifies whether a Bill is a Money Bill, and is this decision subject to judicial review?", "options": ["The Speaker of the Lok Sabha certifies it; the decision is final but subject to LIMITED judicial review (per the Aadhaar/K.S. Puttaswamy case, 2018)", "The President certifies it; the decision is completely unreviewable", "The Chairman of Rajya Sabha certifies it; fully open to judicial review", "The Election Commission certifies it; not subject to any review"], "answer": 0, "explanation": "Correct: The LS Speaker's certification of a Bill as a Money Bill is final in principle, but the Aadhaar case (K.S. Puttaswamy vs UoI, 2018) opened the door to limited judicial review of this certification — an evolving area of constitutional law.", "globalNum": 662}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 111, after both Houses pass a Bill and it's presented to the President, what two options does the President have?", "options": ["Give assent (making it law) or use veto power", "Only give assent — the President has no veto option at all", "Send the Bill directly to the Supreme Court for review", "Return the Bill to the originating House permanently, with no further options"], "answer": 0, "explanation": "Correct: Once presented, the President can either give assent (turning the Bill into law) or exercise one of the veto powers — there's no automatic 'straight to court' option.", "globalNum": 663}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What is 'Absolute Veto,' and who were the two Presidents noted as first using it, with which Bills?", "options": ["Complete rejection of a Bill; Dr. Rajendra Prasad used it on the PEPSU Appropriation Bill (1954), and R. Venkataraman used it in 1991 on the Parliamentary Salaries Bill", "Complete rejection of a Bill; Giani Zail Singh first used it in 1986", "A temporary delay tactic; used only once, by Rajendra Prasad", "A power to amend Bills unilaterally; never actually used"], "answer": 0, "explanation": "Correct: Absolute Veto completely rejects a Bill. Rajendra Prasad used it on the PEPSU Appropriation Bill (1954), and R. Venkataraman used it in 1991 on the Parliamentary Salaries Bill — Zail Singh instead famously used the pocket veto, a different type.", "globalNum": 664}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What is 'Suspensive Veto,' and for which type of Bill is it NOT available?", "options": ["Returns the Bill for reconsideration, but assent becomes mandatory if Parliament passes it again; NOT available for Money Bills", "Permanently rejects the Bill with no reconsideration; NOT available for Constitutional Amendments", "Delays the Bill indefinitely with no reconsideration option; available for all Bills", "Allows the President to amend the Bill directly; available only for Money Bills"], "answer": 0, "explanation": "Correct: Suspensive Veto lets the President send a Bill back for reconsideration, but must give assent if Parliament re-passes it — however, this option is unavailable for Money Bills, where the President's role is more limited.", "globalNum": 665}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What is 'Pocket Veto,' and who famously used it in India, on which Bill?", "options": ["Taking no action on a Bill, with no time limit to act; Giani Zail Singh used it on the Indian Post Office (Amendment) Bill, 1986", "Rejecting a Bill outright with immediate effect; used by Rajendra Prasad", "Returning a Bill within 10 days mandatorily; used by R. Venkataraman", "Approving a Bill silently without any formal assent; used by Pratibha Patil"], "answer": 0, "explanation": "Correct: Pocket Veto means simply not acting on a Bill, with no constitutional time limit — Giani Zail Singh used this in 1986 on the Indian Post Office (Amendment) Bill, effectively killing it by inaction.", "globalNum": 666}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What did the 24th Constitutional Amendment establish regarding veto power over Constitutional Amendment Bills?", "options": ["No veto (of any kind) can be used by the President for a Constitutional Amendment Bill", "The President can use only an Absolute Veto for such Bills", "The President can use a Pocket Veto but not other vetoes for such Bills", "The 24th Amendment gave the President expanded veto power over amendments"], "answer": 0, "explanation": "Correct: The 24th CA established that the President cannot exercise any veto over a Constitutional Amendment Bill duly passed by Parliament — the President is bound to give assent.", "globalNum": 667}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "How does the Indian President's 'pocket veto' compare to the US President's return-a-bill timeline?", "options": ["The Indian President has no specified time limit ('deeper pocket'), while the US President must return a bill within 10 days", "Both Presidents have identical 10-day limits", "The Indian President must act within 10 days; the US President has no time limit", "Neither President has any veto power at all"], "answer": 0, "explanation": "Correct: India's Constitution sets no time limit for the President to act on a Bill (giving a 'deeper pocket' for indefinite delay), while the US Constitution requires the President to return a bill within 10 days — a notable structural difference.", "globalNum": 668}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 112, what must the President cause to be laid before both Houses, and is the term 'Budget' actually used in the Constitution?", "options": ["A statement of estimated receipts and expenditures (the 'Annual Financial Statement'); the word 'Budget' itself is NOT mentioned in the Constitution", "A detailed spending report from each ministry; 'Budget' IS explicitly used in Article 112", "Only the tax collection figures for the year; 'Budget' is used throughout Part V", "A five-year economic plan; 'Budget' appears only in the Preamble"], "answer": 0, "explanation": "Correct: Article 112 requires an 'Annual Financial Statement' of estimated receipts/expenditures — the popular term 'Budget' is nowhere in the Constitution's actual text, despite being the common name for this exercise.", "globalNum": 669}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "When was the Indian Railway Budget separated from the General Budget, and based on which committee's report?", "options": ["1924, based on the Acworth Committee report", "1950, based on the Ambedkar Committee", "1976, based on the Swaran Singh Committee", "2017, based on the NITI Aayog report"], "answer": 0, "explanation": "Correct: The Railway Budget was separated from the General Budget in 1924, based on the Acworth Committee's recommendations — a separation that lasted nearly a century.", "globalNum": 670}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "In which year, and by which Finance Minister, was the 92-year-old practice of a separate Railway Budget ended, merging it into the Union Budget?", "options": ["2017, by Arun Jaitley", "2014, by Arun Jaitley", "1999, by Yashwant Sinha", "2004, by P. Chidambaram"], "answer": 0, "explanation": "Correct: In 2017, Finance Minister Arun Jaitley presented the first merged Union Budget, ending the separate Railway Budget tradition that had existed since 1924 (92 years).", "globalNum": 671}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 113, what is the difference between expenditure 'Charged on' the Consolidated Fund of India versus expenditure 'Made from' it?", "options": ["'Charged on' expenditure is NOT votable (e.g., President's/SC judges' salaries); expenditure 'Made from' the fund IS votable via Demands for Grants", "'Charged on' expenditure is votable; 'Made from' expenditure is not votable", "Both types are equally votable by Parliament", "Neither type requires any parliamentary authorization at all"], "answer": 0, "explanation": "Correct: 'Charged' expenditure (like the President's or SC judges' salaries) is non-votable, guaranteeing its payment regardless of political disputes, while 'Made from' expenditure is subject to a parliamentary vote via Demands for Grants.", "globalNum": 672}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Which House can vote on Demands for Grants, and what can the other House do?", "options": ["Only the Lok Sabha can vote; the Rajya Sabha can only discuss, not vote", "Only the Rajya Sabha can vote; the Lok Sabha can only discuss", "Both Houses can vote equally on Demands for Grants", "Neither House can vote; only the President decides"], "answer": 0, "explanation": "Correct: Demands for Grants voting is exclusive to the Lok Sabha — the Rajya Sabha can discuss these matters but has no voting power, reflecting the LS's dominance in financial matters generally.", "globalNum": 673}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Which Article establishes the Consolidated Fund of India, and what does it consist of?", "options": ["Article 266(1); it holds all revenues, loans raised, and loan repayments — India's largest fund, needing Parliamentary approval via the Appropriation Act", "Article 267; it holds only emergency funds", "Article 266(2); it holds provident fund deposits with no Parliamentary approval needed", "Article 112; it holds only tax revenue"], "answer": 0, "explanation": "Correct: Article 266(1) establishes the Consolidated Fund of India, the largest government fund, covering revenues and loan-related transactions, requiring Parliamentary approval for any withdrawal (via Appropriation Acts).", "globalNum": 674}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Which Article establishes the Public Account of India, and how does it differ from the Consolidated Fund in terms of Parliamentary approval?", "options": ["Article 266(2); it holds funds like provident funds/small savings where the government acts as a banker/trustee, and does NOT need Parliamentary approval for withdrawals", "Article 267; it needs full Parliamentary approval like the Consolidated Fund", "Article 266(1); it's identical to the Consolidated Fund", "Article 112; it applies only to state governments"], "answer": 0, "explanation": "Correct: Article 266(2) establishes the Public Account, holding funds where the government acts merely as a custodian/trustee (like provident funds), and crucially, this fund does NOT require Parliamentary approval for disbursements, unlike the Consolidated Fund.", "globalNum": 675}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Which Article establishes the Contingency Fund of India, what is it used for, who controls it, and who operates it?", "options": ["Article 267; used for emergency/unforeseen expenditure, controlled by the President, and operated by the Finance Secretary, needing only post-facto Parliamentary approval", "Article 266(1); used for regular annual expenditure, controlled by Parliament directly", "Article 266(2); used for emergency expenditure, controlled by the Prime Minister", "Article 113; used for defence spending only, controlled by the Defence Minister"], "answer": 0, "explanation": "Correct: Article 267 establishes the Contingency Fund for emergencies, formally under the President's control (practically operated by the Finance Secretary), with Parliamentary approval sought only after the fact (post-facto) — allowing rapid emergency response.", "globalNum": 676}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What does an Article 114 Appropriation Bill authorise, and can amendments be made to spending amounts within it?", "options": ["Authorises withdrawal of money from the Consolidated Fund of India; no amendments/voting on the amounts are allowed, since it's passed as a formality after Demands for Grants are voted", "Authorises new taxation; extensive amendments to tax rates are common", "Authorises loans from foreign governments; requires a two-thirds majority", "Authorises the President's ordinance powers; requires no parliamentary vote"], "answer": 0, "explanation": "Correct: The Appropriation Bill formally authorises withdrawal from the Consolidated Fund based on already-voted Demands for Grants — since the amounts were already decided, no further amendment or re-voting on the figures happens at this stage.", "globalNum": 677}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What are the three types of 'Cut Motions' used during voting on Demands for Grants, and what does each represent?", "options": ["Policy Cut (reduce to ₹1, criticising policy), Economy Cut (reduce by a specified amount, suggesting savings), and Token Cut (reduce by ₹100, raising a specific grievance)", "Only one type exists: the General Cut Motion", "Budget Cut, Emergency Cut, and Final Cut", "Absolute Cut, Suspensive Cut, and Pocket Cut"], "answer": 0, "explanation": "Correct: Policy Cut (₹1, criticising underlying policy), Economy Cut (specified reduction, suggesting savings), and Token Cut (₹100, raising a specific grievance) are the three cut motion types used during Demands for Grants debates.", "globalNum": 678}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 115, what is the difference between a 'Supplementary Grant' and an 'Additional Grant'?", "options": ["Supplementary Grant: for when the authorised amount proves insufficient; Additional Grant: for additional expenditure on an entirely new service", "Supplementary Grant: for a new service; Additional Grant: for insufficient existing funds", "Both terms mean exactly the same thing", "Supplementary Grant applies only to Railways; Additional Grant applies to all other ministries"], "answer": 0, "explanation": "Correct: A Supplementary Grant covers a shortfall in an already-authorised amount, while an Additional Grant funds a wholly new service not originally budgeted for — two related but distinct types of mid-year budget adjustments.", "globalNum": 679}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What is an 'Excess Grant' under Article 115?", "options": ["Money spent in excess of the budgeted amount for a service, requiring ex-post-facto parliamentary approval", "Money set aside in advance for future emergencies", "A grant given to states in excess of their normal share", "A type of veto exercised by the Rajya Sabha"], "answer": 0, "explanation": "Correct: An Excess Grant is sought when actual spending on a service exceeds the amount originally budgeted — requiring retrospective (after-the-fact) parliamentary approval to regularise the extra expenditure.", "globalNum": 680}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 116, what is a 'Vote on Account,' and what is a 'Vote on Credit'?", "options": ["Vote on Account: authorises short-term withdrawal from CFI for essential expenditure (expenditure side only); Vote on Credit: a 'blank cheque' grant for urgent needs", "Vote on Account: a blank cheque grant; Vote on Credit: covers only the expenditure side for short-term needs", "Both terms are identical, just used interchangeably", "Vote on Account applies only to Railways; Vote on Credit applies only to Defence"], "answer": 0, "explanation": "Correct: Vote on Account provides interim, short-term funding (only expenditure, not covering revenue estimates) usually while the full Budget is being processed, while Vote on Credit is a broader, more flexible 'blank cheque' from the LS to the Executive for urgent, unforeseen needs.", "globalNum": 681}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "What are 'Exceptional Grants,' and what are the six stages in the enactment of the Budget?", "options": ["Exceptional Grants cover expenses not in the regular budget; the six stages are Presentation, Discussion, Scrutiny by departmental committees, Voting on Demands for Grants, Passing of Appropriation Bill, and Passing of Finance Bill", "Exceptional Grants are the same as Excess Grants; there are only 3 stages", "Exceptional Grants apply only to defence; there are 10 stages of enactment", "Exceptional Grants require no parliamentary approval; there is only 1 stage"], "answer": 0, "explanation": "Correct: Exceptional Grants fund special, non-regular expenses, and the Budget's enactment follows six sequential stages ending with the Appropriation Bill (for spending) and Finance Bill (for taxation) passing.", "globalNum": 682}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 117, what is required for Financial Bills, and how do 'Financial Bills' relate to 'Money Bills'?", "options": ["Financial Bills need the President's prior recommendation and can only be introduced in the LS; all Money Bills are Financial Bills, but not all Financial Bills are Money Bills", "Financial Bills can be introduced in either House with no presidential involvement; Money Bills are a completely separate, unrelated category", "All Financial Bills are Money Bills, and vice versa — the terms are interchangeable", "Financial Bills require a two-thirds majority; Money Bills need only a simple majority"], "answer": 0, "explanation": "Correct: Financial Bills, like Money Bills, need presidential recommendation and LS-only introduction, but 'Financial Bill' is the broader category — every Money Bill is a Financial Bill, but Financial Bills can include additional non-Money-Bill provisions too.", "globalNum": 683}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 120, what are the official languages of Parliamentary proceedings, and what happened to the special status of English after 15 years (unless Parliament decided otherwise)?", "options": ["Hindi or English; the use of English was meant to be removed after 15 years unless Parliament provided otherwise (and Parliament did extend it)", "Only Hindi is allowed under Article 120", "Only English is allowed, with no provision for Hindi", "Any of the 22 official languages listed in the 8th Schedule are equally allowed"], "answer": 0, "explanation": "Correct: Article 120 permits Hindi or English in Parliament, with an original sunset clause meaning to phase out English after 15 years — but Parliament has continued to permit English through subsequent legislation, so it remains in use.", "globalNum": 684}, {"tab": "t27", "tabTitle": "27. Money Bill & Budget", "q": "Under Article 121, can Parliament discuss the conduct of Supreme Court or High Court judges?", "options": ["No — Article 121 prohibits discussion of SC/HC judges' conduct in Parliament (except during an impeachment motion)", "Yes, judges' conduct can be freely discussed and criticised at any time", "Only High Court judges' conduct can be discussed, not Supreme Court judges'", "Judges' conduct can only be discussed in the Rajya Sabha, not the Lok Sabha"], "answer": 0, "explanation": "Correct: Article 121 bars general discussion of SC/HC judges' conduct in Parliament, protecting judicial independence — the notable exception being formal impeachment proceedings, which follow a separate specific procedure.", "globalNum": 685}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 89, who is the Chairman of the Rajya Sabha, and is he/she a member of the House?", "options": ["The Vice President of India, ex-officio — NOT a member of the RS", "The senior-most RS member, elected by the House — IS a member", "The Prime Minister, ex-officio — not a member", "The President of India, ex-officio — not a member"], "answer": 0, "explanation": "Correct: The Vice President serves as RS Chairman ex-officio, and importantly is NOT a member of the Rajya Sabha itself — a key reason the Chairman cannot vote in the first instance, only in a tie.", "globalNum": 686}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Who is the Deputy Chairman of the Rajya Sabha, and who was P.T. Usha, as noted in the notes?", "options": ["Elected by RS from among its own members; P.T. Usha was the first woman appointed to the RS panel of Vice-Chairpersons", "Appointed by the President; P.T. Usha was the first woman Deputy Chairman", "Elected by the Lok Sabha; P.T. Usha was the first woman Speaker", "Nominated by the Vice President personally; P.T. Usha was the first female MP"], "answer": 0, "explanation": "Correct: The Deputy Chairman is elected by RS from its own members (unlike the Chairman/VP, who is not an RS member) and acts as Chairman in the Chairman's absence. P.T. Usha specifically was the first woman on the RS panel of Vice-Chairpersons (a related but distinct role).", "globalNum": 687}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Articles 90-91, how can the Deputy Chairman of RS be removed, and what is the 'Effective Majority' formula?", "options": ["By Effective Majority of total RS membership; Effective Majority = Majority of total membership − Vacancies", "By Simple Majority of members present; Effective Majority = total membership + vacancies", "By a two-thirds Special Majority; Effective Majority = fixed strength of the House", "The Deputy Chairman cannot be removed under any circumstances"], "answer": 0, "explanation": "Correct: Removal requires an Effective Majority (majority of the House's total membership, discounting current vacancies) — a slightly different, often stricter standard than a simple majority of those merely present and voting.", "globalNum": 688}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "If both the Chairman and Deputy Chairman of RS are vacant, who can the President choose to discharge duties? If both are merely absent (not vacant), who presides?", "options": ["President can choose any RS member (if vacant); if merely absent, a member from the Panel of Vice-Chairpersons (appointed by Chairman) presides", "The Prime Minister chooses in both scenarios", "The Lok Sabha Speaker automatically takes over in both scenarios", "No provision exists for either scenario"], "answer": 0, "explanation": "Correct: A true vacancy in both posts lets the President choose any RS member; mere absence (posts not vacant) instead triggers the Panel of Vice-Chairpersons mechanism — note the Panel isn't explicitly named in the Constitution's text, per the notes' caution flag.", "globalNum": 689}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 92, can the RS Chairman preside during discussion of a resolution for their own removal, and can they vote in the first instance generally?", "options": ["Cannot preside during own removal discussion (but can participate); generally does not vote in the first instance, only casting vote in a tie", "Can preside during own removal discussion; votes freely at all times", "Must resign immediately upon any removal motion being tabled", "Can vote in the first instance just like any RS member"], "answer": 0, "explanation": "Correct: The Chairman steps back from presiding during discussion of their own removal (though can still participate/speak), and generally cannot vote in the first instance (only breaking ties) since the VP isn't an RS member.", "globalNum": 690}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Unlike the RS Chairman, can the Deputy Chairman vote in the first instance? Why the difference?", "options": ["Yes — since the Deputy Chairman IS an RS member, they can vote in the first instance AND exercise a casting vote in a tie when presiding", "No, the Deputy Chairman has identical restrictions to the Chairman", "The Deputy Chairman can only vote in a tie, never in the first instance", "The Deputy Chairman cannot vote under any circumstances"], "answer": 0, "explanation": "Correct: Since the Deputy Chairman is an actual RS member (unlike the Chairman/VP), they retain full first-instance voting rights plus the casting vote when presiding — a key structural distinction.", "globalNum": 691}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 93, who was India's first Speaker and first Deputy Speaker of the Lok Sabha, and who was the 1st female Speaker?", "options": ["Ganesh Vasudev Mavalankar (1st Speaker), M.A. Ayyangar (1st Deputy Speaker); Meira Kumar (1st female Speaker, 15th Speaker)", "M.A. Ayyangar (1st Speaker), G.V. Mavalankar (1st Deputy Speaker); Sumitra Mahajan (1st female Speaker)", "Somnath Chatterjee (1st Speaker); Meira Kumar (1st Deputy Speaker)", "G.V. Mavalankar (1st Speaker); Meira Kumar (1st Deputy Speaker and 1st female Speaker)"], "answer": 0, "explanation": "Correct: G.V. Mavalankar was the 1st Speaker, M.A. Ayyangar the 1st Deputy Speaker, and Meira Kumar (the 15th Speaker overall) was the 1st female Speaker — three distinct roles/firsts, not to be confused.", "globalNum": 692}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "The Speaker is ex-officio president of which body, and what special power does the Speaker have regarding privilege questions?", "options": ["Ex-officio president of the Indian Parliamentary Group (IPG); can refer suo motu any question of privilege for investigation", "Ex-officio president of NITI Aayog; has no special privilege power", "Ex-officio Chairman of the Election Commission; can only act on a member's request, never suo motu", "Ex-officio head of the UPSC; can suspend any MP without inquiry"], "answer": 0, "explanation": "Correct: The Speaker heads the Indian Parliamentary Group (IPG) and holds the power to refer privilege questions for investigation suo motu (on their own initiative), not just upon a member's request.", "globalNum": 693}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Since which year has no Deputy Speaker been appointed in the Lok Sabha, per the notes?", "options": ["2019", "2014", "2004", "2009"], "answer": 0, "explanation": "Correct: The notes flag that no Deputy Speaker has been appointed since 2019 — an unusual and notable gap, given the constitutional expectation of filling this position.", "globalNum": 694}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 94, how does the Speaker resign, and does the Speaker's tenure end immediately upon Lok Sabha's dissolution?", "options": ["Resigns by writing to the Deputy Speaker (and vice versa); the Speaker does NOT resign upon dissolution, continuing until the new LS meets", "Resigns by writing to the President; the Speaker's post ends immediately upon dissolution", "Resigns by writing to the Chief Justice; a new Speaker must be elected within 24 hours of dissolution", "Cannot resign at all during the LS term"], "answer": 0, "explanation": "Correct: The Speaker/Deputy Speaker resign to each other (a reciprocal mechanism), and notably, the Speaker's term continues past dissolution of the LS until the newly elected House convenes and picks a new Speaker — ensuring continuity.", "globalNum": 695}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Who fixes the date of the Speaker's election, and who fixes the date for the Deputy Speaker's election?", "options": ["The President fixes the Speaker's election date; the Speaker fixes the Deputy Speaker's election date", "The Speaker fixes both dates", "The President fixes both dates", "Parliament as a whole votes to fix both dates jointly"], "answer": 0, "explanation": "Correct: The President fixes the date for the Speaker's election, while the Speaker (once elected) fixes the date for the Deputy Speaker's election — a sequential, hierarchical process.", "globalNum": 696}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Articles 95-96, who presides if both the Speaker and Deputy Speaker are absent, and is the Deputy Speaker subordinate to the Speaker?", "options": ["A member from the Panel of Chairpersons (appointed by the Speaker) presides; the Deputy Speaker is explicitly NOT subordinate to the Speaker", "The senior-most LS member automatically presides; the Deputy Speaker IS subordinate to the Speaker", "The President personally presides in such cases; subordination status is unspecified", "The Prime Minister presides; the Deputy Speaker reports directly to the PM"], "answer": 0, "explanation": "Correct: The Panel of Chairpersons (appointed by the Speaker) fills in when both are absent, and importantly, the Deputy Speaker is NOT subordinate to the Speaker despite the naming convention — they hold independent constitutional standing.", "globalNum": 697}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Articles 97-98, who determines the salaries of the Chairman/Deputy Chairman (RS) and Speaker/Deputy Speaker (LS), and who appoints Parliament's Secretariat staff?", "options": ["Parliament determines salaries (Art 97); the President appoints staff on the advice of the Speaker (for LS) and Chairman (for RS) (Art 98)", "The President alone fixes salaries; Parliament appoints staff", "The Cabinet fixes salaries; the CJI appoints staff", "State Legislatures fix salaries; the Election Commission appoints staff"], "answer": 0, "explanation": "Correct: Article 97 gives Parliament the power to set these salaries, while Article 98 has the President appoint Secretariat staff, guided by the Speaker's advice for LS staff and the Chairman's advice for RS staff — each House has its own separate secretariat.", "globalNum": 698}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which of these is a listed function of the Cabinet Secretariat?", "options": ["Inter-ministerial coordination, managing major crises, and monitoring policy implementation", "Directly drafting all government legislation", "Appointing all Supreme Court judges", "Conducting general elections nationwide"], "answer": 0, "explanation": "Correct: The Cabinet Secretariat handles inter-ministerial coordination, crisis management, policy implementation monitoring, agenda organisation, and minute-recording — administrative/coordinating functions, not judicial appointments or elections (handled by other bodies).", "globalNum": 699}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 99, who administers the oath to Parliament members, and who was India's first Pro-tem Speaker?", "options": ["The President or their nominee; Somnath Chatterjee was the first Pro-tem Speaker, unanimously elected", "The Speaker of Lok Sabha; Meira Kumar was the first Pro-tem Speaker", "The Chief Justice of India; G.V. Mavalankar was the first Pro-tem Speaker", "The Vice President; M.A. Ayyangar was the first Pro-tem Speaker"], "answer": 0, "explanation": "Correct: The President (or a nominee) administers the oath under Article 99, and Somnath Chatterjee was India's first Pro-tem Speaker, unanimously elected to temporarily administer oaths to newly elected LS members before the regular Speaker is chosen.", "globalNum": 700}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Who is appointed as Pro-tem Speaker, and what is their specific role?", "options": ["The senior-most member of the newly elected Lok Sabha, appointed temporarily by the President to administer the oath to new members", "The outgoing Speaker, who continues in this role temporarily", "The Vice President, in an interim capacity", "The Attorney General, on an ad-hoc basis"], "answer": 0, "explanation": "Correct: The senior-most newly elected LS member is appointed Pro-tem Speaker by the President, purely for the temporary task of administering oaths to other new members before the regular Speaker election.", "globalNum": 701}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Under Article 100, does the Speaker/Chairman vote in the first instance, and what is the minimum quorum required for a House sitting?", "options": ["No first-instance vote (only casting vote in a tie); quorum is a minimum of 1/10th of the total strength", "Full first-instance voting rights; quorum is 1/3rd of total strength", "No voting rights at all, even in a tie; quorum is 50% of total strength", "Votes freely like any member; quorum is fixed at 100 members"], "answer": 0, "explanation": "Correct: Neither the Speaker (LS) nor Chairman (RS) votes in the first instance — only exercising a casting vote to break ties — and the minimum quorum for either House is just 1/10th of its total strength, a relatively low bar.", "globalNum": 702}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "What happens if quorum is not met during a House sitting?", "options": ["The Presiding Officer adjourns the House", "The sitting continues regardless, with all decisions still valid", "The President is immediately notified to dissolve the House", "All pending Bills automatically become law"], "answer": 0, "explanation": "Correct: If quorum (1/10th) isn't met, the Presiding Officer (Speaker/Chairman) adjourns the sitting — it doesn't trigger dissolution, nor does the House simply continue functioning without quorum.", "globalNum": 703}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "How does the Constitution address the tenure and functions of Parliamentary Committees, and who appoints them?", "options": ["The Constitution mentions committees without specific provisions on tenure/functions — these are governed by the rules of the two Houses; appointed by the Speaker/Chairman", "The Constitution provides exhaustive, detailed rules for every committee's tenure and function", "Committees are appointed directly by the President, with fixed constitutional tenures", "Committees are appointed by the Prime Minister and report only to the Cabinet"], "answer": 0, "explanation": "Correct: The Constitution merely mentions committees without detailed rules on tenure/function — these details are left to the House Rules, and committees are appointed by, and work under the direction of, the Speaker/Chairman.", "globalNum": 704}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "What are the two broad classifications of Parliamentary Committees, and which three specific committees fall under the 'Financial Committees' (Standing Committee) category?", "options": ["Permanent and Temporary (Ad Hoc); Financial Committees include Public Accounts Committee, Estimates Committee, and Committee on Public Undertakings", "Judicial and Executive; Financial Committees include only the PAC", "Standing and Select; Financial Committees include the Business Advisory Committee", "Permanent and Temporary; Financial Committees include the Ethics Committee and Rules Committee"], "answer": 0, "explanation": "Correct: Committees are broadly Permanent or Temporary (Ad Hoc), with the Financial Committees subset (all Standing/Permanent, 1-year tenure) comprising the PAC, Estimates Committee, and Committee on Public Undertakings.", "globalNum": 705}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "When was the Public Accounts Committee (PAC) established, how many members does it have, and what is its function?", "options": ["1921 (via GOI Act 1919), 22 members (15 LS + 7 RS); examines CAG audit reports", "1964, 30 members; examines budget estimates", "1950, 22 members; examines public undertaking accounts", "1997, 31 members; examines MP misconduct"], "answer": 0, "explanation": "Correct: The PAC (established 1921 under the GOI Act 1919) has 22 members (15 from LS, 7 from RS), and examines the CAG's audit reports — the CAG being famously called the 'Guide and Philosopher' of the PAC.", "globalNum": 706}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "When was the Estimates Committee re-established (per which committee's recommendation), how many members does it have, and what is its function?", "options": ["Re-established 1950 (John Mathai Committee), 30 members (all from LS, increased from 25 in 1956), examines budget estimates", "Established 1964, 22 members, examines public undertakings", "Established 1921, 22 members, examines CAG reports", "Established 1997, 31 members, examines MP ethics"], "answer": 0, "explanation": "Correct: The Estimates Committee was re-established in 1950 based on the John Mathai Committee's recommendation, has 30 members (all from LS only, increased from 25 in 1956), and examines budget estimates in detail.", "globalNum": 707}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "When was the Committee on Public Undertakings established (per which committee's recommendation), and what is unique about its Chairmanship?", "options": ["Established 1964 (Krishna Menon Committee), 22 members (increased from 15 in 1974); its Chairman must be from the Lok Sabha", "Established 1921, 30 members; Chairman from the Rajya Sabha only", "Established 1950, 22 members; Chairman appointed by the President", "Established 1997, 31 members; no fixed Chairmanship rule"], "answer": 0, "explanation": "Correct: This committee (established 1964, per the Krishna Menon Committee's recommendation) has 22 members (increased from 15 in 1974), and specifically requires its Chairman to come from the Lok Sabha.", "globalNum": 708}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "What are the common features shared by all three Financial Committees (PAC, Estimates, Public Undertakings)?", "options": ["Election via Proportional Representation + STV; 1-year term; no Minister can be a member (only private members)", "Direct nomination by the President; 5-year term; open to any MP including Ministers", "Election by simple majority; permanent, non-rotating tenure; only Cabinet Ministers eligible", "Selection by lottery; 2-year term; open only to Rajya Sabha members"], "answer": 0, "explanation": "Correct: All three share PR-STV election, a 1-year term, and crucially exclude Ministers from membership (restricting it to private/non-minister members) — ensuring independent scrutiny of government finances.", "globalNum": 709}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "When was the Ethics Committee established in the Rajya Sabha and Lok Sabha respectively, and what is its purpose?", "options": ["RS: 1997; LS: 2000; examines cases of MP misconduct/unethical behaviour", "RS: 2000; LS: 1997; examines budget estimates", "Both established in 1964; examines public undertaking accounts", "Both established in 1921; examines CAG reports"], "answer": 0, "explanation": "Correct: The Ethics Committee was set up in the RS in 1997 and the LS in 2000, specifically to examine MPs' misconduct and unethical behaviour — a relatively newer addition compared to the century-old Financial Committees.", "globalNum": 710}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "How many Departmental Related Standing Committees are there in total, and what is their combined membership strength?", "options": ["24 total (16 LS + 8 RS); strength of 31 members each (21 LS + 10 RS)", "30 total; strength of 22 members each", "22 total; strength of 30 members each", "10 total; strength of 50 members each"], "answer": 0, "explanation": "Correct: There are 24 Departmental Related Standing Committees (16 from LS, 8 from RS), each with 31 members (21 LS + 10 RS) — a system for detailed, subject-specific parliamentary oversight of government departments.", "globalNum": 711}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Of which committees is the Speaker of Lok Sabha automatically Chairman, and what happens when the Deputy Speaker is a member of a committee?", "options": ["Speaker chairs the Business Advisory Committee, Rules Committee, and General Purpose Committee; the Deputy Speaker automatically becomes Chairman of any committee they're a member of", "Speaker chairs only the Ethics Committee; Deputy Speaker never chairs any committee", "Speaker chairs the PAC and Estimates Committee; Deputy Speaker chairs the Ethics Committee", "Speaker has no automatic chairmanship of any committee"], "answer": 0, "explanation": "Correct: The Speaker automatically chairs the Business Advisory Committee, Rules Committee, and General Purpose Committee, while the Deputy Speaker separately gets automatic chairmanship of any committee they belong to (e.g., the Committee on Private Members' Bills) — two distinct automatic-chairmanship rules.", "globalNum": 712}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "The Parliament (Art 79-122) and State Legislature (Art 168-212) provisions largely run in parallel. Which Article covers 'Composition' for each?", "options": ["Parliament: Art 79; State Legislature: Art 168", "Parliament: Art 168; State Legislature: Art 79", "Parliament: Art 80; State Legislature: Art 171", "Parliament: Art 81; State Legislature: Art 170"], "answer": 0, "explanation": "Correct: Article 79 covers Parliament's composition, paralleled by Article 168 for State Legislatures — the first in a long series of matching parallel provisions.", "globalNum": 713}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which Articles cover the Upper House's strength/composition (RS vs Legislative Council), and what is the LC's size rule compared to the Assembly?", "options": ["Art 80 (RS, max 250) parallels Art 171 (LC, ≤1/3rd of Assembly strength, minimum 40)", "Art 81 (RS) parallels Art 170 (LC)", "Art 82 (RS) parallels Art 172 (LC)", "Art 171 (RS) parallels Art 80 (LC)"], "answer": 0, "explanation": "Correct: Article 80 sets the RS's max strength at 250, while Article 171 caps a state's Legislative Council at 1/3rd of the Assembly's strength, with a minimum of 40 members — different numeric formulas for the two Upper Houses.", "globalNum": 714}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which Articles cover the Lower House (Lok Sabha vs Legislative Assembly), and what is the Assembly's size range?", "options": ["Art 81 (LS) parallels Art 170 (Assembly, ranging from 60 to 500 members)", "Art 82 (LS) parallels Art 171 (Assembly)", "Art 80 (LS) parallels Art 168 (Assembly)", "Art 170 (LS) parallels Art 81 (Assembly)"], "answer": 0, "explanation": "Correct: Article 81 covers the Lok Sabha, paralleled by Article 170 for State Assemblies, which must have between 60 and 500 members — a wide range accommodating states of vastly different sizes.", "globalNum": 715}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which Article covers readjustment of seats after Census for Parliament, and is there a parallel State-level Article for this specific topic?", "options": ["Article 82 for Parliament; there is NO parallel State-level provision for this specific topic", "Article 168 for Parliament; Article 82 for States", "Article 82 for Parliament; Article 172 for States", "Both Parliament and States share Article 82 identically"], "answer": 0, "explanation": "Correct: Article 82 (Delimitation after Census) applies at the Parliament level, but the notes' comparison table explicitly shows there's no separate parallel State Article for this — it's marked with a dash ('—').", "globalNum": 716}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which Articles cover the duration of Houses (Parliament vs State Legislature)?", "options": ["Article 83 for Parliament; Article 172 for State Legislature", "Article 84 for Parliament; Article 173 for State Legislature", "Article 82 for Parliament; Article 168 for State Legislature", "Article 89 for Parliament; Article 178 for State Legislature"], "answer": 0, "explanation": "Correct: Article 83 governs how long Parliament's Houses last (5 years for LS, permanent for RS), paralleled by Article 172 for State Legislatures (Assembly and Council respectively).", "globalNum": 717}, {"tab": "t28", "tabTitle": "28. Officers & Committees", "q": "Which Articles cover qualification of members (25/30 years age requirement) for Parliament and State Legislature respectively?", "options": ["Article 84 for Parliament; Article 173 for State Legislature", "Article 83 for Parliament; Article 172 for State Legislature", "Article 102 for Parliament; Article 191 for State Legislature", "Article 85 for Parliament; Article 174 for State Legislature"], "answer": 0, "explanation": "Correct: Article 84 sets member qualifications (including the 25/30-year age split between lower/upper houses) for Parliament, paralleled by Article 173 for State Le
