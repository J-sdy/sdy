 1, and the term 'federation' is nowhere mentioned in the Constitution — not in Article 1, the Preamble, or elsewhere.", "globalNum": 245}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What is the key difference between a 'Federation of States' and a 'Union of States,' as illustrated by the USA and India?", "options": ["A Federation (USA) is formed by agreement between federating units; a Union (India) has no such agreement and states cannot secede", "A Federation has no agreement between units; a Union does", "Both are identical in structure with no real difference", "A Union allows states to secede, while a Federation does not"], "answer": 0, "explanation": "Correct: A Federation of States (like the USA) is a new entity formed via treaty/agreement between federating units, while a Union of States (like India) involves no such agreement, and its units cannot secede. This is the exact reverse of what the incorrect options suggest.", "globalNum": 246}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "India is described as an 'Indestructible Union of Destructible States.' What is the USA described as, by contrast?", "options": ["An indestructible union of indestructible states", "A destructible union of destructible states", "A destructible union of indestructible states", "There is no such comparison made for the USA"], "answer": 0, "explanation": "Correct: The USA is described as 'an indestructible union of indestructible states' — its states cannot be altered or abolished by the federal government, unlike Indian states, which Parliament can alter, rename, or reorganize under Article 3.", "globalNum": 247}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What does Article 2 empower Parliament to do?", "options": ["Admit into the Union, or establish, new states on terms and conditions Parliament thinks fit", "Alter the boundaries of an existing Indian state", "Change the name of an existing Indian state", "Merge two existing Indian states"], "answer": 0, "explanation": "Correct: Article 2 empowers Parliament to admit or establish new states (relating to incorporating new/foreign territory), on terms it thinks fit. Altering boundaries, renaming, or merging existing states falls instead under Article 3.", "globalNum": 248}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Which of the following actions can Parliament take under Article 3?", "options": ["Form a new state by separating/uniting territory, increase or diminish a state's area, alter its boundaries, or alter its name", "Only alter a state's name, nothing else", "Only admit entirely new foreign territory into the Union", "Only merge two Union Territories into one state"], "answer": 0, "explanation": "Correct: Article 3 covers forming new states via separation or uniting of territory, increasing or diminishing a state's area, altering boundaries, and altering names. Admitting new/foreign territory is instead covered by Article 2.", "globalNum": 249}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Under Article 3, how must a Bill relating to forming new states or altering boundaries be introduced?", "options": ["With the prior recommendation of the President, who refers the bill to the concerned State legislature", "Directly by any MP without any presidential recommendation", "Only by the state's Chief Minister", "Only after a national referendum"], "answer": 0, "explanation": "Correct: Such a Bill must be introduced with the President's prior recommendation, and the President refers it to the concerned State's legislature for its views. No referendum or CM-only introduction is required.", "globalNum": 250}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Which Constitutional Amendment empowered the President to set a time limit for a State legislature to express its views on an Article 3 Bill?", "options": ["5th Constitutional Amendment", "1st Constitutional Amendment", "42nd Constitutional Amendment", "100th Constitutional Amendment"], "answer": 0, "explanation": "Correct: The 5th Constitutional Amendment empowered the President to set such a time limit. The 1st Amendment instead added the 9th Schedule, the 42nd made various changes including Preamble amendments, and the 100th dealt with the India-Bangladesh boundary agreement.", "globalNum": 251}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What is the key difference between Article 2 and Article 3?", "options": ["Article 2 deals with incorporating foreign/new territory into India; Article 3 deals with altering existing states", "Article 2 deals with altering existing states; Article 3 deals with new foreign territory", "Both deal with exactly the same subject matter", "Article 2 requires a Constitutional Amendment; Article 3 does not require any process"], "answer": 0, "explanation": "Correct: Article 2 is about incorporating new/foreign territory into India, while Article 3 is about amending/altering existing states' area, boundaries, or names. This distinction is explicitly highlighted in the notes.", "globalNum": 252}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Under Article 4(2), if a law made under Article 2 or 3 amends the First or Fourth Schedule, is it treated as a Constitutional Amendment under Article 368?", "options": ["No — such a law is not considered a Constitutional Amendment, and can be passed by Simple Majority", "Yes — it always requires the full Article 368 amendment procedure", "Yes, but only with a two-thirds majority", "No — such laws require unanimous consent of all states"], "answer": 0, "explanation": "Correct: Article 4(2) clarifies that such laws are NOT treated as Constitutional Amendments under Article 368, and can be passed by a Simple Majority in Parliament — a notable exception to the usual amendment process.", "globalNum": 253}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "If Indian territory is to be ceded to a foreign country, what process is required, and which case established this?", "options": ["An amendment under Article 368 is needed, as established in the Berubari Union case (1960)", "Only a Simple Majority law is needed, per Article 4(2)", "No legal process is required — the executive can cede territory unilaterally", "Only a state referendum is required"], "answer": 0, "explanation": "Correct: Ceding Indian territory requires an amendment under Article 368, as established in the Berubari Union case (1960) — unlike the simpler Article 4(2) process which applies only to internal reorganisation, not cession of territory.", "globalNum": 254}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "The 100th Constitutional Amendment (2015) implemented which agreement, and what did it involve?", "options": ["The India-Bangladesh boundary agreement — India transferred 111 enclaves to Bangladesh, while Bangladesh transferred 51 enclaves to India", "The India-Pakistan boundary agreement over Kashmir", "The India-Nepal boundary settlement", "The India-Sri Lanka maritime boundary agreement"], "answer": 0, "explanation": "Correct: The 100th CA (2015) implemented the India-Bangladesh boundary agreement, involving a swap of enclaves: India transferred 111 to Bangladesh, and Bangladesh transferred 51 to India. No such Amendment relates to Pakistan, Nepal, or Sri Lanka boundaries.", "globalNum": 255}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "In 1947, how many of the 565 princely states agreed to accede to the Indian Union by signing the Instrument of Accession?", "options": ["562", "565", "550", "500"], "answer": 0, "explanation": "Correct: 562 out of 565 princely states signed the Instrument of Accession in 1947. The remaining 3 (J&K, Junagarh, Hyderabad) initially refused and joined India by different, later means.", "globalNum": 256}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Which 3 major princely states initially refused to join India, and how did each eventually accede?", "options": ["J&K (Instrument of Accession, 26 Oct 1947, after invasion), Junagarh (referendum), Hyderabad (Operation POLO, Sept 1948)", "J&K (referendum), Junagarh (military operation), Hyderabad (Instrument of Accession)", "Only J&K refused; Junagarh and Hyderabad joined immediately in 1947", "J&K, Junagarh, and Hyderabad all joined via referendum"], "answer": 0, "explanation": "Correct: J&K's Maharaja Hari Singh signed the Instrument of Accession on 26 October 1947 amid a tribal invasion; Junagarh joined after a referendum; and Hyderabad was integrated via the military 'Operation POLO' in September 1948. Each followed a distinct path, not a uniform one.", "globalNum": 257}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Why did Maharaja Hari Singh sign the Instrument of Accession for Jammu & Kashmir on 26 October 1947?", "options": ["To accede J&K to the Dominion of India and seek military assistance following a tribal invasion backed by Pakistan", "To formally declare J&K's full independence from both India and Pakistan", "As part of a scheduled Constituent Assembly vote", "In response to a UN resolution"], "answer": 0, "explanation": "Correct: He signed to accede J&K to India and to seek military assistance against a tribal invasion supported by Pakistan — not for independence, a Constituent Assembly vote, or a UN resolution.", "globalNum": 258}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "In 1950, what four-fold classification was made of Indian states?", "options": ["Part A, Part B, Part C, and Part D states", "Category 1, 2, 3, and 4 states", "Union, Federal, Provincial, and Territorial states", "Major, Minor, Princely, and British states"], "answer": 0, "explanation": "Correct: In 1950, states were classified into Part A, Part B, Part C, and Part D categories. This classification was later abolished following the linguistic reorganisation recommended by the Fazl Ali Commission (1953).", "globalNum": 259}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What did the Dhar Committee (1948), chaired by S.K. Dhar, recommend regarding state reorganisation?", "options": ["States should be reorganised based on administrative convenience, not linguistic factors", "States should be reorganised strictly on a linguistic basis", "No reorganisation of states was needed at all", "States should be merged into a single unitary structure"], "answer": 0, "explanation": "Correct: The Dhar Committee recommended reorganisation based on administrative convenience, explicitly rejecting linguistic factors as the basis. The JVP Committee later also rejected the linguistic theory, confirming this stance initially.", "globalNum": 260}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Who were the members of the JVP Committee (1948), and what did it conclude about linguistic reorganisation?", "options": ["Jawaharlal Nehru, Vallabhbhai Patel, and Pattabhi Sitaramayya; it also rejected the theory of forming states on a linguistic basis", "S.K. Dhar, Fazl Ali, and K.M. Panikkar; it supported linguistic reorganisation", "Fazl Ali, H.N. Kunzru, and K.M. Panikkar; it rejected 'One language, One state' but supported linguistic reorganisation broadly", "Potti Sriramulu, Nehru, and Patel; it recommended forming Andhra Pradesh immediately"], "answer": 0, "explanation": "Correct: The JVP Committee — Nehru, Patel, and Pattabhi Sitaramayya — also rejected linguistic reorganisation, echoing the Dhar Committee. The Fazl Ali Commission (a separate, later body) took a different, more nuanced position.", "globalNum": 261}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "What 1952 event became a turning point leading to the formation of Andhra Pradesh as India's 1st linguistic state (1953)?", "options": ["The death of Potti Sriramulu after a hunger strike demanding a separate Telugu-speaking state", "The publication of the Dhar Committee report", "The Fazl Ali Commission's recommendations", "A Supreme Court ruling on linguistic rights"], "answer": 0, "explanation": "Correct: Potti Sriramulu's death in 1952, following a hunger strike for a separate Telugu state, was the turning point that led to Andhra Pradesh's formation in 1953 as India's 1st linguistic state. The Fazl Ali Commission came later, in 1953, partly in response to this pressure.", "globalNum": 262}, {"tab": "t10", "tabTitle": "10. Union & Territory", "q": "Who were the three members of the Fazl Ali Commission (State Reorganisation Commission, 1953), and what did it conclude?", "options": ["Justice Fazl Ali, K.M. Panikkar, and H.N. Kunzru; it rejected 'One language, One state' but supported reorganising states on a linguistic basis broadly", "S.K. Dhar, Nehru, and Patel; it rejected linguistic reorganisation entirely", "Fazl Ali, Sitaramayya, and Potti Sriramulu; it recommended abolishing all states", "Justice Fazl Ali alone; it recommended a unitary state structure"], "answer": 0, "explanation": "Correct: The Commission comprised Justice Fazl Ali, K.M. Panikkar, and H.N. Kunzru. It rejected the extreme 'One language, One state' formula but did support broadly reorganising states along linguistic lines — a shift from the earlier Dhar and JVP Committees' rejections.", "globalNum": 263}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "The State Reorganisation Act, 1956 was passed based on whose recommendations, and what did it do to the earlier state classification?", "options": ["Based on the Fazl Ali Commission's recommendations; it removed the fourfold classification, creating 14 States + 6 Union Territories", "Based on the Dhar Committee's recommendations; it retained the fourfold classification", "Based on the JVP Committee's recommendations; it created 20 States and no UTs", "Based on the Bombay Reorganisation Act; it created 10 States"], "answer": 0, "explanation": "Correct: The Act followed the Fazl Ali Commission's recommendations and removed the Part A/B/C/D classification, creating 14 States and 6 Union Territories. The Dhar and JVP Committees had instead rejected linguistic reorganisation years earlier.", "globalNum": 264}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Regarding North India, the State Reorganisation Act, 1956 sought to divide the Hindi-speaking belt into which four states?", "options": ["Bihar, UP, MP, and Rajasthan", "Punjab, Haryana, Delhi, and Himachal Pradesh", "UP, MP, Chhattisgarh, and Jharkhand", "Bihar, Jharkhand, UP, and Uttarakhand"], "answer": 0, "explanation": "Correct: The Act divided the large Hindi-speaking belt into Bihar, UP, MP, and Rajasthan. States like Jharkhand, Chhattisgarh, and Uttarakhand were carved out of these much later, in 2000.", "globalNum": 265}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "What did the Fazl Ali Commission (via the 1956 Act) decide regarding tribal states and a Sikh state?", "options": ["It rejected demands for tribal states carved from Bihar/Assam, and did not agree to creating a Sikh state", "It approved both tribal states and a Sikh state", "It approved tribal states but rejected a Sikh state", "It approved a Sikh state but rejected tribal states"], "answer": 0, "explanation": "Correct: The Commission rejected both the demand for tribal states carved out of Bihar and Assam, and the demand for a separate Sikh state. Neither demand was accommodated in the 1956 reorganisation.", "globalNum": 266}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Andhra Pradesh become a full-fledged state, and when did Maharashtra and Gujarat attain statehood?", "options": ["Andhra Pradesh: 1 Nov 1956; Maharashtra & Gujarat: 1 May 1960", "Andhra Pradesh: 1 May 1960; Maharashtra & Gujarat: 1 Nov 1956", "All three: 1 Nov 1956", "Andhra Pradesh: 1963; Maharashtra & Gujarat: 1966"], "answer": 0, "explanation": "Correct: Andhra Pradesh became a full-fledged state on 1 November 1956, while Maharashtra and Gujarat both attained statehood on 1 May 1960, following the bifurcation of Bombay state.", "globalNum": 267}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which state achieved statehood in 1963, and which in 1966 (with Chandigarh becoming a UT)?", "options": ["Nagaland (1963); Haryana (1966)", "Haryana (1963); Nagaland (1966)", "Himachal Pradesh (1963); Nagaland (1966)", "Nagaland (1963); Himachal Pradesh (1966)"], "answer": 0, "explanation": "Correct: Nagaland gained statehood in 1963, and Haryana in 1966 — with Chandigarh becoming a Union Territory as part of that reorganisation. Himachal Pradesh instead gained statehood later, in 1971.", "globalNum": 268}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which three states all gained statehood on the same date, 21 January 1972?", "options": ["Meghalaya, Manipur, and Tripura", "Mizoram, Arunachal Pradesh, and Sikkim", "Nagaland, Haryana, and Himachal Pradesh", "Assam, Meghalaya, and Nagaland"], "answer": 0, "explanation": "Correct: Meghalaya, Manipur, and Tripura all became states on 21 January 1972. Mizoram and Arunachal Pradesh instead became states later, in 1987, and Sikkim in 1975.", "globalNum": 269}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Sikkim gain statehood, and what number state did it become?", "options": ["16 May 1975; 22nd state", "21 January 1972; 20th state", "30 May 1987; 25th state", "1963; 16th state"], "answer": 0, "explanation": "Correct: Sikkim gained statehood on 16 May 1975, becoming India's 22nd state. Goa became the 25th state later, in 1987.", "globalNum": 270}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Goa become the 25th state of India, and which Constitutional Amendment enabled this, given it had been a Union Territory since 1961?", "options": ["30 May 1987, by the 56th Constitutional Amendment", "20 February 1987, by the 55th Constitutional Amendment", "16 May 1975, by the 36th Constitutional Amendment", "1963, by the 22nd Constitutional Amendment"], "answer": 0, "explanation": "Correct: Goa became the 25th state on 30 May 1987, via the 56th Constitutional Amendment, having been a UT since 1961. The 55th CA (1986) instead granted statehood to Arunachal Pradesh.", "globalNum": 271}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Arunachal Pradesh and Mizoram both became states on the same date, 20 February 1987. Which Amendments enabled each, respectively?", "options": ["Arunachal Pradesh: 55th CA, 1986; Mizoram: 53rd CA, 1986", "Arunachal Pradesh: 53rd CA, 1986; Mizoram: 55th CA, 1986", "Both by the 56th CA, 1987", "Arunachal Pradesh: 36th CA; Mizoram: 22nd CA"], "answer": 0, "explanation": "Correct: Arunachal Pradesh's statehood came via the 55th CA (1986), while Mizoram's came via the 53rd CA (1986) — despite sharing the same effective date of 20 February 1987.", "globalNum": 272}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "The Bombay Reorganisation Act, 1960 bifurcated Bombay into which two states, and on what date do both commemorate statehood?", "options": ["Maharashtra and Gujarat; both on 1st May", "Maharashtra and Goa; both on 1st May", "Gujarat and Rajasthan; both on 1st November", "Maharashtra and Karnataka; both on 1st May"], "answer": 0, "explanation": "Correct: The Act split Bombay into Maharashtra and Gujarat, and both states commemorate their statehood on 1st May. Goa, Rajasthan, and Karnataka were not created by this specific Act.", "globalNum": 273}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Besides Maharashtra and Gujarat, which other states celebrate their statehood on 1st November?", "options": ["Karnataka, Kerala, Andhra Pradesh, Chhattisgarh, and Madhya Pradesh", "Haryana, Punjab, and Himachal Pradesh", "Sikkim, Goa, and Mizoram", "Bihar, UP, and Rajasthan"], "answer": 0, "explanation": "Correct: Karnataka, Kerala, Andhra Pradesh, Chhattisgarh, and Madhya Pradesh all celebrate statehood on 1st November — although Maharashtra & Gujarat instead celebrate on 1st May (a different date).", "globalNum": 274}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Constitutional Amendment merged Goa (as a UT), Daman, and Diu, and what military operation had earlier liberated them from Portuguese rule?", "options": ["12th CA, 1962; Operation Vijay, 1961", "10th CA, 1961; Operation Vijay, 1961", "22nd CA, 1969; Operation POLO, 1948", "36th CA, 1975; Operation Vijay, 1961"], "answer": 0, "explanation": "Correct: The 12th CA (1962) dealt with Goa (UT), Daman, and Diu, which had been liberated from Portuguese rule via Operation Vijay (1961). Operation POLO instead refers to Hyderabad's integration in 1948, a separate event.", "globalNum": 275}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "The 10th Constitutional Amendment, 1961 dealt with Dadra & Nagar Haveli as a UT. When was this UT later merged with Daman and Diu?", "options": ["26 January 2020", "30 May 1987", "1 November 1966", "20 December 1961"], "answer": 0, "explanation": "Correct: Dadra & Nagar Haveli was merged with Daman and Diu on 26 January 2020, forming a single UT. The other dates relate to Goa's statehood, Chandigarh's UT status, and Goa/Daman/Diu's liberation, respectively.", "globalNum": 276}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Constitutional Amendment created Meghalaya within Assam, in 1969?", "options": ["22nd Constitutional Amendment", "12th Constitutional Amendment", "69th Constitutional Amendment", "36th Constitutional Amendment"], "answer": 0, "explanation": "Correct: The 22nd CA (1969) created Meghalaya as an autonomous state within Assam, before it became a full state in 1972. The 69th CA instead relates to Delhi's NCT status, and the 36th to Sikkim's full statehood.", "globalNum": 277}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Mizoram and Arunachal Pradesh were both once part of which former administrative unit before becoming Union Territories?", "options": ["NEFA (North-East Frontier Agency)", "Part C States", "British Assam Province", "Bengal Presidency"], "answer": 0, "explanation": "Correct: Both Mizoram and Arunachal Pradesh were once part of NEFA (North-East Frontier Agency) before being created as separate Union Territories and later states.", "globalNum": 278}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Chhattisgarh, Uttarakhand, and Jharkhand all gained statehood in which year, and which parent states were they carved out of respectively?", "options": ["2000; carved from Madhya Pradesh, Uttar Pradesh, and Bihar respectively", "1987; carved from Assam, Bengal, and Bihar respectively", "2014; carved from Andhra Pradesh, MP, and UP respectively", "1972; carved from MP, UP, and Assam respectively"], "answer": 0, "explanation": "Correct: All three gained statehood in 2000 — Chhattisgarh from Madhya Pradesh, Uttarakhand from Uttar Pradesh, and Jharkhand from Bihar. This was a distinct wave of state formation, much later than the 1956-1987 states.", "globalNum": 279}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Telangana become the 29th state of India, and from which state was it carved?", "options": ["2 June 2014, carved from Andhra Pradesh", "2 June 2000, carved from Andhra Pradesh", "1 November 1956, carved from Madhya Pradesh", "20 February 1987, carved from Karnataka"], "answer": 0, "explanation": "Correct: Telangana became the 29th state on 2 June 2014, carved out of Andhra Pradesh. This was decades after the 2000 wave (Chhattisgarh, Uttarakhand, Jharkhand).", "globalNum": 280}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "What was Sikkim's status before it became an Indian state, and what dynasty had ruled it?", "options": ["It was ruled by the Chogyal Dynasty before becoming an associate state and then a full state", "It was a British colony before joining India directly as a full state", "It was part of NEFA before becoming a UT", "It was a French colony before being transferred to India"], "answer": 0, "explanation": "Correct: Sikkim was earlier ruled by the Chogyal Dynasty. It then became an 'associate state' before achieving full statehood — a unique path compared to other Indian states.", "globalNum": 281}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article and Amendment made Sikkim an 'associate state' of India, and which Amendment later granted it complete statehood?", "options": ["Article 2A via 35th Amendment (1974) for associate status; complete statehood via 36th Amendment (1975)", "Article 371F via 22nd Amendment for associate status; complete statehood via 12th Amendment", "Article 239AA via 69th Amendment for associate status; complete statehood via 56th Amendment", "Article 3 via 10th Amendment for associate status; complete statehood via 53rd Amendment"], "answer": 0, "explanation": "Correct: Article 2A, inserted by the 35th Amendment (1974), made Sikkim an associate state; the 36th Amendment (1975) then granted it complete statehood as the 22nd state. The other Articles/Amendments relate to Delhi's NCT status, Sikkim's special provisions (371F), and Article 3's general state-alteration powers respectively.", "globalNum": 282}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Who administers a Union Territory under Article 239?", "options": ["The President of India", "The Chief Minister of the nearest state", "The Prime Minister directly", "The Supreme Court"], "answer": 0, "explanation": "Correct: Article 239 provides that a Union Territory is administered by the President of India (typically through an Administrator/Lieutenant Governor). It is not administered by a neighbouring state's CM, the PM directly, or the judiciary.", "globalNum": 283}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article, added by which Amendment, designated Delhi as the National Capital Territory (NCT) with a Legislative Assembly of restricted authority?", "options": ["Article 239AA, by the 69th Constitutional Amendment, 1991", "Article 239A, by the 14th Constitutional Amendment, 1962", "Article 371, by the 12th Constitutional Amendment, 1962", "Article 2A, by the 35th Constitutional Amendment, 1974"], "answer": 0, "explanation": "Correct: Article 239AA, added by the 69th Amendment (1991), designated Delhi as the NCT with a Legislative Assembly having restricted authority (excluding land, police, and public order). Article 239A instead relates to Pondicherry's legislature via the 14th Amendment.", "globalNum": 284}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Over which subjects does the Delhi Legislative Assembly (under Article 239AA) NOT have authority?", "options": ["Land, police, and public order", "Health, education, and transport", "Taxation and finance", "Municipal administration"], "answer": 0, "explanation": "Correct: The Delhi Legislative Assembly's authority under Article 239AA specifically excludes land, police, and public order, which remain under central control — unlike most other subjects, which it can legislate on.", "globalNum": 285}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article, inserted by the 14th Constitutional Amendment (1962), allows Parliament to create a Legislature or Council of Ministers for certain Union Territories, specifically referring to Pondicherry?", "options": ["Article 239A", "Article 239AA", "Article 239", "Article 371"], "answer": 0, "explanation": "Correct: Article 239A, inserted by the 14th CA (1962), allows Parliament to create a Legislature/Council of Ministers for UTs like Pondicherry. Article 239AA instead specifically addresses Delhi's NCT status.", "globalNum": 286}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which three Union Territories were created on 1 November 1956, the same date the State Reorganisation Act took effect?", "options": ["Andaman & Nicobar, Delhi, and Lakshadweep", "Chandigarh, Puducherry, and Goa", "Dadra & Nagar Haveli, Daman & Diu, and Delhi", "Andaman & Nicobar, Chandigarh, and Puducherry"], "answer": 0, "explanation": "Correct: Andaman & Nicobar, Delhi, and Lakshadweep were all created as UTs on 1 November 1956. Chandigarh, Puducherry, and Goa were created as UTs later, on different dates.", "globalNum": 287}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Dadra and Nagar Haveli become a UT, and when did Goa, Daman and Diu become a UT after being liberated from Portuguese rule?", "options": ["Dadra & Nagar Haveli: 11 Aug 1961; Goa/Daman/Diu: 20 December 1961", "Dadra & Nagar Haveli: 20 Dec 1961; Goa/Daman/Diu: 11 Aug 1961", "Both became UTs on 16 Aug 1962", "Dadra & Nagar Haveli: 1987; Goa/Daman/Diu: 1966"], "answer": 0, "explanation": "Correct: Dadra and Nagar Haveli became a UT on 11 August 1961, and Goa, Daman and Diu became a UT on 20 December 1961, after liberation from Portuguese rule. Puducherry instead became a UT slightly later, on 16 August 1962.", "globalNum": 288}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Puducherry become a Union Territory, and from which colonial power was it transferred?", "options": ["16 August 1962, transferred from France", "20 December 1961, transferred from Portugal", "1 November 1966, transferred from Britain", "11 August 1961, transferred from France"], "answer": 0, "explanation": "Correct: Puducherry became a UT on 16 August 1962, transferred from France. Goa, Daman, and Diu were instead transferred from Portugal, and Chandigarh was created domestically via the Punjab Reorganisation Act.", "globalNum": 289}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When did Chandigarh become a Union Territory, and under which Act?", "options": ["1 November 1966, under the Punjab Reorganisation Act", "1 November 1956, under the State Reorganisation Act", "20 December 1961, under the Goa Liberation Act", "16 August 1962, under the Pondicherry Transfer Act"], "answer": 0, "explanation": "Correct: Chandigarh became a UT on 1 November 1966, under the Punjab Reorganisation Act (which also created Haryana). It was not part of the 1956 reorganisation or the Goa/Puducherry transfers.", "globalNum": 290}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "When was Jammu and Kashmir reorganized into the Union Territories of J&K and Ladakh, and what happened to its Legislative Council?", "options": ["31 October 2019; the Legislative Council of J&K was formally abolished", "5 August 2019; the Legislative Council was retained", "26 January 2020; a new Legislative Council was created", "1 November 2019; only the Legislative Assembly was abolished"], "answer": 0, "explanation": "Correct: J&K was reorganized into two UTs (J&K and Ladakh) on 31 October 2019, and its Legislative Council was formally abolished as part of this process.", "globalNum": 291}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Out of 107 seats in the Legislative Assembly of Jammu and Kashmir, how many remain vacant, reserved for Pakistan-occupied Kashmir (PoK)?", "options": ["24", "10", "50", "107"], "answer": 0, "explanation": "Correct: 24 out of 107 seats remain vacant, reserved conceptually for PoK, which is not currently under Indian administration.", "globalNum": 292}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article of the '371 series' deals with special provisions for Nagaland, and which deals with Sikkim?", "options": ["371-A for Nagaland; 371-F for Sikkim", "371-F for Nagaland; 371-A for Sikkim", "371-B for Nagaland; 371-C for Sikkim", "371-G for Nagaland; 371-H for Sikkim"], "answer": 0, "explanation": "Correct: Article 371-A covers Nagaland, and Article 371-F covers Sikkim. 371-B covers Assam and 371-C covers Manipur — different states in the same series.", "globalNum": 293}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article of the '371 series' covers special provisions for both Andhra Pradesh/Telangana, and which specifically establishes a Central University in Andhra Pradesh?", "options": ["371-D for AP/Telangana special provisions; 371-E for the Central University", "371-E for AP/Telangana special provisions; 371-D for the Central University", "371-J for AP/Telangana special provisions; 371-I for the Central University", "371-C for AP/Telangana special provisions; 371-B for the Central University"], "answer": 0, "explanation": "Correct: Article 371-D covers special provisions for Andhra Pradesh/Telangana, while Article 371-E specifically provides for a Central University in Andhra Pradesh. 371-J instead deals with Karnataka, and 371-I with Goa.", "globalNum": 294}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Articles in the '371 series' cover Mizoram, Arunachal Pradesh, Goa, and Karnataka respectively?", "options": ["371-G (Mizoram), 371-H (Arunachal Pradesh), 371-I (Goa), 371-J (Karnataka)", "371-F (Mizoram), 371-G (Arunachal Pradesh), 371-H (Goa), 371-I (Karnataka)", "371-A (Mizoram), 371-B (Arunachal Pradesh), 371-C (Goa), 371-D (Karnataka)", "371-J (Mizoram), 371-I (Arunachal Pradesh), 371-H (Goa), 371-G (Karnataka)"], "answer": 0, "explanation": "Correct: 371-G covers Mizoram, 371-H covers Arunachal Pradesh, 371-I covers Goa, and 371-J covers Karnataka — the last four Articles in this special-provisions series covering 11 states in total (371 through 371-J).", "globalNum": 295}, {"tab": "t11", "tabTitle": "11. State Formation", "q": "Which Article in the '371 series' covers special provisions for Maharashtra and Gujarat jointly?", "options": ["Article 371 (the base article, without any letter suffix)", "Article 371-A", "Article 371-J", "Article 371-I"], "answer": 0, "explanation": "Correct: The base Article 371 (without a letter suffix) covers special provisions for both Maharashtra and Gujarat jointly — the only instance in this series covering two states under one article.", "globalNum": 296}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Article 5, which conditions (any one of which suffices) made a person a citizen of India on 26 January 1950?", "options": ["Born in India; OR either parent born in India; OR ordinarily resident in India for at least 5 years immediately before that date", "Must satisfy all three: born in India AND parent born in India AND 5 years residence", "Only being born in India counted; residence and parentage were irrelevant", "Only 10+ years of continuous residence counted"], "answer": 0, "explanation": "Correct: Article 5 grants citizenship if a person meets ANY ONE of the three conditions — birth in India, parental birth in India, or 5 years' ordinary residence before 26 Jan 1950 — not all three cumulatively.", "globalNum": 297}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "India follows the concept of Single Citizenship. Which country was this concept borrowed from?", "options": ["UK (Britain)", "USA", "Ireland", "Canada"], "answer": 0, "explanation": "Correct: Single Citizenship was borrowed from the UK. The USA instead contributed Fundamental Rights and judicial review; Ireland contributed DPSP; Canada the strong-Centre federal structure.", "globalNum": 298}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Article 6, who was automatically granted Indian citizenship?", "options": ["Persons who migrated from Pakistan to India before 19 July 1948", "Persons who migrated from India to Pakistan after 1 March 1947", "Persons of Indian origin residing outside India who register at an embassy", "Anyone who voluntarily acquires foreign citizenship"], "answer": 0, "explanation": "Correct: Article 6 automatically granted citizenship to those who migrated from Pakistan to India before 19 July 1948. Article 7 deals with migration the other way (India to Pakistan), Article 8 with overseas Indians registering at embassies, and Article 9 with those voluntarily acquiring foreign citizenship (who lose Indian citizenship).", "globalNum": 299}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Article 7, were persons who migrated from India to Pakistan after 1 March 1947 considered Indian citizens?", "options": ["No, unless they returned to India with a permit for resettlement or permanent return", "Yes, automatically, regardless of any permit", "Yes, but only if they returned within 19 July 1948", "No, under no circumstances could they regain citizenship"], "answer": 0, "explanation": "Correct: Such persons were not considered Indian citizens unless they returned with a proper resettlement/permanent-return permit. It was not an absolute, permanent bar, nor an automatic grant.", "globalNum": 300}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "What does Article 8 provide for, and what does Article 9 provide for?", "options": ["Article 8: overseas Indians can acquire citizenship by registering at an Indian embassy; Article 9: voluntary acquisition of foreign citizenship ends Indian citizenship", "Article 8: ends citizenship on acquiring foreign citizenship; Article 9: allows embassy registration", "Both Articles deal with migration from Pakistan", "Article 8 and 9 both deal with Parliament's power to regulate citizenship"], "answer": 0, "explanation": "Correct: Article 8 allows persons of Indian origin abroad to register at an Indian embassy for citizenship, while Article 9 provides that voluntarily acquiring foreign citizenship terminates Indian citizenship. Parliament's general regulatory power is instead covered by Article 11.", "globalNum": 301}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "What does Article 10 provide, and what does Article 11 empower Parliament to do?", "options": ["Article 10: continuance of citizenship rights; Article 11: Parliament may regulate the right of citizenship by law", "Article 10: Parliament regulates citizenship; Article 11: continuance of rights", "Article 10 and 11 both deal with migration cutoffs", "Article 10 deals with OCI cards; Article 11 with NRC"], "answer": 0, "explanation": "Correct: Article 10 provides for the continuance of citizenship rights, and Article 11 gives Parliament the power to regulate citizenship by law — this is the constitutional basis for the later Citizenship Act, 1955.", "globalNum": 302}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "What does the Citizenship Act, 1955 deal with, in relation to the constitutional Articles 5-11?", "options": ["Provisions of citizenship after 26 January 1950 (post-commencement matters)", "Only citizenship as it existed before 1947", "Only the citizenship of foreign diplomats in India", "It repeals Articles 5-11 entirely"], "answer": 0, "explanation": "Correct: The Citizenship Act, 1955 deals with citizenship matters after 26 January 1950, complementing (not repealing) the constitutional provisions in Articles 5-11 which govern citizenship at the Constitution's commencement.", "globalNum": 303}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Section 3 of the Citizenship Act, what was the 'Jus Soli' (Right of Soil) rule before 1 July 1987?", "options": ["Any person born in India automatically acquired Indian citizenship, regardless of parents' nationality", "Citizenship required at least one Indian parent", "Citizenship required both parents to be Indian", "Only children of government officials born in India got citizenship"], "answer": 0, "explanation": "Correct: Before 1 July 1987, Jus Soli meant automatic citizenship for anyone born in India, irrespective of their parents' nationality. This was later restricted due to illegal immigration concerns.", "globalNum": 304}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "For persons born after 3 December 2003, what does the 'Jus Sanguinis' (Right of Blood) rule require for citizenship by birth?", "options": ["At least one parent must be an Indian citizen, and the other must not be an illegal immigrant at the time of birth", "Both parents must be Indian citizens, with no exceptions", "Birth in India alone is sufficient, regardless of parents' status", "Only the father's citizenship status matters"], "answer": 0, "explanation": "Correct: For births after 3 December 2003, citizenship requires at least one parent to be an Indian citizen, with the other parent not being an illegal immigrant at the time of birth — a stricter standard than the earlier Jus Soli rule.", "globalNum": 305}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Section 4 (By Descent), how can a person born outside India acquire Indian citizenship?", "options": ["If either parent is an Indian citizen and the birth is registered at the Indian consulate within one year of birth", "If they reside in India for at least 5 years after birth", "If they marry an Indian citizen", "If they are of Indian origin, regardless of parentage or registration"], "answer": 0, "explanation": "Correct: Citizenship by descent requires either parent to be Indian and registration of the birth at an Indian consulate within one year. Simply being of Indian origin or later marrying an Indian citizen does not by itself confer citizenship by descent.", "globalNum": 306}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Section 5 (By Registration), which categories of people can acquire citizenship, and what residency period applies?", "options": ["Indian-origin individuals, spouses of Indian citizens, or minor children — after residing in India for 7 years", "Any foreign national after residing for 12 years", "Only spouses of Indian citizens, with no residency requirement", "Only minor children of Indian citizens, regardless of residence"], "answer": 0, "explanation": "Correct: Registration is available to Indian-origin individuals, spouses of Indian citizens, or minor children who have resided in India for 7 years. The 12-year residency requirement instead applies to Naturalisation (Section 6), a different route.", "globalNum": 307}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Section 6 (By Naturalisation), what residency period is required, and what language requirement applies?", "options": ["12 years total residency (11 of the preceding 14 years + 1 year immediately before application), and knowledge of one Indian language listed in the 8th Schedule", "7 years total residency, no language requirement", "5 years total residency, and fluency in English required", "20 years total residency, and knowledge of Hindi specifically"], "answer": 0, "explanation": "Correct: Naturalisation requires 12 years' total residency (structured as 11 of the preceding 14 years plus 1 immediately before application) and knowledge of an Indian language from the 8th Schedule — not specifically Hindi or English.", "globalNum": 308}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Which Schedule of the Citizenship Act, 1955 mentions the qualifications for Naturalisation?", "options": ["Third Schedule", "Eighth Schedule", "First Schedule", "Fourth Schedule"], "answer": 0, "explanation": "Correct: The Third Schedule of the Citizenship Act, 1955 mentions the qualifications for Naturalisation. The 8th Schedule referenced in the language requirement belongs to the Constitution, not this Act.", "globalNum": 309}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under Section 7 (By Incorporating a Territory), how is citizenship granted when new territory becomes part of India?", "options": ["The Government of India specifies which persons of that territory shall be granted Indian citizenship", "All residents of the new territory automatically become citizens with no government action needed", "Only residents who apply individually within a year become citizens", "Citizenship is denied to all residents of newly incorporated territory"], "answer": 0, "explanation": "Correct: When new territory is incorporated, the Government of India specifically determines which persons of that territory receive Indian citizenship — it is not automatic for everyone, nor barred for everyone.", "globalNum": 310}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "What did the Citizenship (Amendment) Act, 2003 establish regarding illegal migrants, and what related registry did it lay the foundation for?", "options": ["An illegal migrant cannot acquire citizenship via registration or naturalisation; it laid the foundation for the National Register of Citizens (NRC)", "Illegal migrants can acquire citizenship freely; it created the OCI scheme", "It abolished the Jus Soli rule entirely and created the PIO scheme", "It established the Citizenship Amendment Act, 2019 provisions"], "answer": 0, "explanation": "Correct: The 2003 Amendment barred illegal migrants from acquiring citizenship via registration/naturalisation, and laid the foundation for the NRC. It did not create the OCI scheme (that came via a separate 2005 amendment) nor directly enact the 2019 CAA provisions.", "globalNum": 311}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Which of these is NOT one of the recognised ways to lose Indian citizenship?", "options": ["Renunciation, Termination, and Deprivation", "Marriage to a foreign national, automatically", "Continuous residence outside India for seven years", "Communication or association with an enemy country during war"], "answer": 1, "explanation": "Correct: Marriage to a foreign national does NOT by itself cause loss of citizenship. Actual grounds include Renunciation, Termination, Deprivation, disloyalty to the Constitution, 7 years' continuous residence abroad, 2 years' imprisonment within 5 years of registration, and wartime association with an enemy country.", "globalNum": 312}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "What is the difference between 'Termination' and 'Deprivation' as grounds for losing citizenship?", "options": ["Termination is voluntarily acquiring another country's citizenship without informing India; Deprivation is losing citizenship due to fraud, false documents, or wartime aid to an enemy", "Termination is due to fraud; Deprivation is voluntary foreign citizenship acquisition", "Both terms mean exactly the same thing", "Termination applies only to naturalised citizens; Deprivation applies only to citizens by birth"], "answer": 0, "explanation": "Correct: Termination occurs when someone voluntarily acquires another country's citizenship without informing India, while Deprivation applies when citizenship was obtained by fraud/false documents, or when the person aided an enemy country during war.", "globalNum": 313}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "How long must a person be imprisoned, and within what period after registration, for this to be a ground for losing citizenship?", "options": ["Imprisonment for two years, within five years after registration", "Imprisonment for five years, within two years after registration", "Any imprisonment, at any time after registration", "Imprisonment for ten years, within one year after registration"], "answer": 0, "explanation": "Correct: A 2-year imprisonment sentence within 5 years of registration is the specific ground for losing citizenship. Any lesser or unrelated imprisonment does not automatically trigger this.", "globalNum": 314}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "When was the Overseas Citizen of India (OCI) Scheme introduced, and through what mechanism?", "options": ["2005, through an amendment to the Citizenship Act, 1955", "2015, through a fresh standalone Act", "1955, as part of the original Citizenship Act", "1985, through the Assam Accord"], "answer": 0, "explanation": "Correct: The OCI Scheme was introduced in 2005 via an amendment to the Citizenship Act, 1955. The 2015 date instead relates to the merger of the PIO and OCI schemes, a later, separate event.", "globalNum": 315}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "In what year were the Person of Indian Origin (PIO) Scheme and the OCI Scheme merged, and why?", "options": ["2015, to simplify the system for people of Indian origin living abroad", "2005, to create the OCI scheme for the first time", "2019, as part of the Citizenship Amendment Act", "1985, as part of the Assam Accord"], "answer": 0, "explanation": "Correct: The PIO and OCI schemes were merged in 2015 to simplify matters for the Indian diaspora. The 2005 date instead marks the OCI scheme's original introduction, and 2019/1985 relate to entirely separate citizenship matters (CAA and Assam Accord).", "globalNum": 316}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Which of these is a restriction placed on OCI cardholders?", "options": ["No right to vote, no eligibility for public/government posts, and no ownership of agricultural property", "Full voting rights but no property rights", "Eligibility for all government jobs except judicial posts", "Full Indian passport issuance rights"], "answer": 0, "explanation": "Correct: OCI cardholders cannot vote, cannot hold public/government posts, and cannot own agricultural property. They also cannot be issued an Indian passport, as they remain foreign citizens — the other options misstate these restrictions.", "globalNum": 317}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Which of these is a benefit granted to OCI cardholders?", "options": ["Lifelong multiple-entry visa to visit India, and facilities similar to NRIs in economic, financial, and educational fields", "Full Indian citizenship rights including voting", "The right to buy agricultural land and farmhouses freely", "Automatic eligibility for the office of President"], "answer": 0, "explanation": "Correct: OCI cardholders get a lifelong multiple-entry visa and NRI-like facilities in economic, financial, and educational matters, and can buy/sell most immovable property — except agricultural land, plantation property, or farmhouses, which remain off-limits.", "globalNum": 318}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under the Citizenship Amendment Act, 2019 (Section 6B), which six religious communities from which three countries can acquire citizenship via naturalisation under relaxed conditions?", "options": ["Hindu, Sikh, Parsi, Jain, Christian, Buddhist communities from Bangladesh, Afghanistan, and Pakistan", "Muslim, Hindu, Sikh, Christian, Parsi, and Jain communities from Nepal, Bhutan, and Sri Lanka", "Hindu, Muslim, Christian communities from Bangladesh, Pakistan, and Myanmar", "Sikh, Buddhist, Jain communities only, from Pakistan alone"], "answer": 0, "explanation": "Correct: The CAA 2019 covers Hindu, Sikh, Parsi, Jain, Christian, and Buddhist communities from Bangladesh, Afghanistan, and Pakistan — notably excluding Muslims and countries like Nepal, Bhutan, Sri Lanka, and Myanmar.", "globalNum": 319}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Under the CAA 2019, what is the entry cutoff date, and what is the reduced residency requirement for eligible communities?", "options": ["Entered India on or before 31 December 2014; must have lived in India for at least 6 years (down from 12)", "Entered on or before 25 March 1971; residency of 12 years required", "Entered on or before 19 July 1948; residency of 5 years required", "Entered on or before 1 March 1947; residency of 7 years required"], "answer": 0, "explanation": "Correct: The CAA 2019 sets a 31 December 2014 entry cutoff and reduces the residency requirement to 6 years (from the standard 12 years for naturalisation). The other cutoff dates belong to different provisions (Article 6/7, Assam Accord).", "globalNum": 320}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Section 6A of the Citizenship Act, 1955, arising from the 1985 Assam Accord, sets what cutoff date, and grants citizenship to those who entered before which year?", "options": ["Cutoff of 25 March 1971; grants citizenship to those who entered before 1966", "Cutoff of 31 December 2014; grants citizenship to those who entered before 1971", "Cutoff of 19 July 1948; grants citizenship to those who entered before 1947", "Cutoff of 1 March 1947; grants citizenship to those who entered before 1940"], "answer": 0, "explanation": "Correct: Section 6A sets 25 March 1971 as the Assam Accord cutoff, and grants full citizenship to those who entered before 1966 (with different treatment for those who entered between 1966 and 1971). The 2014 cutoff instead belongs to the separate CAA 2019.", "globalNum": 321}, {"tab": "t12", "tabTitle": "12. Citizenship", "q": "Regarding eligibility for the office of President, how does India differ from the USA?", "options": ["India allows both Citizens by Birth and by Naturalisation to become President; the USA does not allow naturalised citizens to become President", "Both India and the USA bar naturalised citizens from the Presidency", "India bars naturalised citizens from the Presidency, but the USA allows them", "Neither country restricts Presidential eligibility based on citizenship type"], "answer": 0, "explanation": "Correct: India allows citizens by both Birth and Naturalisation to become President, whereas the USA requires the President to be a natural-born citizen, excluding naturalised citizens — the reverse of what the incorrect options suggest.", "globalNum": 322}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "What fundamentally distinguishes Fundamental Rights from other constitutional provisions like DPSP?", "options": ["They are legally enforceable (justiciable) rights", "They are merely moral guidelines with no legal weight", "They apply only to government employees", "They cannot be challenged in any court"], "answer": 0, "explanation": "Correct: Fundamental Rights are a set of legally enforceable, justiciable rights — one can approach a court if they are violated. DPSP, by contrast, are non-justiciable guidelines. FRs apply broadly, not just to government employees.", "globalNum": 323}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Are Fundamental Rights absolute and permanently unchangeable?", "options": ["No — they are not absolute, have limits, and are not 'sacrosanct' or permanent", "Yes, they are completely absolute with no limitations whatsoever", "Yes, once granted they can never be amended", "No rights in Part III have any limits at all"], "answer": 0, "explanation": "Correct: FRs are explicitly not absolute, have inherent limits, and are not permanently untouchable — they can be reasonably restricted and even amended (subject to the basic structure doctrine).", "globalNum": 324}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Can Fundamental Rights be curtailed during an Emergency, and are there any exceptions?", "options": ["Yes, they can be curtailed during Emergency, but Articles 20 and 21 can never be suspended", "No, Fundamental Rights can never be curtailed under any circumstance", "Yes, all Fundamental Rights including Articles 20 and 21 can be suspended", "Only Article 21 can be suspended; all others remain protected"], "answer": 0, "explanation": "Correct: FRs can generally be curtailed during a National Emergency, but Articles 20 (protection in respect of conviction) and 21 (life & personal liberty) can never be suspended, even then — a crucial safeguard.", "globalNum": 325}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "From which country's constitutional document were India's Fundamental Rights borrowed?", "options": ["USA (Bill of Rights)", "UK (Magna Carta)", "Ireland (DPSP)", "France (Declaration of Rights)"], "answer": 0, "explanation": "Correct: Fundamental Rights were borrowed from the USA's Bill of Rights. The UK's Magna Carta and France's Declaration are historically significant but are not the direct source cited in the notes; Ireland instead is the source of DPSP.", "globalNum": 326}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Fundamental Rights are contained in which Part of the Constitution, spanning which Articles?", "options": ["Part III, Articles 12-35", "Part IV, Articles 36-51", "Part II, Articles 5-11", "Part IVA, Article 51A"], "answer": 0, "explanation": "Correct: Fundamental Rights are in Part III, Articles 12-35. Part IV covers DPSP, Part II covers Citizenship, and Part IVA covers Fundamental Duties.", "globalNum": 327}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "By what two epithets are Fundamental Rights commonly referred to, according to the notes?", "options": ["'Conscience of the Constitution' and 'Magna Carta of India'", "'Soul of the Constitution' and 'ID Card of the Constitution'", "'Keynote of the Constitution' and 'Political Horoscope'", "'Jewel set' and 'Most precious part'"], "answer": 0, "explanation": "Correct: FRs are called the 'Conscience of the Constitution' and the 'Magna Carta of India.' The other epithets ('Soul,' 'ID Card,' 'Keynote,' etc.) are instead used to describe the Preamble.", "globalNum": 328}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "What do Fundamental Rights seek to implement?", "options": ["Political democracy", "Economic democracy only", "Social democracy only", "Military governance"], "answer": 0, "explanation": "Correct: Fundamental Rights seek to implement political democracy. Economic and social democracy are instead associated more with DPSP, which aim at social and economic justice.", "globalNum": 329}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "How many Fundamental Rights were there originally, how many are there now, and which right was removed?", "options": ["Originally 7, now 6 — Right to Property was removed", "Originally 6, now 7 — Right to Property was added", "Originally 6, now 6 — no rights were ever removed", "Originally 5, now 6 — Right to Education was added"], "answer": 0, "explanation": "Correct: There were originally 7 FRs; now there are 6, since the Right to Property was removed from Part III. It is now merely a legal right, not a Fundamental Right.", "globalNum": 330}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Which Constitutional Amendment removed the Right to Property from Part III, in what year, and where is it now located?", "options": ["44th CA, 1978; now Article 300-A in Part XII (a legal right, not fundamental)", "42nd CA, 1976; now Article 21A in Part III", "1st CA, 1951; now Article 19(1)(f) still in Part III", "52nd CA, 1985; removed entirely with no replacement"], "answer": 0, "explanation": "Correct: The 44th Amendment (1978) removed the Right to Property from Part III, relocating it as a mere legal right under Article 300-A in Part XII. It was not simply deleted, nor moved to Article 21A (which instead covers the Right to Education).", "globalNum": 331}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "What is the 'Doctrine of Waiver' as mentioned in the notes?", "options": ["Voluntarily giving up a known legal right or claim", "A court's power to strike down unconstitutional laws", "A rule that Fundamental Rights automatically lapse after 10 years", "The process of amending the Constitution"], "answer": 0, "explanation": "Correct: The Doctrine of Waiver refers to voluntarily giving up a known legal right or claim. It is unrelated to judicial review, automatic expiry of rights, or constitutional amendment procedures.", "globalNum": 332}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Which Articles cover the Right to Equality and the Right to Freedom respectively?", "options": ["Right to Equality: 14-18; Right to Freedom: 19-22", "Right to Equality: 19-22; Right to Freedom: 14-18", "Right to Equality: 23-24; Right to Freedom: 25-28", "Right to Equality: 29-30; Right to Freedom: 32"], "answer": 0, "explanation": "Correct: The Right to Equality spans Articles 14-18, and the Right to Freedom spans Articles 19-22. Articles 23-24 instead cover the Right against Exploitation, and 25-28 cover the Right to Freedom of Religion.", "globalNum": 333}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Which Articles cover the Right against Exploitation, Right to Freedom of Religion, Cultural & Educational Rights, and Right to Constitutional Remedies respectively?", "options": ["23-24, 25-28, 29-30, and 32", "25-28, 23-24, 32, and 29-30", "19-22, 23-24, 25-28, and 29-30", "29-30, 32, 23-24, and 25-28"], "answer": 0, "explanation": "Correct: Right against Exploitation is 23-24, Right to Freedom of Religion is 25-28, Cultural & Educational Rights is 29-30, and Right to Constitutional Remedies is Article 32 alone.", "globalNum": 334}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "What does Article 12 define, and which two bodies are specifically noted as falling OUTSIDE this definition?", "options": ["It defines 'State' for Part III purposes; BCCI and NCERT do NOT fall under this definition", "It defines 'Citizen'; the Election Commission and UPSC fall outside it", "It defines 'Law'; Parliament and the Supreme Court fall outside it", "It defines 'State'; all central and state governments fall outside it"], "answer": 0, "explanation": "Correct: Article 12 defines 'State' (including the Union & State governments/legislatures and local/other authorities under government control), and specifically excludes bodies like BCCI and NCERT from this definition.", "globalNum": 335}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Which bodies/entities ARE included within the Article 12 definition of 'State'?", "options": ["Government & Parliament of India, Government & Legislature of each State, and local/other authorities under the control of the Government of India", "Only the central government, excluding all states", "Only private companies performing public functions", "Only the judiciary and Election Commission"], "answer": 0, "explanation": "Correct: 'State' under Article 12 includes the Union government/Parliament, State governments/legislatures, and local/other authorities under Government of India control — a broad definition, but one that still excludes bodies like BCCI and NCERT.", "globalNum": 336}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Under Article 13(1), what happens to pre-Constitution laws that violate Fundamental Rights?", "options": ["They are declared null and void to the extent of the violation", "They remain fully valid regardless of any FR violation", "They automatically become Constitutional Amendments", "They can only be challenged by the President"], "answer": 0, "explanation": "Correct: Article 13(1) declares pre-Constitution laws null & void if they violate Fundamental Rights. This is distinct from Article 13(2), which deals with post-Constitution laws.", "globalNum": 337}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Under Article 13(2), what happens to post-Constitution laws that violate Fundamental Rights?", "options": ["They are void to the extent of the violation", "They are entirely repealed by Parliament automatically", "They remain valid until the next general election", "They must be reviewed by the President before taking effect"], "answer": 0, "explanation": "Correct: Article 13(2) makes post-Constitution laws void only to the extent they violate Fundamental Rights (not necessarily the whole law), paralleling Article 13(1)'s treatment of pre-Constitution laws.", "globalNum": 338}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Under Article 13(3), what does the term 'Law' include?", "options": ["Ordinance, order, by-law, rule, regulation, and notification", "Only Acts passed by Parliament", "Only judicial precedents", "Only the Constitution itself"], "answer": 0, "explanation": "Correct: Article 13(3) gives 'Law' a broad definition including ordinances, orders, by-laws, rules, regulations, and notifications — not just formal Acts of Parliament.", "globalNum": 339}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Does Article 13 (voiding laws inconsistent with Fundamental Rights) apply to Constitutional Amendments made under Article 368?", "options": ["No — Article 13(4) specifically states it does NOT apply to Article 368 amendments", "Yes, all amendments must comply strictly with Article 13", "Only amendments made before 1973 are exempt", "Only amendments affecting Article 21 are exempt"], "answer": 0, "explanation": "Correct: Article 13(4) explicitly excludes Constitutional Amendments under Article 368 from Article 13's scope — though the basic structure doctrine (from Kesavananda Bharati) still limits what such amendments can do.", "globalNum": 340}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "What is the 'Doctrine of Eclipse,' based on Article 13(1)?", "options": ["A law violating Fundamental Rights becomes inoperative to that extent, but is not completely void", "A law violating Fundamental Rights is instantly and permanently repealed", "A law remains fully enforceable despite violating Fundamental Rights", "Only courts, not Parliament, can invoke this doctrine to pass new laws"], "answer": 0, "explanation": "Correct: The Doctrine of Eclipse holds that an FR-violating law becomes inoperative (dormant) to the extent of the violation, but is not entirely void — it could become operative again if the relevant FR is later amended away. It is not the same as outright repeal.", "globalNum": 341}, {"tab": "t13", "tabTitle": "13. Fundamental Rights — Basics", "q": "Which landmark 1803 US Supreme Court case first established the principle of Judicial Review, as noted alongside the Doctrine of Eclipse discussion?", "options": ["Marbury v. Madison", "Brown v. Board of Education", "Roe v. Wade", "Miranda v. Arizona"], "answer": 0, "explanation": "Correct: Marbury v. Madison (1803) is the landmark US case that first established Judicial Review. The other cases (Brown, Roe, Miranda) are significant US cases on different constitutional issues, unrelated to judicial review's origin.", "globalNum": 342}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which category of persons are, as an exception, protected from arrest in civil/criminal matters under discussions related to Article 14?", "options": ["President, MLAs/MPs, Governor, and foreign dignitaries", "Only the President and Prime Minister", "Only Supreme Court judges", "All government employees"], "answer": 0, "explanation": "Correct: The President, MLAs/MPs, Governors, and foreign dignitaries enjoy this exception from arrest in civil/criminal matters — not all government employees or judges generally.", "globalNum": 343}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Who considered 'equality before law' a fundamental principle of the Rule of Law?", "options": ["A.V. Dicey", "Ivor Jennings", "K.C. Wheare", "Granville Austin"], "answer": 0, "explanation": "Correct: A.V. Dicey considered equality before law fundamental to the Rule of Law. Jennings, Wheare, and Austin instead offered various characterisations of Indian federalism, a different topic.", "globalNum": 344}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "What is the difference between 'Equality Before Law' and 'Equal Protection of Laws'?", "options": ["Equality Before Law is a negative concept from the UK (everyone treated equally); Equal Protection of Laws is a positive concept from the USA (like should be treated alike)", "Equality Before Law is from the USA; Equal Protection is from the UK", "Both terms are identical with no distinction", "Equal Protection of Laws applies only to foreigners"], "answer": 0, "explanation": "Correct: Equality Before Law (negative concept, from the UK) means everyone is treated equally under the law, while Equal Protection of Laws (positive concept, from the USA) means similarly situated people should be treated alike — allowing reasonable classification.", "globalNum": 345}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which case laid the foundation for the 'reasonable classification' test under Article 14?", "options": ["Anwar Ali Sarkar Case (1952)", "Champakam Dorairajan Case", "Indra Sawhney Case (1992)", "Kesavananda Bharati Case (1973)"], "answer": 0, "explanation": "Correct: The Anwar Ali Sarkar Case (1952) established the 'reasonable classification' test under Article 14, ensuring equal treatment doesn't bar legitimate differentiation. The other cases deal with different issues — reservation and basic structure respectively.", "globalNum": 346}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "On what grounds does Article 15(1) prohibit the State from discriminating against citizens?", "options": ["Religion, race, caste, sex, and place of birth", "Only religion and caste", "Political affiliation and income level", "Age and marital status"], "answer": 0, "explanation": "Correct: Article 15(1) prohibits discrimination on grounds of religion, race, caste, sex, or place of birth — political affiliation, income, age, and marital status are not the listed grounds here.", "globalNum": 347}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "What does Article 15(2) specifically prohibit regarding access to public places?", "options": ["Disability/restriction regarding access to shops, hotels, public entertainment, and to wells, tanks, roads maintained by State funds", "Restrictions only on entering government offices", "Restrictions on private clubs", "Restrictions on religious places of worship only"], "answer": 0, "explanation": "Correct: Article 15(2) bars discrimination in access to shops, hotels, and public entertainment, as well as state-funded wells, tanks, and roads — a broader public-access guarantee, not limited to government offices or religious places.", "globalNum": 348}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Article 15(4), which allows special provisions for the advancement of SC/ST, was added following which case and which Amendment?", "options": ["Champakam Dorairajan case, leading to the 1st Constitutional Amendment (1951)", "Indra Sawhney case, leading to the 77th Amendment", "Kesavananda Bharati case, leading to the 42nd Amendment", "Golaknath case, leading to the 24th Amendment"], "answer": 0, "explanation": "Correct: The Champakam Dorairajan case led to Article 15(4) being added via the 1st Constitutional Amendment (1951). The other cases relate to different constitutional issues (reservation caps, basic structure, amendment power over FRs).", "globalNum": 349}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which Amendment inserted Article 15(5), providing for reservation of socially/educationally backward classes and SC/ST in educational institutions?", "options": ["93rd Constitutional Amendment, 2005", "1st Constitutional Amendment, 1951", "103rd Constitutional Amendment, 2019", "77th Constitutional Amendment, 1995"], "answer": 0, "explanation": "Correct: The 93rd CA (2005) inserted Article 15(5). The 103rd CA (2019) instead added Article 15(6) for EWS reservation, and the 77th CA (1995) added Article 16(4A) for SC/ST promotion reservation.", "globalNum": 350}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which Amendment added Article 15(6), providing for up to 10% EWS reservation, and in what year?", "options": ["103rd Constitutional Amendment, 2019", "93rd Constitutional Amendment, 2005", "81st Constitutional Amendment, 2000", "16th Constitutional Amendment"], "answer": 0, "explanation": "Correct: The 103rd CA (2019) added Article 15(6), providing up to 10% reservation for Economically Weaker Sections (EWS). The 93rd CA instead dealt with SC/ST/OBC reservation in education, and the 81st CA dealt with carrying forward unfilled vacancies.", "globalNum": 351}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "What does Article 16(1) and 16(2) guarantee regarding public employment?", "options": ["Equality of opportunity in employment under the State, with no citizen made ineligible on grounds like religion, race, caste, sex, descent, place of birth, or residence", "Guaranteed employment for every citizen regardless of qualifications", "Reservation of 50% of all government posts for SC/ST", "Preference for government employees' family members"], "answer": 0, "explanation": "Correct: Article 16(1)-(2) guarantee equality of opportunity in public employment and prohibit ineligibility based on the listed grounds — it does not guarantee a job for everyone, nor mandate any specific reservation percentage on its own.", "globalNum": 352}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Under Article 16(3), what special power does Parliament have regarding local employment?", "options": ["Parliament can prescribe a residence requirement to prefer local residents for certain local employment", "Parliament can bar non-residents from all government jobs nationwide", "Parliament can reserve all local jobs exclusively for one caste", "States can independently create residence-based reservation without Parliament's involvement"], "answer": 0, "explanation": "Correct: Article 16(3) allows Parliament (not states independently) to prescribe residence requirements favoring local residents for certain local employment — a narrow, Parliament-controlled exception to the general non-discrimination rule.", "globalNum": 353}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which Amendment added Article 16(4A), providing reservation in promotion with consequential seniority for SC/ST, and which added 16(4B) for carrying forward unfilled reserved vacancies?", "options": ["77th CA, 1995 for 16(4A); 81st CA, 2000 for 16(4B)", "81st CA, 2000 for 16(4A); 77th CA, 1995 for 16(4B)", "93rd CA, 2005 for 16(4A); 103rd CA, 2019 for 16(4B)", "1st CA, 1951 for 16(4A); 42nd CA, 1976 for 16(4B)"], "answer": 0, "explanation": "Correct: The 77th CA (1995) added Article 16(4A) for promotion reservation with consequential seniority, and the 81st CA (2000) added Article 16(4B), embodying the 'Doctrine of Advancement' for carrying forward unfilled reserved vacancies.", "globalNum": 354}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Under Article 16(5), what may religious institutions like temples, mosques, or churches require of their employees?", "options": ["That the employees belong to the same religion as the institution", "Nothing — religious institutions cannot impose any hiring criteria", "That employees be government-appointed", "That employees pass a Union Public Service Commission exam"], "answer": 0, "explanation": "Correct: Article 16(5) allows religious/denominational institutions to require their employees to be of the same religion — a specific, narrow exception to the general non-discrimination rule in public employment.", "globalNum": 355}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which Amendment added Article 16(6), providing 10% EWS reservation in public employment?", "options": ["103rd Constitutional Amendment, 2019", "93rd Constitutional Amendment, 2005", "77th Constitutional Amendment, 1995", "81st Constitutional Amendment, 2000"], "answer": 0, "explanation": "Correct: The 103rd CA (2019) added both Article 15(6) and 16(6), providing 10% EWS reservation in education and public employment respectively — a single Amendment covering both spheres.", "globalNum": 356}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which Article provides that claims of SC/ST shall be considered in matters of public employment?", "options": ["Article 335", "Article 235", "Article 16(4)", "Article 15(4)"], "answer": 0, "explanation": "Correct: Article 335 addresses consideration of SC/ST claims in public employment appointments. Article 235 instead relates to High Courts' control over subordinate courts, a different topic entirely.", "globalNum": 357}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Who chaired the Kalelkar Commission (1953), India's 1st Backward Class Commission?", "options": ["Kaka Kalelkar", "B.P. Mandal", "Fazl Ali", "Justice P.N. Bhagwati"], "answer": 0, "explanation": "Correct: Kaka Kalelkar chaired the 1953 Commission (hence 'Kalelkar Commission'). B.P. Mandal chaired the later, 2nd Backward Class Commission (1979); Fazl Ali chaired the State Reorganisation Commission; Bhagwati is known as the Father of PIL in India.", "globalNum": 358}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Who chaired the Mandal Commission (1979), India's 2nd Backward Class Commission, what did it recommend, and who implemented it?", "options": ["B.P. Mandal chaired it; recommended 27% reservation for OBCs; implemented by PM V.P. Singh in 1990", "Kaka Kalelkar chaired it; recommended 50% reservation; implemented by Indira Gandhi", "Justice P.N. Bhagwati chaired it; recommended 10% EWS reservation; implemented by Modi", "Fazl Ali chaired it; recommended abolishing all reservations"], "answer": 0, "explanation": "Correct: B.P. Mandal chaired the 1979 Commission, which recommended 27% OBC reservation, later implemented by PM V.P. Singh in 1990. Kalelkar's earlier commission and Bhagwati/Fazl Ali's roles were unrelated to this specific recommendation.", "globalNum": 359}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "In the Indra Sawhney Case (1992), also known as the Mandal case, what did the Supreme Court decide regarding OBC reservation?", "options": ["It upheld the 27% OBC reservation but set a 50% cap on total reservations", "It struck down all OBC reservation as unconstitutional", "It raised the reservation cap to 75%", "It removed the creamy layer exclusion entirely"], "answer": 0, "explanation": "Correct: The Court upheld 27% OBC reservation while capping total reservations at 50%, and also affirmed the exclusion of the 'creamy layer' from OBC reservation benefits — a landmark balancing decision.", "globalNum": 360}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Who filed the PIL in the Indra Sawhney Case, and what concept from the notes explains why the 'creamy layer' within OBCs is excluded from reservation?", "options": ["Advocate Indira Sawhney filed the PIL; the creamy layer concept excludes economically/socially advanced members of OBCs from reservation benefits", "Justice P.N. Bhagwati filed the PIL; the creamy layer refers to SC/ST members only", "B.P. Mandal filed the PIL; the creamy layer applies to EWS candidates", "Kaka Kalelkar filed the PIL; the creamy layer applies to all reserved categories equally"], "answer": 0, "explanation": "Correct: Advocate Indira Sawhney filed the PIL in this case, and the 'creamy layer' concept (excluding relatively advanced members of OBCs from reservation) emerged from this and related rulings — it applies specifically to OBCs, not SC/ST or EWS.", "globalNum": 361}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "From which country was the concept of PIL (Public Interest Litigation) taken, and who is called the 'Father of PIL in India'?", "options": ["USA; Justice P.N. Bhagwati", "UK; Justice P.N. Bhagwati", "USA; B.R. Ambedkar", "Ireland; K.M. Munshi"], "answer": 0, "explanation": "Correct: PIL was taken from the USA's constitutional practice, and Justice P.N. Bhagwati is called the Father of PIL in India. Ambedkar and Munshi are instead associated with drafting the Constitution itself.", "globalNum": 362}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Which case is considered the 1st reported PIL case in India?", "options": ["Hussainara Khatoon v. State of Bihar (1979)", "Indra Sawhney Case (1992)", "Anwar Ali Sarkar Case (1952)", "Kesavananda Bharati Case (1973)"], "answer": 0, "explanation": "Correct: Hussainara Khatoon v. State of Bihar (1979), dealing with undertrial prisoners' rights, is regarded as the 1st reported PIL case in India.", "globalNum": 363}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "What does Article 17 abolish, and who is prohibited from practicing it?", "options": ["Untouchability, prohibited for both the State and any private individual", "Discrimination based
