ergency Provisions", "q": "Under Article 355, what is the Centre's duty regarding states, and how does this connect to Article 356?", "options": ["The Centre must protect every state against external aggression (and internal disturbance); this duty forms the foundation for Centre intervention under Article 356 when necessary", "The Centre has no duty to protect states at all", "Article 355 is entirely unrelated to Article 356", "Article 355 obligates states to protect the Centre, not vice versa"], "answer": 0, "explanation": "Correct: Article 355 establishes the Centre's protective duty toward states, which the notes explicitly link as the constitutional foundation enabling Centre intervention (President's Rule) under Article 356 when a state situation demands it.", "globalNum": 863}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What are the two grounds for imposing President's Rule (Article 356)?", "options": ["A situation where state government cannot be carried on per the Constitution, OR a state's failure to comply with Centre's directions", "Only financial instability in the state", "Only a natural disaster in the state", "Only a request from the state's own legislature"], "answer": 0, "explanation": "Correct: The two grounds are constitutional breakdown in the state, or non-compliance with Central directions — distinct from Financial Emergency's grounds (financial instability) or National Emergency's grounds (war/aggression/rebellion).", "globalNum": 864}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Within how long must President's Rule be approved by Parliament, by what majority, and for how long can it be extended in total?", "options": ["Within 2 months, by Simple Majority; extendable to a maximum of 3 years (per the 44th CA, 1978)", "Within 1 month, by Special Majority; extendable indefinitely", "Within 6 months, by Simple Majority; no maximum extension limit", "Within 14 days, by Special Majority; extendable to 5 years"], "answer": 0, "explanation": "Correct: President's Rule needs 2-month Parliamentary approval by Simple Majority, and per the 44th CA (1978), can be extended in 6-month blocks up to a maximum total of 3 years.", "globalNum": 865}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "During President's Rule, what happens to the state's executive and legislative functions?", "options": ["President takes over the Governor's functions, Parliament takes over the State Legislature's functions, and the state executive is dismissed or the legislature suspended/dissolved", "The state executive and legislature continue functioning unchanged", "Only the executive is affected; the legislature is unaffected", "Only the legislature is affected; the executive is unaffected"], "answer": 0, "explanation": "Correct: President's Rule effectively transfers both executive functions (to the President, via the Governor) and legislative functions (to Parliament) away from the state's own institutions, with the state government dismissed or its legislature suspended/dissolved.", "globalNum": 866}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Is there any effect on Fundamental Rights during President's Rule (unlike during a National Emergency)?", "options": ["No — there is no effect on Fundamental Rights during President's Rule", "Yes, all Fundamental Rights are automatically suspended", "Only Article 19 is suspended, similar to National Emergency", "Only economic rights are affected during President's Rule"], "answer": 0, "explanation": "Correct: Unlike a National Emergency (which can suspend certain FRs), President's Rule has NO effect on Fundamental Rights at all — a key distinguishing feature between these two types of emergency.", "globalNum": 867}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Which state was the 1st to experience President's Rule, and in which year?", "options": ["Punjab, in 1951", "Kerala, in 1959", "Manipur, in 1950", "Uttar Pradesh, in 1968"], "answer": 0, "explanation": "Correct: Punjab in 1951 was the first state placed under President's Rule, marking the beginning of this provision's practical application in Indian federal politics.", "globalNum": 868}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Which state has experienced President's Rule the most number of times, and how many times was it imposed in Uttar Pradesh?", "options": ["Manipur (11 times); Uttar Pradesh (10 times)", "Uttar Pradesh (11 times); Manipur (10 times)", "Punjab (11 times); Kerala (10 times)", "Jammu & Kashmir (11 times); Manipur (10 times)"], "answer": 0, "explanation": "Correct: Manipur holds the record with 11 instances of President's Rule, closely followed by Uttar Pradesh with 10 — reflecting periods of political instability in these states.", "globalNum": 869}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Which two Indian states have NEVER been placed under President's Rule?", "options": ["Chhattisgarh and Telangana", "Punjab and Kerala", "Manipur and Uttar Pradesh", "Goa and Sikkim"], "answer": 0, "explanation": "Correct: Chhattisgarh and Telangana — both relatively newer states (2000 and 2014 respectively) — are the only two Indian states never placed under President's Rule, per the notes.", "globalNum": 870}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What did the S.R. Bommai Case (1994) establish regarding Article 356?", "options": ["It significantly curtailed misuse of Article 356 and held that President's Rule is subject to Judicial Review", "It gave the President absolute, unreviewable discretion to impose President's Rule", "It abolished Article 356 entirely", "It extended President's Rule's maximum duration from 3 to 5 years"], "answer": 0, "explanation": "Correct: The landmark S.R. Bommai judgment (1994) curbed the historically frequent misuse of Article 356 by subjecting such proclamations to Judicial Review — a major check on what had been a politically abused provision.", "globalNum": 871}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "How did B.R. Ambedkar describe the intended use of Article 356?", "options": ["'It should be used as a last resort and as a means of final recourse'", "'It should be used freely to maintain central control'", "'It should never be used under any circumstances'", "'It should be triggered automatically whenever a state government changes'"], "answer": 0, "explanation": "Correct: Ambedkar envisioned Article 356 as an extreme, last-resort measure — a vision that was, in practice, frequently disregarded until the S.R. Bommai judgment enforced greater restraint.", "globalNum": 872}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Under Article 357, how does Parliament's legislative takeover of a state actually operate once President's Rule is imposed?", "options": ["Parliament may confer on the President (or another authority) the power to make laws for the state", "The state's own legislature continues making laws, just under Presidential oversight", "Only the Supreme Court can make laws for the state during this period", "No law-making is possible for the state during President's Rule"], "answer": 0, "explanation": "Correct: Article 357 is the specific mechanism enabling Parliament's legislative takeover during President's Rule — conferring law-making power for that state onto the President or another designated authority, rather than the state's own (now-suspended/dissolved) legislature.", "globalNum": 873}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Under Article 360, on what ground can the President proclaim a Financial Emergency, and how many times has this actually been imposed in Indian history?", "options": ["If satisfied that India's (or any part's) financial stability is threatened; NEVER imposed till now", "If a state fails to pay its debts; imposed once, in 1991", "If GDP growth falls below 2%; imposed twice", "If the RBI declares a banking crisis; imposed once, in 2008"], "answer": 0, "explanation": "Correct: Financial Emergency requires the President's satisfaction that financial stability is threatened, and remarkably, this provision has NEVER been invoked in India's history, despite various economic crises (like 1991's balance-of-payments crisis, which was instead handled through other means).", "globalNum": 874}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Within how long must a Financial Emergency proclamation be approved by Parliament, and by what majority — is this the same as President's Rule?", "options": ["Within 2 months, by Simple Majority — the SAME timeline and majority requirement as President's Rule", "Within 1 month, by Special Majority — same as National Emergency", "Within 6 months, by Simple Majority — a longer timeline than President's Rule", "No approval is ever required for Financial Emergency"], "answer": 0, "explanation": "Correct: Financial Emergency shares the identical 2-month/Simple Majority approval requirement with President's Rule — both being less stringent than National Emergency's 1-month/Special Majority standard.", "globalNum": 875}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "During a Financial Emergency, what can the President do regarding government employees' salaries, and what must happen to State Money Bills?", "options": ["Can ask to reduce salaries/allowances of all/any class of government service persons; all State Money Bills must be reserved for the President's consideration", "Can only reduce salaries of Union employees, not state employees; State Money Bills need no special reservation", "Cannot touch salaries at all; State Money Bills are automatically passed without review", "Can double government salaries to boost the economy; no change to Money Bill procedure"], "answer": 0, "explanation": "Correct: During a Financial Emergency, the President can direct salary/allowance reductions across government services, and crucially, ALL State Money Bills must be reserved for Presidential consideration — giving the Centre tight fiscal control during such a crisis.", "globalNum": 876}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "From which country was India's Constitutional Amendment procedure borrowed, and which Article deals with it?", "options": ["South Africa; Article 368", "USA; Article 356", "Ireland; Article 32", "Canada; Article 352"], "answer": 0, "explanation": "Correct: The amendment procedure was borrowed from South Africa, and Article 368 lays out this procedure — a single, comprehensive Article governing constitutional change.", "globalNum": 877}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Can Parliament amend the 'Basic Structure' of the Constitution, and where did this doctrine originate?", "options": ["No — Parliament cannot amend the Basic Structure, a doctrine born in the Kesavananda Bharati Case, 1973", "Yes, Parliament has unrestricted power to amend any part including Basic Structure", "The doctrine originated in the Golaknath Case, 1967", "The doctrine is explicitly written into Article 368 itself"], "answer": 0, "explanation": "Correct: The Basic Structure doctrine (barring amendments that destroy the Constitution's core identity) emerged from Kesavananda Bharati (1973) — it is NOT explicitly mentioned in the constitutional text itself, but has evolved through subsequent case law.", "globalNum": 878}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What elements make up the Basic Structure of the Constitution, as identified through case law?", "options": ["Judicial Review, Independent Judiciary, Separation of Powers, Federal Structure, Secularism, and Supremacy of the Constitution", "Only Fundamental Rights and DPSP", "Only the Preamble's exact wording", "Reservation policy and the 50% reservation cap"], "answer": 0, "explanation": "Correct: These six elements (among others recognised over time) form the Basic Structure — none of which appear as an explicit, defined list in the Constitution's text but have been judicially identified as core, unamendable features.", "globalNum": 879}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "In which House(s) can a Constitutional Amendment Bill be introduced, and by whom?", "options": ["Either House of Parliament (LS/RS), but NOT in a State Legislature; can be introduced by a Minister or a private member", "Only the Lok Sabha, and only by a Minister", "Only the Rajya Sabha, and only by a private member", "Either Parliament or State Legislatures, by any member"], "answer": 0, "explanation": "Correct: A Constitutional Amendment Bill can start in either House of Parliament, introduced by any Minister or private member — but crucially, State Legislatures have no power to introduce such Bills directly.", "globalNum": 880}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Does a Constitutional Amendment Bill require the President's prior recommendation for introduction, and can the President veto it after passage?", "options": ["No prior recommendation is needed for introduction; and NO veto is allowed after passage (per the 24th CA, 1971) — assent is mandatory", "Prior recommendation IS required; and the President CAN veto it", "Neither prior recommendation nor mandatory assent applies", "Prior recommendation is required only for Money-related Constitutional Amendments"], "answer": 0, "explanation": "Correct: Unlike Money Bills, a Constitutional Amendment Bill needs no prior presidential recommendation to introduce, and per the 24th CA (1971), the President cannot veto it at all — assent is compulsory once Parliament passes it.", "globalNum": 881}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Is there a provision for a Joint Sitting of both Houses in case of a deadlock over a Constitutional Amendment Bill?", "options": ["No — there is no Joint Sitting provision for Constitutional Amendment Bills", "Yes, Joint Sitting applies exactly as it does for ordinary Bills", "Joint Sitting applies only for Amendment Bills related to Fundamental Rights", "Joint Sitting is mandatory for every Constitutional Amendment Bill"], "answer": 0, "explanation": "Correct: Unlike ordinary Bills (Article 108), there is explicitly NO Joint Sitting mechanism available for Constitutional Amendment Bills — both Houses must independently agree, with no deadlock-resolution shortcut.", "globalNum": 882}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What are the three types of Constitutional Amendment procedures, based on the majority required?", "options": ["Simple Majority (outside Article 368), Special Majority, and Special Majority + Ratification by at least 1/2 State Legislatures", "Only two types: Simple Majority and Special Majority", "Absolute Majority, Special Majority, and Unanimous consent", "Simple Majority, Two-thirds Majority, and Presidential discretion"], "answer": 0, "explanation": "Correct: These three distinct procedures apply depending on the provision being amended — ranging from Simple Majority (like ordinary legislation, outside Article 368's formal ambit) to the most rigorous Special Majority + State ratification requirement for core federal provisions.", "globalNum": 883}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What is the precise definition of 'Special Majority' as used in the Constitutional Amendment context?", "options": ["Majority of the total membership of each House + majority of not less than 2/3rd of members present and voting", "Simply 2/3rd of members present and voting, with no total-membership requirement", "51% of total membership only", "Unanimous agreement of all members present"], "answer": 0, "explanation": "Correct: Special Majority has TWO components — an absolute majority of the total House membership, AND a 2/3rd majority of those present and voting — a dual threshold that's stricter than either component alone.", "globalNum": 884}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which of these provisions can be amended by Simple Majority (outside Article 368's formal procedure)?", "options": ["Admission/establishment of new states, quorum in Parliament, delimitation of constituencies, and salaries/allowances of MPs", "Fundamental Rights and DPSP", "Election of the President and its manner", "Article 368 itself"], "answer": 0, "explanation": "Correct: New-state admission, quorum, delimitation, and MP salaries are all amendable by Simple Majority (as ordinary legislation). FRs/DPSP need Special Majority, while the President's election method and Article 368 itself need the strictest Special Majority + State ratification procedure.", "globalNum": 885}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which provisions require Special Majority of Parliament alone (without state ratification)?", "options": ["Fundamental Rights, DPSP, and Fundamental Duties", "Election of the President and Article 368 itself", "Formation of new states and delimitation", "2nd, 5th, and 6th Schedules"], "answer": 0, "explanation": "Correct: Fundamental Rights, DPSP, and Fundamental Duties fall into the 'Special Majority only' category — not requiring state ratification, unlike the more federally-sensitive provisions in the third category.", "globalNum": 886}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which provisions require Special Majority PLUS ratification by at least 1/2 of State Legislatures, and by what majority must states ratify?", "options": ["Election of President, Supreme Court/High Courts, Article 368 itself, and any List in the 7th Schedule — states ratify by Simple Majority", "Fundamental Rights and DPSP — states ratify by Special Majority", "Quorum and delimitation — states ratify unanimously", "Union Territories — no state ratification is ever needed for this category"], "answer": wed a common High Court for 2+ states", "Introduced the anti-defection law", "Reduced the voting age to 18", "Gave Delhi its NCT status"], "answer": 0, "explanation": "Correct: The 7th CA implemented the major 1956 state reorganisation (14 States + 6 UTs) and enabled shared High Courts across multiple states — also, separately, this same Amendment permitted one Governor to serve multiple states.", "globalNum": 896}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which Amendments incorporated Dadra & Nagar Haveli, and Goa/Daman & Diu, as Union Territories respectively?", "options": ["10th CA (1961) for Dadra & Nagar Haveli; 12th CA (1962) for Goa, Daman & Diu", "12th CA for Dadra & Nagar Haveli; 10th CA for Goa, Daman & Diu", "Both incorporated by the 13th CA (1962)", "7th CA for both territories"], "answer": 0, "explanation": "Correct: The 10th CA (1961) incorporated Dadra & Nagar Haveli, and the 12th CA (1962) incorporated Goa, Daman & Diu — two separate but chronologically close Amendments, following their liberation from Portuguese rule.", "globalNum": 897}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which Amendment gave Nagaland statehood, in what year, and under which special-provisions Article?", "options": ["13th CA, 1962, under Article 371A", "12th CA, 1962, under Article 371", "21st CA, 1967, under Article 371A", "36th CA, 1975, under Article 371G"], "answer": 0, "explanation": "Correct: The 13th CA (1962) — the same year as the 12th CA's Goa incorporation — granted Nagaland statehood with special provisions under Article 371A, a mnemonic trick the notes highlight (12th & 13th, same year, 1962).", "globalNum": 898}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 21st Constitutional Amendment (1967) do, and what did the 24th Constitutional Amendment (1971) affirm?", "options": ["21st: added Sindhi as the 15th language in the 8th Schedule; 24th: affirmed Parliament's power to amend ANY part of the Constitution including FRs, and made presidential assent to Amendment Bills compulsory", "21st: affirmed Parliament's amending power; 24th: added Sindhi to the 8th Schedule", "Both dealt with Sikkim's statehood", "21st: curtailed Right to Property; 24th: added the 9th Schedule"], "answer": 0, "explanation": "Correct: The 21st CA added Sindhi to the 8th Schedule, while the 24th CA (1971) was a direct response to the Golaknath case, affirming Parliament's amending power over FRs and eliminating presidential veto over Amendment Bills.", "globalNum": 899}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 25th Constitutional Amendment (1971) do regarding the Right to Property and Article 31C?", "options": ["Curtailed the Right to Property and inserted Article 31C, protecting DPSP Art 39(b)/(c) laws from challenge under Articles 14/19/31", "Fully abolished the Right to Property, replacing it with Article 300A", "Removed Article 31C entirely, strengthening the Right to Property", "Made the Right to Property a Fundamental Duty instead of a Right"], "answer": 0, "explanation": "Correct: The 25th CA curtailed (but did not yet fully abolish) the Right to Property, and inserted the protective Article 31C shield for certain DPSP-implementing laws — the full abolition of Right to Property from Part III came later, via the 44th CA (1978).", "globalNum": 900}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 35th Constitutional Amendment (1974) and the 36th Constitutional Amendment (1975) do regarding Sikkim, using the mnemonic '35th→36th: one step up'?", "options": ["35th: terminated Sikkim's protectorate status, gave it 'Associate State' status; 36th: made Sikkim a full-fledged 22nd State, omitting the temporary provisions", "35th: made Sikkim a full state; 36th: gave it associate status", "Both amendments dealt with the same, single-stage transition", "Neither amendment relates to Sikkim; they deal with Goa instead"], "answer": 0, "explanation": "Correct: The 35th CA (1974) created the intermediate 'Associate State' status for Sikkim, and the very next year, the 36th CA (1975) completed the transition to full 22nd statehood — a clean, sequential 'one step up' progression as the mnemonic suggests.", "globalNum": 901}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 38th Constitutional Amendment (1975) do, and how was this later reversed?", "options": ["Made the President's Emergency proclamation and Ordinances non-justiciable; later reversed by the Minerva Mills Case, 1980", "Made Emergency proclamations subject to judicial review; later reversed by the 44th CA", "Introduced the Anti-Defection Law; never reversed", "Added Fundamental Duties; reversed by the 44th CA"], "answer": 0, "explanation": "Correct: The 38th CA (1975, during the Emergency) shielded Emergency-related presidential actions from judicial review — the Minerva Mills Case (1980) later reopened this to judicial scrutiny, correcting this Emergency-era overreach.", "globalNum": 902}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Besides being called the 'Mini-Constitution,' what four things did the 42nd Constitutional Amendment (1976) do?", "options": ["Added Socialist/Secular/Integrity to the Preamble, added Fundamental Duties (Part IVA), extended LS/Assembly term to 6 years (later reversed), and curbed judicial review", "Reduced the voting age to 18 and added the 10th Schedule", "Gave Delhi NCT status and added Konkani/Manipuri/Nepali to the 8th Schedule", "Restored the Right to Property and reversed the Emergency's effects"], "answer": 0, "explanation": "Correct: The sweeping 42nd CA touched the Preamble, added Fundamental Duties, extended the legislative term (a change later reversed), and curbed judicial review — reflecting its wide-ranging, 'Mini-Constitution' scope during the Emergency period.", "globalNum": 903}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What three corrective changes did the 44th Constitutional Amendment (1978) make, using the mnemonic '42 vs 44: Emergency expansion vs post-Emergency correction'?", "options": ["Restored LS term to 5 years, replaced 'Internal Disturbance' with 'Armed Rebellion,' and removed Right to Property from Part III (making it a legal right under Art 300A)", "Extended LS term to 6 years and added Fundamental Duties", "Added the 9th Schedule and reduced the voting age to 18", "Gave constitutional status to Panchayats and Municipalities"], "answer": 0, "explanation": "Correct: The 44th CA (1978) directly reversed several 42nd CA changes — restoring the 5-year term, tightening the Emergency-declaration ground to 'Armed Rebellion,' and demoting the Right to Property to a mere legal right — fitting the mnemonic of 42 (expansion) vs 44 (correction).", "globalNum": 904}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which Amendment added the 10th Schedule (Anti-Defection Law), in what year?", "options": ["52nd Constitutional Amendment, 1985", "44th Constitutional Amendment, 1978", "91st Constitutional Amendment, 2003", "36th Constitutional Amendment, 1975"], "answer": 0, "explanation": "Correct: The 52nd CA (1985) introduced the Anti-Defection Law via the 10th Schedule — note the 36th CA (1975) had also earlier used (and then omitted) a temporary '10th Schedule' for Sikkim's associate-state terms, a potentially confusing historical footnote.", "globalNum": 905}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "Which Amendment reduced the voting age from 21 to 18 years, and in what year?", "options": ["61st Constitutional Amendment, 1989", "52nd Constitutional Amendment, 1985", "69th Constitutional Amendment, 1991", "44th Constitutional Amendment, 1978"], "answer": 0, "explanation": "Correct: The 61st CA (1989) lowered the voting age from 21 to 18, significantly expanding India's electorate — a landmark democratic reform.", "glob ger threshold to 1/4th", "Capped Ministers at 50% and abolished the anti-defection law entirely", "Dealt only with language additions to the 8th Schedule"], "answer": 0, "explanation": "Correct: The 91st CA introduced the now-familiar 15% ministerial cap (Article 75(1A)) and tightened the anti-defection merger exception from a more easily-abused 1/3rd threshold to the stricter 2/3rd requirement — both reforms discussed in the earlier PM/Council of Ministers and Membership/Bills tabs.", "globalNum": 912}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 92nd Constitutional Amendment (2003) add to the 8th Schedule, bringing the total to 22, per the 'Babu Drinks Masala Soda' mnemonic?", "options": ["Bodo, Dogri, Maithili, and Santhali", "Konkani, Manipuri, Nepali, and Sindhi", "Marathi, Pali, Prakrit, and Assamese", "Tamil, Telugu, Kannada, and Malayalam"], "answer": 0, "explanation": "Correct: The 92nd CA added Bodo, Dogri, Maithili, and Santhali — remembered as 'Babu Drinks Masala Soda' (BDMS) — bringing the 8th Schedule's total to 22 languages, where it has remained since.", "globalNum": 913}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 97th Constitutional Amendment (2011) do regarding Cooperative Societies?", "options": ["Gave constitutional status to Cooperative Societies via Article 19(1)(c), Article 43B, and the new Part IXB", "Abolished Cooperative Societies as a constitutional category", "Merged Cooperative Societies into the Panchayati Raj system (Part IX)", "Gave Cooperative Societies judicial status equivalent to a tribunal"], "answer": 0, "explanation": "Correct: The 97th CA added the right to form cooperative societies to Article 19(1)(c), inserted DPSP Article 43B, and created the new Part IXB specifically for cooperative societies — a comprehensive constitutional recognition.", "globalNum": 914}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What did the 99th Constitutional Amendment (2014) attempt, and what happened to it in 2015?", "options": ["Replaced the judicial Collegium system with the National Judicial Appointments Commission (NJAC); the Supreme Court struck NJAC down as unconstitutional in 2015", "Introduced the Collegium system for the first time; upheld by the SC in 2015", "Abolished all judicial appointment mechanisms entirely", "Gave Parliament direct power to appoint all judges, upheld in 2015"], "answer": 0, "explanation": "Correct: The 99th CA sought to replace the judiciary's own Collegium system with the NJAC (involving executive/legislative representation in judicial appointments), but the Supreme Court struck this down in 2015 as violating the Basic Structure (judicial independence) — restoring the Collegium system.", "globalNum": 915}, {"tab": "t33", "tabTitle": "33. Constitutional Amendment", "q": "What was the 131st Constitutional Amendment Bill, 2026, and what was its fate?", "options": ["Introduced 16 April 2026 to bypass the delimitation freeze and operationalise the 106th CA's 33% women's reservation using 2011 Census data, along with LS seat expansion; it was REJECTED, falling short of the required two-thirds special majority", "Successfully passed in 2026, immediately implementing 33% women's reservation", "Withdrawn before any vote was taken", "Passed only in the Lok Sabha but never introduced in the Rajya Sabha"], "answer": 0, "explanation": "Correct: This 2026 Bill aimed to operationalise the 106th CA's women's reservation ahead of the 2026 delimitation deadline, using 2011 Census data and proposing LS expansion — but it was REJECTED for not achieving the required Special Majority, remaining, per the notes, the most recent (unsuccessful) amendment attempt.", "globalNum": 916}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243, how is 'Gram Sabha' defined?", "options": ["A body of persons registered in electoral rolls relating to a village within the area of a Panchayat at village level", "A body of only elected Panchayat members at village level", "A judicial body handling village disputes", "An advisory committee appointed by the state government"], "answer": 0, "explanation": "Correct: Gram Sabha comprises ALL registered voters within a village Panchayat area — a broad, inclusive body, not just elected representatives or an appointed committee.", "globalNum": 917}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243A, what powers can the Gram Sabha exercise, and how many meetings must it hold per year at minimum?", "options": ["Powers as the State Legislature may provide by law; at least 2 meetings mandatory per year", "Powers as the Governor alone decides; no minimum meetings required", "Powers as Parliament decides; at least 4 meetings mandatory per year", "Unlimited powers with no legislative oversight; 1 meeting mandatory per year"], "answer": 0, "explanation": "Correct: Gram Sabha's actual powers are determined by State Legislature law (not uniform nationwide), while the Constitution itself mandates a minimum of 2 meetings annually.", "globalNum": 918}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243B, at which levels must Panchayats be constituted, and what exception applies to states with population ≤20 lakhs?", "options": ["Village, intermediate, and district level; states with population ≤20 lakhs need NOT constitute the intermediate-level Panchayat", "Only village level; larger states must add intermediate/district levels", "Village and district level only, with no intermediate level ever required", "All states must have all three levels with no population-based exception"], "answer": 0, "explanation": "Correct: The standard structure is three-tier (village/intermediate/district), but smaller states (population ≤20 lakhs) are exempted from the intermediate-level requirement — recognising limited administrative need in smaller states.", "globalNum": 919}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What are the three tiers of the Panchayati Raj system, and their associated informal bodies?", "options": ["Village Level (Gram Panchayat, with Gram Sabha), Block/Intermediate Level (Panchayat Samiti, with Nyaya Panchayat), District Level (Zila Parishad)", "Village Level (Zila Parishad), Block Level (Gram Panchayat), District Level (Panchayat Samiti)", "Only two tiers exist: Gram Panchayat and Zila Parishad", "Village Level (Panchayat Samiti), Block Level (Zila Parishad), District Level (Gram Panchayat)"], "answer": 0, "explanation": "Correct: The three-tier structure runs Gram Panchayat (village, with Gram Sabha) → Panchayat Samiti (block/intermediate, with Nyaya Panchayat) → Zila Parishad (district) — a clean hierarchical progression.", "globalNum": 920}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "When were Gram Nyayalayas established (which Act, effective from when), who presides over them, and what types of cases can they try?", "options": ["Gram Nyayalayas Act, 2008, effective 2 Oct 2009; presided by a 'Nyayadhikari'; can try both civil and criminal cases", "Panchayati Raj Act, 1992, effective 24 April 1993; presided by the Sarpanch; only civil cases", "PESA Act, 1996; presided by tribal elders; only criminal cases", "Gram Nyayalayas Act, 2008; presided by the District Judge; only appeals"], "answer": 0, "explanation": "Correct: Gram Nyayalayas are formal courts (Gram Nyayalayas Act, 2008, effective Oct 2009), presided by a judicial officer called 'Nyayadhikari,' with jurisdiction over both civil and criminal matters — aiming for affordable, speedy rural justice.", "globalNum": 921}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "For Gram Nyayalaya decisions, where are criminal appeals heard, and where are civil appeals heard?", "options": ["Criminal appeals: Court of Session; Civil appeals: District Court", "Criminal appeals: District Court; Civil appeals: Court of Session", "Both types of appeals go to the High Court directly", "Both types of appeals go to the Supreme Court directly"], "answer": 0, "explanation": "Correct: This mirrors the general judicial hierarchy — criminal matters escalate to the Sessions Court, while civil matters escalate to the District Court, both being intermediate appellate levels below the High Court.", "globalNum": 922}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "How does a 'Nyaya Panchayat' differ from a formal 'Gram Nyayalaya'?", "options": ["Nyaya Panchayat is a traditional, informal village-level body dealing with minor disputes, with members not necessarily legally trained; Gram Nyayalaya is a formal court within the judicial system, presided by a judicial officer", "Both are identical formal courts with legally trained judges", "Nyaya Panchayat is a formal court; Gram Nyayalaya is an informal traditional body", "Neither body has any role in dispute resolution"], "answer": 0, "explanation": "Correct: Nyaya Panchayat represents an older, informal, community-based dispute resolution mechanism, while Gram Nyayalaya (established 2008-09) is a formally constituted court staffed by trained judicial officers — reflecting a modernisation of rural justice delivery.", "globalNum": 923}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243C, how are all seats in Panchayats filled?", "options": ["By direct election", "By nomination from the state government", "By indirect election through the district administration", "By hereditary succession in traditional village councils"], "answer": 0, "explanation": "Correct: Article 243C mandates direct election for filling all Panchayat seats — ensuring democratic legitimacy at the grassroots level, unlike some upper-house style indirect elections seen elsewhere in the Constitution.", "globalNum": 924}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Which committee first recommended the 3-tier Panchayati Raj system, and which state was the first to implement it?", "options": ["Balwant Rai Mehta Committee, 1957; Rajasthan (Nagaur, 2 Oct 1959) was the 1st state to implement it", "Ashok Mehta Committee, 1977; Andhra Pradesh was the 1st to implement it", "L.M. Singhvi Committee, 1986; Rajasthan was the 1st to implement it", "G.V.K. Rao Committee, 1985; Karnataka was the 1st to implement it"], "answer": 0, "explanation": "Correct: The Balwant Rai Mehta Committee (1957) proposed the 3-tier system (Gram Panchayat → Panchayat Samiti → Zila Parishad), and Rajasthan implemented it first, in Nagaur district on 2 October 1959, with Andhra Pradesh following shortly after (11 October 1959).", "globalNum": 925}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What did the Ashok Mehta Committee (1977) propose, differing from the Balwant Rai Mehta model?", "options": ["A 2-tier system: Zila Parishad (main unit) + Mandal Panchayat", "The same 3-tier system as Balwant Rai Mehta, with minor modifications", "A 4-tier system adding a state-level Panchayat body", "Abolition of the Panchayati Raj system entirely"], "answer": 0, "explanation": "Correct: The Ashok Mehta Committee proposed a simplified 2-tier structure with Zila Parishad as the main unit and Mandal Panchayat below it — a departure from Balwant Rai Mehta's earlier 3-tier recommendation.", "globalNum": 926}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What did the G.V.K. Rao Committee (1985) recommend regarding the Zila Parishad's role?", "options": ["Proposed Zila Parishad as the nodal agency for development, after reviewing PRIs' and Municipalities' functioning", "Proposed abolishing the Zila Parishad entirely", "Proposed direct central government control over all Panchayats", "Proposed merging PRIs with Municipalities into a single body"], "answer": 0, "explanation": "Correct: The G.V.K. Rao Committee, after reviewing how PRIs and Municipalities were functioning, recommended making the Zila Parishad the central 'nodal agency' driving rural development efforts.", "globalNum": 927}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Which Committee was the FIRST to recommend constitutional status for Panchayati Raj Institutions, and what else did it emphasise?", "options": ["L.M. Singhvi Committee, 1986 — also advocated financial autonomy and emphasised Gram Sabha as the embodiment of direct democracy", "Balwant Rai Mehta Committee, 1957", "Thungon Committee, 1988", "Gadgil Committee, 1988"], "answer": 0, "explanation": "Correct: The L.M. Singhvi Committee (1986) was the first to specifically recommend constitutional status for PRIs — a recommendation eventually realised via the 73rd Amendment in 1992, six years later.", "globalNum": 928}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What did the Thungon Committee (1988) and Gadgil Committee (1988) respectively focus on?", "options": ["Thungon: Nyaya Panchayats for a cluster of villages; Gadgil: examined PRIs' role in rural development, recommending direct election at all 3 levels, fixed 5-year terms, and SC/ST/Women reservation", "Thungon: rural development role of PRIs; Gadgil: Nyaya Panchayats", "Both committees dealt exclusively with financial autonomy", "Thungon and Gadgil both recommended abolishing the 3-tier system"], "answer": 0, "explanation": "Correct: These two 1988 committees addressed complementary aspects — Thungon focused on judicial (Nyaya Panchayat) structuring, while Gadgil examined broader development roles, direct elections, term fixation, and reservation policy, many of which fed into the eventual 73rd Amendment.", "globalNum": 929}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "When was the 73rd Constitutional Amendment Act enforced, what is this date celebrated as, and who was the PM at the time?", "options": ["24 April 1993, celebrated as Panchayati Raj Day; PM was P.V. Narasimha Rao", "2 October 1959, celebrated as Panchayat Foundation Day; PM was Jawaharlal Nehru", "26 January 1993, celebrated as Republic Day; PM was Indira Gandhi", "15 August 1993, celebrated as Independence Day; PM was Rajiv Gandhi"], "answer": 0, "explanation": "Correct: The 73rd CA was enforced on 24 April 1993 (now celebrated annually as Panchayati Raj Day), with P.V. Narasimha Rao as Prime Minister at the time.", "globalNum": 930}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What did the 73rd Constitutional Amendment Act insert into the Constitution, and which Schedule did it add?", "options": ["Inserted Part IX (Articles 243-243O) making PRIs mandatory, and added the 11th Schedule with 29 functional items", "Inserted Part IXA, and added the 12th Schedule with 18 functional items", "Inserted Part X, and added a new 13th Schedule", "Only added the 11th Schedule, without inserting any new Part"], "answer": 0, "explanation": "Correct: The 73rd CA created the mandatory Part IX (Articles 243-243O) framework and added the 11th Schedule (29 functional items) for Panchayats — Part IXA and the 12th Schedule instead relate to the parallel 74th Amendment for Municipalities.", "globalNum": 931}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243D, how are seats reserved for SC/ST, and what fraction of seats is reserved for women?", "options": ["SC/ST seats reserved in proportion to their population; 1/3rd of seats reserved for women", "SC/ST seats fixed at exactly 15% regardless of population; 1/2 of seats reserved for women", "No reservation for SC/ST; only women get reservation", "SC/ST seats reserved at 50%; no reservation for women"], "answer": 0, "explanation": "Correct: SC/ST reservation is population-proportional (varying by area), while women's reservation is a flat 1/3rd of total seats — two distinct reservation mechanisms operating simultaneously in Panchayat elections.", "globalNum": 932}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243E, what is the normal term of a Panchayat, and must elections be held before this term ends?", "options": ["5 years, unless dissolved earlier; elections must be held before the end of the 5-year term", "6 years, with no election requirement before term-end", "3 years, with mandatory elections only every 2 terms", "Permanent, with elections only upon dissolution"], "answer": 0, "explanation": "Correct: Panchayats have a standard 5-year term (unless dissolved earlier), and elections must be conducted before this term expires — mirroring the general 5-year electoral cycle pattern seen at higher levels of Indian government.", "globalNum": 933}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243E's dissolution rule, if a Panchayat is dissolved with LESS than 6 months remaining in its term, is a fresh election mandatory?", "options": ["No — election is NOT mandatory in this case; a new Panchayat (if formed) would only serve the remainder of the original term", "Yes, an election is always mandatory regardless of remaining time", "Elections are mandatory only if more than 3 months remain", "The rule depends entirely on the state government's discretion, with no fixed threshold"], "answer": 0, "explanation": "Correct: If dissolution happens within the last 6 months of the term, holding a fresh election isn't constitutionally required — but if MORE than 6 months remain, an election becomes mandatory to fill out the remaining term.", "globalNum": 934}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Using the notes' example (term 1 Jan 2020 – 1 Jan 2025), if the Panchayat is dissolved on 20 Nov 2024, is election mandatory? What if dissolved on 1 Jan 2024?", "options": ["20 Nov 2024 dissolution (less than 6 months remaining): election NOT mandatory; 1 Jan 2024 dissolution (more than 6 months remaining): election IS mandatory", "Both scenarios require mandatory elections", "Neither scenario requires mandatory elections", "20 Nov 2024: election mandatory; 1 Jan 2024: election not mandatory (the reverse)"], "answer": 0, "explanation": "Correct: With the term ending 1 Jan 2025, a 20 Nov 2024 dissolution leaves under 6 months (not mandatory), while a 1 Jan 2024 dissolution leaves a full year (well over 6 months, hence mandatory) — precisely illustrating the Article 243E threshold rule.", "globalNum": 935}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Who holds the power to dissolve a Panchayat before its term ends?", "options": ["The State Government", "The Union Government", "The State Election Commission", "The Panchayat's own Sarpanch"], "answer": 0, "explanation": "Correct: The State Government holds this dissolution power — a state-level decision, not a central government or judicial/electoral commission matter.", "globalNum": 936}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243F, who makes the law regarding disqualification of Panchayat membership, and what is the minimum age below which a person cannot be disqualified?", "options": ["State Legislature makes the disqualification law; cannot be disqualified if aged 21+ (the minimum required age)", "Parliament makes the law; minimum age 18", "The Governor decides disqualification directly; minimum age 25", "The Election Commission of India decides; no minimum age specified"], "answer": 0, "explanation": "Correct: Article 243F leaves disqualification rules to State Legislature, with the minimum required membership age being 21 — meaning below this age, disqualification questions (based on age itself) simply don't apply since they wouldn't be eligible members anyway.", "globalNum": 937}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243H, what power can the State Legislature authorise Panchayats to exercise regarding taxation?", "options": ["Authorise Panchayats to levy taxes, duties, tolls, and fees", "Authorise Panchayats to print their own currency", "Authorise Panchayats to set national tax policy", "Panchayats have no taxation power under any Article"], "answer": 0, "explanation": "Correct: Article 243H allows State Legislatures to empower Panchayats with limited local taxation authority (taxes, duties, tolls, fees) — giving them a degree of fiscal autonomy for local self-governance.", "globalNum": 938}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243I, who constitutes a Finance Commission to review Panchayats' financial position, and under Article 243K, who conducts Panchayat elections?", "options": ["Art 243I: Governor constitutes a Finance Commission; Art 243K: State Election Commission (appointed by Governor) conducts elections", "Art 243I: President constitutes it; Art 243K: Election Commission of India conducts elections", "Art 243I: Parliament constitutes it; Art 243K: the state Panchayat itself conducts elections", "Both Articles involve the Union Finance Commission"], "answer": 0, "explanation": "Correct: The Governor constitutes a state-level Finance Commission (Art 243I, distinct from the Union Finance Commission under Article 280), and Panchayat elections are run by the State Election Commission, itself appointed by the Governor (Art 243K).", "globalNum": 939}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243M, which areas are excluded from Part IX's application?", "options": ["Certain tribal regions and NE states with District Councils (Nagaland, Meghalaya, Mizoram) plus hill areas of Manipur", "All Union Territories without exception", "Only Delhi is excluded, with no other exclusions", "No areas are excluded; Part IX applies universally"], "answer": 0, "explanation": "Correct: Article 243M excludes specific tribal/NE regions with existing District Council systems (Nagaland, Meghalaya, Mizoram) and Manipur's hill areas — recognising these areas' distinct existing self-governance arrangements under the 6th Schedule or similar frameworks.", "globalNum": 940}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Under Article 243O, what does the Constitution say about courts interfering in Panchayat electoral matters?", "options": ["Courts are barred from interfering in Panchayat electoral matters", "Courts have full, unrestricted jurisdiction over all Panchayat election disputes", "Only the Supreme Court, not lower courts, can interfere", "Courts can interfere only if the Election Commission requests it"], "answer": 0, "explanation": "Correct: Article 243O bars judicial interference in Panchayat electoral matters — protecting the electoral process from potentially disruptive litigation, similar in spirit to how Article 329 protects general parliamentary/assembly elections from undue court interference.", "globalNum": 941}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "What does the PESA Act, 1996 (Panchayats Extension to Scheduled Areas) provide regarding STs and Gram Sabha's role in mining?", "options": ["Extends Part IX to Scheduled Areas (5th Schedule), requires ST reservation of at least half of seats, ALL chairperson seats reserved for STs, and mining permissions require Gram Sabha's consent", "Extends Part IXA (Municipalities) to Scheduled Areas, with no special ST reservation", "Reduces ST reservation to 25% in Scheduled Areas", "Removes Gram Sabha's role in mining decisions entirely"], "answer": 0, "explanation": "Correct: PESA 1996 extends Panchayati Raj (Part IX) to Scheduled Areas with STRONGER ST protections than the general Part IX framework — at least 50% ST reservation, ALL chairperson posts reserved for STs, and mandatory Gram Sabha consent for mining activities in these areas.", "globalNum": 942}, {"tab": "t34", "tabTitle": "34. Panchayati Raj", "q": "Which Union Territory is the only one where Panchayati Raj provisions are NOT applicable?", "options": ["Delhi", "Puducherry", "Jammu & Kashmir", "Chandigarh"], "answer": 0, "explanation": "Correct: Delhi is the sole exception where Panchayati Raj provisions don't apply — a distinct arrangement compared to other UTs, reflecting Delhi's unique NCT administrative structure.", "globalNum": 943}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Who is responsible for implementing decisions of municipal corporations, councils, and standing committees, and how are municipal elections conducted?", "options": ["The Municipal Commissioner implements decisions; elections are conducted by the State Election Commission, via direct election of all seats", "The Mayor implements decisions; elections conducted by the Election Commission of India", "The Governor implements decisions directly; elections conducted by indirect voting", "The Chief Minister implements decisions; no elections are held, only nominations"], "answer": 0, "explanation": "Correct: The Municipal Commissioner handles implementation, while the State Election Commission (the same body handling Panchayat elections) conducts direct elections for all municipal seats.", "globalNum": 944}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Constitutional Amendment introduced municipal governance provisions, and which Part/Articles did it insert?", "options": ["74th Constitutional Amendment Act, 1992 — inserted Part IXA, Articles 243P-243ZG", "73rd Constitutional Amendment Act, 1992 — inserted Part IX, Articles 243-243O", "97th Constitutional Amendment Act, 2011 — inserted Part IXB", "91st Constitutional Amendment Act, 2003 — inserted Part IXA"], "answer": 0, "explanation": "Correct: The 74th CA (1992) is the municipal counterpart to the 73rd CA's Panchayati Raj provisions, inserting Part IXA (Articles 243P-243ZG) specifically for urban local government.", "globalNum": 945}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Schedule did the 74th Constitutional Amendment add, and how many functional items does it list?", "options": ["12th Schedule, listing 18 functional items", "11th Schedule, listing 29 functional items", "13th Schedule, listing 22 functional items", "10th Schedule, listing 15 functional items"], "answer": 0, "explanation": "Correct: The 74th CA added the 12th Schedule with 18 functional items for municipalities — smaller in number than the 73rd CA's 11th Schedule (29 items) for Panchayats, but serving a parallel structural role.", "globalNum": 946}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Where and when was India's first Municipal Corporation set up, and where were corporations set up in 1726?", "options": ["Madras, 1687-1688; Calcutta and Bombay got corporations in 1726", "Calcutta, 1687-1688; Madras and Bombay got corporations in 1726", "Bombay, 1726; Madras and Calcutta got corporations in 1687-1688", "Delhi, 1857; all other cities followed later"], "answer": 0, "explanation": "Correct: Madras got India's very first Municipal Corporation (1687-1688), with Calcutta and Bombay following in 1726 — reflecting the East India Company's early urban administrative developments in these three Presidency towns.", "globalNum": 947}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "What did Lord Mayo's 1870 resolution address, and who is called the 'Father of Local Self-Government'?", "options": ["Financial Decentralisation; Lord Ripon is called the 'Father of Local Self-Government'", "Municipal reservation policy; Lord Curzon is the 'Father of Local Self-Government'", "Rural development; Lord Mayo himself is the 'Father of Local Self-Government'", "Judicial reforms; Warren Hastings is the 'Father of Local Self-Government'"], "answer": 0, "explanation": "Correct: Lord Mayo's 1870 resolution addressed financial decentralisation, laying groundwork that Lord Ripon later built on — earning Ripon (not Mayo) the title 'Father of Local Self-Government.'", "globalNum": 948}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "What is Lord Ripon's 1882 resolution called, reflecting its foundational importance to local self-government?", "options": ["'Magna Carta of Local Self-Government'", "'Declaration of Local Rights'", "'Charter of Municipal Freedom'", "'Bill of Local Autonomy'"], "answer": 0, "explanation": "Correct: Ripon's 1882 resolution earned the title 'Magna Carta of Local Self-Government,' underscoring its landmark, foundational status in Indian local governance history — much like the original Magna Carta's role in constitutional history.", "globalNum": 949}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article deals with the Constitution of Municipalities, and which deals with their Composition?", "options": ["243Q for Constitution; 243R for Composition", "243R for Constitution; 243Q for Composition", "243P for Constitution; 243Q for Composition", "243S for Constitution; 243R for Composition"], "answer": 0, "explanation": "Correct: Article 243Q covers how Municipalities are constituted, while 243R covers their composition — with 243P instead being the definitions article, and 243S covering Wards Committees.", "globalNum": 950}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article covers the constitution and composition of Wards Committees, and which covers Reservation of seats in Municipalities?", "options": ["243S for Wards Committees; 243T for Reservation", "243T for Wards Committees; 243S for Reservation", "243U for Wards Committees; 243V for Reservation", "243P for Wards Committees; 243Q for Reservation"], "answer": 0, "explanation": "Correct: Article 243S covers Wards Committees, and 243T covers seat reservation — paralleling the 73rd Amendment's Article 243D (reservation) structure for Panchayats.", "globalNum": 951}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article covers the Duration of Municipalities, and which covers Disqualifications for membership?", "options": ["243U for Duration; 243V for Disqualifications", "243V for Duration; 243U for Disqualifications", "243W for Duration; 243X for Disqualifications", "243T for Duration; 243U for Disqualifications"], "answer": 0, "explanation": "Correct: Article 243U covers Municipality duration (mirroring 243E for Panchayats), and 243V covers disqualifications (mirroring 243F) — maintaining the consistent parallel numbering pattern between Part IX and Part IXA.", "globalNum": 952}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article covers Powers/Authority/Responsibilities of Municipalities, and which covers their power to impose taxes and Funds?", "options": ["243W for Powers/Authority; 243X for Taxation/Funds", "243X for Powers/Authority; 243W for Taxation/Funds", "243Y for Powers/Authority; 243Z for Taxation/Funds", "243V for Powers/Authority; 243W for Taxation/Funds"], "answer": 0, "explanation": "Correct: Article 243W (paralleling 243G for Panchayats) covers general powers/responsibilities, while 243X (paralleling 243H) covers taxation and funds — the numbering sequence continues its consistent parallel structure.", "globalNum": 953}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article establishes a Finance Commission for Municipalities, and which covers Audit of Accounts?", "options": ["243Y for Finance Commission; 243Z for Audit", "243Z for Finance Commission; 243Y for Audit", "243ZA for Finance Commission; 243Y for Audit", "243X for Finance Commission; 243Y for Audit"], "answer": 0, "explanation": "Correct: Article 243Y (paralleling 243I for Panchayats) covers the Finance Commission, and 243Z (paralleling 243J) covers accounts audit — continuing the parallel pattern with the Panchayat provisions.", "globalNum": 954}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article covers Elections to Municipalities, and which covers Application to Union Territories?", "options": ["243ZA for Elections; 243ZB for UT Application", "243ZB for Elections; 243ZA for UT Application", "243ZC for Elections; 243ZD for UT Application", "243Z for Elections; 243ZA for UT Application"], "answer": 0, "explanation": "Correct: Article 243ZA (paralleling 243K) covers Municipal elections, and 243ZB (paralleling 243L) covers UT application — the parallel structure with Panchayat provisions continues consistently.", "globalNum": 955}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article excludes Part IXA from applying to certain areas, and which establishes Committees for District Planning and Metropolitan Planning respectively?", "options": ["243ZC excludes certain areas; 243ZD covers District Planning Committee; 243ZE covers Metropolitan Planning Committee", "243ZD excludes certain areas; 243ZC covers District Planning; 243ZE covers Metropolitan Planning", "243ZE excludes certain areas; 243ZC and 243ZD cover planning committees jointly", "243ZC covers both planning committees; 243ZD excludes certain areas"], "answer": 0, "explanation": "Correct: Article 243ZC (paralleling 243M) handles area exclusions, while 243ZD and 243ZE are UNIQUE additions not paralleled in Part IX — specifically creating District Planning and Metropolitan Planning Committees, reflecting urban-specific planning needs.", "globalNum": 956}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Which Article continues existing municipal laws until new systems are adopted, and which bars court interference in municipal electoral matters?", "options": ["243ZF for Continuance of laws; 243ZG for Bar to court interference", "243ZG for Continuance of laws; 243ZF for Bar to court interference", "243ZE for Continuance; 243ZF for Bar to interference", "243ZD for Continuance; 243ZE for Bar to interference"], "answer": 0, "explanation": "Correct: Article 243ZF (paralleling 243N) ensures legal continuity, and 243ZG (paralleling 243O) bars judicial interference in electoral matters — the final two provisions completing Part IXA's parallel structure with Part IX.", "globalNum": 957}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "What are the three types of Municipalities based on area type, per Article 243Q?", "options": ["Nagar Panchayat (Transitional Area), Municipal Council (small urban area), Municipal Corporation (larger urban area)", "Nagar Panchayat (large urban area), Municipal Council (transitional area), Municipal Corporation (small urban area)", "Only two types exist: Municipal Council and Municipal Corporation", "Municipal Corporation (village level), Nagar Panchayat (district level), Municipal Council (state level)"], "answer": 0, "explanation": "Correct: The three-tier classification runs from smallest to largest — Nagar Panchayat for transitional (rural-to-urban) areas, Municipal Council for smaller urban areas, and Municipal Corporation for larger urban areas.", "globalNum": 958}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Besides the three constitutional Municipality types, the notes list 8 broader types of Urban Local Government. Which of these is specifically managed by the Ministry of Defence?", "options": ["Cantonment Board, under the Cantonments Act, 2006", "Notified Area Committee", "Town Area Committee", "Special Purpose Agency"], "answer": 0, "explanation": "Correct: The Cantonment Board is a unique urban local body managed by the Ministry of Defence (given its military area context), governed by the Cantonments Act, 2006 — distinct from the other, civilian-administered urban bodies.", "globalNum": 959}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "What is a 'Notified Area Committee,' and what is a 'Town Area Committee' responsible for?", "options": ["Notified Area Committee: for developing towns; Town Area Committee: handles municipal functions like street lighting and drainage", "Notified Area Committee: for military areas; Town Area Committee: for developing towns", "Both terms mean exactly the same thing", "Notified Area Committee: handles street lighting; Town Area Committee: for developing towns"], "  for women, excluding chairperson posts", "Exactly 50% reservation, with no chairperson-post inclusion", "No women's reservation exists under either Article"], "answer": 0, "explanation": "Correct: Both Articles mandate a minimum 1/3rd women's reservation, explicitly including chairperson positions — ensuring women's representation extends to leadership roles, not just general membership.", "globalNum": 965}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Under Article 243S, when are Ward Committees mandatory for a Municipality?", "options": ["Only where the municipal population exceeds 3 lakh", "In every Municipality regardless of population size", "Only in Municipal Corporations, never in smaller Municipal Councils", "Only when the state government specifically requests it"], "answer": 0, "explanation": "Correct: Ward Committees become mandatory only for larger municipalities with population exceeding 3 lakh — smaller municipalities aren't required to constitute them, reflecting the added administrative complexity that comes with bigger urban populations.", "globalNum": 966}, {"tab": "t35", "tabTitle": "35. Local Government (Municipalities)", "q": "Do Municipalities (Art 243U) share the same 5-year term and 6-month re-election timeline as Panchayats (Art 243E)?", "options": ["Yes — both bodies have a fixed 5-year term, with fresh elections to be completed within 6 months of dissolution", "No, Municipalities have a 6-year term while Panchayats have 5 years", "No, Municipalities require immediate re-election with no 6-month grace period", "Yes, but Municipalities have no fixed term at all, unlike Panchayats"], "answer": 0, "explanation": "Correct: Articles 243U and 243E impose parallel rules — both a standard 5-year term and a 6-month window for completing fresh elections after dissolution, maintaining structural consistency between rural (Panchayat) and urban (Municipal) local governance.", "globalNum": 967}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What is the difference between a 'Constitutional body,' a 'Statutory body,' and a 'Non-statutory/Executive body'?", "options": ["Constitutional body: mentioned in the Constitution under an article; Statutory body: created by a law/Act; Non-statutory/Executive body: created by executive resolution/government order", "All three types are created identically, by the Constitution", "Statutory bodies are mentioned in the Constitution; Constitutional bodies are created by ordinary law", "Executive bodies require a Constitutional Amendment to be created"], "answer": 0, "explanation": "Correct: These three categories reflect the source of a body's authority — direct constitutional text, an ordinary Act of Parliament/legislature, or a simple executive order — a foundational distinction for classifying India's various governmental bodies.", "globalNum": 968}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Article, added by which Amendment, established the GST Council, and who is its Chairperson?", "options": ["Article 279A, added by the 101st CAA, 2016; chaired by the Union Finance Minister", "Article 280, added by the 73rd CAA; chaired by the Prime Minister", "Article 269A, added by the 122nd CAA; chaired by NITI Aayog's CEO", "Article 265, added by the 44th CAA; chaired by the RBI Governor"], "answer": 0, "explanation": "Correct: Article 279A (101st CAA, 2016) establishes the GST Council as a joint Centre-State forum, chaired by the Union Finance Minister — reinforcing cooperative federalism in indirect tax policy.", "globalNum": 969}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "How does the GST Council make decisions, and what is the voting-weightage split between Centre and States?", "options": ["Decisions by 3/4th (75%) majority of weighted votes: Centre has 1/3rd weightage, States together have 2/3rd weightage", "Decisions by simple majority, with equal 1-vote-per-member weightage", "Decisions require unanimous consent of all members", "Only the Centre's vote matters; States have no weightage at all"], "answer": 0, "explanation": "Correct: This weighted voting system (Centre 1/3rd, States collectively 2/3rd) requiring a 3/4th majority to pass decisions ensures neither the Centre nor the States can unilaterally dictate GST policy — a genuine cooperative federalism mechanism.", "globalNum": 970}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Under which Articles were the National Commissions for SCs and STs originally established, and what was Article 338 originally meant to provide?", "options": ["SCs: Article 338; STs: Article 338A; Article 338 originally provided for a Special Officer for SCs & STs (not yet a full Commission)", "SCs: Article 338A; STs: Article 338; both originally provided for full Commissions from the start", "Both under a single combined Article 338, from the very beginning", "SCs and STs both use Article 338B originally"], "answer": 0, "explanation": "Correct: Article 338 initially provided for just a Special Officer (not a full multi-member commission) for SCs & STs — the more elaborate Commission structure, and the later split into Articles 338 (SC) and 338A (ST), came through subsequent Amendments.", "globalNum": 971}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Amendment replaced the Special Officer with a multi-member National Commission for SCs & STs, and which Amendment later bifurcated this into two separate Commissions?", "options": ["65th CAA, 1990 created the multi-member Commission; 89th CAA, 2003 bifurcated it into NCSC (338) and NCST (338A)", "89th CAA created the Commission; 65th CAA bifurcated it", "Both changes happened via a single Amendment, the 102nd CAA", "The 42nd CAA created the Commission; the 44th CAA bifurcated it"], "answer": 0, "explanation": "Correct: The 65th CAA (1990) first replaced the Special Officer with a proper multi-member Commission, and the later 89th CAA (2003) split this single combined body into two dedicated Commissions — one each for SCs and STs.", "globalNum": 972}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What is the tenure and composition of the National Commissions for SCs/STs?", "options": ["Tenure: 3 years; Composition: Chairperson + Vice-Chairperson + 3 Members, all appointed by the President", "Tenure: 6 years; Composition: only a Chairperson, appointed by the PM", "Tenure: 5 years; Composition: Chairperson + 2 Members, appointed by Parliament", "Tenure: permanent, with no fixed term; Composition: 7 members appointed by the Governor"], "answer": 0, "explanation": "Correct: Both NCSC and NCST share the same structure — 3-year tenure, with a Chairperson, Vice-Chairperson, and 3 Members, all appointed by the President.", "globalNum": 973}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "When was the National Commission for Backward Classes (NCBC) originally established, and what did the Mandal Case (1992) direct regarding it?", "options": ["Established 1993 (originally statutory); the Mandal Case directed the Centre to constitute a permanent statutory body for Backward Classes", "Established 1990, directly as a constitutional body from the start", "Established 2018, with the Mandal Case having no connection to it", "Established 1985, following the Ashok Mehta Committee's recommendation"], "answer": 0, "explanation": "Correct: NCBC began in 1993 as a statutory body, directly responding to the Supreme Court's 1992 Mandal Case directive — it only later gained constitutional status, decades afterward.", "globalNum": 974}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Amendment gave the NCBC constitutional status, adding which new Article, and what special power does the NCBC have?", "options": ["102nd CAA, 2018, added Article 338B; NCBC has the power of Civil Courts", "89th CAA, 2003, added Article 338B; NCBC has only advisory power", "103rd CAA, 2019, added Article 338B; NCBC has judicial review power", "65th CAA, 1990, added Article 338B; NCBC has legislative power"], "answer": 0, "explanation": "Correct: The 102nd CAA (2018) elevated NCBC to constitutional status via the new Article 338B, and NCBC (like the SC/ST Commissions) holds Civil Court-equivalent powers — enabling it to summon witnesses, examine evidence, etc.", "globalNum": 975}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "The office of CAG is covered under which Part/Chapter and Articles, and what is its structure (single or multi-member)?", "options": ["Part V, Chapter V, Articles 148-151; a single-membered body", "Part XIV, Chapter I, Articles 308-314; a multi-membered body", "Part XV, Articles 324-329; a 3-member body", "Part V, Chapter I, Articles 52-78; a single-membered body"], "answer": 0, "explanation": "Correct: CAG is covered under Part V, Chapter V (Articles 148-151), and unlike bodies like the Finance Commission or UPSC, it is structured as a SINGLE-membered office, not a multi-member commission.", "globalNum": 976}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Who appoints the CAG, what is the term, and how is the CAG removed?", "options": ["Appointed by the President; term is 6 years or till 65 years of age (whichever is earlier); removed in the same manner as a Supreme Court Judge", "Appointed by Parliament; term is 5 years fixed; removed by a simple parliamentary vote", "Appointed by the Prime Minister; term is permanent until retirement age 60; removed only by the President's discretion", "Appointed by the Finance Minister; term is 3 years, renewable"], "answer": 0, "explanation": "Correct: Presidential appointment, a 6-year-or-age-65 term (whichever comes first), and SC-Judge-style removal procedure (requiring the elaborate Article 124(4) process) all underscore the CAG's high constitutional independence and protection.", "globalNum": 977}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "By what epithets is the CAG known, and who described the CAG as the 'Most Important Officer under the Constitution'?", "options": ["'Guardian of Public Purse'; described as 'Most Important Officer under the Constitution' by B.R. Ambedkar", "'Watchdog of Merit System'; described by Granville Austin", "'Balancing Wheel of Fiscal Federalism'; described by K.C. Wheare", "'Father of Local Self-Government'; described by Lord Ripon"], "answer": 0, "explanation": "Correct: 'Guardian of Public Purse' is the CAG's signature epithet, and B.R. Ambedkar specifically called the CAG the 'Most Important Officer under the Constitution' — reflecting the office's crucial financial oversight role. ('Watchdog of Merit System' instead describes the PSC, and 'Balancing Wheel of Fiscal Federalism' describes the Finance Commission.)", "globalNum": 978}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Who is the current CAG mentioned in the notes, and to whom are CAG audit reports of the Union and States submitted respectively?", "options": ["K. Sanjay Murthy is the current CAG; Union audit reports go to the President (Art 151(1)), State audit reports go to the Governor (Art 151(2))", "K. Sanjay Murthy is current CAG; Union reports go to the Governor; State reports go to the President", "N.K. Singh is current CAG; both Union and State reports go to Parliament directly", "Y.V. Reddy is current CAG; reports go to the Finance Ministry"], "answer": 0, "explanation": "Correct: K. Sanjay Murthy is named as the current CAG, with the audit-report submission split mirroring the Union-State executive divide — Union reports to the President, State reports to the respective Governor.", "globalNum": 979}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Under Article 279, what does the CAG certify, and is this certification binding?", "options": ["CAG ascertains and certifies the Net Proceeds of tax to be shared between Centre and State — this certification is NOT binding", "CAG directly decides the tax-sharing formula, which IS binding on both Centre and States", "This Article has nothing to do with the CAG", "CAG's certification under Article 279 requires Supreme Court approval to take effect"], "answer": 0, "explanation": "Correct: While the CAG's certification of net tax proceeds provides an authoritative figure, it is explicitly NOT binding — final tax-sharing decisions rest with the Finance Commission's (also non-binding, per Article 281) recommendations and subsequent political/administrative processes.", "globalNum": 980}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Articles cover the State Public Service Commission (SPSC), what is its term, and what qualification applies to half its members?", "options": ["Articles 315-323 (same as UPSC); term 6 years or till 62 years of age; at least 1/2 of members must have held Government office for 10 years", "Articles 324-329; term 6 years or 65 years of age; no specific qualification for members", "Articles 280-281; term permanent; all members must be retired judges", "Articles 338-338A; term 3 years; no qualification requirement"], "answer": 0, "explanation": "Correct: SPSC shares Articles 315-323 with UPSC (both under Part XIV, Chapter II) but has a slightly LOWER age cap (62, versus UPSC's 65) — and requires at least half its members to have prior 10-year government service experience.", "globalNum": 981}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Who appoints SPSC members, and how does their removal compare to UPSC members'?", "options": ["Appointed by the Governor of the State; removed in the same manner as UPSC members (i.e., ultimately by the President)", "Appointed by the Chief Minister; removed by the State Legislature", "Appointed by the President directly; removed by the Governor", "Appointed by the State Legislature; removal process differs entirely from UPSC"], "answer": 0, "explanation": "Correct: While the Governor appoints SPSC members
