 override the other, reinforcing the harmony principle from Kesavananda Bharati.", "globalNum": 476}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which of these is listed among the recognised 'Elements of the Basic Structure' of the Constitution?", "options": ["Separation of Power, Judicial Review, and Supremacy of the Constitution", "Right to Property and Right to a Uniform Civil Code", "Reservation policy and OBC quotas", "The specific text of the Preamble, word for word"], "answer": 0, "explanation": "Correct: Separation of Power, Judicial Review, and Supremacy of the Constitution (along with Unity/Integrity of the Nation, Fundamental Rights, and Parliamentary System) are recognised Basic Structure elements. Right to Property (now just a legal right) and specific policies like reservation are not part of this core, unamendable structure.", "globalNum": 477}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "From which country were Fundamental Duties borrowed, and what is their legal status?", "options": ["USSR; they are statutory and non-enforceable/non-justiciable", "USA; they are fully justiciable", "UK; they are enforceable only during Emergency", "Ireland; they are quasi-justiciable"], "answer": 0, "explanation": "Correct: Fundamental Duties were borrowed from the USSR (Russia) and are statutory in nature — non-enforceable and non-justiciable, unlike Fundamental Rights.", "globalNum": 478}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Were Fundamental Duties part of the original 1950 Constitution?", "options": ["No — they were introduced later, via the 42nd Constitutional Amendment Act, 1976", "Yes, they were part of the Constitution from the very beginning", "No, they were introduced by the 44th Amendment, 1978", "Yes, they were included via the 1st Amendment, 1951"], "answer": 0, "explanation": "Correct: Fundamental Duties were not originally part of the Constitution — they were added by the 42nd CA, 1976, along with several other significant changes (like Preamble amendments).", "globalNum": 479}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "To whom do Fundamental Duties apply?", "options": ["Indian citizens only, not foreigners", "Both citizens and foreigners equally", "Only government employees", "Only members of the Armed Forces"], "answer": 0, "explanation": "Correct: Fundamental Duties apply exclusively to Indian citizens, not to foreigners — unlike some Fundamental Rights (like Article 14, 20, 21) which extend to 'any person.'", "globalNum": 480}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which Committee proposed the addition of Fundamental Duties, and who was the Prime Minister at that time?", "options": ["Swaran Singh Committee, under PM Indira Gandhi", "Kalelkar Commission, under PM Jawaharlal Nehru", "Mandal Commission, under PM V.P. Singh", "Fazl Ali Commission, under PM Rajendra Prasad (as Head of State)"], "answer": 0, "explanation": "Correct: The Swaran Singh Committee proposed Fundamental Duties in 1976, during Indira Gandhi's tenure as Prime Minister — a period marked by the National Emergency.", "globalNum": 481}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "How many duties did the Swaran Singh Committee recommend, and how many were ultimately accepted?", "options": ["Recommended 8 duties; 5 were accepted, 3 rejected", "Recommended 10 duties; all 10 were accepted", "Recommended 11 duties; only 8 accepted", "Recommended 5 duties; all were rejected"], "answer": 0, "explanation": "Correct: The Committee recommended 8 duties, of which 5 were accepted and 3 rejected. Note that ultimately 10 duties were added via the 42nd CA (not exactly matching the accepted 5, since some duties were reformulated/expanded during drafting).", "globalNum": 482}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which three duties recommended by the Swaran Singh Committee were rejected?", "options": ["Imposing penalties for not observing duties, prohibiting challenges to penalty laws in courts, and a duty to pay taxes", "Duty to vote, duty to join the armed forces, and duty to learn Hindi", "Duty to protect the environment, duty to promote scientific temper, and duty to safeguard public property", "Duty to respect the National Flag, duty to defend the country, and duty to preserve heritage"], "answer": 0, "explanation": "Correct: The three rejected recommendations were penalising duty non-observance, barring judicial challenge to such penalty laws, and a duty to pay taxes — all of which would have created enforceable legal consequences, contrary to the eventual non-justiciable nature of FDs.", "globalNum": 483}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "How many Fundamental Duties were originally added by the 42nd Constitutional Amendment, 1976, and where were they placed?", "options": ["10 duties, added in Part IVA, Article 51A", "8 duties, added in Part IV, Article 48", "11 duties, added in Part III, Article 21A", "5 duties, added in the 9th Schedule"], "answer": 0, "explanation": "Correct: The 42nd CA added 10 Fundamental Duties in the newly created Part IVA, under Article 51A. The 11th duty was added later, in 2002.", "globalNum": 484}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which Amendment added the 11th Fundamental Duty [Article 51A(k)], and what does it concern?", "options": ["86th Constitutional Amendment, 2002 — duty of parents/guardians to provide education opportunities to children aged 6-14", "42nd Constitutional Amendment, 1976 — duty to pay taxes", "97th Constitutional Amendment, 2011 — duty to promote cooperative societies", "93rd Constitutional Amendment, 2005 — duty regarding SC/ST welfare"], "answer": 0, "explanation": "Correct: The 86th CA, 2002 (the same Amendment that added Article 21A) added the 11th Fundamental Duty, obligating parents/guardians to provide educational opportunities to children aged 6-14.", "globalNum": 485}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "According to H. R. Gokhale (then Law Minister), why were Fundamental Duties added in 1976?", "options": ["To control anti-national and unconstitutional activities that had increased before the 1975 Emergency", "To comply with a United Nations mandate", "To replace the Directive Principles entirely", "To give citizens additional voting rights"], "answer": 0, "explanation": "Correct: Gokhale explained that FDs were introduced to counter anti-national and unconstitutional activities that had grown before the 1975 Emergency — reflecting the political context of that period.", "globalNum": 486}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which international document do Fundamental Duties partly resemble?", "options": ["The Universal Declaration of Human Rights (UDHR)", "The US Bill of Rights", "The Magna Carta", "The UN Charter on Self-Determination"], "answer": 0, "explanation": "Correct: Fundamental Duties partly resemble the Universal Declaration of Human Rights (UDHR), reflecting shared global values around civic responsibility, despite FDs being a distinctly Indian constitutional innovation.", "globalNum": 487}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Who chaired the Constitution Review Commission (2002) that recommended measures for effective implementation of Fundamental Duties?", "options": ["M. N. Venkatachaliah", "Justice Verma", "H. R. Gokhale", "Swaran Singh"], "answer": 0, "explanation": "Correct: M. N. Venkatachaliah chaired the 2002 Constitution Review Commission. Justice Verma instead led a separate committee focused on legal provisions for FD implementation and school education about duties.", "globalNum": 488}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What did the Justice Verma Committee identify regarding Fundamental Duties?", "options": ["The existence of legal provisions for implementing FDs and teaching school kids about their duties", "That Fundamental Duties should be made justiciable immediately", "That Fundamental Duties should be abolished entirely", "That FDs conflict irreconcilably with Fundamental Rights"], "answer": 0, "explanation": "Correct: The Justice Verma Committee identified existing legal provisions relevant to FD implementation and education of children about their duties — a more modest, practical finding than making FDs justiciable or recommending their abolition.", "globalNum": 489}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What does Fundamental Duty 51A(a) require citizens to do?", "options": ["Abide by the Constitution, respect its ideals & institutions, the National Flag, and the National Anthem", "Cherish the ideals of the freedom struggle", "Defend the country when called upon", "Develop scientific temper and humanism"], "answer": 0, "explanation": "Correct: Duty (a) requires respecting the Constitution, its ideals/institutions, the National Flag, and the National Anthem. Cherishing freedom-struggle ideals is duty (b), defending the country is duty (d), and scientific temper is duty (h).", "globalNum": 490}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What do Fundamental Duties (b) and (c) require of citizens?", "options": ["(b) Cherish and follow the noble ideals of the freedom struggle; (c) Uphold and protect the sovereignty, unity, and integrity of India", "(b) Defend the country; (c) Preserve composite culture", "(b) Protect the environment; (c) Develop scientific temper", "(b) Safeguard public property; (c) Provide education to children"], "answer": 0, "explanation": "Correct: Duty (b) is about cherishing freedom-struggle ideals, and duty (c) is about upholding sovereignty, unity, and integrity of India — distinct from defending the country (d), which is a separate duty.", "globalNum": 491}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What does Fundamental Duty (e) require, including its provision on women's dignity?", "options": ["Promote harmony and common brotherhood transcending religious/linguistic/regional diversities, and renounce practices derogatory to women's dignity", "Only promote religious harmony, with no mention of women", "Only address women's dignity, with no mention of brotherhood", "Promote regional pride over national unity"], "answer": 0, "explanation": "Correct: Duty (e) combines promoting harmony/brotherhood across India's diversities with specifically renouncing practices derogatory to women's dignity — a dual-focus duty.", "globalNum": 492}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What does Fundamental Duty (f) require regarding culture?", "options": ["Value and preserve the rich heritage of our composite culture", "Promote only regional cultures over the national culture", "Abolish traditional cultural practices deemed outdated", "Adopt a single, uniform national culture"], "answer": 0, "explanation": "Correct: Duty (f) requires valuing and preserving India's composite cultural heritage — recognising the diversity within this heritage, not imposing a single uniform culture.", "globalNum": 493}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What does Fundamental Duty (g) require regarding the environment?", "options": ["Protect and improve the natural environment including forests, lakes, rivers, wildlife, and have compassion for living creatures", "Only protect forests, with no mention of wildlife or compassion", "Only protect domesticated animals", "Protect only rivers and lakes, excluding forests"], "answer": 0, "explanation": "Correct: Duty (g) broadly covers protecting/improving the natural environment (forests, lakes, rivers, wildlife) and having compassion for living creatures — a comprehensive environmental and animal-welfare duty.", "globalNum": 494}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What does Fundamental Duty (h) require?", "options": ["Develop scientific temper, humanism, and the spirit of inquiry and reform", "Develop military discipline and readiness", "Develop artistic and cultural talents", "Develop entrepreneurial and business skills"], "answer": 0, "explanation": "Correct: Duty (h) requires developing scientific temper, humanism, and the spirit of inquiry/reform — promoting rational thinking and social reform, not specifically military, artistic, or business skills.", "globalNum": 495}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "What do Fundamental Duties (i) and (j) require?", "options": ["(i) Safeguard public property and abjure violence; (j) Strive towards excellence in all spheres of individual & collective activity", "(i) Strive for excellence; (j) Safeguard public property", "(i) Pay taxes; (j) Vote in elections", "(i) Defend the country; (j) Protect the environment"], "answer": 0, "explanation": "Correct: Duty (i) is about safeguarding public property and avoiding violence, while duty (j) is about striving for excellence in individual and collective endeavours — two distinct final 'original' duties from the 42nd Amendment's list of 10.", "globalNum": 496}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which duty is unique in that it binds parents/guardians rather than citizens generally, and what does it require?", "options": ["The 11th duty, 51A(k) — parents/guardians must provide education opportunities to children aged 6-14", "The 1st duty, 51A(a) — parents must teach the National Anthem to children", "The 5th duty, 51A(e) — parents must promote brotherhood among children", "All 11 duties bind parents/guardians equally"], "answer": 0, "explanation": "Correct: The 11th duty (51A(k), added by the 86th CA, 2002) uniquely binds parents/guardians (not just citizens generally), requiring them to provide educational opportunities to children aged 6-14 — mirroring Article 21A's Right to Education.", "globalNum": 497}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which law is linked to enforcing Fundamental Duty (a) — respect for the Constitution, Flag, and Anthem — besides the Representation of the People Act?", "options": ["Prevention of Insults to National Honour Act, 1971", "Wildlife Protection Act, 1972", "Forest Conservation Act, 1980", "Unlawful Activities (Prevention) Act, 1967"], "answer": 0, "explanation": "Correct: The Prevention of Insults to National Honour Act, 1971 prohibits disrespect to the Constitution, Flag, and Anthem, directly linked to Duty (a). The Wildlife and Forest Acts relate instead to Duty (g), and the UAPA relates to Duty (c).", "globalNum": 498}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which law is linked to Duty (c) — protecting sovereignty and integrity of India — by preventing threats to it?", "options": ["Unlawful Activities (Prevention) Act, 1967", "Protection of Civil Rights Act, 1955", "Indian Penal Code", "Representation of the People Act, 1951"], "answer": 0, "explanation": "Correct: The Unlawful Activities (Prevention) Act, 1967 (UAPA) prevents activities threatening India's sovereignty and integrity, directly linked to Duty (c). The Protection of Civil Rights Act instead relates to Duty (e), addressing untouchability/equality.", "globalNum": 499}, {"tab": "t21", "tabTitle": "21. Fundamental Duties", "q": "Which two laws are linked to Duty (g) — protecting the environment, forests, and wildlife?", "options": ["Wildlife Protection Act, 1972 and Forest Conservation Act, 1980", "Indian Penal Code and Representation of the People Act, 1951", "Protection of Civil Rights Act, 1955 and Prevention of Insults to National Honour Act, 1971", "Unlawful Activities (Prevention) Act, 1967 alone"], "answer": 0, "explanation": "Correct: The Wildlife Protection Act, 1972 and Forest Conservation Act, 1980 both directly support Duty (g)'s environmental and wildlife protection goals — legally reinforcing what would otherwise be a non-enforceable moral duty.", "globalNum": 500}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Part V of the Constitution (Union Executive) is divided into 5 chapters. Which chapter covers the President, VP, PM, Council of Ministers, and Attorney General, and which Articles does it span?", "options": ["Chapter I, Articles 52-78", "Chapter II, Articles 79-122", "Chapter IV, Articles 124-147", "Chapter V, Articles 148-151"], "answer": 0, "explanation": "Correct: Chapter I (Articles 52-78) covers the Union Executive proper. Chapter II covers Parliament (79-122), Chapter IV covers Union Judiciary (124-147), and Chapter V covers CAG (148-151).", "globalNum": 501}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Which chapter of Part V covers the Legislative Powers of the President, and which covers the Union Judiciary?", "options": ["Chapter III (Article 123) for Legislative Powers; Chapter IV (124-147) for Union Judiciary", "Chapter IV for Legislative Powers; Chapter III for Union Judiciary", "Chapter II for both", "Chapter V for Legislative Powers; Chapter I for Union Judiciary"], "answer": 0, "explanation": "Correct: Chapter III (just Article 123) covers the President's legislative (ordinance-making) powers, and Chapter IV (124-147) covers the Union Judiciary — distinct chapters within Part V.", "globalNum": 502}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What does Article 52 establish, and what does Article 53 provide regarding executive power?", "options": ["Art 52: there shall be a President as Head of the Union Executive; Art 53: executive power vests in the President, who is Supreme Commander of the defence forces", "Art 52: Parliament's structure; Art 53: the President's term", "Art 52: the Vice-President's role; Art 53: the PM's appointment", "Art 52: impeachment procedure; Art 53: pardoning power"], "answer": 0, "explanation": "Correct: Article 52 establishes the office of President as Head of the Union Executive, and Article 53 vests executive power in the President, who also serves as Supreme Commander of the Army, Navy, and Air Force.", "globalNum": 503}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 54, who comprises the electoral college that elects the President?", "options": ["Elected members of both Houses of Parliament + elected members of State Legislative Assemblies + elected members of the Delhi and Puducherry Legislative Assemblies", "All members (elected and nominated) of Parliament and State Assemblies", "Only the elected members of the Lok Sabha", "All Indian citizens through direct popular vote"], "answer": 0, "explanation": "Correct: The electoral college includes elected MPs (LS+RS), elected MLAs of all States, and elected MLAs of the UTs of Delhi and Puducherry specifically — nominated members are explicitly excluded, and it is not a direct popular election.", "globalNum": 504}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Do nominated members of Parliament or State Legislative Councils participate in the President's election?", "options": ["No — nominated members do NOT participate in the President's election", "Yes, all nominated members participate fully", "Only nominated Rajya Sabha members participate", "Only nominated Legislative Council members participate"], "answer": 0, "explanation": "Correct: Nominated members of Parliament and Legislative Councils are excluded from the Presidential electoral college — only elected members (of Parliament and specified assemblies) participate.", "globalNum": 505}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "The President is described using which titles in the notes?", "options": ["Titular Head, First citizen of India, and Nominal/De jure head of the country", "Executive Head, Chief Administrator, and De facto ruler", "Supreme Legislator and Chief Justice ex-officio", "Only 'Head of State' with no other titles"], "answer": 0, "explanation": "Correct: The President is the Titular Head, First Citizen, and Nominal/De jure head — reflecting India's parliamentary system where real executive power (de facto) lies with the Council of Ministers, not the President personally.", "globalNum": 506}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 55, what is the manner of the President's election?", "options": ["Indirect election, using Proportional Representation with Single Transferable Vote (STV), by Secret ballot", "Direct election by the people, using First Past the Post", "Indirect election, using a simple majority vote by Parliament alone", "Direct election, using STV"], "answer": 0, "explanation": "Correct: Article 55 provides for indirect election via Proportional Representation with Single Transferable Vote, conducted by secret ballot — not a direct popular vote nor a simple parliamentary majority.", "globalNum": 507}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What is the security deposit required for a Presidential election candidate?", "options": ["₹15,000", "₹1,00,000", "₹5,000", "₹50,000"], "answer": 0, "explanation": "Correct: The security deposit for a Presidential candidate is ₹15,000, as specified in the notes.", "globalNum": 508}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "How is the value of an MLA's vote in the Presidential election calculated?", "options": ["(Total population of the state / Total number of elected MLAs) × 1/1000", "(Total population of India / Total number of MPs) × 1/1000", "(Total votes polled / Total number of MLAs) + 1", "A fixed value of 1 vote per MLA, regardless of population"], "answer": 0, "explanation": "Correct: An MLA's vote value is calculated as (state population ÷ number of elected MLAs) × 1/1000 — designed to give roughly proportional weight to each state's population.", "globalNum": 509}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "How is the value of an MP's vote in the Presidential election calculated, and how is the 'electoral quota' calculated?", "options": ["MP's vote value = total value of all MLA votes ÷ total number of elected MPs; Electoral quota = (total valid votes polled ÷ (elected MPs+1)) + 1", "MP's vote value = fixed at 1000; Electoral quota = total votes divided by 2", "MP's vote value = population of India ÷ total MPs; Electoral quota = MLA vote value", "Both formulas are identical to the MLA vote value formula"], "answer": 0, "explanation": "Correct: An MP's vote value is the total value of all MLAs' votes divided by the total elected MPs, ensuring balance between the Centre and states. The electoral quota formula determines the minimum votes a candidate needs to win.", "globalNum": 510}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 56, what is the President's term of office, and who was the longest-serving and 1st President of India?", "options": ["5 years; Dr. Rajendra Prasad (1950-1962)", "6 years; Dr. Sarvepalli Radhakrishnan", "4 years; Dr. Zakir Husain", "5 years; Dr. A.P.J. Abdul Kalam"], "answer": 0, "explanation": "Correct: The President's term is 5 years, and Dr. Rajendra Prasad was both the 1st President and the longest-serving one (1950-1962), serving nearly 12 years across multiple terms.", "globalNum": 511}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 57, is the President eligible for re-election, and can a naturalised citizen become President?", "options": ["Eligible for re-election any number of times; a naturalised citizen CANNOT become President", "Eligible for re-election only once; naturalised citizens can become President", "Not eligible for re-election at all; naturalised citizens can become President", "Eligible for re-election any number of times; naturalised citizens can also become President"], "answer": 0, "explanation": "Correct: The President can be re-elected any number of times (unlike the USA's 2-term limit), but per the notes, a naturalised citizen cannot become President — note this appears to conflict with the general 'citizens by birth or naturalisation both eligible' point discussed under Citizenship, reflecting a specific caveat highlighted here for Article 58's qualifications.", "globalNum": 512}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "How many terms can a US President serve, as noted for comparison with India's unlimited re-election rule?", "options": ["Maximum of 2 terms", "Maximum of 3 terms", "Unlimited terms, same as India", "Maximum of 1 term"], "answer": 0, "explanation": "Correct: The USA caps its President at a maximum of 2 terms, unlike India, where the President can be re-elected any number of times under Article 57.", "globalNum": 513}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 58, what are the qualifications required for election as President?", "options": ["Citizen of India, minimum 35 years of age, qualified for election as a Lok Sabha member, and must not hold any office of profit", "Citizen of India, minimum 25 years of age, and no other requirements", "Must have served in Parliament for at least 10 years", "Must be a natural-born citizen with no naturalised citizens eligible, as in the USA"], "answer": 0, "explanation": "Correct: Article 58 requires Indian citizenship, minimum age 35, Lok Sabha eligibility, and no office of profit. Notably, 'office of profit' itself is not defined in the Constitution.", "globalNum": 514}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Is the President immune from legal proceedings during their term of office?", "options": ["Immune from criminal proceedings; civil proceedings can be initiated after giving 2 months' notice", "Immune from both civil and criminal proceedings permanently", "Not immune from any proceedings at all", "Immune only from criminal proceedings related to pre-Presidency conduct"], "answer": 0, "explanation": "Correct: The President enjoys criminal immunity during their term, but civil proceedings can be brought against them after 2 months' notice — a partial, not absolute, immunity.", "globalNum": 515}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 59, what conditions apply to the President's office regarding Parliament membership and emoluments?", "options": ["Must vacate any seat in Parliament/State Legislature before appointment (59(1)); emoluments cannot be diminished during the term (59(3))", "Can remain a sitting MP while serving as President", "Emoluments can be reduced by Parliament at any time during the term", "There are no specific conditions attached to the office"], "answer": 0, "explanation": "Correct: Article 59(1) requires vacating any Parliament/State Legislature seat before becoming President, and 59(3) protects the President's emoluments from being reduced during their term — safeguarding independence from political pressure.", "globalNum": 516}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 60, who administers the oath of office to the President, and who does so if that person is unavailable?", "options": ["The Chief Justice of India; if unavailable, the senior-most judge of the Supreme Court", "The Prime Minister; if unavailable, the Speaker of Lok Sabha", "The Vice President; if unavailable, the CJI", "The outgoing President; if unavailable, the Attorney General"], "answer": 0, "explanation": "Correct: The CJI administers the Presidential oath, with the senior-most SC judge stepping in if the CJI is unavailable — ensuring judicial, not political, oversight of this ceremony.", "globalNum": 517}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 61, what is the ground for impeaching the President, and is this ground defined in the Constitution?", "options": ["Violation of the Constitution — this ground is NOT defined in the Constitution", "Corruption — this ground is precisely defined in Article 61", "Any criminal offence — with a specific list given in the Constitution", "Loss of confidence of Parliament — as in a no-confidence motion"], "answer": 0, "explanation": "Correct: The sole ground for impeachment is 'violation of the Constitution,' but this phrase itself is left undefined, giving Parliament some interpretive latitude in impeachment proceedings.", "globalNum": 518}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "In the President's impeachment process under Article 61, who takes part, what signature threshold is required to initiate charges, and what notice period applies?", "options": ["All Members of Parliament (elected + nominated) take part; charges signed by 1/4 of that House's members; 14 days' notice to the President", "Only elected MPs take part; charges signed by 1/2 of that House's members; 30 days' notice", "Only Rajya Sabha members take part; no signature threshold; no notice required", "Only Lok Sabha members take part; charges signed by 2/3 of members; 7 days' notice"], "answer": 0, "explanation": "Correct: Both elected and nominated MPs participate in impeachment (unlike election, where nominated members are excluded), charges need 1/4 of the initiating House's members' signatures, and 14 days' notice must be given to the President.", "globalNum": 519}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "From which country is the concept of 'Impeachment' borrowed, and which House(s) of Parliament can initiate impeachment charges against the President?", "options": ["USA; charges can be initiated by either House of Parliament", "UK; charges can only be initiated by the Lok Sabha", "France; charges can only be initiated by the Rajya Sabha", "Ireland; charges require both Houses to jointly initiate simultaneously"], "answer": 0, "explanation": "Correct: Impeachment is borrowed from the USA, and either House of the Indian Parliament (Lok Sabha or Rajya Sabha) can initiate the impeachment process against the President.", "globalNum": 520}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "After an impeachment resolution is initiated, what majority must it be passed by in each House, and what is the President's right during the investigation?", "options": ["Special Majority (two-thirds of total membership) in both Houses; President has the right to appear and be represented during investigation", "Simple majority in both Houses; the President has no right to appear", "Special Majority only in the initiating House; the President cannot be represented", "Absolute majority; only written submissions from the President are allowed"], "answer": 0, "explanation": "Correct: Impeachment requires a Special Majority (two-thirds of total membership) in both Houses, and the President has the right to appear and be represented during the investigation — reflecting impeachment's quasi-judicial nature. No President has ever actually been impeached in India.", "globalNum": 521}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Do nominated members participate in the President's impeachment, even though they cannot vote in the President's election? What about elected State/UT Assembly members?", "options": ["Nominated MPs CAN participate in impeachment (though not in election); elected State/UT Assembly members participate in election but NOT in impeachment", "Neither nominated MPs nor elected Assembly members participate in either process", "Both groups participate in both election and impeachment equally", "Nominated MPs participate in election but not impeachment; Assembly members participate in impeachment but not election"], "answer": 0, "explanation": "Correct: This is a notable asymmetry — nominated MPs are excluded from the Presidential election but included in impeachment, while elected State/UT Assembly members are included in the election but excluded from impeachment (which is purely a Parliament-level process).", "globalNum": 522}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 62, if a Presidential vacancy arises due to death, resignation, or removal, within what period must a new election be held, and who acts as President meanwhile?", "options": ["Within 6 months; the Vice President acts as Acting President (or CJI, or senior-most SC judge if VP is unavailable)", "Within 3 months; the Prime Minister acts as Acting President", "Within 1 year; the Speaker of Lok Sabha acts as Acting President", "Immediately, with no interim arrangement allowed"], "answer": 0, "explanation": "Correct: A new election must be held within 6 months of such a vacancy, with the VP acting as President in the interim (falling back to the CJI, then the senior-most SC judge, if the VP is unavailable).", "globalNum": 523}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Give a real historical example (per the notes) of the Article 62 succession chain being triggered.", "options": ["President Zakir Hussain died in May 1969; VP V.V. Giri acted as President, then CJI M. Hidayatullah officiated when Giri resigned to contest the Presidential election", "President Rajendra Prasad resigned in 1962; PM Nehru acted as President", "President Fakhruddin Ali Ahmed died in 1977; the Speaker of Lok Sabha acted as President", "President Giani Zail Singh was impeached in 1986; VP R. Venkataraman took over permanently"], "answer": 0, "explanation": "Correct: Zakir Hussain's death in May 1969 triggered VP V.V. Giri's acting Presidency; when Giri resigned to run for President himself, CJI M. Hidayatullah served as officiating President (20 July - 24 Aug 1969) until the election concluded.", "globalNum": 524}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 63-64, what is the Vice-President's ex-officio role, and from which country's constitution is the VP post borrowed?", "options": ["Ex-officio Chairman of the Rajya Sabha (Council of States); borrowed from the U.S. Constitution", "Ex-officio Speaker of Lok Sabha; borrowed from the UK", "Ex-officio Chairman of the Lok Sabha; borrowed from Ireland", "Ex-officio Chief Justice of India; borrowed from Canada"], "answer": 0, "explanation": "Correct: The Vice President is the ex-officio Chairman of the Rajya Sabha, and this post itself was borrowed from the U.S. Constitution. It is the second-highest constitutional post in India.", "globalNum": 525}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "For a maximum of how long can the Vice-President act as President under Article 65?", "options": ["6 months", "1 year", "3 months", "5 years, the full term"], "answer": 0, "explanation": "Correct: The VP can act as President for a maximum of 6 months (matching the timeline for holding a fresh Presidential election under Article 62).", "globalNum": 526}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 66, who forms the electoral college for electing the Vice-President, and what are the eligibility criteria for VP candidates?", "options": ["All members (elected + nominated) of both Houses of Parliament; candidate must be an Indian citizen, 35 years old, and qualified for election as a Rajya Sabha member", "Only elected members of Parliament; must be 25 years old and qualified for Lok Sabha", "All members of Parliament plus State Legislatures; must be 30 years old", "Only Rajya Sabha members; must be qualified for Lok Sabha membership"], "answer": 0, "explanation": "Correct: Unlike the Presidential election (elected members only, plus state assemblies), the VP's electoral college includes ALL members (elected AND nominated) of both Houses of Parliament ONLY — State Legislatures are not involved. VP candidates must be citizens, 35 years old, and qualified for Rajya Sabha (not Lok Sabha) membership.", "globalNum": 527}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 67, what is the Vice-President's term of office, and can they resign?", "options": ["Up to 5 years; can resign by submitting resignation to the President", "Up to 6 years; cannot resign under any circumstances", "Up to 4 years; can resign only to Parliament", "Up to 5 years; can resign only after completing at least 2 years"], "answer": 0, "explanation": "Correct: The VP's term is up to 5 years, and they can resign by submitting their resignation to the President (just as the President can resign to the VP).", "globalNum": 528}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 67(b), how can the Vice-President be removed from office, and where must such a resolution be initiated?", "options": ["A removal resolution can only be initiated in the Rajya Sabha, with 14 days' prior notice, passed by an effective majority in RS and simple majority in LS", "A removal resolution can be initiated in either House, requiring a two-thirds majority in both", "Only the President can remove the VP directly, with no parliamentary resolution needed", "The VP cannot be removed under any circumstances before the term ends"], "answer": 0, "explanation": "Correct: A VP removal resolution must originate specifically in the Rajya Sabha, needs 14 days' notice, and requires an effective majority in RS plus a simple majority in LS — no specific grounds are mentioned in the Constitution, unlike the President's 'violation of Constitution' ground.", "globalNum": 529}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 68, what happens if a Vice-President vacancy arises due to the normal expiration of the term?", "options": ["The election to fill the vacancy shall be completed before the expiration of the term", "The post remains vacant until Parliament decides otherwise", "An Acting Vice-President is appointed by the President indefinitely", "The Chief Justice automatically becomes Vice-President"], "answer": 0, "explanation": "Correct: For a normal term-end vacancy, the election must be completed before the term expires — ensuring continuity of the office, similar to the rule for a normally-ending Presidential term.", "globalNum": 530}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 69, who administers the oath of office to the Vice-President?", "options": ["The President, or any person appointed on the President's behalf", "The Chief Justice of India, as with the President's oath", "The Speaker of the Lok Sabha", "The outgoing Vice-President"], "answer": 0, "explanation": "Correct: The VP's oath is administered by the President (or their appointee) — distinct from the President's own oath, which is administered by the CJI.", "globalNum": 531}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What does Article 70 provide for regarding the discharge of the President's functions in emergencies?", "options": ["Parliament may make provisions for discharge of the President's functions in any contingency not otherwise provided for", "Only the Vice President can ever discharge the President's functions, with no other options", "The Prime Minister automatically takes over all Presidential functions", "The Supreme Court directly assumes Presidential functions"], "answer": 0, "explanation": "Correct: Article 70 gives Parliament a general residual power to arrange for discharge of Presidential functions in contingencies not explicitly covered elsewhere in the Constitution.", "globalNum": 532}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 71, who has exclusive jurisdiction over disputes relating to the President's or VP's election, and what happens if such an election is later declared void?", "options": ["The Supreme Court has exclusive jurisdiction; if declared void, acts done by the President/VP before that declaration remain valid", "The Election Commission has exclusive jurisdiction; if void, all prior acts are automatically nullified", "Parliament has exclusive jurisdiction; the High Court reviews on appeal", "The President's Secretariat resolves such disputes internally"], "answer": 0, "explanation": "Correct: Article 71(1) gives the Supreme Court exclusive and final jurisdiction over election disputes, and 71(2) protects the validity of official acts performed before any void declaration — preventing administrative chaos.", "globalNum": 533}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 71(4), can a President's or VP's election be challenged solely on the ground that the electoral college was incomplete?", "options": ["No — Article 71(4) specifically bars challenging an election merely because the electoral college was incomplete", "Yes, an incomplete electoral college is automatic grounds for invalidating the election", "Only the Supreme Court can decide whether incompleteness matters, case by case", "This provision applies only to VP elections, not Presidential ones"], "answer": 0, "explanation": "Correct: Article 71(4) explicitly protects elections from being challenged merely due to an incomplete electoral college (e.g., if some seats were vacant) — ensuring stability even amid administrative gaps.", "globalNum": 534}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who were the two Vice-Presidents elected for 2 consecutive terms, and who is noted as the longest-serving VP, having served under 3 Presidents?", "options": ["Dr. Sarvepalli Radhakrishnan and M. Hamid Ansari elected twice; M. Hamid Ansari (2007-2017) is the longest-serving, serving under 3 Presidents", "Only Radhakrishnan served two terms; Zakir Husain was longest-serving", "Only Hamid Ansari served two terms; Venkaiah Naidu was longest-serving", "Krishan Kant and Bhairon Singh Shekhawat both served two terms"], "answer": 0, "explanation": "Correct: Radhakrishnan and Hamid Ansari each served two consecutive VP terms, with Ansari (2007-2017) being the longest-serving VP overall, uniquely having served under three different Presidents.", "globalNum": 535}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Under Article 72, what are the five types of pardoning power available to the President?", "options": ["Pardon, Commutation, Remission, Respite, and Reprieve", "Pardon, Amnesty, Forgiveness, Clemency, and Grace", "Commutation, Remission, Reprieve, Acquittal, and Discharge", "Pardon, Reprieve, Bail, Parole, and Probation"], "answer": 0, "explanation": "Correct: The five types are Pardon (removes punishment/conviction entirely), Commutation (changes punishment form), Remission (reduces punishment period), Respite (lessens punishment for special conditions like pregnancy), and Reprieve (temporary stay of execution).", "globalNum": 536}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What is the key difference between the pardoning powers of the President (Article 72) and the Governor (Article 161)?", "options": ["The President can pardon death sentences and court-martial punishments; the Governor cannot pardon either", "The Governor can pardon death sentences; the President cannot", "Both have identical pardoning powers with no differences", "Only the President can grant Remission; only the Governor can grant Reprieve"], "answer": 0, "explanation": "Correct: The President's unique powers include pardoning death sentences and court-martial (military court) punishments — powers the Governor lacks under Article 161.", "globalNum": 537}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What did the Maru Ram v. Union of India (1980) case establish about the pardoning power under Articles 72 and 161?", "options": ["It is not an absolute/personal power — must be exercised on the aid and advice of the Council of Ministers, and is subject to limited judicial review on grounds like mala fide or arbitrariness", "It is an absolute, unreviewable personal power of the President/Governor", "It can never be subject to any form of judicial review whatsoever", "It applies only to the President, not the Governor"], "answer": 0, "explanation": "Correct: Maru Ram (1980) clarified that pardoning power isn't a personal/absolute power — it must follow ministerial advice and remains subject to limited judicial review for issues like mala fide intent or irrationality.", "globalNum": 538}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What did Kehar Singh vs Union of India (1988) hold about judicial review of the President's pardoning power?", "options": ["It is not subject to judicial review, unless the decision is arbitrary, mala fide, irrational, or discriminatory", "It is fully subject to judicial review in all cases", "It can never be reviewed, even for mala fide exercise", "Only Parliament, not courts, can review such decisions"], "answer": 0, "explanation": "Correct: Kehar Singh held pardoning power generally escapes judicial review, but carved out exceptions for arbitrary, mala fide, irrational, or discriminatory exercises — largely consistent with, and refining, the earlier Maru Ram position.", "globalNum": 539}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "What are the President's judicial powers, besides pardoning?", "options": ["Appoints the CJI and judges of the SC/HCs; can seek (non-binding) advisory opinions from the Supreme Court on any law or fact", "Directly decides court cases as the final court of appeal", "Can overrule Supreme Court judgments unilaterally", "Appoints all subordinate court judges directly"], "answer": 0, "explanation": "Correct: The President appoints top judges and can seek the SC's advisory opinion (which is not binding), alongside exercising pardoning powers — but cannot overrule SC judgments or appoint subordinate court judges directly (a state-level function).", "globalNum": 540}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Which President is noted as the '1st Muslim President,' who died in office, and was the shortest-serving President?", "options": ["Dr. Zakir Husain (1967-1969)", "Giani Zail Singh (1982-1987)", "Fakhruddin Ali Ahmed (1974-1977)", "A.P.J. Abdul Kalam (2002-2007)"], "answer": 0, "explanation": "Correct: Dr. Zakir Husain was the 1st Muslim President, died in office (1969), and was the shortest-serving President. Fakhruddin Ali Ahmed also died in office later but was not the 1st Muslim President; Zail Singh was the 1st Sikh President.", "globalNum": 541}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Which President is noted as the '1st Acting President to be later elected' as full President, and which is noted as the only President 'elected unopposed'?", "options": ["V.V. Giri (1st Acting President later elected); Neelam Sanjiva Reddy (elected unopposed)", "Neelam Sanjiva Reddy (1st Acting President later elected); V.V. Giri (elected unopposed)", "Fakhruddin Ali Ahmed for both", "Giani Zail Singh for both"], "answer": 0, "explanation": "Correct: V.V. Giri, having served as Acting President after Zakir Husain's death, was later elected President in his own right (1969-1974). Neelam Sanjiva Reddy (1977-1982) was the only President elected unopposed, and also the 1st non-Congress President.", "globalNum": 542}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Which President declared the Emergency on 25 June 1975 and also died in office, and which President was the 1st Sikh President who first used the 'pocket veto'?", "options": ["Fakhruddin Ali Ahmed declared the Emergency and died in office; Giani Zail Singh was the 1st Sikh President who used the pocket veto (1986, Indian Post Office Amendment Bill)", "Giani Zail Singh declared the Emergency; Fakhruddin Ali Ahmed used the pocket veto", "Neelam Sanjiva Reddy declared the Emergency; V.V. Giri used the pocket veto", "R. Venkataraman declared the Emergency; K.R. Narayanan used the pocket veto"], "answer": 0, "explanation": "Correct: Fakhruddin Ali Ahmed declared the 1975 Emergency and died in office (1977). Giani Zail Singh, the 1st Sikh President, used India's first pocket veto in 1986 on the Indian Post Office Amendment Bill (also serving during Operation Blue Star).", "globalNum": 543}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who was the 1st Dalit President, and who was the 2nd Dalit President of India?", "options": ["K.R. Narayanan (1st, 1997-2002); Ram Nath Kovind (2nd, 2017-2022)", "Ram Nath Kovind (1st); K.R. Narayanan (2nd)", "Droupadi Murmu (1st); K.R. Narayanan (2nd)", "Pratibha Patil (1st); K.R. Narayanan (2nd)"], "answer": 0, "explanation": "Correct: K.R. Narayanan was the 1st Dalit President (1997-2002), and Ram Nath Kovind was the 2nd Dalit President (2017-2022) — two decades apart.", "globalNum": 544}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who was the 1st woman President of India, and who was the 1st Tribal (and 2nd woman) President?", "options": ["Pratibha Patil (1st woman, 2007-2012); Droupadi Murmu (1st Tribal & 2nd woman, 2022-present)", "Droupadi Murmu (1st woman); Pratibha Patil (1st Tribal)", "Dr. Shankar Dayal Sharma (1st woman); Pratibha Patil (1st Tribal)", "K.R. Narayanan (1st woman); Droupadi Murmu (1st Tribal)"], "answer": 0, "explanation": "Correct: Pratibha Patil was India's 1st woman President (2007-2012), while Droupadi Murmu, elected in 2022, is both the 1st Tribal President and the 2nd woman President.", "globalNum": 545}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who is known as the 'Missile Man' and 'People's President,' and who was the 'ex-Finance Minister' who later became President?", "options": ["Dr. A.P.J. Abdul Kalam (Missile Man/People's President, 2002-2007); Pranab Mukherjee (ex-Finance Minister, 2012-2017)", "Pranab Mukherjee (Missile Man); A.P.J. Abdul Kalam (ex-Finance Minister)", "R. Venkataraman (Missile Man); A.P.J. Abdul Kalam (ex-Finance Minister)", "Dr. Shankar Dayal Sharma (Missile Man); Pranab Mukherjee (ex-Finance Minister)"], "answer": 0, "explanation": "Correct: Dr. A.P.J. Abdul Kalam, a renowned scientist, earned the epithets 'Missile Man' and 'People's President' (2002-2007). Pranab Mukherjee, a former Finance Minister, served as President from 2012-2017.", "globalNum": 546}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who is the current (as of the notes) President of India, and since when has she held office?", "options": ["Droupadi Murmu, since 2022", "Ram Nath Kovind, since 2017", "Pratibha Patil, since 2007", "Pranab Mukherjee, since 2012"], "answer": 0, "explanation": "Correct: Droupadi Murmu has served as President since 2022, per the notes' list, and is noted as India's 1st Tribal and 2nd woman President.", "globalNum": 547}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Who was the 1st Vice-President of India, and who was the 1st Muslim Vice-President?", "options": ["Dr. Sarvepalli Radhakrishnan (1st VP, 1952-1962); Dr. Zakir Husain (1st Muslim VP, 1962-1967)", "Dr. Zakir Husain (1st VP); Dr. Radhakrishnan (1st Muslim VP)", "V.V. Giri (1st VP); Gopal Swarup Pathak (1st Muslim VP)", "B.D. Jatti (1st VP); Mohammad Hidayatullah (1st Muslim VP)"], "answer": 0, "explanation": "Correct: Dr. Sarvepalli Radhakrishnan was India's 1st Vice-President (1952-1962), and Dr. Zakir Husain was the 1st Muslim Vice-President (1962-1967) — both later went on to become President as well.", "globalNum": 548}, {"tab": "t22", "tabTitle": "22. President & Vice-President", "q": "Which Vice-President is noted as having died while in office, and who are the two most recent Vice-Presidents per the notes' list?", "options": ["Krishan Kant died in office (1997-2002); Jagdeep Dhankhar (2022-2025) and C.P. Radha Krishnan (2025-present) are the two most recent", "Bhairon Singh Shekhawat died in office; M. Venkaiah Naidu and Jagdeep Dhankhar are the most recent", "B.D. Jatti died in office; C.P. Radha Krishnan is the only recent VP listed", "Mohammad Hidayatullah died in office; Krishan Kant is the most recent"], "answer": 0, "explanation": "Correct: Krishan Kant died while serving as VP (1997-2002). The two most recent VPs per the notes are Jagdeep Dhankhar (2022-2025) and the current VP, C.P. Radha Krishnan (2025-present).", "globalNum": 549}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 74(1), who heads the Council of Ministers, and what is its function relative to the President?", "options": ["The Prime Minister heads it; it aids and advises the President, who acts in accordance with its advice", "The President heads it; it aids and advises the Prime Minister", "The Vice President heads it; it advises Parliament", "The Chief Justice heads it; it advises the judiciary"], "answer": 0, "explanation": "Correct: Article 74(1) establishes the Council of Ministers, headed by the PM, to aid and advise the President — who must act according to this advice, reflecting India's parliamentary system.", "globalNum": 550}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Which Amendment made the Council of Ministers' advice binding on the President, and which Amendment allowed the President to request reconsideration?", "options": ["42nd Amendment made the advice binding; 44th Amendment allowed reconsideration (but the President must ultimately follow the reconsidered advice)", "44th Amendment made it binding; 42nd Amendment allowed reconsideration", "91st Amendment made it binding; 42nd Amendment allowed reconsideration", "Both provisions came from the 91st Amendment"], "answer": 0, "explanation": "Correct: The 42nd CA made the President bound by ministerial advice, while the 44th CA introduced the President's power to request reconsideration once — but even after reconsideration, the President must act per the advice given.", "globalNum": 551}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 74(2), can courts inquire into what advice ministers gave to the President?", "options": ["No — courts are barred from inquiring into whether, and what, advice was tendered to the President", "Yes, courts can freely examine such advice in any case", "Only the Supreme Court, not High Courts, can inquire into this", "Only during a National Emergency can courts examine this advice"], "answer": 0, "explanation": "Correct: Article 74(2) explicitly bars any court from inquiring into the nature of ministerial advice given to the President — protecting the confidentiality of executive deliberations.", "globalNum": 552}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 75(1), how are the Prime Minister and other Ministers appointed?", "options": ["The PM is appointed by the President; other Ministers are appointed by the President on the PM's advice", "Both PM and Ministers are elected directly by Parliament", "The PM appoints all Ministers without any presidential role", "The Ministers are appointed first, and then they elect the PM among themselves"], "answer": 0, "explanation": "Correct: The President appoints the PM directly, and appoints other Ministers only on the advice of the PM — reflecting the PM's central role in Cabinet formation.", "globalNum": 553}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Which Amendment added Article 75(1)(A) capping the total number of Ministers, and what is this cap?", "options": ["91st Amendment, 2003 — cap of 15% of the total strength of the Lok Sabha", "42nd Amendment, 1976 — cap of 10%", "44th Amendment, 1978 — cap of 20%", "97th Amendment, 2011 — cap of 25%"], "answer": 0, "explanation": "Correct: The 91st Amendment (2003) added the 15% cap on total ministers (including the PM), aimed at curbing oversized councils of ministers formed for political accommodation.", "globalNum": 554}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "What does Article 75(1)(B), added by the 91st Amendment, provide regarding disqualified members?", "options": ["A member disqualified on grounds of defection cannot become a Minister", "A member disqualified for any reason can still become a Minister after 6 months", "Only Lok Sabha members can be disqualified from becoming Ministers", "Disqualification rules apply only to the Prime Minister, not other Ministers"], "answer": 0, "explanation": "Correct: Article 75(1)(B) bars anyone disqualified due to defection (under the 10th Schedule anti-defection law) from becoming a Minister — closing a potential loophole for defectors.", "globalNum": 555}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 75(2), (3), and (4), what are three key conditions on Ministers' tenure and responsibility?", "options": ["75(2): hold office at the President's pleasure; 75(3): collectively responsible to the Lok Sabha; 75(4): must take oaths of office and secrecy before the President", "75(2): collectively responsible to Rajya Sabha; 75(3): hold office for 5 years; 75(4): no oath required", "75(2): individually responsible to the President; 75(3): fixed 5-year term; 75(4): oath before the CJI", "75(2): hold office at Parliament's pleasure; 75(3): individually responsible; 75(4): oath before the PM"], "answer": 0, "explanation": "Correct: Ministers hold office at the President's pleasure (75(2)), are collectively responsible to the Lok Sabha (75(3)) — a cornerstone of parliamentary accountability — and must take oaths of office/secrecy administered by the President (75(4)).", "globalNum": 556}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 75(5), what happens if a Minister is not a member of Parliament for six consecutive months?", "options": ["They cease to be a Minister at the end of that six-month period", "They can continue as Minister indefinitely without ever joining Parliament", "They must resign within 30 days instead of six months", "They automatically become a member of the Rajya Sabha"], "answer": 0, "explanation": "Correct: Article 75(5) requires a non-MP Minister to secure Parliament membership within 6 months, or else they cease to hold ministerial office — ensuring accountability to the legislature.", "globalNum": 557}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 75(6), how are Ministers' salaries and allowances determined?", "options": ["Determined by Parliament; until then, as specified in the 2nd Schedule", "Determined solely by the President at their discretion", "Fixed permanently by the Constitution with no scope for change", "Determined by the Election Commission"], "answer": 0, "explanation": "Correct: Parliament determines Ministers' salaries/allowances, with the 2nd Schedule providing the default figures until Parliament acts — mirroring how salaries of other high officials (like the President) are also handled via the 2nd Schedule.", "globalNum": 558}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "What are the three types of Ministers described in the notes (though not specified in the Constitution itself), and how do Cabinet Ministers differ from Ministers of State?", "options": ["Cabinet Ministers, Ministers of State, and Deputy Ministers; Cabinet Ministers handle major portfolios and attend Cabinet meetings, while Ministers of State (usually) do not attend Cabinet meetings", "Only two types exist: Cabinet Ministers and Deputy Ministers", "Senior Ministers, Junior Ministers, and Honorary Ministers", "Cabinet Ministers, Council Ministers, and Executive Ministers"], "answer": 0, "explanation": "Correct: The three types are Cabinet Ministers (major portfolios, attend Cabinet meetings), Ministers of State (handle smaller ministries or assist Cabinet Ministers, don't attend Cabinet meetings), and Deputy Ministers (assist the above two) — none of which are explicitly defined in the Constitution.", "globalNum": 559}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 76(1), who does the President appoint as Attorney General, and what qualification is required?", "options": ["A person qualified to be a judge of the Supreme Court", "Any sitting Member of Parliament", "A retired Chief Justice specifically", "Any practicing lawyer with 5 years' experience"], "answer": 0, "explanation": "Correct: The Attorney General must be qualified to be appointed a Supreme Court judge — a high bar reflecting the AG's status as India's highest law officer.", "globalNum": 560}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 76(2) and (3), what rights and duties does the Attorney General have?", "options": ["Right to audience in all courts of India; duty to advise the Government of India on legal matters", "Right to vote in Parliament; duty to draft all government bills", "Right to preside over Supreme Court benches; duty to appoint judges", "Right to veto legislation; duty to represent Parliament in courts"], "answer": 0, "explanation": "Correct: The AG has the right of audience in all Indian courts and the duty to advise the Government on legal matters — but has no voting rights in Parliament, no power to appoint judges, and no veto power.", "globalNum": 561}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Under Article 76(4), on what basis does the Attorney General hold office, and who determines their remuneration?", "options": ["Holds office at the President's pleasure; remuneration determined by the President", "Holds office for a fixed 5-year term; remuneration fixed by Parliament", "Holds office at the Prime Minister's pleasure; remuneration fixed by the Cabinet", "Holds office for life; remuneration fixed by the Supreme Court"], "answer": 0, "explanation": "Correct: The Attorney General serves at the President's pleasure and receives remuneration as determined by the President — similar in structure to how Ministers hold office, though the AG is not a Minister.", "globalNum": ent.", "globalNum": 573}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Of which bodies is the Prime Minister the Chairman, per the notes' summary of PM powers?", "options": ["NITI Aayog, Interstate Council, and National Disaster Management Authority", "Election Commission, UPSC, and Finance Commission", "Supreme Court Collegium and National Human Rights Commission", "Central Vigilance Commission and Lokpal"], "answer": 0, "explanation": "Correct: The PM chairs NITI Aayog, the Interstate Council, and the National Disaster Management Authority. The Election Commission, UPSC, Finance Commission, and judicial bodies are independent of the PM's chairmanship.", "globalNum": 574}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Which of these is a power/function of the Prime Minister, per the notes' summary?", "options": ["Advises the President on summoning/proroguing Parliament, and recommends Lok Sabha dissolution at any time", "Directly summons Parliament without presidential involvement", "Cannot recommend dismissal of any Minister under any circumstances", "Has no role in allocating ministerial portfolios"], "answer": 0, "explanation": "Correct: The PM advises on summoning/proroguing sessions and can recommend Lok Sabha's dissolution at any time — and, contrary to the wrong options, the PM CAN ask a Minister to resign or recommend their dismissal, and DOES allocate/reshuffle portfolios.", "globalNum": 575}, {"tab": "t23", "tabTitle": "23. PM & Council of Ministers", "q": "Which three individuals became Prime Minister while being Rajya Sabha (not Lok Sabha) members, per the notes?", "options": ["Indira Gandhi, Manmohan Singh, and H.D. Deve Gowda", "Jawaharlal Nehru, Lal Bahadur Shastri, and Morarji Desai", "Atal Bihari Vajpayee, Charan Singh, and Chandra Shekhar", "Rajiv Gandhi, V.P. Singh, and Narasimha Rao"], "answer": 0, "explanation": "Correct: Indira Gandhi, Manmohan Singh, and H.D. Deve Gowda all served as PM while being Raj tively constituted?", "options": ["Both first sat on 13 May 1952; Lok Sabha was constituted 17 April 1952, Rajya Sabha on 3 April 1952", "Both first sat on 26 January 1950", "Lok Sabha first sat 3 April 1952; Rajya Sabha first sat 17 April 1952", "Both were constituted on 13 May 1952, with no separate sitting date"], "answer": 0, "explanation": "Correct: Both Houses first sat on 13 May 1952, though the Rajya Sabha was formally constituted slightly earlier (3 April 1952) than the Lok Sabha (17 April 1952).", "globalNum": 586}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "By what alternate names is the Rajya Sabha known, besides 'Council of States'?", "options": ["'Permanent House' and 'House of Elders'", "'House of the People' and 'Lower House'", "'Upper Assembly' and 'Senate'", "'Provisional Parliament' and 'Legislative Council'"], "answer": 0, "explanation": "Correct: Rajya Sabha is also called the 'Permanent House' (since it's never dissolved) and 'House of Elders.' 'House of the People' is instead the Lok Sabha's alternate name.", "globalNum": 587}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "In the theme of the New Parliament Building, which bird/flower represents the Lok Sabha, and which represents the Rajya Sabha?", "options": ["Lok Sabha = Peacock; Rajya Sabha = Lotus", "Lok Sabha = Lotus; Rajya Sabha = Peacock", "Both represented by the Ashoka Chakra", "Lok Sabha = Tiger; Rajya Sabha = Elephant"], "answer": 0, "explanation": "Correct: The New Parliament Building's theme uses the Peacock (India's national bird) for the Lok Sabha chamber and the Lotus (India's national flower) for the Rajya Sabha chamber.", "globalNum": 588}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Why does the Lok Sabha use a green carpet, and why does the Rajya Sabha use a red carpet?", "options": ["Green symbolises India's agricultural land and grassroots-elected members; Red symbolises royalty and the sacrifice/blood shed by freedom fighters", "Green symbolises royalty; Red symbolises agriculture", "Both colours were chosen arbitrarily with no symbolic meaning", "Green represents the environment ministry; Red represents the home ministry"], "answer": 0, "explanation": "Correct: The Lok Sabha's green carpet reflects India's agricultural roots and its grassroots-elected members, while the Rajya Sabha's red carpet symbolises royalty and honours the sacrifice of freedom fighters.", "globalNum": 589}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Under Article 80, what is the maximum composition of the Rajya Sabha, and how is it split between elected and nominated members?", "options": ["Maximum 250: 238 elected + 12 nominated by the President", "Maximum 245: 233 elected + 12 nominated", "Maximum 550: 530 elected + 20 nominated", "Maximum 250: 250 elected, with no nominated members"], "answer": 0, "explanation": "Correct: The constitutional maximum is 250 (238 elected + 12 nominated). The present actual strength (245, with 233 elected) is a separate, current figure reflecting some vacant seats.", "globalNum": 590}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "From which fields are the 12 nominated Rajya Sabha members chosen, remembered by the mnemonic 'LiSAS'?", "options": ["Literature, Science, Arts, and Social Service", "Law, Sports, Agriculture, and Statistics", "Linguistics, Sociology, Astronomy, and Sports", "Leadership, Science, Administration, and Sports"], "answer": 0, "explanation": "Correct: The 12 nominated RS members come from Literature, Science, Arts, and Social Service (LiSAS) — chosen by the President for their special knowledge/experience in these fields.", "globalNum": 591}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "What is the present strength of the Rajya Sabha, and how many seats remain vacant for territories like PoK and Aksai Chin?", "options": ["Present strength 245 (233 elected + 12 nominated); 5 seats vacant", "Present strength 250 ( d how is it split between states and UTs?", "options": ["Maximum 550: 530 from States + 20 from UTs", "Maximum 545: 543 from States + 2 nominated", "Maximum 250: 238 from States + 12 from UTs", "Maximum 552: 530 from States + 22 from UTs"], "answer": 0, "explanation": "Correct: The constitutional maximum for the Lok Sabha is 550 (530 from States + 20 from UTs). The present actual strength is 543, a separate figure reflecting current allocation.", "globalNum": 595}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "What was the earlier provision for 2 Anglo-Indian members in the Lok Sabha, and what happened to it?", "options": ["They were nominated by the President; this provision was abolished by the 104th Constitutional Amendment, 2019", "They were elected directly by the public; abolished by the 91st Amendment, 2003", "They still exist today, nominated by the Prime Minister", "They were converted into Rajya Sabha nominated seats"], "answer": 0, "explanation": "Correct: The President previously nominated 2 Anglo-Indian members to the Lok Sabha, but this provision was abolished by the 104th CA, 2019 — ending a special representation arrangement that had existed since the Constitution's adoption.", "globalNum": 596}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "How are Lok Sabha members elected, and what principle is maintained regarding inter-state and intra-state representation?", "options": ["Directly elected by citizens, with parity maintained among inter- and intra-state constituencies", "Indirectly elected by state legislatures, with unequal weighting like the Rajya Sabha", "Nominated by the President based on merit", "Elected by Proportional Representation with STV, like the Rajya Sabha"], "answer": 0, "explanation": "Correct: Lok Sabha members are directly elected by citizens (unlike RS's indirect election), with parity maintained so constituencies are roughly equal in population both across and within states.", "globalNum": 597}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Under Article 82, what body is set up after every Census, and what does it do?", "options": ["The Delimitation Commission, which divides constituencies based on population, appointed by the President in consultation with the ECI", "The Finance Commission, which allocates funds among states", "The Election Commission, which is newly created after each census", "The Law Commission, which reviews electoral laws"], "answer": 0, "explanation": "Correct: The Delimitation Commission is set up after each decennial Census to redraw constituency boundaries based on updated population data, with the President appointing it in consultation with the Election Commission of India (ECI).", "globalNum": 598}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "In how many years has the Delimitation Commission been set up, and in which years?", "options": ["4 times: 1952, 1962, 1972, and 2002", "3 times: 1952, 1972, and 2001", "5 times: 1952, 1962, 1972, 1991, and 2002", "2 times: 1972 and 2002"], "answer": 0, "explanation": "Correct: The Delimitation Commission has been constituted 4 times — in 1952, 1962, 1972, and 2002 — reflecting periodic (though not always exactly decennial) redrawing of constituencies.", "globalNum": 599}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Which Amendment froze Lok Sabha seat numbers based on the 1971 Census till 2000, and which Amendment extended this freeze further, until 2026?", "options": ["42nd CA (1976) froze seats till 2000; 84th CA (2001) extended the freeze till 2026", "84th CA froze seats till 2000; 42nd CA extended till 2026", "87th CA froze seats till 2000; 42nd CA extended till 2026", "44th CA froze seats till 2000; 87th CA extended till 2026"], "answer": 0, "explanation": "Correct: The 42nd CA (1976) froze seat numbers based on the 1971 Census till 2000, and the 84th CA (2001) extended this freeze further, until 2026 — meant to avoid penalising states with better population control by reducing their seat share.", "globalNum": 600}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "What did the 87th Constitutional Amendment (2003) do regarding delimitation?", "options": ["Made minor constituency adjustments based on the 2001 Census, without changing total seat numbers", "Increased the total number of Lok Sabha seats to 600", "Ended the seat-freeze policy entirely", "Abolished the Delimitation Commission"], "answer": 0, "explanation": "Correct: The 87th CA (2003) allowed minor adjustments to constituency boundaries based on the 2001 Census data, while keeping the overall seat-freeze (from the 42nd/84th Amendments) in place.", "globalNum": 601}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Under Article 83, is the Rajya Sabha subject to dissolution, and how does its membership turn over?", "options": ["No — it is a permanent body, not subject to dissolution; 1/3rd of its members retire every 2 years, with each member serving a 6-year term", "Yes — it is dissolved every 5 years, like the Lok Sabha", "No, but all members retire simultaneously every 6 years", "Yes, but only during a National Emergency"], "answer": 0, "explanation": "Correct: The Rajya Sabha is a permanent body, never fully dissolved. Instead, 1/3rd of its members retire every 2 years on a rotating basis, with each member's individual term lasting 6 years.", "globalNum": 602}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "What is the Lok Sabha's normal tenure, and how did the 42nd and 44th Amendments affect this tenure?", "options": ["5 years normally; the 42nd CA (1976) increased it to 6 years, and the 44th CA (1978) restored it back to 5 years", "6 years normally; the 42nd CA reduced it to 5 years, and the 44th CA restored it to 6 years", "5 years normally, with no amendments ever affecting this", "4 years normally; both amendments extended it to 6 years"], "answer": 0, "explanation": "Correct: The LS's normal 5-year tenure was extended to 6 years by the 42nd CA (1976, during the Emergency), then restored to 5 years by the 44th CA (1978) — a reversal of an Emergency-era change.", "globalNum": 603}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Can the Lok Sabha be dissolved before its term ends, and can its term be extended during a National Emergency?", "options": ["Yes, the President can dissolve it on the PM's advice; and yes, it can be extended by 1 year at a time during a National Emergency", "No, it can never be dissolved early under any circumstance", "It can be dissolved early, but can never be extended, even during Emergency", "It can only be extended during a Financial Emergency, not a National Emergency"], "answer": 0, "explanation": "Correct: The President can dissolve the LS early on the PM's advice, and during a National Emergency, its term can be extended by 1 year at a time (with elections required within 6 months of the Emergency ending).", "globalNum": 604}, {"tab": "t24", "tabTitle": "24. Parliament — Basics", "q": "Which Lok Sabha holds the record for the shortest tenure in history, and how long did it last?", "options": ["12th Lok Sabha, lasting 13 months 4 days (10 Mar 1998 – 26 Apr 1999)", "1st Lok Sabha, lasting 4 years", "10th Lok Sabha, lasting 18 months", "13th Lok Sabha, lasting 6 months"], "answer": 0, "explanation": "Correct: The 12th Lok Sabha (1998-1999) had the shortest tenure in history, lasting just 13 months and 4 days, reflecting the political instability of that era's coalition governments.", "globalNum": 605}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 84, what is the minimum age requirement for Rajya Sabha and Lok Sabha membership respectively?", "options": ["30 years for RS; 25 years for LS", "25 years for RS; 30 years for LS", "35 years for RS; 25 years for LS", "21 years for both RS and LS"], "answer": 0, "explanation": "Correct: RS membership requires a minimum age of 30, while LS membership requires 25 — reflecting the RS's role as a more senior, deliberative 'Upper House.'", "globalNum": 606}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Until 2003, what special requirement applied to a candidate contesting a Rajya Sabha election from a particular state?", "options": ["The candidate had to be a registered elector (voter) in that specific state", "The candidate had to have lived in that state for at least 10 years", "The candidate had to be born in that state", "The candidate had to speak the state's official language fluently"], "answer": 0, "explanation": "Correct: Until 2003, RS candidates had to be electors in the state they contested from, ensuring a state-specific residential connection. This requirement was dispensed with in 2003, allowing candidates to contest from any state.", "globalNum": 607}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "Under Article 85, who summons Parliament's sessions, and on whose advice?", "options": ["The President, on the aid and advice of the Council of Ministers", "The Speaker of Lok Sabha, independently", "The Prime Minister, directly without presidential involvement", "The Chief Justice, in consultation with Parliament"], "answer": 0, "explanation": "Correct: The President formally summons sessions, but acts on the aid and advice of the Council of Ministers — consistent with the President's largely ceremonial role in practice.", "globalNum": 608}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What are the three parliamentary sessions typically held in India, and their approximate timing?", "options": ["Budget Session (Feb-Apr/May), Monsoon Session (Jul-Aug/Sep), Winter Session (Nov/Dec)", "Spring Session, Summer Session, Autumn Session", "Budget Session, Independence Session, Republic Session", "Only two sessions: Budget and Winter"], "answer": 0, "explanation": "Correct: India holds three sessions annually — Budget (Feb-Apr/May), Monsoon (Jul-Aug/Sep), and Winter (Nov/Dec) — though the exact number of sessions isn't fixed in the Constitution itself.", "globalNum": 609}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is the maximum gap permitted between two parliamentary sessions?", "options": ["6 months", "3 months", "1 year", "There is no maximum gap specified"], "answer": 0, "explanation": "Correct: The gap between two sessions cannot exceed 6 months, ensuring Parliament meets at least twice a year — a constitutional requirement to maintain regular legislative oversight.", "globalNum": 610}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is the difference between 'Prorogation' and 'Dissolution'?", "options": ["Prorogation ends a session (by the President); Dissolution formally terminates the current Lok Sabha (by the President, on CoM's advice)", "Prorogation terminates the Lok Sabha; Dissolution ends a session", "Both terms mean exactly the same thing", "Prorogation applies only to Rajya Sabha; Dissolution applies only to Lok Sabha"], "answer": 0, "explanation": "Correct: Prorogation ends a session while keeping the House (and its members) intact, while Dissolution ends the Lok Sabha itself, requiring fresh elections — a much more significant event, applicable only to the LS (since RS is never dissolved).", "globalNum": 611}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is an 'Adjournment,' and who terminates it?", "options": ["A temporary break within a session, terminated by the Presiding Officer", "A permanent end to a session, terminated by the President", "The dissolution of the Lok Sabha, terminated by the CoM", "A break lasting exactly 6 months"], "answer": 0, "explanation": "Correct: An Adjournment is a temporary suspension within an ongoing session, ended by the Presiding Officer (Speaker/Chairman) — distinct from prorogation, which ends the entire session (done by the President).", "globalNum": 612}, {"tab": "t25", "tabTitle": "25. Sessions & Motions", "q": "What is '
