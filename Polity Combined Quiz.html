r State Legislature"], "answer": 0, "explanation": "Correct: Chapter II covers the State Executive (Governor, CM, CoM, Advocate General), and Chapter III covers the State Legislature. Chapter I is just the general definition (Article 152), Chapter IV covers the Governor's legislative power, and Chapters V-VI cover High Courts and Subordinate Courts.", "globalNum": 756}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Which chapters of Part VI cover High Courts in States, and Subordinate Courts?", "options": ["Chapter V (Art 214-231) for High Courts; Chapter VI (Art 233-237) for Subordinate Courts", "Chapter IV for High Courts; Chapter V for Subordinate Courts", "Chapter VI for High Courts; Chapter V for Subordinate Courts", "Chapter III for both"], "answer": 0, "explanation": "Correct: Chapter V (Articles 214-231) covers High Courts, and Chapter VI (Articles 233-237) covers Subordinate Courts — distinct from Chapter IV, which is just the Governor's legislative (ordinance) power under Article 213.", "globalNum": 757}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Which Union-level offices/institutions are replaced by which State-level equivalents, per the notes' mapping table?", "options": ["President→Governor, Parliament→State Legislature, PM→CM, Attorney General→Advocate General, Consolidated Fund of India→Consolidated Fund of State", "President→CM, Parliament→State Legislature, PM→Governor", "Attorney General→Governor, PM→Advocate General", "Consolidated Fund of India→Contingency Fund of State"], "answer": 0, "explanation": "Correct: The notes provide a clean Union-to-State replacement mapping — President↔Governor, Parliament↔State Legislature, PM↔CM, Attorney General↔Advocate General, and Consolidated Fund of India↔Consolidated Fund of State.", "globalNum": 758}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 153, must every state have its own separate Governor, and which Amendment changed this?", "options": ["Originally yes, but the 7th Constitutional Amendment allowed the same person to be Governor of 2 or more states", "No, states have never required a separate Governor", "The 42nd Amendment allowed shared Governors", "The 44th Amendment mandated separate Governors for every state, reversing an earlier shared arrangement"], "answer": 0, "explanation": "Correct: The 7th CA specifically allowed one person to serve as Governor for multiple states simultaneously, a practical flexibility not originally intended under Article 153's basic text.", "globalNum": 759}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 155, who appoints the Governor, and how?", "options": ["The President, by warrant under hand and seal", "The Prime Minister, by executive order", "The State Legislature, through an election", "The Chief Justice of the concerned High Court"], "answer": 0, "explanation": "Correct: The Governor is appointed by the President via a formal warrant under hand and seal — not elected by the state legislature nor appointed by the PM or judiciary directly.", "globalNum": 760}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 156, what is the Governor's term of office, and on what basis do they hold this office?", "options": ["5 years from assuming office, holding office during the President's pleasure", "6 years, holding office during the Prime Minister's pleasure", "A fixed, non-removable 5-year term with no pleasure clause", "Lifetime tenure, similar to a Supreme Court judge"], "answer": 0, "explanation": "Correct: The Governor's term is 5 years, but crucially, they hold office at the President's pleasure — meaning they can be removed before the term ends, at the President's discretion, with no fixed protection like judges enjoy.", "globalNum": 761}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 157, what are the qualifications for becoming Governor?", "options": ["Citizen of India, minimum age 35 years", "Citizen of India, minimum age 30 years", "Citizen of India, minimum age 25 years, and must be an MLA", "Any age, as long as they're an Indian citizen"], "answer": 0, "explanation": "Correct: Article 157 requires only Indian citizenship and a minimum age of 35 — notably, unlike some other high offices, there's no specific 'qualified for Legislative Assembly membership' style requirement mentioned for the Governor.", "globalNum": 762}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 158, which of these is a condition of the Governor's office?", "options": ["Cannot be a member of Parliament or State Legislature; must vacate such seat before assuming office", "Can simultaneously serve as an MP or MLA while being Governor", "Can hold any office of profit while serving as Governor", "Emoluments can be freely reduced by the state legislature during tenure"], "answer": 0, "explanation": "Correct: A Governor must vacate any Parliament/State Legislature seat before taking office, cannot hold an office of profit, gets a rent-free official residence, and has emoluments protected from reduction during their tenure — the other options describe the opposite of the actual rules.", "globalNum": 763}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 159, who administers the Governor's oath of office?", "options": ["The Chief Justice of the concerned High Court (or the senior-most judge if unavailable)", "The Chief Justice of India", "The President personally", "The outgoing Governor"], "answer": 0, "explanation": "Correct: The Governor's oath is administered by the state's High Court Chief Justice (or the senior-most HC judge if the CJ is unavailable) — a state-level parallel to how the CJI administers the President's oath.", "globalNum": 764}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 160, who can appoint a person to discharge the Governor's functions during a contingency (e.g., vacancy)?", "options": ["The President", "The Chief Minister", "The Chief Justice of the High Court", "The State Legislature, by resolution"], "answer": 0, "explanation": "Correct: The President has this power under Article 160 — typically appointing another state's Governor or the Chief Justice of the concerned High Court to temporarily discharge these duties.", "globalNum": 765}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 161, what pardoning powers does the Governor have, and what two things can the Governor NOT do (unlike the President)?", "options": ["Can grant pardons, reprieves, respites, remissions, or commute sentences; but CANNOT pardon a death sentence or act against Martial Court (court-martial) sentences", "Can pardon any sentence including death sentences and court-martial verdicts", "Has no pardoning power whatsoever", "Can pardon death sentences but not ordinary criminal sentences"], "answer": 0, "explanation": "Correct: While the Governor shares most pardoning powers with the President, two specific exceptions apply — the Governor cannot pardon a death sentence, and cannot act against Martial Court (military court) sentences, both of which remain exclusively presidential powers.", "globalNum": 766}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 163, is the Council of Ministers' advice to the Governor always binding, and is the Governor's decision on whether a matter falls within their 'discretion' subject to challenge?", "options": ["Not always binding — in certain discretionary situations the advice isn't binding; and the Governor's own decision on what counts as 'discretion' is FINAL and cannot be questioned", "The advice is always fully binding, with no discretionary exceptions", "The Governor's discretion decision can always be challenged in any court", "Neither the CoM's advice nor the Governor's discretion decisions have any legal weight"], "answer": 0, "explanation": "Correct: Unlike the President (bound absolutely per Article 74), the Governor retains discretionary power in certain situations where ministerial advice isn't binding, and the Governor's own determination of what falls within 'discretion' is itself final and unchallengeable — a notable and often-tested asymmetry.", "globalNum": 767}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 164, who appoints the Chief Minister and other State Ministers, and what happens in a hung assembly (no clear majority)?", "options": ["Governor appoints the CM directly, and other Ministers on the CM's advice; in a hung assembly, the Governor exercises discretion in appointing the CM", "The State Legislature elects the CM by vote; other Ministers are appointed by the President", "The CM is appointed by the outgoing CM; there's no special hung-assembly procedure", "The Advocate General appoints the CM in a hung assembly"], "answer": 0, "explanation": "Correct: The Governor appoints the CM (usually the majority party/coalition leader) and other Ministers on the CM's advice, but in a hung assembly scenario, the Governor must use discretion to decide who commands the best chance of forming a stable government.", "globalNum": 768}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 164, within how many consecutive months must a Minister get elected as MLA/MLC, or else cease to be a Minister?", "options": ["6 consecutive months", "3 consecutive months", "12 consecutive months", "1 month"], "answer": 0, "explanation": "Correct: A non-legislator Minister must secure MLA/MLC membership within 6 consecutive months — mirroring the identical rule for Union Ministers under Article 75(5).", "globalNum": 769}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 165, who appoints the Advocate General, what qualification is required, and on whose pleasure does the AG serve?", "options": ["Appointed by the Governor; must be qualified as a High Court judge; holds office at the Governor's pleasure", "Appointed by the CM; must be a sitting MLA; holds office for a fixed 5-year term", "Appointed by the President; must be qualified as a Supreme Court judge", "Appointed by the State Legislature; holds office at Parliament's pleasure"], "answer": 0, "explanation": "Correct: The Advocate General is appointed by the Governor, must be HC-judge-qualified, and serves at the Governor's pleasure — mirroring the Attorney General's structure at the Union level (President's pleasure, SC-judge qualification).", "globalNum": 770}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 166 and 167, in whose name are State executive actions expressed, and what is the CM's communication duty?", "options": ["Expressed in the Governor's name; CM must communicate all Council of Ministers' decisions to the Governor", "Expressed in the CM's name; the Governor communicates decisions to the CM", "Expressed in the President's name; no communication duty exists", "Expressed in the State Legislature's name; the Speaker communicates decisions"], "answer": 0, "explanation": "Correct: Article 166 requires State executive actions to be in the Governor's name (paralleling Article 77's rule for the President), and Article 167 obligates the CM to keep the Governor informed of Council decisions — mirroring Article 78's PM-President communication duty.", "globalNum": 771}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 168, do all Indian states have a Legislative Assembly, and how many states additionally have a Legislative Council (bicameral legislature)?", "options": ["All states have a Legislative Assembly; 6 states additionally have a Legislative Council", "Only some states have a Legislative Assembly; all states have a Legislative Council", "No states have a Legislative Council; only Union Territories can have one", "10 states have a Legislative Council"], "answer": 0, "explanation": "Correct: Every state has a (unicameral) Legislative Assembly, while just 6 states additionally have a Legislative Council, making their legislature bicameral.", "globalNum": 772}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Using the 'KABUTM' mnemonic, which 6 states have a Legislative Council?", "options": ["Karnataka, Andhra Pradesh, Bihar, Uttar Pradesh, Telangana, and Maharashtra", "Kerala, Assam, Bihar, Uttarakhand, Tamil Nadu, and Manipur", "Karnataka, Assam, Bengal, UP, Tripura, and MP", "Kashmir, AP, Bihar, UP, Telangana, and Mizoram"], "answer": 0, "explanation": "Correct: 'KABUTM' stands for Karnataka, Andhra Pradesh, Bihar, Uttar Pradesh, Telangana, and Maharashtra — the 6 states with a Legislative Council.", "globalNum": 773}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 169, how can a Legislative Council be created or abolished, and is this treated as a Constitutional Amendment?", "options": ["Parliament can create/abolish it by Simple Majority, based on a state's Special Majority resolution; this is NOT treated as an Article 368 amendment", "Parliament needs a Special Majority, based on a state's Simple Majority resolution; treated as a full Article 368 amendment", "Only the concerned State Legislature can create/abolish its own LC, with no Parliament involvement", "Requires a national referendum, treated as a Constitutional Amendment"], "answer": 0, "explanation": "Correct: Parliament passes the actual law by Simple Majority, but only after the concerned state's Assembly requests it via a Special Majority resolution — and crucially, this entire process is explicitly NOT considered an Article 368 amendment.", "globalNum": 774}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 170(1), what is the size range for a State Legislative Assembly, and how are members elected?", "options": ["Not less than 60, not more than 500 members, elected by direct election", "Not less than 40, not more than 250 members, elected indirectly", "Fixed at exactly 300 members for every state, directly elected", "Not less than 100, not more than 545 members"], "answer": 0, "explanation": "Correct: Assembly size ranges from 60 to 500 members, via direct election — paralleling the Lok Sabha's direct-election method, though with a different size range.", "globalNum": 775}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "What are the special minimum Assembly size exceptions for Goa, Arunachal Pradesh, Sikkim, Mizoram, and Nagaland, given the general 60-member minimum?", "options": ["Goa/Arunachal Pradesh/Sikkim: minimum 30; Mizoram: minimum 40; Nagaland: minimum 46", "All five states follow the standard 60-member minimum with no exceptions", "Goa/Arunachal Pradesh/Sikkim: minimum 40; Mizoram/Nagaland: minimum 60", "Nagaland alone has a special minimum of 30; the others follow the standard rule"], "answer": 0, "explanation": "Correct: These smaller states have special lower minimums below the general 60-seat floor — Goa/Arunachal Pradesh/Sikkim at 30, Mizoram at 40, and Nagaland at 46 — reflecting their much smaller populations.", "globalNum": 776}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 171(1), what is the maximum size and minimum size of a Legislative Council, and how are members elected overall?", "options": ["Maximum 1/3rd of the Legislative Assembly's strength, minimum 40 members, indirectly elected", "Maximum 1/2 of the Assembly's strength, minimum 60 members, directly elected", "Fixed exactly at 100 members regardless of Assembly size", "Maximum 250 members, minimum 12 members"], "answer": 0, "explanation": "Correct: The LC's size is capped at 1/3rd of the Assembly's strength, with an absolute floor of 40 members, and its composition is Indirectly Elected — distinct from the Assembly's direct election.", "globalNum": 777}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 172(1), what is the term of a State Legislative Assembly?", "options": ["5 years from its first meeting, unless dissolved earlier", "6 years from its first meeting", "4 years, fixed with no early dissolution possible", "Permanent, like the Legislative Council"], "answer": 0, "explanation": "Correct: The Assembly's normal term is 5 years from its first meeting (unless dissolved sooner) — paralleling the Lok Sabha's 5-year term at the Union level.", "globalNum": 778}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 172(2), is the Legislative Council a permanent body, and how does membership turnover?", "options": ["Yes, it is a permanent body; 1/3rd of members retire every 2 years, with each member serving a 6-year term", "No, it dissolves every 5 years like the Assembly", "Yes, but all members retire simultaneously every 6 years", "No, it is dissolved whenever the Assembly is dissolved"], "answer": 0, "explanation": "Correct: Like the Rajya Sabha, the Legislative Council is permanent, with 1/3rd of members retiring every 2 years and each serving an individual 6-year term — a rotating membership structure.", "globalNum": 779}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 173, what are the qualifications for State Legislature membership?", "options": ["Citizen of India; minimum 25 years for Assembly, 30 years for Council; other qualifications as Parliament prescribes", "Citizen of India; minimum 30 years for Assembly, 25 years for Council", "Citizen of India; minimum 21 years for both Assembly and Council", "No age requirement, only citizenship required"], "answer": 0, "explanation": "Correct: Article 173 sets 25 years as the minimum for the (lower) Assembly and 30 years for the (upper) Council — mirroring the Lok Sabha/Rajya Sabha age split under Article 84, with Parliament empowered to add further qualifications.", "globalNum": 780}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 174, who summons the State Legislature, what is the maximum gap allowed between sessions, and what powers does the Governor have regarding the Legislative Assembly?", "options": ["The Governor summons it; maximum 6-month gap between sessions; the Governor can prorogue or dissolve the Legislative Assembly", "The Chief Minister summons it; maximum 3-month gap; only Parliament can dissolve the Assembly", "The Speaker summons it; no maximum gap specified; the President dissolves the Assembly", "The President summons it directly, bypassing the Governor entirely"], "answer": 0, "explanation": "Correct: The Governor summons sessions (paralleling the President at Union level), with the same 6-month maximum gap rule, and holds the power to prorogue sessions or dissolve the Legislative Assembly.", "globalNum": 781}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 176, on what two occasions must the Governor deliver a special address to the State Legislature?", "options": ["First session after a general election, and first session of each year", "Every Budget session only", "Only during a State Emergency (President's Rule)", "Only when requested by the Chief Minister"], "answer": 0, "explanation": "Correct: This mirrors Article 87 (President's special address to Parliament) — the Governor must address the Legislature at the start of the first post-election session and the first session of each year.", "globalNum": 782}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 178-180, how is the Speaker of the Legislative Assembly removed, and who acts as Speaker when that office is vacant or the Speaker is absent?", "options": ["Removed by a resolution passed by a majority of Assembly members; the Deputy Speaker acts as Speaker in such cases", "Removed only by the Governor's direct order; the CM acts as Speaker", "Removed by a two-thirds Special Majority only; the senior-most MLA acts as Speaker", "Cannot be removed under any circumstances before term end"], "answer": 0, "explanation": "Correct: A simple majority resolution of Assembly members can remove the Speaker (Article 179), and the Deputy Speaker steps in when the Speaker's office is vacant or the Speaker is absent (Article 180).", "globalNum": 783}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 189, what is the quorum requirement for a State Legislature sitting, and does the Presiding Officer vote in the first instance?", "options": ["Quorum = 10% of total membership; the Presiding Officer doesn't vote in the first instance, only exercising a casting vote in a tie", "Quorum = 50% of total membership; the Presiding Officer votes freely at all times", "Quorum = 1/3rd of total membership; no casting vote power exists", "There is no quorum requirement for State Legislatures"], "answer": 0, "explanation": "Correct: This exactly mirrors Article 100 at the Union level — a 10% quorum, with the Presiding Officer abstaining from first-instance voting except to break ties.", "globalNum": 784}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 191, which of these is a ground for disqualification from State Legislature membership?", "options": ["Holding an office of profit, unsound mind, undischarged insolvency, or disqualification under anti-defection/Parliament-made laws", "Belonging to an opposition party", "Age above 60 years", "Living outside the state's capital city"], "answer": 0, "explanation": "Correct: These grounds mirror Article 102's Union-level disqualification list — office of profit, unsound mind, insolvency, and anti-defection provisions. Party affiliation, age (beyond minimum), and residence location are not disqualifying factors.", "globalNum": 785}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 196, in which House(s) can an ordinary Bill originate in a bicameral state, and which House has the 'upper hand'?", "options": ["Either House (LA or LC); the Legislative Assembly has the upper hand over the Legislative Council", "Only the Legislative Council; LC has the upper hand", "Only the Legislative Assembly; LC has the upper hand", "Bills can only originate jointly, with equal power for both Houses"], "answer": 0, "explanation": "Correct: Ordinary Bills can originate in either House, but the Legislative Assembly ultimately holds the upper hand, similar to how the Lok Sabha dominates over the Rajya Sabha in most legislative matters.", "globalNum": 786}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "If a Bill originates in the Legislative Council (LC) and the Legislative Assembly (LA) disagrees with it, what happens, and is there any Joint Sitting mechanism to resolve this (as exists for Parliament)?", "options": ["The Bill simply lapses; there is NO Joint Sitting provision in Part VI for resolving such State-level deadlocks", "The Bill goes to a mandatory Joint Sitting of LA and LC", "The Governor unilaterally decides the Bill's fate", "The Bill automatically passes despite the LA's disagreement"], "answer": 0, "explanation": "Correct: Unlike Parliament (which has the Article 108 Joint Sitting mechanism), Part VI provides NO such mechanism for State Legislatures — a Bill originating in the LC that the LA rejects simply lapses, a structural gap specifically highlighted in the notes.", "globalNum": 787}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "When a Bill originates in the LA and is sent to the LC, if the LC returns it with amendments back to the LA, what is the LC's maximum total delaying power over an Ordinary Bill?", "options": ["4 months maximum (3 months on first instance + 1 month on second instance)", "6 months maximum, matching the inter-session gap rule", "No time limit — the LC can delay indefinitely", "2 months maximum, in a single instance only"], "answer": 0, "explanation": "Correct: The LC can delay an Ordinary Bill for a maximum of 4 months total — 3 months when it first receives the Bill, and a further 1 month if the LA re-passes it and sends it back a second time — after which the Bill proceeds regardless of LC's stance.", "globalNum": 788}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 198, how must a Money Bill at the state level be handled by the Legislative Council, and within what time period?", "options": ["Introduced only in LA, sent to LC for recommendations (LC cannot reject it), must be returned within 14 days or deemed passed in original form", "Can be introduced in either House; LC has full rejection power with no time limit", "Introduced only in LC, sent to LA for approval within 30 days", "LC must approve within 6 months or the Bill is automatically rejected"], "answer": 0, "explanation": "Correct: This exactly mirrors the Union-level Money Bill process (Article 109) — LA-only introduction, LC limited to recommendations (no rejection power) within a 14-day window, after which inaction means automatic passage.", "globalNum": 789}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 200, what are the Governor's four options when a Bill (passed by the State Legislature) is presented for assent?", "options": ["Assent (Bill becomes Act), Withhold assent (Bill fails), Return the Bill for reconsideration (if not a Money Bill), or Reserve the Bill for the President's consideration", "Only two options: assent or reject, with no reservation power", "Assent only — the Governor has no discretion at all in this matter", "Return, reserve, and refer to the Supreme Court directly (no assent option)"], "answer": 0, "explanation": "Correct: Article 200 gives the Governor these four distinct options — importantly including the unique 'reserve for President' option (Article 201) that the President doesn't have an equivalent of at the Union level under Article 111.", "globalNum": 790}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "What did the Supreme Court hold in State of Tamil Nadu vs Governor of Tamil Nadu (April 2025), regarding a Governor's delay in acting on Bills?", "options": ["Indefinite delay by the Governor in acting on Bills is illegal, and the Court prescribed timelines, including that the President should decide on Article 201-reserved Bills within 3 months", "The Governor can delay a Bill indefinitely with no legal consequence", "Only the President's decisions on Bills can ever be subject to timelines, not the Governor's", "The Court ruled the Governor has absolute veto power over all state Bills"], "answer": 0, "explanation": "Correct: This landmark 2025 ruling declared indefinite gubernatorial delay illegal, and specifically prescribed that the President should decide on Article 201-reserved Bills within 3 months — addressing a long-standing gap in accountability for pending state legislation.", "globalNum": 791}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 213, what power does the Governor have during a legislative recess, paralleling the President's Article 123 power?", "options": ["Power to promulgate ordinances", "Power to dissolve the Legislative Council permanently", "Power to appoint the Advocate General without any qualification requirement", "Power to directly amend the state's list of subjects"], "answer": 0, "explanation": "Correct: Article 213 mirrors Article 123, giving the Governor ordinance-making power when the State Legislature isn't in session — with the same broad legal force as an ordinary Act, subject to later legislative approval.", "globalNum": 792}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "What is the key 'exam trap' difference between removing a President and removing a Governor?", "options": ["The President requires a formal impeachment (Article 61); the Governor has NO impeachment process at all, and can be removed by the President at any time, without reason or procedure, since the Governor serves at the President's pleasure", "Both require identical impeachment processes", "The Governor requires impeachment; the President can be removed at will", "Neither the President nor the Governor can ever be removed before term end"], "answer": 0, "explanation": "Correct: This is a frequently tested distinction — while removing a President demands the elaborate Article 61 impeachment process, a Governor (serving at the President's 'pleasure') can be removed instantly and without any stated reason or formal procedure at all.", "globalNum": 793}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 343, what is the Official Language of the Union, in which script, and for how long was English's continuation originally set?", "options": ["Hindi in Devanagari script; English continued for 15 years from 1950 (extendable)", "English in Roman script; Hindi continued for 15 years", "Hindi in Devanagari script; English continued permanently with no time limit ever set", "Sanskrit in Devanagari script; English continued for 25 years"], "answer": 0, "explanation": "Correct: Article 343 designates Hindi (Devanagari script) as the Union's official language, with English's use originally set for just 15 years from 1950 — though this was later extended and continued via the Official Languages Act, 1963.", "globalNum": 794}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Which Act continued the use of English beyond the original 15-year period set by Article 343?", "options": ["Official Languages Act, 1963", "Citizenship Act, 1955", "Representation of the People Act, 1951", "Government of India Act, 1935"], "answer": 0, "explanation": "Correct: The Official Languages Act, 1963 formally continued English's official use beyond 1965 (15 years after 1950), preventing the automatic phase-out that Article 343 originally envisioned.", "globalNum": 795}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 344, what is the Official Language Commission, and who first headed it in 1955?", "options": ["A body making non-binding recommendations on language policy; first headed by B.G. Kher", "A binding tribunal on language disputes; first headed by B.R. Ambedkar", "A permanent constitutional body like the UPSC; first headed by Rajendra Prasad", "A judicial body reviewing language laws; first headed by the Chief Justice"], "answer": 0, "explanation": "Correct: The Official Language Commission makes recommendations that are NOT binding on the government, and B.G. Kher headed the first such Commission in 1955.", "globalNum": 796}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 345, can a state adopt its own official language, and what happens until it does so?", "options": ["Yes — a state can adopt any regional language or Hindi for official purposes; English continues to be used until such adoption", "No, states must use Hindi exclusively with no choice", "States can adopt only English or Hindi, no regional languages allowed", "States must get Parliament's permission before adopting any regional language"], "answer": 0, "explanation": "Correct: Article 345 allows states to adopt any regional language (or Hindi) for their own official purposes, with English continuing as a default until such adoption — giving states meaningful linguistic autonomy.", "globalNum": 797}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 346, what language(s) govern communication between the Union and States (or between States)?", "options": ["Hindi or English", "Only Hindi, exclusively", "Only English, exclusively", "Whatever regional language the receiving state prefers"], "answer": 0, "explanation": "Correct: Article 346 specifies Hindi or English for inter-governmental communication — ensuring a common, mutually understood language framework across India's linguistically diverse states.", "globalNum": 798}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 347, what special power does the President have regarding the language of a section of a state's population?", "options": ["The President can recognise a language spoken by a section of the population for official purposes", "The President can ban any regional language from official use", "Only Parliament, not the President, can recognise minority languages", "This Article deals only with judicial language, not population language"], "answer": 0, "explanation": "Correct: Article 347 empowers the President to specially recognise a language used by a section of a state's population, providing a mechanism for linguistic minority accommodation.", "globalNum": 799}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 348, in which language must all Supreme Court/High Court proceedings, Bills, and Acts be conducted, and what exception exists?", "options": ["English; but the Governor may authorise Hindi/another language in a High Court, with the President's prior consent", "Hindi; English is allowed only with Presidential consent", "Any of the 22 official languages, freely chosen by each court", "Sanskrit, as the classical judicial language"], "answer": 0, "explanation": "Correct: The default is English for higher judiciary proceedings/Bills/Acts, but a Governor CAN authorise Hindi or another language specifically in a High Court, provided the President consents in advance.", "globalNum": 800}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 349, for how long did language-related laws require the President's prior sanction, from the Constitution's commencement?", "options": ["15 years", "5 years", "25 years", "10 years"], "answer": 0, "explanation": "Correct: Article 349 required Presidential prior sanction for language-related bills/amendments for the first 15 years after the Constitution commenced — a transitional safeguard during India's early linguistic reorganisation period.", "globalNum": 801}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 350, what right does a person have when seeking redress of grievances from government authorities?", "options": ["The right to use any language they choose (used by the Government) to submit a grievance representation", "The right to use only Hindi for all grievance submissions", "The right to use only English for grievance submissions", "No specific language right exists for grievances"], "answer": 0, "explanation": "Correct: Article 350 allows a person to submit grievance representations in any language used within the Government/State, protecting individual access to administrative remedy regardless of the person's specific language.", "globalNum": 802}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Which Amendment added Articles 350A and 350B, and what do these two Articles cover respectively?", "options": ["7th Constitutional Amendment (1956); 350A: instruction in mother tongue at primary stage; 350B: Special Officer for linguistic minorities", "42nd Constitutional Amendment (1976); 350A: Hindi promotion; 350B: judicial language", "1st Constitutional Amendment (1951); both cover land reform, unrelated to language", "44th Constitutional Amendment (1978); both cover Fundamental Rights"], "answer": 0, "explanation": "Correct: The 7th CA (1956) — the same Amendment enabling multi-state Governors — added 350A (mother-tongue instruction at the primary education stage) and 350B (a Special Officer to safeguard linguistic minorities' interests).", "globalNum": 803}, {"tab": "t30", "tabTitle": "30. State Legislature", "q": "Under Article 351, what duty is placed on the Union regarding the Hindi language?", "options": ["To issue directives for the development of the Hindi language, drawing on Hindustani and other Indian languages", "To make Hindi the sole medium of instruction nationwide", "To ban the use of English in all government offices", "To establish a separate Ministry of Hindi Language"], "answer": 0, "explanation": "Correct: Article 351 directs the Union to promote Hindi's development, drawing vocabulary primarily from Sanskrit and secondarily from other Indian languages — a promotional directive, not a ban on other languages or mandatory sole-medium instruction.", "globalNum": 804}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What are the three broad categories of Centre-State relations, and which Article ranges cover each?", "options": ["Legislative (245-255), Administrative (256-263), and Financial (268-293) Relations", "Legislative (256-263), Administrative (245-255), and Financial (268-293)", "Legislative (245-255), Financial (256-263), and Administrative (268-293)", "Only two categories exist: Legislative and Financial"], "answer": 0, "explanation": "Correct: Legislative Relations (245-255) covers division of law-making powers, Administrative Relations (256-263) covers policy/law implementation coordination, and Financial Relations (268-293) covers resource distribution — three distinct, sequential Article blocks.", "globalNum": 805}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What year was the Sarkaria Commission set up, and what did it recommend regarding Article 356 and the Governor's role?", "options": ["1983; recommended Art 356 be used sparingly as a last resort, and that the Governor's role should be neutral, avoiding active state politics", "1969; recommended frequent use of Art 356", "2007; recommended abolishing the Governor's office entirely", "1990; recommended fixed tenure for Governors"], "answer": 0, "explanation": "Correct: The Sarkaria Commission (1983) recommended restraint in using Article 356 (President's Rule) and a neutral, apolitical role for Governors — among several other cooperative-federalism reforms.", "globalNum": 806}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What other key recommendations did the Sarkaria Commission make, besides Article 356 restraint and Governor neutrality?", "options": ["Creation of the Inter-State Council under Art 263 (established 1990), continuation of All India Services, and consultation with States before Concurrent List laws", "Abolition of All India Services and the Inter-State Council", "Direct election of Governors by state legislatures", "Transfer of all residuary powers to the states"], "answer": 0, "explanation": "Correct: Sarkaria also recommended creating the Inter-State Council (which materialised in 1990), continuing the All India Services system, and consulting states before Concurrent List legislation — all aimed at strengthening cooperative federalism.", "globalNum": 807}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What year was the Punchhi Commission set up, and what did it recommend regarding the Governor's tenure and Bills reserved for the President?", "options": ["2007; recommended fixed Governor tenure, an impartial constitutional role, and disposal of Article 201-reserved Bills within 6 months", "1983; recommended abolishing fixed tenure for Governors", "1969; recommended no time limit for reserved Bills", "1990; recommended Governors be elected directly by the people"], "answer": 0, "explanation": "Correct: The Punchhi Commission (2007) recommended fixed tenure and impartiality for Governors, plus a 6-month disposal timeline for Bills reserved for the President — addressing gaps left by the earlier Sarkaria Commission.", "globalNum": 808}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Who set up the Rajmannar Commission in 1969, and what was its focus?", "options": ["The Tamil Nadu government; it examined Centre-State relations from a state's perspective", "The Central Government; it examined only financial relations", "The Kerala government; it examined judicial relations", "The Supreme Court; it examined administrative relations only"], "answer": 0, "explanation": "Correct: The Rajmannar Commission (1969) was set up by the Tamil Nadu government specifically, reflecting state-level concerns about Centre-State power balance — distinct from the later, centrally-appointed Sarkaria and Punchhi Commissions.", "globalNum": 809}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 245, what does the extent of laws made by Parliament and State Legislatures cover, and under Article 246, what determines subject-matter division?", "options": ["Art 245: territorial extent of laws; Art 246: subject-matter division per the 7th Schedule's Union/State/Concurrent Lists", "Art 245: subject-matter division; Art 246: territorial extent", "Both Articles cover identical territorial matters", "Art 245 and 246 both deal exclusively with financial matters"], "answer": 0, "explanation": "Correct: Article 245 addresses the territorial extent of Parliament's and State Legislatures' laws, while Article 246 addresses subject-matter jurisdiction via the 7th Schedule's three lists — two distinct dimensions of legislative competence.", "globalNum": 810}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 246A specifically allow, related to GST?", "options": ["Both Parliament and State Legislatures have concurrent power to make laws on GST, including inter-state supply of goods & services", "Only Parliament can legislate on GST, with no state role", "Only states can legislate on GST, with no central role", "GST legislation requires unanimous approval of all states"], "answer": 0, "explanation": "Correct: Article 246A gives BOTH Parliament and State Legislatures concurrent GST law-making power — a special, GST-specific provision that departs from the traditional Union/State/Concurrent List framework.", "globalNum": 811}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 248 give Parliament exclusive power over, and what does Article 247 empower Parliament to establish?", "options": ["Art 248: residuary subjects (not in State/Concurrent Lists); Art 247: additional courts", "Art 248: additional courts; Art 247: residuary subjects", "Both Articles deal with GST", "Art 248: State List subjects; Art 247: Union List subjects"], "answer": 0, "explanation": "Correct: Article 248 gives Parliament exclusive residuary legislative power, while Article 247 allows Parliament to establish additional courts for better administration of Union laws — two distinct, separate powers.", "globalNum": 812}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 251, if a State law conflicts with a Parliamentary law made under Articles 249 or 250 (national interest/Emergency), which prevails?", "options": ["The Parliament's law prevails", "The State's law prevails", "Neither law applies — the matter goes to the Supreme Court", "Both laws are applied simultaneously in different districts"], "answer": 0, "explanation": "Correct: Article 251 clearly establishes that Parliament's law prevails over a conflicting State law in these specific national-interest/Emergency legislative scenarios — reinforcing central authority in these exceptional circumstances.", "globalNum": 813}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 252, how many states must request Parliament to legislate on a State subject for Parliament to gain that power?", "options": ["2 or more states", "At least 5 states", "All states unanimously", "Just 1 state is sufficient"], "answer": 0, "explanation": "Correct: Article 252 requires at least 2 states to request such legislation — once passed, this Parliament-made law then also applies to any other state that later adopts it, though the requesting states themselves cannot amend it independently.", "globalNum": 814}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What is the 'Doctrine of Repugnancy' under Article 254, and under Article 254(2), when can a repugnant State law still prevail in that state?", "options": ["It resolves conflicts on Concurrent List subjects, with Central law normally prevailing; but a State law CAN prevail if it was reserved for and received the President's assent", "It resolves conflicts on Union List subjects, with State law always prevailing", "It applies to Residuary subjects only, never Concurrent List matters", "A repugnant State law can never prevail under any circumstances"], "answer": 0, "explanation": "Correct: The Doctrine of Repugnancy addresses Concurrent List conflicts, generally favouring Central law — but Article 254(2) carves out an exception: if the State law was specifically reserved for and received the President's assent, it CAN prevail within that particular state.", "globalNum": 815}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 255, if a Bill required prior recommendation or sanction that wasn't obtained beforehand, is the resulting law automatically invalid?", "options": ["No — the law is not invalidated if the required assent/sanction/recommendation was given afterward", "Yes, the law becomes automatically and permanently void", "Only the Supreme Court can decide validity in such cases, with no clear rule", "The law is valid only for 6 months without proper sanction"], "answer": 0, "explanation": "Correct: Article 255 provides a curative provision — a law isn't rendered invalid merely because prior recommendation/sanction was missing, as long as it was obtained later (e.g., via subsequent presidential assent).", "globalNum": 816}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 249, how large a majority must the Rajya Sabha achieve to pass a resolution enabling Parliament to legislate on a State List matter 'in national interest,' and for how long does this remain valid?", "options": ["Two-thirds majority of members present and voting; valid for a maximum of 1 year (renewable)", "Simple majority; valid permanently until repealed", "Two-thirds majority; valid for exactly 6 months with no renewal", "Absolute majority of total membership; valid for 2 years"], "answer": 0, "explanation": "Correct: Article 249 requires a Special (two-thirds) Majority of RS members present and voting, and the resulting law remains valid for a maximum 1 year, though this can be renewed via a fresh resolution.", "globalNum": 817}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 250, during a National Emergency, how long does Parliament's power to legislate on State subjects continue after the Emergency ends?", "options": ["The resulting law ceases to have effect 6 months after the Emergency ends", "The law remains valid permanently, unaffected by the Emergency ending", "The law ceases immediately upon the Emergency's end, with no grace period", "The law remains valid for 1 year after the Emergency ends"], "answer": 0, "explanation": "Correct: A law made under Article 250 during a National Emergency ceases 6 months after the Emergency ends — matching the general '6 months post-emergency' pattern seen elsewhere for such extraordinary legislative powers.", "globalNum": 818}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 256, what must States ensure, and under Article 257, what control does the Union have over States?", "options": ["Art 256: States must comply with parliamentary laws; Art 257: Union can ensure no impediment to Union executive power, including protecting railways", "Art 256: Union must comply with State laws; Art 257: States control Union executive power", "Both Articles deal exclusively with financial transfers", "Art 256 and 257 both concern only judicial matters"], "answer": 0, "explanation": "Correct: Article 256 obligates States to comply with parliamentary (central) laws, while Article 257 gives the Union authority to prevent impediments to its executive power, including specific protection for railways within state territory.", "globalNum": 819}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 258 allow, and what does Article 258A (added by the 7th CA) allow in the reverse direction?", "options": ["Art 258: Union can confer powers on States; Art 258A: a State may, with Union's consent, entrust its executive functions to the Union", "Art 258: States can confer powers on the Union; Art 258A: Union can entrust functions to States without consent", "Both Articles are identical with no directional difference", "Art 258A repeals Art 258 entirely"], "answer": 0, "explanation": "Correct: Article 258 lets the Union delegate powers downward to States, while Article 258A (a later addition via the 7th CA) allows States to delegate their own executive functions upward to the Union, with the Union's consent — a genuinely two-way delegation mechanism.", "globalNum": 820}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 259, and Article 260, what specific powers does the notes describe?", "options": ["Art 259: President may entrust Union functions to a State Government; Art 260: GoI may, by agreement, undertake functions in territories outside India", "Art 259: GoI undertakes functions abroad; Art 260: President entrusts functions to States", "Both deal with inter-state river disputes", "Art 259 and 260 both concern the Inter-State Council"], "answer": 0, "explanation": "Correct: Article 259 lets the President assign specific Union functions to a willing State Government, while Article 260 lets the Government of India undertake administrative, legislative, or judicial functions in territories outside India, via agreement with foreign governments.", "globalNum": 821}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 261 provide regarding public acts, records, and judicial proceedings?", "options": ["They shall be recognised throughout India, wherever made or issued", "They apply only within the state where they were made", "They require Parliament's approval to be recognised in another state", "Only Supreme Court records are recognised nationwide; others are not"], "answer": 0, "explanation": "Correct: Article 261 ensures full faith and credit — public acts, records, and judicial proceedings from any part of India are recognised throughout the country, without needing separate state-by-state approval.", "globalNum": 822}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 262, what can Parliament provide for regarding inter-state river disputes, and can it exclude the Supreme Court's jurisdiction over such disputes?", "options": ["Parliament can provide for adjudication of inter-state river/river-valley water disputes, and may exclude BOTH the Supreme Court and any other court's jurisdiction over such disputes", "Parliament can adjudicate disputes but the Supreme Court's jurisdiction can never be excluded", "Only the Supreme Court can handle such disputes, with no role for Parliament", "States must resolve such disputes bilaterally, with no role for Parliament or courts"], "answer": 0, "explanation": "Correct: Article 262 uniquely allows Parliament to entirely bar court jurisdiction (including the Supreme Court's) over inter-state river water disputes — a rare and significant ouster of judicial review in this specific domain.", "globalNum": 823}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 263, what body's provisions does this Article deal with?", "options": ["The Inter-State Council", "The Finance Commission", "The GST Council", "The Zonal Councils"], "answer": 0, "explanation": "Correct: Article 263 specifically provides the constitutional basis for the Inter-State Council, which was eventually established in 1990 based on the Sarkaria Commission's recommendation. The GST Council instead derives from Article 279A, and the Finance Commission from Article 280.", "globalNum": 824}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What is the composition of the Inter-State Council, and what is its role — binding or merely recommendatory?", "options": ["Chaired by the PM, with CMs of all states/UTs (with Assembly), Administrators of UTs (without Assembly), and 6 PM-nominated Cabinet Ministers; its role is recommendatory, NOT binding", "Chaired by the President, with only state Governors as members; fully binding on all states", "Chaired by the Chief Justice, with judges as members; advisory only on judicial matters", "Chaired by the Finance Minister, with only Finance Ministers of states as members"], "answer": 0, "explanation": "Correct: The PM chairs the ISC, which includes state CMs, UT CMs (where an Assembly exists) or Administrators (where none exists), plus 6 Union Cabinet Ministers nominated by the PM. Crucially, its recommendations are NOT binding — it functions as a discussion/investigation forum, not an enforcement body.", "globalNum": 825}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What are Zonal Councils, and under which Act were they established?", "options": ["Statutory (not constitutional) bodies, established by the States Reorganisation Act, 1956", "Constitutional bodies, established directly by Article 263", "Bodies established by the GST (Compensation to States) Act, 2017", "Temporary bodies established solely for the 2001 Census"], "answer": 0, "explanation": "Correct: Zonal Councils are statutory bodies (not constitutional ones, unlike say the Finance Commission) created via the States Reorganisation Act, 1956 — dividing India into 5 regional zones for administrative cooperation.", "globalNum": 826}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What are the 5 Zonal Councils, and what are their respective headquarters?", "options": ["Northern (Delhi), Southern (Chennai), Central (Allahabad/Prayagraj), Eastern (Kolkata), Western (Mumbai)", "Northern (Mumbai), Southern (Delhi), Central (Chennai), Eastern (Prayagraj), Western (Kolkata)", "Only 4 zones exist: North, South, East, West", "Northern (Chandigarh), Southern (Bengaluru), Central (Bhopal), Eastern (Patna), Western (Ahmedabad)"], "answer": 0, "explanation": "Correct: The 5 zones and their HQs are Northern (Delhi), Southern (Chennai), Central (Allahabad/Prayagraj), Eastern (Kolkata), and Western (Mumbai) — a fixed regional grouping structure from the 1956 Act.", "globalNum": 827}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Who chairs a Zonal Council, and who serves as Vice-Chairman?", "options": ["Chairman: Union Home Minister; Vice-Chairman: CMs of states in that zone, on a rotational basis (1-year term)", "Chairman: Prime Minister; Vice-Chairman: Union Finance Minister", "Chairman: President; Vice-Chairman: Chief Justice", "Chairman: NITI Aayog CEO; Vice-Chairman: Cabinet Secretary"], "answer": 0, "explanation": "Correct: The Union Home Minister chairs each Zonal Council, while member states' CMs rotate as Vice-Chairman on a 1-year term — a structure distinct from the PM-chaired Inter-State Council.", "globalNum": 828}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "When was the North Eastern Council (NEC) constituted, and how does it differ structurally from the 5 Zonal Councils?", "options": ["1971, by a separate Act of Parliament — NOT one of the 5 standard zones; also functions as a regional planning body for 8 NE states", "1956, as part of the States Reorganisation Act, forming the 6th zone", "1990, alongside the Inter-State Council, as a sub-body of it", "2007, following the Punchhi Commission's recommendation"], "answer": 0, "explanation": "Correct: The NEC was set up in 1971 via its own distinct Act of Parliament, separate from the 5-zone structure created in 1956, and it uniquely also functions as a regional planning body for the 8 North-Eastern states.", "globalNum": 829}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Besides the CM Vice-Chairman, which other officials serve as advisors to a Zonal Council?", "options": ["A NITI Aayog member and the Chief Secretaries of member states", "Only the Governors of member states", "The Finance Minister and RBI Governor", "The Supreme Court Chief Justice and Attorney General"], "answer": 0, "explanation": "Correct: Zonal Councils include a NITI Aayog member and the Chief Secretaries of member states as advisors, providing planning and administrative expertise to the political leadership (Home Minister as Chairman, CMs on rotation as Vice-Chairman).", "globalNum": 830}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 265, can tax be levied or collected without legal authority?", "options": ["No — no tax shall be levied or collected except by authority of law", "Yes, the executive can levy taxes independently without any law", "Only the President can levy taxes without a specific law", "Taxes can be levied by custom, without formal legislation"], "answer": 0, "explanation": "Correct: Article 265 establishes a fundamental principle — taxation requires legal authority (a duly enacted law); no tax can be imposed merely by executive whim or custom.", "globalNum": 831}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 268, what happens to duties levied by the Union but collected by States, such as stamp duties?", "options": ["They are collected AND appropriated (kept) by the States themselves", "They are collected by States but sent entirely to the Union", "They are both levied and collected by States independently", "They are abolished and no longer exist under this Article"], "answer": 0, "explanation": "Correct: Article 268 duties (like stamp duties) are levied by the Union but both collected AND appropriated (retained) by the States — the States keep this revenue entirely, despite the Union setting the duty.", "globalNum": 832}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 269, how do taxes like inter-state sale/purchase tax differ from Article 268 duties in terms of revenue destination?", "options": ["Article 269 taxes are levied AND collected by the Union but then ASSIGNED to the States (not just appropriated by states directly as under 268)", "Article 269 taxes are collected and kept fully by the Union, unlike Article 268", "Both Articles work identically, with no distinction", "Article 269 taxes are levied by States but collected by the Union"], "answer": 0, "explanation": "Correct: Under Article 269, the Union levies AND collects the tax, but then assigns the proceeds to the States — a structurally similar-but-distinct arrangement from Article 268 (where the tax is levied by Union but directly collected/kept by states).", "globalNum": 833}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 269A specifically deal with, regarding GST, and who determines its apportionment between Union and States?", "options": ["GST on inter-state trade — levied & collected by the Union, apportioned per the GST Council's recommendation", "GST on intra-state trade — levied & collected by States directly", "Article 269A abolished GST entirely in 2016", "GST apportionment is decided solely by the Finance Commission"], "answer": 0, "explanation": "Correct: Article 269A specifically covers inter-state GST (IGST), with the Union levying/collecting it, and the GST Council (not the Finance Commission) determining how it's apportioned between the Union and States.", "globalNum": 834}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 271, what happens to any surcharge Parliament levies on certain duties/taxes for Union purposes?", "options": ["The surcharge goes entirely to the Centre, and is NOT shared with States (with GST being an exception)", "The surcharge is shared equally between the Centre and States", "The surcharge is distributed entirely to the States", "GST surcharges are also kept fully by the Centre, with no exception"], "answer": 0, "explanation": "Correct: Article 271 surcharges go 100% to the Centre, unshared with States — a notable exception to the general revenue-sharing framework, though this rule itself carves out GST as an exception where different sharing rules apply (per the GST Council's arrangements).", "globalNum": 835}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 275, what are 'Grants-in-aid,' and from which fund do they come?", "options": ["Grants given to States from the Consolidated Fund of India, based on a law made by Parliament", "Loans given to States, to be repaid with interest", "Automatic annual transfers requiring no parliamentary law", "Grants given by States to the Union, for national development"], "answer": 0, "explanation": "Correct: Article 275 Grants-in-aid flow from the Consolidated Fund of India TO the States (not the reverse), based on a Parliamentary law — distinct from loans, since they need not be repaid.", "globalNum": 836}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Which Article, added by which Amendment, established the GST Council, and who chairs it?", "options": ["Article 279A, added by the 101st Constitutional Amendment (2016); chaired by the Union Finance Minister", "Article 269A, added by the 122nd Constitutional Amendment; chaired by the Prime Minister", "Article 280, added by the 73rd Amendment; chaired by the RBI Governor", "Article 265, added by the 44th Amendment; chaired by the Cabinet Secretary"], "answer": 0, "explanation": "Correct: The 101st Constitutional Amendment (2016) added Article 279A, creating the GST Council chaired by the Union Finance Minister, with the Union Minister of State (Finance) and State Finance/other Ministers as members.", "globalNum": 837}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Which Article deals with the Finance Commission, and where is it covered in more detail per the notes' cross-reference?", "options": ["Article 280; covered in more detail under the 'Constitutional Bodies' topic", "Article 269A; covered under 'Financial Relations' exclusively, with no other cross-reference", "Article 279A; covered under the 'GST Council' topic", "Article 275; covered under 'Grants-in-Aid' topic exclusively"], "answer": 0, "explanation": "Correct: Article 280 establishes the Finance Commission, and the notes specifically point readers to the separate 'Constitutional Bodies' topic for fuller detail on this institution's composition and functions.", "globalNum": 838}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Articles 292 and 293, what are the borrowing powers of the Union and States respectively, and what special condition applies to a State's borrowing?", "options": ["Art 292: Union's borrowing power; Art 293: States' borrowing power — States need the Union's consent to borrow further if already indebted to the Union", "Art 292: States' borrowing power; Art 293: Union's borrowing power", "Neither the Union nor States have any constitutionally defined borrowing power", "States can borrow freely with no restrictions, even if already indebted to the Union"], "answer": 0, "explanation": "Correct: Article 292 covers Union borrowing, Article 293 covers State borrowing, and importantly, a State already indebted to the Union needs the Union's consent for further borrowing — a significant financial control lever for the Centre over indebted states.", "globalNum": 839}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 301, trade, commerce, and intercourse throughout India shall be 'free.' Why is this Article informally called the 'economic Article 19'?", "options": ["Because it guarantees economic freedom of movement/trade across India, paralleling how Article 19 guarantees personal freedoms", "Because it was added in the 19th Amendment", "Because it applies only to 19 specific goods", "Because it was drafted by the same committee that drafted Article 19"], "answer": 0, "explanation": "Correct: Article 301's guarantee of free trade/commerce/intercourse across India parallels Article 19's protection of personal freedoms, earning it this informal nickname reflecting its role as an economic counterpart within the Constitution.", "globalNum": 840}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 302, on what basis can Parliament impose restrictions on trade, commerce, or intercourse between/within states?", "options": ["In the public interest", "Only during a National Emergency", "Only with unanimous consent of all states", "Parliament can never impose such restrictions"], "answer": 0, "explanation": "Correct: Article 302 allows Parliament to restrict trade/commerce/intercourse specifically in the public interest — a general, ongoing power, not one limited to Emergency situations or requiring unanimous state consent.", "globalNum": 841}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 303, can Parliament or State Legislatures give preference to one state over another in trade matters, and what is the key exception?", "options": ["Generally no such preference is allowed, EXCEPT to deal with a scarcity situation", "Yes, unlimited preference is always allowed for any reason", "No exceptions exist under any circumstances", "Preference is allowed only for landlocked states"], "answer": 0, "explanation": "Correct: Article 303 generally bars discriminatory preference between states in trade matters, but carves out a specific exception for addressing a scarcity situation — a targeted, practical carve-out to an otherwise strict equality principle.", "globalNum": 842}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "Under Article 304, can a State Legislature impose reasonable restrictions on trade/commerce within that state, and what special requirement applies to such a Bill?", "options": ["Yes, in the public interest — but such a Bill needs the President's prior sanction", "No, states have no power to impose any trade restrictions whatsoever", "Yes, freely, with no need for any central sanction", "Only Parliament, never a State Legislature, can impose such restrictions"], "answer": 0, "explanation": "Correct: Article 304 allows a State to impose reasonable trade restrictions in the public interest, but crucially, such a Bill requires the President's PRIOR sanction before introduction — a check on potential protectionist state legislation.", "globalNum": 843}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 305 protect, and what happened to Article 306?", "options": ["Art 305 saves existing laws and State-monopoly laws from Articles 301-303; Art 306 was repealed by the 7th CA, 1956 (it dealt with erstwhile Part B states)", "Art 305 was repealed; Art 306 protects existing laws", "Both Articles remain fully active today with no repeal", "Art 305 deals with GST; Art 306 deals with income tax"], "answer": 0, "explanation": "Correct: Article 305 protects pre-existing laws and State-monopoly arrangements from the general free-trade guarantees of Articles 301-303, while Article 306 (which had dealt with the now-abolished Part B states classification) was repealed by the 7th CA in 1956.", "globalNum": 844}, {"tab": "t31", "tabTitle": "31. Centre–State Relations", "q": "What does Article 307 empower Parliament to do regarding the enforcement of Articles 301-304?", "options": ["Appoint an authority to carry out the purposes of these free-trade Articles", "Directly enforce these Articles through the judiciary only", "Delegate this power entirely to State Governments", "Abolish these Articles if states consistently violate them"], "answer": 0, "explanation": "Correct: Article 307 allows Parliament to create/appoint a specific implementing authority to carry out the objectives of the trade/commerce freedom Articles (301-304) — an administrative enforcement mechanism, distinct from mere judicial enforcement.", "globalNum": 845}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Emergency provisions are covered under which Part of the Constitution, and from which two sources are they borrowed?", "options": ["Part XVIII; borrowed from the Weimar Constitution of Germany (FR suspension) and the Government of India Act, 1935 (emergency provisions)", "Part XVII; borrowed entirely from the US Constitution", "Part XIX; borrowed from the UK's unwritten conventions", "Part XVIII; borrowed entirely from the Irish Constitution"], "answer": 0, "explanation": "Correct: Emergency provisions sit in Part XVIII, drawing on the Weimar Constitution (Germany) for the FR-suspension concept and the GoI Act, 1935 for the general emergency framework — a dual foreign inspiration.", "globalNum": 846}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What are the three types of Emergency, and their respective governing Articles?", "options": ["National Emergency (352), State Emergency/President's Rule (356), Financial Emergency (360)", "National Emergency (350), State Emergency (355), Financial Emergency (358)", "National Emergency (356), State Emergency (352), Financial Emergency (360)", "National Emergency (360), State Emergency (356), Financial Emergency (352)"], "answer": 0, "explanation": "Correct: The three types run National (352) → State/President's Rule (356) → Financial (360) — a neat pattern noted in the mnemonic, with each Article number exactly 4 apart.", "globalNum": 847}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Under Article 352, after which body's decision does the President proclaim a National Emergency, and which Amendment added this specific requirement?", "options": ["The Cabinet's written decision; added by the 44th Constitutional Amendment, 1978", "The Prime Minister's sole decision; added by the 42nd Amendment", "Parliament's joint resolution; added by the 38th Amendment", "The Council of Ministers as a whole, without any specific Amendment requirement"], "answer": 0, "explanation": "Correct: The 44th CA (1978) specifically required the President to act only after receiving the Cabinet's (not just the PM's individual) written decision — a safeguard added after the 1975 Emergency's controversial declaration.", "globalNum": 848}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Within how long must a National Emergency proclamation be approved by both Houses of Parliament, and by what majority?", "options": ["Within 1 month, by Special Majority", "Within 2 months, by Simple Majority", "Within 6 months, by Special Majority", "Within 14 days, by Simple Majority"], "answer": 0, "explanation": "Correct: National Emergency needs approval within 1 month via Special Majority in both Houses — a shorter timeframe but a HIGHER majority requirement than President's Rule (2 months, Simple Majority) or Financial Emergency (2 months, Simple Majority).", "globalNum": 849}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Once approved, how long does a National Emergency initially continue, and can it be extended indefinitely?", "options": ["6 months initially; can be extended indefinitely, with fresh Parliamentary approval every 6 months", "1 year initially; cannot be extended beyond 3 years", "3 months initially; can be extended only once", "Permanent once approved, with no further approval ever needed"], "answer": 0, "explanation": "Correct: A National Emergency runs in renewable 6-month blocks, each requiring fresh Parliamentary approval — theoretically allowing indefinite continuation as long as Parliament keeps approving it.", "globalNum": 850}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What did the 38th Constitutional Amendment (1975) do regarding judicial review of an Emergency proclamation, and how did the Minerva Mills Case (1980) change this?", "options": ["38th CA barred judicial review of the proclamation; Minerva Mills later made the proclamation subject to Judicial Review", "38th CA allowed judicial review; Minerva Mills removed it", "Both barred judicial review permanently, with no later change", "Minerva Mills predates the 38th CA and originally allowed judicial review"], "answer": 0, "explanation": "Correct: The 38th CA (1975, during the Emergency itself) shielded the proclamation from judicial review, but the later Minerva Mills case (1980) reopened the door to Judicial Review of such proclamations — a significant post-Emergency corrective.", "globalNum": 851}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What are the three grounds for proclaiming a National Emergency under Article 352?", "options": ["War, External Aggression, and Armed Rebellion", "War, Financial Instability, and Internal Disturbance", "External Aggression, Natural Disaster, and Armed Rebellion", "War, Armed Rebellion, and Failure of Constitutional Machinery"], "answer": 0, "explanation": "Correct: The three grounds are War, External Aggression, and Armed Rebellion. 'Failure of Constitutional Machinery' is instead the ground for President's Rule (Art 356), and 'Financial Instability' is the ground for Financial Emergency (Art 360).", "globalNum": 852}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "The term 'Armed Rebellion' was inserted by which Amendment, and what term did it replace?", "options": ["44th CA, 1978 — replaced the earlier term 'Internal Disturbance'", "42nd CA, 1976 — replaced 'Civil Unrest'", "38th CA, 1975 — replaced 'Armed Conflict'", "24th CA, 1971 — replaced 'War'"], "answer": 0, "explanation": "Correct: The 44th CA (1978) replaced the vaguer, more easily-misused term 'Internal Disturbance' (used to justify the controversial 1975 Emergency) with the more specific 'Armed Rebellion' — a deliberate tightening of the emergency-declaration threshold.", "globalNum": 853}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "How many National Emergencies has India declared, and what were the reasons and years for each?", "options": ["3 times: 1962 (Indo-China War), 1971 (India-Pakistan War), 1975-1977 (Internal Disturbances)", "2 times: 1971 and 1975 only", "4 times, including one during COVID-19", "5 times, most recently in 2019"], "answer": 0, "explanation": "Correct: India has declared a National Emergency exactly 3 times — 1962 (Indo-China War, under PM Nehru), 1971 (India-Pakistan War, under PM Indira Gandhi), and 1975-1977 (Internal Disturbances, also under PM Indira Gandhi, with President Fakhruddin Ali Ahmed proclaiming it).", "globalNum": 854}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Who was Prime Minister during the 1962 National Emergency (Indo-China War), and who was PM during the 1971 Emergency (India-Pakistan War)?", "options": ["J.L. Nehru (1962); Indira Gandhi (1971)", "Indira Gandhi (1962); J.L. Nehru (1971)", "Lal Bahadur Shastri for both", "Morarji Desai (1962); Indira Gandhi (1971)"], "answer": 0, "explanation": "Correct: Nehru was PM during the 1962 China war Emergency, and Indira Gandhi was PM during both the 1971 Pakistan war Emergency and the controversial 1975-1977 Emergency.", "globalNum": 855}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What is '25th June' commemorated as, marking the 1975 Emergency's declaration?", "options": ["Samvidhan Hatya Diwas", "Constitution Day", "Republic Day", "National Unity Day"], "answer": 0, "explanation": "Correct: 25th June is marked as 'Samvidhan Hatya Diwas' (Constitution Murder Day), commemorating the controversial 1975 Emergency declaration. Constitution Day is instead 26 November, and Republic Day is 26 January.", "globalNum": 856}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "How can a National Emergency be revoked?", "options": ["Any time by the President (no Parliamentary approval needed), OR if the Lok Sabha passes a resolution by Simple Majority", "Only by a Special Majority resolution in both Houses", "Only by a Supreme Court order", "Cannot be revoked before the full 6-month period ends"], "answer": 0, "explanation": "Correct: Revocation can happen either directly by presidential decision (needing no parliamentary nod) or via a Lok Sabha Simple Majority resolution — a notably easier process than the Special Majority needed for initial approval.", "globalNum": 857}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Under Article 353, what happens to the federal system during a National Emergency, and what expanded power does the Centre gain over states?", "options": ["The federal system becomes Unitary in nature; the Centre can give directions to states on ANY matter (not just limited matters as in normal times)", "The federal system remains unchanged; the Centre gets no new powers", "States gain MORE autonomy during a National Emergency", "Only financial directions can be given to states, nothing else"], "answer": 0, "explanation": "Correct: During a National Emergency, India's federal structure effectively turns Unitary, and the Centre's directive power to states expands to cover any matter, not just the limited matters allowed in normal times.", "globalNum": 858}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "During a National Emergency, laws Parliament makes on State List subjects become inoperative how long after the Emergency ceases?", "options": ["6 months after the Emergency ceases", "Immediately upon the Emergency's end", "1 year after the Emergency ceases", "They remain permanently in force, with no time limit"], "answer": 0, "explanation": "Correct: Such laws become inoperative 6 months after the Emergency ends — matching the specific timeline given in Article 250 discussed elsewhere for the same scenario.", "globalNum": 859}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "During a National Emergency, by how much can the Lok Sabha's (or a State Assembly's) term be extended at a time, and what is the outer limit on this extension?", "options": ["Extended by 1 year at a time, but cannot continue beyond 6 months after the Emergency ceases", "Extended by 6 months at a time, with no outer limit", "Extended indefinitely with no restrictions at all", "Cannot be extended under any circumstances during Emergency"], "answer": 0, "explanation": "Correct: The term extension is capped at 1 year per extension, but overall cannot continue beyond 6 months post-Emergency — ensuring elections eventually resume even if the Emergency is prolonged.", "globalNum": 860}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "What is the key difference between Article 358 and Article 359 regarding suspension of Fundamental Rights during a National Emergency?", "options": ["Article 358 deals with suspension of Article 19 rights specifically (only on grounds of war/external aggression, NOT armed rebellion); Article 359 deals with suspending the 'right to move court' for other FRs", "Article 358 deals with all FRs; Article 359 deals only with Article 19", "Article 358 and 359 both deal with identical suspension of Article 21 rights", "Article 358 suspends Article 20/21; Article 359 suspends Article 19"], "answer": 0, "explanation": "Correct: Article 358 specifically covers Article 19 suspension, and notably ONLY for war/external aggression grounds (not armed rebellion), while Article 359 covers suspending the RIGHT TO MOVE COURT for other FRs generally — with Articles 20 and 21 explicitly protected from ever being suspended under either provision.", "globalNum": 861}, {"tab": "t32", "tabTitle": "32. Emergency Provisions", "q": "Under Article 354, what power does the President gain regarding revenue distribution during a National Emergency?", "options": ["Power to modify the distribution of money between the Centre and States", "Power to abolish all state taxes entirely", "Power to transfer all state revenue permanently to the Centre", "No special financial powers are granted under Article 354"], "answer": 0, "explanation": "Correct: Article 354 lets the President modify Centre-State revenue distribution arrangements during a National Emergency — a temporary adjustment mechanism, not a permanent or total transfer of revenue.", "globalNum": 862}, {"tab": "t32", "tabTitle": "32. Em
