on gender only, prohibited for the State alone", "Bonded labour, prohibited for private employers only", "Child labour, prohibited universally"], "answer": 0, "explanation": "Correct: Article 17 abolishes untouchability and prohibits its practice by both the State AND private individuals — unusually extending a Fundamental Right's obligation to private persons, not just the State.", "globalNum": 364}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Is the term 'Untouchability' defined anywhere in the Constitution, and which Act replaced the earlier Untouchability Offences Act, 1955?", "options": ["It is nowhere defined; replaced by the Protection of Civil Rights Act, 1976", "It is precisely defined in Article 17 itself; replaced by the SC/ST Act, 1989", "It is defined in the 9th Schedule; no replacement Act exists", "It is defined in the Citizenship Act, 1955"], "answer": 0, "explanation": "Correct: 'Untouchability' is nowhere defined in the Constitution. The original Untouchability Offences Act, 1955 was later replaced by the Protection of Civil Rights Act, 1976, giving the prohibition more teeth.", "globalNum": 365}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "What does Article 18 prohibit regarding titles, with what exception?", "options": ["It prohibits the State from conferring titles (except military/academic distinctions) — e.g. barring titles like Maharaja or Rai Bahadur", "It bans all civilian awards including Bharat Ratna", "It prohibits foreign countries from ever honouring Indian citizens", "It allows the State to confer any title freely"], "answer": 0, "explanation": "Correct: Article 18 bars the State from conferring titles like 'Maharaja' or 'Rai Bahadur,' except for military or academic distinctions. It doesn't ban civilian awards altogether (a separate legal question addressed in case law) nor does it forbid foreign honours outright — those are separately regulated.", "globalNum": 366}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "Under Article 18, can an Indian citizen holding an office of profit accept a foreign title?", "options": ["Only with the President's consent", "Never, under any circumstances", "Freely, without any restriction", "Only if approved by Parliament, not the President"], "answer": 0, "explanation": "Correct: A person holding an office of profit can accept a foreign title only with the President's consent — it is not an absolute ban, nor is it unrestricted, and Parliament's approval (rather than the President's) is not the mechanism specified.", "globalNum": 367}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "In Balaji Raghavan v. Union of India (1996), how did the Supreme Court characterise civilian awards like the Bharat Ratna or Padma awards?", "options": ["As decorations, not titles — hence not barred by Article 18", "As titles, and therefore unconstitutional", "As illegal unless approved by the Rajya Sabha", "As equivalent to foreign titles requiring presidential consent"], "answer": 0, "explanation": "Correct: The Court held that civilian awards are decorations, not 'titles' in the Article 18 sense, and are therefore constitutionally permissible. This distinguishes them from titles like 'Maharaja,' which Article 18 does bar.", "globalNum": 368}, {"tab": "t14", "tabTitle": "14. Right to Equality", "q": "According to the notes' 'exam trap,' who does Article 14 ('Equality before law') protect, compared to Articles 15 and 16?", "options": ["Article 14 protects 'any person' (citizens AND foreigners); Articles 15 and 16 are citizen-only rights", "Article 14 protects only citizens; Articles 15 and 16 protect foreigners too", "All three Articles protect only citizens", "All three Articles protect only foreigners"], "answer": 0, "explanation": "Correct: Article 14 uses the phrase 'any person,' extending its protection to both citizens and foreigners, whereas Articles 15 and 16 are worded to protect citizens only — an important and commonly tested distinction.", "globalNum": 369}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Under the 'SAAMRO' mnemonic for Article 19(1), what six freedoms are protected (as originally enumerated, before Right to Property's removal)?", "options": ["Speech & expression, Assemble peacefully, form Associations, Move freely, Reside/settle anywhere, and practise any Occupation/profession/trade", "Speech, Assembly, Religion, Movement, Residence, and Property", "Speech, Association, Voting, Movement, Residence, and Occupation", "Speech, Assembly, Association, Privacy, Residence, and Occupation"], "answer": 0, "explanation": "Correct: The SAAMRO mnemonic covers Speech & expression (19(1)(a)), Assemble peacefully (b), Associations (c), Move freely (d), Reside/settle (e), and Occupation/profession/trade/business (g) — note 19(1)(f), the original Right to Property, was later removed.", "globalNum": 370}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "On what general grounds does Article 19(2) allow reasonable restrictions on freedom of speech and expression?", "options": ["Public order, decency, morality, sovereignty, integrity, defamation, and contempt of court", "Only public order and nothing else", "Political disagreement with the government", "Personal inconvenience to public officials"], "answer": 0, "explanation": "Correct: Article 19(2) allows restrictions on grounds including sovereignty, security, public order, decency, morality, defamation, and contempt of court — not mere political disagreement or official inconvenience.", "globalNum": 371}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which Amendment added the Right to form Cooperative Societies under Article 19(1)(c)?", "options": ["97th Amendment", "44th Amendment", "86th Amendment", "93rd Amendment"], "answer": 0, "explanation": "Correct: The 97th Amendment added the right to form Cooperative Societies to 19(1)(c). The 44th Amendment instead removed the Right to Property; the 86th added Article 21A (Right to Education); the 93rd added Article 15(5).", "globalNum": 372}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which sub-clause of Article 19(1) — dealing with the Right to Property — was omitted, and by which Amendment?", "options": ["19(1)(f), omitted by the 44th Constitutional Amendment, 1978", "19(1)(g), omitted by the 97th Amendment", "19(1)(a), omitted by the 42nd Amendment", "19(1)(c), omitted by the 86th Amendment"], "answer": 0, "explanation": "Correct: Article 19(1)(f) (Right to Property) was omitted by the 44th CA, 1978 — the same Amendment that moved Right to Property out of Part III to Article 300-A.", "globalNum": 373}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which case recognised the 'Right to Internet' as a hidden right under Article 19, and which recognised the 'Right to Information'?", "options": ["Anuradha Bhasin vs Union of India (2020) for Internet; Raj Narayan vs State of UP (1975) for RTI", "Raj Narayan vs State of UP for Internet; Anuradha Bhasin for RTI", "Romesh Thapar case for both", "Shreya Singhal case for both"], "answer": 0, "explanation": "Correct: Anuradha Bhasin v. Union of India (2020) recognised internet access as linked to Article 19, while Raj Narayan v. State of UP (1975) is an early case recognising the Right to Information. Romesh Thapar and Shreya Singhal dealt with press freedom and IT Act Section 66A respectively.", "globalNum": 374}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Under the RTI Act, 2005, within how many days of an application must information be provided?", "options": ["30 days", "15 days", "60 days", "90 days"], "answer": 0, "explanation": "Correct: Information must generally be provided within 30 days of receiving an RTI application, per the RTI Act, 2005 (with shorter timelines for life/liberty matters).", "globalNum": 375}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did the Romesh Thapar v. State of Madras (1950) case establish?", "options": ["Freedom of the press is integral to Article 19(1)(a)", "Section 66A of the IT Act is unconstitutional", "RTI is part of freedom of speech and expression", "Right to internet is a fundamental right"], "answer": 0, "explanation": "Correct: Romesh Thapar (1950) established that freedom of the press is integral to Article 19(1)(a)'s freedom of speech and expression. The other rulings came from later, separate cases (Shreya Singhal, PUCL, Anuradha Bhasin).", "globalNum": 376}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "In Shreya Singhal v. Union of India (2015), which provision of the IT Act was struck down, and why?", "options": ["Section 66A, as unconstitutional for violating Article 19(1)(a)", "Section 66B, for violating Article 21", "Section 65, for violating Article 14", "The entire IT Act, for violating Article 32"], "answer": 0, "explanation": "Correct: Section 66A of the IT Act (dealing with offensive online messages) was struck down for violating the freedom of speech and expression under Article 19(1)(a).", "globalNum": 377}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did PUCL v. Union of India (2004) establish regarding the Right to Information?", "options": ["RTI is part of the freedom of speech & expression under Article 19(1)(a)", "RTI is a separate, standalone Fundamental Right under Article 21A", "RTI applies only to government employees", "RTI was rejected as unconstitutional"], "answer": 0, "explanation": "Correct: PUCL v. Union of India (2004) held that the Right to Information forms part of the freedom of speech and expression guaranteed under Article 19(1)(a) — reinforcing the earlier Raj Narayan precedent.", "globalNum": 378}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What does Article 20(1) — the rule against ex-post-facto laws — provide?", "options": ["No person shall be subjected to a penalty greater than what was prescribed by the law in force at the time the offence was committed", "A person can be punished under a new, harsher law even if it came after the offence", "Laws can be applied retroactively without limitation", "Only civil offences are covered by this protection"], "answer": 0, "explanation": "Correct: Article 20(1) bars retroactively applying a harsher penalty than what existed when the offence occurred — the essence of the 'no ex-post-facto law' protection.", "globalNum": 379}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What does Article 20(2) — protection against double jeopardy — provide?", "options": ["A person cannot be prosecuted and punished for the same offence more than once", "A person can be tried twice for the same offence if new evidence emerges", "Double jeopardy applies only to civil cases", "There is no protection against repeated prosecution in India"], "answer": 0, "explanation": "Correct: Article 20(2) protects against double jeopardy — being punished twice for the same offence. It applies specifically to criminal prosecution and punishment, not merely civil matters.", "globalNum": 380}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What does Article 20(3) — protection against self-incrimination — provide, and what is a notable exception to it?", "options": ["A person cannot be compelled to testify against themselves, but must still submit blood specimens/thumb impressions if asked", "A person cannot be compelled to give any bodily samples under any circumstance", "This protection applies only to accused persons after conviction", "This protection extends to corporations but not individuals"], "answer": 0, "explanation": "Correct: Article 20(3) protects against compelled self-incrimination (testimonial evidence), but courts have held that this doesn't extend to physical evidence like blood samples or thumb impressions, which can still be compelled.", "globalNum": 381}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What does Article 21 guarantee, and from which country's constitution is its phrase 'procedure established by law' borrowed?", "options": ["Protection of life and personal liberty; borrowed from the Japanese Constitution", "Right to property; borrowed from the US Constitution", "Freedom of religion; borrowed from the Irish Constitution", "Right to equality; borrowed from the UK Constitution"], "answer": 0, "explanation": "Correct: Article 21 protects life and personal liberty using the phrase 'procedure established by law,' borrowed from Japan — deliberately different from the US 'due process of law' concept.", "globalNum": 382}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What is the 'Golden Triangle' of Fundamental Rights, and what does it represent?", "options": ["Articles 14, 19, and 21 — together forming the core protection of individual freedom in India", "Articles 12, 13, and 14 — defining the scope of 'State'", "Articles 32, 226, and 136 — the remedy-related articles", "Articles 20, 21, and 22 — the criminal-protection articles"], "answer": 0, "explanation": "Correct: The Golden Triangle refers to Articles 14 (Equality), 19 (Freedoms), and 21 (Life & Liberty), considered the core of individual freedom protection in the Constitution.", "globalNum": 383}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "How did the A.K. Gopalan Case (1950) interpret Article 21, and how did the Maneka Gandhi Case (1978) change this?", "options": ["Gopalan took a narrow view, ruling Art 21 does NOT guarantee 'due process of law'; Maneka Gandhi overturned this, adopting a wide view and introducing 'Due Process of Law'", "Gopalan took a wide view; Maneka Gandhi narrowed it", "Both cases took identical, narrow views", "Maneka Gandhi case predates Gopalan and set the original narrow precedent"], "answer": 0, "explanation": "Correct: Gopalan (1950) took the narrower view that Art 21 doesn't require 'due process,' only 'procedure established by law.' Maneka Gandhi (1978) later overturned this, taking a wider, more rights-protective view and effectively importing 'due process' principles.", "globalNum": 384}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What Fundamental Right did the Maneka Gandhi Case (1978) additionally establish, related to travel?", "options": ["The Right to Travel abroad as a Fundamental Right to personal liberty", "The Right to a passport for all citizens unconditionally", "The Right to free international education", "The Right to dual citizenship"], "answer": 0, "explanation": "Correct: The Maneka Gandhi case established that the Right to Travel abroad is part of personal liberty under Article 21 — though this is not the same as an unconditional right to a passport, which can still be regulated.", "globalNum": 385}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did the K.S. Puttaswamy case establish regarding privacy?", "options": ["Right to Privacy is an intrinsic part of the right to life and personal liberty under Article 21", "Right to Privacy is not protected under the Constitution at all", "Right to Privacy applies only to public officials", "Right to Privacy is a Directive Principle, not a Fundamental Right"], "answer": 0, "explanation": "Correct: The Puttaswamy case declared Right to Privacy an intrinsic part of Article 21 — a landmark expansion of the right to life and personal liberty.", "globalNum": 386}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did M.C. Mehta's PILs establish under Article 21, and what doctrine did the Supreme Court introduce in 1987 as a result?", "options": ["The right to a pollution-free environment, alongside the 'Doctrine of Absolute Liability'", "The right to free legal aid, alongside the 'Doctrine of Waiver'", "The right to shelter, alongside the 'Doctrine of Eclipse'", "The right to education, alongside the 'Doctrine of Pith and Substance'"], "answer": 0, "explanation": "Correct: M.C. Mehta's PILs established the right to a pollution-free environment as part of Article 21, and the Supreme Court introduced the Doctrine of Absolute Liability in 1987 for hazardous industries — a stricter standard than ordinary strict liability.", "globalNum": 387}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did Joseph Shine v. UOI (2018) decide, and what did Navtej Singh Johar (2018) decide?", "options": ["Joseph Shine decriminalised adultery (struck down Section 497 IPC); Navtej Singh Johar decriminalised homosexuality (partially struck down Section 377 IPC)", "Joseph Shine decriminalised homosexuality; Navtej Singh Johar decriminalised adultery", "Both cases dealt with the right to privacy only, without any decriminalisation", "Joseph Shine upheld Section 497 IPC as constitutional"], "answer": 0, "explanation": "Correct: Joseph Shine v. UOI (2018) struck down Section 497 IPC, decriminalising adultery, while Navtej Singh Johar (2018) partially struck down Section 377 IPC, decriminalising consensual homosexual acts and affirming LGBTQ+ dignity, privacy, and equality.", "globalNum": 388}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "In the 'Right to Die' debate, how did Maruti Shripati Dubal v. State of Maharashtra (1987) and P. Rathinam v. Union of India (1994) rule, and how did they conflict?", "options": ["Maruti Dubal held right to die IS part of right to life; Rathinam later held it is NOT — a direct conflict", "Both cases agreed that right to die is part of right to life", "Both cases rejected any connection between right to die and right to life", "Rathinam predates Dubal and established the original 'is part of' ruling"], "answer": 0, "explanation": "Correct: Maruti Shripati Dubal (1987) held the right to die IS part of the right to life, while P. Rathinam (1994) later held the opposite — that it is NOT part of the right to life, creating a direct judicial conflict on this question.", "globalNum": 389}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did Common Cause v. Union of India (2018) recognise, and who delivered this judgment (per the notes)?", "options": ["Recognised passive euthanasia and living wills as valid; delivered by Justice J.B. Pardiwala and Justice K.V. Viswanathan", "Recognised active euthanasia as valid; delivered by Justice Bhagwati", "Rejected euthanasia in all forms; delivered by the Chief Justice alone", "Recognised only living wills, not euthanasia; delivered by a Constitution Bench of 9 judges"], "answer": 0, "explanation": "Correct: Common Cause (2018) recognised passive euthanasia and living wills as valid exercises of the right to die with dignity, and per the notes, this judgment is attributed to Justice J.B. Pardiwala and Justice K.V. Viswanathan.", "globalNum": 390}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did Hussainara Khatoon v. State of Bihar (1979) recognise as part of Article 21, and what did Olga Tellis v. Bombay Municipal Corp. (1985) recognise?", "options": ["Hussainara Khatoon: right to speedy trial; Olga Tellis: right to livelihood", "Hussainara Khatoon: right to livelihood; Olga Tellis: right to speedy trial", "Both cases dealt only with the right to die", "Neither case is related to Article 21"], "answer": 0, "explanation": "Correct: Hussainara Khatoon recognised the right to a speedy trial (also notably the 1st reported PIL), while Olga Tellis recognised the right to livelihood as part of the right to life under Article 21.", "globalNum": 391}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What did Aruna Ramchandra Shanbaug v. UOI (2011) legalise, and how does the 2026 Harish Rana vs. UOI case relate to it?", "options": ["Shanbaug legalised passive euthanasia (right to die with dignity); Harish Rana (2026) saw the SC permit passive euthanasia for a patient in a permanent vegetative state", "Shanbaug legalised active euthanasia; Harish Rana banned all euthanasia", "Shanbaug rejected euthanasia entirely; Harish Rana reversed this in 2026", "Neither case relates to euthanasia"], "answer": 0, "explanation": "Correct: Shanbaug (2011) legalised passive euthanasia, and the more recent Harish Rana vs. UOI (2026) case saw the Supreme Court permit passive euthanasia for a patient in a permanent vegetative state, continuing this line of jurisprudence.", "globalNum": 392}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which Amendment added Article 21A (Right to Education), and what does it guarantee?", "options": ["86th Constitutional Amendment, 2002 — free & compulsory education for children aged 6-14", "44th Constitutional Amendment, 1978 — free education for all ages", "93rd Constitutional Amendment, 2005 — reservation in education", "103rd Constitutional Amendment, 2019 — EWS reservation in education"], "answer": 0, "explanation": "Correct: The 86th CA (2002) added Article 21A, guaranteeing free and compulsory education for children aged 6-14. The other Amendments deal with different subjects (Right to Property removal, OBC/SC/ST reservation, EWS reservation).", "globalNum": 393}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which two cases expanded the scope of Article 21 to include the right to education, even before Article 21A was formally added?", "options": ["Mohini Jain v. State of Karnataka (1992) and Unnikrishnan v. State of Andhra Pradesh (1993)", "Maneka Gandhi (1978) and Gopalan (1950)", "Puttaswamy and M.C. Mehta cases", "Joseph Shine and Navtej Singh Johar cases"], "answer": 0, "explanation": "Correct: Mohini Jain (1992) and Unnikrishnan (1993) judicially recognised education as part of the right to life under Article 21, predating the formal insertion of Article 21A in 2002.", "globalNum": 394}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What is 'Due Process of Law,' and is it explicitly mentioned in the Indian Constitution?", "options": ["It ensures fair and just legal proceedings; it is an American concept, NOT mentioned in the Indian Constitution", "It is explicitly written into Article 21 of the Indian Constitution", "It is a European Union legal concept adopted wholesale into India", "It refers only to procedures for constitutional amendments"], "answer": 0, "explanation": "Correct: 'Due Process of Law' ensures fairness in legal proceedings and is an American concept not textually present in the Indian Constitution — though courts have effectively imported its spirit through cases like Maneka Gandhi.", "globalNum": 395}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Under Article 22(2), within how many hours must an arrested person be produced before the nearest magistrate?", "options": ["24 hours (excluding travel time)", "48 hours (including travel time)", "12 hours, with no exceptions", "72 hours for all cases"], "answer": 0, "explanation": "Correct: Article 22(2) requires production before a magistrate within 24 hours, excluding the time needed for travel from the place of arrest to the court.", "globalNum": 396}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What does Article 22(1) guarantee to an arrested person under ordinary law?", "options": ["The right to consult and be defended by a legal practitioner of their choice", "The right to remain silent indefinitely without any legal consequence", "The right to bail in all cases", "The right to a jury trial"], "answer": 0, "explanation": "Correct: Article 22(1) guarantees the right to consult and be defended by a legal practitioner of one's choice. Bail and jury trial rights are not guaranteed as absolute Article 22 rights, and India does not use jury trials.", "globalNum": 397}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Do the protections in Article 22(1) and (2) apply to enemy aliens and persons under preventive detention?", "options": ["No — Article 22(3) specifically excludes enemy aliens and persons under preventive detention from these protections", "Yes, these protections apply equally to everyone without exception", "Only enemy aliens are excluded; preventive detainees still get full protection", "Only preventive detainees are excluded; enemy aliens get full protection"], "answer": 0, "explanation": "Correct: Article 22(3) excludes both enemy aliens and persons under preventive detention from the Article 22(1)-(2) protections (right to counsel, 24-hour production before a magistrate) — a significant carve-out.", "globalNum": 398}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Under Article 22(4), how long can preventive detention last without approval from an Advisory Board?", "options": ["3 months", "6 months", "1 month", "1 year"], "answer": 0, "explanation": "Correct: Preventive detention cannot exceed 3 months without Advisory Board approval, per Article 22(4) — a safeguard against indefinite detention without independent review.", "globalNum": 399}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What do Articles 22(5) and 22(6) provide regarding preventive detention?", "options": ["22(5): grounds of detention must be communicated with a chance to make representation; 22(6): authorities may withhold facts if disclosure harms public interest", "22(5): detention can never be challenged; 22(6): grounds must always be fully disclosed", "22(5) and 22(6) both deal with the 24-hour magistrate production rule", "22(5): Parliament sets maximum detention period; 22(6): detention cannot exceed 3 months"], "answer": 0, "explanation": "Correct: Article 22(5) requires communicating detention grounds and allowing representation, while 22(6) permits withholding facts if disclosure would harm public interest — balancing the detainee's rights against state security concerns.", "globalNum": 400}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "What is the difference between 'Judicial custody,' 'Punitive detention,' and 'Preventive detention'?", "options": ["Judicial custody: jailed under Magistrate's supervision; Punitive detention: after a crime is committed; Preventive detention: to prevent a possible future offence", "Judicial custody: to prevent future crime; Punitive detention: under Magistrate supervision; Preventive detention: after a crime is committed", "All three terms mean the same thing", "Preventive detention requires a criminal trial first"], "answer": 0, "explanation": "Correct: Judicial custody means detention in jail under a Magistrate's supervision; Punitive detention follows an actual crime; Preventive detention aims to prevent a possible future offence, without requiring a prior trial.", "globalNum": 401}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Matching Article 19(1) freedoms to their specific restriction clauses: which clause restricts (b) Assembly, and which restricts (g) Profession/Trade/Business?", "options": ["19(3) restricts Assembly; 19(6) restricts Profession/Trade/Business", "19(2) restricts Assembly; 19(5) restricts Profession/Trade/Business", "19(6) restricts Assembly; 19(3) restricts Profession/Trade/Business", "19(4) restricts Assembly; 19(2) restricts Profession/Trade/Business"], "answer": 0, "explanation": "Correct: Article 19(3) is the specific restriction clause for the right to assemble peaceably (19(1)(b)), while 19(6) restricts the right to practise a profession/trade/business (19(1)(g)) — each 19(1) freedom has its own dedicated restriction clause (19(2) through 19(6)).", "globalNum": 402}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "Which restriction clause covers the freedoms of Movement (d) and Residence (e) jointly, and on what grounds can they be restricted?", "options": ["19(5), on grounds of public interest and protection of Scheduled Tribes", "19(4), on grounds of sovereignty and morality", "19(2), on grounds of defamation and contempt of court", "19(6), on grounds of state monopoly"], "answer": 0, "explanation": "Correct: Article 19(5) jointly covers restrictions on Movement and Residence freedoms, permitting restrictions in the public interest or to protect the interests of Scheduled Tribes (e.g., restricted areas in tribal regions).", "globalNum": 403}, {"tab": "t15", "tabTitle": "15. Right to Freedom", "q": "According to the notes' alternate mnemonic 'Sweet Aunts Always Make Rice Pudding,' which six freedoms does this represent?", "options": ["Speech, Assembly, Association, Movement, Residence, and Profession", "Speech, Assembly, Association, Movement, Religion, and Property", "Speech, Assembly, Association, Movement, Residence, and Privacy", "Sovereignty, Assembly, Association, Movement, Residence, and Profession"], "answer": 0, "explanation": "Correct: 'Sweet Aunts Always Make Rice Pudding' maps to Speech, Assembly, Association, Movement, Residence, and Profession — the same six original Article 19(1) freedoms as the SAAMRO mnemonic, just phrased differently.", "globalNum": 404}, {"tab": "t16", "tabTitle": "16. Right Against Exploitation", "q": "What does Article 23 prohibit, and what notable exception exists?", "options": ["Prohibits trafficking in human beings and forced labour (begar), except the State can require compulsory service (e.g., during war)", "Prohibits all forms of labour, with no exceptions", "Prohibits only child labour, not adult forced labour", "Prohibits trafficking but permits forced labour by private employers"], "answer": 0, "explanation": "Correct: Article 23 bans human trafficking and forced labour (begar), but allows the State to impose compulsory service (like conscription during war) as an exception — it does not ban all labour, nor does it permit private forced labour.", "globalNum": 405}, {"tab": "t16", "tabTitle": "16. Right Against Exploitation", "q": "Which laws are related to enforcing Article 23's prohibition on trafficking and forced labour?", "options": ["Bonded Labour (Abolition) Act 1976; Immoral Trafficking (Prevention) Act 1956; Minimum Wages Act 1948", "Child and Adolescent Labour Act, 1986 only", "The Citizenship Act, 1955", "The Protection of Civil Rights Act, 1976"], "answer": 0, "explanation": "Correct: The Bonded Labour (Abolition) Act 1976, the Immoral Trafficking of Women & Children (Prevention) Act 1956, and the Minimum Wages Act 1948 are all related to Article 23. The Child Labour Act instead relates to Article 24, and the Protection of Civil Rights Act relates to untouchability (Article 17).", "globalNum": 406}, {"tab": "t16", "tabTitle": "16. Right Against Exploitation", "q": "What does Article 24 prohibit, and what exception allows children to work?", "options": ["Prohibits employing children below 14 in factories, mines, or hazardous occupations, but they can work in safe places during non-school hours", "Prohibits all child employment of any kind, with no exceptions", "Prohibits employment of children below 18 in any occupation", "Allows unrestricted child employment as long as wages are paid"], "answer": 0, "explanation": "Correct: Article 24 bars employing children under 14 in hazardous settings (factories, mines, etc.), but permits work in safe, non-hazardous environments during non-school hours — not a blanket ban on all child work, nor an age-18 threshold.", "globalNum": 407}, {"tab": "t16", "tabTitle": "16. Right Against Exploitation", "q": "Which law specifically relates to enforcing Article 24's prohibition on hazardous child employment?", "options": ["Child and Adolescent Labour (Prohibition & Regulation) Act, 1986", "Bonded Labour (Abolition) Act, 1976", "Minimum Wages Act, 1948", "Immoral Trafficking (Prevention) Act, 1956"], "answer": 0, "explanation": "Correct: The Child and Adolescent Labour (Prohibition & Regulation) Act, 1986 specifically implements Article 24's protections against hazardous child employment. The other laws relate instead to Article 23 (trafficking, forced labour, wages).", "globalNum": 408}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "Article 25 guarantees freedom of conscience and free profession, practice, and propagation of religion — subject to what conditions under 25(1)?", "options": ["Public order, morality, and health", "Only public order, with no other conditions", "National security and defence", "Only the President's discretion"], "answer": 0, "explanation": "Correct: Article 25(1) makes religious freedom subject to public order, morality, and health — not national security specifically, nor presidential discretion.", "globalNum": 409}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "What does Article 25(2) permit the State to do?", "options": ["Make laws to regulate or restrict religious practices (e.g., economic, financial, political activities associated with religion, or social welfare/reform)", "Ban all religious practices entirely", "Only regulate religious practices of minority communities", "Nothing — the State has no power to regulate religion at all"], "answer": 0, "explanation": "Correct: Article 25(2) allows the State to regulate secular activities associated with religious practice and to provide for social welfare/reform — it doesn't ban religion outright, nor target minorities specifically.", "globalNum": 410}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "What four rights does Article 26 guarantee to every religious institution or section?", "options": ["To establish/maintain religious institutions, manage their own religious affairs, own/acquire movable and immovable property, and administer such property in accordance with law", "Only the right to collect donations from followers", "Only the right to build places of worship, with no property rights", "The right to receive unconditional government funding"], "answer": 0, "explanation": "Correct: Article 26 grants religious institutions the rights to establish/maintain institutions, manage their own religious affairs, own/acquire property, and administer it lawfully. It does not guarantee unconditional government funding.", "globalNum": 411}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "Is Article 26 an individual right or a collective right?", "options": ["It guarantees collective freedom of religion (to religious institutions/sections)", "It is purely an individual right, like Article 25", "It applies only to the State, not to religious groups", "It applies only to registered charitable trusts"], "answer": 0, "explanation": "Correct: Article 26 specifically guarantees collective freedom of religion to religious denominations/institutions, distinguishing it from Article 25's more individual-focused freedom of conscience.", "globalNum": 412}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "What does Article 27 prohibit, and what is notably NOT covered by this prohibition?", "options": ["Prohibits levying taxes for promoting any particular religion; but does NOT prohibit fees (e.g., for maintenance of religious sites)", "Prohibits both taxes and fees related to religion", "Prohibits only donations to religious institutions", "Prohibits state funding of any religious activity whatsoever"], "answer": 0, "explanation": "Correct: Article 27 specifically bars taxes for promoting a particular religion, but fees (e.g., charged for specific services like maintaining a shrine) are not covered by this prohibition — an important legal distinction.", "globalNum": 413}, {"tab": "t17", "tabTitle": "17. Freedom of Religion", "q": "What does Article 28 provide regarding religious instruction?", "options": ["No religious instruction shall be provided in any educational institution wholly funded by the State", "Religious instruction is compulsory in all state-funded schools", "Religious instruction is banned in all schools, including private ones", "Only Hindu religious instruction is banned in state schools"], "answer": 0, "explanation": "Correct: Article 28 bars religious instruction specifically in institutions wholly funded by the State — it doesn't extend this ban to all private institutions, nor does it target any single religion.", "globalNum": 414}, {"tab": "t18", "tabTitle": "18. Cultural & Educational Rights", "q": "What does Article 29 protect, and is it exclusively about religious minorities?", "options": ["It protects any section of citizens with a distinct language, script, or culture — it is NOT solely specific to religious minorities, but covers linguistic sections too", "It applies only to religious minorities, excluding linguistic groups", "It applies only to Scheduled Castes and Scheduled Tribes", "It guarantees a right to government funding for cultural festivals"], "answer": 0, "explanation": "Correct: Article 29 protects any distinct linguistic or cultural section's right to conserve its language, script, or culture — the notes explicitly flag that it is not solely specific to minorities, covering both religious and linguistic sections.", "globalNum": 415}, {"tab": "t18", "tabTitle": "18. Cultural & Educational Rights", "q": "Is the term 'Minority' defined anywhere in the Constitution?", "options": ["No — it is nowhere defined in the Constitution", "Yes — it is precisely defined in Article 29", "Yes — it is defined in the 8th Schedule", "Yes — it is defined via the Citizenship Act, 1955"], "answer": 0, "explanation": "Correct: The term 'Minority' is nowhere explicitly defined in the Constitution, despite Articles 29 and 30 dealing with minority rights.", "globalNum": 416}, {"tab": "t18", "tabTitle": "18. Cultural & Educational Rights", "q": "What does Article 30 guarantee to minorities, and what restriction does it place on the State?", "options": ["Minorities can establish and administer educational institutions of their choice; the State cannot discriminate based on religion or language while granting aid", "Minorities cannot establish their own educational institutions at all", "The State must fully fund all minority educational institutions unconditionally", "Only religious minorities (not linguistic ones) get this right"], "answer": 0, "explanation": "Correct: Article 30 lets minorities establish/administer their own educational institutions, and bars the State from discriminating on religious/linguistic grounds when granting aid — it doesn't mandate unconditional full funding, nor limit itself only to religious minorities.", "globalNum": 417}, {"tab": "t18", "tabTitle": "18. Cultural & Educational Rights", "q": "What happened to the original 'Right to Property' under Article 31, and where is it now located?", "options": ["It was removed from Fundamental Rights by the 44th CA, 1978, and placed under Article 300A as a legal right", "It remains a Fundamental Right under Article 31 to this day", "It was strengthened into an absolute right by the 44th CA", "It was transferred to Part IV as a Directive Principle"], "answer": 0, "explanation": "Correct: The 44th CA (1978) removed the Right to Property from Fundamental Rights (Article 31), relocating it as a mere legal right under Article 300A in Part XII — it was weakened, not strengthened, and did not become a DPSP.", "globalNum": 418}, {"tab": "t18", "tabTitle": "18. Cultural & Educational Rights", "q": "What does Article 31A, added by the 1st Constitutional Amendment (1951), protect?", "options": ["Land reform laws (e.g., abolition of zamindari) from being challenged under Articles 14 and 19", "Religious institutions from government interference", "Minority educational institutions from state regulation", "The Right to Property from any future amendment"], "answer": 0, "explanation": "Correct: Article 31A specifically shields land reform laws (like zamindari abolition) from challenges under Articles 14 (equality) and 19 (freedoms) — a targeted protection for a specific category of legislation, not a general shield for religious or educational institutions.", "globalNum": 419}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Who called Article 32 the 'Heart and Soul' of the Indian Constitution?", "options": ["Dr. B. R. Ambedkar", "N.A. Palkhivala", "K.M. Munshi", "Pt. Thakur Das"], "answer": 0, "explanation": "Correct: Dr. B. R. Ambedkar called Article 32 the 'Heart and Soul' of the Constitution, reflecting its crucial role in enforcing Fundamental Rights. The other names are associated with different descriptions — mostly of the Preamble.", "globalNum": 420}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does Article 32(1) guarantee, and what five writs can the Supreme Court issue under 32(2)?", "options": ["The right to approach the SC for enforcing Fundamental Rights, via Habeas Corpus, Mandamus, Prohibition, Certiorari, and Quo-warranto", "The right to approach the SC for any grievance, with only two writs available", "The right to approach only the High Court, not the Supreme Court", "A right that applies only during a National Emergency"], "answer": 0, "explanation": "Correct: Article 32(1) guarantees the right to approach the SC specifically for FR enforcement, and 32(2) empowers it to issue all five writs — Habeas Corpus, Mandamus, Prohibition, Certiorari, and Quo-warranto.", "globalNum": 421}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Under Article 32(3), can Parliament empower courts other than the Supreme Court to exercise writ jurisdiction?", "options": ["Yes — Parliament may empower other courts (but not the Supreme Court or High Courts) to exercise this writ jurisdiction", "No, only the Supreme Court can ever issue writs", "Yes, but only the High Courts can be so empowered", "No, writ jurisdiction can never be delegated by Parliament"], "answer": 0, "explanation": "Correct: Article 32(3) allows Parliament to empower courts other than the SC and HC with writ jurisdiction (HCs already have their own writ power under Article 226 directly, not via this provision).", "globalNum": 422}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Under Article 32(4), when can the right to constitutional remedies be suspended?", "options": ["Only as provided by the Constitution, such as during a National Emergency under Articles 358 and 359", "It can never be suspended under any circumstance", "It can be suspended by any state government at will", "It can be suspended by a simple parliamentary resolution at any time"], "answer": 0, "explanation": "Correct: The right under Article 32 can be suspended only in constitutionally specified circumstances, such as during a National Emergency under Articles 358/359 — not by arbitrary state or parliamentary action.", "globalNum": 423}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "How does the Supreme Court's writ jurisdiction (Article 32) differ from the High Court's (Article 226) regarding the ability to refuse a writ?", "options": ["The SC cannot refuse to issue a writ once a Fundamental Right is violated; the HC can refuse a writ if the matter is not a Fundamental Right", "The SC can refuse writs freely; the HC cannot refuse any writ request", "Both courts have identical discretion to refuse writs", "Only the HC can issue writs; the SC cannot issue any writs"], "answer": 0, "explanation": "Correct: The SC cannot refuse a writ once an FR violation is established (Article 32 is itself a Fundamental Right), while the HC has discretion to refuse if the matter isn't a Fundamental Right violation — though the HC's overall jurisdiction is actually wider (covering both FRs and legal rights).", "globalNum": 424}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Comparing jurisdiction scope: over what does the Supreme Court issue writs (Article 32) versus the High Court (Article 226)?", "options": ["SC: only for violation of Fundamental Rights, throughout India; HC: for violation of Fundamental Rights + Legal Rights (wider), throughout the state", "SC: for Fundamental Rights + Legal Rights; HC: only for Fundamental Rights", "Both have identical jurisdiction scope", "SC: only within one state; HC: throughout all of India"], "answer": 0, "explanation": "Correct: The SC's writ jurisdiction is narrower in subject matter (only FR violations) but broader geographically (all of India), while the HC has wider subject matter jurisdiction (FRs + ordinary legal rights) but is limited to its own state's territory.", "globalNum": 425}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does the writ of Habeas Corpus mean literally, and what does it ensure?", "options": ["'To have the body of' — ensures individual liberty against unlawful detention", "'We command' — orders an official to perform a duty", "'To forbid' — prevents a lower court from exceeding jurisdiction", "'By what authority' — challenges the right to hold public office"], "answer": 0, "explanation": "Correct: Habeas Corpus literally means 'to have the body of' and protects individual liberty against unlawful detention. The other literal meanings belong to Mandamus, Prohibition, and Quo Warranto respectively.", "globalNum": 426}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Against whom can Habeas Corpus be issued, and in what situations can it NOT be issued?", "options": ["Issued against public authorities and private individuals; cannot be issued for lawful detention, contempt of court, or matters outside the court's jurisdiction", "Issued only against private individuals, never public authorities", "Can always be issued regardless of the legality of detention", "Issued only during a National Emergency"], "answer": 0, "explanation": "Correct: Habeas Corpus can be issued against both public authorities and private individuals holding someone unlawfully, but not for lawful detention, contempt of court matters, or cases outside the issuing court's jurisdiction.", "globalNum": 427}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Which famous case is also known as the 'Habeas Corpus case,' related to personal liberty?", "options": ["ADM Jabalpur case", "Kesavananda Bharati case", "Maneka Gandhi case", "Golaknath case"], "answer": 0, "explanation": "Correct: The ADM Jabalpur case is known as the 'Habeas Corpus case,' dealing with personal liberty during the Emergency period. Kesavananda Bharati dealt with basic structure, Maneka Gandhi with personal liberty under Article 21, and Golaknath with Parliament's amending power over FRs.", "globalNum": 428}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does the writ of Mandamus mean, and against whom can it NOT be issued?", "options": ["'We command' — orders a public official to perform a mandatory duty; cannot be issued against a private individual, the President, or the Governor", "'To forbid' — prevents excess jurisdiction; cannot be issued against judicial bodies", "'To be certified' — transfers a case; can be issued against anyone including private individuals", "'By what authority' — challenges public office; cannot be issued against judicial officers"], "answer": 0, "explanation": "Correct: Mandamus ('we command') compels a public official to perform a mandatory (non-discretionary) duty, but cannot be issued against private individuals, the President, or the Governor — key exceptions to its scope.", "globalNum": 429}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does the writ of Prohibition mean, and against whom is it issued?", "options": ["'To forbid' — issued by a superior court to a lower court to prevent it from exceeding its jurisdiction; issued against judicial and quasi-judicial authorities", "'We command' — issued against private individuals to compel action", "'To be certified' — issued only against administrative bodies", "'By what authority' — issued against legislative bodies"], "answer": 0, "explanation": "Correct: Prohibition ('to forbid') is issued by a higher court to a lower judicial/quasi-judicial body to stop it exceeding its jurisdiction. It cannot be issued against administrative authorities, private individuals, or legislative bodies.", "globalNum": 430}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does the writ of Certiorari mean, and how did its scope change after a 1991 Supreme Court ruling?", "options": ["'To be certified' — transfers or nullifies a lower court's decision; since 1991, it can also be issued against administrative bodies (not just judicial/quasi-judicial ones)", "'We command' — orders performance of a duty; its scope never changed", "'To forbid' — prevents jurisdictional overreach; restricted further in 1991", "'By what authority' — challenges public office holders; expanded to cover private individuals in 1991"], "answer": 0, "explanation": "Correct: Certiorari ('to be certified') lets a higher court transfer a pending case to itself or quash a lower court's order made beyond its jurisdiction. In 1991, the SC expanded its scope to also cover administrative bodies, beyond just judicial/quasi-judicial authorities. It still cannot be issued against private individuals or legislative bodies.", "globalNum": 431}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does the writ of Quo Warranto mean, who can file it, and against whom is it issued?", "options": ["'By what authority' — challenges a person's right to hold public office; can be filed by any citizen (not necessarily the aggrieved person); issued against a person holding public office", "'We command' — can be filed only by the aggrieved party; issued against private individuals", "'To forbid' — can be filed by the government only; issued against courts", "'To be certified' — can be filed by any citizen; issued against legislative bodies"], "answer": 0, "explanation": "Correct: Quo Warranto ('by what authority') questions someone's right to hold public office, and uniquely, any citizen can file it — not just an aggrieved party. It's issued against the office-holder, not private individuals or legislative bodies.", "globalNum": 432}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does Article 33 empower Parliament to do, and which Amendment is associated with it?", "options": ["Restrict Fundamental Rights for members of Armed Forces, Police, and Intelligence Agencies to ensure discipline; associated with the 50th Amendment, 1984", "Restrict Fundamental Rights for all citizens during peacetime; 42nd Amendment", "Grant additional Fundamental Rights to the Armed Forces; 44th Amendment", "Abolish Fundamental Rights for government employees entirely; 52nd Amendment"], "answer": 0, "explanation": "Correct: Article 33 (linked to the 50th Amendment, 1984) lets Parliament restrict FRs specifically for Armed Forces, Police, and Intelligence personnel to maintain discipline — not for all citizens generally, nor an outright abolition.", "globalNum": 433}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does Article 34 provide for, and from which country is the underlying concept of 'Martial Law' borrowed?", "options": ["Restrictions on Fundamental Rights while Martial Law is in force in an area; the concept is borrowed from the UK", "Restrictions during a Financial Emergency; borrowed from the USA", "Permanent suspension of all Fundamental Rights; borrowed from Germany", "Restrictions only during Presidential elections; borrowed from Ireland"], "answer": 0, "explanation": "Correct: Article 34 allows for FR restrictions during Martial Law, a concept borrowed from the UK. It is not linked to Financial Emergency, nor is it a permanent suspension of rights.", "globalNum": 434}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does Article 35 provide?", "options": ["It vests exclusive power in Parliament (not State legislatures) to make laws relating to the enforcement of certain Fundamental Rights", "It gives State legislatures exclusive power over all Fundamental Rights", "It allows the judiciary to create new Fundamental Rights", "It abolishes Parliament's role in Fundamental Rights legislation entirely"], "answer": 0, "explanation": "Correct: Article 35 gives Parliament exclusive legislative power over enforcing certain specified Fundamental Rights, ensuring uniformity across India rather than leaving it to individual State legislatures.", "globalNum": 435}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Which Fundamental Rights are available only to citizens of India, and not to foreigners?", "options": ["Articles 15, 16, 19, 29, and 30", "Articles 14, 20, 21, and 22", "Articles 23 and 24", "All Fundamental Rights apply equally to citizens and foreigners"], "answer": 0, "explanation": "Correct: Articles 15, 16, 19, 29, and 30 are citizen-only rights. By contrast, Articles 14 (Equality before law), 20, 21, and 22 apply to 'any person' including foreigners, and 23-24 (against exploitation) also apply broadly.", "globalNum": 436}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "Over which Articles does Parliament enjoy exclusive legislative power (to ensure uniformity, security, and enforcement across India)?", "options": ["Articles 16(3), 17, 23, 32(3), 33, and 34", "Articles 14, 19, and 21 only", "Articles 25 through 28 only", "Articles 29 and 30 only"], "answer": 0, "explanation": "Correct: Parliament has exclusive legislative power over Articles 16(3) (residence for local employment), 17 (untouchability), 23 (trafficking/forced labour), 32(3) (writ jurisdiction of other courts), 33 (armed forces FR restrictions), and 34 (martial law) — a specific, listed set.", "globalNum": 437}, {"tab": "t19", "tabTitle": "19. Constitutional Remedies", "q": "What does Article 31B, added by the 1st CA (1951), do, and what does Article 31C, added by the 25th CA (1971), do?", "options": ["31B: validates 9th Schedule laws, protecting them from judicial review; 31C: protects laws implementing DPSP Articles 39(b)/(c) even if they violate Articles 14/19", "31B: protects DPSP-implementing laws; 31C: validates 9th Schedule laws", "Both Articles deal with the same protection for land reform laws", "31B and 31C both relate to Article 32's writ jurisdiction"], "answer": 0, "explanation": "Correct: Article 31B validates and protects laws in the 9th Schedule from judicial review (added by the 1st CA), while Article 31C (added by the 25th CA) specifically shields laws implementing DPSP Articles 39(b) and 39(c) even against challenges under Articles 14/19.", "globalNum": 438}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Are Directive Principles of State Policy (DPSP) justiciable, and from which country's constitution were they borrowed?", "options": ["Non-justiciable (not enforceable by courts); borrowed from the Irish Constitution", "Fully justiciable, enforceable directly by courts; borrowed from the US Constitution", "Non-justiciable; borrowed from the UK Constitution", "Justiciable only during Emergency; borrowed from the USSR"], "answer": 0, "explanation": "Correct: DPSPs are non-justiciable — courts cannot enforce them directly — and they were borrowed from the Irish Constitution. This distinguishes them fundamentally from Fundamental Rights, which are justiciable.", "globalNum": 439}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What type of obligations do DPSPs place on the State, and what is their broad objective?", "options": ["Positive obligations to promote social & economic justice, aiming to establish social and economic democracy", "Negative obligations restricting state action, aiming for political democracy only", "No obligations at all — purely symbolic text", "Obligations only on the judiciary, not the executive or legislature"], "answer": 0, "explanation": "Correct: DPSPs impose positive obligations on the State to promote social and economic justice, aiming at social and economic democracy — complementing Fundamental Rights' focus on political democracy.", "globalNum": 440}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Who described DPSPs as resembling the 'Instrument of Instructions' from the Government of India Act, 1935?", "options": ["B. R. Ambedkar", "K. C. Wheare", "Granville Austin", "K. T. Shah"], "answer": 0, "explanation": "Correct: B. R. Ambedkar made this comparison. Wheare called them a 'manifesto of aims and aspirations,' Austin called them the 'Conscience of the Constitution,' and K.T. Shah gave the 'cheque' critique.", "globalNum": 441}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Who famously criticised DPSPs as being like 'a cheque payable by the bank at its own convenience'?", "options": ["K. T. Shah", "B. N. Rau", "T. Krishnamachari", "L. M. Singhvi"], "answer": 0, "explanation": "Correct: K. T. Shah made this critical comparison, highlighting DPSPs' non-enforceability. B.N. Rau called them 'moral precepts,' T. Krishnamachari called them a 'dustbin of sentiments,' and Singhvi called them 'life-giving provisions.'", "globalNum": 442}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Who called DPSPs 'moral precepts for the authorities of the state,' and who called them the 'Conscience of the Constitution'?", "options": ["B. N. Rau ('moral precepts'); Granville Austin ('Conscience of the Constitution')", "Granville Austin ('moral precepts'); B. N. Rau ('Conscience of the Constitution')", "K. C. Wheare ('moral precepts'); K. T. Shah ('Conscience of the Constitution')", "T. Krishnamachari ('moral precepts'); L. M. Singhvi ('Conscience of the Constitution')"], "answer": 0, "explanation": "Correct: B. N. Rau called DPSPs 'moral precepts,' and Granville Austin called them the 'Conscience of the Constitution.' Note: this specific 'Conscience' epithet is used for DPSP here, distinct from Fundamental Rights being called the 'Conscience of Constitution' elsewhere — reflecting how such labels can be applied to multiple parts by different commentators.", "globalNum": 443}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Who called DPSPs a 'dustbin of sentiments,' and who called them 'life-giving provisions of the Constitution'?", "options": ["T. Krishnamachari ('dustbin of sentiments'); L. M. Singhvi ('life-giving provisions')", "L. M. Singhvi ('dustbin of sentiments'); T. Krishnamachari ('life-giving provisions')", "K. T. Shah ('dustbin of sentiments'); B. N. Rau ('life-giving provisions')", "B. R. Ambedkar ('dustbin of sentiments'); K. C. Wheare ('life-giving provisions')"], "answer": 0, "explanation": "Correct: T. Krishnamachari's critical remark was 'dustbin of sentiments,' while L. M. Singhvi's positive framing was 'life-giving provisions of the Constitution' — reflecting the range of opinions on DPSP's value.", "globalNum": 444}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 36 define, in relation to Part IV?", "options": ["'State' — using the same meaning as Article 12 in Part III (Fundamental Rights)", "'Citizen,' distinct from the Citizenship Act definition", "'Directive Principle' itself, exhaustively", "'Justiciability' as a legal concept"], "answer": 0, "explanation": "Correct: Article 36 defines 'State' for DPSP purposes using the same meaning given under Article 12 for Fundamental Rights — ensuring consistency in interpreting who is bound by these principles.", "globalNum": 445}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 37 establish about the nature of DPSPs?", "options": ["They are non-justiciable, fundamental to governance, and it is the State's duty to apply them when making laws and policies", "They are fully justiciable and binding like Fundamental Rights", "They apply only to the judiciary, not the legislature or executive", "They are optional guidelines the State may ignore entirely"], "answer": 0, "explanation": "Correct: Article 37 confirms DPSPs are non-justiciable yet fundamental to governance, obligating the State to apply them in law-making and policy — not optional to ignore, but also not court-enforceable.", "globalNum": 446}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 38 direct the State to secure, and which Amendment added the clause on reducing inequalities?", "options": ["A social order for the welfare of people, promoting social/economic/political justice, and reducing inequalities in income/status (44th Amendment, 1978)", "Only economic justice, with the 42nd Amendment adding the inequality clause", "Only political justice, with no amendments involved", "A social order focused solely on gender equality, added by the 73rd Amendment"], "answer": 0, "explanation": "Correct: Article 38 directs the State to secure a welfare-oriented social order promoting social, economic, and political justice, with the 44th Amendment (1978) adding the specific duty to reduce inequalities in income, status, facilities, and opportunities.", "globalNum": 447}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Under Article 39's 'LDCPHC' mnemonic, what does the 'L' stand for, and what does the 'D' stand for?", "options": ["L: Livelihood for all citizens; D: fair Distribution of resources for common good", "L: Legal aid for all; D: Democracy at village level", "L: Land reform; D: Defence of the nation", "L: Liberty of the press; D: Development of industries"], "answer": 0, "explanation": "Correct: In Article 39, 'L' stands for securing an adequate means of Livelihood for all citizens (39(a)), and 'D' stands for fair Distribution of material resources for the common good (39(b)).", "globalNum": 448}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Under Article 39's mnemonic, what does 'C' (first occurrence) stand for, and what does 'P' stand for?", "options": ["C: avoiding Concentration of wealth & production; P: equal Pay for equal work regardless of gender", "C: Children's welfare; P: Political rights for all", "C: Cooperative societies; P: Panchayat establishment", "C: Civil services reform; P: Property rights"], "answer": 0, "explanation": "Correct: The first 'C' in Article 39 stands for avoiding Concentration of wealth and means of production (39(c)), and 'P' stands for equal Pay for equal work for men and women (39(d)).", "globalNum": 449}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Under Article 39, what does 'H' stand for, and what does the final 'C' stand for, including which Amendment added it?", "options": ["H: protecting workers' Health from exploitation (39(e)); C: proper development opportunities for Children (39(f), added by 42nd Amendment, 1976)", "H: Housing for all; C: Cooperative societies, added by 97th Amendment", "H: Healthcare for elderly; C: Civil code, added by 44th Amendment", "H: Human rights; C: Constitutional literacy, added by 86th Amendment"], "answer": 0, "explanation": "Correct: 'H' refers to protecting workers' Health and strength from exploitation (39(e)), and the final 'C' refers to ensuring proper development opportunities for Children (39(f)) — the latter specifically added by the 42nd Amendment, 1976.", "globalNum": 450}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Amendment added Article 39A (Equal Justice & Free Legal Aid), and what does it direct the State to do?", "options": ["42nd CA, 1976 — directs the State to ensure equal justice and provide free legal aid to the poor and weaker sections", "44th CA, 1978 — directs the State to reduce income inequality", "97th CA, 2011 — directs the State to promote cooperative societies", "86th CA, 2002 — directs the State to provide early childhood education"], "answer": 0, "explanation": "Correct: Article 39A, added by the 42nd CA (1976), directs the State to ensure equal justice and provide free legal aid to the poor and economically weaker sections.", "globalNum": 451}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 40 direct the State to establish?", "options": ["Village Panchayats for self-government", "Cooperative societies for farmers", "Free legal aid clinics", "Uniform Civil Code committees"], "answer": 0, "explanation": "Correct: Article 40 directs the State to establish Village Panchayats and organise them for self-government — a foundational basis for later Panchayati Raj developments (73rd Amendment).", "globalNum": 452}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 41 provide for?", "options": ["Right to Work, Education, and Public Assistance in certain cases (like unemployment, old age, sickness)", "Right to a Uniform Civil Code", "Right to organise Village Panchayats", "Right to free legal aid for the poor"], "answer": 0, "explanation": "Correct: Article 41 covers the right to work, education, and public assistance in cases like unemployment, old age, sickness, and disablement — distinct from the specific Panchayat (Art 40) or legal aid (Art 39A) provisions.", "globalNum": 453}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 42 provide for, and what did the K. Umadevi v. Government of Tamil Nadu (2022) case rule in this context?", "options": ["Just and humane working conditions & maternity relief; the SC granted maternity benefits for a third child under the Maternity Benefit (Amendment) Act, 2017", "Uniform Civil Code; the SC mandated a national UCC", "Village Panchayats; the SC ordered new panchayat elections", "Right to work; the SC guaranteed government jobs to all applicants"], "answer": 0, "explanation": "Correct: Article 42 covers just, humane working conditions and maternity relief. In K. Umadevi (2022), the SC extended maternity benefits to cover a third child under the 2017 Amendment Act — a specific application of Article 42's spirit.", "globalNum": 454}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 43 provide for?", "options": ["Living wages and decent working conditions for industries", "Workers' participation in management of industries", "Promotion of cooperative societies", "Uniform Civil Code for all citizens"], "answer": 0, "explanation": "Correct: Article 43 covers living wages and decent working conditions in industries. Workers' participation in management is instead covered by Article 43A, and cooperative societies by 43B.", "globalNum": 455}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Amendment added Article 43A (Workers' Participation in Management), and which added Article 43B (Cooperative Societies)?", "options": ["43A: 42nd Amendment, 1976; 43B: 97th Amendment, 2011", "43A: 97th Amendment, 2011; 43B: 42nd Amendment, 1976", "43A: 44th Amendment, 1978; 43B: 86th Amendment, 2002", "43A and 43B both added by the 73rd Amendment, 1992"], "answer": 0, "explanation": "Correct: Article 43A (workers' participation in industry management) came via the 42nd Amendment (1976), while Article 43B (promoting cooperative societies' formation and democratic management) came via the 97th Amendment (2011).", "globalNum": 456}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 44 provide for?", "options": ["A Uniform Civil Code for all citizens", "Early childhood care and education", "Promotion of educational/economic interests of SC/ST", "Prohibition of intoxicating drinks and drugs"], "answer": 0, "explanation": "Correct: Article 44 directs the State to secure a Uniform Civil Code across the country. Early childhood education is instead covered by Article 45, and SC/ST welfare by Article 46.", "globalNum": 457}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Amendment changed Article 45's subject matter to focus on early childhood care and education for children below age six?", "options": ["86th Constitutional Amendment, 2002", "42nd Constitutional Amendment, 1976", "97th Constitutional Amendment, 2011", "44th Constitutional Amendment, 1978"], "answer": 0, "explanation": "Correct: The 86th CA (2002) — the same Amendment that added Article 21A (Right to Education for ages 6-14) — repurposed Article 45 to focus on early childhood care and education for children under six.", "globalNum": 458}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 46 direct the State to promote?", "options": ["Educational & economic interests of SCs, STs, and other weaker sections", "Uniform Civil Code implementation", "Prohibition of cow slaughter", "Separation of judiciary from executive"], "answer": 0, "explanation": "Correct: Article 46 focuses on promoting the educational and economic interests of Scheduled Castes, Scheduled Tribes, and other weaker sections, protecting them from social injustice and exploitation.", "globalNum": 459}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 47 direct the State to do?", "options": ["Prohibit the consumption of intoxicating drinks and drugs injurious to health", "Prohibit cow slaughter specifically", "Promote agriculture and animal husbandry generally", "Protect monuments and national heritage"], "answer": 0, "explanation": "Correct: Article 47 directs the State to work towards prohibiting intoxicating drinks and drugs that harm health (and also improving public health generally) — cow slaughter is instead specifically addressed under Article 48.", "globalNum": 460}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 48 direct regarding agriculture, and what specific prohibition does it mention?", "options": ["Organise agriculture and animal husbandry on modern lines, and prohibit the slaughter of cows, calves, and other useful cattle", "Only promote organic farming, with no mention of cattle", "Ban all forms of animal husbandry", "Promote fisheries exclusively"], "answer": 0, "explanation": "Correct: Article 48 covers organising agriculture/animal husbandry on modern scientific lines and specifically directs efforts to prohibit slaughter of cows, calves, and other useful cattle.", "globalNum": 461}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Amendment added Article 48A (Protection of Environment, Forests, and Wildlife), and in what year?", "options": ["42nd Amendment, 1976", "44th Amendment, 1978", "86th Amendment, 2002", "97th Amendment, 2011"], "answer": 0, "explanation": "Correct: Article 48A was added by the 42nd Amendment (1976), the same wide-ranging Amendment that also added Articles 39(f), 39A, and 43A.", "globalNum": 462}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What do Articles 49 and 50 respectively provide for?", "options": ["Article 49: protection of monuments and national heritage; Article 50: separation of judiciary from the executive", "Article 49: separation of judiciary; Article 50: protection of monuments", "Both articles deal with international peace", "Article 49: Uniform Civil Code; Article 50: agriculture"], "answer": 0, "explanation": "Correct: Article 49 protects monuments/places/objects of national/historic/artistic interest, while Article 50 directs the State to separate the judiciary from the executive in public services.", "globalNum": 463}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What does Article 51 direct the State to promote, and what does its sub-clause 51(1) specifically mention?", "options": ["International peace and security; 51(1) mentions settlement of international disputes by arbitration", "Only domestic peace; 51(1) mentions state-level arbitration", "National integration only; 51(1) mentions inter-state disputes", "Religious harmony; 51(1) mentions inter-faith dialogue"], "answer": 0, "explanation": "Correct: Article 51 covers promoting international peace and security, with 51(1) specifically encouraging settlement of international disputes through arbitration — the concluding article of Part IV.", "globalNum": 464}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Although not mentioned in the Constitution itself, DPSPs are classified into three categories. Which Articles fall under 'Socialist' principles?", "options": ["Articles 38, 39, 41, 42, 43, 43A, and 47", "Articles 40, 43, 46, 47, and 48", "Articles 44, 45, 48A, 49, 50, and 51", "Articles 36 and 37 only"], "answer": 0, "explanation": "Correct: Socialist principles (aiming at social/economic equality and welfare state) include Articles 38, 39, 41, 42, 43, 43A, and 47. Gandhian principles cover a different, overlapping set (40, 43, 46, 47, 48), and Liberal-Intellectual principles cover 44, 45, 48A, 49, 50, 51.", "globalNum": 465}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Articles fall under the 'Gandhian' classification of DPSPs, emphasising decentralised governance and self-sufficiency?", "options": ["Articles 40, 43, 46, 47, and 48", "Articles 38, 39, 41, 42, and 43A", "Articles 44, 45, 48A, 49, 50, and 51", "Articles 36 and 37"], "answer": 0, "explanation": "Correct: Gandhian principles include Articles 40 (Panchayats), 43, 46 (SC/ST welfare), 47 (prohibition), and 48 (agriculture/cattle) — reflecting Gandhi's emphasis on village self-governance and rural welfare.", "globalNum": 466}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which Articles fall under the 'Liberal-Intellectual' classification of DPSPs?", "options": ["Articles 44, 45, 48A, 49, 50, and 51", "Articles 38, 39, 41, 42, and 43", "Articles 40, 43, 46, 47, and 48", "Articles 39A and 43B only"], "answer": 0, "explanation": "Correct: Liberal-Intellectual principles include Articles 44 (UCC), 45 (early childhood education), 48A (environment), 49 (monuments), 50 (judicial separation), and 51 (international peace) — emphasising individual freedoms and a rational, modern state.", "globalNum": 467}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Which DPSP-related provisions were added by the 42nd Constitutional Amendment (1976)?", "options": ["Article 39(f) — children's healthy development; Article 39A — equal justice/free legal aid; Article 43A — workers' participation in industry", "Article 38 — reducing inequalities", "Article 45 — early childhood care", "Article 43B — cooperative societies"], "answer": 0, "explanation": "Correct: The 42nd CA (1976) added 39(f), 39A, and 43A (plus 48A). Article 38's inequality clause instead came via the 44th CA (1978); Article 45 via the 86th CA (2002); Article 43B via the 97th CA (2011).", "globalNum": 468}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "How do Fundamental Rights and DPSPs differ in terms of obligations and enforceability?", "options": ["FRs impose negative obligations and are justiciable (courts can invalidate violating laws); DPSPs impose positive obligations and are non-justiciable (courts cannot invalidate violating laws)", "FRs impose positive obligations; DPSPs impose negative obligations", "Both are equally justiciable and enforceable by courts", "Neither FRs nor DPSPs are enforceable by any authority"], "answer": 0, "explanation": "Correct: FRs are negative obligations (restraining state action) and justiciable, while DPSPs are positive obligations (directing state action) and non-justiciable — courts can strike down laws violating FRs but not laws that merely fail to implement DPSPs.", "globalNum": 469}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "How do FRs and DPSPs differ in their focus — individual versus societal welfare, and enforcement requiring legislation?", "options": ["FRs are oriented towards individual welfare and are automatically enforceable; DPSPs focus on societal welfare and require legislative enactment to take effect", "FRs focus on societal welfare; DPSPs focus on individual welfare", "Both require legislative enactment equally", "Neither focuses on welfare of any kind"], "answer": 0, "explanation": "Correct: FRs protect individual welfare and are automatically enforceable (backed by legal sanctions), while DPSPs focus on broader societal welfare and require legislative action to be given effect (backed only by moral/political sanctions).", "globalNum": 470}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "In the Champakam Dorairajan Case (1951), what did the Supreme Court rule regarding the relationship between FRs and DPSPs?", "options": ["FRs would prevail over DPSPs, and FRs are amendable", "DPSPs would prevail over FRs in all cases", "Neither FRs nor DPSPs could ever be amended", "DPSPs became justiciable as a result of this case"], "answer": 0, "explanation": "Correct: The Court ruled that FRs prevail over DPSPs in case of conflict, and that FRs themselves are amendable — a ruling that eventually led to the 1st Constitutional Amendment adding Article 15(4).", "globalNum": 471}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What did the Golaknath Case (1967) rule regarding Parliament's power over Fundamental Rights?", "options": ["Parliament cannot revoke or amend Fundamental Rights", "Parliament has unlimited power to amend any part of the Constitution", "DPSPs automatically override Fundamental Rights", "The judiciary has no power of review over constitutional amendments"], "answer": 0, "explanation": "Correct: Golaknath (1967) held Parliament cannot amend/revoke Fundamental Rights — a strict view that was later modified by subsequent Amendments and the Kesavananda Bharati case's basic structure doctrine.", "globalNum": 472}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What happened in the sequence of events following the Golaknath Case: what did the 24th Amendment (1971) do, and what did the 25th Amendment (which inserted Article 31C) do?", "options": ["24th CA: empowered Parliament to amend FRs; 25th CA: protected DPSP-implementing laws (Art 39(b)/(c)) from Article 14/19 challenges", "24th CA: inserted Article 31C; 25th CA: empowered Parliament to amend FRs", "Both Amendments did the same thing — protect DPSP laws", "Neither Amendment relates to the Golaknath aftermath"], "answer": 0, "explanation": "Correct: The 24th CA (1971) reversed Golaknath by empowering Parliament to amend FRs, and the 25th CA inserted Article 31C, protecting laws implementing DPSP Articles 39(b)/(c) from challenges under Articles 14 and 19.", "globalNum": 473}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "Under Article 31C (as inserted by the 25th Amendment), what could not be questioned in court, and what did the Kesavananda Bharati Case (1973) later do to part of this provision?", "options": ["Laws implementing Art 39(b)/(c) could not be questioned in court; the Kesavananda Bharati Case declared the 2nd provision (restricting judicial review) unconstitutional", "All laws of Parliament could not be questioned; Kesavananda upheld this fully", "DPSP laws became fully justiciable after Kesavananda", "Kesavananda struck down Article 31C entirely, including its 1st provision"], "answer": 0, "explanation": "Correct: Article 31C originally barred courts from questioning whether a law genuinely implemented Article 39(b)/(c) DPSPs. The Kesavananda Bharati Case (13-judge bench, 1973) struck down this specific bar on judicial review (the 2nd provision) as unconstitutional, while upholding Parliament's general power to amend FRs (subject to basic structure).", "globalNum": 474}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What core principle did the Kesavananda Bharati Case (1973) establish regarding Parliament's amending power?", "options": ["Parliament can amend Fundamental Rights but cannot disturb the Basic Structure of the Constitution", "Parliament cannot amend Fundamental Rights at all, under any circumstances", "Parliament has completely unrestricted amending power with no limits", "Only the judiciary can amend Fundamental Rights, not Parliament"], "answer": 0, "explanation": "Correct: The landmark Kesavananda Bharati ruling established that Parliament CAN amend Fundamental Rights, but any amendment cannot destroy or alter the Constitution's 'Basic Structure' — a limitation that remains foundational Indian constitutional law today.", "globalNum": 475}, {"tab": "t20", "tabTitle": "20. DPSP", "q": "What did the Minerva Mills Case (1980) establish regarding the relationship between FRs and DPSPs?", "options": ["The Indian Constitution is founded on a bedrock balance between Fundamental Rights and DPSPs", "DPSPs must always be sacrificed in favour of Fundamental Rights", "Fundamental Rights must always be sacrificed in favour of DPSPs", "Neither FRs nor DPSPs form part of the Constitution's foundation"], "answer": 0, "explanation": "Correct: Minerva Mills (1980) affirmed that the Constitution rests on a balanced relationship between FRs and DPSPs — neither should completely
