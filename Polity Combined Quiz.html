<script id="quiz-data" type="application/json">
[{"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Who granted the East India Company its founding charter, and when?", "options": ["King James I, on 24 Sept 1599", "Queen Elizabeth I, on 31 Dec 1600", "Queen Victoria, on 1 Jan 1858", "King Charles II, on 31 Dec 1600"], "answer": 1, "explanation": "Correct: Queen Elizabeth I granted the EIC a charter on 31 Dec 1600, giving it the exclusive right to trade with the East, including India. James I and Charles II were later Stuart monarchs unconnected with this founding charter. Queen Victoria's era (1858) relates to the end of Company rule (Government of India Act 1858), not its start.", "globalNum": 1}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Regulating Act, 1773, the Governor of Bengal was converted into which post?", "options": ["Viceroy of India", "Governor-General of India", "Governor-General of Bengal", "President of the Board of Control"], "answer": 2, "explanation": "Correct: The Act converted the Governor of Bengal into the Governor-General of Bengal. 'Governor-General of India' came later, via the Charter Act of 1833. 'Viceroy' was introduced still later by the Government of India Act, 1858. The Board of Control did not exist yet in 1773 — it was created in 1784.", "globalNum": 2}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "How many members made up the executive council created under the Regulating Act, 1773 to assist the Governor-General?", "options": ["3 members", "4 members", "6 members", "1 member"], "answer": 1, "explanation": "Correct: The Act created an executive council of 4 members. 6 new members were added to the Council much later, under the Charter Act of 1853, as Legislative Councillors — a different provision entirely.", "globalNum": 3}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Who was the 1st Governor-General of Bengal under the Regulating Act, 1773?", "options": ["Lord William Bentinck", "Warren Hastings", "Lord Dalhousie", "Robert Clive"], "answer": 1, "explanation": "Correct: Warren Hastings was the 1st Governor-General of Bengal. Lord William Bentinck became the 1st Governor-General of India later, under the Charter Act of 1833. Dalhousie and Clive were other notable Company-era administrators but held different positions.", "globalNum": 4}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Regulating Act, 1773, the Bombay and Madras Presidencies were made:", "options": ["Fully independent of Bengal", "Subordinate to the Governor-General of Bengal", "Merged into the Bengal Presidency", "Directly controlled by the Board of Control"], "answer": 1, "explanation": "Correct: Bombay and Madras were made subordinate to the Governor-General of Bengal. They were not merged or made independent, and the Board of Control did not yet exist in 1773.", "globalNum": 5}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Supreme Court established at Calcutta in 1774 under the Regulating Act was composed of:", "options": ["1 Chief Justice + 3 other judges", "1 Chief Justice + 5 other judges", "A Chief Justice alone", "2 Chief Justices + 2 judges"], "answer": 0, "explanation": "Correct: The Supreme Court at Calcutta (1774) had 1 Chief Justice and 3 other judges. The other options misstate the composition given in the notes.", "globalNum": 6}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "According to the notes, which body was created under the Regulating Act, 1773 to manage commercial functions (moving budget resolutions etc.)?", "options": ["Court of Directors", "Board of Control", "Supreme Court", "Privy Council"], "answer": 1, "explanation": "Correct: The notes state the Board of Control was created for this purpose under the Regulating Act, 1773. The Court of Directors is described separately as reporting on Revenue, Civil & Military affairs. The Supreme Court was a judicial body, and the Privy Council is not mentioned in this Act.", "globalNum": 7}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Which of the following was also a feature of the Regulating Act, 1773?", "options": ["It allotted Rs. 1 Lakh for Indian education", "It prohibited company servants from taking bribes", "It ended the EIC's China trade monopoly", "It created the Dual Control System"], "answer": 1, "explanation": "Correct: The Regulating Act, 1773 prohibited company servants from taking bribes. Rs. 1 Lakh for education came under the Charter Act, 1813 (a separate Rs. 1 Lakh was for promoting Christianity under 1773). Ending the China trade monopoly came with the Charter Act, 1833, and the Dual Control System was created by Pitt's India Act, 1784.", "globalNum": 8}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Regulating Act, 1773, Rs. 1 Lakh was allotted for what purpose?", "options": ["Promoting Christianity", "Promoting Indian education", "Building the Calcutta Supreme Court", "Funding the Board of Control"], "answer": 0, "explanation": "Correct: Rs. 1 Lakh was allotted to promote Christianity under the 1773 Act. Rs. 1 Lakh for Indian education came later, under the Charter Act, 1813. The Court and Board were institutional creations, not funding purposes.", "globalNum": 9}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Regulating Act, 1773, the Court of Directors was responsible for reporting on which affairs from the Presidents/Governor-General?", "options": ["Judicial and religious affairs", "Revenue, Civil & Military affairs", "Only military affairs", "Trade with China only"], "answer": 1, "explanation": "Correct: The Court of Directors reported on Revenue, Civil & Military affairs. The other options either narrow this incorrectly or refer to unrelated matters.", "globalNum": 10}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Peel Commission of 1858 was set up in the aftermath of which event, and what did it do?", "options": ["The 1600 EIC charter; regulated trade", "The 1773 Regulating Act; created the Supreme Court", "The 1857 Revolt; suggested reforms that redesigned the Indian military", "The 1833 Charter Act; ended Company trade"], "answer": 2, "explanation": "Correct: The Peel Commission (1858) followed the 1857 Revolt and its accepted recommendations led to a redesign of the Indian military. The other options misattribute the timing and purpose.", "globalNum": 11}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "What was the main purpose of the Amending Act, 1781?", "options": ["To extend the EIC's trade monopoly by 20 years", "To rectify defects of the Regulating Act, 1773, and exempt the Governor-General & Council from Supreme Court jurisdiction", "To create the Dual Control System", "To introduce open competition for civil services"], "answer": 1, "explanation": "Correct: The Amending Act, 1781 rectified defects in the Regulating Act, 1773 and exempted the Governor-General & Council from the Supreme Court's jurisdiction. Trade monopoly extension was under the Charter Act, 1793; the Dual Control System came from Pitt's India Act, 1784; and open competition for civil services began with the Charter Act, 1853.", "globalNum": 12}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Pitt's India Act, 1784 is named after whom, and what system did it introduce?", "options": ["William Pitt the Elder; Single Control System", "William Pitt the Younger; Dual Control System", "Robert Peel; Triple Control System", "Warren Hastings; Dual Control System"], "answer": 1, "explanation": "Correct: Pitt's India Act, 1784 is named after William Pitt the Younger and introduced the Dual Control System. Pitt the Elder and Peel are unrelated to this Act's naming, and Warren Hastings was a Governor-General, not the Act's namesake.", "globalNum": 13}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Dual Control System created by Pitt's India Act, 1784, who managed administrative functions?", "options": ["Court of Directors", "Board of Control", "Governor-General alone", "Supreme Court"], "answer": 1, "explanation": "Correct: The Board of Control managed administrative functions, while the Court of Directors managed commercial functions — that is the essence of 'Dual Control.' The Governor-General and Supreme Court were not part of this dual arrangement.", "globalNum": 14}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "What were Company territories in India first officially called, as per Pitt's India Act, 1784?", "options": ["\"Crown Territories of India\"", "\"British possessions in India\"", "\"Indian Empire\"", "\"Company Provinces\""], "answer": 1, "explanation": "Correct: They were first called 'British possessions in India.' 'Indian Empire' and 'Crown Territories' reflect later Crown-rule terminology (post-1858), not the 1784 Act.", "globalNum": 15}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1793 extended the EIC's trade monopoly by how many years?", "options": ["10 years", "20 years", "30 years", "Indefinitely, with no time limit"], "answer": 1, "explanation": "Correct: The Charter Act, 1793 extended the trade monopoly by 20 years. The Charter Act, 1853 later extended Company rule but, notably, without specifying a period — unlike 1793's fixed extension.", "globalNum": 16}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Under the Charter Act, 1793, the Commander-in-Chief:", "options": ["Automatically became a member of the Governor-General's council", "Was not to be a member of the Governor-General's council, unless so appointed", "Replaced the Governor-General", "Headed the Board of Control"], "answer": 1, "explanation": "Correct: The Commander-in-Chief was not to be a member of the council unless specifically appointed. The other options describe roles or powers not given to the Commander-in-Chief by this Act.", "globalNum": 17}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1813 ended the EIC's trade monopoly except for which items?", "options": ["Cotton and spices", "Tea and China trade", "Opium and salt", "Textiles and indigo"], "answer": 1, "explanation": "Correct: The 1813 Act ended the general monopoly but retained it for tea and the China trade. This exception was later removed too — the Charter Act, 1833 ended even the China trade monopoly.", "globalNum": 18}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Which of these was also introduced by the Charter Act, 1813?", "options": ["Open competition for civil services", "Authorisation for local governments to impose taxes, and Rs. 1 Lakh for Indian education", "The Dual Control System", "Legislative Councillors added to the Council"], "answer": 1, "explanation": "Correct: The 1813 Act authorised local governments to impose taxes and allotted Rs. 1 Lakh for Indian education. Open competition for civil services and added Legislative Councillors both came in 1853; the Dual Control System came in 1784.", "globalNum": 19}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1813 allowed which group to come to India for the first time?", "options": ["European traders", "Christian Missionaries", "Company shareholders", "Foreign judges"], "answer": 1, "explanation": "Correct: The 1813 Act allowed Christian Missionaries to enter India to promote Christianity. The other groups are not the subject of this specific provision.", "globalNum": 20}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Who founded the Serampore Mission (1800), described in the notes as the 1st Christian Missionary Organisation in India, and who was the 1st Christian Missionary in India overall?", "options": ["William Carey founded it; Thomas Apostle was the 1st missionary", "Warren Hastings founded it; William Carey was the 1st missionary", "Lord Bentinck founded it; William Carey was the 1st missionary", "William Carey founded it; Robert Clive was the 1st missionary"], "answer": 0, "explanation": "Correct: William Carey founded the Serampore Mission in 1800, while Thomas Apostle is noted as the 1st Christian Missionary in India overall (much earlier than 1800). Hastings, Bentinck, and Clive were administrators, not missionaries.", "globalNum": 21}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1833 changed the title 'Governor-General of Bengal' to which new title, and what was this Act also known as?", "options": ["'Viceroy of India'; known as the 'India Act'", "'Governor-General of India'; known as the 'Saint Helena Act'", "'Governor-General of India'; known as the 'Pitt's Act'", "'Chief Governor'; known as the 'Regulating Act'"], "answer": 1, "explanation": "Correct: The title became 'Governor-General of India,' and the Act is also called the 'Saint Helena Act.' 'Viceroy' came only in 1858; Pitt's Act and the Regulating Act are different, earlier Acts (1784 and 1773).", "globalNum": 22}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Who was the 1st Governor-General of India under the Charter Act, 1833?", "options": ["Warren Hastings", "Lord William Bentinck", "Lord Dalhousie", "Lord Canning"], "answer": 1, "explanation": "Correct: Lord William Bentinck was the 1st Governor-General of India. Warren Hastings was the earlier 1st Governor-General of Bengal (1773); Canning was the last Governor-General under Company rule and 1st Viceroy in 1858.", "globalNum": 23}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Besides changing the Governor-General's title, what else did the Charter Act, 1833 do?", "options": ["It deprived Bombay & Madras Governors of legislative powers and ended EIC's activities as a commercial body", "It created the Board of Control", "It introduced open competition for civil services", "It established the Calcutta Supreme Court"], "answer": 0, "explanation": "Correct: The 1833 Act deprived the Bombay and Madras Governors of their legislative powers and ended the EIC's commercial activities entirely (it became purely administrative). The Board of Control was created in 1784, open competition began in 1853, and the Supreme Court was set up in 1774.", "globalNum": 24}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1853 separated which two functions of the Governor-General's Council?", "options": ["Judicial and executive functions", "Legislative and administrative functions", "Military and civil functions", "Commercial and financial functions"], "answer": 1, "explanation": "Correct: The 1853 Act separated legislative and administrative functions of the Council. The other pairings are not what this specific Act addressed.", "globalNum": 25}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "How many new members were added to the Governor-General's Council as Legislative Councillors under the Charter Act, 1853?", "options": ["4", "6", "8", "12"], "answer": 1, "explanation": "Correct: 6 new members were added as Legislative Councillors. This is distinct from the 4-member executive council created way back in 1773.", "globalNum": 26}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Which important reform to civil service recruitment did the Charter Act, 1853 introduce?", "options": ["Reservation for Indian candidates", "Open Competition for Civil Services", "Abolition of the Company's civil service", "Compulsory training in England"], "answer": 1, "explanation": "Correct: The 1853 Act introduced Open Competition for Civil Services. The other options are not features attributed to this Act in the notes.", "globalNum": 27}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "Regarding the extension of Company rule, how did the Charter Act, 1853 differ from earlier Charter Acts like that of 1793?", "options": ["It extended Company rule by 20 years, same as 1793", "It extended Company rule without specifying a time period, unlike 1793's fixed 20-year extension", "It ended Company rule entirely", "It extended rule by 30 years"], "answer": 1, "explanation": "Correct: Unlike the Charter Act, 1793 (a fixed 20-year extension), the 1853 Act extended Company rule without specifying any time period. This unusual, open-ended extension foreshadowed the eventual end of Company rule in 1858.", "globalNum": 28}, {"tab": "t1", "tabTitle": "1. Company Rule (1600–1858)", "q": "The Charter Act, 1853 also introduced which form of representation in the Indian Legislative Council?", "options": ["Direct public elections", "Local Representation", "Religious minority representation", "Princely state representation"], "answer": 1, "explanation": "Correct: The 1853 Act introduced Local Representation in the Indian Legislative Council. Direct public elections would come much later, and the other options are not features of this Act.", "globalNum": 29}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1858 (also called the 'Queen's Proclamation') did which of the following?", "options": ["Abolished the East India Company and transferred power to the British Crown", "Introduced dyarchy in the provinces", "Created separate electorates for Muslims", "Established the Reserve Bank of India"], "answer": 0, "explanation": "Correct: The 1858 Act abolished the EIC and transferred government, territories, and revenues to the British Crown. Dyarchy came in 1919, separate Muslim electorates in 1909, and the RBI was established under the 1935 Act.", "globalNum": 30}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Under the Government of India Act, 1858, who paid the members of the Board of Control and its staff?", "options": ["The British Parliament", "Indian Revenue", "The East India Company's remaining funds", "The Secretary of State's personal office"], "answer": 1, "explanation": "Correct: Board of Control members and staff were paid out of Indian Revenue. This detail highlights that even Crown administration in London was funded by India itself.", "globalNum": 31}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The 1858 Act re-designated the Governor-General of India as:", "options": ["Chief Commissioner of India", "Viceroy of India", "President of India", "Chairman of the Board of Control"], "answer": 1, "explanation": "Correct: The Governor-General was re-designated Viceroy of India. The other titles either did not exist at the time or belong to different eras (President of India came in 1950).", "globalNum": 32}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Who was the 1st Viceroy of India, and which Indian is noted alongside him in the notes?", "options": ["Lord Canning, with Sir Dinkar Rao", "Lord Dalhousie, with Raja of Benaras", "Lord Mountbatten, with C. Rajagopalachari", "Warren Hastings, with Satyendra Prasad Sinha"], "answer": 0, "explanation": "Correct: Lord Canning was the 1st Viceroy, noted alongside Sir Dinkar Rao. Mountbatten and Rajagopalachari relate to 1947 (last/first Governors-General of independent India), not the 1858 Viceroyalty.", "globalNum": 33}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The 1858 Act created which new office by abolishing the Board of Control and Court of Directors, giving it complete control over Indian administration?", "options": ["Secretary of State for India", "Viceroy's Executive Council", "Central Public Service Commission", "Federal Court"], "answer": 0, "explanation": "Correct: The Secretary of State for India was created, absorbing the functions of the abolished Board of Control and Court of Directors. The Executive Council, Public Service Commission, and Federal Court are separate institutions from other Acts.", "globalNum": 34}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "What system did the Government of India Act, 1858 end?", "options": ["Provincial autonomy", "The system of Dual Government", "The system of separate electorates", "Indirect elections"], "answer": 1, "explanation": "Correct: The 1858 Act ended the Dual Government system (the earlier Court of Directors/Board of Control split). Provincial autonomy came in 1935; separate electorates in 1909; indirect elections in 1892.", "globalNum": 35}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Under the Indian Council Act, 1861, which three Indians did Viceroy Lord Canning nominate to the legislative council in 1862?", "options": ["Raja of Benaras, Maharaja of Patiala, Sir Dinkar Rao", "Satyendra Prasad Sinha, C. Rajagopalachari, Mountbatten", "Warren Hastings, William Bentinck, Dalhousie", "Raja of Benaras, Satyendra Prasad Sinha, Dinkar Rao"], "answer": 0, "explanation": "Correct: Canning nominated the Raja of Benaras, the Maharaja of Patiala, and Sir Dinkar Rao. Satyendra Prasad Sinha became the 1st Indian on the Viceroy's Executive Council much later, under the 1909 Act.", "globalNum": 36}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Indian Council Act, 1861 initiated a process of decentralisation by:", "options": ["Creating the Secretary of State for India", "Restoring legislative powers to Bombay & Madras Presidencies", "Introducing dyarchy in provinces", "Establishing an All India Federation"], "answer": 1, "explanation": "Correct: It restored legislative powers to Bombay and Madras Presidencies, beginning decentralisation. The Secretary of State's office dates to 1858, dyarchy to 1919, and the All India Federation proposal to 1935.", "globalNum": 37}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Besides decentralisation, the Indian Council Act, 1861 also provided for new legislative councils in which provinces?", "options": ["Bengal, NW Provinces & Punjab", "Bombay, Madras & Assam", "Bihar, Bengal & Bombay", "Punjab, Bihar & Assam"], "answer": 0, "explanation": "Correct: New legislative councils were provided for Bengal, the North-Western Provinces, and Punjab. The other lists mix up provinces addressed by different Acts (e.g., Bihar and Assam feature in the 1935 Act's bicameralism list).", "globalNum": 38}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "What key feature did the Indian Councils Act, 1892 introduce?", "options": ["Separate electorate for Muslims", "Indirect elections, and permission to discuss financial matters/question the executive", "Dyarchy in provinces", "Adult franchise"], "answer": 1, "explanation": "Correct: The 1892 Act introduced indirect elections and allowed members to discuss financial matters and question the executive. Separate Muslim electorates came in 1909, dyarchy in 1919, and (limited) adult franchise extension in 1935.", "globalNum": 39}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Indian Councils Act, 1909, also known as the Morley-Minto Reforms, is chiefly known for introducing:", "options": ["Provincial autonomy", "A separate electorate for Muslims", "Bicameralism at the Centre", "The Federal Court"], "answer": 1, "explanation": "Correct: The 1909 Act introduced a separate electorate for Muslims. Provincial autonomy and the Federal Court came with the 1935 Act, and Centre bicameralism came with the 1919 Act.", "globalNum": 40}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Who became the 1st Indian to join the Viceroy's Executive Council, under the 1909 Act?", "options": ["C. Rajagopalachari", "Satyendra Prasad Sinha", "Sir Dinkar Rao", "Raja of Benaras"], "answer": 1, "explanation": "Correct: Satyendra Prasad Sinha was the 1st Indian on the Viceroy's Executive Council. Rajagopalachari later became independent India's 1st and last Indian Governor-General (1947-48); Dinkar Rao and the Raja of Benaras were nominated to the legislative council back in 1862.", "globalNum": 41}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1919 (Montagu-Chelmsford Reforms) introduced 'Dyarchy' in the provinces. What did this mean?", "options": ["Subjects were split into Transferred (e.g. Health, Education) and Reserved (e.g. Police, Justice) categories", "All provincial subjects were handled solely by the Governor-General", "Two Viceroys ruled simultaneously", "Provinces were merged into a single federation"], "answer": 0, "explanation": "Correct: Dyarchy split subjects into 'Transferred' subjects (like Health, Education, Local Self-government, Agriculture — where the Governor was responsible along with ministers) and 'Reserved' subjects (like Police, Justice, Prison, Land Revenue, Finance — where the Governor-General was not responsible to the legislature). The other options misdescribe dyarchy entirely.", "globalNum": 42}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Which subjects were classified as 'Reserved' under the dyarchy introduced by the Government of India Act, 1919?", "options": ["Health, Education, Agriculture", "Police, Justice, Prison, Land Revenue, Finance", "Local Self-Government, Agriculture, Health", "Trade, Commerce, Railways"], "answer": 1, "explanation": "Correct: Police, Justice, Prison, Land Revenue, and Finance were 'Reserved' subjects, where the Governor-General was not responsible to the legislature. Health, Education, Local Self-Government, and Agriculture were 'Transferred' subjects instead.", "globalNum": 43}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1919 introduced bicameralism and direct elections at the Centre, with which two houses?", "options": ["Lok Sabha and Rajya Sabha", "Council of State (Upper House) and Legislative Assembly (Lower House)", "Federal Assembly and Provincial Assembly", "Senate and House of Representatives"], "answer": 1, "explanation": "Correct: The 1919 Act created the Council of State (Upper House) and the Legislative Assembly (Lower House). Lok Sabha and Rajya Sabha are post-1950 names under the Indian Constitution.", "globalNum": 44}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Which commission-like body did the Government of India Act, 1919 also provide for?", "options": ["Election Commission", "Central Public Service Commission", "Finance Commission", "Union Public Service Commission"], "answer": 1, "explanation": "Correct: The 1919 Act provided for a Central Public Service Commission. The Election Commission, Finance Commission, and UPSC (as named) are constitutional bodies created after 1950.", "globalNum": 45}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1935 abolished dyarchy at the Centre and introduced:", "options": ["Separate electorates for Muslims", "Provincial autonomy", "Direct elections at the Centre", "The Secretary of State for India office"], "answer": 1, "explanation": "Correct: The 1935 Act abolished dyarchy at the Centre and introduced provincial autonomy instead. Separate electorates date to 1909; Centre direct elections to 1919; the Secretary of State's office to 1858.", "globalNum": 46}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1935 provided for the establishment of which body, and introduced bicameralism in how many of the provinces?", "options": ["All India Federation; bicameralism in 6 of 11 provinces", "Central Legislature; bicameralism in all 11 provinces", "All India Federation; bicameralism in 3 of 11 provinces", "Provincial Council; bicameralism in 9 of 11 provinces"], "answer": 0, "explanation": "Correct: It provided for an All India Federation and introduced bicameralism in 6 of the 11 provinces (Bengal, Bombay, Madras, Bihar, Assam, United Provinces). The other combinations misstate the number or the body created.", "globalNum": 47}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "In which six provinces did the Government of India Act, 1935 introduce bicameralism?", "options": ["Bengal, Bombay, Madras, Bihar, Assam, United Provinces", "Bengal, Punjab, Bombay, Madras, Assam, Orissa", "Bombay, Madras, Bihar, Punjab, Sindh, Assam", "Bengal, Bombay, Madras, Punjab, Bihar, NWFP"], "answer": 0, "explanation": "Correct: Bicameralism was introduced in Bengal, Bombay, Madras, Bihar, Assam, and the United Provinces — 6 of the 11 provinces. The other lists substitute in provinces (like Punjab, Sindh, Orissa, NWFP) that were not part of this specific group.", "globalNum": 48}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Which of these was also a feature of the Government of India Act, 1935?", "options": ["Reserved seats for Scheduled Castes, women & labour, and extended adult franchise to only 14% of the population", "Full universal adult franchise for all citizens", "Reservation for OBCs at 27%", "Abolition of the Federal Court"], "answer": 0, "explanation": "Correct: The 1935 Act reserved seats for Scheduled Castes, women, and labour, and extended the vote to only about 14% of the population — far from universal franchise (which came only with the 1950 Constitution). OBC reservation (27%) is a post-independence Mandal Commission matter, and the Act actually provided for a Federal Court, not its abolition.", "globalNum": 49}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Government of India Act, 1935 also led to the establishment of which institution, and separated which region from India?", "options": ["Reserve Bank of India; separated Burma from India", "State Bank of India; separated Sri Lanka from India", "Reserve Bank of India; separated Bangladesh from India", "Planning Commission; separated Burma from India"], "answer": 0, "explanation": "Correct: The Reserve Bank of India was established under the 1935 Act, which also separated Burma from India. The State Bank of India, Bangladesh, and the Planning Commission are unrelated to this Act.", "globalNum": 50}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "How did the Government of India Act, 1935 divide legislative powers between the Centre and Provinces?", "options": ["Two lists: Federal and Provincial only", "Three lists: Federal (59), Provincial (54), Concurrent (36)", "Four lists including a Residuary list with the states", "Only a single Union list"], "answer": 1, "explanation": "Correct: The 1935 Act divided powers via three lists — Federal (59 subjects), Provincial (54 subjects), and Concurrent (36 subjects) — a scheme that directly inspired the Seventh Schedule of the Indian Constitution.", "globalNum": 51}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Besides the three lists, what other institutions did the Government of India Act, 1935 provide for?", "options": ["Federal Court, Auditor-General & Federal Railway Authority", "Supreme Court, Election Commission & NITI Aayog", "Finance Commission, UPSC & Attorney-General", "President's Secretariat & Planning Commission"], "answer": 0, "explanation": "Correct: The 1935 Act provided for a Federal Court, an Auditor-General, and a Federal Railway Authority. The Supreme Court, Election Commission, Finance Commission, UPSC, Attorney-General, and NITI Aayog are all post-1950 constitutional/statutory creations.", "globalNum": 52}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Indian Independence Act, 1947 declared India independent and sovereign from which date?", "options": ["26 January 1947", "15 August 1947", "2 October 1947", "1 January 1947"], "answer": 1, "explanation": "Correct: India was declared independent and sovereign from 15 August 1947. 26 January is Republic Day (1950), and 2 October is Gandhi Jayanti — neither relates to this Act's independence date.", "globalNum": 53}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Indian Independence Act, 1947 partitioned British India into two dominions. What right did these dominions have regarding the British Commonwealth?", "options": ["Right to secede from the Commonwealth", "Compulsory permanent membership", "No right to leave for 25 years", "Right to secede only after 1950"], "answer": 0, "explanation": "Correct: India and Pakistan were given the right to secede from the Commonwealth as dominions. The other options describe restrictions not present in the Act.", "globalNum": 54}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "The Indian Independence Act, 1947 abolished the office of Viceroy and replaced it with:", "options": ["President of India", "A Governor-General appointed by the British King on the advice of the dominion cabinet", "Prime Minister as head of state", "Secretary of State for India"], "answer": 1, "explanation": "Correct: The office of Viceroy was abolished and replaced by a Governor-General appointed by the British King on the advice of the dominion cabinet. The President of India came only with the 1950 Constitution, and the Secretary of State for India's office had already been abolished by this same 1947 Act.", "globalNum": 55}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Which of the following did the Indian Independence Act, 1947 also do?", "options": ["Created the Secretary of State for India office", "Abolished the Secretary of State for India office and proclaimed the lapse of British paramountcy over princely states", "Extended British paramountcy over princely states permanently", "Retained the title Viceroy for ceremonial purposes"], "answer": 1, "explanation": "Correct: The 1947 Act abolished the Secretary of State for India's office (created back in 1858) and proclaimed the lapse of British paramountcy over princely states, leaving them free to join India, Pakistan, or remain independent. It did not retain the Viceroy title or extend paramountcy.", "globalNum": 56}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Under the Indian Independence Act, 1947, in whose name could the Governor-General assent to bills, and with what scope of power?", "options": ["In the name of His Majesty, with full power to assent to any bill", "In the name of the Indian President, with limited power", "In the name of Parliament, with veto power only over money bills", "No power to assent to bills at all"], "answer": 0, "explanation": "Correct: The Governor-General had full power to assent to any bill in the name of His Majesty. The President of India role did not yet exist in 1947, and no such restriction to money bills applied.", "globalNum": 57}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "According to the notes, British rule in India ended at which moment, and who was independent India's 1st Governor-General?", "options": ["Midnight of 14-15 Aug 1947; 1st Governor-General was Lord Mountbatten", "Noon of 15 Aug 1947; 1st Governor-General was C. Rajagopalachari", "Midnight of 14-15 Aug 1947; 1st Governor-General was C. Rajagopalachari", "Midnight of 25-26 Jan 1950; 1st Governor-General was Lord Mountbatten"], "answer": 0, "explanation": "Correct: British rule ended at the stroke of midnight, 14-15 August 1947, and Lord Mountbatten was the 1st Governor-General of independent India. C. Rajagopalachari was instead the 1st and last Indian Governor-General, and 26 January 1950 is the date the Constitution came into force, not independence.", "globalNum": 58}, {"tab": "t2", "tabTitle": "2. Crown Rule & Independence", "q": "Who is described in the notes as the '1st & Last Indian Governor-General' of India?", "options": ["Lord Mountbatten", "Jawaharlal Nehru", "C. Rajagopalachari", "Sardar Vallabhbhai Patel"], "answer": 2, "explanation": "Correct: C. Rajagopalachari was the 1st and last Indian Governor-General (the office was abolished when India became a republic in 1950). Mountbatten was the 1st Governor-General of independent India but was British, not Indian; Nehru and Patel held other posts (PM and Deputy PM/Home Minister respectively).", "globalNum": 59}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "According to the notes, what does a Constitution fundamentally lay out?", "options": ["Only the powers of the police and military", "Ideals that form the basis of the kind of country a nation aspires to be", "A list of taxes citizens must pay", "Only the boundaries of a country"], "answer": 1, "explanation": "Correct: A Constitution lays out ideals forming the basis of the kind of country a nation aspires to be. The other options describe narrow administrative matters, not the broader aspirational role of a Constitution.", "globalNum": 60}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Which form of government is described as being 'ruled by a few,' with China given as an example?", "options": ["Monarchic", "Communist", "Oligarchic", "Totalitarian"], "answer": 2, "explanation": "Correct: Oligarchic government means rule by a few, exemplified by China in the notes. Monarchic means rule by a king/queen (e.g., Saudi Arabia, UK); Communist refers to state control of production (also China); Totalitarian means total control over citizens' lives (e.g., North Korea).", "globalNum": 61}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In the notes' table of government forms, which type is defined as power held by the people through elected representatives, with India as the example?", "options": ["Communist", "Democratic", "Totalitarian", "Monarchic"], "answer": 1, "explanation": "Correct: Democratic government means power held by the people via elected representatives, exemplified by India. Communist refers to state-controlled production; Totalitarian means total control over citizens' lives; Monarchic means rule by a monarch.", "globalNum": 62}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Which government type is defined as total control over citizens' lives, not necessarily democratic, exemplified by North Korea?", "options": ["Oligarchic", "Communist", "Totalitarian", "Monarchic"], "answer": 2, "explanation": "Correct: Totalitarian government means total control over citizens' lives and is exemplified by North Korea. Oligarchic means rule by a few (China); Communist means state control of production (China); Monarchic means rule by a king/queen.", "globalNum": 63}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "According to the notes, in which country and year did the tradition of having a written Constitution begin?", "options": ["France, 1789", "USA, 1787", "UK, 1215", "India, 1950"], "answer": 1, "explanation": "Correct: The tradition began in the USA in 1787. France's revolution (1789), the UK's Magna Carta (1215), and India's Constitution (1950) are all separate historical milestones, not the origin point of this tradition per the notes.", "globalNum": 64}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "The 1928 Nehru Report — the first draft of an Indian Constitution — was submitted by the All Parties Conference at Lucknow and chaired by whom?", "options": ["Jawaharlal Nehru", "Motilal Nehru", "M.N. Roy", "Rajendra Prasad"], "answer": 1, "explanation": "Correct: Motilal Nehru chaired the committee that produced the 1928 Nehru Report. Jawaharlal Nehru (his son) made a separate 1938 declaration; M.N. Roy proposed the idea of a Constituent Assembly in 1934; Rajendra Prasad later became President of the Constituent Assembly.", "globalNum": 65}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Who first proposed the idea of a Constituent Assembly for India, and in which year?", "options": ["Jawaharlal Nehru, 1938", "M.N. Roy, 1934", "Motilal Nehru, 1928", "B.R. Ambedkar, 1935"], "answer": 1, "explanation": "Correct: M.N. Roy first proposed the idea in 1934. Nehru's declaration came in 1938; Motilal Nehru's report was in 1928; Ambedkar's major role came later, in drafting the Constitution itself.", "globalNum": 66}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In which year did the Indian National Congress officially demand a Constituent Assembly?", "options": ["1934", "1935", "1938", "1940"], "answer": 1, "explanation": "Correct: The INC officially demanded a Constituent Assembly in 1935. 1934 was when M.N. Roy first proposed the idea; 1938 was Nehru's declaration; 1940 was the year of the August Offer.", "globalNum": 67}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In 1938, Jawaharlal Nehru declared, on behalf of the INC, that the Constitution of free India must be framed:", "options": ["By the British Parliament with Indian consultation", "Without outside interference, by a Constituent Assembly elected on adult franchise", "By the Muslim League alone", "By provincial governors"], "answer": 1, "explanation": "Correct: Nehru declared it must be framed without outside interference, by a Constituent Assembly elected on the basis of adult franchise. The other options describe arrangements Nehru's declaration explicitly rejected.", "globalNum": 68}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Arrange the British 'offers' timeline correctly, as per the notes: which offer/plan came right after the August Offer (1940)?", "options": ["Wavell Plan (1945)", "Cripps Proposal (1942)", "Cabinet Mission (1946)", "Simon Commission"], "answer": 1, "explanation": "Correct: The sequence was August Offer (1940) → Cripps Proposal (1942) → Wavell Plan (1945) → Cabinet Mission (1946). The Simon Commission is not part of this particular timeline in the notes.", "globalNum": 69}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "According to the notes, what was the underlying reason behind Britain making these successive offers (August Offer, Cripps Proposal, etc.) to India?", "options": ["Growing pressure from the United Nations", "The ongoing World War II (1939-1945)", "India's declaration of independence", "The formation of the Muslim League"], "answer": 1, "explanation": "Correct: The notes state these offers arose due to the ongoing World War II (1939-1945), as Britain sought Indian cooperation. The UN did not exist yet at that time, and India's independence declaration came only in 1947.", "globalNum": 70}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "The Wavell Plan of 1945 was chaired by whom?", "options": ["Pethick-Lawrence", "Stafford Cripps", "Wavell", "A.V. Alexander"], "answer": 2, "explanation": "Correct: The Wavell Plan (1945) was chaired by Wavell himself. Pethick-Lawrence, Cripps, and Alexander were the three members of the later 1946 Cabinet Mission, not the Wavell Plan.", "globalNum": 71}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "The Cabinet Mission Plan (1946) consisted of three British Cabinet members. Who chaired it, and who were the other two?", "options": ["Pethick-Lawrence (chairman), Stafford Cripps, A.V. Alexander", "Wavell (chairman), Stafford Cripps, Pethick-Lawrence", "Mountbatten (chairman), A.V. Alexander, Wavell", "Stafford Cripps (chairman), Pethick-Lawrence, Mountbatten"], "answer": 0, "explanation": "Correct: Pethick-Lawrence chaired the Cabinet Mission, with Stafford Cripps and A.V. Alexander as the other two members. Wavell and Mountbatten were Viceroys, not Cabinet Mission members.", "globalNum": 72}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Why was the Constituent Assembly ultimately formed according to the Cabinet Mission Plan specifically, rather than earlier offers?", "options": ["It was the only plan accepted by both Congress and the Muslim League", "It was the only plan approved by the British Parliament", "It was proposed the earliest, in 1940", "It offered full Dominion Status immediately"], "answer": 0, "explanation": "Correct: The Cabinet Mission Plan was the only one accepted by both Congress and the Muslim League, which is why the Constituent Assembly was formed on its basis. It was not the earliest plan (that was the August Offer, 1940), and it did not immediately grant Dominion Status.", "globalNum": 73}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Under the Cabinet Mission Plan (1946), what was the total number of Constituent Assembly seats, and how were they split between elected and nominated members?", "options": ["389 total: 296 elected + 93 nominated", "400 total: 300 elected + 100 nominated", "350 total: 250 elected + 100 nominated", "389 total: 200 elected + 189 nominated"], "answer": 0, "explanation": "Correct: There were 389 total seats — 296 elected from Governor's Provinces and 93 nominated (from Chief Commissioner's Provinces and Princely States). The other combinations misstate these figures.", "globalNum": 74}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Of the 296 elected members under the Cabinet Mission Plan, how were they further broken down?", "options": ["292 from Governor's Provinces + 4 from Chief Commissioner's Provinces", "250 from provinces + 46 from princely states", "All 296 from Chief Commissioner's Provinces", "150 elected + 146 nominated"], "answer": 0, "explanation": "Correct: Of the 296, 292 came from the (11) Governor's Provinces and 4 from the Chief Commissioner's Provinces. The nominated 93 members came separately, from Chief Commissioner's Provinces (partly) and Princely States' rulers.", "globalNum": 75}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Under the Cabinet Mission Plan's seat allocation, one seat was allotted per how much population, and how were provincial seats divided among communities?", "options": ["1 million population; divided among Muslim, Sikh, and General communities", "5 lakh population; divided among Hindu and Muslim only", "1 million population; divided equally among all religions", "2 million population; divided among Muslim, Sikh, and General communities"], "answer": 0, "explanation": "Correct: One seat was allotted per 1 million population, and provincial seats were divided among Muslim, Sikh, and General communities. The other options misstate either the population ratio or the community categories used.", "globalNum": 76}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Under the Cabinet Mission Plan, who allotted seats to Princely State representatives, and what election method was used overall?", "options": ["Rulers of the princely states allotted seats; election was via Indirect Elections (Proportional Representation + Single Transferable Vote)", "The British Parliament allotted seats; direct elections were used", "Congress allotted seats; first-past-the-post voting was used", "The Viceroy allotted seats; no elections were held"], "answer": 0, "explanation": "Correct: Seats to princely state representatives were allotted by their respective rulers, and the overall method was Indirect Elections using Proportional Representation with the Single Transferable Vote. The Assembly was thus partly elected, partly nominated — not directly elected or appointed solely by the British or Congress.", "globalNum": 77}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In the Constituent Assembly elections of July-August 1946, how many seats did the Indian National Congress win?", "options": ["73", "208", "15", "296"], "answer": 1, "explanation": "Correct: Congress won 208 seats. The Muslim League won 73, and Independents won 15. 296 was the total number of elected (not Congress-won) seats.", "globalNum": 78}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In the July-August 1946 Constituent Assembly elections, how many seats did the Muslim League and Independents win respectively?", "options": ["Muslim League 208, Independents 73", "Muslim League 73, Independents 15", "Muslim League 15, Independents 73", "Muslim League 93, Independents 15"], "answer": 1, "explanation": "Correct: The Muslim League won 73 seats and Independents won 15 seats, while Congress won 208. The other combinations swap or misstate these numbers.", "globalNum": 79}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "What happened to the Muslim League's participation in the Constituent Assembly after Partition, and how many seats remained?", "options": ["The Muslim League boycotted the Assembly; 299 seats remained", "The Muslim League joined fully; all 389 seats remained", "The Muslim League led the Assembly; 208 seats remained", "Congress boycotted the Assembly; 93 seats remained"], "answer": 0, "explanation": "Correct: The Muslim League boycotted the Constituent Assembly after Partition, leaving 299 seats. Congress did not boycott, and the League never led the Assembly.", "globalNum": 80}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "When was the Interim Government of India formed, and how long did it last?", "options": ["2 September 1946, until Partition (15 Aug 1947)", "24 August 1946, until Republic Day (26 Jan 1950)", "15 August 1947, until 1950", "9 December 1946, until 1949"], "answer": 0, "explanation": "Correct: The Interim Government was formed on 2 September 1946 and lasted until Partition on 15 August 1947. 24 August 1946 was instead when the 1st Interim National Government was announced (a related but distinct date), and 9 December 1946 relates to the Constituent Assembly's first sitting.", "globalNum": 81}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Who served as President of the Executive Council (Viceroy & Governor-General) of the Interim Government, and how did this change over time?", "options": ["Lord Wavell (till Feb 1947), then Viscount Mountbatten (Feb 1947 to 15 Aug 1947)", "Viscount Mountbatten throughout, from 1946 to 1950", "Lord Wavell throughout, from 1946 to 1947", "Jawaharlal Nehru (till Feb 1947), then Lord Wavell"], "answer": 0, "explanation": "Correct: Lord Wavell served until February 1947, then Viscount Mountbatten took over until 15 August 1947 (Partition). Nehru instead served as Vice President of the Executive Council, not as its President.", "globalNum": 82}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Who was the Commander-in-Chief during the Interim Government period?", "options": ["Sir Claude Auchinleck", "Lord Wavell", "Viscount Mountbatten", "Sardar Vallabhbhai Patel"], "answer": 0, "explanation": "Correct: Sir Claude Auchinleck was the Commander-in-Chief. Wavell and Mountbatten served as President of the Executive Council in succession, while Patel held a ministerial portfolio (Home, Information & Broadcasting).", "globalNum": 83}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Who was the Vice President of the Interim Government's Executive Council, in charge of External Affairs & Commonwealth Relations?", "options": ["Sardar Vallabhbhai Patel", "Rajendra Prasad", "Jawaharlal Nehru", "C. Rajagopalachari"], "answer": 2, "explanation": "Correct: Jawaharlal Nehru (INC) served as Vice President, handling External Affairs and Commonwealth Relations. Patel handled Home, Information & Broadcasting; Prasad handled Agriculture & Food; Rajagopalachari handled Education and Arts.", "globalNum": 84}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "In the Interim Government, who held the Home, Information & Broadcasting portfolio, and who held Agriculture & Food?", "options": ["Sardar Vallabhbhai Patel (Home); Rajendra Prasad (Agriculture)", "Jawaharlal Nehru (Home); Baldev Singh (Agriculture)", "C. Rajagopalachari (Home); Jagjivan Ram (Agriculture)", "Liaquat Ali Khan (Home); John Mathai (Agriculture)"], "answer": 0, "explanation": "Correct: Sardar Vallabhbhai Patel held Home, Information & Broadcasting; Rajendra Prasad held Agriculture & Food. Nehru held External Affairs; Rajagopalachari held Education and Arts; Baldev Singh held Defence; Jagjivan Ram held Labour; Liaquat Ali Khan held Finance; John Mathai held Industries and Supplies.", "globalNum": 85}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Who held the Finance portfolio in the Interim Government, and what significant later role did he go on to hold?", "options": ["Liaquat Ali Khan (Muslim League); became the 1st PM of Pakistan", "John Mathai (INC); became the 1st PM of India", "Ibrahim Ismail Chundrigar (Muslim League); became President of Pakistan", "Baldev Singh (INC); became 1st President of India"], "answer": 0, "explanation": "Correct: Liaquat Ali Khan (Muslim League) held Finance and later became the 1st Prime Minister of Pakistan. John Mathai instead held Industries and Supplies; the other names held different portfolios listed in the notes.", "globalNum": 86}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Which Interim Government portfolios were held by Baldev Singh, C. Rajagopalachari, and Jagjivan Ram respectively?", "options": ["Defence, Education and Arts, Labour", "Commerce, Health, Railways", "Finance, Agriculture, Industries", "Home, External Affairs, Defence"], "answer": 0, "explanation": "Correct: Baldev Singh (INC) held Defence, C. Rajagopalachari (INC) held Education and Arts, and Jagjivan Ram (INC) held Labour. The other combinations mix up portfolios actually held by Muslim League members or other INC members.", "globalNum": 87}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "Which Muslim League members held the Commerce, Health, and Railways/Communication portfolios respectively in the Interim Government?", "options": ["Ibrahim Ismail Chundrigar (Commerce), Ghazanfar Ali Khan (Health), Abdur Rab Nishtar (Railways)", "Liaquat Ali Khan (Commerce), Baldev Singh (Health), John Mathai (Railways)", "Ghazanfar Ali Khan (Commerce), Abdur Rab Nishtar (Health), Chundrigar (Railways)", "Jagjivan Ram (Commerce), Rajendra Prasad (Health), Patel (Railways)"], "answer": 0, "explanation": "Correct: Ibrahim Ismail Chundrigar held Commerce, Ghazanfar Ali Khan held Health, and Abdur Rab Nishtar held Railways and Communication, Post and Air — all Muslim League members. The other combinations misassign these portfolios to INC members who actually held different posts.", "globalNum": 88}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "According to the notes, when was the 1st Interim National Government announced, and how does this date relate to the Interim Government's formal formation?", "options": ["Announced 24 Aug 1946; formally formed shortly after on 2 Sept 1946", "Announced 2 Sept 1946; formally formed on 24 Aug 1946", "Both announced and formed on 15 Aug 1947", "Announced in 1945, before the Cabinet Mission Plan"], "answer": 0, "explanation": "Correct: The 1st Interim National Government was announced on 24 August 1946, shortly before it was formally formed on 2 September 1946. The other options reverse the sequence or misplace the dates.", "globalNum": 89}, {"tab": "t3", "tabTitle": "3. Historical Background", "q": "What did the British term 'Dominion Status,' which Britain offered instead of full independence, mean and what did Congress demand instead?", "options": ["Dominion Status meant self-governing status within the British empire ('that which is mastered or ruled'); Congress demanded Purna Swaraj", "Dominion Status meant total independence; Congress demanded continued British rule", "Dominion Status meant military alliance only; Congress demanded Dominion Status", "Dominion Status and Purna Swaraj meant the same thing"], "answer": 0, "explanation": "Correct: Dominion Status was self-governing status within the British empire (the term literally means 'that which is mastered or ruled'), while Congress instead demanded Purna Swaraj (complete independence) — these were not the same thing, and Congress firmly rejected the lesser offer.", "globalNum": 90}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "According to the notes' key facts box, on what date was the (Drafting Committee of the) Constituent Assembly set up, and how many total members did it have?", "options": ["29th August 1947; 7 members", "8th December 1946; 389 members", "30th August 1947; 11 members", "9th December 1946; 15 members"], "answer": 0, "explanation": "Correct: The key facts box states it was set up on 29th August 1947 with 7 total members — this refers to the Drafting Committee. The 389 figure is the total Constituent Assembly membership (a separate fact), and 8/9 December 1946 relate to the Constituent Assembly's formation/first meeting, not the Drafting Committee's setup.", "globalNum": 91}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "How many days did the Drafting Committee sit for, and when was its 1st meeting, as per the notes?", "options": ["141 days; 1st meeting on 30 Aug 1947", "165 days; 1st meeting on 9 Dec 1946", "141 days; 1st meeting on 8 Dec 1946", "165 days; 1st meeting on 30 Aug 1947"], "answer": 0, "explanation": "Correct: The Drafting Committee sat for 141 days, with its 1st meeting on 30 Aug 1947. The 165-day figure refers instead to the Constituent Assembly's 11 total sessions, a separate figure in the notes.", "globalNum": 92}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "As per the notes, the Constituent Assembly of India was formed on which date, described as also being its 1st meeting?", "options": ["8 December 1946", "30 August 1947", "13 December 1946", "22 January 1947"], "answer": 0, "explanation": "Correct: The notes state the Constituent Assembly was formed on 8 December 1946, described there as its 1st meeting. 30 August 1947 relates to the Drafting Committee's 1st meeting; 13 December 1946 is when Nehru moved the Objective Resolution; 22 January 1947 is when it was adopted.", "globalNum": 93}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "What was the total membership of the Constituent Assembly, and on what basis was this number set?", "options": ["389, as per the Cabinet Mission Plan", "300, as per the Nehru Report", "500, as decided by the British Parliament", "250, as per the Indian Independence Act"], "answer": 0, "explanation": "Correct: The Constituent Assembly had 389 total members, as set by the Cabinet Mission Plan (1946). The other documents mentioned did not fix this membership figure.", "globalNum": 94}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Who was the Chairman of the Drafting Committee, also known by the epithets 'Modern Manu' or 'Modern Man'?", "options": ["Dr. Rajendra Prasad", "Dr. B. R. Ambedkar", "Dr. Sachchidananda Sinha", "H. C. Mukherjee"], "answer": 1, "explanation": "Correct: Dr. B. R. Ambedkar chaired the Drafting Committee and is called 'Modern Manu'/'Modern Man' in the notes. Rajendra Prasad was President of the Constituent Assembly; Sachchidananda Sinha was its temporary President; Mukherjee was its Vice President.", "globalNum": 95}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Who served as the temporary President of the Constituent Assembly before elections, and who became President after elections were held?", "options": ["Dr. Sachchidananda Sinha (temporary); Dr. Rajendra Prasad (after elections)", "Dr. Rajendra Prasad (temporary); Dr. Sachchidananda Sinha (after elections)", "B.R. Ambedkar (temporary); H.C. Mukherjee (after elections)", "H.C. Mukherjee (temporary); B.R. Ambedkar (after elections)"], "answer": 0, "explanation": "Correct: Dr. Sachchidananda Sinha was the temporary President before elections, and Dr. Rajendra Prasad became President after elections. Ambedkar and Mukherjee held different roles (Drafting Committee Chairman and Vice President respectively).", "globalNum": 96}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Who became Vice President of the Constituent Assembly after elections?", "options": ["H. C. Mukherjee", "V. T. Krishnamachari", "G. V. Mavalankar", "Sarojini Naidu"], "answer": 0, "explanation": "Correct: H. C. Mukherjee became Vice President after elections. Krishnamachari was a Vice President of the First Parliament (a separate role, alongside Mukherjee); Mavalankar chaired the Assembly when it met as a legislative body; Sarojini Naidu became the 1st Governor of UP.", "globalNum": 97}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Who moved the Objective Resolution, and when and where?", "options": ["Jawaharlal Nehru, on 13 December 1946, in the Constituent Assembly at Lucknow", "B.R. Ambedkar, on 22 January 1947, in Delhi", "Rajendra Prasad, on 9 December 1946, in Bombay", "Sachchidananda Sinha, on 30 August 1947, in Lucknow"], "answer": 0, "explanation": "Correct: The notes state Jawaharlal Nehru moved the Objective Resolution on 13 December 1946 at the Constituent Assembly, Lucknow. Ambedkar chaired the Drafting Committee (a different role); the resolution was adopted (not moved) on 22 January 1947.", "globalNum": 98}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "What did the Objective Resolution do, and when was it adopted?", "options": ["Laid the fundamental principles and philosophy for the Constitution; adopted 22 Jan 1947", "Finalised the text of the Constitution; adopted 26 Nov 1949", "Elected the Constituent Assembly's President; adopted 9 Dec 1946", "Declared India a republic; adopted 26 Jan 1950"], "answer": 0, "explanation": "Correct: The Objective Resolution laid the fundamental principles and philosophy for the Indian Constitution, and was adopted on 22 January 1947. The Constitution's text was finalised on 26 November 1949 (3rd reading), and India was declared a republic on 26 January 1950 — both separate events.", "globalNum": 99}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "How many total sessions did the Constituent Assembly hold, and over how many total days?", "options": ["11 sessions, 165 days", "7 sessions, 141 days", "9 sessions, 284 days", "3 sessions, 211 days"], "answer": 0, "explanation": "Correct: The Assembly held 11 sessions over 165 days in total. 7 sessions/141 days would confuse this with the Drafting Committee's separate figures (7 members, 141 days sitting); 284 and 211 relate to signatories and 1st-day attendance respectively.", "globalNum": 100}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "How long did the 1st reading of the Constitution take, and on what dates?", "options": ["5 days, 4th–9th Nov 1948", "10 months 3 days, 15 Nov 1948–17 Oct 1949", "1 day, 26 Nov 1949", "2 years, from 1946 to 1948"], "answer": 0, "explanation": "Correct: The 1st reading took 5 days (4th–9th November 1948). The 10-months-3-days figure refers to the 2nd reading instead, and the 3rd reading was completed in a single sitting on 26 November 1949.", "globalNum": 101}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "The 2nd reading of the Constitution took how long, and on what dates did it run?", "options": ["10 months and 3 days, 15 Nov 1948 – 17 Oct 1949", "5 days, 4th–9th Nov 1948", "2 years 11 months, entirely in 1947", "3 days, 24–26 Jan 1949"], "answer": 0, "explanation": "Correct: The 2nd reading ran for 10 months and 3 days, from 15 November 1948 to 17 October 1949 — by far the longest of the three readings. The 5-day figure is the 1st reading; 2 years 11 months is the total drafting time (a different, larger figure).", "globalNum": 102}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "When was the 3rd reading of the Constitution completed?", "options": ["26 November 1949", "17 October 1949", "9 November 1948", "22 January 1947"], "answer": 0, "explanation": "Correct: The 3rd reading was completed on 26 November 1949 — this date also coincides with the 11th (last) session and is celebrated as Constitution Day. 17 October 1949 marked the end of the 2nd reading; 9 November 1948 the end of the 1st reading.", "globalNum": 103}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "According to the important sessions table, what were the dates of the 1st Session, and what budget was allotted to frame the Constitution?", "options": ["9–23 December 1946; budget of 64 lakhs", "8–22 December 1946; budget of 1 lakh", "30 August–13 September 1947; budget of 50 lakhs", "14–26 November 1949; budget of 64 lakhs"], "answer": 0, "explanation": "Correct: The 1st Session ran 9–23 December 1946, with a budget of 64 lakhs allotted to frame the Constitution. The other date ranges and budget figures do not match the notes' table.", "globalNum": 104}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "According to the important sessions table, what were the dates of the 10th and 11th (final) Sessions?", "options": ["10th: 6–17 October 1949; 11th: 14–26 November 1949", "10th: 4–9 November 1948; 11th: 15 November 1948–17 October 1949", "10th: 9–23 December 1946; 11th: 30 August 1947", "10th: 22 January 1947; 11th: 26 January 1950"], "answer": 0, "explanation": "Correct: The 10th Session ran 6–17 October 1949, and the 11th (also the last) Session ran 14–26 November 1949. The other date ranges belong to the 1st and 2nd readings or unrelated events (like the Objective Resolution or Republic Day).", "globalNum": 105}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Describe B.R. Ambedkar's election journey to the Constituent Assembly, as per the notes.", "options": ["Elected from Bengal before Partition, then later elected from Bombay Presidency (after M.R. Jayakar resigned) on 24 Jan 1949", "Elected only once, from Bombay Presidency, in 1946", "Elected from Madras Presidency, then Bengal, in 1947", "Nominated directly by the Viceroy, without any election"], "answer": 0, "explanation": "Correct: Ambedkar was first elected from Bengal (before Partition), and later elected from the Bombay Presidency after M.R. Jayakar resigned, on 24 January 1949. He was not nominated by the Viceroy nor elected from Madras.", "globalNum": 106}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "How many members were present on the 1st day of the Constituent Assembly, and how many ultimately signed the Constitution?", "options": ["211 present on day 1; 284 signed the Constitution", "389 present on day 1; 211 signed the Constitution", "284 present on day 1; 389 signed the Constitution", "165 present on day 1; 141 signed the Constitution"], "answer": 0, "explanation": "Correct: 211 members were present on the 1st day, and 284 members (including 15 female members) ultimately signed the Constitution. 389 was the total sanctioned membership figure, not an attendance or signature count.", "globalNum": 107}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "How many of the 284 signatories of the Constitution were female members?", "options": ["15", "7", "11", "284"], "answer": 0, "explanation": "Correct: 15 of the 284 signatories were female members. 7 is instead the Drafting Committee's total member count, and 11 is the number of Constituent Assembly sessions — unrelated figures.", "globalNum": 108}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "What was the total time taken to draft the Indian Constitution, as stated in the notes?", "options": ["2 years, 11 months, 18 days", "1 year, 6 months, 3 days", "3 years, exactly", "10 months, 3 days"], "answer": 0, "explanation": "Correct: The total drafting time was 2 years, 11 months, and 18 days. 10 months 3 days refers only to the 2nd reading, a much smaller portion of the overall process.", "globalNum": 109}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Besides making the Constitution, the Constituent Assembly also functioned as a legislative body known as the:", "options": ["Provisional Parliament", "Interim Government", "Federal Court", "Board of Control"], "answer": 0, "explanation": "Correct: It functioned as the Provisional Parliament when acting as a legislative body. The Interim Government was a separate, earlier executive arrangement (formed Sept 1946); the Federal Court and Board of Control are unrelated institutions from other Acts.", "globalNum": 110}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "When the Assembly met as a Constituent Assembly it was chaired by Dr. Rajendra Prasad. Who chaired it when it met as a legislative body (Provisional Parliament), and when was that body's 1st meeting?", "options": ["G.V. Mavalankar; 1st meeting on 9 Dec 1946", "B.R. Ambedkar; 1st meeting on 30 Aug 1947", "H.C. Mukherjee; 1st meeting on 8 Dec 1946", "V.T. Krishnamachari; 1st meeting on 22 Jan 1947"], "answer": 0, "explanation": "Correct: G.V. Mavalankar chaired the Assembly when it met as a legislative body, whose 1st meeting was on 9 December 1946. Ambedkar chaired the Drafting Committee, Mukherjee was Vice President of the Constituent Assembly, and Krishnamachari was a Vice President of the First Parliament — all different roles.", "globalNum": 111}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "Which important female members of the Constituent Assembly are noted for these 'firsts': 1st Health Minister, 1st female Chief Minister of Uttar Pradesh, and 1st Governor of Uttar Pradesh, respectively?", "options": ["Rajkumari Amrit Kaur, Sucheta Kripalani, Sarojini Naidu", "Sarojini Naidu, Rajkumari Amrit Kaur, Sucheta Kripalani", "Sucheta Kripalani, Sarojini Naidu, Rajkumari Amrit Kaur", "Vijaya Lakshmi Pandit, Sarojini Naidu, Sucheta Kripalani"], "answer": 0, "explanation": "Correct: Rajkumari Amrit Kaur was the 1st Health Minister, Sucheta Kripalani the 1st female Chief Minister of Uttar Pradesh, and Sarojini Naidu the 1st Governor of Uttar Pradesh. Vijaya Lakshmi Pandit is not mentioned in this list in the notes.", "globalNum": 112}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "In the First Parliament of India, who served as President and who served as Vice Presidents?", "options": ["President: Dr. Rajendra Prasad; Vice Presidents: V.T. Krishnamachari and H.C. Mukherjee", "President: G.V. Mavalankar; Vice President: B.R. Ambedkar", "President: H.C. Mukherjee; Vice President: Rajendra Prasad", "President: Sachchidananda Sinha; Vice President: Sarojini Naidu"], "answer": 0, "explanation": "Correct: Dr. Rajendra Prasad served as President, with V.T. Krishnamachari and H.C. Mukherjee as Vice Presidents. Mavalankar chaired the Assembly as a legislative body (Speaker-like role), not President of the First Parliament.", "globalNum": 113}, {"tab": "t4", "tabTitle": "4. Constituent Assembly", "q": "When was the National Flag adopted, and by which body?", "options": ["22 July 1947, by the body that also functioned as the First Parliament of India", "26 January 1950, by the Supreme Court", "15 August 1947, by the Interim Government", "9 December 1946, by the Drafting Committee"], "answer": 0, "explanation": "Correct: The National Flag was adopted on 22 July 1947, by the Constituent Assembly, which also functioned as the First Parliament of India. It was not adopted by the Interim Government, the Supreme Court, or the Drafting Committee.", "globalNum": 114}, {"tab": "t5", "tabTitle": "5. Committees", "q": "How many Major and Minor committees did the Constituent Assembly set up in total?", "options": ["8 Major and 13 Minor committees", "13 Major and 8 Minor committees", "7 Major and 11 Minor committees", "10 Major and 10 Minor committees"], "answer": 0, "explanation": "Correct: The Assembly set up 8 Major committees and 13 Minor committees. The other combinations reverse or misstate these counts.", "globalNum": 115}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Which three Major committees were all headed by J. L. Nehru?", "options": ["Union Powers Committee, Union Constitution Committee, States Committee", "Provincial Constitution Committee, Drafting Committee, States Committee", "Advisory Committee on Fundamental Rights, Steering Committee, States Committee", "Union Powers Committee, Drafting Committee, Rules of Procedure Committee"], "answer": 0, "explanation": "Correct: Nehru headed the Union Powers Committee, Union Constitution Committee, and States Committee. Patel headed the Provincial Constitution Committee and the Advisory Committee; Ambedkar headed the Drafting Committee; Rajendra Prasad headed the Rules of Procedure and Steering Committees.", "globalNum": 116}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Which two Major committees were headed by Sardar Patel?", "options": ["Provincial Constitution Committee and the Advisory Committee on Fundamental Rights, Minorities, and Tribal and Excluded Areas", "Union Powers Committee and Union Constitution Committee", "Drafting Committee and Steering Committee", "Fundamental Rights sub-committee and Minorities sub-committee"], "answer": 0, "explanation": "Correct: Patel headed the Provincial Constitution Committee and the Advisory Committee on Fundamental Rights, Minorities, and Tribal and Excluded Areas. Nehru headed the Union Powers/Constitution Committees, Ambedkar the Drafting Committee, and the sub-committees had their own separate heads.", "globalNum": 117}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the Fundamental Rights sub-committee, and who headed the Minorities sub-committee?", "options": ["J. B. Kripalani (Fundamental Rights); H.C. Mukherjee (Minorities)", "H.C. Mukherjee (Fundamental Rights); J. B. Kripalani (Minorities)", "A. V. Thakkar (Fundamental Rights); J. B. Kripalani (Minorities)", "Sardar Patel (Fundamental Rights); A. V. Thakkar (Minorities)"], "answer": 0, "explanation": "Correct: J. B. Kripalani headed the Fundamental Rights sub-committee, and H.C. Mukherjee headed the Minorities sub-committee. A. V. Thakkar instead headed the Tribal and excluded areas sub-committee; Patel headed the parent Advisory Committee, not this sub-committee directly.", "globalNum": 118}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who headed the Tribal and Excluded Areas sub-committee?", "options": ["A. V. Thakkar", "H.C. Mukherjee", "J. B. Kripalani", "B. Pattabhi Sitaramayya"], "answer": 0, "explanation": "Correct: A. V. Thakkar headed this sub-committee. Mukherjee and Kripalani headed the Minorities and Fundamental Rights sub-committees respectively; Sitaramayya headed minor committees like the House Committee.", "globalNum": 119}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Besides the Drafting Committee, which two other committees did Dr. Rajendra Prasad head?", "options": ["Rules of Procedure Committee and Steering Committee", "Union Powers Committee and States Committee", "Order of Business Committee and House Committee", "Ad-hoc Committee on the Supreme Court and Ad-hoc Committee on Citizenship"], "answer": 0, "explanation": "Correct: Prasad headed the Rules of Procedure Committee and the Steering Committee (he also headed several minor committees like Finance and Staff, Credentials, and the Ad-hoc Committee on the National Flag). The Drafting Committee was actually chaired by Ambedkar, not Prasad; the other listed committees had different heads (Munshi, Sitaramayya, Varadachariar).", "globalNum": 120}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who chaired the all-important Drafting Committee?", "options": ["Dr. B. R. Ambedkar", "Dr. Rajendra Prasad", "J. L. Nehru", "Sardar Patel"], "answer": 0, "explanation": "Correct: Dr. B. R. Ambedkar chaired the Drafting Committee. Prasad chaired the Rules of Procedure and Steering Committees; Nehru and Patel chaired other Major committees, not the Drafting Committee itself.", "globalNum": 121}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Who served as Chief Draftsman and Constitutional (Legal) Advisor to the Constituent Assembly, though not a member of the Drafting Committee itself?", "options": ["B.N. Rau", "K.M. Munshi", "Alladi Krishnaswami Ayyar", "N. Gopalaswami Ayyangar"], "answer": 0, "explanation": "Correct: B.N. Rau served as Chief Draftsman and Constitutional Advisor, despite not being a Drafting Committee member himself. Munshi, Ayyar, and Ayyangar were actual members of the Drafting Committee.", "globalNum": 122}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Which original Drafting Committee member was replaced by N. Madhav Rau, and which member was replaced by T.T. Krishnamachari?", "options": ["B.L. Mitter was replaced by N. Madhav Rau; D.P. Khaitan was replaced by T.T. Krishnamachari", "D.P. Khaitan was replaced by N. Madhav Rau; B.L. Mitter was replaced by T.T. Krishnamachari", "Muhammad Saadullah was replaced by N. Madhav Rau; K.M. Munshi was replaced by T.T. Krishnamachari", "Alladi Krishnaswami Ayyar was replaced by both"], "answer": 0, "explanation": "Correct: B.L. Mitter was replaced by N. Madhav Rau, and D.P. Khaitan was replaced by T.T. Krishnamachari. Saadullah, Munshi, and Ayyar remained original members without replacement.", "globalNum": 123}, {"tab": "t5", "tabTitle": "5. Committees", "q": "Besides those who were replaced, which other members made up the 7-member Drafting Committee alongside Chairman Ambedkar?", "options": ["Alladi Krishnaswami Ayyar, N. Gopalaswami Ayyangar, Muhammad Saadullah, K.M. Munshi", "J. B. Kripalani, H.C. Mukherjee, A. V. Thakkar, Nehru", "Rajendra Prasad, Sardar Patel, B.N. Rau, G.V. Mavalankar", "S. Varadachariar, S.K. Dhar, Nalini Ranjan Sarkar, Usha Nath Sen"], "answer": 0, "explanation": "Correct: Alongside Ambedkar, the Drafting Committee included Alladi Krishnaswami Ayyar, N. Gopalaswami Ayyangar, Muhammad Saadullah, and K.M. Munshi (plus B.L. Mitter and D.P. Khaitan, who were later replaced). The other names in the incorrect options headed different Major/Minor committees or served as Chief Draftsman, not Drafting Committee members.", "globalNum": 124}, {"tab": "t5", "tabTitle": "5. Committees", "q": "When was the 1st Draft of the Constitution published, and how long after the Drafting Committee's formation did this take?", "options": ["21 February 1948, about 8 months later", "21 October 1948, about 14 months later", "4 November 1948, about 15 months later", "29 August 1947, immediately"], "answer": 0, "explanation": "Correct: The 1st Draft was published on 21 February 1948, about 8 months after the Committee's formation (29 Aug 1947). The 2nd draft came later, on
