sident, VP), while local body elections (Panchayats/Municipalities) fall under separate State Election Commissions — a clear division of electoral administration.", "globalNum": 990}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What is the ECI's composition, appointment process, and term of office?", "options": ["CEC + 2 Election Commissioners; appointed by the President; tenure 6 years or till 65 years of age", "CEC alone (single member); appointed by Parliament; tenure permanent", "CEC + 4 Election Commissioners; appointed by the CJI; tenure 5 years", "CEC + 2 Election Commissioners; appointed by the Prime Minister alone; tenure 10 years"], "answer": 0, "explanation": "Correct: The 3-member structure (CEC + 2 ECs), presidential appointment, and 6-year/age-65 term mirror several other high constitutional offices' structure, though the ECI wasn't always multi-membered (see the historical note about its 1993 transition).", "globalNum": 991}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "How is an Election Commissioner (not the CEC) removed, and what is the nature of the ECI's functions?", "options": ["Removed similarly to a Supreme Court Judge, but specifically on the advice of the CEC; ECI's nature is Administrative, Advisory, and Quasi-judicial", "Removed by a simple Prime Ministerial order; ECI's nature is purely administrative", "Removed only by Parliament directly; ECI's nature is purely judicial", "Cannot be removed under any circumstances during the term"], "answer": 0, "explanation": "Correct: Election Commissioners (other than the CEC) are removed via the CEC's recommendation, following the SC-Judge-style removal process — and the ECI's role spans administrative, advisory, and quasi-judicial functions, reflecting its multifaceted electoral oversight role.", "globalNum": 992}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "When was the Election Commission formed, who was the 1st CEC, and who is the current (26th) CEC per the notes?", "options": ["Formed 26 Jan 1950; Sukumar Sen was the 1st CEC; Gyanesh Kumar is the current (26th) CEC", "Formed 15 Aug 1947; Gyanesh Kumar was the 1st CEC; Sukumar Sen is current", "Formed 1993; T.N. Seshan was the 1st CEC; Sukumar Sen is current", "Formed 26 Nov 1949; Gyanesh Kumar was the 1st CEC"], "answer": 0, "explanation": "Correct: The ECI formed on 26 January 1950 (Republic Day, same as the Constitution's commencement), with Sukumar Sen as India's 1st CEC, and Gyanesh Kumar noted as the current, 26th CEC in the notes.", "globalNum": 993}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "When did the ECI transition from a single-membered to a multi-membered body, and when did the Electors Photo Identity Card (EPIC) start?", "options": ["Became multi-membered from 1 October 1993; EPIC started in 1993 as well", "Became multi-membered in 1950; EPIC started in 2004", "Became multi-membered in 1966 (alongside the 19th CA); EPIC started in 1989", "Became multi-membered in 2004; EPIC started in 1993"], "answer": 0, "explanation": "Correct: The ECI's shift to a 3-member body and the EPIC's introduction both trace to 1993 (specifically 1 October 1993 for the multi-member transition) — a significant year of electoral administration reform.", "globalNum": 994}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What do Articles 325 and 326 respectively guarantee regarding elections?", "options": ["Art 325: no one is ineligible for the electoral roll based on religion/race/caste/sex; Art 326: elections are based on adult suffrage", "Art 325: elections based on adult suffrage; Art 326: no discrimination in electoral rolls", "Both Articles deal exclusively with Panchayat elections", "Art 325 and 326 both deal with the ECI's removal process"], "answer": 0, "explanation": "Correct: Article 325 bars discriminatory exclusion from electoral rolls, while Article 326 establishes universal adult suffrage as the basis for Lok Sabha/Assembly elections — two foundational democratic guarantees.", "globalNum": 995}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What do Articles 327 and 328 cover regarding legislative power over elections, and what does Article 329 prohibit?", "options": ["Art 327: Parliament's power re: elections to legislature; Art 328: State Legislature's power re: elections; Art 329: prohibits court interference in electoral matters", "Art 327: State power; Art 328: Parliament's power; Art 329: mandates court oversight of elections", "Both 327 and 328 deal with Presidential elections specifically", "Article 329 establishes the Election Commission itself"], "answer": 0, "explanation": "Correct: Articles 327-328 divide legislative competence over election-related laws between Parliament and State Legislatures respectively, while Article 329 bars judicial interference in electoral matters — paralleling the similar court-interference bar seen for Panchayat/Municipal elections (243O/243ZG).", "globalNum": 996}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Amendment reduced the voting age from 21 to 18, and which Amendment abolished Election Tribunals for resolving election disputes?", "options": ["61st Amendment (1988) reduced voting age; 19th CA (1966) abolished Election Tribunals", "19th CA reduced voting age; 61st Amendment abolished Election Tribunals", "Both changes came from the same Amendment, the 44th CA", "Neither change has occurred; both remain unchanged since 1950"], "answer": 0, "explanation": "Correct: The 61st Amendment (1988, sometimes also referenced as effective from 1989) lowered the voting age, while the earlier 19th CA (1966) specifically amended Article 324 to abolish Election Tribunals — shifting election dispute resolution to regular High Courts instead.", "globalNum": 997}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "By what epithet is the (Union/State) Public Service Commission known, and how is its composition determined?", "options": ["'Watchdog of Merit System'; composition is left to the President's discretion", "'Balancing Wheel of Fiscal Federalism'; composition fixed at exactly 5 members", "'Guardian of Public Purse'; composition determined by Parliament", "'Conscience of the Constitution'; composition determined by the Supreme Court"], "answer": 0, "explanation": "Correct: The PSC is called the 'Watchdog of Merit System,' reflecting its role safeguarding merit-based civil service recruitment, and its exact composition (number of members) is left flexible, at the President's discretion — unlike, say, the Finance Commission's fixed 5-member structure.", "globalNum": 998}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Under what four grounds can a PSC member be removed by the President?", "options": ["Found insolvent, holding office of profit, infirmity of mind/body, or misbehaviour (via a Supreme Court enquiry board)", "Only for misbehaviour, with no other grounds", "Only for reaching retirement age, with no other grounds", "Only if impeached by Parliament like a President"], "answer": 0, "explanation": "Correct: These four specific grounds — insolvency, office of profit, mental/physical infirmity, and misbehaviour (requiring SC enquiry) — provide a structured, limited basis for removal, protecting PSC members from arbitrary dismissal while still allowing accountability for genuine misconduct or incapacity.", "globalNum": 999}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Article defines 'State' for Part XIV (Services) purposes, and which Article covers 'Tenure of office at the pleasure of the President/Governor'?", "options": ["Article 308 defines 'State'; Article 310 covers tenure at pleasure", "Article 310 defines 'State'; Article 308 covers tenure", "Article 309 defines both concepts jointly", "Article 312 defines 'State'; Article 309 covers tenure"], "answer": 0, "explanation": "Correct: Article 308 provides the Part XIV-specific definition of 'State,' while Article 310 establishes the general 'pleasure' doctrine for civil servants — echoing similar 'pleasure' provisions seen for Governors (Art 156) and Ministers (Art 75(2)/164(1)).", "globalNum": 1000}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What does Article 309 cover, and what protection does Article 311 provide to civil servants?", "options": ["Art 309: recruitment & conditions of service for Union/State employees; Art 311: protection against arbitrary dismissal/removal/rank-reduction", "Art 309: dismissal protection; Art 311: recruitment conditions", "Both Articles deal exclusively with All India Services", "Article 311 grants civil servants immunity from all criminal prosecution"], "answer": 0, "explanation": "Correct: Article 309 sets the framework for recruiting and governing civil servants' service conditions, while Article 311 provides crucial due-process protections against arbitrary dismissal, removal, or rank reduction — balancing the 'pleasure doctrine' (Art 310) with fairness safeguards.", "globalNum": 1001}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "Which Article establishes All India Services, and which Article (added by which Amendment) gives Parliament power to vary/revoke their service conditions?", "options": ["Article 312 establishes All India Services; Article 312A (added by 28th CA, 1972) gives Parliament this varying/revoking power", "Article 312A establishes All India Services; Article 312 gives Parliament the varying power", "Both provisions were added by the same 42nd CA, 1976", "Neither Article relates to All India Services; they concern Union Territories"], "answer": 0, "explanation": "Correct: Article 312 is the foundational provision for All India Services (like IAS, IPS, IFoS — also relevant to the earlier RS special-resolution power discussed under Parliament), while Article 312A (28th CA, 1972) specifically empowers Parliament to adjust these services' conditions of service.", "globalNum": 1002}, {"tab": "t36", "tabTitle": "36. Constitutional Bodies", "q": "What do Articles 313 and 314 cover respectively, within Part XIV's Services chapter?", "options": ["Art 313: Transitional provisions; Art 314: Protection of existing officers", "Art 313: Protection of existing officers; Art 314: Transitional provisions", "Both cover identical protections for retired officers", "Article 314 establishes the CAG's office"], "answer": 0, "explanation": "Correct: Article 313 handles transitional arrangements as the new constitutional service framework took effect, while Article 314 specifically protects existing officers' status during this transition — both provisions serving a continuity function similar to other 'continuance' articles seen elsewhere (like 243N for Panchayats).", "globalNum": 1003}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under which Act was the State Human Rights Commission established, and who appoints its Chairperson and members?", "options": ["Protection of Human Rights Act, 1993; appointed by the Governor based on a committee's recommendation (CM, State Home Minister, Speaker, Leader of Opposition, LC Chairperson)", "National Human Rights Commission Act, 2005; appointed by the President", "Right to Information Act, 2005; appointed by the Chief Minister directly", "Lokpal and Lokayuktas Act, 2013; appointed by the Chief Justice of the High Court"], "answer": 0, "explanation": "Correct: The same 1993 Act creates both the National and State Human Rights Commissions, with the State-level body appointed by the Governor on the recommendation of a state-level committee involving the CM, Home Minister, Speaker, Opposition Leader, and LC Chairperson.", "globalNum": 1004}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "What is the composition of the State Human Rights Commission?", "options": ["Chairperson (Retired Chief Justice or High Court Judge) + 5 full-time members", "Chairperson (Retired CJI) + 3 members", "Chairperson alone, with no other members", "Chairperson + 8 members, mirroring the Lokayukta structure"], "answer": 0, "explanation": "Correct: The SHRC's leadership requirement (retired Chief Justice/HC Judge) is notably a step below the NHRC's requirement (retired CJI/SC Judge), reflecting the state-vs-national hierarchy, while both share the same '5 full-time members' structure.", "globalNum": 1005}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "How does B.R. Ambedkar's description of the CAG as 'Guide and Philosopher' to the Public Accounts Committee relate to what the CAG actually compiles?", "options": ["The CAG acts only as a 'Guide' (advisory role) to the PAC; and compiles/maintains state government accounts, NOT central government accounts, with no reappointment allowed", "The CAG compiles central government accounts exclusively, with reappointment allowed", "The CAG has no relationship with the PAC whatsoever", "The CAG maintains both central and state accounts equally, with unlimited reappointments"], "answer": 0, "explanation": "Correct: This is a subtle but important point — despite overseeing audit for the whole nation, the CAG's direct account-compiling function applies specifically to STATE government accounts (not central), guiding the PAC without formal authority over it, and the CAG position itself has no reappointment.", "globalNum": 1006}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under Article 76, who appoints the Attorney General, and what qualification is required?", "options": ["Appointed by the President; must be eligible to become a Supreme Court Judge", "Appointed by Parliament; must be a sitting High Court judge", "Appointed by the Prime Minister; must have 10 years' legal practice", "Appointed by the Chief Justice; must be a retired judge"], "answer": 0, "explanation": "Correct: This mirrors the earlier PM/Council of Ministers tab's coverage — the AG is India's highest law officer, presidentially appointed, requiring SC-Judge-level eligibility.", "globalNum": 1007}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under Article 165, who appoints the Advocate General, what is the qualification, and who assists the AG (though not a constitutional body themselves)?", "options": ["Appointed by the Governor; must be eligible for a High Court Judge position; assisted by the Solicitor General (not constitutional)", "Appointed by the President; must be eligible for SC Judge; assisted by the Attorney General", "Appointed by the CM; must have 15 years' practice; assisted by the CAG", "Appointed by the State Legislature; must be a sitting judge; assisted by the NHRC"], "answer": 0, "explanation": "Correct: The Advocate General parallels the AG at the state level, but with HC-Judge-level (not SC-Judge-level) eligibility, and is assisted by a Solicitor General figure who — unlike the AG/Advocate General themselves — is not a constitutional post.", "globalNum": 1008}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under which Act was the NHRC established, what is its composition, and by what epithet is it known?", "options": ["Protection of Human Rights Act, 1993; Chairperson (Retired CJI/SC Judge) + 5 full-time members; known as 'Watchdog of Human Rights'", "National Human Rights Act, 2005; Chairperson + 3 members; known as 'Guardian of Public Purse'", "Right to Information Act, 2005; Chairperson + 8 members; known as 'Balancing Wheel of Fiscal Federalism'", "Lokpal Act, 2013; Chairperson alone; known as 'Watchdog of Merit System'"], "answer": 0, "explanation": "Correct: NHRC's foundational Act, composition, and 'Watchdog of Human Rights' epithet are all distinct from other bodies discussed — note its Chairperson requirement is a full notch higher (CJI/SC Judge level) than the State-level SHRC (HC Judge level).", "globalNum": 1009}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Who appoints the NHRC's Chairperson, based on which committee's recommendation, and what is the tenure?", "options": ["Appointed by the President, based on a 6-member committee (PM, LS Speaker, Union Home Minister, RS Deputy Chairman, Leader of Opposition in LS & RS); tenure 3 years or 70 years of age", "Appointed by the Governor, based on a 3-member committee; tenure 5 years or 65 years of age", "Appointed by Parliament directly; tenure permanent until retirement", "Appointed by the Chief Justice; tenure 6 years fixed"], "answer": 0, "explanation": "Correct: The 6-member appointing committee and the 3-year/age-70 tenure are specific, distinctive features of the NHRC — and unlike some other bodies (like CIC), NHRC members ARE eligible for reappointment after completing their term.", "globalNum": 1010}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Who is the current NHRC Chairperson mentioned in the notes, and what does the 'NHRC AAO ReST' mnemonic relate to (regarding HC Articles 219-222)?", "options": ["Justice V. Ramasubramanian; the mnemonic covers Oath, Restrictions, Salary, and Transfer (of HC judges)", "K. Sanjay Murthy; the mnemonic covers Appointment, Age, and Oath", "Arvind Panagariya; the mnemonic covers Removal, Salary, and Tenure", "Gyanesh Kumar; the mnemonic covers only Transfer of judges"], "answer": 0, "explanation": "Correct: Justice V. Ramasubramanian is named as the current NHRC Chairperson, while the separate 'NHRC AAO ReST' mnemonic (O-Oath, R-Restrictions, S-Salary, T-Transfer) is a memory aid for High Court judge-related Articles 219-222 — an unrelated but co-located memory trick in the notes.", "globalNum": 1011}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under which Act was the Lokpal (Centre) established, and which state was the 1st to establish a Lokayukta (in what year)?", "options": ["Lokpal and Lokayuktas Act, 2013; Maharashtra was the 1st state with a Lo ucially, the Lokayukta's recommendations are NOT binding on the state government, unlike stronger enforcement mechanisms at the central Lokpal level.", "globalNum": 1014}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Who coined the term 'Lokpal,' in what year, and from which country's institution was the concept inspired?", "options": ["L.M. Singhvi coined it in 1963; inspired by the 'Ombudsman' institution from Sweden", "B.R. Ambedkar coined it in 1950; inspired by the UK's Parliamentary Commissioner", "K.C. Wheare coined it in 1973; inspired by the USA's Inspector General system", "Anna Hazare coined it in 2011; inspired by an Indian traditional institution"], "answer": 0, "explanation": "Correct: L.M. Singhvi (also known for his 1986 Panchayati Raj committee recommendations) coined 'Lokpal' back in 1963, drawing inspiration from Sweden's pioneering 'Ombudsman' concept — a much earlier origin than the 2011 Anna Hazare movement that eventually led to actual legislation.", "globalNum": 1015}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "What is the Lokpal's motto, and within how many days must preliminary inquiries be completed?", "options": ["'Ma Gridhah Kasyasvidhanam' (Do not covet anyone's wealth); preliminary inquiries within 90 days", "'Satyameva Jayate' (Truth alone triumphs); within 60 days", "'Dharma Chakra Pravartanaya' (For the movement of the wheel of law); within 30 days", "No specific motto exists; inquiries have no fixed timeline"], "answer": 0, "explanation": "Correct: The Lokpal's Sanskrit motto emphasises anti-corruption values, and it operates under a defined 90-day timeline for preliminary inquiries, with its resulting award being binding on the parties involved.", "globalNum": 1016}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "When was the Central Vigilance Commission (CVC) established, by what mechanism, and which committee recommended it?", "options": ["Established 1964, t allowed"], "answer": 0, "explanation": "Correct: CIC's 2005 origin under the RTI Act (the same year as the Act itself) and its NO-reappointment rule for members distinguishes it from bodies like NHRC, where reappointment IS allowed — an important comparative distinction.", "globalNum": 1019}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "What is the CIC's status compared to the NHRC, and what is its tenure?", "options": ["Same status as NHRC (a statutory body of similar standing); tenure 5 years or 65 years of age", "Higher status than NHRC, being a constitutional body; tenure 6 years", "Lower status than NHRC, being merely executive; tenure 3 years", "Identical to the Lokpal in every respect, including composition"], "answer": 0, "explanation": "Correct: The notes explicitly note CIC shares NHRC's general status level, with a 5-year/age-65 tenure — distinct from NHRC's own 3-year/age-70 tenure, despite the 'same status' framing referring to their broadly comparable statutory/quasi-judicial standing.", "globalNum": 1020}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "When was the CBI established, from which Act does it derive its actual legal power, and is it a statutory or executive body?", "options": ["Established 1963 by Executive Resolution; derives power from the Delhi Special Police Establishment Act, 1946; it is an Executive body, NOT statutory", "Established 1946, directly as a statutory body under its own dedicated Act", "Established 2008, alongside the NIA, as a fully constitutional body", "Established 1993, deriving power from the Protection of Human Rights Act"], "answer": 0, "explanation": "Correct: This is a frequently tested, counterintuitive fact — the CBI, despite its prominence, is technically an Executive (not statutory) body, created by resolution in 1963 but drawing its actual investigative powers from the much older 1946 Delhi Special Police Establishment Act.", "globalNum": 1021}, {"tab": "t37", ngalore", "Established 1963, alongside the CBI; headquartered in Chennai"], "answer": 0, "explanation": "Correct: UGC's 1956 establishment predates the 1990 Act mentioned as its current operational framework, and it operates from New Delhi with 6 regional centres across India — a nationwide administrative footprint for higher education oversight.", "globalNum": 1024}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Who is the current UGC Chairman mentioned in the notes, and what number chairman are they?", "options": ["Vijaya Kishore Rahatkar, the 9th chairman", "M.C. Setalvad, the 1st chairman", "BVR Subrahmanyam, the 5th chairman", "Suman K Bery, the 9th chairman"], "answer": 0, "explanation": "Correct: Vijaya Kishore Rahatkar is named as UGC's 9th chairman in the notes — distinct from the NITI Aayog figures (Bery as Vice Chairman, Subrahmanyam as CEO) mentioned elsewhere.", "globalNum": 1025}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "When was the National Commission for Women established, under which Act, and who is its current Chairperson per the notes?", "options": ["Established 31 Jan 1992, under the NCW Act, 1990; current Chairperson is Ajay Manikrao Khanwilkar", "Established 1990, under the NHRC Act; current Chairperson is V. Ramasubramanian", "Established 2005, under the RTI Act; current Chairperson is Vijaya Kishore Rahatkar", "Established 1963, alongside the Lokpal concept; no current chairperson listed"], "answer": 0, "explanation": "Correct: There's a two-year gap between the NCW Act's passage (1990) and the Commission's actual establishment (1992) — with Ajay Manikrao Khanwilkar named as the current Chairperson.", "globalNum": 1026}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "When was the National Investigation Agency (NIA) established, following which event, and under which Ministry does it operate?", "options": ["Established 2008, following the Mumbai terror attack, under the n for Transforming India') replaced the older, more centrally-directive Planning Commission on 1 January 2015, with the PM as its chairman — signalling a shift toward a more consultative planning approach.", "globalNum": 1029}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Who are NITI Aayog's Governing Council members, and who serve as its Vice Chairman and CEO per the notes?", "options": ["Governing Council: CMs of all States + Lt. Governors of UTs; Vice Chairman: Suman K Bery; CEO: BVR Subrahmanyam", "Governing Council: only Union Cabinet Ministers; Vice Chairman: BVR Subrahmanyam; CEO: Suman K Bery", "Governing Council: Supreme Court judges; Vice Chairman: the Finance Minister", "Governing Council: District Collectors nationwide; no Vice Chairman position exists"], "answer": 0, "explanation": "Correct: The Governing Council's inclusive membership (all State CMs + UT Lt. Governors) reflects NITI Aayog's cooperative-federalism design, with Suman K Bery as Vice Chairman and BVR Subrahmanyam as CEO handling day-to-day administration.", "globalNum": 1030}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "What approach does NITI Aayog follow (contrasted with the Planning Commission's approach), and what indices does it publish?", "options": ["Follows a 'Bottom Up' approach, fostering cooperative federalism; publishes the SDG India Index, National Multidimensional Poverty Index, and India Innovation Index", "Follows a 'Top Down' approach; publishes only the Human Development Index", "Follows no specific approach; publishes only GDP growth reports", "Follows a purely judicial approach; publishes court case backlogs"], "answer": 0, "explanation": "Correct: NITI Aayog's 'Bottom Up' philosophy (states/UTs providing input, rather than the Centre imposing plans top-down) is reflected in its role as an advisory think tank, and it publishes several indices tracking development, poverty, and innovation across India.", "globalNum": 1031}, {"tab": "t37", "tabTitle": "37. Statutory / Executive Bodies", "q": "Under the CVC-related provisions, within how many days must recommendations on government appointments come under the purview of the RTI Act?", "options": ["30 days", "60 days", "90 days", "15 days"], "answer": 0, "explanation": "Correct: A 30-day window applies for bringing such appointment-related recommendations under RTI Act purview — ensuring reasonably prompt public transparency around significant government appointment decisions.", "globalNum": 1032}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "From which source is India's Integrated judiciary system borrowed, and by what epithet is the Supreme Court known?", "options": ["Government of India Act, 1935; known as 'Guardian of the Constitution'", "US Constitution; known as 'Watchdog of Merit System'", "UK's Westminster system; known as 'Balancing Wheel of Fiscal Federalism'", "Ireland's Constitution; known as 'Guide and Philosopher'"], "answer": 0, "explanation": "Correct: India's single Integrated judiciary (as opposed to a dual federal-state court system like the USA) traces to the GoI Act, 1935, and the SC is called the 'Guardian of the Constitution' — the 'Watchdog' and 'Balancing Wheel' epithets belong to other bodies (PSC and Finance Commission respectively).", "globalNum": 1033}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the Supreme Court replace post-independence, and when was its 1st sitting?", "options": ["Replaced the Federal Court and the Judicial Committee of the Privy Council; 1st sitting on 28 January 1950", "Replaced only the Privy Council, not the Federal Court; 1st sitting on 26 January 1950", "Replaced the High Courts entirely; 1st sitting in 1935", "Replaced no prior institution, being an entirely new creation; 1st sitting in 1947"], "answer": 0, "explanation": "Correct: The SC absorbed the roles of both the pre-independence Federal Court (established 1937 under the GoI Act, 1935) and the British Privy Council's judicial committee, holding its first sitting on 28 January 1950 — just two days after the Constitution came into force.", "globalNum": 1034}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 124(1), what was the Supreme Court's original strength, and what is its present maximum sanctioned strength?", "options": ["Originally 1 CJ + 7 judges = 8; presently 1 CJ + 33 judges = 34 judges", "Originally 1 CJ + 33 judges; presently 1 CJ + 7 judges", "Originally and presently both fixed at 25 judges", "Originally 1 CJ + 15 judges; presently 1 CJ + 25 judges"], "answer": 0, "explanation": "Correct: The SC's strength has grown substantially from its original 8-judge composition to the present maximum of 34 — reflecting the growing volume and complexity of cases over 75 years.", "globalNum": 1035}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 124(2), who appoints Supreme Court judges, and which Amendment (124(2A)) empowered Parliament to determine judges' age?", "options": ["The President, after consulting the CJI (via Collegium); age determination empowered by the 15th CAA, 1963", "The CJI directly appoints judges; age determined by the 42nd CAA", "Parliament appoints judges directly; age fixed permanently by the original Constitution", "The Collegium alone appoints judges with no presidential role"], "answer": 0, "explanation": "Correct: Formal presidential appointment (following CJI/Collegium consultation) combines with the 15th CAA's (1963) grant of age-determination power to Parliament — though notably, the retirement age itself (65) is fixed by the Constitution's text, while the 15th CAA addressed related determination mechanisms.", "globalNum": 1036}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 124(3), what are the qualifications for becoming a Supreme Court judge, and is a minimum age specified?", "options": ["Citizen of India, PLUS either (a) 5+ years as HC Judge, (b) 10+ years as HC Advocate, or (c) Distinguished jurist — NO minimum age is mentioned", "Citizen of India, minimum age 35, with 10 years' judicial experience mandatory", "Citizen of India, minimum age 45, with no other qualifications needed", "Any age, as long as they hold a law degree from a recognised university"], "answer": 0, "explanation": "Correct: Unlike many other high offices (President, Governor, etc.), Article 124(3) notably specifies NO minimum age for SC judges — eligibility instead hinges on professional experience/distinction through one of three alternative pathways.", "globalNum": 1037}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 124(4), how is an SC judge removed, from which country is this borrowed, and on what grounds?", "options": ["By the President after Parliament passes an address by Special Majority; borrowed from the USA; grounds are 'proved misbehaviour or incapacity'", "By the CJI directly; borrowed from the UK; grounds are 'political disagreement'", "By a simple parliamentary vote; borrowed from Ireland; no specific grounds required", "By the Collegium's own internal vote; borrowed from Canada; grounds are 'loss of confidence'"], "answer": 0, "explanation": "Correct: This impeachment-like removal process (borrowed from the USA) requires Special Majority parliamentary approval and can only proceed on the specific grounds of proved misbehaviour or incapacity — a high bar protecting judicial independence.", "globalNum": 1038}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 124(7), what restriction applies to a retired Supreme Court judge?", "options": ["Cannot practice law in ANY court in India", "Can practice law only in High Courts, not the Supreme Court", "Can practice law freely in any court, with no restriction", "Can practice law only for 5 years after retirement"], "answer": 0, "explanation": "Correct: A complete, absolute bar on practicing law anywhere in India applies to retired SC judges — a much stricter restriction than the one applying to retired HC judges (who CAN practice before the SC and other High Courts, per Article 220).", "globalNum": 1039}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under which Act is the procedure for removal of SC/HC judges mentioned, and what signature threshold triggers a removal motion?", "options": ["Judges Enquiry Act, 1968; motion must be signed by 50 RS members or 100 LS members", "Judges Enquiry Act, 1968; motion needs only 25 members from either House", "Contempt of Courts Act, 1971; motion needs a simple majority of either House", "Representation of the People Act, 1951; no signature threshold required"], "answer": 0, "explanation": "Correct: The 1968 Act operationalises Article 124(4)/124(5)'s removal framework, requiring a substantial signature threshold (50 RS or 100 LS members) before a removal motion can even be formally initiated.", "globalNum": 1040}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Who was the 1st Supreme Court judge to face an impeachment motion, and when was it initiated?", "options": ["Justice V. Ramaswami, motion initiated in 1991", "Justice Fathima Beevi, motion initiated in 1989", "Justice Leila Seth, motion initiated in 1998", "Chief Justice Y.V. Chandrachud, motion initiated in 1985"], "answer": 0, "explanation": "Correct: Justice V. Ramaswami faced India's first-ever SC judge impeachment attempt (1991), though the motion ultimately failed to secure the required parliamentary majority — no SC judge has ever actually been successfully removed via this process.", "globalNum": 1041}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the Sapru Committee (1944-45), chaired by Sir Tej Bahadur Sapru, recommend, and how directly did this influence the Constitution's judiciary provisions?", "options": ["Recommended establishing an independent judiciary including a Supreme Court — but the actual constitutional provisions were NOT solely based on this recommendation", "Recommended abolishing the judiciary entirely; fully rejected by the Constituent Assembly", "Recommended the exact Collegium system used today; fully adopted verbatim", "Recommended a purely executive-controlled judiciary; fully implemented"], "answer": 0, "explanation": "Correct: While the Sapru Committee's independent-judiciary vision aligned with what the Constitution eventually adopted, the notes specifically flag that the final provisions weren't SOLELY derived from this one committee — multiple influences (including the GoI Act, 1935, and comparative constitutional study) shaped the final design.", "globalNum": 1042}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What is the Collegium System, and is it explicitly mentioned in the Constitution?", "options": ["A system where judge appointments/transfers are decided by a forum of the CJI + 4 senior-most judges — it is NOT mentioned in the Constitution", "A formally codified constitutional body under Article 124(2A)", "A parliamentary committee explicitly named in Article 217", "A system created directly by the 99th Constitutional Amendment"], "answer": 0, "explanation": "Correct: The Collegium is entirely a judicial creation, evolved through case law (the 'Judges Cases') rather than explicit constitutional text — the 99th CA actually tried to REPLACE it with the NJAC, not create it.", "globalNum": 1043}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the 1st Judges Case (S.P. Gupta, 1982) rule regarding the CJI's recommendation on judicial appointments?", "options": ["The CJI's recommendation was NOT binding on the President, giving primacy to the Executive", "The CJI's recommendation WAS fully binding, establishing judicial primacy from the start", "The case established the Collegium system directly", "The case dealt only with removal procedures, not appointments"], "answer": 0, "explanation": "Correct: The 1st Judges Case initially favoured Executive primacy in judicial appointments — a position that would be dramatically reversed just over a decade later by the 2nd Judges Case.", "globalNum": 1044}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the 2nd Judges Case (1993) establish, reinterpreting the word 'consultation'?", "options": ["Introduced the Collegium system, holding 'Consultation' effectively means 'Concurrence'; recommendation by CJI + 2 senior judges became binding", "Reaffirmed Executive primacy from the 1st Judges Case", "Struck down the entire concept of judicial appointments via consultation", "Established the NJAC as the appointment mechanism"], "answer": 0, "explanation": "Correct: This landmark reversal reinterpreted 'consultation' as effectively requiring 'concurrence,' birthing the modern Collegium system and shifting decisive power to a small group of senior judges (CJI + 2, at this initial stage) rather than the Executive.", "globalNum": 1045}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the 3rd Judges Case (1998) do to the Collegium's composition?", "options": ["Expanded the Collegium to 5 members (CJI + 4 senior judges), with its recommendation binding on the President", "Reduced the Collegium to just the CJI alone", "Abolished the Collegium, reinstating the 1st Judges Case position", "Transferred Collegium powers to Parliament"], "answer": 0, "explanation": "Correct: The 3rd Judges Case expanded the Collegium from 3 to 5 members, cementing the current CJI+4 structure and reinforcing its binding nature on the President — a further consolidation of judicial control over appointments.", "globalNum": 1046}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did the 4th Judges Case (2015, SC Advocate on Record Assoc.) rule regarding the 99th CA and NJAC?", "options": ["The 99th CA was declared unconstitutional, the NJAC Act was struck down, and the Collegium system was restored", "The 99th CA was upheld, permanently replacing the Collegium with the NJAC", "The case ruled the Collegium itself was unconstitutional", "The case deferred the decision to Parliament indefinitely"], "answer": 0, "explanation": "Correct: This 2015 ruling struck down the executive-legislative attempt (via the 99th CA and NJAC Act, both from 2014) to reform judicial appointments, restoring the judiciary's own Collegium-based control — a major affirmation of judicial independence as part of the Basic Structure.", "globalNum": 1047}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Who was the 1st female judge of the Supreme Court, and in what year was she appointed? Has India ever had a female CJI?", "options": ["Justice Fathima Beevi, appointed 1989; India has had NO female CJI to date", "Justice Leila Seth, appointed 1989; India has had one female CJI", "Justice Anna Chandy, appointed 1959; India has had two female CJIs", "Justice B.V. Nagarathna, appointed 1989; she has already served as CJI"], "answer": 0, "explanation": "Correct: Justice Fathima Beevi broke this barrier in 1989, but remarkably, India has never had a female Chief Justice of India — though per the notes, Justice B.V. Nagarathna is expected to become the 1st woman CJI in September 2027, based on seniority.", "globalNum": 1048}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 129, what is the Supreme Court's status as a 'Court of Record,' and what related power does it hold?", "options": ["Its decisions are preserved as precedent; it also has the power to punish for 'Contempt of Court' (a term NOT defined in the Constitution)", "It merely archives old case files with no legal significance", "It has no special powers beyond ordinary case adjudication", "'Court of Record' status only applies to High Courts, not the Supreme Court"], "answer": 0, "explanation": "Correct: 'Court of Record' status means SC decisions serve as binding precedent, and the associated contempt power lets the SC punish disrespect toward its authority — notably, 'Contempt of Court' itself remains undefined in the constitutional text, similar to how 'Untouchability' (Art 17) is also left undefined.", "globalNum": 1049}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 130, where is the Supreme Court's seat located, and can it sit elsewhere?", "options": ["Delhi; it CAN sit elsewhere if the CJI recommends and the President approves", "Delhi permanently, with no provision to sit elsewhere ever", "Mumbai; can relocate only during a National Emergency", "Wherever the CJI personally chooses, with no presidential approval needed"], "answer": 0, "explanation": "Correct: While Delhi is the default seat, Article 130 provides flexibility for the SC to convene elsewhere, subject to a CJI recommendation AND presidential approval — a check-and-balance mechanism for this potentially significant procedural change.", "globalNum": 1050}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 131, what does the Supreme Court's 'Original Jurisdiction' cover, and is it exclusive?", "options": ["Exclusive jurisdiction over disputes between the Government of India and states, or between states themselves", "Non-exclusive jurisdiction shared with High Courts over any civil dispute", "Original jurisdiction covers only criminal appeals from High Courts", "Original jurisdiction applies only to Fundamental Rights violations"], "answer": 0, "explanation": "Correct: Article 131's Original Jurisdiction is EXCLUSIVE to the SC for Centre-State or inter-state disputes — no other court can hear these specific categories of cases, reflecting the SC's unique federal-arbiter role.", "globalNum": 1051}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What do Articles 132, 133, and 134 respectively cover regarding Appellate Jurisdiction?", "options": ["132: Constitutional matters (HC→SC); 133: Civil matters; 134: Criminal matters", "132: Civil matters; 133: Criminal matters; 134: Constitutional matters", "All three cover identical Original Jurisdiction matters", "132: Criminal matters; 133: Constitutional matters; 134: Civil matters"], "answer": 0, "explanation": "Correct: These three consecutive Articles divide the SC's appellate jurisdiction by subject matter — constitutional, civil, and criminal appeals from High Courts each getting their own dedicated provision.", "globalNum": 1052}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 136, what is 'Special Leave to Appeal,' and from which bodies can the SC NOT grant this leave?", "options": ["The SC's discretionary power to hear appeals from any court/tribunal, EXCEPT Armed Forces courts/Court Martial", "A mandatory appeal right available to any litigant from any court including military tribunals", "A power available only to the President, not the SC itself", "A power limited exclusively to civil matters, excluding all criminal cases"], "answer": 0, "explanation": "Correct: Article 136 gives the SC broad, though NOT unlimited, discretionary appellate power — the notable carve-out being military courts/Court Martial, which fall outside this special leave jurisdiction.", "globalNum": 1053}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 137, can the Supreme Court review its own judgments? And what does Article 141 establish?", "options": ["Yes, Article 137 allows SC self-review; Article 141 makes SC's declared law binding on ALL courts in India", "No, SC judgments can never be reviewed by any court including itself; Article 141 is about court fees", "Yes, but only the President can authorise such review; Article 141 deals with contempt", "Article 137 deals with binding precedent; Article 141 deals with self-review (the reverse pairing)"], "answer": 0, "explanation": "Correct: Article 137 grants the SC self-review power over its own judgments, while Article 141 separately establishes that SC-declared law binds all courts nationwide — reinforcing the SC's position at the apex of India's integrated judicial hierarchy.", "globalNum": 1054}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 142, what can the Supreme Court do to ensure 'complete justice,' and under Article 143, what is the nature of the SC's Advisory Jurisdiction?", "options": ["Art 142: SC may pass any order necessary for complete justice; Art 143: President may seek SC's advice on important matters, but this advice is NOT binding", "Art 142: only Parliament can pass such orders; Art 143: SC's advice is fully binding on the President", "Art 142 and 143 both deal with the same enforcement power", "Art 143 gives the SC power to overrule presidential decisions unilaterally"], "answer": 0, "explanation": "Correct: Article 142's broad 'complete justice' power gives the SC significant flexibility (seen in practice in cases like the Ayodhya verdict's land allocation), while Article 143's Advisory Jurisdiction remains explicitly non-binding — the President can seek, but need not follow, the SC's opinion.", "globalNum": 1055}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 139A, what special power does the Supreme Court have regarding cases pending in different High Courts?", "options": ["Empowers the SC to transfer cases/appeals from High Courts to itself", "Empowers the SC to create new High Courts as needed", "Empowers the SC to appoint High Court judges directly", "Empowers the SC to dissolve a High Court entirely"], "answer": 0, "explanation": "Correct: Article 139A lets the SC consolidate related cases from multiple High Courts by transferring them to itself — useful for ensuring consistent rulings on matters of common significance across different states.", "globalNum": 1056}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Using the mnemonic 'SC me SAARC countries ko SEAT OFFER Kari,' which Articles does this trick help remember?", "options": ["Article 125 (Salaries), 126 (Acting CJI), 127 (Ad Hoc judges), 128 (Retired judges), 129 (Court of Record), 130 (Seat), 131 (Original Jurisdiction)", "Articles 132-138 (various Appellate Jurisdiction provisions)", "Articles 139-147 (Advisory Jurisdiction through Interpretation)", "Articles 148-151 (CAG-related provisions)"], "answer": 0, "explanation": "Correct: This mnemonic maps letters (S-A-A-R-C-Seat-Offer) to the sequential Articles 125 through 131 — a memory device for this specific run of consecutive SC-related provisions.", "globalNum": 1057}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What is 'Judicial Activism,' and which three cases are cited as examples in the notes?", "options": ["A tool enabling the SC to go beyond strict laws to ensure fairness; examples include Union Carbide vs UOI (1989), Vishakha vs State of Rajasthan (1997), and the Ayodhya Verdict (2019)", "A tool restricting the SC to only literal statutory interpretation; examples include only routine civil cases", "A term describing Parliament's power to override SC judgments", "A concept applicable only to High Courts, not the Supreme Court"], "answer": 0, "explanation": "Correct: These three landmark cases (Bhopal gas tragedy compensation, workplace sexual harassment guidelines, and the Ayodhya land dispute resolution) all exemplify the SC proactively shaping outcomes beyond narrow statutory text, in the service of broader justice.", "globalNum": 1058}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Who coined the term 'Judicial Activism,' and which body identified the 3 categories of Judicial Review (per Justice Syed Shah Mohammed Quadri)?", "options": ["Arthur Schlesinger Jr. coined 'Judicial Activism'; Justice Quadri identified 3 categories: amendments, legislation, and administrative action review", "B.R. Ambedkar coined 'Judicial Activism'; the categories were identified by the Sarkaria Commission", "K.C. Wheare coined the term; categories identified by the Law Commission", "N.A. Palkhivala coined the term; categories identified by the 2nd Judges Case"], "answer": 0, "explanation": "Correct: Arthur Schlesinger Jr. (an American historian) originated 'Judicial Activism' as a term, while Justice Quadri's three-fold categorisation (constitutional amendments, legislative review, and administrative action review) provides a useful framework for understanding judicial review's scope — a concept itself borrowed from the US Constitution.", "globalNum": 1059}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 214, how many High Courts presently exist in India, and what does Article 215 establish for them?", "options": ["25 High Courts; Article 215 makes each a 'Court of Record,' paralleling Article 129 for the SC", "28 High Courts; Article 215 establishes writ jurisdiction", "22 High Courts; Article 215 covers judges' salaries", "25 High Courts; Article 215 covers judges' appointment"], "answer": 0, "explanation": "Correct: India's 25 High Courts each hold 'Court of Record' status (Article 215), mirroring the Supreme Court's own Article 129 status — some High Courts, notably, serve multiple states/UTs jointly, which is why 25 HCs cover more than 25 individual territories.", "globalNum": 1060}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 217, who appoints High Court judges, what is the maximum age, and what are the qualifications?", "options": ["Appointed by the President (in consultation with CJI, Governor, and HC's Chief Justice — Collegium); max age 62; qualification: 10 years holding judicial office OR 10 years as HC advocate", "Appointed by the Governor alone; max age 65; qualification: 5 years as SC judge", "Appointed by the CJI directly; max age 60; no specific qualification needed", "Appointed by Parliament; max age 70; qualification: distinguished jurist only"], "answer": 0, "explanation": "Correct: HC judges retire at 62 (three years younger than the SC's 65), and their appointment involves a broader consultative Collegium process including both the Governor and HC's CJ, alongside the SC's CJI.", "globalNum": 1061}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "What did Article 217(3), inserted by the 15th Amendment (1963), establish regarding age disputes for HC judges?", "options": ["The President's decision on a judge's age is final and NOT subject to judicial review", "Age disputes must be resolved by the Supreme Court, with full judicial review available", "Age determination is left entirely to the concerned HC's Chief Justice", "No mechanism exists for resolving age-related disputes"], "answer": 0, "explanation": "Correct: This provision insulates the President's age determination from judicial challenge — providing finality and avoiding potentially disruptive litigation over a judge's exact retirement date.", "globalNum": 1062}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 220, can a retired High Court judge practice law, and if so, where?", "options": ["Cannot practice before any court EXCEPT the Supreme Court and other High Courts (not their own former HC)", "Can practice anywhere, including their own former High Court", "Cannot practice law anywhere, an absolute lifetime bar like SC judges", "Can practice only in subordinate/district courts, not any High Court"], "answer": 0, "explanation": "Correct: Retired HC judges get a more limited restriction than retired SC judges (Art 124(7)'s absolute bar) — they CAN practice before the SC and other High Courts, but crucially not before their OWN former High Court, avoiding potential conflicts of interest or undue influence.", "globalNum": 1063}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "Under Article 222 hed the Collegium system", "A term for judicial precedent; the case dealt with SC judge removal"], "answer": 0, "explanation": "Correct: S.P. Gupta's landmark 1981 ruling on locus standi (interestingly, the SAME case also known as the '1st Judges Case' on judicial appointments) opened the courtroom door to public-spirited litigants acting on behalf of those unable to approach courts themselves — a foundational moment for India's now-extensive PIL jurisprudence.", "globalNum": 1081}, {"tab": "t38", "tabTitle": "38. Supreme Court & High Court", "q": "According to the notes' Quick Summary, what is the maximum number of Supreme Court judges, how many High Courts exist, and what is the High Court judges' maximum retirement age?", "options": ["SC: 34 judges max; 25 High Courts; HC retirement age 62", "SC: 25 judges max; 34 High Courts; HC retirement age 65", "SC: 30 judges max; 22 High Courts; HC retirement age 60", "SC: 34 judges max; 22 High Courts; HC retirement age 58"], "answer": 0, "explanation": "Correct: This summary consolidates the key numerical facts from the tab — the SC's 34-judge cap, the count of 25 High Courts nationwide, and the HC judges' 62-year retirement age (three years below the SC's 65-year cap).", "globalNum": 1082}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "India replaced its colonial-era criminal laws with three new laws, effective from which date?", "options": ["1 July 2024", "26 January 2024", "15 August 2023", "1 January 2024"], "answer": 0, "explanation": "Correct: The three new criminal laws became effective on 1 July 2024, marking a significant modernisation of India's criminal justice framework decades after independence.", "globalNum": 1083}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Which new law replaced the Indian Penal Code (IPC), 1860, and what does it primarily define?", "options": ["Bharatiya Nyaya Sanhita (BNS), 2023 — defines crimes and punishments", "Bharatiya Nagarik Suraksha Sanhita ( g", "106(1): up to 10 years; 106(2): up to 5 years (the reverse)", "Both provisions carry identical punishment of up to 7 years", "106(1) deals with hit-and-run; 106(2) deals with general negligence"], "answer": 0, "explanation": "Correct: The significantly harsher punishment for hit-and-run with fleeing (up to 10 years + fine, vs. 5 years for general negligence) reflects the additional culpability of abandoning a victim and evading accountability — a provision that drew notable public attention (including transporter protests) upon BNSS's rollout.", "globalNum": 1102}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Which BNSS Section covers 'Arrest without a warrant or magistrate order,' and which covers the arrested person's right to meet an advocate during interrogation?", "options": ["Section 35 for arrest without warrant; Section 38 for right to meet an advocate", "Section 38 for arrest without warrant; Section 35 for right to meet an advocate", "Section 47 for both provisions", "Section 58 for arrest without warrant; Section 50 for advocate access"], "answer": 0, "explanation": "Correct: Section 35 addresses warrantless arrest circumstances, while Section 38 specifically protects the arrested person's right to legal counsel during interrogation — both important early-stage procedural safeguards.", "globalNum": 1103}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Which BNSS Section requires informing the arrested person of grounds of arrest and right to bail, and which empowers seizure of offensive weapons found on the arrested person?", "options": ["Section 47 for grounds of arrest/bail right; Section 50 for weapon seizure", "Section 50 for grounds of arrest; Section 47 for weapon seizure", "Section 58 for both provisions", "Section 62 for grounds of arrest; Section 105 for weapon seizure"], "answer": 0, "explanation": "Correct: Section 47 ensures transparency about why someone is arrested and their bail options, while Section ipatory Bail", "Section 482 for Bail; Section 481 for Anticipatory Bail", "Section 479 for both types of bail", "Section 530 for Bail; Section 479 for Anticipatory Bail"], "answer": 0, "explanation": "Correct: Sections 481 and 482 are consecutive provisions covering regular Bail and pre-arrest Anticipatory Bail respectively — the latter being crucial protection for individuals fearing arrest on non-bailable charges before any actual arrest occurs.", "globalNum": 1107}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Which BNSS Section specifies the maximum detention period for undertrial prisoners, and which Section mandates that all trials/proceedings be conducted in electronic mode?", "options": ["Section 479 for maximum undertrial detention; Section 530 for electronic-mode trials", "Section 530 for maximum undertrial detention; Section 479 for electronic-mode trials", "Section 481 covers both provisions", "Section 105 covers maximum detention; Section 173 covers electronic trials"], "answer": 0, "explanation": "Correct: Section 479 addresses the important undertrial-prisoner protection (preventing indefinite pre-conviction detention — echoing the earlier Hussainara Khatoon case's spirit), while Section 530, the highest-numbered provision discussed, mandates electronic conduct of trials — a capstone digitalisation measure.", "globalNum": 1108}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Under BNSS's Investigation Reforms, when is forensic investigation mandatory, and what technological allowances are made?", "options": ["Mandatory for offences carrying 7+ years punishment; videography of search/seizure is compulsory, and voice samples are allowed as evidence", "Mandatory for all offences regardless of punishment severity; videography is optional", "Never mandatory, remaining entirely at police discretion; voice samples are inadmissible", "Mandatory only for cybercrime; no other forensic requirements exist"], "answer": 0, "explana lity of the original document is established.", "globalNum": 1113}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "Under BSA Section 23, is a confession made to a police officer admissible in court, and what type of confession IS admissible?", "options": ["A confession to a police officer is INADMISSIBLE; only voluntary confessions free from coercion, threat, or inducement are admissible", "Any confession to a police officer is fully admissible, regardless of circumstances", "Confessions are never admissible under any circumstances in Indian courts", "Only written confessions are admissible; oral confessions are always barred"], "answer": 0, "explanation": "Correct: This provision continues a long-standing principle in Indian evidence law (also present in the earlier Evidence Act) — police-extracted confessions carry inherent coercion risks, so only genuinely voluntary confessions, free from any pressure, hold evidentiary value.", "globalNum": 1114}, {"tab": "t39", "tabTitle": "39. New Criminal Laws 2023", "q": "What is the overall significance of the three new criminal laws, per the notes' concluding summary?", "options": ["A shift from a colonial to a modern justice system, focusing on digitalisation, speedy justice, victim rights, and national security", "A complete reversion to purely traditional, pre-colonial legal customs", "A minor administrative renaming exercise with no substantive changes", "A shift focused exclusively on reducing court fees, with no other reforms"], "answer": 0, "explanation": "Correct: This overarching theme — moving beyond over 150 years of colonial-era legal frameworks toward a modernised, victim-centred, digitally-enabled, and security-conscious justice system — ties together all the specific reforms discussed across BNS, BNSS, and BSA.", "globalNum": 1115}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "What did the Age of Consent Act, 1891 change?", "options": ["Raised the minimum marital age for girls from 10 to 12 years", "Raised the minimum marital age for girls from 12 to 18 years", "Lowered the minimum marital age for boys from 21 to 18 years", "Abolished child marriage entirely with immediate effect"], "answer": 0, "explanation": "Correct: This colonial-era reform raised the marital age minimum from 10 to 12 years for girls — a modest but historically significant step in a much longer reform process that eventually led to today's higher legal marriage age standards.", "globalNum": 1116}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Which state was the 1st in independent India to hold elections based on Universal Adult Franchise?", "options": ["Manipur", "Kerala", "Punjab", "Rajasthan"], "answer": 0, "explanation": "Correct: Manipur holds this historical distinction, having conducted such elections even before the Constitution's general commencement extended universal adult franchise nationwide.", "globalNum": 1117}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "What did the 40th Constitutional Amendment Act, 1976 do, by amending which Article?", "options": ["Brought India's maritime zones (territorial waters, continental shelf, EEZ) under Parliament's jurisdiction, by amending Article 297", "Gave statehood to a new North-Eastern state, by amending Article 371", "Introduced Fundamental Duties, by amending Article 51A", "Reduced the voting age, by amending Article 326"], "answer": 0, "explanation": "Correct: This amendment specifically addressed India's maritime jurisdiction (territorial waters, continental shelf, Exclusive Economic Zone) via Article 297 — a relatively narrow but strategically important constitutional change, separate from the more famous 42nd CA of the same decade.", "globalNum": 1118}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "What does the phrase 'Reward for Loyalty,' as used in Ministerial Selection, refer to?", "options": ["Recognition of a person's long-standing support, commitment, and loyalty to their party/leadership when selecting them as a Minister", "A formal constitutional Article governing ministerial appointments", "A financial bonus paid to Ministers for tenure completion", "A specific clause in the Anti-Defection Law"], "answer": 0, "explanation": "Correct: This is an informal political practice/consideration (not a constitutional or legal requirement) that often factors into how Prime Ministers/Chief Ministers select their Council of Ministers, rewarding political loyalty rather than purely merit or portfolio expertise.", "globalNum": 1119}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Which state has the smallest Legislative Assembly (Vidhan Sabha) in India, and how many members does it have?", "options": ["Sikkim, with only 32 members", "Goa, with 40 members", "Mizoram, with 40 members", "Nagaland, with 60 members"], "answer": 0, "explanation": "Correct: Sikkim's 32-member Assembly is the smallest in India — even smaller than Goa's or Mizoram's 40-member Assemblies, reflecting Sikkim's status as India's least populous or one of its smallest states.", "globalNum": 1120}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "On 9 August 2021, Parliament passed which Bill, and what was its purpose?", "options": ["Limited Liability Partnership (Amendment) Bill, 2021 — aimed at ease of doing business and decriminalising certain offences", "Citizenship (Amendment) Bill — aimed at granting citizenship to specific religious minorities", "Consumer Protection (Amendment) Bill — aimed at strengthening consumer rights", "Right to Information (Amendment) Bill — aimed at restricting RTI applications"], "answer": 0, "explanation": "Correct: This 2021 LLP Amendment Bill specifically targeted business-friendly reforms, including decriminalising certain minor offences to reduce compliance burden on businesses — part of a broader 'ease of doing business' policy push.", "globalNum": 1121}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Which Constitutional Amendment inserted Article 371A (Special provisions for Nagaland), and in what year?", "options": ["13th Constitutional Amendment Act, 1962", "12th Constitutional Amendment Act, 1962", "36th Constitutional Amendment Act, 1975", "7th Constitutional Amendment Act, 1956"], "answer": 0, "explanation": "Correct: The 13th CA (1962) — the same amendment covered earlier in the State Formation and Constitutional Amendment tabs — granted Nagaland statehood alongside these special Article 371A provisions.", "globalNum": 1122}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "What does John Austin's 'Legal Positivism Theory' state about the nature of law?", "options": ["Law is a set of rules created and enforced by the state; its validity does NOT depend on morality or ethics (law = command of the sovereign)", "Law's validity depends entirely on its moral and ethical correctness", "Law is derived exclusively from religious or divine sources", "Law only exists when unanimously agreed upon by all citizens"], "answer": 0, "explanation": "Correct: Austin's positivist view deliberately separates law's VALIDITY (a matter of proper state authority/command) from its MORALITY (a separate philosophical question) — a foundational jurisprudential theory distinguishing 'is law' from 'is good law.'", "globalNum": 1123}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Who typically heads most Cabinet Committees, and which specific Committee is the notable exception, usually headed instead by the Minister of Defence?", "options": ["Most headed by the Prime Minister; the Committee on Parliamentary Affairs is usually headed by the Minister of Defence instead", "Most headed by the Home Minister; Committee on Parliamentary Affairs headed by the PM", "Most headed by the Finance Minister; no exceptions exist", "All Cabinet Committees are headed exclusively by the President"], "answer": 0, "explanation": "Correct: While the PM typically chairs the bulk of Cabinet Committees (reflecting the PM's central executive role), the Committee on Parliamentary Affairs is a notable exception, conventionally headed by the Defence Minister — an interesting deviation from the general pattern.", "globalNum": 1124}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Under which Act does the National Consumer Disputes Redressal Commission (NCDRC) currently operate, and what did this Act replace?", "options": ["Consumer Protection Act, 2019 — replaced the earlier Consumer Protection Act, 1986", "Consumer Protection Act, 1986 — still currently in force, unreplaced", "Right to Information Act, 2005 — replaced no prior consumer law", "Legal Services Authorities Act, 1987 — replaced the 1986 Act"], "answer": 0, "explanation": "Correct: The 2019 Act modernised India's consumer protection framework, replacing the older 1986 legislation and providing the current legal basis for NCDRC's operations.", "globalNum": 1125}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "When was the 1st Pay Commission established and when did it report, and who chaired it?", "options": ["Established Jan 1946, reported May 1947; chaired by Srinivasa Varadachariar", "Established 1957, reported 1959; chaired by Jagannath Das", "Established 1947, reported 1950; chaired by K.C. Neogy", "Established 1950, reported 1955; chaired by M.C. Setalvad"], "answer": 0, "explanation": "Correct: The 1st Pay Commission's work (1946-1947) actually predates India's full independence, chaired by Srinivasa Varadachariar — distinct from the later Finance Commission chairs discussed in the Constitutional Bodies tab.", "globalNum": 1126}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "When was the 2nd Pay Commission appointed, and who chaired it?", "options": ["Appointed August 1957, chaired by Jagannath Das", "Appointed January 1946, chaired by Srinivasa Varadachariar", "Appointed 1970, chaired by K.C. Neogy", "Appointed 1990, chaired by M.C. Setalvad"], "answer": 0, "explanation": "Correct: The 2nd Pay Commission followed roughly a decade after the 1st, appointed in August 1957 under Jagannath Das's chairmanship — part of the periodic review process for government employee compensation.", "globalNum": 1127}, {"tab": "t40", "tabTitle": "40. Noteworthy Points (Miscellaneous)", "q": "Under Article 341(1), who is empowered to specify castes/races/tribes as 'Scheduled Castes' in a state/UT, and after consulting whom?", "options": ["The President, after consulting the State Governor, by public notification", "The Governor, after consulting the President", "Parliament, after consulting the Supreme Court", "The State Legislature, after consulting the National Commission for SCs"], "answer": 0, "explanation": "Correct: Article 341(1) vests this specification power in the President (exercised via public notification), but only after consulting the relevant State Governor — ensuring state-level input into what is ultimately a centrally-declared classification with significant implications for reservation and welfare policy.", "globalNum": 1128}]
</script>
<script>
  const DATA = JSON.parse(document.getElementById('quiz-data').textContent);
  const letters = ['A','B','C','D'];

  // group by tab, preserving first-seen order
  const tabOrder = [];
  const tabTitles = {};
  const grouped = {};
  DATA.forEach(q => {
    if(!grouped[q.tab]){ grouped[q.tab] = []; tabOrder.push(q.tab); tabTitles[q.tab] = q.tabTitle; }
    grouped[q.tab].push(q);
  });

  const tabsScroll = document.getElementById('tabsScroll');
  const jumpSelect = document.getElementById('jumpSelect');
  const mainContent = document.getElementById('mainContent');

  tabOrder.forEach((tid, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    btn.dataset.tab = tid;
    btn.textContent = tabTitles[tid];
    btn.addEventListener('click', () => { activateTab(tid); btn.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); });
    tabsScroll.appendChild(btn);

    const opt = document.createElement('option');
    opt.value = tid;
    opt.textContent = tabTitles[tid];
    jumpSelect.appendChild(opt);

    const section = document.createElement('section');
    section.className = 'panel' + (idx===0 ? ' active' : '');
    section.id = tid;
    const h2 = document.createElement('h2');
    h2.className = 'section-title';
    h2.textContent = tabTitles[tid];
    section.appendChild(h2);
    const qc = document.createElement('p');
    qc.className = 'qcount';
    qc.textContent = grouped[tid].length + ' questions';
    section.appendChild(qc);

    grouped[tid].forEach((q, qi) => {
      const card = document.createElement('div');
      card.className = 'qcard';

      const num = document.createElement('div');
      num.className = 'qnum';
      num.textContent = 'Question ' + q.globalNum;
      card.appendChild(num);

      const qt = document.createElement('p');
      qt.className = 'qtext';
      qt.textContent = q.q;
      card.appendChild(qt);

      const explain = document.createElement('div');
      explain.className = 'explain';
      explain.innerHTML = '<span class="tag">Explanation: </span>' + q.explanation;

      q.options.forEach((optText, oi) => {
        const ob = document.createElement('button');
        ob.className = 'opt';
        ob.innerHTML = '<span class="lbl">' + letters[oi] + '.</span>' + optText;
        ob.addEventListener('click', () => {
          if(ob.classList.contains('locked')) return;
          const allOpts = card.querySelectorAll('.opt');
          allOpts.forEach((o,i) => {
            o.classList.add('disabled','locked');
            if(i === q.answer) o.classList.add('correct');
          });
          if(oi !== q.answer) ob.classList.add('wrong');
          explain.classList.add('show');
        });
        card.appendChild(ob);
      });

      card.appendChild(explain);
      section.appendChild(card);
    });

    mainContent.appendChild(section);
  });

  function activateTab(tabId){
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === tabId));
    jumpSelect.value = tabId;
    window.scrollTo({top:0, behavior:'smooth'});
  }
  jumpSelect.addEventListener('change', () => {
    activateTab(jumpSelect.value);
    const btn = document.querySelector('.tab-btn[data-tab="'+jumpSelect.value+'"]');
    if(btn) btn.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });

  const toTopBtn = document.getElementById('toTopBtn');
  window.addEventListener('scroll', () => {
    if(window.scrollY > 300){ toTopBtn.classList.add('show'); }
    else{ toTopBtn.classList.remove('show'); }
  });
  toTopBtn.addEventListener('click', () => { window.scrollTo({top:0, behavior:'smooth'}); });
</script>
</body>
