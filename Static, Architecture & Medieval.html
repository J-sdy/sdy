<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #14213d;
  }

  .app-header {
    background: linear-gradient(135deg, #14213d 0%, #1e3a5f 55%, #4a6fa5 100%);
    color: #fff;
    padding: 14px 16px 0;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    position: static; /* not sticky, scrolls with the page */
  }
  .app-header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.25rem;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .app-header p {
    font-size: 0.78rem;
    opacity: 0.8;
    margin-bottom: 12px;
  }

  /* ===== Horizontal Tab Bar ===== */
  .tab-bar {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    position: static; /* not sticky */
  }
  .tab-bar::-webkit-scrollbar { height: 4px; }
  .tab-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

  .tab-item {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-size: 0.85rem;
    font-weight: 700;
    padding: 12px 20px 10px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
  }
  .tab-item.active {
    color: #fff;
    border-bottom-color: #ffb703;
  }
  .tab-item:not(.active):hover {
    color: #fff;
    border-bottom-color: rgba(255,255,255,0.3);
  }

  .frame-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 92px);
    background: #f7f8fb;
  }
  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: #fff;
  }
  iframe.active { display: block; }

  .loading-msg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6b6b6b;
    font-size: 0.95rem;
  }

  /* ===== Global Scroll-to-top button ===== */
  #globalScrollTop {
    position: fixed;
    bottom: 20px;
    right: 18px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #1e3a5f;
    color: #fff;
    font-size: 1.25rem;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #globalScrollTop.show { display: flex; }
  #globalScrollTop:hover { background: #2a4d78; }
</style>
</head>

    var len = binary.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function loadTopic(key) {
    if (loaded[key]) return;
    var iframe = document.getElementById("frame-" + key);
    var content = b64ToUtf8(ENCODED[key]);
    iframe.srcdoc = content;
    loaded[key] = true;
    var loadingEl = document.getElementById("loading-" + key);
    if (loadingEl) loadingEl.style.display = "none";
  }

  function showTopic(key) {
    currentTopic = key;
    ["gk", "medieval", "arch"].forEach(function(k) {
      document.getElementById("frame-" + k).classList.toggle("active", k === key);
      document.getElementById("btn-" + k).classList.toggle("active", k === key);
    });
    loadTopic(key);
  }

  // Recursively scroll a window and any nested (same-origin) iframes back to top
  function scrollAllToTop(win) {
    if (!win) return;
    try {
      win.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {}
    try {
      var doc = win.document;
      var nestedFrames = doc.querySelectorAll("iframe");
      nestedFrames.forEach(function(f) {
        if (f.contentWindow) scrollAllToTop(f.contentWindow);
      });
    } catch (e) {}
  }

  var globalBtn = document.getElementById("globalScrollTop");
  globalBtn.addEventListener("click", function() {
    var activeIframe = document.getElementById("frame-" + currentTopic);
    if (activeIframe && activeIframe.contentWindow) {
      scrollAllToTop(activeIframe.contentWindow);
    }
  });

  // Show/hide the global button based on scroll position inside the active module
  function pollScroll() {
    try {
      var activeIframe = document.getElementById("frame-" + currentTopic);
      var win = activeIframe && activeIframe.contentWindow;
      var show = false;
      function checkWin(w) {
        if (!w) return false;
        try {
          if (w.scrollY > 200) return true;
          var doc = w.document;
          var nestedFrames = doc.querySelectorAll("iframe");
          for (var i = 0; i < nestedFrames.length; i++) {
            if (nestedFrames[i].contentWindow && checkWin(nestedFrames[i].contentWindow)) return true;
          }
        } catch (e) {}
        return false;
      }
      show = checkWin(win);
      globalBtn.classList.toggle("show", show);
    } catch (e) {}
    requestAnimationFrame(function(){ setTimeout(pollScroll, 400); });
  }

  document.addEventListener("DOMContentLoaded", function() {
    loadTopic("gk");
    pollScroll();
  });
</script>
