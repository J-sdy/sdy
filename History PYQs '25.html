": "A is true, but R is false.  Aruna Asaf Ali popularly known as the &#x27;Grand Old Lady&#x27; of the Independence Movement.", "t": 2, "s": 4}, {"n": 662, "tag": null, "stem": "Who among the following was the only martyr of the Quit India phase of the freedom movement who was hanged ?", "opts": {"a": "Potti Sreeramulu", "b": "Senapati Bapat", "c": "Kushal Konwar", "d": "Kanaiyalal Maneklal Munshi"}, "ans": "c", "exp": "Kushal Konwar . Facts of Quit India Movement - The Quit India Resolution was passed by the Congress Working Committee on 8 August 1942 in Bombay. ‘Quit India’ or ‘Bharat Chodo &#x27;slogan was given in this movement . Gandhiji gave the slogan to the people – ‘Do or die’; It is also known as the India August Movement or August Kranti.", "t": 2, "s": 4}, {"n": 663, "tag": null, "stem": "Consider the following statements regarding newspapers started by Mahatma Gandhi:<br>1. Indian Opinion was founded by Mahatma Gandhi in South Africa in 1903, along with M. H. Nazar.<br>2. Young India and Navajivan were newspapers later published by Gandhi after his return to India. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. The Indian Opinion was an important newspaper established in 1903 in Durban, South Africa, by Mahatma Gandhi and M. H. Nazar. It was a primary communication organ of the Natal Indian Congress", "t": 2, "s": 4}, {"n": 664, "tag": null, "stem": "C Rajagopalachari led the Salt Satyagraha in which of the following states ?", "opts": {"a": "Gujarat", "b": "Maharashtra", "c": "Tamil Nadu", "d": "Rajasthan"}, "ans": "c", "exp": "Tamil Nadu. Salt March (Dandi Satyagraha, 12th March 1930 to 6th April, 1930 ) was an act of nonviolent civil disobedience led by Mohandas Karamchand Gandhi. Other leaders - K. Kelappan (Malabar), Gopabandhu Chaudhary (Orissa).", "t": 2, "s": 4}, {"n": 665, "tag": null, "stem": "Given below are the two columns. Column A consists of Events or terms and column B consist of correct descriptions. Match the column A with correct description in Column B <b>Column A Column B <\/b> A.Anglo-Russian 1. Opened Sindh&#x27;s rivalry rivers and roads to British trade.<br>B. Subsidiary 2. Forced on the Amirs of Sindh before Treaty 1839 annexation.<br>C. Sir Charles 3. Had commercial Napier value; attracted British interest.<br>D. River Sindh 4. Led military campaign to annex Sindh; called it a &quot;rascality.&quot;<br>E. Treaty of 5. Led Britain to expand 1832 influence in Afghanistan and Persia", "opts": {"a": "A-5, B-2, C-4, D-3, E-1", "b": "A-1, B-5, C-2, D-4, E-3", "c": "A-2, B-4, C-3, D-1, E-5", "d": "A-4, B-1, C-5, D-2, E-3"}, "ans": "a", "exp": "A-5, B-2, C-4, D-3, E-1. The Anglo-Russian rivalry (The Great Game) compelled Britain to expand its influence in Afghanistan and Persia to counter Russia. The Subsidiary Treaty of 1839 was imposed on the Amirs of Sindh before annexation. Sir Charles Napier led the campaign to annex Sindh and famously called it a “rascality”. The River Sindh held great commercial value, attracting British interest. Finally, the Treaty of 1832 opened Sindh’s rivers and roads to British trade.", "t": 2, "s": 5}, {"n": 666, "tag": "SSC Stenographer 7/08/2025 (Shift 1)", "stem": "Which of the following best captures the broader geopolitical shift triggered by the decisive defeat of the Nawab of Carnatic&#x27;s forces in their confrontation with European powers ?", "opts": {"a": "It revealed systemic vulnerabilities in native military structures, prompting European companies to transition from trade to political hegemony.", "b": "It disillusioned European companies, resulting in a strategic withdrawal from inland military affairs.", "c": "It consolidated indigenous authority, forcing European traders into commercial treaties under local oversight.", "d": "It established a stable dual -administrative system between Indian principalities and foreign chartered companies."}, "ans": "a", "exp": "The defeat of the Nawab of Carnatic’s forces exposed the weakness of traditional Indian armies against the disciplined, technologically advanced European forces. This marked a turning point where European trading companies, especially the British, realized the possibility of extending political control beyond commerce. Gradually, their role shifted from merchants to power brokers in Indian politics. Thus, the Carnatic wars laid the foundation for European political dominance in India.", "t": 2, "s": 5}, {"n": 667, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Given below are assertion and reason, read the statements and choose the correct option.<br><b>Assertion: <\/b>The Treaty of Paris (1763) limited French settlements in India to trading posts only.<br><b>Reason: <\/b>The French could no longer station troops or fortify their factories after the treaty.", "opts": {"a": "Both Assertion (A) and Reason (R) are true, and R is not the correct explanation of A.", "b": "Both Assertion (A) and Reason (R) are true, and R is the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "b", "exp": "The Treaty of Paris (1763) ended both the Seven Years’ War and the Third Carnatic War, marking the British East India Company’s decisive victory over the French in India. After the Battle of Wandiwash, France lost its political influence and was limited to trading in its enclaves. The First Carnatic War (1746–1748) ended with the Treaty of Aix-La-Chapelle, the Second Carnatic War (1749–1754) with the Treaty of Pondicherry, and the Third Carnatic War (1758–1763) with the Treaty of Paris.", "t": 2, "s": 5}, {"n": 668, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Given below are assertion and reason, read the statements and choose the correct option.<br><b>Assertion(A): <\/b>Sir Charles Napier justified the annexation of Sindh on moral and legal grounds.<br><b>Reason(R): <\/b>He described it as a &quot;useful humane piece of rascality.&quot;", "opts": {"a": "Both Assertion (A) and Reason (R) are true, and R is the correct explanation of A.", "b": "A is true, but R is false.", "c": "A is false, but R is true.", "d": "Both Assertion (A) and Reason (R) are true, and R is not the correct explanation of A."}, "ans": "c", "exp": "A is false, but R is true.  Annexation of Sindh (1843): Carried out by Sir Charles Napier after the Battle of Miani. Napier himself admitted that the conquest was not morally or legally justified. He cynically remarked on the annexation, calling it a &quot;useful humane piece of rascality&quot;, thereby acknowledging its dubious morality.", "t": 2, "s": 5}, {"n": 669, "tag": null, "stem": "Consider the following statements regarding the Battle of Porto Novo (1781):<br>1. The battle was fought between Hyder Ali of Mysore and the British East India Company led by Sir Eyre Coote.<br>2. The battle was part of the Second Anglo-Mysore War, in which Hyder Ali played a key role before his death in 1782. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. The Battle of Porto Novo (1781) was fought between Hyder Ali and the East India Company (EIC), led by Sir Eyre Coote. Hyder Ali was a key figure in the Anglo-Mysore Wars. The First Anglo-Mysore War (1767–1769) was fought between Hyder Ali and the EIC. The Second Anglo-Mysore War (1780–1784) also saw Hyder Ali leading the Mysore forces; however, he died during the conflict, after which his son, Tipu Sultan, continued the war.", "t": 2, "s": 5}, {"n": 670, "tag": null, "stem": "Which of the following battles is considered the formal beginning of the British Raj in India?", "opts": {"a": "First Carnatic War", "b": "Battle of Plassey", "c": "Battle of Wandiwash", "d": "Battle of Buxar"}, "ans": "b", "exp": "The Battle of Plassey took place in Bengal on June 23, 1757. British East India Company troops, led by Robert Clive, confronted the forces of Siraj-ud-Daulah, the Nawab of Bengal, along with his French allies. The British East India Company won this battle.", "t": 2, "s": 5}, {"n": 671, "tag": null, "stem": "Assertion (A) : The Battle of Buxar was fought in 1764 between the British East India Company and the combined forces of Mir Qasim, Shuja-ud-Daulah, and Shah Alam II.<br><b>Reason (R): <\/b>After the Battle of Buxar, Shah Alam II granted the Diwani rights of Bengal, Bihar, and Orissa to the British East India Company.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "Battle of Buxar : Fought between the British East India Company and the combined armies of Mir Qasim (Nawab of Bengal), Shuja-ud-Daulah (Nawab of Awadh), and the Mughal Emperor, Shah Alam II. The British East India Company was led by Hector Munro. The Britishers won this battle. The Mughal Emperor Shah Alam II - granted the Diwani of Bengal, Bihar and Orissa to the East India Company.", "t": 2, "s": 5}, {"n": 672, "tag": null, "stem": "Where was the first jute mill set up in India?", "opts": {"a": "Mumbai", "b": "Rishra", "c": "Chennai", "d": "Haryana"}, "ans": "b", "exp": "Rishra ( West Bengal, 1855). First Jute mill (Acland Mill) - Established by British entrepreneur George Acland and Bengali financier Babu By Sumber Sen in Bengal Presidency. Central Research Institute for Jute and Allied Fibers is located in West Bengal. National jute Board formed by National Jute board Act, 2008 under the Ministry of Textile. In 1854, the first modern cotton mill was established in Mumbai by Cowaszee Nanabhoy Davar.", "t": 2, "s": 5}, {"n": 673, "tag": null, "stem": "Statement 1: Cotton and jute industries existed in India during the British rule.<br><b>Statement 2: <\/b>The iron and steel industry in India was started only after independence.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Statement 1 is true,  <mark>Statement 2 is false. <\/mark>British rulers never permitted modernization nor did they encourage the growth of industries. The unbalanced and lopsided growth structures were a legacy of British rule in India. The first iron and steel mill was established in 1907, in Jamshedpur by Tata Iron and Steel Company.", "t": 2, "s": 5}, {"n": 674, "tag": null, "stem": "In the 18 th century, the development of cotton industries in Britain resulted in _________ .", "opts": {"a": "Increase in demand of Indian textile in Britain", "b": "Decline of textiles production in India", "c": "Increase in demand of Indian textile in India", "d": "Decline of British textiles industries in India"}, "ans": "b", "exp": "Reason for decline: Export of textiles to England became more and more difficult because the British Government imposed high duties on Indian textiles. Thorp Mill (1764) - The first water-powered cotton mill in the world was constructed at Royton, Lancashire (England). The first cotton textile mill (India) - Established at Fort Glastor near Kolkata (1818).", "t": 2, "s": 5}, {"n": 675, "tag": null, "stem": "In 1600, the East India company acquired a charter from_________.", "opts": {"a": "Queen Elizabeth I", "b": "King Edward VI", "c": "King Henry IV", "d": "Queen Victoria"}, "ans": "a", "exp": "Queen Elizabeth I. By the Charter (1600 A.D), they got the sole right to trade with the East, without competition from other British traders. The Company&#x27;s ships first arrived in India, at the port of Surat, in 1608.", "t": 2, "s": 5}, {"n": 676, "tag": null, "stem": "The first English factory was set up on the banks of the river _______ in 1651.", "opts": {"a": "Son", "b": "Yamuna", "c": "Ganga", "d": "Hugli"}, "ans": "d", "exp": "Hugli. First English factory (Temporary) in India - Masulipattam (1611). First English factory (Permanent) in India - Surat (1613). First factory of other European Companies in India: Dutch - Masulipatnam (Andhra Pradesh) in 1605, Portuguese - Calicut (Kerala) in 1500, French - Surat (Gujarat) in 1668.", "t": 2, "s": 5}, {"n": 677, "tag": null, "stem": "Which of the following pairs is correct regarding the East India Company army?<br>I. Sawar — Men on horses<br>II. Musket — A heavy gun used by infantry soldiers", "opts": {"a": "Only l", "b": "Only ll", "c": "Both l and lI", "d": "Neither I nor Il"}, "ans": "c", "exp": "Both l and II. ", "t": 2, "s": 5}, {"n": 678, "tag": null, "stem": "The British East India Company captured Pondicherry (Puducherry) from the French in the year ______.", "opts": {"a": "1761", "b": "1699", "c": "1674", "d": "1738"}, "ans": "a", "exp": "1761 . Pondicherry got its freedom from the French on 1st November 1954. The Union Territory of Puducherry comprises the erstwhile French colonies viz. Puducherry, Karaikal, Mahe and Yanam.", "t": 2, "s": 5}, {"n": 679, "tag": null, "stem": "Which monument was built in 1924 to welcome King George V and Queen Mary?", "opts": {"a": "Gateway of India", "b": "Bombay Castle", "c": "Victoria Memorial", "d": "Chattri Brighton"}, "ans": "a", "exp": "Gateway of India . The Gateway of India is an Arch-Monument built in the early 20th century in the city of Mumbai.", "t": 2, "s": 5}, {"n": 680, "tag": "SSC Stenographer 6/08/2025 (Shift 2)", "stem": "Which of the following statements is NOT TRUE about Rash Behari Bose?", "opts": {"a": "He founded Indian Independence League in Tokyo in 1942.", "b": "He was an important figure in the Ghadar Movement and in the formation of the Azad Hind Fauj.", "c": "He was honoured with the prestigious title &#x27;Order of the rising sun&#x27;.", "d": "He was independent India&#x27;s first Commander-in-Chief of Indian Army."}, "ans": "d", "exp": "The first Commander-in-Chief of the Indian Army after independence was General Sir Robert Lockhart, and the first Indian to hold the post was Field Marshal K. M. Cariappa, who took command in 1949.", "t": 2, "s": 6}, {"n": 681, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Barindra Kumar Ghosh, Abhinash Bhattacharya and Bhupendranath Dutta were associated with which movement in March 1906?", "opts": {"a": "Swadeshi movement", "b": "Anti Bengal partition movement", "c": "Quit India movement", "d": "Movement against Bengal educational reforms"}, "ans": "a", "exp": "Swadeshi movement. In March 1906, Barindra Kumar Ghosh, Abhinash Bhattacharya, and Bhupendranath Dutta started the revolutionary Bengali weekly newspaper Jugantar. This publication served as the mouthpiece for the revolutionary organization Anushilan Samiti and was a key part of the radical nationalist stream that emerged during the Swadeshi movement, which began in 1905.", "t": 2, "s": 6}, {"n": 682, "tag": null, "stem": "Consider the following statements regarding revolts in India during British rule:<br><b>Statement 1: <\/b>Tirot Sing, a Khasi chief, played a leading role in the Khasi uprising against the British from 1829 to 1833.<br><b>Statement 2: <\/b>The Singpho Rebellion took place in Bengal during the late 18th century.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "c", "exp": "Tirot Sing, also known as U Tirot Sing Syiem, was a Khasi chief in the early 19th century. The Khasi uprising (Anglo-Khasi War) was a conflict between the Khasi people and the British Empire that took place from 1829 to 1833. The Sanyasi Uprisings took place in Bengal between the periods of 1770- 1820s. Poligar Revolt fought between the British and the Poligars, feudal lords in southern India. The Singpho Rebellion of 1830 took place in Assam.", "t": 2, "s": 6}, {"n": 683, "tag": null, "stem": "The planned large-scale disruption of rail communications and the seizure of arms in Bengal were undertaken under the leadership of _____.", "opts": {"a": "Aurobindo Ghose", "b": "Surendranath Banerjee", "c": "Chittaranjan Das", "d": "Jatin Mukherjee"}, "ans": "d", "exp": "Jatin Mukherjee , also known as Bagha Jatin, was a prominent revolutionary leader in Bengal during the early 20th century who fought against British colonial rule. He was a key member of the Anushilan Samiti, a revolutionary organization that planned large-scale armed resistance against the British.", "t": 2, "s": 6}, {"n": 684, "tag": null, "stem": "Consider the following statements regarding the Chittagong Armoury Raid:<br><b>Statement 1: <\/b>The Chittagong Armoury Raid was led by Surya Sen, also known as Master Da.<br><b>Statement 2: <\/b>The raid took place on April 18, 1930, in present-day Bangladesh.", "opts": {"a": "Both statements are True", "b": "Both statements are False", "c": "Statement 1 is True, Statement 2 is False", "d": "Statement 1 is False, Statement 2 is True"}, "ans": "a", "exp": "Both statements are True.  Surya Sen is also known as Master Da. He founded The Indian Republican Army. The Chittagong Armoury Raid took place on April 18, 1930, in Chittagong (now in Bangladesh). Ras Bihari Bose was the founder of the &#x27;Indian Independence League’. He chaired the Indian Independence League in 1942 to formally launch the Indian National Army.", "t": 2, "s": 6}, {"n": 685, "tag": null, "stem": "Sido and Kanhu were leaders of which of the following tribal rebellions?", "opts": {"a": "Moplah Rebellion", "b": "Santhal Rebellion", "c": "Kol Rebellion", "d": "Munda Rebellion"}, "ans": "b", "exp": "Santhal Rebellion (Hul revolt) began in 1855, led by Sidhu, Kanhu, Chand, Bhairav, and their sisters Phulo and Jhano. The Malabar rebellion (Moplah rebellion) was an armed uprising by the Mappila Muslims of Kerala in 1921. The Kol rebellion (1829-39) was led by Buddhu Bhagat, Madara Mahato, and Joa Bhagat in the Chota Nagpur region. The Munda Rebellion, led by Birsa Munda, took place in the Ranchi area in 1899-1900.", "t": 2, "s": 6}, {"n": 686, "tag": null, "stem": "In which of the following years was VD Savarkar sent to Andaman Jail by the British?", "opts": {"a": "1910", "b": "1922", "c": "1923", "d": "1911"}, "ans": "d", "exp": "1911. Vinayak Damodar Savarkar was sent to the Cellular Jail on the punishment of &#x27;Kala Pani’ under the Nashik Conspiracy Case for the murder of the Collector of Nashik District, Jackson. While serving his sentence in the Cellular Jail, he wrote the epic &#x27;Kamala&#x27; on the prison walls.", "t": 2, "s": 6}, {"n": 687, "tag": null, "stem": "In 1910, The United India House at Seattle, USA, was set up by _________.", "opts": {"a": "Shyamji Krishna Varma", "b": "Tarak Nath Das and GD Kumar", "c": "Khudiram Bose and Prafulla Chaki", "d": "VD Savarkar and Ganesh"}, "ans": "b", "exp": "Tarak Nath Das and GD  <mark>Kumar. <\/mark>They were Indian revolutionaries who collaborated to promote Indian independence from British rule. Shyamji Krishna Varma founded the Indian Home Rule Society, India House, and The Indian Sociologist in London. Vinayak Damodar Savarkar and his brother Ganesh Damodar Savarkar established the Abhinav Bharat Society, also known as the Young India Society, in 1904.", "t": 2, "s": 6}, {"n": 688, "tag": null, "stem": "Which of the following groups/parties was started in San Francisco, United States of America during the Indian National Movement?", "opts": {"a": "Hindustan Socialist Republican Association", "b": "Swaraj Party", "c": "Khilafat Committee", "d": "Ghadar Party"}, "ans": "d", "exp": "Ghadar Party : Founded in 1913 in the U.S. as the Hindi Association of the Pacific Coast, it aimed to free India from British rule. It was founded by Sohan Singh Bhakna and Lala Har Dayal.", "t": 2, "s": 6}, {"n": 689, "tag": null, "stem": "Bankim Chandra Chatterjee wrote a novel Anand Math based on which of the following rebellions/revolts?", "opts": {"a": "Paika Rebellion", "b": "Sanyasi Rebellion", "c": "Kuki Revolt", "d": "Mappila Rebellion"}, "ans": "b", "exp": "Sanyasi Rebellion. The Sanyasi Uprisings took place in Bengal between the periods of 1770- 1820s. The Sanyasis rose in rebellion after the great famine of 1770 in Bengal which caused acute chaos and misery. However, the immediate cause of the rebellion was the restrictions imposed by the British upon pilgrims visiting holy places among both Hindus and Muslims. The national song of India, &#x27;Vande Mataram’, is an excerpt taken from the novel Anand Math written by Bankim Chandra Chattopadhyay.", "t": 2, "s": 6}, {"n": 690, "tag": null, "stem": "Consider the following statements regarding the Bombay Presidency Association (1885):<br><b>Statement 1: <\/b>The Bombay Presidency Association was founded in 1885 by Badruddin Tyabji, Pherozeshah Mehta, and K.T. Telang.<br><b>Statement 2: <\/b>Zakir Husain was one of the founders of the Bombay Presidency Association.", "opts": {"a": "Both statements are True", "b": "Both statements are False", "c": "Statement 1 is True, Statement 2 is False", "d": "Statement 1 is False, Statement 2 is True"}, "ans": "c", "exp": "Badruddin Tyabji was the third President (in 1887) of the Indian National Congress and the first Muslim to hold that position. Other Political organisations and founder: London Indian Society (1865) - Dadabhai Naoroji. East India Association (1866) - Dadabhai Naoroji. Poona Sarvajanik Sabha (1870) - G.V. Joshi, S.H. Sathe, S.H. Chiplonkar and Mahadev Govind Ranade.", "t": 2, "s": 6}, {"n": 691, "tag": null, "stem": "What was the name of the campaign led by the Ali brothers and Maulana Abul Kalam Azad to save the Ottoman Caliphate as a symbol of unity among the Muslim community?", "opts": {"a": "Faraizi Movement", "b": "Ahmadiya Movement", "c": "Wahabi Movement", "d": "Khilafat Movement"}, "ans": "d", "exp": "Khilafat Movement. It was a political campaign that took place from 1919 to 1922 in British India. It was a protest against the British government&#x27;s policies towards Turkey and the planned dismantling of the Ottoman Empire after World War I. The Faraizi movement was started by Haji Shariatullah in 1818. The Ahmadiyya movement was founded by Mirza Ghulam Ahmad in 1889. Syed Ahmed Barelvi started the Wahabi Movement in the 1820s.", "t": 2, "s": 6}, {"n": 692, "tag": null, "stem": "Who was executed as an accomplice to the murder of AMT Jackson ?", "opts": {"a": "Krishnaji Gopal Karve", "b": "Matangini Hazra", "c": "Khudiram Bose", "d": "Hemu Kalani"}, "ans": "a", "exp": "Krishnaji Gopal Karve.  Jackson murder case also known as Nasik Conspiracy (Year 1909). Anant Laxman Kanhere shot Jackson, the Collector of Nashik, at Vijayanand theatre. Kanhere was a member of the Abhinav Bharat society. The event led to the arrest of Savarkar. Abhinav Bharat Society was a secret society founded by Vinayak Damodar Savarkar and his brother Ganesh Damodar Savarkar in 1904.", "t": 2, "s": 6}, {"n": 693, "tag": null, "stem": "Which of the following revolutionists was associated with the Anushilan Samiti?", "opts": {"a": "Rajguru", "b": "Bhagat Singh", "c": "Jatindra Mohan Sengupta", "d": "Sukhdev"}, "ans": "c", "exp": "Jatindra Mohan Sengupta.  Anushilan Samiti was founded by Satish Chandra Bose and Barrister Praanath Mitra. Bhagat Singh, Rajguru, and Sukhdev were members of the Hindustan Socialist Republican Association (HSRA), involved in the Lahore Conspiracy Case of 1929.", "t": 2, "s": 6}, {"n": 694, "tag": null, "stem": "In 1908 Khudiram Bose along with _________ was involved in throwing a bomb at a carriage believing it to be occupied by Kingsford, the then sitting judge of Muzaffarpur.", "opts": {"a": "Rajguru", "b": "Sukhdev", "c": "Prafulla Chaki", "d": "Bhagat Singh"}, "ans": "c", "exp": "Prafulla Chaki was an Indian revolutionary associated with the Jugantar group of revolutionaries. Khudiram Bose was among the youngest martyrs of India&#x27;s freedom struggle against the British. At just 15, he had joined Anushilan Samiti and took part in several revolutionary activities against the British Raj. He was executed on August 11, 1908, in Muzaffarpur jail in Bihar.", "t": 2, "s": 6}, {"n": 695, "tag": null, "stem": "During British rule in India, who among the following unfurled the flag of India in Germany in 1907?", "opts": {"a": "Sarojini Naidu", "b": "Annie Besant", "c": "Sucheta Kriplani", "d": "Bhikaji Cama"}, "ans": "d", "exp": "Madam Bhikaji Cama . She founded the ‘Paris Indian Society’. Annie Besant (British socialist) - Founded Home rule league in India and she was first woman president of Indian National Congress (INC). Sarojini Naidu - First Indian woman president of the INC. Sucheta Kriplani holds the distinction of being India&#x27;s first female Chief Minister, serving the state of Uttar Pradesh.", "t": 2, "s": 6}, {"n": 696, "tag": null, "stem": "Who among the following revolutionaries was one of the co-founders of the Hindustan Socialist Republican Association (HSRA) which got established in 1928 at Ferozeshah Kotla in Delhi?", "opts": {"a": "Gopal Krishna Gokhale", "b": "Aurobindo Ghosh", "c": "Bhagat Singh", "d": "Mahatma Gandhi"}, "ans": "c", "exp": "Bhagat Singh. The Hindustan Socialist Republican Association (HSRA), formerly known as the Hindustan Republican Army (HRA) was founded by Ram Prasad Bismil, Sachindra Nath Bakshi, Sachindranath Sanyal, and Jogesh Chandra Chatterjee. HRA was established in October 1924 in Kanpur, Uttar Pradesh, by revolutionaries including Ram Prasad Bismil, Jogesh Chatterjee, Chandrashekhar Azad, Yogendra Shukla, and Sachindranath Sanyal. HRA took to socialist ideas, under Chandrashekhar Azad leadership, in 1928.", "t": 2, "s": 6}, {"n": 697, "tag": null, "stem": "Match the following leaders with the related years: <b>List I (Events/Positions) List II <\/b> <b>(Years) <\/b><br>A. Khudai Khidmatgars 1929<br>B. First Law Minister 1947<br>C. Forward Bloc 1939 D.Non-CooperationMovement 1920", "opts": {"a": "A–1, B–2, C–3, D–4", "b": "A–2, B–3, C–1, D–4", "c": "A–3, B–4, C–2, D–1", "d": "A–4, B–1, C–3, D–2"}, "ans": "a", "exp": "Khan Abdul Ghaffar Khan, also known as &#x27;Frontier Gandhi&#x27; and &#x27;Bacha Khan&#x27;, was a prominent freedom fighter and advocate of non-violence. He became the first non-Indian to receive Bharat Ratna in 1987. B.R. Ambedkar was the first Law Minister of India and the architect of the Indian Constitution. Subhas Chandra Bose was an Indian nationalist and the founder of the All India Forward Bloc. Mahatma Gandhi was an Indian lawyer and anti-colonial nationalist, renowned for his principles of non-violence.", "t": 2, "s": 6}, {"n": 698, "tag": null, "stem": "The &#x27;Servants of India Society&#x27; was the brainchild of which of the following leaders ?", "opts": {"a": "Gopal Krishna Gokhale", "b": "BR Ambedkar", "c": "Lala Lajpat Rai", "d": "Chittaranjan Das"}, "ans": "a", "exp": "Gopal Krishna Gokhale  founded - Ranade Institute of Economics (1908). He started an English weekly newspaper, The Hitavada (The people&#x27;s paper). Servants of India Society was founded in 1905 <mark>. <\/mark>Chitranjan Das is popularly known as Deshbandhu. Lala Lajpat Rai - Punjab National bank.", "t": 2, "s": 6}, {"n": 699, "tag": null, "stem": "On 8th April 1929, who among the following two revolutionists threw a bomb in the Central Legislative Assembly?", "opts": {"a": "Bhagat Singh and Rajguru", "b": "Bhagat Singh and Ram Prasad Bismil", "c": "Bhagat Singh and Batukeshawar Dutt", "d": "Bhagat Singh and Sukhdev"}, "ans": "c", "exp": "Bhagat Singh and  <mark>Batukeshwar Dutt. <\/mark>They threw bomb against the passage of the Public Safety Bill and the Trade Disputes Bill which would reduce the civil liberties of citizens. They were members of the Hindustan Socialist Republican Association. On 23rd March, 1931 Bhagat Singh was hanged in the Lahore jail at the age of 23.", "t": 2, "s": 6}, {"n": 700, "tag": null, "stem": "Who is regarded as the &#x27;Mother of Indian Revolution&#x27; ?", "opts": {"a": "Annie Besant", "b": "Usha Mehta", "c": "Madame Cama", "d": "Kasturba Gandhi"}, "ans": "c", "exp": "Madame Cama : She is famous for hosting the precursor to the Indian National Flag on foreign soil (Stuttgart in Germany).", "t": 2, "s": 6}, {"n": 701, "tag": null, "stem": "Assertion (A): Lala Lajpat Rai died due to injuries sustained during the Anti-Simon Commission protest in 1928.<br><b>Reason (R): <\/b>The Simon Commission, sent to India in 1928, included Indian members to represent the people’s voices.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false. Lala Lajpat Rai (Freedom fighters) was also called ‘Punjab Kesari’ and &#x27;Lion of Punjab&#x27;. Bal Gangadhar Tilak - Founded the Home Rule League in 1916. Simon Commission - Indian Statutory Commission, group of seven Members, not a single Indian member in it, Headed by Sir John Simon. Simon Commission came to India in 1928.", "t": 2, "s": 6}, {"n": 702, "tag": null, "stem": "Who among the following, along with her close associates, started the secret congress radio during the Quit India Movement?", "opts": {"a": "Bhikaiji Cama", "b": "Lakshmi Sehgal", "c": "Sarojini Naidu", "d": "Usha Mehta"}, "ans": "d", "exp": "Usha Mehta. Awards - Padma Vibhushan (1998).", "t": 2, "s": 6}, {"n": 703, "tag": null, "stem": "The statement- &quot;We shall die to awaken the nation&quot; was made by.", "opts": {"a": "Bagha Jatin", "b": "Pingali Venkayya", "c": "Bir Tikendrajit Singh", "d": "Surya Sen"}, "ans": "a", "exp": "Bagha Jatin (Jatindranath Mukherjee) - Born on 7th December 1879 in Kayagram (Nadia district) present-day Bangladesh. He acquired the moniker ‘Bagha Jatin’ when he single-handedly killed a Bengal tiger in 1906. Bir Tikendrajit Singh - He was a prince of the independent Kingdom of Manipur.", "t": 2, "s": 6}, {"n": 704, "tag": null, "stem": "Which freedom fighter was involved in the Kakori Train Action in 1925, for which the British government condemned him to death?", "opts": {"a": "Ram Prasad Bismil", "b": "Lala Hardayal", "c": "Vinayak Damodar Savarkar", "d": "Mahatma Gandhi"}, "ans": "a", "exp": "Ram Prasad Bismil. Kakori  <mark>Train Action <\/mark>- It was a train robbery (part of Kakori Conspiracy) that took place on 9 August 1925, near Lucknow. It was organised by the Hindustan Republican Association (HRA). Ram Prasad Bismil, Ashfaqulla Khan, and Roshan Singh were hanged on 19 December 1927. Rajendra Nath Lahiri hanged on December 17, 1927.", "t": 2, "s": 6}, {"n": 705, "tag": null, "stem": "The Revolutionary Socialist Party was established in ________.", "opts": {"a": "1936", "b": "1925", "c": "1940", "d": "1929"}, "ans": "c", "exp": "19 March 1940 by Tridib Chaudhuri. It has its roots in the Bengali liberation movement Anushilan Samiti and the Hindustan Socialist Republican Association . The first general secretary of the party was Jogesh Chandra Chatterjee.", "t": 2, "s": 6}, {"n": 706, "tag": null, "stem": "Consider the following statements about famous patriotic slogans:<br>1. The words “Sarfaroshi ki tamanna ab hamare dil me hai, dekhna hai zor kitna baazu-e-qaatil mein hai” were composed by Ramprasad Bismil.<br>2. The slogan “Tum Mujhe Khoon Do, Mai Tumhe Azadi Dunga” is associated with Bhagat Singh. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Ramprasad Bismil (poet, writer, freedom fighter) - He participated in the Mainpuri Conspiracy of 1918, and the Kakori Conspiracy of 1925. Subhash Chandra Bose - “Jai Hind” &amp; “Tum Mujhe Khoon Do, Mai Tumhe Azadi Dunga”. Mahatma Gandhi - “Karo ya Maro”. Muhammad Iqbal - “Sare Jahan Se Achha Hindustan Hamara”. Bankim Chandra Chatterjee - “Vande Mataram”. Pandit Madan Mohan Malviya - “Satyameva Jayate”.", "t": 2, "s": 6}, {"n": 707, "tag": null, "stem": "Which of the following revolutionaries stated during his trial that &quot;he did not wish to glorify the cult of the bomb and pistol but wanted a revolution in society&quot;?", "opts": {"a": "Bhagat Singh", "b": "Surya Sen", "c": "Sachindra Nath Sanyal", "d": "Barindra Kumar Ghosh"}, "ans": "a", "exp": "Bhagat Singh and Batukeshwar Dutt threw a bomb in the Central Legislative Assembly on 8 April 1929. Sachindra Nath Sanyal was co-founder of the Hindustan Republican Association (HRA) in 1924. Barindra Kumar Ghosh (younger brother of Sri Aurobindo) published the Bengali weekly Jugantar patrika (1906).", "t": 2, "s": 6}, {"n": 708, "tag": null, "stem": "Who among the following revolutionaries was associated with Swadesh Bandhav Samiti?", "opts": {"a": "Chandrasekhar Azad", "b": "Bhagat Singh", "c": "Rajguru", "d": "Ashwini Kumar Dutta"}, "ans": "d", "exp": "Ashwini Kumar Dutta  founded the Swadesh Bandhab Samiti on th 6 August 1905 in Barisal district (Bangladesh). Weekly paper: Barisal Hitaishi. He was responsible for the creation of the Cooperative Hindustan Bank in 1908.", "t": 2, "s": 6}, {"n": 709, "tag": null, "stem": "Who among the following organized the armed rebellion against the British Raj in 1879 in Maharashtra?", "opts": {"a": "Vasudev Balwant Phadke", "b": "Birsa Munda", "c": "Buddhu Bhagat", "d": "Tikendrajit Singh"}, "ans": "a", "exp": "Vasudev Balwant Phadke -  Known as the First Revolutionary and also the ‘Father of militant nationalism in India.’ Birsa Munda also known as Dharti Aaba (Father of Earth), belonged to the Munda tribe in the Chotanagpur Plateau area.", "t": 2, "s": 6}, {"n": 710, "tag": null, "stem": "The Communist Party of India was founded at ________ in October 1920.", "opts": {"a": "Calcutta", "b": "Britain", "c": "Lahore", "d": "Tashkent"}, "ans": "d", "exp": "Tashkent. M.N. Roy (Manabendra Nath Roy), Abani Mukherji, founded the Communist Party of India (CPI) in 1920 in Tashkent (now the capital of Uzbekistan). The Communist Party of India was officially formed (1925) in Kanpur. Its founders included M. N. Roy, his wife Evelyn Trent, Abani Mukherji, and M. P. T. Acharya (Mandayam Parthasarathi Tirumal Acharya).", "t": 2, "s": 6}, {"n": 711, "tag": null, "stem": "The Koraput Revolution occurred in ______ during the Quit India Movement.", "opts": {"a": "Orissa", "b": "the United Provinces", "c": "Bihar", "d": "Bengal"}, "ans": "a", "exp": "Odisha. Koraput revolution {On August 25, 1942, 19 people died on the spot in police firing at Paparandi in Nabarangpur (Odisha). More than a thousand were jailed in Koraput district (Odisha). Veer Lakhan Nayak (Gandhi of Odisha) was hanged}. Quit India movement (8 August 1942 - 1944) - led by Mahatma Gandhi.", "t": 2, "s": 6}, {"n": 712, "tag": null, "stem": "Which of the following statements about Bharat Naujawan Sabha is INCORRECT?", "opts": {"a": "It was founded in Punjab", "b": "Bhagat Singh became its founding secretary", "c": "It was established in 1927", "d": "It started political work among the youth, peasants, and workers"}, "ans": "c", "exp": "Bharat Naujawan Sabha was founded in Lahore (1926) by Bhagat Singh.", "t": 2, "s": 6}, {"n": 713, "tag": null, "stem": "Assertion (A): The Indigo Revolt in Bengal began as a non-violent strike in 1859 when ryots refused to cultivate indigo.<br><b>Reason (R): <\/b>The Indigo Revolt was led by Bishnu Charan Biswas and Digambar Biswas of Nadia district, Bengal.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "b", "exp": "Digambar Biswas and Bishnu Biswas of Nadia district Bengal led the Indigo revolt. This Revolt began as a nonviolent strike in March 1859, as the ryots of a village in Bengal&#x27;s Nadia district all agreed to refuse to grow any more indigo.", "t": 2, "s": 6}, {"n": 714, "tag": null, "stem": "Which of the following revolutionaries was arrested by the British as an accused in the Alipore Bomb Conspiracy Case?", "opts": {"a": "Kanailal Dutta", "b": "Rajendra Lahiri", "c": "Roshan Singh", "d": "Ashfaq Ullah Khan"}, "ans": "a", "exp": "Kanailal Dutta was among the 33 revolutionaries who got arrested in the Emperor vs Aurobindo Ghosh (Alipore Bomb Case). The Alipore Bomb case was a historic trial in which the British Government tried to implicate Sri Aurobindo in various revolutionary activities.", "t": 2, "s": 6}, {"n": 715, "tag": null, "stem": "At which of the following jails was Khudiram Bose sent to the gallows?", "opts": {"a": "Chittagong", "b": "Barishal", "c": "Muzaffarpur", "d": "Alipore"}, "ans": "c", "exp": "Muzaffarpur. Khudiram Bose was arrested for trying to assassinate British judge Douglas Kingsford, he was executed on August 11, 1908, in Muzaffarpur jail in Bihar.", "t": 2, "s": 6}, {"n": 716, "tag": null, "stem": "Who among the following persons was associated with the Chittagong Armoury Raid?", "opts": {"a": "Vishnu Sharan Dublish", "b": "Sachindra Nath Bakshi", "c": "Manmath Nath Gupta", "d": "Ardhendu Dastidar"}, "ans": "d", "exp": "Ardhendu Dastidar .", "t": 2, "s": 6}, {"n": 717, "tag": null, "stem": "Consider the following statements regarding the Jallianwala Bagh massacre and its aftermath:<br><b>Statement 1: <\/b>Michael O’Dwyer, responsible for the Jallianwala Bagh massacre, was assassinated in Caxton Hall, London.<br><b>Statement 2: <\/b>Udham Singh carried out the assassination in 1940 as an act of revenge for the massacre.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "a", "exp": "Both statements are correct.  Udham Singh. O&#x27;Dwyer, was shot dead at a joint meeting of the East India Association and the Central Asian Society in Caxton Hall, in retaliation for the massacre in Jallianwala Bagh Amritsar.", "t": 2, "s": 6}, {"n": 718, "tag": null, "stem": "Who among the following assassinated Sir William Hutt Curzon Wyllie in London?", "opts": {"a": "Surya Sen", "b": "Madan Lal Dhingra", "c": "Sukhdev Thapar", "d": "Khudiram Bose"}, "ans": "b", "exp": "Madan Lal Dhingra was an Indian revolutionary independence activist. While studying in England, he assassinated Sir William Hutt Curzon Wyllie, a British official, cited as one of the first acts of revolution in the Indian independence movement in the 20th century.", "t": 2, "s": 6}, {"n": 719, "tag": null, "stem": "Veer Surendra Sai was a freedom fighter from:", "opts": {"a": "Nagaland", "b": "Sikkim", "c": "Telangana", "d": "Odisha"}, "ans": "d", "exp": "Odisha . Veer Surendra Sai started his revolt against British rule long before 1857 and continued his guerrilla war against the British authority from 1857 till 1864 long after 1857 the struggle led by the Rani of Jhansi, Tantia Tope, Kunwar Singh and others had subsided.", "t": 2, "s": 6}, {"n": 720, "tag": null, "stem": "Who was the first general secretary of the All India Farmer’s Congress?", "opts": {"a": "Acharya Narendra Dev", "b": "Swami Sahjanand Saraswati", "c": "Sardar Vallabhai Patel", "d": "N.G. Ranga"}, "ans": "d", "exp": "NG Ranga . He was a freedom fighter from Andhra Pradesh and also received Padma Vibhusan from the President of India for his contributions to the peasants&#x27; movement.", "t": 2, "s": 6}, {"n": 721, "tag": null, "stem": "Who among the following was a leader who led a revolt against British rule from North East India?", "opts": {"a": "Pritilata Waddedar", "b": "Rani Gaidinliu", "c": "Durgawati Devi", "d": "Matangini Hazra"}, "ans": "b", "exp": "Rani Gaidinliu was a Naga spiritual and political leader who led a revolt against British rule in India. At the age of 13, she joined the Heraka religious movement established by her cousin Haipou Jadonang in Manipur.", "t": 2, "s": 6}, {"n": 722, "tag": null, "stem": "Consider the following statements:<br><b>Statement 1: <\/b>Bal Gangadhar Tilak’s Home Rule Movement was mainly active in Maharashtra.<br><b>Statement 2: <\/b>Annie Besant’s Home Rule Movement was mainly active in Punjab. Which one of the above statements is correct?", "opts": {"a": "Statement 1 only", "b": "Statement 2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "Statement 1 only. Bal Gangadhar Tilak launched his Home Rule Movement in 1916. It was primarily centered in Maharashtra, which was his home base. He had significant influence and following in this region. He published his ideas through his newspapers &quot;Kesari&quot; (in Marathi) and &quot;Mahratta&quot; (in English) from Maharashtra.", "t": 2, "s": 7}, {"n": 723, "tag": null, "stem": "Which of the following organisations, divided into two branches, was established by Lokmanya Bal Gangadhar Tilak and Annie Besant?", "opts": {"a": "Indian Association", "b": "Theosophical society", "c": "East Indian Association", "d": "Home Rule League"}, "ans": "d", "exp": "Home Rule League. In April 1916, Tilak founded the Indian Home Rule League, with its headquarters in Poona. The league&#x27;s first meeting was held in Belgaum. In September 1916, Annie Besant founded the All-India Home Rule League, based in Madras. Organizations and their founders : Indian Association - Surendranath Banerjee and Ananda Mohan Bose; Theosophical Society - Helena Blavatsky, Henry Steel Olcott, William Quan Judge.", "t": 2, "s": 7}, {"n": 724, "tag": null, "stem": "Assertion (A) : Mahatma Gandhi suspended the Non-Cooperation Movement in February 1922.<br><b>Reason (R): <\/b>The Chauri Chaura incident in the United Provinces turned the movement violent when protesters set a police station on fire, killing policemen.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "Chauri Chaura Incident took place at Chauri Chaura in the Gorakhpur district of United Provinces (now Uttar Pradesh) in British India. The police there fired upon a large group of protesters participating in the non-cooperation movement. In retaliation, the demonstrators attacked and set fire to a police station, killing all of its occupants. The incident led to the deaths of three civilians and 22 policemen. Mahatma Gandhi halted the non-cooperation movement on 12th February 1922 after the Chauri Chaura incident.", "t": 2, "s": 7}, {"n": 725, "tag": null, "stem": "Indian National Army was formed in which of the following countries?", "opts": {"a": "Singapore", "b": "Germany", "c": "London", "d": "Japan"}, "ans": "a", "exp": "Singapore. The Indian National Army (INA), also known as the Azad Hind Fauj, was a collaborationist armed unit of Indian supporters that fought under the command of the Japanese Empire. It was founded by Mohan Singh in September 1942 during World War II.", "t": 2, "s": 7}, {"n": 726, "tag": null, "stem": "Being the President of the Indian National Congress, who among the following had called for complete independence from the British Raj in 1929?", "opts": {"a": "Jawaharlal Nehru", "b": "Subhas Chandra Bose", "c": "Sardar Vallabhbhai Patel", "d": "Mahatma Gandhi"}, "ans": "a", "exp": "Jawaharlal Nehru. He was an Indian freedom fighter who later became the first Prime Minister of India. In December 1929, he was chosen as the President of the Indian National Congress during its annual session in Lahore. At this event, he raised the tricolour flag on the banks of the Ravi River.", "t": 2, "s": 7}, {"n": 727, "tag": null, "stem": "On 31 October 1940, who among the following was arrested for offering individual Satyagraha to protest against India’s forced participation in the Second World War ?", "opts": {"a": "Sardar Vallabhbhai Patel", "b": "Saifuddin Kitchlew", "c": "Jawaharlal Nehru", "d": "Subhas Chandra Bose"}, "ans": "c", "exp": "Jawaharlal Nehru. On 31 October 1940, Jawaharlal Nehru was arrested for participating in individual Satyagraha, protesting against India’s forced involvement in the Second World War. During this period, Nehru also engaged in limited Civil Disobedience and spent approximately nine years in jail between 1921 and 1945.", "t": 2, "s": 7}, {"n": 728, "tag": null, "stem": "Consider the following statements regarding the Indian National Army (INA):<br>1. It was founded by Mohan Singh in September 1942 in Southeast Asia during World War II.<br>2. Subhas Chandra Bose later became the supreme leader of the INA.<br>3. Rabindranath Tagore was one of the commanders of the INA. Which of the statements given above is/are correct?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. Indian National Army (INA) was a collaborationist armed unit of Indian collaborators that fought under the command of the Japanese Empire. It was founded by Mohan Singh in September 1942 in Southeast Asia during World War II. Some notable people associated: Mohan Singh, Habib ur Rahman, Lt. Col Hori Lal Verma.", "t": 2, "s": 7}, {"n": 729, "tag": null, "stem": "What is the name of the famous British social reformer known for founding the Indian Home Rule League in 1916 ?", "opts": {"a": "Anne Knight", "b": "Maria Rye", "c": "Catherine Osler", "d": "Annie Besant"}, "ans": "d", "exp": "Annie Besant. Annie Besant, an Irish theosophist, started the Home Rule movement in India in 1916, demanding self-government similar to the Irish Home Rule League. She founded the Home Rule League in Madras in September 1916 and established over 200 branches across India.", "t": 2, "s": 7}, {"n": 730, "tag": null, "stem": "Consider the following statements:<br><b>Statement 1: <\/b>Rabindranath Tagore renounced his knighthood in protest against the Jallianwala Bagh massacre.<br><b>Statement 2: <\/b>The Simon Commission was set up in 1919 to investigate the incident. Which of the above statements is/are true?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The Jallianwala Bagh massacre occurred on April 13, 1919, when British troops, led by General Dyer, fired on a peaceful crowd in Amritsar, killing hundreds. In protest, Mahatma Gandhi returned the Kaiser-i-Hind title in 1920. The Hunter Commission was set up in 1919 to investigate the incident.", "t": 2, "s": 7}, {"n": 731, "tag": null, "stem": "Who among the following was one of the founders of the Swaraj Party?", "opts": {"a": "Subhas Chandra Bose", "b": "Bal Gangadhar Tilak", "c": "Jawahar Lal Nehru", "d": "Chittaranjan Das"}, "ans": "d", "exp": "Chittaranjan Das. The Swaraj Party, initially called the Congress Khilafat Swaraj Party, was established in 1923 by Chittaranjan Das and Motilal Nehru. This formation took place after the Gaya Annual Conference of the Indian National Congress in December 1922. Other important organizations and their founders: Indian National Congress (1885): Founded by A.O. Hume. All India Kisan Sabha (1936): Sahajanand Saraswati. Azad Hind Fauj (1943): Netaji Subhash Chandra Bose.", "t": 2, "s": 7}, {"n": 732, "tag": null, "stem": "Which of the following Satyagrahas was started by Dr B R Ambedkar in 1927?", "opts": {"a": "Nasik Temple Satyagraha", "b": "Dharasana Satyagraha", "c": "Mulshi Satyagraha", "d": "Mahad Satyagraha"}, "ans": "d", "exp": "Mahad Satyagraha: It is also known as the Chavdar Tank Satyagraha, begun in Mahad (Raigad), Maharashtra. It centered around the Chavdar Tank, a public water source that was reserved exclusively for upper castes.", "t": 2, "s": 7}, {"n": 733, "tag": null, "stem": "Who among the following leaders founded the women&#x27;s wing of Congress in 1940 ?", "opts": {"a": "Aruna Asaf Ali", "b": "Sucheta Kriplani", "c": "Lakshmi Sangal", "d": "Sarojini Naidu"}, "ans": "b", "exp": "Sucheta Kriplani (First female Chief Minister of Uttar Pradesh from 1963 - 67). She sang Vande Mataram on 14 th August 1947 in the opening session of Parliament.", "t": 2, "s": 7}, {"n": 734, "tag": null, "stem": "On 15 August 1947, the first prime minister of India, Jawaharlal Nehru, raised the Indian National Flag above the __________ of Red Fort in Delhi.", "opts": {"a": "Delhi Gate", "b": "Kashmiri Gate", "c": "Ajmeri Gate", "d": "Lahori Gate"}, "ans": "d", "exp": "Lahori Gate. The National Flag of India was adopted on 22 July 1947, Designed by Pingali Venkayya.", "t": 2, "s": 7}, {"n": 735, "tag": null, "stem": "Who moved the resolution proposing that the National Flag of India be a &#x27;horizontal tricolor of saffron, white and dark green in equal proportion &#x27;?", "opts": {"a": "Sardar Vallabhbhai Patel", "b": "Jawaharlal Nehru", "c": "Mahatma Gandhi", "d": "Dr Rajendra Prasad"}, "ans": "b", "exp": "Jawaharlal Nehru. The Tricolour was adopted as our national flag at a Congress Committee meeting in Karachi in 1931.", "t": 2, "s": 7}, {"n": 736, "tag": null, "stem": "Who among the following was the founder of &#x27;Tiger Legion&#x27; or &#x27;Free India Legion&#x27;?", "opts": {"a": "Vinayak Damodar Savarkar", "b": "Subhas Chandra Bose", "c": "Sohan Singh Bhakhna", "d": "Lala Hardayal"}, "ans": "b", "exp": "Subhas Chandra Bose -  founder of &#x27;Azad Hind Fauj&#x27;. &#x27;Tiger Legion&#x27; was formed in 1941 with the help of the German Government to fight against the British.", "t": 2, "s": 7}, {"n": 737, "tag": null, "stem": "Consider the following statements regarding the Komagata Maru incident:<br>1. The Komagata Maru, carrying Indian passengers, was denied permission to land in Canada in 1914.<br>2. The ship was denied entry at Sydney harbour in Australia. Which of the above statements is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The Komagata Maru was a coal-transport steamship that had been converted into a passenger ship by Hong Kong-based businessman Gurdit Singh. It set off from Hong Kong in April 1914, reaching Vancouver’s harbour a month later with 376 people on board, most of them Sikhs. The steamship eventually ended up back in India on 29th Sep 1914 at Budge Budge, Calcutta.", "t": 2, "s": 7}, {"n": 738, "tag": null, "stem": "The origin of Directive Principles of State Policy can be traced to which of the following?", "opts": {"a": "Gandhi Irwin Pact", "b": "Poona Pact", "c": "Second Round Table Conference", "d": "Karachi Resolution"}, "ans": "d", "exp": "Karachi Resolution (1931) <mark>. <\/mark> The Karachi Session of Congress in 1931 was presided by Sardar Vallabhbhai Patel. Gandhi Irwin Pact - 5 March 1931. It marked the end of civil disobedience.", "t": 2, "s": 7}, {"n": 739, "tag": null, "stem": "Who among the following freedom fighters was one of the founders of the Fergusson College in Pune in 1885 ?", "opts": {"a": "Subhash Chandra Bose", "b": "Bal Gangadhar Tilak", "c": "Sardar Vallabh Bhai Patel", "d": "Lala Lajpat Rai"}, "ans": "b", "exp": "Bal Gangadhar Tilak. Other Co-founding members of Fergusson College :- Vaman Shriram Apte, Vishnushashtri Chiplunkar, Mahadeo Ballal Namjoshi and Gopal Krishna Agarkar.", "t": 2, "s": 7}, {"n": 740, "tag": null, "stem": "Motilal Nehru, C.R. Das gave up their legal practices during which Movement ?", "opts": {"a": "Self-respect Movement", "b": "Quit India Movement", "c": "Non-Cooperation Movement", "d": "Civil Disobedience Movement"}, "ans": "c", "exp": "Non-Cooperation Movement  <mark>(1920 - 1922) <\/mark>. It was organized by Mahatma Gandhi to obtain self governance. Many lawyers gave up their practices such as Motilal Nehru, C.Rajagopalachari, Saifuddin Kitchlew, Vallabhbhai Patel, Asaf Ali, T. Prakasam and Rajendra Prasad.", "t": 2, "s": 7}, {"n": 741, "tag": null, "stem": "When was Alluri Sitarama Raju arrested ending a two-year armed tribal struggle?", "opts": {"a": "May 1924", "b": "January 1921", "c": "April 1919", "d": "December 1929"}, "ans": "a", "exp": "May 1924. He was publicly executed in Koyyuru on May 7 after being tied to a tree and shot. His final resting place (tomb) is at Krishna Devi Peta, 111 km from Visakhapatnam. In August 1922, he launched the Rampa Rebellion (Manyam Rebellion) against the British. During this rebellion, he was helped by <mark>Bobbili Dora. <\/mark>The Prime Minister has unveiled a bronze <mark>statue <\/mark>of Alluri Sitharama Raju in Andhra Pradesh to celebrate 125th birth anniversary on 4th July 2022.", "t": 2, "s": 7}, {"n": 742, "tag": null, "stem": "In which year, the Koya rebellion took place in the eastern Godavari tract?", "opts": {"a": "1882-1883", "b": "1874-1875", "c": "1879-1880", "d": "1887-1888"}, "ans": "c", "exp": "1879-1880. The Koya  <mark>Revolts <\/mark>rose under <mark>Tomma Sora <\/mark>during 1879-80. Other important revolts are Kol Mutiny (1831), Ho and Munda Uprisings (1820-1837), The Santhal Rebellion (1855-56), Ramosi Uprising (1822- 1829), etc.", "t": 2, "s": 7}, {"n": 743, "tag": null, "stem": "In which of the following regions did Baba Ramchandra mainly lead the peasant struggle during colonial rule?", "opts": {"a": "Awadh", "b": "Mysore", "c": "Jodhpur", "d": "Hyderabad"}, "ans": "a", "exp": "Awadh . He led a peasant movement in Awadh against Talukdars and Landlords.", "t": 2, "s": 7}, {"n": 744, "tag": null, "stem": "At which of the following places did C. Rajagopalachari break the salt law in the year 1930 ?", "opts": {"a": "Vedaranyam", "b": "Tiruchi", "c": "Tirupati", "d": "Madurai"}, "ans": "a", "exp": "Vedaranyam.  C. Rajagopalachari broke the salt law in 1930 at Vedaranyam, a small coastal town in the then Tanjore District. The first Indian governor of free India was C. Rajagopalachari.", "t": 2, "s": 7}, {"n": 745, "tag": null, "stem": "What was the name of the women&#x27;s regiment in the Indian National Army founded by Subhash Chandra Bose?", "opts": {"a": "Rani of Jhansi Regiment", "b": "Rani Ahilyabai Regiment", "c": "Rani Padmawati Regiment", "d": "Rani of Didda Regiment"}, "ans": "a", "exp": "Rani of Jhansi Regiment. ", "t": 2, "s": 7}, {"n": 746, "tag": null, "stem": "Assertion (A): Maharaja Bodhchandra Singh signed the Instrument of Accession with the Government of India on 11 August 1947.<br><b>Reason (R): <\/b>The Instrument of Accession provided for Manipur’s full merger into India immediately in 1947.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "c", "exp": "A is true, but R is false.  Bodhchandra Singh, signed the Instrument of Accession on 11 August 1947, with the assurance of Manipur&#x27;s internal autonomy. This agreement marked Manipur&#x27;s entry into the Union of India, though full integration followed with the Manipur Merger Agreement in 1949.", "t": 2, "s": 7}, {"n": 747, "tag": null, "stem": "Who among the following was one of the founders of the Congress Socialist Party?", "opts": {"a": "C Natarajan Annadurai", "b": "SK Patil", "c": "Atulya Ghosh", "d": "Ram Manohar Lohia"}, "ans": "d", "exp": "Ram Manohar Lohia.  Congress Socialist Party (Socialist caucus within the Indian National Congress) - Founded in 1934. Other founders - Jayaprakash Narayan and Acharya Narendra Dev.", "t": 2, "s": 7}, {"n": 748, "tag": null, "stem": "In which city was the Jhanda Satyagraha or Flag Satyagraha of 1923 held ?", "opts": {"a": "Bombay", "b": "Nagpur", "c": "Calcutta", "d": "Ahmedabad"}, "ans": "b", "exp": "Nagpur . Flag Satyagraha is a part of civil disobedience during the Indian independence movement.", "t": 2, "s": 7}, {"n": 749, "tag": null, "stem": "_______was executed at Lahore in November 1915 for his role in the Ghadar Conspiracy in February 1915.", "opts": {"a": "Kartar Singh Sarabha", "b": "Tantia Mama", "c": "Maganbhai Patel", "d": "Vijay Singh Pathik"}, "ans": "a", "exp": "Kartar Singh Sarabha.  Ghadar Conspiracy (1915) - Plan to initiate a pan-India mutiny in the British Indian Army during World War by the Ghadar Party (United States), the Berlin Committee (Germany), the Indian revolutionary underground in British India and the German Foreign Office.", "t": 2, "s": 7}, {"n": 750, "tag": null, "stem": "Which of the following methods was used by the villagers during the Chipko Movement?", "opts": {"a": "Violent protests", "b": "Hugging trees to prevent cutting", "c": "Filing lawsuits against companies", "d": "Burning forest areas"}, "ans": "b", "exp": "The Chipko Movement, which began in the Himalayan region of Uttarakhand in the 1970s, is globally recognized for its unique and powerful method of non-violent protest. The name &quot;Chipko&quot; itself means &quot;to stick&quot; or &quot;to hug&quot; in Hindi. The villagers, particularly women, would physically embrace the trees to form a human shield, preventing the loggers and contractors from felling them. This simple yet profound act symbolized their deep connection to the forest and became an iconic form of environmental activism.", "t": 2, "s": 8}, {"n": 751, "tag": null, "stem": "Who set up a Dayanand Anglo Vedic school in Lahore?", "opts": {"a": "Lala Lajpat Rai", "b": "Bipin Chandrapal", "c": "Dayanand Saraswati", "d": "Balgangadhar Tilak"}, "ans": "a", "exp": "Lala Lajpat Rai. The Dayanand Anglo-Vedic (DAV) School was established in Lahore in 1886 by Lala Lajpat Rai and his associates to propagate the ideals of Swami Dayanand Saraswati (founder of Arya Samaj). Later, it grew into the DAV College Trust and Management Society, which runs many educational institutions across India even today. Its aim was to provide modern education (science, English, mathematics) along with teachings of the Vedas and Arya Samaj philosophy.", "t": 2, "s": 8}, {"n": 752, "tag": null, "stem": "Consider the following statements with regard to Satnami Movement of Central India.<br>a) The movement was founded by Ghasidas.<br>b) The movement was to improve the condition of leather workers. Which of the above statements is/are correct?", "opts": {"a": "Only a", "b": "Both a and b", "c": "Neither a or b", "d": "Only b"}, "ans": "b", "exp": "Both a and b. Guru Ghasidas, a 19th-century advocate of the Satnami sect, founded the Satnami community in Chhattisgarh, promoting Satnam (truth) and equality. His teachings share similarities with Hinduism and Buddhism. The Satnami movement was led by non-Brahman leaders who worked to empower marginalized communities.", "t": 2, "s": 8}, {"n": 753, "tag": null, "stem": "Which of the following statements regarding the Ahrar Movement in British India is/are incorrect?<br>1. Maulana Abul Kalam Azad was one of the founders of the Ahrar Movement.<br>2. The Ahrar Movement was founded after the Quit India Movement of 1942.", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Maulana Abul Kalam Azad was an Indian independence activist, writer, and a senior leader of the Indian National Congress. After India’s independence, he became the first Minister of Education. The Ahrar Movement was started by Muslims who had lost faith in the Khilafat Movement. It was founded by Maulana Muhammad Ali, Hakim Ajmal Khan, Hasan Imam, Maulana Zafar Ali Khan, and Mazhar-ul-Haq .", "t": 2, "s": 8}, {"n": 754, "tag": null, "stem": "Who among the following participated in the All-World Religious Conference (Parliament of Religions) held in 1893 in Chicago?", "opts": {"a": "Swami Dayanand", "b": "Raja Ram Mohan Roy", "c": "Swami Shahjananda", "d": "Swami Vivekananda"}, "ans": "d", "exp": "Swami Vivekananda was a disciple of Ramakrishna. He gave his famous speech at the Parliament of World Religions in Chicago in 1893. He established the Belur Math in West Bengal, and Ramakrishna Mission in 1897.", "t": 2, "s": 8}, {"n": 755, "tag": null, "stem": "Who founded the Prarthana Samaj in Mumbai in 1867?", "opts": {"a": "Atmaram Pandurang", "b": "Gopal Krishna Gokhale", "c": "Shri Ram Bajpai", "d": "Ram Mohan Roy"}, "ans": "a", "exp": "Atmaram Pandurang.  Prarthana Samaj was founded with an aim to make people believe in one God and worship only one God.", "t": 2, "s": 8}, {"n": 756, "tag": null, "stem": "When was a Madrasa opened in Kolkata to promote the study of Arabic, Persian and Islamic law?", "opts": {"a": "1772 C.E.", "b": "1783 C.E.", "c": "1781 C.E.", "d": "1774 C.E."}, "ans": "c", "exp": "1781 C.E. It was set up by Warren Hastings of the first Governor General of East India Company. Other universities and colleges: Aligarh Muslim University, originally as the Muhammadan Anglo-Oriental College (1875), Jamia Millia Islamia (1920), Darul Uloom Deoband (1866), Osmania University (1918).", "t": 2, "s": 8}, {"n": 757, "tag": null, "stem": "Assertion (A): Tarabai Shinde was the author of the book Stree Purush Tulana, published in 1882.<br><b>Reason (R): <\/b>Stree Purush Tulana highlighted women’s superiority over men and rejected the idea of gender equality.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "c", "exp": "A is true, but R is false.  Tarabai Shinde (1850-1910) was a pioneering Indian social reformer and writer who advocated for women&#x27;s rights. Her notable work, &quot;Stree Purush Tulana&quot; (A Comparison Between Women and Men), published in 1882, critiqued the patriarchal society and argued for gender equality. Swarnakumari Devi : She was the first Indian Woman editor (the editor of the women’s journal Bharati). Usha Mehta wrote the book “Mahatma Gandhi and Humanism”. Pandita Ramabai : She wrote the High Caste Hindu Women, Stree Dharma Neeti, American Encounter.", "t": 2, "s": 8}, {"n": 758, "tag": null, "stem": "Samata Sainik Dal was formed in 1927 by whom among the following personalities?", "opts": {"a": "Savitribai Phule", "b": "BR Ambedkar", "c": "Mahatma Gandhi", "d": "Narayana Guru"}, "ans": "b", "exp": "BR Ambedkar. He founded ‘Bahishkrit Hitakarini Sabha&#x27; in 1924 to promote and uplift the education of untouchables. Mahatma Gandhi founded - Harijan Sevak Sangh in 1932. Narayana Guru founded the Sree Narayana Dharma Paripalana Yogam (SNDP) in 1903.", "t": 2, "s": 8}, {"n": 759, "tag": null, "stem": "Consider the following statements regarding Raja Rammohun Roy and his reform activities:<br>1. Raja Rammohun Roy founded the Atmiya Sabha in 1814 in Kolkata, marking the beginning of modern socio-religious reform in India.<br>2. He co-founded the Brahmo Sabha in 1828, which later developed into the Brahmo Samaj.<br>3. The Atmiya Sabha was founded by Keshab Chandra Sen in 1814. Which of the statements given above is/are correct?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. Raja Rammohun Roy, known as &quot;the Father of Indian Renaissance,&quot; was an Indian reformer and writer who co-founded the Brahmo Sabha in 1828, leading to the formation of the Brahmo Samaj, a significant socio-religious reform movement. Honored with the title of Raja by Mughal emperor Akbar II, his influence marked the beginning of modern thought in Kolkata, particularly with the establishment of the Atmiya Sabha in 1814.", "t": 2, "s": 8}, {"n": 760, "tag": null, "stem": "Which of the following Sikh reform movements was started in 1873 in Amritsar?", "opts": {"a": "Babbar Akali Movement", "b": "Akali Movement", "c": "Singh Sabha Movement", "d": "Gurudwara Movement"}, "ans": "c", "exp": "Singh Sabha Movement. It was a reform organization for Sikhs, with the first Sabhas established in Amritsar in 1873 and Lahore in 1879. The Babbar Akali Movement: It was founded at the Sikh Educational Conference in Hoshiarpur in 1921. The Gurudwara Reform Movement (Akali Movement) was started in Amritsar in 1920.", "t": 2, "s": 8}, {"n": 761, "tag": null, "stem": "Who founded the Arya Samaj in Mumbai in 1875 ?", "opts": {"a": "Swami Dayanand Saraswati", "b": "Debendranath Tagore", "c": "Swami Vivekanand", "d": "Raja Ram Mohan Roy"}, "ans": "a", "exp": "Swami Dayanand Saraswati,  an Indian philosopher, is known for his work Satyarth Prakash and the slogan “Go Back to the Vedas.” He also initiated the Shuddhi Movement. Debendranath Tagore founded the Tattvabodhini Sabha in 1839 and joined the Brahmo Samaj (founded by Raja Rammohan Roy in 1828) in 1842. The Ramakrishna Mission was established by Swami Vivekananda in May 1897 at Belur Math, West Bengal.", "t": 2, "s": 8}, {"n": 762, "tag": null, "stem": "With reference to Ishwar Chandra Vidyasagar, consider the following statements.<br>i) He protested child marriage and polygamy.<br>ii) Due to his efforts, the first Hindu Widow Remarriage Act, 1856, was introduced.<br>iii) He was primarily known for his scholarship in Persian language. Which of the above statements is/are correct?", "opts": {"a": "i, ii, iii", "b": "i, ii", "c": "i, iii", "d": "ii, iii"}, "ans": "b", "exp": "i, ii. Ishwar Chandra Vidyasagar&#x27;s efforts led to the passage of the Hindu Widows&#x27; Remarriage Act (Act XV) on July 16, 1856, legalizing widow remarriage in India under East India Company rule. Drafted by Lord Dalhousie and enacted by Lord Canning, the law took effect on July 26, 1856.", "t": 2, "s": 8}, {"n": 763, "tag": null, "stem": "Consider the following statements regarding social reform movements in British India:<br>1. Guru Ghasidas led the Satnami Movement to uplift the social conditions of leather workers.<br>2. The Satyashodhak Samaj was founded by Guru Ghasidas in the early 19th century. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Guru Ghasidas, the Guru of Satnam Dharma, was a Satnami saint and renowned scholar from Chhattisgarh in the early 19th century. He began preaching in the deep forests of Chhattisgarh, spreading his teachings. The Satnami movement, also known as Satnampanth or Sadhanpanth, was a social and religious movement in India that challenged the caste system and the prevailing political and religious authorities.", "t": 2, "s": 8}, {"n": 764, "tag": null, "stem": "Which was the first socio-religious organisation established in Bombay in 1840 to work for the annihilation of caste?", "opts": {"a": "Dharma Sabha", "b": "Satyashodhak Samaj", "c": "Paramhans Mandali", "d": "Vishwa Jain Sangathan"}, "ans": "c", "exp": "Paramhans Mandali :  Founder - Durgaram Mehtaji. Dharma Sabha was formed in 1830 in Calcutta by Radhakanta Deb, primarily for the defense of Hindu orthodoxy.", "t": 2, "s": 8}, {"n": 765, "tag": null, "stem": "Assertion (A): The Satyashodhak Samaj was founded by Jyotiba Phule in 1873 to promote education and social rights among the underprivileged.<br><b>Reason (R): <\/b>The Prarthana Samaj, founded by Jyotiba Phule, aimed at uplifting lower castes and women in Pune.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "c", "exp": "A is true, but R is false.  Satyashodhak Samaj was founded by Jyotiba Phule in 1873, It is also known as the Society of Seekers of Truth. Its aim was to access social rights and civil liberties for people of lower castes, underprivileged and women. Jyotiba Phule (a social activist) - Established the first school for girls in India in Pune in 1848. Dalit term was first used by him.", "t": 2, "s": 8}, {"n": 766, "tag": null, "stem": "Who among the following was the pioneer of widow remarriages in Maharashtra and also started a girls&#x27; school in Poona along with his wife?", "opts": {"a": "BR Ambedkar", "b": "Gopal Hari Deshmukh Lokahitawadi", "c": "Jyotirao Govindrao Phule", "d": "Mahatma Gandhi"}, "ans": "c", "exp": "Jyotirao Govindrao Phule. He was a prominent social reformer from Maharashtra who dedicated his life to eradicating untouchability and caste discrimination. Together with his wife, Savitribai, he played a key role in promoting women&#x27;s education in India, founding the first girls&#x27; school in 1848 at Bhidewada, Pune. Major Publications: Tritiya Ratna, Gulamgiri, and Shetkarayacha Aasud.", "t": 2, "s": 8}, {"n": 767, "tag": null, "stem": "Match the following movements with their respective founders:<br>a. Faraizi Movement I. Sayyid Ahmad of Rae Bareli<br>b. Mohammedan II. Sir Syed Ahmad Literary Society Khan<br>c. Indian Patriotic III. Nawab Abdul Association Latif<br>d. Wahabi IV. Haji Shariatullah Movement", "opts": {"a": "a - IV, b - III, c - Il, d - I", "b": "a - III, b - IV, c - II, d - I", "c": "a - Il, b - I, c - IV, D - III", "d": "a - I, b - II, c - III, d - IV"}, "ans": "a", "exp": "a - IV, b - III, c - Il, d - I. Other Movement/Organisation and their Founders: Bhoodan movement - Acharya Vinobha Bhave, Servants of India Society - GK Gokhale, Khudai Khidmatgar - Khan Abdul Gaffar Khan, Arya Samaj - Dayanand Saraswati, Self-respect Movement - EV Ramaswamy Naicker, Tattvabodhini Sabha - Debendranath Tagore, Abhinav Bharat - Vir Savarkar, and Narmada Bachao - Medha Patkar.", "t": 2, "s": 8}, {"n": 768, "tag": null, "stem": "Consider the following statements regarding the Muhammadan Anglo-Oriental College in Aligarh:<br>1. The Muhammadan Anglo-Oriental College was founded by Sir Syed Ahmed Khan in 1875 to promote Western education among Muslims.<br>2. The college was modeled on the pattern of Oxford and Cambridge universities and later developed into Aligarh Muslim University.<br>3. The college was originally established by Syed Ameer Ali with support from the British government. Which of the statements given above is/are correct?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. In 1875, Sir Syed Ahmed Khan founded the Muhammadan Anglo Oriental College on the pattern of Oxford and Cambridge universities. The college later grew into Aligarh Muslim University. He started the Aligarh movement to promote western education among muslims. He established the Scientific Society in 1864.", "t": 2, "s": 8}, {"n": 769, "tag": null, "stem": "Henry Louis Vivian Derozio, a teacher at Hindu College, Calcutta, in the 1820s, promoted radical ideas and encouraged his pupils to question all authority. Referred to as the _________ his students attacked tradition and custom, demanded education for women and campaigned for the freedom of thought and expression.", "opts": {"a": "Young Christian Movement", "b": "Young Men&#x27;s Movement", "c": "Young Radical Movement", "d": "Young Bengal Movement"}, "ans": "d", "exp": "Young Bengal Movement.  Other Reform Organisations and its Founders : The Brahmo Samaj (1828) - Raja Ram Mohan Roy, The Veda Samaj (1864) - Keshab Chandra Sen and K. Sridharalu Naidu, The Prarthana Samaj (1867) - Atmaram Pandurang.", "t": 2, "s": 8}, {"n": 770, "tag": null, "stem": "Consider the following statements regarding the Self-Respect Movement in Tamil Nadu:<br>1. The Self-Respect Movement was started by E. V. Ramasamy (Periyar) in 1925.<br>2. The Self-Respect Movement was initiated in 1910 with the aim of promoting British education among upper castes. Which of the above statements is/are true?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The Self-Respect Movement was a social and political movement in South India that sought to achieve equality and social justice for people oppressed by the caste system. The movement was initiated by E. V. Ramasamy (also known as Periyar).", "t": 2, "s": 8}, {"n": 771, "tag": null, "stem": "Who among the following is associated with the Theosophical Society?", "opts": {"a": "Annie Besant", "b": "Tarabai Shinde", "c": "Sarojini Naidu", "d": "Savitri Bai Phule"}, "ans": "a", "exp": "Annie Besant had come to India in 1893. She laid the foundation of the Central Hindu College in Benaras in 1898. The Theosophical Society: Theosophy represents the wisdom at the core of all religions when stripped of superstitions and excesses. It was founded by Madame H. P. Blavatsky and Colonel Olcott in New York (United States) in 1875. In 1882, they shifted their headquarters to Adyar (Madras Presidency).", "t": 2, "s": 8}, {"n": 772, "tag": null, "stem": "Who among the following is NOT associated with the Rahnumai Mazdayasnan Sabha?", "opts": {"a": "Naoroji Furdunji", "b": "SS Bengalee", "c": "Syed Ahmed Khan", "d": "Dadabhai Naoroji"}, "ans": "c", "exp": "Syed Ahmed Khan. The Rahnumai Mazdayasnan Sabha was a social reform organization founded in 1851 by Parsis in Bombay (now Mumbai) to promote reform in the ancient Zoroastrian religion. It was composed of Dadabhai Naoroji, J.B. Wacha, S.S Bengalee and Naoroji Furdonji, with the funding from K.N. Kama.", "t": 2, "s": 8}, {"n": 773, "tag": null, "stem": "Which of the following statement(s) is/are correct about Prarthana Samaj?<br>A. Prarthana Samaj or ‘Prayer Society’ in Sanskrit, was a movement for religious and social reforms.<br>B. Prarthana Samaj was founded in 1863 by Dadoba Pandurang and his brother Atmaram Pandurang.", "opts": {"a": "Neither A nor B", "b": "Only A", "c": "Both A and B", "d": "Only B"}, "ans": "b", "exp": "Only A. The Prarthana Samaj was established in Bombay by Dr. Atma Ram Pandurang in 1867. Aim - To remove caste restriction, abolish child marriage, encourage women education and promotes widow remarriages. Members - R.C. Bhandarkar and Justice Mahadev Govind Ranade.", "t": 2, "s": 8}, {"n": 774, "tag": null, "stem": "Sree Narayana Guru considered the differences based on caste and religion as meaningless and advocated the principle of ‘One Caste, one Religion and one God’ for all. He belonged to which of the following organisations?", "opts": {"a": "Veda Samaj", "b": "Sree Narayana Dharma Paripalana Yogam", "c": "Brahmo Samaj", "d": "Arya Samaj"}, "ans": "b", "exp": "Sree Narayana Dharma  <mark>Paripalana Yogam. <\/mark>Sree Narayana Guru: In 1888, he built a temple dedicated to Lord Shiva at Aruvippuram which was against the caste-based restrictions of the time.", "t": 2, "s": 8}, {"n": 775, "tag": null, "stem": "Assertion (A): Kandukuri Veeresalingam pioneered the movement for widow remarriage and girls’ education in the Andhra region.<br><b>Reason (R): <\/b>Sree Narayana Guru was regarded as the father of the Telugu Renaissance movement in Andhra Pradesh.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "c", "exp": "A is true, but R is false.  Kandukuri Veeresalingam (1848-1919) was a social reformer and writer from Andhra Pradesh. He is considered as the father of the Telugu Renaissance movement. He also fought against child marriage and the dowry system.", "t": 2, "s": 8}, {"n": 776, "tag": null, "stem": "Which of the following organizations was founded in Poona, Satara and other towns of Maharashtra that worked against Brahmanical orthodoxy and tried to reform Hinduism?", "opts": {"a": "Brahmo Samaj", "b": "Paramahansa Mandali", "c": "Ramakrishna Mission", "d": "Arya Samaj"}, "ans": "b", "exp": "Paramahansa Mandali - It was a secret socio-religious group, established in 1849, in Bombay and was closely related to Manav Dharma Sabha which was founded in 1844 in Surat.", "t": 2, "s": 8}, {"n": 777, "tag": null, "stem": "Match the following associations with the class whose interests they primarily represented: <b>List I List II <\/b><br>1. Landholders’ A. Merchants and Society (1838) businessmen<br>2. Bombay B. Landlords Association (1852) (Zamindars)<br>3. Madras Native C. Educated Association (1852) middle-class elites<br>4. Poona D. Political Sarvajanik Sabha awareness in (1870) Madras region", "opts": {"a": "1–B, 2–A, 3–D, 4–C", "b": "1–A, 2–B, 3–C, 4–D", "c": "1–B, 2–D, 3–A, 4–C", "d": "1–C, 2–A, 3–B, 4–D"}, "ans": "a", "exp": "1–B, 2–A, 3–D, 4–C.  Landholders’ Society also known as the Zamindari Association is considered to be the first political association of modern India. It was formally launched in Calcutta in March 1838. Raja Radhakant dev, Dwarkanath tagore, Prasanna Kumar Tagore, Rajkamal Sen and Bhabani Charan Mitra were its founding members.", "t": 2, "s": 8}, {"n": 778, "tag": null, "stem": "Who started the temple entry movement in 1927 ?", "opts": {"a": "Mahadev Govind Ranade", "b": "Bhimrao Ambedkar", "c": "Mahatma Gandhi", "d": "Annie Besant"}, "ans": "b", "exp": "Bhimrao Ambedkar. It was a movement to allow lower caste people to enter temples. Dalits Movements led by Bhimrao Ambedkar: The second biggest movement for the entry of untouchables in the famous Kalaram temple of Nashik in 1930. Mahad Satyagraha (1927) was a movement for the Dalits to get the right to drink water from the tank.", "t": 2, "s": 8}, {"n": 779, "tag": null, "stem": "Visva Bharati a famous educational institute was founded in 1921 by:", "opts": {"a": "Rabindranath Tagore", "b": "Vinoba Bhave", "c": "Mother Teresa", "d": "Swami Chinmayananda"}, "ans": "a", "exp": "Rabindranath Tagore.  Visva-Bharati University: It is located in Shantiniketan, West Bengal and became the world&#x27;s first &quot;living heritage university&quot;.", "t": 2, "s": 8}, {"n": 780, "tag": null, "stem": "Who established Bharatiya Vidya Bhavan to promote education and culture?", "opts": {"a": "Dr. Kanhaiyalal Maneklal Munshi", "b": "Dr. Atmaram Pandurang", "c": "Gopal Krishna Gokhale", "d": "Dr. Babasaheb Ambedkar"}, "ans": "a", "exp": "Dr. Kanhaiyalal Maneklal  <mark>Munshi. <\/mark>Bhartiya Vidya Bhawan - A charitable public trust founded on November 7, 1938.", "t": 2, "s": 8}, {"n": 781, "tag": null, "stem": "Who had founded the first Women’s University in India ?", "opts": {"a": "Dhondo Keshav Karve", "b": "Ashutosh Mukherjee", "c": "William Hunter", "d": "Sayed Ahmed Khan"}, "ans": "a", "exp": "Dhondo Keshav Karve  <mark>(Maharishi Karve)- <\/mark>He founded the first women university (SNDT Women&#x27;s University) in 1916 in India. Awards - Bharat Ratna (1958), Padma Vibhushan (1955). The Widow Remarriage Association was founded by Vishnu Shastri Pandit.", "t": 2, "s": 8}, {"n": 782, "tag": null, "stem": "__________ was the first woman to be accorded the title Pandita by the faculty of Calcutta University for her exceptional knowledge of Sanskrit.", "opts": {"a": "Rokaya Sakhawat Hossain", "b": "Ramabai Sarasvati", "c": "Sarojini Naidu", "d": "Rash Sundari Devi"}, "ans": "b", "exp": "Ramabai Sarasvati was an Indian social reformer, a pioneer in the education and emancipation of women in India. She was the first woman to be accorded the titles of Pandita. She was one of the 10 women delegates of the Congress session of 1889. In the late 1890s, she founded Mukti Mission at Kedgaon village, and established Sharada Sadan (Home of Wisdom), a school for widows, in Mumbai. In 1919, the king of England bestowed on her the Kaiser-I - Hind award.", "t": 2, "s": 8}, {"n": 783, "tag": null, "stem": "Who is known as the founder of the Widow Remarriage Association (1861)?", "opts": {"a": "Dr. Atma Ram Pandurang", "b": "RG Bhandarkar", "c": "Dwarkanath Tagore", "d": "Mahadev Govind Ranade"}, "ans": "d", "exp": "Mahadev Govind Ranade.  Widow Remarriage Association - Started by Vishnu Shastri Pandit in 1856.
