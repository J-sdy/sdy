<!DOCTYPE html>
<html lang="en">
<head>

<title>History PYQ Quiz – SSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#232831; --muted:#6A7080; --line:#E4E0D6;
  --accent:#34457F; --accent-soft:#E9ECF6;
  --ok:#2F7D5C; --ok-bg:#E8F3ED; --bad:#A94438; --bad-bg:#F8EAE7;
  --mark:#FCE8A6; --exp-bg:#F4F7FB; --exp-line:#5B7FB5; --yr:#8A4B1F;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-text-size-adjust:100%}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;max-width:760px;margin:0 auto}
h1{font-family:var(--serif);font-size:1.45rem;margin:0 0 2px;font-weight:600;letter-spacing:.1px}
.sub{color:var(--muted);font-size:.85rem}
.tabsWrap{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:760px;margin:0 auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:104px;padding:8px 16px 9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-family:var(--ui);cursor:pointer;transition:background .15s,border-color .15s}
.tab .cnt{font-size:1.05rem;font-weight:700;color:var(--accent);line-height:1.2}
.tab .lbl{font-size:.74rem;font-weight:500;color:var(--muted);white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent)}
.tab.active .cnt,.tab.active .lbl{color:#fff}
.tabs.sub{padding:2px 14px 10px}
.tabs.sub .tab{min-width:0;flex:0 0 auto;flex-direction:row;gap:7px;padding:6px 12px;border-radius:999px;background:#FBFAF7}
.tabs.sub .cnt{font-size:.82rem;font-weight:700}
.tabs.sub .lbl{font-size:.8rem;color:var(--ink)}
.tabs.sub .tab.active{background:var(--accent-soft);border-color:var(--accent)}
.tabs.sub .tab.active .cnt{color:var(--accent)}
.tabs.sub .tab.active .lbl{color:var(--accent);font-weight:600}
.era{flex:0 0 auto;align-self:center;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 6px;writing-mode:horizontal-tb}
.bar{max-width:760px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted)}
.bar b{color:var(--ink)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;max-width:728px;margin:0 auto}
.progWrap{padding:0 16px;max-width:760px;margin:0 auto}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.btn{font-family:var(--ui);font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;padding:6px 11px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:8px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(35,40,49,.04)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.qn{font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.chip.sub2{color:var(--accent);border-color:#CBD3EA;background:#F5F7FC}
.chip{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.stem{font-family:var(--serif);font-size:1.08rem;line-height:1.62;margin:2px 0 12px;font-weight:400}
.stem b{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--ink);background:#FCFBF8;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;transition:background .12s,border-color .12s}
.opt .k{flex:0 0 auto;font-family:var(--ui);font-size:.78rem;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-top:1px}
.opt:active{background:var(--accent-soft)}
.card.done .opt{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{background:var(--bad);color:#fff}
.exp{display:none;margin-top:14px;background:var(--exp-bg);border-left:4px solid var(--exp-line);border-radius:4px 10px 10px 4px;padding:12px 14px}
.card.done .exp{display:block}
.verdict{font-family:var(--ui);font-weight:600;font-size:.88rem;margin-bottom:6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.exp .body{font-family:var(--serif);font-size:1rem;line-height:1.7;color:#2B303A}
.exp mark{background:var(--mark);color:inherit;padding:1px 4px;border-radius:4px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.exp .yr{color:var(--yr);font-weight:600}
.reveal{margin-top:10px}
.more{display:block;margin:18px auto;font-size:.9rem;padding:10px 20px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
#top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--accent);color:#fff;font-size:1.25rem;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(35,40,49,.2);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:30}
#top.show{opacity:1;pointer-events:auto;transform:none}
@media (min-width:700px){.stem{font-size:1.15rem}.opt{font-size:1.06rem}}
</style>
</head>

<script>
const DATA={"q": [{"n": 1, "tag": "SSC Stenographer 6/08/2025 (Shift 2)", "stem": "Which of the following is considered the oldest known civilization of the Indian subcontinent ?", "opts": {"a": "Gupta Empire", "b": "Maurya Civilization", "c": "Indus Valley Civilization", "d": "Vedic Civilization"}, "ans": "c", "exp": "The Indus Valley Civilization  (2500–1750 BCE). It flourished in present-day northwest India and Pakistan with major sites like Harappa and Mohenjo-daro, well known for urban planning, drainage systems, and trade. Indus Valley Civilization was a Bronze Age civilization noted for its advanced urban planning. The Vedic Civilization came later (1500 BCE onwards), while the Maurya (4th century BCE) and Gupta (4th century CE) empires emerged much later.", "t": 0, "s": 0}, {"n": 2, "tag": "SSC Stenographer 6/08/2025 (Shift 3)", "stem": "In the following questions, a statement of Assertion (A) is followed by a statement of Reason (R). Select the correct option from the following:<br><b>Assertion (A): <\/b>Rows of circular brick platforms at Harappa were used for religious ceremonies.<br><b>Reason (R): <\/b>These platforms were found to contain wheat and barley grains.", "opts": {"a": "Both A and R are false", "b": "Both A and R are true, and R explains A", "c": "Both A and R are true, but R does not explain A", "d": "A is false, but R is true"}, "ans": "d", "exp": "A is false, but R is true. At Harappa, archaeologists discovered rows of circular brick platforms, but there is no conclusive evidence that they were used for religious ceremonies; thus, the assertion is false. However, these platforms did contain remains of wheat and barley grains, suggesting their association with granary storage or processing of food grains, not rituals. The Harappan Civilization (Indus Valley Civilization) was first discovered in 1921 at Harappa, in present-day Punjab, Pakistan, by Daya Ram Sahni, an officer of the Archaeological Survey of India (ASI). A year later, in 1922, another important site, Mohenjo-daro, was discovered in Sindh by R.D. Banerjee.", "t": 0, "s": 0}, {"n": 3, "tag": null, "stem": "Consider the following statements about the Harappan site Banawali:<br>1. Banawali is located in the Fatehabad district of Haryana.<br>2. Excavations revealed only Harappan cultural phase, without any Pre-Harappan remains.<br>3. The site was excavated by Dr. R.S. Bisht, and both the citadel and lower town were fortified. Which of the above statements is/are correct ?", "opts": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "1 and 3 only. Banawali in Haryana was excavated by R.S. Bisht and it shows fortified citadel and lower town. It had Pre-Harappan, Harappan, and Bara phases, so statement 2 is incorrect.", "t": 0, "s": 0}, {"n": 4, "tag": null, "stem": "Consider the following statements regarding Iron Age sites in western and southern India:<br>1. Tekwada is an Iron Age site located in Gujarat.<br>2. Hallur is an Iron Age site in Karnataka. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Tekwada is an Iron Age site located in Maharashtra.", "t": 0, "s": 0}, {"n": 5, "tag": null, "stem": "Which of the following statements is/are true about the Iron Age ?<br>1. The establishment of large cities took place on the basis of sizeable surplus.<br>2. The ceramic associated with this age was Painted Grey Ware.<br>3. The Indus Valley Civilization flourished during the Iron Age.", "opts": {"a": "Only 2 and 3", "b": "Only 1 and 2", "c": "All 1, 2 and 3", "d": "Only 1"}, "ans": "b", "exp": "Only 1 and 2. The Indus Valley Civilization flourished during the Bronze Age, not the Iron Age. The civilisations that flourished during the Iron Age were Greece, Rome, Persia and India.", "t": 0, "s": 0}, {"n": 6, "tag": null, "stem": "Which of the following statements is correct ?", "opts": {"a": "Harappan culture spread only to Sindh and Punjab.", "b": "The script of the Harappan culture has been deciphered by historians.", "c": "At burials in Harappan sites the dead were generally laid in pits.", "d": "Granaries in the Indus Valley Civilization were found in Harappa only."}, "ans": "c", "exp": "Harappa was discovered in 1921-22 by Daya Ram Sahni. It is located on the banks of the Ravi River in Sahiwal (formerly Montgomery) district, Punjab, Pakistan. The city is divided into three main sections: the Citadel, the Middletown, and the Lower Town. The Harappans sourced copper from present-day Rajasthan. Significant findings include two rows of six granaries, workers&#x27; quarters, two sandstone statues depicting human anatomy, a sculpture of a dog attacking a deer, and small bullock carts (known as ekkas).", "t": 0, "s": 0}, {"n": 7, "tag": null, "stem": "Which of the below statements is/are correct ?<br><b>Statement 1 : <\/b>Mohenjo-Daro was discovered by R.D. Banerji in 1922.<br><b>Statement 2 : <\/b>Drains exiting from Mohenjo-Daro had sandstone doors that were closed at night to prevent vagrants from entering the city.", "opts": {"a": "Only Statement 1", "b": "Only Statement 2", "c": "Both Statement 1 and Statement 2", "d": "Neither Statement 1 nor Statement 2"}, "ans": "a", "exp": "Only Statement 1.  Mohenjo-Daro was discovered by R.D. Banerji in 1922, but the drains had wooden, not sandstone, doors.", "t": 0, "s": 0}, {"n": 8, "tag": null, "stem": "Match the following cultural periods with their associated pottery traditions: <b>List I – List II – <\/b> <b>Cultural Period Associated Pottery <\/b><br>A. Harappan 1. Painted Grey Ware Age (PGW)<br>B. Iron Age 2. Painted Red Ware<br>C. Vedic Age 3. Black-and-Red Ware<br>4. Early Harappan Red Ware", "opts": {"a": "A–4, B–3, C–1", "b": "A–2, B–4, C–3", "c": "A–4, B–2, C–1", "d": "A–4, B–3, C–2"}, "ans": "a", "exp": "A–4, B–3, C–1. Harappan Age - Early Harappan Red Ware (with painted designs). Iron Age - Black-and-Red Ware. Vedic Age - Painted Grey Ware (PGW culture, especially Later Vedic).", "t": 0, "s": 0}, {"n": 9, "tag": null, "stem": "Consider the following statements:<br>1. Mohenjodaro (Sindh, Pakistan) yielded a paved bathroom, the bronze Dancing Girl, the Bearded Priest, and the Great Granary.<br>2. Lothal (Gujarat) had a brick dockyard for berthing ships and also provided evidence of rice cultivation in Harappan context.<br>3. Banawali (Haryana) was the Harappan site where the dockyard was discovered. Which of the above statements is/are incorrect ?", "opts": {"a": "1 and 2 only", "b": "3 only", "c": "2 and 3 only", "d": "1 and 3 only"}, "ans": "b", "exp": "3 only. The dockyard was found at Lothal, not Banawali. Evidence of rice cultivation is indeed reported from Lothal (Harappan context).", "t": 0, "s": 0}, {"n": 10, "tag": null, "stem": "In Harappa, the granary had rows of ______ brick platforms for threshing the grains.", "opts": {"a": "diagonal", "b": "spherical", "c": "rectangular", "d": "circular"}, "ans": "d", "exp": "Circular. Granaries of the Indus Valley Civilization were discovered in two key regions: Mohenjodaro and Harappa. Mohenjodaro, located south of the Indus River, is a major site where the Great Granary, the largest building, was found.", "t": 0, "s": 0}, {"n": 11, "tag": null, "stem": "Consider the following statements regarding the architectural features of Indus Valley Civilisation:<br>1. The prominent architectural feature of Indus Valley towns was the citadel, which was usually fortified, except at Chanhudaro.<br>2. Major cities had grid-based town planning, burnt brick houses, and advanced underground drainage systems, such as Dholavira’s water reservoirs. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Both statements accurately describe the town planning and architecture of Indus Valley Civilisation.", "t": 0, "s": 0}, {"n": 12, "tag": null, "stem": "Select the correct alternative on the basis of the given statements on the cities of Harappan civilisation.<br><b>Statement I: <\/b>Most of the Harappan cities were divided into two parts: Higher Town and Lower Town.<br><b>Statement II: <\/b>The archaeologists describe the lower part of the towns as Citadel.", "opts": {"a": "Both Statement I and Statement II are true.", "b": "Only Statement II is true.", "c": "Only Statement I is true", "d": "Neither Statement I nor Statement II is true."}, "ans": "c", "exp": "Only Statement I is true. The Harappan cities were typically structured into two distinct sections. The part to the west was generally smaller in area but higher in elevation, which archaeologists refer to as the Citadel. In contrast, the section to the east was larger in size but lower in elevation, commonly known as the Lower Town.", "t": 0, "s": 0}, {"n": 13, "tag": null, "stem": "Fire altars were found in which of the following groups of Harappan cities ?", "opts": {"a": "Kalibangan and Lothal", "b": "Banawali and Chanhudaro", "c": "Mohenjo-Daro and Harappa", "d": "Mohenjo-Daro and Dholavira"}, "ans": "a", "exp": "Kalibangan and Lothal.  Findings of different Indus valley civilization sites : Kalibangan - Lower fortified town, Boustrophedon style, Wooden drainage, Copper Ox, Evidence of earthquake, Wooden plough, Camel’s bone. Lothal - Port Town, Evidence of Rice, Graveyard, Ivory scale, Copper dog. Mohenjo-Daro - Prepared Garments, Temple-like Palace, Pashupati seal, Statue of a dancing girl, The Great Bath, The Great Granary etc.", "t": 0, "s": 0}, {"n": 14, "tag": null, "stem": "Which of the following Indus Valley sites is now located in Pakistan ?", "opts": {"a": "Harappa", "b": "Lothal", "c": "Alamgirpur", "d": "Kalibangan"}, "ans": "a", "exp": "Harappa. The Indus valley civilization (Bronze Age) is also called the Harappan culture. Other Important Sites : Sutkagendor (Dast river, Balochistan); Chanhudaro (Pakistan, Indus river); Kalibangan (Rajasthan, Ghaggar river); Lothal (Gujarat, Bhogva river); Alamgirpur (Meerut, Hindon river).", "t": 0, "s": 0}, {"n": 15, "tag": null, "stem": "Pottery was first traceable to which period of ancient Indian history ?", "opts": {"a": "Chalcolithic", "b": "Palaeolithic", "c": "Neolithic", "d": "Mesolithic"}, "ans": "c", "exp": "Neolithic. Pottery has been discovered in the early villages of Mehrgarh. The Palaeolithic (the first and longest part of the Stone Age) was a period of prehistory when humans made stone tools.", "t": 0, "s": 0}, {"n": 16, "tag": null, "stem": "In India, the practice of erecting megaliths began about _____ago.", "opts": {"a": "3000 years", "b": "2000 years", "c": "500 years", "d": "1000 years"}, "ans": "a", "exp": "3000 years. A megalith is a large stone that has been used to construct a pre - historic structure or monument. Type - Clairn Circles type of Megalith (grave/memorial) were the stone pieces set in a circular shape around the grave. Menhir (standing stone), Capstone (Single megaliths placed horizontally over burial chambers), Dolmen (A large capstone on two or more support stones creating a chamber). Megalith Sites - Nilaskal (Karnataka), Hanamsagar (Karnataka), Junapani (Maharashtra), Hire Benakal (Karnataka), etc.", "t": 0, "s": 0}, {"n": 17, "tag": null, "stem": "Arrange the following sites in chronological order based on earliest evidence of settlement:<br>1. Mehrgarh<br>2. Harappa<br>3. Mohenjodaro<br>4. Kalibangan", "opts": {"a": "1 - 2 - 3 - 4", "b": "2 - 1 - 3 - 4", "c": "1 - 3 - 2 - 4", "d": "3 - 2 - 1 - 4"}, "ans": "a", "exp": "1-2-3-4. Mehrgarh – Neolithic site (~7000 BCE), considered the oldest agricultural settlement in the Indian subcontinent. Harappa – Early Harappan phase (~3300 BCE), discovered in 1921 by Dayaram Sahni. Mohenjodaro – Mature Harappan phase (~2600 BCE), discovered in 1922 by R.D. Banerji. Kalibangan – Harappan site in Rajasthan (~2500 BCE), known for fire altars and ploughed fields.", "t": 0, "s": 0}, {"n": 18, "tag": null, "stem": "Assertion (A): Bhimbetka is famous for prehistoric rock paintings.<br><b>Reason (R): <\/b>These paintings mainly depict scenes of hunting, dancing, and animal figures from the Mesolithic period.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "a", "exp": "Both A and R are true, and R is  <mark>the correct explanation of A. <\/mark>Bhimbetka, located in Madhya Pradesh, is known for its prehistoric rock shelters and paintings. These artworks, dating mainly to the Mesolithic period, depict hunting scenes, dancing figures, and various animals, reflecting the lifestyle and beliefs of early humans.", "t": 0, "s": 0}, {"n": 19, "tag": null, "stem": "Assertion (A): Ostrich egg shells have been found from the Palaeolithic sites in India.<br><b>Reason (R): <\/b>Daojali Hading in Assam yielded large quantities of ostrich remains.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "c", "exp": "A is true, but R is false.  Ostrich egg shells have indeed been found from Palaeolithic sites in India, such as Patne in Maharashtra, which confirms that Assertion (A) is true. However, Reason (R) is false because Daojali Hading is not a Palaeolithic site; it is a Neolithic site in Assam, and it has not yielded ostrich remains but rather jadeite stone and other Neolithic artefacts.", "t": 0, "s": 0}, {"n": 20, "tag": null, "stem": "Which of the following metals was used to make weapons and tools in Harappan cities ?", "opts": {"a": "Silver", "b": "Gold", "c": "Copper", "d": "Iron"}, "ans": "c", "exp": "Copper was the first metal used in Indus Valley (Bronze Age civilization) to make tools, utensils, and other objects. Other metals used were lead, gold, bronze and silver <mark>. <\/mark>", "t": 0, "s": 0}, {"n": 21, "tag": null, "stem": "The Harappan brought Gold from present-day _______ in India.", "opts": {"a": "Telangana", "b": "Tamil Nadu", "c": "Karnataka", "d": "Kerala"}, "ans": "c", "exp": "Karnataka. Gold ornaments are found at both Mohenjo-daro and Harappa. Other materials they imported: Copper - Brought from present-day Rajasthan, and from Oman in west Asia. Tin - Brought from present-day Afghanistan and Iran. Precious stones - Brought from present-day Gujarat, Iran and Afghanistan.", "t": 0, "s": 0}, {"n": 22, "tag": null, "stem": "Which of the following types of house remains were found in Mehrgarh site of Harappan civilization ?", "opts": {"a": "Triangular or circular", "b": "Rectangular or circular", "c": "Square or rectangular", "d": "Circular or square"}, "ans": "c", "exp": "Square or rectangle. Major findings at Mehrgarh are evidence of animal bones and the remains of houses. Mehrgarh was discovered in 1974 by Jean-Francois Jarrige. It is the first place where people started growing barley and wheat, reared the sheep and goat as it was one of the oldest villages.", "t": 0, "s": 0}, {"n": 23, "tag": null, "stem": "Arrange the following periods in chronological order:<br>1. Mesolithic 2. Palaeolithic<br>3. Neolithic 4. Chalcolithic", "opts": {"a": "1 → 2 → 3 → 4", "b": "2 → 1 → 3 → 4", "c": "2 → 3 → 1 → 4", "d": "1 → 3 → 2 → 4"}, "ans": "b", "exp": "2 → 1 → 3 → 4. The sequence begins with the Palaeolithic Age (Old Stone Age), followed by the Mesolithic Age (Middle Stone Age), then the Neolithic Age (New Stone Age), and finally the Chalcolithic Age (Copper–Stone Age). Each stage represents advancements in tools, lifestyle, and technology, moving from hunting–gathering to agriculture and metallurgy.", "t": 0, "s": 0}, {"n": 24, "tag": null, "stem": "Match the following archaeological sites with their respective periods: <b>List I – List II – <\/b> <b>Archaeological Period <\/b> <b>Site <\/b><br>A. Chirand 1. Neolithic<br>B. Burzahom 2.Neolithic-Chalcolithic<br>C. Hunasagi 3. Palaeolithic<br>D. Mehrgarh 4. Neolithic to Early Harappan", "opts": {"a": "A–1, B–4, C–3, D–2", "b": "A–2, B–1, C–3, D–4", "c": "A–1, B–2, C–3, D–4", "d": "A–4, B–1, C–3, D–2"}, "ans": "c", "exp": "A–1, B–2, C–3, D–4. Chirand – Neolithic site in Bihar. Burzahom – Neolithic-Chalcolithic site in Jammu &amp; Kashmir. Hunasagi – Palaeolithic site in Karnataka (stone-cutting tools found). Mehrgarh – Neolithic to Early Harappan site in Balochistan (Pakistan).", "t": 0, "s": 0}, {"n": 25, "tag": null, "stem": "Match the following Harappan sites with their present-day locations: <b>List I – List II – <\/b> <b>Harappan Site Present-day Location <\/b><br>A. Shortughai 1. Gujarat<br>B. Balakot 2. Rajasthan<br>C. Nageswar 3. Afghanistan<br>D. Kalibangan 4. Pakistan (Sindh/ Balochistan region)", "opts": {"a": "A–3, B–4, C–1, D–2", "b": "A–1, B–3, C–4, D–2", "c": "A–3, B–1, C–4, D–2", "d": "A–4, B–3, C–1, D–2"}, "ans": "a", "exp": "A–3, B–4, C–1, D–2.  Shortughai – Afghanistan (Harappan trading post linked to lapis lazuli mines). Balakot – Pakistan (Sindh/Balochistan coast, known for shell working). Nageswar – Gujarat (famous for shell manufacturing). Kalibangan – Rajasthan (known for fire altars and ploughed fields).", "t": 0, "s": 0}, {"n": 26, "tag": null, "stem": "Consider the following statements in the context of the Vedas.<br>1. The Vedas are called Shruti.<br>2. The Rigveda consists of ten Mandalas. Which of the statements given above is/are correct ?", "opts": {"a": "Neither 1 nor 2", "b": "Only 2", "c": "Both 1 and 2", "d": "Only 1"}, "ans": "c", "exp": "Both 1 and 2. Vedas are sruti (&quot;what is heard&quot;) distinguishing them from other religious texts, which are called smrti (&quot;what is remembered&quot;). Hindus consider the Vedas to be apauruṣeya, which means &quot;not of a man, superhuman&quot; and &quot;impersonal, authorless&quot;. The Rigveda is the oldest Veda and contains 1,028 hymns (suktas) comprising about 10,600 verses.", "t": 0, "s": 1}, {"n": 27, "tag": null, "stem": "Match the following Rigvedic Gods with their respective roles: God Role<br>1. Agni a. God of fire; acts as a mediator between gods and humans<br>2. Indra b. Warrior god; destroyer of Vritra (demon of drought)<br>3. Varuna c. God of rain and upholder of cosmic order<br>4. Yama d. God of death<br>5. Soma e. Sacred plant and its ritual drink; associated with immortality", "opts": {"a": "1-a, 2-b, 3-c, 4-d, 5-e", "b": "1-b, 2-c, 3-a, 4-e, 5-d", "c": "1-a, 2-c, 3-b, 4-d, 5-e", "d": "1-e, 2-b, 3-a, 4-c, 5-d"}, "ans": "a", "exp": "1-a, 2-b, 3-c, 4-d, 5-e.  In the Rigveda: Agni is the fire god and messenger between gods and men; Indra is the warrior god and Vritra’s slayer; Varuna controls rain and maintains Rita (cosmic order); Yama is the first mortal and god of death; Soma is both a sacred plant and its intoxicating ritual drink, linked to immortality.", "t": 0, "s": 1}, {"n": 28, "tag": null, "stem": "According to the Ashrama system of Vedic life, which of the following was the third stage of life ?", "opts": {"a": "Grihastha", "b": "Sanyasa", "c": "Brahmacharya", "d": "Vanaprastha"}, "ans": "d", "exp": "Vanaprastha , where a person handed over household responsibilities to the next generation, took an advisory role, and gradually withdrew from the world. The four stages of the ashrama system are : Brahmacharya (Student&#x27;s life), Grihastha (household life), Vanaprastha (retired life), Sannyasa (renounced life).", "t": 0, "s": 1}, {"n": 29, "tag": null, "stem": "Consider the following statements:<br>1. The Vedangas are Hindu auxiliary disciplines linked to the study of the Vedas.<br>2. There are seven Vedangas in total. Which of the above statements is/are correct ?", "opts": {"a": "only 1", "b": "only 2", "c": "1 and 2 both", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "only 1. Statement 1 is correct because the Vedangas are considered the “limbs of the Vedas,” aiding in the proper understanding, pronunciation, and interpretation of the Vedic texts. There are six Vedangas, not seven, which include Shiksha (phonetics), Kalpa (ritual), Vyakarana (grammar), Nirukta (etymology), Chandas (meter), and Jyotisha (astronomy). Statement 2 is incorrect, as the total number of Vedangas is six.", "t": 0, "s": 1}, {"n": 30, "tag": null, "stem": "According to the Varna system that was prevalent in the Vedic period, which of the following was NOT a Varna ?", "opts": {"a": "Brahmanas", "b": "Kshatriyas", "c": "Samiti", "d": "Vaishyas"}, "ans": "c", "exp": "Samiti. The traditional caste system consists of a hierarchy of four castes (varnas) - Brahmins (priests and teachers), Kshatriyas (rulers and warriors), Vaishyas (merchants and cultivators), and Shudras (servants).", "t": 0, "s": 1}, {"n": 31, "tag": null, "stem": "Consider the following statements about Rig Vedic Samhita:<br>1. Rig Veda consists of 10 Mandalas.<br>2. The Gayatri Mantra is found in Mandala 2.<br>3. Mandala 10 contains the Purusha Sukta, which explains the origin of the four Varnas. Which of the above statements is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "2 and 3"}, "ans": "b", "exp": "2 only. Statement 2 is incorrect — Gayatri Mantra is in Mandala 3, not Mandala 2. Rig Veda is the oldest of the four Vedas. It is a collection of 10,600 verses and 1,028 hymns. Each mandala consists of Suktas which are basically eulogies. The 10th mandala contains the Purusha Sukta which explains the four Varnas were born from the mouth, arms, thighs and feet of the Brahma or Purusha. Mandala 9 is completely devoted to Soma.", "t": 0, "s": 1}, {"n": 32, "tag": null, "stem": "Which of the following is the earliest literary record of Indian culture ?", "opts": {"a": "Yajurveda", "b": "Rigveda", "c": "Atharvaveda", "d": "Samaveda"}, "ans": "b", "exp": "Rigveda. There are four Vedas: Rigveda, Samaveda, Yajurveda, and Atharvaveda.", "t": 0, "s": 1}, {"n": 33, "tag": null, "stem": "Match the ancient names of rivers with their present names: (A) Asikni 1. Beas (B) Vitasta 2. Jhelum (C) Purushni 3. Ravi (D) Vipasha 4. Chenab", "opts": {"a": "A–4, B–2, C–3, D–1", "b": "A–2, B–4, C–1, D–3", "c": "A–3, B–1, C–2, D–4", "d": "A–1, B–3, C–4, D–2"}, "ans": "a", "exp": "A–4, B–2, C–3, D–1. Ancient names of Indian Rivers - Vitasta (Jhelum), Purushni (Ravi), Shatudri (Satluj), Vipasha (Beas), Sadanira (Gandak), Drishdvati (Ghaghara).", "t": 0, "s": 1}, {"n": 34, "tag": null, "stem": "Which of the following Vedas is found in two recensions, black and white, and is full of rituals to be performed publicly or individually ?", "opts": {"a": "Rigveda", "b": "Atharvaveda", "c": "Yajurveda", "d": "Samaveda"}, "ans": "c", "exp": "Yajurveda :  Notable Upanishads of Yajurveda - Brihadaranyaka, Isha, Taittriya, Katha, and Maithri.", "t": 0, "s": 1}, {"n": 35, "tag": null, "stem": "In which of the following Vedas was Dasarajna war (the war of ten kings) mentioned ?", "opts": {"a": "Yajurveda", "b": "Samaveda", "c": "Rigveda", "d": "Atharvaveda"}, "ans": "c", "exp": "Rigveda (Book of Mantras). Dasarajna war was fought between King Sudas of the Bharata tribe and a confederation of ten tribes, including the Puru, Yadu, Turvasa, Anu, Druhyu, Alina, Paktha, Bhalanas, Shiva, and Vishanin. The battle took place on the banks of the Parushni (Ravi) river.", "t": 0, "s": 1}, {"n": 36, "tag": null, "stem": "The main (chief) social unit of the Aryans was______ .", "opts": {"a": "Rajan", "b": "Parishad", "c": "Gana", "d": "Jana"}, "ans": "d", "exp": "Jana (Tribes) <mark>. <\/mark>Gana - Tribal or clan based assemblies, Parishad - A small body similar to Samitis/sabhas consisting exclusively of Brahmins, Rajan - A kind of Chief or King.", "t": 0, "s": 1}, {"n": 37, "tag": null, "stem": "Consider the following statements regarding the Vedas:<br>1. Rig Veda is the oldest Veda and contains hymns mainly dealing with magic spells and charms.<br>2. Sama Veda is mainly a collection of chants and musical notations.<br>3. Atharva Veda contains a collection of magic spells and charms to ward off evil spirits and diseases. Which of the above statements is/are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "2 and 3 only. Rig Veda does not deal with magic spells and charms. Rig Veda has about 1,028 hymns (suktas) and 10,600 verses (richas). These hymns are mainly dedicated to various deities such as Indra, Agni, Varuna, Soma, Usha, etc.", "t": 0, "s": 1}, {"n": 38, "tag": null, "stem": "Consider the following statements regarding Indian philosophy:<br>1. The Purva Mimansa school of philosophy was founded by Jaimini.<br>2. Kapila is regarded as the founder of the Samkhya school of philosophy.<br>3. Patanjali is associated with the Yoga school of philosophy. Which of the above statements are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "d", "exp": "1, 2 and 3. Purva Mimansa (‘Prior Study’) also known as Dharma Mimamsa and Karma Mimamsa (‘Study of Actions’). The six principal Hindu darshans are Samkhya, Yoga, Nyaya, Vaisheshika, Mimamsa, and Vedanta. Badarayana - Author of Brahma Sutra or Vedanta Sutra. Patanjali - Philosophy of Yoga sutra. Kapila - Philosophy of Sankhya. Vyasa - Author of the Mahabharata, Vedas and Puranas.", "t": 0, "s": 1}, {"n": 39, "tag": null, "stem": "India was named &#x27;Bharat&#x27; after the name of the Bharat clan. In which of the following Vedas is this clan first mentioned ?", "opts": {"a": "Atharvaveda", "b": "Yajurveda", "c": "Samaveda", "d": "Rigveda"}, "ans": "d", "exp": "Rigveda. There are 1028 Suktas in 10 Mandals (Chapters).", "t": 0, "s": 1}, {"n": 40, "tag": null, "stem": "The language of the Aryan texts was:", "opts": {"a": "Ardh-Magadha Prakrit", "b": "Prakrit", "c": "Persian", "d": "Sanskrit"}, "ans": "d", "exp": "Sanskrit was the first language spoken in India. Ardhamagadhi Prakrit was a Middle Indo-Aryan language. Prakrit is a group of vernacular Middle Indo-Aryan languages spoken in India between the third and seventh century BCE.", "t": 0, "s": 1}, {"n": 41, "tag": null, "stem": "Consider the following statements regarding Rigvedic deities: (A) Agni was worshipped as the fire-god during the Rigvedic period. (B) Sindhu was regarded as a river goddess in the Rigveda. (C) Usha was worshipped as the goddess of night.goddess of dawn. Which of the above statements is/are correct ?", "opts": {"a": "(A) and (B) only", "b": "(B) only", "c": "(A) and (C) only", "d": "(A), (B) and (C)"}, "ans": "a", "exp": "(A) and (B) only. Usha was worshipped as the goddess of dawn.", "t": 0, "s": 1}, {"n": 42, "tag": null, "stem": "In the Rig Veda there is a hymn in the form of a dialogue between Sage Vishvamitra and two rivers that were worshipped as goddesses. Which are these rivers ?", "opts": {"a": "Alakananda and Bhagirathi", "b": "Ravi and Chenab", "c": "Ganga and Yamuna", "d": "Beas and Sutlej"}, "ans": "d", "exp": "Beas and Sutlej . The most prominent river in the Rig Veda is Saraswati.", "t": 0, "s": 1}, {"n": 43, "tag": null, "stem": "Which of the following statements about the ‘Gotra’ practice in ancient India is true ?", "opts": {"a": "Men and women were expected to marry within the same gotra.", "b": "People belonging to the same gotra were regarded as descendants of the person after whom the gotra was named.", "c": "Women retained their father’s gotra after marriage.", "d": "Each gotra was named after a famous king."}, "ans": "b", "exp": "Gotra originally referred to the seven lineage segments of the Brahmans (priests), who trace their derivation from seven ancient seers: Atri, Bharadvaja, Bhrigu, Gotama, Kashyapa, Vasishtha, and Vishvamitra.", "t": 0, "s": 1}, {"n": 44, "tag": null, "stem": "Consider the following statements about Purusha Sukta:<br>1. Purusha Sukta is a hymn from Rigveda.<br>2. It is dedicated to Lord Shiva, described as the great Purusha.<br>3. Purusha Sukta is one of the Pancha Suktam, which includes Vishnu Suktam, Sri Suktam, Bhu Suktam, and Nila Suktam. Which of the above statements is/are correct ?", "opts": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "1 and 3 only. Statement 2 is i incorrect because Purusha Sukta is dedicated to Lord Vishnu, not Lord Shiva.", "t": 0, "s": 1}, {"n": 45, "tag": null, "stem": "The Jain temple at Pattadakal was built by ________.", "opts": {"a": "Chalukyas", "b": "Cholas", "c": "Rashtrakutas", "d": "Hoysalas"}, "ans": "c", "exp": "Rashtrakuta . Other temples made by Rashtrakutas - The Kailasanatha Temple in Ellora, the Navalinga Temples in Pattadakal.", "t": 0, "s": 2}, {"n": 46, "tag": null, "stem": "Consider the following statements regarding Jain Tirthankaras: (A) Ayodhya is recognized as the birthplace of the first Tirthankara, Rishabhdev. (B) Ayodhya is also the birthplace of the fourth Tirthankara, Abhinandannath. (C) Varanasi is the birthplace of the first and fourth Tirthankaras. Which of the above statements is/are correct ?", "opts": {"a": "(A) and (B) only", "b": "(B) only", "c": "(A) and (C) only", "d": "(A), (B) and (C)"}, "ans": "a", "exp": "(A) and (B) only. Rishabhdev, the first Jain Tirthankara, was born in Ayodhya.Abhinandannath, the fourth Jain Tirthankara, was also born in Ayodhya.Varanasi holds a very important place in Jain traditions. It is recognized as the birthplace of three Jain Tirthankaras 23rd Tirthankara Parshvanatha, 7th Tirthankara Suparshvanatha and 11th Tirthankara Shreyansanatha.", "t": 0, "s": 2}, {"n": 47, "tag": null, "stem": "Which of the following describes the Medhi part in Buddhist structure ?", "opts": {"a": "The circular terrace between the railing and dome", "b": "Ceremonial gateways in front of stupas", "c": "A low wall to enclose the structure", "d": "The umbrella-shaped structure placed at the top of the structure"}, "ans": "a", "exp": "All forms of Buddhist architecture include three primary structures: vihara, stupa, and chaitya-griha.", "t": 0, "s": 3}, {"n": 48, "tag": null, "stem": "Which of the following statements is/are correct in context of Buddhist architecture ?<br>i. The Uddeshika stupa was created as a memorial.<br>ii. Paribhogika stupa contained the buried bodily remains of Buddh.<br>ii. Bharhut stupa is situated in Uttar Pradesh.", "opts": {"a": "Only i and ii", "b": "i, ii and iii", "c": "Only i and iii", "d": "Only i"}, "ans": "a", "exp": "Only i and ii. Bharhut stupa (Madhya Pradesh) is known for its early Buddhist reliefs and carvings.", "t": 0, "s": 3}, {"n": 49, "tag": null, "stem": "During which of the following rules did Buddhism get split into two schools - Hinayana and Mahayana in the fourth Buddhist council ?", "opts": {"a": "Kushana", "b": "Parthian", "c": "Gupta", "d": "Shaka"}, "ans": "a", "exp": "Kushana. The Fourth Buddhist Council was held in 72 AD at Kundalvana, Kashmir, under the Kushan king Kanishka. It was led by Vasumitra, with Asvaghosa as his deputy, and marked the division of Buddhism into two sects: Mahayana and Hinayana.", "t": 0, "s": 3}, {"n": 50, "tag": null, "stem": "Assertion (A) : The Shailendra rulers were great patrons of Buddhism.<br><b>Reason (R) : <\/b>They built the Borobudur stupa in Java, which is now a UNESCO World Heritage Site.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "a", "exp": "Both A and R are true, and R is  <mark>the correct explanation of A. <\/mark>The Shailendra rulers of Java were devoted followers of Buddhism and extended great patronage to Buddhist culture and architecture. Their most remarkable contribution was the construction of the Borobudur stupa, one of the largest Buddhist monuments in the world, which today is recognized as a UNESCO World Heritage Site.", "t": 0, "s": 3}, {"n": 51, "tag": null, "stem": "Stupas are a symbol of which of the following religions ?", "opts": {"a": "Hinduism", "b": "Jainism", "c": "Buddhism", "d": "Sikhism"}, "ans": "c", "exp": "Buddhism. Stupas were burial mounds prevalent in India from the vedic period. Stupas typically consist of several elements, including a circular base or platform, a hemispherical dome or Anda, a spire or Harmika, and a parasol or Chhatra. Sanchi Stupa in Madhya Pradesh is the most famous of the Ashokan stupas.", "t": 0, "s": 3}, {"n": 52, "tag": null, "stem": "The tall sculptures on the Bharhut Stupa are the depictions of ________.", "opts": {"a": "Mahavira", "b": "Yakshas and Yakshinis", "c": "Buddha", "d": "Bodhisattvas"}, "ans": "b", "exp": "Yakshas and Yakshinis.  (nature spirits in Indian mythology linked to prosperity and fertility). These figures symbolize the connection between the spiritual and natural worlds and showcase the integration of local traditions into Buddhist art.", "t": 0, "s": 3}, {"n": 53, "tag": null, "stem": "Consider the following statements about Dhamek Stupa:<br>1. Dhamek Stupa is located at Kushinagar.<br>2. It was originally commissioned by Emperor Ashoka in 249 BCE.<br>3. The present structure of Dhamek Stupa was built around 500 CE, replacing the earlier construction. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "1 and 2 only"}, "ans": "a", "exp": "1 only. Dhamek Stupa is not located at Kushinagar; it is in Sarnath. Both statements 2 and 3 are correct.", "t": 0, "s": 3}, {"n": 54, "tag": null, "stem": "Which of the following Indo-Greek kings was mentioned in the Buddhist text Milindapanho as Milinda ?", "opts": {"a": "Demetrius I", "b": "Antiochus II", "c": "Strato II", "d": "Menander I"}, "ans": "d", "exp": "Menander I. The Milinda Panha is a dialogue between the Indian Buddhist sage Nagasena and the 2nd-century BC Indo-Greek king Menander I.", "t": 0, "s": 3}, {"n": 55, "tag": null, "stem": "Select the INCORRECT statement from among the following.", "opts": {"a": "‘Sanchi Stupa’ is situated in Madhya Pradesh.", "b": "‘Bavikonda Stupa’ is situated in Andhra Pradesh.", "c": "‘Dhamek Stupa’ is situated in Uttar Pradesh.", "d": "‘Piprahwa Stupa’ is situated in Sikkim."}, "ans": "d", "exp": "Piprahwa Stupa is located in Uttar Pradesh near the town of Piprahwa, close to the India-Nepal border, this site is renowned for its archaeological significance.", "t": 0, "s": 3}, {"n": 56, "tag": null, "stem": "Which of the following is the largest Stupa in India ?", "opts": {"a": "Kesariya Stupa", "b": "Shanti Stupa", "c": "Sanchi Stupa", "d": "Maha Stupa"}, "ans": "a", "exp": "Kesariya Stupa (Bihar): It was discovered in 1958 during an excavation led by K.K Muhammed. Shanti Stupa (Leh): It was built in 1991 by Japanese Buddhist Bhikshu Gyomyo Nakamura.", "t": 0, "s": 3}, {"n": 57, "tag": null, "stem": "Assertion (A) : Ashvaghosha wrote the Buddhacharita, the biography of Buddha.<br><b>Reason (R) : <\/b>Ashvaghosha was the court poet of King Kanishka.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "a", "exp": "Both are true, and R correctly  <mark>explains A. <\/mark>Ashvaghosha was the court poet of king Kanishka. Other writers and books: Nagarjuna - Mulamadhyamakakarika. Vasumitra - Mahavibhasa. Charaka - Charaka Samhita.", "t": 0, "s": 3}, {"n": 58, "tag": null, "stem": "Identify the Stupa based on the given characteristics:<br>1. Built by Mauryan emperor Ashoka in the 3rd century BCE.<br>2. Located in Madhya Pradesh.<br>3. Declared a UNESCO World Heritage Site in 1989.", "opts": {"a": "Dhamek Stupa", "b": "Mahabodhi Stupa", "c": "Kesariya Stupa", "d": "Sanchi Stupa"}, "ans": "d", "exp": "Sanchi Stupa is the oldest Stupa of the Buddhist period. Originally built with bricks by Ashoka, it was later enlarged during the Shunga dynasty with stone railings and gateways (Toranas). The Stupa enshrines relics of the Buddha. It is one of the best-preserved stupas in India and an important center of Buddhist art and architecture. UNESCO declared it a World Heritage Site in 1989.", "t": 0, "s": 3}, {"n": 59, "tag": null, "stem": "____was the first woman to be ordained as a bhikkhuni in Buddhism.", "opts": {"a": "Dhammananda Bhikkhuni", "b": "Sujata", "c": "Mahapajapati Gotami", "d": "Sanghamitta"}, "ans": "c", "exp": "Mahapajapati Gotami.  Sanghamitta was an Indian Buddhist nun and the eldest daughter of Ashoka. Sujata fed Gautama Buddha a bowl of kheera, a milk-rice pudding, ending his six years of asceticism. Venerable Dhammananda Bhikkhuni is the first fully ordained Theravadin nun in Thailand.", "t": 0, "s": 3}, {"n": 60, "tag": null, "stem": "With reference to Buddhist architecture, what does chaitya mean ?", "opts": {"a": "Buddha Relics", "b": "Temple entrance", "c": "Prayer Hall", "d": "Residence/Monastery"}, "ans": "c", "exp": "Prayer Hall. It is a rectangular hall with a semi-circular apse at one end, which contains a stupa or relic chamber. Other types of architecture : Stupa - It contained the Buddha&#x27;s ashes. Vihara - Residence hall for the monks.", "t": 0, "s": 3}, {"n": 61, "tag": null, "stem": "The rules made for the Buddhist &quot;Sangha” were written down in a book called _______.", "opts": {"a": "Abhidhamma Pitaka", "b": "Sutta pitaka", "c": "Vinaya pitaka", "d": "Milinda Panha"}, "ans": "c", "exp": "Vinaya Pitaka. Buddhist teachings were divided into Three Pitakas at the First Buddhist Council in 483 BC. Vinaya Pitaka: It consists of rules of conduct and discipline applicable to the monastic life of the monks and the nuns. It was compiled by Upali, and was written in Pali language.", "t": 0, "s": 3}, {"n": 62, "tag": null, "stem": "Identify the Buddhist architectural structure based on the given characteristics:<br>1. Served as meditation cells and living quarters for monks.<br>2. Commonly used by wandering monks during the rainy season.<br>3. Famous examples are found at Ajanta, Ellora, Nasik, Karle, Kanheri, and Bagh.", "opts": {"a": "Viharas", "b": "Chaitya Grihas", "c": "Pietra dura", "d": "Stupas"}, "ans": "a", "exp": "Viharas – These were monasteries consisting of small cells arranged around a courtyard. They served as dwelling places and meditation halls for Buddhist monks, especially during the rainy season. Some of the finest rock-cut viharas are located at Ajanta and Ellora (Maharashtra), Nasik, Karle, Kanheri, and Bagh.", "t": 0, "s": 3}, {"n": 63, "tag": null, "stem": "Buddha meditated for days on end under a peepal tree at_____where he attained enlightenment.", "opts": {"a": "Sarnath", "b": "Bodh Gaya", "c": "Kushinagar", "d": "Ujjain"}, "ans": "b", "exp": "Bodh Gaya. Gautam Buddha  (Siddharta, Sakyamuni &amp; Tathagata). Father: Suddhodana, Mother: Mayadevi. Birth Place (563 B.C.): Lumbini (Nepal), Capital of Sakya republic. Teachers: Alarakalama and UdrakaRamputra. Enlightenment : At age of 35 under the Peepal tree at Uruvela (Bodhgaya) on banks of river Niranjana (Falgu). Mahaparinirvana (483 B.C.): At Kushinagar at age of 80. Sign:- Lotus and Bull - Birth, Horse - Renunciation, Bodhi Tree - Enlightenment, Dhammachakra Pravartana (Sarnath) - First sermon.", "t": 0, "s": 3}, {"n": 64, "tag": null, "stem": "What was the pedestrian path for devotees to wave in homage to Stupa called in Buddhist architecture ?", "opts": {"a": "Medhi", "b": "Torana", "c": "Anda", "d": "Chattra"}, "ans": "a", "exp": "Medhi. Features of Stupa - Medhi (A circular terrace), Toranas (wall with decorated gateways), Anda (hemispherical mound), Chattra (A central pillar supporting a triple-umbrella form), and Harmika (A square railing).", "t": 0, "s": 3}, {"n": 65, "tag": null, "stem": "Consider the following statements about the Lion Capital of Ashoka:<br>1. The Lion Capital was built to commemorate the death (Mahaparinirvana) of Buddha.<br>2. It was originally erected at Sarnath by Emperor Ashoka.<br>3. It was adopted as the National Emblem of India in 1950. Which of the statements given above is incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "None of the above"}, "ans": "a", "exp": "1 only – The Lion Capital was not built to mark Buddha’s death, rather it commemorates the First Sermon (Dharmachakra Pravartana) delivered at Sarnath. Emperor Ashoka erected it at Sarnath, and it was later adopted as the National Emblem of India in 1950.", "t": 0, "s": 3}, {"n": 66, "tag": null, "stem": "Which of the following statements is correct ?<br>I. Gautama Buddha belonged to a small gana known as the Sakya gana and was a Kshatriya.<br>II. Gautama Buddha passed away at Kusinara.", "opts": {"a": "Only I", "b": "Neither I nor II", "c": "Only II", "d": "Both I and II"}, "ans": "d", "exp": "Both I and II. Important places related to the life of Buddha are - Birth (Lumbini); Enlightenment (Bodh Gaya at Bihar); His first Sermon also known as Dharma-Chakra-Pravartana (Sarnath); His death or Mahaparinirvana in Kushinagara (Pali: Kusinārā), Uttar Pradesh.", "t": 0, "s": 3}, {"n": 67, "tag": null, "stem": "The earliest Buddhist texts were written in:", "opts": {"a": "Pali", "b": "Apabhramsha", "c": "Prakrit", "d": "Sanskrit"}, "ans": "a", "exp": "Pali. Pali canon, also called <mark>Tipitaka <\/mark>(Pali: “Triple Basket”), is the complete canon, first recorded in Pali, of the Theravada (“Way of the Elders”) branch of Buddhism.", "t": 0, "s": 3}, {"n": 68, "tag": null, "stem": "Consider the following statements about the Gandhara School of Art:<br>1. Marble stone was mainly used in this art style.<br>2. It was patronized by the Kushanas.<br>3. It shows a strong influence of Greek art. Which of the statements given above are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "2 and 3 only – Statement 1 is incorrect because Gandhara art used grey sandstone, not marble. It was developed under the Kushanas (esp. Kanishka) and shows a strong Greek (Hellenistic) influence, therefore also called Greco-Buddhist art.", "t": 0, "s": 3}, {"n": 69, "tag": "SSC Stenographer 8/08/2025 (Shift 3)", "stem": "Match the Mahajanapada with its capital: Column A: Column B: Mahajanapada Capital<br>1. Vatsa a. Kaushambi<br>2. Magadha b. Rajagriha<br>3. Kuru c. Ujjayini<br>4. Avanti d. Indraprastha", "opts": {"a": "1-a, 2-b, 3-d, 4-c", "b": "1-b, 2-a, 3-c, 4-d", "c": "1-c, 2-d, 3-a, 4-b", "d": "1-d, 2-c, 3-b, 4-a"}, "ans": "a", "exp": "1-a, 2-b, 3-d, 4-c. Vatsa: Capital was Kaushambi (near modern Prayagraj, Uttar Pradesh). Magadha: Capital was Rajagriha (later shifted to Pataliputra). Kuru : The capital was Indraprastha (near modern Delhi). Avanti : The capital was Ujjayini (in present-day Madhya Pradesh).", "t": 0, "s": 4}, {"n": 70, "tag": null, "stem": "When did the second urbanisation in Ganga Valley take place ?", "opts": {"a": "5 th Century BCE", "b": "3 rd Century BCE", "c": "6 th Century BCE", "d": "2 nd Century BCE"}, "ans": "c", "exp": "6th Century BCE. This era witnessed the development of kingdoms and Mahajanapadas like Magadha, Kosala, and Vatsa, alongside advancements in agriculture, trade, and administration. The First urbanisation in India took place during the Harappan civilization.", "t": 0, "s": 4}, {"n": 71, "tag": null, "stem": "Consider the following dynasties of Magadha during the Mahajanapada period:<br>1. Haryanka Dynasty<br>2. Shishunaga Dynasty<br>3. Nanda Dynasty<br>4. Maurya Dynasty Which of the following gives the correct chronological order ?", "opts": {"a": "1 → 2 → 3 → 4", "b": "2 → 1 → 3 → 4", "c": "1 → 3 → 2 → 4", "d": "2 → 3 → 1 → 4"}, "ans": "a", "exp": "1 → 2 → 3 → 4. The Haryanka dynasty (544–412 BCE) was the first ruling dynasty of Magadha, founded by Bimbisara. It was followed by the Shishunaga dynasty (412–344 BCE). After that came the powerful Nanda dynasty (344–322 BCE). Finally, the Maurya dynasty (322 BCE onward) rose, starting with Chandragupta Maurya, marking the foundation of the Mauryan Empire.", "t": 0, "s": 4}, {"n": 72, "tag": null, "stem": "How many Mahajanapadas were there during the age of Buddha ?", "opts": {"a": "15", "b": "26", "c": "16", "d": "9"}, "ans": "c", "exp": "16. The references of 16 Mahajanapadas are found in Anguttara Nikaya (Buddhist literature) and Bhagwati Sutra (Jain texts). The list of the 16 Mahajanapadas includes: Anga (Champa), Magadh (Rajgriha/Girivraja, later Pataliputra), Kasi (Kasi), Vatsa (Kausambi), Kosala (Sravasti), Saurasena (Mathura), Panchala (Ahichchhatra), Kuru (Indraprastha), Matsya (Viratnagar), Chedi (Sothivati/Banda), Avanti (Ujjain/Mahishmati), Gandhara (Taxila, Purushapura), Kamboj (Rajapura), Asmaka (Paithan/Pratisthan), Vajji (Vaishali), Malla (Kusinara).", "t": 0, "s": 4}, {"n": 73, "tag": null, "stem": "Match the following Mahajanapadas with their modern-day locations: List I List II (Modern (Mahajanapada) Location)<br>A. Kosala 1. Malwa and Madhya Pradesh<br>B. Magadha 2. Rawalpindi (Pakistan)<br>C. Gandhara 3. Uttar Pradesh<br>D. Avanti 4. Gaya and Patna (Bihar)", "opts": {"a": "A-3, B-4, C-2, D-1", "b": "A-4, B-3, C-2, D-1", "c": "A-3, B-1, C-4, D-2", "d": "A-2, B-3, C-1, D-4"}, "ans": "a", "exp": "A-3, B-4, C-2, D-1. Modern day names of other Mahajanapadas: Munger and Bhagalpur (Anga), Gaya and Patna (Magadha), Banaras (Kashi), Prayagraj (Vatsa), Malwa and Madhya Pradesh (Avanti), Rawalpindi (Gandhara), North Bihar (Vajji), Jaipur (Matsya), Meerut and Haryana (Kuru), Western Uttar Pradesh (Shurasena and Panchala), Bundelkhand region (Chedi), Rajouri, Hajra and North -West Frontier Province (Kamboja), Banks of Godavari (Asmaka or Assaka), Deoria and Uttar Pradesh (Malla).", "t": 0, "s": 4}, {"n": 74, "tag": null, "stem": "Rulers of Mahajanapadas in ancient India collected taxes on crops at the rate of _____ of what was produced.", "opts": {"a": "1/3rd", "b": "1/5th", "c": "1/6th", "d": "1/4th"}, "ans": "c", "exp": "1/6th. Rulers of mahajanapadas in ancient India collected a tax called <mark>&#x27;Bhaga&#x27; <\/mark>from the Farmers in their region.", "t": 0, "s": 4}, {"n": 75, "tag": "SSC Stenographer 6/08/2025 (Shift 1)", "stem": "Who was the founder of the Maurya Empire ?", "opts": {"a": "Harshavardhana", "b": "Chandragupta Maurya", "c": "Ashoka", "d": "Bindusara"}, "ans": "b", "exp": "Chandragupta Maurya. The Maurya Empire was founded by Chandragupta Maurya in 321 BCE with the guidance of his teacher and advisor Chanakya (Kautilya). He overthrew the Nanda dynasty of Magadha and established the first large-scale empire in India. Capital: Pataliputra (modern Patna, Bihar). Chandragupta defeated Seleucus Nicator (Alexander’s general) in 305 BCE and signed a treaty, giving Seleucus 500 war elephants. His reign laid the foundation of a strong centralized administration described in Arthashastra (by Chanakya). Later, he abdicated the throne, became a Jain monk, and died at Shravanabelagola (Karnataka). His successors were Bindusara (son) and Ashoka the Great (grandson).", "t": 0, "s": 5}, {"n": 76, "tag": "SSC Stenographer 6/08/2025 (Shift 3)", "stem": "In the context of Mughal administration, who were referred to as Shaikhzadas or Hindustanis?", "opts": {"a": "Central Asian nobles of Turkic origin serving the Mughals", "b": "Rajput converts elevated to noble ranks for loyalty", "c": "Persian-trained officers recruited from Safavid Iran", "d": "Indigenous Muslims who held administrative posts under Mughal rule"}, "ans": "d", "exp": "In Mughal administration, the nobility was divided into different groups based on ethnicity and origin, such as Turanis (Central Asians), Iranis (Persians), Afghans, Rajputs, and Deccanis. The term Shaikhzadas or Hindustanis referred to Indian-born Muslims, often descendants of early Muslim settlers or local converts, who rose to prominence in the Mughal bureaucracy and military. Unlike the foreign-born nobles, these Hindustanis had deeper local connections and played an important role in balancing the power structure of the Mughal nobility.", "t": 0, "s": 5}, {"n": 77, "tag": "SSC Stenographer 7/08/2025 (Shift 1)", "stem": "Which Mauryan ruler is credited with the establishment of the spy system in his empire ?", "opts": {"a": "Bindusara", "b": "Brihadratha", "c": "Ashoka", "d": "Chandragupta Maurya"}, "ans": "d", "exp": "Chandragupta Maurya.  Chandragupta Maurya (321–297 BCE) founded the Mauryan Empire with the guidance of Chanakya, defeating the last Nanda ruler at Pataliputra. After the Seleucid-Mauryan war, he gained territories west of the Indus in exchange for 500 war elephants and also married Seleucus’s daughter. His empire expanded across most of India except Kalinga and the far south. Later, Chandragupta converted to Jainism and died by fasting at Shravanabelagola, having migrated there with Acharya Bhadrabahu. Greek ambassador Megasthenes visited his court and wrote Indica, describing Pataliputra and the division of Indian society into seven classes.", "t": 0, "s": 5}, {"n": 78, "tag": null, "stem": "With reference to the city administration of Mauryan Empire, consider the following statements.<br>A) Megasthenes put light on the Mauryan city administration.<br>B) The city council was divided into six committees.<br>C) City administration was well planned. Which of the above statements is/are correct ?", "opts": {"a": "B, C", "b": "A, B", "c": "A, B,", "d": "C, A"}, "ans": "c", "exp": "A, B, C. The Mauryan Empire, founded by Chandragupta Maurya in 321 BCE, was the first major empire in India. It stretched from the Oxus Valley to the Kaveri Delta, covering most of the subcontinent, with its capital at Pataliputra, a city fortified with 64 gates and 570 towers. Megasthenes, a Greek historian, documented India in his work Indica.", "t": 0, "s": 5}, {"n": 79, "tag": null, "stem": "Consider the following statements regarding the Edicts of Ashoka:<br>1. Rock Edict XIII describes the Kalinga war and Ashoka’s remorse after it.<br>2. Pillar Edict II defines Dhamma as compassion, truthfulness, and purity of life.<br>3. The Rummindei inscription marks Ashoka’s visit to the birthplace of Buddha at Lumbini.<br>4. The Kandahar Greek Edicts were written in Prakrit and Chinese. Which of the statements given above is/are correct ?", "opts": {"a": "1, 2 and 3 only", "b": "2 and 4 only", "c": "1 and 3 only", "d": "1, 2, 3 and 4"}, "ans": "a", "exp": "1, 2 and 3 only. Rock Edict XIII: Mentions the Kalinga war and Ashoka’s change of heart. Pillar Edict II: Defines Dhamma. Rummindei Inscription: Marks Ashoka’s pilgrimage to Lumbini. Kandahar Greek Edicts were written in Greek and Prakrit, not Chinese.", "t": 0, "s": 5}, {"n": 80, "tag": null, "stem": "The name ‘Piyadassi’ is associated with whom among the following Mauryan kings ?", "opts": {"a": "Bindusara", "b": "Brihadratha", "c": "Ashoka", "d": "Chandragupta Maurya"}, "ans": "c", "exp": "Ashoka. &quot;Piyadasi&quot; is an honorific epithet that means &quot;He who regards others with kindness&quot;, &quot;Humane&quot;, or &quot;He who glances amiably&quot;.", "t": 0, "s": 5}, {"n": 81, "tag": null, "stem": "Deimachus, who was a Greek ambassador, came to India during the reign of the Mauryan king, ______.", "opts": {"a": "Shatadhanvan", "b": "Bindusara", "c": "Ashoka", "d": "Chandragupta Maurya"}, "ans": "b", "exp": "Bindusara also known as &quot;Amitrochates&quot; or &quot;Amitragata&quot; by the Greeks, was the son of Chandragupta Maurya. Bindusara patronized the Ajivikas and was taught by the Ajivika Brahmin Pingalavatsa.", "t": 0, "s": 5}, {"n": 82, "tag": null, "stem": "Major Rock Edicts of Ashoka – Identify the incorrect statement:<br>A. Rock Edict XIII highlights the Kalinga War and Ashoka’s remorse.<br>B. Rock Edict XII talks about Ashoka’s duties as a ruler and his commitment to Dharma.<br>C. Rock Edict X focuses on the ruler’s responsibilities and promotion of Dharma. Which of the above statements is/are incorrect ?", "opts": {"a": "A only", "b": "B only", "c": "C only", "d": "A and B only"}, "ans": "b", "exp": "B only. Statement B is incorrect: Rock Edict XII does not talk about ruler duties; it emphasizes tolerance and respect for all religions. Statement A is correct: Rock Edict XIII mentions the Kalinga War and Ashoka’s remorse. Statement C is correct: Rock Edict X describes the duties of the ruler and commitment to Dharma.", "t": 0, "s": 5}, {"n": 83, "tag": null, "stem": "Who among the following generally used to head the provincial administration under the Mauryas ?", "opts": {"a": "Dandapala", "b": "Kumara", "c": "Samaharta", "d": "Prashasti"}, "ans": "b", "exp": "Kumara. The 18 Tirthas were key officials in ancient administration, including roles like Mantrin (Chief Minister), Purohita (Priest), Senapati (Army Commander), Yuvaraja (Prince), Dauvarika (Chief of Palace Attendants), Antarvamsika (Chief of the King’s Guards), Prasasta (Magistrate), Samahata (Collector General), Samnidhata (Chief Treasurer), and Pradesta (Commissioner). Other roles included Nayak (Town Guard), Paur (Town Chief), Karmanta (Mines Superintendent), Dandpala (Army Officer), and Durgapala (Fort Guardian).", "t": 0, "s": 5}, {"n": 84, "tag": null, "stem": "Which of the following was NOT one of the basic attributes of Ashokas&#x27; Dhamma ?", "opts": {"a": "Political unification", "b": "Ahimsa", "c": "Celibacy", "d": "Secularism"}, "ans": "c", "exp": "Celibacy. Ashoka&#x27;s Dhamma, as outlined in his Edicts, emphasized the following basic attributes: Ahimsa (Non-violence), Secularism (Separation of religion and state), Political unification (Unity and harmony among subjects).", "t": 0, "s": 5}, {"n": 85, "tag": null, "stem": "Who among the following envoys was sent by Seleucus I to the court of Chandragupta Maurya ?", "opts": {"a": "Fa-Hien", "b": "Al-Biruni", "c": "Megasthenes", "d": "Deimachus"}, "ans": "c", "exp": "Megasthenes. He was an ancient Greek historian, diplomat, and ethnographer who authored the famous work “Indica”, providing valuable insights into the Mauryan Empire, including its administration, society, geography, and culture.", "t": 0, "s": 5}, {"n": 86, "tag": null, "stem": "Which of the following Ashokan rock edicts declares prohibition of animal sacrifice ?", "opts": {"a": "Major Rock Edict - IV", "b": "Major Rock Edict - I", "c": "Major Rock Edict - II", "d": "Major Rock Edict - III"}, "ans": "b", "exp": "Major Rock Edict - I. There are 14 Major Rock Edicts of Ashoka in three languages (Prakrit, Aramaic and Greek) and two scripts (Brahmi and Kharosthi). Major Rock Edicts: II - It mentions social welfare under Dhamma. Major Rock Edict III - It declares that respect for parents and for all living things, including Brahmanas and Sramanas, is a virtue. Major Rock Edict IV - Consideration and non-violence to animals and courtesy to relations. Major Rock Edict XIII - It mentions Ashoka’s victory over Kalinga.", "t": 0, "s": 5}, {"n": 87, "tag": null, "stem": "Assertion (A): Ashoka sent his son Mahendra and daughter Sanghmitra to spread Buddhism in Sri Lanka.<br><b>Reason (R): <\/b>Ashoka was the third Mauryan king and a devoted follower of Dhamma who promoted Buddhism abroad. <b>Codes: <\/b>", "opts": {"a": "Both A and R are true, and R is the correct explanation of A.", "b": "Both A and R are true, but R is not the correct explanation of A.", "c": "A is true, but R is false.", "d": "A is false, but R is true."}, "ans": "a", "exp": "Both A and R are true, and R is  <mark>the correct explanation of A. <\/mark>Ashoka, as a devoted follower of Dhamma, actively propagated Buddhism. He sent Mahendra and Sanghmitra to Sri Lanka to spread the teachings, making the assertion correct. The reason correctly explains why Ashoka undertook this mission.", "t": 0, "s": 5}, {"n": 88, "tag": null, "stem": "Bhabru-Bairat rock edicts mainly depicting Ashokas&#x27; conversion to Buddhism are found in ______.", "opts": {"a": "Rajasthan", "b": "Uttar Pradesh", "c": "Bihar", "d": "Odisha"}, "ans": "a", "exp": "Rajasthan. Bhabru is the only inscription in the Boustrophedon script (bi-directional script from right to left and left to right in an alternate line).", "t": 0, "s": 5}, {"n": 89, "tag": null, "stem": "Who requested the Syrian king to send a Greek philosopher ?", "opts": {"a": "Chandragupta Maurya", "b": "Bindusara", "c": "Ashok", "d": "Kunal"}, "ans": "b", "exp": "Bindusara was the second Mauryan Empire, father of Ashoka, and son of Chandragupta (founder of Mauryan empire). Syrian King Antiochus-I sent his ambassador Deimachus to the court of Bindusara.", "t": 0, "s": 5}, {"n": 90, "tag": null, "stem": "Barabar Cave, famously known for depicting Ashokas&#x27; inscription, is situated at_______.", "opts": {"a": "Sanchi, Madhya Pradesh", "b": "Rampurva, Bihar", "c": "Gaya, Bihar", "d": "Sarnath, Uttar Pradesh"}, "ans": "c", "exp": "Gaya, Bihar. The Barabar Caves, located in the Makhdumpur region of Jehanabad district, Bihar, date back to the Mauryan period (3rd century BCE) and were built by Emperor Ashoka for Ajivaka ascetics. The caves include Karan Chaupar, Lomas Rishi, Sudama, and Visvakarma Caves.", "t": 0, "s": 5}, {"n": 91, "tag": null, "stem": "Who among the following rulers was defeated in the battle for Pataliputra by Chandragupta Maurya ?", "opts": {"a": "Megasthenes", "b": "Dhana Nanda", "c": "Seleucus Nicator", "d": "Elara"}, "ans": "b", "exp": "Dhana Nanda. He was the last ruler of the Nanda dynasty, and his defeat marked the establishment of the Mauryan Empire in India.", "t": 0, "s": 5}, {"n": 92, "tag": null, "stem": "Who among the following Mauryan rulers was the first, who tried to convey his messages to his subjects concerning the idea and practice of dhamma through inscriptions ?", "opts": {"a": "Brihadaratha", "b": "Ashoka", "c": "Dasaratha", "d": "Chandragupta Maurya"}, "ans": "b", "exp": "Ashoka was the third emperor of the Mauryan Dynasty. To propagate the policy of dhamma, he used the medium of edicts. These edicts were used to communicate between the King (Ashoka) and his subjects. Few inscriptions were addressed to the Buddhist Samgha.", "t": 0, "s": 5}, {"n": 93, "tag": null, "stem": "Which of the following was a Ceylonese chronicle that acted as an important literary source of the Mauryan empire ?", "opts": {"a": "Indica", "b": "Mudrarakshas", "c": "Mahavamsa", "d": "Arthasastra"}, "ans": "c", "exp": "Mahavamsa - It was written by Mahanama in Pali language. Literary Sources of Mauryan Period: &quot;Arthashastra” (Kautilya), “Indica” (Megasthenes).", "t": 0, "s": 5}, {"n": 94, "tag": null, "stem": "Consider the following statements regarding Chandragupta Maurya: (A) Chandragupta Maurya was the founder of the Mauryan Empire. (B) He fasted to death at Shravanabelagola following Jainism. (C) His Greek name was Megasthenes, and he captured Pataliputra in 322 BCE by defeating Dhanananda of the Nanda dynasty. Which of the above statements is/are incorrect ?", "opts": {"a": "A only", "b": "B only", "c": "C only", "d": "None of the above"}, "ans": "c", "exp": "C only.  Chandragupta Maurya’s Greek name was Sandrocottos, not Megasthenes. Megasthenes was the Greek historian who visited Chandragupta’s court.", "t": 0, "s": 5}, {"n": 95, "tag": null, "stem": "What was the function of an officer called Samaharta ?", "opts": {"a": "Reserve the state treasury", "b": "Tax assessment", "c": "Security assurance", "d": "To correspond"}, "ans": "b", "exp": "Tax assessment. Officers during the Mauryan administration: Shulkadhyaksha (Officer-in-charge of royal income), Koshadhyaksha (Treasury officer), Lakshanadhyaksha (Coin minting), Rajjukas (Land measurer), Yukta (Subordinate revenue officer), Sannidata (Treasury head), Panyadhyaksha (Office of commerce department).", "t": 0, "s": 5}, {"n": 96, "tag": null, "stem": "Emperor Ashoka conquered Kalinga after how many years of his coronation ?", "opts": {"a": "5 years", "b": "8 years", "c": "11 years", "d": "15 years"}, "ans": "b", "exp": "8 years. Ashoka fought the Kalinga War in 261 BC. King Ashoka (268 - 232 BC) was the third king of the Mauryan Empire.", "t": 0, "s": 5}, {"n": 97, "tag": null, "stem": "Consider the following statements regarding Mauryan provincial administration:<br>A. The Mauryan Empire was divided into Janapadas (provinces), each headed by a Mahamatra.<br>B. Each province had a Kumar or Kumara appointed as provincial governor.<br>C. The Rajjukas were officials in charge of agriculture and land revenue collection. Which of the above statements is/are correct ?", "opts": {"a": "A and B only", "b": "B and C only", "c": "A and C only", "d": "A, B and C"}, "ans": "c", "exp": "A and C only. No position called Kumar/Kumara existed as governor; provinces were administered by Mahamatras.", "t": 0, "s": 5}, {"n": 98, "tag": null, "stem": "How many classes of Indian society are mentioned in Megasthenes book Indica ?", "opts": {"a": "12", "b": "10", "c": "5", "d": "7"}, "ans": "d", "exp": "7. They were Brahmins (upper class), Philosophers, Farmers, Herders, Artisans, Military, Overseers, Councillors and Assessors.", "t": 0, "s": 5}, {"n": 99, "tag": null, "stem": "According to Kautilya&#x27;s Arthashastra, the Commanding Officer of the cavalry in the Mauryan administration was known as:", "opts": {"a": "Rathadhyaksha", "b": "Hastyadhyaksha", "c": "Ashwadhyaksha", "d": "Patyadhyaksha"}, "ans": "c", "exp": "Ashwadhyaksha. Officers in  <mark>Mauryan Empire: <\/mark>Mantrin (Chief Minister), Senapati (Commander-in -Chief), Yuvraj (Crown prince), Shulkadhyaksha (Officer in-charge of royal income), Prashasti (Prison head), Koshadhyaksha (Treasury officer), Vyabharika (Chief Judge), Dandapala (Head of Police), Annapala (Head of food grains department), Pradeshika (District administrator), Hastyadhyaksha (Chief Commander of Elephant Corps), Rathadhyaksha (Chief Commander of Chariot Corps) and Nayaka (City security officer).", "t": 0, "s": 5}, {"n": 100, "tag": null, "stem": "The Mauryan pillar capital found at _____is popularly known as the Lion Capital.", "opts": {"a": "Bhabru", "b": "Bairat", "c": "Sanchi", "d": "Sarnath"}, "ans": "d", "exp": "Sarnath Lion Capital - Erected by Ashoka (Around 250 BCE) in commemoration of Dhammachakra pravartana or the first sermon of Buddha. The Lion Capital of Ashoka at Sarnath is the Indian National Emblem.", "t": 0, "s": 5}, {"n": 101, "tag": null, "stem": "Assertion (A): Arthashastra is the manual of Mauryan administration and military organisation.<br><b>Reason (R): <\/b>It was authored by Varahamihira in Sanskrit.", "opts": {"a": "Both A and R are true, and R is correct explanation of A", "b": "Both A and R are true, but R is not correct explanation of A", "c": "A is true, R is false", "d": "A is false, R is true"}, "ans": "c", "exp": "A is true, R is false.  Arthashastra was authored by Kautilya (Chanakya/Vishnugupta), not Varahamihira. Varahamihira authored Brihat Samhita, which deals with astrology, architecture, and planetary calculations.", "t": 0, "s": 5}, {"n": 102, "tag": null, "stem": "Nagarjuni Caves were donated to which of the following sects by Mauryans ?", "opts": {"a": "Ajivika", "b": "Buddhism", "c": "Lokayat", "d": "Jainism"}, "ans": "a", "exp": "Ajivika - It was founded by <mark>Goshala Maskariputra. <\/mark>It is based on the philosophy that the affairs of the entire universe were ordered by a cosmic force called Niyati that determined all events, including an individual’s fate. The seven caves were created by Mauryan time for the Ajivika Sect.", "t": 0, "s": 5}, {"n": 103, "tag": null, "stem": "As per the contents mentioned in Asokan inscriptions, how many major political centres were there in the Mauryan empire ?", "opts": {"a": "five", "b": "six", "c": "four", "d": "three"}, "ans": "a", "exp": "Five. The five major political centres of the Mauryan empire were located at Pataliputra, Taxila, Ujjain, Tosali and Suvarnagiri.", "t": 0, "s": 5}, {"n": 104, "tag": null, "stem": "Assertion (A): The Mauryan Empire maintained a state monopoly over mining and trade.<br><b>Reason (R): <\/b>Kautilya’s Arthashastra prescribes state control over mines, forests, salt, and trade to increase revenue.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, R is false", "d": "A is false, R is true"}, "ans": "a", "exp": "Both A and R are true, and R  <mark>is the correct explanation of A. <\/mark>The Mauryan state directly controlled resources and trade, as prescribed in Arthashastra, to ensure revenue and economic stability.", "t": 0, "s": 5}, {"n": 105, "tag": null, "stem": "Which Mauryan ruler was called Amitrochates by the Greeks ?", "opts": {"a": "Samudragupta", "b": "Kanishka", "c": "Bindusara", "d": "Chandragupta Ⅰ"}, "ans": "c", "exp": "Bindusara. He was the son of Chandragupta Maurya and was the second Mauryan emperor of India whose reign from 297 - 273 BCE.", "t": 0, "s": 5}, {"n": 106, "tag": null, "stem": "There were several cities in the Mauryan empire. Which of the following cities was located on the southernmost side ?", "opts": {"a": "Girnar", "b": "Topra", "c": "Brahmagiri", "d": "Rupnath"}, "ans": "c", "exp": "Brahmagiri. The Maurya Empire: Founder - Chandragupta Maurya, Capital <mark>- <\/mark>Pataliputra (modern Patna). Three important rulers of the Mauryan Empire - Chandragupta, his son Bindusara, and Bindusara’s son, Ashoka.", "t": 0, "s": 5}, {"n": 107, "tag": null, "stem": "Which of the following places does not contain the major inscription of Ashoka ?", "opts": {"a": "Girnar", "b": "Kandahar", "c": "Sanchi", "d": "Kalsi"}, "ans": "c", "exp": "Sanchi. It is a famous Buddhist site with several stupas and monasteries. Language used in Ashoka’s inscriptions - <mark>Prakrit <\/mark>. Ashoka&#x27;s name is only used in four of these locations: Maski, Brahmagiri (Karnataka), Gujjara (Madhya Pradesh) and Nettur (Andhra Pradesh).", "t": 0, "s": 5}, {"n": 108, "tag": null, "stem": "Identify the correct statements regarding the Pillars of Ashoka:<br>A. The Pillars of Ashoka were primarily built to spread the policies of Dharma.<br>B. All Pillars of Ashoka were erected during the reign of Chandragupta Maurya.<br>C. The Seventh Pillar Edict mentions Dhamma Mahamattas and is the longest among all pillar edicts.", "opts": {"a": "A and B only", "b": "A and C only", "c": "B and C only", "d": "A, B and C"}, "ans": "b", "exp": "A and C only . Pillars were erected by Ashoka, not Chandragupta Maurya.", "t": 0, "s": 5}, {"n": 109, "tag": null, "stem": "Which caves are considered as the oldest surviving rock-cut caves in India dating back to the Maurya period ?", "opts": {"a": "Barabar and Nagarjuni caves", "b": "Bagh Caves", "c": "Elephanta Caves", "d": "Ajanta and Ellora Caves"}, "ans": "a", "exp": "Barabar and Nagarjuni caves  - Located in Jehanabad district of Bihar, Constructed by Emperor Ashoka for the benefit of Ajivika ascetics. They were cut from a single solid granite block.", "t": 0, "s": 5}, {"n": 110, "tag": null, "stem": "Somewhat before the time of the Mauryan empire, about ____years ago, emperors in China began building the Great Wall.", "opts": {"a": "1200", "b": "3500", "c": "2400", "d": "600"}, "ans": "c", "exp": "2400. Emperor Qin Shi Huang ordered construction of the Great Wall around 221 B.C. It was meant to protect the northern frontier of the empire from pastoral people.", "t": 0, "s": 5}, {"n": 111, "tag": null, "stem": "Pushyamitra, who was the commander of Brihadratha, the last Mauryan emperor, killed the king and established a new dynasty. Which of the following was his dynasty ?", "opts": {"a": "Shunga", "b": "Kanva", "c": "Satavahana", "d": "Chedi"}, "ans": "a", "exp": "Shunga Dynasty Founder - Pushyamitra Sunga. Ruled - From 185 BCE to 73 BCE. Last Ruler - Devabhuti. Kanva Dynasty Founder - Vasudeva Kanva. Ruled - From 73 BCE to 28 BCE. Last Ruler - Susarma. Satavahana Dynasty Founder - Simuka . Famous Ruler - Gautamiputra Satakarni.", "t": 0, "s": 5}, {"n": 112, "tag": null, "stem": "Ashoka appointed____to solve the social problems in his region.", "opts": {"a": "samaharta", "b": "nyayadhish", "c": "amatya", "d": "dhamma mahamatta"}, "ans": "d", "exp": "Dhamma Mahamatta.  Tirthas: The highest category of officials in the administration. There were 18 Tirthas. Amatyas: High ranking officials almost like present-day secretaries. The important officials in the revenue department are Sannidhata: Chief treasury, Samaharta: collector general of revenue. Yuktas: Subordinate officers responsible for the Empire’s revenue. Rajjukas: Officers in charge of land measurement and boundary-fixing.", "t": 0, "s": 5}, {"n": 113, "tag": null, "stem": "Which of the following statements is correct ?<br>I. Most of Ashoka’s inscriptions were written in Brahmi script.<br>II. Many of Chanakya’s ideas were written down in a book called the Arthashastra.", "opts": {"a": "Only II", "b": "Only I", "c": "Neither I nor II", "d": "Both I and II"}, "ans": "d", "exp": "Both I and II . Brahmi Script was deciphered by James Prinsep.", "t": 0, "s": 5}, {"n": 114, "tag": null, "stem": "Ashokan Minor Rock Edicts are found in different parts of India. Which of the following is NOT a find spot of Ashokan Minor Rock Edicts in Karnataka?", "opts": {"a": "Brahmagiri", "b": "Gavimath", "c": "Rupnath", "d": "Maski"}, "ans": "c", "exp": "Rupnath. Minor rock edicts  <mark>of Ashoka - <\/mark>Kandahar (Afghanistan), Lampaka (Afghanistan), Bahapur (Delhi), Bairat (Rajasthan), Bhabru (Rajasthan), Gujarra (Madhya Pradesh), Rupnath (Madhya Pradesh), Panguraria (Madhya Pradesh), Sasaram (Bihar), Barabar Caves (Bihar), Rajula-Mandagiri, Andhra Pradesh, Suvarna Giri (Andhra Pradesh), Brahmagiri (Karnataka), Jatina- Rameshwara, Karnataka, Siddapur (Karnataka), Maski (Karnataka), Nittur (Karnataka), Udegolam (Karnataka), Palkigundu and Gavimath (Karnataka).", "t": 0, "s": 5}, {"n": 115, "tag": null, "stem": "Consider the following statements regarding &#x27;Kantakasodhana&#x27; court:<br>1. Kantakasodhana literally means “removal of thorns.”<br>2. It was a type of civil court prevalent in the Mauryan Empire.<br>3. Kautilya’s Arthashastra mentions cases that are subject to Kantakasodhana. Which of the above statements is/are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "c", "exp": "1 and 3 only.  Kantakasodhana was not a civil court, but a criminal court in the Mauryan Empire dealing with serious offenses.", "t": 0, "s": 5}, {"n": 116, "tag": null, "stem": "Who among the following published a set of Ashokan inscriptions in 1877 ?", "opts": {"a": "DC Sircar", "b": "MS Vats", "c": "Alexander Cunningham", "d": "Colin Mackenzie"}, "ans": "c", "exp": "Alexander Cunningham . He was the founder of the Archaeological Survey of India.", "t": 0, "s": 5}, {"n": 117, "tag": null, "stem": "Consider the following statements :<br>A. Rudrasena II belonged to the Gupta dynasty.<br>B. He married Prabhavatigupta, daughter of Samudragupta.<br>C. Chandragupta II was the founder of the Vakataka dynasty. Which of the above statements is/are correct ?", "opts": {"a": "A only", "b": "B only", "c": "C only", "d": "None of the above"}, "ans": "d", "exp": "None of the above.  Rudrasena II belonged to the Vakataka dynasty, not the Gupta dynasty. He married Prabhavatigupta, daughter of Chandragupta II, not Samudragupta. Chandragupta II was a Gupta ruler, not founder of the Vakataka dynasty (which was founded by Vindhyashakti).", "t": 0, "s": 6}, {"n": 118, "tag": null, "stem": "The _____were tributary chiefs of the Gupta dynasty. They established an independent kingdom in western India. Dh
