Aim - Promote widow remarriage and campaigned against Child Marriage. Karsondas Mulji - He started the &#x27;Satya Prakash&#x27; in Gujarati in 1852 to promote the remarriage of widows. Organization founded by Mahadev Govind Ranade - Poona Sarvajanik Sabha (1870), Vaktrutvottejak Sabha (1875).", "t": 2, "s": 8}, {"n": 784, "tag": null, "stem": "In which language was the work of Raja Ram Mohan Roy, &#x27;Gift to Monotheists&#x27; originally written ?", "opts": {"a": "Arabic", "b": "Persian", "c": "Bengali", "d": "Sanskrit"}, "ans": "b", "exp": "Persian. Raja Ram Mohan  <mark>Roy: <\/mark>Father of Modern India’s Renaissance. Given the title ‘Raja’ by Akbar II (Mughal Emperor).", "t": 2, "s": 8}, {"n": 785, "tag": null, "stem": "Consider the following statements about Narayana Guru:<br>1. He was a social reformer from the Ezhava community who strongly opposed the caste system.<br>2. He was born in the state of Kerala and propagated the idea of “One caste, one religion, one God for all.” Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Shri Narayan Guru led a reform movement against the injustice in the caste-ridden society of Kerala in order to promote spiritual enlightenment and social equality. His famous quote: &quot;One caste, one religion and one god for all&quot;.", "t": 2, "s": 8}, {"n": 786, "tag": null, "stem": "Who among the following founded the Indian Association along with Anand Mohan Bose?", "opts": {"a": "Dada Bhai Naoroji", "b": "Gopal krishna Gokhale", "c": "Pheroze Shah Mehta", "d": "Surendranath Banerjee"}, "ans": "d", "exp": "Surendranath Banerjee.  Indian Association of Calcutta (1876), Aimed to unify Indian people on a common political programme and create a strong public opinion on political questions.", "t": 2, "s": 8}, {"n": 787, "tag": null, "stem": "Who among the following organized Sarvajanik Ganesh Utsav to inculcate national sentiments among the masses?", "opts": {"a": "Lokmanya Tilak", "b": "Bipin Chandra Pal", "c": "Aurobindo Ghosh", "d": "Lala Lajpat Rai"}, "ans": "a", "exp": "Lokmanya Tilak (Bal Gangadhar Tilak) <mark>: <\/mark>Tilak launched the Indian Home Rule League in April 1916 at Belgaum (Annie Besant launched the Home Rule League in September 1916 at Madras). His famous declaration “Swaraj is my birthright, and I shall have it”. The British Government termed him as the &quot;Father of Indian Unrest&quot;.", "t": 2, "s": 8}, {"n": 788, "tag": null, "stem": "&#x27;The Deccan Sabha&#x27; was founded by which of the following nationalists?", "opts": {"a": "Gopal Krishna Gokhale", "b": "Pherozeshah Mehta", "c": "Surendranath Banerjee", "d": "Dadabhai Naoroji"}, "ans": "a", "exp": "Gopal Krishna Gokhale . He became president of Indian National Congress (INC) in Benaras session (1905).", "t": 2, "s": 8}, {"n": 789, "tag": null, "stem": "The Mohammedan Literary Society founded in Calcutta in 1863 was founded by:", "opts": {"a": "Nawab Abdul Latif", "b": "Mirza Ghulam Ahmad", "c": "Sayyid Ahmad", "d": "Syed Ahmad Khan"}, "ans": "a", "exp": "Nawab Abdul Latif (Father of muslim renaissance in Bengal). Lord Lytton gave him The title of &quot;Nawab&#x27;&#x27;. Lord Dufferin gave him the title of Nawab Bahadur. Mohammedan Literary Society was a literary society of Muslims in British India.", "t": 2, "s": 8}, {"n": 790, "tag": null, "stem": "Match the following social reformers/newspapers with the community or society they primarily addressed: List I List II<br>1. Dadabhai A. First Indian Naoroji – Rast newspaper in Goftar Hindi<br>2. Raja Ram B. First English Mohan Roy – newspaper in Samvad Kaumudi India<br>3. James C. Reform Augustus Hicky – among Parsis Bengal Gazette<br>4. Pt. Jugal D. Hindu Kishore Shukla – socio-religious Udant Martand reform Choose the correct match:", "opts": {"a": "1–C, 2–D, 3–B, 4–A", "b": "1–D, 2–C, 3–A, 4–B", "c": "1–B, 2–A, 3–C, 4–D", "d": "1–A, 2–B, 3–D, 4–C"}, "ans": "a", "exp": "1–C, 2–D, 3–B, 4–A. Rast Goftar (&quot;The Truth Teller&quot;) was an Anglo-Gujarati paper operating in Bombay that was started in 1854 by Dadabhai Naoroji and Kharshedji Cama and championed social reform among Parsis in Western India. Publishers and their Newspaper : James Augustus Hicky - “Bengal Gazette”, Pt. Jugal Kishore Shukla - “Udant Martand”, Raja Ram Mohan Roy - “Samvad Kaumudi” and “Mirat-ul-Akbar”, Madhusudan Ray - “Hindoo Patriot”, Devendra Nath Tagore - “Indian Mirror”.", "t": 2, "s": 8}, {"n": 791, "tag": null, "stem": "Who among the following devoted his life for the upliftment of widows and established the Widow Remarriage Association in 1893?", "opts": {"a": "DK Karve", "b": "Annie Besant", "c": "KC Sen", "d": "BM Malabari"}, "ans": "a", "exp": "D K Karve. Karve’s autobiographical works: Atmawrutta (1928) in Marathi, and Looking Back (1936) in English. Awards - Bharat Ratna (1958), Padma Vibhushan (1955).", "t": 2, "s": 8}, {"n": 792, "tag": null, "stem": "Consider the following statements regarding Indian social reformers:<br>1. Raja Ram Mohan Roy was the first social reformer to recognize modern education as a means for spreading progressive ideas in India.<br>2. He founded institutions like the Vedanta College (1825) and organizations such as Atmiya Sabha (1815) and Brahmo Samaj (1828). Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Raja Ram Mohan Roy (Father of modern India), Organizations founded : Brahmo Samaj (1828, Kolkata), Atmiya Sabha (1815, Kolkata). He founded the Vedanta College in 1825.", "t": 2, "s": 8}, {"n": 793, "tag": null, "stem": "Who among the following was the founder of the Aligarh Movement, which was largely responsible for the revival of Muslims in India?", "opts": {"a": "Mirza Ghulam Ahmad", "b": "Muhammad Iqbal", "c": "Abdul Gaffar Khan", "d": "Sayyid Ahmad Khan"}, "ans": "d", "exp": "Sayyid Ahmad Khan. Mirza Ghulam Ahmad - Founder of the Ahmadiyya movement. Muhammad Allama Iqbal wrote the famous song &#x27;Saare jahan se achha&#x27;. He is also known for giving birth to the &#x27;idea of Pakistan&#x27;.", "t": 2, "s": 8}, {"n": 794, "tag": null, "stem": "Ramakrishna Gopal Bhandarkar and Mahadev Govind Ranade carried out their work of religious reforms in Maharashtra through which of the following organisations?", "opts": {"a": "Prarthana Samaj", "b": "Atmiya Sabha", "c": "Theosophical Society", "d": "Brahmo Samaj"}, "ans": "a", "exp": "Prarthana Samaj (1867) <mark>. <\/mark>", "t": 2, "s": 8}, {"n": 795, "tag": null, "stem": "Who among the following was one of the founders of Rahnumai Mazdayasnan Sabha or Religious Reform Association?", "opts": {"a": "Keshab Chandra Sen", "b": "Dadabhai Naoroji", "c": "Muhammad Iqbal", "d": "Aatmarang Pandurang"}, "ans": "b", "exp": "Dadabhai Naoroji . He presided over the second session of Indian National Congress at Kolkata (1886). Keshab Chandra Sen - He established Indian Reform association (1870), Member of Brahmo Samaj (1828). Atmaram Pandurang: Founded - Prarthana Samaj (1867) with the help of Keshab Chandra Sen.", "t": 2, "s": 8}, {"n": 796, "tag": null, "stem": "Who founded the Tattvabodhini Sabha that was set up to explore spiritual truth?", "opts": {"a": "Keshab Chandra Sen", "b": "Raja Ram Mohan Roy", "c": "Debendranath Tagore", "d": "Dayanand Saraswati"}, "ans": "c", "exp": "Debendranath Tagore (Father of Rabindranath Tagore) founded the Tattvabodhini Sabha in 1839. He joined the Brahmo Samaj in 1842.", "t": 2, "s": 8}, {"n": 797, "tag": null, "stem": "Who among the following is NOT associated with Brahmo Samaj?", "opts": {"a": "Atmaram Panduranga", "b": "Keshav Chandra Sen", "c": "Debendranath Tagore", "d": "Raja Ram Mohan Roy"}, "ans": "a", "exp": "Atmaram Pandurang  founded Prartahana Samaj (1867), <mark>Other <\/mark> <mark>members <\/mark>- R.C. Bhandarkar and Justice Mahadev Govind Ranade. Objective - Women Education, Widow remarriage and Disapproval of caste system.", "t": 2, "s": 8}, {"n": 798, "tag": null, "stem": "The Veda Samaj of Madras was inspired by the________.", "opts": {"a": "Brahmo Samaj", "b": "Arya Samaj", "c": "Deoband Movement", "d": "Wahabi Movement"}, "ans": "a", "exp": "Brahmo Samaj (1828) <mark>. <\/mark>It denounced polytheism and opposed idolatry. <mark>Deobandi Movement <\/mark>(1866) : Founder - Mohammad Qasim Nanotavi and Rashid Ahmed Gangohi.", "t": 2, "s": 8}, {"n": 799, "tag": null, "stem": "The Principal of a Sanskrit College who represented a blend of Indian and Western culture was ________ .", "opts": {"a": "Raja Ram Mohan Roy", "b": "Keshab Chandra Sen", "c": "Ishwar Chandra Vidyasagar", "d": "Devendranath Tagore"}, "ans": "c", "exp": "Ishwar Chandra Vidyasagar  (&quot;Father of Bengali Prose&quot;). Hindu Widow Remarriage Act of 1856 was enacted with the efforts of Ishwar Chandra Vidyasagar.", "t": 2, "s": 8}, {"n": 800, "tag": null, "stem": "Consider the following statements about women-led movements in India:<br>1. Rani Gaidinliu was associated with the Heraka movement, which arose in the 1920s among the Zeliangrong people.<br>2. The Nisha Bandh movement was led by Rani Gaidinliu to fight against alcoholism in the late 1970s. Which of the above statements is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Heraka was a socio-religious movement that arose in the 1920s in the Zeliangrong territory. Meira Paibi : This movement was founded in 1977 in Kaching district. Nupi Lan : There were two demonstrations led by women against the colonial authorities in Manipur, British India. In 1904, The second Nupi Lan began in 1939 in response to rice exports during World War II. Nisha Bandh : The women&#x27;s movement developed in the late 1970s. Its origin is attributed to the Meitei women&#x27;s activism to fight against alcoholism and drug addiction.", "t": 2, "s": 8}, {"n": 801, "tag": null, "stem": "Some of Swami Dayanand&#x27;s followers started a network of schools and colleges called D.A.V. What does &#x27;A&#x27; stand for in D.A.V.?", "opts": {"a": "Author", "b": "Angel", "c": "Anglo", "d": "Accept"}, "ans": "c", "exp": "Anglo. The acronym DAV translates as &#x27;Dayanand Anglo Vedic&#x27;, the melange of the Vedas and Modernity. Mahatma Hansraj established the first DAV School at Lahore on June 1, 1886. <mark>Other Educational Establishments in <\/mark> <mark>India: <\/mark>1835 - Calcutta Medical College and the Elphinstone College of Bombay. 1857 - University of Bombay, Calcutta, and Madras. 1882 - The University of Punjab. 1887 - The University of Allahabad.", "t": 2, "s": 8}, {"n": 802, "tag": null, "stem": "The ________ was started by the Sikh reformers to purify their religious places by removing the evil social practices that had slowly crept into them.", "opts": {"a": "Namdhari Movement", "b": "Akali Movement", "c": "Ghadar Movement", "d": "Nirankari Movement"}, "ans": "b", "exp": "Akali Movement (Gurdwara Reform Movement).Namdhari Movement (Kuka Movement) - A Sikh reform movement that began in the Punjab region of India (Founded by Baba Ram Singh in 1857). Ghadar Movement: President - Sohan Singh Bhakna, Founded - 15 July 1913, Dissolved - January 1948, Preceded by - Pacific Coast Hindustan Association. Nirankari Movement - It was a social reform movement for Sikhism (founded by Baba Dyal Das in 1851).", "t": 2, "s": 8}, {"n": 803, "tag": null, "stem": "The Ahmadiyya forms a sect of Islam which originated from India. It was founded by___________in 1889.", "opts": {"a": "Mir Nisar Ali", "b": "Haji Shariatullah", "c": "Shah Walliullah", "d": "Mirza Ghulam Ahmad"}, "ans": "d", "exp": "Mirza Ghulam Ahmad. The Ahmadiyya Movement was founded on liberal principles and principles of a universal religion for all humanity. After his death the movement was led by elected successor Hakeem Noor-ud-din. Mir Nisar Ali (Titu mir) - Narkelbaria movement, 1831. Haji Shariatullah - Faraizi movement. Shah Walliullah - Wahabi movement.", "t": 2, "s": 8}, {"n": 804, "tag": null, "stem": "Who among the following founded the Widow Remarriage Association?", "opts": {"a": "Raja Rammohan Roy", "b": "Pandit Vishnu Shastri", "c": "Swami Vivekananda", "d": "Keshav Chandra Sen"}, "ans": "b", "exp": "Pandit Vishnu Shastri. ", "t": 2, "s": 8}, {"n": 805, "tag": null, "stem": "Lala Lajpat Rai was an active member of which organisation?", "opts": {"a": "Arya Samaj", "b": "Brahmo Samaj", "c": "Brahmo Sabha", "d": "Prathana Sabha"}, "ans": "a", "exp": "Arya Samaj . It promoted the study of the Vedas and the Upanishads, and it advocated for social reform, including the abolition of caste discrimination.", "t": 2, "s": 8}, {"n": 806, "tag": null, "stem": "Who was the founder of Dharma Sabha ?", "opts": {"a": "Raja Ram Mohan Roy", "b": "Dadoba Pandurang", "c": "R.G. Bhandarkar", "d": "Radhakanta Deb"}, "ans": "d", "exp": "Radhakanta Deb founded it in 1830 in Calcutta. The <mark>Dharma Sabha <\/mark> was a conservative Hindu society. It campaigned against the Hindu Widow Remarriage Act, 1856. Chief public organ - Bengali newspaper “Samachar Chandrika” {Editor - Bhabani Charan Bandyopadhyay (Secretary of Dharma Sabha)}.", "t": 2, "s": 8}, {"n": 807, "tag": null, "stem": "Annie Besant laid the foundation of the Central Hindu College in______ in 1898 where both Hindu religion and Western scientific subjects were taught.", "opts": {"a": "Pune", "b": "Chennai", "c": "Banaras", "d": "Kolkata"}, "ans": "c", "exp": "Banaras. Annie Besant: A British socialist, educationist and women’s rights activist. She came to India in 1893.", "t": 2, "s": 8}, {"n": 808, "tag": null, "stem": "When was the Dev Samaj founded in Lahore by Shiv Narayan Agnihotri?", "opts": {"a": "1892", "b": "1887", "c": "1876", "d": "1863"}, "ans": "b", "exp": "1887. Dev Samaj is a Hindu reform movement that was founded in response to the perceived ills of orthodox Hinduism.", "t": 2, "s": 8}, {"n": 809, "tag": null, "stem": "Assertion (A): Satguru Ram Singh was the leader who started the Kuka Movement.<br><b>Reason (R): <\/b>The Kuka Movement was aimed at purifying Sikhism and opposing social evils as well as British rule.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "The Kukas, a sect within Sikhism, formed with a motive to purify Sikhism. Baba Dayal Das: founded the Nirankari Movement. Balak Singh: An Indian Sikh religious leader who founded the Namdhari sect. Thakur Singh Sandhawalia: Founder of Singh sabha.", "t": 2, "s": 8}, {"n": 810, "tag": null, "stem": "Who emphasized the worship of God as Nirankar (Formless) in Punjab?", "opts": {"a": "Maharaja Ranjit Singh", "b": "Baba Ram Singh", "c": "Baba Dayal Das", "d": "Guru Gobind Singh"}, "ans": "c", "exp": "Baba Dayal Das - Founder of the Nirankari Movement. He emphasized the worship of god as Nirankar (formless). Baba Ram Singh - The leader of the Kuka movement in Punjab. Maharaja Ranjit Singh (“Sher-e-Punjab” or &quot;Lion of Punjab&quot;) - First Maharaja of the Sikh Empire. Guru Gobind Singh - The tenth and last Sikh Guru.", "t": 2, "s": 8}, {"n": 811, "tag": null, "stem": "The first session of All India Depressed Classes congress was held at __________ in 1930.", "opts": {"a": "Nagpur", "b": "Surat", "c": "Delhi", "d": "Kanpur"}, "ans": "a", "exp": "Nagpur. &#x27;Bahishkrit Hitkarini Sabha (Outcastes Welfare Association)’, 1923.", "t": 2, "s": 8}, {"n": 812, "tag": null, "stem": "Consider the following statements regarding Pandita Ramabai:<br>1. She founded the Arya Mahila Samaj to promote women’s education and social reform.<br>2. She was the first woman to be awarded the titles Pandita and Sarasvati for her knowledge of Sanskrit.<br>3. She was the founder of the Depressed Class Mission in Mumbai in 1906. Which of the statements given above is/are correct?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. Pandita Ramabai (women&#x27;s rights &amp; education activist). She was the first woman to be awarded the titles of Pandita as a Sanskrit scholar and Sarasvati after being examined by the faculty of the University of Calcutta. She was awarded with the Kaiser-i-Hind Medal for community service in 1919. She was one of the ten women delegates of the Congress session of 1889.", "t": 2, "s": 8}, {"n": 813, "tag": null, "stem": "In 1930, _________ led a satyagraha for the rights of untouchables’ entry to the Kalaram temple at Nasik.", "opts": {"a": "MC Rajah", "b": "Dr. BR Ambedkar", "c": "Madan Mohan Malaviya", "d": "Mahatma Gandhi"}, "ans": "b", "exp": "Dr B.R. Ambedkar. In 1920, he began the publication of the weekly Mooknayak (Leader of the Silent) in Mumbai with the help of Shahu of Kolhapur. His important writings: ‘The Annihilation of Caste’, ‘Who Were the Shudras’, ‘The Untouchables’, ‘Riddles in Hinduism’, etc.", "t": 2, "s": 8}, {"n": 814, "tag": null, "stem": "Which of the following was known as the forerunner of the Brahmo Samaj?", "opts": {"a": "Prarthana Sabha", "b": "Atmiya Sabha", "c": "Paramhansa Sabha", "d": "Hindu Sabha"}, "ans": "b", "exp": "Atmiya Sabha. Brahmo Samaj {Raja Ram Mohan Roy founded Brahmo Sabha in 1828, Aim - worship of the eternal God. It split into two in 1866 (Brahmo Samaj of India led by Keshub Chandra Sen and Adi Brahmo Samaj led by Debendranath Tagore), Prominent Leaders: Debendranath Tagore, Keshub Chandra Sen, Pt. Sivnath Shastri, and Rabindranath Tagore}.", "t": 2, "s": 8}, {"n": 815, "tag": null, "stem": "Consider the following pairs of Newspapers/Journals and their founders/editors:<br>1. Nibandhmala – Vishnushastri Chiplunkar<br>2. Prabhakar – Gopal Hari Deshmukh<br>3. Kesari – Lokmanya Bal Gangadhar Tilak<br>4. Pudhari – Swami Vivekananda How many of the above pairs are correctly matched?", "opts": {"a": "Only one", "b": "Only two", "c": "Only three", "d": "All four"}, "ans": "c", "exp": "Only three. Vishnushastri Chiplunkar was the founder/editor of Nibandhmala, a Marathi literary magazine. Gopal Hari Deshmukh is writer of Prabhakar newspaper. Kesari (Marathi newspaper, 1881, Lokmanya Bal Gangadhar Tilak). Pudhari (Marathi daily, 1937). (Newspaper/ Journal – Founder):- Udbodhan, 1899, Swami Vivekananda. Independent, 1919, Motilal Nehru. Tahzib -ul-Akhlaq, 1871, Sir Syed Ahmed Khan.", "t": 2, "s": 8}, {"n": 816, "tag": null, "stem": "The Bahishkrit Hitakarini Sabha was established at ___________.", "opts": {"a": "Hyderabad", "b": "Bombay", "c": "Delhi", "d": "Nasik"}, "ans": "b", "exp": "Bombay. ", "t": 2, "s": 8}, {"n": 817, "tag": null, "stem": "The Vidhava Vivaha Uttejaka Mandal (Society for Encouragement of Widow Marriage) was established in __________ in the second half of the nineteenth century.", "opts": {"a": "Calcutta Presidency", "b": "Bombay Presidency", "c": "the Central Provinces", "d": "the United Provinces"}, "ans": "b", "exp": "Bombay Presidency. It was established by Vishnushastri Pandit in 1866. Hindu Widow Remarriage Act (1856) was passed by Lord Canning with the efforts of Ishwar Chandra Vidyasagar. Sati Practice was abolished by William Bentinck in 1829 with the efforts of Raja Ram Mohan Roy.", "t": 2, "s": 8}, {"n": 818, "tag": null, "stem": "The Begums of Bhopal founded a primary school for girls in the early twentieth century at _____.", "opts": {"a": "Lahore", "b": "Bombay", "c": "Aligarh", "d": "Pune"}, "ans": "c", "exp": "Aligarh. The Begums of Bhopal played a vital role, from the early 20th century, in promoting education among Muslim women. They founded a primary school for girls at Aligarh. Nawab Begum was the founding Chancellor of Aligarh Muslim University.", "t": 2, "s": 8}, {"n": 819, "tag": null, "stem": "Match the following social reformers with the organizations they were associated with:<br>1. Dadoba Pandurang – Paramhansa Sabha<br>2. V R Shinde – Depressed Class Mission<br>3. Tulsi Ram – Radha Swami Satsang<br>4. G G Agarkar – Deccan Education Society Which of the pairs given above are correctly matched?", "opts": {"a": "1, 2 and 3 only", "b": "2, 3 and 4 only", "c": "1, 3 and 4 only", "d": "1, 2, 3 and 4"}, "ans": "d", "exp": "1, 2, 3 and 4. Paramhansa Sabha was founded by Dadoba Pandurang. V R Shinde founded the Depressed Class Mission in Mumbai in 1906. Radha Swami Satsang was founded by Tulsi Ram in 1861.", "t": 2, "s": 8}, {"n": 820, "tag": null, "stem": "Who among the following wrote the Brahmo Covenant, which was a statement of the creed of the Brahmo Samaj and made a list of the duties and obligations of its members?", "opts": {"a": "Keshab Chandra Sen", "b": "Ishwar Chandra Vidyasagar", "c": "Debendranath Tagore", "d": "Rammohan Roy"}, "ans": "c", "exp": "Debendranath Tagore . He was the founder in 1848 of the Brahmo religion, which today is synonymous with Brahmoism. In 1863 he founded Shantiniketan (“Abode of Peace”).", "t": 2, "s": 8}, {"n": 821, "tag": null, "stem": "Who among the following was NOT a Nayanar saint?", "opts": {"a": "Sundarar", "b": "Appar", "c": "Sambandar", "d": "Andal"}, "ans": "d", "exp": "Andal . The Nayanars were a group of 63 poet-saints living in Tamil Nadu during the 6th to 8th centuries CE who were devoted to the Hindu god Shiva. Along with the <mark>Alwars, <\/mark>their contemporaries who were devoted to Vishnu, they influenced the Bhakti movement in early medieval South India.", "t": 2, "s": 8}, {"n": 822, "tag": null, "stem": "Which of the following is NOT a correct match of Dargah and its respective location?", "opts": {"a": "Shaikh Nizamuddin Auliya Dargah - Agra", "b": "Khwaja Qutbuddin Bakhtiyar Kaki Dargah - Delhi", "c": "Haji Ali Dargah - Mumbai", "d": "Shaikh Muinuddin Sijzi (chishti) Dargah - Ajmer"}, "ans": "a", "exp": "Shaikh Nizamuddin Auliya  <mark>Dargah <\/mark>is the Dargah of the Sufi saint Khwaja Nizamuddin Auliya. It is located in the Nizamuddin West area of Delhi", "t": 2, "s": 8}, {"n": 823, "tag": null, "stem": "Who among the following is known as the &#x27;father of Muslim renaissance&#x27; in Bengal?", "opts": {"a": "Sir Syed Ahmed Khan", "b": "Ameer Ali", "c": "Nawab Abdul Latif Khan", "d": "Nawab Salimullah Khan"}, "ans": "c", "exp": "Nawab Abdul Latif Khan . His title, Nawab, was awarded by the British in 1880. He was one of the first Muslim in nineteenth century India to embrace the idea of modernization.", "t": 2, "s": 8}, {"n": 824, "tag": "SSC Stenographer 7/08/2025 (Shift 3)", "stem": "Who was the first woman to be the president of the Indian National Congress?", "opts": {"a": "Kasturba Gandhi", "b": "Kamala Nehru", "c": "Annie Besant", "d": "Sarojini Naidu"}, "ans": "c", "exp": "Annie Besant became the president of the Indian National Congress in 1917, at a time when India’s freedom movement was gaining momentum. A British-born social reformer and theosophist, Annie Besant played a vital role in promoting Indian self-rule and education. Her election as Congress president marked a significant moment in Indian history, symbolizing both the inclusion of women in the political sphere and the growing international support for India&#x27;s independence movement.", "t": 2, "s": 9}, {"n": 825, "tag": "SSC Stenographer 7/08/2025 (Shift 3)", "stem": "With whose participation did the Anushilan group join forces when the Bengal Congress broke up into two factions after the death of CR Das?", "opts": {"a": "Ganesh Ghosh", "b": "Surya Sen", "c": "JM Sengupta", "d": "Subhash Bose"}, "ans": "c", "exp": "J.M. Sengupta. After the death of Chittaranjan Das (C.R. Das) in 1925, the Bengal Provincial Congress Committee split into two factions — the moderates and the radicals. The radical faction was led by J.M. Sengupta, a close associate of C.R. Das. The Anushilan Samiti, a revolutionary nationalist group that had been involved in militant activities against British rule, found ideological alignment with Sengupta’s more assertive and left-leaning stance. As a result, many members of the Anushilan group aligned themselves with J.M. Sengupta’s faction to continue pushing for more aggressive nationalist policies from within the Congress.", "t": 2, "s": 9}, {"n": 826, "tag": null, "stem": "Consider the following sessions of the Indian National Congress and their Presidents:<br>1. Bombay, 1885 – W.C. Banerjee<br>2. Madras, 1887 – Badruddin Tyabji<br>3. Belgaum, 1924 – ?<br>4. Lahore, 1929 – Jawaharlal Nehru Who presided over the Belgaum Session of 1924?", "opts": {"a": "Subhas Chandra Bose", "b": "Mahatma Gandhi", "c": "Vallabhbhai Patel", "d": "Gopal Krishna Gokhale"}, "ans": "b", "exp": "Mahatma Gandhi. The 39th session of INC at Belgaum was held on December 26, 1924. INC Sessions: Bombay, 1885 (W.C. Banerjee) - First session; Madras, 1887 (Badruddin Tayabji) - First Muslim President; Allahabad, 1888 (George Yule) - First English President; Lahore, 1929 (Jawaharlal Nehru); Haripura, 1938 (Subhas Chandra Bose) - Bose’s first term as President.", "t": 2, "s": 9}, {"n": 827, "tag": null, "stem": "Where was the 1912 session of the India National Congress held in Bihar?", "opts": {"a": "Sahasaram", "b": "Gaya", "c": "Bankipore", "d": "Madhubani"}, "ans": "c", "exp": "Bankipore. The 27th session of the Indian National Congress in 1912 was presided over by Raghunath Narasinha Mudholkar. In December 1922, the session was held in Gaya under Chittaranjan Das, while the 53rd session took place in 1940 at Ramgarh, near Ranchi, led by Maulana Abul Kalam Azad.", "t": 2, "s": 9}, {"n": 828, "tag": null, "stem": "Who amongst the following became the president of the second session of the Indian National Congress held in Calcutta in December 1886 ?", "opts": {"a": "P Ananda Charlu", "b": "Badruddin Tyabji", "c": "Dadabhai Nauroji", "d": "William Wedderburn"}, "ans": "c", "exp": "Dadabhai Nauroji. The first session of the Indian National Congress was held in Bombay in December 1885 with seventy-two delegates. W.C. Banerjee served as its first president, while A.O. Hume took office as the General Secretary. Dadabhai Naoroji also presided over the 9th session in 1893 (Lahore), and the 22nd session in 1906 (Calcutta).", "t": 2, "s": 9}, {"n": 829, "tag": null, "stem": "The Indian National Congress formally took up the Swadeshi call in its Benaras session of 1905 under the presidency of _________.", "opts": {"a": "Jawahar Lal Nehru", "b": "Rajendra Prasad", "c": "Motilal Nehru", "d": "Gopal Krishna Gokhale"}, "ans": "d", "exp": "Gopal Krishna Gokhale. INC Sessions and its President : First Session (Bombay in 1885) - W.C. Bannerjee, Second Session (Calcutta in 1886) - Dadabhai Naoroji, 1919 (Amritsar) and 1928 (Calcutta) - Motilal Nehru, 1929 (Lahore) - Jawaharlal Nehru, 1934 (Bombay) - Rajendra Prasad.", "t": 2, "s": 9}, {"n": 830, "tag": null, "stem": "The Quit India Resolution was ratified in the_________ session of Indian National Congress to launch the movement.", "opts": {"a": "Bombay", "b": "Bankipur", "c": "Lucknow", "d": "Nagpur"}, "ans": "a", "exp": "Bombay session. This session took place at the Gowalia Tank Maidan (August Kranti Maidan), on August 8, 1942, where Mahatma Gandhi gave his famous &quot;Do or Die&quot; speech. The resolution was moved by Jawaharlal Nehru.", "t": 2, "s": 9}, {"n": 831, "tag": null, "stem": "Consider the following statements regarding the Indian National Congress:<br>1. The resolution of Purna Swaraj was passed at the Lahore Session of 1929 presided over by Jawaharlal Nehru.<br>2. The Karachi Session of 1931 adopted the resolution of Purna Swaraj. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. On 19 December 1929, the Indian National Congress passed the historic ‘Poorna Swaraj’ (total independence) resolution at its Lahore session, with Jawaharlal Nehru elected as its President. A public declaration was made on 26 January 1930, a day the Congress urged Indians to celebrate as ‘Independence Day.’", "t": 2, "s": 9}, {"n": 832, "tag": null, "stem": "__________ was elected as the president of the third session of Indian National Congress.", "opts": {"a": "KT Telang", "b": "Pherozeshah Mehta", "c": "Badruddin Tyabji", "d": "AO Hume"}, "ans": "c", "exp": "Badruddin Tyabji . Wyomesh Chandra Banerjee was the first president, presiding over the inaugural session in 1885, while Annie Besant became the first woman to hold the position in 1917.", "t": 2, "s": 9}, {"n": 833, "tag": null, "stem": "All India Kisan Sabha was founded in 1936 at Indian National Congress (INC) ________ Session as All India Kisan Congress.", "opts": {"a": "Lucknow", "b": "Agra", "c": "Bombay", "d": "Delhi"}, "ans": "a", "exp": "Lucknow. Swami Sahajananda Saraswati, who founded the Bihar Provincial Kisan Sabha in 1929, also led the formation of the All India Kisan Sabha (AIKS) during the Indian National Congress&#x27; Lucknow Session in 1936. The AIKS, also known as the Akhil Bharatiya Kisan Sabha.", "t": 2, "s": 9}, {"n": 834, "tag": null, "stem": "Indian National Congress celebrated the first Independence Day in Colonial India on _____________ .", "opts": {"a": "2 October 1929", "b": "29 December 1929", "c": "15 August 1930", "d": "26 January 1930"}, "ans": "d", "exp": "26 January 1930. The Indian National Congress passed &#x27;Complete Swaraj&#x27; in its Lahore session on 19 December 1929. The president of this session was Jawaharlal Nehru.", "t": 2, "s": 9}, {"n": 835, "tag": null, "stem": "Who led the Indian National Congress at its first annual session?", "opts": {"a": "Surendra Nath Banerjee", "b": "Dadabhai Naoroji", "c": "WC Banerjee", "d": "AO Hume"}, "ans": "c", "exp": "WC Banerjee. Important Congress sessions: First Session - held at Bombay in 1885. Second Session - held at Calcutta in 1886, President - Dadabhai Naoroji. Third Session - held at Madras in 1887, President - Syed Badruddin Tyabji (first muslim President). Fourth Session - held at Allahabad in 1888, President - George Yule (first English President). 1896 session (Calcutta) President - Rahimtullah Sayani, National Song ‘Vande Mataram’ sung for the first time by Rabindranath Tagore.", "t": 2, "s": 9}, {"n": 836, "tag": null, "stem": "Consider the following statements regarding the Indian National Congress:<br>1. Annie Besant was the first woman President of the Indian National Congress, presiding over its 1917 Calcutta Session.<br>2. Sarojini Naidu was the first woman President of the Indian National Congress. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Annie Besant : First woman who presided over the Calcutta session (1917) of Indian National Congress. Sarojini Naidu - First Indian women president of Indian national congress (1925, Kanpur session) and the first woman Governor of the United Provinces in 1947.", "t": 2, "s": 9}, {"n": 837, "tag": null, "stem": "Which flag of the Indian National Congress was adopted in 1931?", "opts": {"a": "A two colour flag with charkha made by cloth", "b": "A tricolour flag made by Khadi with a Charkha symbol", "c": "One colour flag with charkha symbol", "d": "A blue colour flag made by cloth"}, "ans": "b", "exp": "Ad - Hoc Flag Committee : Formed in 1947 under Rajendra Prasad. Pingali Venkayya - Designer of National Flag of India (1921). The national flag was adopted on July 22, 1947. Ratio of the length to the breadth of the Indian Flag - 3:2. The national flag of India was first hoisted on 7th August, 1906 in Kolkata at the Parsee Bagan Square (Green Park). The first Indian flag was hoisted on a foreign land by Madame Bhikaji Cama (1907 - Germany).", "t": 2, "s": 9}, {"n": 838, "tag": null, "stem": "In the 1939 Tripuri Congress Presidential Election, Pattabhi Sitaramayya was defeated by:", "opts": {"a": "Mahatma Gandhi", "b": "Rajendra Prasad", "c": "Subhas Chandra Bose", "d": "Jawaharlal Nehru"}, "ans": "c", "exp": "Subhas Chandra Bose was elected as President of the Haripura Congress Session in 1938. He resigned as congress president in April 1939. Dr. Rajendra Prasad replaced Subhas Chandra Bose as the new congress president.", "t": 2, "s": 9}, {"n": 839, "tag": null, "stem": "Consider the following statements regarding the Congress–Muslim League understanding:<br>1. The Congress and the Muslim League reached a historic agreement during the Lucknow Session of 1916.<br>2. The Lucknow Pact was signed under the presidentship of Bal Gangadhar Tilak. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Lucknow (1916) - President: A.C. Majumdar; Lucknow Pact signed between Congress (Bal Gangadhar Tilak) and Muslim League (Muhammad Ali Jinnah) to build political consensus; Unity between two factions - Moderates and Extremists of Congress.", "t": 2, "s": 9}, {"n": 840, "tag": null, "stem": "Which among the following sessions of Indian National Congress was the first session to be presided by a lady ?", "opts": {"a": "Calcutta - 1917", "b": "Kanpur - 1925", "c": "Lahore - 1929", "d": "Surat - 1907"}, "ans": "a", "exp": "Calcutta - (Annie Besant, 1917) <mark>. <\/mark>", "t": 2, "s": 9}, {"n": 841, "tag": null, "stem": "Consider the following statements regarding Indian National Congress sessions:<br>1. In the Madras session of 1927, the Indian National Congress set up an All Parties Conference to draft a Constitution for India.<br>2. In the Gaya session of 1922, C. R. Das presided and the Swaraj Party was formed after breaking away from the Congress. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Indian National Congress (INC) session 1927 (Madras): President - M A Ansari. INC session 1915 (Bombay): President - Satyendra Prasanna Sinha. Importance - Constitution of the Congress was altered to admit the delegates from the extremist section. INC session 1922 (Gaya): President - C R Das. Importance - CR Das and other leaders broke away from INC, Formation of Swaraj Party. INC session 1932 (Delhi): President - Amrit Ranchhorddas Seth.", "t": 2, "s": 9}, {"n": 842, "tag": null, "stem": "The split in Indian National Congress occurred in ________ .", "opts": {"a": "1901", "b": "1905", "c": "1903", "d": "1907"}, "ans": "d", "exp": "1907. The <mark>Surat Split <\/mark>was the splitting of Indian National Congress into two groups - Moderates and Radicals.", "t": 2, "s": 9}, {"n": 843, "tag": null, "stem": "The Indian National Congress was established when 72 delegates from all over the country met at Bombay in December _______.", "opts": {"a": "1890", "b": "1858", "c": "1885", "d": "1872"}, "ans": "c", "exp": "1885. Founder <mark>: Allan <\/mark> <mark>Octavian Hume. <\/mark>First President: <mark>W.C. <\/mark> <mark>Bannerjee. <\/mark>First meeting - Gokuldas Tejpal Sanskrit College (Bombay). Prominent delegates included Dadabhai Naoroji, Surendranath Banerjee, Badruddin Tyabji, Pherozeshah Mehta, W. C. Bonnerjee, S. Ramaswami Mudaliar, S. Subramania Iyer, and Romesh Chunder Dutt.", "t": 2, "s": 9}, {"n": 844, "tag": null, "stem": "Who among the following was the President of the Indian National Congress during the 1915 session?", "opts": {"a": "Satyendra Prasanna Sinha", "b": "Ambica Charan Mazumdar", "c": "Bhupendra Nath Bose", "d": "Madan Mohan Malaviya"}, "ans": "a", "exp": "Satyendra Prasanna Sinha.  1895 - Surendranath Banerjee, 1909 - Madan Mohan Malaviya, 1916 - Ambica Charan Mazumdar.", "t": 2, "s": 9}, {"n": 845, "tag": null, "stem": "How many delegates participated in the second session of Indian National Congress?", "opts": {"a": "434", "b": "628", "c": "212", "d": "190"}, "ans": "a", "exp": "434 , Held (December 27-30, 1886, Calcutta), <mark>President <\/mark>(Shri Dadabhai Naoroji), Congress decided to set up Provincial Congress Committees across the country.", "t": 2, "s": 9}, {"n": 846, "tag": null, "stem": "In which of the following sessions of the Indian National Congress did George Yule become the President in 1888?", "opts": {"a": "Calcutta", "b": "Allahabad", "c": "Madras", "d": "Bombay"}, "ans": "b", "exp": "Allahabad .", "t": 2, "s": 9}, {"n": 847, "tag": null, "stem": "In which of the following years did the resolution at the Karachi Session of the Indian National Congress dwell on how Independent India’s Constitution should look?", "opts": {"a": "1931", "b": "1928", "c": "1946", "d": "1945"}, "ans": "a", "exp": "1931 . In 1928, Motilal Nehru and other Congress leaders drafted a constitution for India.", "t": 2, "s": 9}, {"n": 848, "tag": null, "stem": "Assertion (A): In September 1923, Maulana Abul Kalam Azad presided over the special session of the Indian National Congress.<br><b>Reason (R): <\/b>He became the youngest man to be elected as the President of the Congress at the age of 35.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "Maulana Abul Kalam Azad was also a noted writer, poet and journalist. He was a prominent political leader and was elected as Congress President in 1923 and 1940.", "t": 2, "s": 9}, {"n": 849, "tag": null, "stem": "Who was the President of the Indian National Congress when India won its freedom in the year 1947 ?", "opts": {"a": "Abul Kalam Azad", "b": "Vallabhbhai Patel", "c": "Jawaharlal Nehru", "d": "J. B. Kripalani"}, "ans": "d", "exp": "J. B. Kripalani (Acharya Kriplani) was the president of the Indian National Congress during the transfer of power. He was the husband of Sucheta Kripalani, who was the first woman chief minister (Uttar Pradesh).", "t": 2, "s": 9}, {"n": 850, "tag": null, "stem": "Consider the following statements about the All-India Muslim League:<br>1. The All-India Muslim League was founded in Dhaka in 1906 during the tenure of Lord Minto II.<br>2. The government accepted the League’s demand for separate electorates for Muslims in 1916. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The All-India Muslim League was formed during the tenure of Lord Minto II, who served as the Viceroy of India from 1905 to 1910. The League was founded in Dhaka, British India (Bangladesh), in 1906 and supported the partition of Bengal. It sought separate electorates for Muslims, a demand that was conceded by the government in 1909.", "t": 2, "s": 10}, {"n": 851, "tag": null, "stem": "The Lucknow Pact was signed in ____________ by Congress and the Muslim League to work in alliance for representative government.", "opts": {"a": "1916", "b": "1918", "c": "1920", "d": "1914"}, "ans": "a", "exp": "1916. INC session Lucknow (1916) - President: A.C. Majumdar. Lucknow Pact was signed between Congress (Bal Gangadhar Tilak) and Muslim League (Muhammad Ali Jinnah) to build political consensus.", "t": 2, "s": 10}, {"n": 852, "tag": null, "stem": "In __________ the Muslim League had moved a resolution demanding “Independent States” for Muslims in the north - western and eastern areas of the country", "opts": {"a": "1940", "b": "1942", "c": "1946", "d": "1935"}, "ans": "a", "exp": "1940. All-India Muslim League established in Dhaka in 1906. Founder: Nawab Khwaja Salimullah. First Honorary President: Aga Khan III. Headquarters: Lucknow. 1st Session: Karachi (1907).", "t": 2, "s": 10}, {"n": 853, "tag": null, "stem": "Muslim League observed ______ as ‘Direct Action Day’.", "opts": {"a": "16 August 1946", "b": "12 August 1946", "c": "10 August 1946", "d": "14 August 1946"}, "ans": "a", "exp": "16 August 1946 . Muhammad Ali Jinnah declared 16 August as &#x27;Direct Action Day&#x27; and called for Muslims all over the country to &#x27;suspend all business&#x27;. Direct Action Day, also known as the 1946 Calcutta Killings.", "t": 2, "s": 10}, {"n": 854, "tag": null, "stem": "Assertion (A): Aurobindo Ghose was the first principal of the Bengal National College established in 1906.<br><b>Reason (R): <\/b>The Bengal National College was founded by the Indian National Congress during its Surat session of 1907.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false.  Aurobindo Ghose was an Indian philosopher, yogi, poet, and nationalist. He also worked as a journalist, editing newspapers such as Bande Mataram. The Alipore Bomb Case, also known as the Muraripukur Conspiracy or Manicktolla Bomb Conspiracy, was a significant criminal trial in India in 1908, involving several Indian nationalists.", "t": 2, "s": 11}, {"n": 855, "tag": null, "stem": "When was the All Bengal Students Conference held in the chairmanship of Jawaharlal Nehru?", "opts": {"a": "1928", "b": "1939", "c": "1934", "d": "1920"}, "ans": "a", "exp": "1928. All Bengal Students Conference - It was organized in response to the expulsion of students from Kolkata colleges for &quot;unruly conduct&quot; and the subsequent student protests. The conference led to the formation of the All-Bengal Students Association to unite and organize students across the region.", "t": 2, "s": 11}, {"n": 856, "tag": null, "stem": "In 1927, where was the conference against colonial oppression and imperialism, in which Jawaharlal Nehru participated on behalf of Indian National Congress, held?", "opts": {"a": "Bruges", "b": "Leuven", "c": "Antwerp", "d": "Brussels"}, "ans": "d", "exp": "Brussels. Pt. Jawaharlal Nehru became General Secretary of the All India Congress Committee in 1923. In 1926, he toured several countries, including Belgium, where he attended the Congress of Oppressed Nationalities in 1927. He also participated in the 10th anniversary of the October Revolution in Moscow. At the 1927 Madras Congress, Nehru advocated for full independence.", "t": 2, "s": 11}, {"n": 857, "tag": null, "stem": "Consider the following statements about the Women’s Indian Association (WIA):<br>1. The Women’s Indian Association was founded in 1917 at Adyar, Chennai by Annie Besant.<br>2. It was the first women’s organization in India to create an awakening among women and prepare them for public service. Which of the above statements is/are true?", "opts": {"a": "Only 1 is true", "b": "Only 2 is true", "c": "Both 1 and 2 are true", "d": "Both 1 and 2 are false"}, "ans": "c", "exp": "Both 1 and 2 are true.  Women’s Indian Association, a heritage welfare organization of the women by the women for the women. It was formed on 8th May 1917 at Adyar, Chennai by Annie Besent. It was the first organization to create an overall awakening among women and to train them to shoulder their responsibility in public services.", "t": 2, "s": 11}, {"n": 858, "tag": null, "stem": "Which of the following national leaders of India inaugurated the first Akhil Bhartiya Kalidas Samman Samaroh held in Ujjain in 1958?", "opts": {"a": "Jawaharlal Nehru", "b": "Lal Bahadur Shastri", "c": "Rajendra Prasad", "d": "Sardar Patel"}, "ans": "c", "exp": "Rajendra Prasad. The Akhil Bharatiya Kalidas Samaroh is an annual cultural festival held in Ujjain, Madhya Pradesh, since 1958, celebrating the works of poet Kalidasa.", "t": 2, "s": 11}, {"n": 859, "tag": null, "stem": "Assertion (A): Siraj-ud-Daulah became the Nawab of Bengal after the death of Alivardi Khan in 1756.<br><b>Reason (R): <\/b>His accession was peaceful and faced no opposition from the British East India Company.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false.  Following Alivardi Khan&#x27;s death in 1756, Sirajuddaulah became Nawab of Bengal but faced conflict with the British, who aimed to install a puppet ruler.", "t": 2, "s": 11}, {"n": 860, "tag": null, "stem": "On which of the following dates did the British Empire transfer its powers to the Constituent Assembly in India? nd th", "opts": {"a": "2 October", "b": "15 August", "c": "14 th November", "d": "26 th January"}, "ans": "b", "exp": "15th August. India gained independence from British rule on August 15, 1947, ending nearly two centuries of colonial control. The transfer of power also led to the partition, creating India and Pakistan.", "t": 2, "s": 11}, {"n": 861, "tag": null, "stem": "Who among the following has authored the play ‘Nil Darpan’ ?", "opts": {"a": "Motilal Nehru", "b": "Chittaranjan Das", "c": "Dinabandhu Mitra", "d": "Sarojini Naidu"}, "ans": "c", "exp": "Dinabandhu Mitra. Nil Darpan is a Bengali-language play written in 1858-59 by Dinabandhu Mitra, depicting the oppression of indigo farmers by British planters in Bengal. His other works include ‘Nabin Tapasvini’, ‘Biye Pagla Budo’, ‘Sadhabar Ekadashi’, and ‘Kamale Kamini’. Other authors and their works : Sarojini Naidu - ‘The Golden Threshold’, ‘The Bird of Time’. Chittaranjan Das - ‘India for Indians’, ‘Freedom Through Disobedience’.", "t": 2, "s": 11}, {"n": 862, "tag": null, "stem": "Who among the following freedom fighters of India is the author of the book, &#x27;The Indian Struggle&#x27; ?", "opts": {"a": "Mahatma Gandhi", "b": "Motilal Nehru", "c": "Vallabhbhai Patel", "d": "Subhas Chandra Bose"}, "ans": "d", "exp": "Subhas Chandra Bose. His Books : An Indian Pilgrim, Jaruri Kichu Lekha, Famous Speeches and Letters of Subhas Chandra Bose.", "t": 2, "s": 11}, {"n": 863, "tag": null, "stem": "Which of the following books is INCORRECTLY paired with its respective author?", "opts": {"a": "Hind Swaraj – Mahatma Gandhi", "b": "Gitanjali – Rabindranath Tagore", "c": "The Discovery of India – Subhash Chandra Bose", "d": "Why I am an Atheist – Bhagat Singh"}, "ans": "c", "exp": "‘’ The Discovery of India’’ is a book by Jawaharlal Nehru.", "t": 2, "s": 11}, {"n": 864, "tag": null, "stem": "Match the following institutes with their respective founders of British India. <b>Institutes Their respective <\/b> <b>founders <\/b><br>a. Asiatic Society of i. Warren Hastings Bengal<br>b. Sanskrit College of ii. Lord Wellesley Benaras<br>c. Fort William College iii. Jonathan Duncan<br>d. Calcutta Madrasa iv. Sir William Jones", "opts": {"a": "a-ii, b-i, c-iv, d-iii", "b": "a-iii, b-iv, c-i, d-ii", "c": "a-iv, b-iii, c-ii, d-i", "d": "a-i, b-ii, c-iii, d-iv"}, "ans": "c", "exp": "A-iv, B-iii, C-ii, D-i. ", "t": 2, "s": 11}, {"n": 865, "tag": null, "stem": "Consider the following statements about the Khurda Uprising of 1817:<br>1. The Khurda Revolt of 1817, also called the Paika Rebellion, took place in Odisha.<br>2. It was led by Bakshi Jagabandhu against the British East India Company. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. The Khurda Revolt of 1817 was an armed uprising against the British, sparked by the rapid and disruptive changes introduced by the East India Company, which agitated the local population. This revolt also impacted other districts of Odisha, such as Cuttack. It is also known as the Paika Rebellion or Paika Bidroha, and it was led by Bakshi Jagabandhu.", "t": 2, "s": 11}, {"n": 866, "tag": null, "stem": "Where was the Hindu College established in the year 1791?", "opts": {"a": "Mathura", "b": "Kolkata", "c": "Benaras", "d": "Patna"}, "ans": "c", "exp": "Benaras. The Hindu College was founded by Jonathan Duncan, a British officer, and Raja Rameshwar Singh, the Maharaja of Banaras. The college was originally known as the Sanskrit College, and it was dedicated to the study of Sanskrit language and literature. In 1958, the Sanskrit College became a university and was renamed Sampurnanand Sanskrit University in 1974. Raja Ram Mohan Roy established the Hindu College in Calcutta in 1817, which is now known as Presidency University, Kolkata.", "t": 2, "s": 11}, {"n": 867, "tag": null, "stem": "Assertion (A): B. R. Ambedkar founded the Independent Labour Party in 1936.<br><b>Reason (R): <\/b>He later became the first Law Minister of Independent India and the chief architect of the Indian Constitution.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "b", "exp": "BR Ambedkar was an Indian jurist and social reformer who served as the first Minister of Law and Justice and was the chief architect of the Constitution of India. He was awarded the Bharat Ratna posthumously in 1990. Organizations and Founders: Swatantra Shramik Party (B.R. Ambedkar), Swarajya Party (Motilal Nehru and Chittaranjan Das), Muslim League (Agha Khan &amp; Salimullah), Indian National Congress (A.O.Hume).", "t": 2, "s": 11}, {"n": 868, "tag": null, "stem": "When was the All India Trade Union Congress (AITUC) established?", "opts": {"a": "1926", "b": "1924", "c": "1928", "d": "1920"}, "ans": "d", "exp": "1920. All India Trade Union Congress (AITUC) was formed in Bombay. The AITUC was a broad-based organisation involving diverse ideologies. The main ideological groups were the communists led by S.A. Dange and M.N. Roy, the moderates led by M. Joshi and V.V. Giri and the nationalists which involved people like Lala Lajpat Rai and Jawaharlal Nehru.", "t": 2, "s": 11}, {"n": 869, "tag": null, "stem": "Who founded the Theosophical Society in New York in 1875?", "opts": {"a": "Naoroji Furdunji and Satyendra Nath Bose", "b": "Baba Dayal Das and Madan Lal", "c": "Ramabai Ranade and GK Devadhar", "d": "Madame HP Blavatsky and Colonel Olcott"}, "ans": "d", "exp": "Madame HP Blavatsky and  <mark>Colonel Olcott. <\/mark>The Theosophical Society, emphasized the study of ancient Hindu, Buddhist, and Zoroastrian philosophies. It advocated for universal brotherhood based on principles from the Upanishads and Vedas. Annie Besant joined the society in 1889 and first came to India on 16 November 1893. Its headquarters in India was established in Adyar, Madras (now Chennai). Ramabai Ranade and G. K. Devadhar were both founders of the Poona Seva Sadan.", "t": 2, "s": 11}, {"n": 870, "tag": null, "stem": "What gave a major impetus to the cotton textile industry in India after Independence?", "opts": {"a": "Partition of India in 1947", "b": "Export of raw cotton to England", "c": "Swadeshi movement", "d": "Development of railway network"}, "ans": "c", "exp": "Swadeshi movement. The Swadeshi movement, led by Gandhiji, aimed to promote self-sufficiency by boycotting British goods and encouraging Indian-made products. India&#x27;s first cotton mill, the Bombay Spinning and Weaving Company, was established in Mumbai on July 7, 1854. The world’s first cotton mill, the Upper Priory Cotton Mill, was founded by Lewis Paul and John Wyatt in Birmingham, England, in 1741.", "t": 2, "s": 11}, {"n": 871, "tag": null, "stem": "Consider the following statements about Jyotirao Phule:<br>1. He wrote Gulamgiri in 1873, which criticized the caste system.<br>2. He founded the Satyashodhak Samaj in the same year to promote social equality.<br>3. Gulamgiri was originally written in Hindi and later translated into Marathi.<br>4. Jyotirao Phule, along with his wife Savitribai Phule, worked for women’s education in Poona. Which of the statements given above are correct?", "opts": {"a": "1, 2 and 4 only", "b": "1 and 3 only", "c": "2 and 4 only", "d": "1, 2, 3 and 4"}, "ans": "a", "exp": "1, 2 and 4 only. Gulamgiri (Marathi Language), also known as Slavery, summarizes the sufferings of lower-caste people and is written in Marathi. Phule formed the Satyashodhak Samaj in 1873. He, together with his wife Savitribai Phule, opened a girls&#x27; school in Poona.", "t": 2, "s": 11}, {"n": 872, "tag": null, "stem": "In his ‘Drain of Wealth’ argument, who among the following stated that Britain was completely draining India?", "opts": {"a": "Badruddin Tyabji", "b": "Lala Lajpat Rai", "c": "Dadabhai Naoroji", "d": "Bal Gangadhar Tilak"}, "ans": "c", "exp": "Dadabhai Naoroji - He was known as the &quot;Grand Old Man of India”. He introduced thе &#x27;drain thеory&#x27; in his rеnownеd book &quot;Povеrty and thе Un-British Rulе in India”.", "t": 2, "s": 11}, {"n": 873, "tag": null, "stem": "Who is the author of the Indian national anthem?", "opts": {"a": "Bankim Chandra Chattopadhyay", "b": "Rabindranath Tagore", "c": "Kazi Nazrul Islam", "d": "Ishwar Chandra Vidyasagar"}, "ans": "b", "exp": "Rabindranath Tagore. He wrote the Indian national anthem, &quot;Jana Gana Mana&quot; in Bengali in 1911, and it was officially adopted as the national anthem of India on January 24, 1950.", "t": 2, "s": 11}, {"n": 874, "tag": null, "stem": "Match the following Commissions/Agreements with their outcomes: <b>List I List II (Outcomes) <\/b> <b>(Commissions/Agree <\/b> <b>ments) <\/b><br>A. Radcliffe 1. Creation of IMF &amp; Boundary World Bank Commission<br>B. Gandhi-Irwin Pact 2. Agreement between Mahatma Gandhi and Lord Irwin<br>C. Hilton Young 3. Recommended Commission establishment of the Reserve Bank of India<br>D. Bretton Woods 4. Drew boundary Conference line between India and Pakistan", "opts": {"a": "A–4, B–2, C–3, D–1", "b": "A–2, B–3, C–1, D–4", "c": "A–3, B–4, C–2, D–1", "d": "A–1, B–4, C–2, D–3"}, "ans": "a", "exp": "A–4, B–2, C–3, D–1. The &quot;Radcliffe Line&quot; became the border between India and Pakistan the partition of India on 17 August 1947. The Border Commission headed by Sir Cyril Radcliffe. Gandhi-Irwin Pact (1931 - 32) was an agreement between Mahatma Gandhi and Lord Irwin. The Hilton Young Commission (1926) recommended the establishment of the &#x27;Reserve Bank of India&#x27;. The Bretton Woods Committee (BWC in 1944) created two organizations - the International Monetary Fund (IMF) and the World Bank.", "t": 2, "s": 11}, {"n": 875, "tag": null, "stem": "Which British colonel is remembered as the Butcher of Amritsar for his role in the Jallianwala Bagh massacre in 1919 ?", "opts": {"a": "William Slim", "b": "Robert Clive", "c": "William Birdwood", "d": "Reginald Dyer"}, "ans": "d", "exp": "Reginald Dyer. The Jallianwala Bagh massacre (Amritsar massacre) took place on April 13, 1919 (spring festival of Baisakhi) in Punjab. It happened under the rule of Lt. Governor of Punjab, Michael O’Dwyer, and viceroy of India, Lord Chelmsford. People gathered there to protest against the Rowlatt Act and arrests of pro-Indian independence leaders Dr. Saifuddin Kitchlew and Dr. Satya Pal.", "t": 2, "s": 11}, {"n": 876, "tag": null, "stem": "Vasco da Gama, who discovered the sea route from Europe to India, belonged to which nation?", "opts": {"a": "England", "b": "Portugal", "c": "Spain", "d": "Germany"}, "ans": "b", "exp": "Portugal. Vasco da Gama arrived in India at Calicut (Kozhikode) in 1498 AD during the reign of the Zamorin, a Hindu ruler. This event marked the discovery of the sea route from Europe to India. He reached India by sea via the &quot;Cape of Good Hope&quot;. Francisco de Almeida was appointed as the first Portuguese governor in India. His policy is known for implementing the &quot;Policy of Blue Water,&quot; which aimed to establish Portuguese dominance in maritime trade.", "t": 2, "s": 11}, {"n": 877, "tag": null, "stem": "Tattvabodhini Patrika promoted the study of India’s past in which language?", "opts": {"a": "Sanskrit", "b": "Hindi", "c": "English", "d": "Bengali"}, "ans": "d", "exp": "Bengali. Tattvabodhini Patrika was a Bengali monthly that started publishing from Calcutta (now Kolkata) in 1843 as a mouthpiece of Debendranath Tagore&#x27;s Tattvabodhini Sabha.", "t": 2, "s": 11}, {"n": 878, "tag": null, "stem": "Who among the following stated in 1902, India was not ruled for its benefit, but rather for the benefit of its conquerors?", "opts": {"a": "Bal Gangadhar Tilak", "b": "Lala Lajpat Rai", "c": "Annie Besant", "d": "Sarojini Naidu"}, "ans": "c", "exp": "Annie Besant first came to India on 16 November 1893. She joined the Theosophical Society in May 1889 and founded a weekly newspaper, Commonweal, in January 1914 for her political work. Other personalities and their quotes: Bal Gangadhar Tilak - Swaraj is my birthright, and I shall have it. Lala Lajpat Rai - The shots that hit me are the last nails to the coffin of British rule in India.", "t": 2, "s": 11}, {"n": 879, "tag": null, "stem": "Sanskrit College at Benaras was founded by ________.", "opts": {"a": "William Jones", "b": "James Mill", "c": "Jonathan Duncan", "d": "Thomas Munro"}, "ans": "c", "exp": "Jonathan Duncan. The Sanskrit College at Varanasi was established in 1791. The Hindu College (now Presidency University) in Kolkata was founded in 1817.", "t": 2, "s": 11}, {"n": 880, "tag": null, "stem": "Assertion (A): India Gate, also known as the All-India War Memorial, was designed by Edwin Lutyens.<br><b>Reason (R): <\/b>The foundation stone of India Gate was laid by Lord Mountbatten in 1947.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false. Other buildings designed by him: Rashtrapati Bhavan, India Gate, The Cenotaph Whitehall (London). The Old Parliament of India was also designed by Herbert Baker and Lutyens. The foundation stone of India Gate was laid by His Royal Highness, the Duke of Connaught in 1921.", "t": 2, "s": 11}, {"n": 881, "tag": null, "stem": "Who was the political guru of Subhash Chandra Bose?", "opts": {"a": "M.G. Ranade", "b": "Mahatma Gandhi", "c": "Jawaharlal Nehru", "d": "Chittaranjan Das"}, "ans": "d", "exp": "Chittaranjan Das  (Deshbandhu) <mark>. <\/mark>", "t": 2, "s": 11}, {"n": 882, "tag": null, "stem": "The name of the Brahmin priest who later came to be known as Ramakrishna Paramahansa is:", "opts": {"a": "Gadadhar Chattopadhyaya", "b": "Dayanand Saraswati", "c": "Shree Narayana Guru", "d": "Narendra Nath Datta"}, "ans": "a", "exp": "Gadadhar Chattopadhyay. ", "t": 2, "s": 11}, {"n": 883, "tag": null, "stem": "When did the Drafting Committee publish the first draft of the Indian Constitution?", "opts": {"a": "June 1948", "b": "May 1948", "c": "January 1948", "d": "February 1948"}, "ans": "d", "exp": "February 1948. Drafting Committee: Formation – 29 August 1947, Chairman – Dr. B. R. Ambedkar, Total Members – 7.", "t": 2, "s": 11}, {"n": 884, "tag": null, "stem": "The All India Forward Bloc was founded by_______in 1939 after resigning from the Congress Presidentship", "opts": {"a": "Bal Gangadhar Tilak", "b": "Mahatma Gandhi", "c": "Jawaharlal Nehru", "d": "Subhash Chandra Bose"}, "ans": "d", "exp": "Subhash Chandra Bose. All India Forward Bloc was a Political Party formed on May 3, 1939 in Makur Unnao, Uttar Pradesh. Its formation was announced in Calcutta.", "t": 2, "s": 11}, {"n": 885, "tag": null, "stem": "Assertion (A): Satyendra Nath Tagore was the first Indian to qualify for the Covenanted Civil Service in 1863.<br><b>Reason (R): <\/b>The Indian Services Act, 1861, passed during Lord Curzon’s viceroyalty, reserved certain posts for covenanted civil servants.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false.  Indian Services Act, 1861 reserved certain positions for covenanted civil servants. It was enacted in 1861 during Lord Canning&#x27;s Viceroyalty. Charles Cornwallis is known as ‘the father of Civil services in India’.", "t": 2, "s": 11}, {"n": 886, "tag": null, "stem": "The Hindu Mahasabha was founded as a response to muslim fundamentalism in which year?", "opts": {"a": "1917", "b": "1915", "c": "1925", "d": "1910"}, "ans": "b", "exp": "1915. Hindu Mahasabha  (Founder - Madan Mohan Malaviya) First All India Hindu Mahasabha Conference - Haridwar (1915). In 1930, it emerged as a distinct party under the leadership of Vinayak Damodar Savarkar. Prominent Leaders - Lala Lajpat Rai, Navin Chandra Rai, Radha Mohan Das Agarwal, Chandroji Angre, Mahant Avaidyanath.", "t": 2, "s": 11}, {"n": 887, "tag": null, "stem": "Who among the following said that &quot;English education has enslaved us&quot; ?", "opts": {"a": "Raja Rammohan Roy", "b": "Mahatma Gandhi", "c": "Muhammad Ali Jinnah", "d": "Muhammad Iqbal"}, "ans": "b", "exp": "Mahatma Gandhi.  Muhammad Iqbal - He wrote the famous song &#x27;Saare jahan se achha&#x27;, also known for giving birth to the &#x27;idea of Pakistan&#x27;. Muhammad Ali Jinnah was a barrister, politician and the founder of Pakistan. Raja Ram Mohan Roy was a religious and social reformer, known as the &#x27;Father of Modern India&#x27; or &#x27;Father of the Bengal Renaissance&#x27;.", "t": 2, "s": 11}, {"n": 888, "tag": null, "stem": "In 1921-22, farmers of the Malabar seacoast of Kerala undertook a great uprising, which is known as the __ .", "opts": {"a": "Munda uprising", "b": "Moplah uprising", "c": "Santhal uprising", "d": "Kol uprising"}, "ans": "b", "exp": "Moplah uprising - Led by Variyamkunnath Kunjahammed Haji, against the British and the Hindu landlords; Wagon tragedy - Moplah prisoners died of suffocation during transportation in a closed freight wagon.", "t": 2, "s": 11}, {"n": 889, "tag": null, "stem": "Who among the following social reformers of British India is known as Lokhitwadi ?", "opts": {"a": "Balshastri Jambhekar", "b": "Daboda Pandurang", "c": "Gopal Ganesh Agarkar", "d": "Gopal Hari Deshmukh"}, "ans": "d", "exp": "Gopal Hari Deshmukh.  Balshastri Jambhekar <mark>( <\/mark>Father of Marathi Journalism) - He started the very first newspaper, ‘Darpan’, and revolutionized the journalism system in Maharashtra.", "t": 2, "s": 11}, {"n": 890, "tag": null, "stem": "Who among the following founded the Asiatic Society in 1784 in Calcutta?", "opts": {"a": "Jonathan Duncan", "b": "William Jones", "c": "Warren Hastings", "d": "Charles Eyre"}, "ans": "b", "exp": "William Jones. Asiatic Society - It was started with the goal of promoting oriental studies. <mark>Jonathan <\/mark> <mark>Duncan <\/mark>- He started Sanskrit College (1791) at Varanasi to study Hindu Law and Philosophy. He was the Governor of Bombay.", "t": 2, "s": 11}, {"n": 891, "tag": null, "stem": "The Social Service League was founded in Bombay by:", "opts": {"a": "Manabendra Nath Roy", "b": "Gopal Krishna Gokhale", "c": "Narayan Malhar Joshi", "d": "Mahadev Govind Ranade"}, "ans": "c", "exp": "Narayan Malhar Joshi - He was an Indian trade union leader, Founded social service league (1911). He started the All India Trade Union Congress (1920). He was the general secretary of AITUC. Manabendra Nath Roy - leader of India’s communists until the independence of India in 1947.", "t": 2, "s": 11}, {"n": 892, "tag": null, "stem": "Consider the following statements:<br>1. At the time of India’s Independence in 1947, the literacy rate was about 20 percent.<br>2. The first census of Independent India was conducted in 1951.<br>3. Conduct of census in India is a Union subject under Article 246 of the Constitution. Which of the statements given above are correct?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "2 and 3 only. The population census, a Union subject under Article 246 of the Indian Constitution, conducted its first census of Independent India in 1951, listed as serial number 69 in the seventh schedule. This census revealed the population of the country to be 36, 10, 88, 090.", "t": 2, "s": 11}, {"n": 893, "tag": null, "stem": "What was the title given to the late Sarojini Naidu?", "opts": {"a": "Nightingale of India", "b": "Kite of India", "c": "Sparrow of India", "d": "Hornbill of India"}, "ans": "a", "exp": "Nightingale of India (Bharat Kokila). This title was given to Sarojini Naidu by Mahatma Gandhi. Notable Works - The Golden Threshold, The Broken Wing.", "t": 2, "s": 11}, {"n": 894, "tag": null, "stem": "The Deccan Riots of 1875 took place in ______ .", "opts": {"a": "Himachal Pradesh", "b": "Bihar", "c": "West Bengal", "d": "Maharashtra"}, "ans": "d", "exp": "Maharashtra. Deccan Riots: Began at - Supa village (Poona) in 1875. The farmers’ main motive was to destroy the account books of the moneylenders and they also socially boycotted the moneylenders. The movement was supported by the Poona Sarvajanik Sabha (co-founded by M G Ranade).", "t": 2, "s": 11}, {"n": 895, "tag": null, "stem": "Editor of a Marathi newspaper &quot;Kesari” was .", "opts": {"a": "Bipin Chandra Pal", "b": "Aurobindo Ghosh", "c": "Lala Lajpat Rai", "d": "Bal Gangadhar Tilak"}, "ans": "d", "exp": "Bal Gangadhar Tilak. ", "t": 2, "s": 11}, {"n": 896, "tag": null, "stem": "Consider the following statements about Bengal in 1770:<br>1. In 1770, Bengal and Bihar faced a massive earthquake that destroyed most villages.<br>2. The British government spent ₹50,000 on rebuilding houses for the affected population. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "d", "exp": "Neither 1 nor 2. 1770 Bengal Famine - It affected Bengal and Bihar. Relief - Attempts to prevent export and hoard or monopolize grain; 15,000 was spent on the import of food grains.", "t": 2, "s": 11}, {"n": 897, "tag": null, "stem": "Tribal leader Birsa was associated with which tribe?", "opts": {"a": "Munda", "b": "Bhil", "c": "Gond", "d": "Bhutia"}, "ans": "a", "exp": "Munda. Birsa Munda was a tribal reformer, religious leader, and freedom fighter. 15 November - Birsa Munda’s birth anniversary (Jharkhand carved out of Bihar on 15th November 2000).", "t": 2, "s": 11}, {"n": 898, "tag": null, "stem": "Dr. B.R Ambedkar was associated with which of the following communities?", "opts": {"a": "Mahar", "b": "Berar", "c": "Santal", "d": "Sangoi"}, "ans": "a", "exp": "Mahar. It is listed as the Scheduled Caste in India. Dr. B.R Ambedkar - Architect of Indian Constitution.", "t": 2, "s": 11}, {"n": 899, "tag": null, "stem": "Which freedom fighter of British India is widely regarded as the &quot;father of the two-nation theory&quot; ?", "opts": {"a": "Syed Ahmed Khan", "b": "Muhammad Ali Jinnah", "c": "Bal Gangadhar Tilak", "d": "Jawaharlal Nehru"}, "ans": "a", "exp": "Syed Ahmed Khan was the founder of Aligarh Muslim University and a forward looking Islamist reformer. Mohammed Ali Jinnah - First governor - general (1947–48) of Pakistan.", "t": 2, "s": 11}, {"n": 900, "tag": null, "stem": "Who among the following was a Roman Catholic missionary who worked in Bengal for the majority of his/her life?", "opts": {"a": "Saint Bernadette", "b": "David of Basra", "c": "Mother Teresa", "d": "Columba"}, "ans": "c", "exp": "Mother Teresa ( from Macedonia <mark>) - <\/mark>Nobel Peace Prize (1979), founded the Missionaries of Charity. <mark>Saint Bernadette - <\/mark>French saint whose visions led to the founding of the Marian shrine of Lourdes.", "t": 2, "s": 11}, {"n": 901, "tag": null, "stem": "When did Indigo revolt, a peasant movement, start in India?", "opts": {}, "ans": "c", "exp": "1859 (March). The Indigo Rebellion (Neel Bidroh) started in Bengal and was a revolt by the farmers against British planters who had forced them to grow indigo under terms that were greatly unfavorable to the farmers.", "t": 2, "s": 11}, {"n": 902, "tag": null, "stem": "The Paris Indian Society was an Indian nationalist organisation founded in ______.", "opts": {"a": "1907", "b": "1905", "c": "1909", "d": "1900"}, "ans": "b", "exp": "1905 at Paris under the patronage of Madam Bhikaji Cama, Munchershah Burjorji Godrej and S. R. Rana. It was a branch of the Indian Home Rule Society which was established in London in 1905. Bhikaji Cama&#x27;s important publication is &#x27;Vande Mataram&#x27; (1909).", "t": 2, "s": 11}, {"n": 903, "tag": null, "stem": "Consider the following statements about Shyamji Krishna Verma and India House:<br>1. India House in London was established by Shyamji Krishna Verma in 1909.<br>2. He never founded the Indian Home Rule Society.<br>3. He became the first President of the Bombay Arya Samaj. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "None of the above"}, "ans": "c", "exp": "3 only. Shyamji Krishna Verma founded the Indian Home Rule Society and The Indian Sociologist (Journal) in London. He became the first President of Bombay Arya Samaj.", "t": 2, "s": 11}, {"n": 904, "tag": null, "stem": "Identify the freedom fighter who, as a child, hated going to school and found it suffocating and oppressive.", "opts": {"a": "Mahatma Gandhi", "b": "Jawaharlal Nehru", "c": "Jyotiba Phule", "d": "Rabindranath Tagore"}, "ans": "d", "exp": "Rabindranath Tagore . Rabindranath Tagore: Santiniketan (1901), Nobel Prize in Literature (1913, Gitanjali), composed Jana Gana Mana (India’s National Anthem) and Amar Shonar Bangla (Bangladesh’s National Anthem). Other Works: Manasi (1890) [The Ideal One], Sonar Tari (1894) [The Golden Boat], Gitimalya (1914) [Wreath of Songs], and Balaka (1916) [The Flight of Cranes].", "t": 2, "s": 11}, {"n": 905, "tag": null, "stem": "The claim for ‘swarajya’ or self-government within the British Empire, on the model of self-governing colonies like Australia and Canada, was put forward from the Congress platform in 1905 by:", "opts": {"a": "Lala Lajpat Rai", "b": "Dadabhai Naoroji", "c": "Bipin Chandra Pal", "d": "Gopal Krishna Gokhale"}, "ans": "d", "exp": "Gopal Krishna Gokhale  (Diamond of India) was Political Guru of Gandhi, Congress President (1905), established Servants of India Society in 1905, English Newspaper (The Hitavada), founded The Ranade Institute of Economics (1905), ‘Dharmatma Gokhale’ (Writer - Mahatma Gandhi).", "t": 2, "s": 11}, {"n": 906, "tag": null, "stem": "Consider the following statements about the Bhoodan Yojana (Land Gift) movement:<br>1. The Bhoodan Movement was launched by Mahatma Gandhi in 1931.<br>2. It was first started at Sevagram in Maharashtra.<br>3. The movement aimed to provide free education to rural children. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "None of the above"}, "ans": "d", "exp": "None of the above. Acharya Vinoba Bhave in 1951, the Bhoodan Movement (first started in Andhra Pradesh) was initiated at Pochampally village (Telangana). The Bhoodan movement attempted to persuade wealthy landowners to voluntarily give a percentage of their land to landless people.", "t": 2, "s": 11}, {"n": 907, "tag": null, "stem": "The first President of the All India Trade Union Congress was _________.", "opts": {"a": "C Rajagopalachari", "b": "Lala Lajpat Rai", "c": "Chandra Shekhar Azad", "d": "Motilal Nehru"}, "ans": "b", "exp": "Lala Lajpat Rai. All India Trade Union Congress, AITUC (created on October 31, 1920 in Bombay) is the first Central Trade Union of India and the second largest trade union federation in India after the Indian National Trade union Congress. In India, Trade Unions in India are registered under the Trade Union Act (1926).", "t": 2, "s": 11}, {"n": 908, "tag": null, "stem": "Consider the following statements regarding Dadabhai Naoroji:<br>1. He was the first Indian to become the Governor-General of India.<br>2. He was the first Indian to be selected to the British House of Commons on a Liberal Party ticket.<br>3. He was the founder of the Arya Samaj movement.<br>4. He was the first Indian to be appointed as the Vice-President of the Council of India. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "4 only"}, "ans": "b", "exp": "2 only. Dadabhai Naoroji was known as India Gladstone. The first attempt to calculate National Income of India was made by him. He was the first Asian (Indian) member of the British Parliament. He coined the name “Indian National Congress” (INC).", "t": 2, "s": 11}, {"n": 909, "tag": null, "stem": "Who among the following Indian freedom fighters was fondly called Gandhi Buri (Old Lady Gandhi) for her dedication towards Gandhian principles?", "opts": {"a": "Kamla Chaudhary", "b": "Leela Roy", "c": "Dakshayani Velayudhan", "d": "Matangini Hazra"}, "ans": "d", "exp": "Matangini Hazra . Matangini Hazra was an Indian revolutionary and social activist who participated in the Indian independence movement.", "t": 2, "s": 11}, {"n": 910, "tag": null, "stem": "Avadh Kisan Sabha was set up in the year ______.", "opts": {"a": "1918", "b": "1920", "c": "1921", "d": "1924"}, "ans": "b", "exp": "1920. Oudh Kisan Sabha (Oudh Farmers Association) was an association formed by Baba Ram Chandra. He was a trade unionist who organized the farmers of Oudh and led the first protest against the landlords.", "t": 2, "s": 11}, {"n": 911, "tag": null, "stem": "India and Pakistan had signed the ______, under which the two countries agreed to sort out differences and disputes bilaterally.", "opts": {"a": "Calcutta Pact", "b": "Shimla Pact", "c": "Lucknow Pact", "d": "Agra Pact"}, "ans": "b", "exp": "Shimla Pact was signed in 1972 by Zulfiqar Ali Bhutto, the President of Pakistan, and Indira Gandhi, the Prime Minister of India.", "t": 2, "s": 11}, {"n": 912, "tag": null, "stem": "Consider the following statements regarding the annexation of Hyderabad into India:<br>1. Operation Polo was the code name of the Hyderabad &quot;police action&quot; launched in September 1948.<br>2. The princely state of Hyderabad voluntarily merged into the Indian Union without any military intervention. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Operation Polo - The code name of the Hyderabad &quot;police action&quot; in September 1948. It was a military operation in which the Indian Armed Forces invaded the Nizam-ruled princely state, annexing it into the Indian Union.", "t": 2, "s": 11}, {"n": 913, "tag": null, "stem": "With whom is the &#x27;Patharughat Uprising&#x27; associated?", "opts": {"a": "Lawyers&#x27; uprising", "b": "Soldiers’ uprising", "c": "Teachers&#x27; uprising", "d": "Peasants’ uprising"}, "ans": "d", "exp": "Peasants’ uprising. It was against the tax policies of the British in 1894. Patharughat is a place in Assam and is currently known as Patharighat.", "t": 2, "s": 11}, {"n": 914, "tag": null, "stem": "The ______ movement was led by Chaudhary Devi Lal in 1987.", "opts": {"a": "Sangharsh Yudh", "b": "Insaaf Yudh", "c": "Maha Yudh", "d": "Nyaya Yudh"}, "ans": "d", "exp": "Nyaya Yudh . He founded the Lok Dal party.", "t": 2, "s": 11}, {"n": 915, "tag": null, "stem": "Chandernagore (Chandannagar) was a ______ colony captured by the British Navy on 23 March 1757.", "opts": {"a": "French", "b": "Dutch", "c": "Danish", "d": "Portuguese"}, "ans": "a", "exp": "French. Battle of Chandernagore (1757) <mark>- <\/mark>Between French and British (led by Robert Clive) during the Seven Years&#x27; War (1756-1763).", "t": 2, "s": 11}, {"n": 916, "tag": null, "stem": "In which of the following years did Japan invade India resulting in the Battle of Imphal?", "opts": {"a": "1944", "b": "1901", "c": "1862", "d": "1899"}, "ans": "a", "exp": "1944 . The outcome of the battle of Imphal was a turning point of one of the most gruelling campaigns of the Second World War (1939-45).", "t": 2, "s": 11}, {"n": 917, "tag": null, "stem": "Consider the following statements regarding the reorganisation of Bombay State:<br>1. The Bombay Reorganisation Act was passed in 1960, leading to the division of Bombay State into Gujarat and Maharashtra.<br>2. The division of Bombay State under the Act was based on religious differences between Hindus and Muslims. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. After this act, Bombay State was dissolved and split on linguistic lines into the two states of Gujarat (Gujarati speaking population) and Maharashtra (Marathi speaking population).", "t": 2, "s": 11}, {"n": 918, "tag": null, "stem": "Who among the following is one of the founder members of Bhartiya Jana Sangh?", "opts": {"a": "KM Munshi", "b": "Minoo Masani", "c": "Baldev Singh", "d": "Shyama Prasad Mukherjee"}, "ans": "d", "exp": "Shyama Prasad Mukherjee . BJS was an Indian right-wing political party that existed from 1951 to 1977 and was the political arm of Rashtriya Swayamsevak Sangh (RSS), a Hindu nationalist volunteer organization.", "t": 2, "s": 11}, {"n": 919, "tag": null, "stem": "A large area of land demarcated as Damin-i-Koh in 1832 was declared as the land of the ______.", "opts": {"a": "Warlis", "b": "Paharias", "c": "Murias", "d": "Santhals"}, "ans": "d", "exp": "Santhals (Tribal who inhabited the forest of Rajmahal hills). Damin-i-Koh - British promised non-interference in the land.", "t": 2, "s": 11}, {"n": 920, "tag": null, "stem": "Fort Saint Louis was a ______ fort that stood in Pondicherry on the eastern coast of India.", "opts": {"a": "French", "b": "Danish", "c": "Dutch", "d": "British"}, "ans": "a", "exp": "French.  Fort Saint Louis - Built by Francois Martin and Destroyed by the Britishers in 1761.", "t": 2, "s": 11}, {"n": 921, "tag": null, "stem": "What was the meaning of ‘Ryot’ in British records in the 18th century?", "opts": {"a": "Peasants", "b": "Weavers", "c": "Traders", "d": "Jobbers"}, "ans": "a", "exp": "Peasants. Ryots were Individual cultivators who had full rights regarding sale, transfer, and leasing of the land as long as they paid the rent under the Ryotwari system (Land revenue paid by the farmers directly to the state).", "t": 2, "s": 11}, {"n": 922, "tag": null, "stem": "Who was the Nawab of Bhopal that ruled from 1868 to 1901?", "opts": {"a": "Shah Jahan Begum", "b": "Begum Sajida Sultan", "c": "Sikander Jahan Begum", "d": "Sultan Kaikhusrau Jahan Begum"}, "ans": "a", "exp": "Shah Jahan Begum. Nawab of Bhopal that ruled – Nawab Sikandar Begum:- 1860-1868, Begum Sultan Shah Jehan:-1844-1860 and 1868-1901. Begum Kaikhusrau Jahan:- 1901-1926, Begum Sajida Sultan:- 1961-1995.", "t": 2, "s": 11}, {"n": 923, "tag": null, "stem": "Who among the following was one of the speakers after Jawaharlal Nehru to address the Parliament on the midnight of 15 August 1947 ?", "opts": {"a": "Rajendra Prasad", "b": "Sardar Vallabhbhai Patel", "c": "C Rajagopalachari", "d": "Sarvepalli Radhakrishnan"}, "ans": "d", "exp": "Dr. Sarvepalli Radhakrishan  (1st Vice President of India) was one of the three main speakers at the Central Hall of Parliament - Other than JL Nehru (Tryst with Destiny Speech) and Chaudhary Khaliquzaman.", "t": 2, "s": 11}, {"n": 924, "tag": null, "stem": "Who was the chairman of the Economic Programme Committee (EPC) that was formed by the All India Congress Committee in 1947?", "opts": {"a": "Purshottamdas Thakurdas", "b": "Jawaharlal Nehru", "c": "Dadabhai Naoroji", "d": "Subhash Chandra Bose"}, "ans": "b", "exp":
