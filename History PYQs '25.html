ranian poet. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Hafiz actually lived in the 14th century, not the 15th century, and he was an Iranian poet.", "t": 1, "s": 18}, {"n": 533, "tag": null, "stem": "In the context of Sufi traditions, what is the meaning of the word &#x27;sama&#x27;?", "opts": {"a": "recitation of sacred songs", "b": "Magical feat", "c": "disciple", "d": "Ashram"}, "ans": "a", "exp": "recitation of sacred songs.  <mark>Sufism ( <\/mark>tasawwuf) is a mystic sect of Islam that emphasizes introspection and spiritual closeness with God.", "t": 1, "s": 18}, {"n": 534, "tag": null, "stem": "_____was one of the first Indian rulers to lead an armed rebellion against the British East India Company in 1824 against the implementation of the Doctrine of Lapse.", "opts": {"a": "Kittur Chennamma", "b": "Titumir", "c": "Jayi Rajaguru", "d": "Pazhassi Raja"}, "ans": "a", "exp": "Kittur Chennamma was one of the first Indian rulers to lead an armed rebellion against the British East India Company in 1824 against the implementation of the Doctrine of Lapse.", "t": 1, "s": 18}, {"n": 535, "tag": null, "stem": "&#x27;Rang Ghar&#x27;, one of Asia&#x27;s oldest amphitheatres, was built by the king of the _____dynasty.", "opts": {"a": "Sen", "b": "Ahom", "c": "Mughal", "d": "Gupta"}, "ans": "b", "exp": "Ahom Dynasty.  Rang Ghar, constructed by the Ahom King Swargadeo Promotta Singha.", "t": 1, "s": 18}, {"n": 536, "tag": null, "stem": "Consider the following statements regarding Pushtimarg:<br>1. Vallabhacharya founded the Krishna-centered Pushtimarg sect of Vaishnavism.<br>2. Pushtimarg is a form of Krishna worship for adoration. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Vallabhacharya established Pushtimarg, which focuses on devotion and adoration of Krishna.", "t": 1, "s": 18}, {"n": 537, "tag": null, "stem": "Who among the following was the founder of the Suryavamsi Gajapati dynasty that ruled parts of Orissa and Andhra Pradesh in the 15th century ?", "opts": {"a": "Bhanu Deva", "b": "Vasu Deva", "c": "Surendra Deva", "d": "Kapilendra Deva"}, "ans": "d", "exp": "Kapilendra Deva was the founder of the Suryavamsi Gajapati dynasty that ruled parts of Orissa and Andhra Pradesh in the 15th century (1434–66 CE).", "t": 1, "s": 18}, {"n": 538, "tag": null, "stem": "Who among the following was the Nizam of Hyderabad in 1947 ?", "opts": {"a": "Mir Mahbub Ali Khan", "b": "Osman Ali", "c": "Akbar Ali Khan", "d": "Nasir Jung"}, "ans": "b", "exp": "Osman Ali . He was the last Nizam (ruler) of the Princely State of Hyderabad. He ruled the Kingdom of Hyderabad between 1911 and 1948.", "t": 1, "s": 18}, {"n": 539, "tag": null, "stem": "Which of the following is the meaning of ‘Pishtaq’ in the context of medieval Indo-Islamic Architecture ?", "opts": {"a": "Dome", "b": "Tall gateway", "c": "True arch", "d": "Water tank"}, "ans": "b", "exp": "tall gateway. Pishtaq is a Persian/Farsi word that means ‘front of arch’. It is a rectangular frame around an arched opening of a building like mosques and palaces.", "t": 1, "s": 18}, {"n": 540, "tag": null, "stem": "Consider the following statements regarding the origin of Islam:<br>1. Prophet Muhammad founded the faith of Islam in the 6th century CE.<br>2. Islam is the second-largest religion in the world.<br>3. Christianity is the largest religion in the world. Which of the statements given above is/are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "2 and 3 only. Prophet Muhammad actually founded Islam in the 7th century CE, not the 6th century. Islam is the world’s second-largest religion after Christianity.", "t": 1, "s": 18}, {"n": 541, "tag": null, "stem": "Who among the following was appointed as the curator of ancient monuments in 1880 ?", "opts": {"a": "Alfred Foucher", "b": "HH Cole", "c": "John Marshall", "d": "Rajendra Lal Mitra"}, "ans": "b", "exp": "HH Cole . He was a British civil servant and inventor who facilitated many innovations in commerce and Education.", "t": 1, "s": 18}, {"n": 542, "tag": null, "stem": "Who among the following was a Portuguese writer who wrote about the trade and society in South India?", "opts": {"a": "Niccolao Manucci", "b": "Francois Bernier", "c": "Jean-Baptiste Tavernier", "d": "Duarte Barbosa"}, "ans": "d", "exp": "Duarte Barbosa was the Portuguese writer who visited India during (1500-1516) and wrote about the trade and society in South India in his manuscript, ‘The Book of Duarte Barbosa’.", "t": 1, "s": 18}, {"n": 543, "tag": null, "stem": "Who among the following was the first Portuguese viceroy of India ?", "opts": {"a": "Alfonso de Albuquerque", "b": "Duarte de Menezes", "c": "Francisco de Almeida", "d": "Lopo Soares de Albergaria"}, "ans": "c", "exp": "Francisco de Almeida was the first Portuguese viceroy of India in 1505. He was given the credit of Portuguese possession in India. His policy was to maintain a strong naval army over the Indian ocean. Portuguese Governor Afonso de Albuquerque captured Goa from the Adil Shahis in 1510 AD.", "t": 1, "s": 18}, {"n": 544, "tag": null, "stem": "Consider the following statements regarding the Revolt of 1857:<br>1. The sepoys at Meerut began their march to Delhi on 19 April 1857.<br>2. Lord Canning was the Governor-General of India during the Revolt of 1857. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. The Meerut sepoys actually marched to Delhi on 10 May 1857, not 19 April.", "t": 2, "s": 0}, {"n": 545, "tag": null, "stem": "The revolution of 1857 started in May from which of the following cantonments in India ?", "opts": {"a": "Kanpur", "b": "Jhansi", "c": "Lucknow", "d": "Meerut"}, "ans": "d", "exp": "Meerut. The 1857 Revolution, also known as the Indian Mutiny, began in Meerut on May 10 and spread to Delhi, Agra, Kanpur, and Lucknow. It was suppressed after the rebels were defeated in Gwalior on June 20, 1858.", "t": 2, "s": 0}, {"n": 546, "tag": null, "stem": "Consider the following statements regarding the Revolt of 1857:<br>1. Rani Lakshmibai of Jhansi died fighting against the British at Kanpur.<br>2. Begum Hazrat Mahal played a prominent role in organizing the revolt in Awadh. Which of the above statement(s) is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Statement 1 is incorrect: Rani Lakshmibai did not die at Kanpur; she died fighting heroically at Gwalior in June 1858.", "t": 2, "s": 0}, {"n": 547, "tag": null, "stem": "Which military officer led the British forces in the Battle of Chinhat fought in 1857 ?", "opts": {"a": "Robert Maclagan", "b": "Charles Ellice", "c": "Henry Lawrence", "d": "James George Smith"}, "ans": "c", "exp": "Henry Lawrence. The Battle of Chinhat took place on the morning of June 30, 1857, near the village of Chinhat in Awadh (now Uttar Pradesh), specifically at Ismailganj, where British forces clashed with Indian rebels during the Indian Rebellion of 1857.", "t": 2, "s": 0}, {"n": 548, "tag": null, "stem": "Match the following leaders with the regions they led during the Revolt of 1857: Leaders Region of Revolt<br>A. Rani Lakshmibai 1. Bihar<br>B. Kunwar Singh 2. Jhansi<br>C. Begum Hazrat 3. Lucknow Mahal<br>D. Nana Saheb 4. Kanpur", "opts": {"a": "A-2, B-1, C-3, D-4", "b": "A-3, B-2, C-4, D-1", "c": "A-4, B-3, C-1, D-2", "d": "A-1, B-4, C-2, D-3"}, "ans": "a", "exp": "A-2, B-1, C-3, D-4 ", "t": 2, "s": 0}, {"n": 549, "tag": null, "stem": "Nana Sahib, a rebel at Kanpur was the son of which of the following Peshwas ?", "opts": {"a": "Baji Rao I", "b": "Balaji Baji Rao", "c": "Baji Rao II", "d": "Balaji Vishwanath"}, "ans": "c", "exp": "Bajirao II (10 January 1775 – 28 January 1851) was the last Peshwa of the Maratha Empire.", "t": 2, "s": 0}, {"n": 550, "tag": null, "stem": "Assertion (A): Bahadur Shah II contributed to the Revolt of 1857.<br><b>Reason (R): <\/b>He was the last Mughal emperor and was deposed and exiled by the British after the revolt.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, R is false", "d": "A is false, R is true"}, "ans": "a", "exp": "Both A and R are true, but R  <mark>is the correct explanation of A. <\/mark>Bahadur Shah II, also known as Bahadur Shah Zafar, was the twentieth and final Mughal Emperor of India. During the Revolt of 1857, he played a symbolic role as a leader for the Indian rebels. Following the suppression of the uprising, the British deposed him from the throne and sent him into exile in Rangoon, where he spent the remaining years of his life away from his kingdom and authority.", "t": 2, "s": 0}, {"n": 551, "tag": null, "stem": "The sepoys of Meerut arrived at the Gates of Red Fort to meet the Mughal emperor, Bahadur Shah on _______.", "opts": {"a": "11 March, 1857", "b": "10 March, 1857", "c": "10 May, 1857", "d": "11 May, 1857"}, "ans": "d", "exp": "11 May, 1857. On 10 May 1857, the revolt broke out at Meerut, where sepoys killed many British officers and declared open rebellion. The very next day, i.e., on 11 May 1857, they marched to Delhi and reached the Red Fort. There they declared Bahadur Shah Zafar, the last Mughal emperor, as the leader of the revolt. This marked the symbolic beginning of the Revolt of 1857 at a national scale.", "t": 2, "s": 0}, {"n": 552, "tag": null, "stem": "Whose proclamation of November 1, 1858 declared that thereafter India would be governed by and in the name of the British Monarch through a Secretary of State ?", "opts": {"a": "King Louis’", "b": "King Philips’", "c": "Queen Victoria’s", "d": "Queen Elizabeth’s"}, "ans": "c", "exp": "Queen Victoria’s. Issued on 1 November 1858 after the Revolt of 1857, it ended the East India Company’s rule and transferred power to the British Crown. India would henceforth be governed in the name of Queen Victoria through the new office of Secretary of State for India, marking the start of Direct British Crown Rule (1858–1947).", "t": 2, "s": 0}, {"n": 553, "tag": null, "stem": "Consider the following statements regarding the Permanent Settlement introduced by Lord Cornwallis in 1793:<br>1. Under this system, zamindars were recognized as the owners of the land.<br>2. The Permanent Settlement was never extended to Punjab. Which of the above statement(s) is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Statement 2 is correct: The system was implemented in Bengal, Bihar, and parts of Odisha, but never extended to Punjab.", "t": 2, "s": 1}, {"n": 554, "tag": null, "stem": "Who among the following devised the system of ‘Subsidiary Alliance’ ?", "opts": {"a": "Lord Wellesley", "b": "Lord Canning", "c": "Lord William Bentinck", "d": "Lord Dalhousie"}, "ans": "a", "exp": "Lord Wellesley : He devised the Subsidiary Alliance as a system in 1798. Under this system, Indian rulers were required to maintain British forces within their territory and adhere to British political advice. States that accepted the alliance included Hyderabad (1798), Mysore (1799), Awadh (1801), Peshwa (1802), Bhosle and Scindia (1803).", "t": 2, "s": 1}, {"n": 555, "tag": null, "stem": "Consider the following statements:<br><b>Assertion (A): <\/b>Raja Ram Mohan Roy played a major role in the abolition of the practice of Sati.<br><b>Reason (R): <\/b>Lord William Bentinck, as Governor-General, passed the Bengal Sati Regulation Act in 1829, which legally banned Sati in British India.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "Lord William Bentinck appointed Governor of Madras in 1803, he later became Governor-General in 1828. On December 4, 1829, he enacted the Bengal Sati Regulation, which formally abolished the practice of Sati across British India.", "t": 2, "s": 1}, {"n": 556, "tag": null, "stem": "The Doctrine of Lapse was an annexation policy devised by which of the following Governor-Generals of India?", "opts": {"a": "Lord Wellesley", "b": "Lord Dalhousie", "c": "Lord Mayo", "d": "Lord Canning"}, "ans": "b", "exp": "Lord Dalhousie. The Doctrine of Lapse was an annexation policy used by the British East India Company to expand its empire in India. Under this policy, if a ruler of a dependent state died without a male heir, the state would be annexed by the British. States annexed under the policy: Satara (1848), Jaitpur and Sambalpur (1849), Baghat (1850), Udaipur (1852), Jhansi (1854), Nagpur (1854), Tanjore, and Arcot (1855).", "t": 2, "s": 1}, {"n": 557, "tag": null, "stem": "Match the following personalities with their contributions in British India: List I List II (Contribution)<br>A. Robert 1. First Surveyor General Clive of Bengal, prepared Bengal Atlas (1779)<br>B. Warren 2. Served twice as Hastings Governor of Bengal and led the Battle of Plassey (1757)<br>C. James 3. Governor-General Rennel credited with administrative and judicial reforms D.Lord 4. Governor-General Dalhousie associated with major reforms and expansion policies", "opts": {"a": "A–2, B–3, C–1, D–4", "b": "A–3, B–2, C–4, D–1", "c": "A–1, B–4, C–2, D–3", "d": "A–4, B–1, C–3, D–2"}, "ans": "a", "exp": "A–2, B–3, C–1, D–4. Robert Clive served twice as Governor of Bengal (1758–60 and 1764–67) and led the Battle of Plassey for the British East India Company in 1757. James Rennel, the first Surveyor General of Bengal (1767–1777), carried out the first major geographical survey of India. He is renowned for his Bengal Atlas (1779) and Memoir of a Map of Hindoostan (1782).", "t": 2, "s": 1}, {"n": 558, "tag": null, "stem": "The Daroga system in 1792 was introduced by whom among the following Governor- Generals in India ?", "opts": {"a": "Lord Cornwallis", "b": "Lord Minto", "c": "Lord Mayo", "d": "Lord William Bentinck"}, "ans": "a", "exp": "Lord Cornwallis (1786-93): The system of Daroga as part of Police reforms. Police of each district were placed under District Judge. Each district was divided into Thanas/Police circles which were headed by Daroga. He also abolished District Faujdari Courts and set up circuit courts in Calcutta, Dacca, Murshidabad, and Patna. During his tenure, the Third Mysore War (1790-92) and Treaty of Seringapatam (1792).", "t": 2, "s": 1}, {"n": 559, "tag": null, "stem": "Who is called the father of Local Self - Government in India ?", "opts": {"a": "Lord Cornwallis", "b": "Lord Wellesley", "c": "Lord Ripon", "d": "Lord William Bentinck"}, "ans": "c", "exp": "Lord Ripon. During Lord Ripon’s tenure (1880-84), key reforms included the repeal of the Vernacular Press Act (1881) and a resolution on local self-government (1882). His period also saw the Ilbert Bill controversy (1883) and the formation of the Hunter Commission on Education (1882).", "t": 2, "s": 1}, {"n": 560, "tag": null, "stem": "Which of the following Governor-Generals of British India was in favour of free press and repealed the press regulations of 1823 ?", "opts": {"a": "Lord Ellenborough", "b": "Lord Lytton", "c": "Lord Ripon", "d": "Lord Metcalfe"}, "ans": "d", "exp": "Lord Metcalfe (1835-36) is also known as the Liberator of Indian Press. Licensing Regulation ordinance 1823 was brought out by acting Governor-General John Adams. Other Governor generals: Lord Ellenborough (1842–1844) abolished the slavery act in India in 1843.", "t": 2, "s": 1}, {"n": 561, "tag": null, "stem": "Consider the following statements:<br>1. Lord Dalhousie is regarded as the father of Indian Railways.<br>2. The first railway line in India was opened in 1853 between Bombay and Thane, covering 21 miles (34 km).<br>3. The first railway line in South India was opened in 1856. Which of the above statements are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 4 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "d", "exp": "1, 2 and 3. Lord Dalhousie (1848–1856), regarded as the father of Indian Railways, was instrumental in developing the railway network. The first railway line in India ran 21 miles (34 km) from Bombay to Thane. The first railway line in South India was inaugurated in 1856. India’s first Railway Minister was John Mathai.", "t": 2, "s": 1}, {"n": 562, "tag": null, "stem": "In the context of British rule in India, who among the following Governor - Generals created a professional cadre of company servants making provisions for them for generous salaries ?", "opts": {"a": "Lord Mayo", "b": "Lord Cornwallis", "c": "Lord Dalhousie", "d": "Warren Hastings"}, "ans": "b", "exp": "Lord Cornwallis (1786 -  <mark>1793) <\/mark>. He is also regarded as the &#x27;Father of Civil Service in India&#x27; for his role in shaping the civil service system. Lord Mayo, Viceroy of India from 1869 to 1872, is known for introducing the first regular census in 1872.", "t": 2, "s": 1}, {"n": 563, "tag": null, "stem": "Consider the following statements about the Victoria Memorial Hall in Kolkata:<br>1. Lord Curzon entrusted William Emerson as its architect.<br>2. The foundation stone was laid by the Prince of Wales in 1906.<br>3. It was completed and opened to the public in 1921.<br>4. It was built to commemorate Queen Victoria’s reign in India. Which of the above statements are true ?", "opts": {"a": "1, 2 and 3 only", "b": "2, 3 and 4 only", "c": "1, 2, 3 and 4", "d": "1 and 4 only"}, "ans": "c", "exp": "1, 2, 3 and 4. The Victoria Memorial, constructed between 1906 and 1921 in Kolkata, West Bengal, was envisioned by Viceroy George Curzon to honor Queen Victoria&#x27;s 25-year reign in India. Its foundation stone was laid in 1906 by the Prince of Wales, later King George V, and it was inaugurated for the public in 1921.", "t": 2, "s": 1}, {"n": 564, "tag": null, "stem": "Who among the following was the Viceroy of British India when the Shimla conference was held in 1945 ?", "opts": {"a": "Lord Linlithgow", "b": "Lord Willingdon", "c": "Lord Irwin", "d": "Lord Wavell"}, "ans": "d", "exp": "Lord Wavell (1944 to 1947) <mark>. <\/mark> The Shimla Conference was held from June 25 to July 14, 1945, at Viceregal Lodge in Shimla, India.", "t": 2, "s": 1}, {"n": 565, "tag": null, "stem": "Match List-I with List-II. <b>List-I List-II <\/b> <b>(Governor General) (Period) <\/b><br>A. Warren Hasting 1. 1772-1785<br>B. Lord Cornwallis 2. 1786-1793<br>C. Sir John Shore 3. 1793-1798<br>D. Lord Wellesley 4. 1798-1805", "opts": {"a": "A – 4, B – 3, C – 2, D – 1", "b": "A – 2, B – 1, C – 4, D – 3", "c": "A – 1, B – 2, C – 3, D – 4", "d": "A – 2, B – 1, C – 3, D – 4"}, "ans": "c", "exp": "A – 1, B – 2, C – 3, D – 4.  The first Governor of Bengal - Robert Clive. The first Governor General of Bengal in 1773 - Warren Hastings (1772-1785). The first Governor General of India - William Bentinck. The first Viceroy of India - Lord Canning.", "t": 2, "s": 1}, {"n": 566, "tag": null, "stem": "Identify the INCORRECTLY matched pair(s) of the British Governor - Generals of India and the events with which they are associated.<br>i) Lord Dalhousie - Revolt of 1857<br>ii) Lord Auckland - First Afghan War<br>iii) Lord Canning - Wood’s Despatch 1854", "opts": {"a": "Only (ii) and (iii)", "b": "Only (ii)", "c": "Only (i) and (iii)", "d": "Only (i)"}, "ans": "c", "exp": "Only (i) and (iii). Governor general and the related events: Lord Dalhousie (1848-1856) - Doctrine of Lapse policy, Wood’s Despatch 1854. Lord Cornwallis (1786 - 1793) - Introduction of the Charter Act of 1793, the Third Anglo-Mysore War began and ended with the Treaty of Seringapatam. Warren Hastings (1772 - 1785) - Introduction of the Regulating Act of 1773 by the British Parliament, First Anglo-Maratha War began (ended with the Treaty of Salbai). Lord Wellesley (1798–1805) - The Second Anglo - Maratha War began and ended with multiple treaties.", "t": 2, "s": 1}, {"n": 567, "tag": null, "stem": "English as the official language of India for higher education was incorporated in the resolution formulation by _______.", "opts": {"a": "Lord Hastings", "b": "Lord Wellesley", "c": "Lord Macaulay", "d": "Lord Dalhousie"}, "ans": "c", "exp": "Lord Macaulay - Considered to be the founder of the British education system in India. He was also the chairman of the first Law Commission of pre - independent India.", "t": 2, "s": 1}, {"n": 568, "tag": null, "stem": "The Vernacular Press Act was enacted during the regime of which viceroy of India?", "opts": {"a": "Lord Dalhousie", "b": "Lord Hastings", "c": "Lord Ripon", "d": "Lord Lytton"}, "ans": "d", "exp": "Lord Lytton (1876-1880) <mark>. <\/mark> Vernacular Press Act (The gagging Act) 1878. The act allows the government to confiscate the assets of newspaper in case of publishing anything “objectionable”", "t": 2, "s": 1}, {"n": 569, "tag": null, "stem": "Consider the following statements:<br>1. The Tripartite Treaty was signed between Lord Auckland, Maharaja Ranjit Singh, and Shah Shuja.<br>2. Lord Mayo signed the treaty on behalf of the British Government. Which of the statements given above is/are incorrect ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "Only 2. The treaty was actually signed by Lord Auckland, not Lord Mayo.", "t": 2, "s": 1}, {"n": 570, "tag": null, "stem": "Which of the following Commissions was appointed by Lord Curzon to enquire into the working of the police administration ?", "opts": {"a": "Kitchener Commission", "b": "Hunter Commission", "c": "Frazer Commission", "d": "MacDonnell Commission"}, "ans": "c", "exp": "Frazer Commission (The Indian Police Commission of 1902-03 <mark>) <\/mark>- Established by the British. Headed by - Sir Andrew Frazer and Lord Curzon.", "t": 2, "s": 1}, {"n": 571, "tag": null, "stem": "Who among the following has been accused of committing the judicial murder of Raja Nand Kumar ?", "opts": {"a": "Lord Wellesley", "b": "Lord Dalhousie", "c": "Lord Cornwallis", "d": "Warren Hastings"}, "ans": "d", "exp": "Warren Hastings. Raja Nand Kumar (Nuncomar) was an Indian tax collector and he was the first Indian to be executed by hanging.", "t": 2, "s": 1}, {"n": 572, "tag": null, "stem": "_____announced the bifurcation of the British Indian Empire into a secular India and Islamic Pakistan.", "opts": {"a": "Lord Ripon", "b": "Lord Dalhousie", "c": "Lord Louis Mountbatten", "d": "Lord Curzon"}, "ans": "c", "exp": "Lord Louis Mountbatten (last Viceroy of India) <mark>. <\/mark>", "t": 2, "s": 1}, {"n": 573, "tag": null, "stem": "Consider the following statements about Mountstuart Elphinstone:<br>1. He introduced the Elphinstone Code, a uniform scheme of criminal law.<br>2. He served as the Governor of Bengal from 1819 to 1827. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. While Mountstuart Elphinstone made significant contributions to law and administration in India, particularly in Bombay, the &quot;Elphinstone Code&quot; generally refers to his legal reforms and codified regulations for the Bombay Presidency, not a uniform scheme of criminal law across all of British India. It was more about civil administration and justice in his specific jurisdiction. Mountstuart Elphinstone served as the Governor of Bombay from 1819 to 1827. He was never the Governor of Bengal.", "t": 2, "s": 1}, {"n": 574, "tag": null, "stem": "The Viceroy who took keen interest in the restoration and protection of historical monuments was .", "opts": {"a": "Lord Ellenborough", "b": "Lord Auckland", "c": "Lord Lytton", "d": "Lord Curzon"}, "ans": "d", "exp": "Lord Curzon (1899-1905) <mark>: <\/mark> Passed the Ancient Monuments Preservation Act in 1904. Archaeological Survey of India (ASI) - Founded in 1861 by Alexander Cunningham; Headquarters: New Delhi. Lord Ellenborough (1842-1844) - Annexation Of Sindh (1843). Lord Auckland (1836 - 1842) - The first Anglo-Afghan war occurred during his reign. Lord Lytton (1876-1880) - The Great Indian Famine of 1876-1878.", "t": 2, "s": 1}, {"n": 575, "tag": null, "stem": "Consider the following statements:<br><b>Assertion (A): <\/b>The Dual System of Government in Bengal was introduced in 1765.<br><b>Reason (R): <\/b>Lord Clive devised this system, under which the Company held Diwani rights (revenue collection), while the Nawab retained Nizamat rights (administration).", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "The policy of Dual System of Government in Bengal was introduced by Lord Clive in 1765 after the Company secured the Diwani rights from the Mughal emperor Shah Alam II. Under this arrangement, the East India Company acquired the right to collect revenue (Diwani), while the Nawab retained the responsibility of administration and justice (Nizamat). This created a dual structure where real power rested with the Company, but responsibility was left with the Nawab. The system led to widespread corruption and misrule, and it was finally abolished by Warren Hastings in 1772.", "t": 2, "s": 1}, {"n": 576, "tag": null, "stem": "Governor general Lord Dalhousie described the Kingdom of___&quot;as a cherry that will drop into our mouth one day&quot;.", "opts": {"a": "Ahom", "b": "Mysore", "c": "Awadh", "d": "Maratha"}, "ans": "c", "exp": "Awadh. Lord Dalhousie said this in 1851. Awadh Kingdom was formally annexed to the British Empire in 1856. The doctrine declared that if an Indian ruler died without a male heir his kingdom would “lapse” <mark>, <\/mark>that is, become part of Company territory", "t": 2, "s": 1}, {"n": 577, "tag": null, "stem": "Under____(Governor General from 1813 to 1823) a new policy of &quot;paramountcy&quot; was initiated. Now the Company claimed that its authority was paramount or supreme, hence its power was greater than that of Indian states.", "opts": {"a": "Lord Amherst", "b": "Lord Cornwallis", "c": "Lord Hastings", "d": "Lord Auckland"}, "ans": "c", "exp": "Lord Hastings ( Anglo-Nepal War took place between 1814 and 1816 <mark>). <\/mark>", "t": 2, "s": 1}, {"n": 578, "tag": null, "stem": "“A History of British India” is a work published by ______.", "opts": {"a": "Lord Canning", "b": "Lord Dalhousie", "c": "James Mill", "d": "Warren Hastings"}, "ans": "c", "exp": "James Mill in 1817, a Scottish economist and political philosopher, published a massive three-volume work &quot;The History of British India&quot;. In his book history was divided into three periods: Hindu, Muslim, and British.", "t": 2, "s": 1}, {"n": 579, "tag": null, "stem": "In 1856, Governor-General____ decided that Bahadur Shah Zafar would be the last Mughal king and after his death none of his descendants would be recognised as kings – they would just be called princes.", "opts": {"a": "Canning", "b": "Cornwallis", "c": "Hastings", "d": "Munro"}, "ans": "a", "exp": "Lord Canning (1856-1862) - (Last Governor-General and first viceroy of India) - introduced Indian Penal Code (IPC), withdrew Doctrine of Lapse.", "t": 2, "s": 1}, {"n": 580, "tag": null, "stem": "Which of the following statements is correct ?<br>I. Robert Clive had come to Madras from England in 1743 at the age of 18.<br>II. After the battle of Buxar, the East India Company appointed Residents in Indian states.", "opts": {"a": "Only I", "b": "Neither I nor II", "c": "Only II", "d": "Both I and II"}, "ans": "d", "exp": "Both I and II. Robert Clive was a soldier and first British administrator of Bengal, who was one of the creators of British power in India.", "t": 2, "s": 1}, {"n": 581, "tag": null, "stem": "Which of the following British officers issued the infamous ‘crawling order’ whereby Indians had to crawl on all fours to pass an alley ?", "opts": {"a": "General Dyer", "b": "Warren Hastings", "c": "Lord Irwin", "d": "Lord Curzon"}, "ans": "a", "exp": "General Dyer . He was responsible for the Jallianwala Bagh massacre in Amritsar.", "t": 2, "s": 1}, {"n": 582, "tag": null, "stem": "Which of the following Viceroys of India addressed the Bengal famine of 1943 by ordering the army to distribute relief supplies to the starving rural Bengalis ?", "opts": {"a": "Lord Wavell", "b": "Lord Mountbatten", "c": "Lord Willington", "d": "Lord Linlithgow"}, "ans": "d", "exp": "Lord Linlithgow was the viceroy of India during the Bengal famine 1943. It is believed that the Bengal famine of 1943 which is estimated to have killed up to three million people was not caused by drought but instead was a result of a &quot;complete policy failure&quot; of the then-British Prime Minister Winston Churchill.", "t": 2, "s": 1}, {"n": 583, "tag": "SSC Stenographer 7/08/2025 (Shift 3)", "stem": "Consider the following statements comparing the Simon Commission (1927) and the Nehru Report (1928):<br>1. The Simon Commission was boycotted by Indian political parties primarily due to its all-Indian composition.<br>2. The Nehru Report proposed complete independence for India as its immediate objective. Which of the above is/are correct ?", "opts": {"a": "Neither 1 nor 2", "b": "1 only", "c": "2 only", "d": "Both 1 and 2"}, "ans": "a", "exp": "Neither 1 nor 2. The Simon Commission, set up in 1927, was boycotted by Indian political parties not because it had an all-Indian composition but because it had no Indian members at all, which was seen as a complete disregard for Indian voices. On the other hand, the Nehru Report of 1928 did not demand complete independence; instead, it proposed Dominion status, meaning India would remain under the British Crown but with self-governance.", "t": 2, "s": 2}, {"n": 584, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Given below are assertion and reason, read the statements and choose the correct option.<br><b>Assertion: <\/b>British capital accumulation in the 18th century was reinvested in industrial development.<br><b>Reason: <\/b>The capital was largely controlled by merchants and industrialists instead of the feudal aristocracy.", "opts": {"a": "Both Assertion (A) and Reason (R) are true, and R is not the correct explanation of A.", "b": "A is false, but R is true.", "c": "A is true, but R is false.", "d": "Both Assertion (A) and Reason (R) are true, and R is the correct explanation of A."}, "ans": "d", "exp": "In 18th-century Britain, wealth accumulated through colonial trade, including profits from India and the Atlantic system, was reinvested into industries like textiles, coal, and iron. Unlike feudal aristocrats, who spent wealth on land and luxury, merchants and industrialists directed their capital into productive enterprises. This shift in control of resources enabled the Industrial Revolution.", "t": 2, "s": 2}, {"n": 585, "tag": null, "stem": "Consider the following statements regarding the Caste Disabilities Removal Act (Lex Loci Act) of 1850:<br>1. The Act gave converts to Christianity the right to inherit ancestral property.<br>2. The Act was passed during British Crown Rule in India. Which of the above statement(s) is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Statement 2 is incorrect: The Act was passed in 1850 under the administration of the East India Company, not during British Crown Rule (which began in 1858).", "t": 2, "s": 2}, {"n": 586, "tag": null, "stem": "What was the term of the Central Legislative Assembly under the Government of India Act of 1919 ?", "opts": {"a": "Three year", "b": "Five year", "c": "Two year", "d": "Seven year"}, "ans": "a", "exp": "Three year. The elections to the two Houses of the Indian Legislature were held under the Government of India Act, 1919, and the new Legislative Assembly was inaugurated on 9 February 1921. The First and the Second Assemblies were dissolved within their life term of three years. The life of the Third, Fourth and the Fifth Assemblies were extended beyond their normal terms. The Fifth Assembly had the longest inning of ten years. The Sixth Assembly 1946-1947 was, in fact, not dissolved but automatically ceased to exist on 14 August 1947 under section 8 of the Indian Independence Act, 1947.", "t": 2, "s": 2}, {"n": 587, "tag": null, "stem": "Consider the following statements:<br><b>Assertion (A): <\/b>The Trade Disputes Act of 1929 provided for a system of tribunals to settle industrial disputes.<br><b>Reason (R): <\/b>The Act also imposed a ban on strikes in certain public utility services.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "b", "exp": "The Trade Disputes Act, 1929 was a law that aimed to resolve industrial disputes by establishing tribunals to investigate and settle them. Government of India Act, 1912 related to the appointment of a separate Governor of Bengal Province. The Age of Consent Act, 1891 raised the age for the consummation of marriage for women to 12 years. Indian Partnership Act, 1932 define and amend the Law Relating to Partnership.", "t": 2, "s": 2}, {"n": 588, "tag": null, "stem": "Under which of the following Acts was the power to rule India, transferred from the English East India Company to the British Crown ?", "opts": {"a": "Charter Act of 1833", "b": "Regulating Act 1773", "c": "Pitt&#x27;s India Act 1784", "d": "Government of India Act 1858"}, "ans": "d", "exp": "Government of India Act  <mark>1858 <\/mark>had the following key provisions : The English East India Company was abolished, and India came directly under British Crown rule. A new position, the Secretary of State for India, was created in the British government to manage Indian affairs. A 15-member council was established to assist the Secretary of State.", "t": 2, "s": 2}, {"n": 589, "tag": null, "stem": "With reference to Morley-Minto Reforms of 1909, consider the following statements. (a) They are also called the Indian Councils Act, 1909. (b) They increased the strength of Legislative Councils. (c) The right to separate the electorate was given to the Muslims. Which of the above statements is/are correct ?", "opts": {"a": "b, c", "b": "a, b, c", "c": "c, a", "d": "a, b"}, "ans": "b", "exp": "a, b, c. The Indian Councils Act of 1909 was introduced by the British government in India as a step toward including Indians in governance. Named after Viceroy Lord Minto and Secretary of State John Morley, the Act considerably increased the size of the legislative councils, both at the Central and provincial levels. The number of members in the Central Legislative Council was raised from 16 to 60. The act declared Delhi as the capital of British India in place of Calcutta.", "t": 2, "s": 2}, {"n": 590, "tag": null, "stem": "Consider the following statements:<br><b>Assertion (A): <\/b>Wood’s Dispatch of 1854 is often regarded as the “Magna Carta of English Education in India.”<br><b>Reason (R): <\/b>It laid down a comprehensive plan for educational reform, recommending vernacular languages at the primary level, English and vernacular at the secondary level, and English at the college level.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "The Wood&#x27;s Despatch of 1854 was a formal letter sent by Sir Charles Wood to Lord Dalhousie, the Governor-General of India, that outlined a plan for educational reform in India. It recommended that primary schools use vernacular languages, secondary schools use both English and vernacular languages, and colleges use English. It is often referred to as the “Magna Carta of English Education in India.”", "t": 2, "s": 2}, {"n": 591, "tag": null, "stem": "Under which of the following Acts, the Board of Control was established in England to control and supervise the administration of British India ?", "opts": {"a": "Charter Act of 1813", "b": "Regulating Act of 1773", "c": "Charter Act of 1793", "d": "Pitt’s India Act of 1784"}, "ans": "d", "exp": "Pitt’s India Act of 1784. It was introduced during the tenure of Lord Warren Hastings against the backdrop of growing concerns about the East India Company&#x27;s mismanagement and corruption in India. Provisions: It gave the British government control over the East India Company. The Act was also called ‘half-loaf system.", "t": 2, "s": 2}, {"n": 592, "tag": null, "stem": "Consider the following statements regarding constitutional developments in British India:<br>1. The Government of India Act, 1919 introduced the system of dyarchy in provinces.<br>2. The Indian Councils Act, 1909 introduced separate electorates for Hindus.<br>3. The Government of India Act, 1935 introduced provincial autonomy by ending dyarchy. Which of the above statements are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "c", "exp": "1 and 3 only. Statement 2 – Incorrect: 1909 Act introduced separate electorates for Muslims, not Hindus.", "t": 2, "s": 2}, {"n": 593, "tag": null, "stem": "Which Act was passed by the British Parliament in the year 1773 AD to regulate the activities of the East India Company ?", "opts": {"a": "Pitt’s India Act", "b": "Indian Slavery Act", "c": "Age of Consent Act", "d": "Regulating Act"}, "ans": "d", "exp": "Regulating Act. This Act was passed in June 1773. It was a response to the East India Company&#x27;s semi-sovereign status in Bengal, Bihar, and Orissa, which was created after the battles of Plassey and Buxar. The act was intended to address the company&#x27;s administration, but it wasn&#x27;t a long-term solution. In 1784, the Pitt&#x27;s India Act was passed as a more radical reform.", "t": 2, "s": 2}, {"n": 594, "tag": null, "stem": "Consider the following colonial laws in India:<br>1. The Rowlatt Act, 1919 allowed the government to detain people without trial for up to five years.<br>2. The Criminal Tribes Act, 1871 treated some communities as &quot;criminal tribes&quot; and was repealed in 1952.<br>3. The Indian Slavery Act, 1843 legalized slavery in British India. Which of the above statements are correct ?", "opts": {"a": "1 and 2 only", "b": "2 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "2 only. Statement 1 - Incorrect: Rowlatt Act allowed detention without trial for 2 years, not 5 years. Statement 3 - Incorrect: Indian Slavery Act, 1843 abolished slavery; it did not legalize it.", "t": 2, "s": 2}, {"n": 595, "tag": null, "stem": "The British Government passed a law in the year 1856. It was meant for which among the following social reforms ?", "opts": {"a": "Widow Remarriage", "b": "Abolition of the Practice of Sati", "c": "Abolition of Practice of Child Marriage", "d": "Law against Murdering of Female Child"}, "ans": "a", "exp": "Widow Remarriage. The Hindu Widow Remarriage Act of 1856 was enacted with the efforts of Ishwar Chandra Vidyasagar. The draft of the Hindu Widows&#x27; Remarriage Act, 1856 was prepared by Lord Dalhousie and passed by Lord Canning.", "t": 2, "s": 2}, {"n": 596, "tag": null, "stem": "Consider the following statements about the Indian Arms Act, 1878:<br>1. It was enacted during the viceroyalty of Lord Ripon.<br>2. It required Indians to obtain a government license for owning firearms, while Europeans were largely exempted. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. The Act was enacted under Lord Lytton (1876–1880), not Lord Ripon.", "t": 2, "s": 2}, {"n": 597, "tag": null, "stem": "Warren Hastings became the Governor-General of Bengal from Governor of Bengal after the passing of which of the following Acts ?", "opts": {"a": "Charter Act, 1813", "b": "Pitt’s India Act, 1784", "c": "Indian Council Act of 1861", "d": "Regulating Act, 1773"}, "ans": "d", "exp": "Regulating Act, 1773. The act was the first step taken by the British government to control and regulate the affairs of East India company in India.", "t": 2, "s": 2}, {"n": 598, "tag": null, "stem": "The Press and Registration of Books (PRB) Act was enacted in which year ?", "opts": {"a": "1857", "b": "1877", "c": "1887", "d": "1867"}, "ans": "d", "exp": "1867. The Press and Registration of Books (PRB) Act of 1867 is a law that regulates the printing, publishing, and registration of books and newspapers in India. The Act was passed during the colonial era and was intended to limit free speech by imposing many procedural requirements for publishing.", "t": 2, "s": 2}, {"n": 599, "tag": null, "stem": "Consider the following statements about the Ilbert Bill of 1883:<br>1. It was introduced by Sir Courtenay Ilbert, the Law Member of the Viceroy’s Council, during Lord Ripon’s tenure.<br>2. It allowed Indian judges to try British and European citizens in criminal cases. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. ", "t": 2, "s": 2}, {"n": 600, "tag": null, "stem": "By the Act of_____, the Governor General in Council was given the power to legislate for the whole of the British territories in India.", "opts": {"a": "Charter Act of 1833", "b": "Charter Act of 1793", "c": "Charter Act of 1853", "d": "Charter Act of 1813"}, "ans": "a", "exp": "Charter Act of 1833. It established the Governor General of Bengal as the Governor General of India, centralizing control over military and civil administration.", "t": 2, "s": 2}, {"n": 601, "tag": null, "stem": "Consider the following statements about the Ryotwari System:<br>1. The Ryotwari System was devised by Captain Alexander Read and Sir Thomas Munro in 1820.<br>2. In this system, peasants (ryots) paid land revenue directly to the government.<br>3. It was first introduced in Tamil Nadu and later extended to Maharashtra, Berar, East Punjab, Coorg, and Assam. Which of the above statements are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. Statement 3 is incorrect – It was first introduced in Madras (Tamil Nadu) and later extended to Maharashtra, Berar, Coorg, and Assam, but not East Punjab.", "t": 2, "s": 2}, {"n": 602, "tag": null, "stem": "Consider the following statements about the Mahalwari System:<br>1. It was introduced in 1822 by Holt Mackenzie.<br>2. Revenue settlement was made with village communities (mahals) instead of individual ryots. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. ", "t": 2, "s": 2}, {"n": 603, "tag": null, "stem": "Match the following Acts/Policies with the respective years in which they were put into place. <b>Acts/Policies Year <\/b><br>A. Pitt’s India Act 1. 1784<br>B. Permanent Settlement of 2. 1793 Bengal<br>C. Introduction of the 3. 1798 Subsidiary Alliance System<br>D. Abolition of Sati 4. 1829", "opts": {"a": "A – 4, B – 3, C – 2, D - 1", "b": "A – 2, B - 1, C – 4, D – 3", "c": "A - 2, B - 1, C - 3, D- 4", "d": "A – 1, B – 2, C – 3, D – 4"}, "ans": "d", "exp": "A – 1, B – 2, C – 3, D – 4 ", "t": 2, "s": 2}, {"n": 604, "tag": null, "stem": "The Provincial elections were held for the first time in _______ under the Government of India Act, 1935.", "opts": {"a": "1935", "b": "1937", "c": "1936", "d": "1938"}, "ans": "b", "exp": "1937, Indian provincial  <mark>elections: <\/mark>Elections were held in eleven provinces - Madras, Central Provinces, Bihar, Orissa, the United Provinces, the Bombay Presidency, Assam, the North-West Frontier Province, Bengal, Punjab and Sind. The Indian National Congress (INC) won the majority of seats in the provincial elections, and formed governments in seven provinces.", "t": 2, "s": 2}, {"n": 605, "tag": null, "stem": "Arrange the following provisions/events of the Regulating Act of 1773 in chronological order of their introduction/implementation:<br>1. Appointment of a Governor-General of Bengal with four councillors.<br>2. Establishment of the Supreme Court at Fort William.<br>3. Restriction on servants of East India Company engaging in private trade.<br>4. Recognition of British Parliament’s authority over East India Company.", "opts": {"a": "1-2-3-4", "b": "4-3-1-2", "c": "3-4-1-2", "d": "2-1-3-4"}, "ans": "b", "exp": "4-3-1-2. Regulating Act 1773 - It was passed by the British Parliament to control the territories of the East India Company majorly in Bengal. The act provided for the appointment of a Governor-General along with four Councillors in the Presidency of Fort William (Calcutta), jointly called the Governor-General in Council. As per this, Warren Hastings was appointed as the Governor-General of the Presidency of Fort William (Bengal).", "t": 2, "s": 2}, {"n": 606, "tag": null, "stem": "When was the Defence of India Act enacted ?", "opts": {"a": "1920", "b": "1918", "c": "1915", "d": "1921"}, "ans": "c", "exp": "1915. The Defence of India Act (1915) - It was an emergency law that gave the British government in India wide powers to suppress dissent and maintain public order during World War I. It was passed by the then Governor General of India Lord Hardinge.", "t": 2, "s": 2}, {"n": 607, "tag": null, "stem": "Which Act declared that British rule in India would end by 30 June 1948 ?", "opts": {"a": "Act of 1858", "b": "Act of 1947", "c": "Act of 1892", "d": "Act of 1961"}, "ans": "b", "exp": "Act of 1947. The Indian Independence Act 1947 was an Act of Parliament of the United Kingdom that granted independence to British India. The Act was passed on July 18, 1947, and came into effect on August 15, 1947. The Act divided British India into two independent dominions, India and Pakistan.", "t": 2, "s": 2}, {"n": 608, "tag": null, "stem": "In India which Act divided the powers between the Central and units in terms of three lists ?", "opts": {"a": "1862", "b": "1919", "c": "1909", "d": "1935"}, "ans": "d", "exp": "1935. Government of India  <mark>Act, 1935 : <\/mark>Contain three lists, Federal List (for Centre containing 59 items), Provincial List (for provinces containing 54 items) and the Concurrent List (for both containing 36 items).", "t": 2, "s": 2}, {"n": 609, "tag": null, "stem": "Consider the following statements about the Dual Government system in Bengal:<br>1. The system of Dual Government in Bengal was introduced by Robert Clive in 1765.<br>2. Under this system, the East India Company exercised Diwani rights while the Nizamat powers remained with the Nawab.<br>3. The Dual Government system was abolished by the East India Company in 1772. Which of the statements given above are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "d", "exp": "1, 2 and 3. The system of Dual Government: Introduced in Bengal by Robert Clive of British East India Company. It lasted from 1765 to 1772. Under this system, the administration of Bengal was divided into Nizamat and Diwani. The Diwani was carried out by the company and the Nizamat by the Nizam.", "t": 2, "s": 2}, {"n": 610, "tag": null, "stem": "Ryotwari system of revenue collection in India, introduced by the British, was based on the______.", "opts": {"a": "Smith&#x27;s theory of rent", "b": "Ricardian theory of rent", "c": "Malthusian theory of rent", "d": "Marx&#x27;s theory of rent"}, "ans": "b", "exp": "Ricardian theory of rent -  The land of higher fertility gets higher rent than less fertile land. <mark>Ryotwari <\/mark> <mark>System <\/mark>- The peasants or cultivators were regarded as the owners of the land. The cultivators had to pay annual taxes directly to the government. Introduced by Thomas Munro and Alexander Read in 1820 in the Madras and Bombay presidency.", "t": 2, "s": 2}, {"n": 611, "tag": null, "stem": "When was the Secretary of State for India made responsible for the Government of British India by bringing about changes in the Home Government?", "opts": {"a": "1858", "b": "1833", "c": "1857", "d": "1813"}, "ans": "a", "exp": "1858. Charter Act 1858 -  The term Governor General changed to Viceroy for the British crown. The first viceroy was Lord Canning. The act ended ‘The Doctrine of Lapse’. It ended the Dual government scheme initiated due to Pitt’s India Act.", "t": 2, "s": 2}, {"n": 612, "tag": null, "stem": "In 1942, the British government sent the______mission to India.", "opts": {"a": "Cripps", "b": "Linlithgow", "c": "Cabinet", "d": "Lansdowne"}, "ans": "a", "exp": "Cripps. It was sent to India to secure Indian cooperation for the British war efforts. It was headed by Sir Richard Stafford Cripps. Gandhi called it &#x27;A post-dated cheque drawn on a failing bank&#x27;.", "t": 2, "s": 2}, {"n": 613, "tag": null, "stem": "The result of the English Education Act of 1835 was to make ____ as a medium of instruction for____ education.", "opts": {"a": "vernacular, higher", "b": "English, primary", "c": "English, higher", "d": "vernacular, primary"}, "ans": "c", "exp": "English, Higher. English Education Act (1835) was proposed by William Bentinck on the advice of Macaulay. <mark>Reforms by William Bentick : <\/mark> The abolition of Sati, the suppression of female infanticide and Thuggee, the abolition of lawlessness, and the abolition of human sacrifices.", "t": 2, "s": 2}, {"n": 614, "tag": null, "stem": "The Charter Act of 1813 extended the East India Company&#x27;s rule in India to another _____ years.", "opts": {"a": "15", "b": "5", "c": "20", "d": "10"}, "ans": "c", "exp": "20. The Charter Act of 1813  (The East Indian Company Act 1813) - <mark>Features: <\/mark>It ended the monopoly of the East India Company over commercial trade except trade with China and trade in tea with India.", "t": 2, "s": 2}, {"n": 615, "tag": null, "stem": "The objective of Simon Commission was to________.", "opts": {"a": "decide India&#x27;s Political future", "b": "decide India&#x27;s Religious future", "c": "decide India&#x27;s Educational future", "d": "decide India&#x27;s economic future"}, "ans": "a", "exp": "Simon Commission - It was appointed by the British Government in <mark>1927 <\/mark>under the chairmanship of John Simon (other members were Pathick Lawrence and Clement Atlee) to review the workings of Government of India (GOI) Act, 1919 and suggest measures.", "t": 2, "s": 2}, {"n": 616, "tag": null, "stem": "Which act of the British Parliament was also known as East India Company Act 1793?", "opts": {"a": "The Government of India Act, 1793", "b": "The Charter Act, 1793", "c": "The Regulating Act, 1793", "d": "The Indian Councils Act, 1793"}, "ans": "b", "exp": "The Charter Act, 1793. The act was passed by the British Parliament to renew the charter of the East India Company to trade within India for next 20 years. It was passed during the tenure of Sir John Shore (1793 -1798).", "t": 2, "s": 2}, {"n": 617, "tag": null, "stem": "In_____, the British government enacted a legislation banning the use of printed cotton textiles - chintz - in England. Interestingly, this Act was known as the Calico Act.", "opts": {"a": "1720", "b": "1700", "c": "1740", "d": "1730"}, "ans": "a", "exp": "1720. The cotton textiles which the Portuguese took back to Europe, along with the spices, came to be called &quot;calico&quot;. Calico Act , Reason - Textile makers in England were Unable to compete with Indian textiles. Highest cotton producing state (Gujarat).", "t": 2, "s": 2}, {"n": 618, "tag": null, "stem": "Which of the following Indian states was the first to sign a subsidiary alliance with the British ?", "opts": {"a": "Hyderabad", "b": "Cochin", "c": "Travancore", "d": "Maratha"}, "ans": "a", "exp": "Hyderabad. In this system, an Indian ruler had to maintain British troops in his state, either by giving some of his territories or by paying for the maintenance of the troops. It was first introduced by the French East India Company Governor Joseph Francois Dupleix, Later used by Lord Wellesley, Governor-General of India (1798 to 1805).", "t": 2, "s": 2}, {"n": 619, "tag": null, "stem": "Consider the following statements about the Empress of India Act:<br>1. The original name of the Act was the Royal Titles Act, 1877.<br>2. It officially recognized Queen Victoria as the Empress of India. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Statement 1 Incorrect: The correct original name is the Royal Titles Act, 1876, not 1877.", "t": 2, "s": 2}, {"n": 620, "tag": null, "stem": "Which of the following Acts of 1947 regulates the Indian labor law with regard to trade unions as well as individual workmen ?", "opts": {"a": "Indian Councils Act", "b": "Charter Act", "c": "Rowlatt Act", "d": "Industrial Disputes Act"}, "ans": "d", "exp": "Industrial disputes Act 1947.  The Rowlatt Act 1919 authorized the arrest, for 2 years without trial, of any person suspected of terrorism living in British India. Indian Council acts (1861, 1892, and 1909). Charter Acts (1793, 1813, 1833, and 1853).", "t": 2, "s": 2}, {"n": 621, "tag": null, "stem": "Which Act passed by British Government of India abolished the Council of India ?", "opts": {"a": "Indian Independence Act of 1947", "b": "India Council Act of 1892", "c": "Government of India Act of 1935", "d": "Charter Act of 1853"}, "ans": "c", "exp": "Government of India Act  <mark>1935 <\/mark>were as follows: Abolition of provincial dyarchy and introduction of dyarchy at centre. Abolition of Indian Council and introduction of an advisory body in its place. Provision for an All India Federation with British India territories and princely states.", "t": 2, "s": 2}, {"n": 622, "tag": null, "stem": "Consider the following statements regarding the Sharda Act of 1929:<br>1. The Sharda Act fixed the marriageable age for girls at 14 years and boys at 18 years.<br>2. The Act was sponsored by Harbilas Sarda.", "opts": {"a": "Both statements are True", "b": "Both statements are False", "c": "Statement 1 is True, Statement 2 is False", "d": "Statement 1 is False, Statement 2 is True"}, "ans": "a", "exp": "Both statements are True.  The Sharda act fixed the marriageable age for girls at 14 years and 18 years for boys. It was sponsored by Harbilas Sarda. Pitt’s India act (1784), Rowlatt Act (1919), Vernacular press act (1878).", "t": 2, "s": 2}, {"n": 623, "tag": null, "stem": "In which year through the Indian Official Secrets Act was freedom of press curbed ?", "opts": {"a": "1919", "b": "1921", "c": "1904", "d": "1909"}, "ans": "c", "exp": "1904. It was enacted during the time of Lord Curzon, Viceroy of India from 1899 to 1905 curbed the freedom of Press. Later this act was replaced by the Official Secrets act 1923.", "t": 2, "s": 2}, {"n": 624, "tag": null, "stem": "In 1877, which of the following viceroys organized a durbar to acknowledge Queen Victoria as the Empress of India ?", "opts": {"a": "Lord Lytton", "b": "Lord Ripon", "c": "Lord Minto", "d": "Lord Dufferin"}, "ans": "a", "exp": "Lord Lytton organized a durbar to acknowledge Queen Victoria as the Empress of India. This was the culmination of the transfer of control of British India from the East India Company to the Crown.", "t": 2, "s": 2}, {"n": 625, "tag": null, "stem": "The capital of the British Indian Empire was transferred from Calcutta to Delhi in:", "opts": {"a": "1911", "b": "1905", "c": "1907", "d": "1909"}, "ans": "a", "exp": "1911 . The British government believed that ruling India from Delhi was easier and more convenient than from Calcutta. Therefore, Delhi was officially announced as the capital of British Raj by Emperor George V, on December 12, 1911.", "t": 2, "s": 2}, {"n": 626, "tag": null, "stem": "By which British statute were Indian representatives, for the first time, allocated seats for election in Indian Legislative Councils ?", "opts": {"a": "Government of India Act, 1833", "b": "Indian Councils Act, 1892", "c": "Government of India Act, 1915", "d": "Indian Councils Act, 1861"}, "ans": "b", "exp": "Indian Councils Act, 1892.  The act made a limited and indirect provision for the use of election in filling up some of the nonofficial seats both in the Central and provincial legislative councils.", "t": 2, "s": 2}, {"n": 627, "tag": null, "stem": "Consider the following statements:<br>1. General Dyer imposed Martial Law in India in 1920, under which public gatherings of more than two people were prohibited.<br>2. The office of the first Accountant General in India was established in 1858, the same year the British Crown took over administration from the East India Company. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Statement 1 is wrong: General Dyer imposed Martial Law in 1919 (not 1920), in response to the Rowlatt Act protests, which culminated in the Jallianwala Bagh massacre.", "t": 2, "s": 2}, {"n": 628, "tag": null, "stem": "Consider the following statements:<br>1. The Partition of Bengal was announced in 1905 by Lord Curzon.<br>2. The Surat Split of the Indian National Congress took place in 1909 between the Moderates and Extremists. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Statement 2 – Incorrect: The Surat Split took place in 1907, not 1909, between the Moderates (led by Gopal Krishna Gokhale) and the Extremists (led by Bal Gangadhar Tilak, Bipin Chandra Pal, and Lala Lajpat Rai).", "t": 2, "s": 3}, {"n": 629, "tag": null, "stem": "Consider the following statements about the Rakhi-tying movement:<br>1. In 1905, Rabindranath Tagore encouraged Hindus and Muslims to tie rakhis on each other’s hands as a mark of unity.<br>2. This movement was connected with the Rowlatt Act of 1919. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Statement 2 - Incorrect: The rakhi movement was linked with the Partition of Bengal (1905), not the Rowlatt Act of 1919.", "t": 2, "s": 3}, {"n": 630, "tag": null, "stem": "What was the Swadeshi Movement called in the state of Andhra Pradesh ?", "opts": {"a": "Gadar Movement", "b": "Quit India Movement", "c": "Khilafat Movement", "d": "Vande Mataram Movement"}, "ans": "d", "exp": "Vande Mataram Movement.  The Swadeshi Movement started in August 1905 from Calcutta Town Hall against Lord Curzon’s decision of dividing the province of Bengal. The partition led to protest meetings in Bengal under which the pledge to boycott foreign goods was first taken. Leaders of the movement - Poona and Bombay (Lokmanya Tilak), Punjab (Lala Lajpat Rai and Ajit Singh), Delhi (Syed Haider Raza), Madras (Chidambaram Pillai).", "t": 2, "s": 3}, {"n": 631, "tag": null, "stem": "What is the official reason given by Britishers after partition of Bengal in 1905 ?", "opts": {"a": "Easy Movement of army", "b": "To check on Extremist activities", "c": "Economic Progress", "d": "Administrative Convenience"}, "ans": "d", "exp": "Administrative Convenience.  The real reason for the partition was to divide and weaken the growing nationalist movement in Bengal. After Partition Swadeshi movement gained even more momentum, and the British were forced to revoke the partition in 1911.", "t": 2, "s": 3}, {"n": 632, "tag": null, "stem": "Assertion (A): Before the Partition of Bengal in 1905, Bengal was the biggest province of British India, consisting of parts of Bihar and Orissa.<br><b>Reason (R): <\/b>Lord Curzon announced the Partition of Bengal in 1905 to separate the largely Muslim eastern areas from the largely Hindu western areas.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "a", "exp": "Partition of Bengal in 1905 {Lord Curzon announced the partition of Bengal on 20th July 1905, reorganization separated the largely Muslim eastern areas from the largely Hindu western areas}.", "t": 2, "s": 3}, {"n": 633, "tag": null, "stem": "Which of the following parties supported the move for partition of Bengal ?", "opts": {"a": "Gadar Party", "b": "Forward Bloc", "c": "All India Muslim League", "d": "Communist Party of India"}, "ans": "c", "exp": "All India Muslim League  supported the move for partition of Bengal. Founders of All India Muslim League are Muhammad Ali Jinnah, Aga Khan III, Khwaja Salimullah, Hakim Ajmal Khan, Waqar-ul-Mulk. It was founded on 30 December 1906.", "t": 2, "s": 3}, {"n": 634, "tag": null, "stem": "Moved by the Swadeshi Movement, ______ painted his famous image of Bharat Mata portraying her as an ascetic figure.", "opts": {"a": "Satyendranath Tagore", "b": "Abanindranath Tagore", "c": "Jyotirindranath Tagore", "d": "Dwijendranath Tagore"}, "ans": "b", "exp": "Abanindranath Tagore  painted his famous image of Bharat Mata portraying her as an ascetic figure in 1905. The painting is depicted as a saffron-clad divine woman, holding a book, sheaves of paddy, a piece of white cloth, and a rosary in her four hands.", "t": 2, "s": 3}, {"n": 635, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Once the Time Magazine had mocked Gandhiji&#x27;s physical size but to whom do it compare his martyrdom later on?", "opts": {"a": "Albert Einstein", "b": "Martin Luther", "c": "George Orwell", "d": "Abraham Lincoln"}, "ans": "d", "exp": "Abraham Lincoln. Time magazine in its earlier coverage had mocked Mahatma Gandhi’s small physical stature. However, after his assassination on 30 January 1948, Time compared Gandhi’s martyrdom to that of Abraham Lincoln, recognizing the magnitude of his sacrifice for peace and freedom. Like Lincoln, Gandhiji was portrayed as a leader who gave his life for unity and justice in his nation.", "t": 2, "s": 4}, {"n": 636, "tag": null, "stem": "Assertion (A): Gandhi’s first Satyagraha in India was launched in Bardoli in 1917.<br><b>Reason (R): <\/b>Pandit Raj Kumar Shukla invited Gandhi to Champaran to study the grievances of indigo farmers.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "d", "exp": "A is false, but R is true.  India&#x27;s first Civil Disobedience movement, launched by Mahatma Gandhi in 1917, was prompted by Pandit Raj Kumar Shukla, who urged him to address the plight of Indigo farmers. Mahatma Gandhi organised the Kheda Satyagraha (1918) in Gujarat. Gandhi also led the Ahmedabad Mill Strike (1918) after returning from South Africa. The Bardoli Satyagraha (1928) was led by Sardar Vallabhbhai Patel for the farmers of Bardoli.", "t": 2, "s": 4}, {"n": 637, "tag": null, "stem": "Who was the Viceroy of India when Mahatma Gandhi started Dandi March on 12 March 1930 ?", "opts": {"a": "Lord Chelmsford", "b": "Lord Minto II", "c": "Lord Irwin", "d": "Lord Willingdon"}, "ans": "c", "exp": "Lord Irwin (1926-1931).  Other Events During his tenure: Simon Commission to India (1927); Harcourt Butler Indian States Commission (1927); Nehru Report (1928); Deepavali Declaration (1929); Lahore session of the Congress (Purna Swaraj Resolution) 1929; First Round Table Conference (1930); Gandhi-Irwin Pact (1931). Mahatma Gandhi led the Dandi March (Salt March) in 1930, accompanied by a group of 78 followers, as a nonviolent protest against the British salt monopoly.", "t": 2, "s": 4}, {"n": 638, "tag": null, "stem": "In which year was the Gandhi-Irwin Pact signed ?", "opts": {"a": "1935", "b": "1929", "c": "1931", "d": "1941"}, "ans": "c", "exp": "1931. The Gandhi-Irwin Pact was signed on March 5, 1931, between Mahatma Gandhi and Lord Irwin, the Viceroy of India (1926-1931). The pact ended the Civil Disobedience Movement, initiated by Gandhi with the Salt March, and was signed before the Second Round Table Conference in London.", "t": 2, "s": 4}, {"n": 639, "tag": null, "stem": "Consider the following statements regarding the Round Table Conferences:<br>1. Mahatma Gandhi attended only the Second Round Table Conference.<br>2. Mahatma Gandhi participated in all the three Round Table Conferences held in London. Which of the statements given above is/are incorrect ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "Only 2. Gandhi ji went only to the Second Round Table Conference (1931). He did not attend the First (1930) or Third (1932) Round Table Conferences.", "t": 2, "s": 4}, {"n": 640, "tag": null, "stem": "In which of the following places did Mahatma Gandhi, along with other Indians, establish the Natal Congress to fight against racial discrimination ?", "opts": {"a": "South Africa", "b": "India", "c": "England", "d": "France"}, "ans": "a", "exp": "South Africa. The Natal Indian Congress, founded by Mahatma Gandhi in 1894, aimed to combat discrimination against Indians in South Africa. Gandhiji, born on 2 October 1869, returned to India on 9 January 1915.", "t": 2, "s": 4}, {"n": 641, "tag": null, "stem": "Consider the following statements:<br>1. The Dandi March was started by Mahatma Gandhi from Sabarmati Ashram on 12 March 1930.<br>2. The Quit India Movement was launched in 1930 alongside the Salt Satyagraha to strengthen the freedom struggle. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Gandhi began the Dandi March on 12 March 1930 and reached Dandi on 5 April 1930 to break the salt law. The Quit India Movement was launched later in 1942, not in 1930.", "t": 2, "s": 4}, {"n": 642, "tag": null, "stem": "Which of the following leaders had gone to Lucknow to invite Mahatma Gandhi to see the plight of the peasants in Champaran ?", "opts": {"a": "Hasan Mohani", "b": "Raj Kumar Shukla", "c": "Rajendra Prasad", "d": "JB Kripalani"}, "ans": "b", "exp": "Raj Kumar Shukla. The local Congress leaders Brajkishore Prasad and Raj Kumar Shukla first met Mahatma Gandhi at the Lucknow session of the Indian National Congress in 1916 and invited Mahatma Gandhi to have first-hand experience of the plight of Champaran peasants. Gandhi arrived in Champaran on April 15, 1917, to address the grievances of the peasants who were forced to grow indigo under oppressive conditions.", "t": 2, "s": 4}, {"n": 643, "tag": null, "stem": "Match the following Pacts with the year in which they were signed: <b>Column A (Pacts) Column B <\/b> <b>(Years) <\/b> 1.Gandhi–AmbedkarPact A. 1931 (Poona Pact) 2.Gandhi–Irwin Pact B. 1932<br>3. Lucknow Pact C. 1916<br>4. Delhi Pact (Rajendra D. 1947 Prasad –Liaquat Ali Pact)", "opts": {"a": "1–B, 2–A, 3–C, 4–D", "b": "1–A, 2–B, 3–D, 4–C", "c": "1–C, 2–D, 3–B, 4–A", "d": "1–D, 2–C, 3–A, 4–B"}, "ans": "a", "exp": "1–B, 2–A, 3–C, 4–D. The Communal Award was announced by the British Prime Minister, Ramsay MacDonald, on 16 August 1932, based on the report of the Indian Franchise Committee (Lothian Committee). This award accorded separate electorates for Muslims, Europeans, Sikhs, Indian Christians, Anglo-Indians, Depressed classes (78 seats), and even to the Marathas for some seats in Bombay. Gandhi - Ambedkar Pact is also known as the Poona Pact. Madan Mohan Malaviya signed it on behalf of Gandhi. It provided for the Joint electorate, reserved seats (147) for depressed classes and 18% seats reserved for the central legislature.", "t": 2, "s": 4}, {"n": 644, "tag": null, "stem": "Mahatma Gandhi called a halt to the Non-Cooperation Movement after the Chauri Chaura incident. Where among the following places is Chauri Chaura located ?", "opts": {"a": "Lucknow", "b": "Mathura", "c": "Meerut", "d": "Gorakhpur"}, "ans": "d", "exp": "Gorakhpur. Chauri Chaura, a town in Uttar Pradesh was the site of a violent clash on February 4, 1922, during the Non-Cooperation Movement. Protestors set a police station on fire, resulting in the deaths of 22 policemen inside.", "t": 2, "s": 4}, {"n": 645, "tag": null, "stem": "Assertion (A): The Champaran Satyagraha of 1917 resulted in the abolishment of the Tinkathia System.<br><b>Reason (R): <\/b>The Tinkathia System forced peasants to cultivate wheat on 3/20th of their landholdings for British planters.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp": "A is true, but R is false.  Champaran Satyagraha (1917) was Gandhi&#x27;s first protest in India against forced indigo farming. Brajkishore Prasad and Raj Kumar Shukla first met Mahatma Gandhi at the Lucknow session of the Indian National Congress in 1916 and invited him to have first-hand experience of the plight of Champaran peasants.", "t": 2, "s": 4}, {"n": 646, "tag": null, "stem": "Consider the following statements:<br>1. The Non-Cooperation Movement launched in 1920 included boycott of foreign goods, promotion of spinning wheels, and picketing at liquor shops.<br>2. The resolution of Poorna Swaraj was passed at the Lahore session of the Indian National Congress in 1920 as part of the Non-Cooperation Movement. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The resolution for Poorna Swaraj (complete independence) was passed at the Lahore session of the Indian National Congress in December 1929, under the leadership of Jawaharlal Nehru. He hoisted the Indian tricolor flag on the banks of the Ravi river. The non-cooperation movement was launched by Mahatma Gandhi in 1920 to persuade Indians to withdraw their cooperation from the British government and advocate for self-governance.", "t": 2, "s": 4}, {"n": 647, "tag": null, "stem": "Gandhiji gave his slogan of ‘Do or Die’ during which of the following Movements/Satyagrahas ?", "opts": {"a": "Civil Disobedience", "b": "Kheda Satyagraha", "c": "Champaran Satyagraha", "d": "Quit India"}, "ans": "d", "exp": "The Quit India Movement  (also known as the August Movement) was launched by the Indian National Congress on August 8, 1942. Other key movements by Mahatma Gandhi include the Civil Disobedience Movement (1930), the Kheda Satyagraha (1918) in Gujarat, demanding relaxation in revenue collection for peasants, and the Champaran Satyagraha (1917), opposing the Tinkathia system, which forced peasants to grow indigo on 3/20th of their land.", "t": 2, "s": 4}, {"n": 648, "tag": null, "stem": "Vallabhbhai Patel and____ helped Gandhi in Kheda by organising his tour of the villages and urging the peasants to stand firm against the government.", "opts": {"a": "Motilal Nehru", "b": "Mohammad Ali Jinnah", "c": "Indulal Yajnik", "d": "Jamunalal Bajaj"}, "ans": "c", "exp": "Indulal Yajnik. Mahatma Gandhi returned to India on 9 January 1915.", "t": 2, "s": 4}, {"n": 649, "tag": null, "stem": "Consider the following statements:<br>1. Mahatma Gandhi returned his Kaisar-i-Hind medal in 1920 as a protest against the Jallianwala Bagh Massacre.<br>2. Rabindranath Tagore returned his Kaisar-i-Hind medal in protest against the same massacre.", "opts": {"a": "Both 1 and 2 are true", "b": "Both 1 and 2 are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Statement 1 is true,  <mark>Statement 2 is false. <\/mark>Kaiser - e - Hind title was given to Mahatma Gandhi by Governor-General of India Lord Hardinge in 1915 for his services during the Boer War (1899 - 1902). Gandhi returned his title in response to the Jallianwala Bagh Massacre (13th April 1919). Rabindranath Tagore returned his Knighthood title in response to the massacre.", "t": 2, "s": 4}, {"n": 650, "tag": null, "stem": "In 1918, Mahatma Gandhi successfully led a strike of _____.", "opts": {"a": "Army Soldiers", "b": "Dalits", "c": "Mill workers", "d": "Traders"}, "ans": "c", "exp": "Mill workers. Ahmedabad  <mark>Mill Strike <\/mark>(1918) <mark>- <\/mark>This is considered the first hunger strike led by Gandhi.", "t": 2, "s": 4}, {"n": 651, "tag": null, "stem": "Consider the following statements regarding the Kheda Satyagraha of 1918:<br>1. The Kheda Satyagraha was launched against the British demand for high land revenue despite crop failure and plague outbreak.<br>2. The movement was organised mainly by the Patidar peasants of Gujarat under the leadership of Mahatma Gandhi. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Kheda Satyagraha of 1918 was a satyagraha movement in the Kheda district of Gujarat in India organized by Mahatma Gandhi during the period of the British Raj. The peasant-Patidar community of Kheda, who refused to accept a 23 percent tax increase imposed on them despite a devastating crop failure and an outbreak of plague and cholera, served as the focal point of this satyagraha.", "t": 2, "s": 4}, {"n": 652, "tag": null, "stem": "When did depressed classes get the reserved seats in provincial and central legislative councils, but they were to be voted in by the General electorate ?", "opts": {"a": "September 1930", "b": "November 1932", "c": "November 1930", "d": "September 1932"}, "ans": "d", "exp": "September 1932. Poona Pact - Agreement between Mahatma Gandhi and Dr. B. R. Ambedkar - Seats reserved for the depressed classes were increased from 71 to 147 in provincial legislatures and 18 percent of the total in the Central Legislature.", "t": 2, "s": 4}, {"n": 653, "tag": null, "stem": "Gandhiji, aged____, arrived in India in 1915 from South Africa.", "opts": {"a": "52", "b": "46", "c": "28", "d": "34"}, "ans": "b", "exp": "46. Gandhiji (born on 2nd October 1869 in Porbandar, Gujarat) went to South Africa in 1893 as a lawyer, settling first in Durban before moving to Johannesburg.", "t": 2, "s": 4}, {"n": 654, "tag": null, "stem": "Consider the following statements:<br>1. The quote “Be the change you wish to see in the world” is attributed to Mahatma Gandhi.<br>2. The quote “Give me blood, and I will give you freedom” was also said by Gandhi.", "opts": {"a": "Both 1 and 2 are true", "b": "Both 1 and 2 are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is True"}, "ans": "c", "exp": "Mahatma Gandhi other Famous Quotes: “A man is but the product of his thoughts. What he thinks, he becomes.”, “Nobody can hurt me without my permission.”", "t": 2, "s": 4}, {"n": 655, "tag": null, "stem": "In which of the following years, did Subhas Chandra Bose refer to Mahatma Gandhi as the “Father of the Nation” ?", "opts": {"a": "1942", "b": "1944", "c": "1939", "d": "1941"}, "ans": "b", "exp": "1944. Subhas Chandra Bose called Mahatma Gandhi the ‘Father of the Nation’ in a radio address from Singapore on 6 July 1944.", "t": 2, "s": 4}, {"n": 656, "tag": null, "stem": "Consider the following statements regarding the Khilafat Movement:<br>1. The All-India Khilafat Conference of November 1919 was held at Delhi.<br>2. Leaders like the Ali brothers, Maulana Abul Kalam Azad, Ajmal Khan, and Hasrat Mohani played a key role in this movement. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. In early 1919, the All India Khilafat Committee was formed under the leadership of the Ali brothers (Maulana Muhammad Ali and Shaukat Ali), Maulana Abul Kalam Azad, Ajmal Khan and Hasrat Mohani, to force the British Government to change its attitude to Turkey.", "t": 2, "s": 4}, {"n": 657, "tag": null, "stem": "Who among the following called Netaji Subhash Chandra Bose a patriot of patriots ?", "opts": {"a": "Jawaharlal Nehru", "b": "Chittaranjan Das", "c": "Mahatma Gandhi", "d": "Pattabhi Sitaramayya"}, "ans": "c", "exp": "Mahatma Gandhi.  Rabindranath Tagore called Subhash Chandra Bose a &#x27;Desh Nayak&#x27;. The famous slogan given by Subhas Chandra Bose: “Dilli Chalo, Jai Hind”, &quot;Give me blood, I will give freedom&quot;. Subhas Chandra Bose Autobiography: “The Indian Struggle”.", "t": 2, "s": 4}, {"n": 658, "tag": null, "stem": "Which of the following events occurred as an after-effect of the Jallianwala Bagh Massacre (13th April<br>1919) ?", "opts": {"a": "Hunger strike to settle disputes between the mill owners and the workers", "b": "Individual princes could sign a separate agreement with the British", "c": "Hunter Commission was appointed by the British Government", "d": "Popularisation of Charkha and Khadi and Jail Bharo by Congress volunteers."}, "ans": "c", "exp": "The Hunter Commission came to India in 1919 under the leadership of William Hunter to investigate the Jallianwala Bagh massacre. Another Hunter Commission was on Indian Education, prepared in 1882 by William Wilson Hunter.", "t": 2, "s": 4}, {"n": 659, "tag": null, "stem": "Which of the following is NOT a reason for slowing down the Non-cooperation Movement ?", "opts": {"a": "Due to the absence of alternative Indian institution, boycott of British Institutions posed a problem.", "b": "Leaders of the movement shifted their focus towards domestic work thus created a void.", "c": "Many lawyers resigned but then absence of income for a longer period of time compelled them to rejoin.", "d": "Khadi cloth was often more expensive than mass-produced mill cloth and poor people could not afford to buy it."}, "ans": "b", "exp": "Mahatma Gandhi started the Non- Cooperation Movement on 4 September 1920. Lord Chelmsford was the viceroy of British India during the Non-Cooperation Movement. The Chauri -Chaura incident was the driver of subsequent withdrawal of the Non -Cooperation Movement.", "t": 2, "s": 4}, {"n": 660, "tag": null, "stem": "In which of the following years was the civil disobedience campaign completely Ceased ?", "opts": {"a": "1917", "b": "1934", "c": "1923", "d": "1943"}, "ans": "b", "exp": "1934 . It began with the famous Dandi March of Gandhiji, on 12 March 1930.", "t": 2, "s": 4}, {"n": 661, "tag": null, "stem": "Assertion (A): During the Quit India Movement of 1942, Aruna Asaf Ali hoisted the Indian flag at Gowalia Tank Maidan in Mumbai.<br><b>Reason (R): <\/b>Sarojini Naidu was popularly called the &quot;Grand Old Lady of the Independence Movement.&quot;", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, but R is false", "d": "A is false, but R is true"}, "ans": "c", "exp
