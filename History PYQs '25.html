ruvasena II was the most important ruler of this kingdom.", "opts": {"a": "Maitrakas", "b": "Maukharis", "c": "Pushyabhutis", "d": "Gurjara Pratiharas"}, "ans": "a", "exp": "Maitrakas established Valabhi as their capital and ruled until the middle of the eighth century. Dhruvasena II was a contemporary of Harshavardhana and was married to his daughter. Hsuan Tsang tells us that Dhruvasena II attended Harsha’s assembly at Prayaga (Allahabad). Maukharies ruled over Kannauj, a city in western Uttar Pradesh, they were also the subordinate rulers of the Guptas and used the title of samanta.", "t": 0, "s": 6}, {"n": 119, "tag": null, "stem": "Who among the following was the author of &#x27;Brihat Katha Kosh&#x27; ?", "opts": {"a": "Dandin", "b": "Bhavabhuti", "c": "Kshemendra", "d": "Harisena"}, "ans": "d", "exp": "Harisena. He was a Sanskrit writer and poet in the court of Samudragupta. &quot;Brihat Katha Kosh&quot; is a collection of ancient Indian folk tales and legends. Bhavabhuti is believed to be the court poet of King Yashovarman of Kannauj. His famous plays are Mahaviracharita, Malatimadhava.", "t": 0, "s": 6}, {"n": 120, "tag": null, "stem": "Consider the following statements regarding Kalidasa:<br>I. Kalidasa was a famous poet and playwright in ancient India.<br>II. He was patronized by Chandragupta II (Vikramaditya) of the Gupta dynasty.<br>III. His notable works include Abhijnanasakuntalam, Meghaduta, and Raghuvamsa. I Which of the above statements is/are correct ?", "opts": {"a": "I and II only", "b": "II and III only II", "c": "I and III only", "d": "I, II and III"}, "ans": "d", "exp": "I, II and III. Kumarasambhava describes the birth of Lord Kartikeya. Meghaduta, A lyrical poem (Kavya) where a yaksha sends a message to his wife via a cloud.", "t": 0, "s": 6}, {"n": 121, "tag": null, "stem": "Harisena, the author of Prayag Prashasti, was the court poet of which of the following Gupta emperors ?", "opts": {"a": "Samudraguta", "b": "Kumaragupta I", "c": "Ramagupta", "d": "Skandagupta"}, "ans": "a", "exp": "Samudragupta. He was the son and successor of Chandragupta I and was the greatest ruler of the Gupta dynasty. The Allahabad Pillar inscription, also called Prayag Prashasti, was composed by Harishena.", "t": 0, "s": 6}, {"n": 122, "tag": null, "stem": "Gupta emperor Chandragupta I was the first ruler to adopt which of the following titles ?", "opts": {"a": "Maharajadhiraja", "b": "Parmeshvara", "c": "Mahendraditya", "d": "Vikramaditya"}, "ans": "a", "exp": "Maharajadhiraja.  Chandragupta I, the son of Gupta king Ghatotkacha and grandson of the dynasty&#x27;s founder Sri Gupta, is referred to as Maharaja in the Allahabad Pillar inscription, while his successor, Kumaragupta, adopted the title &quot;Mahendraditya.&quot;", "t": 0, "s": 6}, {"n": 123, "tag": null, "stem": "The Chinese Buddhist pilgrim Fa Hien visited India during the reign of which of the following Gupta emperors ?", "opts": {"a": "Vishnugupta", "b": "Chandragupta I", "c": "Ghatotkacha", "d": "Chandragupta II"}, "ans": "d", "exp": "Chandragupta II, also known as Vikramaditya, was the third ruler of the Gupta Empire. He is often identified with King Chandra from the Delhi iron pillar inscription. Notable Travellers and Their Visits - Abdul Razzak (Iran): Deva Raya II. Francois Bernier (France): Shah Jahan, Ibn Batuta (Morocco): Mohammed Bin Tughlaq, Megasthenes (Greece): Chandragupta Maurya, Thomas Roe and William Hawkins (Britain): Jahangir, Hwien Tsang (China): Harsha Vardhana.", "t": 0, "s": 6}, {"n": 124, "tag": null, "stem": "Consider the following statements regarding the practice of Sati. Identify the incorrect statement:<br>I. The first inscriptional evidence of Sati is found during the Satavahana period.<br>I. The Eran Pillar Inscription of Bhanugupta in Madhya Pradesh mentions the practice of Sati.<br>I. Raja Ram Mohan Roy described Sati as murder and helped in the passing of the Bengal Sati Regulation Act, 1829.", "opts": {"a": "I only", "b": "II only", "c": "III only", "d": "II and III"}, "ans": "a", "exp": "I only. Earliest inscriptional evidence of Sati is from the Gupta period, not the Satavahana period.", "t": 0, "s": 6}, {"n": 125, "tag": null, "stem": "The famous source of the Gupta empire, the Prayaga Prashasti is also known as the ________.", "opts": {"a": "Allahabad pillar inscription", "b": "Ahmedabad pillar inscription", "c": "Bithur pillar inscription", "d": "Lucknow pillar inscription"}, "ans": "a", "exp": "Allahabad pillar inscription  composed in Sanskrit by Harishena, the court poet of Samudragupta.", "t": 0, "s": 6}, {"n": 126, "tag": null, "stem": "Who was the court poet of Harshavardhana ?", "opts": {"a": "Hema Saraswati", "b": "Parmanand", "c": "Banabhatta", "d": "Sri Ponna"}, "ans": "c", "exp": "Banabhatta - His teacher&#x27;s name was Bhatsu or Bharvu. Banabhatta&#x27;s three works are famous - “Harshacharita”, “Kadambari” and “Chandishtak”. <mark>Harshvardhan <\/mark>was the ruler of the Pushyabhuti dynasty of Thaneshwar.", "t": 0, "s": 6}, {"n": 127, "tag": null, "stem": "Who among the following Navratnas from Chandragupta II court wrote &#x27;Mantrashastra’ ?", "opts": {"a": "Kalidasa", "b": "Ghatakarapara", "c": "Vetala Bhatta", "d": "Amarasimha"}, "ans": "c", "exp": "Vetala Bhatta. Nine jewels (Navratna) of Chandragupta II - Amarasimha, Dhanvantari, Harisena, Kalidasa, Kshapanaka, Shanku, Varahamihira, Varuchi, Vetala-Bhatta.", "t": 0, "s": 6}, {"n": 128, "tag": null, "stem": "Arrange the following Gupta rulers in chronological order of their reign:<br>I. Chandragupta I<br>II. Samudragupta<br>III. Chandragupta II<br>IV. Kumaragupta I", "opts": {"a": "I → II → III → IV", "b": "I → III → II → IV", "c": "II → I → III → IV", "d": "I → II → IV → III → → →"}, "ans": "a", "exp": "I II III IV.  Chandragupta I (c. 319–335 CE) – Founder of the Gupta dynasty’s imperial line; married Kumaradevi of the Licchavi clan. Samudragupta (c. 335–375 CE) – Known as the “Napoleon of India”. Chandragupta II (c. 375–415 CE) – Also called Vikramaditya; period marked as the Golden Age of the Gupta Empire. Kumaragupta I (c. 415–455 CE) – Known as Shakraditya/Mahendraditya; founded Nalanda Mahavihara; succeeded by Skandagupta.", "t": 0, "s": 6}, {"n": 129, "tag": null, "stem": "Which king was shown on his coins as a Veena player ?", "opts": {"a": "Ashoka", "b": "Chandragupta Maurya", "c": "Samudragupta", "d": "Chandragupta I"}, "ans": "c", "exp": "Samudragupta - He was a ruler of the Gupta dynasty. On several of his coins, he was depicted as seated on a sofa and playing a Veena. He is known as the Napoleon of India. He was given the title of Kaviraj.", "t": 0, "s": 6}, {"n": 130, "tag": null, "stem": "After the victory over Sakas, who among the following adopted the title of &#x27;Vikramaditya&quot; ?", "opts": {"a": "Chandragupta I", "b": "Chandragupta II", "c": "Skandagupta", "d": "Kumaragupta I"}, "ans": "b", "exp": "Chandragupta II - He was the son of Samudragupta and Datta Devi. He ruled the Gupta Empire from 380 to 415 AD during the Golden Age of India. He established the Mehrauli iron pillar.", "t": 0, "s": 6}, {"n": 131, "tag": null, "stem": "Who among the following succeeded Ghatotkacha, the Gupta ruler?", "opts": {"a": "Kumaragupta I", "b": "Chandragupta I", "c": "Chandragupta II", "d": "Skandagupta"}, "ans": "b", "exp": "Chandragupta I. Founder - Sri Gupta, Next Successors - Ghatotkacha, Chandragupta I, Samudragupta, Chandragupta II, Kumaragupta I (founded Nalanda University).", "t": 0, "s": 6}, {"n": 132, "tag": null, "stem": "Ruler of which dynasty built the famous Iron pillar in Delhi ?", "opts": {"a": "Gupta", "b": "Pallava", "c": "Maurya", "d": "Pushyabhuti"}, "ans": "a", "exp": "Gupta dynasty. In Mehrauli (Delhi) an iron pillar was constructed by the famous king Chandragupta II, India, notable for the rust-resistant composition of the metal used in its construction. The inscription on the pillar is in Sanskrit, about Gupta emperor Chandragupta II.", "t": 0, "s": 6}, {"n": 133, "tag": null, "stem": "Which of the following offices was NOT held by the poet Harishena ?", "opts": {"a": "Sandhi-vigrahika", "b": "Maha-danda-nayaka", "c": "Nagara-shreshthi", "d": "Kumar-amatya"}, "ans": "c", "exp": "Nagara-shreshthi (Chief banker or merchant). Offices held by Poet Harishena: Maha-danda-Nayaka (Chief Judicial Officer), Kumar-amatya (Important minister) and a sandhi - vigrahika (Minister of War and Peace).", "t": 0, "s": 6}, {"n": 134, "tag": null, "stem": "Consider the following statements regarding Fa Xian&#x27;s journey to India: (A) Fa Xian, the Chinese traveller, came to India to acquire Buddhist texts. (B) He arrived in India during the reign of Chandragupta II and reached Pataliputra from the northwest. (C) Fa Xian began his journey back home from Bengal by boarding a merchant ship. Which of the above statements is/are correct ?", "opts": {"a": "(A) and (B) only", "b": "(B) and (C) only", "c": "(A), (B) and (C)", "d": "(A) and (C) only"}, "ans": "c", "exp": "(A), (B) and (C). Fa Xian came to India primarily to collect Buddhist texts and study Buddhism. He visited India during the reign of Chandragupta II and reached Pataliputra from the northwest. Fa Xian returned to China from the Bengal region by ship.", "t": 0, "s": 6}, {"n": 135, "tag": null, "stem": "Samudragupta&#x27;s mother belonged to which of the following gana ?", "opts": {"a": "Koliya", "b": "Lichchhavi", "c": "Sakya", "d": "Vajji"}, "ans": "b", "exp": "Licchavi. Samudragupta (335 -375 CE, Kaviraja) was the son of Chandragupta I and Queen Kumaradevi (Licchavi clan). He is called ‘Napoleon of India’ by V.A. Smith.", "t": 0, "s": 6}, {"n": 136, "tag": null, "stem": "In the context of Gupta administration, the term &#x27;vithi&#x27; referred to a/an:", "opts": {"a": "elephantry unit", "b": "administrative unit", "c": "personal guard of the king", "d": "soldier"}, "ans": "b", "exp": "Administrative unit. In Gupta&#x27;s period, there was a hierarchy of administrative divisions from top to bottom. The empire was called by various names such as Rajya, Rashtra, Desha, Mandala, Prithvi, and Avani. It was divided into provinces, which were further divided into Vishayas. A Vishayapati administered the Vishaya. A part of the Vishaya was called Vithi.", "t": 0, "s": 6}, {"n": 137, "tag": null, "stem": "Assertion (A): Chandragupta I married a princess from the Lichchhavi clan to strengthen his political power.<br><b>Reason (R): <\/b>The Lichchhavi clan was headquartered at Vaishali in present-day Bihar.", "opts": {"a": "Both A and R are true, and R is the correct explanation of A", "b": "Both A and R are true, but R is not the correct explanation of A", "c": "A is true, R is false", "d": "A is false, R is true"}, "ans": "b", "exp": "Both A and R are true, but R  <mark>is not the correct explanation of A. <\/mark> Reason is factual but not the direct reason for the political purpose of the marriage.", "t": 0, "s": 6}, {"n": 138, "tag": null, "stem": "Which of the following plays was NOT written by Harshavardhana ?", "opts": {"a": "Vikramorvasiyam", "b": "Ratnavali", "c": "Nagananda", "d": "Priyadarshika"}, "ans": "a", "exp": "Vikramorvasiyam is a romantic play written by Kalidasa, based on the legend of King Pururava and an Apsara named Urvashi. Kalidasa&#x27;s works include: Abhijnanasakuntalam, Malavikagnimitram, Kumarasambhavam.", "t": 0, "s": 7}, {"n": 139, "tag": null, "stem": "Pulakeshin II assumed the title of ‘Dakshinapatheshvara’ (lord of the south) after defeating which of the following rulers of north India ?", "opts": {"a": "Rudrasena II", "b": "Harshavardhana", "c": "Dhruvasena II", "d": "Prabhakarvardhana"}, "ans": "b", "exp": "Harshavardhana (606-647 AD) belonged to the Pushyabhuti dynasty, also known as the Vardhana dynasty. He wanted to extend his power in the Deccan but he was defeated by Pulakesin II, the Chalukya ruler, on the bank of river Narmada. The river thus became the southern boundary of his kingdom. Vardhana dynasty: Founder - Pushyabhuti. Capital: Thanesar (Thaneshwar), later Kannauj (Kanyakubja).", "t": 0, "s": 7}, {"n": 140, "tag": null, "stem": "With reference to the Pushyabhuti (Vardhana) dynasty, consider the following statements:<br>A. The Pushyabhuti dynasty rose to prominence in northern India after the decline of the Gupta Empire.<br>B. Prabhakarvardhana strengthened the dynasty’s position in Punjab and Haryana after defeating the Hunas.<br>C. The capital of the dynasty was Ujjain. Which of the above statements is/are correct ?", "opts": {"a": "A and B only", "b": "B and C only", "c": "A and C only", "d": "A, B and C"}, "ans": "a", "exp": "A and B only. The Pushyabhuti dynasty, also known as the Vardhana dynasty, established its power in present-day Haryana with Sthanishvara (Thaneshwar) as its capital. After defeating the Hunas, Prabhakarvardhana consolidated the dynasty’s rule in Punjab and Haryana. The dynasty later reached its zenith under Harshavardhana (606–647 CE).", "t": 0, "s": 7}, {"n": 141, "tag": null, "stem": "Thaneswar where the Vardhana dynasty ruled around the present-day state of _______.", "opts": {"a": "Madhya Pradesh", "b": "Haryana", "c": "Rajasthan", "d": "Gujarat"}, "ans": "b", "exp": "Haryana. ", "t": 0, "s": 7}, {"n": 142, "tag": null, "stem": "According to which of the following foreign travellers did Dhruvasena II attend Harsha’s assembly at Prayag (Allahabad) ?", "opts": {"a": "Marco Polo", "b": "Hiuen Tsang", "c": "Fa-Hien", "d": "I-tsing"}, "ans": "b", "exp": "Hiuen Tsang (Xuanzang) <mark>- <\/mark> Chinese Buddhist monk who travelled from China to India to study Buddhism and obtain Buddhist scriptures during the reign of King Harsha Vardhan. Assembly of Prayag (Maha Moksha Parishad) - Harsha Vardhan gave all his belongings in charity for the welfare of the public.", "t": 0, "s": 7}, {"n": 143, "tag": null, "stem": "Who sent an envoy to the Chinese court in 641 AD ?", "opts": {"a": "Narsimhavarman I", "b": "Harsha Vardhan", "c": "Narsimhavarman II", "d": "Pulakesin I"}, "ans": "b", "exp": "Harsha Vardhan. In 641 AD Harshavardhan sent an envoy to Taizong (Tai-Tsung), the Tang emperor of China and in return, the Chinese ruler sent three embassies to Harsha court.", "t": 0, "s": 7}, {"n": 144, "tag": null, "stem": "After about 75 years of Harshavardhana&#x27;s death___rose to power in Kannauj.", "opts": {"a": "Yashovarman", "b": "Yadagiri", "c": "Mahendravarman", "d": "Pulakeshin II"}, "ans": "a", "exp": "Yashovarman. He was the founder of the Varman dynasty of Kanauj and surrounding areas during the 8th and the 9th centuries.", "t": 0, "s": 7}, {"n": 145, "tag": null, "stem": "Consider the following statements regarding Harshavardhana:<br>A. He ruled from 606 CE to 647 CE.<br>B. He authored three Sanskrit plays – Nagananda, Ratnavali, and Priyadarshika.<br>C. His capital was Kannauj from the very beginning of his reign. Which of the above statements is/are correct ?", "opts": {"a": "A and B only", "b": "B and C only", "c": "A and C only", "d": "A, B and C"}, "ans": "a", "exp": "A and B only.  Harshavardhana ruled from 606 CE to 647 CE and authored three Sanskrit plays. Statement C is incorrect because he initially ruled from Thaneshwar and later shifted his capital to Kannauj.", "t": 0, "s": 7}, {"n": 146, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Which Chola ruler is credited with the construction of irrigation systems to support agriculture?", "opts": {"a": "Raja Raja Chola I", "b": "Rajendra Chola I", "c": "Kulottunga Chola I", "d": "Aditya Chola I"}, "ans": "b", "exp": "Rajendra Chola I , to commemorate his victorious expedition to the Gangetic plains, built a new capital called Gangaikonda Cholapuram. Near this capital, he created a colossal artificial lake, an irrigation tank named Cholagangam. This engineering marvel, described as a &quot;liquid pillar of victory,&quot; was fed by canals to irrigate vast tracts of land in the surrounding areas.", "t": 0, "s": 8}, {"n": 147, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Which Chola ruler is credited with the extensive overseas expedition to Southeast Asia, particularly against the Srivijaya Empire ?", "opts": {"a": "Rajendra", "b": "Kulothunga I", "c": "Vijayalaya Chola", "d": "Rajaraja I"}, "ans": "a", "exp": "Rajendra Chola I (1014–1044 CE), son of Rajaraja Chola I, is known for: Naval campaign (1025 CE): Defeated Srivijaya Empire, controlling Southeast Asian trade routes. Title “Gangaikonda Chola”: Earned after his northern expedition up to the Ganga. Expanded Chola power across India and Southeast Asia. Kulothunga I – Known for administrative reforms. Vijayalaya Chola – Founder of the Chola dynasty revival in the 9th century. Rajaraja I – Expanded Chola empire in India and parts of Sri Lanka, but overseas expeditions to Srivijaya were led by his son Rajendra.", "t": 0, "s": 8}, {"n": 148, "tag": null, "stem": "With reference to medieval history, consider the following statements.<br>1. The founder of the Chola dynasty called the ‘Imperial Cholas’ was Vijayalaya (9th century AD).<br>2. One of the important dynasties which ruled in northern India was Gurjara-Pratiharas.<br>3. Palas ruled in western India and Rashtrakutas ruled in southern India in the early years (750 -1000). Which of the given statement(s) is/are correct ?", "opts": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 only", "d": "1 only"}, "ans": "a", "exp": "1 and 2 only. The successors of Vijayalaya expanded the Chola kingdom by annexing Pandyan and Pallava territories. Rajaraja I, who became king in 985, strengthened and reorganized the empire. His son, Rajendra I, further extended the Chola influence with expeditions to the Ganga valley, Sri Lanka, and Southeast Asia, supported by a powerful navy. Palas ruled in eastern India and Rashtrakutas ruled in the Deccan region.", "t": 0, "s": 8}, {"n": 149, "tag": null, "stem": "One of the greatest of Chola rulers, Rajaraja I ruled from 985 AD to ______.", "opts": {"a": "1015 AD", "b": "1017 AD", "c": "1014 AD", "d": "1018 AD"}, "ans": "c", "exp": "1014 AD. The Chola Empire was founded by Vijayalaya. Rajaraja I was known for his conquests of South India and parts of Sri Lanka. He built the great Brihadisvara Temple at the Chola capital Thanjavur.", "t": 0, "s": 8}, {"n": 150, "tag": null, "stem": "Which of the following animals was the emblem of the Chola dynasty ?", "opts": {"a": "Wolf", "b": "Horse", "c": "Elephant", "d": "Tiger"}, "ans": "d", "exp": "Tiger. Three dynasties ruled during the Sangam Age. Cheras: Modern-Day City (Kerala), Ancient Capital (Vanji), Important Ports (Musiri, Tondi), Emblem (Bow and Arrow). Cholas: Modern-Day City (Tamil Nadu), Ancient Capital (Uraiyur, Puhar), Important Ports (Kaveripattinam). Pandyas: Modern-Day City (Tamil Nadu), Ancient Capital (Madurai), Important Ports {Muziris (Muchiri), Korkai, Kaveri}, Emblem (Carp).", "t": 0, "s": 8}, {"n": 151, "tag": null, "stem": "Brihadiswara Temple of Tanjore was built by which of the following Chola emperors ?", "opts": {"a": "Vijayalaya", "b": "Chamunda Raya", "c": "Rajendra I", "d": "Raja Raja Chola"}, "ans": "d", "exp": "Raja Raja Chola. The Brihadisvara Temple (Dravidian-style) also known as Raja Rajeswara Temple is dedicated to Shiva. It was declared a UNESCO World Heritage Site in 1987.", "t": 0, "s": 8}, {"n": 152, "tag": null, "stem": "Which among the following Chola emperors defeated the Pandya king Maravarman Rajsimha II in the battle of Vellore ?", "opts": {"a": "Parantaka I", "b": "Rajendra I", "c": "Rajaraja I", "d": "Vijayalaya"}, "ans": "a", "exp": "Parantaka I. Rajaraja I, the son of Parantaka II, is the most celebrated of the Chola kings and ascended the throne in 985 AD. Rajendra I, the son of Rajaraja I, became the first Chola king to venture to the banks of the Ganges, earning the title &quot;Victor of the Ganges.&quot;", "t": 0, "s": 8}, {"n": 153, "tag": null, "stem": "With reference to the Chola inscriptions, consider the following statements:<br>A. The Uttaramerur inscription provides details about the organisation of the sabha in Chola local administration.<br>B. It belongs to the reign of the Chola king Parantaka I and is dated to 919 CE and 921 CE.<br>C. It provides evidence of the Chola empire’s military conquests in Sri Lanka. Which of the above statements is/are correct ?", "opts": {"a": "A and B only", "b": "B and C only", "c": "A and C only", "d": "A, B and C"}, "ans": "a", "exp": "A and B only. The Uttaramerur inscription (919 CE, 921 CE) issued during the reign of Parantaka I gives detailed information on the functioning of village assemblies (sabhas), rules of election, qualifications and disqualifications of members, and reflects India’s long tradition of self-governance.", "t": 0, "s": 8}, {"n": 154, "tag": null, "stem": "In the 11th century, the army of which of the following Cholas reached upto Ganga to invade Bengal ?", "opts": {"a": "Rajendra I", "b": "Rajaraja I", "c": "Vijayalaya", "d": "Rajadhiraj I"}, "ans": "a", "exp": "Rajendra I (1014 and 1044 CE) <mark>- <\/mark>He was also known as Gangaikonda Chola. He defeated Mahipala, the Pala king of Bengal and Bihar.", "t": 0, "s": 8}, {"n": 155, "tag": null, "stem": "Who among the following rulers invaded Malaya to liberate their trade with China ?", "opts": {"a": "Pallava", "b": "Chola", "c": "Chalukya", "d": "Rashtrakuta"}, "ans": "b", "exp": "Chola dynasty .", "t": 0, "s": 8}, {"n": 156, "tag": null, "stem": "Sabha and Ur, two kinds of village assemblies are referred to in which of the following dynasties ?", "opts": {"a": "Chola", "b": "Rashtrakuta", "c": "Gurjara Pratihara", "d": "Chalukya"}, "ans": "a", "exp": "Chola. Ur - Assembly of common villagers. <mark>Sabha - <\/mark>Assembly in the villages which were inhabited predominantly by the Brahmanas. <mark>Nagaram <\/mark>- Assembly of merchants, traders and artisans.", "t": 0, "s": 8}, {"n": 157, "tag": null, "stem": "&quot;Brahmadeya&quot;, a type of land during the Chola Period was the _______.", "opts": {"a": "land gifted to Brahmans", "b": "land of non-Brahmana peasant proprietors", "c": "land gifted to temples", "d": "land of royal person"}, "ans": "a", "exp": "Land gifted to Brahmans.  There were five types of &#x27;land gifts&#x27; that Chola kings gave to their people on the basis of Chola inscriptions : Vellanvagai - For non-Brahmana, peasant proprietors. Shalabhoga - For the maintenance of a school. Devadana or Tirunamattukkani - Land gifted to temples. Pallichchhandam - Land donated to Jaina institutions.", "t": 0, "s": 8}, {"n": 158, "tag": null, "stem": "Consider the following statements regarding the Airavatesvara Temple:<br>1. The Airavatesvara Temple at Darasuram was built by Rajaraja Chola II.<br>2. The temple is dedicated to Lord Vishnu and is part of the Vaishnava temple group.<br>3. Maharaja Sawai Jai Singh II renovated the temple in the 18th century. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 and 2", "b": "1 and 3", "c": "2 and 3", "d": "1, 2 and 3"}, "ans": "c", "exp": "2 and 3. The Airavatesvara Temple at Darasuram (Tamil Nadu) was built by Rajaraja Chola II in the 12th century and is dedicated to Lord Shiva. Hence, Statements 2 and 3 are incorrect.", "t": 0, "s": 8}, {"n": 159, "tag": null, "stem": "The term &quot;Vetti&quot; in Chola empire is related to ______", "opts": {"a": "part payments", "b": "army", "c": "forced labour", "d": "gold coins"}, "ans": "c", "exp": "Forced labour. Some types of taxes in Cholas empire: Kadmai or Irai - Tax on land; Pattam and ayam - Taxes imposed on non-agricultural professions like artisans and merchants; Nirvilai or nirkkirai - Water tax; Ulku and sungam - Toll tax; Tattar-pattam - A tax levied on gold -smiths; Sangam - Export and import taxes; Kannala Kanam - Marriage tax; Poorvi - War tax.", "t": 0, "s": 8}, {"n": 160, "tag": null, "stem": "Sultan Mahmud of Ghazni was a contemporary of which Chola king ?", "opts": {"a": "Rajaraja I", "b": "Rajendra II", "c": "Rajadhiraja", "d": "Rajendra I"}, "ans": "d", "exp": "Rajendra I who ruled from 1014 to 1044 CE. Ghazni invaded India seventeen times. In 1018 he plundered the holy city of Mathura and also attacked Kannauj.", "t": 0, "s": 8}, {"n": 161, "tag": null, "stem": "In the early eleventh century, the Chola king Rajendra I built a Shiva temple and filled it with a Sun-pedestal seized from the ______.", "opts": {"a": "Palas", "b": "Vakatakas", "c": "Chalukyas", "d": "Kalingas"}, "ans": "c", "exp": "Chalukyas. Chola king <mark>Rajendra-I <\/mark>(reigned between 1014 and 1044 CE) built a Shiva temple in his capital, Gangaikondacholapuram (north Tamil Nadu) and filled it with prized statues seized from defeated rulers such as Sun-pedestal (Chalukyas), a Ganesha statue and several statues of Durga, a Nandi statue, an image of Bhairava and Bhairavi (Kalingas of Orissa), and a Kali statue (Palas of Bengal).", "t": 0, "s": 8}, {"n": 162, "tag": null, "stem": "Who among the following belonged to the ancient chiefly family of the Cholas from Uraiyur, captured the Kaveri delta from the Muttaraiyar in the middle of the ninth century ?", "opts": {"a": "Gandaraditya", "b": "Vijayalaya", "c": "Parantaka I", "d": "Aditya I"}, "ans": "b", "exp": "Vijayalaya founded the Chola Empire and captured Thanjavur (Capital of Chola Empire) in 850 CE. He constructed a temple for the goddess Nishumbhasudini in Thanjavur.", "t": 0, "s": 8}, {"n": 163, "tag": null, "stem": "Consider the following statements regarding temple towns in medieval India:<br>1. Bhillasvamin developed as a temple town during the Chola dynasty.<br>2. Ajmer was the chief temple town patronised by the Cholas.<br>3. Ahmednagar grew as an important temple town under the Cholas. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "1 and 2 only", "c": "1 and 3 only", "d": "2 and 3 only"}, "ans": "a", "exp": "1 only. Bhillasvamin was the temple town that flourished under the Chola dynasty. Ajmer and Ahmednagar were not Chola temple towns; they developed under other dynasties.", "t": 0, "s": 8}, {"n": 164, "tag": null, "stem": "Which of the following territories to the south and north were made part of the Chola kingdom by the successors of the ruler Vijayalaya ?", "opts": {"a": "Pallava and Chera", "b": "Pandyan and Pallava", "c": "Rashtrakuta and Chera", "d": "Vakataka and Satavahana"}, "ans": "b", "exp": "Pandaya and Pallava. The Pallava dynasty (275 CE to 897 CE, Capital - Kanchipuram) ruled in Deccan (Tondaimandalam). Pandya (Capital - Madurai). The Cheras (Capital - Vanji), Greatest ruler of Cheras - Senguttuvan, also known as Red Chera.", "t": 0, "s": 8}, {"n": 165, "tag": null, "stem": "Which dynasty bronze statues were made using the &quot;lost wax&quot; technique ?", "opts": {"a": "Chola", "b": "Pandya", "c": "Chalukya", "d": "Pala"}, "ans": "a", "exp": "Chola . Bronze is an alloy of copper and tin. The lost wax technique is a method of metal casting in which molten metal is poured into a mold that has been created by means of a wax model. Examples: Nataraja Bronze Casting, Shiva and Parvati (Sivagami, 1012 CE), etc.", "t": 0, "s": 8}, {"n": 166, "tag": null, "stem": "Puhar or Kaveripattinam, was the port of which of the following dynasty ?", "opts": {"a": "Cheras", "b": "Cholas", "c": "Pandyas", "d": "Vakatakas"}, "ans": "b", "exp": "Cholas (8th-12th century AD) th was founded by Vijayalaya in the 8 century. Rajaraja Chola (greatest king of the Chola Empire) reigned between 985 and 1014 C.E.", "t": 0, "s": 8}, {"n": 167, "tag": "SSC Stenographer 7/08/2025 (Shift 1)", "stem": "Which Pala ruler is known for founding the great Buddhist university at Vikramashila ?", "opts": {"a": "Dharmapala", "b": "Mahipala I", "c": "Gopala I", "d": "Devapala"}, "ans": "a", "exp": "Dharmapala. Dharmapala (770-810 CE), the second ruler of the Pala Dynasty and son of Gopala, greatly expanded the empire’s power in northern and eastern India. His reign was notable for the tripartite struggle over Kanauj against the Pratiharas and Rashtrakutas. A devoted Buddhist, he founded the famous Vikramashila monastery in Bihar and also revived Nalanda University. Under his patronage, art, architecture, and scholarship flourished. Dharmapala is remembered as the most powerful and influential Pala ruler.", "t": 0, "s": 9}, {"n": 168, "tag": "SSC Stenographer 7/08/2025 (Shift 3)", "stem": "Whom Hiuen Tsang called &quot;one of the four lights of world&quot;, who&#x27;s also called Indian Einstein ?", "opts": {"a": "Charak", "b": "Vasumitra", "c": "Ashvaghosha", "d": "Nagarjuna"}, "ans": "d", "exp": "Nagarjuna was a 2nd-century Indian philosopher who founded the Madhyamaka school of Mahayana Buddhism. Hiuen Tsang praised him as “one of the four lights of the world” for his intellectual depth. Due to his profound philosophical insights, he is also known as the “Indian Einstein.”", "t": 0, "s": 9}, {"n": 169, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Which dynasty was founded by Dantidurga in the mid-8th century ?", "opts": {"a": "Rashtrakuta Dynasty", "b": "Chola Dynasty", "c": "Pala Dynasty", "d": "Pratihara Dynasty"}, "ans": "a", "exp": "Rashtrakuta Dynasty.  Dantidurga (c. 735–756 CE) is credited with founding the Rashtrakuta Dynasty in the Deccan region. He overthrew the Chalukyas of Badami and established Rashtrakuta power with his capital at Manyakheta (present-day Malkhed in Karnataka). The dynasty later rose to prominence under rulers like Govinda III and Amoghavarsha I, becoming one of the most powerful empires of early medieval India. The Rashtrakutas were great patrons of art, architecture, and literature (e.g., the famous Kailasa Temple at Ellora was built under King Krishna I). Chola Dynasty – Ancient Tamil dynasty, revived later by Vijayalaya Chola (9th century). Pala Dynasty – Founded by Gopala in Bengal (8th century). Pratihara Dynasty – Founded by Nagabhata I in Rajasthan (8th century).", "t": 0, "s": 9}, {"n": 170, "tag": null, "stem": "Consider the following statements regarding the Great Stupa of Amaravati:<br>1. The walls of the Great Stupa of Amaravati in the Lower Godavari region were adorned with bas relief sculptures.<br>2. The Amaravati school of art flourished under the patronage of the Mauryan rulers. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The Amaravati school of art flourished under the patronage of the Satavahanas in the Andhra region. Nagarjunkonda, another notable site, is renowned for its Buddhist architecture.", "t": 0, "s": 9}, {"n": 171, "tag": null, "stem": "Select the correct alternative on the given statements based on Ashoka&#x27;s Lion capital and India&#x27;s State Emblem.<br><b>Statement I: <\/b>In the original Ashoka&#x27;s Lion Capital, there are four lions mounted back- to-back on a circular abacus that itself rests on a bell-shaped lotus.<br><b>Statement II: <\/b>The State Emblem is an adaptation of the Lion Capital of Asoka at Sarnath in which the bell-shaped lotus was omitted.", "opts": {"a": "Only Statement II is true.", "b": "Both Statement I and Statement II are true.", "c": "Neither Statement I nor Statement II is true.", "d": "Only Statement I is true."}, "ans": "b", "exp": "Both Statement I and  <mark>statement II are true. <\/mark>The Lion Capital of Ashoka, carved around 250 BCE, is the head of a column erected by Emperor Ashoka at Sarnath, near Varanasi, India. Ashoka, the 3rd ruler of the Mauryan Empire (c. 268–232 BCE), governed a vast territory that stretched from present-day Afghanistan to Bangladesh, with Pataliputra as its capital.", "t": 0, "s": 9}, {"n": 172, "tag": null, "stem": "Sun temple at Modhera was built by which of the following rulers ?", "opts": {"a": "Govinda II", "b": "Aditya I", "c": "Krishna Deva Raya", "d": "Raja Bhimdev I"}, "ans": "d", "exp": "Raja Bhimdev I. He was a Chaulukya king who ruled parts of present-day Gujarat, India. The Sun Temple of Modhera, dedicated to the solar deity Surya, is located in Modhera village, Mehsana district, Gujarat, on the bank of the river Pushpavati.", "t": 0, "s": 9}, {"n": 173, "tag": null, "stem": "Kautilya has mentioned the concept of Saptanga Rajya to understand the State with seven organs and one of them is Danda, which means:", "opts": {"a": "Ministers", "b": "Ally", "c": "Fort", "d": "Force"}, "ans": "d", "exp": "Force. Kautilya, also known as Chanakya, outlined the Saptanga theory of the state in the Arthashastra, identifying seven key components: Swami (King), Amatya (Minister), Janapada (Territory), Durga (Fort), Kosa (Treasure), Danda (Army or Force), and Mitra (Ally).", "t": 0, "s": 9}, {"n": 174, "tag": null, "stem": "The Dhakeshwari Temple in present day Bangladesh has been constructed under the rule of which dynasty ?", "opts": {"a": "Chandela", "b": "Parmara", "c": "Rashtrakuta", "d": "Sena"}, "ans": "d", "exp": "Sena. The National Temple of Bangladesh is the Dhakeshwari Temple, located in the capital, Dhaka. Dhakeshwari means &quot;Goddess of Dhaka&quot; and was built in the 12th century by King Ballal Sen of the Sena dynasty.", "t": 0, "s": 9}, {"n": 175, "tag": null, "stem": "Consider the following statements regarding the construction of Nalanda University:<br>1. The excavated ruins of Nalanda University indicate that bright red bricks were used in its construction.<br>2. Nalanda University was founded by Ashoka the Great. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. The Ancient Nalanda University was founded by Kumaragupta I. Nalanda University was destroyed in 1193 CE by Bakhtiyar Khilji, a Turkish military general. The Chinese scholars I-Qing and Xuan Zang visited Nalanda in the 7th century CE. The ancient Nalanda was a centre of learning from the 5th century CE to 12th century CE. Located in present day Rajgir, Bihar.", "t": 0, "s": 9}, {"n": 176, "tag": null, "stem": "Who excavated the Chira Tope stupa at Taxila ?", "opts": {"a": "James Mill", "b": "James Princip", "c": "Alexander Cunningham", "d": "John Marshall"}, "ans": "d", "exp": "John Marshall. Dharmarajika Stupa in Taxila, Pakistan is also known as Chir Tope, which means &quot;Scarred hill&quot;.", "t": 0, "s": 9}, {"n": 177, "tag": null, "stem": "Which among the following dynasties originated from the Yueh-chih tribe of China ?", "opts": {"a": "Guptas", "b": "Satavahanas", "c": "Parthians", "d": "Kushanas"}, "ans": "d", "exp": "Kushanas. They migrated from China to Bactria, then to areas of Afghanistan and finally into India around the 1st century CE.", "t": 0, "s": 9}, {"n": 178, "tag": null, "stem": "Details about Sudarshana lake are given in a rock inscription at Girnar (Junagarh), which was composed to record the achievements of the Shaka ruler _______.", "opts": {"a": "Rudrasimha III", "b": "Rudradaman I", "c": "Chashtana", "d": "Maues"}, "ans": "b", "exp": "Rudradaman I . Junagadh inscription is written in the Sanskrit language. It is located near Girnar hill near Junagadh in Gujarat. The Junagadh rock contains inscriptions of Ashoka (one of the fourteen Major Rock Edicts of Ashoka), Rudradaman I and Skandagupta.", "t": 0, "s": 9}, {"n": 179, "tag": null, "stem": "Silappathikaram (the Jewelled Anklet), the earliest epic poem in Tamil was written in the 5 th - 6 th Century CE by ______.", "opts": {"a": "Tolkappiyar", "b": "Ilango Adigal", "c": "Sittalai Sattanar", "d": "Tirumalisai Alwar"}, "ans": "b", "exp": "Ilango Adigal. Ancient Tamil literature is known as Sangama Literature. The Sangam literature includes Tolkappiyam, Ettutogai, Pattuppattu, Pathinenkilkanakku, and two epics named – Silappathikaram, and Manimegalai (Written by Sittalai Sattanar). The earliest known work in ancient Tamil is Agastyam.", "t": 0, "s": 9}, {"n": 180, "tag": null, "stem": "In the 7th Century AD, a new religion called Islam was born in _______.", "opts": {"a": "Malaysia", "b": "South Africa", "c": "Arabia", "d": "Indonesia"}, "ans": "c", "exp": "Arabia. Prophet Muhammad established Islam. He was born around 570 AD in Mecca. In 622 AD, he completed the Hegira, his migration from Mecca to Medina, to escape persecution.", "t": 0, "s": 9}, {"n": 181, "tag": null, "stem": "Consider the following statements regarding Gautamiputra Satakarni:<br>1. Gautamiputra Satakarni, titled Rajaraja and Maharaja, belonged to the Shunga dynasty.<br>2. The Satavahana dynasty, founded by Simuka, primarily ruled over present-day Andhra Pradesh, Maharashtra, Telangana, and parts of Gujarat, Karnataka, and Madhya Pradesh. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. The Satavahana Dynasty, founded by Simuk, primarily encompassed present-day Andhra Pradesh, Maharashtra, and Telangana, along with portions of Gujarat, Karnataka, and Madhya Pradesh.", "t": 0, "s": 9}, {"n": 182, "tag": null, "stem": "Valabhi, a city of ancient India was the capital of the ______dynasty from the 5th to 8th Century CE.", "opts": {"a": "Maitraka", "b": "Chalukya", "c": "Pallava", "d": "Vakataka"}, "ans": "a", "exp": "Maitraka. The Maitraka dynasty was founded by Senapati Bhatarka. The decline of the Gupta Empire led to the rise of various ruling dynasties across northern India. Among the most notable were the Pushyabhutis of Thanesar, the Maukhari of Kanauj, and the Maitrakas of Valabhi.", "t": 0, "s": 9}, {"n": 183, "tag": null, "stem": "Vasudeva I who issued coins in gold (dinars and quarter dinars) and copper (single denomination) was a ______ king.", "opts": {"a": "Shunga", "b": "Vakataka", "c": "Shaka", "d": "Kushana"}, "ans": "d", "exp": "Kushana. Vasudeva I was the last of the &quot;Great Kushans.&quot; He ruled in Northern India and Central Asia, where he minted coins in the city of Balkh. The Kushana dynasty was founded by Kujula Kadphises.", "t": 0, "s": 9}, {"n": 184, "tag": null, "stem": "Consider the following statements regarding the Sanskrit historical poem Ramacharita by Sandhyakar Nandi:<br>1. The hero of the poem Ramacharita is Ramapala, the 15th ruler of the Pala dynasty.<br>2. Sandhyakar Nandi was patronized by the Gupta ruler Samudragupta. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Ramapala was the successor to the Pala king Shurapala II in the Bengal region of the Indian subcontinent, and 15th ruler of the Pala line. Sandhyakar Nandi was patronaged by Madanapala, ruler of Pala Dynasty.", "t": 0, "s": 9}, {"n": 185, "tag": null, "stem": "Vindhyashakti was the founder of which of the following dynasties ?", "opts": {"a": "Pallava", "b": "Maukhari", "c": "Vakataka", "d": "Chalukya"}, "ans": "c", "exp": "Vakataka dynasty originated from the Deccan in the mid-3rd century CE. Vakatakas were the most important successors of the Satavahanas in the Deccan and coexistent with the Guptas in northern India.", "t": 0, "s": 9}, {"n": 186, "tag": null, "stem": "An inscription, Takht-i-Bahi recovered from Mardan near Peshawar, indicates the rule of which of the following dynasties in north-western area of present Pakistan ?", "opts": {"a": "Bactrian", "b": "Sakas", "c": "Indo-Greek", "d": "Parthians"}, "ans": "d", "exp": "Parthians (247 BC - 224 AD) <mark>. <\/mark> It was founded by Arsaces I of Parthia when he rebelled against the Seleucid Empire. They replaced the Sakas in North-Western India. The Takht-i-Bahi inscription, dated in 45 AD, refers to Gondophernes as a Parthian ruler.", "t": 0, "s": 9}, {"n": 187, "tag": null, "stem": "The Maukharis ruled over which of the following cities in western Uttar Pradesh that over the time replaced Pataliputra as a political centre of north India ?", "opts": {"a": "Kannauj", "b": "Bareli", "c": "Agra", "d": "Kanpur"}, "ans": "a", "exp": "Kannauj. The Maukharis, initially vassals of the Guptas and titled Samantas, gained independence in the mid-6th century as the Gupta Empire declined.", "t": 0, "s": 9}, {"n": 188, "tag": null, "stem": "Under which of the following Pala king&#x27;s patronage the Vikramshila university in 8th century India was founded ?", "opts": {"a": "Gopala", "b": "Mahipala I", "c": "Devapala", "d": "Dharmapala"}, "ans": "d", "exp": "Dharmapala , the second ruler of the Pala Dynasty, ascended the throne around 780 AD after Gopala and expanded the empire significantly. He defeated Indrayudha of Kanauj, installing Chakrayudha as his nominee, but later faced defeat by Rashtrakuta king Dhruva near Monghyr, Bihar.", "t": 0, "s": 9}, {"n": 189, "tag": null, "stem": "Three Poets Pampa, Ponna and Ranna are called as the ‘Three Jewels’ of:", "opts": {"a": "Kannada Literature", "b": "Telugu Literature", "c": "Tamil Literature", "d": "Sanskrit Literature"}, "ans": "a", "exp": "Kannada Literature. Pampa, also known as Adi Pampa, is renowned for his literary works, including &quot;Vikramarjuna Vijaya&quot; and &quot;Adi Purana.&quot; Ponna, often referred to as Ponna Kavishwara, served as a court poet for Rashtrakuta king Krishna III and is best known for his epic &quot;Shantipurana.&quot; Ranna was a court poet of the Western Chalukya Empire, and his most celebrated work is &quot;Gadayuddha.&quot;", "t": 0, "s": 9}, {"n": 190, "tag": null, "stem": "Consider the following statements regarding the Satavahana administration:<br>1. The Satavahana kingdom was divided into subdivisions called Aharas or Rashtras, which meant districts.<br>2. The Satavahana administration used only cash as a mode of revenue collection. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Satavahana : Period : 60 BC - 225 AD; Capital - Pratishthana (Paithan) and Amravati; Founder - Simuka. The lowest level of administration was a grama which was under the charge of a Gramika. There were also officers called amatyas who were perhaps ministers or advisors of the king. Revenue was collected both in cash and kind. It majorly comprised present Andhra Pradesh, Telangana, and Maharashtra.", "t": 0, "s": 9}, {"n": 191, "tag": null, "stem": "______, authored by Tolkappiyar is the earliest Tamil literature.", "opts": {"a": "Tolkappiyam", "b": "Ettutogai", "c": "Kalittogai", "d": "Narrinai"}, "ans": "a", "exp": "Tolkappiyam. Tamil has a literary tradition that goes back to the period of the Sangams. The most well-known surviving works from this period are the Tolkappiyam (a book of grammar attributed to Tolkappiyar), Ettu Togai (Eight Anthologies), Pattu Pattu (Ten Idylls).", "t": 0, "s": 9}, {"n": 192, "tag": null, "stem": "Consider the following statements regarding the Pandya Kingdom:<br><b>Statement 1: <\/b>The Pandya Kingdom was first mentioned by Megasthenes, who said that it was famous for pearls.<br><b>Statement 2: <\/b>The capital of the Pandya Kingdom was Madurai.", "opts": {"a": "Both statements are true, and Statement 2 correctly explains Statement 1", "b": "Both statements are true, but Statement 2 does not explain Statement 1", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "b", "exp": "Megasthenes: A Greek diplomat and historian who mentioned the Pandya Kingdom in his book Indica around 300 BCE. The Pandya Kingdom was an ancient Tamil kingdom that ruled parts of southern India, especially Tamil Nadu, from the 6th century BCE to the 15th century CE.", "t": 0, "s": 9}, {"n": 193, "tag": null, "stem": "In peninsular India, which of the following kingdoms was the local power that ruled over northern Maharashtra and Vidarbha ?", "opts": {"a": "Vakatakas", "b": "Maukharis", "c": "Maitrakas", "d": "Chalukyas"}, "ans": "a", "exp": "Vakatakas. Vindhyashakti founded the Vakataka dynasty in the third century. Their history is mainly known through land grant charters issued to Brahmanas. The Maukhari dynasty ruled over (modern day) Uttar Pradesh and parts of Bihar.", "t": 0, "s": 9}, {"n": 194, "tag": null, "stem": "In 10 th century India, Queen Didda became the ruler of which of the following regions of north India ?", "opts": {"a": "Kannauj", "b": "Malwa", "c": "Delhi", "d": "Kashmir"}, "ans": "d", "exp": "Kashmir. Didda was the ruler of Kashmir from 980 CE to 1003 CE. Most knowledge relating to Didda is obtained from the Rajatarangini. Ashish Kaul&#x27;s novel Didda: The Warrior Queen of Kashmir is based on Didda&#x27;s life.", "t": 0, "s": 9}, {"n": 195, "tag": null, "stem": "Mahendravarman I who wrote Mattavilasa-prahasana is related to which of the following ruling dynasties ?", "opts": {"a": "Maitraka", "b": "Pallava", "c": "Pushyabhuti", "d": "Chalukya"}, "ans": "b", "exp": "Pallava dynasty (275 CE to 897 CE) - They ruled a significant portion of the Deccan, also known as Tondaimandalam, which covered parts of present-day Tamil Nadu and Andhra Pradesh. Founder - Simha Vishnu (Avanisimha).", "t": 0, "s": 9}, {"n": 196, "tag": null, "stem": "The Pratiharas who first had their capital at Bhinmal gained prominence during the rule of:", "opts": {"a": "Nagabhatta I", "b": "Nagarjuna", "c": "Devpala", "d": "Kanishka"}, "ans": "a", "exp": "Nagabhatta I (Reign : 730 - 760 AD) laid the foundation of the Pratihara dynasty&#x27;s power. He is best known for defeating the Arabs during their expansion and building an empire that stretched from Gujarat to Gwalior, stopping further Arab invasions in eastern Sindh.", "t": 0, "s": 9}, {"n": 197, "tag": null, "stem": "According to the inscriptions, Pushyamitra Shunga was a devotee of which of the following Gods ?", "opts": {"a": "Rama", "b": "Shiva", "c": "Krishna", "d": "Indra"}, "ans": "c", "exp": "Krishna. Pushyamitra Shunga founded the Shunga Empire after assassinating the last Mauryan emperor, Brihadratha Maurya. He ruled from 184 BC to 75 BC, driving out the Greeks through the Shunga-Greek war. The capital of the Shunga Empire was Pataliputra.", "t": 0, "s": 9}, {"n": 198, "tag": null, "stem": "Consider the following statements regarding the Pallava –Chalukya conflict:<br><b>Statement 1: <\/b>Pallava king Narasimhavarman I defeated Pulakesin II of the Chalukya dynasty around 642 CE.<br><b>Statement 2: <\/b>After this victory, the Pallavas captured the Chalukya capital, Vatapi (Badami), and Narasimhavarman earned the title “Vatapikonda.”", "opts": {"a": "Both statements are true, and Statement 2 correctly explains Statement 1", "b": "Both statements are true, but Statement 2 does not explain Statement 1", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "a", "exp": "Pulakesin II, a ruler of the Chalukya dynasty, reigned from 610 CE to 642 CE, expanding his empire across much of the Deccan region. However, in 642-643 CE, Pallava king Narasimha Varman I defeated Pulakesin II when his general, Shiruttondar Paranjoti, captured the Chalukya capital, Vatapi. Simhavishnu is regarded as the founder of the Pallava dynasty, a Tamil dynasty that ruled parts of South India from the 3rd to the 9th century.", "t": 0, "s": 9}, {"n": 199, "tag": null, "stem": "In the context of Mathura school of Art, during which of the following periods were a number of sculptures of Brahmanical deities, such as Kartikeya, Vishnu and Kubera carved ?", "opts": {"a": "Shaka", "b": "Parthian", "c": "Satavahana", "d": "Kushana"}, "ans": "d", "exp": "The Kushan Empire was a syncretic empire established by the Yuezhi in the Bactrian territories in the early 1st century. The Mathura School of Art flourished under the Kushana emperor Kanishka during the first century AD.", "t": 0, "s": 9}, {"n": 200, "tag": null, "stem": "Consider the following statements about the Badami (Vatapi) Chalukyas:<br><b>Statement 1: <\/b>The Chalukyas of Badami were originally subjects of the Kadambas of Banavasi.<br><b>Statement 2: <\/b>The Chalukyas established their capital at Kanchipuram after gaining independence.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Statement 1 is true, but  <mark>Statement 2 is false. <\/mark>The Kadambas ruled from Banavasi in present-day Karnataka, marking a significant period in the early medieval history of the Deccan region. Badami was the capital of the early Chalukyan dynasty, which governed the area from 543 to 598 CE. With the decline of the Vakataka rule, the Chalukyas established their dominance in the Deccan.", "t": 0, "s": 9}, {"n": 201, "tag": null, "stem": "Which of the following statements about the Pala Dynasty of eastern India is INCORRECT ?", "opts": {"a": "Devapala was the grandson of Gopala.", "b": "Dharmapala founded the Valabhi university.", "c": "The Pala kings were the followers of Buddhism.", "d": "The Pala dynasty was founded by Gopala."}, "ans": "b", "exp": "The Vallabhi University was founded by Bhattarka, the king of the Maitraka Empire, not Dharmapala. Pala Dynasty: The Pala dynasty was founded by Gopala, probably around 750 AD. Dharmapala was the second ruler of the Pala Empire.", "t": 0, "s": 9}, {"n": 202, "tag": null, "stem": "Who among the following rulers was a part of the Tripartite Struggle for the possession of Kannaujn ?", "opts": {"a": "Prithvi Raj III", "b": "Yashovarman", "c": "Dharmapala", "d": "Mahendra Pal"}, "ans": "c", "exp": "Dharmapala. The Tripartite Struggle, also known as the Kannauj Triangle Wars, took place in the 8th and 9th centuries, between the three dynasties - The Palas of Bengal, The Pratiharas of Central India and The Rashtrakutas of Deccan.", "t": 0, "s": 9}, {"n": 203, "tag": null, "stem": "The founder of the Pallava dynasty was:", "opts": {"a": "Balasimha", "b": "Simharaj", "c": "Singhamvishnu", "d": "Simhavishnu"}, "ans": "d", "exp": "Simhavishnu (575-590 AD). He was the first Pallava monarch whose domain extended beyond Kanchipuram (Kanchi) in the South. Rise : Defeating Kalabhras inaugurated the rule of imperial Pallavas. Royal Titles: Avanisimha (lion of the Earth). His court poet Bharavi - Wrote Kiratarjuniya.", "t": 0, "s": 9}, {"n": 204, "tag": null, "stem": "Bilhan was a court poet in which of the following kingdoms ?", "opts": {"a": "Vijayaditya VII", "b": "Vikramaditya VI", "c": "Kulottunga I", "d": "Rajaraja II"}, "ans": "b", "exp": "Vikramaditya VI . The Chalukya dynasty was established by Pulakeshin I in 543. He took Vatapi (modern Badami in Bagalkot district, Karnataka) under his control and made it his capital. He and his descendants are referred to as &quot;Chalukyas of Badami&quot;.", "t": 0, "s": 9}, {"n": 205, "tag": null, "stem": "Which of the following was the port-city of the Pandyan Kingdom ?", "opts": {"a": "Dindigul", "b": "Korkai", "c": "Tenkasi", "d": "Virudhunagar"}, "ans": "b", "exp": "Korkai. Pandya dynasty (4th century BCE to the 17th century CE): Capital - Madurai, Founder - Mudathirumaran.", "t": 0, "s": 9}, {"n": 206, "tag": null, "stem": "Consider the following statements about Dantidurga:<br><b>Statement 1: <\/b>Dantidurga, also known as Dantivarman, was the founder of the Rashtrakuta dynasty.<br><b>Statement 2: <\/b>The Rashtrakuta capital under Dantidurga was established at Kanchipuram.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Manyakheta was the capital of the Rashtrakuta kingdom. The Elichpur clan, initially a feudatory of the Badami Chalukyas, rose to power under Dantidurga by overthrowing Chalukya ruler Kirtivarman II and establishing an empire in the Gulbarga region. This clan became known as the Rashtrakutas of Manyakheta, who emerged as a significant power in Maharashtra-Karnataka region.", "t": 0, "s": 9}, {"n": 207, "tag": null, "stem": "Krishna III of Rashtrakuta dynasty established a victory pillar and a temple at which of the following cities of south India after defeating the Chola ruler Parantaka I ?", "opts": {"a": "Poompuhar", "b": "Udaiyalur", "c": "Takkolam", "d": "Rameswaram"}, "ans": "d", "exp": "Rameswaram. Krishna III whose Kannada name was Kannara (939 – 967 C.E.) was the last great warrior and able monarch of the Rashtrakuta dynasty {Founder: Dantivarman}. Its Capital - Manyakheta. Parantaka I was known as the destroyer of Madurai (the capital city of the Pandyas).", "t": 0, "s": 9}, {"n": 208, "tag": null, "stem": "Consider the following statements regarding Telugu literature:<br><b>Statement 1: <\/b>Nanniah, known as the Adi Kavi of Telugu literature, began the translation of the Mahabharata into Telugu.<br><b>Statement 2: <\/b>Nanniah undertook this work under the patronage of the Pallava king Narasimhavarman.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Nanniah (Nannayya) is regarded as the first poet of Telugu literature and is part of the famous &quot;Trinity of Poets&quot; (comprising Nannaya, Tikkana and Erra Pragada) in Telugu literature. He began the translation of the Mahabharata from Sanskrit into Telugu during the 11th century under the patronage of the Eastern Chalukya king, Rajaraja Narendra.", "t": 0, "s": 9}, {"n": 209, "tag": null, "stem": "Manyakheta or Malkhed was the capital of which of the following kingdoms ?", "opts": {"a": "Rashtrakuta", "b": "Shaka", "c": "Satavahana", "d": "Kushan"}, "ans": "a", "exp": "Rashtrakuta. Dantidurga was the founder of the Rashtrakuta empire who fixed his capital at Manyakheta or Malkhed near modern Sholapur.", "t": 0, "s": 9}, {"n": 210, "tag": null, "stem": "During the reign of which of the Pallava kings was the shore temple at Mahabalipuram built ?", "opts": {"a": "Paramesvaravarman I", "b": "Mahendravarman II", "c": "Narasimhavarman I", "d": "Narasimhavarman II"}, "ans": "d", "exp": "Narasimhavarman II, also known as Rajasimha, ruled the Pallava dynasty from 700 to 728 CE. He also constructed the Kailasanatha Temple in Kanchipuram.", "t": 0, "s": 9}, {"n": 211, "tag": null, "stem": "Rajataranagini, the book authored th by Kalhana in 12 Century was originally written in which of the following languages ?", "opts": {"a": "Tamil", "b": "Telugu", "c": "Sanskrit", "d": "Shaurseni"}, "ans": "c", "exp": "Sanskrit. The word &quot;Rajatarangini&quot; means &quot;River of Kings.&quot; This book chronicles the history of the northwestern Indian subcontinent, specifically the kings of Kashmir. It contains 7,826 verses divided into eight sections known as Tarangas (waves).", "t": 0, "s": 9}, {"n": 212, "tag": null, "stem": "Who among the following was the founder of the Gurjara-Pratihara dynasty in the region of Malwa in the eighth century ?", "opts": {"a": "Vatsaraja", "b": "Mahendrapala I", "c": "Nagabhatta I", "d": "Mihira Bhoja"}, "ans": "c", "exp": "Nagabhatta I. The Gurjara - Pratiharas Dynasty (8th-11th Century A.D.) ruled over northern and western India. Nagabhatta I established an empire extending from Gujarat to Gwalior and defied the Arab invasions towards further east of Sindh.", "t": 0, "s": 9}, {"n": 213, "tag": null, "stem": "Which of the following statements are true regarding the Ravana Phadi cave at Aihole.<br>1. Nataraja is the important structure at this site.<br>2. This Nataraja image is surrounded on the right by four large saptamatrikas and on the left by three large ones.<br>3. The figures have slim, graceful bodies with long oval faces.<br>4. The temple shows a distinct feature of Pandya architecture of mixing and incorporation of several styles.", "opts": {"a": "1, 2 and 4", "b": "2, 3 and 4", "c": "1, 3 and 4", "d": "1, 2 and 3"}, "ans": "d", "exp": "1, 2 and 3. The Ravan Phadi cave, located in Aihole, Karnataka, is an example of early Chalukyan architecture. The First capital of the Chalukya Dynasty was Aihole which is clear from the inscriptions found in the caves of Aihole. The bronze sculpture of Nataraja was cast during the period of the Cholas dynasty.", "t": 0, "s": 9}, {"n": 214, "tag": null, "stem": "Consider the following statements regarding Kailashnath Temple, Ellora.<br>1. It is built completely in the Dravidian style.<br>2. Its main deity is Lord Shiva.<br>3. This temple was carved out of a portion of a hill.<br>4. It was built during the Chola phase at Ellora. Which of the given statements is correct ?", "opts": {"a": "Only 2, 3 and 4", "b": "Only 1, 2 and 3", "c": "Only 1, 2 and 4", "d": "Only 1, 3 and 4"}, "ans": "b", "exp": "Only 1, 2 and 3. The Kailasa temple at Ellora was built by the Rashtrakuta king Krishna I in the 8th century. Located in Cave 16, it is dedicated to Lord Shiva and was carved from a single rock. Named after Mount Kailash, it is the largest of the 34 Buddhist, Jain, and Hindu cave temples at Ellora and was designated a UNESCO World Heritage site in 1983.", "t": 0, "s": 9}, {"n": 215, "tag": null, "stem": "Consider the following statements about the Kushana dynasty:<br><b>Statement 1: <\/b>Kujula Kadphises was the founder of the Kushana dynasty.<br><b>Statement 2: <\/b>Vasudeva I was the last important ruler of the Kushana dynasty.", "opts": {"a": "Both statements are true, and Statement 2 correctly explains Statement 1", "b": "Both statements are true, but Statement 2 does not explain Statement 1", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "b", "exp": "Kushan Dynasty (First-Third Century) : Kanishka - He administered the territory from two capitals : Purushapura (now Peshawar in northern Pakistan) and Mathura. Vasudeva I - Last Kushana Ruler.", "t": 0, "s": 9}, {"n": 216, "tag": null, "stem": "Kathasaritasagara, a collection of stories, was written in which of the following languages ?", "opts": {"a": "Pali", "b": "Sanskrit", "c": "Prakrit", "d": "Persian"}, "ans": "b", "exp": "Sanskrit. The Kathasaritsagara (Ocean of Story) written in the 11th century by Somadeva. Other Sanskrit Literature: Buddhacarita - Ashvaghosa; Malavikagnimitram - Kalidasa; Harshacharita - Banabhatta.", "t": 0, "s": 9}, {"n": 217, "tag": null, "stem": "Which of the following statements about the Kushana dynasty is INCORRECT ?", "opts": {"a": "The Kushanas were a major ruling group in the post-Mauryan period.", "b": "Many Kushana rulers also adopted the title ‘devaputra’, or ‘son of god’.", "c": "The First Buddhist Council was organised by Kanishka.", "d": "Asvaghosha, the author of the Buddhacharita, was the court poet of Kanishka."}, "ans": "c", "exp": "The First Buddhist Council was held during the reign of King Ajatashatru of the Haryanka Dynasty in Rajgriha. Kanishka belonged to the Kushan dynasty, which was founded by Kujula Kadphises. The Fourth Buddhist Council was held under the patronage of Kanishka in Kashmir.", "t": 0, "s": 9}, {"n": 218, "tag": null, "stem": "Which of the following rulers is considered as the greatest king of Satavahana dynasty and is described as the destroyer of the Sakas, Yavanas and Pahlavas ?", "opts": {"a": "Simuka", "b": "Hala", "c": "Gautamiputra Satakarni", "d": "Yajna Sri Satakarni"}, "ans": "c", "exp": "Gautamiputra Satakarni. He is renowned for his military conquests and is described in the Nasik inscription as the &quot;destroyer of the Sakas, Yavanas, and Pahlavas.&quot; He also used the title of &#x27;Ekabrahaman,&#x27; which means the Peerless Brahman. Simuka was the founder of the Satavahana dynasty. Hala was the seventeenth king of the Satavahana Dynasty.", "t": 0, "s": 9}, {"n": 219, "tag": null, "stem": "Match the following authors with their respective works: List I (Authors) List II (Works)<br>1. Patanjali A. Ashtadhyayi<br>2. Panini B. Mahabhashya<br>3. Kautilya C. Arthashastra<br>4. Banabhatta D. Harshacharita", "opts": {"a": "1-B, 2-A, 3-C, 4-D", "b": "1-A, 2-B, 3-D, 4-C", "c": "1-D, 2-C, 3-B, 4-A", "d": "1-C, 2-D, 3-A, 4-B"}, "ans": "a", "exp": "1-B, 2-A, 3-C, 4-D. “The Yoga Sutra” was also written by Patanjali. Authors and their books: Kalhana - “Rajatarangini”. Vatsayana - “Kamasutra”. Vishnu Sharma - “Panchatantra”. Kautilya - “Arthasastra”. Panini - “Ashtadhyayi”. Megasthenes - “Indica”. Jayadeva - “Gitagovinda”. Sri Harsha - “Naishadha Charita”. Banabhatta - “Harshacharita”, “Kadambari”.", "t": 0, "s": 9}, {"n": 220, "tag": null, "stem": "Which of the following dynasties succeeded the Palas of Bengal ?", "opts": {"a": "Senas", "b": "Devas", "c": "Maukharis", "d": "Gaudas"}, "ans": "a", "exp": "Senas Dynasty: A hindu dynasty that ruled over eastern Bengal and western Bihar for about two centuries. Important Rulers - Vijaya Sena, Ballal Sena, Lakshmana Sena. Deva dynasty - Ruled over eastern Bengal after the Sena dynasty.", "t": 0, "s": 9}, {"n": 221, "tag": null, "stem": "Who had Sialkot as his capital ?", "opts": {"a": "Menander", "b": "Demetrios", "c": "Eukratides", "d": "Pushyamitra"}, "ans": "a", "exp": "Menander: A Greek king who ruled over the Indo-Greek kingdom. Demetrios (Greek king): His capital was Takshashila. Eucratides: Expanded the Indo-Greek territories into Bactria and the northern regions of India. Pushyamitra Sunga - An Indian king who ruled over the Sunga dynasty. His capital was Pataliputra.", "t": 0, "s": 9}, {"n": 222, "tag": null, "stem": "Consider the following statements about the early history of the Vatapi (Badami) Chalukyas:<br><b>Statement 1: <\/b>The Vatapi Chalukyas were originally tributary princes under the Kadamba dynasty.<br><b>Statement 2: <\/b>The founder of the Kadamba dynasty was Mayurasharma, who ruled parts of present-day Karnataka.", "opts": {"a": "Both statements are true, and Statement 2 correctly explains Statement 1", "b": "Both statements are true, but Statement 2 does not explain Statement 1", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "b", "exp": "The Vatapi (Badami) Chalukyas were first tributaries of the Kadambas of Banavasi (4th–6th century CE), founded by Mayurasharma. Later, under Pulakesin I (c. 543 CE), the Chalukyas declared independence and established Vatapi (Badami) as their capital, emerging as a major Deccan power.", "t": 0, "s": 9}, {"n": 223, "tag": null, "stem": "Which of the following pairs of locations are famous for Buddhist railings and gateways ?", "opts": {"a": "Bharhut and Amravati", "b": "Patna and Rajgir", "c": "Parasnath and Ajanta", "d": "Sarnath and Kushinagar"}, "ans": "a", "exp": "Bharhut and Amravati.  Bharhut Stupa is located in Satna, Madhya Pradesh. It was discovered in a ruined state by Alexander Cunningham and his team. The discovered railing and gateway are now on display at the Indian Museum (Kolkata). Amravati Stupa was discovered by Colin Mackenzie (1797).", "t": 0, "s": 9}, {"n": 224, "tag": null, "stem": "Consider the following statements regarding forts in India:<br><b>Statement 1: <\/b>Kangra Fort, also known as Nagarkot Fort, is considered the oldest dated fort in India.<br><b>Statement 2: <\/b>Kangra Fort was built by Raja Man Singh of Amber in the 16th century.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Kangra Fort, also called Nagarkot Fort, was built by Susharm Chand of the Katoch dynasty. In 1009 A.D., Mahmud of Ghazni plundered the Shahi treasury kept at Kangra in Himachal Pradesh. The Katoch dynasty traces its origin to the ancient Trigarta Kingdom mentioned in the Mahabharata. Important forts in India include: Golconda Fort – Hyderabad, Mehrangarh Fort – Jodhpur (Rajasthan), Srirangapatna Fort – Karnataka, Panhala Fort – Maharashtra, and Daulatabad Fort – Aurangabad (Maharashtra).", "t": 0, "s": 9}, {"n": 225, "tag": null, "stem": "Brihat Samhita was the treatise of which of the following subjects ?", "opts": {"a": "Botany", "b": "Astronomy", "c": "Geography", "d": "Natural History"}, "ans": "b", "exp": "Astronomy. Brihat Samhita - It is the noted work of Varahamihira. It is an important encyclopedic text in Sanskrit. Other Samhitas - Jaya Samhita (Mahabharat), Charak Samhita (Medicinal Science), Sushruta Samhita (Book on Surgeries and related science).", "t": 0, "s": 9}, {"n": 226, "tag": null, "stem": "Which ruler of the Chahamana dynasty made Ajmer his capital ?", "opts": {"a": "Prithviraj III", "b": "Prithviraj II", "c": "Arnoraj", "d": "Ajayaraja"}, "ans": "d", "exp": "Ajayaraja. Chahamanas or Chauhans dynasty: Chauhans of Delhi and Ajmer, also known as the Chahamanas of Shakambhari, ruled over part of modern-day Rajasthan. Important Kings : Vasudeva, Ajayaraja, Arnoraja, Vigraharaja IV, Prithviraj Chauhan III, and Hariraja.", "t": 0, "s": 9}, {"n": 227, "tag": null, "stem": "Prithviraj Raso, an epic poem about the life of the 12th century Indian king, Prithviraj Chauhan, was written by:", "opts": {"a": "Chand Bardai", "b": "Banabhatta", "c": "Bharavi", "d": "Ashvaghosa"}, "ans": "a", "exp": "Chand Bardai. Indian Epics  <mark>and writers <\/mark>- Mahabharata (Sage Ved Vyasa), Ramayana (Valmiki), Raghuvamsa (Kalidasa), Buddhacharita (Asvogosha), Silapadikaram (Ilango Adigal in Tamil), Ramcharitmanas (Tulsidas in Awadhi), Kumarasambava (Kalidasa in Sanskrit). Banabhatta wrote Harshacharita and Bharavi wrote Kiratarjuniya.", "t": 0, "s": 9}, {"n": 228, "tag": null, "stem": "Siddheshwar Mahadev Temple in Bengal depicts the architecture of which dynasty. ?", "opts": {"a": "Pala Dynasty", "b": "Hussain Shahi dynasty", "c": "Chalukya dynasty", "d": "Shunga Dynasty"}, "ans": "a", "exp": "Pala Dynasty. Temples and their associated Dynasty: Khajuraho Temple (Madhya Pradesh) - Bundelas or Chandelas; Kailash Temple (Maharashtra) - Rashtrakutas; Thousand Pillared Temple, Ramappa Temple (Telangana) - Kakatiyas; Brihadeeswara Temple (Tamil Nadu) - Cholas; Kailashnath Temple, Shore Temple (Tamil Nadu) - Pallavas; Dilwara Temple (Rajasthan) - Solankies; Virupaksha Temple (Karnataka) - Chalukyas; Sun Temple (Gujarat) - Solankis.", "t": 0, "s": 9}, {"n": 229, "tag": null, "stem": "Consider the following statements about ancient Indian literature:<br><b>Statement 1: <\/b>Malavikagnimitra, a drama of the 5th century CE, was composed by Kalidasa, the court poet of Chandragupta II.<br><b>Statement 2: <\/b>The Prayag pillar inscription was composed by Kalidasa in praise of Samudragupta.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Statement 1 is true, but  <mark>Statement 2 is false. <\/mark>Malavikagnimitra was indeed written by Kalidasa, but the Prayag pillar inscription was composed by Harisena, not Kalidasa.", "t": 0, "s": 9}, {"n": 230, "tag": null, "stem": "The star-shaped temples were built during the reign of:", "opts": {"a": "Hoysala", "b": "Chalukya", "c": "Badami", "d": "Cholas"}, "ans": "a", "exp": "Hoysala. Hoysala Architecture Temples: Aralaguppe is the temple dedicated to Lord Channakeshava (Vishnu). The temple was built during the rule of the Hoysala Empire King Vira Someshwara.", "t": 0, "s": 9}, {"n": 231, "tag": null, "stem": "Which of the following was the capital of the Hindu Shahi Kingdom ?", "opts": {"a": "Srinagar", "b": "Lahore", "c": "Waihind", "d": "Multan"}, "ans": "c", "exp": "Waihind. Hindu Shahi  <mark>kingdom <\/mark>was founded by Kallar. It ruled over Kabul and the old province of Gandhara from the decline of the Kushan empire. This kingdom was known as the Kabul Shahi dynasty.", "t": 0, "s": 9}, {"n": 232, "tag": null, "stem": "Consider the following statements about the Gahadavalas:<br><b>Statement 1: <\/b>The Gahadavalas, also known as the Rathors of Kanauj, established their rule after the decline of the Pratiharas.<br><b>Statement 2: <\/b>The last great Gahadavala ruler, Jai Chand, was defeated and killed in the Battle of Tarain (1191 AD) by Prithviraj Chauhan.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "The Gahadavalas ruled Kanauj after the decline of the Pratiharas, but Jai Chand was killed in the Battle of Chandawar (1194 AD) by Mohammad Ghori, not in the Battle of Tarain by Prithviraj Chauhan.", "t": 0, "s": 9}, {"n": 233, "tag": null, "stem": "Alvars were the devotees of which South Indian cult ?", "opts": {"a": "Shaktism", "b": "Saivism", "c": "Jainism", "d": "Vaishnavism"}, "ans": "d", "exp": "Vaishnavism. Nayanars and Alvars saints belonged to South India. Some famous Vaishnava devotees : Ramanuja, Madhvacharya, Chaitanya Mahaprabhu, Nimbarkacharya. <mark>Jainism <\/mark>- Devotees of Jainism are called Jains such as Rishabhadeva, Parshvanath, Bhadrabahu. <mark>Shaktism <\/mark>- Devotees of Shaktism are called Shaktas. Famous Shaktas: Adi Shankaracharya, Sarada Devi, Paramahansa Yogananda.", "t": 0, "s": 9}, {"n": 234, "tag": null, "stem": "In the middle of which century did the Arab traveller Sulaiman visit India ?", "opts": {"a": "15 th", "b": "9 th", "c": "11 th", "d": "6 th"}, "ans": "b", "exp": "9th. Travellers Who Visited  <mark>India: <\/mark>Hiuen Tsang (China) - During the reign of Harshavardhana. Al Biruni {Khwarizm (present-day Uzbekistan)} - In 11th century. During the reign of Sultan of Mahmood Ghaznavi. Ibn Battuta (Morocco) - During the reign of Muhammad Bin Tughlaq, Marco Polo (Italy) - During the reign of Pandya Kingdom. Megasthenes (Greece) - During the reign of Chandragupta Maurya. Abdur Razzaq (Persia) - During the reign of Deva Raya II (Sangama dynasty). Fa Hien (China) - During the reign of Chandragupta II. Al Masudi (Arab) - In 10th century AD.", "t": 0, "s": 9}, {"n": 235, "tag": null, "stem": "The rulers of which of the following Rajput dynasties patronised Jainism and one of them is reported to have accepted Jainism under the influence of a Jain scholar Hemachandra?", "opts": {"a": "Pratihara", "b": "Parmara", "c": "Chalukya", "d": "Chahman"}, "ans": "c", "exp": "Chalukya . <mark>Pratihara dynasty <\/mark> - Nagabhatta I was the founder. The Pratiharas who ruled over Kannauj for a long time are also called Gurjara- Pratiharas. <mark>Parmar dynasty <\/mark>- Founded by Upendra or Krishnaraja. Capital: Ujjain, Later - Dharan Nagari (Dhar).", "t": 0, "s": 9}, {"n": 236, "tag": null, "stem": "Alha and Udal, who gave stiff resistance to the enemy, belonged to which of the following Rajput States ?", "opts": {"a": "Parmar", "b": "Kalchuri", "c": "Chandella", "d": "Gahadavala"}, "ans": "c", "exp": "Chandella (Founder - Nannuk) <mark>. <\/mark>They were originally vassals of the Gurjara - Pratiharas. The Chandelas initially ruled as feudatories of the Gurjara-Pratiharas of Kanyakubja (Kannauj). Original capital - Khajuraho. The last King of this dynasty - Paradidev (Parmadi). His generals - Alha and Udal. <mark>Battle of Mahoba: <\/mark>Fought between Paradidev and Prithviraj Chauhan-III in 1182 AD.", "t": 0, "s": 9}, {"n": 237, "tag": null, "stem": "Consider the following statements about the Pala Dynasty:<br><b>Statement 1: <\/b>The Pala rulers, beginning with Gopala in 750 AD, were great patrons of Jainism.<br><b>Statement 2: <\/b>The Pala rulers were staunch supporters of Mahayana Buddhism.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "d", "exp": "Pala Dynasty - Founded by Gopala, in 750 AD. They were staunch supporters of Mahayana Buddhism. They were in a tripartite struggle between the Palas, the Pratiharas and the Rashtrakutas for the control of Kanauj and North India.", "t": 0, "s": 9}, {"n": 238, "tag": null, "stem": "Who among the following was the author of the play &#x27;Mrichchhakatika&#x27; ?", "opts": {"a": "Kalidasa", "b": "Amarasimha", "c": "Shudraka", "d": "Bhasa"}, "ans": "c", "exp": "Shudraka . Mrichchhakatika play was translated into English by Arthur W. Ryder in 1905 as “The Little Clay Cart”. Other Sanskrit plays of Shudraka: “Vinavasavadatta”, “Padmaprabhritaka”, “a bhana” (short one -act monologue).", "t": 0, "s": 9}, {"n": 239, "tag": null, "stem": "The Ashtadhyayi of Panini is a renowned work on ______.", "opts": {"a": "Mauryan Polity", "b": "Gupta Administration", "c": "Medicine", "d": "Sanskrit Grammar"}, "ans": "d", "exp": "Sanskrit Grammar. Ancient Authors and books : (Kautilya) Chanakya&#x27;s work - “Arthashastra” (on statecraft, political science, economic policy and military strategy). Maharshi Charak - “Charaka Samhita” (a famous text of ayurveda) - Ayurveda. “Sushruta Samhita” - A comprehensive textbook on medicine and surgery.", "t": 0, "s": 9}, {"n": 240, "tag": null, "stem": "Consider the following statements about the Shunga Dynasty:<br><b>Statement 1: <\/b>Pushyamitra Shunga was the last ruler of the Shunga dynasty.<br><b>Statement 2: <\/b>Devabhuti, assassinated by his minister Vasudeva Kanva, was the last ruler of the Shunga dynasty.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "d", "exp": "Devabhuti was assassinated by his minister (Vasudeva Kanva). Other Kings of Shunga Dynasty: Pushyamitra Shunga (Founder of Shunga Dynasty), Agnimitra, Vasujyeshtha, Vasumitra, Bhagabhadra. Shashanka: The first king of ancient Bengal, governed the Gauda Kingdom from 600 to 625 AD. Bhavabhuti: A famous Sanskrit playwright who wrote famous plays like Mahaviracharita, Malatimadhava etc.", "t": 0, "s": 9}, {"n": 241, "tag": null, "stem": "Of which of the following Pratihara kings was Rajashekhara, the famous poet and dramatist, the court poet ?", "opts": {"a": "Rajapala", "b": "Devapala", "c": "Ramabhadra", "d": "Mahendrapala"}, "ans": "d", "exp": "Mahendrapala (885-910 AD). Works of Rajshekhara: Viddhashalabhanjika, Balabharata, Karpuramanjari, Balaramayana, Kavyamimamsa. Gurjara Pratihara dynasty (8th to 11th century): Founder - Harichandra. Mihira Bhoja (836-885 AD) - Most powerful Partihara king. Yashpala (1024- 1036) - last ruler of the Gurjara Pratihara dynasty.", "t": 0, "s": 9}, {"n": 242, "tag": null, "stem": "Who were the first to make land grants to Brahmins ?", "opts": {"a": "Sakas", "b": "Satavahanas", "c": "Guptas", "d": "Kushans"}, "ans": "b", "exp": "Satavahanas (1st Century BC to 3rd Century AD) <mark>: <\/mark>Simuka was the founder. Sakas (2nd century BCE to the 4th century CE) - The most famous Shaka ruler in India was Rudradaman (130 A.D to 150 A.D.), came to an end with the defeat of the last Shaka ruler, Rudrasimha III by Chandragupta-II (Gupta dynasty). <mark>Kushans <\/mark>(First – Third Centuries) - Founded by Kujula Kadphises.", "t": 0, "s": 9}, {"n": 243, "tag": null, "stem": "During the reign of which of the following Pallavas, Hiuen Tsang visited the Pallava capital Kanchi ?", "opts": {"a": "Narasimhavarman I", "b": "Narasimhavarman II", "c": "Mahendravarman II", "d": "Mahendravarman I"}, "ans": "a", "exp": "Narasimhavarman I. He was also known as Mahamalla or Mamalla, which means &quot;great wrestler”. He took the title Vatapikonda (the conqueror of Vatapi).", "t": 0, "s": 9}, {"n": 244, "tag": null, "stem": "The Rampurva bull that was part of a Mauryan pillar found in Rampurwa, Bihar is now placed at _______.", "opts": {"a": "Pradhan Mantri Bhavan", "b": "Sansad", "c": "Rajpath", "d": "Rashtrapati Bhawan"}, "ans": "d", "exp": "Rashtrapati Bhawan. The Pillars of Ashoka are the most famous examples of Mauryan art. The Rashtrapati Bhavan houses the imposing 3rd century BC Ashoka pillar of sandstone known as the Rampurva bull. It got its name from the place of its discovery, Rampurwa in Bihar.", "t": 0, "s": 9}, {"n": 245, "tag": null, "stem": "Who among the following was the last Pallava king ?", "opts": {"a": "Mahendravarman - I", "b": "Aparajitavarman", "c": "Narasimhavarman - I", "d": "Simhavishnu"}, "ans": "b", "exp": "Aparajitavarman. Pallava dynasty (275 CE to 897 CE) - Also known as Tondaimandalam. Founder - Simha Vishnu (Avanisimha). Mahendravarman - He defeated the Kalabhras and re-established the Pallava kingdom. Narashimhavarman-1 - Son of Mahendravarman.", "t": 0, "s": 9}, {"n": 246, "tag": null, "stem": "Consider the following statements about Kandariya Mahadeva Temple:<br><b>Statement 1: <\/b>Kandariya Mahadeva Temple at Khajuraho was built in 999 A.D. by King Dhangadeva of the Chandela dynasty.<br><b>Statement 2: <\/b>Kandariya Mahadeva Temple was constructed in Tamil Nadu under the Chola dynasty in Dravida style.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Kandariya Mahadeva temple - built at Khajuraho (Madhya Pradesh), made up of sandstone. Its first mention is found in ‘al Biruni’ And ‘Ibn Battuta’ work. It follows the Nagara Style of architecture and was recognized by UNESCO as a world heritage site in 1986. Other temples built by Chandela dynasty (Founder - Nanuka): Devi Jagdamba Temple, Chitragupta Temple, Laxmana Temple.", "t": 0, "s": 9}, {"n": 247, "tag": null, "stem": "In the mid-eighth century, Dantidurga, a Rashtrakuta chief, overthrew his Chalukya overlord and performed a ritual literally called a ______.", "opts": {"a": "Prarthna sabha", "b": "Golden womb", "c": "Horse ride", "d": "Subsidiary alliance"}, "ans": "b", "exp": "Golden womb  (Hiranyagarbha). This ritual was performed with the help of Brahmanas, it was thought to lead to the “rebirth” of the sacrificer as a Kshatriya, even if he was not one by birth. The first known ruler of the dynasty was Dantidurga who conquered Badami in 752 A.D., defeating the Chalukyas.", "t": 0, "s": 9}, {"n": 248, "tag": null, "stem": "The emblem of the Chera Dynasty that controlled the central and northern parts of Kerala and the Kongu region of Tamil Nadu was _______.", "opts": {"a": "birds", "b": "fish", "c": "bow and arrow gan", "d": "tiger"}, "ans": "c", "exp": "Bow and Arrow Gan. The symbol also appears on the coins the dynasty minted. The dynasty controlled the central and northern parts of Kerala and the Kongu region of Tamil Nadu. Their capital was Vanji, Tamil Nadu.", "t": 0, "s": 9}, {"n": 249, "tag": null, "stem": "Which of the following is NOT part of six schools of Indian Philosophy ?", "opts": {"a": "Samkhya", "b": "Yoga", "c": "Nyaya", "d": "Dravida"}, "ans": "d", "exp": "Dravida. Samkhya: Founded by - Kapila (Book - Samkhya sutra) : It holds that reality is constituted of two principles of one female (Prakriti) and the other male (Purusha). Yoga - Union of the two principal entities. Nyaya: A technique of logical thinking. Author of the Nyaya Sutras - Gautama.", "t": 0, "s": 9}, {"n": 250, "tag": null, "stem": "The Amaravati School of art was developed under the patronage of _____ .", "opts": {"a": "Cholas", "b": "Cheras", "c": "Satavahanas", "d": "Palas"}, "ans": "c", "exp": "Satavahanas. Different School of arts: Gandhara School of Art (Kushana) - It developed in the North West Frontier, in the modern-day Kandahar region. Mathura School of Art (Kushana) - It developed around Mathura.", "t": 0, "s": 9}, {"n": 251, "tag": null, "stem": "Who among the following was a famous ruler of the Pandya dynasty of Sout
