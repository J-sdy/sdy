c": "Muhammad Tughluq&#x27;s", "d": "Genghis Khan&#x27;s"}, "ans": "a", "exp": "Sher Shah Suri&#x27;s. Although the Suri dynasty ruled for only a short period i.e. 15 years, it introduced an administration that borrowed elements from Alauddin Khilji and made them more efficient.", "t": 1, "s": 10}, {"n": 393, "tag": null, "stem": "Ain-i Akbari, a document on life of Mughal ruler Akbar does not contain information about ______", "opts": {"a": "Revenues", "b": "Ancestors", "c": "Army", "d": "Administration"}, "ans": "b", "exp": "Ancestors. Abul Fazl (Akbar’s court historian) wrote a three-volume history of Akbar’s reign, titled Akbar Nama. The first volume (Akbar’s ancestors), second volume (events of Akbar’s reign) and The third (the Ain-i Akbari). Ain-i Akbari is divided into five volumes .", "t": 1, "s": 10}, {"n": 394, "tag": null, "stem": "Ajmer became the suba headquarters under the ______.", "opts": {"a": "Pallavas", "b": "Cholas", "c": "Mughals", "d": "Delhi Sultanate"}, "ans": "c", "exp": "Mughals. Ajmer Subah - One of the original 12 subahs of Mughal Empire (1526 - 1858). It was established during Akbar&#x27;s administrative reforms of 1572–1580. The last Mughal - Bahadur Shah Zafar.", "t": 1, "s": 10}, {"n": 395, "tag": null, "stem": "In which year was Kashmir annexed to the Mughal Empire by Akbar ?", "opts": {"a": "1586", "b": "1590", "c": "1592", "d": "1580"}, "ans": "a", "exp": "1586. Military <mark>Conquests <\/mark>of Akbar (Mughal Emperor, 1556-1605) <mark>: <\/mark> Malwa (conquered in 1562), Gondwana region of central India (1564), Gujarat (1573), Mewar (1576), both Bihar and Bengal (1576).", "t": 1, "s": 10}, {"n": 396, "tag": null, "stem": "As described in ‘Ain-i-Akbari’ by Abul Fazl-i-Allami, ‘gaz’ (unit of measuring length) was divided into equal parts called ______.", "opts": {"a": "tassuj", "b": "liksha", "c": "rajahkan", "d": "angul"}, "ans": "a", "exp": "tassuj .", "t": 1, "s": 10}, {"n": 397, "tag": null, "stem": "Who among the following issued Mahzarnama in 1579 ?", "opts": {"a": "Humayun", "b": "Jahangir", "c": "Shah Jahan", "d": "Akbar"}, "ans": "d", "exp": "Akbar issued Mahzarnama in 1579. It is a declaration that gives authority to change the religious laws of Islam.", "t": 1, "s": 10}, {"n": 398, "tag": null, "stem": "Consider the following statements regarding the foundation of Murshidabad:<br><b>Statement 1: <\/b>The city of Makhsudabad, later known as Murshidabad, was built by Mughal emperor Akbar.<br><b>Statement 2: <\/b>Murshidabad got its present name from Nawab Murshid Quli Khan.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "d", "exp": "Murshidabad was not built by Akbar; rather, it developed later and was renamed by Nawab Murshid Quli Khan in the early 18th century after his own name. Akbar is known for constructing Fatehpur Sikri, starting Din-i-Ilahi, and promoting cultural synthesis.", "t": 1, "s": 10}, {"n": 399, "tag": null, "stem": "In the context of Mughal administration, which of the following is the most appropriate definition of ‘Abwab’ ?", "opts": {"a": "A clerk in the government treasury", "b": "A court jester", "c": "A tax levied on the lands over and above the original rent", "d": "A reward for good governance"}, "ans": "c", "exp": "A tax levied on the lands over and above the original rent in Mughal India all temporary and circumstantial taxes and impositions levied by the government over and above regular taxes were called “abwab”.", "t": 1, "s": 10}, {"n": 400, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Which Mughal emperor is known for his extensive autobiography, Tuzuk-i-Jahangiri?", "opts": {"a": "Jahangir", "b": "Akbar", "c": "Shah Jahan", "d": "Aurangzeb"}, "ans": "a", "exp": "Jahangir. The Tuzuk-i-Jahangiri, also known as the Jahangirnama, is the autobiography of the fourth Mughal Emperor, Jahangir. Written in Persian, this memoir details the events of the first nineteen years of his reign, along with his personal reflections on art, politics, and family. Akbar: Akbar&#x27;s reign is chronicled in the Akbarnama, which was written by his court historian, Abul Fazl. Shah Jahan: The history of Shah Jahan&#x27;s reign is recorded in the Padshahnama, authored by the court historian Abdul Hamid Lahori.", "t": 1, "s": 11}, {"n": 401, "tag": null, "stem": "Consider the following statements regarding Amar Singh of Mewar:<br><b>Statement 1: <\/b>Amar Singh was the son of Rana Sanga and accepted Mughal service during the reign of Aurangzeb.<br><b>Statement 2: <\/b>Amar Singh was the Sisodiya ruler of Mewar who surrendered to Akbar in 1600.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "b", "exp": "Amar Singh was not the son of Rana Sanga but the son of Maharana Pratap. He did not submit to Akbar or Aurangzeb but to Jahangir in 1615, marking the end of prolonged Mughal–Mewar conflict.", "t": 1, "s": 11}, {"n": 402, "tag": null, "stem": "Who succeeded in securing trading concessions for the East India Company from Mughal Emperor Jahangir?", "opts": {"a": "John Mildenhall", "b": "Captain Hawkins", "c": "Captain Best", "d": "Thomas Roe"}, "ans": "d", "exp": "Thomas Roe was an English diplomat sent by the East India Company in 1615. John Mildenhall was the first British explorer to make an overland journey to India. Captain William Hawkins was an English sea captain who visited the court of Jahangir in 1608.", "t": 1, "s": 11}, {"n": 403, "tag": null, "stem": "Who among the following wrote the biography of Jahangir known as Iqbalnama-i Jahangiri ?", "opts": {"a": "Mutamid Khan", "b": "Inayat Khan", "c": "Abdul Rahim Khan", "d": "Abul Fazl"}, "ans": "a", "exp": "Mutamid Khan. He was in the th court of Mughal Emperor Jahangir (4 Mughal ruler, 1605 to 1627). ‘Iqbalnama-i Jahangiri’ book was written in Persian and it covers the first 19 years of Jahangir&#x27;s reign. Inayat Khan wrote” Shajahanama”. Abdul Rahim Khan translated “Babarnama” to the Persian language.", "t": 1, "s": 11}, {"n": 404, "tag": null, "stem": "Sarai Nurmahal is a centrally protected monument of India. It is situated in which state of India ?", "opts": {"a": "Uttar Pradesh", "b": "West Bengal", "c": "Punjab", "d": "Himachal Pradesh"}, "ans": "c", "exp": "Punjab (Jalandhar). Shalimar Bagh, the Begum Shahi Mosque, and the Bachcha Taj are the monuments built by the Jahangir (Fourth Mughal emperor).", "t": 1, "s": 11}, {"n": 405, "tag": null, "stem": "Mehrunnisa married Emperor Jahangir in ______.", "opts": {"a": "1620", "b": "1602", "c": "1611", "d": "1603"}, "ans": "c", "exp": "In <mark>1611 <\/mark>, Jahangir married Mehrunnisa who was known as Nur Jahan (Light of World). She encouraged Persian art and culture in the court.", "t": 1, "s": 11}, {"n": 406, "tag": "SSC Stenographer 7/08/2025 (Shift 1)", "stem": "The Battle of Samugarh was fought between Aurangzeb and which Mughal prince ?", "opts": {"a": "Jahangir", "b": "Murad Baksh", "c": "Shah Jahan", "d": "Dara Shikoh"}, "ans": "d", "exp": "Battle of Samugarh (29 May 1658). Part of the Mughal war of succession (1657–1658) after Emperor Shah Jahan fell ill. The main contest was between Dara Shikoh (Shah Jahan’s eldest son) and Aurangzeb. Other brothers, including Murad Baksh and Shuja, also joined in different stages, but the decisive battle was fought at Samugarh (near Agra) between Aurangzeb and Dara Shikoh. Dara Shikoh was defeated, paving the way for Aurangzeb’s capture of Agra and later imprisonment of Shah Jahan.", "t": 1, "s": 12}, {"n": 407, "tag": null, "stem": "Identify the Mughal emperor who was imprisoned for the rest of his life in Agra after the war of succession among his sons.", "opts": {"a": "Aurangzeb", "b": "Bahadur Shah I", "c": "Shah Jahan", "d": "Jahandar Shah"}, "ans": "c", "exp": "Shah Jahan (Mirza Shahab-ud-din Baig Muhammad Khan Khurram) <mark>. <\/mark>He was the fifth Mughal emperor and reigned from 1628 to 1658. Aurangzeb declared himself emperor in 1658 and imprisoned Shah Jahan in Agra Fort until his death in January 1666.", "t": 1, "s": 12}, {"n": 408, "tag": null, "stem": "Consider the following statements regarding the succession of Shah Jahan:<br><b>Statement 1: <\/b>Shah Jahan chose his eldest son Dara Shikoh as his successor to the Mughal throne.<br><b>Statement 2: <\/b>Dara Shikoh defeated Aurangzeb in the Battle of Deorai (1659) and became emperor.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Shah Jahan nominated his eldest son Dara Shikoh as his successor. However, Aurangzeb contested this claim and defeated Dara Shikoh in the Battle of Deorai (1659). Dara was executed, and Aurangzeb ascended the throne.", "t": 1, "s": 12}, {"n": 409, "tag": null, "stem": "Who among the following has written the ‘Badshah Nama’ ?", "opts": {"a": "Babur", "b": "Abdul Hamid Lahori", "c": "Inayat Khan", "d": "Abul Fazl"}, "ans": "b", "exp": "Abdul Hamid Lahori - A historian and traveler who later became a court historian of Shah Jahan. “Badshah Nama” (Padshahnama) is the official history of Shah Jahan.", "t": 1, "s": 12}, {"n": 410, "tag": null, "stem": "The mausoleum of the Taj Mahal was designed by ______.", "opts": {"a": "Bhaktiyar Lahori", "b": "Mohammad Isha", "c": "Shah Jahan", "d": "Ustad Ahmad Lahori"}, "ans": "d", "exp": "Ustad Ahmad Lahori was the chief Mughal architect during the reign of Shah Jahan. He was responsible for the construction of the Taj Mahal in Agra and the Red fort in Delhi.", "t": 1, "s": 12}, {"n": 411, "tag": null, "stem": "The art of decoration, called Pietra dura became popular during whose reign ?", "opts": {"a": "Jahangir", "b": "Sher Shah Suri", "c": "Shah Jahan", "d": "Akbar"}, "ans": "c", "exp": "Shah Jahan. Pietra dura - An inlay technique using cut and fitted, highly polished colored stones to create images. Some other buildings and monuments by Shah Jahan:- Red Fort (Delhi), Jama Masjid (Delhi), Shish Mahal (Agra) and Shalimar Bagh (Lahore).", "t": 1, "s": 12}, {"n": 412, "tag": null, "stem": "Ahmadnagar was finally annexed by the Mughals in_______", "opts": {"a": "1627", "b": "1632", "c": "1630", "d": "1635"}, "ans": "b", "exp": "In <mark>1632, <\/mark>during the period of Shah Jahan, Ahmednagar was merged into the Mughal empire. <mark>Malik Ahmed <\/mark> was the founder of Ahmednagar (Maharashtra), who established the Nizam Shahi dynasty.", "t": 1, "s": 12}, {"n": 413, "tag": null, "stem": "Who among the following had been given the title of ‘Sultan Buland Iqbal’ by Shah Jahan ?", "opts": {"a": "Shuja", "b": "Murad", "c": "Dara", "d": "Aurangzeb"}, "ans": "c", "exp": "Dara Shikoh (Eldest Son of Shah Jahan). Sultan Buland Iqbal (Prince of High Fortune) - Title given on 10 September 1642. His works - Majma -ul-Bahrain (Mingling of Two Oceans), Sirr-i-Akbar (Great Mystery). He was executed in 1659 by Aurangzeb in the war of succession.", "t": 1, "s": 12}, {"n": 414, "tag": "SSC Stenographer 6/08/2025 (Shift 1)", "stem": "Which Mughal Emperor issued the Deccan campaign against the Marathas and spent significant time in the region ?", "opts": {"a": "Shah Jahan", "b": "Aurangzeb", "c": "Jahangir", "d": "Akbar"}, "ans": "b", "exp": "Aurangzeb. The Mughal Emperor Aurangzeb (1658–1707) launched the most extensive Deccan campaign in Mughal history. After the death of Shivaji in 1680, Aurangzeb personally moved to the Deccan and remained there for 27 years (1680–1707) until his death at Ahmednagar. His primary aim was to crush the rising Marathas and annex the Deccan Sultanates of Bijapur (1686) and Golconda (1687). He succeeded in capturing Bijapur and Golconda, but the Marathas under Sambhaji, Rajaram, and later Tarabai continued their guerrilla warfare. The prolonged war drained the Mughal treasury, weakened the army, and overstretched administration. His Deccan obsession is considered a major reason for the decline of the Mughal Empire after his death. The campaign also led to the rise of Maratha power, which eventually filled the vacuum left by declining Mughal authority.", "t": 1, "s": 13}, {"n": 415, "tag": null, "stem": "Which Mughal ruler was responsible for the execution of Guru Tegh Bahadur in the year 1675 ?", "opts": {"a": "Jahangir", "b": "Akbar", "c": "Aurangzeb", "d": "Shahjahan"}, "ans": "c", "exp": "Aurangzeb. Guru Tegh Bahadur was the ninth Sikh Guru, often venerated as the ‘Protector of Humanity’ (Srisht-di-Chadar) by the Sikhs. He founded Anandpur Sahib.", "t": 1, "s": 13}, {"n": 416, "tag": null, "stem": "Under whose rule did the Mughal empire achieve its largest territorial limits?", "opts": {"a": "Shah Jahan", "b": "Bahadur Shah II", "c": "Akbar", "d": "Aurangzeb"}, "ans": "d", "exp": "Aurangzeb (1658 - 1707) ascended the throne in 1658 after eliminating all competitors, including Dara Shukoh, Shuja, and Murad, in a war of succession.", "t": 1, "s": 13}, {"n": 417, "tag": null, "stem": "Consider the following statements regarding the Rathor Rajputs of Marwar:<br><b>Statement 1: <\/b>The rebellion of the Rathor Rajputs of Marwar began due to Akbar’s interference in their succession politics.<br><b>Statement 2: <\/b>Babur suppressed the Rathor rebellion of Marwar during his reign.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "b", "exp": "The Rathor Rajput rebellion of Marwar occurred due to Aurangzeb’s interference in their internal politics and succession disputes, not because of Akbar or Babur. Akbar generally maintained friendly alliances with Rajputs, while Babur fought mainly against Afghan and Rajput confederacies during his short reign.", "t": 1, "s": 13}, {"n": 418, "tag": null, "stem": "Under which of the following Mughal emperors were the Marathas a major challenge to the sovereignty of the Mughals ?", "opts": {"a": "Humayun", "b": "Aurangzeb", "c": "Jahangir", "d": "Babur"}, "ans": "b", "exp": "Aurangzeb (Reign : 1658-1707) - He was the sixth Mughal Emperor and also known as Zinda Pir (living saint), Fakir, and Darbesh. He gave the French permission to build a factory in Surat in 1667.", "t": 1, "s": 13}, {"n": 419, "tag": null, "stem": "Under whose reign was the maximum number of books in Persian on classical Indian Music written ?", "opts": {"a": "Shah Jahan", "b": "Jahangir", "c": "Akbar", "d": "Aurangzeb"}, "ans": "d", "exp": "Aurangzeb (1658 - 1707) <mark>. <\/mark>He reimposed Jizya and Pilgrim tax in 1679 and ended the celebration of Navroz.", "t": 1, "s": 13}, {"n": 420, "tag": null, "stem": "Which Mughal Emperor has attempted to vandalise the Kailash Temple at Ellora ?", "opts": {"a": "Aurangzeb", "b": "Humayun", "c": "Shah Jahan", "d": "Babur"}, "ans": "a", "exp": "Aurangzeb { Alamgir, original name MuḥI al-Din Muḥammad <mark>( <\/mark>1658 to 1707)} - He stopped music and alcohol in the court and also the activities of ‘jharokha’ (public audience).", "t": 1, "s": 13}, {"n": 421, "tag": null, "stem": "Consider the following statements regarding Guru Nanak Dev Ji:<br><b>Statement 1: <\/b>Guru Nanak Dev Ji was the third Sikh Guru and Gurpurab marks his birth anniversary.<br><b>Statement 2: <\/b>Guru Nanak Dev Ji was the first Sikh Guru and the founder of Sikhism.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "d", "exp": "Guru Nanak Dev Ji, born in 1469 at Talwandi (now Nankana Sahib, Pakistan), was the first Sikh Guru and the founder of Sikhism. Gurpurab is celebrated to commemorate his birth anniversary. He was not the third Guru.", "t": 1, "s": 14}, {"n": 422, "tag": null, "stem": "After the death of Shri Guru Gobind Singh, the Sikhs revolted against the ______ under the leadership of Banda Bahadur.", "opts": {"a": "Gurkhas", "b": "Mughals", "c": "British", "d": "Marathas"}, "ans": "b", "exp": "Mughals. Guru Gobind Singh is famous for his creation of the Khalsa (Pure) , the military brotherhood of the Sikhs.", "t": 1, "s": 14}, {"n": 423, "tag": null, "stem": "Who among the following Sikh spiritual gurus is said to have assisted Khusrau, the rebellious son of Jahangir ?", "opts": {"a": "Guru Angad Dev", "b": "Guru Ramdas", "c": "Guru Amar Das", "d": "Guru Arjun Dev"}, "ans": "d", "exp": "Guru Arjun Dev assisted Khusrau, the rebellious son of Jahangir. He compiled the first official edition of the Sikh scripture called the Adi Granth, which later expanded into the Guru Granth Sahib. He completed the construction of the Golden Temple in Amritsar.", "t": 1, "s": 14}, {"n": 424, "tag": null, "stem": "Who among the following Sikh Gurus laid the foundation of ‘Khalsa Panth’ ?", "opts": {"a": "Guru Gobind Singh", "b": "Guru Arjan Dev", "c": "Guru Teg Bahadur", "d": "Guru Nanak Dev"}, "ans": "a", "exp": "Guru Gobind Singh laid the foundation of ‘Khalsa Panth’ on April 13, 1699, situated in Punjab. It is a name given to the religious structure and the community that manages the affairs of the global Khalsa community.", "t": 1, "s": 14}, {"n": 425, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Which Maratha ruler founded the Maratha Empire in 1674, proclaiming himself Chhatrapati ?", "opts": {"a": "Sambhaji", "b": "Shahu", "c": "Shivaji", "d": "Bajirao"}, "ans": "c", "exp": "Shivaji. Chhatrapati Shivaji Maharaj is regarded as the founder of the Maratha Empire. Through guerrilla tactics and strategic battles against the Adilshahi Sultanate and the Mughals, he established an independent Swarajya. In 1674, at Raigad Fort, he was coronated and assumed the title Chhatrapati, formally marking the birth of the Maratha Empire. Sambhaji – Shivaji’s eldest son, succeeded him in 1680 as the second Chhatrapati. Shahu – Shivaji’s grandson, became Chhatrapati in the early 18th century; during his reign, the Peshwas rose as the de facto rulers. Bajirao I – The most famous Peshwa under Shahu, a brilliant general who expanded Maratha power across India.", "t": 1, "s": 15}, {"n": 426, "tag": null, "stem": "Consider the following statements regarding Maratha revenue system:<br><b>Statement 1: <\/b>Bhoga was the twenty-five percent land revenue collected by the Marathas in the Deccan.<br><b>Statement 2: <\/b>Sardeshmukhi was an additional ten percent levy on lands where the Marathas claimed hereditary rights.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "d", "exp": "Chauth, not Bhoga, was the twenty-five percent tax imposed by the Marathas to prevent raids. Sardeshmukhi was an additional 10% levy on lands under Maratha hereditary claims. Bhoga belonged to the Gupta period and was a tax on gifts, fruits, flowers, etc.", "t": 1, "s": 15}, {"n": 427, "tag": null, "stem": "Baji Rao I or Baji Rao Ballal was the son of ________.", "opts": {"a": "Peshwa Balaji Vishwanath", "b": "Raghunath Rao", "c": "Shivaji", "d": "Madhav Rao"}, "ans": "a", "exp": "Peshwa Balaji Vishwanath  <mark>(1713- 1720) <\/mark>. He was the first of a line of hereditary Peshwas from the Bhat family. Baji Rao I (1720-40) - Succeeded Balaji Vishwanath. He was the Seventh Peshwa (Prime Minister) of the Maratha Empire and one of the greatest exponents of Guerrilla tactics after Shivaji. Maratha families: Shindes (Gwalior), Holkars (Indore), Gaikwads (Baroda), Bhosles (Nagpur), Peshwas (Poona).", "t": 1, "s": 15}, {"n": 428, "tag": null, "stem": "Who among the following was a famous ruler of the Maratha dynasty ?", "opts": {"a": "Porus", "b": "Chhatrapati Shivaji Maharaj", "c": "Man Singh", "d": "Prithviraj Chauhan"}, "ans": "b", "exp": "Chhatrapati Shivaji Maharaj.  The Maratha Empire formerly existed from 1674 with the coronation of Chhatrapati Shivaji Maharaj and ended in 1818 with the defeat of Peshwa Bajirao II at the hands of the British East India Company. <mark>Wars fought by Shivaji <\/mark>- Battle of Pratapgad (1659), Battle of Purandar (1665), Battle of Sinhagad (1670), Battle of Sangamner(1679), etc.", "t": 1, "s": 15}, {"n": 429, "tag": "SSC Stenographer 6/08/2025 (Shift 2)", "stem": "Which confederation of Sultanates defeated the Vijayanagara Empire in the Battle of Talikota ?", "opts": {"a": "Rajput Confederacy", "b": "Mughal Empire", "c": "Bahmani Sultanate", "d": "Deccan Sultanates"}, "ans": "d", "exp": "Deccan Sultanates. The Battle of Talikota (1565) was fought between the Vijayanagara Empire (ruled by Aliya Rama Raya) and the combined forces of the Deccan Sultanates - Bijapur, Ahmadnagar, Golconda, Bidar, and Berar. The Vijayanagara Empire was founded by the brothers Harihara and Bukka Raya in 1336 AD.", "t": 1, "s": 16}, {"n": 430, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Who was the leader that defeated Krishnadevaraya of Vijayanagara in the Battle of Raichur ?", "opts": {"a": "Alauddin Khilji", "b": "Ahmed Shah Bahmani", "c": "Ibrahim Lodi", "d": "Adil Shah of Bijapur"}, "ans": "d", "exp": "Adil Shah of Bijapur. The Battle of Raichur (1520) was fought between Krishnadevaraya of Vijayanagara and Ismail Adil Shah of Bijapur over the Raichur Doab. Though Krishnadevaraya initially won, Adil Shah of Bijapur was the ruler who opposed him in this decisive conflict.", "t": 1, "s": 16}, {"n": 431, "tag": null, "stem": "The founders of Vijayanagar empire, Harihara and Bukka Raya were the ministers of:", "opts": {"a": "Kampili", "b": "Kadamba", "c": "Western Chalukya", "d": "Eastern Ganga"}, "ans": "a", "exp": "Kampili. The Vijayanagara Empire was established in 1336 by the brothers Harihara and Bukka Raya of the Sangama dynasty, who belonged to the Yadava clan of the Chandravamsa lineage. Between 1336 and 1565, Vijayanagara was ruled by three different dynasties: the Sangama, Saluva, and Tuluva dynasties. The last dynasty was the Aravidu dynasty, which ruled until the seventeenth century.", "t": 1, "s": 16}, {"n": 432, "tag": null, "stem": "Consider the following statements regarding foreign travellers to Vijayanagar:<br><b>Statement 1: <\/b>Domingo Paes, a Portuguese traveller, visited the Vijayanagar empire during the reign of Krishnadevaraya.<br><b>Statement 2: <\/b>Niccolò de&#x27; Conti visited the Vijayanagar empire during the reign of Krishnadevaraya.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Domingo Paes, a Portuguese traveller, visited the Vijayanagar empire during Krishnadevaraya’s reign and described its prosperity and military strength. Niccolò de&#x27; Conti, however, visited India earlier during the rule of Devaraya I, not Krishnadevaraya.", "t": 1, "s": 16}, {"n": 433, "tag": null, "stem": "Which of the following was the last dynasty of the Vijayanagara Empire ?", "opts": {"a": "Tuluva dynasty", "b": "Saluva dynasty", "c": "Sangam dynasty", "d": "Aravidu dynasty"}, "ans": "d", "exp": "Aravidu dynasty. The Vijayanagara Empire had four dynasties: Sangama dynasty (1336-1485 CE), Saluva dynasty (1485-1505 CE), Tuluva dynasty (1505-1570 CE), Aravidu dynasty (1570-1646 CE).", "t": 1, "s": 16}, {"n": 434, "tag": null, "stem": "Consider the following statements regarding the Vijayanagara rulers:<br>1. Achyuta Deva Raya assumed the title of &#x27;Establisher of the Yavana kingdom’.<br>2. Krishna Deva Raya founded Nagalapuram in memory of his mother.", "opts": {"a": "Only 1 is correct", "b": "Only 2 is correct", "c": "Both 1 and 2 are correct", "d": "Neither 1 nor 2 is correct"}, "ans": "b", "exp": "Only 2 is correct. The title &#x27;Establisher of the Yavana kingdom’ was taken by Krishna Deva Raya, not Achyuta Deva Raya. Krishna Deva Raya founded Nagalapuram in memory of his mother.", "t": 1, "s": 16}, {"n": 435, "tag": null, "stem": "The Vijayanagara empire included people from different cultural regions. Which of the following regions was NOT a part of it ?", "opts": {"a": "Tamil", "b": "Karnataka", "c": "Telugu", "d": "Maratha"}, "ans": "d", "exp": "Maratha. The Vijayanagara Empire primarily included the regions of Tamil, Karnataka, and Telugu-speaking areas. Maratha region was ruled by the Yadava Dynasty and later the Bahmani Sultanate during Vijayanagara&#x27;s peak.", "t": 1, "s": 16}, {"n": 436, "tag": null, "stem": "What was the dominant source of income in the Vijaynagar Empire ?", "opts": {"a": "Mining", "b": "Industrial duty", "c": "Land revenue", "d": "Import duty"}, "ans": "c", "exp": "Land revenue. Vijayanagar  <mark>empire: <\/mark>Sources of income - Land Revenue, tributes, and gifts from vassals and feudal chiefs, customs at ports.", "t": 1, "s": 16}, {"n": 437, "tag": null, "stem": "Who among the following Vijaynagar rulers married his daughter to Firuz Shah Bahmani ?", "opts": {"a": "Deva Raya II", "b": "Deva Raya I", "c": "Krishna Deva Raya", "d": "Bukka I"}, "ans": "b", "exp": "Dev Raya I. In 1406 -07, Firuz Shah the ruler of the Bahmani Sultanate, defeated Deva Raya-I, the ruler of the Vijayanagara Empire. <mark>Dynasty and Ruler: <\/mark> Sangama Dynasty - Harihara I and Bukka ; Saluva dynasty - Narasimha Deva Raya, Thimma Bhupala, Narasimha Raya II. Tuluva dynasty- Krishnadeva Raya.", "t": 1, "s": 16}, {"n": 438, "tag": null, "stem": "The founders of Vijayanagara Empire were the feudatories of which of the following dynasties ?", "opts": {"a": "Hoysala", "b": "Pandya", "c": "Kakatiya", "d": "Chola"}, "ans": "c", "exp": "Kakatiya. ", "t": 1, "s": 16}, {"n": 439, "tag": null, "stem": "The origin of &#x27;Carnatic music&#x27; is related to which of the following Dynasties ?", "opts": {"a": "Bahamani", "b": "Chola", "c": "Pandya", "d": "Vijayanagar"}, "ans": "d", "exp": "Vijayanagar. Carnatic Music: Purandara Dasa - A poet-composer of Vijayanagar is the ‘Father of Carnatic Music’.", "t": 1, "s": 16}, {"n": 440, "tag": null, "stem": "Vijayanagara emperor Krishnadeva Raya founded a suburban township near Vijayanagara called Nagalapuram after his ______.", "opts": {"a": "father", "b": "teacher", "c": "sister", "d": "mother"}, "ans": "d", "exp": "Mother. ", "t": 1, "s": 16}, {"n": 441, "tag": null, "stem": "The local communities of merchants were known as______in the Vijayanagara empire.", "opts": {"a": "Rachavarus", "b": "Narapattis", "c": "Kudirai Chettis", "d": "Gajapattis"}, "ans": "c", "exp": "Kudirai Chettis (Horse merchants). Rachavarus (Rajulu) - Associated with the ruling dynasty (rulers and generals were actually Sudras). Narapati (Rayas) - Lord of Men. Gajapati - lord of elephants.", "t": 1, "s": 16}, {"n": 442, "tag": null, "stem": "Match the following terms with their correct description: List I List II (Groups/Terms) (Description)<br>A. Pattanulkars 1. Cavalrymen<br>B. Bargir 2. Commercial agent<br>C. Gomashta 3. Silk weavers from Gujarat migrated to Vijayanagar<br>D. Shiqdar 4. Head of Administrative unit (Shiqq)", "opts": {"a": "A-3, B-1, C-2, D-4", "b": "A-2, B-3, C-1, D-4", "c": "A-4, B-2, C-3, D-1", "d": "A-1, B-4, C-2, D-3"}, "ans": "a", "exp": "A-3, B-1, C-2, D-4. The Pattanulkars were silk weavers who migrated from Gujarat to the Vijayanagar state, contributing to its textile industry. Bargirs were cavalry soldiers used in medieval armies, especially in the Maratha period. Gomashtas acted as commercial agents for trade and merchants. Shiqdar was the administrative head of a Shiqq, responsible for revenue and law enforcement.", "t": 1, "s": 16}, {"n": 443, "tag": null, "stem": "The Amara-Nayakas were in the Vijayanagara Empire.", "opts": {"a": "forced laborers", "b": "finance officers", "c": "ordinary peasants", "d": "military commanders"}, "ans": "d", "exp": "Military commanders. They were given territories to govern by the Raya and used to collect taxes and other dues from the peasants, traders and craftspersons of the area. Gramas (villages), Gauda (village headman), Sthalas (sub districts), Nadus (districts), {Mandalams or rajyas (provinces)}, Land tax (sist).", "t": 1, "s": 16}, {"n": 444, "tag": null, "stem": "While historians use the term Vijayanagara Empire and contemporaries of this empire described it as the______.", "opts": {"a": "Gajapati Samarajya", "b": "Karnataka Samrajyamu", "c": "Andhra Samarajyu", "d": "Sthalapati Samrajya"}, "ans": "b", "exp": "Karnataka Samrajyamu.  <mark>Vijayanagara Empire <\/mark>(1336 -1646) - Established by Harihara and Bukka on the banks of river Tungabhadra.", "t": 1, "s": 16}, {"n": 445, "tag": null, "stem": "Consider the following statements regarding the Raichur Doab:<br><b>Statement 1: <\/b>Raichur Doab refers to the fertile land lying between the rivers Krishna and Tungabhadra.<br><b>Statement 2: <\/b>The Vijayanagar rulers mainly fought the Bengal kingdom for control over Raichur Doab.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "c", "exp": "The Raichur Doab indeed lies between the rivers Krishna and Tungabhadra, making Statement 1 true. However, the Vijayanagar Empire did not fight Bengal for this land; the conflict was with the Bahmani Sultanate, making Statement 2 false.", "t": 1, "s": 16}, {"n": 446, "tag": null, "stem": "Which battle led to the destruction of the Vijayanagara empire ?", "opts": {"a": "Battle of Raichur", "b": "Battle of Haldighati", "c": "Battle of Talikota", "d": "Battle of Arcot"}, "ans": "c", "exp": "Battle of Talikota  (Rakshasi–Tangadi) - It was fought on 23 January 1565 between the Vijayanagara Empire and an alliance of the Deccan sultanates. <mark>Aliya Rama Raya <\/mark>(King of the Vijaynagar Empire) was defeated and killed in the battle, which eventually led to the political collapse of the Vijayanagara Empire. <mark>The Battle of Raichur <\/mark>- Fought between the Vijayanagara Empire and the Sultanate of Bijapur in 1520.", "t": 1, "s": 16}, {"n": 447, "tag": null, "stem": "Provida style of architecture belongs to which empire ?", "opts": {"a": "Vijayanagar Empire", "b": "Gupta Empire", "c": "Mauryan Empire", "d": "Bahmani Empire"}, "ans": "a", "exp": "Vijayanagar Empire  <mark>Architectural Wonders of Vijayanagara: <\/mark> Queen’s Bath, Lotus Mahal, Elephant stables, Royal platform, Water tanks.", "t": 1, "s": 16}, {"n": 448, "tag": null, "stem": "The Anantraj Sagar Tank was built by the _______rulers.", "opts": {"a": "Vijayanagara", "b": "Maratha", "c": "Pala", "d": "Chola"}, "ans": "a", "exp": "The <mark>Vijayanagara empire <\/mark> built the Anantraj Sagar water storage tank using a 1.37 km long dam on the Maldevi river. Maldevi river runs through the Nellore district in the Indian state of Andhra Pradesh and empties into the Pennar river.", "t": 1, "s": 16}, {"n": 449, "tag": null, "stem": "Which Peshwa signed the treaty of Bassein with the East India Company ?", "opts": {"a": "Raghunath Rao", "b": "Narayan Rao", "c": "Baji Rao II", "d": "Madhav Rao"}, "ans": "c", "exp": "Baji Rao II . The Treaty of Bassein (1802): It was signed between Lord Wellesley and Baji Rao II. Other Treaty: Treaty of Surat (1775) was signed between Raghunath Rao and the British. The Treaty of Salbai (1782) was signed between the Maratha Empire and the British East India Company.", "t": 1, "s": 17}, {"n": 450, "tag": null, "stem": "Consider the following statements regarding the Tripartite Treaty of 1838:<br><b>Statement 1: <\/b>The Tripartite Treaty was signed by Shah Shujah, Maharaja Ranjit Singh, and the English East India Company.<br><b>Statement 2: <\/b>The Governor-General of India at the time of this treaty was Lord Auckland.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "a", "exp": "The Tripartite Treaty of 1838 was concluded between Maharaja Ranjit Singh of Punjab, Shah Shujah of Afghanistan, and the English Company to reinstall Shah Shujah on the Afghan throne. At that time, Lord Auckland was the Governor-General of India.", "t": 1, "s": 17}, {"n": 451, "tag": null, "stem": "In 1850, Kashmir was sold under which of the following treaties to the Dogra dynasty of Jammu ?", "opts": {"a": "Treaty of Allahabad", "b": "Treaty of Sugauli", "c": "Treaty of Amritsar", "d": "Treaty of Purandar"}, "ans": "c", "exp": "Treaty of Amritsar - It was executed by the British East India Company and Raja Gulab Singh of Jammu after the First Anglo-Sikh War. Treaty of Allahabad : Signed in - 1765 between the Mughal emperor Shah Alam II and Lord Clive of the British East India Company. Treaty of Sugauli - signed between Nepal and the East India Company in 1815 and ratified by 4 March 1816. Treaty of Purandar – Signed between Jai Singh I and Chhatrapati Shivaji Maharaj in 1665.", "t": 1, "s": 17}, {"n": 452, "tag": null, "stem": "French possessions in India were restored after the Battle of Wandiwash by the Treaty of ______signed in the year 1763 between Britain and France.", "opts": {"a": "Purandar", "b": "Paris", "c": "Tordesillas", "d": "Surat"}, "ans": "b", "exp": "Paris. The Battle of Wandiwash was fought in Vandavasi, Tamil Nadu between the French and the British in 1760. This battle was part of the Third Carnatic War. The British defeated the French.", "t": 1, "s": 17}, {"n": 453, "tag": null, "stem": "The seven years of war in the 18th century was fought between Britain and ________.", "opts": {"a": "Germany", "b": "Portugal", "c": "France", "d": "Spain"}, "ans": "c", "exp": "France. The Seven Years’ War, which took place between 1756-1763, was a global conflict that spanned five continents, though it was known in America as the ‘French and Indian War’. It solidified Britain’s stance as the most dominant European country in the world. Reason behind the Seven Years War - Both England and France wanted territories in North America.", "t": 1, "s": 17}, {"n": 454, "tag": null, "stem": "Consider the following statements regarding the invasion of Delhi in 1739:<br><b>Statement 1: <\/b>Nadir Shah, the Iranian ruler, defeated the Mughal emperor Muhammad Shah at the Battle of Karnal and looted immense wealth from Delhi.<br><b>Statement 2: <\/b>Ahmad Shah Abdali, after the Battle of Karnal, carried away the Kohinoor diamond and the Peacock throne to Iran.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "c", "exp": "It was Nadir Shah, not Ahmad Shah Abdali, who invaded Delhi in 1739, won the Battle of Karnal, and looted treasures like the Kohinoor diamond and the Peacock throne. Ahmad Shah Abdali invaded India later but not in this event.", "t": 1, "s": 17}, {"n": 455, "tag": null, "stem": "Which of the following was the first major and decisive victory for the East India Company on the soil of India ?", "opts": {"a": "Battle of Sindhuli", "b": "First Anglo-Maratha War", "c": "Battle of Plassey", "d": "Battle of Tiruvannamalai"}, "ans": "c", "exp": "Battle of Plassey (1757).  This battle was fought between the British East India Company led by Robert Clive and the Nawab of Bengal Siraj-ud-daula and his French allies. The Battle of Sindhuli was part of the unification of Nepal led by Prithvi Narayan Shah, King of Gorkha (later King of Nepal). Battle of Tiruvannamalai (1767) - Fought between the forces of the East India Company and the Kingdom of Mysore, led by Hyder Ali.", "t": 1, "s": 17}, {"n": 456, "tag": null, "stem": "Which of the following Anglo-Maratha wars resulted in merging the Peshwas&#x27; territories with the Bombay Presidency ?", "opts": {"a": "Fourth", "b": "Third", "c": "Second", "d": "First"}, "ans": "b", "exp": "Third (1817-1819). Anglo -Maratha war (The Great Maratha War) - The War was fought over territorial disputes, political dominance, and control over resources. First (1775-1782) - The Marathas won, Second (1803-1805) - The British won.", "t": 1, "s": 17}, {"n": 457, "tag": null, "stem": "Mir Qasim name is associated with which of the following battles of India ?", "opts": {"a": "Battle of Kirkee", "b": "Battle of Buxar", "c": "Battle of Plassey", "d": "Battle of Lahore"}, "ans": "b", "exp": "Battle of Buxar (1764) : It was fought between the forces of the British East India Company (led by Hector Munro) and the combined army of an alliance of Shuja-ud-Daulah, Mughal Emperor Shah Alam II and Mir Qasim. The Treaty of Allahabad (1765) was signed after this Battle.", "t": 1, "s": 17}, {"n": 458, "tag": null, "stem": "The second Anglo-Mysore War came to an end by signing which of the following treaties ?", "opts": {"a": "The Treaty of Arcot", "b": "The Treaty of Madras", "c": "The Treaty of Wandiwash", "d": "The Treaty of Mangalore"}, "ans": "d", "exp": "The Treaty of Mangalore  <mark>(1784). <\/mark>The second Anglo-Mysore War (1780 - 84) was fought by Hyder Ali, the Nizam and the Marathas against the British. Anglo-Mysore Wars : First (1767 - 69) - Between Hyder Ali and the British, concluded with the Treaty of Madras.Third (1790 - 92) - The British, the Nizam and the Marathas fought together against Tipu Sultan, concluded with the Treaty of Seringapatam. Fourth (1798 - 99) - Between Arthur Wellesley and Tipu Sultan (Died).", "t": 1, "s": 17}, {"n": 459, "tag": null, "stem": "Consider the following statements regarding the Battle of Karnal (1739) :<br><b>Statement 1 : <\/b>The Battle of Karnal was fought between Ahmad Shah Abdali and Bahadur Shah I.<br><b>Statement 2 : <\/b>After the battle, Ahmad Shah Abdali took the Koh-i-Noor diamond and the Peacock throne to Afghanistan.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "b", "exp": "The Battle of Karnal (1739) was fought between Nadir Shah (not Ahmad Shah Abdali) and the Mughal ruler Muhammad Shah. It was Nadir Shah who looted Delhi, taking away the Koh-i-Noor diamond and the Peacock throne to Persia, not Abdali.", "t": 1, "s": 17}, {"n": 460, "tag": null, "stem": "Who was the Mughal emperor during the third battle of Panipat ?", "opts": {"a": "Akbar II", "b": "Shahalam II", "c": "Bahadur Shah I", "d": "Bahadurshah Jafar"}, "ans": "b", "exp": "Shahalam II (Ali Gauhar) -  Son of Alamgir II. Third Battle of Panipat (14 January, 1761): Between Maratha Empires and Ahmad Shah Abdali. (Victory - Ahmad Shah Abdali).", "t": 1, "s": 17}, {"n": 461, "tag": null, "stem": "The Battle of Khatoli fought was in 1517 between the kingdom of Mewar under Rana Sanga and ______.", "opts": {"a": "Sikander Lodi", "b": "Babur", "c": "Ibrahim Lodi", "d": "Mahmud Lodi"}, "ans": "c", "exp": "Ibrahim Lodhi. The Lodi dynasty (1451 - 1526, an Afghan dynasty was the fifth and final dynasty of the Delhi Sultanate.", "t": 1, "s": 17}, {"n": 462, "tag": null, "stem": "Consider the following statements about historical battles in India:<br><b>Statement 1: <\/b>The Battle of Aliwal (1846) was fought between the British and Sikh forces, without Mughal involvement.<br><b>Statement 2: <\/b>The Battle of Buxar (1764) was fought only between the Marathas and the Afghans, with no role of the Mughal army.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "c", "exp": "The Battle of Aliwal (1846) was fought during the First Anglo-Sikh War between the British (Sir Harry Smith) and the Sikh army under Ranjodh Singh Majithia, with no Mughal role. The Battle of Buxar (1764), however, involved the English East India Company against Mir Qasim, Shuja-ud-Daula, and the Mughal Emperor Shah Alam II, so the Mughal army was indeed involved.", "t": 1, "s": 17}, {"n": 463, "tag": null, "stem": "Which of the given statements is correct ?<br>I. When Alivardi Khan died in 1756, Siraj-ud-daulah became the nawab of Bengal.<br>II. In 1757, Robert Clive led the company’s army against Siraj-ud-daulah at Plassey.", "opts": {"a": "Only II", "b": "Neither I nor II", "c": "Only I", "d": "Both I and II"}, "ans": "d", "exp": "Both I and II. Battle of  <mark>Plassey <\/mark>(23 June 1757) - Bengal (led by Siraj ud-Daulah - last independent Nawab of Bengal) annexed by the British East India Company (led by Robert Clive - First British Governor of the Bengal Presidency).", "t": 1, "s": 17}, {"n": 464, "tag": null, "stem": "In which year did Tipu Sultan die defending his capital Seringapatam ?", "opts": {"a": "1799", "b": "1802", "c": "1792", "d": "1794"}, "ans": "a", "exp": "1799 . He is known as Tiger of Mysore. Tipu Sultan was inspired by the Ideals of the French Revolution. Daria Daulat Bagh is known as Tipu Sultan’s Summer Palace. He was finally defeated at the hands of Lord Wellesley.", "t": 1, "s": 17}, {"n": 465, "tag": null, "stem": "Who emerged victorious in ‘The Siege of Arcot’ in 1751 AD ?", "opts": {"a": "French", "b": "Dutch", "c": "Portuguese", "d": "British"}, "ans": "d", "exp": "British. The Siege of Arcot was the battle between British and combined forces of French and Nawab of Arcot. Robert Clive captured the Arcot after the battle. The war ended with the Treaty of Pondicherry in 1754 which made Mohammad Ali Khan Walajah as Nawab of Arcot.", "t": 1, "s": 17}, {"n": 466, "tag": null, "stem": "In which year was the Treaty of Versailles signed ?", "opts": {"a": "1921", "b": "1919", "c": "1933", "d": "1940"}, "ans": "b", "exp": "1919 . The defeated Germany after the First World War signed the Treaty of Versailles on 28 June 1919.", "t": 1, "s": 17}, {"n": 467, "tag": null, "stem": "Consider the following statements about the Treaty of Yandabo (1826):<br><b>Statement 1: <\/b>The Treaty of Yandabo was signed after the Second Anglo-Maratha War and resulted in the annexation of Odisha by the British.<br><b>Statement 2: <\/b>The Treaty of Yandabo was signed between the British and Burmese after the First Anglo-Burmese War in 1826.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "d", "exp": "Statement 1 is incorrect because the Treaty of Yandabo was unrelated to the Anglo-Maratha War or Odisha’s annexation. Statement 2 is correct as it was signed in 1826 after the First Anglo-Burmese War, through which Assam, Manipur, Arakan, and Tenasserim were ceded to the British, extending their control in the northeast.", "t": 1, "s": 17}, {"n": 468, "tag": null, "stem": "In 1818, the Holkar Dynasty signed the Treaty of Mandsaur with the _____.", "opts": {"a": "Danish", "b": "Dutch", "c": "British", "d": "French"}, "ans": "c", "exp": "British. After Malhar Rao II was defeated in the battle of Mahidpur (1817) the treaty of Mandsaur was signed.", "t": 1, "s": 17}, {"n": 469, "tag": null, "stem": "Which of the following battles did Maulvi Ahmadullah Shah fight, defeating the forces under Henry Lawrence ?", "opts": {"a": "Battle of Kintoor", "b": "Battle of Saragarhi", "c": "Battle of Chinhat", "d": "Battle of Najafgarh"}, "ans": "c", "exp": "Battle of Chinhat. In the Battle of Chinhat, Barkat Ahmad was declared Chief Army Officer of the rebels. The Battle of Chinhat was fought on the morning of 30 June 1857, between British forces and Indian rebels.", "t": 1, "s": 17}, {"n": 470, "tag": null, "stem": "In the Battle of Swally (1612) the British fought against the ______.", "opts": {"a": "Danish", "b": "Portuguese", "c": "French", "d": "Dutch"}, "ans": "b", "exp": "Portuguese. The battle took place on 29–30 November 1612 off the coast of Suvali, a village near Surat city. This relatively small naval battle is historically important as it marked the beginning of the end of <mark>Portugal’s <\/mark> commercial monopoly over India and the beginning of the ascent of the English East India Company’s presence in India.", "t": 1, "s": 17}, {"n": 471, "tag": null, "stem": "The Battle of Bedara was fought between the British Army and the Dutch Army in:", "opts": {"a": "1760", "b": "1759", "c": "1772", "d": "1764"}, "ans": "b", "exp": "25 November 1759, during the Seven Years&#x27; War between a force of British troops mainly of the British East India Company and a force of the Dutch East India Company.", "t": 1, "s": 17}, {"n": 472, "tag": null, "stem": "The British annexed Punjab after defeating the Sikhs in the Anglo-Sikh War in the year ______.", "opts": {"a": "1835", "b": "1839", "c": "1849", "d": "1845"}, "ans": "c", "exp": "1849. This war resulted in the fall of the Sikh Empire and The East India Company annexed Punjab and it became part of North West Frontier Province.", "t": 1, "s": 17}, {"n": 473, "tag": null, "stem": "Who signed the treaty of Alinagar with the British ?", "opts": {"a": "Mir Qasim", "b": "Siraj-ud-Daula", "c": "Alivardi Khan", "d": "Mir Jafar"}, "ans": "b", "exp": "Siraj-ud-Daula . The Treaty of Alinagar was signed on 9 February 1757 between Robert Clive of the British East India Company and the Nawab of Bengal, Mirza Muhammad Siraj Ud Daula. Based on the terms of the accord, the Nawab would recognize all the provisions of Mughal Emperor Farrukhsiyar farman of 1717.", "t": 1, "s": 17}, {"n": 474, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Which of the following statements <b>is/are correct <\/b>regarding the regional features of Gujarat&#x27;s medieval architecture?<br>1. Architectural forms in Gujarat often incorporated elements from local temple traditions.<br>2. Structures such as mosques and tombs in Gujarat featured ornamental carvings like toranas and bell motifs.<br>3. Gujarat&#x27;s architectural style strictly avoided any decorative influence from indigenous practices.", "opts": {"a": "Only 1", "b": "2 and 3 Only", "c": "All 1, 2, and 3 are correct", "d": "1 and 2 Only"}, "ans": "d", "exp": "1 and 2 Only. The medieval architecture of Gujarat, especially under the Gujarat Sultanate, represents a rich Indo-Islamic fusion. Local Hindu and Jain craftsmen applied temple-building skills to mosques, blending trabeate (post-lintel) systems with Islamic arches and domes. This produced mosque halls resembling mandapas. A hallmark was the use of ornamental carvings—toranas, lotus motifs, chain-and-bell designs, and floral patterns. Notable examples of this syncretic style are found in Ahmedabad and Champaner.", "t": 1, "s": 18}, {"n": 475, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Given below are assertion and reason, read the statements and choose the correct option.<br><b>Assertion: (A) <\/b>British capital accumulation in the 18th century was reinvested in industrial development.<br><b>Reason: <\/b>(R)The capital was largely controlled by merchants and industrialists instead of the feudal aristocracy.", "opts": {"a": "A is true, but R is false.", "b": "Both Assertion (A) and Reason (R) are true, and R is not the correct explanation of A.", "c": "Both Assertion (A) and Reason (R) are true, and R is the correct explanation of A.", "d": "A is false, but R is true."}, "ans": "c", "exp": "In 18th-century Britain, a huge accumulation of capital arose from the Agricultural Revolution, overseas trade, the slave trade, colonial profits, and cottage industries. Unlike being hoarded, much of this wealth was reinvested in factories, technologies, and infrastructure, sparking the Industrial Revolution. Socially, while the landed aristocracy still held power, a new class of merchants, bankers, and industrialists emerged. Their wealth was liquid (cash/credit) and, unlike the conservative aristocracy, they actively took risks in commerce and industry, driving economic transformation.", "t": 1, "s": 18}, {"n": 476, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Consider the following statements about the Trinity of Carnatic Music and choose the correct option:<br><b>Statement 1: <\/b>Tyagaraja, Muthuswami Dikshitar, and Shyama Shastri lived during the 17th century.<br><b>Statement 2: <\/b>The trinity elevated the kriti form to its highest artistic expression.", "opts": {"a": "Both 1 and 2 are correct", "b": "Only 2", "c": "Neither 1 nor 2 is correct", "d": "Only 1"}, "ans": "b", "exp": "Only 2. The Trinity of Carnatic Music, also known as the Three Jewels of Carnatic Music, refers to the outstanding trio of composer-musicians of Carnatic music in the 18th century—Tyagaraja, Muthuswami Dikshitar, and Syama Sastri. Tyagaraja: The most prolific, his kritis mostly praise Lord Rama and are deeply spiritual. Dikshitar: Blended Hindustani influences into his kritis, wrote about his travels, and gave his works historical value. Syama Sastri: Creator of the svarajati form, known for rhythmic beauty using similar sounds, and devoted his compositions to Goddess Bangaru Kamakshi.", "t": 1, "s": 18}, {"n": 477, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Match the following cave sites with their architectural characteristics: <b>Column A- Column B- <\/b> <b>Cave Site Architectural Feature <\/b><br>A. Udayagiri 1. Circular caitya with stupa and arch<br>B. Guntapalle 2. Pillared veranda with cells at the back<br>C. Khandagiri 3. Animal-shaped single rock excavations", "opts": {"a": "A-3, B-1, C-2", "b": "A-1, B-2, C-3", "c": "A-1, B-3, C-2", "d": "A-2, B-1, C-3"}, "ans": "d", "exp": "A-2, B-1, C-3. Udayagiri caves served primarily as monastic dwellings, e mphasizing practical residential design. Guntapalle caves highlight ritualistic and ceremonial architecture common in early Buddhist traditions. Khandagiri caves are notable for their sculptural creativity, featuring symbolic animal forms. Each site reflects the religious and cultural priorities of its builders, with functional, ceremonial, or symbolic focus shaping the architectural style.", "t": 1, "s": 18}, {"n": 478, "tag": "SSC Stenographer 8/08/2025 (Shift 3)", "stem": "Which feature is not commonly associated with French colonial architecture in India ?", "opts": {"a": "Wide verandas", "b": "Tall doors and windows", "c": "Sloped tiled roofs", "d": "Ornate Mughal domes"}, "ans": "d", "exp": "Ornate Mughal domes.  French colonial architecture in India (especially in Puducherry, Chandannagar, Karaikal, Mahe) has distinctive features: Wide verandas – to allow ventilation and shade in tropical climate. Tall doors and windows – for cross-ventilation and grandeur. Sloped tiled roofs – to withstand heavy monsoon rains. Use of pastel colors, courtyards, and symmetry. Ornate Mughal domes, however, are a feature of Mughal architecture (e.g., Taj Mahal, Humayun’s Tomb), not French colonial design.", "t": 1, "s": 18}, {"n": 479, "tag": null, "stem": "Consider the following statements regarding temple architecture in India:<br>1. The Dravidian style of temple architecture flourished mainly in Northern India.<br>2. The Vesara style represents a fusion of Nagara and Dravida styles. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Dravidian style is mainly seen in Southern India, not Northern India. Vesara style is indeed a blend of Nagara and Dravida with a bell-shaped tower.", "t": 1, "s": 18}, {"n": 480, "tag": null, "stem": "Diwan-I-Am, containing the marble canopy ornamented with beautiful panels of pietra dura work, is a part of which monument ?", "opts": {"a": "Bibi ka Makbara", "b": "Red Fort", "c": "Taj Mahal", "d": "Humayun Tomb"}, "ans": "b", "exp": "Red Fort. The Diwan-i-Am (Hall of Public Audience) is part of the Red Fort in Delhi. It is a significant structure that was used by the Mughal emperors for public meetings. Pietra dura is an Italian term that refers to a decorative art technique of inlaying cut, polished, colored stones into marble or other hard surfaces to create images.", "t": 1, "s": 18}, {"n": 481, "tag": null, "stem": "Which red and buff sandstone is the tallest tower in India built in the thirteenth century ?", "opts": {"a": "Shaheed Minar", "b": "Chand Minar", "c": "Jhulta Minar", "d": "Qutub Minar"}, "ans": "d", "exp": "Qutub Minar (Delhi). It has a diameter of 14.32 m at the base and about 2.75 m on the top with a height of 72.5 m. Qutbu&#x27;d-Din Aibak laid the foundation of Minar in AD 1199.", "t": 1, "s": 18}, {"n": 482, "tag": null, "stem": "Which of the following statements is/are correct temples of Khajuraho ?<br>a) Equal importance is given to human experience and spiritual pursuit.<br>b) Jain and Hindu temples are also found at Khajuraho.<br>c) Chausanth Yogini temple is one of the important temples here.", "opts": {"a": "All a, b and c", "b": "Only a and b", "c": "Only c and a", "d": "Only b and c"}, "ans": "a", "exp": "All a, b and c. Khajuraho’s temples are also known for their extensive erotic sculptures. Khajuraho’s sculptures are highly stylised with typical features. Notable examples include the Kandariya Mahadeo temple, dedicated to Lord Shiva, and the Lakshmana temple, dedicated to Vishnu.", "t": 1, "s": 18}, {"n": 483, "tag": null, "stem": "The title of ‘Chief of the Merchants’ or ‘Malikut-Tujjar’ was conferred on Mahmud Gawan by which of the following Bahamani kings ?", "opts": {"a": "Mohammad Shah", "b": "Humayun Shah", "c": "NizamuddinAhmad III", "d": "Bahman Shah"}, "ans": "b", "exp": "Humayun Shah. Mahmud Gawan (Khawaja Mahmud Gilani), a Persian trader who arrived in Deccan, rose to prominence in the Bahmani kingdom. Under Humayun Shah&#x27;s reign, he was appointed as Prime Minister with complete control over military affairs and received the title &#x27;Malik-ut-Tujjar&#x27; (Chief of Merchants).", "t": 1, "s": 18}, {"n": 484, "tag": null, "stem": "Match the following books with their respective authors. <b>Book Author <\/b><br>a) Tajul Ma&#x27;asir i) Yahya bin Ahmad Sirhimdi<br>b) Khazain-ul Futuh ii) Hasan Nizami<br>c) Tarikh-i-Firuzshahi iii) Ziauddin Barani<br>d) Tarikh-i- iv) Amir Khusrav Mubarakshahi", "opts": {"a": "a-iii; b-i; c-iv; d-ii", "b": "a-ii; b-iv; c-iii; d-i", "c": "a-iv; b-iii; c-i; d-ii", "d": "a-i; b-iii; c-ii; d-iv"}, "ans": "b", "exp": "a-ii; b-iv; c-iii; d-i. Some other ancient books and their authors : ‘Akbar-Namah’ - Abul Fazal, ‘Buddhacharita’ - Ashvaghosha, ‘Prithviraj Raso’ - Chand Bardai, ‘Geet Govinda’ - Jaidev, ‘Rajtarangini’ - Kalhana, ‘Kumarasambhavam’ - Kalidasa, ‘Ashtadhyayi’ - Panini, and ‘Mahabhasya’ - Patanjali.", "t": 1, "s": 18}, {"n": 485, "tag": null, "stem": "According to which of the following foreign travellers, people of Delhi used to write letters containing abuses to the Sultan, therefore, in order to punish them Sultan decided to shift the capital ?", "opts": {"a": "Isami", "b": "Hasan Nizami", "c": "Ibn Batuta", "d": "Al Biruni"}, "ans": "c", "exp": "Ibn Battuta , a traveler from Morocco, authored a book of travels called Rihla, which is written in Arabic and provides rich and fascinating details about the social and cultural life in the subcontinent during the 14th century. Muhammad Bin Tughlaq was the ruler of the Delhi sultanate when Ibn Batuta came to India. The Sultan was impressed by his scholarship, and appointed him the qazi or judge of Delhi.", "t": 1, "s": 18}, {"n": 486, "tag": null, "stem": "Chand Bardai’s famous literary work _____, mentions Prithviraj Chauhan‘s love story and heroic deeds.", "opts": {"a": "Harakeli Nataka", "b": "Abhidhana Chintamani", "c": "Prithviraj Raso", "d": "Rajamartanda"}, "ans": "c", "exp": "Prithviraj Raso. It is a Braj language epic poem about the life of Prithviraj Chauhan. Other Ancient Books and Authors : ‘Ain-i-Akbari’ - Abul Fazl, ‘Mahabharata’ - Vyasa, ‘Ramayana’ - Valmiki, ‘Shakuntala’ - Kalidasa, and ‘Mudrarakshas’ - Vishakhadatta.", "t": 1, "s": 18}, {"n": 487, "tag": null, "stem": "Consider the following statements regarding the astronomical observatories in North India:<br>1. Sawai Jaisingh II established five Jantar Mantar observatories at Delhi, Jaipur, Ujjain, Mathura, and Varanasi.<br>2. Sawai Jaisingh II founded the city of Jaipur on 18 November 1727 AD.<br>3. He was appointed the Subedar (governor) of Agra in 1722. Which of the statements given above is/are correct ?", "opts": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "d", "exp": "1, 2 and 3. Sawai Jaisingh II is renowned for establishing five Jantar Mantar observatories in North India and founding Jaipur. He also served as the Subedar of Agra.", "t": 1, "s": 18}, {"n": 488, "tag": null, "stem": "Which of the following dynasties’ genealogy was found in the Bijolia inscription ?", "opts": {"a": "Gahadavala", "b": "Parmara", "c": "Chandela", "d": "Chahamana"}, "ans": "d", "exp": "Chahamana. Bijoliya Inscription reveals that Chauhans are Vats Gotriya Brahman. This inscription provides information about the names of Jabalipur, Shakmbhari, Srimal. An inscription of Vikram Samvat 1226 Falgun Krishna Tritiya is inscribed on a rock near the northern wall of the ancient Parshvanath temple located in Bijolia.", "t": 1, "s": 18}, {"n": 489, "tag": null, "stem": "Who was the founder of the Bahmani Sultanate ?", "opts": {"a": "Muhammad Shah", "b": "Feroz Shah Bahmani", "c": "Muhammad Bin Tughlaq", "d": "Alauddin Hasan Bahman Shah"}, "ans": "d", "exp": "Alauddin Hasan Bahman  <mark>Shah <\/mark>founded the Bahmani Sultanate in 1347. Its capital was Ahsanabad (Gulbarga) from 1347 to 1425, later shifted to Muhammadabad (Bidar).", "t": 1, "s": 18}, {"n": 490, "tag": null, "stem": "Which State was founded by Nizam-ul-Mulk in 1724 ?", "opts": {"a": "Mysore", "b": "Hyderabad", "c": "Bengal", "d": "Awadh"}, "ans": "b", "exp": "Hyderabad. Nizam-ul-Mulk Asaf Jah (Chin Qilich Khan) was one of the most powerful members at the court of the Mughal Emperor Farrukh Siyar. He was entrusted first with the governorship of Awadh, and later given charge of the Deccan.", "t": 1, "s": 18}, {"n": 491, "tag": null, "stem": "Under the Bahmani kingdom, the provinces were administered by_____", "opts": {"a": "Amirs", "b": "Afaquis", "c": "Khalisa", "d": "Tarafdars"}, "ans": "d", "exp": "Tarafdars. The Bahmani Kingdom, established in 1347 by Ala-ud-din Hassan Bahman Shah after revolting against the Delhi Sultanate. It was divided into four administrative regions known as &quot;taraf.&quot; These regions included Daulatabad, Bidar, Berar, and Gulbarga, each governed by a tarafdar or subedar.", "t": 1, "s": 18}, {"n": 492, "tag": null, "stem": "Which of the following forts was built by Raja Rai Singh in 1588 ?", "opts": {"a": "Junagarh Fort", "b": "Amer Fort", "c": "Sonar Kila", "d": "Kumbhal Garh"}, "ans": "a", "exp": "Junagarh Fort. It is located in Bikaner, Rajasthan. It was originally called Chintamani and later renamed to mean &quot;Old Fort.&quot; Amer Fort: It is situated in Amer near Jaipur, was initially built by Raja Man Singh and expanded by Sawai Jai Singh. Kumbhalgarh Fort: It is located in Rajsamand district, was constructed by Rana Kumbha in the 15th century, with chief architect Mandan showcasing his style in Raja Vallabh.", "t": 1, "s": 18}, {"n": 493, "tag": null, "stem": "After the breakup of the Bahmani kingdom, how many independent states arose ?", "opts": {"a": "3", "b": "6", "c": "4", "d": "5"}, "ans": "d", "exp": "5. After the death of Muhammad Shah-III (ruler) in 1482, the Kingdom was disintegrated into five kingdoms: Bijapur, Ahmednagar, Bera, Golconda and Bidar.", "t": 1, "s": 18}, {"n": 494, "tag": null, "stem": "Who among the following Bahmani sultans transferred his capital from Gulbarga to Bidar ?", "opts": {"a": "Ahmad Shah", "b": "Humayun", "c": "Mujahid Shah", "d": "Firuz Shah"}, "ans": "a", "exp": "Ahmad Shah (1422-1435). Bahmani sultanate was established by Alauddin Hasan Bahman Shah (Zafar Khan) in 1347. Bahmani kingdom comprises the parts of the current day’s Karnataka, Maharashtra, and Andhra Pradesh.", "t": 1, "s": 18}, {"n": 495, "tag": null, "stem": "Europeans entered India with a mindset of trading only. This streak was initiated by which of the following European nations ?", "opts": {"a": "Dutch", "b": "French", "c": "British", "d": "Portuguese"}, "ans": "d", "exp": "Portuguese - They were the first Europeans to come to India by Sea routes in 1498, led by Vasco da Gama at Calicut (Kerala). European nations arrived in India after Portuguese, Dutch, English, Danish, and French. The Portuguese were also the last to leave India in 1961.", "t": 1, "s": 18}, {"n": 496, "tag": null, "stem": "Consider the following statements regarding the Nawabs of Bengal:<br>1. Siraj-ud-Daulah succeeded Alivardi Khan as the Nawab of Bengal in 1756.<br>2. Alivardi Khan ruled Bengal from 1740 to 1756.<br>3. Mir Qasim was the Nawab of Bengal from 1765 to 1768. Which of the statements given above is/are correct ?", "opts": {"a": "1 and 2 only", "b": "2 and 3 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "1 and 2 only. Siraj-ud-Daulah was the successor of Alivardi Khan and the last independent Nawab of Bengal. Alivardi Khan resisted Maratha invasions successfully. Statement 3 is incorrect because Mir Qasim actually ruled from 1760 to 1763, not 1765–1768.", "t": 1, "s": 18}, {"n": 497, "tag": null, "stem": "Select the INCORRECT pair of a famous minaret and its construction year in India.", "opts": {"a": "Shaheed Minar–1828 CE", "b": "Char Minar–1664 CE", "c": "Chand Minar–1435 CE", "d": "Jhulta Minar–1452 CE"}, "ans": "b", "exp": "Char Minar–1664 CE. It was built by Sultan Mohammed Quli Qutb Shah in 1591. It was built in honour of his wife, Bhagmati in Hyderabad. Shaheed Minar: It was built in the memory of Major-general Sir David Ochterlony, commander of the British East India Company.", "t": 1, "s": 18}, {"n": 498, "tag": null, "stem": "What did the term &#x27;bhoga&#x27; refer to during the medieval period ?", "opts": {"a": "Revenue assignments", "b": "Donations to temples", "c": "A festival", "d": "Religious function"}, "ans": "a", "exp": "Revenue Assignment. Other Type of Tax : Kara - It was a generic term used for taxes. Hiranya - Tax on special produce taken in cash. Chat - Security Tax. Prataya -Toll Tax.", "t": 1, "s": 18}, {"n": 499, "tag": null, "stem": "Joseph Francois Dupleix was the Governor General of which of the following East India companies in India ?", "opts": {"a": "Dutch", "b": "French", "c": "English", "d": "Portuguese"}, "ans": "b", "exp": "French (Last European to arrive in India). Governor-General Dupleix was appointed in 1742. French East India Company : Established in - 1664. The First French Factory - Surat (1668), Second Factory - Masulipatam (1669), Headquarters - Pondicherry. Europeans in India - Portuguese (1498), Dutch (1602), British (1608), Danes (1616).", "t": 1, "s": 18}, {"n": 500, "tag": null, "stem": "Rajaram was the leader of which of the following revolts against the Mughals ?", "opts": {"a": "Satnami", "b": "Bundela", "c": "Jat", "d": "Munda"}, "ans": "c", "exp": "Jat revolt (Mathura). In 1669 CE against Aurangzeb. <mark>Satnami revolt <\/mark> (1672) - The Satnamis were a sect comprising peasants, artisans and untouchables who rebelled against the Aurangzeb in Narnaul (Haryana). <mark>Bundela Rebellion <\/mark>(1842) <mark>- <\/mark>Jawahar Singh Bundela of Chandrapur and Madhukar Shah of Narhat were the leaders of the revolt.", "t": 1, "s": 18}, {"n": 501, "tag": null, "stem": "Consider the following statements:<br>1. ‘Shahnameh’ (Book of Kings) was composed by Ferdowsi.<br>2. Ferdowsi was the court poet of Mahmud of Ghazni. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. Ferdowsi indeed composed the Shahnameh, but he was not Mahmud of Ghazni’s court poet; their patronage relationship was strained and contested.", "t": 1, "s": 18}, {"n": 502, "tag": null, "stem": "Malik Ambar, who resisted Mughals in Deccan, was an able administrator of which state ?", "opts": {"a": "Bidar", "b": "Bijapur", "c": "Golconda", "d": "Ahmednagar"}, "ans": "d", "exp": "Ahmednagar. Malik Ambar was an African-origin statesman and military leader who served as the regent of the Nizam Shahi dynasty in the Deccan, of Ahmednagar (now part of Maharashtra).", "t": 1, "s": 18}, {"n": 503, "tag": null, "stem": "The Imadshahi family was known for the foundation of which state ?", "opts": {"a": "Berar", "b": "Bidar", "c": "Ahmednagar", "d": "Golkonda"}, "ans": "a", "exp": "Berar (Maharashtra). Imad Shahi Dynasty <mark>: <\/mark>Established by - Fathullah Imad Ul Mulk (1490). He fortified Gavilgad and Narnala. Berar Sultanate was annexed by Sultan Murtaza Shah of Ahmednagar Kingdom in 1574. Capital - Ellichpur.", "t": 1, "s": 18}, {"n": 504, "tag": null, "stem": "In the 15 th century, a text called _____ is ascribed popularly to Lochan Kavi.", "opts": {"a": "Hridayprakash", "b": "Sangeet Darpan", "c": "Anup Vilas", "d": "Raag Tarangini"}, "ans": "d", "exp": "Raag Tarangini - Initiated an alternative system of the division of rags, &#x27;the Thaat system&#x27;. Lochan Kavi (Lochan Panḍit) belonged to the Mithila region (Bihar). “Sangeet Darpan” was written by Damodar Pandit. “Anup Rag Vilas” is written by Kumar Gandharva.", "t": 1, "s": 18}, {"n": 505, "tag": null, "stem": "Who founded the independent State of Bengal ?", "opts": {"a": "Alivardi khan", "b": "Murshid Quli Khan", "c": "Sarafraz Khan", "d": "Shuja-ud-Din"}, "ans": "b", "exp": "Murshid Quli Khan (Zamin Ali Quli) was born as Surya Narayan Mishra; the first Nawab of Bengal (1717 to 1727). He built the Katra Masjid (1723-1724) where he was buried after his death.", "t": 1, "s": 18}, {"n": 506, "tag": null, "stem": "Who among the following was the Maharana of Mewar and composed a book on music called &#x27;Sangeet Raj&#x27; ?", "opts": {"a": "Maharana Sanga", "b": "Maharana Pratap", "c": "Maharana Kumbha", "d": "Maharana Udai Singh"}, "ans": "c", "exp": "Maharana Kumbha  (1433-1468 AD) belonged to the Sisodia clan of Rajputs. Titles of Maharana Kumbha <mark>: <\/mark>Abhinav Bhattacharya, Rajguru, Daanguru, Halguru, Rano Raso.", "t": 1, "s": 18}, {"n": 507, "tag": null, "stem": "Name the Bhakti Saint from South India who was initially a Jaina and a minister in the court of a Chalukya king in the twelfth century.", "opts": {"a": "Karaikkal Ammaiyar", "b": "Basavanna", "c": "Eknath", "d": "Tallapaka Annamacharya"}, "ans": "b", "exp": "Basavanna - Founder of Lingayatism; Prime minister of Kalachurya king Bijjala (1157-1167); Founded the Anubhava Mantapa.", "t": 1, "s": 18}, {"n": 508, "tag": null, "stem": "The eleventh century structure of Bhojshala in the state of Madhya Pradesh was constructed under the patronage of which dynasty ?", "opts": {"a": "Chandela", "b": "Paramara", "c": "Nanda", "d": "Gurjara-Pratihara"}, "ans": "b", "exp": "Paramara. &#x27;Bhojshala&#x27; is an ancient and the only temple of Mata Saraswati. It is located in Dhar district of Madhya Pradesh. The <mark>Paramara dynasty <\/mark> (Rajput) ruled Malwa and the adjacent regions in west-central India from the 9th century to the 14th century. Founder - Upendra or Krishnaraja.", "t": 1, "s": 18}, {"n": 509, "tag": null, "stem": "In which of the following places is the Tomb of Ahmad Shah Al Wali Bahmani built ?", "opts": {"a": "Fatehpur Sikri", "b": "Agra", "c": "Ashtoor", "d": "Ajmer"}, "ans": "c", "exp": "Ashtoor. Ahmed Shah Al Wali Bahamani <mark>( <\/mark>1422 to 1436, Bahmani Sultanate <mark>) - Ashtoor <\/mark>is an important center of Indo-Saracenic monuments. Twelve imposing mausoleums are located at Ashtur east of Bidar.", "t": 1, "s": 18}, {"n": 510, "tag": null, "stem": "The Hoysaleshvara temple was built with which of the following stones by a Hoysala king in 1150 ?", "opts": {"a": "Dark Schist Stone", "b": "White Marble", "c": "Sandstone", "d": "Grey Basalt"}, "ans": "a", "exp": "Dark Schist Stone. The temples were known for its pillared hall and stellate plan. Capital of Hoysala - Dorasamudra (Dwarasamudra).", "t": 1, "s": 18}, {"n": 511, "tag": null, "stem": "Udaipur was founded by ____after the fall of Chittor to Akbar in 1568.", "opts": {"a": "Sawai Jai Singh", "b": "Raja Bharmal", "c": "Man singh", "d": "Rana Udai Singh"}, "ans": "d", "exp": "Rana Udai Singh. Udaipur is known as &#x27;Venice of the East&#x27; and the city of lakes.", "t": 1, "s": 18}, {"n": 512, "tag": null, "stem": "Consider the following statements regarding Indian architectural styles:<br>1. The use of overhanging balconies and arched cornices is a distinctive feature of Mughal architecture.<br>2. The Rajput fort ‘Hawa Mahal’ in Jaipur is an example of Rajput architecture, built by Maharaja Sawai Pratap Singh. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "b", "exp": "2 only. The feature of overhanging balconies and arched cornices belongs to Rajput architecture, not Mughal.", "t": 1, "s": 18}, {"n": 513, "tag": null, "stem": "Ananga Pala was a ruler of which dynasty ?", "opts": {"a": "Rajput Dynasty", "b": "Gurjara-Pratihara Dynasty", "c": "Pallava Dynasty", "d": "Khilji Dynasty"}, "ans": "a", "exp": "Rajput Dynasty - It was founded by Simharaj, who is famously known as the founder of the city of Ajmer. <mark>Ananga Pala - <\/mark>He was a king of the Tomara dynasty, who ruled over areas of Delhi in India.", "t": 1, "s": 18}, {"n": 514, "tag": null, "stem": "The Ahom Kingdom in India was located in the _______.", "opts": {"a": "Chota Nagpur plateau", "b": "Vindhayas", "c": "Brahmaputra valley", "d": "Coastal Odisha"}, "ans": "c", "exp": "Brahmaputra valley.  <mark>Chaolung Sukapha <\/mark>founded the Ahom kingdom (13th century) that ruled Assam for six centuries. It was annexed by British India in 1826 with the signing of the Treaty of Yandaboo. Lachit Borphukan (military general of Ahom kingdom) defeated Mughal forces in the Battle of Saraighat 1671.", "t": 1, "s": 18}, {"n": 515, "tag": null, "stem": "What did the medieval term &quot;Raqs&quot; mean ?", "opts": {"a": "Dancing", "b": "Singing", "c": "Chanting", "d": "Ritual"}, "ans": "a", "exp": "Dancing. Medieval Terms  <mark>and Meaning: <\/mark>Amils (Revenue), Bargir (Cavalrymen), Daam (Coin), Dhimmis (Non-Muslims people), Din (Religion), Diwan (Function of finance), Wilayat (The spiritual territory of a Sufi).", "t": 1, "s": 18}, {"n": 516, "tag": null, "stem": "Bhakti saints, Nayanars were devotees of which of the following gods?", "opts": {"a": "Murugan", "b": "Shiva", "c": "Vishnu", "d": "Indra"}, "ans": "b", "exp": "Shiva. The <mark>Nayanars <\/mark>were a group of 63 saints devoted to Lord Shiva who lived during the 6th to 8th centuries CE. The <mark>Alwars <\/mark>were Tamil poet-saints of South India who espoused devotion to Lord Vishnu.", "t": 1, "s": 18}, {"n": 517, "tag": null, "stem": "Which among the following forts was principal capital of Qutb Shahi dynasty in Hyderabad ?", "opts": {"a": "Chiktan Fort", "b": "Rajgad Fort", "c": "Red Fort", "d": "Golconda Fort"}, "ans": "d", "exp": "Golconda Fort - It was built by the Kakatiya Dynasty. It was the principal capital of the Qutb Shahi dynasty in Hyderabad. <mark>Rajgad Fort - <\/mark> Pune ( Maharashtra). Chhatrapati Shivaji renovated this fort and made it his capital in 1674 AD. <mark>Chiktan Fort - <\/mark>Kargil (Ladakh).", "t": 1, "s": 18}, {"n": 518, "tag": null, "stem": "Which of the following books was written by the Roman writer Pliny the elder ?", "opts": {"a": "Indica", "b": "Natural History", "c": "Geographica", "d": "Periplus of the Erythraean Sea"}, "ans": "b", "exp": "Natural History. Important  <mark>Books and Authors: <\/mark>“Gathasaptashati” - Hala, “Indica” - Megasthenes, “Geographica” - Strabo, “Periplus of the Erythraean Sea:” - William H Schoff, “Kathasaritsagara” - Somadeva, “Mudrarakshasa” - Vishakhadatta, “Rajtarangini” - Kalhana.", "t": 1, "s": 18}, {"n": 519, "tag": null, "stem": "Which of the following cities became the capital of Bengal in 1704 ?", "opts": {"a": "Howrah", "b": "Murshidabad", "c": "Kharagpur", "d": "Kolkata"}, "ans": "b", "exp": "Murshidabad. Murshid Quli Khan (Zamin Ali Quli) transferred his capital to the then Mukhsusabad later came to be known after Murshid Quli Khan as Murshidabad in 1704 A.D. Murshidabad (West Bengal) on the banks of the Bhagirathi became the center of silk. Murshid Quli Khan (1717-1727) was the first Nawab of Bengal.", "t": 1, "s": 18}, {"n": 520, "tag": null, "stem": "Which of the following statement is correct with respect to the Prashastis and land grants ?<br>I. Prashastis were composed by learned Brahmanas.<br>II. Kings often rewarded Brahmanas by grants of land which were recorded on copper plates.", "opts": {"a": "Only I", "b": "Both I and II", "c": "Only II", "d": "Neither I nor II"}, "ans": "b", "exp": "Both I and II. Prashastis (metal plates) were written by Brahmans in Sanskrit or any regional language. They have been written in the 1 st millennium and onwards in the form of prose or poetry. Example: Allahabad Pillar Inscription Sanskrit poem (by Harishena in praise of King Samudragupta). Agrahara (Agraharam, Ghatoka, Boya) refers to the land, village, or fields that were given to <mark>Brahmans. <\/mark>", "t": 1, "s": 18}, {"n": 521, "tag": null, "stem": "The craftspersons of Bidar were so famed for their inlay work in ______.", "opts": {"a": "Gold and Bronze", "b": "Bronze and Silver", "c": "Gold and Copper", "d": "Copper and Silver"}, "ans": "d", "exp": "Copper and Silver. Work of Bidar (Karnataka) craftsperson called BIdri. Bidar was the capital of Bahmani Kingdom in the 14th century. Bidar fort was built by Ahmad Shah Wali Bahman. Bidar is also considered one of the holiest places for Sikh pilgrimage.", "t": 1, "s": 18}, {"n": 522, "tag": null, "stem": "In 1342, one of the nobles, Haji Ilyas Khan united Bengal and became its ruler under the title of____and laid the foundation of the Ilyas Shah dynasty.", "opts": {"a": "Shams-ud-din Iliyas Shah", "b": "Ghiyasuddin Azam", "c": "Sultan Abu al-Mujahid", "d": "Sultan Sayf ad-Din"}, "ans": "a", "exp": "Shams-ud-din Ilyas Shah  {(founder of Bengal Sultanate and Ilyas Shahi dynasty (First dynasty of Bengal)}. Dynasties of Bengal Sultanate - Ilyas Shahi (1342-1415), Ganesha (1414 -1435), Restorer of Ilyas Dynasty (Nasiruddin Mahmud Shah-I, 1435 -1487), Habshi rule (Shahzada Barbak, 1487-1494) and Hussain Shahi dynasty (Alauddin Hussain Shah - 1494-1519).", "t": 1, "s": 18}, {"n": 523, "tag": null, "stem": "Who was the architect of the famous Mysore Palace in Karnataka ?", "opts": {"a": "Henry Irwin", "b": "William Emerson", "c": "Frederick William Stevens", "d": "Edwin Lutyens"}, "ans": "a", "exp": "Henry Irwin . Mysore Palace (also known as Amba Villas) is a historical palace at Mysore in Karnataka. It was the official residence of the Wadiyar dynasty. Mysore Palace was constructed in Indo-Saracenic style architecture.", "t": 1, "s": 18}, {"n": 524, "tag": null, "stem": "The Vimana in the Dravidian style of temple architecture is usually in which shape ?", "opts": {"a": "Semi-Circular", "b": "Cylindrical", "c": "Pyramidal", "d": "Rectangular"}, "ans": "c", "exp": "Pyramidal. Gopuram (entrance gateway in the center of the front wall). Antarala (vestibular tunnel), garbhagriha (the innermost sanctuary of a Hindu and Jain temple). Famous Dravidian Temples - Rajarajeswara or Brihadeshwara temple (Rajaraja Chola at Thanjavur), Gangaikondacholapuram temple (Rajendra I), Annamalaiyar Temple (Tiruvannamalai, Tamil Nadu), Meenakshi Temple (Tamil Nadu), Airavatesvara Temple (Tamil Nadu) etc.", "t": 1, "s": 18}, {"n": 525, "tag": null, "stem": "Consider the following statements about a fort:<br>1. It was originally known as Mankal.<br>2. It was built on a hilltop in 1143. In the above mentioned sentences, forts is being talked about ?", "opts": {"a": "Chitradurg Fort", "b": "Daulatabad Fort", "c": "Fort Aguada", "d": "Golconda Fort"}, "ans": "d", "exp": "Golconda fort (Hyderabad; Built by the Qutb shahi dynasty). Chitradurga fort (Karnataka; built by the Chalukyas and Hoysalas, later the Nayakas of Chitradurga of the Vijayanagar Empire. Daulatabad fort (Maharashtra; built by Yadava dynasty), and Aguada Fort (Goa; built by Portuguese).", "t": 1, "s": 18}, {"n": 526, "tag": null, "stem": "The ancient Neemrana Baori is located in which of the following districts of Rajasthan ?", "opts": {"a": "Ajmer", "b": "Alwar", "c": "Bikaner", "d": "Jaipur"}, "ans": "b", "exp": "Alwar . Famous <mark>Baori <\/mark>in India <mark>- <\/mark>Chand Baori (Rajasthan), Agrasen Ki Baoli (New Delhi), Rani ki Vav (Gujarat), Pushkarani (Karnataka), Baoli Ghaus Ali Shah (Haryana), Mata Bhavani ni Vav (Gujarat), Rajon ki Baoli (New Delhi), Surya Kund (Gujarat).", "t": 1, "s": 18}, {"n": 527, "tag": null, "stem": "Who among the following was given the title of ‘Uttarapatha Swamin’ ?", "opts": {"a": "Mahipala", "b": "Devapala", "c": "Dharmapala", "d": "Gopala"}, "ans": "c", "exp": "Dharmapala assumed the title of <mark>Uttarapatha Swamin <\/mark>, Parama Bhattaraka, Paramesvara, and Maharajadhiraja. He was the successor of Gopala (founder of the Pala empire). He was a pious Buddhist. He founded Vikramshila University in Bhagalpur, Bihar.", "t": 1, "s": 18}, {"n": 528, "tag": null, "stem": "Who was the ruler of Mysore in 1761 ?", "opts": {"a": "Baji Rao", "b": "Murshid Quli Jafar Khan", "c": "Hyder Ali", "d": "Nizam-ul-Mulk"}, "ans": "c", "exp": "Hyder Ali . In 1769, he defeated the British forces several times and reached the Madras walls. In the second Anglo-Mysore War, he died in 1782 and was succeeded by his son Tipu.", "t": 1, "s": 18}, {"n": 529, "tag": null, "stem": "Consider the following statements regarding the book ‘Man Kautuhal’:<br>1. The book ‘Man Kautuhal’ was compiled by Raja Mansingh Tomar.<br>2. Raja Mansingh Tomar was the ruler of Gwalior. Which of the statements given above is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Raja Mansingh Tomar, ruler of Gwalior, compiled the book ‘Man Kautuhal’.", "t": 1, "s": 18}, {"n": 530, "tag": null, "stem": "King Lalitaditya Muktapida ruled over ______.", "opts": {"a": "Gujarat", "b": "Sikkim", "c": "Kerala", "d": "Kashmir"}, "ans": "d", "exp": "Kashmir . Aḥmad Shah I was the first independent sultan of <mark>Gujarat <\/mark>, who founded Ahmedabad (1411).The Chogyal (king who governs with righteousness) Palden Namgyal Thodup was crushed in 1975 and <mark>Sikkim <\/mark>merged with India as its 22nd state. King Mahabali ruled over <mark>Kerala. <\/mark>", "t": 1, "s": 18}, {"n": 531, "tag": null, "stem": "Chandannagar was established as a French colony in 1673, obtaining permission from_____the then Nawab of Bengal, to establish a trading post on the right bank of the river Hooghly.", "opts": {"a": "Mansur Ali Khan", "b": "Murshid Quli Khan", "c": "Ibrahim Khan", "d": "Mir Zafar"}, "ans": "c", "exp": "Ibrahim Khan . <mark>French <\/mark> <mark>Colonies <\/mark>In India- Pondicherry, Karaikal, Yanam (Andhra Pradesh) on the Coromandel Coast, Mahe on the Malabar Coast and Chandernagor in Bengal.", "t": 1, "s": 18}, {"n": 532, "tag": null, "stem": "Consider the following statements regarding Hafiz (Hafez):<br>1. Hafiz was a 15th-century poet.<br>2. He was an I
