 "Jawaharlal Nehru . The aim of this committee was to make a plan which could balance private and public partnership and urban and rural economies.", "t": 2, "s": 11}, {"n": 925, "tag": null, "stem": "In which of the following cities is the tomb of Rani of Jhansi situated?", "opts": {"a": "Jabalpur", "b": "Gwalior", "c": "Indore", "d": "Ujjain"}, "ans": "b", "exp": "Gwalior. The Samadhi of Rani Lakshmi Bai is situated at Phool Bagh. It is to commemorate the great warrior of Jhansi.", "t": 2, "s": 11}, {"n": 926, "tag": null, "stem": "The princely state of Hyderabad was brought under the Indian Union in the year ______.", "opts": {"a": "1950", "b": "1952", "c": "1948", "d": "1963"}, "ans": "c", "exp": "1948 . After the State Reorganisation Act 1956 Hyderabad was merged with Andhra state and later renamed as Andhra Pradesh.", "t": 2, "s": 11}, {"n": 927, "tag": null, "stem": "Consider the following statements regarding the C-R Formula:<br>1. The C-R Formula, also known as the Rajaji Formula, was proposed by C. Rajagopalachari.<br>2. The formula aimed to resolve the political deadlock between the Indian National Congress and the All India Muslim League regarding India’s independence. Which of the statements given above is/are correct?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Rajagopalachari&#x27;s formula (or C. R. formula or Rajaji formula) was a proposal formulated by Chakravarti Rajagopalachari to solve the political deadlock between the All India Muslim League and the Indian National Congress on the independence of British India.", "t": 2, "s": 11}, {"n": 928, "tag": null, "stem": "______ was awarded the Nobel Prize in 1913 and a knighthood in 1915.", "opts": {"a": "Sarojini Naidu", "b": "Mahatma Gandhi", "c": "Rabindranath Tagore", "d": "Mother Teresa"}, "ans": "c", "exp": "Rabindranath Tagore  became the first non-European to receive the Nobel Prize for his literary work. He was awarded knighthood in 1915 by King George V.", "t": 2, "s": 11}, {"n": 929, "tag": null, "stem": "Veteran freedom fighter, social reformer and feminist Savithribai Phule hailed from which of the following states of India?", "opts": {"a": "Maharashtra", "b": "Odisha", "c": "Rajasthan", "d": "Gujarat"}, "ans": "a", "exp": "Maharashtra . Savithribai Phule - She was the first female teacher of India and opened a school for women in 1848, Married to Jyotirao Phule (Founded Satya Shodhak Samaj in 1873 in Pune).", "t": 2, "s": 11}, {"n": 930, "tag": null, "stem": "Who among the following was NOT a minister of Cabinet Mission Plan, 1946 ?", "opts": {"a": "Sir Stafford Cripps", "b": "Lord Wavell", "c": "Sir Pethick Lawrence", "d": "Alexander"}, "ans": "b", "exp": "Lord Wavell . The members of the Cabinet Mission were Lord Penthick Lawrence, Secretary of State for India, Sir Stafford Cripps, President of the Board of Trade, and A.V Alexander, First Lord of Admiralty.", "t": 2, "s": 11}], "topics": [{"label": "Ancient History", "subs": [{"label": "Prehistoric And Indus Valley", "count": 25}, {"label": "Vedic Age", "count": 19}, {"label": "Jainism", "count": 2}, {"label": "Buddhism", "count": 22}, {"label": "Mahajanapadas", "count": 6}, {"label": "Mauryan Dynasty", "count": 42}, {"label": "Gupta Dynasty", "count": 21}, {"label": "Vardhana Dynasty", "count": 8}, {"label": "Chola Dynasty", "count": 21}, {"label": "Miscellaneous", "count": 103}], "count": 269}, {"label": "Medieval History", "subs": [{"label": "Foreign Invasions", "count": 8}, {"label": "Delhi Sultanate", "count": 14}, {"label": "Slave Dynasty", "count": 19}, {"label": "Khilji Dynasty", "count": 13}, {"label": "Tughlaq Dynasty", "count": 8}, {"label": "Sayyid Dynasty", "count": 2}, {"label": "Lodi Dynasty", "count": 6}, {"label": "Mughal Period", "count": 14}, {"label": "Babur", "count": 11}, {"label": "Humayun and Sher Shah Suri", "count": 11}, {"label": "Akbar", "count": 24}, {"label": "Jahangir", "count": 6}, {"label": "Sh function card(o){

  h+=`<div class="stem">${o.stem}</div>`;
  if(keys.length){
    h+='<div class="opts">'+keys.map(k=>{
      let c='';
      if(done){ if(k===o.ans)c=' ok'; else if(k===ans[o.n])c=' bad'; }
      return `<button class="opt${c}" data-k="${k}"><span class="k">${k.toUpperCase()}</span><span>${o.opts[k]}</span></button>`}).join('')+'</div>';
  } else {
    h+='<div class="sub">Options were not included in the source PDF for this question.</div><button class="btn reveal" data-k="__show">Show answer</button>';
  }
  const ok=ans[o.n]===o.ans;
  const right=keys.length?`(${o.ans.toUpperCase()}) ${o.opts[o.ans]||''}`:`(${o.ans.toUpperCase()})`;
  h+=`<div class="exp"><div class="verdict ${done&&ans[o.n]!=='__show'&&!ok?'bad':'ok'}">${done&&ans[o.n]!=='__show'?(ok?'✓ Correct':'✗ Incorrect'):'Answer'} — ${right}</div><div class="body">${yr(o.exp)}</div></div></article>`;
  return h;
}
function more(){

}

  const it=items(); let a=0,c=0;
  it.forEach(o=>{const v=ans[o.n]; if(v!==undefined){a++; if(v===o.ans)c++}});
  $('stat').innerHTML=`Answered <b>${a}</b>/${it.length} · Correct <b>${c}</b>`+(a?` · <b>${Math.round(c/a*100)}%</b>`:'');
  $('pbar').style.width=(it.length?a/it.length*100:0)+'%';
}
$('list').addEventListener('click',e=>{
  if(e.target.closest('#moreBtn')){more();return}
  const b=e.target.closest('.opt,.reveal'); if(!b) return;
  const cd=b.closest('.card'); if(cd.classList.contains('done')) return;
  const n=+cd.dataset.n, o=Q.find(x=>x.n===n);
  ans[n]=b.dataset.k==='__show'?'__show':b.dataset.k; save();
  cd.outerHTML=card(o); stats();
});
$('reset').addEventListener('click',()=>{
  if(!confirm('Clear your answers for this topic?'))return;
  items().forEach(o=>delete ans[o.n]); save(); select(cur,curS);
});
const tb=$('top');
window.addEventListener('scroll',()=>tb.classList.toggle('show',window.scrollY>500),{passive:true});
tb.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
buildTabs(); select(0,-1);
</script>
</body>
</html>
