h India ?", "opts": {"a": "Nedunjeliyan II", "b": "Karikala", "c": "Ashoka", "d": "Nizam Shah"}, "ans": "a", "exp": "Nedunjeliyan II. He was made ‘Pandya supreme in the south’. He defeated a confederacy of the Cholas and Cheras at Talaiyalanganam near Tiruvarur. His deeds have been described in the Maduraikkanci. Pandya Empire - Established by King Kadungon in the 6th century AD. Capital - Korkai, Madurai.", "t": 0, "s": 9}, {"n": 252, "tag": null, "stem": "Consider the following statements about the Sangam period:<br>1. The Tamil word Muvendar in Sangam poems refers to the three ruling chiefs – the Cholas, the Cheras, and the Pandyas.<br>2. The term Muvendar was used for the three great ports of ancient Tamilakam. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Muvendar literally means “three chiefs,” referring to Cholas, Cheras, and Pandyas.", "t": 0, "s": 9}, {"n": 253, "tag": null, "stem": "The term &#x27;Kammakaras&#x27; in ancient times is related to ______.", "opts": {"a": "Landless agricultural labourers", "b": "Craftsmen", "c": "Tax collecting officer", "d": "Goldsmith"}, "ans": "a", "exp": "Landless agricultural  <mark>labourers <\/mark>. Terminologies related in ancient times - Shrenis: In ancient times, crafts persons and merchants formed associations. Samaharta and Sanidata - Tax collecting officers in ancient times. Sonalika is a Sanskrit word that refers to a goldsmith. Grihapatis- independent farmers. An agrahara was land granted to a Brahmana.", "t": 0, "s": 9}, {"n": 254, "tag": null, "stem": "Who among the following gave up his traditional professions and took to arms, successfully established a kingdom in Karnataka ?", "opts": {"a": "Vasudeva Kanva", "b": "Gurjara-Pratihara Harichandra", "c": "Pushyamitra Shunga", "d": "Kadamba Mayurasharman"}, "ans": "d", "exp": "Kadamba Mayurasharman  was a Brahmana. The Kadamba Mayurasharman (345–365 C.E.) was the founder of the Kadamba Kingdom of Banavasi (Karnataka). Kadimi Chettu (story of Mayur Sharma) was written by Visawanatha Satyanarayana {Padma Bhushan (1970), Jnanpith Award (1971)}.", "t": 0, "s": 9}, {"n": 255, "tag": null, "stem": "Consider the following statements about Ravikirti:<br><b>Statement 1: <\/b>Ravikirti, a Jain poet, was the court poet of Pulakeshin II of the Chalukya dynasty of Vatapi.<br><b>Statement 2: <\/b>Ravikirti’s famous inscription in honour of his patron king is found at the Meguti Jain Temple in Aihole, Karnataka.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "a", "exp": "Both statements are true.  The Jain poet Ravikirti was the court poet of &#x27;Pulakeshin II&#x27; (610 to 642 CE), the first sovereign ruler of the Chalukya dynasty of Vatapi (modern Badami). Ravikirti&#x27;s Aihole inscription (a nineteen-line Sanskrit inscription), in honour of his patron king, is found in the Meguti Jain temple at Aihole, Karnataka. Chalukya dynasty (between 6th and 12th centuries). Pallava dynasty (275 CE to 897 CE). Chera dynasty (in the Sangam period and before). Chola dynasty (300 BCE to 1279 CE).", "t": 0, "s": 9}, {"n": 256, "tag": null, "stem": "Who among the following was the founder of the Kanva dynasty ?", "opts": {"a": "Narayana", "b": "Susharman", "c": "Vasudeva", "d": "Devabhuti"}, "ans": "c", "exp": "Vasudeva Kanva (73-63 BCE) founded the Kanva dynasty (72–28 BCE, Kanvayanas). Rulers of the Kanva dynasty - Bhumimitra (64-50 BCE), Narayana (50-38 BCE), Susarman (38-28 BCE). Capital: Patliputra . Devabhuti - the last ruler of the Sunga Dynasty.", "t": 0, "s": 9}, {"n": 257, "tag": null, "stem": "The rulers of which of the following dynasties built the Khajuraho temples between 950 to 1050 A.D in central India ?", "opts": {"a": "Gurjara-Pratihara Dynasty", "b": "Rashtrakuta Dynasty", "c": "Pala Dynasty", "d": "Chandela Dynasty"}, "ans": "d", "exp": "Chandela Dynasty. The Khajuraho Group of Monuments are a group of Hindu and Jain temples in Chhatarpur district, Madhya Pradesh, Known for its Erotic Sculpture. The Pratiharas, also known as the Gurjara -Pratiharag (Founder - Harichandra). The most well-known king of this dynasty was Bhoja or Mihira Bhoja.", "t": 0, "s": 9}, {"n": 258, "tag": null, "stem": "In which of the following languages did Amoghavarsha write Kavirajamarga ?", "opts": {"a": "Tamil", "b": "Sanskrit", "c": "Kannada", "d": "Telugu"}, "ans": "c", "exp": "Kannada. Amoghavarsha (Rashtrakuta ruler) also wrote ‘Prasnottara Ratna Malika’ (Sanskrit). He patronized many Indian scholars including mathematician Mahaviracharya , who wrote Ganita -sara- samgraha, Jinasena, Virasena, Shakatayan, and Sri Vijaya (a Kannada language theorist). He held titles such as Nrupathunga, Atishadhavala, Veeranarayana, Rattamarthanda , and Srivallabha during his reign. Historian Panchamukhi called him the ‘Ashoka of South’.", "t": 0, "s": 9}, {"n": 259, "tag": null, "stem": "Which king of the Pala dynasty defeated Indrayudh and made Chakrayudha as the ruler of Kannauj ?", "opts": {"a": "Dharmapala", "b": "Mahendrapala", "c": "Devapala", "d": "Gopala"}, "ans": "a", "exp": "Dharampala (770-810) founded the Vikramshila University (Bhagalpur, Bihar) and built Somapuri monastery, Bihar. In 750 AD, Gopala founded the Pala dynasty. Capital: Muddagiri/ Munger (Bihar).", "t": 0, "s": 9}, {"n": 260, "tag": null, "stem": "Consider the following statements:<br>1. The Mukteshwara Temple, a 10th-century temple dedicated to Lord Shiva.<br>2. The Sun Temple of Konark was built by Narasimhadeva I. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. The Mukteshwara Temple is a 10th-century Shiva temple in Bhubaneswar, Odisha, known as the “Gem of Odisha architecture.” The Sun Temple at Konark was built in the 13th century by Narasimhadeva I of the Eastern Ganga dynasty.", "t": 0, "s": 9}, {"n": 261, "tag": null, "stem": "Queen Rudramadevi belonged to which dynasty of India ?", "opts": {"a": "Chola", "b": "Kakatiya", "c": "Chalukya", "d": "Chera"}, "ans": "b", "exp": "Kakatiya . Marco Polo mentioned her in his writings. Rudradeva I was the first independent ruler of this kingdom of Warangal. Their capital was Orugallu, now known as Warangal. In 1323 Prince Jaunakhan (Muhammad bin Tughlaq) defeated Prataparudra Deva (the last ruler of this kingdom) and annexed their kingdom", "t": 0, "s": 9}, {"n": 262, "tag": null, "stem": "Which place had a water harvesting system channeling the flood water of the Ganga river in the first century B.C ?", "opts": {"a": "Kanpur", "b": "Gorakhpur", "c": "Mirzapur", "d": "Sringaverapura"}, "ans": "d", "exp": "Sringaverapura (near Allahabad in Uttar Pradesh). Water harvesting in India - Dholavira in Harappan civilization, Bhopal Lake (built by the Paramara Raja Bhoj in 11th century), Iltutmish constructed a tank in Hauz Khas for supplying water to the Siri Fort (14th century).", "t": 0, "s": 9}, {"n": 263, "tag": null, "stem": "Which state of India was ruled by the Ningthouja dynasty ?", "opts": {"a": "Manipur", "b": "Haryana", "c": "Gujarat", "d": "Assam"}, "ans": "a", "exp": "Manipur . It has 125 extended families. It was apparently founded by King Nongda Lairen Pakhangba in 33 CE.", "t": 0, "s": 9}, {"n": 264, "tag": null, "stem": "Consider the following statements about the Elephanta Caves:<br>1. The Elephanta Caves, located on Elephanta Island (Gharapuri) in Mumbai Harbour, were declared a UNESCO World Heritage Site in 1987.<br>2. These caves, predominantly dedicated to Lord Vishnu, were built by the Rashtrakuta rulers.<br>3. The total number of caves at Elephanta is around 34. Which of the above statements is/are correct ?", "opts": {"a": "1 and 2 only1", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "b", "exp": "1 and 3 only. The Elephanta Caves are dedicated mainly to Lord Shiva, not Lord Vishnu. They are on Elephanta Island near Mumbai, declared UNESCO World Heritage Site in 1987, with about 34 caves.", "t": 0, "s": 9}, {"n": 265, "tag": null, "stem": "In which of the following temples will you find Gopurams ?", "opts": {"a": "Shiva Temple, Chidambaram", "b": "Bhabatarini Temple, Dakshineswar", "c": "Golden Temple, Amritsar", "d": "Dilwara Temple, Mount Abu"}, "ans": "a", "exp": "Shiva Temple,  <mark>Chidambaram. <\/mark>A gopuram or gopura is a monumental tower, usually ornate, at the entrance of any temple, especially in Southern India. They are a prominent feature of koils, Hindu temples built in the Dravidian style. They are topped by the kalasam, a bulbous stone finial. Nataraja temple in Chidambaram, Tamil Nadu is one of the famous examples of Gopuram.", "t": 0, "s": 9}, {"n": 266, "tag": null, "stem": "Who among the following wrote the basic text of Vaisheshika philosophy?", "opts": {"a": "Kanada", "b": "Shankaracharya", "c": "Patanjali", "d": "Jaimini"}, "ans": "a", "exp": "Kanada . It is an ancient Sanskrit text at the foundation of the Vaisheshika school of Hindu philosophy. Vaisheshika is one of the six classical schools of Indian philosophy, often referred to as &quot;Darshanas.&quot;", "t": 0, "s": 9}, {"n": 267, "tag": null, "stem": "Yashovigraha, Mahichandra and Chandradeva were the first three rulers of ______dynasty.", "opts": {"a": "Maratha", "b": "Chauhans", "c": "Gahadavala", "d": "Wadiyar"}, "ans": "c", "exp": "Gahadavala . Yashovigraha was the founder of the Gahadavala dynasty. The majority of the Gahadavala epigraphic records were discovered in Uttar Pradesh.", "t": 0, "s": 9}, {"n": 268, "tag": null, "stem": "In which of the following caves is the painting named ‘Padmapani Bodhisattva’ found ?", "opts": {"a": "Ajanta Cave No. 4", "b": "Ajanta Cave No. 2", "c": "Ajanta Cave No. 3", "d": "Ajanta Cave No. 1"}, "ans": "d", "exp": "Ajanta Cave No. 1. The iconic Ajanta paintings Padmapani and Vajrapani glorify the walls of the Cave 1 of Ajanta. Cave 1 of Ajanta was built in the second phase of excavation under the patronage of King Harisena of the Vakataka dynasty.", "t": 0, "s": 9}, {"n": 269, "tag": null, "stem": "Kolathunadu, Valluvanad and Thekkumkoor were ancient small-time kingdoms in which state of India ?", "opts": {"a": "Gujarat", "b": "Karnataka", "c": "Kerala", "d": "Bihar"}, "ans": "c", "exp": "Kerala. Kolathunadu - land lying between Perumba river in the north and Putupattanam river in the south. Valluvanad (Founder - Ilayi Raja) - Region between Meenachil and Pamban rivers. Thekkumkoor - The region between the Nila river and Panthaloor Hills.", "t": 0, "s": 9}, {"n": 270, "tag": "SSC Stenographer 6/08/2025 (Shift 1)", "stem": "Which Rajput ruler defeated Muhammad Ghori in the First Battle of Tarain ?", "opts": {"a": "Hem Chandra Vikramaditya", "b": "Rana Sanga", "c": "Bappa Rawal", "d": "Prithviraj Chauhan"}, "ans": "d", "exp": "Prithviraj Chauhan. The First Battle of Tarain (1191 CE) was fought between Prithviraj Chauhan (Chahamana dynasty) and Muhammad Ghori (Ghurid dynasty). In this battle, Prithviraj Chauhan defeated Muhammad Ghori and forced him to retreat. However, in the Second Battle of Tarain (1192 CE), Ghori returned with a stronger army and defeated Prithviraj Chauhan, marking the beginning of Muslim rule in North India.", "t": 1, "s": 0}, {"n": 271, "tag": "SSC Stenographer 6/08/2025 (Shift 2)", "stem": "Which Pratihara ruler successfully repelled Arab invasions in North-Western India ?", "opts": {"a": "Mihira Bhoja", "b": "Nagabhata I", "c": "Rajyapala", "d": "Vatsaraja"}, "ans": "b", "exp": "Nagabhata I. He was the founder of the Gurjara-Pratihara dynasty who successfully defeated the Arab invaders (the Umayyads under Junaid) in the Battle of Rajasthan around 738 CE, thereby protecting north-western India from Arab expansion. Nagabhata I was succeeded by his brother&#x27;s sons, Kakkuka and Devaraja.", "t": 1, "s": 0}, {"n": 272, "tag": null, "stem": "Consider the following statements regarding Muhammad of Ghor’s battles in India:<br>1. Muhammad of Ghor defeated Prithviraj Chauhan at the Battle of Chandawar in 1194 AD.<br>2. In the First Battle of Tarain (1191), Prithviraj Chauhan defeated Muhammad Ghori.<br>3. In the Second Battle of Tarain (1192), Muhammad Ghori defeated Prithviraj Chauhan. Which of the statements given above is/are correct ?", "opts": {"a": "1 and 2 only", "b": "1 and 3 only", "c": "2 and 3 only", "d": "1, 2 and 3"}, "ans": "c", "exp": "2 and 3 only. Statement 1 is incorrect because Muhammad of Ghor defeated Jayachandra of Gahadavala dynasty at the Battle of Chandawar, not Prithviraj Chauhan. Statements 2 and 3 are historically correct.", "t": 1, "s": 0}, {"n": 273, "tag": null, "stem": "In the 11th century, under Maḥmud of Ghazni, Ghazni, a small town in _____, became the capital of the vast empire of the Ghaznavids.", "opts": {"a": "Egypt", "b": "Persia", "c": "Afghanistan", "d": "Turkey"}, "ans": "c", "exp": "Afghanistan. Mahmud of Ghazni was a Turkish conqueror who attacked India 17 times between 1000 to 1027 AD. In 1018 he plundered the holy city of Mathura and also attacked Kannauj. In 1019 and 1029 he undertook two raids on Gangetic valley. In 1025 he attacked Somnath (a town on the coast of Kathiawar).", "t": 1, "s": 0}, {"n": 274, "tag": null, "stem": "In which year Timur&#x27;s invasion of Delhi took place ?", "opts": {"a": "1398", "b": "1221", "c": "1492", "d": "1526"}, "ans": "a", "exp": "1398. Timur invaded India in 1398 during the reign of Nasir-ud-Din Mahmud Shah Tughluq of the Tughlaq Dynasty. After the invasion, Timur appointed Khizr Khan as the ruler of Punjab. Khizr Khan later founded the Sayyid Dynasty (1414–1451).", "t": 1, "s": 0}, {"n": 275, "tag": null, "stem": "Assertion (A): Al-Biruni came into contact with India through Mahmud Ghaznavi in the eleventh century A.D.<br><b>Reason (R): <\/b>Mahmud Ghaznavi invaded India multiple times between 1000 and 1027 AD, during which Al-Biruni accompanied him and studied Indian culture, science, and society.", "opts": {"a": "Both A and R are correct, and R is the correct explanation of A", "b": "Both A and R are correct, but R is not the correct explanation of A", "c": "A is correct, but R is incorrect", "d": "A is incorrect, but R is correct"}, "ans": "a", "exp": "Both A and R are correct,  <mark>and R is the correct explanation of A. <\/mark> Al-Biruni’s works like Kitab-ul-Hind and Tahqiq-e-Hind were the outcome of his studies during Mahmud Ghaznavi’s campaigns in India.", "t": 1, "s": 0}, {"n": 276, "tag": null, "stem": "When did the Mongol ruler Genghis Khan die ?", "opts": {"a": "1219", "b": "1210", "c": "1235", "d": "1227"}, "ans": "d", "exp": "1227. Genghis Khan (original name Temujin) was a Mongolian warrior-ruler, one of the most famous conquerors of history, who consolidated tribes into a unified Mongolia and then extended his empire across Asia to the Adriatic Sea. His last campaign against the Western Xia.", "t": 1, "s": 0}, {"n": 277, "tag": null, "stem": "Who among the following was the best-known Chahamana ruler ?", "opts": {"a": "Prithviraja III", "b": "Vigraharaja II", "c": "Prithviraja l", "d": "Vasudeva"}, "ans": "a", "exp": "Prithviraj III (1168-1192). He defeated Sultan Muhammad Ghori in 1191 (first Battle of Tarain), but he was defeated by Ghori in 1192 (second Battle of Tarain). Vigraharaja II {(971-998), Chahamana dynasty}. Prithviraj I {(1090 -1110), Chahamana dynasty}. Vasudeva {(73 BCE to 28 BCE), founder of Kanvas Dynasty}.", "t": 1, "s": 0}, {"n": 278, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Consider the following statements regarding provincial architecture in medieval India and choose the correct option:<br>1. Bengal and Jaunpur developed distinct architectural styles separate from the Delhi Sultanate.<br>2. Regional styles often blended Islamic structures with local artistic traditions.<br>3. Provincial styles remained completely uniform across all regions of India.", "opts": {"a": "Only 1", "b": "1 and 2 Only", "c": "2 and 3 Only", "d": "All 1, 2, and 3 are correct"}, "ans": "b", "exp": "1 and 2 Only. Statement 1 - Correct. Bengal, Jaunpur, Gujarat, Malwa, and the Deccan developed distinct provincial architectural styles under regional sultanates. Example: Bengal → brick and terracotta, curved roofs; → Jaunpur massive arches, austere ornamentation. Statement 2 - Correct. Regional sultanates fused Islamic architectural features (arches, domes, minarets) with local artistic traditions (Hindu temple motifs, lotus patterns, indigenous materials). Example: Gujarat mosques incorporated temple-style pillars and carvings. Statement 3 – Incorrect . Provincial styles were not uniform; they varied widely depending on geography, culture, and available materials.", "t": 1, "s": 1}, {"n": 279, "tag": null, "stem": "Consider the following statements regarding the dynasties of the Delhi Sultanate:<br>1. The Mamluk (Slave) dynasty was the first dynasty of the Delhi Sultanate, founded by Qutb-ud-din Aibak in 1206.<br>2. The Khilji dynasty ruled from 1320 to 1414.<br>3. The Lodi dynasty was the last dynasty of the Delhi Sultanate, ruling from 1451 to 1526. Which of the statements given above is/are incorrect ?", "opts": {"a": "1 only", "b": "2 only", "c": "3 only", "d": "1 and 2 only"}, "ans": "b", "exp": "2 only. Statement 2 is incorrect because the Khilji dynasty ruled from 1290 to 1320, not 1320 to 1414.", "t": 1, "s": 1}, {"n": 280, "tag": null, "stem": "Ibn Battuta, who visited India during Delhi Sultanate, originally belonged to which country ?", "opts": {"a": "Russia", "b": "Morocco", "c": "England", "d": "Egypt"}, "ans": "b", "exp": "Morocco. Ibn Battuta visited India in 1333 during the reign of Muhammad bin Tughlaq, who appointed him as the qazi (judge) of Delhi. Other notable foreign travelers : Hiuen Tsang (China) - Harshavardhana&#x27;s court; Al-Beruni (Persia) - Came with Mahmud of Ghazni; Francois Bernier (France) - Shahjahan and Aurangzeb&#x27;s court.", "t": 1, "s": 1}, {"n": 281, "tag": null, "stem": "In reference to the Delhi Sultanate, what was the ‘Group of Forty’?", "opts": {"a": "They were mostly powerful Turkish slaves of Iltutmish, who took power in the interregnum following Sultana Raziyya’s killing.", "b": "They were forty military archers who distinguished themselves by their bravery in the Delhi Sultanate.", "c": "They were forty banjara leaders who transferred military supplies in times of war.", "d": "They were forty Rajput nobles who planned a coup to dethrone Qutb ud Din Aibak in 1210."}, "ans": "a", "exp": "The &#x27;Group of Forty&#x27; (Chalisa) in the Delhi Sultanate was a council of powerful Turkish slaves, formed by Iltutmish to assist in governance.", "t": 1, "s": 1}, {"n": 282, "tag": null, "stem": "Consider the following statements regarding Vijayanagara Empire:<br>1. The Vijayanagara Empire was established in 1336 during the reign of Muhammad bin Tughlaq .<br>2. Its first capital was Madurai. Which of the above statements is/are correct ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "Only 1. Vijayanagara Empire was founded in 1336 by Harihara and Bukka during the reign of Muhammad bin Tughlaq . The capital was Hampi, not Madurai.", "t": 1, "s": 1}, {"n": 283, "tag": null, "stem": "Which of the following systems of the Delhi sultanate had a influence on the Bahmani and Vijayanagar kingdoms ?", "opts": {"a": "Walis", "b": "Chahalgani", "c": "Bitikchi", "d": "Iqtadari"}, "ans": "d", "exp": "Iqtadari System:- Introduced by Shamsuddin IIltutmish (3rd Sultan of Delhi). Provision - Under this system, the land of the empire was divided into several large and small tracts called Iqta and assigned these Iqtas to his soldiers, officers and nobles. <mark>Administrative <\/mark> <mark>Terms used in Sultanate Period <\/mark>: Dabir (Secretary), Faujdar (Commander of army), Sipahsalar (Commander), Amil (Revenue officer), Diwan (Office: the central secretariat).", "t": 1, "s": 1}, {"n": 284, "tag": null, "stem": "During the Sultanate of Delhi, the term &quot;Ulema&quot; was associated with ______.", "opts": {"a": "Learned theologians and Jurists", "b": "Commander-in-chief", "c": "Postal officer", "d": "Village Revenue officer"}, "ans": "a", "exp": "Learned theologians and  <mark>Jurists <\/mark>. Officers in Delhi Sultanate - State Level: Amil (Revenue Officer), Barid (Intelligence agents), Khwaja (Accounts Officer), Kotwal (Head of city law and order), Muhatasib (Head of municipality law and order), Muftis (Expounder of law).", "t": 1, "s": 1}, {"n": 285, "tag": null, "stem": "Who among the following was the daughter of Iltumish, a ruler of Slave Mamluk dynasty ?", "opts": {"a": "Kubra Noorzai", "b": "Harkha", "c": "Razia Sultan", "d": "Shafiqa Ziayee"}, "ans": "c", "exp": "Razia Sultan. In 1236, Razia Sultan (Mamluk dynasty), succeeded her father to the Sultanate of Delhi. She sent an expedition against Ranthambore to control the Rajputs. Mamluk dynasty (1206 to 1290) - Founded by Qutbuddin Aibak (Lakh Baksh).", "t": 1, "s": 1}, {"n": 286, "tag": null, "stem": "Under the Delhi Sultanate, a religious tax _____was imposed on the wealthy and rich Muslims in India.", "opts": {"a": "Firuz", "b": "Mamluk", "c": "Zakat", "d": "Kismat"}, "ans": "c", "exp": "Zakat. Zakat tax was abolished by Sikander lodi. Firoz Shah Tughlaq introduced four types of taxes based on the Quran. They were Kharaj (Land tax), Khams (Tax on booty captured in war), Jizya (Imposed on non muslim), and Zakat.", "t": 1, "s": 1}, {"n": 287, "tag": null, "stem": "Consider the following statements regarding writers of the Delhi Sultanate period:<br>1. Tabaqat-i-Nasiri (1260), written in Persian by Minhaj-us-Siraj.<br>2. Hasan Nizami wrote Fatwa-i-Jahandari, regarded as the first official history of the Delhi Sultanate.<br>3. Ziauddin Barani authored Taj-ul-Maasir during the reign of Iltutmish. Which of the above statements is/are correct ?", "opts": {"a": "Only 1", "b": "1 and 2 only", "c": "1 and 3 only", "d": "1, 2 and 3"}, "ans": "a", "exp": "Only 1. Fatwa-i-Jahandari was written by Ziauddin Barani, not Hasan Nizami. Taj-ul-Maasir was written by Hasan Nizami, not by Ziauddin Barani.", "t": 1, "s": 1}, {"n": 288, "tag": null, "stem": "Zafar khan was a famous General of which of the following rulers of the Delhi Sultanate ?", "opts": {"a": "Alauddin Khilji", "b": "Iltutmish", "c": "Muhammad bin Tughluq", "d": "Balban"}, "ans": "a", "exp": "Alauddin Khilji’s Generals :  Hizabruddin (Zafar Khan), Almas Beg (Ulugh Khan), Malik Kafur (Taj al-Din Izz al-Dawla), Nusrat Khan (Malik Nusrat Jalesari). Muhammad bin Tughlaq (Jauna Khan): Introduced token currency.", "t": 1, "s": 1}, {"n": 289, "tag": null, "stem": "Who among the following rulers ruled before Prithviraj Chauhan over Delhi ?", "opts": {"a": "Ghiyasuddin Balban", "b": "Ananga Pala", "c": "Jalaluddin Khalji", "d": "Qutbuddin Aibak"}, "ans": "b", "exp": "Ananga Pala Tomar - founded Delhi in 1052. An inscription of Vikram Samvat 1383 in the Delhi Museum confirms the founding of Delhi by the Tomars.", "t": 1, "s": 1}, {"n": 290, "tag": null, "stem": "Who was the author of Tarikh - i - Mubarak Shahi which is a Persian language chronicle of the Delhi Sultanate?", "opts": {"a": "Jawahar-fi-Jawahir", "b": "Khazain-ul-Futuh", "c": "Tarikh-i-Firoz Shahi", "d": "Yahya bin Ahmad Sirhindi"}, "ans": "d", "exp": "Yahya bin Ahmad Sirhindi.  Amir Khusrau (Books - ‘Tughlaq Nama’, ‘Nuh Sipihr’, ‘Khazain ul Futuh’ ).", "t": 1, "s": 1}, {"n": 291, "tag": null, "stem": "Who was the ruler of Delhi sultanate when Ibn Batuta came to India?", "opts": {"a": "Alauddin Khilji", "b": "Firuz Shah Tughlaq", "c": "Muhammad Bin Tughlaq", "d": "Ibrahim Lodi"}, "ans": "c", "exp": "Muhammad Bin Tughlaq was the ruler of the Delhi sultanate when Ibn Batuta came to India. Muhammad bin Tughluq was the Sultan of Delhi from 1324 to 1351 from the Tughlaq Dynasty.", "t": 1, "s": 1}, {"n": 292, "tag": null, "stem": "Consider the following statements regarding Balban and Bengal:<br><b>Statement 1: <\/b>After the revolt and death of Tughril Beg, Balban appointed his son Bughra Khan as the governor of Bengal.<br><b>Statement 2: <\/b>Balban introduced the practice of Jaziya tax on Hindus as part of his theory of kingship.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "After Nasir-ud-din Mahmud died in 1266, Ghiyasuddin Balban (1266-1287) ascended the throne. He was also the first muslim ruler to formulate the ‘theory of Kingship’. Balban introduced the practice of Sijda (prostration) and Paibos (kissing the feet of Monarch). Tughril Beg revolted against Balban, Sultan of Delhi, and declared himself as an independent ruler of Bengal in 1279.", "t": 1, "s": 2}, {"n": 293, "tag": null, "stem": "Which of the following departments of Delhi Sultanate was reorganized by Balban ?", "opts": {"a": "Diwan-i-Ishtiaq", "b": "Diwan-i-Arz", "c": "Diwan-i-Risalat", "d": "Diwan-i-Mustakhraj"}, "ans": "b", "exp": "Diwan-i-Arz (Department of Military). Central Departments of Delhi Sultanates: ‘Diwan-i-Risalat’ - Department of Appeals, ‘Diwan-i-Bandagan’- Department of Slaves, ‘Diwan-i-Qaza-i-Mamalik’ - Department of Justice, ‘Diwan-i-Ishtiaq’ - Department of Pensions, ‘Diwan - i - Mustakhraj’- Departments of Arrears, ‘Diwan-i-Khairat’ - Department of Charity, ‘Diwan-i-Kohi’- Department of Agriculture, ‘Diwan -i-Wizarat’ - Head Wazir, ‘Diwan -i-Waqoof’ - Department of Revenue.", "t": 1, "s": 2}, {"n": 294, "tag": null, "stem": "Consider the following statements about Sultan Balban:<br><b>Statement 1: <\/b>Balban was the ninth Sultan of the Slave dynasty who focused more on consolidation of his empire rather than territorial expansion.<br><b>Statement 2: <\/b>Balban is remembered for formulating the ‘Din-i-Ilahi’ doctrine during his reign.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "c", "exp": "Ghiyasuddin Balban (Reigned : 1266–1287) was the ninth sultan of the Slave dynasty of Delhi. He belonged to the famous group of 40 Turkic slaves of Iltutmish. He was the first Muslim ruler to formulate the &#x27;theory of kingship&#x27; similar to the &#x27;theory of the divine right of the kings&#x27;. He established the military department “Diwan-i-Arz”.", "t": 1, "s": 2}, {"n": 295, "tag": null, "stem": "Raziya Sultan was the first and only female ruler of the Sultanate, who ascended the throne in:", "opts": {"a": "1238 AD", "b": "1236 AD", "c": "1241 AD", "d": "1242 AD"}, "ans": "b", "exp": "1236 AD. Razia Sultana was the daughter of Iltutmish and served as the Sultan of Delhi from 1236 to 1240. She was married to Malik Altunia, the governor of Bathinda. She was buried in Kaithal, Haryana. She was imprisoned by Malik Ikhtiyar-ud-din Altunia in the Qila Mubarak Fort (Bathinda). The book &quot;Razia Queen of India&quot; was written by Rafiq Zakaria about her life.", "t": 1, "s": 2}, {"n": 296, "tag": null, "stem": "Which of the following Delhi sultans introduced two coins, namely silver tanka and copper jital ?", "opts": {"a": "Qutbuddin Aibak", "b": "Bahlul Lodi", "c": "Ghiyasuddin Balban", "d": "Iltutmish"}, "ans": "d", "exp": "Iltutmish (1210 - 1236). He was a slave and son-in-law of Qutubuddin Aibak, considered the real founder of Delhi Sultanate.", "t": 1, "s": 2}, {"n": 297, "tag": null, "stem": "Balban followed the tradition of ‘Sijda and Pabos’ from which of following traditions ?", "opts": {"a": "Persian", "b": "Roman", "c": "Mangol", "d": "Chinese"}, "ans": "a", "exp": "Persian. &#x27; Sijda&#x27; refers to the act of prostration or bowing down, and &#x27;Pabos&#x27; refers to the kissing of the monarch&#x27;s feet.", "t": 1, "s": 2}, {"n": 298, "tag": null, "stem": "Who among the following Delhi Sultanate rulers took the policy of ‘blood and iron’ to deal with the Mewati community ?", "opts": {"a": "Qutubuddin Aibak", "b": "Rajiya", "c": "Balban", "d": "Iltutmish"}, "ans": "c", "exp": "Balban. The policy of &#x27;blood and iron&#x27; implied being ruthless to the enemies, use of sword, harshness and strictness and shedding blood. Ghiyas ud din Balban was the ninth sultan of the Mamluk/Slave dynasty of Delhi.", "t": 1, "s": 2}, {"n": 299, "tag": null, "stem": "Mameluke style of architecture belongs to which dynasty ?", "opts": {"a": "Lodi dynasty", "b": "Slave dynasty", "c": "Khilji dynasty", "d": "Tughlaq dynasty"}, "ans": "b", "exp": "Slave dynasty (1206 - 1290) - It is also known as the Mamluk Dynasty. Established by - Qutbuddin Aibak (1206 - 1210). Capitals - Lahore . Famous buildings built by rulers of the slave dynasty: Quwwat-ul-Islam Mosque, Qutub Minar, Adhai Din ka Jhonpra, Tomb of Nasir-ud-Din Mohammed, Tomb of Shams-ud-Din Iltutmish.", "t": 1, "s": 2}, {"n": 300, "tag": null, "stem": "The Delhi sultan, who succumbed to injuries as a result of his fall from horse, was ______.", "opts": {"a": "Qutubuddin Aibak", "b": "Behram Shah", "c": "Balban", "d": "Iltutmish"}, "ans": "a", "exp": "Qutubuddin Aibak (Known as Lakh Baksh). He was the slave of Muhammad Ghori and was the first sultan of Delhi Sultanate. He established the slave dynasty (Mamluk dynasty). Famous Ruler of Slave Dynasty (1206 AD-1290 AD): Qutbuddin Aibak (1206-1210), Shamsuddin Iltutmish (1210-1236), Raziya Sultan (1236-1240), Balban (1266-1287).", "t": 1, "s": 2}, {"n": 301, "tag": null, "stem": "Consider the following statements about Iltutmish:<br><b>Statement 1: <\/b>The Tomb of Iltutmish was built in 1388 AD.<br><b>Statement 2: <\/b>Iltutmish introduced the gold coin “Mohur” as the standard currency of the Delhi Sultanate.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, but Statement 2 is false", "d": "Statement 1 is false, but Statement 2 is true"}, "ans": "b", "exp": "Statement 1 is incorrect: Iltutmish’s tomb was built in 1235 AD, not 1388 AD. Statement 2 is incorrect: He introduced Tanka and Jital, not the gold Mohur.", "t": 1, "s": 2}, {"n": 302, "tag": null, "stem": "Who started the practice of celebrating Nauroz during the Delhi Sultanate period ?", "opts": {"a": "Sikandar Sur", "b": "Shamsuddin Iltutmish", "c": "Ghiyasuddin Balban", "d": "Ghiyasuddin Tughlaq"}, "ans": "c", "exp": "Ghiyasuddin Balban. Nowruz is the Iranian New Year, also known as the Persian New Year.", "t": 1, "s": 2}, {"n": 303, "tag": null, "stem": "Statement 1: Balban served as Naib (Deputy) to Sultan Nasiruddin Mahmud.<br><b>Statement 2: <\/b>Balban served as Naib to Sultan Razia.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Balban served as Naib (Deputy) to Sultan Nasiruddin Mahmud (1246–1266 AD), the eighth ruler of the Slave dynasty. During this period, Balban gained administrative and military experience, which later helped him become Sultan in 1266 AD. On the other hand, Razia Sultan (1236–1240 AD) was the first Muslim woman ruler of the Delhi Sultanate, but Balban never served as her Naib.", "t": 1, "s": 2}, {"n": 304, "tag": null, "stem": "Who among the following revolted against Balban, Sultan of Delhi, and declared himself as an independent ruler of Bengal in 1279 ?", "opts": {"a": "Muhammad Khan", "b": "Tughril Beg", "c": "Bughra Khan", "d": "Nasir-ud-din Mahmud"}, "ans": "b", "exp": "Tughril Beg . Balban (Mamluk dynasty or Slave Dynasty) - Ghiyas-ud-Din Balban appointed his own son Bughra khan as governor of Bengal. Nasir-ud-Din Mahmud Shah Tughluq also known as Nasiruddin, was the last sultan of the Tughlaq dynasty.", "t": 1, "s": 2}, {"n": 305, "tag": null, "stem": "Who occupied Badaun (A.D. 1197-98) and appointed Iltutmish as its first Muslim Governor ?", "opts": {"a": "Prithviraj Chauhan", "b": "Maharana Pratap", "c": "Muhammad Ghori", "d": "Qutbuddin Aibak"}, "ans": "d", "exp": "Qutbuddin Aibak {1206- 1210 <mark>( <\/mark>First ruler of Slave Dynasty /Mamluk Dynasty <mark>)}: <\/mark>He established the first Muslim dynasty and was also known as <mark>Lakh Baksh <\/mark>. He died in Lahore, Pakistan after falling from a horse ride.", "t": 1, "s": 2}, {"n": 306, "tag": null, "stem": "Qutub Minar is an example of ______ architecture.", "opts": {"a": "Indo-Islamic", "b": "Dravidian", "c": "Sufi", "d": "Mauryan"}, "ans": "a", "exp": "Indo - Islamic. Indo-Islamic architecture is the architecture of the Indian subcontinent produced for Islamic patrons and purposes. Famous Examples - City of Mandu (Madhya Pradesh), Taj Mahal (Agra), Gol Gumbaz (Karnataka), Jama Masjid (Delhi) etc.", "t": 1, "s": 2}, {"n": 307, "tag": null, "stem": "What is the approximate height (in metres) of the Qutub Minar situated in Delhi ?", "opts": {"a": "75", "b": "77", "c": "73", "d": "71"}, "ans": "c", "exp": "73 (239.5 ft. approx). Qutub Minar has five storeys. It was started in 1199 by Qutb ud-Din Aibak, completed in 1220 by his son-in-law Iltutmish. UNESCO (1993). Other Important Minars - Charminar, Hyderabad (1591) by Muhammad Quli Qutb Shah, height is 48.7 m (160 ft).", "t": 1, "s": 2}, {"n": 308, "tag": null, "stem": "Statement 1: Nizam ul-Mulk Junaidi was the Wazir of Sultan Iltutmish.<br><b>Statement 2: <\/b>Nusrat Khan was appointed as the Wazir of Iltutmish.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Sultan Iltutmish, who ruled from 1210 to 1236 AD, appointed Nizam ul-Mulk Junaidi as his Wazir. He played an important role in administration and strengthening the Delhi Sultanate. On the other hand, Nusrat Khan was not associated with Iltutmish as Wazir.", "t": 1, "s": 2}, {"n": 309, "tag": null, "stem": "Ghiyasuddin Balban, ruler of the Slave dynasty, took up the title of _____.", "opts": {"a": "Nur-al-Din (light of the faith)", "b": "NurMahal (light of the palace)", "c": "Zil-i-Ilahi (shadow of God)", "d": "JahanPanah (protector of the world)"}, "ans": "c", "exp": "Zil-i-Ilahi (shadow of God).  <mark>Ghiyas ud din Balban <\/mark>- Abolished Chahalghani (Council of 40 nobles), introduced Persian customs as sizdah (prostration), paibos (kissing feet of sultan), established Diwan-i-Ariz (defence department).", "t": 1, "s": 2}, {"n": 310, "tag": null, "stem": "In which of the following forts was Razia Sultan imprisoned by Malik Ikhtiyar-ud-din Altunia ?", "opts": {"a": "Qila Mubarak in Bathinda", "b": "Jaigarh fort in Jaipur", "c": "Golconda fort in Golconda", "d": "Mehrangarh fort in Jodhpur"}, "ans": "a", "exp": "Qila Mubarak in Bathinda,  <mark>built by <\/mark>Raja Dab. Jaigarh fort in Jaipur was built in 1726 AD by Jai Singh II. Golconda fort in Golconda was built by Qutb Shahi dynasty. Mehrangarh fort in Jodhpur was built by Rao Jodha.", "t": 1, "s": 2}, {"n": 311, "tag": null, "stem": "Consider the following statements about the market reforms of Delhi Sultans:<br>1. Alauddin Khalji set up three separate markets in Delhi for grain, cloth, and horses/slaves/cattle.<br>2. The market superintendent appointed by Alauddin Khalji was called Diwan-i-Arz. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Alauddin Khalji introduced strict market control to prevent price rise. He established three separate markets in Delhi for grain, cloth, and horses/slaves/cattle. To enforce the system, he appointed a market superintendent called Shahna-i-Mandi, not Diwan-i-Arz (which was the military department created by Balban).", "t": 1, "s": 3}, {"n": 312, "tag": null, "stem": "The first southern campaign of Alauddin Khilji in 1307-08 AD was led to which of the following regions ?", "opts": {"a": "Devagiri", "b": "Warangal", "c": "Dwar Samudra", "d": "Madura"}, "ans": "a", "exp": "Devagiri (modern-day Daulatabad, Maharashtra). This campaign marked the beginning of the Delhi Sultanate&#x27;s expansion into southern India. Alauddin Khilji (1296 -1316) was the second sultan of the Khilji dynasty. Campaigns of Alauddin Khilji: Gujarat (1299), Ranthambore (1301), Chittor (1303), Malwa (1305), Madurai (1311), Dwarasamudra (1310-1311).", "t": 1, "s": 3}, {"n": 313, "tag": null, "stem": "Who amongst the following Delhi Sultanate rulers sent his army under Malik Kafur’s command to conquer South India ?", "opts": {"a": "Iltutmish", "b": "Ghiyas-ud-din Balban", "c": "Alauddin Khilji", "d": "Qutub-al-din Aibak"}, "ans": "c", "exp": "Alauddin Khilji. Malik Kafur - also known as &#x27;Hazar Dinari’ was a slave of Ala-ud-din Khilji who led his army in the battle against Ramachandra of Devagiri. Administrative Reforms - implemented the system of &quot;dagh Pratha ,&quot; branding horses, and &quot;Huliya Pratha (a system of ranks)&quot; keeping records of soldiers.", "t": 1, "s": 3}, {"n": 314, "tag": null, "stem": "Which of the following Sultans of Delhi set up the officers like Barid (intelligence officer) and Munhiyans (secret spies) to control the market?", "opts": {"a": "Ghiyasuddin Balban", "b": "Alauddin Khalji", "c": "Muhammad Bin Tughlaq", "d": "Shamsuddin Iltutmish"}, "ans": "b", "exp": "Alauddin Khalji , ruler of the Delhi Sultanate, is known for implementing significant market reforms and establishing strict price controls and market regulations.", "t": 1, "s": 3}, {"n": 315, "tag": null, "stem": "Who among the following Sultans framed a series of regulations to weaken the power of nobles ?", "opts": {"a": "Muhammad bin Tughluq", "b": "Balban", "c": "Alauddin Khilji", "d": "Iltutmish"}, "ans": "c", "exp": "Alauddin Khilji (Khilji Dynasty 1290-1320): He made nobles pay land tax for their holdings. This curbed the excess of wealth owned by nobles. The nobles were also ordered not to have social gatherings or intermarriages without his permission. The group of nobles, called &quot;The Forty&quot;.", "t": 1, "s": 3}, {"n": 316, "tag": null, "stem": "Consider the following statements about Amir Khusrau:<br>1. He was known as Tuti-e-Hind and was a disciple of Nizamuddin Auliya.<br>2. He popularized Qawwali, a form of music derived from the Arabic word qaul. Which of the statements given above is/are correct ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "c", "exp": "Both 1 and 2. Amir Khusrau, a celebrated poet and musician of the Sultanate period, was called Tuti-e-Hind and is credited with popularizing Qawwali.", "t": 1, "s": 3}, {"n": 317, "tag": null, "stem": "Which of the following Sultans of Delhi was appointed as Amir-i-Tuzuk (Master of Ceremonies) before becoming the Sultan ?", "opts": {"a": "Alauddin Khalji", "b": "Balban", "c": "Iltutmish", "d": "Muhammad Bin Tughlaq"}, "ans": "a", "exp": "Alauddin Khalji (1296 - 1316). He was the second ruler of Khilji dynasty after Jalaluddin Khilji (Founder - ‘Khalji Dynasty’). He was also appointed Arizi-i-Mumalik (Minister of War) during the reign of Jalaluddin Khilji and laid the foundation of his capital Siri in 1303 A.D.", "t": 1, "s": 3}, {"n": 318, "tag": null, "stem": "Who was the first to mention the incident of Jauhar in Persian ?", "opts": {"a": "Ibn Batutah", "b": "Amir Khusrau", "c": "Ziauddin Barani", "d": "Hasan Nizami"}, "ans": "b", "exp": "Amir Khusrau. ‘Jauhar’ - The collective self-immolation by women in order to escape capture and forced into slavery by invaders in face of imminent defeat.", "t": 1, "s": 3}, {"n": 319, "tag": null, "stem": "During Alauddin Khilji&#x27;s reign, the cloth market was known as______.", "opts": {"a": "Sarai-i-Adl", "b": "Mandi", "c": "Munhiyans", "d": "Shahna-i-Mandi"}, "ans": "a", "exp": "Sarai-i-Adl (Place of justice). Alauddin Khilji, under his market policy, built three markets of foodgrain, precious clothes and slave cattle near Kushke Sabz (Hara Rajmahal) within the Badaun gate in Delhi. These were government - aided markets.", "t": 1, "s": 3}, {"n": 320, "tag": null, "stem": "Who was the first Sultan of the Delhi Sultanate to start military expeditions into southern India ?", "opts": {"a": "Ghiyasuddin Balban", "b": "Alauddin Khalji", "c": "Muhammad Tughluq", "d": "Shamsuddin Iltutmish"}, "ans": "b", "exp": "Alauddin Khalji  (1296-1316):- He was the second ruler of the Khilji dynasty of the Delhi Sultanate.", "t": 1, "s": 3}, {"n": 321, "tag": null, "stem": "Which monument of Khilji dynasty in Delhi has the utilization of red sandstone ?", "opts": {"a": "Moti Masjid", "b": "Victoria memorial", "c": "Charminar", "d": "Alai Darwaza"}, "ans": "d", "exp": "Alai Darwaza. Built by Allaudin Khilji the Sultan of Delhi in 1311 AD. Moti Masjid - Aurangzeb (Delhi). Victoria memorial - George V (Kolkata). Charminar - Mohammed Quli Qutub Shah (Hyderabad).", "t": 1, "s": 3}, {"n": 322, "tag": null, "stem": "Consider the following statements:<br>1. Shahna-i-Mandi was the officer responsible for maintaining a register of merchants to ensure adequate supply of goods.<br>2. Alauddin Khilji established only one central market in Delhi, where all commodities were sold together. Which of the statements given above is/are correct ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "Only 1. Alauddin Khilji established three markets at Delhi—for food grains, for cloth &amp; daily-use goods, and for horses, slaves &amp; cattle..", "t": 1, "s": 3}, {"n": 323, "tag": null, "stem": "How many types of taxes were in the reign of the ruler Alauddin Khalji ?", "opts": {"a": "3", "b": "5", "c": "6", "d": "2"}, "ans": "a", "exp": "3 types of taxes: <mark>Jaziya <\/mark> (religious tax on Hindu community), Ghari tax (tax on Houses), and Chari tax (tax on cattles).", "t": 1, "s": 3}, {"n": 324, "tag": null, "stem": "The Begumpuri mosque was built during the reign of which of the following rulers of the Delhi Sultanate ?", "opts": {"a": "Sikandar Lodhi", "b": "Firuz Shah Tughlaq", "c": "Bahlul Lodhi", "d": "Muhammad Tughlaq"}, "ans": "d", "exp": "Muhammad Tuglaq . He was the eighteenth Sultan of Delhi, ruling from February 1324 to 1351. The eldest son of Ghiyath al-Din Tughluq, founder of the Tughlaq dynasty, he built the Begumpur Mosque (Jam&#x27;i Masjid of Jahanpanah) in the capital, Jahanpanah.", "t": 1, "s": 4}, {"n": 325, "tag": null, "stem": "Who among the following was the first sultan of Delhi Sultanate to visit the Ajmer shrine of Khwaja Muinuddin Chishti ?", "opts": {"a": "Ghiyasuddin Balban", "b": "Jalaluddin Khalji", "c": "Muhammad bin Tughlaq", "d": "Khizr Khan"}, "ans": "c", "exp": "Muhammad bin Tughlaq , originally known as Junakhan, ascended the throne in 1324. He is remembered for his efforts to maintain the administrative and political unity of India. In 1327 A.D., he successfully captured Warangal, a significant event in his reign.", "t": 1, "s": 4}, {"n": 326, "tag": null, "stem": "Consider the following statements:<br>1. Muhammad Tughlaq founded the Diwan-i-Amir-i-Kohi.<br>2. The Diwan-i-Amir-i-Kohi was established mainly to strengthen the army. Which of the statements given above is/are correct ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "Only 1. Muhammad Tughlaq set up the Diwan-i-Amir-i-Kohi to bring more land under cultivation. He also promoted agriculture by reducing agrarian cesses and providing agricultural loans called Sondhar.", "t": 1, "s": 4}, {"n": 327, "tag": null, "stem": "Which amongst the following Sultans shifted his capital from Delhi to Daulatabad ?", "opts": {"a": "Feroz Shah Tughlaq", "b": "Ibrahim Lodhi", "c": "Sikandar Lodhi", "d": "Muhammad Bin Tughlaq"}, "ans": "d", "exp": "Muhammad Bin Tughlaq : He shifted his capital from Delhi to the more centrally located Devagiri in Maharashtra, which was renamed Daulatabad. His Five Disastrous Projects are: Taxation in the Doab, Transfer of Capital, Khurasan Expedition, Qarachil Expedition, Introduction of Token Currency.", "t": 1, "s": 4}, {"n": 328, "tag": null, "stem": "Who invaded India during the rule of Tughlaq Dynasty ?", "opts": {"a": "Timur", "b": "Chengiz Khan", "c": "Muhammad Ghori", "d": "Mahmud of Ghazni"}, "ans": "a", "exp": "Timur. During the reign of Nasir-ud-din Mahmud Tughlaq, Timur invaded India in 1398 A.D., leading to the decline of the Tughlaq dynasty.", "t": 1, "s": 4}, {"n": 329, "tag": null, "stem": "Which of the following cities of Delhi was founded by Ghiyasuddin Tughlaq ?", "opts": {"a": "Siri", "b": "Jahanpanah", "c": "Qila-i-Rai Pithora", "d": "Tughlaqabad"}, "ans": "d", "exp": "Tughluqabad. Ghiyasuddin Tuglaq (reign period : 1320-1324) - Founder of Tughlaq dynasty (1320-1414 AD). Tughalq was the longest-ruling dynasty of Delhi sultanate. City and founder: Siri - Alauddin khilji; Jahanpanah - Muhammad bin Tughlaq; Qila-i-Rai Pithora - Prithviraj Chauhan.", "t": 1, "s": 4}, {"n": 330, "tag": null, "stem": "Arrange the following rulers of the Tughlaq dynasty in chronological order:<br>1. Ghiyas-ud-din Tughlaq<br>2. Muhammad-bin-Tughlaq<br>3. Firuz Shah Tughlaq", "opts": {"a": "1 – 2 – 3", "b": "2 – 1 – 3", "c": "1 – 3 – 2", "d": "3 – 2 – 1"}, "ans": "a", "exp": "1 – 2 – 3. The Tughlaq dynasty was founded by Ghiyas-ud-din Tughlaq (1320–1325). He was succeeded by his son Muhammad-bin-Tughlaq (1325–1351). The next ruler was Firuz Shah Tughlaq (1351–1388), remembered for irrigation works, Diwan-i-Khairat, and other welfare measures.", "t": 1, "s": 4}, {"n": 331, "tag": null, "stem": "Who amongst the following raised the banner of revolt against Nasiruddin Khusrau ?", "opts": {"a": "Nasiruddin Tughlaq", "b": "Muhammad bin Tughlaq", "c": "Feroz Shah Tughlaq", "d": "Ghiyasuddin Tughlaq"}, "ans": "d", "exp": "Ghiyasuddin Tughlaq or Ghazi malik (1320-1324 AD) - He was the governor of Punjab during the reign of Allauddin khilji. He was the founder of the Tughlaq dynasty who fought against Mongols, and started Tughlaqabad Fort construction.", "t": 1, "s": 4}, {"n": 332, "tag": null, "stem": "The author of Tarikh-i-Mubarak Shahi, Yahya Sirhindi claims that the founder of____dynasty of Delhi sultanate was a descendant of Prophet Muhammad.", "opts": {"a": "Mamluk", "b": "Khalji", "c": "Sayyid", "d": "Lodhi"}, "ans": "c", "exp": "Sayyid. Khizr Khan defeated Sultan Daulat Khan and occupied Delhi, and founded the Sayyid dynasty in 1414. Capital : Delhi. Tarikh-i-Mubarak Shahi contains the history of Muhammad Ghori and his rulers up to the third ruler of the Sayyid dynasty.", "t": 1, "s": 5}, {"n": 333, "tag": null, "stem": "Arrange the following rulers of the Sayyid Dynasty in chronological order:<br>1. Alauddin Alam Shah<br>2. Khizr Khan<br>3. Mubarak Shah<br>4. Muhammad Shah", "opts": {"a": "2 – 3 – 4 – 1", "b": "2 – 4 – 3 – 1", "c": "3 – 2 – 4 – 1", "d": "1 – 2 – 3 – 4"}, "ans": "a", "exp": "2 – 3 – 4 – 1. Khizr Khan (1414–1421) – Founder of the Sayyid dynasty. Mubarak Shah (1421–1434) – Constructed Mubarakbad city and appointed Hindu nobles in his court. Muhammad Shah (1434–1445). Alauddin Alam Shah (1445–1451) – Last ruler, surrendered Delhi to Bahlul Lodi in 1451.", "t": 1, "s": 5}, {"n": 334, "tag": null, "stem": "Which of the following dynasties of the Delhi Sultanate finally annexed Jaunpur into the empire of Delhi Sultanate ?", "opts": {"a": "Lodi dynasty", "b": "Khalji dynasty", "c": "Tughlaq dynasty", "d": "Sayyid dynasty"}, "ans": "a", "exp": "Lodi dynasty was founded by Bahlol Lodi, the last ruling dynasty of the Delhi Sultanate, ruling from 1451 to 1526. In AD 1476, Bahlol Lodi defeated the Sultan of Jaunpur and annexed it to the Delhi Sultanate. He also brought the ruler of Kalpi and Dholpur under the Suzerainty of Delhi.", "t": 1, "s": 6}, {"n": 335, "tag": null, "stem": "Who among the following was the last sultan of Delhi sultanate ?", "opts": {"a": "Firoz Shah Tughlaq", "b": "Sikandar Lodi", "c": "Muhammad Bin Tughlaq", "d": "Ibrahim Lodi"}, "ans": "d", "exp": "Ibrahim Lodi was the last Sultan of the Delhi Sultanate (1206–1526), he became Sultan in 1517 after the death of his father Sikandar Khan Lodi. In 1526, he was defeated and killed in the Battle of Panipat by Babur, giving way to the emergence of the Mughal Empire in India.", "t": 1, "s": 6}, {"n": 336, "tag": null, "stem": "Which of the following dynasties of Delhi Sultanate founded Agra city ?", "opts": {"a": "Lodi dynasty", "b": "Khalji dynasty", "c": "Sayyid dynasty", "d": "Tughluq dynasty"}, "ans": "a", "exp": "Lodi dynasty (1451 - 1526) <mark>. <\/mark>It was founded by Bahlul Lodi (1451 to 1489 AD). Sultan Sikandar Lodi founded Agra in 1504. Famous Historic City and their Founder: Fatehpur Sikri (Uttar Pradesh) - Akbar, Hampi (Karnataka) - Harihara I and Bukka Raya I, Udaipur (Rajasthan) - Udai Singh II, Warangal (Telangana) - Kakatiya dynasty.", "t": 1, "s": 6}, {"n": 337, "tag": null, "stem": "Consider the following statements regarding mosques of Delhi Sultanate:<br>1. Moth ki Masjid in Delhi was built during the Lodi dynasty.<br>2. Begumpuri Mosque in Delhi was constructed during the reign of the Lodis. Which of the statements given above is/are correct ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "Only 1. Moth ki Masjid was built in 1505 by Wazir Miya Bhoiya during the Lodi dynasty. Begumpuri Mosque was constructed under Muhammad bin Tughlaq, not the Lodis.", "t": 1, "s": 6}, {"n": 338, "tag": null, "stem": "“Double Dome” feature of Indo-Islamic architecture was introduced by which dynasty of Delhi Sultanate ?", "opts": {"a": "Slave Dynasty", "b": "Khilji Dynasty", "c": "Tughlaq Dynasty", "d": "Lodi Dynasty"}, "ans": "d", "exp": "Lodi Dynasty ( 1451-1526 <mark>). <\/mark> Double dome - Built of two layers. There is one layer inside which provides a ceiling to the interior of the building. The other layer is the outer one which crowns the buildings. Example - Humayun&#x27;s Tomb.", "t": 1, "s": 6}, {"n": 339, "tag": null, "stem": "Consider the following statements regarding Sharqi dynasty:<br>1. The dynasty was founded by Khwajah-i-Jahan Malik Sarwar in 1394.<br>2. The Sharqi dynasty ruled over the Agra Sultanate.<br>3. The dynasty came to an end after the defeat of Sultan Hussain Shah by Bahlul Lodi in 1479. Which of the statements given above is/are incorrect ?", "opts": {"a": "Only 1", "b": "Only 2", "c": "Only 3", "d": "2 and 3"}, "ans": "b", "exp": "Only 2. The Sharqi dynasty did not rule over Agra; it ruled the Jaunpur Sultanate. It was founded in 1394 by Khwajah-i-Jahan Malik Sarwar. It ended in 1479 after Sultan Hussain Shah Sharqi was defeated by Bahlul Lodi.", "t": 1, "s": 6}, {"n": 340, "tag": "SSC Stenographer 7/08/2025 (Shift 3)", "stem": "How did the administrative roles of rajas differ from those of zamindars under the Mughal system", "opts": {"a": "Zamindars were subordinate tax officers under the rajas, appointed directly by the emperor.", "b": "Rajas and zamindars performed identical roles but differed in their religious affiliations.", "c": "Rajas governed broader regions and held a higher status, while zamindars primarily managed land revenue collection.", "d": "Zamindars exercised complete political control, whereas rajas held only ceremonial titles."}, "ans": "c", "exp": "Under the Mughal administrative system, rajas (especially Rajput rulers and other local kings) governed large territories and had higher political status. Zamindars, on the other hand, were land revenue collectors and intermediaries who managed smaller areas, often villages or clusters of villages. They were important for revenue administration but did not hold sovereignty like rajas.", "t": 1, "s": 7}, {"n": 341, "tag": "SSC Stenographer 8/08/2025 (Shift 2)", "stem": "Which of the following best explains the reason to held Qandhar strategically important for the Mughals?", "opts": {"a": "It provided direct naval access to the Red Sea for Mughal expeditions.", "b": "It served as a religious pilgrimage center linking India with Central Asian Sufi shrines.", "c": "It was a crucial trade hub connecting the Arabian Sea with the Persian Gulf.", "d": "It controlled key land routes between Kabul and Herat and acted as a fortified military outpost."}, "ans": "d", "exp": "Qandhar (Kandahar, Afghanistan) was a key Mughal frontier, controlling routes between Central Asia, Persia, and India. Served as a fortified military outpost and trade gateway. Its strategic value led to repeated Mughal–Safavid conflicts under Akbar, Jahangir, and Shah Jahan.", "t": 1, "s": 7}, {"n": 342, "tag": "SSC Stenographer 8/08/2025 (Shift 3)", "stem": "What led to the decline of Timurid power in the second half of the 15th century ?", "opts": {"a": "Economic decline due to maritime trade shifts", "b": "Internal wars due to partitioning", "c": "Rise of Uzbeks", "d": "Ottoman invasions"}, "ans": "c", "exp": "The Timurid Empire, founded by Timur (Tamerlane) in the late 14th century, began to weaken in the second half of the 15th century. The main reasons were: Rise of the Uzbeks under Muhammad Shaybani, who consolidated power in Central Asia and displaced the Timurids from Transoxiana (Samarkand and Bukhara). Timurid princes were also engaged in internal conflicts, but the decisive blow came from the expanding Uzbek power. The fall of Timurid authority in Central Asia eventually forced Babur, a Timurid prince, to seek opportunities elsewhere, leading to the foundation of the Mughal Empire in India (1526).", "t": 1, "s": 7}, {"n": 343, "tag": null, "stem": "Consider the following statements in the context of the Mughal Rule.<br>1. The Mansabdari System was introduced by Akbar in 1571.<br>2. The Second Battle of Panipat was fought in 1556.<br>3. Maharana Pratap Singh of Mewar was a contemporary of Babur. Which of the statements given above is/are correct ?", "opts": {"a": "Only 2", "b": "Both 1 and 2", "c": "Both 2 and 3", "d": "1, 2 and 3"}, "ans": "b", "exp": "Both 1 and 2. Maharana Pratap Singh was a contemporary of the third Mughal emperor Akbar. He is notable for leading the Rajput resistance against Akbar&#x27;s expansionist policies, including in the Battle of Haldighati (1576) and the Battle of Dewair (1582). The Second Battle of Panipat was fought between Akbar and Hemu. The mansabdari system was basically a grading system in order to rank the officers based on their ranks and salaries.", "t": 1, "s": 7}, {"n": 344, "tag": null, "stem": "Who among the following was the guru of Tansen ?", "opts": {"a": "Abul Fazal", "b": "Shaukat Mian", "c": "Makarand Mishra", "d": "Swami Haridasa"}, "ans": "d", "exp": "Swami Haridasa. The famous musician Tansen was one of the Navratnas (nine gems) in the court of Emperor Akbar, who bestowed the title &#x27;Mian&#x27; upon him.", "t": 1, "s": 7}, {"n": 345, "tag": null, "stem": "Who among the following was given the charge of looking after the imperial household during the Mughal administration ?", "opts": {"a": "Mir Saman", "b": "Mir Bahri", "c": "Mir Bakshi", "d": "&#x27;Mir-e-aatish&#x27;"}, "ans": "a", "exp": "Mir Saman. Mir Bahri  (mir-i-bahr) - Responsible for the maintenance of the river and seaports. <mark>Mir Bakshi <\/mark>- Headed military department, nobility, information and intelligence agencies. <mark>Mir-e-aatish <\/mark>- Head of the ordinance department.", "t": 1, "s": 7}, {"n": 346, "tag": null, "stem": "Consider the following statements regarding foreign travelers to India:<br>1. Jean-Baptiste Tavernier, a French jeweler, traveled to India several times during the Mughal period, especially in the reign of Shah Jahan.<br>2. Antonio Monserrate was a Spanish missionary who came to India during the reign of Shah Jahan. Which of the above statements is/are correct ?", "opts": {"a": "1 only", "b": "2 only", "c": "Both 1 and 2", "d": "Neither 1 nor 2"}, "ans": "a", "exp": "1 only. Jean-Baptiste Tavernier, a French jeweler, visited India six times during Shah Jahan’s reign, making Statement 1 correct. Antonio Monserrate, however, was a Spanish missionary who came during Akbar’s reign, not Shah Jahan’s, so Statement 2 is incorrect. Hence, Tavernier’s association is with Shah Jahan, while Monserrate’s is with Akbar.", "t": 1, "s": 7}, {"n": 347, "tag": null, "stem": "Who built the Pathar Ki Masjid in Patna, Bihar ?", "opts": {"a": "Feroz shah Tughlaq", "b": "Parwez Shah", "c": "Aurangzeb", "d": "Alauddin Khilji"}, "ans": "b", "exp": "Parwez Shah (Son of Mughal Emperor Jahangir) built “Pathar Ki Masjid” on the banks of River Ganga, Patna (Bihar) in 1621.", "t": 1, "s": 7}, {"n": 348, "tag": null, "stem": "On 12 August____the Mughal emperor appointed the East India Company as the Diwan of Bengal.", "opts": {"a": "1765", "b": "1768", "c": "1772", "d": "1760"}, "ans": "a", "exp": "On 12 August 1765, the Mughal emperor (Shah Alam II) appointed the East India Company as the Diwan of Bengal.", "t": 1, "s": 7}, {"n": 349, "tag": null, "stem": "____in Gujarat was the emporium of western trade during the Mughal Period.", "opts": {"a": "Navasari", "b": "Narmada", "c": "Porbandar", "d": "Surat"}, "ans": "d", "exp": "Surat. It grew famous for all types of textiles, particularly cotton textiles.", "t": 1, "s": 7}, {"n": 350, "tag": null, "stem": "The Mughal court chronicles are written in _____", "opts": {"a": "Arabic", "b": "Persian", "c": "Turkish", "d": "Urdu"}, "ans": "b", "exp": "Persian . Mughal chronicles such as the Akbar Nama were written in Persian. Some of the famous Books during Mughal Reign are Humayun Nama was written by Gulbadan Begum, Tuzuk - E Babari - Babur, Akbar Nama- Abul Fazl, Tarikh E Akbari - Abul Fazl, Tahakik E Hind- Albiruni, Laila Majnu- Amir Khasuru, Shahnamah- Firdousi etc", "t": 1, "s": 7}, {"n": 351, "tag": null, "stem": "With reference to the Land Revenue System of Mughal Empire, the term &#x27; was the amount assessed.", "opts": {"a": "Banjar", "b": "Polaj", "c": "Hasil", "d": "Jama"}, "ans": "d", "exp": ") <mark>Jama. <\/mark>The arrangements for collection of land revenue consisted of two stages : first assessment and then actual collection. The <mark>Jama <\/mark>was the amount assessed whereas the <mark>Hasil <\/mark>was the amount received or collected. <mark>Banjar <\/mark> was the worst kind of land that was left out of cultivation for five years or upwards.", "t": 1, "s": 7}, {"n": 352, "tag": null, "stem": "Which Mughal prince translated the Upanishads into Persian in 1657?", "opts": {"a": "Sultan Luftallah", "b": "Dara Shikoh", "c": "Murad Mirza", "d": "Shah Suja"}, "ans": "b", "exp": "Dara Shikoh . He was the eldest son and heir-apparent of the Mughal emperor Shah Jahan. He completed the translation of fifty upanishads from their original Sanskrit to Persian in 1657 so that they could be studied by muslim scholars.", "t": 1, "s": 7}, {"n": 353, "tag": null, "stem": "Who was the Mughal Emperor at the time of Battle of Plassey ?", "opts": {"a": "Alamgir II", "b": "Siraj- Ud- Daulah", "c": "Mir Qasim", "d": "Shah Alam II"}, "ans": "a", "exp": "Aziz-ud-din Alamgir II.  Alamgir II (Reign - 1754-1759) was the fifteenth Mughal Emperor.", "t": 1, "s": 7}, {"n": 354, "tag": null, "stem": "Consider the following statements regarding the battles of Babur:<br><b>Statement 1: <\/b>The Battle of Khanwa (1527) was fought between Babur and Rana Sanga.<br><b>Statement 2: <\/b>The Second Battle of Panipat (1527) was fought between Babur and Hemu.", "opts": {"a": "Both statements are correct", "b": "Both statements are incorrect", "c": "Statement 1 is correct, Statement 2 is incorrect", "d": "Statement 1 is incorrect, Statement 2 is correct"}, "ans": "c", "exp": "The Battle of Khanwa in 1527 was fought between Babur and Rana Sanga, and Babur emerged victorious, strengthening his control over northern India, making Statement 1 correct. Statement 2 is incorrect because the Second Battle of Panipat occurred in 1556 between Hemu and Akbar, not involving Babur.", "t": 1, "s": 8}, {"n": 355, "tag": null, "stem": "The real name of Babur, the founder of Mughal dynasty in India was:", "opts": {"a": "Zahiruddin Muhammad", "b": "Irfanuddin Muhammad", "c": "Zainuddin Muhammad", "d": "Ruknuddin Muhammad"}, "ans": "a", "exp": "Zahiruddin Muhammad. Real names of some Mughal emperors include: Humayun - Nasir al-Din Muhammed, Akbar - Jalal- ud-din Muhammad Akbar, Jahangir - Muhammad Salim, Aurangzeb - Muhi-ud-din-Muhammad.", "t": 1, "s": 8}, {"n": 356, "tag": null, "stem": "Medini Rai of Chanderi, Hasan Khan of Mewat and Mahmud Lodi joined Rana Sanga with their forces to fight against which of the following Mughal rulers ?", "opts": {"a": "Babur", "b": "Akbar", "c": "Aurangzeb", "d": "Humayun"}, "ans": "a", "exp": "Babur. He was a descendant of Genghis Khan and Timur, founded the Mughal Empire in northern India .", "t": 1, "s": 8}, {"n": 357, "tag": null, "stem": "The battle of Khanwa was fought between the forces of the Babur and the Rajput forces led by:", "opts": {"a": "Ibrahim Lodi", "b": "Rana Sanga", "c": "Medini Rai", "d": "Mahmud Lodi"}, "ans": "b", "exp": "Rana Sanga. ", "t": 1, "s": 8}, {"n": 358, "tag": null, "stem": "Consider the following statements regarding the use of Gunpowder in North India:<br><b>Statement 1: <\/b>Babur made the use of gunpowder common in North India to defeat his enemies.<br><b>Statement 2: <\/b>Ibrahim Lodi introduced gunpowder in the Deccan region for the first time.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Babur was the first to use gunpowder effectively in North India, especially in the First Battle of Panipat (1526) against Ibrahim Lodi. This new technology gave him an advantage over Indian rulers who depended on cavalry and war elephants.", "t": 1, "s": 8}, {"n": 359, "tag": null, "stem": "Who was the eldest of four sons of Babur ?", "opts": {"a": "Askari", "b": "Humayun", "c": "Hindal", "d": "Kamran"}, "ans": "b", "exp": "Humayun - The second ruler of the Mughal empire. The Afghan soldier Sher Shah Suri defeated him at the war in Chausa 1539 and Kannauj in 1540. Humayun was the first person who developed a citadel in Delhi, named as “Din Panah”.", "t": 1, "s": 8}, {"n": 360, "tag": null, "stem": "The first battle of Panipat took place between Babur and ____.", "opts": {"a": "Medini Rai", "b": "Sikandar Lodi", "c": "Ibrahim Lodi", "d": "Rana Sanga"}, "ans": "c", "exp": "Ibrahim Lodi . The First Battle of Panipat was fought in 1526. Second Battle of Panipat (1556): Hemu Vikramaditya and Akbar . Third Battle of Panipat (1761): Marathas and Ahmad Shah Abdali.", "t": 1, "s": 8}, {"n": 361, "tag": null, "stem": "Who among the following Mughal Emperors had assumed the title of Padshah ?", "opts": {"a": "Jahangir", "b": "Babur", "c": "Humayun", "d": "Akbar"}, "ans": "b", "exp": "Babur. He was the first Timurid ruler who, after his conquest of Kabul (1507), assumed the title of Padshah which means &quot;king of kings&quot; or &quot;emperor in persian&quot;.", "t": 1, "s": 8}, {"n": 362, "tag": null, "stem": "After years of wandering Babur seized Kabul in______.", "opts": {"a": "1501", "b": "1504", "c": "1503", "d": "1502"}, "ans": "b", "exp": "1504. ", "t": 1, "s": 8}, {"n": 363, "tag": null, "stem": "The famous monument, Aram Bagh, was built by Babur. It is located in ______.", "opts": {"a": "Delhi", "b": "Uttar Pradesh", "c": "Madhya Pradesh", "d": "Bihar"}, "ans": "b", "exp": "Uttar Pradesh . Aram Bagh - Built by Babur in 1528 in Agra. Monuments Built by Babur: The avenue garden in Kabul, the Panipat Mosque and the Kabuli Bagh Mosque.", "t": 1, "s": 8}, {"n": 364, "tag": null, "stem": "Where was Babur buried for the first time in 1530 ?", "opts": {"a": "Kabul", "b": "Agra", "c": "Delhi", "d": "Fargana"}, "ans": "b", "exp": "Agra. On December 26, 1530, Babur died at Agra. His body was first laid at Arambagh in Agra but was later taken to Kabul, where it was buried.", "t": 1, "s": 8}, {"n": 365, "tag": "SSC Stenographer 8/08/2025 (Shift 1)", "stem": "Name the Mughal emperor known for promoting Persian art and literature ?", "opts": {"a": "Humayun", "b": "Shah Jahan", "c": "Akbar", "d": "Jahangir"}, "ans": "a", "exp": "Humayun (1530–40, 1555–56) is remembered for introducing Persian art and culture into Mughal India. Influenced by Safavid traditions during exile in Persia. Invited Persian painters, poets, scholars after restoration. Mir Sayyid Ali &amp; Abdus Samad came to his court, laying the base of Mughal miniature painting, later expanded under Akbar, Jahangir, and Shah Jahan. Shah Jahan – Famous for architecture (Taj Mahal, Red Fort) rather than literary patronage. Akbar – Promoted Indo-Persian culture, translation of texts, but the Persian literary wave began with Humayun. Jahangir – Great patron of naturalistic painting and fine arts, but not the pioneer of Persian literature.", "t": 1, "s": 9}, {"n": 366, "tag": null, "stem": "Arrange the following Mughal emperors in chronological order of their rule:<br>1. Akbar<br>2. Humayun<br>3. Babur<br>4. Shah Jahan → → → → → →", "opts": {"a": "3 2 1 4", "b": "2 3 1 4", "c": "3 → 1 → 2 → 4", "d": "4 → 3 → 2 → 1"}, "ans": "a", "exp": "3 → 2 → 1 → 4. The chronological order of the Mughal emperors is: Babur (1526–1530), followed by his son Humayun (1530–1540, restored 1555–1556), then Akbar (1556–1605), and later Shah Jahan (1628–1658).", "t": 1, "s": 9}, {"n": 367, "tag": null, "stem": "As per the Timurid tradition, Humayun had to share power with his brothers. Humayun had the control of Delhi, Agra and Central India, while his brother Kamran controlled which of the following regions ?", "opts": {"a": "Afghanistan and Punjab", "b": "Deccan", "c": "Gujarat and Rajasthan", "d": "Bengal and Bihar"}, "ans": "a", "exp": "Afghanistan and Punjab.  Kamran Mirza was the second son of Babur, the founder of the Mughal Empire. He was the brother of Humayun, who was born Nasir-ud-Din Muhammad in Kabul. Humayun was the second Emperor of the Mughal Empire, ruling over present-day Pakistan, Northern India, Afghanistan, and Bangladesh from 1530 to 1540 and again from 1555 to 1556.", "t": 1, "s": 9}, {"n": 368, "tag": null, "stem": "Consider the following statements:<br><b>Statement 1: <\/b>The Battle of Chausa was fought between Humayun and Sher Shah Suri in 1539.<br><b>Statement 2: <\/b>Sher Shah Suri was defeated by Humayun in the Battle of Chausa.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "The Battle of Chausa (1539) occurred between Humayun and Sher Shah Suri, where Humayun suffered a major defeat. Sher Shah Suri emerged victorious, which strengthened his claim to power in North India.", "t": 1, "s": 9}, {"n": 369, "tag": null, "stem": "Sher khan defeated Humayun in the battle of Chausa and Kanauj and forced him to flee to______.", "opts": {"a": "Turkey", "b": "Iraq", "c": "Iran", "d": "Uzbekistan"}, "ans": "c", "exp": "Iran. Sher Khan, an ethnic Pashtun, defeated Humayun in the battles of Chausa (1539) and battles of Bilgram/Kannauj (1540), forcing Humayun to flee to Iran. After these victories, Sher Khan crowned himself Farid al-Dīn Sher Shah and founded the Sur Dynasty.", "t": 1, "s": 9}, {"n": 370, "tag": null, "stem": "Which of the following cities was built by Humayun in Delhi ?", "opts": {"a": "Akbarabad", "b": "Dinpanah", "c": "Muhammadabad", "d": "Siri"}, "ans": "b", "exp": "Dinpanah. Humayun’s Contribution to Architecture: Humayun&#x27;s Tomb (UNESCO World Heritage Site in 1993) - It was built by his widow Biga Begum (Hajji Begum), Purana Quila (Delhi) - Built as a part of the new city Dinpannah.", "t": 1, "s": 9}, {"n": 371, "tag": null, "stem": "In which State of India is Sher Shah&#x27;s Tomb located ?", "opts": {"a": "Bihar", "b": "Uttar Pradesh", "c": "Punjab", "d": "Bengal"}, "ans": "a", "exp": "Bihar (Sasaram) <mark>. Tombs of <\/mark> <mark>Mughal Emperors - <\/mark>Gardens of Babur (Kabul, Afghanistan), Humayun&#x27;s Tomb (New Delhi), Akbar&#x27;s Tomb (Sikandra, Uttar Pradesh), Tomb of Jahangir (Lahore, Pakistan), The Taj Mahal (Agra), Tomb of Aurangzeb (Ahmednagar).", "t": 1, "s": 9}, {"n": 372, "tag": null, "stem": "Who among the following medieval rulers focused his attention on the construction of sarais (shelter) for the convenience of travellers ?", "opts": {"a": "Babur", "b": "Sher Shah Suri", "c": "Akbar", "d": "Humayun"}, "ans": "b", "exp": "Sher Shah Suri (1540-1545) <mark>: <\/mark> Administrative reforms - Introduction of Rupiya, Built Grand-Trunk Road, Staged Dak-Chowkis in Sarais.", "t": 1, "s": 9}, {"n": 373, "tag": null, "stem": "The historical Sher-Shah Suri Marg runs between ______.", "opts": {"a": "Kanpur and Kanyakumari", "b": "Delhi and Manali", "c": "Delhi and Amritsar", "d": "Lucknow and Kolkata"}, "ans": "c", "exp": "Delhi and Amritsar. The Grand Trunk Road (formerly known as Uttarapath, Sarak-e-Azam and Badshahi Sarak) - Part of National Highway (12, 27, 19, 44, 3) in India.", "t": 1, "s": 9}, {"n": 374, "tag": null, "stem": "Humayun’s Tomb situated in Delhi is built by ______.", "opts": {"a": "Gulbadan Begum", "b": "Biga Begum", "c": "Hamida Begum", "d": "Maham Begum"}, "ans": "b", "exp": "Biga Begum . The architect was Mirak Mirza Ghiyath.", "t": 1, "s": 9}, {"n": 375, "tag": null, "stem": "Mirza Kamran was the brother of which of the following Mughal emperors?", "opts": {"a": "Humayun", "b": "Akbar", "c": "Jahangir", "d": "Shah Jahan"}, "ans": "a", "exp": "Humayun and son of Babur and Gulrukh Begum. He came to India in 1538.", "t": 1, "s": 9}, {"n": 376, "tag": "SSC Stenographer 7/08/2025 (Shift 2)", "stem": "Which Mughal emperor did Maharana Pratap face in the Battle of Haldighati ?", "opts": {"a": "Akbar", "b": "Babur", "c": "Aurangzeb", "d": "Jahangir"}, "ans": "a", "exp": "Akbar. The Battle of Haldighati (1576) was fought between Maharana Pratap of Mewar and the Mughal forces under Man Singh I of Amer, representing Emperor Akbar. It was triggered by Maharana Pratap’s firm refusal to accept Mughal suzerainty. Babur: He was the founder of the Mughal Empire and fought against Maharana Pratap&#x27;s grandfather, Rana Sanga, at the Battle of Khanwa in 1527. Jahangir: He was Akbar&#x27;s son and successor. As prince Salim and later as emperor, he continued the campaign against Mewar, which was then ruled by Maharana Pratap&#x27;s son, Amar Singh I.", "t": 1, "s": 10}, {"n": 377, "tag": null, "stem": "Akbar’s first expedition towards Deccan was sent to Ahmednagar under the leadership of Prince Murad and _____.", "opts": {"a": "Birbal", "b": "Abdul Rahim Khan-i-Khanan", "c": "Adham Khan", "d": "Man Singh"}, "ans": "b", "exp": "Abdul Rahim Khan-i-Khanan.  Akbar was the third Mughal emperor, and he ruled over India from 1556 to 1605.", "t": 1, "s": 10}, {"n": 378, "tag": null, "stem": "Match the following Navratnas of Akbar with their respective roles: Column A Column B (Navratnas) (Positions)<br>1. Raja Todar Mal (a) Defence Minister<br>2. Abul Fazl (b) Prime Minister and chief advisor<br>3. Abdul Rahim (c) Revenue Minister<br>4. Tansen (d) Culture Minister and Singer → → → →", "opts": {"a": "1 c, 2 b, 3 a, 4 d", "b": "1 → b, 2 → c, 3 → d, 4 → a", "c": "1 → a, 2 → d, 3 → b, 4 → c", "d": "1 → d, 2 → a, 3 → c, 4 → b"}, "ans": "a", "exp": "1 → c, 2 → b, 3 → a, 4 → d.  Navratnas of Akbar : Abul Fazl - Prime Minister and chief advisor. Faizi - Education Minister. Birbal - Foreign Minister. Raja Man Singh - Chief of Staff of Akbar’s Mughal Army. Tansen - Culture Minister and Singer. Abdul Rahim Khan-I-Khana - Defence Minister. Mullah Do Piyaza - Home Minister. Fakir Aziao-Din - Religious Minister.", "t": 1, "s": 10}, {"n": 379, "tag": null, "stem": "After the death of Humayun, the 13 year-old Akbar was coronated in 1556 at Kalanaur in ________.", "opts": {"a": "Rajasthan", "b": "Gujarat", "c": "Bengal", "d": "Punjab"}, "ans": "d", "exp": "Punjab. Akbar was crowned at Kalanaur on February 14, 1556, following the sudden death of Humayun, who died after falling from the stairs of the Dinpanah library. At just 13 years old, Akbar came to power under the guidance of his guardian, Bairam Khan. He later defeated Hemu in the Second Battle of Panipat, securing control over Delhi.", "t": 1, "s": 10}, {"n": 380, "tag": null, "stem": "Consider the following statements about Akbar’s Navratnas:<br><b>Statement 1: <\/b>Tansen, originally named Ramtanu Pandey, was one of the Navratnas in the court of Akbar.<br><b>Statement 2: <\/b>Amir Khusro was also one of the Navratnas of Akbar.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Tansen, a legendary musician known as “Sangeet Samrat,” was indeed one of Akbar’s Navratnas. However, Amir Khusro was not part of Akbar’s court; he lived earlier during the Delhi Sultanate under Alauddin Khilji.", "t": 1, "s": 10}, {"n": 381, "tag": null, "stem": "Who among the following was the Vakil under the reign of Mughal Emperor Akbar, who received the title of Khan-i-Khanan ?", "opts": {"a": "Mulla do-Piyaza", "b": "Birbal", "c": "Raja Todar Mal", "d": "Bairam Khan"}, "ans": "d", "exp": "Bairam Khan. A prominent Mughal noble and military commander who served as Akbar&#x27;s regent and chief minister during the early years of his reign.", "t": 1, "s": 10}, {"n": 382, "tag": null, "stem": "Which amongst the following statements is correct about Mughal emperor Akbar ?", "opts": {"a": "He founded a new religion called ‘Din-e Ilahi’.", "b": "He fought and won the third battle of Panipat against the Hindu King Hemu", "c": "He was declared emperor in 1602.", "d": "He was highly educated and knew many languages."}, "ans": "a", "exp": "He founded a new religion  <mark>called ‘Din-e-Ilahi’. <\/mark>The theory of Din-e-Ilahi means belief in one God. The first initiated disciples of Din-i-Ilahi during emperor Akbar included Birbal, Prince Salim, and Abul-Fazl ibn Mubarak.", "t": 1, "s": 10}, {"n": 383, "tag": null, "stem": "Who amongst the following Mughal emperors got classical Hindu mythological texts Ramayana and Mahabharata translated into Persian ?", "opts": {"a": "Jahangir", "b": "Aurangzeb", "c": "Akbar", "d": "Shahjahan"}, "ans": "c", "exp": "Akbar was the 3rd Mughal emperor (1556 to 1605). The Mahabharata was translated by Faizi and `Abd al-Qadir Bada&#x27;uni and named Razmnama. Literature under the rule of Akbar: Akbarnama (Autobiography of Akbar) and Ain-i-Akbari written by Abu&#x27;l-Fazl.", "t": 1, "s": 10}, {"n": 384, "tag": null, "stem": "Which of the following statements about Akbar are true?<br>1. He introduced the Mansabdari system.<br>2. He defeated and merged the state of Bijapur in his empire.<br>3. He made Fatehpur Sikri his capital.", "opts": {"a": "All 1, 2, 3", "b": "Only 1 and 3", "c": "Only 2 and 3", "d": "Only 1 and 2"}, "ans": "b", "exp": "Only 1 and 3. The Mansabdari system was a system of ranking government officials and military generals in the Mughal Empire, which was introduced by Emperor Akbar in 1571. Aurangzeb, the sixth Mughal emperor (1658-1707), sent his armies to conquer the Deccan Sultanates. He annexed Bijapur in 1685 and Golconda in 1687.", "t": 1, "s": 10}, {"n": 385, "tag": null, "stem": "When Akbar introduced Mansabdari system, _____was the lowest grade of Mansabdar.", "opts": {"a": "fifty", "b": "one hundred", "c": "ten", "d": "one thousand"}, "ans": "c", "exp": "Ten. The term mansabdar refers to an individual who holds a mansab, meaning a position or rank. It was a grading system used by the Mughals to fix rank, salary and military responsibilities. During Akbar&#x27;s reign, the lowest rank allotted was 10, and the highest was that of 10,000.", "t": 1, "s": 10}, {"n": 386, "tag": null, "stem": "When was Khandesh merged into the Mughal empire by Akbar ?", "opts": {"a": "1595", "b": "1601", "c": "1597", "d": "1605"}, "ans": "b", "exp": "1601. Khandesh was situated in the Tapti valley, Maharashtra. It was founded by Malik Raja Faruqi. Major military campaigns by Akbar - In 1568 the Sisodiya capital of Chittor was seized and in 1569 Ranthambore.", "t": 1, "s": 10}, {"n": 387, "tag": null, "stem": "Consider the following statements regarding the defence of Chittorgarh Fort:<br><b>Statement 1: <\/b>Jaimal and Patta were the Rajput warriors entrusted with defending the fort of Chittor against Akbar in 1567–1568.<br><b>Statement 2: <\/b>The Siege of Chittorgarh was led by Sher Shah Suri against the Mewar kingdom.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "c", "exp": "Jaimal and Patta heroically defended the fort of Chittorgarh during Akbar’s siege of 1567–1568. The campaign was not led by Sher Shah Suri but by Akbar, who eventually captured the fort after a fierce battle.", "t": 1, "s": 10}, {"n": 388, "tag": null, "stem": "Tansen, the music legend, was a courtier in which of the following courts before coming to Akbar ?", "opts": {"a": "Rewa", "b": "Benaras", "c": "Gandhara", "d": "Maghad"}, "ans": "a", "exp": "Rewa. Tansen was initially the court singer of King Ram Chand. His original name was RamaTanu Pandey. Tansen was the title given to him by Raja Vikramjit of Gwalior.", "t": 1, "s": 10}, {"n": 389, "tag": null, "stem": "Consider the following statements regarding land classification during Akbar’s reign:<br><b>Statement 1: <\/b>Chachar was the land that was always cultivated and never allowed to lie fallow.<br><b>Statement 2: <\/b>Polaj was the ideal land that remained under continuous cultivation without being left fallow.", "opts": {"a": "Both statements are true", "b": "Both statements are false", "c": "Statement 1 is true, Statement 2 is false", "d": "Statement 1 is false, Statement 2 is true"}, "ans": "d", "exp": "Chachar was land left fallow for three to four years, not land cultivated continuously. Polaj was the most fertile land that remained under constant cultivation and was never allowed to lie fallow.", "t": 1, "s": 10}, {"n": 390, "tag": null, "stem": "Which of the following cities was the first planned city of the Mughals ?", "opts": {"a": "Mirzapur", "b": "Fatehpur Sikri", "c": "Lucknow", "d": "Lahore"}, "ans": "b", "exp": "Fatehpur Sikri. It is located near Agra in Uttar Pradesh. It was built by the Mughal Emperor Akbar in the 16th century. Fatehpur Sikri was built during 1571 and 1585. Fatehpur Sikri was declared as UNESCO World Heritage Sites in 1986.", "t": 1, "s": 10}, {"n": 391, "tag": null, "stem": "When was the Battle of Tukaroi fought where Akbar defeated the Sultanate of Bengal and Bihar ?", "opts": {"a": "1564", "b": "1582", "c": "1575", "d": "1591"}, "ans": "c", "exp": "1575. The Battle of Tukaroi  (Battle of Bajhaura/ Moghalmari) - Fought at Balasore (Odisha) in which Akbar (Mughal Emperor) defeated Daud Khan Karrani (Ruler of Bengal). The battle led to the <mark>Treaty of Katak <\/mark>in which Daud Khan Karrani ceded the whole of Bengal and Bihar, retaining only Odisha.", "t": 1, "s": 10}, {"n": 392, "tag": null, "stem": "____administration became the model followed by the great emperor Akbar when he consolidated the Mughal Empire.", "opts": {"a": "Sher Shah Suri&#x27;s", "b": "Alauddin Khalji&#x27;s", "
