f 8%.\n    2) Basel II introduced a three-pillar framework consisting of Minimum Capital Requirements, Supervisory\n       Review, and Market Discipline.\n    3) Basel II covered credit risk, market risk and operational risk.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•      Introduced: 1988\n    •      Issued by: Basel Committee on Banking Supervision (BCBS)\n    •      Main Aim: To ensure that banks maintain enough capital to cover risks.\n\nMain Points\n\n    ➢      Minimum CAR = 8%\n    ➢      Banks must maintain at least 8% capital against Risk-Weighted Assets (RWA).\n\nCAR = Capital ÷ Risk-Weighted Assets × 100\n\nRisk-Weighted Assets (RWA)-Different assets are given different risk weights.\n\n    ➢      Higher risk → Higher capital requirement.\n\nTwo Types of Capital\n\n    •      Tier 1 → Core Capital – Equity, disclosed reserves.\n    •      Tier 2 → Supplementary Capital – Certain reserves, subordinated debt, etc.\n\nMain Risk: Credit Risk–Risk that the borrower may fail to repay the loan.\n\n1996 Amendment:Market Risk was added to the capital framework.\n\nBasel Norms II:\n\n    •      Introduced: 2004\n    •      Main Aim: To make banks’ risk measurement and risk management more effective.\n\nBasel II covers three major risks:\n\nCredit Risk:Borrower fails to repay the loan.\n\n    •      Eg: Bank gives loan → Borrower defaults → Bank suffers loss.\n\nMarket Risk:Loss due to changes in interest rates, exchange rates or security prices.\n\n    •      Eg: Interest rates rise → Bond prices fall → Bank suffers loss.\n\nOperational Risk:Loss due to failure of people, systems, processes or external events.\n\n    •      Eg: Employee fraud, system failure, cyber incident, human error.\n\nThree Pillars of Basel II\n\nPillar 1 – Minimum Capital Requirement\n\n    •      Banks must maintain adequate capital for: Credit Risk + Market Risk + Operational Risk\n\nPillar 2 – Supervisory Review\n\n    •      Banking supervisors such as RBI review whether banks have:Adequate capital,Proper risk-management\n           systems.\n\nPillar 3 – Market Discipline\n\n    •      Banks must make proper disclosures so that investors and the public can understand the bank’s financial\n           condition."}, {"id": 126, "topic": "Basel Norms & Committees", "question": "Which of the following is a major feature of Basel III norms?", "options": {"A": "Focus only on credit risk", "B": "Introduction of minimum 8% CAR for the first time", "C": "Strengthening bank capital, liquidity and leverage requirements", "D": "Complete removal of banking supervision"}, "answer": "C", "explanation": "•    Basel III is an international banking regulatory framework introduced after the 2007–09 Global Financial\n         Crisis to make banks stronger, safer and more resilient.\n    •    Main focus:Strengthening bank capital, liquidity and leverage requirements\n\nMajor Recommendations:\n\n1)Capital Requirements:Capital is the money/cushion a bank keeps to absorb losses.\n\na)CET1 – Common Equity Tier 1:Highest-quality capital of a bank.Mainly includes common equity and retained\nearnings.It absorbs losses while the bank continues its operations.\n\nBasel minimum: 4.5% of RWA.\n\nb)AT1 – Additional Tier 1:Additional core/going-concern capital.Helps absorb losses while the bank is still\noperating.\n\nc)Tier 1 Capital:Tier 1 = CET1 + AT1\n\n    •    It is the bank’s main/core loss-absorbing capital.\n    •    Minimum: 6% of RWA.\n\nd)Tier 2 Capital:Supplementary capital that provides an additional cushion against losses.\n\n    •    Total Tier 1 + Tier 2 = Total Capital.\n\ne)Total Capital Adequacy Ratio(CAR)/ CRAR:Total Capital = Tier 1 + Tier 2\n\n    •    Basel minimum = 8% of RWA.\n    •    CRAR=Capital to Risk weighted assets (CAR=CRAR)\n    •    RWA = Risk-Weighted Assets.\n\n2)Capital Buffers:Buffers are extra capital kept for difficult times.\n\na)Capital Conservation Buffer (CCB):Extra 2.5% CET1 capital.Helps banks absorb losses during financial\nstress.Basel minimum = 2.5%.\n\nb)Countercyclical Capital Buffer (CCyB):Extra buffer of 0–2.5%.Built during periods of excessive credit\ngrowth.Can be released during financial stress.Purpose: control systemic risk.\n\n3)Leverage Ratio:Prevents banks from taking excessive leverage/debt.It acts as a simple backstop to risk-based\ncapital requirements.Basel minimum = 3%.\n\n4) Liquidity Standards:\n\na) LCR – Liquidity Coverage Ratio:Ensures that a bank has enough High-Quality Liquid Assets (HQLA) to meet net\ncash outflows for 30 days of stress.Minimum = 100%.\n\nb) NSFR – Net Stable Funding Ratio:Ensures that a bank has enough stable funding for its assets and activities over\na 1-year period.Minimum = 100%.\n\nLatest :CET1 – 5.5%\n\n    •    Tier 1 – 7%\n    •    CRAR – 9%\n\n    •      CCB – 2.5%\n    •      CRAR + CCB – 11.5%\n    •      Leverage Ratio – 3%\n    •      LCR – 100%\n    •      NSFR – 100%\n    •      CCyB – 0–2.5%"}, {"id": 127, "topic": "Basel Norms & Committees", "question": "The Narasimham Committee I (1991) was primarily associated with:", "options": {"A": "Introduction of Goods and Services Tax", "B": "Banking and financial sector reforms", "C": "Fiscal deficit management", "D": "Agricultural pricing reforms"}, "answer": "B", "explanation": "Chairman: M. Narasimham\n\nPurpose: To introduce financial-sector and banking reforms and make banks more efficient and competitive.\n\nMain Recommendations:\n\n    •      Reduce SLR and CRR.\n    •      Introduce prudential norms – income recognition, asset classification and provisioning.\n    •      Maintain Capital Adequacy Ratio (CAR) of 8%.\n    •      Gradually deregulate interest rates.\n    •      Give greater autonomy to Public Sector Banks.\n    •      Establish an Asset Reconstruction Fund (ARF) to deal with bad loans.\n    •      Increase competition by allowing more private-sector participation.\n\nNote:\n\nPrudential norms : Rules that make banks recognise risks and losses properly and maintain enough financial\nstrength.\n\nMajor Prudential Norms\n\n    •      Income Recognition Norms – Income/interest should be recognised only when it is actually earned and\n           realisable.\n    •      Asset Classification Norms – Loans are classified based on their performance: Standard, Substandard,\n           Doubtful and Loss\n                ➢ Standard Asset – Loan is performing normally; no major repayment problem.\n\n               ➢ Remaining discussed near NPA\n    •      Provisioning Norms – Banks must set aside funds to cover expected losses from bad loans/NPAs.\n    •      Capital Adequacy Norms – Banks must maintain sufficient capital against their risk-weighted assets.CAR =\n           Capital ÷ Risk-Weighted Assets × 100\n    •      Exposure Norms – Banks cannot take excessive exposure to a single borrower, group or sector, reducing\n           concentration risk.\n    •      Liquidity Norms – Banks must maintain sufficient liquid resources to meet their short-term obligations.\n\nARF = Asset Reconstruction Fund:It is a fund used for dealing with bad loans (NPAs).It provides funds for\nacquiring, restructuring or recovering stressed assets."}, {"id": 128, "topic": "Basel Norms & Committees", "question": "Which of the following was a major recommendation of the Narasimham Committee II (1998)?", "options": {"A": "Establishment of Asset Reconstruction Companies (ARCs)", "B": "Complete abolition of priority-sector lending", "C": "Introduction of GST", "D": "Nationalisation of private sector banks"}, "answer": "A", "explanation": "•      Chairman: M. Narasimham\n    •      Purpose: To strengthen and improve the banking reforms introduced in 1991.\n\nMain Recommendations:\n\n    •      Reduce Non-Performing Assets (NPAs).\n    •      Establish Asset Reconstruction Companies (ARCs) for bad loans.\n    •      Increase CAR to 9% by 2000 and 10% by 2002.\n    •      Encourage mergers of strong banks.\n    •      Give greater autonomy and professional management to PSBs.\n    •      Reduce Government shareholding in PSBs to 33%\n    •      Improve corporate governance and transparency\n\nNote:\n\nARC – Asset Reconstruction Company\n\n    •      An ARC is a company that buys bad loans (NPAs) from banks.\n    •      It helps banks clean their balance sheets by taking over stressed assets.\n    •      The ARC then tries to recover the money through restructuring, sale of assets, settlement, etc.\n    •      In India, ARCs are regulated by the RBI under the SARFAESI Act, 2002.\n\nSARFAESI Act, 2002:Allows banks/financial institutions to take possession and sell secured assets without going\nthrough a lengthy court process, subject to the Act."}, {"id": 129, "topic": "Basel Norms & Committees", "question": "Which of the following was a major recommendation of the Raghuram Rajan Committee on Financial Sector\nReforms (2008)?", "options": {"A": "Complete nationalisation of private sector banks", "B": "Restriction of financial innovation", "C": "Greater competition and wider access to financial services", "D": "Abolition of banking regulation"}, "answer": "C", "explanation": "•      Year:2007\n    •      Report Submitted:2008\n    •      Main objective:To bring next-generation reforms in India’s financial sector and improve financial inclusion,\n           economic growth and financial stability.\n\nImportant Recommendations :\n\n    •      Financial Inclusion – Provide banking, credit, savings and insurance services to more people, especially the\n           poor and rural population.\n    •      More Competition in Banking – Allow more private and well-governed banks to enter.\n    •      Greater Autonomy to PSBs – Reduce excessive government control and strengthen bank boards.\n    •      Develop Financial Markets – Make bond, equity and other financial markets deeper and more efficient.\n    •      Better Regulation – Strengthen financial regulation and supervision.\n    •      Financial Stability – Suggested a Financial Sector Oversight Agency (FSOA) for macro-prudential\n           supervision.\n    •      Improve Credit Infrastructure – Strengthen credit information and mechanisms for dealing with financial\n           distress.\n    •      Priority Sector Lending – Suggested making priority-sector obligations more flexible and market-oriented."}, {"id": 130, "topic": "Basel Norms & Committees", "question": "The Monetary Policy Framework in India was based on the recommendations of which committee?", "options": {"A": "Narasimham Committee", "B": "Raghuram Rajan Committee", "C": "PJ.Nayak Committee", "D": "Urjit Patel Committee"}, "answer": "D", "explanation": "•      Report: January 2014\n    •      Chairman: Urjit R. Patel\n    •      Purpose: To revise and strengthen India’s Monetary Policy Framework and make it more transparent and\n           predictable.\n\nMain Recommendations:\n\n    •      CPI as the main inflation measure:RBI should focus on CPI (Combined) rather than WPI.\n    •      Inflation Target – 4%\n                ➢ Target: 4% inflation\n                ➢ Tolerance band: ±2%\n                ➢ So acceptable range = 2% to 6%.\n    •      Flexible Inflation Targeting: Price stability should be the main objective, while also keeping growth\n           concerns in mind.\n    •      Monetary Policy Committee (MPC): Recommended shifting monetary policy decisions towards a\n           Monetary Policy Committee rather than leaving them solely to the RBI Governor.\n    •      Repo Rate as the main policy rate: Recommended using the repo rate as the main policy instrument for\n           monetary policy."}, {"id": 131, "topic": "Basel Norms & Committees", "question": "The Nachiket Mor Committee was primarily associated with which of the following?", "options": {"A": "Universal access to banking and financial services", "B": "Monetary policy and inflation targeting", "C": "Banking sector consolidation", "D": "Public debt management"}, "answer": "A", "explanation": "•      Chairman: Nachiket Mor\n    •      Official name: Committee on Comprehensive Financial Services for Small Businesses and Low-Income\n           Households\n\n    •      Main aim: Financial Inclusion — make banking and financial services easily available to everyone,\n           especially low-income households and small businesses.\n\nMain Recommendations:\n\n    •      Universal Electronic Bank Account (UEBA)–Every adult Indian should have a full-service electronic bank\n           account.\n    •      Universal Access to Banking– People should have easy access to payments, deposits, credit, insurance and\n           investment services at reasonable cost.\n    •      Payments Banks–Recommended specialised banks mainly for payments and deposits, especially for small\n           businesses and low-income households.\n    •      Wholesale Banks–Recommended banks specialising in large loans to corporates and financial institutions.\n    •      Financial Inclusion through Technology–Promote electronic payments and technology-based banking to\n           reach more people.\n    •      Affordable Credit–Ensure easy and affordable formal credit for small businesses and low-income\n           households.\n    •      Priority Sector Lending–Suggested increasing the PSL target from 40% to 50% of credit.\n    •      Customer Protection–Financial institutions should provide suitable products and better grievance-redressal\n           mechanisms."}, {"id": 132, "topic": "Basel Norms & Committees", "question": "The P. J. Nayak Committee (2014) was primarily related to:", "options": {"A": "Regulation of Microfinance Institutions", "B": "Governance reforms in Public Sector Banks", "C": "Introduction of Basel III norms", "D": "Management of Foreign Exchange Reserves"}, "answer": "B", "explanation": "•      Chairman: P. J. Nayak\n    •      Set up by: RBI\n    •      Main aim: To improve the governance and functioning of Public Sector Banks (PSBs).\n\nMain Recommendations :\n\n    •      Bank Investment Company (BIC)–Government’s shares in PSBs should be transferred to a BIC.BIC would\n           act as a holding company for PSBs.\n    •      Reduce Government Control–Government should become mainly an investor, not directly control bank\n           management.\n    •      Government Stake Below 50% – Recommended reducing government ownership in PSBs to below 50%.\n\n    •      Bank Boards Bureau (BBB)–Until BIC is established, BBB should help in selecting top management and\n           directors of PSBs.\n    •      Professional Bank Boards–PSB boards should be independent, professional and properly empowered.\n    •      RBI as Sole Regulator– RBI should be the main/sole regulator for both PSBs and private banks, avoiding\n           dual control.\n    •      Greater Autonomy:PSBs should get greater freedom in business decisions, HR and management."}]</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('quizData').textContent);

  // Build topic list preserving first-seen order, with counts
  const topicOrder = [];
  const topicMap = {};
  data.forEach(q => {
    if(!topicMap[q.topic]){
      topicMap[q.topic] = [];
      topicOrder.push(q.topic);
    }
    topicMap[q.topic].push(q);
  });

  const state = {
    answered: 0,
    correct: 0,
    wrong: 0,
    activeTopic: topicOrder[0]
  };

  const statTotal = document.getElementById('statTotal');
  const statAnswered = document.getElementById('statAnswered');
  const statCorrect = document.getElementById('statCorrect');
  const statWrong = document.getElementById('statWrong');
  statTotal.textContent = data.length;

  function updateStats(){
    statAnswered.textContent = state.answered;
    statCorrect.textContent = state.correct;
    statWrong.textContent = state.wrong;
  }

  function formatText(t){
    if(!t) return '';
    return t.split('\n').map(line => {
      const m = line.match(/^(\s*)/);
      const lead = m[1];
      let rest = line.slice(lead.length);
      rest = rest.replace(/ {3,}/g, ' \u2014 ');
      return lead + rest;
    }).join('\n');
  }

  // ---------- Tabs ----------
  const tabsNav = document.getElementById('topicTabs');
  topicOrder.forEach(topic => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.type = 'button';
    btn.dataset.topic = topic;
    btn.innerHTML = topic + '<span class="tab-count">(' + topicMap[topic].length + ')</span>';
    btn.addEventListener('click', () => selectTopic(topic, true));
    tabsNav.appendChild(btn);
  });

  function setActiveTabUI(topic){
    tabsNav.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.topic === topic);
    });
  }

  // ---------- Question rendering ----------
  const container = document.getElementById('quizContainer');

  function renderTopic(topic){
    container.innerHTML = '';
    const questions = topicMap[topic];

    const heading = document.createElement('div');
    heading.className = 'topic-heading';
    const h2 = document.createElement('h2');
    h2.textContent = topic;
    const prog = document.createElement('span');
    prog.className = 'topic-progress';
    prog.id = 'topicProgress';
    heading.appendChild(h2);
    heading.appendChild(prog);
    container.appendChild(heading);

    function updateTopicProgress(){
      let ans = 0;
      questions.forEach(q => { if(q._answered) ans++; });
      prog.textContent = ans + ' / ' + questions.length + ' answered';
    }

    questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const qHead = document.createElement('div');
      qHead.className = 'q-head';
      const num = document.createElement('div');
      num.className = 'q-num';
      num.textContent = 'Q' + q.id;
      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = formatText(q.question);
      qHead.appendChild(num);
      qHead.appendChild(qText);
      card.appendChild(qHead);

      const optsWrap = document.createElement('div');
      optsWrap.className = 'options';

      const letters = ['A','B','C','D'];
      const explanationBox = document.createElement('div');
      explanationBox.className = 'explanation';
      const explanationInner = document.createElement('div');
      explanationInner.className = 'explanation-inner';
      const expLabel = document.createElement('span');
      expLabel.className = 'exp-label';
      expLabel.textContent = 'Explanation';
      const expText = document.createElement('div');
      expText.textContent = formatText(q.explanation || 'No explanation provided.');
      explanationInner.appendChild(expLabel);
      explanationInner.appendChild(expText);
      explanationBox.appendChild(explanationInner);

      function lockOptions(selectedLetter){
        optsWrap.querySelectorAll('.option').forEach(btn => {
          btn.classList.add('locked');
          btn.disabled = true;
          const letter = btn.dataset.letter;
          if(letter === q.answer){
            btn.classList.add('correct');
          } else if(letter === selectedLetter){
            btn.classList.add('incorrect');
          }
        });
      }

      letters.forEach(letter => {
        const optText = q.options[letter];
        if(optText === undefined) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.dataset.letter = letter;
        const letterSpan = document.createElement('span');
        letterSpan.className = 'opt-letter';
        letterSpan.textContent = letter + '.';
        const textSpan = document.createElement('span');
        textSpan.textContent = formatText(optText);
        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        btn.addEventListener('click', () => {
          if(q._answered) return;
          q._answered = true;
          state.answered++;
          if(letter === q.answer){
            state.correct++;
          } else {
            state.wrong++;
          }
          lockOptions(letter);
          explanationBox.classList.add('open');
          revealBtn.disabled = true;
          updateStats();
          updateTopicProgress();
        });

        optsWrap.appendChild(btn);
      });

      card.appendChild(optsWrap);

      const qFooter = document.createElement('div');
      qFooter.className = 'q-footer';
      const revealBtn = document.createElement('button');
      revealBtn.type = 'button';
      revealBtn.className = 'reveal-link';
      revealBtn.textContent = 'Show answer & explanation';
      revealBtn.addEventListener('click', () => {
        if(q._answered) return;
        q._answered = true;
        state.answered++;
        updateStats();
        updateTopicProgress();
        lockOptions(null);
        explanationBox.classList.add('open');
        revealBtn.disabled = true;
      });
      qFooter.appendChild(revealBtn);
      card.appendChild(qFooter);

      card.appendChild(explanationBox);
      container.appendChild(card);
    });

    updateTopicProgress();
  }

  function selectTopic(topic, scroll){
    state.activeTopic = topic;
    setActiveTabUI(topic);
    renderTopic(topic);
    if(scroll){
      window.scrollTo({top: container.offsetTop - 10, behavior:'smooth'});
    }
  }

  selectTopic(topicOrder[0], false);

  // ---------- Scroll to top ----------
  const scrollBtn = document.getElementById('scrollTopBtn');
  window.addEventListener('scroll', () => {
    scrollBtn.classList.toggle('show', window.scrollY > 420);
  });
  scrollBtn.addEventListener('click', () => {
    window.scrollTo({top:0, behavior:'smooth'});
  });

})();
</script>
</body>
</html>
