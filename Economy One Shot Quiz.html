lows partial transfer of PSU ownership to private hands?", "options": {"A": "Minority sale", "B": "Complete sale", "C": "Auction", "D": "Leasing"}, "answer": "A", "explanation": "control. It is a form of disinvestment.Eg: Government sells 20% of its shares in a PSU but retains 80% → Minority\nSale.\n\n    •      Complete Sale: The government sells its entire ownership/stake in the PSU, resulting in complete transfer\n           of ownership.\n    •      Auction: A method of selling an asset or stake in which potential buyers submit competing bids, and the\n           eligible bidder offering the best price/terms is selected.\n    •      Leasing: The government or owner allows another party to use an asset for a specified period in return for\n           payment, while ownership generally remains with the original owner."}, {"id": 68, "topic": "Fiscal Policy & Budget", "question": "Consider the following statements regarding Business Cycle and its phases:\n\n1.Business cycle refers to fluctuations in economic activity, such as changes in output, income and employment,\nover time.\n\n2.Expansion is a phase in which economic activity increases, while contraction is a phase in which economic\nactivity declines.\n\n3.Recovery is the phase in which economic activity reaches its lowest point and begins to decline further.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "B", "explanation": "Changes in: Output (GDP), Employment, Income, Investment, Aggregate Demand.\n\nPhases\n\n1. Boom (Expansion/Peak): High growth, strong demand & investment, rising income/profits, low unemployment,\nhigh capacity utilisation.\n\n2. Recession: Economic slowdown; demand & production ↓, investment ↓, unemployment ↑, profits ↓.\n\nCommon indicator: 2 consecutive quarters of negative GDP growth.\n\n3. Depression: Severe & prolonged recession; output/income ↓ sharply, very high unemployment, investment &\ncredit collapse, business failures, deflationary pressure.\n\nExample: Great Depression (1929–33).\n\n4. Recovery: Economic activity improves; demand ↑, investment ↑, employment ↑, production gradually expands."}, {"id": 69, "topic": "Fiscal Policy & Budget", "question": "Which of the following best describes Fiscal Policy?", "options": {"A": "Policy of the RBI to control money supply and interest rates", "B": "Government policy relating to taxation, public expenditure and borrowing", "C": "Policy relating to foreign trade and exchange rates", "D": "Policy of controlling industrial production"}, "answer": "B", "explanation": "influence economic activity and achieve economic stability.\n\nSimply Budgeting How much money will come,will go,from where it will come ,where it will go.\n\nObjectives:\n\n    •      Increase government spending on infrastructure and development to promote production and economic\n           growth.\n    •      Control inflation and maintain stable prices in the economy.\n    •      Increase employment opportunities through government spending and development activities.\n    •      Reduce income inequality by collecting taxes and providing welfare benefits to weaker sections.\n    •      Reduce fluctuations in economic activity during boom and recession.(Business Cycles).\n    •      Direct resources towards priority sectors such as education, healthcare and infrastructure.\n    •      Promote development in backward regions and reduce regional inequalities."}, {"id": 70, "topic": "Fiscal Policy & Budget", "question": "Which of the following correctly describes the two major types of Fiscal Policy?", "options": {"A": "Expansionary and Contractionary", "B": "Direct and Indirect", "C": "Progressive and Regressive", "D": "Internal and External"}, "answer": "A", "explanation": "economic growth.\n\nTypes of Fiscal Policy:\n\n1.Neutral Fiscal Policy – The government maintains a relatively balanced approach between revenue and\nexpenditure. It is used when the economy is relatively stable.\n\nGovernment Spending=Taxation\n\n2.Expansionary Fiscal Policy\n\n    •      Govt Spending> Taxation\n    •      Used when economy is in Recession.\n    •      Why used:To boost the economy.\n    •      Tools: a)Increase in Govt . Spending –More funds for public projects, infrastructure and social welfare\n           programs.\n    •      b)Tax cuts-Reduction in tax cuts to boost disposable income for consumers and businesses.\n    •      Impact:Increased consumer spending and business investment due to tax reduction,Employment\n           Opportunities.\n\n3.Contactionary Fiscal Policy:\n\n    •      Govt Spending<Taxation\n    •      Use:When economy is inflationary phase for to control Inflation\n    •      Tools:a) Decrease in Govt.Spending-Reduced funding for public projects and programs.\n    •      b)Tax Increases:Increase taxes to lower disposable income and reduce spending .\n    •      Impact: Inflation control ,Stabilise the economy"}, {"id": 71, "topic": "Fiscal Policy & Budget", "question": "Assertion (A): Counter-cyclical fiscal policy is used to reduce fluctuations in economic activity.\n\nReason (R): During a recession, the government may increase expenditure or reduce taxes, while during a boom it\nmay reduce expenditure or increase taxes.", "options": {"A": "Both A and R are true, and R is the correct explanation of A", "B": "Both A and R are true, but R is not the correct explanation of A", "C": "A is true, but R is false", "D": "A is false, but R is true"}, "answer": "A", "explanation": "boom.\n\nObjective :To reduce extremes (low,high) in the economic cycle,stabilising growth and demand .\n\nDuring Recession:When Economy is going down (GDP ↓)\n\n    •      Follows Expansionary Fiscal Policy\n                   ➢ Increase Govt Expenditure\n                   ➢ Reduce Taxes\n    •      Impact: Economic starts Increasing , Purchasing power increases\n\nDuring Boom:When Economy/Economic growth increasing-(GDP Increases)\n\n    •      Follows Contractionary Fiscal Policy\n               ➢ Decreases Govt Expenditure\n               ➢ Increases Taxes\n    •      Economy/Economic growth decreasing , Purchasing power decreases."}, {"id": 72, "topic": "Fiscal Policy & Budget", "question": "Which of the following pairs is/are incorrect regarding Budget types?\n\n1)Balanced Budget – Government Receipts = Government Expenditure\n\n2)Surplus Budget – Government Receipts > Government Expenditure\n\n3)Deficit Budget – Government Expenditure > Government Receipts\n\n4)Surplus Budget – Government Expenditure > Government Receipts\n\nWhich of the above pairs is incorrectly matched?", "options": {"A": "1 only", "B": "2&3 only", "C": "3 &4only", "D": "4 only"}, "answer": "D", "explanation": "statement showing the estimated receipts and expenditure of the government for a financial year. It uses government\nrevenue, expenditure and borrowing to influence economic growth, employment, price stability and income\ndistribution.\n\nTypes of Government Budget:Government Budget can be classified based on the relationship between Government\nReceipts and Government Expenditure.\n\nBalanced Budget:Government Receipts = Government Expenditure\n\n    •      Government earns exactly as much as it spends.There is no surplus or deficit.It indicates fiscal\n           balance.Suitable when the government aims to maintain financial stability.\n\nSurplus Budget:Government Receipts > Government Expenditure\n\n    •      Government earns more than it spends.The excess amount is called a surplus.It can help reduce public debt\n           and control excessive demand.Generally useful during periods of high inflation.\n\nDeficit Budget:Government Expenditure > Government Receipts\n\n    •      Government spends more than it earns.The difference is called a deficit.The government may borrow to\n           meet this gap.It can be used to support economic growth and development, especially during a slowdown."}, {"id": 73, "topic": "Fiscal Policy & Budget", "question": "Consider the following statements regarding Budget Receipts:\n\n1)Budget Receipts include both Revenue Receipts and Capital Receipts.\n\n2)Taxes, fees and fines are examples of Capital Receipts.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2\n\nAns:A\n\nExp:Budget Receipts :These are the money received by the government from various sources during a financial year.\n\nTypes of Budget Receipts:\n\nRevenue Receipts:Revenue receipts are regular, everyday earnings. They do not create any debt or lower the\ngovernment’s property or assets.\n\nTypes:\n\n    •      Tax Revenue: Money collected through taxes -a)Direct taxes : Income Tax etc, b) Indirect taxes- GST,\n           Customs Duty, etc.\n    •      Non-Tax Revenue: Revenue received other than taxes - through Fees, fines, penalties, interest on loan given\n           ,profits from PSUs & dividends, etc.\n\nCapital Receipts:Receipts that either create a liability or reduce government assets.\n\nCapital Receipts are further divided into:"}, "answer": "A", "explanation": "Types of Budget Receipts:\n\nRevenue Receipts:Revenue receipts are regular, everyday earnings. They do not create any debt or lower the\ngovernment’s property or assets.\n\nTypes:\n\n    •      Tax Revenue: Money collected through taxes -a)Direct taxes : Income Tax etc, b) Indirect taxes- GST,\n           Customs Duty, etc.\n    •      Non-Tax Revenue: Revenue received other than taxes - through Fees, fines, penalties, interest on loan given\n           ,profits from PSUs & dividends, etc.\n\nCapital Receipts:Receipts that either create a liability or reduce government assets.\n\nCapital Receipts are further divided into:\n\nA)Debt-Creating Capital Receipts:Create a liability for the government.Eg: Market borrowings, loans from financial\ninstitutions, foreign loans.\n\nB)Non-Debt Capital Receipts:Do not create a liability; they generally reduce government financial assets.Eg:\nRecovery of loans, disinvestment."}, {"id": 74, "topic": "Fiscal Policy & Budget", "question": "Consider the following statements regarding Budget Expenditure:\n\n1)Revenue Expenditure includes salaries, pensions, subsidies and interest payments.\n\n2)Capital Expenditure generally creates assets or reduces government liabilities.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "programmes and administrative purposes during a financial year.\n\nTypes of Budget Expenditure\n\nBudget Expenditure is mainly divided into two types:\n\nRevenue Expenditure:Expenditure incurred for the normal functioning and day-to-day activities of the government.\nIt generally does not create physical assets or reduce liabilities.\n\n    •      Eg:Salaries and pensions, Subsidies, Interest payments, Administrative expenses,Maintenance expenses\n\nCapital Expenditure:Expenditure that creates assets or reduces government liabilities - long run.\n\n    •      Eg:Construction of roads, bridges and hospitals(Infrastructure),Purchase of machinery and\n           equipment,Investment in infrastructure,Loans given by the government,Repayment of loans taken."}, {"id": 75, "topic": "Fiscal Policy & Budget", "question": "Which of the following deficits represents the excess of total expenditure over total receipts, excluding\nborrowings?", "options": {"A": "Revenue Deficit", "B": "Primary Deficit", "C": "Fiscal Deficit", "D": "Effective Revenue Deficit"}, "answer": "C", "explanation": "Primary Deficit:shows the government’s fiscal imbalance excluding the interest burden on past borrowings.\n\n    •      Primary Deficit = Fiscal Deficit – Interest Payments\n    •      It indicates how much of the current fiscal deficit is due to the government’s present financial operations,\n           excluding interest payments on past debt.\n\nRevenue Deficit:occurs when the government’s Revenue Expenditure is greater than its Revenue Receipts.\n\n    •      Revenue Deficit = Revenue Expenditure – Revenue Receipts\n    •      It indicates that the government’s regular income is insufficient to meet its regular expenditure.\n\nFiscal Deficit: represents the total borrowing requirement of the government.\n\n    •      Fiscal Deficit = Total Expenditure – Total Receipts excluding Borrowings\n    •      A higher fiscal deficit generally means the government needs to borrow more to finance the gap between\n           expenditure and receipts.\n\nEffective Revenue Deficit = Revenue Deficit – Grants for Creation of Capital Assets\n\n           •   These grants are classified as revenue expenditure in the government’s accounts but are used by the\n               recipient to create capital assets.\n\nNote:\n\nEffective Capital Expenditure=Capital Expenditure+Grants given to states for creation of capital assets.\n\nDeficit Financing:It is a situation where government Expenditure is higher than its revenue.It is a practice adopted\nfor financing the excess expenditure with outside resources by either printing of additional currency or through\nborrowing.\n\nNote:Fiscal Deficit = How much is the gap? Deficit Financing = How is the gap financed?"}, {"id": 76, "topic": "Fiscal Policy & Budget", "question": "Consider the following statements regarding Fiscal Stimulus and Fiscal Consolidation:\n\n1)Fiscal stimulus involves increasing government expenditure or reducing taxes to boost economic activity.\n\n2)Fiscal consolidation aims to reduce the fiscal deficit and improve the government’s fiscal position.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "Fiscal Stimulus: Fiscal stimulus refers to government measures taken to increase economic activity and aggregate\ndemand, especially during a recession or economic slowdown. The government may increase public expenditure,\nreduce taxes or provide financial support to encourage consumption, investment and employment.\n\nFiscal Consolidation: Fiscal consolidation refers to measures taken by the government to reduce the fiscal deficit,\ncontrol public debt and strengthen government finances. It can be achieved through increasing government revenue,\nimproving tax collection, reducing unnecessary expenditure and managing subsidies effectively."}, {"id": 77, "topic": "Fiscal Policy & Budget", "question": "Which of the following best describes Public Debt?", "options": {"A": "Public Debt is the total amount of money owed by the government due to its past borrowings.", "B": "Public Debt is the total tax revenue collected by the government.", "C": "Public Debt is the total expenditure incurred by the government on development.", "D": "Public Debt is the total value of government-owned assets."}, "answer": "A", "explanation": "sources.\n\nMain sources include:\n\n    •      Government securities\n    •      Treasury Bills\n    •      Loans from financial institutions\n    •      External loans\n\nPublic debt is used to finance budget deficits, infrastructure and development expenditure.\n\nExcessive public debt can increase the government’s interest burden and affect fiscal stability."}, {"id": 78, "topic": "Fiscal Policy & Budget", "question": "Consider the following statements regarding the Fiscal Responsibility and Budget Management (FRBM) Act,\n2003:\n\n1).It aims to promote fiscal discipline and reduce fiscal deficits.\n\n2)It aims to improve transparency in government fiscal management.\n\n3)It completely prohibits government borrowing.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "The FRBM Act, 2003 was enacted to promote fiscal discipline, reduce excessive government borrowing and\ndeficits, improve transparency in fiscal management, and ensure long-term fiscal sustainability.\n\nImportant Points\n\n    •      Year: Enacted in 2003; came into force on 5 July 2004.\n    •      Main purpose: To control fiscal deficit, revenue deficit and public debt.\n    •      Fiscal discipline: Prevents the government from excessive borrowing and uncontrolled expenditure.\n    •      Fiscal transparency: Government has to present important fiscal information and medium-term fiscal\n           projections.\n    •      Debt sustainability: Aims to keep government debt and borrowing at sustainable levels.\n\nFeatures :\n\n    •      Original fiscal deficit target: 3% of GDP by March 2021.\n    •      Present FY 2026–27 target: 4.3% of GDP\n    •      Debt target: The framework envisaged 60% of GDP for general government debt — 40% Centre + 20%\n           States.\n\n4 Documents to be submitted annually under FRBM –\n\n           • Medium-Term Fiscal Policy Statement (MTFPS)\n           • Fiscal Policy Strategy Statement (FPSS)\n           • Macro-Economic Framework Statement (MEFS)\n           • Medium-Term Expenditure Framework Statement (MTEFS)\n    •      Escape Clause: Fiscal targets can be relaxed in exceptional circumstances such as national security, war,\n           national calamity or severe economic slowdown, subject to legal conditions.\n    •      N.K. Singh Committee: In 2016, it reviewed the FRBM framework and recommended a debt-based fiscal\n           framework and a Fiscal Council."}, {"id": 79, "topic": "Fiscal Policy & Budget", "question": "What does the Fiscal Multiplier measure?", "options": {"A": "The change in national income/output resulting from a change in government expenditure", "B": "The change in tax revenue resulting from inflation", "C": "The change in money supply resulting from interest rates", "D": "The change in exports resulting from exchange rates"}, "answer": "A", "explanation": "expenditure.\n\n    •      Formula: Fiscal Multiplier = Change in National Income ÷ Change in Government Expenditure.\n    •      For example, if government spending increases by ₹100 crore and national income increases by ₹200 crore,\n           the multiplier is 2."}, {"id": 80, "topic": "Money & Monetary Policy", "question": "Which of the following is NOT a motive for holding money according to Keynes’ Liquidity Preference Theory?", "options": {"A": "Transaction Motive", "B": "Precautionary Motive", "C": "Speculative Motive", "D": "Investment Motive"}, "answer": "D", "explanation": "People hold money for three motives:\n\n1. Transaction motive – for daily expenses\n\n2. Precautionary motive – for emergencies\n\n3. Speculative motive – to take advantage of future interest rate changes\n\nRelation:\n\n● When interest rates are low → people prefer holding cash\n\n● When interest rates are high → people invest in bonds and financial assets\n\nThus, the interest rate is determined by demand and supply of money."}, {"id": 81, "topic": "Money & Monetary Policy", "question": "Consider the following statements regarding Fiat Money and Legal Tender Money:\n\n1)Fiat money has intrinsic value and derives its acceptability mainly from government authority and public\nconfidence.\n\n2)Legal tender is money that is legally recognized for settling debts and must be accepted as prescribed by law.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "B", "explanation": "Fiat Money: Money that has no significant intrinsic value ( = Value of the thing itself).and gets its value mainly from\ngovernment authority and public confidence.\n\n    •      Not backed by gold or any physical commodity.\n    •      Value depends on government recognition + public trust.\n    •      Most modern currencies are fiat money.\n    •      Eg: ₹100/₹500 note, US Dollar, Euro, Japanese Yen.(Value by govt.credibility).\n\nLegal Tender: Money that is legally recognized for making payments and settling debts.\n\n    •      Recognized by law as a means of payment.\n    •      Can be used to settle financial obligations, subject to applicable legal rules.\n    •      Most modern currency is both fiat money and legal tender.\n    •      Eg: Indian currency notes and coins that have legal-tender status, US Dollar, Euro."}, {"id": 82, "topic": "Money & Monetary Policy", "question": "Which of the following best describes Monetary Policy?", "options": {"A": "Policy of the government regarding taxation and public expenditure", "B": "Policy of the central bank to regulate money supply, credit and interest rates to achieve economic objectives", "C": "Policy related to international trade and exports", "D": "Policy related to government borrowing only"}, "answer": "B", "explanation": "economy. In India, it is formulated and implemented by the Reserve Bank of India (RBI). Its major objectives\ninclude price stability, controlling inflation, supporting economic growth and maintaining financial stability."}, {"id": 83, "topic": "Money & Monetary Policy", "question": "Consider the following statements regarding Expansionary and Contractionary Monetary Policy:\n\n1)Expansionary monetary policy is generally used to boost economic activity during a slowdown or recession.\n\n2)Contractionary monetary policy is generally used to control high inflation by reducing demand and credit\navailability.", "options": {"A": "1 only", "B": "Both 1 and 2", "C": "2 only", "D": "Neither 1 nor 2"}, "answer": "B", "explanation": "ansionary Monetary Policy:\n\nUsed mainly during recession or economic slowdown.\n\nRBI may:\n\n    •      Reduce policy interest rates.\n    •      Increase liquidity.\n    •      Make borrowing cheaper.\n\nResult: Credit ↑ – Investment/Consumption ↑ – Aggregate Demand ↑\n\nContractionary Monetary Policy:\n\nUsed mainly when inflation is high.\n\nRBI may:\n\n    •      Increase policy interest rates.\n    •      Reduce excess liquidity.\n    •      Make borrowing more expensive.\n\nResult: Credit ↓ - Spending ↓ – Aggregate Demand ↓ – Inflationary pressure ↓"}, {"id": 84, "topic": "Money & Monetary Policy", "question": "Consider the following statements regarding Government Securities (G-Secs) and Treasury Bills (T-Bills):\n\n1)Government Securities are debt instruments issued by the government to borrow money from investors.\n\n2)Treasury Bills are Long -term government securities with a maturity of more than one year.\n\n3)Treasury Bills are generally issued at a discount and redeemed at their face value.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "C", "explanation": "borrow money from investors.\n\n    •    Issued by the Central or State Government.\n    •    Investors can include banks, financial institutions and other investors.\n    •    Used to meet government financing needs, including financing the fiscal deficit.\n    •    Generally, longer-term government securities carry interest (coupon).\n    •    Government repays the principal at maturity.\n    •    Considered relatively low-risk because they are backed by the government.\n\nExample: Government needs ₹1,000 crore → it issues G-Secs → investors lend ₹1,000 crore → government pays\ninterest and repays the principal at maturity.\n\nTreasury Bills (T-Bills)\n\nDefinition: Treasury Bills are short-term government securities issued to meet the government’s short-term financial\nrequirements.\n\nThere are 3 main types:\n\n    •    91-Day T-Bill → Maturity of 91 days\n    •    182-Day T-Bill → Maturity of 182 days\n    •    364-Day T-Bill → Maturity of 364 days\n\nMaturity: Always less than 1 year.\n\n    •    Issued at discount: Sold for less than their face value.\n    •    No regular interest: They generally do not pay periodic coupon interest.\n    •    Redeemed at face value: Government pays the full face value at maturity.\n    •    Return: The difference between the purchase price and face value is the investor’s return.\n\nExample:Face Value = ₹100\n\nPurchase Price = ₹98;Maturity Value = ₹100; Investor’s return = ₹2"}, {"id": 85, "topic": "Money & Monetary Policy", "question": "Match the following related to Quantitative tools:\n\n Quantitative Tools                                         Definition/Meaning\n 1)CRR                                                      A)Rate at which RBI lends to banks against securities\n 2)SLR                                                      B)Minimum liquid assets maintained by banks\n 3)Bank Rate                                                C)Cash reserve maintained with RBI\n 4)Repo Rate                                                D)Long-term lending rate of RBI\n 5)Reverse Repo Rate                                        E)Rate at which RBI borrows from banks\nSelect the Code:", "options": {"A": "1-C, 2-B, 3-D, 4-A, 5-E", "B": "1-B, 2-C, 3-A, 4-D, 5-E", "C": "1-C, 2-D, 3-B, 4-E, 5-A", "D": "1-A, 2-B, 3-C, 4-E, 5-D"}, "answer": "A", "explanation": "Cash Reserve Ratio(CRR):CRR is the portion of a bank’s deposits that must be maintained as cash balance with\nRBI. Banks cannot normally use this amount for lending.No interest paid on CRR.\n\n    •      Current CRR set by RBI :3%\n\nEg:100₹ deposits in a bank so that bank keeps 3₹ rupees with them and 97 ₹ can lend .\n\n    •      CRR ↑ –Bank lending↓ – Liquidity(money supply)↓ – Credit ↓ – Demand ↓ – Inflation ↓\n    •      CRR ↓ – Bank lending↑ – Liquidity ↑ – Credit ↑ – Growth ↑\n\nStatutory Liquidity Ratio ( SLR):SLR is the percentage of a bank’s Net Demand and Time Liabilities (NDTL) that it\nmust maintain in the form of liquid assets. Liquid assets include: Cash, Gold, Approved government securities.\n\nNDTL:A bank’s total demand deposits + time deposits, after certain adjustments.\n\n    •      Demand Liabilities: Money customers can withdraw when needed.Eg: Current account, Savings account\n    •      Time Liabilities: Money kept with the bank for a fixed period.Eg: Fixed Deposit (FD)\n\nCurrent SLR is 18%.Eg:NDTL = ₹100 crore (simplified example)\n\nIf SLR = 18% → Bank maintains ₹18 crore as liquid assets.\n\n    •      SLR ↑ – Lending ↓ – Money Supply ↓ – Inflation ↓\n    •      SLR ↓ – Lending ↑ – Money Supply ↑ – Economic Activity ↑\n\nBank Rate:Bank Rate is the rate at which the RBI lends money to commercial banks for longer-term purposes\nwithout Collateral.\n\n    •      Bank Rate ↑ – Borrowing cost for banks ↑ – Lending rates ↑ – Loans ↓ – Credit/Money supply ↓ – Inflation\n           ↓\n    •      Bank Rate ↓ – Borrowing cost for banks ↓ – Lending rates ↓ – Loans ↑ – Credit/Money supply ↑ –\n           Economic Growth ↑\n\nRepo Rate:Repo rate is the interest rate at which the RBI lends short-term money to commercial banks against\neligible securities.\n\n    •      Repo rate ↑ – Bank borrowing becomes costly – Loans become costly – Money supply/credit ↓ – Inflation\n           ↓\n    •      Repo rate ↓ – Bank borrowing becomes cheaper – Loans become cheaper – Credit & spending ↑ –\n           Economic growth ↑\n    •      Current Repo rate:5.25%\n\nReverse Repo Rate:the interest rate at which the RBI borrows money from commercial banks by providing eligible\nsecurities as part of the transaction.\n\n    •      Reverse Repo Rate ↑ – Banks park more surplus money with RBI – Banks have less money to lend –\n           Credit/Money supply ↓ – Demand ↓ – Inflation ↓\n    •      Reverse Repo Rate ↓ – Banks park less money with RBI – More money available for lending –\n           Credit/Money supply ↑ – Demand ↑ – Economic activity ↑"}, {"id": 86, "topic": "Money & Monetary Policy", "question": "Consider the following statements regarding Open Market Operations (OMO), MSF and SDF:\n\n    1) Open Market Operations (OMO) involve the RBI buying or selling government securities in the open\n       market to influence liquidity in the banking system.\n    2) Marginal Standing Facility (MSF) allows eligible banks to borrow overnight funds from the RBI against\n       eligible securities, generally at a rate above the repo rate.\n    3) Standing Deposit Facility (SDF) allows banks to deposit surplus funds with the RBI without providing\n       collateral.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Open Market Operations (OMO):OMO means RBI buying or selling Government Securities (G-Secs) in the open\nmarket to manage liquidity.\n\n    •      RBI buys G-Secs → Pays money to banks → Liquidity increases →Lending Increases\n\n    •      RBI sells G-Secs → Banks pay money to RBI →Liquidity decreases→ Lending Reduces→\n\nMSF – Marginal Standing Facility: MSF is a facility through which commercial banks can borrow short-term money\nfrom RBI, usually against eligible securities, when they need funds urgently.\n\n    •      Borrower: Commercial Banks\n    •      Lender: RBI\n    •      Purpose: Meet short-term liquidity needs\n    •      Interest rate: MSF Rate\n    •      MSF rate is generally higher than the Repo Rate.\n    •      It acts as a last-resort source of overnight funds for banks.\n    •      The current Marginal Standing Facility (MSF) rate is 5.50% .\n\nExample:A bank suddenly needs ₹100 crore overnight. It can borrow from RBI under MSF by providing eligible\nsecurities.\n\nSDF – Standing Deposit Facility: SDF is a facility through which banks can deposit their surplus money with RBI\nand earn interest.\n\n    •      Depositor: Commercial Banks\n    •      Receiver: RBI\n    •      Purpose: Absorb excess liquidity from the banking system.\n    •      Banks do not need to provide collateral to RBI under SDF.\n    •      SDF Rate is the interest rate paid by RBI to banks.\n    •      The Standing Deposit Facility (SDF) rate is 5.00%\n\nExample:A bank has excess ₹100 crore and does not want to lend it immediately. It can deposit the money with RBI\nthrough SDF and earn interest."}, {"id": 87, "topic": "Money & Monetary Policy", "question": "Who sets the inflation target under India’s Inflation Targeting Framework?", "options": {"A": "The RBI Governor", "B": "The Government of India in consultation with the RBI", "C": "The Monetary Policy Committee (MPC)", "D": "The Ministry of Finance alone"}, "answer": "B", "explanation": "for setting the policy repo rate to achieve the target. India’s current flexible inflation target is 4% CPI inflation, with\na tolerance band of 2%–6%."}, {"id": 88, "topic": "Money & Monetary Policy", "question": "Who sets the Policy Interest rate (repo rate)in India?", "options": {"A": "The RBI Governor", "B": "The Government of India in consultation with the RBI", "C": "The Monetary Policy Committee (MPC)", "D": "The Ministry of Finance alone"}, "answer": "C", "explanation": "interest rate (Repo Rate) to maintain price stability while keeping growth in mind.\n\n    •      Established: 2016 under the RBI Act, 1934 (amended in 2016).\n    •      Members: 6 members.\n               ➢ RBI Governor: Chairperson of the MPC.\n               ➢ RBI members: 3 members from RBI.\n               ➢ Government nominees: 3 members appointed by the Central Government.\n    •      Main function: Decide the policy repo rate to achieve the inflation target.\n    •      Primary objective: Maintain price stability.\n    •      Meetings: At least 4 times a year.\n    •      Decision: Based on majority vote.\n    •      Casting vote: RBI Governor has a casting vote in case of a tie."}, {"id": 89, "topic": "Inflation", "question": "Which of the following statements about Inflation is correct?", "options": {"A": "Inflation means a sustained decrease in the general price level.", "B": "Inflation always increases the purchasing power of money.", "C": "Inflation refers to a sustained increase in the general price level of goods and services.", "D": "Inflation occurs only when the prices of food items increase."}, "answer": "C", "explanation": "the purchasing power of money generally falls, meaning the same amount of money buys fewer goods and services.\nInflation is not limited to food prices; it can affect goods and services across the economy."}, {"id": 90, "topic": "Inflation", "question": "Which of the following pairs are correctly matched based on the causes of Inflation?\n\n1)Demand-Pull Inflation – Excess aggregate demand\n\n2)Cost-Push Inflation – Increase in production costs\n\n3)Built-in Inflation – Wage-price spiral and inflation expectations", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "•      Demand-Pull Inflation: It occurs when aggregate demand exceeds the economy’s ability to produce goods\n           and services. In simple words, too much demand chasing too few goods causes prices to rise.\n    •      Cost-Push Inflation: It occurs when the cost of production increases, such as wages, raw materials, fuel and\n           electricity. Producers may increase the prices of goods and services to cover these higher costs.\n    •      Built-in Inflation: It is associated with inflation expectations and the wage-price spiral. Workers demand\n           higher wages because they expect prices to rise, while firms may increase prices to cover higher wage\n           costs. This can lead to further wage demands.\n           Wage demands ↑ - Production Cost ↑ - Prices ↑"}, {"id": 91, "topic": "Inflation", "question": "Consider the following statements regarding Headline Inflation and Core Inflation:\n\n1)Headline inflation measures the overall change in prices of goods and services in the economy.\n\n2)Core inflation excludes volatile items such as food and energy to show the underlying inflation trend.\n\n3)Core inflation is always higher than headline inflation.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "•      Includes food , fuel/energy + other items.\n    •      Can change quickly because food and fuel prices are volatile.\n\nCore Inflation:Inflation measured after excluding highly volatile items, mainly food and energy/fuel, to understand\nthe underlying inflation trend.\n\n    •      Usually excludes food + energy.\n    •      Less affected by temporary price shocks.\n    •      Useful for understanding the longer-lasting trend in prices.\n\nNote:Core inflation is not always higher than headline inflation. If food and energy prices rise sharply, headline\ninflation may be higher. If these prices fall, headline inflation may be lower than core inflation."}, {"id": 92, "topic": "Inflation", "question": "Which of the following best describes Imported Inflation?", "options": {"A": "Increase in prices due to a rise in domestic production", "B": "Increase in domestic price levels due to higher prices of imported goods and inputs", "C": "Decrease in prices due to lower government expenditure", "D": "Increase in employment due to higher exports"}, "answer": "B", "explanation": "and ultimately raise domestic prices. A depreciation of the domestic currency can worsen imported inflation because\nimports become more expensive.\n\n    •      Imports costly–Production costly–Domestic Prices rise."}, {"id": 93, "topic": "Inflation", "question": "Which type of inflation is generally characterized by an extremely rapid and uncontrolled rise in prices, often\nexceeding 50% per month?", "options": {"A": "Creeping Inflation", "B": "Walking Inflation", "C": "Galloping Inflation", "D": "Hyperinflation"}, "answer": "D", "explanation": "•      Creeping Inflation – <3%per year: A very slow and mild rise in the general price level. It usually has a\n           limited effect on purchasing power.\n    •      Walking Inflation – 3–7% per year : A moderate rise in the general price level, where prices increase at a\n           noticeable but manageable rate.\n    •      Running Inflation – 7–10% per year:A rapid rise in the general price level that significantly reduces the\n           purchasing power of money.\n    •      Galloping Inflation -more than 10% (10-20% per year): A very rapid rise in prices, which can create serious\n           economic instability and reduce the value of money quickly.\n    •      Hyperinflation – Generally >50% per month: An extremely rapid and uncontrolled rise in the general price\n           level, causing money to lose its value very quickly."}, {"id": 94, "topic": "Inflation", "question": "Match the following inflation-related concepts with their descriptions:\n\n        Situations                                              Definition/Meaning\n        1)Stagflation                                           A)Reduction in the rate of increase in general price\n                                                                level\n        2)Deflation                                             B)Simultaneous existence of inflation and economic\n                                                                stagnation\n        3)Disinflation                                          C)Sustained decline in the general price level\n        4)Reflation                                             D)Policy measures to revive demand, output and\n                                                                prices\nSelect the Code:", "options": {"A": "1-D, 2-B, 3-C, 4-A", "B": "1-C, 2-A, 3-D, 4-B", "C": "1-A, 2-C, 3-B, 4-D", "D": "1-B, 2-C, 3-A, 4-D"}, "answer": "D", "explanation": "•   Inflation – Prices ↑\n           •   Economic growth – Very low/stagnant\n           •   Unemployment – High\n           •   Creates a difficult policy situation because controlling inflation may further weaken growth.\n\nDeflation:Deflation is a sustained fall in the general price level of goods and services in an economy.Prices still ↑,\nbut inflation rate ↓\n\n    •      General prices ↓\n    •      Inflation rate becomes negative\n    •      Demand and economic activity may weaken\n    •      Businesses may reduce production and investment\n    •      Unemployment may increase\n\nDisinflation:Disinflation means a slowdown in the rate of inflation. Prices are still rising, but they are rising more\nslowly.\n\nEg:Inflation = 8% → 5% → 3%\n\n    •      Prices are still increasing, but the rate of increase is falling.\n\nReflation: means deliberately increasing economic activity and the general price level after a period of low inflation,\ndeflation, or economic slowdown.\n\n    •      Government may increase public expenditure or reduce taxes.\n    •      Central bank may reduce interest rates to encourage borrowing and spending."}, {"id": 95, "topic": "Inflation", "question": "Which of the following best describes the GDP Deflator?", "options": {"A": "It measures unemployment in an economy", "B": "It measures only food prices", "C": "It measures the overall price change of domestically produced final goods and services", "D": "It measures total government expenditure"}, "answer": "C", "explanation": "compare Nominal GDP and Real GDP.\n\nGDP Deflator = (Nominal GDP ÷ Real GDP) × 100\n\nNote:\n\n    •      Nominal GDP: GDP measured using current year prices.Nominal GDP = Current Year Price × Current Year\n           Quantity\n    •      Real GDP: GDP measured using base-year prices.Real GDP = Base Year Price × Current Year Quantity"}, {"id": 96, "topic": "Inflation", "question": "Consider the following statements regarding CPI and WPI:\n\n1)CPI measures changes in prices of goods and services at the consumer level.\n\n2)WPI measures changes in prices mainly at the wholesale level and covers goods and services.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "A", "explanation": "•      CPI is released by the National Statistical Office (NSO) under the Ministry of Statistics and Programme\n           Implementation (MoSPI).\n    •      CPI is based on a basket of goods and services commonly consumed by households.\n\nMajor groups include:\n\n    •      Food and Beverages\n    •      Pan, Tobacco and Intoxicants\n    •      Clothing and Footwear\n    •      Housing\n    •      Fuel and Light\n    •      Services\n\nCPI=(Cost of basket in Current Year ÷Cost of basket in Base year )x 100\n\n    •      The current CPI series uses 2024(100) as base year.\n    •      Higher CPI → higher inflation → purchasing power decreases.\n\nWholesale price index (WPI):WPI measures the average change in prices of goods at the wholesale level.\n\n    •      In India, WPI is released by the Office of Economic Adviser, DPIIT, Ministry of Commerce & Industry.\n    •      Current WPI base year: 2022–23 = 100.\n    •      Only goods covered.\n\nMain Groups:\n\n    •      Primary Articles → Food items, non-food items, minerals\n    •      Fuel & Power → Coal, petroleum products, electricity\n    •      Manufactured Products → Textiles, chemicals, metals, machinery, etc.\n\n    WPI=(Cost of basket in Current Year ÷Cost of basket in Base Year) x 100"}, {"id": 97, "topic": "Inflation", "question": "Which of the following best describes an Inflationary Gap?", "options": {"A": "The difference between exports and imports", "B": "The difference between actual and potential employment", "C": "The excess of government revenue over government expenditure", "D": "The excess of aggregate demand over the level of aggregate demand required to achieve full-employment output"}, "answer": "D", "explanation": "output. This excess demand puts upward pressure on prices, leading to inflation. It can be reduced through\ncontractionary fiscal or monetary policy."}, {"id": 98, "topic": "Inflation", "question": "Which of the following best describes the Phillips Curve?", "options": {"A": "It shows the relationship between savings and investment.", "B": "It shows the relationship between money supply and interest rate.", "C": "It shows an inverse relationship between inflation and unemployment in the short run.", "D": "It shows the relationship between government revenue and expenditure."}, "answer": "C", "explanation": "especially in the short run.\n\n           •   Inflation ↑ – Unemployment ↓\n           •   Inflation ↓ – Unemployment ↑\n\nIn the long run, the Phillips Curve is generally vertical at the natural rate of unemployment.\n\n    •      If demand in the economy increases, firms produce more and hire more workers , unemployment falls, but\n           prices may rise → inflation increases"}, {"id": 99, "topic": "Inflation", "question": "Which of the following best describes the Money Multiplier?", "options": {"A": "The increase in money supply resulting from an increase in the monetary base", "B": "The total amount of money printed by the government", "C": "The ratio of government expenditure to government revenue", "D": "The total amount of currency held by the public"}, "answer": "A", "explanation": "increase in bank reserves through repeated lending and redepositing.\n\n    •      Money Multiplier=1/Reserve Ratio\n    •      Reserve Ratio ↑ – Money Multiplier ↓\n    •      Reserve Ratio ↓ – Money Multiplier ↑\n\nReserve Ratio generally refers to the fraction of deposits banks are required to keep as reserves."}, {"id": 100, "topic": "External Sector & Forex", "question": "Which of the following best describes the Balance of Trade (BoT)?", "options": {"A": "The difference between a country’s total exports and total imports of goods", "B": "The difference between total government revenue and expenditure", "C": "The difference between capital inflows and capital outflows", "D": "The difference between exports of goods and services"}, "answer": "A", "explanation": "during a financial year.\n\nFormula:\n\nBoT = Exports of Goods – Imports of Goods\n\n    •      Exports > Imports → Trade Surplus\n    •      Imports > Exports → Trade Deficit\n    •      Exports = Imports → Balanced Trade\n\nIndia’s current trade deficit –India imported about $15.3 billion more than it exported in June 2026.It increased\nsharply from $2.89 billion in June 2025.\n\nReasons :\n\n    •      Higher crude oil & commodity prices – India’s import bill increased.\n    •      West Asia conflict & Strait of Hormuz disruptions – raised energy and freight costs.\n    •      High imports of electronics, gold and other goods also increased the import bill."}, {"id": 101, "topic": "External Sector & Forex", "question": "Which of the following best describes the Balance of Payments (BoP)?", "options": {"A": "The difference between exports and imports of goods only", "B": "The total government revenue and expenditure", "C": "A systematic record of all economic transactions between a country and the rest of the world", "D": "The total foreign exchange reserves of a country"}, "answer": "C", "explanation": "country and the rest of the world during financial year.Covers goods, services, income, transfers and financial\ntransactions.\n\nMain components:\n\nCurrent Account – Goods, services, income and transfers.\n\n      •   Goods:Exports &imports of physical goods .(BoT)\n      •   Services: International transactions involving services-IT Services,Tourism, Banking, Insurance, Transport,\n          Consultancy\n      •   Primary Income:Income earned from factors of production across borders.Eg:Interests, Profits , dividends\n          compensation of employees.\n      •   Secondary Income/Current Transfers: Transfers where nothing is received directly in return.Eg:\n          Remittances, Gifts, Donations, Grants for Current Purposes.\n\nCapital Account & Financial Account – BoP\n\nCapital Account:Records capital transfers and transactions in non-produced, non-financial assets.\n\nEg:\n\n      •   Debt forgiveness\n      •   Capital transfers\n      •   Transfer of ownership of certain non-produced assets, such as patents/trademarks.\n\nFinancial Account:Records transactions involving financial assets and liabilities between residents and the rest of the\nworld.\n\nExamples:\n\n      •   Foreign Direct Investment (FDI)\n      •   Foreign Portfolio Investment (FPI)\n      •   Loans\n      •   Banking capital\n      •   Changes in foreign exchange reserves\n\nBoP helps understand a country’s external sector."}, {"id": 102, "topic": "External Sector & Forex", "question": "Consider the following statements regarding FDI and FPI:\n\n1)FDI generally involves a long-term interest and significant influence or control in a foreign business.\n\n2)FPI mainly involves investment in financial assets such as shares and bonds without seeking direct management\ncontrol.\n\n3)FDI and FPI are both recorded under the Financial Account of the Balance of Payments.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "Definition: Investment made by a foreign individual or company in a business of another country with a long-term\ninterest and significant influence or control.Eg: A US company establishes a manufacturing plant in India.\n\n    •      Usually long-term investment.\n    •      Investor has significant influence/control over the business.\n    •      Brings capital, technology and managerial skills.\n    •      Can create employment and increase production.\n    •      Recorded under the Financial Account of BoP.\n    •      The top 5 countries for Foreign Direct Investment (FDI) equity inflows into India are Mauritius\n           ,Singapore,,USA, Netherlands, Japan.\n    •      FDI regulated by DPIIT → FDI policy and overall framework; RBI → regulates FDI transactions/foreign\n           exchange under FEMA.\n\nFPI – Foreign Portfolio Investment\n\nMeaning: Investment made by a foreign investor in financial securities of another country, such as shares, bonds and\nother securities, without direct management control.\n\n    •      Example: A US investor buys shares of an Indian company through the stock market.\n    •      Mainly investment in financial assets.\n    •      No direct management control.\n    •      Generally more liquid and easier to withdraw.\n    •      Mainly aimed at earning financial returns.\n    •      Recorded under the Financial Account of BoP.\n\n    •      FPI regulated by SEBI → regulates Foreign Portfolio Investors (FPIs) in Indian securities markets; RBI\n           also has a role in foreign-exchange-related matters."}, {"id": 103, "topic": "External Sector & Forex", "question": "Which of the following is NOT a component of India’s Foreign Exchange Reserves?", "options": {"A": "Foreign Currency Assets (FCA)", "B": "Gold Reserves", "C": "Special Drawing Rights (SDRs)", "D": "Foreign Direct Investment (FDI)"}, "answer": "D", "explanation": "by a country’s central bank to meet international payment needs and maintain stability in the foreign exchange\nmarket.\n\n4 Main Components\n\n    •      Foreign Currency Assets (FCA) – assets held mainly in foreign currencies such as US Dollar, Euro, Pound\n           and Yen.\n    •      Gold Reserves – gold held by the RBI.\n    •      Special Drawing Rights (SDRs) – international reserve asset created by the IMF.\n    •      Reserve Tranche Position (RTP) – India’s reserve position with the IMF.\n\nNote :SDR\n\nSDR = International reserve asset created by the IMF in 1969.\n\n    •      It is not a currency and cannot be used directly for buying goods/services.\n    •      SDR is based on a basket of 5 currencies: US Dollar, Euro, Chinese Yuan, Japanese Yen, Pound Sterling.\n    •      Purpose: To supplement member countries’ official foreign exchange reserves.\n    •      Allocation: IMF allocates SDRs to member countries according to their IMF quota.\n    •      Interest: SDR holders earn interest on their holdings; countries using more SDRs than allocated pay\n           interest.\n    •      Exchange: SDR can be exchanged for freely usable currencies through IMF arrangement.\n\nEg:India needs foreign currency for an international payment. It can exchange its SDRs for US Dollars, Euros, Yuan,\nYen or Pounds and make the payment.\n\nNote:\n\n    •      India: Foreign exchange reserves are managed by the RBI. The RBI manages them with Safety →\n           Liquidity → Return as the priorities.\n    •      Latest figure: RBI reported India’s total forex reserves at about US$684.2 billion as of 14 August 2026."}, {"id": 104, "topic": "External Sector & Forex", "question": "Which of the following best describes the Foreign Exchange Rate?", "options": {"A": "The rate at which one country’s currency is exchanged for another country’s currency", "B": "The rate at which goods are exchanged within a country", "C": "The rate of interest charged by the RBI on government loans", "D": "The rate at which taxes are collected on imports"}, "answer": "A", "explanation": "Example: If US$1 = ₹85, it means ₹85 is required to buy 1 US Dollar."}, {"id": 105, "topic": "External Sector & Forex", "question": "Consider the following statements regarding Exchange Rate Systems:\n\n    1) Fixed Exchange Rate – The exchange rate is maintained at a predetermined level by the government or\n       central bank.\n    2) Flexible (Floating) Exchange Rate – The exchange rate is mainly determined by the demand and supply of\n       foreign exchange in the market.\n    3) Managed Floating Exchange Rate – The exchange rate is mainly market-determined, but the central bank\n       may intervene to reduce excessive fluctuations.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1, 2 and 3"}, "answer": "D", "explanation": "its currency at a predetermined rate against another currency or a basket of currencies.\n\n    •      Exchange rate is fixed/pegged by the authority.\n    •      Central bank intervenes in the foreign exchange market.\n    •      Foreign exchange reserves are used to maintain the fixed rate.\n    •      Provides greater exchange-rate stability for international trade and investment.\n    •      Requires sufficient foreign exchange reserves.\n\nExample: If a country fixes its currency at $1 = ₹80, the central bank takes measures to maintain that rate.\n\nFlexible / Floating Exchange Rate: An exchange rate system in which the value of a currency is mainly determined\nby demand and supply in the foreign exchange market.\n\n    •      No fixed official exchange rate.\n    •      Currency value changes according to market forces.\n    •      Demand for currency ↑ → currency tends to appreciate.\n    •      Demand for currency ↓ → currency tends to depreciate.\n\nEg: If demand for the Indian Rupee increases, the rupee may appreciate against the US Dollar.\n\nManaged Floating Exchange Rate: A system where the exchange rate is mainly determined by market forces, but the\ncentral bank intervenes when necessary.\n\n    •      Combination of floating exchange rate + central bank intervention.\n    •      Market forces determine the general direction of the exchange rate.\n    •      Central bank may buy or sell foreign currency to reduce excessive fluctuations.\n    •      Helps maintain greater stability without completely fixing the exchange rate.\n    •      Also called Dirty Float.\n\nEg: If the domestic currency falls sharply, the central bank may sell foreign currency from its reserves to reduce\nexcessive depreciation.\n\nNote:\n\n    •      Appreciation: Currency value increases due to market forces.\n    •      Depreciation: Currency value decreases due to market forces."}, {"id": 106, "topic": "External Sector & Forex", "question": "Match the Following: Currency Value Changes:\n\n Column I                                                    Column II\n 1)Currency Appreciation                                     A)Official increase in the value of a currency under a\n                                                             fixed exchange-rate system\n 2)Currency Depreciation                                     B)Market-driven decrease in the value of a currency\n 3)Currency Devaluation                                      C)Market-driven increase in the value of a currency\n 4)Currency Revaluation                                      D)Official decrease in the value of a currency under a\n                                                             fixed exchange-rate system", "options": {"A": "1-C, 2-B, 3-D, 4-A", "B": "1-B, 2-C, 3-A, 4-D", "C": "1-C, 2-D, 3-B, 4-A", "D": "1-A, 2-B, 3-D, 4-C"}, "answer": "A", "explanation": "exchange-rate system.\n\nEg:$1 = ₹85 → $1 = ₹80.\n\nThe rupee has appreciated because fewer rupees are needed to buy $1.\n\n    •      Usually market-driven.\n    •      Imports become cheaper.\n    •      Exports become more expensive for foreigners.\n\nCurrency Depreciation : A decrease in the value of a currency due to market forces.\n\nEg:$1 = ₹80 → $1 = ₹85\n\nThe rupee has depreciated because more rupees are needed to buy $1.\n\nImportant Points:\n\n    •      Usually market-driven.\n    •      Imports become costlier.\n    •      Exports become cheaper for foreigners.\n\nCurrency Devaluation : An official reduction in the value of a currency by the government/central bank, generally\nunder a fixed or managed exchange-rate system.\n\nExample:Official rate: $1 = ₹80 → $1 = ₹85.\n\nImportant Points:\n\n    •      Policy decision, not simply market movement.\n    •      Makes exports cheaper and imports costlier.\n    •      Used to improve export competitiveness and external balance in certain circumstances.\n\nCurrency Revaluation : An official increase in the value of a currency by the government/central bank under a fixed\nexchange-rate system.\n\nExample:Official rate: $1 = ₹85 → $1 = ₹80.\n\nImportant Points:\n\n    •      Policy decision.\n    •      Makes imports cheaper.\n    •      Makes exports relatively more expensive."}, {"id": 107, "topic": "External Sector & Forex", "question": "Which of the following best describes Dedollarisation?", "options": {"A": "Increasing the use of the US dollar in global trade", "B": "Reducing dependence on the US dollar in international trade and financial transactions", "C": "Fixed exchange rate between the US dollar and other currencies", "D": "Complete abolition of all foreign currencies"}, "answer": "B", "explanation": "foreign exchange reserves, and financial transactions.\n\n    •      Countries try to use their own currencies or other currencies instead of the US Dollar.\n    •      It may involve increasing the use of local currencies in international trade.\n    •      Countries may diversify their foreign exchange reserves.\n    •      Dedollarisation ≠ complete removal of the US Dollar; it mainly means reducing its dominance or\n           dependence.\n\nEg:If India and another country settle bilateral trade using ₹ and the partner country’s currency instead of US\nDollars, it is an example of dedollarisation."}, {"id": 108, "topic": "External Sector & Forex", "question": "Which of the following is associated with the Washington Consensus?", "options": {"A": "Increase in government ownership and price controls", "B": "Reduction of international trade and foreign investment", "C": "Liberalisation, privatisation and fiscal discipline", "D": "Complete prohibition of foreign capital"}, "answer": "C", "explanation": "1980s–1990s for developing countries facing economic and financial problems.\n\n    •      Note: It is not a formal international treaty or legally binding agreement.\n    •      Origin: The term was coined by economist John Williamson in 1989.\n    •      Associated institutions: IMF, World Bank and U.S. Treasury, which were based in Washington, D.C.\n\nRecommendations:\n\n    •      Fiscal Discipline – Control excessive government deficits.\n    •      Tax Reform – Broaden the tax base and improve tax collection.\n    •      Trade Liberalisation – Reduce restrictions on international trade.\n    •      FDI Liberalisation – Encourage foreign direct investment.\n    •      Privatisation – Reduce government ownership of enterprises.\n    •      Deregulation – Reduce unnecessary government regulations.\n\n    •      Competitive Exchange Rates – Maintain exchange rates that support external competitiveness.\n    •      Market-oriented Reforms – Give greater role to markets and private sector."}, {"id": 109, "topic": "Unemployment", "question": "Which of the following pairs are correctly matched regarding Types of Unemployment?\n\n    1)     Disguised Unemployment – More workers are employed than actually required\n    2)     Structural Unemployment – Mismatch between workers’ skills and available jobs\n    3)     Cyclical Unemployment –caused by Economic slowdown or recession\n    4)     Seasonal Unemployment – Temporary unemployment while searching for or changing jobs", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "1, 2, 3 and 4", "D": "2 and 4 only"}, "answer": "B", "explanation": "find employment.\n\nTypes of Unemployment:\n\n    •      Frictional Unemployment – Temporary unemployment while a person is changing jobs or searching for a\n           new job.Eg: A person leaves one job and searches for another.\n    •      Structural Unemployment – Occurs when workers’ skills do not match the available jobs.Eg: Technology\n           replaces workers whose skills are outdated.\n    •      Cyclical Unemployment – Caused by economic slowdown or recession, when demand and production\n           fall.Eg: Workers lose jobs during a recession.\n    •      Seasonal Unemployment – Occurs when employment is available only during certain seasons.Eg:\n           Agricultural workers during the off-season.\n    •      Disguised Unemployment – More people are employed than actually required; removing some workers\n           does not reduce output. Common in agriculture.\n    •      Underemployment – A person works below their skill level or for fewer hours than they are willing to\n           work.Eg: A graduate working in a job requiring much lower qualifications.\n    •      Educated Unemployment – Educated people are unable to find suitable jobs matching their qualifications.\n    •      Technological Unemployment – Workers lose jobs because of machines, automation or new technology\n           replacing labour."}, {"id": 110, "topic": "Unemployment", "question": "Consider the following statements regarding LFPR, WPR and UR:\n\n    1) LFPR measures the proportion of the population that is part of the labour force, i.e., employed +\n       unemployed persons seeking/available for work.\n    2) UR measures the proportion of the population that is actually employed.\n    3) WPR measures the proportion of the labour force that is unemployed.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "1, 2 and 3", "D": "2 and 3 only"}, "answer": "A", "explanation": "•      LFPR shows the percentage of the population that is participating in the labour force.\n    •      Labour Force = Employed + Unemployed persons who are seeking/available for work\n\nEg:Population = 1,000 ;Employed = 600;Unemployed but seeking work = 100\n\n    •      Labour Force = 600 + 100 = 700\n    •      LFPR = 700/1,000 × 100 = 70%\n\nWPR (Worker Population Ratio) = Employed Persons ÷ Population × 100\n\nWPR shows the percentage of the population that is actually employed/working\n\nEg:Population = 1,000; Employed = 600\n\n    •      WPR = 600/1,000 × 100 = 60%\n\nUR (Unemployment Rate) = Unemployed Persons ÷ Labour Force × 100\n\n    •      UR shows the percentage of unemployed persons within the labour force.\n\nEg:Population = 1,000; Employed = 600; Unemployed but seeking work = 100\n\nUR=(100÷700)x 100\n\n   =14.29%"}, {"id": 111, "topic": "Banking System", "question": "Which of the following is a condition for a bank to be classified as a Scheduled Bank?", "options": {"A": "The bank must be completely owned by the government", "B": "The bank must have paid-up capital and reserves of at least ₹5 lakh", "C": "The bank must provide only agricultural loans", "D": "The bank must have branches in every state"}, "answer": "B", "explanation": "have paid-up capital and reserves of at least ₹5 lakh and satisfy the RBI that its operations are not harmful to\ndepositors and that it follows applicable RBI regulations. Scheduled banks are also eligible for certain RBI facilities:\n\n    •      Eligible for loans/financial assistance from RBI under applicable conditions.\n    •      Access to RBI clearing-house facilities.\n    •      Can participate in RBI’s monetary policy operations.\n    •      Eligible to access repo/other liquidity facilities subject to RBI rules.\n\nNon Scheduled Banks:Non-Scheduled Banks: Banks not included in the Second Schedule of the RBI Act, 1934.\n\n    •      Do not enjoy all privileges of Scheduled Banks.\n    •      Generally smaller in size and operations.\n    •      Still regulated by the RBI under applicable banking laws."}, {"id": 112, "topic": "Banking System", "question": "Which of the following best describes Scheduled Commercial Banks (SCBs)?", "options": {"A": "Banks that are not regulated by the RBI", "B": "Banks included in the Second Schedule of the RBI Act, 1934 and engaged in commercial banking activities", "C": "Banks that provide only agricultural loans", "D": "Banks that cannot accept deposits from the public"}, "answer": "B", "explanation": "1934 and meeting the prescribed conditions. They accept deposits, provide loans and Facilitate payments and\ntransfers, Create credit. Major types include Public Sector Banks, Private Sector Banks, Foreign Banks, RRBs ,\nSmall Finance Banks & Payment banks ."}, {"id": 113, "topic": "Banking System", "question": "Consider the following statements regarding Public Sector Banks and Private Sector Banks:\n\n    1) Public Sector Banks have majority ownership or control with the government.\n    2) Private Sector Banks are mainly owned and controlled by private individuals or entities.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "ownership/control.Regulated by RBI.Objective: Commercial + developmental banking\n\nNote: India has 12 PSBs after the 2020 mergers.\n\n    •      12 PSBs: SBI, Punjab National Bank, Bank of Baroda, Canara Bank, Union Bank of India, Indian Bank,\n           Bank of India, Central Bank of India, UCO Bank, Bank of Maharashtra, Punjab & Sind Bank, Indian\n           Overseas Bank.\n\nPrivate Sector Banks: Banks where majority ownership is held by private shareholders/investors.\n\nTypes:\n\n    •      Old Private Banks: Federal Bank, Karur Vysya Bank\n    •      New Private Banks: HDFC Bank, ICICI Bank, Axis Bank\n\nFeatures:\n\n    •      Technology-driven: Online banking, mobile apps, UPI and digital services are widely used.\n    •      Strong retail banking: Focus more on individual customers, personal loans, home loans, credit cards, etc.\n    •      Aggressive expansion: Try to open more branches, reach new customers and expand services quickly.\n    •      Customer-focused: Emphasis on faster and convenient services to attract and retain customers."}, {"id": 114, "topic": "Banking System", "question": "Consider the following statements regarding Regional Rural Banks, Small Finance Banks and Payments\nBanks:\n\n    1) Regional Rural Banks (RRBs) mainly serve rural areas, farmers, agricultural workers and weaker sections.\n    2) Small Finance Banks (SFBs) are not allowed to provide loans and can only accept deposits.\n    3) Payments Banks mainly provide deposit, payment and remittance services but cannot undertake lending\n       activities.", "options": {"A": "1 only", "B": "1 and 2 only", "C": "1 and 3 only", "D": "2 and 3 only"}, "answer": "C", "explanation": "semi-urban areas.\n\nMain Focus:\n\n    •      Farmers and agricultural workers\n    •      Small and marginal farmers\n    •      Rural entrepreneurs\n    •      Rural Artisans\n    •      Weaker sections\n\nMain Services: Accept deposits, provide agricultural and rural loans, and offer other banking services.\n\n    •      Eg: Andhra Pradesh Grameena Bank, Telangana Grameena Bank, Baroda Rajasthan Kshetriya Gramin\n           Bank.\n\nSmall Finance Banks (SFBs): Specialized banks created mainly to promote financial inclusion by providing banking\nand credit services to underserved sections.\n\nMain Focus:\n\n    •      Small businesses\n    •      Small and marginal farmers\n    •      Micro industries\n    •      Low-income households and underserved customers\n    •      MSMEs\n    •      Unorganised Sector\n\nMain Services: Accept deposits and provide loans.\n\n    •      Eg: AU Small Finance Bank, Equitas Small Finance Bank, Ujjivan Small Finance Bank.\n\nPayments Banks: Banks mainly designed to provide small savings, payments and remittance services, especially\nthrough digital/mobile banking.\n\nMain Services:\n\n    •      Accept deposits, subject to the RBI-prescribed limit(up to 2 lakh)\n    •      Money transfers and remittances\n    •      Digital payments\n    •      Debit/ATM cards\n\nImportant Restriction: Cannot undertake lending activities, annot issue credit cards\n\n    •      Eg: India Post Payments Bank (IPPB), Airtel Payments Bank,Paytm Payments Bank,"}, {"id": 115, "topic": "Banking System", "question": "Which of the following best describes Cooperative Banks in India?", "options": {"A": "Banks owned and controlled entirely by the Central Government", "B": "Banks that cannot accept deposits", "C": "Banks that only provide loans to large industries", "D": "Banks Owned and managed by members of the cooperative society."}, "answer": "D", "explanation": "mainly provide deposits, loans and other banking services to members, farmers, small businesses and local\ncommunities.\n\n    •      Regulated by RBI & State Registrar of Cooperative Societies.\n\nTypes:\n\n1.Urban Cooperative Banks (UCBs)\n\n    •      Mainly operate in urban and semi-urban areas.\n    •      Serve individuals, small businesses and local communities.\n    •      Example: Saraswat Cooperative Bank.\n\n2. Rural Cooperative Banks\n\nMainly serve farmers and rural areas. They have a three-tier structure:\n\n    •      State Cooperative Banks (SCBs): The apex financial institution at the state level that links the\n           RBI/NABARD with local district banks.\n    •      District Central Cooperative Banks (DCCBs): Operate at the district level to finance village societies and\n           manage district liquidity.\n    •      Primary Agricultural Credit Societies (PACS): The grassroots level operating at the village or gram\n           panchayat level to provide direct short-term crop and farming loans."}, {"id": 116, "topic": "Banking System", "question": "Which of the following is an asset for a commercial bank?", "options": {"A": "Customer deposits", "B": "Loans and advances given by the bank", "C": "Money borrowed from RBI", "D": "Shareholders’ funds"}, "answer": "B", "explanation": "Assets of Banks = Things from which the bank earns money or has a claim.\n\n    •      Loans: Money given to customers\n    •      Advances: Credit facilities provided by banks\n    •      Investments: Investment in government securities and other permitted securities\n    •      Cash with RBI: CRR reserves maintained with RBI\n    •      Money at Call: Very short-term funds lent to other banks\n\nLiabilities = Money that the bank owes to others.\n\n    •      Deposits – Savings, current and term deposits; biggest liability (Public Deposits)\n    •      Borrowings – Money borrowed from RBI, other banks or financial institutions (Loans taken )\n    •      Capital – Funds contributed by owners/shareholders.\n    •      Reserves– Profits retained by the banks\n    •      Other Liabilities – Provisions, bills payable and other obligations."}, {"id": 117, "topic": "Banking System", "question": "Match the Following: Types of Bank Deposits\n\n Type of Deposit                                             Meaning/Definition\n 1)Savings Deposits                                          A)Deposit for a fixed period\n 2) Current Deposit                                          B)Mainly for frequent business transactions\n 3)Fixed Deposit                                             C)Mainly for individuals to save money\n 4) Recurring Deposit                                        D)Fixed amount deposited regularly\nSelect the code:", "options": {"A": "1-B, 2-C, 3-D, 4-A", "B": "1-D, 2-A, 3-C, 4-B", "C": "1-C, 2-B, 3-A, 4-D", "D": "1-A, 2-D, 3-B, 4-C"}, "answer": "C", "explanation": "Types of Bank Deposits:\n\nDemand Deposits:Deposits that can be withdrawn at any time without a fixed maturity period.\n\n    •      Savings Deposit:Mainly used by individuals to save money. It generally earns interest and allows\n           withdrawals subject to the bank’s rules. It is suitable for regular personal savings.\n\n    •      Current Deposit:Mainly used by businesses and firms for frequent transactions. Deposits and withdrawals\n           can be made regularly. Usually, current accounts do not offer interest or offer very limited interest,\n           depending on applicable rules..\n\nTime Deposits:Deposits kept with a bank for a fixed period.\n\n    •      Fixed Deposit (FD):A specific amount is deposited for a fixed period at an agreed interest rate. Generally,\n           the longer-term nature allows the depositor to earn interest, with premature withdrawal subject to bank\n           conditions.\n    •      Recurring Deposit (RD):A fixed amount is deposited regularly, usually every month, for a fixed\n           period.Interest is earned on the deposit.It is useful for people who want to build savings gradually."}, {"id": 118, "topic": "Banking System", "question": "Which of the following is the primary role of the Reserve Bank of India (RBI)?", "options": {"A": "Regulating monetary policy and managing the country’s banking and currency system", "B": "Collecting income tax from citizens", "C": "Preparing the Union Budget", "D": "Controlling the production of agricultural goods"}, "answer": "A", "explanation": "•      Established: 1 April 1935 under the Reserve Bank of India Act, 1934.\n    •      Headquarters: Mumbai.\n    •      Nationalised: 1 January 1949.\n\nMajor Functions or Role of RBI:\n\n    •      Currency: RBI issues and manages banknotes, except the ₹1 note, which is issued by the Government of\n           India.\n    •      Monetary Policy: RBI formulates and implements monetary policy to maintain price stability while keeping\n           growth in mind.\n    •      Banker to Government: RBI acts as banker, agent and adviser to the Central and State Governments.\n    •      Banker’s Bank: RBI maintains accounts of banks and provides liquidity/support to the banking system.\n    •      Banking Regulation: RBI regulates and supervises banks and certain financial institutions.\n    •      Lender of Last Resort: RBI provides emergency liquidity assistance to eligible banks when required.\n    •      Foreign Exchange: RBI manages India’s foreign exchange reserves.\n    •      Payment Systems: RBI regulates and oversees payment and settlement systems in India.\n    •      Credit Control: RBI uses tools such as Repo Rate, CRR, SLR, Open Market Operations (OMO) etc. to\n           influence liquidity and credit."}, {"id": 119, "topic": "Banking System", "question": "Who signs the ₹1 currency note in India?", "options": {"A": "RBI Governor", "B": "Finance Secretary, Ministry of Finance", "C": "Secretary, Department of Economic Affairs", "D": "Finance Minister"}, "answer": "B", "explanation": "•      ₹1 note – Issued by Government of India\n    •      ₹1 note signature – Finance Secretary- Ministry of Finance\n    •      Other notes – Issued by RBI\n    •      Other notes signature – RBI Governor\n\nCoins\n\n    •      Coins – Issued by Government of India\n    •      Responsible ministry: Ministry of Finance, Department of Economic Affairs (DEA)\n    •      Coins minting places → Mumbai, Hyderabad, Kolkata (Alipore), Noida\n\nCurrency Notes Printing:\n\n    •      Nashik, Maharashtra – Currency Note Press\n    •      Dewas, Madhya Pradesh – Bank Note Press\n    •      Mysuru, Karnataka – RBI-owned Bharatiya Reserve Bank Note Mudran (BRBNM) press\n    •      Salboni, West Bengal – BRBNM press"}, {"id": 120, "topic": "Banking System", "question": "Consider the following statements regarding Non-Performing Assets (NPAs):\n\n    1) A bank loan is generally classified as an NPA when the interest or principal remains overdue for more than\n       90 days.\n    2) An increase in NPAs generally improves the profitability and financial health of banks.", "options": {"A": "1 only", "B": "2only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "A", "explanation": "borrower has not paid the required interest or principal for more than 90 days.\n\nTypes:\n\n    •      Substandard Asset:Loan has already become NPA.It remains NPA for up to 12 months. Recovery is\n           doubtful, but the bank still expects some recovery.\n    •      Doubtful Asset:A loan becomes Doubtful when it has remained in the Substandard category for 12\n           months.The possibility of recovery is more uncertain.Bank considers the loan riskier than a substandard\n           asset.\n    •      Loss Asset:The bank considers the loan uncollectible or having very little chance of recovery.The asset is\n           identified as a loss by the bank/auditor/regulator.It may still remain in the books until it is written off or\n           otherwise dealt with.\n\nEffects of High NPA’s:\n\n    •      Reduce banks’ interest income\n    •      Reduce profitability\n    •      Increase provisioning requirements\n    •      Reduce funds available for fresh lending\n    •      Weaken the financial health of banks\n    •      Affect the overall credit flow in the economy\n\nProvisioning:Banks set aside a portion of their profits/funds as a provision to cover possible losses from bad loans."}, {"id": 121, "topic": "Banking System", "question": "Consider the following statements regarding a written-off loan:\n\n    1) A written-off loan is removed from the bank’s books as an asset for accounting purposes.\n    2) Writing off a loan automatically means that the borrower’s legal obligation to repay is completely\n       cancelled.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "A", "explanation": "expect normal recovery.\n\n    •      Even after write-off, the bank can continue recovery efforts from the borrower, subject to applicable law.\n    •      Usually associated with bad/loss assets and NPAs.\n    •      Write-off does not mean the borrower is forgiven.\n\nWrite-off is not the same as loan waiver.\n\n    •      Write-off: Accounting treatment; borrower’s liability does not automatically disappear.\n    •      Waiver: Government/bank may legally cancel the borrower’s repayment obligation."}, {"id": 122, "topic": "Banking System", "question": "What is the primary purpose of the Liquidity Adjustment Facility (LAF) of the RBI?", "options": {"A": "To control government expenditure", "B": "To manage short-term liquidity in the banking system", "C": "To regulate foreign direct investment", "D": "To determine income tax rates"}, "answer": "B", "explanation": "•      Through LAF, RBI injects or absorbs liquidity mainly using Repo and Reverse Repo operations.\n\nMain Purpose\n\n    •      Manage short-term liquidity\n    •      Control money supply\n    •      Help maintain short-term interest rates\n    •      Support monetary policy transmission"}, {"id": 123, "topic": "Banking System", "question": "What does Capital Adequacy Ratio (CAR) primarily indicate for a bank?", "options": {"A": "The bank’s total deposits", "B": "The bank’s profitability", "C": "The bank’s capital relative to its risk-weighted assets", "D": "The bank’s total number of branches"}, "answer": "C", "explanation": "CAR = (Regulatory Capital ÷ Risk-Weighted Assets) × 100\n\n    •      Regulatory Capital → Capital available with the bank to absorb losses.\n    •      Risk-Weighted Assets (RWA) → Bank’s assets adjusted according to their level of risk.\n           For example:\n               ➢ Government securities ₹100 cr → low risk → 20% weight = ₹20 cr\n               ➢ Home loans ₹100 cr → medium risk → 50% weight = ₹50 cr\n               ➢ Business loans ₹100 cr → higher risk → 100% weight = ₹100 cr\n               ➢ So, RWA = ₹20 + ₹50 + ₹100 = ₹170 crore.\n           Meaning: Bank has ₹300 cr total assets, but after considering their risk, RWA is ₹170 cr.\n    •      Higher CAR generally means the bank has a stronger capital cushion against losses.\n\nSuppose:\n\n    •      Bank’s regulatory capital = ₹10 crore\n    •      Risk-weighted assets = ₹100 crore\n    •      CAR = (10 ÷ 100) × 100 = 10%\n    •      So, the bank has a 10% CAR.\n\nWhy is CAR important?\n\n    •      Protects depositors.\n    •      Helps banks absorb unexpected losses.\n    •      Reduces the risk of bank failure.\n    •      Promotes stability of the banking system.\n    •      Ensures banks maintain adequate capital relative to their risks."}, {"id": 124, "topic": "Basel Norms & Committees", "question": "Basel Norms are primarily related to which of the following?", "options": {"A": "Agricultural subsidies", "B": "Banking regulation, capital adequacy and risk management", "C": "Foreign trade agreements", "D": "Income tax collection"}, "answer": "B", "explanation": "and better able to manage risks.\n\nThey mainly focus on:\n\n    •      Capital adequacy\n\n    •      Risk management\n    •      Liquidity\n    •      Financial stability\n\nBasel Norms are developed by the Basel Committee on Banking Supervision (BCBS).\n\n    •      BCBS is headquartered at: Bank for International Settlements (BIS), Basel, Switzerland."}, {"id": 125, "topic": "Basel Norms & Committees", "question": "Consider the following statements regarding Basel Norms I and II:\n\n    1) Basel I, introduced in 1988, mainly focused on credit risk and prescribed a minimum capital adequacy ratio\n       o
