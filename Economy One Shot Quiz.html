<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economy One-Shot &mdash; MCQ Quiz | SSC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F3EE;
    --paper: #FFFFFF;
    --ink: #1B241E;
    --ink-soft: #4B564D;
    --indigo: #22345E;
    --indigo-soft: #4A5C8C;
    --gold: #A9762F;
    --green: #2E7D4F;
    --green-bg: #E7F3EA;
    --red: #B3413E;
    --red-bg: #FBEAE9;
    --border: #DDE1D6;
    --border-soft: #E9ECE3;
    --radius: 10px;
    --serif: 'Lora', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  *{box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 16px 80px;
  }

  /* ---------- Header ---------- */
  header.site-header{
    padding:34px 0 20px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }

  .chakra{
    width:34px;height:34px;
    border-radius:50%;
    border:2px solid var(--indigo);
    position:relative;
    flex:none;
  }
  .chakra::before{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    background:
      repeating-conic-gradient(var(--indigo) 0deg 15deg, transparent 15deg 30deg);
  }
  .chakra::after{
    content:"";
    position:absolute;
    inset:14px;
    border-radius:50%;
    background:var(--bg);
  }

  .header-top{
    display:flex;
    align-items:center;
    gap:14px;
  }

  h1{
    font-family:var(--serif);
    font-weight:700;
    font-size:1.7rem;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--indigo);
  }

  .subtitle{
    margin:6px 0 0;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  .stats-bar{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    margin-top:18px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  .stats-bar strong{
    color:var(--ink);
    font-weight:600;
  }

  .stats-bar .stat-correct strong{ color:var(--green); }
  .stats-bar .stat-wrong strong{ color:var(--red); }

  /* ---------- Topic tabs ---------- */
  nav.topic-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 0 14px;
    margin-bottom:8px;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  nav.topic-tabs::-webkit-scrollbar{ height:6px; }
  nav.topic-tabs::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

  .tab-btn{
    flex:none;
    white-space:nowrap;
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:500;
    padding:9px 15px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{ border-color:var(--indigo-soft); color:var(--indigo); }
  .tab-btn.active{
    background:var(--indigo);
    border-color:var(--indigo);
    color:#fff;
  }
  .tab-count{
    opacity:0.7;
    font-size:0.8em;
    margin-left:3px;
  }

  /* ---------- Topic section ---------- */
  .topic-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin:22px 0 16px;
  }

  .topic-heading h2{
    font-family:var(--serif);
    font-size:1.25rem;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }

  .topic-progress{
    font-size:0.82rem;
    color:var(--ink-soft);
  }

  /* ---------- Question card ---------- */
  .q-card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    margin-bottom:14px;
  }

  .q-head{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:12px;
  }

  .q-num{
    flex:none;
    font-family:var(--serif);
    font-weight:600;
    font-size:0.82rem;
    color:var(--indigo);
    background:var(--border-soft);
    border-radius:6px;
    padding:3px 8px;
    margin-top:2px;
  }

  .q-text{
    white-space:pre-wrap;
    font-size:0.98rem;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
  }

  .option{
    text-align:left;
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-family:var(--sans);
    font-size:0.93rem;
    color:var(--ink);
    background:#FBFBF9;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
    white-space:pre-wrap;
  }
  .option:hover:not(.locked){
    border-color:var(--indigo-soft);
    background:#F5F6FB;
  }
  .option .opt-letter{
    flex:none;
    font-weight:600;
    color:var(--indigo-soft);
  }

  .option.correct{
    background:var(--green-bg);
    border-color:var(--green);
  }
  .option.correct .opt-letter{ color:var(--green); }

  .option.incorrect{
    background:var(--red-bg);
    border-color:var(--red);
  }
  .option.incorrect .opt-letter{ color:var(--red); }

  .option.locked{
    cursor:default;
  }

  .q-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
  }

  .reveal-link{
    background:none;
    border:none;
    font-family:var(--sans);
    font-size:0.83rem;
    color:var(--indigo-soft);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .reveal-link:disabled{
    opacity:0.45;
    cursor:default;
    text-decoration:none;
  }

  .result-tag{
    font-size:0.83rem;
    font-weight:600;
    display:none;
  }
  .result-tag.show{ display:inline-block; }
  .result-tag.correct{ color:var(--green); }
  .result-tag.incorrect{ color:var(--red); }

  .explanation{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .explanation.open{
    max-height:2400px;
    margin-top:12px;
  }

  .explanation-inner{
    border-top:1px dashed var(--border);
    padding-top:12px;
    font-size:0.9rem;
    color:var(--ink-soft);
    white-space:pre-wrap;
  }

  .explanation-inner .exp-label{
    display:block;
    font-family:var(--serif);
    font-weight:600;
    font-style:italic;
    color:var(--gold);
    margin-bottom:6px;
    font-size:0.85rem;
  }

  /* ---------- Scroll to top ---------- */
  #scrollTopBtn{
    position:fixed;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--indigo);
    color:#fff;
    font-size:1.2rem;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
    z-index:50;
  }
  #scrollTopBtn.show{ display:flex; }

  footer.site-footer{
    margin-top:30px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:0.8rem;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:480px){
    h1{ font-size:1.4rem; }
    .wrap{ padding:0 12px 70px; }
    .q-card{ padding:14px 14px 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .explanation, .tab-btn, .option{ transition:none; }
  }
</style>
</head>

<script id="quizData" type="application/json">[{"id": 1, "topic": "National Income & Methods", "question": "Which of the following are the major components of National Income?", "options": {"A": "Consumption, Investment, Government Expenditure and Net Foreign Income", "B": "Wages, Rent, Interest and Profit", "C": "Savings, Taxes, Subsidies and Imports", "D": "Exports, Imports, Wages and Rent"}, "answer": "A", "explanation": "Components of National Income:\n\n    •      Consumption (C) refers to expenditure by households on goods and services( Goods only Final goods both\n           durable-Medicines,clothes and non durable -food , vegetables)\n    •      Investment (I) refers to expenditure made by firms on goods and services especially capital goods such as\n           machinery, equipment and buildings.\n    •      Government Expenditure ( E) refers to government spending on goods- Infrastructure facilities and\n           services-salaries to employees,subsidies .\n    •      Net Foreign Income refers to income received from abroad minus income paid to foreigners.\n           ➢ Exports(X) represent goods and services sold to other countries.\n           ➢ Imports (M)represent goods and services purchased from other countries."}, {"id": 2, "topic": "National Income & Methods", "question": "Consider the following statements regarding the Income Method and Expenditure Method of calculating\nNational Income:\n\n    1) In the Income Method, the incomes earned by factors of production are aggregated to arrive at the National\n       Income.\n    2) In the Expenditure Method, the total expenditure incurred by the society in a particular year is added.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "Wages (W), Capital → Interest (I), and Organization/Entrepreneurship → Profit (P).\n\n    •      Formula: NI = R + W + I + P+Mixed Incomes +Net income from abroad\n    •      Mixed Income means self employed persons income.\n\nThe Expenditure Method adds the total expenditure incurred by society in a particular year.\n\n    •      Formula: NI = EH + EF + EG + Net Exports\n    •      where ,EH = Expenditure of Households, EF = Expenditure of Firms, and EG = Expenditure of\n           Government."}, {"id": 3, "topic": "National Income & Methods", "question": "Which method of calculating National Income finds the market value of all final goods and services produced in\na country in a year?", "options": {"A": "Income Method", "B": "Expenditure Method", "C": "Product Method", "D": "Savings Method"}, "answer": "C", "explanation": "•      Also known as Output method or value added method\n    •      In this method, the market value of all final goods and services produced in a country in a year is calculated\n           by multiplying their respective quantities by market prices.\n    •      Formula: GNP = (P₁Q₁ + P₂Q₂ + P₃Q₃ + …) + Net Income from Abroad,\n    •      where P = Price of goods and services and Q = Quantity of goods and services produced.\n\nSavings Method: means calculating the amount of savings made from income after deducting consumption\nexpenditure.\n\n    •      Formula:Savings = Income – Consumption Expenditure"}, {"id": 4, "topic": "National Income & Methods", "question": "Which of the following correctly explains the relationship between Market Price and Factor Price?", "options": {"A": "Factor Price = Market Price + Indirect Taxes – Subsidies", "B": "Market Price = Factor Price + Indirect Taxes – Subsidies", "C": "Market Price = Factor Price – Indirect Taxes + Subsidies", "D": "Factor Price = Market Price + Indirect Taxes + Subsidies"}, "answer": "B", "explanation": "for subsidies.\n\n    •      Formula: Market Price = Factor Price + Indirect Taxes – Subsidies.\n\nFactor Price is the amount received by the factors of production for their contribution to production.\n\n    •      Formula: Factor Price = Market Price – Indirect Taxes + Subsidies.\n\nIndirect Taxes: Taxes imposed on goods and services, where the tax burden can be passed on to the consumer.Eg:\nGST, customs duty, excise duty.\n\nSubsidies: Financial assistance or support given by the government to reduce the cost of goods and services or\nsupport producers/consumers. Eg: Fertilizer subsidy."}, {"id": 5, "topic": "National Income & Methods", "question": "Consider the following statements regarding GDP and GNP:\n\n1)GNP measures the total market value of final goods and services produced within the domestic territory of a\ncountry during a given period.\n\n2)GDP measures the total market value of final goods and services produced by the normal residents of a country,\nirrespective of where they are produced.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "D", "explanation": "GDP (Gross Domestic Product) is the total market value of final goods and services produced within a country’s\ndomestic territory, whether produced by residents or foreigners in a financial year (April 1st to March 31st of NXT\nyear ).\n\n    •      Formula:C+I+G+(X-M)\n           GDP=Consumption+Investment+Government Expenditure+( Exports -Imports)\n\nGNP (Gross National Product) focuses on the production of a country’s normal residents.{Total production of\nIndians irrespective of territory outside or inside }\n\n    •      It is GNP at Market Prices\n    •      Formula: GNP = GDP + NIFA (Net Factor Income from Abroad).\n    •      NIFA = Factor Income Received from Abroad – Factor Income Paid to Foreigners.\n\nFactor Income refers to – Wages and salaries, Profits of international businesses, Rent and Interest earned on\nproperty owned by foreigners (or Indians in other countries)\n\nGNP at factor cost =GNP at MP – IDT+Subsidies\n\nGNP at FC =C+I+G+(X-M)-IDT+Subsidies"}, {"id": 6, "topic": "National Income & Methods", "question": "What does NDP (Net Domestic Product) measure?", "options": {"A": "Total value of final goods and services produced by the residents of a country", "B": "Total value of final goods and services produced within the domestic territory after deducting depreciation", "C": "Total income earned by the residents of a country from all sources", "D": "Total value of goods and services produced within the domestic territory including depreciation"}, "answer": "B", "explanation": "a country after deducting depreciation from GDP.\n\n    •      Also known as NDP at Market Prices\n    •      Formula: NDP = GDP – Depreciation.\n    •      Depreciation is the loss in value of fixed assets such as machinery, buildings and equipment due to wear\n           and tear, regular use, or obsolescence over time.\n    •      Obsolescence means a decrease in the usefulness or value of an old asset because new technology or better\n           models have been introduced."}, {"id": 7, "topic": "National Income & Methods", "question": "What does NNP (Net National Product) measure?", "options": {"A": "Total value of final goods and services produced within the domestic territory after deducting depreciation", "B": "Total value of final goods and services produced by the normal residents of a country after deducting depreciation", "C": "Total value of final goods and services produced by foreign residents within a country", "D": "Total income earned by the government from all economic activities"}, "answer": "B", "explanation": "country after deducting depreciation.\n\n    •      Also known as NNP at Market Prices\n    •      Formula: NNP = GNP – Depreciation."}, {"id": 8, "topic": "National Income & Methods", "question": "What is the correct formula for NNP at Factor Cost?", "options": {"A": "NNP at FC = GNP + Depreciation", "B": "NNP at FC = GDP – Depreciation – Indirect Taxes + Subsidies", "C": "NNP at FC = NNP at MP – Indirect Taxes + Subsidies", "D": "NNP at FC = NNP at MP + Indirect Taxes – Subsidies"}, "answer": "C", "explanation": "deducting depreciation, measured at factor cost. {Total income received by 4 factors of production in an economic\nyear}.\n\n    •      It is also known as National Income.(When ever we talk about national income it is NNP at FC).\n    •      Formula: NNP at FC = NNP at MP – Indirect Taxes + Subsidies."}, {"id": 9, "topic": "National Income & Methods", "question": "What is Per Capita Income?", "options": {"A": "Total income earned by the government in a country", "B": "Average income earned per person in a country", "C": "Total income earned only by industrial workers", "D": "Total income earned by a country’s citizens from abroad"}, "answer": "B", "explanation": "National Income of a country by its total population.Present Per Capita Income = ₹2,08,090 per person per annum\n\n    •      Formula: Per Capita Income = National Income ÷ Population"}, {"id": 10, "topic": "Five-Year Plans & Planning", "question": "When was the Planning Commission of India established, and who was its first Chairman?", "options": {"A": "1947 — Sardar Vallabhbhai Patel", "B": "1950 — Jawaharlal Nehru", "C": "1951 — Rajendra Prasad", "D": "1952 — C.Rajagopalachari"}, "answer": "B", "explanation": "Nehru, the then Prime Minister of India, was its first Chairman. The First Five-Year Plan was launched in 1951."}, {"id": 11, "topic": "Five-Year Plans & Planning", "question": "Which of the following statements about the First Five-Year Plan of India is correct?", "options": {"A": "It was based on the Mahalanobis Model and focused mainly on heavy industries.", "B": "It was based on the Harrod-Domar Model and gave priority to agriculture, irrigation and power.", "C": "It was based on the Solow Model and focused mainly on economic liberalisation.", "D": "It was based on the Keynesian Model and gave priority to privatisation."}, "answer": "B", "explanation": "irrigation and power.\n\n    •      Its main objective was to increase agricultural production, overcome food shortages and improve the\n           country’s economic condition.\n    •      The plan targeted a growth rate of 2.1%, the actual growth rate was about 3.6% so it was successful.\n\nHarrod-Domar Model: It explains that investment and capital formation are important for increasing production and\nachieving economic growth."}, {"id": 12, "topic": "Five-Year Plans & Planning", "question": "Who is known as the architect of India’s Five-Year Plans?", "options": {"A": "Sardar Patel", "B": "Jawaharlal Nehru", "C": "B.R.Ambedkar", "D": "P.C.Mahalanobis"}, "answer": "D", "explanation": "designing the Second Five-Year Plan (1956–1961). He developed the Mahalanobis Model, which focused on rapid\nindustrialisation by giving priority to heavy and basic industries.\n\n    •      2nd five year Plan Target growth=4.5%; Actual growth =4.3%"}, {"id": 13, "topic": "Five-Year Plans & Planning", "question": "Consider the following statements regarding the Industrial Policy Resolution (IPR) of 1956:\n\n1)The Industrial Policy Resolution of 1956 gave greater importance to the expansion of the public sector and placed\nthe commanding heights of the economy under state control.\n\n2)Industrial licensing was used to regulate the establishment and expansion of industries, including the expansion of\nexisting private sector industries.\n\n3)The policy aimed at complete privatisation of industries and the abolition of industrial licensing.\n\nWhich of the statements given above are correct?", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1 and 3 only", "D": "1, 2 and 3"}, "answer": "A", "explanation": "“commanding heights” of the economy under state control means Key strategic industries were expected to be\nmainly controlled or developed by the government.\n\n    •      Industrial licensing was also used as a tool to regulate the establishment of new industries and the\n           expansion of existing industries, including those in the private sector.\n    •      The objective was to control the pattern of industrial development and ensure that scarce resources were\n           directed towards national priorities.\n    •      It was done during 2 nd five year plan.\n\nStatement 3 is incorrect because The policy was based on greater government control, not privatisation and abolition\nof licensing."}, {"id": 14, "topic": "Five-Year Plans & Planning", "question": "Which Five-Year Plan introduced the Minimum Needs Programme?", "options": {"A": "Third Five-Year Plan", "B": "Fourth Five-Year Plan", "C": "Fifth Five-Year Plan", "D": "Sixth Five-Year Plan"}, "answer": "C", "explanation": "providing basic necessities and improving the living standards of weaker sections.\n\n    •      The programme focused on areas such as elementary education, rural health, drinking water, rural\n           electrification, housing and other basic needs\n    •      The plan targeted an annual growth rate of 4.4%, while the actual growth rate was about 4.8%. Its major\n           objectives included poverty removal and self-reliance."}, {"id": 15, "topic": "Five-Year Plans & Planning", "question": "Under which Five-Year Plan was the Green Revolution introduced in India?", "options": {"A": "First Five-Year Plan", "B": "Second Five-Year Plan", "C": "Third Five-Year Plan", "D": "Fourth Five-Year Plan"}, "answer": "C", "explanation": "M.S.Swaminathan played a major role in the development and implementation of the Green Revolution in India.\nThe Third Five-Year Plan targeted a growth rate of 5.6%, but achieved only about 2.4%, mainly due to wars,\ndroughts and economic difficulties.\n\n Five year Plan       Key Features\n I (1951-56)          Agriculture and Irrigation Development\n II (1956-61)         Development of Large Scale Industries\n\n III(1961-66)       Self Sufficiency in Food grain production\n IV (1969-74)       Steady growth,self reliance\n V (1974-79)        Poverty Eradication(Garibi Hatao) , self reliance\n VI (1980-85)       Poverty reduction,modernization, Employment generation"}, {"id": 16, "topic": "Five-Year Plans & Planning", "question": "Which of the following is correct about the Fourth Five-Year Plan of India?", "options": {"A": "It focused mainly on heavy industries and was based on the Mahalanobis Model.", "B": "It focused mainly on agriculture and introduced the Green Revolution.", "C": "It focused on growth with stability and progressive achievement of self-reliance.", "D": "It introduced the Minimum Needs Programme and focused mainly on poverty removal."}, "answer": "C", "explanation": "self-reliance. It aimed to maintain economic growth while controlling inflation and reducing dependence on foreign\nresources. The plan gave importance to agriculture, family planning and economic stability. The target growth rate\nwas 5.7%, while the actual growth rate was about 3.3%."}, {"id": 17, "topic": "Five-Year Plans & Planning", "question": "During which Five-Year Plan period was Operation Flood launched?", "options": {"A": "First Five-Year Plan", "B": "Fourth Five-Year Plan", "C": "Fifth Five-Year Plan", "D": "Sixth Five-Year Plan"}, "answer": "B", "explanation": "programme behind India’s White Revolution and aimed to increase milk production, strengthen dairy cooperatives\nand improve the income of milk producers. Dr.Verghese Kurien played a leading role in Operation Flood and is\nknown as the Father of the White Revolution in India."}, {"id": 18, "topic": "Five-Year Plans & Planning", "question": "What was the main aim of the Sixth Five-Year Plan (1980–1985)?", "options": {"A": "Defence expansion", "B": "Faster industrialisation", "C": "Poverty reduction and modernization", "D": "Export-led growth"}, "answer": "C", "explanation": "growth."}, {"id": 19, "topic": "Five-Year Plans & Planning", "question": "In the context of Five-Year Plans, what does the term “Plan Holiday” refer to?", "options": {"A": "Emergency loan disbursements", "B": "Suspension of annual budget", "C": "Discontinuity in Five-Year planning", "D": "Switch from socialism to capitalism"}, "answer": "C", "explanation": "discontinued. During this period, Three Annual Plans were implemented instead of a Five-Year Plan due to\neconomic difficulties, including wars, droughts and financial pressures. Focused mainly on agriculture, food\nproduction and economic stability.\n\n\n\n."}, {"id": 20, "topic": "Five-Year Plans & Planning", "question": "What was the main rationale for the policy of import substitution during the first seven Five-Year Plans?", "options": {"A": "To expand international trade", "B": "To attract foreign investors", "C": "To protect infant domestic industries", "D": "To create export dependency"}, "answer": "C", "explanation": "industries. During the first seven Five-Year Plans, India used measures such as tariffs, import restrictions and\nlicensing to protect infant domestic industries from foreign competition. The idea was to give Indian industries time\nto develop, become competitive and achieve greater self-reliance.\n\nSeventh five year plan (1985–1990): focused on increasing food-grain production, employment opportunities and\nraising productivity.\n\n    •      The plan targeted an annual growth rate of 5.0%, while the actual growth rate was about 6.0%."}, {"id": 21, "topic": "Five-Year Plans & Planning", "question": "Match the following:related to Plan and its objectives:\n\n Five Year Plans                                              Objectives of the Plan\n 1)Eighth Five-Year Plan                                      A)Faster economic growth with social development\n                                                              and poverty reduction\n 2)Ninth Five-Year Plan                                       B)Human development and employment generation\n 3)Tenth Five-Year Plan                                       C)Faster, More Inclusive and Sustainable Growth\n 4)Eleventh Five-Year Plan                                    D)Growth with social justice and equality\n 5)Twelfth Five-Year Plan                                     E)Faster and More Inclusive Growth\nSelect the Code:", "options": {"A": "1-A,2-B,3-C,4-D,5-E", "B": "1-B,2-D,3-A,4-E,5-C", "C": "1-E,2-B,3-C,4-D,5-A", "D": "1-B,2-D,3-A,4-C,5-E"}, "answer": "B", "explanation": "and human development.\n\n    •      Ninth Five-Year Plan (1997–2002): Target 6.5%, Actual 5.4%. Main focus was growth with social justice\n           and equality, poverty reduction and rural development.\n    •      Tenth Five-Year Plan (2002–2007): Target 8.0%, Actual 7.6%. It aimed at faster economic growth, poverty\n           reduction, Reduction of gender gap in literacy &wage rate ,employment generation, education and health\n           improvement.\n    •      The Eleventh Five-Year Plan (2007–2012) focused on “Faster and More Inclusive Growth,” with emphasis\n           on education, health, employment and reducing inequalities. Its target growth rate was 9%, while actual\n           growth was about 8%.\n    •      The Twelfth Five-Year Plan (2012–2017) focused on “Faster, More Inclusive and Sustainable Growth.” It\n           aimed at economic growth along with environmental sustainability, poverty reduction, employment and\n           improvement in social sectors. Its target growth rate was 8%, while actual growth was about 6.7%."}, {"id": 22, "topic": "Five-Year Plans & Planning", "question": "Which of the following statements about the Rolling Plan is correct?", "options": {"A": "It was introduced in 1951 and focused mainly on agriculture.", "B": "It was introduced in 1978 during Morarji Desai’s tenure and allowed targets to be revised regularly.", "C": "It was introduced in 1991 and focused mainly on economic liberalisation.", "D": "It was introduced in 1985 and focused mainly on poverty removal."}, "answer": "B", "explanation": "Desai.It started before the actual completion of 5 th 5 year plan .Unlike a fixed Five-Year Plan, its targets were\nreviewed and revised every year.It emphasized on employment continued until 1980 Congress govt came , when the\nSixth Five-Year Plan was introduced."}, {"id": 23, "topic": "Five-Year Plans & Planning", "question": "Match the Following\n\n Major Incident                                             Five year Plan\n 1)China War                                                A.Second\n 2)Industry Resolution Policy                               B.Fourth\n 3)Operation Flood                                          C.Fifth\n 4)Minimum Needs program                                    D.Third\nSelect the Code :", "options": {"A": "1-D,2-A,3-B,4-C", "B": "1-A,2-D,3-B,4-C", "C": "1-D,2-A,3-C,4-B", "D": "1-B,2-A,3-D,4-C"}, "answer": "A", "explanation": "Resolution,1956 → Second Five-Year Plan. Operation Flood (1970) → Fourth Five-Year Plan period. Minimum\nNeeds Programme → Fifth Five-Year Plan.Garibi hatao is in both 4 th and 5 th five year plans ."}, {"id": 24, "topic": "Five-Year Plans & Planning", "question": "Match the following concepts related to the Basic Problems Of Economy:\n\n Basic Problems Of Economy                                    Meaning/Definition\n 1)Scarcity                                                   A)Value of the next best alternative forgone\n 2)Choice                                                     B)Limited resources in relation to unlimited wants\n 3)Trade-off                                                  C)Selecting one alternative among competing\n                                                              alternatives\n 4)Opportunity Cost                                           D)Giving up one thing to obtain another\nSelect the Correct Code:", "options": {"A": "1-B,2-C,3-D,4-A", "B": "1-C,2-D,3-A,4-B", "C": "1-A,2-B,3-D,4-C", "D": "1-D,2-C,3-B,4-A"}, "answer": "A", "explanation": "•      Scarcity:Means resources are limited but human wants are unlimited.\n    •      Choice:Because resources are scarce, we must choose one option and give up others.\n    •      Trade-off: A trade-off means giving up one thing to get another.\n    •      Opportunity Cost:Opportunity cost is the value of the next best alternative that is given up when a choice is\n           made."}, {"id": 25, "topic": "Basic Concepts & Theories", "question": "Who is known as the “Father of Economics”?", "options": {"A": "J.M. Keynes", "B": "Adam Smith", "C": "Alfred Marshall", "D": "David Ricardo"}, "answer": "B", "explanation": "Causes of the Wealth of Nations (1776):\n\n    •      He defined Economics is the study of wealth — how a nation produces and accumulates wealth and laid the\n           foundation for modern economics."}, {"id": 26, "topic": "Basic Concepts & Theories", "question": "Which of the following best describes J.M.Keynes’ view of Economics?", "options": {"A": "Economics is the study of wealth and its accumulation", "B": "Economics is the study of human welfare and material well-being", "C": "Economics focuses on income, employment, economic growth and government policies to stabilise the economy", "D": "Economics is the study of unlimited wants and scarce resources with alternative uses"}, "answer": "C", "explanation": "problems such as unemployment, economic growth, government spending, recession and recovery. He argued that\nduring an economic slowdown, government spending can be increased to create employment and boost demand."}, {"id": 27, "topic": "Basic Concepts & Theories", "question": "Which of the following pairs is/are correctly matched?\n\n1)Alfred Marshall — Welfare Definition\n\n2)Lionel Robbins — Scarcity Definition\n\n3)Paul Samuelson — Growth Definition", "options": {"A": "1 only", "B": "1 and 2 only", "C": "2 and 3 only", "D": "1,2 and 3"}, "answer": "D", "explanation": "standard of living. It focuses on human well-being, income, living standards and basic needs like food, education\nand health.\n\n    •      Lionel Robbins – Scarcity Definition: Economics studies human behaviour as a relationship between\n           unlimited wants and scarce resources having alternative uses. It focuses on scarcity, choice and opportunity\n           cost.\n    •      Paul Samuelson – Growth Definition: Economics studies how people and society choose to use scarce\n           resources to produce goods and services and distribute them over time. It focuses on economic growth,\n           resource allocation, production and improving living standards."}, {"id": 28, "topic": "Basic Concepts & Theories", "question": "Which of the following best describes the Production Possibility Curve (PPC)?", "options": {"A": "It shows the relationship between price and quantity demanded", "B": "It shows the maximum possible combinations of two goods that can be produced with available resources and\ntechnology", "C": "It shows the total income and expenditure of an economy", "D": "It shows only the goods produced by the private sector"}, "answer": "B", "explanation": "explains scarcity, trade-offs, opportunity cost and efficiency.\n\n    •      Efficiency: Point on the curve – efficient use of resources.\n    •      Inefficiency: Point inside the curve – unemployment or wastage.\n    •      Unattainable: Point outside the curve – cannot be achieved with current resources and technology.\n    •      Shape: Usually concave/bowed outward due to increasing opportunity cost.\n    •      Outward Shift: Increase in resources, technology, skills or capital goods – production capacity increases.\n    •      Inward Shift: War, disaster or loss of resources – production capacity decreases."}, {"id": 29, "topic": "Basic Concepts & Theories", "question": "What is the Barter System?", "options": {"A": "Exchange of goods and services using money", "B": "Direct exchange of goods and services without using money", "C": "Exchange of money for goods only", "D": "Saving goods for future use"}, "answer": "B", "explanation": "money. For example, a farmer may exchange wheat for clothes. Its key feature is direct exchange with no money\ninvolved."}, {"id": 30, "topic": "Basic Concepts & Theories", "question": "onsider the following statements regarding the Problems of the Barter System:\n\n    1) Double Coincidence of Wants requires both parties to want what the other offers at the same time.\n    2) Lack of a Common Measure of Value makes it easy to determine how much of one good should be\n       exchanged for another.\n    3) Indivisibility of Goods, difficulty in storing value, and difficulty in deferred payments are major problems\n       of the Barter System.\n\nWhich of the above statements is/are correct?", "options": {"A": "1 only", "B": "1 and 2 only", "C": "1and 3 only", "D": "1, 2 and 3"}, "answer": "C", "explanation": "Value makes fixing the exchange ratio difficult. Indivisibility of Goods creates problems when goods cannot be\ndivided. Storing Value is difficult because some goods perish or lose value. Deferred Payments are difficult because\nthe value of goods may change.\n\nPrimary Fucntions of Money – Medium of exchange, Measure of value\n\nSecondary – Store of value, deferred payments, transfer of value"}, {"id": 31, "topic": "Basic Concepts & Theories", "question": "What does the “Invisible Hand” refer to?", "options": {"A": "Government control over market activities", "B": "The idea that self-interest can unintentionally benefit society through market forces", "C": "The process of fixing prices by law", "D": "The distribution of goods by the government"}, "answer": "B", "explanation": "society through demand, supply and competition.This concept was given by Adam Smith.For example, a seller may\nprovide better products to earn profit, which benefits customers through better quality and choice."}, {"id": 32, "topic": "Basic Concepts & Theories", "question": "What is meant by Laissez-Faire?", "options": {"A": "Complete government control over the economy", "B": "Minimum government interference in economic activities", "C": "Government ownership of all businesses", "D": "Fixed prices for all goods and services"}, "answer": "B", "explanation": "allowing individuals and businesses to make decisions regarding production, pricing and investment. Market forces\nsuch as demand and supply largely determine prices."}, {"id": 33, "topic": "Basic Concepts & Theories", "question": "Consider the following statements regarding Free Market Economy and Mixed Economy:\n\n1)In a Mixed Economy, both the government and private sector exist, and the government controls some industries.\n\n2)In a Free Market Economy, prices are mainly determined by demand and supply, with minimum government\ninterference.\n\n3)India follows a Free Economy model, where only the private sector exists and there is no government control over\nindustries.\n\nWhich of the statements given above is/are correct?", "options": {"A": "1 and 2 only", "B": "1 and 3 only", "C": "2 and 3 only", "D": "1,2 and 3"}, "answer": "A", "explanation": "private sector exist, and the government regulates important sectors(railways,defence), prices, taxes and\nwelfare.Private produces goods etc.\n\n    •      A Free Market Economy has minimum government interference, private businesses mainly decide what to\n           produce and at what price, based on demand & Supply. Based on Capitalism.Eg- USA.\n    •      India follows a Mixed Economy, not a Free Market Economy."}, {"id": 34, "topic": "Demand & Consumer Behaviour", "question": "What does the Law of Demand state?", "options": {"A": "When price increases, quantity demanded also increases", "B": "When price decreases, quantity demanded decreases", "C": "When price falls, quantity demanded increases, and when price rises, quantity demanded decreases, other things\nremaining constant", "D": "Price and quantity demanded always move in the same direction"}, "answer": "C", "explanation": "Price ↑ – Quantity Demanded ↓ and Price ↓ – Quantity Demanded ↑, provided other factors remain constant (ceteris\nparibus).\n\n    •      The law of demand works only if income, taste, population, and prices of related goods do not change.\n    •      The Demand slope is downward from left to right."}, {"id": 35, "topic": "Demand & Consumer Behaviour", "question": "Which of the following causes a shift in the demand curve?", "options": {"A": "Change in the price of the same good", "B": "Change in consumer income", "C": "Change in quantity demanded due to a change in price", "D": "Movement along the existing demand curve"}, "answer": "B", "explanation": "increase in demand shifts the curve rightward, while a decrease shifts it leftward.\n\nTastes and Preferences\n\n    •      Favorable change: Demand ↑ – Demand curve shifts rightward.Eg: If people start preferring electric\n           vehicles, demand for electric vehicles increases.\n    •      Unfavorable change: Demand ↓ – Demand curve shifts leftward.Eg: If people lose interest in a particular\n           fashion, demand for that product decreases.\n\nRelated Goods\n\n    •      Substitute Goods – Goods that can be used in place of each other.Eg:Tea and coffee (Price of tea ↑ →\n           Demand for coffee ↑.\n    •      Complementary Goods – Goods that are used together.Eg: Car and petrol (Price of petrol ↑ → Demand for\n           cars )\n\nIncome\n\nNormal Goods:Eg: Cars, branded clothes, restaurant meals, better-quality food.\n\n    •      Income ↑ ,Demand ↑ – Demand curve shifts right\n    •      Income ↓ , Demand ↓ – Demand curve shifts left\n\nInferior Goods:Eg: Low-cost public transport, second-hand goods, and lower-cost food alternatives.\n\n    •      Income ↑ , Demand ↓ – Demand curve shifts left\n    •      Income ↓ , Demand ↑ – Demand curve shifts right\n\nPopulation:\n\n    •      Population ↑ , Demand ↑– Demand curve shifts rightward.Eg: More people – greater demand for food and\n           housing.\n    •       Population ↓ , Demand ↓–Demand curve shifts leftward.Eg: Fewer people – lower demand for goods and\n           services."}, {"id": 36, "topic": "Demand & Consumer Behaviour", "question": "Match the following related to exceptions to demand:\n\n Exceptions to Demand                                       Meaning/Definition\n 1)Behavioural Demand                                       A)Demand based on expectations of future price\n                                                            changes\n 2)Giffen Goods                                             B)Goods whose demand may increase when their price\n                                                            rises due to income effect\n 3)Veblen Goods                                             C)Demand influenced by consumer psychology, habits\n                                                            and preferences\n 4)Speculative Goods                                        D)Luxury goods whose demand may increase with\n                                                            price because of prestige or status\nSelect the Code:", "options": {"A": "1-D, 2-C, 3-B, 4-A", "B": "1-B, 2-D, 3-C, 4-A", "C": "1-C, 2-B, 3-D, 4-A", "D": "1-A, 2-B, 3-C, 4-D"}, "answer": "C", "explanation": "increase in demand – Exceptions to Law of Demand,here the slope is upward left to right .\n\n    •      Behavioural Demand: Demand influenced by consumer psychology, habits, preferences and behaviour.\n           Example: Consumers buying a product because it is popular or socially desirable.\n    •      Giffen Goods: Inferior goods whose demand may increase when their price rises because of a strong\n           income effect. Example: Staple foods such as rice or bread in very poor households.\n    •      Veblen Goods: Luxury goods whose demand may increase with price because a high price provides\n           prestige or status. Example: Luxury watches, designer handbags and high-end cars.\n    •      Speculative Goods: Goods or assets whose demand is influenced by expectations of future price changes.\n           Example: Gold, land or shares purchased expecting their prices to rise."}, {"id": 37, "topic": "Demand & Consumer Behaviour", "question": "Match the following related to Exceptions to Demand based on Social effects:\n\n Exceptions of Demand -Social Effects                       Meaning/Definition\n 1)Bandwagon Effect                                         A)Preference for exclusive or uncommon goods\n 2)Snob Effect                                              B)Demand increases because many others are using the\n                                                            good\n 3)Demonstration Effect                                     C)Consumption increases by imitating the lifestyle of\n                                                            others\n 4)Veblen Effect                                            D)Preference for high-priced luxury goods because of\n                                                            prestige or status\nSelect the Code:", "options": {"A": "1-B, 2-A, 3-C, 4-D", "B": "1-A, 2-B, 3-D, 4-C", "C": "1-C, 2-D, 3-A, 4-B", "D": "1-D, 2-C, 3-B, 4-A"}, "answer": "A", "explanation": "•      Bandwagon Effect: People demand a good because many other people are buying or using it.Eg: A popular\n           smartphone becomes attractive because many people use it.\n    •      Snob Effect: People prefer goods that are exclusive or uncommon; attractiveness may decrease when\n           everyone owns them.Eg: A limited-edition luxury watch.\n    •      Demonstration Effect: People increase consumption by imitating the lifestyle or consumption patterns of\n           others, especially higher-income groups.Eg: Buying an expensive car after seeing wealthy people use it.\n    •      Veblen Effect: People may prefer high-priced luxury goods because their high price provides prestige or\n           status. Eg: Expensive designer handbags or luxury watches.\n    •      Network Externalities:means the value or usefulness of a product/service changes depending on how many\n           other people use it.\n                ➢ Positive Network Externalities: Value of a good increases when more people uses it.Eg:WhatsApp\n                     — more friends using it makes the app more useful to you.\n                ➢ Negative Network Externalities: Value of a good decreases when too many people use it.Eg:\n                     Internet becomes slow when many users are online."}, {"id": 38, "topic": "Demand & Consumer Behaviour", "question": "Which of the following correctly describes the types of Price Elasticity of Demand?", "options": {"A": "Perfectly Inelastic (Ed = 0), Relatively Inelastic (Ed < 1), Unitary Elastic (Ed = 1), Relatively Elastic (Ed > 1),\nand Perfectly Elastic (Ed = ∞)", "B": "Perfectly Inelastic (Ed = 1), Relatively Inelastic (Ed < 0), Unitary Elastic (Ed > 1), Relatively Elastic (Ed = 0),\nand Perfectly Elastic (Ed < 1)", "C": "Perfectly Inelastic (Ed = ∞), Relatively Inelastic (Ed > 1), Unitary Elastic (Ed = 0), Relatively Elastic (Ed = 1),\nand Perfectly Elastic (Ed < 1)", "D": "Perfectly Inelastic (Ed < 1), Relatively Inelastic (Ed = ∞), Unitary Elastic (Ed = 0), Relatively Elastic (Ed = 1),\nand Perfectly Elastic (Ed > 1)"}, "answer": "A", "explanation": "PED = % Change in Quantity Demanded ÷ % Change in Price\n\n    •      Perfectly Inelastic (Ed = 0): Quantity demanded does not change even when price changes.Eg:life-saving\n           essential medicine in a situation where there is no substitute.Demand Curve: Vertical to X axis .\n\n    •      Relatively Inelastic (Ed < 1): Quantity demanded changes less than the change in price.Example: Salt, basic\n           medicines and other necessities.Curve:Steeper\n    •      Unitary Elastic (Ed = 1): Quantity demanded changes in the same proportion as price.Curve: Rectangular\n           Hyperbola\n    •      Relatively Elastic (Ed > 1): Quantity demanded changes more than the change in price.Curve :Flatter.\n    •      Perfectly Elastic (Ed = ∞): A very small price change causes an extremely large change in quantity\n           demanded.Curve: Horizontal to X axis.\n\nOriginal: Price = ₹10, Quantity Demanded = 100 units.\n\n    •      Perfectly Inelastic (Ed = 0): Price ₹15 → Quantity 100\n    •      Relatively Inelastic (Ed < 1): Price ₹12 → Quantity 95\n    •      Unitary Elastic (Ed = 1): Price ₹12 → Quantity 80\n    •      Relatively Elastic (Ed > 1): Price ₹12 → Quantity 60\n    •      Perfectly Elastic (Ed = ∞): Price ₹10 → Demand can vary greatly; Price > ₹10 → Demand = 0."}, {"id": 39, "topic": "Demand & Consumer Behaviour", "question": "Which of the following best explains the Law of Diminishing Marginal Utility?", "options": {"A": "Total Utility always decreases as consumption increases", "B": "Marginal Utility increases with every additional unit consumed", "C": "Marginal Utility decreases as a consumer consumes successive units of a good, other things remaining constant", "D": "Price of a good decreases as its consumption increases"}, "answer": "C", "explanation": "the additional satisfaction (Marginal Utility) from each successive unit decreases, other things remaining constant.\n\n    •      Total Utility (TU): The total satisfaction obtained from all units consumed.\n    •      Marginal Utility (MU): The additional satisfaction from consuming one more unit.\n\nPizza Example – TU & MU\n\n    •      1st slice – MU = 20 – TU = 20\n    •      2nd slice – MU = 15 – TU = 35\n    •      3rd slice – MU = 10 – TU = 45\n    •      4th slice – MU = 5 – TU = 50\n    •      5th slice – MU = 0 – TU = 50\n    •      6 th slice-MU=-5 – TU=45\n\n• TU and MU: When MU is positive, TU increases; when MU = 0, TU is maximum; when MU becomes negative,\nTU decreases."}, {"id": 40, "topic": "Demand & Consumer Behaviour", "question": "Which of the following best describes an Indifference Curve?", "options": {"A": "It shows combinations of two goods that give a consumer the same level of satisfaction", "B": "It shows combinations of two goods that give different levels of satisfaction", "C": "It shows the relationship between price and quantity demanded", "D": "It shows the maximum production combinations of two goods"}, "answer": "A", "explanation": "a consumer. The consumer is indifferent between these combinations because each provides equal satisfaction.\n\nExample:\n\n    •      Combination A – 2 Apples + 6 Bananas – 100 units of satisfaction\n    •      Combination B – 3 Apples + 4 Bananas – 100 units of satisfaction\n    •      Combination C – 4 Apples + 3 Bananas – 100 units of satisfaction\n\nAll these combinations provide the same satisfaction, so they lie on the same indifference curve. Indifference curves\nare generally downward sloping and convex to the origin."}, {"id": 41, "topic": "Demand & Consumer Behaviour", "question": "Which of the following best describes Consumer Equilibrium?", "options": {"A": "The point where a consumer spends all income without considering satisfaction", "B": "The point where the consumer obtains maximum possible satisfaction from a given income and given prices", "C": "The point where the price of a good becomes equal to its cost of production", "D": "The point where Total Utility becomes zero"}, "answer": "B", "explanation": "income, given the prices of goods. In the Indifference Curve approach, equilibrium occurs where the highest\nattainable Indifference Curve is tangent to the Budget Line.\n\nCondition:MRS = Pₓ/Pᵧ\n\n    •      MRS (Marginal Rate of Substitution) means the amount of Good Y a consumer is willing to sacrifice to\n           obtain one additional unit of Good X, while maintaining the same level of satisfaction.\n\nExample:Price of Apple (X) = ₹20; Price of Banana (Y) = ₹10\n\nPₓ / Pᵧ = 20/10 = 2\n\nTherefore, at consumer equilibrium:MRS = 2\n\n    •      This means the consumer is willing to give up 2 bananas to obtain 1 additional apple, while maintaining the\n           same satisfaction."}, {"id": 42, "topic": "Demand & Consumer Behaviour", "question": "Consider the following statements regarding the Law of Variable Proportions:\n\n1)Total Product (TP) is the total output produced, while Marginal Product (MP) is the additional output obtained by\nemploying one more unit of the variable factor.\n\n2)In the stage of diminishing returns, Total Product decreases and Marginal Product becomes negative.\n\nWhich of the above statements is/are correct?", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "A", "explanation": "other things remain constant, total output first increases rapidly, then increases slowly, and eventually may decrease.\n\n    •      Fixed Factor: A factor whose quantity cannot be changed in the short run.Eg Land, factory building,\n           machinery.\n    •      Variable Factor: A factor whose quantity can be changed in the short run.Eg: Labour, raw materials.\n    •      Total Product (TP): The total output produced by all units of the variable factor.Eg: 5 workers produce 60\n           units → TP = 60 units.\n\nThree Stages in Law of Variable Proportions\n\n    •      Stage 1 – Increasing Returns:TP increases at an increasing rate and MP generally rises.\n    •      Stage 2 – Diminishing Returns:TP continues to increase but at a decreasing rate and MP falls but remains\n           positive.This is the rational stage of production.\n    •      Stage 3 – Negative Returns:TP starts to decrease and MP becomes negative."}, {"id": 43, "topic": "Supply, Market Structures & Goods", "question": "Which of the following pairs are correctly matched?\n\n    1)     Fixed Cost – A cost that remains unchanged with the level of output in the short run.\n    2)     Variable Cost – A cost that changes with the level of output.\n    3)     Total Cost – The total cost incurred in producing a given level of output.\n    4)     Average Cost – The cost incurred per unit of output.\n\nWhich of the above pairs are correctly matched?", "options": {"A": "1, 2, 3 and 4", "B": "1, 2 and 3 only", "C": "2 and 4 only", "D": "1 and 4 only"}, "answer": "A", "explanation": "•      Fixed Cost (FC): Does not change with output in the short run. Eg: salary of permanent staff, Rent - Shop\n           rent remains the same whether you sell 10 items or 100 items.\n    •      Variable Cost (VC): Changes as the level of production changes. Example: Raw materials, electricity used\n           in production,wages of casual workers\n    •      Total Cost (TC): The complete cost of producing a given quantity of output. Formula: TC = FC + VC.Eg:\n           FC = ₹500 and VC = ₹1,000 → TC = ₹1,500.\n    •      Average Cost (AC): The cost incurred per unit of output. Formula: AC = TC ÷ Q. Q -Quantity . Eg: TC =\n           ₹1,500 and Q = 100 → AC = ₹15.\n    •      Average Variable Cost (AVC): The variable cost incurred per unit of output. Formula: AVC = VC ÷ Q. Eg:\n           VC = ₹600 and Q = 100 → AVC = ₹10."}, {"id": 44, "topic": "Supply, Market Structures & Goods", "question": "Which of the following correctly describes the Law of Supply?", "options": {"A": "As price increases, quantity supplied decreases.", "B": "As price increases, quantity supplied increases.", "C": "Price changes have no effect on quantity supplied.", "D": "As price decreases, quantity supplied increases."}, "answer": "B", "explanation": "relationship. When price increases, quantity supplied increases; when price decreases, quantity supplied decreases.\n\nPrice–Demand–Supply Relation:\n\nPrice ↑ – Demand ↓ and Supply ↑\n\nPrice ↓ – Demand ↑ and Supply ↓"}, {"id": 45, "topic": "Supply, Market Structures & Goods", "question": "What is Market Equilibrium?", "options": {"A": "The situation where quantity demanded is greater than quantity supplied", "B": "The situation where quantity supplied is greater than quantity demanded", "C": "The situation where quantity demanded equals quantity supplied at a particular price", "D": "The situation where the government fixes the market price"}, "answer": "C", "explanation": "price. This price is called the Equilibrium Price, and the corresponding quantity is called the Equilibrium Quantity."}, {"id": 46, "topic": "Supply, Market Structures & Goods", "question": "Match the following related to Market Structures:\n\n Market Structures                                          Definition/Meaning\n 1)Perfect Competition                                      A)Few sellers\n 2)Monopoly                                                 B)Many sellers with differentiated products\n 3) Monopolistic Competition                                C)One seller\n 4) Oligopoly                                               D)Many sellers with homogeneous products\nSelect the Code:", "options": {"A": "1-C, 2-D, 3-A, 4-B", "B": "1-D, 2-C, 3-B, 4-A", "C": "1-B, 2-A, 3-D, 4-C", "D": "1-A, 2-B, 3-C, 4-D"}, "answer": "B", "explanation": "Perfect Competition: A market structure with many buyers and sellers selling homogeneous (identical) products.\nIndividual firms are price takers and generally have free entry and exit.\n\n    •      Eg: Agricultural markets are commonly used as an approximation of perfect competition.\n\nMonopoly: A market structure in which there is only one seller supplying a product or service, with significant\nbarriers preventing new firms from entering. The monopolist has considerable control over price.\n\n    •      Eg: A sole electricity distributor in a particular service area.\n\nMonopolistic Competition: A market with many sellers offering differentiated products. Firms compete through\nquality, branding, advertising, design, and price.\n\n    •      Eg: Restaurants, clothing brands, and salons.\n\nOligopoly: A market dominated by a few large sellers. Each firm’s decisions can affect the other firms, so\ninterdependence is an important feature.\n\n    •      Eg: Automobile and telecom industries."}, {"id": 47, "topic": "Supply, Market Structures & Goods", "question": "Which of the following pairs are correctly matched regarding Consumer Goods and their Types?\n\n1)Single-use Goods – Goods that are consumed or used up in one use or within a short period.\n\n2)Durable-use Goods – Goods that can be used repeatedly for a long period.\n\n3)Luxury Goods – Goods that are not essential and are mainly purchased for comfort, prestige or a higher standard\nof living.\n\n4)Necessary Goods – Goods that are essential for satisfying basic human needs.", "options": {"A": "1 and 2 only", "B": "2 and 3 only", "C": "1, 2, 3 and 4", "D": "1, 3 and 4 only"}, "answer": "C", "explanation": "Classification 1\n\n    •      Single-use Goods: These goods are consumed or used up in one use or within a short period.Eg: Food,\n           milk, vegetables.\n    •      Durable-use Goods: These goods can be used repeatedly for a long period and provide services over\n           time.Eg: Television, refrigerator, car.\n\nClassification 2:\n\n    •      Luxury Goods: These goods are not essential for basic living and are generally purchased for comfort,\n           prestige or a higher standard of living.Eg: Luxury cars, expensive jewellery.\n    •      Comfortable goods:Thesegoods necessary for our day to day living.But these goods make life comfortable\n           and enhance our efficiency.Eg:Fan,Chair ,Table,\n    •      Necessary Goods: These are essential goods required to satisfy basic needs of life.Eg: Food, basic clothing\n           and shelter."}, {"id": 48, "topic": "Supply, Market Structures & Goods", "question": "Which of the following correctly describes the types of Producer Goods?", "options": {"A": "Single-use Producer Goods and Durable-use Producer Goods", "B": "Luxury Goods and Necessary Goods", "C": "Normal Goods and Inferior Goods", "D": "Substitute Goods and Complementary Goods"}, "answer": "A", "explanation": "•      Single-use Producer Goods: These goods are used up or consumed during the production process.Eg: Raw\n           materials, fuel, electricity.\n    •      Capital goods/Durable-use Producer Goods: These goods can be used repeatedly for a long period in\n           production.Eg: Machinery, tools, factory equipment."}, {"id": 49, "topic": "Supply, Market Structures & Goods", "question": "Which of the following correctly distinguishes Intermediate Goods and Final Goods?", "options": {"A": "Intermediate goods are used for final consumption, while final goods are used for further production.", "B": "Intermediate goods are used as inputs for further production, while final goods are ready for final use or\nconsumption.", "C": "Both intermediate and final goods are always used only by consumers.", "D": "Intermediate goods are always durable, while final goods are always non-durable."}, "answer": "B", "explanation": "generally used up or transformed during the production process.Eg: Steel used to manufacture a car.\n\n    •      Final Goods: These are goods that are ready for final use or consumption and are not intended for further\n           production. They are included in the calculation of national income.Eg: A car purchased by a household for\n           personal use."}, {"id": 50, "topic": "Supply, Market Structures & Goods", "question": "What is a Heavy Industry?", "options": {"A": "Industries that mainly produce consumer services", "B": "Industries that produce only agricultural goods", "C": "Industries that mainly use light raw materials and require very little capital", "D": "Industries that involve large-scale production, heavy machinery, large capital investment and bulky raw materials"}, "answer": "D", "explanation": "materials and generally operate on a large scale. Their products are often used as inputs by other industries.\n\n    •      Examples: Iron and steel, cement, heavy engineering, shipbuilding and machinery manufacturing."}, {"id": 51, "topic": "Supply, Market Structures & Goods", "question": "Match the following related to Sectors of Economy:\n\n Sectors of Economy                                           Economic Activities\n 1)Primary Sector                                             A)Knowledge and information-based activities\n 2) Secondary Sector                                          B)High-level decision-making and leadership\n 3)Territory Sector                                           C) Farming,Dairy ,Fishing\n 4)Quaternary Sector                                          D)Manufacturing and construction\n 5)Quinary Sector                                             E)Services\nSelect the Code:", "options": {"A": "1-C, 2-D, 3-E, 4-A, 5-B", "B": "1-D, 2-C, 3-E, 4-B, 5-A", "C": "1-E, 2-D, 3-C, 4-A, 5-B", "D": "1-C, 2-E, 3-D, 4-B, 5-A"}, "answer": "A", "explanation": "1.Primary Sector\n\n    •      The Primary Sector involves activities that directly use natural resources to produce goods.\n    •      Major activities:Agriculture, fishing, forestry, animal husbandry, mining.\n    •      Example: Growing rice, extracting coal.\n\n2. Secondary Sector\n\n    •      The Secondary Sector converts raw materials into finished or semi-finished goods. It also includes\n           construction activities.\n    •      Major activities:Manufacturing, processing, construction.\n    •      Example:Cotton → Textile factory → Cloth\n    •      Iron ore → Steel factory → Steel\n\n3. Tertiary Sector\n\nThe Tertiary Sector provides services to consumers and other sectors rather than producing physical goods.\n\nMajor activities:Trade, transport, banking, insurance, communication, education, healthcare, tourism, hotels.\n\na) Quaternary Sector:\n\n    •      The Quaternary Sector consists mainly of knowledge, information, research and technology-based\n           activities.\n    •      Major activities:IT, software development, data analysis, scientific research, R&D, consultancy.\n    •      Eg: A software company developing new technology.\n\nb)Quinary Sector\n\n    •      The Quinary Sector involves high-level decision-making, leadership and policy formulation.\n    •      Major activities:Policy making, senior administration, top-level management and strategic decision-\n           making.\n    •      Eg:Senior government officials, policy makers, top-level business executives."}, {"id": 52, "topic": "Economic Reforms 1991 (LPG)", "question": "What was the main feature of India’s Balance of Payments Crisis in 1991?", "options": {"A": "India had a large foreign exchange surplus", "B": "India faced a severe shortage of foreign exchange to meet its external payment obligations", "C": "India had a very large trade surplus", "D": "India had no external debt"}, "answer": "B", "explanation": "payment obligations, mainly because of insufficient foreign exchange.Eg: If a country needs foreign currency to pay\nfor imports but does not have enough foreign-exchange reserves, it may face a BoP crisis.\n\n    •      In 1991, India faced a severe BoP crisis. Foreign exchange reserves fell to a critically low level, making it\n           difficult to finance essential imports and meet external obligations.\n    •      Major factors: High fiscal deficit, rising external debt, weak external position, and the Gulf crisis, which\n           increased oil prices and affected foreign-exchange inflows.\n    •      Problems in the Existing Economic System: Excessive regulations, industrial licensing, limited competition\n           and restrictions on private and foreign investment affected economic efficiency."}, {"id": 53, "topic": "Economic Reforms 1991 (LPG)", "question": "Consider the following statements regarding Liberalisation, Privatisation and Globalisation (LPG Reforms):\n\n1)Liberalisation means reducing unnecessary government controls and restrictions on economic activities.\n\n2)Privatisation means increasing the role and participation of the private sector in economic activities.\n\n3)Globalisation means reducing India’s integration with the world economy and restricting foreign trade and\ninvestment.\n\nWhich of the above statements are correct?", "options": {"A": "1 only", "B": "1 and 2 only", "C": "1, 2 and 3", "D": "2 and 3 only"}, "answer": "B", "explanation": "requirements on economic activities. It aimed to provide greater freedom to businesses and increase competition.\nExample: Reduction of industrial licensing under the 1991 reforms.\n\nPrivatisation: It means increasing the role of the private sector and reducing the relative dominance of the public\nsector in economic activities. Example: Greater private participation in industries previously dominated by public\nenterprises.\n\nGlobalisation: It means increasing the integration of the Indian economy with the global economy through\ninternational trade, foreign investment, technology and global markets. Example: Greater inflow of Foreign Direct\nInvestment (FDI)."}, {"id": 54, "topic": "Economic Reforms 1991 (LPG)", "question": "Which of the following is a major feature of the Liberalisation Policy of 1991?", "options": {"A": "Abolition of industrial licensing, removal of restrictions, relaxation of MRTP restrictions, liberalisation of foreign\ninvestment and easier access to foreign technology", "B": "Increase in industrial licensing and stricter restrictions on private industries", "C": "Complete nationalisation of industries and prohibition of foreign investment", "D": "Increase in MRTP restrictions and complete restriction on foreign technology"}, "answer": "A", "explanation": "•      Abolition of Industrial Licensing: The New Industrial Policy, 1991 abolished industrial licensing for most\n           industries. Licensing continued for a limited list of industries because of security, strategic and\n           environmental concerns, including certain hazardous industries.\n    •      Removal of Restrictions: Various restrictions on the establishment, expansion and operation of private\n           industries were reduced. Firms received greater freedom to make production and investment decisions.\n    •      Relaxation of MRTP Restrictions: Restrictions under the MRTP Act (Monopolies and Restrictive Trade\n           Practices Act) were relaxed. Large companies were given greater freedom to expand and make investment\n           decisions. The MRTP Act was later replaced by the Competition Act, 2002, which came into effect in 2009.\n    •      Foreign Investment: India liberalised its policies to encourage Foreign Direct Investment (FDI). FDI up to\n           51% equity was permitted in high-priority industries, subject to the policy applicable at the time.\n           Procedures for attracting foreign investment were simplified.\n    •      Foreign Technology: Indian industries received greater freedom to enter into foreign technology\n           agreements. Automatic approval was provided in specified cases, particularly in high-priority industries.\n           Restrictions on hiring foreign technicians and experts and foreign testing of indigenously developed\n           technologies were also relaxed."}, {"id": 55, "topic": "Economic Reforms 1991 (LPG)", "question": "Which of the following correctly distinguishes the Public Sector and Private Sector?", "options": {"A": "Public Sector units are owned and controlled by private individuals, while Private Sector units are owned by the\ngovernment.", "B": "Public Sector units are owned or controlled by the government, while Private Sector units are owned and\ncontrolled by private individuals or organisations.", "C": "Both Public and Private Sector units are completely owned by the government.", "D": "Both Public and Private Sector units are completely owned by private individuals."}, "answer": "B", "explanation": "areas such as energy, mining, transport, banking and other important sectors. Examples: ONGC, NTPC and BHEL.\n\nPrivate Sector: Enterprises that are owned and controlled by private individuals or organisations. Profit-making and\nbusiness objectives generally play an important role. Examples: Tata Motors, Infosys and Reliance Industries.\n\nOwnership:Minimum 51%shares"}, {"id": 56, "topic": "Economic Reforms 1991 (LPG)", "question": "Which of the following are the major categories of Central Public Sector Enterprises (CPSEs)?", "options": {"A": "Maharatna, Navratna and Miniratna", "B": "Monopoly, Oligopoly and Perfect Competition", "C": "Public Goods, Private Goods and Merit Goods", "D": "Primary, Secondary and Tertiary Enterprises"}, "answer": "A", "explanation": "Government of India.\n\nMaharatna\n\n    •      Meaning: Highest category of autonomy among the Ratna classifications for eligible CPSEs. They are\n           generally large, financially strong and high-performing enterprises with greater financial and managerial\n           powers.\n    •      Examples: ONGC, NTPC, Indian Oil Corporation (IOCL), Coal India.\n\nNavratna\n\n    •      Meaning: High-performing CPSEs that receive substantial financial and managerial autonomy to take\n           investment and business decisions.\n    •      Examples: Bharat Electronics Limited (BEL), Engineers India Limited (EIL), Container Corporation of\n           India (CONCOR).\n\nMiniratna\n\n    •      Meaning: CPSEs that have made profit continuously for the prescribed period.And also net worth.It has\n           two categories — Category-I and Category-II.\n    •      Examples: Airports Authority of India (AAI), India Tourism Development Corporation (ITDC)."}, {"id": 57, "topic": "Economic Reforms 1991 (LPG)", "question": "Which of the following are important features of Privatisation under the 1991 Economic Reforms?\n\n1)Disinvestment of government shares in selected PSUs\n\n2)Greater participation of the private sector\n\n3) Opening of areas that were exclusively reserved for public sector.\n\n4)Complete nationalisation of private industries", "options": {"A": "1 and 2 only", "B": "1, 2 and 3 only", "C": "2, 3 and 4 only", "D": "1, 3 and 4 only"}, "answer": "B", "explanation": "process is called disinvestment.\n\n    •      Private Sector Participation – Correct: Private firms were allowed to enter more areas of economic activity,\n           increasing the role of the private sector.\n    •      Tansfer of Management to the Private sector through franchising,contractingand leasing.\n    •      Reduction in Public Sector Reservation:correct: The number of industries reserved exclusively for the\n           public sector was reduced, allowing greater participation of private firms.\n    •      Complete Nationalisation – Incorrect: Privatisation aims to increase the role of the private sector, not to\n           nationalise private industries."}, {"id": 58, "topic": "Economic Reforms 1991 (LPG)", "question": "Consider the following statements regarding Disinvestment and Strategic Disinvestment:\n\n1)Disinvestment involves the sale of a part of the government’s equity/shares in a Public Sector Enterprise, while the\ngovernment may continue to retain management control.\n\n2)Strategic Disinvestment involves the sale of a substantial part of government ownership along with the transfer of\nmanagement control to the buyer.", "options": {"A": "1 only", "B": "2 only", "C": "Both 1 and 2", "D": "Neither 1 nor 2"}, "answer": "C", "explanation": "continue to retain majority &management control.\n\n    •      It may be done through listing of the PSU on the stock market (Initial Public Offerings) or direct sale .\n\n    •      Disinvestment does not necessarily mean privatisation.\n    •      It helps the government raise resources and promotes private-sector participation and efficiency.\n\nStrategic Disinvestment is a specific form of disinvestment in which a substantial shares / stake(reduce in\nownership)of CPSE up to 50%or higher is sold along with the transfer of management control to the buyer.\n\n    •      It is a way of Privatisation.\n    •      For example, the sale of Air India to the Tata Group involved transfer of ownership and management\n           control"}, {"id": 59, "topic": "Economic Reforms 1991 (LPG)", "question": "Consider the following statements regarding Globalisation:\n\n1)Globalisation promotes greater integration of the Indian economy with the world economy through trade,\ninvestment and technology.\n\n2)Reduction in trade barriers and encouragement of Foreign Direct Investment (FDI) are important features of\nglobalisation.\n\n3)Globalisation seeks to reduce international trade and restrict MNCs into India.", "options": {"A": "1 only", "B": "2 only", "C": "1 and 2 only", "D": "1, 2 and 3"}, "answer": "C", "explanation": "•      Integration with the World Economy: India became more closely connected with the global economy\n           through international trade and investment.\n    •      Reduction in Trade Barriers: Restrictions such as import duties, quotas and other controls were reduced to\n           encourage international trade.\n    •      Liberalisation of Foreign Investment: Greater opportunities were provided for Foreign Direct Investment\n           (FDI) and foreign capital in various sectors.\n    •      Expansion of Foreign Trade: Greater emphasis was placed on increasing exports and imports, making\n           Indian businesses more connected to international markets.\n    •      Foreign Technology: Indian industries were given greater access to advanced foreign technology, technical\n           expertise and technology agreements.\n    •      Role of Multinational Corporations (MNCs): MNCs were encouraged to invest and operate in India,\n           bringing capital, technology, management skills and global market connections.\n    •      Global Competition: Indian companies faced increased competition from foreign companies, encouraging\n           them to improve quality, productivity and efficiency.\n\n    •      Integration of Financial Markets: Indian financial and capital markets became increasingly connected with\n           international financial markets.\n    •      Growth of Services: Globalisation contributed to the expansion of service sectors such as IT, software,\n           BPO, banking and telecommunications."}, {"id": 60, "topic": "Economic Reforms 1991 (LPG)", "question": "Which of the fo\n\n\n\n\n‘\n\nllowing correctly describes cooperative sector industries?", "options": {"A": "Owned and operated by central government agencies.", "B": "Operated solely for export purposes.", "C": "Owned by workers or suppliers sharing profits and losses.", "D": "Maintained by foreign companies with Indian partnerships."}, "answer": "C", "explanation": "producers or suppliers, who come together for a common economic interest. The members generally participate in\ndecision-making and share the benefits, profits and risks of the cooperative. A well-known example is Amul, which\nis based on a cooperative model of milk producers."}, {"id": 61, "topic": "Economic Reforms 1991 (LPG)", "question": "FDI is a part of which reform pillar?", "options": {"A": "Liberalisation", "B": "Privatisation", "C": "Globalisation", "D": "Nationalisation"}, "answer": "C", "explanation": "foreign companies or investors to invest in Indian businesses and industries."}, {"id": 62, "topic": "Economic Reforms 1991 (LPG)", "question": "Which sector suffered due to reduction in fertilizer subsidies post-1991?", "options": {"A": "Industrial", "B": "Banking", "C": "Agriculture", "D": "Service"}, "answer": "C", "explanation": "Lower subsidies increased the cost of fertilizers for farmers, which could raise the cost of agricultural production.\nThis created pressure on farmers and agricultural profitability, particularly for those dependent on chemical\nfertilizers."}, {"id": 63, "topic": "Economic Reforms 1991 (LPG)", "question": "The economic policy reforms of 1991 are popularly known as:", "options": {"A": "Five-Year Plan", "B": "New Fiscal Policy", "C": "New Economic Policy", "D": "Economic Reconstruction Plan\n\nAns:C\n\nExp:The economic reforms introduced in 1991 are popularly known as the New Economic Policy (NEP), 1991.\n\n\n\n\n\nQ64 What was the major short-term objective of the stabilization measures in the 1991 reforms?"}, "answer": "C", "explanation": "Q64 What was the major short-term objective of the stabilization measures in the 1991 reforms?\n\nA.Increase agricultural production\n\nB.Enhance social sector spending\n\nC.Control inflation and restore balance of payments\n\nD.Privatise public sector units\n\nAns:C\n\nExp:The major short-term objective of the stabilization measures during the 1991 economic reforms was to restore\nmacroeconomic stability. These measures focused on controlling inflation, reducing fiscal and external imbalances,\nand correcting the Balance of Payments (BoP) crisis. Measures such as fiscal adjustment, monetary tightening and\nexchange-rate adjustment were used to stabilize the economy. Privatisation and structural reforms were longer-term\ncomponents of the reform programme."}, {"id": 64, "topic": "Economic Reforms 1991 (LPG)", "question": "What is the role of WTO with respect to globalization?", "options": {"A": "Provide military support", "B": "Monitor human rights violations", "C": "Ensure fair trade rules among nations", "D": "Control migration policies"}, "answer": "C", "explanation": "administering rules for international trade among its member countries.\n\nUnder the WTO Agreement on Agriculture (AoA), agricultural subsidies are mainly divided into 3 boxes:\n\n 1. Green Box:These subsidies do not or hardly affect trade and production.WTO allows them without any reduction\nlimit.They are mainly for general agricultural development and farmer support.\n\n    •      Eg: Agricultural research, farmer training, infrastructure, environmental protection, disaster relief.\n\n2. Amber Box:These subsidies directly affect production and prices.They can distort international trade.WTO\nrequires countries to reduce these subsidies according to their commitments.They are measured through AMS\n(Aggregate Measurement of Support)-It measures the total amount of trade-distorting agricultural support provided\nby a government to farmers.\n\n    •      Eg: Price support and production-linked subsidies.\n\n 3. Blue Box:These are production-distorting subsidies, but they are given along with programmes that limit\nproduction.They are generally exempt from reduction commitments under WTO rules.\n\n    •      Example: Payments to farmers with a condition to keep production within a specified limit."}, {"id": 65, "topic": "Economic Reforms 1991 (LPG)", "question": "Which international organizations played a crucial role in triggering the 1991 economic reforms in India?", "options": {"A": "UN and WHO", "B": "World Bank and IMF", "C": "WTO and UNESCO", "D": "ADB and WTO"}, "answer": "B", "explanation": "economic crisis. India faced a severe Balance of Payments (BoP) crisis and shortage of foreign exchange, leading it\nto seek external financial assistance. The IMF provided support through a stabilization programme, while the World\nBank supported structural adjustment and economic reforms. These external assistance programmes were closely\nassociated with the reforms introduced in 1991."}, {"id": 66, "topic": "Economic Reforms 1991 (LPG)", "question": "Economic liberalisation mainly affects which sector?", "options": {"A": "Primary and Tertiary", "B": "Primary and Secondary", "C": "Secondary and Tertiary", "D": "Primary, Secondary and Tertiary"}, "answer": "D", "explanation": "reduces unnecessary government controls and restrictions, allowing greater freedom for economic activities. In the\nPrimary sector, it can influence agriculture and related activities; in the Secondary sector, it promotes industrial\ncompetition and private investment; and in the Tertiary sector, it encourages private participation, foreign investment\nand expansion of services. Thus, liberalisation is economy-wide rather than limited to one particular sector."}, {"id": 67, "topic": "Economic Reforms 1991 (LPG)", "question": "Which type of sale al
